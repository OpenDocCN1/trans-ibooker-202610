- "# 第4章 使用 Cloud Dataflow 构建应用数据管道\n\n## 早期发布读者的说明\n\n使用 Early Release 电子书，您可以在这些书籍正式发布之前就获得书籍的最早形式——作者在写作时的原始未编辑内容——从而能够在这些技术正式发布之前就利用它们。\n\
  \n这将是最终书籍的第4章。请注意，GitHub 仓库将在稍后激活。\n\n如果您对如何改进本书的内容和/或示例有任何意见，或者如果您注意到本章中缺少材料，请联系编辑\
  \ mcronin@oreilly.com。\n\n在本章中，您将了解 Cloud Dataflow，它在框架内用作完全托管的数据处理管道。在第5章中，您将部署云原生应用的第二部分，即在\
  \ Cloud Dataflow 上运行的管道。供参考，您目前处于框架的流程阶段，您将在此阶段将 Google Cloud 服务组合起来将音频文件转换为文本、丰富它们，并开始使用\
  \ Cloud Dataflow 将数据流式传输到 BigQuery（见图4-1）。\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_112_0.png)\n\
  \n图4-1. 语音分析框架\n\n## Cloud Dataflow 概述\n\nCloud Dataflow 是用于运行 Apache Beam 管道的完全托管服务，可让您执行各种数据处理任务。Dataflow\
  \ 可以从不同来源移动数据：它可以转换数据，并且可以实时执行诸如\n\n检测异常之类的数据任务。在框架内，Dataflow 将从 Pub/Sub 读取数据，调用\
  \ Speech-to-Text 和 Natural Language API，丰富数据，最后将其写入 BigQuery。Google 于2016年将 Google\
  \ Cloud Dataflow SDK 捐赠给 Apache 软件基金会，其他组织贡献了运行器和 IO 以将 Beam 运行器与现有数据库集成，这使得该项目在功能和社区支持方面不断发展。\n\
  \nApache Beam 是一个编程模型，用于定义和执行定义的管道。管道可以是批处理和流式处理，它们对不同的运行器公开如下：\n\n- Google Cloud\
  \ Dataflow\n- Apache Spark\n- Apache Flink\n- Apache Apex\n- DirectRunner（用于测试的本地运行器）\n\
  \n其思想是相同的管道可以在不同的运行器上执行，从而允许对使用哪个运行器进行概率和选择。对于框架，您将使用 Google Cloud Dataflow 运行器。选择\
  \ Cloud Dataflow 作为运行器可以让您专注于管道，并允许 Cloud Dataflow 按需管理资源并自动扩展以实现最小延迟和高资源利用率。在 Google\
  \ Cloud 上运行管道时，运行器会将可执行代码和依赖项上传到 Cloud Storage，然后创建一个执行管道的 Dataflow 作业。您可以通过编程方式设置运行器，或使用命令行指定它。以下示例显示了如何通过以编程方式将运行器设置为\
  \ Dataflow 来构建管道。\n\n```\noptions = PipelineOptions(\n    flags=argv,\n    runner='DataflowRunner',\n\
  \    project='my-project-id',\n    job_name='unique-job-name',\n```\n\n```\ntemp_location='gs://my-bucket/temp',\n\
  region='us-central1')\n```\n\n要将管道在 Apache Spark 上执行，您只需将运行器更改为 SparkRunner，以下代码是设置管道运行器为\
  \ Apache Spark 的示例。\n\n```\noptions = PipelineOptions(\n    flags=argv,\n    runner='SparkRunner',\n\
  \    project='my-project-id',\n    job_name='unique-job-name',\n    temp_location='gs://my-bucket/temp',\n\
  \    region='us-central1')\n```\n\n选择 Apache Beam 并以 Cloud Dataflow 作为运行器可以让您专注于管道以及所需的任何转换，而不是支持基础设施和管道。\n\
  \n## Apache Beam 概念\n\n在本节中，您将进一步阅读 Apache Beam 概念，这将使您能够理解设计和构建数据处理管道所需的各个组件。\n\
  \n### 管道\n\n管道定义了运行器将在您的数据上执行的步骤。简单来说，管道是输入数据、数据上的转换以及数据输出的表示。\n\n图4-2 是管道的简单表示。\n\
  \n![](img/eac8762c24ec77948aa0c3277f8e6eb3_114_0.png)\n\n*图4-2. 简单的管道表示*\n\n图4-3\
  \ 是您将使用 Dataflow 作为运行器部署的框架管道的示例。\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_115_0.png)\n\
  \n图4-3. 框架管道\n\n以下示例代码显示了管道如何读取和写入用于运行作业的参数中定义的相关文件。\n\n```\nwith beam.Pipeline(argv=beam_args)\
  \ as pipeline:\n    lines = pipeline | 'Read files' >>\nbeam.io.ReadFromText(args.input)\n\
  \    lines | 'Write files' >>\nbeam.io.WriteToText(args.output)\n```\n\n您可以按如下方式为上述管道传递运行作业的参数：\n\
  \n```\npython3 dataflow.py --input [FILE_NAME] --output [FILE_NAME] --runner DataFlowRunner\
  \ --project [PROJECT_ID] --temp_location gs://[BUCKET]/temp --staging_location gs://[BUCKET]/stag\
  \ --region us-central1 --job_name myjob\n```\n\n### PCollection\n\nPCollection 定义了管道将操作的数据。数据可以来自固定源，如文件，也可以来自持续更新的源，如\
  \ Cloud Pub/Sub。在框架中，数据将来自 Cloud Pub/Sub 的持续更新源，是无界的。它将通过从 Cloud Pub/Sub 读取数据创建初始\
  \ PCollection，并且从那里它将为管道中的每个步骤创建 PCollection 输出以将数据写入 BigQuery。\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_116_0.png)\n\
  \n图4-4. Apache Beam 管道\n\n### 转换\n\n转换是您定义并在数据上执行的功能。您定义的功能将在数据的每个元素上执行您定义的操作并产生一个或多个\
  \ PCollection 作为输出。您的功能可以对您的数据执行几乎任何操作，包括使用外部库的能力。作为示例：在此框架中，您正在丰富数据以收集用户说话时间的指标，您还使用数据丢失防护库在将元素发送到下一个转换之前从元素中删除\
  \ PII 数据。但如果您还想从原始音频文件中删除 PII 语音段，您可以使用转换并使用您定义的功能导入 ffmpeg 包，这将允许您静音找到的 PII 信息。转换的输出元素可以是丰富数据的连续流，并且还可以将删除后的数据写入\
  \ Google Cloud Storage。\n\n您正在使用的框架执行以下转换：\n\n1. 从 Cloud Pub/Sub 读取消息\n\n```\ndecode_messages\
  \ = messages | 'DecodePubSubMessages'\n>> beam.Map(lambda x: x.decode('utf-8'))\n\
  ```\n2. 使用异步语音识别从 Speech-To-Text API 检索长音频文件的数据\n\n```\nstt_output = decode_messages\
  \ | 'SpeechToTextOutput'\n>> beam.Map(stt_output_response)\n```\n3. 解析并丰富 Speech-To-Text\
  \ API 数据\n\n```\nparse_stt_output = stt_output | 'ParseSpeechToText'\n>> beam.Map(stt_parse_response)\n\
  ```\n4. 从 Natural Language API 获取 ParseSpeechToText 转换中元素的情感和实体响应\n\n```\nstt_nlp_output\
  \ = parse_stt_output |\n'NaturalLanguageOutput' >> beam.Map(get_nlp_output)\n```\n\
  5. 如果管道参数的执行包含 dlp=true，则处理来自 NaturalLanguageOutput 转换的元素以\n\n### 使用 Google Cloud\
  \ DLP API 进行删除\n\n```\ndlp_output = stt_nlp_output | 'RedactTextOptional'\n>> beam.Map(lambda\
  \ j: redact_text(j, project_id))\n```\n\n框架还使用更高级别的 Map 转换，如下面的代码片段所示，图4-5 表示 Dataflow\
  \ 界面中的可视化转换，图4-6 和 4-7 表示转换的输入和输出元素。\n\n```\n### function to redact sensitive data\
  \ if dlp key value is set to true\ndef redact_text(data, project):\n    info_types\
  \ = []\n    deidentify_config = {\n        \"info_type_transformations\": {\n  \
  \          \"transformations\": [\n                {\n                    \"primitive_transformation\"\
  : {\n                        \"replace_config\": {\n                           \
  \ \"new_value\": {\n                                \"string_value\": '#',\n   \
  \                         }\n                        }\n                    }\n\
  \                }\n            ]\n        }\n    }\n    if data['dlp'] == 'true'\
  \ or data['dlp'] == 'True':\n        dlp = google.cloud.dlp_v2.DlpServiceClient()\n\
  \        parent = dlp.project_path(project)\n        response = dlp.list_info_types('en-US')\n\
  \        for info_type in response.info_types:\n            info_types.append({'name':\
  \ info_type.name})\n        inspect_config = { \"info_types\": info_types}\n   \
  \     item = {\"value\": data['transcript']}\n        response = dlp.deidentify_content(\n\
  \            parent,\n            inspect_config=inspect_config,\n            deidentify_config=deidentify_config,\n\
  \n\n```\nitem=item,\n)\ndata['transcript'] = response.item.value\nfor words_element\
  \ in data['words']:\n    item = {\"value\": words_element['word']}\n    response\
  \ = dlp.deidentify_content(\n        parent,\n        inspect_config=inspect_config,\n\
  \        deidentify_config=deidentify_config,\n        item=item,\n    )\n    words_element['word']\
  \ = response.item.value\nfor entities_element in data['entities']:\n    item = {\"\
  value\": entities_element['name']}\n    response = dlp.deidentify_content(\n   \
  \     parent,\n        inspect_config=inspect_config,\n        deidentify_config=deidentify_config,\n\
  \        item=item,\n    )\n    entities_element['name'] = response.item.value\n\
  for sentences_element in data['sentences']:\n    item = {\"value\": sentences_element['sentence']}\n\
  \    response = dlp.deidentify_content(\n        parent,\n        inspect_config=inspect_config,\n\
  \        deidentify_config=deidentify_config,\n        item=item,\n    )\n    sentences_element['sentence']\
  \ = response.item.value\n    return data\ndlp_output = stt_nlp_output | 'RedactTextOptional'\
  \ >> beam.Map(lambda j: redact_text(j, project_id))\n```\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_119_0.png)\n\
  \nFigure 4-5. Cloud Dataflow RedactTextOptional Transform\n\n## Input collections\n\
  \nThroughput (elements/sec)\n\n1.0/s\n0.8/s\n0.6/s\n0.4/s\n0.2/s\n0\n\n3 PM\n4 PM\n\
  5 PM\n6 PM\n7 PM\n\nNaturalLanguageOutput.out0: 0\n\nNaturalLanguageOutput.out0\n\
  \n| Elements added (Approximate) | 26 |\n| Estimated size | 3.17 MB |\n\nFigure\
  \ 4-6. Input Elements of the RedactTextOptional Transform\n\n## Output collections\n\
  \n![](img/eac8762c24ec77948aa0c3277f8e6eb3_121_0.png)\n\nRedactTextOptional.out0\n\
  \n| Elements added (Approximate) | 26 |\n| Estimated size | 3.17 MB |\n\nFigure\
  \ 4-7. Elements of the RedactTextOptional Transform\n\n## ParDo\n\nA ParDo is an\
  \ Apache Beam transform operation. As outlined in the Transforms section, it performs\
  \ a user defined operation on a collection of elements. The output of a ParDo can\
  \ be a single element or many elements, however, it does not output a single output\
  \ per input element. In the framework you need to produce a single element per input\
  \ element since you need to collect metrics per element. An element in the framework\
  \ is the metadata plus the\n\nenriched data of the audio file. If you needed to\
  \ perform a function on your elements, say split the words in the transcript into\
  \ a list, a ParDo would be a great option to perform this operation. Since the Framework\
  \ needs to collect an element per input element a beam.Map transform would work\
  \ best. Since a beam.Map produces a single output for each element inputted.\n\n\
  ## Map\n\nA Map is another transform operation available in Apache Beam. In the\
  \ Framework you will be using the beam.Map as you will be performing a one-to-one\
  \ mapping, and for every audio file you will produce enriched elements with the\
  \ Machine Learning APIs. Below is an example of using the beam.Map within the Framework.\
  \ In this code snippet the pipeline first runs the `stt_output_response` function\
  \ which is a user defined function that extracts the data from the Speech-to-Text\
  \ API and returns the elements to the next step in the pipeline called `ParseSpeechToText`.\
  \ Figure 4-5 is the visual representation of the code snippet below in the Dataflow\
  \ console.\n\n```\n### function to get STT data from long audio file using asynchronous\
  \ speech recognitiondef\nstt_output_response(data):\n    from oauth2client.client\
  \ import GoogleCredentials\n    from googleapiclient import discovery\n    credentials\
  \ =\nGoogleCredentials.get_application_default()\n    pub_sub_data = json.loads(data)\n\
  \    speech_service = discovery.build('speech',\n'v1p1beta1', credentials=credentials)\n\
  \    get_operation =\nspeech_service.operations().get(name=pub_sub_data['sttname\
  \ id'])\n    response = get_operation.execute()\n    # handle polling of STT\n \
  \   if pub_sub_data['duration'] != 'NA':\n        sleep_duration =\nround(int(float(pub_sub_data['duration']))\
  \ / 2)\n    else:\n```\n\n```\nsleep_duration = 5\nlogging.info('Sleeping for: %s',\
  \ sleep_duration)\ntime.sleep(sleep_duration)\nretry_count = 10\nwhile retry_count\
  \ > 0 and not response.get('done', False):\n    retry_count -= 1\n    time.sleep(120)\n\
  \    response = get_operation.execute()\n### return response to include STT data\
  \ and agent search word\nresponse_list = [response,\n    pub_sub_data['fileid'],\n\
  \    pub_sub_data['dlp'],\n    pub_sub_data['filename'],\n    pub_sub_data['callid'],\n\
  \    pub_sub_data['date'],\n    pub_sub_data['year'],\n    pub_sub_data['month'],\n\
  \    pub_sub_data['day'],\n    pub_sub_data['starttime'],\n    pub_sub_data['duration'],\n\
  \    pub_sub_data['stereo']\n]\nreturn response_list\nstt_output = decode_messages\
  \ | 'SpeechToTextOutput' >> beam.Map(stt_output_response)\nparse_stt_output = stt_output\
  \ | 'ParseSpeechToText' >> beam.Map(stt_parse_response)\n```\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_123_0.png)\n\
  \nFigure 4-8. Dataflow Pipeline\n\n## Pipeline I/O\n\nApache Beam I/O connectors\
  \ let you read/write data into your pipeline and write output data. As an example,\
  \ the Framework you are working with has a source of Cloud Pub/Sub and a sink of\
  \ BigQuery. You can also write a custom I/O connector when connectors are not available\
  \ for your data source or sink.\n\nThe code snippet below is an example of using\
  \ the Cloud Pub/Sub I/O connector as a source that is currently only supported in\
  \ streaming.\n\n```\nbeam.io.ReadFromPubSub(subscription=known_args.input_subscription).with_output_types(bytes)\n\
  ```\n\nThe code snippet below is an example of using the BigQuery I/O connector\
  \ as a sink.\n\n```\ndlp_output | 'WriteToBigQuery' >> beam.io.WriteToBigQuery(\n\
  known_args.output_bigquery,\nschema=bigquery_table_schema,\ncreate_disposition=beam.io.BigQueryDisposition.CREATE_IF_NEEDED,\n\
  \nwrite_disposition=beam.io.BigQueryDisposition.WRITE_APPEND\n)\n```\n\nTo view\
  \ the list of available Built-in I/O transforms visit the Apache Beam website at\
  \ https://beam.apache.org/documentation/io/built-in\n\n## Aggregation\n\nAggregation\
  \ is an operation that is performed on many elements to produce some grouped value\
  \ from those respective elements. As an example: You need a way to count the unique\
  \ elements of a PCollection. You can use the beam.combiners.Count.PerElement() that\
  \ will count the unique values of the elements in the PCollection.\n\nIn the code\
  \ snippet below, a pipeline is created with a PCollection. Then, the elements are\
  \ counter per unique value:\n\n```\nimport apache_beam as beam\nwith beam.Pipeline()\
  \ as pipeline:\n    total_unique_elements = (\n        pipeline\n        | 'Create\
  \ produce' >> beam.Create(\n            ['audio_file_1', 'audio_file_2', 'audio_file_3',\n\
  \             'audio_file_1', 'audio_file_4', 'audio_file_2',\n             'audio_file_2',\
  \ 'audio_file2', 'audio_file_5',\n             'audio_file_3'])\n        | 'Count\
  \ unique elements' >>\nbeam.combiners.Count.PerElement()\n        | beam.Map(print))\n\
  ```\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_125_0.png)\n\nFigure 4-9. Output\
  \ of running unique count with Apache Beam aggregation\n\nApache Beam provides the\
  \ following aggregation methods:\n\n- 1. CoGroupByKey\n- 2. CombineGlobally\n- 3.\
  \ CombinePerKey\n- 4. CombineValues\n- 5. Count\n- 6. Distinct\n- 7. GroupByKey\n\
  - 8. GroupBy\n- 9. GroupIntoBatches\n- 10. Latest\n- 11. Max\n- 12. Min\n- 13. Mean\n\
  - 14. Sample\n- 15. Sum\n- 16. Top\n\n## Runner\n\nRunners are the software that\
  \ accepts a pipeline and executes it. Apache runners or execution engines include:\n\
  \n- Google Cloud Dataflow\n- Apache Spark\n- Apache Flink\n- Apache Apex\n- A local\
  \ runner for testing, DirectRunner\n\n## Event Time\n\nThe event time is a timestamp\
  \ specified by the Pub/Sub publisher application as an attribute of a Pub/Sub message,\
  \ rather than the publish_time field set on a message by the Pub/Sub service itself.\
  \ If the timestamp attribute is not specified at publish time the default timestamp\
  \ that is used is the `publishTime` set on the Pub/Sub message by Cloud Pub/Sub.\n\
  \n## Windowing\n\nWhen working with bounded datasets that have the same key within\
  \ the data set you can use features such as GroupByKey. However, when working with\
  \ unbounded data sets it’s impossible to group all the elements since new elements\
  \ are constantly being added. Windowing enables you to group operations over the\
  \ unbounded data set by dividing the data set into windows of finite collections\
  \ according to their timestamps of the individual elements. You set the following\
  \ windows with the Apache Beam SDK or Dataflow SQL streaming extensions:\n\n- Tumbling\
  \ windows (called fixed windows in Apache Beam)\n- Hopping windows (called sliding\
  \ windows in Apache Beam)\n- Session windows\n\n## Tumbling Windows\n\nA tumbling\
  \ window represents a fixed interval duration in the data stream which is uniform\
  \ across all keys. For example, if you set a sixty-second tumbling window, the elements\
  \ with timestamp values [0:00:10-0:00:00] are in the first window. Elements with\
  \ timestamp values [0:1:00-0:01:00] are in the second window. Figure 4-10 illustrates\
  \ how elements are divided by tumbling windows.\n\n\n\n\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_128_0.png)\n\
  \nFigure 4-10. Tumbling Windows called fixed windows in Apache Beam\n\n## Hopping\
  \ Windows\n\nA hopping window has a fixed duration which sets the time interval\
  \ for when you want to capture data. You define the time interval to capture the\
  \ data and the period you want to start. As an example, you can have a one-minute\
  \ window and a thirty-second period. Which means it will capture one minute worth\
  \ of data every thirty seconds.\n\nFigure 4-11 illustrates how elements are divided\
  \ by hopping windows.\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_129_0.png)\n\n\
  Figure 4-11. Hopping Windows called sliding windows in Apache Beam\n\n## Session\
  \ Windows\n\nSession windows are data dependent windows, but they are not known\
  \ ahead of time. Session windows will contain gaps of durations from other elements,\
  \ for example; You collect metrics for IoT devices. These devices emit data events\
  \ every second when they are in use. You need to understand and aggregate the utilization\
  \ of the device’s data based on when they are in use. Since you don’t know ahead\
  \ of time how long the devices are being used for something hoping for windows where\
  \ you know the fixed duration would not work. You will still need a way of determining\
  \ utilization. Session windows allow you to set the gap duration between events\
  \ that can be aggregated into a session window. As an example in Figure 4-11, you\
  \ set the minimum gap duration to one minute which is the threshold value of inactivity\
  \ for a device, if data events arrive after the set gap duration the event data\
  \ will be assigned to a new session window. If the data arrives within the gap duration\
  \ then it will be assigned to the same session window. Using session windows with\
  \ a minimum gap duration allows you to aggregate the utilization metrics of the\
  \ IoT devices.\n\nFigure 4-12 visualizes how elements are divided into session windows.\n\
  \n![](img/eac8762c24ec77948aa0c3277f8e6eb3_130_0.png)\n\nFigure 4-12. Session Windows\n\
  \n## Dataflow Tumbling Window Example\n\nIn this example, you will build a Dataflow\

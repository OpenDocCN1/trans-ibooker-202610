  \n对于框架的最后一个组件，我们需要实现授权以允许我们认为合适的人访问应用程序。牢记授权只是安全的一个组件；我们还必须考虑加密和保护敏感数据等事项。现在，让我们专注于身份验证。Google\
  \ Cloud 提供了一项名为 Identity-Aware Proxy（IAP）的服务。IAP 通过验证用户的身份和请求的上下文来允许或拒绝对应用程序的访问。我喜欢把它想象成由\
  \ Google Cloud 管理的代理，位于我们的应用程序前面，拦截请求并代表我们授权用户。\n\n为什么 IAP 是革命性的？IAP 使开发人员无需构建后端身份验证系统，从而使开发人员能够专注于应用程序的核心功能。基本上\
  \ IAP 允许我们更快地进入市场。我们的应用程序将没有任何授权代码，对的，没有用于授权用户的代码。意味着没有来自第三方用于验证令牌的 SDK 或获取和验证 JSON\
  \ Web Token 的任何其他复杂代码。我们所有的\n\n应用程序将做的只是专注于其核心角色，即为我们转录和丰富过的音频文件向用户提供洞察。\n\nIAP\
  \ 还支持多种提供商类型：\n\n- Email and password\n- OAuth（例如 Google、Facebook、Twitter 等）\n-\
  \ SAML\n- OIDC\n- Phone number\n- Custom\n- Anonymous\n\n我们可以在更快进入市场的同时保护应用程序，提供广泛的身份验证提供商，并通过不需要\
  \ VPN 客户端来访问应用程序来简化用户访问。\n\n## Cloud Native Checkpoint\n\n现在你对用例和我们将用于满足用例要求的框架有了全面的了解，让我们重新审视我们为云原生架构列出的考虑因素：\n\
  \n- 1. 我们的应用程序需要从云基础设施中抽象出来。\n- 2. 我们需要一种持续集成和持续交付的方法。\n- 3. 我们的应用程序必须能够根据需要扩展和缩减。\n\
  - 4. 我们的应用程序将如何管理故障？\n- 5. 应用程序需要全球可访问。\n- 6. 我们的框架需要基于微服务架构。\n- 7. 我们的应用程序将如何得到保护？\n\
  \n### 从云基础设施中抽象出来\n\n从云基础设施中抽象出来可能是一个具有误导性的术语。当我第一次开始学习云原生框架时，我总是认为这是一种云无关的方法：构建一个应用程序并部署到任何云提供商。然而，从云基础设施中抽象出来是应用程序与底层基础设施的解耦。但如果解耦了，我们是否不能在任何云提供商甚至本地运行它？这就是云原生可以被个人不同解读的地方。我们构建云原生应用程序是为了按需配置资源、自动化应用程序生命周期、以及可扩展和安全。然而，始终存在对云提供商及其构建云原生应用程序的核心要求的依赖。我们在构建云原生应用程序时需要考虑这些，我们将在本书中贯穿始终。但请记住，本书是关于在\
  \ Google Cloud 上运行云原生应用程序的，对于这一点，我们将尽可能专注于使用其服务构建可扩展和安全的应用程序。\n\n### 持续集成和持续交付\n\
  \n云原生应用程序的核心组件之一是持续集成（CI）和持续交付（CD）架构。在我们的框架中，我们将使用 GitLab CI/CD 服务来创建我们的部署管道。我们已为此服务跳出了\
  \ Google Cloud，但我们仍然在云原生应用程序框架内。我们仍然满足拥有管道来构建、测试和验证新代码的核心要求，然后在将更改合并到你的 GitLab 仓库之前，以及确保我们的\n\
  \n\n\n经过验证的代码在 CI 流水线成功通过所有测试后会有一个应用部署流水线。\n\n### CI Pipeline\n\nCode\n\nCommit\n\
  \nBuild\n\nTest\n\n### CD Pipeline\n\nReview\n\nStage\n\nProduction\n\nFigure 1-8.\
  \ CI/CD Pipeline\n\n### Scalability\n\n应用的另一个核心组件是能够扩展和缩减。我们通过微服务来实现这一点，其中应用的状态存储在容器外部。这允许实例根据需要启动和停止。这也允许每个实例独立工作，其中每个实例可以处理请求。\n\
  \n> NOTE\n> 如果你想了解更多关于云原生计算或参与社区，请访问 Cloud Native Computing Foundation (CNCF) 网站\
  \ https://www.cncf.io/。\n\n这听起来很棒——创建无状态的微服务，可以来去自由并且可以相互独立地处理请求。缺点是这种方法的管理。如何管理这些服务、保护它们、为其状态设置声明性语句，并编排此工作流？Kubernetes（k8s）满足了这一需求。Kubernetes\
  \ 是一个开源容器编排应用，用于管理部署、扩展、安全以及更多内容。以下是 Kubernetes 的一些关键特性：\n\n- 1. 水平扩展\n- 2. 自愈\n\
  - 3. 自动化发布和回滚\n- 4. 服务发现和负载均衡\n- 5. 密钥和配置管理\n\nKubernetes 是一个开源项目，最初由 Google 开发，并在\
  \ 2014 年作为开源发布。我要说 Kubernetes 最初很难理解，当我第一次学习它并听到诸如 pod 之类的术语时，我差点要尖叫了。然而，Google\
  \ Cloud 为我们提供了另一个解决方案：Google Cloud\n\n推出了 Google Kubernetes Engine，它抽象了管理 Kubernetes\
  \ 集群的大部分复杂性。它提供 Kubernetes 作为托管服务，无需安装集群软件，无需担心确认监控，基本上由创建 Kubernetes 的公司提供完全托管的集群。\n\
  \n我将在未来的章节中更详细地介绍 Google Kubernetes Engine。但现在，值得介绍一些高层概念，因为这将让你理解为什么 Kubernetes\
  \ Engine 与云原生应用非常契合。\n\n## Application Reliability\n\n即使 Google Cloud 提供了服务等级协议（SLAs）并且有机制来提供可靠性，事情也会失败。我们需要考虑我们的应用在这些情况下如何处理故障。在可扩展性部分，我简要提到了\
  \ Kubernetes，它本身就能提供某种形式的容错，因为我们的集群至少会有三个节点。但如果 Google Cloud 区域发生故障，我们的集群也会失败。许多\
  \ Google Cloud 服务可应对区域故障，如 BigQuery，其他则不行。我们必须注意每个服务及其各自的容错功能。\n\n我们无法在一节中涵盖所有组件，但每一章都将有一个云原生检查点部分，以确保我们解决云原生框架，其中包括应用可靠性。除了区域或区域级的大规模故障外，我们在构建云原生应用时还必须考虑潜在的故障来源，如代码中的错误、人为错误等。\n\
  \n了解 Google Cloud 区域和区域也很有帮助，以便开始思考如何管理这些故障。\n\n#### Google Cloud Zone\n\n区域之间具有高带宽和低延迟。区域是区域内的一个隔离位置\n\
  \n区域应被视为区域内的单个故障域\n\n#### Google Cloud Region\n\n区域是区域的集合。建议跨区域部署应用以实现高可用性\n\n区域是独立的地理位置\n\
  \n区域内的往返网络延迟通常在 95 百分位下低于 <1ms\n\n#### Zonal Resources\n\n区域资源在单个区域内运行\n\n如果 Google\
  \ Cloud 区域变得不可用，则该区域内的所有区域资源都不可用\n\n#### Regional Resources\n\n区域资源在区域内的所有区域中冗余部署某些\
  \ Google Cloud 服务如 App Engine 属于区域资源\n\n#### Multiregional Resources\n\nGoogle Cloud\
  \ 提供的少数托管服务分布在多个区域中。以下服务具有多区域部署选项：\n\n- Datastore\n- Cloud Key Management Service\n\
  - Cloud Storage\n- BigQuery\n- Cloud Spanner\n- Cloud Bigtable\n- Cloud Healthcare\
  \ API\n\n要构建能够承受区域故障的应用，请使用区域资源，或在区域间构建应用的弹性。要构建能够承受整个区域丢失的应用，请使用多区域资源，或为应用构建弹性。\n\
  \n### Globally Accessible\n\n我们没有在框架中介绍这一点，但我们的应用需要全球可访问，因为我们将有来自不同全球区域的用户使用平台。我们需要用户尽可能靠近其位置进入\
  \ Google Cloud 并访问最接近其全球区域的应用。我们很幸运，Google Cloud 为我们提供了一个具有全球 IP 地址的负载均衡托管服务。如 Google\
  \ 网站所述“*全球自动扩展和负载均衡*”。\n\nTokyo\n\nNew York\n\nLondon\n\nGoogle Cloud Load Balancer\n\
  \nKubernetes Engine\n\nKubernetes Engine\n\nKubernetes Engine\n\nRegion\nasia-east1\n\
  \nRegion\nus-central1\n\nRegion\neurope-west1\n\nk8s pod\n\nFigure 1-9. Global Cloud\
  \ Load Balancing\n\n### Security\n\n我们已在高层介绍了安全 IAP，它允许我们对用户进行身份验证和授权。这是我们在设计云原生应用时需要考虑的一个要素。其他需要考虑的要素有：\n\
  \n- 1. 密钥管理\n- 2. 审计日志\n- 3. 身份访问管理\n\n我们框架的每个组件都需要考虑这些关键要素，因为每个组件可能提供不同的保护方法。你还应注意，安全问题需要一本专门的书籍。虽然我在本书中尽可能多地涵盖（根据框架提供的服务），但我建议阅读相应服务的文档以获取更多信息。\n\
  \n#### Key Management\n\nGoogle Cloud 对磁盘上的数据进行加密，并管理密钥，包括轮换。我会说大多数客户利用默认设置，但其他客户想要更多灵活性。Google\
  \ Cloud 为密钥管理提供以下服务：\n\n- 1. Google 管理的密钥\n- 2. 使用 Cloud Key Management Service\
  \ 的客户管理密钥\n- 3. 使用第三方密钥管理系统管理的客户密钥\n\n最简单的方法是让 Google Cloud 管理密钥。但是，如果你选择管理自己的密钥，这里有一个简单的\n\
  \n使用 Cloud Key Management System 创建和分配密钥的过程。\n\n创建一个名为 *pigeonkeyring* 的密钥环，并创建一个名为\
  \ *pigeonkey* 的密钥。\n\n```\ngcloud kms keyrings create \"pigeonkeyring\" \\\n   \
  \ --location \"global\"\ngcloud kms keys create \"pigeonkey\" \\\n    --location\
  \ \"global\" \\\n    --keyring \"pigeonkeyring\" \\\n    --purpose \"encryption\"\
  \n```\n\n你可以使用 list 选项查看刚刚创建的密钥的名称和元数据。\n\n```\ngcloud kms keys list \\\n    --location\
  \ \"global\" \\\n    --keyring \"pigeonkeyring\"\n```\n\n让我们将一些要加密的文本存储在名为“pigeonsecret.txt”的文件中。\n\
  \n```\necho -n \"My super-secret message is encrypted\" > pigeonsecret.txt\n```\n\
  \n现在，让我们使用创建的密钥信息加密数据，指定要加密的明文文件的名称，并指定将包含加密内容的文件的名称：\n\n```\ngcloud kms encrypt\
  \ \\\n    --location \"global\" \\\n    --keyring \"pigeonkeyring\" \\\n    --key\
  \ \"pigeonkey\" \\\n    --plaintext-file ./pigeonsecret.txt \\\n    --ciphertext-file\
  \ ./pigeonsecret.txt.encrypted\n```\n\n你现在已使用你的密钥和 Cloud KMS 将消息加密到文件中。那么我如何读取加密文件的内容？要使用\
  \ gcloud kms decrypt 解密数据，请提供你的密钥信息，指定要解密的加密文件的名称，并指定将包含解密内容的文件的名称：\n\n\n\n```\n\
  gcloud kms decrypt \\\n  --location \"global\" \\\n  --keyring \"pigeonkeyring\"\
  \ \\\n  --key \"pigeonkey\" \\\n  --ciphertext-file ./pigeonsecret.txt.encrypted\
  \ \\\n  --plaintext-file ./pigeonsecret.txt.decrypted\n```\n\n你已成功加密并解密了示例文件的内容！\n\
  \n### Audit Logs\n\n框架的一个重要组成部分是日志记录。在安全上下文中，我们需要知道谁做了什么以及何时做。Google Cloud Audit\
  \ Logs 记录每一次管理活动。日志存储在受保护的存储区域中，从而形成不可变的日志和高度持久的审计跟踪。\n\nCloud Audit Logs 为每个 Google\
  \ Cloud 项目、文件夹和组织维护三种审计日志：\n\n#### Admin Activity\n\nAdmin Activity 审计日志包含修改云资源配置或元数据的\
  \ API 调用或其他管理操作的日志条目。\n\n#### Data Access\n\nData Access 审计日志包含读取资源配置或元数据的 API 调用，它还捕获用户驱动的\
  \ API 调用，这些调用会创建、修改或读取用户提供的资源数据。\n\n#### System Event\n\nSystem Event 审计日志包含修改资源配置的管理操作的日志条目。\n\
  \n### Identity Access Management\n\nIdentity Access Management（IAM）是一个框架，用于实施确保用户和服务对资源具有适当访问权限的策略。Google\
  \ Cloud 为我们提供了一个服务来管理这些 Identity Access Management，名为 Cloud IAM，名称简单明了。Cloud IAM\
  \ 有三个主要组件：\n\n#### *Member*\n\n成员可以是 Google 账号用户、服务账号、Google 群组，或可以访问资源的 G Suite\
  \ 或 Cloud Identity 域。\n\n#### *Role*\n\n角色是一组权限，权限决定了在资源上允许的操作。\n\n#### *Policy*\n\
  \n策略将成员绑定到角色。\n\n让我们谈谈权限，以便你对 IAM 为什么重要有一个初步的了解。（我们将在后续章节详细讨论框架的安全性）。在 Google Cloud\
  \ IAM 世界中，权限以 **service.resource.verb** 的形式表示。当我们使用最小权限构建应用程序时，这可能会变得非常复杂和令人困惑。为了简化分配权限的过程，我们使用角色的概念，角色是一组权限。Google\
  \ Cloud 为用户提供了很大的灵活性，你可以使用自定义角色或预定义角色。为了再次简化权限管理流程，我们尽量使用 Google Cloud 为我们提供的预定义角色。例如，预定义角色\
  \ Pub/Sub Publisher（roles/pubsub.publisher）仅提供向 Pub/Sub 主题发布消息的访问权限。\n\n除了 IAM，关于用户身份验证的内容将在未来的章节中介绍，在那里我们将利用\
  \ IAM、用户身份验证、日志和加密来构建安全的云原生应用程序。\n\n### Summary\n\n到目前为止，你应该对用例、我们的框架以及我们如何利用云原生方法来满足业务需求有了一个良好的理解。我们在本章中涵盖了许多主题，我保证随着每一章的展开会变得更容易，因为每一章都会在前一章的基础上构建。\n\
  \n我还想指出，本书中使用的用例是为了将学习应用到实际应用中。然而，你可以将所学内容应用于任何云原生应用程序，因为所有应用程序都需要本章中讨论的类似方法。随着我们继续推进，每个章节末尾都会放置一个云原生检查点，以验证我们是否满足要求。\n"
- "# Chapter 2. Getting Data into Google Cloud\n\n## A NOTE FOR EARLY RELEASE READERS\n\
  \n使用 Early Release 电子书，你可以在这些标题的正式发布之前很久就获得书籍的早期形式——作者在撰写时的原始未编辑内容——从而利用这些技术。\n\n\
  这是最终书籍的第 2 章。请注意，GitHub 仓库将在稍后激活。\n\n如果你对如何改进本书的内容和/或示例有任何意见，或者如果你注意到本章中缺少材料，请联系编辑\
  \ mcronin@oreilly.com。\n\n本章旨在关注将数据导入 Google Cloud 以供我们的云原生应用程序使用。然而，在我们应用程序的上下文中介绍如何将数据导入\
  \ Google Cloud 将对每个人都有益。我们的數據，如你从用例中回忆的那样，将在 Google Cloud 外部，是我们呼叫中心原始的音频文件。你需要在接近实时地处理这些音频文件，以便我们的用户可以访问从我们的管道收集的指标。Google\
  \ Cloud 提供了以下存储选项：\n\n- Zonal standard persistent disk and zonal SSD persistent\
  \ disk\n- Regional standard persistent disk and regional SSD persistent disk\n-\
  \ Local SSD for high-performance local block storage\n- Cloud Storage buckets: Object\
  \ storage.\n- Filestore: High-performance file storage\n\n存储选择有几种，但你会为存储音频文件选择哪一种？让我们回顾一下需求：\n\
  \n- 我们的呼叫中心每天处理 5,000 个电话\n- 每个电话平均长 30 分钟\n- 每个文件平均大小为 57 MB\n  - 5,000 * 57 =\
  \ 285 GB\n\n你每月大约需要 8.5 TB 的存储空间，每年大约需要 102 TB。你可以排除持久磁盘，因为它们有会限制可扩展性的限制，参见表 2-1。\n\
  \n| Storage Type | Zonal standard persistent disks | Regional standard persistent\
  \ disks | Zonal SSD persistent disks | Regional SSD persistent disks | Local SSDs\
  \ | Cloud Storage buckets |\n|---|---|---|---|---|---|---|\n| Minimum capacity per\
  \ disk | 10 GB | 200 GB | 10 GB | 10 GB | 375 GB | n/a |\n| Maximum capacity per\
  \ disk | 64 TB | 64 TB | 64 TB | 64 TB | 375 GB | n/a |\n| Capacity increment |\
  \ 1 GB | 1 GB | 1 GB | 1 GB | 375 GB | n/a |\n| Maximum capacity per instance |\
  \ 257 TB | 257 TB | 257 TB | 257 TB | 3 TB | Almost infinite |\n\n从列表中可以看出，我们对持久磁盘的限制相当大。即使我们选择使用区域标准持久磁盘并创建一个实例来存储音频文件，我们的成本也会相当高。同时我们开始偏离云原生方法，因为现在我们需要管理计算实例、附加的持久磁盘，并且我们需要一种方法来监控存储中的事件，例如文件创建以触发云函数。在撰写本文时，成本分析如下：\n\
  \n- Zonal Standard Persistent Disks\n  - Disk One 64 TB: Total Estimated Cost: USD\
  \ $2,621.44 per 1 month\n  - Disk Two 64 TB: Total Estimated Cost: USD $2,621.44\
  \ per 1 month\n  - Approximate Total per Month for 128 TB, USD $5,242 per 1 month\n\
  - Cloud Storage Bucket\n  - Approximate Total per Month for 128 TB, USD $2,621.44\
  \ per 1 month\n\n此成本分析未考虑云存储每月的存储操作或挂载标准持久磁盘的计算实例成本。这些存储数字设定为一年，但你需要考虑第二年、第三年等会发生什么。我们的持久磁盘解决方案变得复杂且昂贵，因此最明智的做法是选择云存储桶。\n\
  \n你可能会想知道 Cloud Storage 中的存储操作。操作是更改存储桶和对象或检索其信息的动作。Cloud Storage 操作分为三类：Class A、Class\
  \ B 和免费。表 2-2 引自 Google Cloud Storage 文档 https://cloud.google.com/storage/pricing#price-tables；我建议访问文档以确认自本书出版以来\

  \n## Publishing Messages\n\n通过 Cloud Console 发布消息仅对测试我们的流程有用。在生产环境中以及在我们的框架内，你希望应用程序来执行发布操作。发布消息时，你需要定义消息正文或消息属性。消息可以只有消息正文，或者反过来消息可以只有一条或多条消息属性。你也可以同时拥有两者。你也不需要担心唯一标识符或时间戳，因为\
  \ Pub/Sub 会添加这些相应字段。\n\n- 1. 如果你尚未 Git Clone 该仓库，请继续克隆以下仓库：\n- 2. 在你喜欢的 IDE 中，进入\
  \ chapter-three/pub-sub\n- 3. 在此文件夹中在终端运行 npm install --save @google-cloud/pubsub\n\
  \n- 4. 在你喜欢的 IDE 中编辑 sendMessage.js 文件\n- 5. 将 topicName 变量更改为你在上面创建的主题，如果你尚未创建主题，请前往\
  \ Receiving Messages with the Pull Method 部分的步骤 2 获取说明\n- 6. 将 data 变量更改为你选择的任意消息\n\
  - 7. 完成后它应该看起来像图 3-13\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_91_0.png)\n\n\
  图 3-13. sendMessage.js 代码片段截图\n\n- 8. 按如下方式运行你的应用程序：node sendMessage.js\n- 9. 消息交付后，运行\
  \ Receiving Messages with the Pull Method 部分中的 getMessage.js 文件\n- 10. 你现在应该会在 getMessage.js\
  \ 应用程序中看到你的消息已接收，如图 3-14 所示\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_92_0.png)\n\
  \n图 3-14. sendMessage.js 终端输出\n\n你已成功以编程方式向 Cloud Pub/Sub 发布消息，并以编程方式接收和确认了该消息。\n\
  \n## Ordering Messages\n\nCloud Pub/Sub 是一种高度可扩展的消息传递服务，允许“Google 产品包括 Ads、Search\
  \ 和 Gmail 使用此基础设施每秒发送超过 5 亿条消息，总计超过 1TB/s 的数据” - https://cloud.google.com/pubsub/architecture。由于系统高度可扩展，Pub/Sub\
  \ 不保证消息传递的顺序。顺序是消息系统在大规模下实现的一种复杂架构。它要求消息服务在发送下一条消息之前交付一条消息，并保证订阅者已接收到该消息。消息排序架构会给传入消息带来压力，降低发布者每秒接受的消息数量。\n\
  \n如果你需要处理消息顺序，可以使用外部服务如 Cloud Firestore 来存储唯一 ID，并让订阅者检查 Cloud Firestore 以确定下一步需要处理哪条消息。如果你选择这种方式，你可能需要考虑不使用\
  \ Cloud Pub/Sub，而是利用 Firestore 作为你的消息队列。在消息交付时，你需要执行两个操作：一个是将消息交付给 Pub/Sub，第二个是写入\
  \ Firestore。这也适用于订阅者，因为订阅者需要从 Firestore 读取，然后从 Cloud Pub/Sub 拉取消息。这些额外步骤也会给你的应用程序引入延迟。\n\
  \n作为一种替代方法，如果你有一个单一发布者和单一订阅者，你可以使用计数器对消息进行排序。在下面的练习中，我们将配置一个 for 循环向 Pub/Sub 发送\
  \ 100 条消息，然后你将配置一个使用持久计数器对消息进行排序的单一订阅者。我们需要在发布消息时使用 counterid 变量作为消息属性，并在订阅者中匹配\
  \ counterid 变量的起始值。\n\n- 1. 如果你尚未克隆仓库，请继续克隆以下仓库：\n- 2. 在你喜欢的 IDE 中，进入 **chapter-three/pub-sub**\n\
  - 3. 在此文件夹中在终端运行 npm install --save @google-cloud/pubsub\n- 4. 在你喜欢的 IDE 中编辑 sendMessageLoadOrder.js\
  \ 文件\n- 5. 将 **topicName** 变量更改为你在上面创建的主题，如果你尚未创建主题，请先创建 Pub/Sub 主题。\n- 6. 将 data\
  \ 变量更改为你选择的任意消息\n- 7. 在你喜欢的 IDE 中编辑 getMessageOrder.js 并将 subscriptionName 更改为你的订阅，如果你尚未创建订阅，请先创建。\n\
  - 8. 运行以下命令：node getMessageOrder.js\n- 9. 上述命令将等待并监听新消息\n- 10. 在新的终端运行以下命令发送 100\
  \ 条消息 node sendMessageLoadOrder.js\n- 11. 返回运行 getMessageOrder.js 的终端，你会注意到消息按顺序被处理。它应该看起来像图\
  \ 3-15\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_93_0.png)\n\n*图 3-15. 消息顺序被处理的终端输出*\n\
  \n由于 Cloud Pub/Sub 不保证消息的顺序，你可以使用本练习中概述的步骤来对消息进行排序，如果你的应用程序需要顺序。\n\n## Replaying\
  \ and purging messages\n\n一旦消息已被确认，该消息将不再可供给定订阅的订阅者访问。此外，订阅者必须处理订阅中的每条消息——即使只需要其中一部分。\n\
  \nCloud Pub/Sub Seek 功能扩展了订阅者功能，允许你更改消息的确认状态。你可以重放先前已确认的消息，并且你可以通过使用 Seek 结合 Snapshot\
  \ 将一个订阅的状态复制到另一个订阅。\n\n使用 Seek 功能允许你从意外的订阅者问题中恢复，对不再相关的消息积压执行确认，并在部署新代码功能时避免意外确认消息。\n\
  \n### Create and Seek to Snapshots\n\n- 1. 创建一个主题和一个订阅，运行以下命令：\n```\ngcloud pubsub\
  \ topics create seek-demo-topic\ngcloud pubsub subscriptions create seek-demo-sub\
  \ --topic=seek-demo-topic --ack-deadline=1\n```\n- 2. 订阅中没有任何已确认的消息。通过创建快照来捕获此状态：\n\
  ```\ngcloud pubsub snapshots create my-snapshot --subscription=seek-demo-sub\ngcloud\
  \ pubsub snapshots list\n```\n- 3. 现在发布、拉取并确认一条消息：\n```\ngcloud pubsub topics publish\
  \ seek-demo-topic --message 'hello, world'\ngcloud pubsub subscriptions pull --auto-ack\
  \ seek-demo-sub\ngcloud pubsub subscriptions pull --auto-ack seek-demo-sub\n```\n\
  - 4. 你可以通过将订阅 seek 到快照来恢复该消息。\n```\ngcloud pubsub subscriptions seek seek-demo-sub\
  \ --snapshot=my-snapshot\ngcloud pubsub subscriptions pull seek-demo-sub --auto-ack\n\
  ```\n- 5. 你可以将其他订阅 seek 到同一个快照，只要订阅的主题与快照的主题相同\n```\ngcloud pubsub subscriptions\
  \ create seek-demo-sub2 --topic=seek-demo-topic --ack-deadline=10\ngcloud pubsub\
  \ subscriptions seek seek-demo-sub2 --snapshot=my-snapshot\n```\n- 6. 从 seek-demo-sub2\
  \ 拉取现在将产生在 seek-demo-sub2 创建之前发布的消息：\n```\ngcloud pubsub subscriptions pull seek-demo-sub2\
  \ --auto-ack\n```\n\n\n\n\n### 寻求时间戳\n\n另一种重放已确认消息的方式是寻求时间戳。要寻求时间戳，您必须先配置订阅以使用 retain-acked-messages\
  \ 保留已确认的消息。\n\n+   1. 运行以下命令以寻求时间戳\n+   ```\n+   gcloud pubsub subscriptions update\
  \ seek-demo-sub --retain-acked-messages\n+   ```\n+   2. 现在发布、拉取并确认一条消息：\n+   ```\n\
  +   gcloud pubsub topics publish seek-demo-topic --message 'hello, world'\n+   gcloud\
  \ pubsub subscriptions pull --auto-ack seek-demo-sub\n+   ```\n+   3. 下一次拉取应返回无消息：\n\
  +   ```\n+   gcloud pubsub subscriptions pull seek-demo-sub\n+   ```\n+   4. 现在将订阅回溯以恢复该消息\n\
  +   ```\n+   TS_FORMAT=%Y-%m-%dT%H:%M:%SZ\n+   gcloud pubsub subscriptions seek\
  \ seek-demo-sub --time=$(date -u -d '-10 min' +$TS_FORMAT)\n+   ```\n+   5. 后续的拉取应再次返回该消息：\n\
  +   ```\n+   gcloud pubsub subscriptions pull --auto-ack seek-demo-sub\n+   ```\n\
  +   6. 您也可以使用 seek 跳过在某时间点之前发布的所有消息的投递。\n+   ```\n+   gcloud pubsub topics publish\
  \ seek-demo-topic --message 'hello, world'\n+   gcloud pubsub subscriptions seek\
  \ seek-demo-sub --time=$(date -u +$TS_FORMAT)\n+   ```\n+   7. 在大约 60 秒的传播延迟后，该消息将不再被投递。\n\
  +   ```\n+   gcloud pubsub subscriptions pull seek-demo-sub\n+   ```\n\n## 监控\n\n\

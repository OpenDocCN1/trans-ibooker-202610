  \ mcronin@oreilly.com。\n\n在本章中，你将部署 Cloud Dataflow 并了解 Cloud Dataflow 监控，以便拥有健康的管道。这是你部署完全功能化的云原生应用程序的第二部分。\n\
  \n## Deploying the Cloud Dataflow Pipeline\n\n要部署 Cloud Dataflow 管道，请运行以下命令。管道将利用\
  \ Google Cloud Machine Learning API 对原始音频数据进行丰富处理。\n\n- 1. 创建用于 Dataflow 暂存文件的存储桶：\n\
  \  `gsutil mb gs://[BUCKET_NAME]/`\n- 2. 通过 Google Cloud Console 在新创建的存储桶中创建一个名为\
  \ tmp 的文件夹，用于 DataFlow 暂存文件\n\n```\ngsutil mb gs://[BUCKET_NAME]/\n```\n- 3. 创建一个\
  \ BigQuery 数据集，用于在 Cloud Dataflow 处理后保存结构化数据：\n\n```\nbq mk [YOUR_BIG_QUERY_DATABASE_NAME]\n\
  ```\n- 4. 启用 Cloud Dataflow API\n- 5. gcloud services enable dataflow\n- 6. 启用 Cloud\
  \ Natural Language API：\n\n```\ngcloud services enable language.googleapis.com\n\
  ```\n- 7. 启用 Google Cloud Data Loss Prevention API\n\n```\ngcloud services enable\
  \ dlp.googleapis.com\n```\n- 8. 部署 Cloud Dataflow Pipeline\n\nDataflow 应用程序使用不属于标准库的包和模块。为了将你的\
  \ Python 环境与其它应用程序隔离，建议你使用 Python 虚拟环境。以下是为 Dataflow 应用程序使用虚拟环境的步骤。\n\n```\nvirtualenv\
  \ env\nsource env/bin/activate\n### Deploy the Dataflow Pipeline\npython3 saflongrunjobdataflow.py\
  \ --project=[YOUR_PROJECT_ID] --\ninput_topic=projects/[YOUR_PROJECT_ID]/topics/[YOUR_TOPIC_NAME]\
  \ --runner=DataflowRunner --\ntemp_location=gs://[YOUR_DATAFLOW_STAGING_BUCKET]/tmp\
  \ --output_bigquery=[DATASET NAME].[TABLE] --\nrequirements_file=\"requirements.txt\"\
  \n```\n\n用你的相应参数替换以下参数：\n\n```\n[YOUR_PROJECT_ID] # 你的 Google Cloud 项目 ID\n[YOUR_TOPIC_NAME]\
  \ # 你的 Pub/Sub 主题名称\n```\n\n```\n[YOUR_DATAFLOW_STAGING_BUCKET] # 第 1 步中创建的暂存桶\n\
  [DATASET NAME] # 第 3 步中你创建的 BigQuery 数据集\n[TABLE] # 你选择的表名，例如 transcripts。\n```\n\
  \nDataflow 将为你创建表，它已在 Dataflow Pipeline 代码中定义为按如下方式创建表。\n\n```\ncreate_disposition=beam.io.BigQueryDisposition.CREATE_IF_NEEDED\n\
  ```\n\n9. 一旦管道成功部署，可能需要几分钟，你可以继续以下步骤测试添加到云原生应用程序的新组件。你可以在 Cloud Console 的 Big Data\
  \ > Dataflow 中确认管道是否成功安装。图 5-1 显示了成功部署的管道。\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_145_0.png)\n\
  \n图 5-1. Cloud Dataflow 部署的 Apache Beam Pipeline\n\n对于下一部分，你将测试刚刚部署的组件。在你克隆的仓库中，你将有一个名为\
  \ sample audio files 的文件夹，你将使用这些音频文件来测试已部署的组件。\n\n10. 在终端中运行以下命令来处理一个示例立体声音频文件，用方括号\
  \ [] 中的参数替换为你的值。示例音频文件位于\n\n\n\nin the following folder from the clone repository:\
  \ /chapter-three/sample-audio\n\n```\ngsutil -h x-goog-meta-callid:1234567 -h x-goog-meta-stereo:true\
  \ -h x-goog-meta-pubsubtopicname:[TOPIC_NAME] -h x-goog-meta-year:[YEAR] -h x-goog-meta-month:[MONTH_AS_04]\
  \ -h x-goog-meta-day:[DAY_AS_06] -h x-goog-meta-starttime:[START_TIME_AS_0910] cp\
  \ stereo.wav gs://[YOUR_UPLOADED_AUDIO_FILES_BUCKET_NAME]\n```\n\n11. Run the following\
  \ command in your terminal to process a sample mono audio file, replace the parameters\
  \ within the brackets [] with your values.\n\n```\ngsutil -h x-goog-meta-callid:1234567\
  \ -h x-goog-meta-stereo:false -h x-goog-meta-pubsubtopicname:[TOPIC_NAME] -h x-goog-meta-year:[YEAR]\
  \ -h x-goog-meta-month:[MONTH_AS_04] -h x-goog-meta-day:[DAY_AS_06] -h x-goog-meta-starttime:[START_TIME_AS_0910]\
  \ cp mono.flac gs://[YOUR_UPLOADED_AUDIO_FILES_BUCKET_NAME]\n```\n\nThe Dataflow\
  \ job streams data into BigQuery instead of using a job to load data into BigQuery.\
  \ This approach enables you to query data without the delay of running a load job.\
  \ You will learn more about BigQuery in Chapter 10. To view your newly created data,\
  \ open the Cloud Console and go to Big Data > BigQuery.\n\n- 1. Navigate to your\
  \ Dataset and Table Name\n- 2. In the Query Editor (Figure 5-2) run the following\
  \ code samples to view your processed data, replace the fields in brackets with\
  \ your parameters.\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_147_0.png)\n\nFigure\
  \ 5-2. BigQuery Query Editor\n\n### 3. Order Natural Language Entities for all records\

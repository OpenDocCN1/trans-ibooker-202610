  \ 2-4.\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_47_0.png)\n\nFigure 2-4. Command\
  \ Line Usage of gsutil\n\n### Create a Bucket in the Cloud Console\n\n要创建存储桶：\n\n\
  1. 打开 Google Cloud Console 中的 Cloud Storage 浏览器：\n   Storage >\n2. 点击 Create bucket：\n\
  \   CREATE BUCKET\n3. 输入您的存储桶信息并点击 Continue：\n   a. 输入存储桶的唯一 Name\n   b. 为 **Location\
  \ type** 选择 **Region**\n   c. 为 **default storage class** 选择 **Standard**\n   d.\
  \ 为 **Access control** 选择 **Uniform**\n\n4. 点击 Create：\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_48_0.png)\n\
  \n恭喜您创建了第一个存储桶！\n\n### Upload a File in the Cloud Console\n\n1. 在 Cloud Storage\
  \ 浏览器中，点击您创建的存储桶的名称。\n2. 点击标签中的 **Upload files** 按钮：\n3. 在文件对话框中，导航到您想要上传的文件并选择它。\n\
  4. 上传完成后，您应该会看到文件名和有关文件的信息。\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_48_1.png)\n\
  \n### Download the file in the Cloud Console\n\n要从存储桶下载图像：\n\n1. 点击与文件关联的下拉菜单。下拉菜单显示为最右侧的三个垂直点。\n\
  2. 点击 **Download**。\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_48_2.png)\n\n就这样，您已创建了一个存储桶，上传了一个文件并下载了它！\n\
  \n### Using the gsutil Tool\n\ngsutil 是一个 Python 应用程序，可让您从命令行访问 Cloud Storage。您可以使用\
  \ gsutil 执行各种管理任务，包括：\n\n- 创建和删除存储桶。\n- 上传、下载和删除对象。\n- 列出存储桶和对象。\n- 移动、复制和重命名对象。\n\
  - 编辑对象和存储桶访问控制列表 (ACL)。\n- ACL 允许您设置限制，例如读取、写入或删除对象。\n\n如果您选择在桌面上本地运行它，则需要安装 gsutil。您可以访问以下链接了解如何安装\
  \ gsutil 应用程序：\nhttps://cloud.google.com/storage/docs/gsutil_install\n\n### Create\
  \ a Bucket with gsutil\n\n运行以下命令创建存储桶，请注意以下标志：\n\n- -p: 为新存储桶设置项目 ID\n- -c: 设置存储桶的默认存储类别\n\
  - -l: 设置存储桶的位置。例如，US-EAST1。\n- -b: 为存储桶启用统一存储桶级访问。\n\n```\ngsutil mb gs://[BUCKET_NAME]/\n\
  ```\n\n### Upload a File with gsutil\n\n以下命令将文件上传到相应的存储桶位置。\n\n```\ngsutil cp [LOCAL_OBJECT_LOCATION]\
  \ gs://[DESTINATION_BUCKET_NAME]/\n```\n\n### Download the File with gsutil\n\n\
  以下命令将从命令行中设置的位置下载对象到指定的本地位置。\n\n```\ngsutil cp gs://[BUCKET_NAME]/[OBJECT_NAME]\
  \ [SAVE_TO_LOCAL_LOCATION]\n```\n\n### NOTE\n\n您会注意到我们没有使用 -p 标志，该标志说明要创建存储桶的项目。如果您已使用\
  \ gcloud 设置默认项目，则可以避免使用 -p 标志，如下所示：\n\n```\ngcloud config set project PROJECT\n\
  ```\n\n### Using Client Libraries\n\n要在应用程序中集成执行管理任务以及用户任务的能力，您需要使用客户端库。Google Cloud\
  \ 为 C++、C#、Go、Java、Node.js、PHP、Python 和 Ruby 提供客户端库。我们的框架将利用 Node.js 的客户端库。当音频文件上传到\
  \ Cloud Storage 时，它会触发 google.storage.object.finalize 事件，该事件执行我们的云函数（见 Figure 2-5）。\n\
  \n![](img/eac8762c24ec77948aa0c3277f8e6eb3_50_0.png)\n\n### Upload Audio File\n\n\
  1\n\nCloud Function\n\n### Trigger Function\n\n2\n\n### Cloud Storage\n\nFigure\
  \ 2-5. Cloud Storage Object Trigger\n\nFollow along with instructions using client\
  \ libraries\n\n### NOTE\n\n您现在可以在本地工作站或稍后使用 Qwiklabs 进行练习。本书的 Qwiklabs Quest 即将推出。\n\
  \n要在您自己的 Google Cloud 项目中跟进，请按照以下说明操作。\n\n1. 创建一个 Cloud Platform 项目\n2. 为您的项目启用计费\n\
  3. 启用 Google Cloud Storage API\n4. 使用服务账号设置身份验证，以便您可以从本地工作站访问 API\n   a. 在 Cloud\
  \ Console 中，转到 IAM & Admin > Service Accounts\n   b. 从 Service account 列表中，选择 New\
  \ service account。\n   c. 在 Service account name 字段中，输入名称。\n   d. 从 Role 列表中，选择\
  \ Project > Owner。\n   在生产环境中，您希望采用最小权限原则，并且不希望将服务账号分配为项目所有者。\n   e. 点击 Create。一个包含密钥的\
  \ JSON 文件将下载到您的计算机。\n   f. 我们将使用此 JSON 来授权我们的示例代码访问 Cloud Storage API。\n\n### Create\
  \ a Bucket\n\n下面的代码提供了如何使用 Node.js cloud storage 客户端库创建存储桶的示例。它将在开发者定义的位置创建存储桶。在此代码片段中，存储桶名称定义为\
  \ \"my-bucket\"（第 1 行）。\n\n```\nconst bucketName = 'my-bucket';\n// Imports the\
  \ Google Cloud client library\nconst {Storage} = require('@google-cloud/storage');\n\
  // Creates the client\nconst storage = new Storage();\nasync function createBucket()\
  \ {\n  const [bucket] = await storage.createBucket(bucketName, {\n    location:\
  \ 'US-CENTRAL1',\n    regional: true,\n  });\n  console.log(`Bucket ${bucket.name}\
  \ created.`);\n}\ncreateBucket().catch(console.error);\n```\n\n从第 7 行开始，您会注意到第二个参数是一个对象，其中包含我们传递给存储客户端的元数据，告诉存储客户端在相应位置创建我们的存储桶。您也可以按如下方式传递对象：\n\
  \n```\nconst bucketName = 'my-bucket';\n// Imports the Google Cloud client library\n\
  const {Storage} = require('@google-cloud/storage');\n// Creates the client\nconst\
  \ storage = new Storage();\nconst metadata = {\n  location: 'US-CENTRAL1',\n  regional:\
  \ true\n};\nasync function createBucket() {\n  const [bucket] = await storage.createBucket(bucketName,\
  \ metadata);\n  console.log(`Bucket ${bucket.name} created.`);\n}\ncreateBucket().catch(console.error);\n\
  ```\n\n在此代码块中，我们在第 6 行创建一个变量来保存要传递给存储客户端的参数。第 11 行现在包含第 6 行创建的 metadata 对象，该对象将被传递到我们的创建存储桶请求。以下是您可以在创建存储桶请求期间使用的元数据选项表：\n\
  \n\n\n| Name | Type | Description |\n|---|---|---|\n| archive | boolean | 存储类别为\
  \ Archive |\n| coldline | boolean | 存储类别为 Coldline |\n| dra | boolean | 存储类别为 Durable\
  \ Reduced Availability。 |\n| multiRegional | boolean | 存储类别为 Multi-Regional。 |\n\
  | nearline | boolean | 存储类别为 Nearline。 |\n| regional | boolean | 存储类别为 Regional。\
  \ |\n| standard | boolean | 指定存储类别为 Standard。 |\n\n创建存储桶时，一个重要的选项是选择类别以及是否将为 multiRegional。让我们回顾一下\
  \ Google Cloud 可用的存储类别，因为这将是从成本角度来看的一个重要选择，并且也会确保您为数据访问配置文件选择合适的类别。\n\n下表取自 Google\
  \ Cloud 存储文档。截至撰写本文时为最新，但我们建议您检查 Google Cloud 文档以确认自本书出版日期以来 SLA 是否有任何变化：\n\n| Storage\
  \ Class | Minimum storage duration | SLA |\n|---|---|---|\n| Standard Storage |\
  \ None | >99.99% in multi-regions and dual-regions 99.99% in regions |\n| Nearline\
  \ Storage | 30 days | 99.95% in multi-regions and dual-regions 99.9% in regions\
  \ |\n| Coldline Storage | 90 days | 99.95% in multi-regions and dual-regions 99.9%\
  \ in regions |\n| Archive Storage | 365 days | 99.95% in multi-regions and dual-regions\
  \ 99.9% in regions |\n\n最小存储时长是在选择类别时需要考虑的关键指标。请注意，所有类别在延迟方面表现相同；您需要考虑的是访问配置文件。在我们的框架中，我们的文件将被相当频繁地访问，因为我们为用户提供播放音频文件的能力。由于其访问配置文件，我们框架的标准类别满足我们的要求并且是最有效的。如果文件在存储达到类别时长之前被删除，Google\
  \ Cloud 将向您收取提前删除费。\n\n> 例如，假设您在 US multi-region 中存储 1,000 GB 的 Coldline Storage\
  \ 数据。如果您在第 1 天添加数据，然后在第 60 天将其删除，您将被收取 $14 ($0.007/GB/mo. * 1,000 GB * 2 mo.) 用于第\
  \ 1 天至 60 天的存储费用，然后收取 $7 ($0.007/GB/mo. * 1,000 GB * 1 mo.) 用于第 61 天至 90 天的 30 天提前删除费用。引自\
  \ Google Cloud Storage 文档：https://cloud.google.com/storage/pricing#archival-pricing\n\
  \n让我们继续使用 Node.js 创建我们的第一个存储桶。\n\n- 1. 在您的本地工作站上，git clone 以下仓库：https://gitlab.com/building-cloud-native-applications-google-cloud/chapter-two.git\n\
  - 2. 从克隆的仓库，进入 chapter-two 文件夹。\n- 3. 在您喜欢的编辑器中打开 createBucket.js 文件。\n- 4. 在第 6\
  \ 行，将 \"key.json\" 替换为您下载的服务账号密钥。\n- 5. 在第 7 行，将 \"ruicosta-blog\" 替换为您自己的项目 ID。\n\
  - 6. 在此文件夹的终端中，运行 npm install\n- 7. 在终端中，运行 node createBucket.js\n- 8. 执行成功后，它应如下图所示\
  \ Figure 2-6\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_53_0.png)\n\nFigure 2-6.\
  \ Code Screenshot for createBucket.js\n\n您可以前往 Google Cloud Storage 控制台，您新创建的存储桶应列出。恭喜！您以编程方式创建了您的第一个存储桶。\n\
  \n### Create a Bucket with Bucket Locks\n\n存储桶锁定允许您创建保留策略以锁定数据，防止其被删除或覆盖。您也可以锁定保留策略。一旦锁定，您将无法解锁；您只能增加保留期。请参阅\
  \ Cloud Console 中 Figure 2-7 的警告。这是在警告您，如果您锁定设置为 5 天的保留策略，您将失去缩短或删除它的能力。如果您想删除对象或存储桶本身，您只能在\
  \ 5 天到期后执行此操作。\n\n### Lock retention policy for this bucket?\n\nPermanent. By locking\
  \ this bucket's retention policy, you'll lose the ability to shorten or remove it.\
  \ You'll incur storage costs for the full retention duration of uploaded objects.\n\
  \nRETENTION POLICY DURATION\n5 days\n\nA retention policy protects a bucket's objects\
  \ from deletion or modification regardless of whether it's locked. Only lock the\
  \ policy if you want to be sure no one (including you) can remove it or shorten\
  \ its duration.\n\nConfirm you want to lock this policy by entering the bucket name:\
  \ sample-42892\n\nsample-42892\n\nCANCEL   LOCK POLICY\n\nFigure 2-7. Locking the\
  \ Cloud Storage Policy\n\n如果您尝试删除保留期内较新的对象，将导致 PERMISSION_DENIED 错误。\n\n让我们以编程方式为\
  \ 6 个月创建保留策略。此存储桶中的对象将无法被覆盖或删除。查看第 5 行。这是您可以设置存储桶锁定持续时间的位置。\n\n```\n// Imports the\
  \ Google Cloud client library\nconst {Storage} = require('@google-cloud/storage');\n\
  // Creates a client from a Google service account key.\nconst storage = new Storage({\n\
  \  keyFilename: \"key.json\",\n  projectId: \"ruicosta-blog\"\n});\nconst retentionPeriod\
  \ = 15780000; // 6 months.\nconst bucketName = 'rui-costa-bucket-name-2020-01';\n\
  async function createBucket() {\n  await storage\n    .createBucket(bucketName)\n\
  \    .setRetentionPeriod(retentionPeriod);\n  console.log(`Bucket ${bucketName}\
  \ created.`);\n}\ncreateBucket().catch(console.error);\n```\n\n要在桌面上本地运行代码片段，请按照以下步骤操作：\n\
  \n- 1. 如果您之前已克隆仓库，可以跳过此步骤：在您的本地工作站 git clone 以下仓库：https://gitlab.com/building-cloud-native-applications-google-cloud/chapter-two.git\n\
  - 2. 从克隆的仓库，进入 chapter-two 文件夹。\n- 3. 在您喜欢的编辑器中打开 createBucketLock.js 文件。\n- 4.\
  \ 在第 5 行将 \"key.json\" 替换为您下载的服务账号密钥。\n- 5. 在第 6 行将 \"ruicosta-blog\" 替换为您自己的项目\
  \ ID。\n- 6. 如果您在此文件夹中之前步骤已运行 npm install，可以跳过此步骤：在此文件夹的终端中运行 npm install\n- 7. 在终端中运行\
  \ node createBucketLock.js\n- 8. 执行成功后，它应如下图所示 Figure 2-8\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_55_0.png)\n\
  \nFigure 2-8. Code Screenshot for createBucketLock.js\n\n您创建了一个具有 6 个月保留锁定期的新存储桶。如果您尝试向存储桶上传新文件并删除上传的文件，您将收到错误消息。\n\
  \n### List Buckets\n\n让我们现在列出我们以编程方式创建的存储桶。这是一个有用的命令，因为它允许您列出项目中的所有存储桶，这可以让您执行诸如数据丢失预防等操作。我们可以遍历所有存储桶和对象，然后使用\
  \ Google Cloud Data Loss Prevention API 扫描它们以查找 PII 信息。第 12 行我们使用 forEach()，它对数组中的每个元素调用提供的回调函数。数组中的每个元素都是我们项目中的存储桶列表。\n\
  \n```\n// Imports the Google Cloud client library\nconst {Storage} = require('@google-cloud/storage');\n\
  // Creates a client\nconst storage = new Storage({\nkeyFilename: \"key.json\",\n\
  projectId: \"ruicosta-blog\"\n});\n```\n\n```\nasync function listBuckets() {\n\
  \    // Lists all buckets in the current project\n    const [buckets] = await storage.getBuckets();\n\
  \    console.log('Buckets:');\n    buckets.forEach(bucket => {\n        console.log(bucket.name);\n\
  \    });\n};\nlistBuckets().catch(console.error);\n```\n\n要在桌面上本地运行代码片段，请按照以下步骤操作：\n\
  \n- 1. 如果您之前已克隆仓库，可以跳过此步骤：在您的本地工作站 git clone 以下仓库：https://gitlab.com/building-cloud-native-applications-google-cloud/chapter-two.git\n\
  - 2. 从克隆的仓库，进入 chapter-two 文件夹。\n- 3. 在您喜欢的编辑器中打开 listBuckets.js 文件。\n- 4. 在第 5\
  \ 行将 “key.json” 替换为您下载的服务账号密钥。\n- 5. 在第 6 行将 “ruicosta-blog” 替换为您自己的项目 ID。\n- 6.\
  \ 如果您在此文件夹中之前步骤已运行 npm install，可以跳过此步骤：在此文件夹的终端中运行 npm install\n- 7. 在终端中运行 node\
  \ listBuckets.js\n- 8. 执行成功后，它应如下图所示 Figure 2-9\n\n\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_57_0.png)\n\
  \n### 上传文件\n\n我们创建了一个存储桶。现在，将对象上传到存储桶就是有趣的部分了。下面代码片段中，我们将把名为 \"rui_costa.jpg\" 的文件上传到名为\
  \ \"rui-costa-bucket-name-2020\" 的存储桶中的云存储。\n\n```\nconst bucketName = 'rui-costa-bucket-name-2020';\n\
  const filename = 'rui_costa.jpg';\n// Imports the Google Cloud client library\n\
  const {Storage} = require('@google-cloud/storage');\n// Creates a client\nconst\
  \ storage = new Storage({\n    keyFilename: 'key.json',\n    projectId: 'ruicosta-blog'\
  \ }); async function uploadFile() {\n// Uploads a local file to the bucket\nawait\
  \ storage.bucket(bucketName).upload(filename, {\n    metadata: {\n        cacheControl:\
  \ 'public, max-age=31536000',\n    },\n});\nconsole.log(` ${filename} uploaded to\
  \ ${bucketName}.`);\n}\nuploadFile().catch(console.error);\n```\n\n要在桌面本地运行代码片段，请按以下步骤操作：\n\
  \n- 1. 如果你之前已克隆仓库，可以跳过此步骤：在本地工作站上 git clone 以下仓库：https://gitlab.com/building-cloud-native-applications-google-cloud/chapter-two.git\n\
  - 2. 从克隆的仓库中，进入 chapter-two 文件夹。\n- 3. 在你喜欢的编辑器中打开 uploadFile.js 文件。\n- 4. 在第 1\
  \ 行用你的存储桶名称替换\n- 5. 在第 2 行用你想要上传的文件替换\n- 6. 在第 7 行将 \"key.json\" 替换为你下载的服务账号密钥。\n\
  - 7. 在第 8 行将 \"ruicosta-blog\" 替换为你的项目 ID。\n- 8. 如果你在本文件夹中之前步骤已运行 npm install，可以跳过此步骤：在本文件夹的终端中运行\
  \ npm install\n- 9. 在终端中运行 node uploadFile.js\n- 10. 执行成功后，应如下图 2-10 所示\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_58_0.png)\n\
  \n图 2-10. uploadFile.js 的代码截图\n\n太简单了！我们现在已通过编程方式将文件上传到我们的存储桶。\n\n### 下载文件\n\n你可能需要的另一个选项是从\
  \ Cloud Storage 获取数据。我们创建了存储桶并上传了文件，但现在如何下载此文件呢？下面代码片段将下载你刚刚上传的文件到你定义本地位置。在第 3 行你可以更改将要本地保存的文件名，以避免覆盖我们上传的现有文件：\n\
  \n```\nconst bucketName = 'rui-costa-bucket-name-2020';\nconst srcFilename = 'rui_costa.jpg';\n\
  const destFilename = 'download_rui_costa.jpg';\n// Imports the Google Cloud client\
  \ library\nconst {Storage} = require('@google-cloud/storage');\n// Creates a client\n\
  const storage = new Storage({\n    keyFilename: 'key.json',\n    projectId: 'ruicosta-blog'\n\
  });\nasync function downloadFile() {\n    const options = {\n        destination:\
  \ destFilename,\n    };\n    // Downloads the file\n    await storage.bucket(bucketName).file(srcFilename).download(options);\n\
  \    console.log(\n        `gs://${bucketName}/${srcFilename} downloaded to ${destFilename}.`\n\
  \    );\n}\ndownloadFile().catch(console.error);\n```\n\n要在桌面本地运行代码片段，请按以下步骤操作：\n\

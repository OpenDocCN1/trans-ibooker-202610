  \ from 0 to 6 are called detractors. The small percentage of users that leave feedback,\
  \ the feedback provides for an overall low customer satisfaction and Net Promoter\
  \ Score. Issues customers have raised are:\n\n- Call Availability: Long hold times\
  \ before speaking or chatting with a customer representative\n- High Handling Rates\n\
  \nPigeon Travel also noticed a high abandonment rate which correlates to the call\

  \ GitLab CI/CD 来自动化部署而深入挖掘。除了自动化之外，您还学习了如何在允许功能分支合并到 master 分支之前执行同行评审。这是使用云原生应用程序的良好第一步。我们将在后续章节中深入探讨框架的构建模块。\n"
- "# Chapter 3. Creating a Queue\n\n## A NOTE FOR EARLY RELEASE READERS\n\nWith Early\
  \ Release ebooks, you get books in their earliest form—the author’s raw and unedited\
  \ content as they write—so you can take advantage of these technologies long before\
  \ the official release of these titles.\n\nThis will be the 3rd chapter of the final\
  \ book. Please note that the GitHub repo will be made active later on.\n\nIf you\
  \ have comments about how we might improve the content and/or examples in this book,\
  \ or if you notice missing material within this chapter, please reach out to the\
  \ editor at mcronin@oreilly.com.\n\n在本章中，您将了解 Cloud Pub/Sub，它在框架中用作消息队列。您还将部署云原生应用程序的第一部分。供参考，您目前处于框架的\
  \ process 阶段。框架的 process 阶段是 Google Cloud 服务的组合，您将使用它们将音频文件转换为文本、丰富它们，并开始将数据流式传输到\
  \ BigQuery 的过程（见图 3-1）。\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_71_0.png)\n\n\
  Figure 3-1. Framework Architecture\n\n\n\n\n\n### 消息队列\n\n在第一章中我们介绍了 Cloud Pub/Sub\
  \ 的概述，现在让我们深入了解一些。消息队列和发布-订阅消息允许应用程序在彼此之间传输消息。在计算机科学中，这种范式用于进程间通信（IPC），它允许软件组件共享数据。这是微服务架构的重要组成部分，因为微服务应用程序分布在多台机器上，你需要一种方式让它们共享数据。我们有多种共享数据的方式，包括\
  \ RESTful API，我们将在后面的章节中介绍。但在我们框架的当前阶段，我们将利用一个队列，它提供了一种使用异步进程的方法，从而提高应用程序的吞吐量，因为不需要应用程序为新消息而阻塞。你可以在图\
  \ 3-2 中看到消息队列的工作流程。\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_73_0.png)\n\n图 3-2.\
  \ 消息队列工作流程\n\n在我们的框架中，当音频文件上传到 Cloud Storage 时，我们会创建一个触发事件。该事件执行指定的云函数，该函数执行以下操作：\n\
  \n- 1. 检索元数据\n- 2. 检查音频文件长度\n- 3. 将音频文件发送给 Speech-To-Text 进行处理\n- 4. 从 Speech-To-Text\
  \ 检索作业名称\n- 5. 向 Cloud Pub/Sub 发送一条消息，其中包含以下键值对（消息属性）：\n\n```\n'fileid': uniqid.time(),\n\
  'filename': `gs://${file.bucket}/${file.name}`,\n'callid': file.metadata.callid,\n\
  'date': Date(Date.now()),\n'year': file.metadata.year,\n'month': file.metadata.month,\n\
  'day': file.metadata.day,\n'starttime': file.metadata.starttime,\n'duration': duration,\n\
  'stereo': file.metadata.stereo,\n```\n\n对于我们的框架，你本可以使用 RESTful API 代替 Cloud Pub/Sub。但为了最大限度地减少我们应用程序的管理及其开发，我们利用了一个托管的消息系统，从而消除了这种复杂性。如果我们选择实现\
  \ RESTful API，在开发时我们需要考虑以下问题：\n\n- 1. 你会为我的 API 框架使用 Swagger 吗？如果选择否，如果需要，你将如何生成文档和客户端库？你可以不做任何事情，构建一个简单的\
  \ Express.js API 并在你的应用程序中只做一个 fetch 请求。但这能扩展吗？\n- 2. 端点将如何得到保护？\n- 3. 端点将在哪个平台上运行？\n\
  - 4. 谁将管理该平台？\n- 5. 你将如何监控平台，不仅是故障，还包括延迟等项目？\n- 6. 你将如何集成测试和自动化部署？\n\n你可以继续向需要考虑的构建\
  \ API 的清单中添加项目。但这就是我们选择 Cloud Pub/Sub 路线的其中一个原因：无需担心上述大多数项目，而且 Cloud Pub/Sub 与 Cloud\
  \ Dataflow 集成良好，后者将执行我们的提取、转换、加载（ETL）流程。\n\n即使在 API First 设计的当前趋势下，我们也需要深思熟虑何时何地使用\
  \ API。例如：当你的 API 有多个消费者时，你需要谨慎对待可能破坏当前版本的更改。你需要有足够的时间宣布弃用功能，以便开发人员根据需要修改他们的代码。或者你需要有一个计划来同时处理多个版本。通过利用发布-订阅消息范式，我们所需要做的就是与我们所选消息平台的\
  \ SDK 保持同步。这使得发布-订阅平台消息成为一种极其简单、灵活且强大的进程间通信（IPC）范式。\n\n请记住，我们并不是说要用发布-订阅平台取代 API。如果需要客户端发出请求并等待响应，那么你就需要构建一个\
  \ API。我们在运行在 Kubernetes 上的前端中正是这样做的。我们将在后面的章节中构建一个 API，该 API 使用 BigQuery SDK 执行\
  \ SQL 语句。\n\n为了保证消息传递，你将收到来自 Cloud Pub/Sub 的响应，确认消息已被接收。在你的 Cloud Function 代码中，你对\
  \ Cloud Pub/Sub 使用异步操作。你将使用 Javascript 链式处理，在其中我们按链执行多个异步操作。如果前一个操作未完成，则不会执行操作，从而允许我们使用\
  \ .catch() 处理程序添加异常检查。\n\n```\n.then(() => {\n  const pubSubData = JSON.stringify(pubSubObj);\n\
  \  const dataBuffer = Buffer.from(pubSubData);\n  const pubsub = new PubSub();\n\
  \  return pubsub\n    .topic(topicName)\n    .publisher()\n    .publish(dataBuffer)\n\
  \    .then(messageId => {\n      console.log(`Message ${messageId} published.`);\n\
  \      callback(null, 'Success!');\n    })\n    .catch(err => {\n      console.error('ERROR:',\
  \ err);\n    });\n}\n```\n\n在上面的代码片段中，如果我们没有从 Cloud Pub/Sub 收到 messageId，我们将引发一个异常，该异常将执行我们的\
  \ .catch() 处理程序。我们可以在 .catch() 处理程序中添加通知或日志消息，让我们知道发生了某些故障。来自 Cloud Pub/Sub 的此确认保证了其传递。\n\
  \n### 消息队列\n\n消息队列和发布-订阅消息很容易被混淆为同一事物。它们非常相似，但细微的差异使它们足够独特，我们需要分别强调。消息队列是一种异步的服务到服务通信方法，用于传输消息。消息队列在被处理之前存储消息，并且每条消息仅由一个订阅者处理。当消息需要被多个订阅者接收时，这就是你会使用发布-订阅消息范式的时候（图\
  \ 3-3）。\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_76_0.png)\n\n发布者\n\n订阅者\n\n\
  图 3-3. 消息队列\n\n发布-订阅消息与消息队列的不同之处在于它们允许多个订阅者接收消息。发布-订阅消息会立即将消息推送给所有订阅者，这使得 Cloud\
  \ Pub/Sub 能够为传入消息提供高吞吐率。Cloud Pub/Sub 是一种发布-订阅消息范式，并且为每个订阅至少一次地传递每条已发布的消息。一旦消息已发送给订阅者，订阅者需要确认该消息（图\
  \ 3-4）。Pub/Sub 将持续尝试传递未被确认的消息。默认情况下，无法在最大保留时间 7 天内传递的消息将被删除且不再可访问。这通常发生在订阅者跟不上消息流时。\n\
  \n![](img/eac8762c24ec77948aa0c3277f8e6eb3_77_0.png)\n\n发布者\n\n发布者\n\n发布者\n\n订阅者\n\
  \n订阅者\n\n图 3-4. 发布-订阅消息\n\n### Google Cloud Pub/Sub\n\n如前所述，Cloud Pub/Sub 是一种发布-订阅范式，并且是一个异步消息服务。Pub/Sub\
  \ 由以下核心概念定义：\n\n#### 主题\n\n这是你的应用程序将发送消息到的位置。\n\n#### 订阅\n\n这是你的消息的持有桶。订阅将允许订阅者从订阅中拉取消息，或订阅将消息推送到定义的端点。消息将分发到主题中定义的每个订阅\
  \ 图 3-5。\n\n#### 消息\n\n消息包含消息本身，外加可选的消息属性。\n\n#### 消息属性\n\n这是一个可以添加到消息中的键:值对列表。\n\
  \n![](img/eac8762c24ec77948aa0c3277f8e6eb3_78_0.png)\n\n图 3-5. Cloud Pub/Sub 主题的屏幕截图\n\
  \n### 注意\n\n我们首选的方法是使用消息属性，因为这使我能够在不处理整个消息的情况下以编程方式查找所需键的值。示例：在我们的框架中，Cloud Dataflow\
  \ 将从 Cloud Pub/Sub 拉取消息。以编程方式我们提取键:值对如下：pub_sub_data[\"fileid\"]。这使得将值分配给代码中的变量变得简单，而无需解析消息正文。\n\
  \n图 3-6 概述了 Pub/Sub 拉取订阅中可用的不同架构。\n\n\n\n\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_80_0.png)\n\
  \nFigure 3-6. Cloud Pub/Sub Architecture\n\n在图中你可能会注意到我们在 C Publisher 中重复了消息。Cloud\
  \ Pub/Sub 允许一个主题拥有多个订阅者，让每个订阅者都能获取到消息的副本。我喜欢这样定义它：主题并不是消息的存储桶，而是订阅才是存储桶。当你创建一个主题时，可以创建多个订阅，并且当消息发送到主题时，它会被分发到已创建的订阅中。只有当订阅者在相应的订阅中确认消息时，消息才会被传递。让我们在\
  \ Figure 3-7 中回顾一条消息的生命周期，并更详细地检查它\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_81_0.png)\n\
  \nFigure 3-7. Life of a Cloud Pub/Sub Message\n\n使用 Cloud Pub/Sub 的推送订阅范式，Pub/Sub\
  \ 会将每条消息发送到订阅者应用的指定端点。\n\n+   1. 你或你的应用创建一个 Pub/Sub 主题（Figure 3-8）。\n\nFigure 3-8.\
  \ Screenshot of creating a Cloud Pub/Sub Topic\n\n+   2. 消息负载被发送到新创建的主题\n\n+   3.\
  \ Cloud Pub/Sub 将消息转发给订阅，每个订阅都会获得消息的副本。\n\n+   a. 消息将在订阅中保留长达 7 天，然后会被 Cloud Pub/Sub\
  \ 删除。消息在你的应用确认消息后会从订阅中移除（Figure 3-9）。\n\n### Message retention duration ?\n\nDuration\
  \ is from 10 minutes to 7 days\n\nDays\n7\nHours\n0\nMinutes\n0\n\nRetain acknowledged\
  \ messages ?\nWhen enabled, acknowledged messages are retained for the message retention\
  \ duration specified above. This increases message storage fees. Learn more\n\n\
  Figure 3-9. Cloud Pub/Sub Message Retention\n\n4. 订阅者通过 Pub/Sub 将消息推送到订阅者定义的端点，或通过订阅者从\
  \ Cloud Pub/Sub 服务拉取消息来接收消息。\n\n5. 在 Figure 3-10 和 Figure 3-11 中，你将看到我们推送到主题的简单消息，它包含消息正文和一个消息属性。订阅\
  \ A 和订阅 B 都收到了该消息。我们现在可以从订阅中拉取或推送消息，这将确认并从相应的订阅中移除消息。\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_83_0.png)\n\
  \nFigure 3-10. Screenshot of Subscription A\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_84_0.png)\n\
  \nFigure 3-11. Screenshot of Subscription B\n\n## Receiving Messages with the Push\
  \ Method\n\n在推送交付中，Pub/Sub 服务会将每条消息作为 HTTPS 请求发送到订阅者定义的端点。我们已为你预先配置了一个端点以使用推送方法进行测试；你可以在以下位置\
  \ git clone 本章的示例代码。\n\nFigure 3-12 概述了示例中推送流程的工作方式。\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_85_0.png)\n\
  \nFigure 3-12. Cloud Pub/Sub Push Method\n\n在此示例中，你将向预配置的端点发送一条 Cloud Pub/Sub 消息，其中包含一条消息和你的电话号码作为属性。该端点随后会将消息数据发送到你作为属性输入的电话号码。为了确保安全，你需要使用\
  \ Firebase Authentication 注册你的电话号码。我的示例端点会在发送 SMS 消息到你的手机之前验证该号码。\n\n在步骤 1 中，你需要使用电话号码向示例服务\
  \ https://sms.ruicosta.blog 进行身份验证。这会将你作为用户添加到 Firebase 中，使用你输入的号码，步骤 2。登录后复制并粘贴电话号码，我们稍后会用到它。你可以在克隆的仓库中找到\

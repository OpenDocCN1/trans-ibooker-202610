  \nDelivery type ?\nPull\nPush\nEndpoint URL *\nhttps://us-central1-ruicosta-blog.cloudfunctions.net/pubSubPushEndpoint\n\
  Enable authentication Learn more\n\n6. 为订阅输入一个名称。\n\n7. 保留所有其他选项为默认值并点击创建。\n\n向新创建的订阅发送测试消息：\n\

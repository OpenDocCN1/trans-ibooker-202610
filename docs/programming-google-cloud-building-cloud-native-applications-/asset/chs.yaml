  \      CREATE POLICY\n+   6. 为您的策略输入名称\n+   7. 点击 Add Policy\n+   8. 对于资源类型和指标选择以下内容：\n\
  +      a. Cloud Pub/Sub Subscription\n\n### b. Unacked Messages\n\n9. 在配置中输入条件为：\n\
  \n![](img/eac8762c24ec77948aa0c3277f8e6eb3_98_0.png)\n\n10. 添加您在步骤 4 中配置的 SMS 通知渠道\n\
  \n11. 点击 Save\n\n12. 要进行测试，在终端中运行以下命令：node sendMesageLoad.js，应用程序将向您的 Pub/Sub 主题发送\
  \ 100 条新消息，这将触发您配置的警报策略\n\n13. 您应该在大约一分钟后收到一条 SMS 消息\n\n启用告警的 Cloud Monitoring 为您提供了一种主动确保使用\
  \ Cloud Pub/Sub 的应用程序健康的方法。这也是管理故障的云原生架构的关键组件。\n\n## Pub/Sub 或 Pub/Sub Lite\n\n\
  Google Cloud 提供两个版本的 Cloud Pub/Sub：Cloud Pub/Sub 和 Cloud Pub/Sub Lite。如果您具有可预测的流量模式并且不需要区域性\
  \ Pub/Sub，那么 Cloud Pub/Sub Lite 将是更具成本效益的解决方案。以下表格是来自 Google Cloud 文档的 Pub/Sub 和\
  \ Pub/Sub Lite 的比较，位于 https://cloud.google.com/pubsub/docs/choosing-pubsub-or-lite\n\
  \nTable 3-1. Cloud Pub/Sub and Pub/Sub Lite Comparison\n\n| Feature | Pub/Sub |\
  \ Pub/Sub Lite |\n|---|---|---|\n| Message replication | Multi-zone in single region\
  \ | Single zone |\n| Capacity | Automatically provisioned | Provision before you\
  \ use |\n| Pricing | Pay for the capacity that you use | Pay for the capacity that\
  \ you provision |\n| Storage | Unlimited | 30 GiB-10 TiB per Lite topic |\n| Retention\
  \ period | Up to 7 days | Unlimited |\n| Service endpoints | Global and regional\
  \ | Regional |\n| Resource namespace | Global | Zonal |\n| Message routing | Global\
  \ | Zonal |\n\n在选择 Pub/Sub Lite 之前，您需要了解以下几点：\n\n+   1. Pub/Sub Lite 是一个区域性资源\n\
  +   2. 您需要在使用服务之前预配容量\n+   3. 您为预配的容量付费\n\n因此，在选择 Pub/Sub Lite 之前，您需要充分了解您的流量模式。以下是来自\
  \ Google Cloud Pub/Sub 文档的另一张优秀表格，比较了 Pub/Sub 和 Pub/Sub Lite 的成本，您可以在以下位置找到文档：https://cloud.google.com/pubsub/lite/pricing\n\
  \nTable 3-2. Cloud Pub/Sub and Pub/Sub Lite Cost Comparison\n\n| Data published/s\
  \ | Data published/mo | Data received/mo | Storage/mo | Total Pub/Sub Lite cost/partition\
  \ | Total Pub/Sub cost |\n|---|---|---|---|---|---|\n| 1 MiB | 2.5 TiB | 2.5 TiB\
  \ | 84 GiB | $39 | $200 |\n| 1 MiB | 2.5 TiB | 5 TiB | 84 GiB | $39 | $300 |\n|\
  \ 10 MiB | 25 TiB | 25 TiB | 844 GiB | $214 | $2,000 |\n| 10 MiB | 25 TiB | 50 TiB\
  \ | 844 GiB | $214 | $3,000 |\n| 100 MiB | 247 TiB | 247 TiB | 8438 GiB | $2,138\
  \ | $19,760 |\n| 100 MiB | 247 TiB | 494 TiB | 8438 GiB | $2,138 | $29,640 |\n\n\
  只要您很好地了解使用模式，Pub/Sub Lite 就可以成为降低成本的绝佳方式。\n\n## 框架部署第一部分\n\n在本节中，您将部署 Cloud Function\
  \ 并为云原生应用程序启用关联的服务。这将是我们部署功能齐全的云原生应用程序的第一部分。我们建议您在自己的 Google Cloud 项目中执行此操作，而不是在\
  \ Qwiklabs 中。您可以使用 Qwiklabs 作为学习平台来了解所介绍的概念。由于 Qwiklabs 实验室有到期日期，如果您选择使用 Qwiklabs，您的作品将在设定时间后丢失。如果您想让此项目持续进行，我们建议使用您自己的\
  \ Google Cloud 项目。您将在第 4 章中部署框架的第二部分。\n\n现在您已经了解了 Cloud Storage、Cloud Functions\
  \ 和 Cloud Pub/Sub，这是我们云原生应用程序的第一阶段，即使用 Google Cloud 机器学习 API 对音频文件进行丰富。为此，您将创建一个存储桶来上传音频文件，创建一个使用\
  \ GitLab CI/CD 部署的 Cloud Function，该函数将在音频文件上传时触发，并将音频文件发送到 Speech-to-Text 进行转录。\n\
  \n开始前您需要以下内容：\n\n+   1. 您需要一个 GitLab 账户\n+   2. 您需要创建一个空的 GitLab 仓库并在本地工作站克隆\n+\
  \   3. 您需要一个 Google Cloud 账户\n+   4. 您需要创建一个 Google Cloud 项目\n\n## 配置和部署\n\n为了授权\

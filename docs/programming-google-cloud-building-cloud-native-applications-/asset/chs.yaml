  \ Cloud Dataflow。这将是本章中你创建的 Cloud Pub/Sub 主题的订阅者，以检索由 Cloud Functions 发送的消息。Cloud\
  \ Pub/Sub 是 Cloud Functions 和 Cloud Dataflow 之间的桥梁，而 Cloud Dataflow 将是我们丰富数据的过程。\n\

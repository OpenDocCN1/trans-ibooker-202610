    \nNow that we have a good understanding of Cloud Storage as well as how the framework\
    \ works with Cloud Storage, let's move on to Cloud Functions. Cloud Functions\
    \ plays an important role in our framework as it will be the first step to start\
    \ the process of transcribing the audio files.\n\n# Cloud Functions\n\nGoogle\
    \ Cloud Functions is a serverless compute solution that allows you to run event-based\
    \ applications. Cloud Functions allows you to write single-purpose functions which\
    \ can be attached to events from your services. An example is how our framework\
    \ will leverage cloud functions. Our function will be triggered by an event, and\
    \ the event will trigger a Cloud Function once an object is written to the Cloud\
    \ Storage bucket that the function is attached to.\n\nCloud Functions is a serverless\
    \ offering from Google Cloud. It abstracts the compute infrastructure and allows\
    \ you to focus on your code. You don't have to worry about patching operating\
    \ systems or provisioning resources. Cloud Functions scale automatically; they\
    \ can scale from a single invocation to millions without intervention from the\
    \ developer. For Cloud Storage, Cloud Functions supports the following trigger\
    \ types:\n\n+   - google.storage.object.finalize\n+   - google.storage.object.delete\n\
    +   - google.storage.object.archive\n+   - google.storage.object.metadataUpdate\n\
    \nOur framework will leverage the google.storage.object.finalize trigger type.\
    \ This event is triggered when a new object is created or an existing object is\
    \ overwritten in the bucket. Below is a code snippet from our Cloud Function.\n\

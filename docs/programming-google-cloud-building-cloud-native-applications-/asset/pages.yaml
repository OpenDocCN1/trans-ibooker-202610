- pgno: 94
  md: '# Replaying and purging messages


    Once a message has been acknowledged, the message is not longer accessible to
    subscribers of a given subscription. In addition, the subscribers must process
    every message in a subscription --even if only a subset is needed.


    The Cloud Pub/Sub Seek feature extends the subscriber functionality to allow you
    to alter the acknowledgement state of messages. You can replay previously acknowledged
    messages, plus you can copy the state of one subscription to another by using
    seek in combination with a Snapshot.


    Using the Seek feature allows you to recover from unexpected subscriber problems,
    perform acknowledgement on a backlog of messages that are no longer relevant,
    and deploy new code features without accidentally acknowledging messages.


    # Create and Seek to Snapshots


    +   1. Create a topic and a subscription, run the following commands:

    +   ```

    +   gcloud pubsub topics create seek-demo-topic

    +   gcloud pubsub subscriptions create seek-demo-sub --topic=seek-demo-topic --ack-deadline=1

    +   ```

    +   2. There are no messages in the subscription that have been acknowledged.
    Capture this state by creating a snapshot:

    +   ```

    +   gcloud pubsub snapshots create my-snapshot --subscription=seek-demo-sub

    +   gcloud pubsub snapshots list

    +   ```

    +   3. Now publish, pull, and acknowledge a message:

    +   ```

    +   gcloud pubsub topics publish seek-demo-topic --message ''hello, world''

    +   gcloud pubsub subscriptions pull --auto-ack seek-demo-sub

    +   gcloud pubsub subscriptions pull --auto-ack seek-demo-sub

    +   ```

    +   4. You can recover the message by seeking the subscription to the snapshot.

    +   ```

    +   gcloud pubsub subscriptions seek seek-demo-sub --snapshot=my-snapshot

    +   gcloud pubsub subscriptions pull seek-demo-sub --auto-ack

    +   ```

    +   5. You can seek other subscriptions to the same snapshot, as long as the subscription''s
    topic is the same as the snapshot''s topic

    +   ```

    +   gcloud pubsub subscriptions create seek-demo-sub2 --topic=seek-demo-topic
    --ack-deadline=10

    +   gcloud pubsub subscriptions seek seek-demo-sub2 --snapshot=my-snapshot

    +   ```

    +   6. Pulling from seek-demo-sub2 will now yield messages which were published
    before seek-demo-sub2 was created:

    +   ```

    +   gcloud pubsub subscriptions pull seek-demo-sub2 --auto-ack

    +   ```'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Seek to a timestamp


    Another way to replay messages that have been acknowledged is to seek a timestamp.
    To seek a timestamp, you must first configure the subscription to retain acknowledged
    messages using retain-acked-messages.


    +   1. Run the following command to seek to a timestamp

    +   ```

    +   gcloud pubsub subscriptions update seek-demo-sub --retain-acked-messages

    +   ```

    +   2. Now publish, pull, and acknowledge a message:

    +   ```

    +   gcloud pubsub topics publish seek-demo-topic --message ''hello, world''

    +   gcloud pubsub subscriptions pull --auto-ack seek-demo-sub

    +   ```

    +   3. The next pull should return no messages:

    +   ```

    +   gcloud pubsub subscriptions pull seek-demo-sub

    +   ```

    +   4. Now seek the subscription back in time to recover the message

    +   ```

    +   TS_FORMAT=%Y-%m-%dT%H:%M:%SZ

    +   gcloud pubsub subscriptions seek seek-demo-sub --time=$(date -u -d ''-10 min''
    +$TS_FORMAT)

    +   ```

    +   5. A subsequent pull should yield the message again:

    +   ```

    +   gcloud pubsub subscriptions pull --auto-ack seek-demo-sub

    +   ```

    +   6. You can also use seek to skip delivery of all messages published before
    some point in time.

    +   ```

    +   gcloud pubsub topics publish seek-demo-topic --message ''hello, world''

    +   gcloud pubsub subscriptions seek seek-demo-sub --time=$(date -u +$TS_FORMAT)

    +   ```

    +   7. After some propagation delay of, say, 60 seconds the message will no longer
    be delivered.

    +   ```

    +   gcloud pubsub subscriptions pull seek-demo-sub

    +   ```


    # Monitoring


    Monitoring Cloud Pub/Sub is a great way to keep your application and Cloud Pub/Sub
    healthy. Cloud Pub/Sub logs metrics to Cloud Monitoring. With Cloud Monitoring
    you can create dashboards to keep track of the metrics collecting allowing you
    to create alerts if things start to go wrong as making sure subscribers are keeping
    up with the flow of messages.


    To access Cloud Monitoring:


    +   1. Open the Monitoring in the Google Cloud Console:

    +      Monitoring'
  merge: -1
  img_proc: true

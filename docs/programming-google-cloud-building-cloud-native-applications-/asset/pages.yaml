- pgno: 76
  md: '![](img/eac8762c24ec77948aa0c3277f8e6eb3_76_0.png)


    Publisher


    Subscriber


    Figure 3-3. Message Queue


    Publish-subscribe messaging differs from message queues as they do allow multiple
    subscribers to receive messages. Publish-subscribe messaging pushes the messages
    immediately to all subscribers, which allows Cloud Pub/Sub to provide high throughput
    rates for incoming messages. Cloud Pub/Sub is a publish-subscribe messaging paradigm
    and delivers each published message at least once for every subscription. Once
    a message has been sent to a subscriber, the subscriber needs to acknowledge the
    message (Figure 3-4). Pub/Sub will continuously attempt to deliver a message that
    has not been acknowledged. By default, a message that cannot be delivered within
    the maximum retention time of 7 days is deleted and is no longer accessible. This
    typically happens when subscribers do not keep up with the flow of messages.'
  merge: -1
  img_proc: true

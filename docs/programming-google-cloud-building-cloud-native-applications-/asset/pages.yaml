  md: 'Figure 1-4. Cloud Pub/Sub


    # Gather Data from the Audio File


    At this point, we have an uploaded audio file, we have a function that was triggered
    and a message sitting in Pub/Sub. Cloud Pub/Sub is an asynchronous messaging service
    that allows applications to share data. This message contains a few key:value
    pairs, but one of the key values is the Speech-To-Text job name. To transcribe
    long audio files we used the asynchronous speech recognition method, which does
    not return the result of the transcription but rather the job name allowing us
    to check the status for when it completes the process of transcribing.


    How do we take the note from the bucket and read its content? Cloud Dataflow will
    allow us to build a pipeline that will read the message from Pub/Sub and enrich
    or transform the data as defined by the developer. Cloud Dataflow is a fully managed
    service for executing Apache Beam pipelines within Google Cloud. Apache Beam is
    an open-source model for executing batch and streaming pipelines. Figure 1-5 illustrates
    the pipeline that will be used in our framework.'

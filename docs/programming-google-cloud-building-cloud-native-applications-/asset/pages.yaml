    # Abstracted from the Cloud Infrastructure


    Abstraction from the cloud infrastructure can be a misleading term. When I first
    started learning about cloud native frameworks I always considered this a method
    of being cloud-agnostic: Build an application and deploy it to any cloud provider.
    However, abstraction from the cloud infrastructure is the decoupling of the application
    from the underlying infrastructure. But if decoupled it can we not run it on any
    cloud provider including on-prem? This where cloud native can be interpreted differently
    by the individual. We build cloud native applications as a method to provision
    resources, automate the application lifecycle, and be scalable and secure. However,
    there will always be a dependency on the cloud provider and their core requirements
    to build cloud-native applications. We need to take these into account when building
    our cloud-native application which we will throughout this book. But keep in mind
    that this book is about running cloud-native applications on Google Cloud, and
    for that we will focus on building a scalable and secure application with their
    services as much as possible.


    # Continuous Integration and Continuous Delivery


    One core component of cloud native applications is Continuous Integration (CI)
    and Continuous Delivery (CD) architecture. In our framework, we will use GitLab
    CI/CD services to create our deployment pipeline. We have ventured outside of

    | regional | boolean | Storage class as Regional. |

    | standard | boolean | Specify the storage class as Standard. |


    One important option when creating the bucket is choosing the class as well as
    if it will be multiRegional. Let''s review the storage classes available for Google
    Cloud as this will be an important choice from a cost perspective and will also
    make sure you''re choosing the appropriate class for your data access profile.


    The table below was taken from the Google Cloud storage documentation. This is
    current at the time of writing, but we recommend checking the Google Cloud documentation
    to confirm none of the SLAs have changed since the published date of the book:


    | Storage Class | Minimum storage duration | SLA |

    |---|---|---|

    | Standard Storage | None | >99.99% in multi-regions and dual-regions 99.99% in
    regions |

    | Nearline Storage | 30 days | 99.95% in multi-regions and dual-regions 99.9%
    in regions |

    | Coldline Storage | 90 days | 99.95% in multi-regions and dual-regions 99.9%
    in regions |

    | Archive Storage | 365 days | 99.95% in multi-regions and dual-regions 99.9%
    in regions |


    The minimum storage duration is a key metric to consider when choosing the class.
    Note that all classes perform the same from a latency perspective; what you need
    to consider is the access profile. In our framework, our files will be accessed
    fairly often because we''re providing users the ability to play the audio file.
    Due to its access profile, the standard class for our framework meets our requirements
    and will be the most effective. Google Cloud will charge you an early delete fee
    if the file is deleted before it has been stored for the duration of the class.


    > For example, suppose you store 1,000 GB of Coldline Storage data in the US multi-region.
    If you add the data on day 1 and then remove it on day 60, you are charged $14
    ($0.007/GB/mo. * 1,000 GB * 2 mo.) for storage from day 1 to 60, and then $7 ($0.007/GB/mo.
    * 1,000 GB * 1 mo.) for 30 days of early deletion from day 61 to 90. Cited from
    Google Cloud Storage documentation: https://cloud.google.com/storage/pricing#archival-pricing



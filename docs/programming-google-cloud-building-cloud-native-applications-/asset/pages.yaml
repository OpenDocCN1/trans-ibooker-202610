  md: 'to be creative with their functions. Our framework leverages the following
    external modules:


    ```

    const PubSub = require(`@google-cloud/pubsub`);

    const storage = require(''@google-cloud/storage'')();

    const speech = require(''@google-cloud/speech'').v1p1beta1;

    const client = new speech.SpeechClient();

    const uniqid = require(''uniqid'');

    const ffmpeg = require(''fluent-ffmpeg'');

    const ffmpegPath = require(''@ffmpeg-installer/ffmpeg'').path;

    ```


    The fluent-ffmpeg and ffmpeg-installer/ffmpeg allow our function to check the
    codec and length of the audio file. When submitting a job to Speech-to-Text for
    transcription we need to configure the sampleRateHertz parameter. Using the external
    libraries, we extract this information and pass it to the Speech-to-Text API.
    We are using the long-running job method available from the Speech-to-Text API.
    When we submit an audio file to be transcribed for a long-running job we need
    to wait for the API to complete, this process can take minutes to hours. The formula
    used is n/2 for how long the API will take to complete. For this we need to wait
    a certain amount of time before we check to see if the API is done.


    If we continuously poll the API we might hit a quota limit with Google Cloud.
    To avoid hitting a quota we only check the API for a completed job after the duration
    of the audio file divided by two is completed. Example: If the audio file is 1
    hour long we will only check the API for completion after 30 minutes have passed.

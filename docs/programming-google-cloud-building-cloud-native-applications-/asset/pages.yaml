- pgno: 31
  md: 'Another core component of applications is the ability to scale up and scale
    down. We achieve this with microservices where the state of the application is
    stored externally to the container. This allows instances to come up and down
    as required. This also allows each instance to work independently where each instance
    can service a request.


    > NOTE

    > If you want to learn more about Cloud Native Computing or get engaged in the
    community, visit The Cloud Native Computing Foundation (CNCF) website https://www.cncf.io/.


    This sounds awesome--creating microservices that are stateless, can come and go
    and can service requests independently of each other. The downside is the management
    of such an approach. How can we manage these services, secure them, set declarative
    statements for their state, and orchestrate this workflow? Kubernetes (k8s) fills
    this requirement. Kubernetes is an open-source container-orchestration application
    to manage the deployment, scaling, security and much more. Here are some key features
    of Kubernetes:


    +   1. Horizontal scaling

    +   2. Self-healing

    +   3. Automated rollouts and rollbacks

    +   4. Service discovery and load balancing

    +   5. Secret and configuration management


    Kubernetes is an open source project originally developed at Google and released
    as open source in 2014. I will say Kubernetes is a difficult concept to initially
    grasp, and when I first started learning about it and heard terms as pods I was
    ready to scream. However, Google Cloud has provided us another solution: Google
    Cloud'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'introduced the Google Kubernetes Engine which abstracts much of the complexity
    of managing a Kubernetes cluster. It provides Kubernetes as a managed service,
    no clustering software installs, no worries about confirming monitoring, basically
    a fully managed cluster by the company that created Kubernetes.


    I will cover Google Kubernetes Engine in greater detail in the future chapters.
    But for now, it’s worth covering a few high-level concepts as it will allow you
    to understand why Kubernetes engine fits nicely with cloud native applications.


    # Application Reliability


    Even though Google Cloud provides service-level agreements (SLAs) and has mechanisms
    in place to provide reliability, things to do fail. We need to consider how our
    application will handle failures in these situations. In the scalability section,
    I touched briefly on Kubernetes which alone would provide some form of fault tolerance
    as our cluster at a minimum would have three nodes. But if a Google Cloud region
    fails, our cluster would fail as well. Many of the Google Cloud services provide
    for regional failures as BigQuery others do not. We have to be mindful of each
    service and their respective fault-tolerance features.


    We can’t cover all the components in a single sitting, but each chapter will have
    a section on a cloud native checkpoint that will make sure we address the cloud
    native framework which includes application reliability. Besides large failures
    as a zonal or regional we also have to consider potential sources of failures
    like bugs in our code, human errors, and others when building our cloud native
    application.


    It also is a good idea to know Google Cloud regions and zones to start us thinking
    about how to manage those failures.


    # *Google Cloud Zone*


    Zones have high bandwidth and low-latency between other zones in the same region.
    A zone is an isolated location with a region'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Zones should be considered a single failure domain within a region


    # Google Cloud Region


    Regions are collections of zones. It is recommended to deploy applications across
    regions for high availability


    Regions are independent geographic locations


    Within regions tend to have round-trip network latencies of under <1ms on the
    95th percentile


    # Zonal Resources


    Zonal resources operate within a single zone


    If a Google Cloud zone becomes unavailable, all the zonal resources in that zone
    are unavailable


    # Regional Resources


    Regional resources are redundantly deployed across all the zones within a region
    Certain Google Cloud services like App Engine are a regional resource


    # Multiregional Resources


    A few managed services provided by Google Cloud are distributed across regions.
    The following have multiregional deployments options:


    +   - Datastore

    +   - Cloud Key Management Service

    +   - Cloud Storage

    +   - BigQuery

    +   - Cloud Spanner

    +   - Cloud Bigtable'
  merge: -1
  img_proc: true
- pgno: 34
  md: '+   - Cloud Healthcare API


    To build applications that can withstand zone failures, use regional resources,
    or build your application with resiliency across zones. To build applications
    that can withstand a loss of the entire region, use multiregional resources, or
    build resiliency with your applications.


    # Globally Accessible


    We did not cover this in the framework, but our application needs to be globally
    accessible as we will have users using the platform from different global regions.
    We need the users to ingress to Google Cloud as close as possible to their location
    and access the application nearest to their global region. We are in luck, Google
    Cloud provides us a managed service for load balancing with a global IP address.
    As stated on Google’s website “*Worldwide autoscaling and load balancing*”.'
  merge: -1
  img_proc: true

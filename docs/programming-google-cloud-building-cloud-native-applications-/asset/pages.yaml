- pgno: 39
  md: 'Identity Access Management (IAM) is a framework that implements policies for
    ensuring users and services have the proper access to resources. Google Cloud
    provides us a service to manage these Identity Access Management called Cloud
    IAM, simple and to the point name. Cloud IAM has three main components:


    # *Member*


    A member can be a Google Account user, a service account, a Google group, or a
    G Suite or Cloud Identity domain that can access a resource.


    # *Role*


    A role is a collection of permissions, permissions determine what is allowed on
    a resource.


    # *Policy*


    A policy binds members to a role.


    Let’s touch on permissions to give you a little bit of background about why IAM
    is important. (We’ll cover security for our framework in detail in later chapters).
    In the Google Cloud IAM world, permissions are represented in the form of **service.resource.verb**.
    This can become very complicated and confusing when we build our application with
    least privilege. To simplify the process of assigning permissions we use the concept
    of a role which is a collection of permissions. Google Cloud offers users lots
    of flexibility, you can use custom roles, or predefined roles. To make the process
    of managing permissions easier again we try to stay within the predefined roles
    Google Cloud provides us. For example, the predefined role Pub/Sub Publisher (roles/pubsub.publisher)
    provides access to only publish messages to a Pub/Sub topic.


    Besides IAM,cover user authentication will be covered in a future chapter, where
    we will leverage IAM, user authentication, logs and encryption to build a secure
    cloud native application.'
  merge: -1
  img_proc: true

    Hopefully, you’re seeing how practical this can be. Programmatically we can list
    the files in a bucket and extract the custom metadata to know that the audio file
    is associated with an agent or customer. For our framework, we will include the
    caller ID, customer ID, and other metrics to allow us to perform joins in BigQuery.
    We will cover BigQuery in detail in a later chapter, but for now, BigQuery is
    a fully-managed serverless data warehouse service provided by Google Cloud. Our
    data is analytical in nature, we need to query large amounts of data quickly to
    provide insights to our users and BigQuery fills this requirement. A join will
    allow our framework to join two datasets and use the customerID as the key field.
    This will allow us to show the metrics for a recorded call as well as the customer
    information.


    # Processing Audio Recordings


    In the framework design, you configure a Cloud Function to be triggered when you
    upload an audio file to the bucket. Cloud Functions is a service to create single-purpose
    functions that respond to events without requiring to manage the underlying infrastructure.
    Google Cloud functions have the following event methods:


    *HTTP*


    You can invoke Cloud Functions with an HTTP request using the POST, PUT, GET,
    DELETE, and OPTIONS HTTP methods.


    *Cloud Storage*'

    # Ordering Messages


    Cloud Pub/Sub is a highly scalable messaging service and allows “Google products
    including Ads, Search and Gmail use this infrastructure to send over 500 million
    messages per second, totaling over 1TB/s of data” - https://cloud.google.com/pubsub/architecture.
    Due to the highly scalable system, Pub/Sub does not guarantee the order of message
    delivery. Order is a complex architecture for messaging systems to implement at
    scale. It requires the messaging service to deliver a message and before sending
    the next message, it needs to guarantee the subscriber has received the message.
    The ordering of messages architecture puts a strain on incoming messages reducing
    the publisher to how many messages are accepted per second.


    If you need to handle message order, you can use an external service such as Cloud
    Firestore to store a unique ID and have the subscriber check Cloud Firestore which
    message it needs to process next. If you choose to go this route, you might consider
    not using Cloud Pub/Sub and instead utilize a service such as Firestore to be
    your messaging queue. At message delivery you will need to perform two actions:
    one to'

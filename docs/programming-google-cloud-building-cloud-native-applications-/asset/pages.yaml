  md: 'The event time is a timestamp specified by the Pub/Sub publisher application
    as an attribute of a Pub/Sub message, rather than the publish_time field set on
    a message by the Pub/Sub service itself. If the timestamp attribute is not specified
    at publish time the default timestamp that is used is the `publishTime` set on
    the Pub/Sub message by Cloud Pub/Sub.


    # Windowing


    When working with bounded datasets that have the same key within the data set
    you can use features such as GroupByKey. However, when working with unbounded
    data sets it’s impossible to group all the elements since new elements are constantly
    being added. Windowing enables you to group operations over the unbounded data
    set by dividing the data set into windows of finite collections according to their
    timestamps of the individual elements. You set the following windows with the
    Apache Beam SDK or Dataflow SQL streaming extensions:


    +   - Tumbling windows (called fixed windows in Apache Beam)

    +   - Hopping windows (called sliding windows in Apache Beam)

    +   - Session windows


    # Tumbling Windows


    A tumbling window represents a fixed interval duration in the data stream which
    is uniform across all keys. For example, if you set a sixty-second tumbling window,
    the elements with timestamp values [0:00:10-0:00:00] are in the first window.
    Elements with timestamp values [0:1:00-0:01:00] are in the second window. Figure
    4-10 illustrates how elements are divided by tumbling windows.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '![](img/eac8762c24ec77948aa0c3277f8e6eb3_128_0.png)


    Figure 4-10. Tumbling Windows called fixed windows in Apache Beam


    # Hopping Windows


    A hopping window has a fixed duration which sets the time interval for when you
    want to capture data. You define the time interval to capture the data and the
    period you want to start. As an example, you can have a one-minute window and
    a thirty-second period. Which means it will capture one minute worth of data every
    thirty seconds.


    Figure 4-11 illustrates how elements are divided by hopping windows.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '![](img/eac8762c24ec77948aa0c3277f8e6eb3_129_0.png)


    Figure 4-11. Hopping Windows called sliding windows in Apache Beam


    # Session Windows


    Session windows are data dependent windows, but they are not known ahead of time.
    Session windows will contain gaps of durations from other elements, for example;
    You collect metrics for IoT devices. These devices emit data events every second
    when they are in use. You need to understand and aggregate the utilization of
    the device’s data based on when they are in use. Since you don’t know ahead of
    time how long the devices are being used for something hoping for windows where
    you know the fixed duration would not work. You will still need a way of determining
    utilization. Session windows allow you to set the gap duration between events
    that can be aggregated into a session window. As an example in Figure 4-11, you
    set the minimum gap duration to one minute which is the threshold value of inactivity
    for a device, if data events arrive after the set gap duration the event data
    will be assigned to a new session window. If the data arrives within the gap duration
    then it will be assigned to the same session window. Using session windows with
    a minimum gap duration allows you to aggregate the utilization metrics of the
    IoT devices.'
  merge: -1
  img_proc: true

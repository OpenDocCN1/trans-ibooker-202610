    +   2. How will the endpoint be secured?

    +   3. What platform will the endpoint run on?

    +   4. Who will manage the platform?

    +   5. How will you monitor the platform not just for failures but for items as
    latency?

    +   6. How will you integrate testing and automated deployment?


    You can continue adding items to the checklist of things that need to be considered
    when building an API. But this is one reason we choose the route of Cloud Pub/Sub:
    there is no need to worry about most of the items listed above, and Cloud Pub/Sub
    intergrates nicely with Cloud Dataflow which will perform our extract, transform,
    load (ETL) process.


    Even with the current trend of API first design, we need to be thoughtful about
    when and where to use APIs. For example: When you have multiple consumers of your
    API, you need to be cautious of changes that can break the current version. You
    need to be aware of announcing the deprecation of features with enough time for
    developers to modify their code as needed. Or you need to have a plan in place
    to handle multiple versions simultaneously. By leveraging a Publish-Subscribe
    messaging paradigm all we need to do is stay current with the SDK of our chosen
    messaging platform. This makes for a Publish-Subscribe platform message extremely
    simple, flexible, and powerful interprocess communication (IPC) paradigm.


    Keep in mind that we’re not saying to replace APIs with a Publish-Subscribe platform.

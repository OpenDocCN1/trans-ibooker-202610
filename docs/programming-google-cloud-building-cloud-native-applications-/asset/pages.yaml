    # Cloud Native Checkpoint


    Let’s revisit the considerations we listed for our cloud-native architecture and
    how we addressed each one with Cloud Dataflow.


    +   1. Your application needs to be abstracted from the cloud infrastructure.
    Here you are using the Google Cloud Dataflow Runner. Choosing Cloud Dataflow as
    the runner allows you to focus on your pipeline and allows Cloud Dataflow to manage
    the resources on-demand and autoscale to achieve minimal latency and high resource
    utilization. The idea is that the same pipelines can be executed on different
    runners allowing for probability and choice of what runner to use.✓'
  merge: -1
  img_proc: true
- pgno: 164
  md: '2. You need a method of Continuous Integration and Continuous Delivery. You
    have not learned how to integrate CI/CD into your pipeline deployment. This is
    beyond the scope of this chapter, but the recommended approach is to leverage
    multiple deployment pipelines. For example: test, staging and production. You
    can perform unit tests on your code before deployment to validate a healthy pipeline
    before deploying it to production. In Chapter 8 you will learn how to integrate
    CI/CD into your pipeline deployment. ✓


    3. The application has to be able to scale up and scale down as needed. Cloud
    Dataflow manages the resources on-demand and autoscale to achieve minimal latency
    and high resource utilization. ✓


    4. How will the application manage failures? A key to managing failures will be
    for you to proactively monitor the application and Cloud Dataflow. In this chapter
    you learned how to review metrics and enable logging for Cloud Dataflow to provide
    a healthy pipeline. ✓


    5. The application needs to be globally accessible. This is not relevant for our
    data processing pipeline. If you did detect a failure in your pipeline, you could
    easily deploy it to another zone or region. Since a Cloud Pub/Sub Topic can have
    messages stored in multiple regions you have provided resilience in the queue.
    Cloud Dataflow can pick up where it left off in the event of a Pipeline failure.✓


    6. Our framework needs to be based on a microservice architecture. Not applicable
    yet but it will be once you deploy the application to Kubernetes.


    7. How will our application be secured? Cloud Dataflow is secured with Google
    Cloud Service Accounts. ✓



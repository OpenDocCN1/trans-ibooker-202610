    \  return pubsub\n    .topic(topicName)\n    .publisher()\n    .publish(dataBuffer)\n\
    \    .then(messageId => {\n      console.log(`Message ${messageId} published.`);\n\
    \      callback(null, 'Success!');\n    })\n    .catch(err => {\n      console.error('ERROR:',\
    \ err);\n    });\n}\n```\n\nIn the code snippet above, if we don’t receive the\
    \ messageId from Cloud Pub/Sub, we will raise an exception that will execute our\
    \ .catch() handler. We can add notifications or a log message in the .catch()\
    \ handler letting us know some failure has occurred. This acknowledgment from\
    \ Cloud Pub/Sub guarantees its delivery.\n\n# Message Queuing\n\nMessages queues\
    \ and publish-subscribe messaging can be confused as being the same thing. They\
    \ are very similar but subtle differences make them unique enough for us to highlight\
    \ each. A message queue is an asynchronous service to service communication method\
    \ to transfer messages. The message queue stores messages until they are processed,\
    \ and each message is only processed by one subscriber. When a message needs to\
    \ be received by multiple subscribers that is when you would use a publish-subscribe\
    \ messaging paradigm (Figure 3-3)."

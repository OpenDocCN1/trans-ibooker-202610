    # Pub/Sub or Pub/Sub Lite


    Google Cloud offers two versions of Cloud Pub/Sub: Cloud Pub/Sub, and Cloud Pub/Sub
    Lite. If you have predictable traffic patterns and you don’t require regional
    Pub/Sub then Cloud Pub/Sub Lite will be a more cost-effective solution. The following
    table is a comparison of Pub/Sub and Pub/Sub Lite from the Google Cloud Documentation
    located at https://cloud.google.com/pubsub/docs/choosing-pubsub-or-lite'

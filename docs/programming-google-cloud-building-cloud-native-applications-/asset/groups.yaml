    \ git clone 本章的示例代码。\n\nFigure 3-12 概述了示例中推送流程的工作方式。\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_85_0.png)\n\
    \nFigure 3-12. Cloud Pub/Sub Push Method\n\n在此示例中，你将向预配置的端点发送一条 Cloud Pub/Sub\

    \n## 消息队列\n\n消息队列和发布-订阅消息很容易被混淆为同一事物。它们非常相似，但细微的差异使它们足够独特，我们需要分别强调。消息队列是一种异步的服务到服务通信方法，用于传输消息。消息队列在被处理之前存储消息，并且每条消息仅由一个订阅者处理。当消息需要被多个订阅者接收时，这就是你会使用发布-订阅消息范式的时候（图\

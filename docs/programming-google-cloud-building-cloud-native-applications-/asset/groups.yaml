    | Storage Type | Zonal standard persistent disks | Regional standard persistent
    disks | Zonal SSD persistent disks | Regional SSD persistent disks | Local SSDs
    | Cloud Storage buckets |

    |---|---|---|---|---|---|---|

    | Minimum capacity per disk | 10 GB | 200 GB | 10 GB | 10 GB | 375 GB | n/a |

    | Maximum capacity per disk | 64 TB | 64 TB | 64 TB | 64 TB | 375 GB | n/a |

    | Capacity increment | 1 GB | 1 GB | 1 GB | 1 GB | 375 GB | n/a |

    | Maximum capacity per instance | 257 TB | 257 TB | 257 TB | 257 TB | 3 TB | Almost
    infinite |


    As you can see from the list, we are somewhat limited with persistent disks. Even
    if we choose to use zonal standard persistent disks and create an instance to
    store the audio files, our costs would be quite high. At the same time we start
    to move away from our cloud native approach as now we would need to manage a compute
    instance, attached persistent disks and we would need a way to monitor the storage
    for events as file creation to trigger a cloud function. At the time of this writing,
    a cost analysis:


    +   - Zonal Standard Persistent Disks

    +     - Disk One 64 TB: Total Estimated Cost: USD $2,621.44 per 1 month

    +     - Disk Two 64 TB: Total Estimated Cost: USD $2,621.44 per 1 month

    +     - Approximate Total per Month for 128 TB, USD $5,242 per 1 month

    +   - Cloud Storage Bucket

    +     - Approximate Total per Month for 128 TB, USD $2,621.44 per 1 month


    This cost analysis doesn''t account for the storage operations per month on the
    cloud storage or the compute instance cost for mounting the standard persistent
    disks. These numbers for storage are set for one year, but you have to consider
    what happens at year two, three, etc. Our persistent disk solution becomes complicated
    and expensive hence it makes the most sense to go the route of cloud storage buckets.


    You might be wondering about storage operations in Cloud Storage. An operation
    is an action that makes changes to or retrieves information about buckets and
    objects. Cloud Storage operations are divided into three categories: Class A,
    Class B, and free. Table 2-2 was cited from the Google Cloud Storage documentation
    at https://cloud.google.com/storage/pricing#price-tables; I would recommend visiting
    the documentation to confirm Class A, B and Free operations have not changed since
    the publication of this book:'
  - '[PAGE 43]


    | API or Feature | Class A Operations | Class B Operations | Free Operations |

    |---|---|---|---|

    | JSON API | storage.*.insert storage.*.patch storage.*.update storage.*.setIamPolicy
    storage.buckets.list storage.buckets.lockRetentionPolicy storage.notifications.delete
    storage.objects.compose storage.objects.copy storage.objects.list storage.objects.rewrite
    storage.objects.watchAll storage.projects.hmacKeys.create storage.projects.hmacKeys.list
    storage.*AccessControls.delete | storage.*.get storage.*.getIamPolicy storage.*.testIamPermissions
    storage.*AccessControls.list storage.notifications.list Each object notification
    | storage.channels.stop storage.buckets.delete storage.objects.delete storage.projects.hmacKeys.delete
    |

    | XML API | GET Service GET Bucket PUT POST | GET Bucket GET Object HEAD | DELETE
    |


    Let''s take a step back, and cover file storage, block storage, and object storage.


    # File Storage


    File storage stores data in a hierarchical structure. The data is saved in files
    and folders, and it is presented identically whether from the system serving the
    view or from the system retrieving data view. File storage is accessed traditionally
    via the Network File System protocol or Server Message Block protocol.


    # Block Storage


    Block storage is presented as either Storage Area Networks or locally attached
    disks. Block storage is usually mounted on an operating system as if the block
    device was locally attached storage. Once mounted locally, the user can create
    a file system to be used by the operating system: application or databases.


    # Object-Based Storage


    Object-based storage is accessible programmatically versus block storage which
    can only be accessed via an operating system. Object-based storage is also flat
    in nature; it does not have the hierarchical structure of file systems. Cloud
    Storage has no notion of folders, a folder is an object that happens to have "/"
    character in its name. Each object contains the data as well as the associated
    metadata which is distributed across multiple hardware systems to provide scalability
    and reliability.


    # Options for Getting Data to Cloud Storage


    > NOTE

    > You can practice along now or at a later time using Qwiklabs. The Qwiklabs Quest
    for this book is coming available soon.'

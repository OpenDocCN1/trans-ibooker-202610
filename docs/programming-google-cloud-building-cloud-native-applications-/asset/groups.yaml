    ## Ordering Messages


    Cloud Pub/Sub is a highly scalable messaging service and allows “Google products
    including Ads, Search and Gmail use this infrastructure to send over 500 million
    messages per second, totaling over 1TB/s of data” - https://cloud.google.com/pubsub/architecture.
    Due to the highly scalable system, Pub/Sub does not guarantee the order of message
    delivery. Order is a complex architecture for messaging systems to implement at
    scale. It requires the messaging service to deliver a message and before sending
    the next message, it needs to guarantee the subscriber has received the message.
    The ordering of messages architecture puts a strain on incoming messages reducing
    the publisher to how many messages are accepted per second.


    If you need to handle message order, you can use an external service such as Cloud
    Firestore to store a unique ID and have the subscriber check Cloud Firestore which
    message it needs to process next. If you choose to go this route, you might consider
    not using Cloud Pub/Sub and instead utilize a service such as Firestore to be
    your messaging queue. At message delivery you will need to perform two actions:
    one to deliver the message to Pub/Sub and the second write to Firestore. This
    also applies to the subscriber since the subscriber needs to read from Firestore
    and then pull the message from Cloud Pub/Sub. These additional steps also introduce
    latency to your application.


    As an alternative approach, if you have a single publisher and single subscriber,
    you can sequence the messages with a counter. In the following exercise, we will
    configure a for loop which will send 100 messages to Pub/Sub, and you will then
    configure a single subscriber which uses a persistent counter to order the messages.
    We need to use the counterid variable as a message attribute when you publish
    the message as well as match the counterid variable starting value in the subscriber.


    - 1. If you have not cloned the repository, go ahead and clone the following repository:

    - 2. In your favorite IDE, go to **chapter-three/pub-sub**

    - 3. Within in this folder run in your terminal npm install --save @google-cloud/pubsub

    - 4. Edit the sendMessageLoadOrder.js file in your favorite IDE

    - 5. Change the **topicName** variable to the topic you created above, if you
    haven’t created a topic create a Pub/Sub topic first.

    - 6. Change the data variable to a message of your choice

    - 7. In your favorite IDE edit the getMessageOrder.js and change the subscriptionName
    to your subscription, if you have not created a subscription go ahead and create
    one first.

    - 8. Run the following command: node getMessageOrder.js

    - 9. The above command will wait and listen for new messages

    - 10. Run the following command to send 100 messages in a new terminal node sendMessageLoadOrder.js

    - 11. Go back to the terminal you run the getMessageOrder.js and you will notice
    the messages being processed in order. It should look like Figure 3-15


    ![](img/eac8762c24ec77948aa0c3277f8e6eb3_93_0.png)


    *Figure 3-15. Terminal Output of Message Order being Processed*


    Since Cloud Pub/Sub does not guarantee the order of messages you can use the steps
    outlined in this exercise to order messages if your application requires order.


    ## Replaying and purging messages


    Once a message has been acknowledged, the message is not longer accessible to
    subscribers of a given subscription. In addition, the subscribers must process
    every message in a subscription --even if only a subset is needed.


    The Cloud Pub/Sub Seek feature extends the subscriber functionality to allow you
    to alter the acknowledgement state of messages. You can replay previously acknowledged
    messages, plus you can copy the state of one subscription to another by using
    seek in combination with a Snapshot.


    Using the Seek feature allows you to recover from unexpected subscriber problems,
    perform acknowledgement on a backlog of messages that are no longer relevant,
    and deploy new code features without accidentally acknowledging messages.


    ### Create and Seek to Snapshots


    - 1. Create a topic and a subscription, run the following commands:

    ```

    gcloud pubsub topics create seek-demo-topic

    gcloud pubsub subscriptions create seek-demo-sub --topic=seek-demo-topic --ack-deadline=1

    ```

    - 2. There are no messages in the subscription that have been acknowledged. Capture
    this state by creating a snapshot:

    ```

    gcloud pubsub snapshots create my-snapshot --subscription=seek-demo-sub

    gcloud pubsub snapshots list

    ```

    - 3. Now publish, pull, and acknowledge a message:

    ```

    gcloud pubsub topics publish seek-demo-topic --message ''hello, world''

    gcloud pubsub subscriptions pull --auto-ack seek-demo-sub

    gcloud pubsub subscriptions pull --auto-ack seek-demo-sub

    ```

    - 4. You can recover the message by seeking the subscription to the snapshot.

    ```

    gcloud pubsub subscriptions seek seek-demo-sub --snapshot=my-snapshot

    gcloud pubsub subscriptions pull seek-demo-sub --auto-ack

    ```

    - 5. You can seek other subscriptions to the same snapshot, as long as the subscription''s
    topic is the same as the snapshot''s topic

    ```

    gcloud pubsub subscriptions create seek-demo-sub2 --topic=seek-demo-topic --ack-deadline=10

    gcloud pubsub subscriptions seek seek-demo-sub2 --snapshot=my-snapshot

    ```

    - 6. Pulling from seek-demo-sub2 will now yield messages which were published
    before seek-demo-sub2 was created:

    ```

    gcloud pubsub subscriptions pull seek-demo-sub2 --auto-ack

    ```


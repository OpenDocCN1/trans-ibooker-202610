  mdcn: "\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_80_0.png)\n\nFigure 3-6. Cloud\
    \ Pub/Sub Architecture\n\n在图中你可能会注意到我们在 C Publisher 中重复了消息。Cloud Pub/Sub 允许一个主题拥有多个订阅者，让每个订阅者都能获取到消息的副本。我喜欢这样定义它：主题并不是消息的存储桶，而是订阅才是存储桶。当你创建一个主题时，可以创建多个订阅，并且当消息发送到主题时，它会被分发到已创建的订阅中。只有当订阅者在相应的订阅中确认消息时，消息才会被传递。让我们在\
    \ Figure 3-7 中回顾一条消息的生命周期，并更详细地检查它\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_81_0.png)\n\
    \nFigure 3-7. Life of a Cloud Pub/Sub Message\n\n使用 Cloud Pub/Sub 的推送订阅范式，Pub/Sub\
    \ 会将每条消息发送到订阅者应用的指定端点。\n\n+   1. 你或你的应用创建一个 Pub/Sub 主题（Figure 3-8）。\n\nFigure\
    \ 3-8. Screenshot of creating a Cloud Pub/Sub Topic\n\n+   2. 消息负载被发送到新创建的主题\n\
    \n+   3. Cloud Pub/Sub 将消息转发给订阅，每个订阅都会获得消息的副本。\n\n+   a. 消息将在订阅中保留长达 7 天，然后会被\

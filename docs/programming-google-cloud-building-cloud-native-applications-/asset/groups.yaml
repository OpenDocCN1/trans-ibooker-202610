    # Cloud Native Checkpoint


    让我们再次回顾我们为云原生架构列出的考虑因素，以及我们如何通过 Cloud Pub/Sub 解决每个问题。


    +   1. 我们的应用程序需要从云基础设施中抽象出来。在这里你使用 Cloud Pub/Sub，它使你免于管理队列系统，无需担心可扩展性，并让你专注于应用程序功能。✓


    +   2. 我们需要一种持续集成和持续交付的方法。这对于 Cloud Pub/Sub 不适用，因为管理消息的代码将由 Cloud Functions 和
    Cloud Dataflow 处理。✓

    +   3. 我们的应用程序必须能够根据需要扩展和缩减。“Google 产品包括 Ads、Search 和 Gmail 使用此基础设施每秒发送超过 5 亿条消息，总计超过
    1TB/s 的数据” - https://cloud.google.com/pubsub/architecture ✓

    +   4. 我们的应用程序将如何管理故障？管理故障的关键是主动监控应用程序和 Cloud Pub/Sub。在本书第 X 章的监控部分，你学习了如何为未确认的消息启用警报。这将是提供可靠服务的一个关键组件，因为它能让你知道
    Cloud Pub/Sub 何时不健康。✓

    +   5. 应用程序需要全局可访问。单条消息存储在单个区域，但主题可以有存储在多个区域的消息。✓

    +   6. 我们的框架需要基于微服务架构。尚不适用，但一旦你将应用程序部署到 Kubernetes 后就会适用。

    +   7. 我们的应用程序将如何得到保护？在本章中你学习了如何使用个人凭据使用 Cloud Pub/Sub 库，你还使用 GitLab 和受限服务账号将应用程序部署到
    Cloud Functions。✓


    # Closing Remarks


    在本章中你学习了 Cloud Pub/Sub 以及它如何应用于云原生应用程序。Cloud Pub/Sub 是一个强大的服务，允许应用程序在彼此之间传递消息而不会引入延迟。它根据需要进行扩展，并且由于它是托管服务，它让你专注于应用程序代码。你还部署了应用程序的第一部分，并且随着章节的进展你将继续在此基础上构建。在下一章，你将学习
    Cloud Dataflow。这将是本章中你创建的 Cloud Pub/Sub 主题的订阅者，以检索由 Cloud Functions 发送的消息。Cloud
    Pub/Sub 是 Cloud Functions 和 Cloud Dataflow 之间的桥梁，而 Cloud Dataflow 将是我们丰富数据的过程。



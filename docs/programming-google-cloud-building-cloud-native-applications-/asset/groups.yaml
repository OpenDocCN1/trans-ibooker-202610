    # Chapter 5. Deploying the Application Data Pipeline


    # A NOTE FOR EARLY RELEASE READERS


    With Early Release ebooks, you get books in their earliest form—the author’s raw
    and unedited content as they write—so you can take advantage of these technologies
    long before the official release of these titles.


    This will be the 5th chapter of the final book. Please note that the GitHub repo
    will be made active later on.


    If you have comments about how we might improve the content and/or examples in
    this book, or if you notice missing material within this chapter, please reach
    out to the editor at mcronin@oreilly.com.


    In this chapter, you will deploy Cloud Dataflow and learn about Cloud Dataflow
    monitoring so you can have a healthy pipeline. This will be Part Two of your deployment
    of the fully functional cloud-native application.


    # Deploying the Cloud Dataflow Pipeline


    To deploy the Cloud Dataflow pipeline, run the commands below. The pipeline will
    perform the enrichment of the raw audio data leveraging Google Cloud Machine Learning
    APIs.


    +   1. Create a storage bucket for the Dataflow Staging Files:

    +      `gsutil mb gs://[BUCKET_NAME]/`


    +   2. Through the Google Cloud Console create a folder named tmp in the newly
    created bucket for the DataFlow staging files


    ```

    gsutil mb gs://[BUCKET_NAME]/

    ```'

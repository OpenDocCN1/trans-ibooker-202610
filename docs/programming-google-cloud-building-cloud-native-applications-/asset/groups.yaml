    for you that will guide you through the book, and Figure 1-1 shows the architecture
    we will work through.'
  - '[PAGE 7]


    # The Framework


    Figure 1-1. Framework Diagram


    The framework presented in this book uses Google Cloud AI services such as Speech-to-Text
    and Cloud Natural Language API. The framework also employs Pub/Sub, a messaging
    system, and Dataflow, a data processing framework, used for data streaming and
    transformation. The resulting framework consists of a cloud-native and server-less
    job running in Google Cloud. To implement the framework, you don’t need any machine
    learning experience, and all the data infrastructure needs, such as storage, scaling,
    and security, are managed by Google Cloud. While we have chosen Google Cloud as
    the platform, you have many choices such as Amazon Web Services and Azure. They
    both have similar offerings to Google


    ![](img/eac8762c24ec77948aa0c3277f8e6eb3_7_0.png)'
  - '[PAGE 8]


    Cloud that will allow you to translate the Framework components to their offerings
    to fully a working framework. However, we wanted a wide partner ecosystem of Business
    Intelligence Tools, as well as have Google scale querying for the large amounts
    of data that will be created from our transcription of the audio files thus Google
    Cloud is the best fit for our requirements.


    Throughout the book, cloud-native applications are loosely defined as an approach
    to building applications that take advantage of cloud computing resources. It
    is often associated with public clouds, but can also be used with on-prem clouds.
    Cloud native applications are defined by how they are deployed, rather than where
    they are deployed. A cloud-native application will leverage the perceived limitless
    resources available. For Google Cloud, a cloud-native application can scale up
    and down as needed, the application is built to use and release resources based
    on the rules defined.


    A cloud-native application leverages the framework of the cloud computing platform
    of choice. The methodology of designing and building the application needs to
    take into account the services provided by the chosen cloud provider. For our
    application, we have chosen Google Cloud. We need to take into account the following
    considerations for our framework:


    +   1. Our application needs to be abstracted from the cloud infrastructure.

    +   2. We need a method of Continuous Integration and Continuous Delivery.

    +   3. Our application has to be able to scale up and scale down as needed.

    +   4. How will our application manage failures?

    +   5. The application needs to be globally accessible as our fictional business
    Pigeon Travel operates multiple call centers globally.'

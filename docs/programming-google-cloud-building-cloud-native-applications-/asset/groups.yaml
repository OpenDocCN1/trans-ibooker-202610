    In this chapter, you learned about Cloud Dataflow. Cloud Dataflow is a fully managed
    data processing pipeline that allows you to perform transformations at scale on
    your data. Within this framework, you are leveraging it to enrich speech to text
    data to provide users analytics of audio recordings. In Chapter 5 you will deploy
    the second part of the application, and you will continue to build on this application
    as the chapters progress..



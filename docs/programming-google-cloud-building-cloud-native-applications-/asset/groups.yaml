    native application. Cloud Pub/Sub is a powerful service that allows applications
    to pass messages between each other without introducing latency. It scales as
    needed, and since it’s a managed service it allows you to focus on your application
    code. You also deployed the first part of the application, and you will continue
    to build on this application as the chapter progresses. In the next chapter, you
    will learn about Cloud Dataflow. This will be a subscriber to the Cloud Pub/Sub
    Topic you created in this chapter to retrieve the messages that were sent by Cloud
    Functions. Cloud Pub/Sub is the bridge between Cloud Functions and Cloud Dataflow,
    and Cloud Dataflow will be the process that enriches our data.


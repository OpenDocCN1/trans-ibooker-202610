    # Message Queues


    In the first chapter we covered an overview of Cloud Pub/Sub, so let’s dive a
    bit deeper here. Message queuing and Publish-Subscribe messaging allow applications
    to transfer messages between each other. In computer science, this paradigm is
    used for Inter-Process Communication (IPC) which allows software components to
    share data. This is an important part of a microservices architecture since microservices
    applications are distributed among multiple machines, and you will need a way
    for them to share data. We have multiple options to share data including RESTful
    APIs, which we will cover in later chapters. But for the current phase in our
    framework, we will be leveraging a queue which provides a method of using an asynchronous
    process which provides higher throughput in your application, by not requiring
    your application to block for new messages. You can see the message queue workflow
    in Figure 3-2.'

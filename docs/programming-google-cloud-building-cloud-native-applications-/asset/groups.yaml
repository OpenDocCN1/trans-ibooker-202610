    \ 和 Figure 3-11 中，你将看到我们推送到主题的简单消息，它包含消息正文和一个消息属性。订阅 A 和订阅 B 都收到了该消息。我们现在可以从订阅中拉取或推送消息，这将确认并从相应的订阅中移除消息。\n\
    \n![](img/eac8762c24ec77948aa0c3277f8e6eb3_83_0.png)\n\nFigure 3-10. Screenshot\

    # Cloud Native Checkpoint


    Let’s again revisit the considerations we listed for our cloud-native architecture
    and how we addressed each one with Cloud Pub/Sub.


    +   1. Our application needs to be abstracted from the cloud infrastructure. Here
    you are using Cloud Pub/Sub which abstracts you from having to manage a queueing
    system, not having to worry about scalability, and allowing you to focus on your
    application functionality. ✓'
  - '[PAGE 110]


    +   2. We need a method of Continuous Integration and Continuous Delivery. This
    is not applicable for Cloud Pub/Sub, since your code to manage messages will be
    handled by Cloud Functions and Cloud Dataflow. ✓

    +   3. Our application has to be able to scale up and scale down as needed. “Google
    products including Ads, Search and Gmail use this infrastructure to send over
    500 million messages per second, totaling over 1TB/s of data” - https://cloud.google.com/pubsub/architecture
    ✓

    +   4. How will our application manage failures? A key to managing failures will
    be for you to proactively monitor the application and Cloud Pub/Sub. In the monitoring
    section in Chapter X of this book, you learned how you can enable alerts for unacknowledged
    messages. This will be a key component to provide reliable service as knowing
    when Cloud Pub/Sub is unhealthy. ✓

    +   5. The application needs to be globally accessible. A single message is stored
    in a single region but a topic can have messages stored in multiple regions. ✓

    +   6. Our framework needs to be based on a microservice architecture. Not applicable
    yet but it will be once you deploy the application to Kubernetes.

    +   7. How will our application be secured? In this chapter you learned how to
    use the Cloud Pub/Sub libraries using your personal credentials, you also deployed
    your application to Cloud Functions using GitLab and a restricted service account.
    ✓


    # Closing Remarks


    In this chapter you learned about Cloud Pub/Sub and how it applies to the cloud
    native application. Cloud Pub/Sub is a powerful service that allows applications
    to pass messages between each other without introducing latency. It scales as
    needed, and since it’s a managed service it allows you to focus on your application
    code. You also deployed the first part of the application, and you will continue
    to build on this application as the chapter progresses. In the next chapter, you
    will learn about Cloud Dataflow. This will be a subscriber to the Cloud Pub/Sub
    Topic you created in this chapter to retrieve the messages that were sent by Cloud
    Functions. Cloud Pub/Sub is the bridge between Cloud Functions and Cloud Dataflow,
    and Cloud Dataflow will be the process that enriches our data.'

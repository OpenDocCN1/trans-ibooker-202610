    5. 你现在应该可以看到你的组已创建，所有 Apache Beam 管道都已分组到单个仪表板中，如图 5-17 所示


    ![](img/eac8762c24ec77948aa0c3277f8e6eb3_162_0.png)


    图 5-17. Cloud Logging 分组



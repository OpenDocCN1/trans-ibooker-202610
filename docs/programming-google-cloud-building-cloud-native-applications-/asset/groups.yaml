  - '[PAGE 9]


    +   6. Our framework needs to be based on a microservice architecture.

    +   7. How will our application be secured?


    As you think about these considerations, review Figure 1-1, and try to map each
    consideration to a section of the diagram. There are several steps to cover, but
    let’s begin with the first step: storing audio recordings.


    # Storing Audio Recordings


    The first step is getting the files to Google Cloud. For the upload we will use
    a tool called gsutil, which is a Python application that lets you access Google
    Cloud Storage from the command line. The basic idea is when the audio file is
    finished recording a job running on-prem would upload the file to Cloud Storage.
    When the audio file is uploaded to the bucket, we will use custom metadata that
    can identify the recording with categories like caller ID, customer ID, and other
    metrics collected from the contact center. To add custom metadata to a Cloud Storage
    object, you use the x-goog-meta prefix in the header with the -h flag. The following
    command shows an example:


    Do this from an account that has only Google Cloud Storage Object Creator role
    so that it can’t accidentally delete files.


    ```

    gsutil -h x-goog-meta-agentid:55551234 -h cp

    [FILENAME].flac gs://[BUCKET]

    ```


    Figure illustrates a sample of the metadata written with the gsutil command.'
  - '[PAGE 10]


    # demo_recording.flac metadata


    Object metadata is information that tells browsers and other systems how to handle
    your object, such as how to render, cache, or decompress it. Edit standard metadata
    properties below or add custom metadata of your own. Learn more


    | Key | Value |

    |---|---|

    | Content-Type | audio/flac |

    | Content-Encoding |  |

    | Content-Disposition |  |

    | Content-Language | en - English |

    | Cache-Control |  |

    | agentid | 12345 |

    | day | 12 |

    | month | 06 |

    | starttime | 10:21 |

    | year | 2020 |


    + Add item


    CANCEL   SAVE'
  - '[PAGE 11]


    You can retrieve the metadata programmatically which allows you to associate a
    file with multiple key:value pairs. As an example, below is how we can extract
    the custom metadata value for the agentid key.


    ```

    let agentId = object.metadata.agentid === undefined ? \

    ''undefined'' : object.metadata.agentid;

    ```


    Hopefully, you’re seeing how practical this can be. Programmatically we can list
    the files in a bucket and extract the custom metadata to know that the audio file
    is associated with an agent or customer. For our framework, we will include the
    caller ID, customer ID, and other metrics to allow us to perform joins in BigQuery.
    We will cover BigQuery in detail in a later chapter, but for now, BigQuery is
    a fully-managed serverless data warehouse service provided by Google Cloud. Our
    data is analytical in nature, we need to query large amounts of data quickly to
    provide insights to our users and BigQuery fills this requirement. A join will
    allow our framework to join two datasets and use the customerID as the key field.
    This will allow us to show the metrics for a recorded call as well as the customer
    information.


    # Processing Audio Recordings


    In the framework design, you configure a Cloud Function to be triggered when you
    upload an audio file to the bucket. Cloud Functions is a service to create single-purpose
    functions that respond to events without requiring to manage the underlying infrastructure.
    Google Cloud functions have the following event methods:


    *HTTP*


    You can invoke Cloud Functions with an HTTP request using the POST, PUT, GET,
    DELETE, and OPTIONS HTTP methods.


    *Cloud Storage*'
  - '[PAGE 12]


    Cloud Functions can respond to change notifications from Google Cloud Storage.
    These events can include object creation, deletion, archiving and metadata updates.


    # Cloud Pub/Sub


    Cloud Functions can be triggered by messages published to Pub/Sub topics.


    # Cloud Firestore


    Cloud Functions can handle events in Cloud Firestore such as create, update, delete,

    # Pipeline I/O


    Apache Beam I/O connectors let you read/write data into your pipeline and write
    output data. As an example, the Framework you are working with has a source of
    Cloud Pub/Sub and a sink of BigQuery. You can also write a custom I/O connector
    when connectors are not available for your data source or sink.


    The code snippet below is an example of using the Cloud Pub/Sub I/O connector
    as a source that is currently only supported in streaming.


    ```

    beam.io.ReadFromPubSub(subscription=known_args.input_subscription).with_output_types(bytes)

    ```


    The code snippet below is an example of using the BigQuery I/O connector as a
    sink.


    ```

    dlp_output | ''WriteToBigQuery'' >> beam.io.WriteToBigQuery(

    known_args.output_bigquery,

    schema=bigquery_table_schema,

    create_disposition=beam.io.BigQueryDisposition.CREATE_IF_NEEDED,


    write_disposition=beam.io.BigQueryDisposition.WRITE_APPEND

    )


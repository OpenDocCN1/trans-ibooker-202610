    \ npm install\n- 9. 在终端中运行 node uploadFile.js\n- 10. 执行成功后，应如下图 2-10 所示\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_58_0.png)\n\
    \n图 2-10. uploadFile.js 的代码截图\n\n太简单了！我们现在已通过编程方式将文件上传到我们的存储桶。\n\n## 下载文件\n\n\
    你可能需要的另一个选项是从 Cloud Storage 获取数据。我们创建了存储桶并上传了文件，但现在如何下载此文件呢？下面代码片段将下载你刚刚上传的文件到你定义本地位置。在第\
    \ 3 行你可以更改将要本地保存的文件名，以避免覆盖我们上传的现有文件：\n\n```\nconst bucketName = 'rui-costa-bucket-name-2020';\n\
    const srcFilename = 'rui_costa.jpg';\nconst destFilename = 'download_rui_costa.jpg';\n\
    // Imports the Google Cloud client library\nconst {Storage} = require('@google-cloud/storage');\n\
    // Creates a client\nconst storage = new Storage({\n    keyFilename: 'key.json',\n\
    \    projectId: 'ruicosta-blog'\n});\nasync function downloadFile() {\n    const\
    \ options = {\n        destination: destFilename,\n    };\n    // Downloads the\
    \ file\n    await storage.bucket(bucketName).file(srcFilename).download(options);\n\
    \    console.log(\n        `gs://${bucketName}/${srcFilename} downloaded to ${destFilename}.`\n\
    \    );\n}\ndownloadFile().catch(console.error);\n```\n\n要在桌面本地运行代码片段，请按以下步骤操作：\n\
    \n- 1. 如果你之前已克隆仓库，可以跳过此步骤。否则，在本地工作站上 git clone 以下仓库： https://gitlab.com/building-cloud-native-applications-google-cloud/chapter-two.git\n\
    - 2. 从克隆的仓库中，进入 Chapter 2 文件夹。\n- 3. 在你喜欢的编辑器中打开 downloadFile.js 文件。\n- 4. 在第\
    \ 1 行用你的存储桶名称替换\n- 5. 在第 2 行用你想要下载的文件替换\n- 6. 在第 3 行用你想要本地保存下载文件的名称替换\n- 7. 在第\
    \ 8 行将 “key.json” 替换为你下载的服务账号密钥。\n- 8. 在第 9 行将 “ruicosta-blog” 替换为你的项目 ID。\n-\
    \ 9. 如果你在本文件夹中之前步骤已运行 npm install，可以跳过此步骤：在本文件夹的终端中运行 npm install\n- 10. 在终端中运行\
    \ node downloadFile.js\n- 11. 执行成功后，应如下图 2-11 所示\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_60_0.png)\n\
    \n图 2-11. downloadFile.js 的代码截图\n\n现在我们玩得很开心。我们创建了一个存储桶，上传了一个文件，然后下载了该文件！恭喜。\n\
    \n## 使用 Python 的签名 URL\n\n到目前为止，我们一直专注于 Node.js 客户端库，但我们可以用其他语言执行迄今为止所做的一切操作。假设我想将存在于\
    \ Cloud Storage 中的文件发送到端点。我们可以通过对我们可用的签名 URL 方法来实现这一点。示例：我们想将 PDF 文件发送到端点以便端点将\
    \ PDF 转换为 PNG 文件。下面是示例代码，展示了如何在 Python 中使用签名 URL。\n\n签名 URL 是一个在有限时间内为用户和应用程序提供访问权限的\
    \ URL。签名 URL 允许用户在无需身份验证的情况下访问对象。在我们的框架中，我们通过 Identity Aware Proxy 对用户进行身份验证和授权。此时我们为有限时间生成一个签名\
    \ URL，允许用户播放相应的音频文件，该文件是 Cloud Storage 中的对象。\n\n> 注意\n> 任何拥有签名 URL 的人将在定义的时间段内能够对对象执行操作，例如读取对象。\n\
    \n```\nfrom google.cloud import storage\nstorage_client = storage.Client.from_service_account_json(service_acct)\n\
    bucket = storage_client.bucket(bucket_name)\nfor blob in bucket.list_blobs(prefix=str(prefix\
    \ + \"/\")):\n    if blob.name.endswith(\".png\"):\n        url_lifetime = 3600\
    \  # Seconds in an hour\n        serving_url = blob.generate_signed_url(expiration=url_lifetime,\
    \ version='v4')\n```\n\n让我们回顾一下代码片段。在第 5 行，我们有一个 for 循环，遍历第 3 行定义的存储桶名称。对于每个以\
    \ \".png\" 扩展名结尾的对象，我们生成一个签名 URL，其过期时间设置为 3600 秒。签名 URL 可以作为参数传递给端点。由于 URL 具有对象所需的身份验证和授权，因此端点在设定的时间内无需进行身份验证。Google\
    \ 使我们能够生成签名 URL 变得相当容易，这些 URL 允许用户或应用程序在无需身份验证或授权的情况下访问我们的对象。\n\n## 为我们的框架上传音频文件\n\
    \n现在我们对可用的存储选项有了很好的理解，并且练习了如何将数据传入和传出 Google Cloud，让我们继续了解我们将如何将数据获取到我们的云原生应用程序。对于我们的初始原型，我们将使用\
    \ gsutil 命令将音频文件上传到 Cloud Storage，并附带关联的自定义元数据。存储在 Cloud Storage 上的对象具有与相应对象关联的元数据。元数据提供有关对象的相关信息。例如，存储类别是一个键值对，说明对象属于哪个类别。键值对看起来像\
    \ storageClass:STANDARD。我们可以与对象关联的元数据有两种类型：\n\n- 固定键元数据：键由你定义，但你可以设置值的元数据。\n-\
    \ 自定义元数据：你通过客户端库或 gsutil 设置的元数据。\n\n在我们的框架中，元数据起着关键作用。以下命令是我们如何在框架中将音频文件上传到 Cloud\
    \ Storage 的方式。\n\n```\ngsutil -h x-goog-meta-callid:1234567 -h x-goog-meta-stereo:true\
    \ -h x-goog-meta-pubsubtopicname:[TOPIC_NAME] -h x-goog-meta-year:2019 -h x-goog-meta-month:11\
    \ -h x-goog-meta-day:06 -h x-goog-meta-starttime:1116 cp [YOUR_FILE_NAME.wav]\
    \ gs://[YOUR_UPLOADED_AUDIO_FILES_BUCKET_NAME]\n```\n\n此命令将使用以下键值对将音频文件上传到定义的存储桶：\n\
    \n- callid:1234567\n- stereo:true\n- pubsubtopicname:[TOPIC_NAME]\n- year:2019\n\
    - month:11\n- day:06\n- starttime:1116\n\n请记住，使用 gsutil 添加自定义元数据时，必须将元数据键以 x-goog-meta-\
    \ 为前缀。x-goog-meta 不会作为键的一部分存储，只有 x-goog-meta 前缀后的名称。例如，我们的 gsutil 命令具有自定义元数据键\
    \ x-goog-meta-stereo，然而 x-goog-meta 不会被存储，只有 stereo 将用作键名。\n\n"

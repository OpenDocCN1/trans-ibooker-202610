  - "[PAGE 66]\n\n# Variables\n\nEnvironment variables are applied to environments\
    \ via the runner. They can be protected by only exposing them to protected branches\
    \ or tags. Additionally, they can be masked so they are hidden in job logs, though\
    \ they must match certain regexp requirements to do so. You can use environment\
    \ variables for passwords, secret keys, or whatever you want. You may also add\
    \ variables that are made available to the running application by prepending the\
    \ variable key with KBS_SECRET_. More information\n\nEnvironment variables are\
    \ configured by your administrator to be protected by default\n\n| Type | Key\
    \ | Value | Protected | Masked | Environments |\n| Variable | PROJECT_ID | ****************\
    \ | ✓ | X | All (default) | |\n| Variable | SERVICE_ACCOUNT | ****************\
    \ | ✓ | X | All (default) | |\n\nFigure 2-12. GitLab Variables Screenshot\n\n\
    At this point you have created a service account and provided the service account\
    \ details to your GitLab project which will allow GitLab CI/CD to deploy the Cloud\
    \ Function to your Google Cloud project. To trigger a pipeline we will need to\
    \ create a .gitlab-ci.yml file, this file defines the order of the pipeline. Below\
    \ is our .gitlab-ci.yml file we will use to deploy our cloud function.\n\n```\n\
    image: google/cloud-sdk:latest\ndeploy_production:\n  stage: deploy\n  only:\n\
    \    - master\n  script:\n    - echo $SERVICE_ACCOUNT > ${HOME}/gcloud-service-key.json\n\
    \    - gcloud auth activate-service-account --key-file ${HOME}/gcloud-service-key.json\n\
    \    - gcloud --quiet --project $PROJECT_ID functions deploy safLongRunJobFunc\
    \ --runtime=nodejs8 --trigger-event=google.storage.object.finalize --trigger-resource=audio-uploads-42892\n\
    ```\n\nPipeline configuration begins with jobs. Jobs are the most fundamental\
    \ element of a configuration file. In our configuration file our job name is deploy_production.\
    \ Notice , the name displayed for our job in Figure 2-13."

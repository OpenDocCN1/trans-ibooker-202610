    7. 在 Create new alerting policy 页面中，定义告警条件和通知渠道。例如在图 5-18 中，条件已设置为 System Lab
    for Dataflow：


    +   8. 图 5-18 Cloud Logging 告警策略

    +   9. 输入所需的值，包括通知渠道。

    +   10. 完成后你可以查看你的告警策略示例



    \    });\n}\nreturn 0;\n};\n```\n\n## Receiving Messages with the Pull Method\n\
    \n在拉取交付中，你的应用会向 Pub/Sub 发起请求以从订阅中拉取消息。Cloud Pub/Sub 为不同编程语言提供了一系列 SDK。这使你能够将 Pub/Sub\

    # Signed URL with Python


    So far we have focused on the Node.js client library, but we can perform all the
    actions we have done thus far with other languages. Let''s say I wanted to send
    a file that was existing in Cloud Storage to an endpoint. One way we can accomplish
    this is via the signed URL method available to us. Example: We want to send a
    PDF file to the endpoint for the endpoint to convert the PDF to a PNG file. Below
    is a sample code that shows us how to use signed URLs in Python.


    Signed URLs is a URL that provides access to users and applications for a limited
    time. The signed URL allows users to access the object without authentication.
    In our framework, we authenticate and authorize the user via Identity Aware Proxy.
    At this point we generate a signed URL for a limited time that allows the user
    to play the respective audio file which is an object with Cloud Storage.


    > NOTE

    > Anyone who possesses the signed URL will be able to perform actions on the object
    as reading the object within the defined period of time.'
  - "[PAGE 61]\n\n```\nfrom google.cloud import storage\nstorage_client = storage.Client.from_service_account_json(service_acct)\n\
    bucket = storage_client.bucket(bucket_name)\nfor blob in bucket.list_blobs(prefix=str(prefix\
    \ + \"/\")):\n    if blob.name.endswith(\".png\"):\n        url_lifetime = 3600\
    \  # Seconds in an hour\n        serving_url = blob.generate_signed_url(expiration=url_lifetime,\
    \ version='v4')\n```\n\nLet's review the code snippet. On line 5, we have a for\
    \ loop that iterates through the defined bucket name on line 3. For each object\
    \ that ends with the extension of \".png\" we generate a signed URL with the expiration\
    \ time set to 3600 seconds. The signed URL could be passed as a parameter to an\
    \ endpoint. Since the URL has the needed authentication and authorization for\
    \ the object, the endpoint will not be required to authenticate for the set period\
    \ of time. Google makes it pretty easy for us to generate signed URLs that allow\
    \ users or applications to access our objects without requiring them to authenticate\
    \ or authorize.\n\n# Uploading Audio Files for Our Framework\n\nNow that we have\
    \ a good understanding of the storage options available as well as practicing\
    \ how to get data in and out of Google Cloud, let's move on to how we will get\
    \ data to our cloud-native application. For our initial prototype, we will use\
    \ the gsutil command to upload audio files to Cloud Storage with the associated\
    \ custom metadata. Objects stored on Cloud Storage have metadata associated with\
    \ the respective object. The metadata provides information about the object. For\
    \ example, the storage class is a key-value pair that tells which class the object\
    \ belongs to. The key-value pair would look something like storageClass:STANDARD.\
    \ There are two types of metadata that we can associate with objects:\n\n+   -\
    \ Fixed-key metadata: Metadata whose keys are defined for you, but you are able\
    \ to set the value.\n+   - Custom metadata: Metadata that you set via client libraries\
    \ or the gsutil.\n\nWithin our framework metadata plays a key role. The following\
    \ command is how we upload audio files within our framework to Cloud Storage.\n\
    \n```\ngsutil -h x-goog-meta-callid:1234567 -h x-goog-meta-stereo:true -h x-goog-meta-pubsubtopicname:[TOPIC_NAME]\
    \ -h x-goog-meta-year:2019 -h x-goog-meta-month:11 -h x-goog-meta-day:06 -h x-goog-meta-starttime:1116\
    \ cp [YOUR_FILE_NAME.wav] gs://[YOUR_UPLOADED_AUDIO_FILES_BUCKET_NAME]\n```\n\n\
    This command will upload an audio file to the defined bucket with the following\
    \ key-value pairs:\n\n+   - callid:1234567\n+   - stereo:true\n+   - pubsubtopicname:[TOPIC_NAME]\n\
    +   - year:2019\n+   - month:11\n+   - day:06\n+   - starttime:1116\n\nKeep in\
    \ mind that adding custom metadata with gsutil, you must prefix your metadata\
    \ key with x-goog-meta-. The x-goog-meta is not stored as part of the key, just\
    \ the name after the x-goog-meta prefix. For example, our gsutil command has a\
    \ custom metadata key of x-goog-meta-stereo, however, the x-goog-meta will not\
    \ be stored, stereo will be used as the key name only."
  md: "\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_57_0.png)\n\n## Upload a file\n\n\
    We created a bucket. Now, getting objects to the bucket is the fun part. In the\
    \ code snippet below we will upload a file called \"rui_costa.jpg\" to cloud storage\
    \ within the bucket named \"rui-costa-bucket-name-2020\".\n\n```\nconst bucketName\
    \ = 'rui-costa-bucket-name-2020';\nconst filename = 'rui_costa.jpg';\n// Imports\
    \ the Google Cloud client library\nconst {Storage} = require('@google-cloud/storage');\n\
    // Creates a client\nconst storage = new Storage({\n    keyFilename: 'key.json',\n\
    \    projectId: 'ruicosta-blog' }); async function uploadFile() {\n// Uploads\
    \ a local file to the bucket\nawait storage.bucket(bucketName).upload(filename,\
    \ {\n    metadata: {\n        cacheControl: 'public, max-age=31536000',\n    },\n\
    });\nconsole.log(` ${filename} uploaded to ${bucketName}.`);\n}\nuploadFile().catch(console.error);\n\
    ```\n\nTo run the code snippet locally on your desktop follow these steps:\n\n\
    - 1. If you cloned the repo before, you can skip this step: On your local workstation\
    \ git clone the following repository:https://gitlab.com/building-cloud-native-applications-google-cloud/chapter-two.git\n\
    - 2. From the cloned repository, go to the chapter-two folder.\n- 3. Open the\
    \ uploadFile.js file in your favorite editor.\n- 4. On line 1 replace with your\
    \ bucket name\n- 5. On line 2 replace with the file you want to upload\n- 6. On\
    \ line 7 replace the \"key.json\" with the service account key you downloaded.\n\
    - 7. On line 8 replace \"ruicosta-blog\" with your project id.\n- 8. If you run\
    \ npm install in a previous step within this folder you can skip this step: On\
    \ the terminal within this folder run npm install\n- 9. On the terminal run node\
    \ uploadFile.js\n- 10. On successful execution, it should look like Figure 2-10\n\
    \n![](img/eac8762c24ec77948aa0c3277f8e6eb3_58_0.png)\n\nFigure 2-10. Code Screenshot\
    \ for uploadFile.js\n\nThat was easy! We now programmatically uploaded a file\
    \ to our bucket.\n\n## Download the File\n\nAnother option you might need is getting\
    \ data out of Cloud Storage. We created buckets and uploaded a file but how can\
    \ we download this file now? The code snippet below will download the file you\
    \ just uploaded to the local location you define. On line 3 you can change the\
    \ name of the file that will be saved locally so as to not overwrite the existing\
    \ file we uploaded:\n\n```\nconst bucketName = 'rui-costa-bucket-name-2020';\n\
    const srcFilename = 'rui_costa.jpg';\nconst destFilename = 'download_rui_costa.jpg';\n\
    // Imports the Google Cloud client library\nconst {Storage} = require('@google-cloud/storage');\n\
    // Creates a client\nconst storage = new Storage({\n    keyFilename: 'key.json',\n\
    \    projectId: 'ruicosta-blog'\n});\nasync function downloadFile() {\n    const\
    \ options = {\n        destination: destFilename,\n    };\n    // Downloads the\
    \ file\n    await storage.bucket(bucketName).file(srcFilename).download(options);\n\
    \    console.log(\n        `gs://${bucketName}/${srcFilename} downloaded to ${destFilename}.`\n\
    \    );\n}\ndownloadFile().catch(console.error);\n```\n\nTo run the code snippet\
    \ locally on your desktop follow these steps:\n\n- 1. If you cloned the repo before,\
    \ you can skip this step. Otherwise, on your local workstation git clone the following\
    \ repository: https://gitlab.com/building-cloud-native-applications-google-cloud/chapter-two.git\n\
    - 2. From the cloned repository, go to the Chapter 2 folder.\n- 3. Open the downloadFile.js\
    \ file in your favorite editor.\n- 4. On line 1 replace with your bucket name\n\
    - 5. On line 2 replace with the file you want to download\n- 6. On line 3 replace\
    \ with the name you want to save the download file locally\n- 7. On line 8 replace\
    \ the “key.json” with the service account key you downloaded.\n- 8. On line 9\
    \ replace “ruicosta-blog” with your project id.\n- 9. If you run npm install in\
    \ a previous step within this folder you can skip this step: On the terminal within\
    \ this folder run npm install\n- 10. On the terminal run node downloadFile.js\n\
    - 11. On successful execution, it should look like Figure 2-11\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_60_0.png)\n\
    \nFigure 2-11. Code Screenshot for downloadFile.js\n\nNow we are having fun. We\
    \ created a bucket, uploaded a file, and then downloaded the file! Congratulations.\n\
    \n## Signed URL with Python\n\nSo far we have focused on the Node.js client library,\
    \ but we can perform all the actions we have done thus far with other languages.\
    \ Let's say I wanted to send a file that was existing in Cloud Storage to an endpoint.\
    \ One way we can accomplish this is via the signed URL method available to us.\
    \ Example: We want to send a PDF file to the endpoint for the endpoint to convert\
    \ the PDF to a PNG file. Below is a sample code that shows us how to use signed\
    \ URLs in Python.\n\nSigned URLs is a URL that provides access to users and applications\
    \ for a limited time. The signed URL allows users to access the object without\
    \ authentication. In our framework, we authenticate and authorize the user via\
    \ Identity Aware Proxy. At this point we generate a signed URL for a limited time\
    \ that allows the user to play the respective audio file which is an object with\
    \ Cloud Storage.\n\n> NOTE\n> Anyone who possesses the signed URL will be able\
    \ to perform actions on the object as reading the object within the defined period\
    \ of time.\n\n```\nfrom google.cloud import storage\nstorage_client = storage.Client.from_service_account_json(service_acct)\n\
    bucket = storage_client.bucket(bucket_name)\nfor blob in bucket.list_blobs(prefix=str(prefix\
    \ + \"/\")):\n    if blob.name.endswith(\".png\"):\n        url_lifetime = 3600\
    \  # Seconds in an hour\n        serving_url = blob.generate_signed_url(expiration=url_lifetime,\
    \ version='v4')\n```\n\nLet's review the code snippet. On line 5, we have a for\
    \ loop that iterates through the defined bucket name on line 3. For each object\
    \ that ends with the extension of \".png\" we generate a signed URL with the expiration\
    \ time set to 3600 seconds. The signed URL could be passed as a parameter to an\
    \ endpoint. Since the URL has the needed authentication and authorization for\
    \ the object, the endpoint will not be required to authenticate for the set period\
    \ of time. Google makes it pretty easy for us to generate signed URLs that allow\
    \ users or applications to access our objects without requiring them to authenticate\
    \ or authorize.\n\n## Uploading Audio Files for Our Framework\n\nNow that we have\
    \ a good understanding of the storage options available as well as practicing\
    \ how to get data in and out of Google Cloud, let's move on to how we will get\
    \ data to our cloud-native application. For our initial prototype, we will use\
    \ the gsutil command to upload audio files to Cloud Storage with the associated\
    \ custom metadata. Objects stored on Cloud Storage have metadata associated with\
    \ the respective object. The metadata provides information about the object. For\
    \ example, the storage class is a key-value pair that tells which class the object\
    \ belongs to. The key-value pair would look something like storageClass:STANDARD.\
    \ There are two types of metadata that we can associate with objects:\n\n- Fixed-key\
    \ metadata: Metadata whose keys are defined for you, but you are able to set the\
    \ value.\n- Custom metadata: Metadata that you set via client libraries or the\
    \ gsutil.\n\nWithin our framework metadata plays a key role. The following command\
    \ is how we upload audio files within our framework to Cloud Storage.\n\n```\n\
    gsutil -h x-goog-meta-callid:1234567 -h x-goog-meta-stereo:true -h x-goog-meta-pubsubtopicname:[TOPIC_NAME]\
    \ -h x-goog-meta-year:2019 -h x-goog-meta-month:11 -h x-goog-meta-day:06 -h x-goog-meta-starttime:1116\
    \ cp [YOUR_FILE_NAME.wav] gs://[YOUR_UPLOADED_AUDIO_FILES_BUCKET_NAME]\n```\n\n\
    This command will upload an audio file to the defined bucket with the following\
    \ key-value pairs:\n\n- callid:1234567\n- stereo:true\n- pubsubtopicname:[TOPIC_NAME]\n\
    - year:2019\n- month:11\n- day:06\n- starttime:1116\n\nKeep in mind that adding\
    \ custom metadata with gsutil, you must prefix your metadata key with x-goog-meta-.\
    \ The x-goog-meta is not stored as part of the key, just the name after the x-goog-meta\
    \ prefix. For example, our gsutil command has a custom metadata key of x-goog-meta-stereo,\
    \ however, the x-goog-meta will not be stored, stereo will be used as the key\
    \ name only.\n"
  mdcn: "\n\n![](img/eac8762c24ec77948aa0c3277f8e6eb3_57_0.png)\n\n## 上传文件\n\n我们创建了一个存储桶。现在，将对象上传到存储桶就是有趣的部分了。下面代码片段中，我们将把名为\

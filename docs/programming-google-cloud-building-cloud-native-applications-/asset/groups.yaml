    \ e. 点击 Create。一个包含密钥的 JSON 文件将下载到您的计算机。\n   f. 我们将使用此 JSON 来授权我们的示例代码访问 Cloud\
    \ Storage API。\n\n## Create a Bucket\n\n下面的代码提供了如何使用 Node.js cloud storage 客户端库创建存储桶的示例。它将在开发者定义的位置创建存储桶。在此代码片段中，存储桶名称定义为\

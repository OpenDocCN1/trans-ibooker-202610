    +   - ACLs allow you to set restrictions such as reading, writing or deleting
    objects.


    You will need to install the gsutil if you choose to run it locally on your desktop.
    You can visit the following link to learn how to install the gsutil application:

    https://cloud.google.com/storage/docs/gsutil_install


    # Create a Bucket with gsutil


    Run the following command to create a bucket, keeping in mind the following flags:


    +   - -p: Set the project id for your new bucket


    +   - -c: Set the default storage class of your bucket


    +   - -l: Set the location of your bucket. For example, US-EAST1.


    +   - -b: Enable uniform bucket-level access for your bucket.


    ```

    gsutil mb gs://[BUCKET_NAME]/

    ```


    # Upload a File with gsutil


    The following command will upload a file to the respective bucket location.


    ```

    gsutil cp [LOCAL_OBJECT_LOCATION] gs://[DESTINATION_BUCKET_NAME]/

    ```


    # Download the File with gsutil


    The following command will download the object from the location set in the command
    line to the local location specified.


    ```

    gsutil cp gs://[BUCKET_NAME]/[OBJECT_NAME] [SAVE_TO_LOCAL_LOCATION]

    ```


    # NOTE


    You will notice we did not use the -p flag, which states which project to create
    the bucket. You can avoid using the -p flag if you have your default project set
    with gcloud as follows:


    ```

    gcloud config set project PROJECT

    ```


    # Using Client Libraries


    To integrate the ability to perform management tasks as well as user tasks within
    your application you will need to use client libraries. Google Cloud provides
    client libraries for C++, C#, Go, Java, Node.js, PHP, Python, and Ruby. Our framework
    will leverage the client libraries for Node.js. When an audio file is uploaded
    to Cloud Storage it will trigger the google.storage.object.finalize event which
    executes our cloud function(see Figure 2-5).'

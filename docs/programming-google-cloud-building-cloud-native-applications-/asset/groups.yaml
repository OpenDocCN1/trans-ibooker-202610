    # Security


    We covered security at a high-level IAP which allows us to authenticate and authorize
    users. That is one element of what we need to consider when designing a cloud
    native application. Other elements we need to consider are:


    +   1. Key Management

    +   2. Audit Logs

    +   3. Identity Access Management


    Each component of our framework will need to take these key elements into consideration
    as each component might provide different methods of securing it. You should also
    take note that security concerns require a dedicated book. While I cover as much
    as I can in this book (per the service provided by the framework), I recommend
    reading some of the documentation for the respective services for additional information.


    # Key Management


    Google Cloud encrypts data sitting on disk, and manages the keys, including rotation.
    I would say most customers leverage the default setting, but other customers want
    a little more flexibility. Google Cloud offers the following services for key
    management:


    +   1. Google Managed Keys

    +   2. Customer Managed Keys with Cloud Key Management Service

    +   3. Customer Managed keys with a third-party key management system


    The easiest option is to allow Google Cloud to manage the keys. However, if you
    choose to manage your keys, here is a simple'
  - "[PAGE 37]\n\nprocess to create and assign keys leveraging the Cloud Key Management\
    \ System.\n\nCreate a keyring named *pigeonkeyring*, and a key named *pigeonkey*.\n\
    \n```\ngcloud kms keyrings create \"pigeonkeyring\" \\\n    --location \"global\"\
    \ngcloud kms keys create \"pigeonkey\" \\\n    --location \"global\" \\\n    --keyring\
    \ \"pigeonkeyring\" \\\n    --purpose \"encryption\"\n```\n\nYou can use the list\
    \ option to view the name and metadata for the key that you just created.\n\n\
    ```\ngcloud kms keys list \\\n    --location \"global\" \\\n    --keyring \"pigeonkeyring\"\
    \n```\n\nLet’s store some text to be encrypted in a file called “pigeonsecret.txt”.\n\
    \n```\necho -n \"My super-secret message is encrypted\" > pigeonsecret.txt\n```\n\
    \nNow, let us encrypt the data with created key information, specify the name\
    \ of the plaintext file to encrypt, and specify the name of the file that will\
    \ contain the encrypted content:\n\n```\ngcloud kms encrypt \\\n    --location\
    \ \"global\" \\\n    --keyring \"pigeonkeyring\" \\\n    --key \"pigeonkey\" \\\
    \n    --plaintext-file ./pigeonsecret.txt \\\n    --ciphertext-file ./pigeonsecret.txt.encrypted\n\
    ```\n\nYou now have your message encrypted in the file, with your key and Cloud\
    \ KMS. So how do I read the contents of the encrypted file? To decrypt the data\
    \ with gcloud kms decrypt, provide your key information, specify the name of the\
    \ encrypted file to decrypt, and specify the name of the file that will contain\
    \ the decrypted content:"

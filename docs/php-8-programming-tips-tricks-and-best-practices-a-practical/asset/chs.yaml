  \n## 检查 PCRE 扩展变更\n\n**PCRE** 扩展包含许多用于使用 *正则表达式* 进行模式匹配的函数。术语 *正则表达式* 通常缩写为 *regex*。**regex**\
  \ 是一个描述另一个字符串的字符串。以下是 PCRE 扩展的一些变更。\n\n模式中的无效转义序列不再被解释为字面量。过去你可以使用 X 修饰符；然而，该修饰符在\
  \ PHP 8 中现在被忽略了。值得庆幸的是，为了帮助你处理内部 PCRE 模式分析错误，新增了 `preg_last_error_msg()` 函数，该函数在遇到\
  \ PCRE 错误时会返回人类可读的消息。\n\n`preg_last_error()` 函数允许你确定在模式分析期间是否发生内部 PCRE 错误。该函数仅返回一个整数。然而，在\
  \ PHP 8 之前，开发者需要自行查找代码并弄清楚实际的错误。\n\n> Tip\n> `preg_last_error()` 返回的错误代码列表可以在此处找到：\n\
  > https://www.php.net/manual/en/function.preg-last-error.php#refsect1-function.preg-last-error-returnvalues\n\
  \n下面是一个简短的代码示例，说明了上述问题。以下是导致此示例的步骤：\n\n1. 首先，我们定义一个执行匹配并检查是否发生错误的功能，如下所示：\n\n```\n\
  $pregTest = function ($pattern, $string) {\n    $result  = preg_match($pattern,\
  \ $string);\n    $lastErr = preg_last_error();\n    if ($lastErr == PREG_NO_ERROR)\
  \ {\n        $msg = 'RESULT: ';\n        $msg .= ($result) ? 'MATCH' : 'NO MATCH';\n\
  \    } else {\n        $msg = 'ERROR : ';\n        if (function_exists('preg_last_error_msg'))\n\
  \            $msg .= preg_last_error_msg();\n        else\n            $msg .= $lastErr;\n\
  \    }\n    return \"$msg\\n\";\n};\n```\n\n2. 我们然后创建一个故意包含 \\8+ 无效转义序列的模式，如下所示：\n\
  \n```php\n$pattern = '/\\8+/';\n$string = 'test 8';\necho pregTest($pattern, $string);\n\
  ```\n\n3. 接下来，我们定义一个故意导致 PCRE 超出其回溯限制的模式，如下所示：\n\n```php\n$pattern = '/(?:\\D+|<\\\
  d+>)*[!?]/';\n$string = 'test ';\necho pregTest($pattern, $string);\n```\n\n以下是\
  \ PHP 7.1 中的输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch07 ]# php php7_pcre.php\n\
  RESULT: MATCH\nERROR : 2\n```\n\n正如前面的输出所示，无效模式被视为字面值 8。因为字符串中存在 8，所以认为匹配被找到。至于第二个模式，回溯限制被超出；然而，PHP\
  \ 7.1 无法报告该问题，迫使你自行查找。\n\nPHP 8 中的输出截然不同，如下所示：\n\n```\nroot@php8_tips_php8 [ /repo/ch07\
  \ ]# php php7_pcre.php\nPHP Warning: preg_match(): Compilation failed: reference\
  \ to non-existent subpattern at offset 1 in /repo/ch07/php7_pcre.php on line 5\n\
  ERROR : Internal error\nERROR : Backtrack limit exhausted\n```\n\n正如前面的输出所示，PHP\
  \ 8 会产生一个 Warning 消息。你也可以看到 preg_last_error_msg() 产生了有用的消息。让我们现在来看一下国际化（Intl）扩展。\n\
  \n## 处理 Intl 扩展变更\n\n**Intl 扩展** 包含多个类，用于处理可能根据区域设置而变化的各种应用程序方面。各个类处理诸如国际化数字和货币格式化、文本解析、日历生成、时间和日期格式化以及字符集转换等任务。\n\
  \n在 PHP 8 中引入的 Intl 扩展的主要变更是以下新的日期格式：\n\n- IntlDateFormatter::RELATIVE_FULL\n- IntlDateFormatter::RELATIVE_LONG\n\
  - IntlDateFormatter::RELATIVE_MEDIUM\n- IntlDateFormatter::RELATIVE_SHORT\n\n下面是一个代码示例，展示了新的格式。以下是导致此示例的步骤：\n\
  \n1. 首先，我们定义一个 DateTime 实例和一个包含新格式代码的数组，如下所示：\n\n```php\n$dt = new DateTime('tomorrow');\n\
  $pt = [IntlDateFormatter::RELATIVE_FULL,\n    IntlDateFormatter::RELATIVE_LONG,\n\
  \    IntlDateFormatter::RELATIVE_MEDIUM,\n    IntlDateFormatter::RELATIVE_SHORT\n\
  ];\n```\n\n2. 我们然后遍历格式并回显输出，如下所示：\n\n```php\nforeach ($pt as $fmt)\n    echo IntlDateFormatter::formatObject($dt,\
  \ $fmt).\"\\n\";\n```\n\n此示例在 PHP 7 中不起作用。以下是 PHP 8 的输出：\n\n```\nroot@php8_tips_php8\
  \ [ /repo/ch07 ]#\nphp php8_intl_date_fmt.php\ntomorrow at 12:00:00 AM Coordinated\
  \ Universal Time\ntomorrow at 12:00:00 AM UTC\ntomorrow, 12:00:00 AM\ntomorrow,\
  \ 12:00 AM\n```\n\n\n\nAs you can see, the new relative date formats work quite\
  \ well! We now briefly return to the cURL extension.\n\n## 理解 cURL 扩展的变更\n\nThe\
  \ cURL extension leverages libcurl (http://curl.haxx.se/) to provide powerful and\
  \ highly efficient HTTP client capabilities. In PHP 8, you must have libcurl version\
  \ 7.29 (or above) installed on your server's operating system.\n\nAnother difference\
  \ in PHP 8 is that this extension now uses objects rather than resources. This change\
  \ was described earlier in this chapter, in Table 7.1, PHP 8 resource-to-object\
  \ migration. An example was shown in the Potential code break involving is_resource()\
  \ section. A side effect of this change is that any of the curl*close() functions\
  \ are redundant, as the connection is closed when the object is unset or otherwise\
  \ goes out of scope.\n\nLet's now have a look at changes to the COM extension.\n\
  \n## 回顾 COM 扩展的变更\n\n**组件对象模型（COM）** is a Windows-only extension that enables programming\
  \ code written in one language to call and interoperate with code written in any\
  \ other COM-aware programming language. This information is important for any PHP\
  \ developers who plan to develop PHP applications that run on Windows servers.\n\
  \nThe most significant change to the COM extension is that case sensitivity is now\
  \ automatically enforced. Accordingly, you can no longer import from type libraries\
  \ any constants that are case-insensitive. In addition, you can no longer specify\
  \ $case_insensitive, the second argument to the com_load_typelib() function, as\
  \ FALSE.\n\nAlong these lines, COM extension php.ini settings that deal with case\
  \ sensitivity have been altered. These include the following:\n\n- `com.autoregister_casesensitive`:\
  \ Permanently enabled in PHP 8.\n- `com.typelib_file`: Any type libraries whose\
  \ names end with either `#cis` or `#case_insensitive` no longer cause the constants\
  \ to be treated as case-insensitive.\n\nOne change is a new php.ini setting, com.dotnet_version.\
  \ This setting sets the **.NET** version to use for dotnet objects. We now examine\
  \ other extension changes of note.\n\n## 检查其他扩展变更\n\nThere are a few other changes\
  \ to other PHP extensions that deserve a mention. Table 7.5, shown next, summarizes\
  \ these changes:\n\n| 扩展 | 函数 | 备注 |\n|---|---|---|\n| Date | mktime()<br>gmmktime()\
  \ | 第一个参数（$hour）现在是强制性的 |\n| Enchant | enchant_broker_list_dicts()<br>enchant_broker_describe()<br>enchant_dict_suggest()\
  \ | 如果没有结果，这三个函数现在返回空数组而不是 NULL |\n| Tidy | tidy_repair_string() | $use_include_path\
  \ 参数不再受支持。 |\n\n表 7.5 – PHP 8 数据库库要求\n\nYou now have an idea about changes to extensions\
  \ in PHP 8. This wraps up the chapter. Now, it's time for a recap!\n\n## 摘要\n\n\
  One of the most important concepts you learned in this chapter is a general trend\
  \ away from resources and toward objects. You learned where this trend is noticeable\
  \ in the various PHP extensions covered in this chapter, and how to develop workarounds\
  \ to avoid problems in code that relies upon resources. You also learned how to\
  \ detect and develop code to address changes in XML extensions, especially in the\
  \ SimpleXML and XMLWriter extensions.\n\nAnother important extension with significant\
  \ changes covered in this chapter is the mbstring extension. You learned to detect\
  \ code that relies upon changed mbstring functionality. As you learned, changes\
  \ to the mbstring extension for the most part mirror changes made to the equivalent\
  \ core PHP string functions.\n\nYou also learned about major changes to the GD,\
  \ Reflection, and ZIP extensions. In this chapter, you also learned about changes\
  \ to a number of database extensions, as well as a medley of additional extension\
  \ changes to note. All in all, with the awareness you will have gained by reading\
  \ this chapter and by studying the examples, you are now in a better position to\
  \ prevent your applications from failing after you have performed a PHP 8 upgrade.\n\
  \nIn the next chapter, you will learn about functionality that has been deprecated\
  \ or removed in PHP 8.\n"
- "## 8 了解 PHP 8 中已弃用或移除的功能\n\nThis chapter walks you through functionality that has\
  \ been deprecated or removed in PHP Hypertext Preprocessor 8 (PHP 8). This information\
  \ is extremely important for any developer to know. Any code that uses removed functionality\
  \ must be rewritten before an upgrade to PHP 8. Likewise, any deprecation is a clear\
  \ signal to you that you must rewrite any code that depends upon such functionality,\
  \ or risk problems in the future.\n\nAfter you have read the material in this chapter\
  \ and followed the example application code, you can detect and rewrite code that\
  \ has been deprecated. You can also develop workarounds for functionality that has\
  \ been removed and learn how to refactor code that uses removed functionality involving\
  \ extensions. Another important skill you will learn from this chapter is how to\
  \ improve application security by rewriting code depending on removed functions.\n\
  \nTopics covered in this chapter include the following:\n\n- Discovering what has\
  \ been removed from the core\n- Examining core deprecations\n- Working with removed\
  \ functionality in PHP 8 extensions\n- Dealing with deprecated or removed security-related\
  \ functionality\n\n## 技术要求\n\nTo examine and run the code examples provided in this\
  \ chapter, the minimum recommended hardware is outlined here:\n\n- x86_64-based\
  \ desktop PC or laptop\n- 1 gigabyte (GB) free disk space\n- 4 GB of random-access\
  \ memory (RAM)\n- 500 kilobits per second (Kbps) or faster internet connection\n\
  \nIn addition, you will need to install the following software:\n\n- Docker\n- Docker\
  \ Compose\n\nPlease refer to the Technical requirements section of Chapter 1, Introducing\
  \ New PHP 8 OOP Features, for more information on Docker and Docker Compose installation,\
  \ as well as how to build the Docker container used to demonstrate the code explained\
  \ in this book. In this book, we refer to the directory in which you restored the\
  \ sample code for the book as /repo.\n\nThe source code for this chapter is located\
  \ here:\n\n```\nhttps://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices\n\
  ```\n\nWe can now begin our discussion by examining the core functionality removed\
  \ in PHP 8.\n\n## 发现核心中已移除的内容\n\nIn this section, we consider not only functions\
  \ and classes that have been removed from PHP 8, but we will also have a look at\
  \ usage that has been removed as well. We will then have a look at class methods\
  \ and functions that still exist but no longer serve any useful purpose due to other\
  \ changes in PHP 8. Knowing which functions have been removed is extremely important\
  \ in order to protect against a potential code break following a PHP 8 migration.\n\
  \nLet's start by examining functions removed in PHP 8.\n\n## 检查 PHP 8 中移除的函数\n\n\
  There are a number of functions in the PHP language that have only been retained\
  \ thus far in order to maintain backward compatibility. However, maintenance of\
  \ such functions drains resources away from core language development. Further,\
  \ for the most part, such functions have been superseded by better programming constructs.\
  \ Accordingly, there has been a slow process whereby such commands have been slowly\
  \ dropped from the language as evidence has mounted that they are no longer being\
  \ used.\n\n> **提示**\n> The PHP core team occasionally runs statistical analysis\
  \ on PHP repositories based on GitHub. In this way, they are able to determine the\
  \ frequency of usage of the various commands in the PHP core.\n\nThe table shown\
  \ next summarizes the functions that have been removed in PHP 8 and what to use\
  \ in their place:\n\n| 已移除函数 | 建议替代方案 |\n|---|---|\n| __autoload() | spl_autoload_register()\
  \ |\n| convert_cyr_string() | mb_convert_encoding() |\n| create_function() | function\
  \ () {}<br>fn () => <expression> |\n| each() | ArrayIterator |\n| ezmlm_hash() |\
  \ none other than running an OS command |\n| fgetss() | strip_tags(fgets()) |\n\
  | get_magic_quotes_gpc()<br>get_magic_quotes_runtime() | none: the magic quotes\
  \ feature itself has been removed from PHP |\n| hebrevc() | hebrev() |\n| is_real()\
  \ | is_float() |\n| money_format() | NumberFormatter::formatCurrency |\n| restore_include_path()\
  \ | ini_restore('include_path') |\n\n表 8.1 – PHP 8 移除的函数及建议替代方案\n\nFor the remainder\
  \ of this section, we cover a few of the more important removed functions and give\
  \ you suggestions on how to refactor your code to achieve the same results. Let's\
  \ start by examining each().\n\n## 使用 each()\n\neach() was introduced in PHP 4 as\
  \ a way of walking through an array, producing key/value pairs upon each iteration.\
  \ The syntax and usage of each() is extremely simple and is oriented toward procedural\
  \ usage. We'll show a short code example that demonstrates each() usage, as follows:\n\
  \n- 1. In this code example, we first open a connection to a data file containing\
  \ city data from the GeoNames (https://geonames.org) project, as follows:\n\n```\n\
  // /repo/ch08/php7_each.php\n$data_src = __DIR__\n    . '../sample_data/cities15000_min.txt';\n\
  $fh       = fopen($data_src, 'r');\n$pattern  = \"%30s : %20s\\n\";\n$target   =\
  \ 1000000;\n$data     = [];\n```\n\n\n\n2. 我们随后使用 fgetcsv() 函数将一行数据提取到 $line 中，并将纬度和经度信息打包到\
  \ $data 数组中。请注意，在下面的代码片段中，我们过滤掉了人口少于 $target 的城市的数据行（在本例中，少于 10 million）：\n\n```\n\
  while ($line = fgetcsv($fh, '', \"\\t\")) {\n    $popNum = $line[14] ?? 0;\n   \
  \ if ($popNum > $target) {\n        $city = $line[1] ?? 'Unknown';\n        $data[$city]\
  \ = $line[4] . ',' . $line[5];\n    }\n}\n```\n\n3. 我们随后关闭文件句柄并按城市名称对数组进行排序。为了呈现输出，我们使用\
  \ each() 遍历数组，生成键/值对，其中城市是键，经纬度是值。代码在下面的片段中说明：\n\n```\nfclose($fh);\nksort($data);\n\
  printf($pattern, 'City', 'Latitude/Longitude');\nprintf($pattern, '----', '------------------');\n\
  while ([$city, $latLon] = each($data)) {\n    $city = str_pad($city, 30, ' ', STR_PAD_LEFT);\n\
  \    printf($pattern, $city, $latLon);\n}\n```\n\n以下是它在 PHP 7 中显示的输出：\n\n```\nroot@php8_tips_php7\
  \ [/repo/ch08]# php php7_each.php\n                City :   Latitude/Longitude\n\
  \                ---- :   ------------------\n            Beijing :    39.9075,116.39723\n\
  \        Buenos Aires :   -34.61315,-58.37723\n              Delhi :    28.65195,77.23149\n\
  \              Dhaka :    23.7104,90.40744\n          Guangzhou :    23.11667,113.25\n\
  \           Istanbul :    41.01384,28.94966\n            Karachi :    24.8608,67.0104\n\
  ```\n\n| 城市 | 坐标 |\n|---|---|\n| Mexico City : | 19.42847,-99.12766 |\n| Moscow\
  \ : | 55.75222,37.61556 |\n| Mumbai : | 19.07283,72.88261 |\n| Seoul : | 37.566,126.9784\
  \ |\n| Shanghai : | 31.22222,121.45806 |\n| Shenzhen : | 22.54554,114.0683 |\n|\
  \ São Paulo : | -23.5475,-46.63611 |\n| Tianjin : | 39.14222,117.17667 |\n\n此代码示例在\
  \ PHP 8 中将无法工作，因为 each() 已被移除。*最佳实践*是转向 **面向对象编程（OOP）** 方法：改用 ArrayIterator 而不是\
  \ each()。下一个代码示例产生的结果与之前完全相同，但使用对象类而不是过程式函数：\n\n- 1. 而不是使用 fopen()，我们改为创建 SplFileObject\
  \ 实例。你还会注意到在下面的代码片段中，我们不是创建数组，而是创建 ArrayIterator 实例来保存最终数据：\n- 2. 我们随后使用 fgetcsv()\
  \ 方法遍历数据文件以检索一行，并使用 offsetSet() 将其追加到迭代中，如下所示：\n\n// /repo/ch08/php8_each_replacements.php\n\
  $data_src = __DIR__\n    . '../sample_data/cities15000_min.txt';\n$fh       = new\
  \ SplFileObject($data_src, 'r');\n$pattern  = \"%30s : %20s\\n\";\n$target   = 10000000;\n\
  $data     = new ArrayIterator();\n```\n\n```\nwhile ($line = $fh->fgetcsv(\"\\t\"\
  )) {\n    $popNum = $line[14] ?? 0;\n    if ($popNum > $target) {\n        $city\
  \ = $line[1] ?? 'Unknown';\n        $data->offsetSet($city, $line[4] . ',' . $line[5]);\n\
  \    }\n}\n```\n\n3. 最后，我们按键排序，回绕到顶部，并在迭代仍有更多值时循环。我们使用 key() 和 current() 方法检索键/值对，如下所示：\n\
  \n```php\n$data->ksort();\n$data->rewind();\nprintf($pattern, 'City', 'Latitude/Longitude');\n\
  printf($pattern, '----', '------------------');\nwhile ($data->valid()) {\n    $city\
  \ = str_pad($data->key(), 30, ' ', STR_PAD_LEFT);\n    printf($pattern, $city, $data->current());\n\
  \    $data->next();\n}\n```\n\n此代码示例实际上可在任何版本的 PHP 中运行，从 PHP 5.1 直到包括 PHP 8！输出与前面\
  \ PHP 7 的输出完全相同，此处不再重复。\n\n现在让我们来看看 create_function()。\n\n## 使用 create_function()\n\
  \n在 PHP 5.3 之前，将函数分配给变量的唯一方法是使用 create_function()。从 PHP 5.3 开始，首选方法是定义匿名函数。匿名函数虽然在技术上属于过程式编程应用程序编程接口（API）的一部分，但实际上是\
  \ Closure 类的实例，因此也属于 OOP 的范畴。\n\n> **提示**\n> 如果你需要的功能可以浓缩为单个表达式，在 PHP 8 中你也可以选择使用\
  \ **箭头函数。**\n\n当由 create_function() 定义的函数被执行时，PHP 内部会执行 eval() 函数。然而，这种架构的结果是别扭的语法。匿名函数的性能相当且更直观易用。\n\
  \n以下示例演示了 create_function() 的用法。此示例的目标是扫描 Web 服务器访问日志并按 Internet 协议（IP）地址对结果进行排序：\n\
  \n1. 我们首先以微秒为单位记录开始时间。稍后，我们使用此值来确定性能。以下是你需要的代码：\n\n// /repo/ch08/php7_create_function.php\n\
  $start = microtime(TRUE);\n```\n\n2. 接下来，使用 create_function() 定义一个回调，将每行开头的 IP 地址重新组织为每个恰好三位数字的统一段。我们需要这样做以便执行正确的排序（稍后定义）。create_function()\
  \ 的第一个参数是一个表示参数的字符串。第二个参数是要执行的实际代码。代码在下面的片段中说明：\n\n```\n$normalize = create_function(\n\
  \    '&$line, $key',\n    '$split = strpos($line, \" \");'\n    . '$ip = trim(substr($line,\
  \ 0, $split));'\n    . '$remainder = substr($line, $split);'\n    . '$tmp = explode(\"\
  .\", $ip);'\n    . 'if (count($tmp) === 4)'\n    . '    $ip = vsprintf(\"%03d.%03d.%03d.%03d\"\
  , $tmp);'\n    . '$line = $ip . $remainder;'\n);\n```\n\n请注意大量使用字符串。这种别扭的语法很容易导致语法或逻辑错误，因为大多数代码编辑器不会费力解释嵌入在字符串中的命令。\n\
  \n3. 接下来，我们定义一个用于与 usort() 一起使用的排序回调，如下所示：\n\n```\n$sort_by_ip = create_function(\n\
  \    '$line1, $line2',\n    'return $line1 <=> $line2;' );\n```\n\n4. 我们随后使用 file()\
  \ 函数将访问日志的内容提取到数组中。我们还将 $sorted 移动到文件中以保存排序后的访问日志条目。代码在下面的片段中说明：\n\n```\n$orig \
  \ = __DIR__ . '../sample_data/access.log';\n$log   = file($orig);\n$sorted = new\
  \ SplFileObject(__DIR__ .\n    './access_sorted_by_ip.log', 'w');\n```\n\n5. 然后我们能够使用\
  \ array_walk() 规范化 IP 地址，并使用 usort() 执行排序，如下所示：\n\n```\narray_walk($log, $normalize);\n\
  usort($log, $sort_by_ip);\n```\n\n6. 最后，我们将排序后的条目写入备用日志文件并显示开始和停止之间的时间差，如下所示：\n\n\
  ```\nforeach ($log as $line) $sorted->fwrite($line);\n$time = microtime(TRUE) -\
  \ $start;\necho \"Time Diff: $time\\n\";\n```\n\n我们没有展示完整的备用访问日志，因为它太长无法包含在书中。相反，这里是从列表中间提取的十几行，以让你了解输出的大致情况：\n\
  \n```\n094.198.051.136 - - [15/Mar/2021:10:05:06 -0400]    \"GET /\ncourses HTTP/1.0\"\
  \ 200 21530\n094.229.167.053 - - [21/Mar/2021:23:38:44 -0400]\n    \"GET /wp-login.php\
  \ HTTP/1.0\" 200 34605\n095.052.077.114 - - [10/Mar/2021:22:45:55 -0500]\n    \"\
  POST /career HTTP/1.0\" 200 29002\n095.103.103.223 - - [17/Mar/2021:15:48:39 -0400]\n\
  \    \"GET /images/courses/php8_logo.png HTTP/1.0\" 200 9280\n095.154.221.094 -\
  \ - [25/Mar/2021:11:43:52 -0400]\n    \"POST / HTTP/1.0\" 200 34546\n095.154.221.094\
  \ - - [25/Mar/2021:11:43:52 -0400]\n    \"POST / HTTP/1.0\" 200 34691\n095.163.152.003\
  \ - - [14/Mar/2021:16:09:05 -0400]\n    \"GET /images/courses/mongodb_logo.png HTTP/1.0\"\
  \ 200 11084\n```\n\n```\n095.163.255.032 - - [13/Apr/2021:15:09:40 -0400]\n\"GET\
  \ /robots.txt HTTP/1.0\" 200 78\n095.163.255.036 - - [18/Apr/2021:01:06:33 -0400]\n\
  \"GET /robots.txt HTTP/1.0\" 200 78\n```\n\n在 PHP 8 中，要完成相同的任务，我们定义匿名函数而不是使用 create_function()。以下是重写后的代码示例在\
  \ PHP 8 中可能的样子：\n\n1. 再次，我们首先记录开始时间，就像前面描述的 PHP 7 代码示例一样。以下是完成此操作所需的代码：\n\n// /repo/ch08/php8_create_function.php\n\
  $start = microtime(TRUE);\n```\n\n2. 接下来，我们定义一个回调，将 IP 地址规范化为四个各为三位数字的块。我们使用与前一个示例完全相同的逻辑；然而，这次我们以匿名函数的形式定义命令。这利用了代码编辑器助手，并且代码编辑器将每一行视为实际的\
  \ PHP 命令。代码在下面的片段中说明：\n\n```\n$normalize = function (&$line, $key) {\n    $split\
  \ = strpos($line, ' ');\n    $ip = trim(substr($line, 0, $split));\n    $remainder\
  \ = substr($line, $split);\n    $tmp = explode(\".\", $ip);\n    if (count($tmp)\
  \ === 4)\n        $ip = vsprintf(\"%03d.%03d.%03d.%03d\", $tmp);\n    $line = $ip\
  \ . $remainder;\n};\n```\n\n因为匿名函数中的每一行都被视为定义普通 PHP 函数一样处理，所以你不太可能出现拼写错误或语法错误。\n\
  \n3. 以类似的方式，我们以箭头函数的形式定义排序回调，如下所示：\n\n```\n$sort_by_ip = fn ($line1, $line2) =>\
  \ $line1 <=> $line2;\n```\n\n\n\nThe remainder of the code example is exactly the\
  \ same as described earlier and is not shown here. Likewise, the output is exactly\
  \ the same. The performance time is also approximately the same.\n\nWe now turn\
  \ our attention to money_format().\n\n## Working with money_format()\n使用 money_format()\n\
  \nThe money_format() function, first introduced in PHP 4.3, is designed to display\
  \ monetary values using international currencies. If you are maintaining an international\
  \ PHP-based website that has any financial transactions, you might be affected by\
  \ this change after a PHP 8 update.\n\nmoney_format() 函数首次在 PHP 4.3 中引入，旨在使用国际货币显示货币值。如果您维护的是具有任何金融交易的国际\
  \ PHP 网站，在 PHP 8 更新后您可能会受到此更改的影响。\n\nThe latter was introduced in PHP 5.3, and should\
  \ thus not cause your code to break. Let's have a look at a simple example involving\
  \ money_format() and how it can be rewritten to work in PHP 8, as follows:\n\n后者在\
  \ PHP 5.3 中引入，因此不应导致您的代码中断。让我们看一个涉及 money_format() 的简单示例，以及如何将其重写以在 PHP 8 中工作，如下所示：\n\
  \n- 1. We first assign an amount to a $amt variable. We then set the monetary locale\
  \ to en_US (**United States**, or **US**) and echo the value using money_format().\
  \ We use the %n format code for national formatting, followed by the %i code for\
  \ international rendering. In the latter case, the **International Organization\
  \ for Standardization (ISO)** currency code (**US Dollars**, or **USD**) is displayed.\
  \ The code is illustrated in the following snippet:\n- 1. 我们首先将一个金额赋给 $amt 变量。然后我们将货币区域设置设为\
  \ en_US（**美国**，或 **US**）并使用 money_format() 输出该值。我们使用 %n 格式代码进行国家/地区格式化，然后使用 %i 代码进行国际渲染。在后一种情况下，**国际标准化组织（ISO）**货币代码（**美元**，或\
  \ **USD**）将被显示。代码在以下片段中说明：\n- 2. We then change the monetary locale to de_DE (Germany)\
  \ and echo the same amount in both national and international formats, as follows:\n\
  - 2. 然后我们将货币区域设置更改为 de_DE（德国）并按如下方式以国家和国际格式输出相同金额：\n\n```php\n// /repo/ch08/php7_money_format.php\n\
  $amt = 1234567.89;\nsetlocale(LC_MONETARY, 'en_US');\necho \"Natl: \" . money_format('%n',\
  \ $amt) . \"\\n\";\necho \"Intl: \" . money_format('%i', $amt) . \"\\n\";\n```\n\
  \n```php\nsetlocale(LC_MONETARY, 'de_DE');\necho \"Natl: \" . money_format('%n',\
  \ $amt) . \"\\n\";\necho \"Intl: \" . money_format('%i', $amt) . \"\\n\";\n```\n\
  \nHere is the output in PHP 7.1:\n\n以下是 PHP 7.1 中的输出：\n\n```\nroot@php8_tips_php7\
  \ [ /repo/ch08 ]# php php7_money_format.php\nNatl: $1,234,567.89\nIntl: USD 1,234,567.89\n\
  Natl: 1.234.567,89 EUR\nIntl: 1.234.567,89 EUR\n```\n\nYou might note from the output\
  \ that money_format() did not render the Euro symbol, only the ISO code (EUR). It\
  \ did, however, properly format the amounts, using a comma for the thousands separator,\
  \ a period for the decimal separator for the en_US locale, and the reverse for the\
  \ de_DE locale.\n\n您可能会注意到，从输出中 money_format() 并未渲染欧元符号，仅显示 ISO 代码（EUR）。不过，它确实正确地格式化了金额，对于\
  \ en_US 区域设置，使用逗号作为千位分隔符，句点作为小数分隔符，而对于 de_DE 区域设置则相反。\n\nA best practice is to replace\
  \ any usage of money_format() with NumberFormatter::formatCurrency(). Here is the\
  \ preceding example, rewritten to work in PHP 8. Please note that the same example\
  \ will also work in any version of PHP from 5.3 onward! We'll proceed as follows:\n\
  \n最佳实践是用 NumberFormatter::formatCurrency() 替换任何 money_format() 的使用。以下是前述示例，重写后可在\
  \ PHP 8 中工作。请注意，相同的示例也适用于 PHP 5.3 及更高版本！我们将按如下方式进行：\n\n- 1. First, we assign the\
  \ amount to $amt and create a NumberFormatter instance. In creating this instance,\
  \ we supply arguments that indicate the locale and type of number—in this case,\
  \ currency. We then use the formatCurrency() method to produce the national representation\
  \ of this amount, as illustrated in the following code snippet:\n- 1. 首先，我们将金额赋给\
  \ $amt 并创建一个 NumberFormatter 实例。在创建此实例时，我们提供参数来指示区域设置和数字类型——在本例中为货币。然后我们使用 formatCurrency()\
  \ 方法生成该金额的国家表示形式，如以下代码片段所示：\n- 2. In order to produce the ISO currency code—in this\
  \ case, USD—we need to use the setSymbol() method. Otherwise, the default is to\
  \ produce the $ currency symbol instead of the USD ISO code. We then use the format()\
  \ method to render the output. Note the trailing space after USD in the following\
  \ code snippet. This is to prevent the ISO code from running into the number when\
  \ echoed!\n- 2. 为了生成 ISO 货币代码——在本例中为 USD——我们需要使用 setSymbol() 方法。否则，默认会生成 $ 货币符号而不是\
  \ USD ISO 代码。然后我们使用 format() 方法渲染输出。请注意以下代码片段中 USD 后面的尾随空格。这是为了防止 ISO 代码在回显时与数字连在一起！\n\
  \n```php\n// /repo/ch08/php8_number_formatter_fmt_curr.php\n$amt = 1234567.89;\n\
  $fmt = new NumberFormatter('en_US',\n    NumberFormatter::CURRENCY );\necho \"Natl:\
  \ \" . $fmt->formatCurrency($amt, 'USD') . \"\\n\";\n```\n\n```php\n$fmt->setSymbol(NumberFormatter::CURRENCY_SYMBOL,'USD\
  \ ');\necho \"Intl: \" . $fmt->format($amt) . \"\\n\";\n```\n\n- 3. We then format\
  \ the same amount using the de_DE locale, as follows:\n- 3. 然后我们使用 de_DE 区域设置格式化相同的金额，如下所示：\n\
  \n```php\n$fmt = new NumberFormatter( 'de_DE',\n    NumberFormatter::CURRENCY );\n\
  echo \"Natl: \" . $fmt->formatCurrency($amt, 'EUR') . \"\\n\";\n$fmt->setSymbol(NumberFormatter::CURRENCY_SYMBOL,\
  \ 'EUR');\necho \"Intl: \" . $fmt->format($amt) . \"\\n\";\n```\n\nHere is the output\
  \ from PHP 8:\n\n以下是来自 PHP 8 的输出：\n\n```\nroot@php8_tips_php8 [ /repo/ch08 ]#\n\
  php php8_number_formatter_fmt_curr.php\nNatl: $1,234,567.89\nIntl: USD 1,234,567.89\n\
  Natl: 1.234.567,89 €\nIntl: 1.234.567,89 EUR\n```\n\nAs you can see from the output,\
  \ the comma decimal is reversed between the en_US and de_DE locales, as expected.\
  \ You also see that both the currency symbols, as well as the ISO currency codes,\
  \ are correctly rendered.\n\n正如您从输出中看到的，逗号小数在 en_US 和 de_DE 区域设置之间是反转的，正如预期的那样。您还可以看到货币符号以及\
  \ ISO 货币代码都已正确渲染。\n\nNow that you have an idea of how to replace money_format(),\
  \ let's have a look at other programming code usage that has been removed in PHP\
  \ 8.\n\n现在您已经了解了如何替换 money_format()，让我们来看一下在 PHP 8 中已删除的其他编程代码用法。\n\n## Discovering\
  \ other PHP 8 usage changes\n发现其他 PHP 8 用法更改\n\nThere are a number of program code\
  \ usage changes that you need to be aware of in PHP 8. We'll start with a look at\
  \ two typecasts that are no longer allowed.\n\n在 PHP 8 中有许多程序代码用法更改您需要了解。我们将从查看两种不再允许的类型转换开始。\n\
  \n### Removed typecasts\n已移除的类型转换\n\nDevelopers often use forced typecasts in order\
  \ to ensure the data type of a variable is appropriate for a particular usage. As\
  \ an example, when processing a HyperText Markup Language (HTML) form submission,\
  \ for the sake of argument, let's say one of the form elements represents a monetary\
  \ amount. A quick and easy way to sanitize this data element is to typecast it to\
  \ a float data type, as follows:\n\n开发人员经常使用强制类型转换以确保变量的数据类型适合特定用途。例如，在处理超文本标记语言（HTML）表单提交时，为便于说明，假设表单元素之一代表货币金额。快速简便的清理此数据元素的方法是将其类型转换为\
  \ float 数据类型，如下所示：\n\n```\n$amount = (float) $_POST['amount'];\n```\n\nHowever,\
  \ rather than typecast to float, some developers prefer to use real or double. Interestingly,\
  \ all three produce exactly the same result! In PHP 8, the typecast to real has\
  \ been removed. If your code uses this typecast, a best practice is to change it\
  \ to float.\n\n然而，与其类型转换为 float，一些开发人员更喜欢使用 real 或 double。有趣的是，这三种方式产生的结果完全相同！在\
  \ PHP 8 中，类型转换为 real 已被移除。如果您的代码使用此类型转换，最佳实践是将其更改为 float。\n\nThe unset typecast\
  \ has also been removed. The purpose of this typecast is to unset a variable. In\
  \ the following code snippet, the value of $obj becomes NULL:\n\nunset 类型转换也被移除了。此类型转换的目的是取消设置变量。在以下代码片段中，$obj\
  \ 的值变为 NULL：\n\n```php\n$obj = new ArrayObject();\n/* some code (not shown) */\n\
  $obj = (unset) $obj;\n```\n\nA best practice in PHP 8 is to use either of the following:\n\
  \n在 PHP 8 中，最佳实践是使用以下任一方法：\n\n```php\n$obj = NULL;\n// or this:\nunset($obj);\n\
  ```\n\nLet's now turn our attention to anonymous functions.\n\n现在让我们将注意力转向匿名函数。\n\
  \n### Changes in generating anonymous functions from class methods\n从类方法生成匿名函数的更改\n\
  \nIn PHP 7.1, a new Closure::fromCallable() method was added that allows you to\
  \ return a class method as a Closure instance (for example, an anonymous function).\
  \ ReflectionMethod::getClosure() was also introduced and is also able to convert\
  \ a class method into an anonymous function.\n\n在 PHP 7.1 中，新增了 Closure::fromCallable()\
  \ 方法，允许您将类方法作为 Closure 实例（例如匿名函数）返回。ReflectionMethod::getClosure() 也被引入，并且也能将类方法转换为匿名函数。\n\
  \nTo illustrate this, we define a class that returns Closure instances able to perform\
  \ hashing using different algorithms. We'll proceed as follows:\n\n为了说明这一点，我们定义一个类，该类返回能够使用不同算法执行哈希的\
  \ Closure 实例。我们将按如下方式进行：\n\n- 1. First, we define a class and a public $class property,\
  \ as follows:\n- 1. 首先，我们定义一个类和一个公共 $class 属性，如下所示：\n- 2. We then define a method\
  \ that produces one of three callbacks, each designed to produce a different type\
  \ of hash, as follows:\n- 2. 然后我们定义一个方法，该方法生成三个回调之一，每个回调都设计用于生成不同类型的哈希，如下所示：\n\n\
  ```php\n// /repo/src/Services/HashGen.php\nnamespace Services;\nuse Closure;\nclass\
  \ HashGen {\n    public $class = 'HashGen: ';\n}\n```\n\n```php\npublic function\
  \ makeHash(string $type) {\n    $method = 'hashTo' . ucfirst($type);\n    if (method_exists($this,\
  \ $method))\n        return Closure::fromCallable(\n            [$this, $method]);\n\
  \    else\n```\n\n```php\nreturn Closure::fromCallable(\n    [$this, 'doNothing']);\n\
  }\n}\n```\n\n- 3. Next, we define three different methods, each producing a different\
  \ form of hash (not shown): hashToMd5 (), hashToSha256 (), and doNothing ().\n-\
  \ 3. 接下来，我们定义三种不同的方法，每种方法生成不同形式的哈希（未显示）：hashToMd5()、hashToSha256() 和 doNothing()。\n\
  - 4. In order to make use of the class, a calling program is devised that first\
  \ includes the class file and creates an instance, as follows:\n- 4. 为了使用该类，调用程序首先包含类文件并创建实例，如下所示：\n\
  \n```php\n// /repo/ch08/php7_closure_from_callable.php\nrequire __DIR__ . '../src/Services/HashGen.php';\n\
  use Services\\HashGen;\n$hashGen = new HashGen();\n```\n\n- 5. The callback is then\
  \ executed followed by var_dump () to view information about the Closure instance,\
  \ as illustrated in the following code snippet:\n- 5. 然后执行回调，然后使用 var_dump() 查看有关\
  \ Closure 实例的信息，如以下代码片段所示：\n\n```php\n$doMd5 = $hashGen->makeHash('md5');\n$text\
  \  = 'The quick brown fox jumped over the fence';\necho $doMd5($text) . \"\\n\"\
  ;\nvar_dump($doMd5);\n```\n\n- 6. To end this example, we create and bind an anonymous\
  \ class to the Closure instance, as illustrated in the following code snippet. Theoretically,\
  \ the output display should start with Anonymous if the anonymous class were truly\
  \ bound to $this:\n- 6. 为了结束此示例，我们创建一个匿名类并将其绑定到 Closure 实例，如以下代码片段所示。理论上，如果匿名类真正绑定到\
  \ $this，输出显示应以 Anonymous 开头：\n\n```php\n$temp = new class() { public $class = 'Anonymous:\
  \ '; };\n$doMd5->bindTo($temp);\necho $doMd5($text) . \"\\n\";\nvar_dump($doMd5);\n\
  ```\n\nHere is the output of this code example running in PHP 8:\n\n以下是此代码示例在 PHP\
  \ 8 中运行的输出：\n\n```\nroot@php8_tips_php8 [ /repo/ch08 ]#\nphp php7_closure_from_callable.php\n\
  HashGen: b335d9cb00b899bc6513ecdbb2187087\nobject(Closure)#2 (2) {\n[\"this\"]=>\
  \  object(Services\\HashGen)#1 (1) {\n\n[\"class\"]=>  string(9) \"HashGen: \"\n\
  }\n[\"parameter\"]=>  array(1) {\n    [\"$text\"]=>  string(10) \"<required>\"\n\
  }\n}\nPHP Warning:  Cannot bind method Services\\HashGen::hashToMd5() to object\
  \ of class class@anonymous in /repo/ch08/php7_closure_from_callable.php on line\
  \ 16\nHashGen: b335d9cb00b899bc6513ecdbb2187087\nobject(Closure)#2 (2) {\n    [\"\
  this\"]=> object(Services\\HashGen)#1 (1) {\n        [\"class\"]=>  string(9) \"\
  HashGen: \"\n    }\n    [\"parameter\"]=>  array(1) {\n        [\"$text\"]=>  string(10)\
  \ \"<required>\"\n    }\n}\n\n从输出中可以看到，Closure 只是忽略了绑定另一个类的尝试并产生了预期的输出。此外，还生成了一条\
  \ Warning 消息，通知你非法绑定尝试。\n\n现在让我们看看注释处理的差异。\n\n## 注释处理的差异\n\nPHP 传统上支持多种符号来表示注释。其中一个符号就是井号（#）。然而，由于引入了名为\
  \ Attributes 的新语言结构，井号紧跟在左方括号之后（# [）时不再允许表示注释。井号不紧跟左方括号的情况仍然作为注释分隔符。\n\n下面是一个在 PHP\
  \ 7 及更早版本中有效，但在 PHP 8 中无效的简短示例：\n\n```\n// /repo/ch08/php7_hash_bracket_comment.php\n\
  $test = new class() {\n    # This works as a comment\n    public $works = 'OK';\n\
  \    #[ This does not work in PHP 8 as a comment]\n    public $worksPhp7 = 'OK';\n\
  ```\n};\nvar_dump($test);\n\n当我们在 PHP 7 中运行此示例时，输出如预期所示，如下所示：\n\n```\nroot@php8_tips_php7\
  \ [ /repo/ch08 ]#\nphp php7_hash_bracket_comment.php\n/repo/ch08/php7_hash_bracket_comment.php:10:\n\
  class class@anonymous#1 (2) {\n    public $works =>  string(2) \"OK\"\n    public\
  \ $worksPhp7 =>  string(2) \"OK\"\n}\n```\n\n然而，同一个示例在 PHP 8 中会抛出致命的 Error 消息，如下所示：\n\
  \n```\nroot@php8_tips_php8 [ /repo/ch08 ]#\nphp php7_hash_bracket_comment.php\n\
  PHP Parse error:  syntax error, unexpected identifier \"does\",\nexpecting \"]\"\
  \ in /repo/ch08/php7_hash_bracket_comment.php on\nline 7\n```\n\n请注意，如果我们正确地构建了\
  \ Attribute 实例，该示例在 PHP 8 中可能偶然能工作。然而，由于所使用的语法与注释的语法一致，因此代码失败了。\n\n现在你已经对从 PHP 8\
  \ 中移除的函数和用法有了一定的了解，我们现在来检查核心弃用项。\n\n## 检查核心弃用项\n\n在本节中，我们检查在 PHP 8 中已弃用的函数和用法。随着\
  \ PHP 语言的不断成熟，PHP 社区能够建议 PHP 核心开发团队移除某些函数、类或甚至语言用法。如果三分之二的 PHP 开发团队投票赞成一项提案，它将被采纳以包含在语言的未来版本中。\n\
  \n对于要移除的功能，它不会立即从语言中删除。相反，函数、类、方法或用法会生成 Deprecation 通知。此通知用作通知开发人员该函数、类、方法或用法将在尚不确定的\
  \ PHP 版本中被禁止。因此，你必须密切关注 Deprecation 通知。未能这样做不可避免地会在未来导致代码中断。\n\n> **Tip**\n> \n\
  > 从 PHP 5.3 开始，正式的 **Request for Comments (RFC)** 流程启动。任何提案的状态都可以在 https://wiki.php.net/rfc\
  \ 查看。\n\n让我们先从参数顺序中的弃用用法开始检查。\n\n### 参数顺序中的弃用用法\n\n术语 *usage* 指的是你在应用程序代码中调用函数和类方法的方式。你会发现，在\
  \ PHP 8 中，过去允许的旧用法现在被认为是不良实践。了解 PHP 8 如何在代码用法中强制执行最佳实践有助于你编写更好的代码。\n\n如果你定义一个函数或方法，其中包含强制参数和可选参数的混合，大多数\
  \ PHP 开发者都同意可选参数应跟随强制参数。在 PHP 8 中，如果未遵循此用法最佳实践，将导致 Deprecation 通知。弃用此用法的理由是为了避免潜在的逻辑错误。\n\
  \n这个简单示例演示了这种用法差异。在下面的示例中，我们定义了一个接受三个参数的简单函数。请注意，$op 可选参数被夹在两个强制参数 $a 和 $b 之间：\n\
  \n```\n// /repo/ch08/php7_usage_param_order.php\nfunction math(float $a, string\
  \ $op = '+', float $b) {\n    switch ($op) {\n        // not all cases are shown\n\
  \        case '+' :\n        default :\n            $out = \"$a + $b = \" . ($a\
  \ + $b);\n    }\n    return $out . \"\\n\";\n}\n```\n\n如果我们在 PHP 7 中回显加法操作的结果，就不会有问题，如下所示：\n\
  \n```\nroot@php8_tips_php7 [ /repo/ch08 ]#\nphp php7_usage_param_order.php\n22 +\
  \ 7 = 29\n```\n\n然而在 PHP 8 中，会出现 Deprecation 通知，之后操作仍被允许继续。以下是 PHP 8 中运行的输出：\n\n\
  ```\nroot@php8_tips_php8 [ /repo/ch08 ]#\nphp php7_usage_param_order.php\nPHP Deprecated:\
  \ Required parameter $b follows optional parameter $op in /repo/ch08/php7_usage_param_order.php\
  \ on line 4\n22 + 7 = 29\n```\n\nDeprecation 通知是向开发者发出的信号，表明这种用法被认为是不良实践。在这种情况下，最佳实践是修改函数签名并先列出所有强制参数。\n\
  \n以下是可接受于所有 PHP 版本的重写示例：\n\n```\n// /repo/ch08/php8_usage_param_order.php\nfunction\
  \ math(float $a, float $b, string $op = '+') {\n    // remaining code is the same\n\
  }\n```\n\n需要注意的是，以下用法在 PHP 8 中仍然允许：\n\n```\nfunction test(object $a = null, $b)\
  \ {}\n```\n\n然而，更好的写法是重写相同的函数签名，同时仍遵循先列出强制参数的最佳实践，写法如下：\n\n```\nfunction test(?object\
  \ $a, $b) {}\n```\n\n你现在已经了解了从 PHP 8 核心中移除的功能。让我们现在看看 PHP 8 扩展中移除的功能。\n\n## 处理 PHP\
  \ 8 扩展中移除的功能\n\n在本节中，我们将看看 PHP 8 扩展中移除的功能。这些信息对于避免编写在 PHP 8 中无法工作的代码至关重要。此外，对移除功能的了解有助于你为\
  \ PHP 8 迁移准备现有代码。\n\n下表总结了扩展中移除的功能：\n\n| 扩展 | 移除的函数 | 建议的替代方案 |\n|---|---|---|\n\
  | Exif | read_exif_data() | exif_read_data() |\n| GD | image2wbmp()\n png2wbmp()\n\
  \ jpeg2wbmp() | 创建图像时按正常方式进行，然后使用 imagewbmp() |\n| GMP | gmp_random() | gmp_random_range()\
  \ 或 gmp_random_bits() |\n| Imap | imap_header() | imap_headerinfo() |\n| LDAP |\
  \ ldap_sort() | $res = ldap_search(); and then: usort($res); |\n| LDAP | ldap_control_paged_result()\n\
  \ ldap_control_paged_result_response() | $res = ldap_search(); and then implement\
  \ pagination using FilterIterator |\n| OCI8 | oci_internal_debug()\n ociinternaldebug()\
  \ | None |\n| Zlib | gzgetss() | strip_tags(gzgets()) |\n\n表 8.2 – 从 PHP 8 扩展中移除的函数\n\
  \n上表提供了有用的移除函数列表。在进行 PHP 8 迁移之前，请使用此列表检查现有代码。\n\n现在让我们看看 mbstring 扩展的一个可能严重的更改。\n\
  \n## 发现 mbstring 扩展更改\n\nmbstring 扩展有两个重大更改，具有巨大的向后兼容代码中断潜力。第一个更改是移除了大量便利别名。第二个重大更改是移除了对\
  \ mbstring PHP 函数重载能力的支持。让我们先看看移除的别名。\n\n### 处理 mbstring 扩展移除的别名\n\n应一些开发者的要求，负责此扩展的\
  \ PHP 开发团队慷慨地创建了一系列别名，将 mb_*() 替换为 mb*()。授予此请求的确切理由已在时间中丢失。然而，支持如此大量别名的负担，每次扩展需要更新时都会浪费大量时间。因此，PHP\
  \ 开发团队投票决定在 PHP 8 中从 mbstring 扩展中移除这些别名。\n\n下表提供了已移除别名的列表，以及应使用哪个函数来替代：\n\n| 别名\
  \ | 改用 |\n|---|---|\n| `mbereg` | `mb_ereg()` |\n| `mbereg_match` | `mb_ereg_match()`\
  \ |\n| `mbereg_replace` | `mb_ereg_replace()` |\n| `mbereg_search` | `mb_ereg_search()`\
  \ |\n| `mbereg_search_getpos` | `mb_ereg_search_getpos()` |\n| `mbereg_search_getregs`\
  \ | `mb_ereg_search_getregs()` |\n| `mbereg_search_init` | `mb_ereg_search_init()`\
  \ |\n| `mbereg_search_pos` | `mb_ereg_search_pos()` |\n| `mbereg_search_regs` |\
  \ `mb_ereg_search_regs()` |\n| `mbereg_search_setpos` | `mb_ereg_search_setpos()`\
  \ |\n| `mberegi` | `mb_eregi()` |\n| `mberegi_replace` | `mb_eregi_replace()` |\n\
  | `mbregex_encoding` | `mb_regex_encoding()` |\n| `mbsplit` | `mb_split()` |\n\n\
  表 8.3 – 已移除的 mbstring 别名\n\n现在让我们看一下字符串处理中的另一个重大变更，涉及函数重载。\n\n## 使用 mbstring 扩展函数重载\n\
  \n函数重载功能允许标准 PHP 字符串函数（例如，`substr()`）在 php.ini 指令 `mbstring.func_overload` 被赋予值时，被静默替换为其\
  \ mbstring 扩展等价物（例如，`mb_substr()`）。分配给此指令的值采用位标志的形式。根据此标志的设置，`mail()`、`str*()`、`substr()`\
  \ 和 `split()` 函数可能会受到重载的影响。此功能已在 PHP 7.2 中弃用，并在 PHP 8 中被移除。\n\n此外，与此功能相关的三个 mbstring\
  \ 扩展常量也已被移除。这三个常量是 `MB_OVERLOAD_MAIL`、`MB_OVERLOAD_STRING` 和 `MB_OVERLOAD_REGEX`。\n\
  \n> **提示**\n> \n> 有关此功能的更多信息，请访问以下链接：\n> \n> `https://www.php.net/manual/en/mbstring.overload.php`\n\
  \n任何依赖此功能的代码都将中断。避免严重应用程序故障的唯一方法是重写受影响的代码，并用预期的 mbstring 扩展函数替换被静默替换的 PHP 核心字符串函数。\n\
  \n在下面的示例中，当 mbstring.func_overload 启用时，PHP 7 对 strlen() 和 mb_strlen() 报告相同的值：\n\n\
  ```\n// /repo/ch08/php7_mbstring_func_overload.php\n$str = 'วันนี้สบายดีไหม';\n\
  $len1 = strlen($str);\n$len2 = mb_strlen($str);\necho \"Length of '$str' using 'strlen()'\
  \ is $len1\\n\";\necho \"Length of '$str' using 'mb_strlen()' is $len2\\n\";\n```\n\
  \n这里是 PHP 7 中的输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch08 ]#\nphp php7_mbstring_func_overload.php\n\
  Length of 'วันนี้สบายดีไหม' using 'strlen()' is 45\nLength of 'วันนี้สบายดีไหม'\
  \ using 'mb_strlen()' is 15\n\nroot@php8_tips_php7 [ /repo/ch08 ]#\necho \"mbstring.func_overload=7\"\
  \ >> /etc/php.ini\n\nroot@php8_tips_php7 [ /repo/ch08 ]#\nphp php7_mbstring_func_overload.php\n\
  Length of 'วันนี้สบายดีไหม' using 'strlen()' is 15\nLength of 'วันนี้สบายดีไหม'\
  \ using 'mb_strlen()' is 15\n```\n\n正如你从前面的输出中看到的，一旦在 php.ini 文件中启用了 mbstring.func_overload\
  \ 设置，strlen() 和 mb_strlen() 报告的结果是相同的。这是因为对 strlen() 的调用被静默重定向到 mb_strlen()。在 PHP\
  \ 8 中，输出（未显示）显示了两种情况下的结果，因为 mbstring.func_overload 设置被忽略。strlen() 报告的长度为 45，而 mb_strlen()\
  \ 报告的长度为 15。\n\n为了确定你的代码是否容易受到此向后兼容性破坏的影响，请检查你的 php.ini 文件，看看 mbstring.func_overload\
  \ 设置的值是否不为零。\n\n你现在已经知道在哪里查找与 `mbstring` 扩展相关的潜在代码破坏之处。现在，我们将注意力转向 Reflection 扩展的变更。\n\
  \n## 重写使用 Reflection*::export() 的代码\n\n在 Reflection 扩展中，PHP 8 与早期版本之间的一个关键区别是，所有\
  \ `Reflection*::export()` 方法都已被移除！此更改的主要原因是，简单地回显 Reflection 对象产生的效果与使用 `export()`\
  \ 完全相同。\n\n如果你有任何代码当前使用任何 `Reflection*::export()` 方法，你需要重写代码以改用 `__toString()` 方法。\n\
  \n## 发现其他已弃用的 PHP 8 扩展功能\n\n在本节中，我们回顾了 PHP 8 扩展中值得注意的许多其他重要已弃用功能。首先，我们来看 XML-RPC。\n\
  \n## 对 XML-RPC 扩展的更改\n\n在 PHP 8 之前的 PHP 版本中，XML-RPC 扩展是核心的一部分并且始终可用。从 PHP 8 开始，此扩展已悄然移至\
  \ **PHP 扩展社区库 (PECL)** (http://pecl.php.net/)，并且不再默认包含在标准 PHP 发行版中。你仍然可以安装并使用此扩展。此更改可以通过扫描\
  \ PHP 核心中扩展的列表在此处轻松确认：https://github.com/php/php-src/tree/master/ext。\n\n这不会导致向后兼容的代码破坏。然而，如果你执行标准\
  \ PHP 8 安装然后迁移包含对 XML-RPC 的引用的代码，你的代码可能会生成致命的 `Error` 消息并显示 XML-RPC 类和/或函数未定义的提示。在这种情况下，只需使用\
  \ `pecl` 或通常用于安装非核心扩展的任何其他方法安装 XML-RPC 扩展即可。\n\n现在我们将注意力转向 DOM 扩展。\n\n## 对 DOM 扩展所做的更改\n\
  \n自 PHP 5 以来，Document Object Model (DOM) 扩展在其源代码存储库中包含了一些从未实现的类。在 PHP 8 中，做出了支持\
  \ DOM 作为现行标准（类似于 HTML 5）的决定。现行标准不是具有一系列固定的版本，而是结合了持续的版本发布，以努力跟上网络技术。\n\n> **提示**\n\
  > \n> 有关拟议的 DOM 现行标准的更多信息，请查看此参考：https://dom.spec.whatwg.org/。有关将 PHP DOM 扩展迁移到现行标准基础的良好讨论，请查看\
  \ *第 9 章，掌握 PHP 8 最佳实践* 中的 *使用接口和特征* 部分。\n\n主要由于向现行标准的转变，以下未实现的类已于 PHP 8 起从 DOM\
  \ 扩展中移除：\n\n- `DOMNameList`\n- `DOMImplementationList`\n- `DOMConfiguration`\n-\
  \ `DOMError`\n- `DOMErrorHandler`\n- `DOMImplementationSource`\n- `DOMLocator`\n\
  - `DOMUserDataHandler`\n- `DOMTypeInfo`\n\n这些类从未实现，这意味着你的源代码不会遭受任何向后兼容性破坏。\n\n现在让我们看一下\
  \ PHP PostgreSQL 扩展中的弃用项。\n\n## 对 PostgreSQL 扩展所做的更改\n\n除了表 8.5 中指出的已弃用功能 – PHP\
  \ 8 扩展中的已弃用功能（稍后显示）之外，你需要知道在 PHP 8 PostgreSQL 扩展中已弃用了几十个别名。与从 mbstring 扩展中移除的别名一样，我们在本节中介绍的别名在别名名称的后半部分没有下划线字符。\n\
  \n本表总结了已移除的别名，以及应调用的函数：\n\n| 别名 | 改用 | 别名 | 改用 |\n|---|---|---|---|\n| pg_errormessage()\
  \ | pg_last_error() | pg_getlastoid() | pg_last_oid() |\n| pg_numrows() | pg_num_rows()\
  \ | pg_locreate() | pg_lo_create() |\n| pg_numfields() | pg_num_fields() | pg_lounlink()\
  \ | pg_lo_unlink() |\n| pg_cmdtuples() | pg_affected_rows() | pg_loopen() | pg_lo_open()\
  \ |\n| pg_fieldname() | pg_field_name() | pg_loclose() | pg_lo_close() |\n| pg_fieldsize()\
  \ | pg_field_size() | pg_loread() | pg_lo_read() |\n| pg_fieldtype() | pg_field_type()\

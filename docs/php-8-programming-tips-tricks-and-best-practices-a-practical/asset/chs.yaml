  \ | 不再重用连接\nflags 参数已移除 |\n| PostgreSQL | PGSQL_LIBPQ_VERSION_STR | PGSQL_LIBPQ_VERSION\
  \ |\n|  | pg_connect() | 现在必须使用连接字符串 |\n|  | pg_lo_import(), pg_lo_export() | 第一个参数现在是连接\

  \ https://wiki.php.net/rfc/magic-methods-signature.\n\n你现在已经有了需要查找的内容以及如何纠正涉及魔术方法的潜在代码破坏的思路。现在，让我们来看\
  \ Reflection 扩展方法签名更改。\n\n## 检查 Reflection 方法签名更改\n\n向后兼容的代码破坏可能会发生，如果你的应用程序使用 invoke()\
  \ 或 newInstance() Reflection 扩展方法。在 PHP 7 及以下版本中，接下来的三个方法都接受无限数量的参数。然而，在方法签名中，只列出了一个参数，如下所示：\n\
  \n- `ReflectionClass::newInstance($args)`\n- `ReflectionFunction::invoke($args)`\n\
  - `ReflectionMethod::invoke($args)`\n\n在 PHP 8 中，方法签名准确地反映了实际情况，即 $args 前面加上了可变参数运算符。以下是新的方法签名：\n\
  \n- `ReflectionClass::newInstance(...$args)`\n- `ReflectionFunction::invoke(...$args)`\n\
  - `ReflectionMethod::invoke($object, ...$args)`\n\n此更改仅在你有一个自定义类扩展了这三个类中的任何一个，并且该自定义类还重写了前面项目符号列表中列出的三个方法中的任何一个时才会破坏你的代码。\n\
  \n最后，isBuiltin() 方法已从 ReflectionType 移动到 ReflectionNamedType。如果使用 ReflectionType::isBuiltin()，则会带来潜在的代码破坏。\n\
  \n现在，让我们来看 PDO 扩展中的方法签名更改。\n\n## 处理 PDO 扩展签名更改\n\nPDO 扩展有两个重要的[content]\n方法签名更改非常重要。这些更改是为了解决在应用不同的\
  \ **获取模式** 时方法调用不一致的问题。以下是 PDO::query() 的新方法签名：\n\n```\nPDO::query(string $query,\n\
  \    ?int $fetchMode = null, mixed ...$fetchModeArgs)\n```\n\n这是 PDOStatement::setFetchMode()\
  \ 的新签名：\n\n```php\nPDOStatement::setFetchMode(int $mode, mixed ...$args)\n```\n\n\
  > 提示\n>\n> PDO::query() 方法签名更改在 PHP 7.4 到 PHP 8 迁移指南中有所提及，这里：https://www.php.net/manual/en/migration80.incompatible.php#migration80.incompatible.pdo.\n\
  \n两个新的方法签名比旧签名更统一，并且完全涵盖了使用不同获取模式时的语法差异。一个简单的代码示例演示了为什么需要规范化方法签名，该示例使用两种不同的获取模式执行\
  \ PDO::query()：\n\n- 1. 让我们首先包含一个包含数据库连接参数的配置文件。从中，我们将创建一个 PDO 实例：\n\n```php\n//\
  \ /repo/ch09/php8_pdo_signature_change.php\n$config = include __DIR__ . '../src/config/config.php';\n\
  $db_cfg = $config['db-config'];\n$pdo    = new PDO($db_cfg['dsn'], $db_cfg['usr'],\
  \ $db_cfg['pwd']);\n```\n\n- 2. 现在，让我们定义一个 SQL 语句并发送它以便准备：\n\n```php\n$sql    =\
  \ 'SELECT hotelName, city, locality, '\n    . 'country, postalCode FROM hotels '\n\
  \    . 'WHERE country = ? AND city = ?';\n$stmt   = $pdo->prepare($sql);\n```\n\n\
  - 3. 接下来，我们将执行准备好的语句并将获取模式设置为 PDO::FETCH_ASSOC。请注意，当我们使用此获取模式时，只向 setFetchMode()\
  \ 方法提供了一个参数：\n\n```php\n$stmt->execute(['IN', 'Budhera']);\n$stmt->setFetchMode(PDO::FETCH_ASSOC);\n\
  while ($row = $stmt->fetch()) var_dump($row);\n```\n\n- 4. 最后，我们将再次执行相同的准备好的语句。这次，我们将获取模式设置为\
  \ PDO::FETCH_CLASS。请注意，当我们使用此获取模式时，向 setFetchMode() 方法提供了两个参数：\n\n```\n$stmt->execute(['IN',\
  \ 'Budhera']);\n$stmt->setFetchMode(\n    PDO::FETCH_CLASS, ArrayObject::class);\n\
  while ($row = $stmt->fetch()) var_dump($row);\n```\n\n第一个查询的输出是关联数组。第二个查询生成一个 ArrayObject\
  \ 实例。以下是输出：\n\n```\nroot@php8_tips_php8 [/repo/ch09 ]#\nphp php8_pdo_signature_change.php\n\
  array(5) {\n    [\"hotelName\"]=> string(10) \"Rose Lodge\"\n    [\"city\"]=> string(7)\
  \ \"Budhera\"\n    [\"locality\"]=> string(7) \"Gurgaon\"\n    [\"country\"]=> string(2)\
  \ \"IN\"\n    [\"postalCode\"]=> string(6) \"122505\"\n}\nobject(ArrayObject)#3\
  \ (6) {\n    [\"hotelName\"]=> string(10) \"Rose Lodge\"\n    [\"city\"]=> string(7)\
  \ \"Budhera\"\n    [\"locality\"]=> string(7) \"Gurgaon\"\n    [\"country\"]=> string(2)\
  \ \"IN\"\n    [\"postalCode\"]=> string(6) \"122505\"\n    [\"storage\":\"ArrayObject\"\
  :private]=> array(0) { }\n}\n```\n\n重要的是要注意，即使方法签名已经更改，你也可以保持现有代码不变：这不会导致向后兼容的代码破坏！\n\
  \n现在，让我们来看声明为静态的方法。\n\n## 处理新定义的静态方法\n\n在 PHP 8 中看到的另一个潜在重大更改是几个方法现在被声明为静态。如果已将此处描述的类和方法作为直接对象实例使用，则没有问题。\n\
  \n\n\n以下方法现已声明为静态：\n\n- `tidy::repairString()`\n- `tidy::repairFile()`\n- `XMLReader::open()`\n\
  - `XMLReader::xml()`\n\n如果重写前面提到的类之一，则可能出现代码中断。在这种情况下，您必须将重写的方法声明为静态。下面是一个简单的示例，说明了潜在问题：\n\
  \n- 1. 首先，让我们定义一个 <div> 标签不匹配的字符串：\n\n```php\n// /repo/ch08/php7_tidy_repair_str_static.php\n\
  $str = <<<EOT\n<DIV>\n    <Div>Some Content</div>\n        <Div>Some Other Content\n\
  </div>\nEOT;\n```\n\n- 2. 然后，定义一个扩展 tidy 的匿名类，修复字符串并返回所有 HTML 标签都小写的字符串：\n\n```php\n\
  $class = new class() extends tidy {\n    public function repairString($str) {\n\
  \        $fixed = parent::repairString($str);\n        return preg_replace_callback(\n\
  \            '/<.+?>/',\n            function ($item) {\n                return\
  \ strtolower($item); },\n            $fixed);\n    }\n};\n```\n\n- 3. 最后，输出修复后的字符串：\n\
  \n```php\necho $class->repairString($str);\n```\n\n如果我们在 PHP 7 中运行此代码示例，输出如下：\n\n\
  ```\nroot@php8_tips_php7 [ /repo/ch09 ]#\nphp php7_tidy_repair_str_static.php\n\
  <!DOCTYPE html>\n<html>\n<head>\n<title></title>\n</head>\n<body>\n<div>\n<div>Some\
  \ Content</div>\n<div>Some Other Content</div>\n</div>\n</body>\n</html>\n```\n\n\
  如您所见，不匹配的 <div> 标签已被修复，并且生成了一个格式正确的 HTML 文档。您还会注意到所有标签都是小写。\n\n然而在 PHP 8 中，会出现方法签名问题，如下所示：\n\
  \n```\nroot@php8_tips_php8 [ /repo/ch09 ]#\nphp php7_tidy_repair_str_static.php\n\
  PHP Fatal error: Cannot make static method tidy::repairString() non static in class\
  \ tidy@anonymous in /repo/ch09/php7_tidy_repair_str_static.php on line 11\n```\n\
  \n如您所见，在 PHP 8 中，repairString() 方法现已声明为静态。我们之前定义的匿名类中 repairString() 的方法签名需要重写，如下所示：\n\
  \n```\npublic static function repairString(\n    string $str,\n    array|string|null\
  \ $config = null,\n    ?string $encoding = null) { // etc.\n```\n\n重写后（未显示）的输出与前面显示的\
  \ PHP 7 输出相同。另外，请注意最后一行现在也可以写成如下形式：\n\n```\necho $class::repairString($str);\n```\n\
  \n现在您已经了解了新定义为静态的方法，让我们来看一个相关主题；即静态返回类型。\n\n## 使用静态返回类型\n\nstatic 关键字在 PHP 中用于多个上下文。其基本用法超出了本次讨论的范围。在本节中，我们将重点关注\
  \ static 作为返回数据类型的新的用法。\n\n由于 static 被视为 self 的子类型，因此可以用它来扩展 self 的更窄返回类型。然而，static\
  \ 关键字不能用作类型提示，因为它会违反里氏替换原则。它还会让开发者感到困惑，因为 static 已在太多其他上下文中使用。\n\n> Tip\n> 以下文章描述了\
  \ static 返回类型引入之前的背景讨论：https://wiki.php.net/rfc/static_return_type. 以下文档引用了后期静态绑定：https://www.php.net/manual/en/language.oop5.late-static-bindings.php.\
  \ 里氏替换原则在第 5 章《发现潜在的 OOP 向后兼容性破坏》中讨论过，具体在《理解扩展的 PHP 8 协变支持》部分。\n\n这种新返回数据类型的最常见用途是在使用流畅接口的类中。后者是一种技术，其中对象方法返回当前对象状态的实例，从而允许以流畅（可读）的方式使用方法调用链。在下面的示例中，请注意对象如何构建\
  \ SQL SELECT 语句：\n\n- 1. 首先，我们必须定义一个 Where 类，它接受无限数量的参数来形成 SQL WHERE 子句。请注意 static\
  \ 的返回数据类型：\n\n```php\n// /src/Php8/Sql/Where.php\nnamespace Php8\\Sql;\nclass Where\
  \ {\n    public $where = [];\n    public function where(...$args) : static {\n \
  \       $this->where = array_merge($this->where, $args);\n        return $this;\n\
  \    }\n    // not all code is shown\n}\n```\n\n- 2. 现在，让我们定义主类 Select，它提供用于构建 SQL\
  \ SELECT 语句各部分的方法。同样请注意，所示方法都返回当前类实例，并且返回数据类型为 static：\n\n```php\n// /src/Php8/Sql/Select.php\n\
  namespace Php8\\Sql;\nclass Select extends Where {\n    public $from = '';\n   \
  \ public $limit = 0;\n    public $offset = 0;\n    public function from(string $table)\
  \ : static {\n        $this->from = $table;\n        return $this;\n    }\n    public\
  \ function order(string $order) : static {\n        $this->order = $order;\n   \
  \     return $this;\n    }\n    public function limit(int $num) : static {\n   \
  \     $this->limit = $num;\n        return $this;\n    }\n    // not all methods\
  \ and properties are shown\n}\n```\n\n- 3. 最后，我们必须定义一个调用程序，提供构建 SQL 语句所需的值。请注意，echo\
  \ 语句使用流畅接口，使以编程方式创建 SQL 语句更容易理解：\n\n```php\n// /repo/ch09/php8_static_return_type.php\n\
  require_once __DIR__\n    . './../../src/Server/Autoload/Loader.php';\n$loader =\
  \ new \\Server\\Autoload\\Loader();\nuse Php8\\Sql\\Select;\n$start = \"'2021-06-01'\"\
  ;\n$end   = \"'2021-12-31'\";\n$select = new Select();\necho $select->from('events')\n\
  \    ->cols(['id', 'event_name', 'event_date'])\n    ->limit(10)\n    ->where('event_date',\
  \ '>=', $start)\n    ->where('AND', 'event_date', '<=', $end)\n    ->render();\n\
  ```\n\n以下是代码示例在 PHP 8 中运行的输出：\n\n```\nroot@php8_tips_php8 [ /repo/ch09 ]#\nphp php8_static_return_type.php\n\
  SELECT id,event_name,event_date FROM events WHERE event_date >= '2021-06-01' AND\
  \ event_date <= '2021-12-31' LIMIT 10\n```\n\n当然，此示例在 PHP 7 中不起作用，因为 static 关键字不可用作返回数据类型。接下来，让我们看看特殊\
  \ ::class 常量的扩展用法。\n\n## 扩展 ::class 常量的使用\n\n特殊的 ::class 常量非常有用，因为它可以静默扩展为完整的命名空间加上类名字符串。了解它的使用方式以及在\
  \ PHP 8 中其用法的扩展，可以为您节省大量时间。它的使用还可以使代码更具可读性，尤其是在处理冗长的命名空间和类名时。\n\n特殊的 ::class 常量是作用域解析运算符\
  \ (::) 和 class 关键字的组合。然而，与 ::parent、::self 和 ::static 不同，::class 构造可以在类定义之外使用。从某种意义上说，::class\
  \ 构造是一种魔术常量，因为它会导致与其关联的类神奇地扩展为其完整的命名空间加上类名。\n\n在了解其在 PHP 8 中的用法如何扩展之前，让我们先看看其常规用法。\n\
  \n## 常规 ::class 常量用法\n\n特殊的 `::class` 常量经常在命名空间很长且希望不仅节省不必要的输入，还保留源代码可读性的情况下使用。\n\
  \n在此简单示例中，使用 `Php7\\Image\\Strategy` 命名空间，我们希望创建一个策略类列表：\n\n- 1. 首先，让我们标识命名空间并设置自动加载器：\n\
  - 2. 在引入特殊的 `::class` 常量之前，要生成完整的命名空间类名列表，您必须将其全部写成字符串，如下所示：\n- 3. 使用特殊的 `::class`\
  \ 常量，您可以减少所需的输入量，还可以使代码更具可读性，如下所示：\n\n```php\n// /repo/ch09/php7_class_normal.php\n\
  namespace Php7\\Image\\Strategy;\nrequire_once __DIR__\n  . './../../src/Server/Autoload/Loader.php';\n\
  $autoload = new \\Server\\Autoload\\Loader();\n```\n\n```php\n$listOld = [\n  'Php7\\\
  Image\\Strategy\\DotFill',\n  'Php7\\Image\\Strategy\\LineFill',\n  'Php7\\Image\\\
  Strategy\\PlainFill',\n  'Php7\\Image\\Strategy\\RotateText',\n  'Php7\\Image\\\
  Strategy\\Shadow'\n];\nprint_r($listOld);\n```\n\n```php\n$listNew = [\n  DotFill::class,\n\
  \  LineFill::class,\n  PlainFill::class,\n  RotateText::class,\n  Shadow::class\n\
  ];\nprint_r($listNew);\n```\n\n\n\n如果我们运行此代码示例，就会看到在 PHP 7 和 PHP 8 中这两个列表是相同的。以下是\
  \ PHP 7 的输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch09 ]#\nphp php7_class_normal.php\n\
  Array (\n    [0] => Php7\\Image\\Strategy\\DotFill\n    [1] => Php7\\Image\\Strategy\\\
  LineFill\n    [2] => Php7\\Image\\Strategy\\PlainFill\n    [3] => Php7\\Image\\\
  Strategy\\RotateText\n    [4] => Php7\\Image\\Strategy\\Shadow\n)\nArray (\n   \
  \ [0] => Php7\\Image\\Strategy\\DotFill\n    [1] => Php7\\Image\\Strategy\\LineFill\n\
  \    [2] => Php7\\Image\\Strategy\\PlainFill\n    [3] => Php7\\Image\\Strategy\\\
  RotateText\n    [4] => Php7\\Image\\Strategy\\Shadow\n)\n```\n\n如你所见，特殊的 ::class\
  \ 常量会在编译时将类名扩展为其完整的命名空间加上类名，导致两个列表包含相同的信息。\n\n现在，让我们来看看 PHP 8 中特殊 ::class 常量的使用。\n\
  \n## 扩展的特殊 ::class 常量使用\n\n随着 PHP 8 中所见到的其他语法统一性改进，现在可以在活动对象实例上使用特殊的 ::class 常量。虽然效果与使用\
  \ get_class() 相同，但作为从过程式转向面向对象编程的一般最佳实践的一部分，使用特殊的 ::class 常量是有意义的。\n\n在此示例中，扩展的\
  \ ::class 语法用于确定抛出的错误类型：\n\n- 1. 当抛出 Error 或 Exception 时，最佳实践是在错误日志中记录一条条目。在此示例中，该示例在\
  \ PHP 7 和 PHP 8 中均可工作，Error 或 Exception 的类名包含在日志消息中：\n\n```php\n// /repo/ch09/php7_class_and_obj.php\n\
  try {\n    $pdo = new PDO();\n    echo 'No problem';\n} catch (Throwable $t) {\n\
  \    $msg = get_class($t) . ':' . $t->getMessage();\n    error_log($msg);\n}\n```\n\
  \n- 2. 在 PHP 8 中，你可以通过重写示例来实现相同的结果，如下所示：\n\n```php\n// /repo/ch09/php8_class_and_obj.php\n\
  try {\n    $pdo = new PDO();\n    echo 'No problem';\n} catch (Throwable $t) {\n\
  \    $msg = $t::class . ':' . $t->getMessage();\n    error_log($msg);\n}\n```\n\n\
  从第二个代码块可以看出，语法更简洁，避免了使用过程式函数。然而，我们必须强调，在此示例中，没有性能提升。\n\n现在你已经了解了特殊 ::class 常量使用的变化，让我们快速看一下逗号。\n\
  \n## 利用尾随逗号\n\nPHP 很早就允许在定义数组时使用尾随逗号。例如，这里所示的语法并不罕见：\n\n```\n$arr = [1, 2, 3, 4,\
  \ 5,];\n```\n\n然而，在函数或方法签名中做同样的事情是不允许的：\n\n```\nfunction xyz ($fn, $ln, $mid = '',)\
  \ { /* code */ }\n```\n\n虽然这并不是什么大事，但能够在定义数组时添加尾随逗号，却不允许在函数或方法签名中享有同样的自由，这令人恼火！\n\
  \nPHP 8 现在允许你在函数和方法签名中都使用尾随逗号。新规则也适用于与匿名函数关联的 use () 语句。\n\n为了说明这一变化，请考虑以下示例。在此示例中，定义了一个匿名函数来渲染全名：\n\
  \n// /repo/ch09/php8_trailing_comma.php\n$full = function ($fn, $ln, $mid = '',)\
  \ {\n    $mi = ($mid) ? strtoupper($mid[0]) . '. ' : '';\n    return $fn . ' ' .\
  \ $mi . $ln;\n};\necho $full('Fred', 'Flintstone', 'John');\n```\n\n如你所见，匿名函数的第三个参数后面有一个逗号。以下是\
  \ PHP 7 的输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch09 ]#\nphp php8_trailing_comma.php\n\
  PHP Parse error: syntax error, unexpected ')', expecting variable (T_VARIABLE) in\
  \ /repo/ch09/php8_trailing_comma.php on line 4\n```\n\n在 PHP 8 中，尾随逗号是允许的，并且预期的输出出现，如下所示：\n\
  \n```\nroot@php8_tips_php8 [ /repo/ch09 ]#\nphp php8_trailing_comma.php\nFred J.\
  \ Flintstone\n```\n\n虽然在函数或方法定义中拥有尾随逗号不一定是最佳实践，但它确实使 PHP 8 在处理尾随逗号的整体方式上保持一致。\n\n\
  现在，让我们把注意力转向那些仍然存在但不再有任何用途的方法。\n\n## 了解不再需要的方法\n\n主要由于 PHP 8 的资源到对象迁移，多个函数和方法不再需要。截至撰写本文时，它们尚未被弃用，但这些函数不再具有任何实际用途。\n\
  \n作为类比，在 PHP 8 之前的 PHP 版本中，你会使用 fopen() 打开文件句柄资源。完成对文件的操作后，你通常会使用 fclose() 关闭文件句柄资源以关闭连接。\n\
  \n现在，假设你使用 SplFileObject 而不是 fopen()。完成对文件的操作后，你只需 unset 该对象即可。这实现了与使用 fclose()\
  \ 相同的效果，使 fclose() 变得多余。\n\n下表总结了存在的函数，可以继续使用，但在 PHP 8 中不再具有任何实际价值。带星号的函数也已被弃用：\n\
  \n| Extension | Functions No Longer Useful |\n|---|---|\n| cURL | curl_close()\n\
  \ curl_multi_close()\n curl_share_close() |\n| Exif | read_exif_data() |\n| GD |\
  \ imagedestroy() |\n| OpenSSL | openssl_x509_free() * |\n| Shared Memory | shmop_close()\
  \ * |\n| XMLParser | xml_parser_free() |\n\n表 9.1 – 不再有用的函数\n\n现在你已经对 PHP 8 中所做的重大方法签名和使用变化有了一个概念，让我们来看看在处理接口和\
  \ trait 时需要考虑的最佳实践。\n\n## 使用接口和 trait\n\nPHP 8 的 trait 实现在多个方面得到了扩展。还有几个新的接口可能会改变你使用\
  \ DOM 和 DateTime 扩展的方式。在大多数情况下，这些更改提高了这两个扩展的能力。然而，由于某些情况下方法签名已更改，你可能会遇到潜在的代码中断。因此，密切关注本节中介绍的讨论非常重要，以确保现有和未来的\
  \ PHP 代码保持功能正常。\n\n首先，让我们来看看新的 DOM 扩展接口。\n\n### 发现新的 DOM 扩展接口\n\n*生活成本* 经济统计每年由许多世界政府发布。它描绘了普通公民每年生活的成本。随着网络技术的成熟，类似的原则已被应用——首先是\
  \ HTML，现在是 DOM。**DOM Living Standard** 由 **Web Hypertext Application Technology\
  \ Working Group (WHATWG)** (`https://whatwg.org/`) 维护。\n\n这条信息对 PHP 开发者重要的原因是在 PHP\
  \ 8 中，做出了将 PHP DOM 扩展迁移到 DOM Living Standard 的决定。因此，从 PHP 8 开始，将根据对 living standard\
  \ 的更改，对该扩展应用一系列增量和持续的更改。\n\n在大多数情况下，这些更改向后兼容。然而，由于某些方法签名更改以保持对标准的遵循，你可能会遇到代码中断。PHP\
  \ 8 中对 DOM 扩展的最重大更改是引入了两个新的接口。让我们检查这些接口，然后讨论它们对 PHP 开发的影响。\n\n### 检查新的 DOMParentNode\
  \ 接口\n\n两个新接口中的第一个是 **DOMParentNode**。以下类在 PHP 8 中实现了此接口：\n\n- `DOMDocument`\n-\
  \ `DOMElement`\n- `DOMDocumentFragment`\n\n以下是接口定义：\n\n```\ninterface DOMParentNode\
  \ {\n    public readonly ?DOMElement $firstElementChild;\n    public readonly ?DOMElement\
  \ $lastElementChild;\n    public readonly int $childElementCount;\n    public function\
  \ append(\n        ...DOMNode|string|null $nodes) : void;\n    public function prepend(\n\
  \        ...DOMNode|string|null $nodes) : void;\n}\n```\n\n需要注意的是，PHP 开发者无法使用 readonly\
  \ 属性。然而，接口规范将属性显示为只读，因为它们是内部生成的且无法更改。\n\n> **Tip**\n> 实际上在 2014 年提出过一个 PHP RFC，建议为类属性添加\
  \ readonly 属性。然而，该提案已被撤回，因为通过定义常量或简单地将属性标记为 private 即可实现相同的效果！有关此提案的更多信息，请参阅 https://wiki.php.net/rfc/readonly_properties.\n\
  \n下表总结了新的 DOMParentNode 接口的属性和方法：\n\n| 方法 / 属性 | 描述 |\n|---|---|\n| $firstElementChild\
  \ | 包含此对象中的第一个 DOMElement 实例，或 NULL。 |\n| $lastElementChild | 包含此对象中的最后一个 DOMElement\
  \ 实例，或 NULL。 |\n| $elementChildCount | 表示此对象中子元素总数的整数值。 |\n| append() | 将节点追加到当前子节点列表的末尾。\
  \ |\n| prepend() | 将节点添加到当前子节点列表的开头。 |\n\n表 9.2 – DOMParentNode 接口方法和属性\n\n\n\n\
  新接口所代表的功能并没有为现有的 DOM 能力增加任何新内容。其主要目的是使 PHP DOM 扩展与实时标准保持一致。\n\n> **Tip**\n> 未来对\
  \ DOM 扩展进行架构性改造还有另一个目的。在 PHP 的未来版本中，DOM 扩展将具备操作整个 DOM 树分支的能力。例如，未来在发出 `append()`\
  \ 时，你将能够附加的不仅是单个节点，还包括其所有子节点。更多信息请参阅以下 RFC：https://wiki.php.net/rfc/dom_living_standard_api.\n\
  \n现在，让我们来看第二个新接口。\n\n## 检查新的 DOMChildNode 接口\n\n两个新接口中的第二个是 **DOMChildNode**。在 PHP\
  \ 8 中，`DOMElement` 和 `DOMCharacterData` 类实现了此接口。\n\n以下是接口定义：\n\n```\ninterface DOMChildNode\
  \ {\n    public readonly ?DOMElement $previousElementSibling;\n    public readonly\
  \ ?DOMElement $nextElementSibling;\n    public function remove() : void;\n    public\
  \ function before(\n        ...DOMNode|string|null $nodes) : void;\n    public function\
  \ after(\n        ...DOMNode|string|null $nodes) : void;\n    public function replaceWith(\n\
  \        ...DOMNode|string|null $nodes) : void;\n}\n```\n\n下表总结了 DOMChildNode 的方法和属性：\n\
  \n| Method / Property | Description |\n|---|---|\n| $previousElementSibling | 包含此对象同一节点层级中的前一个\
  \ DOMElement 实例，或 NULL。 |\n| $nextElementSibling | 包含此对象同一节点层级中的下一个 DOMElement 实例，或\
  \ NULL。 |\n| remove() | 删除此节点的简化方式。无需先获取父节点。 |\n| before() | 在此对象中于此节点之前添加同一层级的节点。\
  \ |\n| after() | 在此对象中于此节点之后添加同一层级的节点。 |\n| replaceWith() | 用指定的元素替换此节点。 |\n\n表\
  \ 9.3 – DOMChildNode 接口方法与属性\n\n在这种情况下，功能与现有的 DOM 能力略有不同。最显著的差异是 DOMChildNode::remove()。在\
  \ PHP 8 之前，要删除一个节点，必须访问其父节点。假设 $topic 是一个 DOMElement 实例，PHP 7 或更早版本的代码可能如下所示：\n\n\
  ```\n$topic->parentNode->removeChild($topic);\n```\n\n在 PHP 8 中，相同的代码可以写成如下形式：\n\
  \n```\n$topic->remove();\n```\n\n除了前面两个表中提到的新方法之外，DOM 功能保持不变。现在，让我们看看如何在 PHP 8 中重写移动子节点的操作以利用新接口。\n\
  \n## DOM 使用示例 – 比较 PHP 7 和 PHP 8\n\n为了说明新接口的使用，让我们看一个代码示例。本节将展示一段使用 DOM 扩展将代表 Topic\
  \ X 的节点从一个文档移动到另一个文档的代码块：\n\n- 1. 这里是一个包含一组嵌套 <div> 标签的 HTML 片段：\n\n```\n<!DOCTYPE\
  \ html>\n<!-- /repo/ch09/dom_test_1.html -->\n<div id=\"content\">\n<div id=\"A\"\
  >Topic A</div>\n<div id=\"B\">Topic B</div>\n<div id=\"C\">Topic C</div>\n<div id=\"\
  X\">Topic X</div>\n</div>\n```\n\n- 2. 第二个 HTML 片段包含主题 D、E 和 F：\n\n```\n<!DOCTYPE\
  \ html>\n<!-- /repo/ch09/dom_test_2.html -->\n<div id=\"content\">\n<div id=\"D\"\
  >Topic D</div>\n<div id=\"E\">Topic E</div>\n<div id=\"F\">Topic F</div>\n</div>\n\
  ```\n\n- 3. 要从两个片段分别创建 DOMDocument 实例，我们可以进行静态调用；即 loadHTMLFile。请注意，此用法在 PHP 7 中已弃用，并在\
  \ PHP 8 中被移除：\n\n```\n$doc1 = DomDocument::loadHTMLFile( 'dom_test_1.html');\n$doc2\
  \ = DomDocument::loadHTMLFile('dom_test_2.html');\n```\n\n- 4. 然后，我们可以将 Topic X\
  \ 提取到 $topic 中并将其导入到第二个文档作为 $new。接下来，检索目标节点；即 content：\n\n```\n$topic = $doc1->getElementById('X');\n\
  $new = $doc2->importNode($topic);\n$new->textContent= $topic->textContent;\n$main\
  \ = $doc2->getElementById('content');\n```\n\n- 5. 这里是 PHP 7 和 PHP 8 开始不同的地方。在 PHP\
  \ 7 中，要移动节点，代码必须如下所示：\n\n```\n// /repo/ch09/php7_dom_changes.php\n$main->appendChild($new);\n\
  $topic->parentNode->removeChild($topic);\n```\n\n- 6. 然而，在 PHP 8 中使用新接口时，代码更加简洁。在\
  \ PHP 8 中删除主题时，无需引用父节点：\n\n```php\n// /repo/ch09/php8_dom_changes.php\n$main->append($new);\n\
  $topic->remove();\n```\n\n- 7. 对于 PHP 7 和 PHP 8，我们都可以像这样查看结果的 HTML：\n\n```php\n\
  echo $doc1->saveHTML();\necho $doc2->saveHTML();\n```\n\n- 8. 另一个区别是如何提取 $main 的新最后一个子元素的值。它在\
  \ PHP 7 中可能如下所示：\n\n```php\n// /repo/ch09/php7_dom_changes.php\necho $main->lastChild->textContent\
  \ . \"\\n\";\n```\n\n- 9. 而在 PHP 8 中则是这样：\n\n```php\n// /repo/ch09/php8_dom_changes.php\n\
  echo $main->lastElementChild->textContent . \"\\n\";\n```\n\n两个代码示例的输出存在细微差异。在 PHP\
  \ 7 中，你会看到弃用通知，如下所示：\n\n```\nroot@php8_tips_php7 [ /repo/ch09 ]# php php7_dom_changes.php\n\
  PHP Deprecated: Non-static method DOMDocument::loadHTMLFile() should not be called\
  \ statically in /repo/ch09/php7_dom_changes.php on line 6\n```\n\n如果我们尝试在 PHP 8\
  \ 中运行 PHP 7 代码，将会抛出致命错误，因为 loadHTMLFile() 方法的静态用法不再允许。否则，如果我们运行纯 PHP 8 示例，输出将如下所示：\n\
  \n```\nroot@php8_tips_php8 [ /repo/ch09 ]# php php8_dom_changes.php\n<!DOCTYPE html>\n\
  <html><body><div id=\"content\">\n<div id=\"A\">Topic A</div>\n<div id=\"B\">Topic\
  \ B</div>\n<div id=\"C\">Topic C</div>\n</div>\n</body></html>\n<!DOCTYPE html>\n\
  <html><body><div id=\"content\">\n<div id=\"D\">Topic D</div>\n<div id=\"E\">Topic\
  \ E</div>\n<div id=\"F\">Topic F</div>\n<div id=\"X\">Topic X</div></div>\n</body></html>\n\
  Last Topic in Doc 2: Topic X\n```\n\n如你所见，在任何一种情况下，Topic X 都已从第一个 HTML 片段移动到第二个\
  \ HTML 片段。\n\n在 PHP 的未来版本中，预计 DOM 扩展将继续发展，同时遵循 DOM 的实时标准。此外，其使用方式将继续变得更简单，并提供更多灵活性和效率。\n\
  \n现在，让我们把注意力转向 DateTime 扩展中的变化。\n\n## 使用新的 DateTime 方法\n\n在处理日期和时间时，创建 DateTimeImmutable\
  \ 实例通常很有用。DateTimeImmutable 对象与 DateTime 对象相同，只是其属性值不可更改。了解如何在 DateTime 和 DateTimeImmutable\
  \ 之间切换是一种有用的技巧，可以避免许多隐藏的逻辑错误。\n\n在讨论 PHP 8 中所做的改进之前，让我们先看看 DateTimeImmutable 解决的潜在问题。\n\
  \n## DateTimeImmutable 的用例\n\n在这个简单示例中，将创建一个包含三个实例的数组，表示从今天起 30、60 和 90 天。这些将用于形成\
  \ 30-60-90 天应收账款账龄报告的基础：\n\n- 1. 首先，让我们初始化几个关键变量，表示间隔、日期格式以及用于保存最终值的数组：\n\n```\n\
  // /repo/ch09/php7_date_time_30-60-90.php\n$days = [0, 30, 60, 90];\n$fmt = 'Y-m-d';\n\
  $aging = [];\n```\n\n- 2. 现在，让我们定义一个循环，将间隔添加到 DateTime 实例以生成（希望！）表示 0、30、60 和 90\
  \ 天的数组。有经验的开发者很可能已经发现了问题！\n\n```\n$dti = new DateTime('now');\nforeach ($days as\
  \ $span) {\n    $interval = new DateInterval('P' . $span . 'D');\n    $item = $dti->add($interval);\n\
  \    $aging[$span] = clone $item;\n}\n```\n\n- 3. 接下来，显示已生成的日期集合：\n\n```\necho \"\
  Day\\tDate\\n\";\nforeach ($aging as $key => $obj)\n    echo \"$key\\t\" . $obj->format($fmt)\
  \ . \"\\n\";\n```\n\n- 4. 输出结果如下所示，这完全是一场灾难：\n\n```\nroot@php8_tips_php7 [ /repo/ch09\
  \ ]#\nphp php7_date_time_30-60-90.php\nDay    Date\n0      2021-11-20\n30     2021-06-23\n\
  60     2021-08-22\n90     2021-11-20\n```\n\n如你所见，问题在于 DateTime 类不是不可变的。因此，每次添加\
  \ DateInterval 时，原始值都会被更改，导致显示的日期不准确。\n\n- 5. 然而，通过一个简单的修改，我们就可以纠正这个问题。不是最初创建 DateTime\
  \ 实例，我们只需改为创建 DateTimeImmutable 实例即可：\n\n```\n$dti = new DateTimeImmutable('now');\n\
  ```\n\n\n\n6. 然而，要用 DateTime 实例填充数组，我们需要将 DateTimeImmutable 转换为 DateTime。在 PHP 7.3\
  \ 中，引入了 DateTime::createFromImmutable() 方法。因此，当值赋给 $aging 时，修改后的代码可能如下所示：\n\n```php\n\
  $aging[$span] = DateTime::createFromImmutable($item);\n```\n\n7. 否则，你只能创建新的 DateTime\
  \ 实例，如下所示：\n\n```php\n$aging[$span] = new DateTime($item->format($fmt));\n```\n\n\
  通过这一项更改，正确的输出将如下所示：\n\n| Day | Date |\n|---|---|\n| 0 | 2021-05-24 |\n| 30 | 2021-06-23\
  \ |\n| 60 | 2021-07-23 |\n| 90 | 2021-08-22 |\n\n你现在已经了解 DateTimeImmutable 的使用方式，并且也对如何转换为\
  \ DateTime 有了概念。你会很高兴地知道，在 PHP 8 中，通过引入 createFromInterface() 方法，两种对象类型之间的转换变得更加容易。\n\
  \n## 检查 createFromInterface() 方法\n\n在 PHP 8 中，在 DateTime 和 DateTimeImmutable 之间转换，以及反向转换变得更加容易。名为\
  \ createFromInterface() 的新方法已添加到两个类中。该方法的签名只需一个 DateTimeInterface 实例，这意味着 DateTime\
  \ 或 DateTimeImmutable 的实例都是此方法的可接受参数。\n\n以下简短的代码示例演示了在 PHP 8 中从一种类型转换为另一种类型是多么容易：\n\
  \n- 1. 首先，让我们定义一个 DateTimeImmutable 实例并输出其类和日期：\n\n```php\n// /repo/ch09/php8_date_time.php\n\
  $fmt = 'l, d M Y';\n$dti = new DateTimeImmutable('last day of next month');\necho\
  \ $dti::class . ':' . $dti->format($fmt) . \"\\n\";\n```\n\n- 2. 然后，从 $dti 创建一个\
  \ DateTime 实例并添加 90 天的间隔，显示其类和当前日期：\n\n```php\n$dtt = DateTime::createFromInterface($dti);\n\
  $dtt->add(new DateInterval('P90D'));\necho $dtt::class . ':' . $dtt->format($fmt)\
  \ . \"\\n\";\n```\n\n- 3. 最后，从 $dtt 创建一个 DateTimeImmutable 实例并显示其类和日期：\n\n```php\n\
  $dtx = DateTimeImmutable::createFromInterface($dtt);\necho $dtx::class . ':' . $dtx->format($fmt)\
  \ . \"\\n\";\n```\n\n以下是此代码示例在 PHP 8 中运行的输出：\n\n```\nroot@php8_tips_php8 [/repo/ch09\
  \ ]# php php8_date_time.php\nDateTimeImmutable:Wednesday, 30 Jun 2021\nDateTime:Tuesday,\
  \ 28 Sep 2021\nDateTimeImmutable:Tuesday, 28 Sep 2021\n```\n\n正如你所见，我们使用了相同的 createFromInterface()\
  \ 方法来创建实例。当然请记住，我们实际上并没有将类实例转换为另一个实例。相反，我们是创建了克隆的实例，但类类型不同。\n\n你现在知道为什么你可能想要 DateTimeImmutable\
  \ 而不是 DateTime。你也知道在 PHP 8 中，名为 createFromInterface() 的新方法提供了一种统一的方式从一个创建另一个的实例。接下来，我们将看看\
  \ PHP 8 中对 trait 处理的改进。\n\n## 了解 PHP 8 trait 处理的改进\n\ntrait 的实现首次在 PHP 5.4 版本中引入。自那时以来，进行了持续不断的改进。PHP\
  \ 8 通过提供一种明确识别当多个 trait 具有冲突方法时使用哪些方法的方式，继续了这一趋势。此外，除了消除可见性声明中的不一致之外，PHP 8 还解决了\
  \ trait 处理（或未处理！）抽象方法方面的问题。\n\n作为开发者，完全掌握 trait 的使用可以让你编写更高效且更易维护的代码。Trait 可以帮助你避免产生冗余代码。它们解决了需要在不同命名空间或不同类继承结构中提供相同逻辑的问题。本节介绍的信息使你能够在\
  \ PHP 8 下运行的代码中正确使用 trait。\n\n首先，让我们看看 PHP 8 中如何解决 trait 之间的冲突。\n\n### 解决 trait\
  \ 之间的方法冲突\n\n可以通过简单地用逗号分隔列出 trait 名称来使用多个 trait。然而，如果两个 trait 定义了相同的方法，就可能出现潜在问题。为了解决此类冲突，PHP\
  \ 提供了 as 关键字。在 PHP 7 及更早版本中，为避免两个同名方法冲突，你可以简单地重命名其中一个方法。执行重命名的代码可能如下所示：\n\n```\n\
  use Trait1, Trait2 { <METHOD> as <NEW_NAME>; }\n```\n\n然而，这种方法的问题在于 PHP 做出了一个静默假设：METHOD\
  \ 被假定来自 Trait1！在持续努力强制执行良好编码实践方面，PHP 8 不再允许这种假设。PHP 8 中的解决方案是通过使用 insteadof 而不是\
  \ as 来更具体。\n\n这里有一个简单的示例来说明这个问题：\n\n- 1. 首先，让我们定义两个 trait，它们定义了相同的方法 test()，但返回不同的结果：\n\
  \n```php\n// /repo/ch09/php7_trait_conflict_as.php\ntrait Test1 {\n    public function\
  \ test() {\n        return '111111';\n    }\n}\ntrait Test2 {\n    public function\
  \ test() {\n        return '222222';\n    }\n}\n```\n\n- 2. 然后，定义一个使用两个 trait 的匿名类，并将\
  \ test() 指定为 otherTest() 以避免命名冲突：\n\n```php\n$main = new class () {\n    use Test1,\
  \ Test2 { test as otherTest; }\n    public function test() { return 'TEST'; }\n\
  };\n```\n\n- 3. 接下来，定义一段代码块来输出两个方法的返回值：\n\n```php\necho $main->test() . \"\\n\"\
  ;\necho $main->otherTest() . \"\\n\";\n```\n\n以下是 PHP 7 中的输出：\n\n```\nroot@php8_tips_php7\
  \ [ /repo/ch09 ]#\nphp php7_trait_conflict_as.php\nTEST\n111111\n```\n\n正如你所见，PHP\
  \ 7 静默假设我们指的是将 Trait1::test() 重命名为 otherTest()。然而，从示例代码中，完全不清楚这是否是程序员的意图！\n\n在 PHP\
  \ 8 中运行相同的代码示例，我们会得到不同的结果：\n\n```\nroot@php8_tips_php8 [ /repo/ch09 ]#\nphp php7_trait_conflict_as.php\n\
  PHP Fatal error:  An alias was defined for method test(), which exists in both Test1\
  \ and Test2. Use Test1::test or Test2::test to resolve the ambiguity in /repo/ch09/php7_trait_conflict_as.php\
  \ on line 6\n```\n\n显然，PHP 8 不会做出此类静默假设，因为它们很容易导致意外行为。在此示例中，最佳实践是使用作用域解析 (::) 运算符。以下是重写的代码：\n\
  \n```php\n$main = new class () {\n    use Test1, Test2 { Test1::test as otherTest;\
  \ }\n    public function test() { return 'TEST'; }\n};\n```\n\n如果我们在 PHP 8 中重新运行代码，输出将与为\
  \ PHP 7 显示的输出相同。作用域解析运算符确认 Trait1 是 test() 方法的源 trait，从而避免任何歧义。现在，让我们看看 PHP 8 trait\
  \ 如何处理抽象方法签名。\n\n### 使用 trait 抽象签名检查\n\n正如 API 开发者所熟知，将方法标记为抽象是向 API 用户发出该方法为强制性但尚未定义的方式。此技术允许\
  \ API 开发者不仅指定方法名称，还指定其签名。\n\n然而，在 PHP 7 及更早版本中，trait 中定义的抽象方法会忽略签名，这违背了使用抽象方法的初衷！当你在\
  \ PHP 8 中使用包含抽象方法的 trait 时，其签名会与使用该 trait 的类中的实现进行检查。\n\n以下示例在 PHP 7 中有效，但在 PHP\
  \ 8 中失败，因为方法签名不同：\n\n- 1. 首先，让我们声明严格类型检查并定义一个包含抽象方法 trait；即 add()。请注意，方法签名要求全部使用整数数据类型：\n\
  - 2. 接下来，定义一个使用该 trait 并定义 add() 的匿名类。请注意，该类的所有数据类型均为 float：\n- 3. 然后，输出 111.111\
  \ 和 222.222 相加的结果：\n\n```php\n// /repo/ch09/php7_trait_abstract_signature.php\n\
  declare(strict_types=1);\ntrait Test1 {\n    public abstract function add(int $a,\
  \ int $b) : int;\n}\n```\n\n```php\n$main = new class () {\n    use Test1;\n   \
  \ public function add(float $a, float $b) : float {\n        return $a + $b;\n \
  \   }\n};\n```\n\n```php\necho $main->add(111.111, 222.222) . \"\\n\";\n```\n\n\n\
  \n这个在 PHP 7 中运行的小代码示例的结果令人惊讶：\n\n```\nroot@php8_tips_php7 [ /repo/ch09 ]#\nphp php7_trait_abstract_signature.php\n\
  333.333\n```\n\n如结果所示，trait 中抽象定义的方法签名被完全忽略！然而在 PHP 8 中，结果却大不相同。以下是该代码在 PHP 8 中运行的输出：\n\
  \n```\nroot@php8_tips_php8 [ /repo/ch09 ]#\nphp php7_trait_abstract_signature.php\n\
  PHP Fatal error: Declaration of class@anonymous::add(float $a, float $b): float\
  \ must be compatible with Test1::add(int $a, int $b): int in /repo/ch09/php7_trait_abstract_signature.php\
  \ on line 9\n```\n\n前述 PHP 8 输出向我们展示，无论抽象方法定义的来源如何，良好的编码实践都得到了强制执行。\n\n本节的最后一个主题将向您展示如何在\
  \ trait 中处理抽象私有方法。\n\n## 在 trait 中处理抽象私有方法\n\n一般来说，在 PHP 中，您无法对抽象超类中的抽象私有方法强制控制，因为它不会被继承。然而在\
  \ PHP 8 中，您可以在 trait 中定义抽象私有方法！这可以用作用例强制机制，当您进行 API 开发时，使用类需要定义指定的私有方法。\n\n请注意，虽然您可以在\
  \ PHP 8 trait 中将抽象方法指定为私有，但使用该 trait 的类可以轻松覆盖 trait 方法的可见性。因此，本节不会展示任何代码示例，因为私有抽象\
  \ trait 方法的效果与在其他可见性级别使用抽象 trait 方法完全相同。\n\n> **提示**\n> \n> 有关 PHP 8 中 trait 抽象方法处理的更多信息，请查看这个\
  \ RFC：https://wiki.php.net/rfc/abstract_trait_method_validation.\n\n现在，让我们来看看私有方法中的一般用法变化。\n\
  \n## 处理私有方法\n\n开发人员创建超类的原因之一是为了对子类的方法签名施加一定程度的控制。在解析阶段，PHP 通常会确认方法签名是否匹配。这导致其他开发人员正确使用您的代码。\n\
  \n同样，如果方法被标记为私有，就没有必要让 PHP 执行同样严格的方法签名检查。私有方法的目的是使其对扩展类不可见。如果您在扩展类中定义了同名的方法，您应该可以自由定义它。\n\
  \n为说明此问题，让我们定义一个名为 Cipher 的类，其中包含一个名为 encrypt() 的私有方法。OpenCipher 子类重新定义了此方法，导致在\
  \ PHP 7 下运行时出现致命错误：\n\n- 首先，让我们定义一个 Cipher 类，其构造函数为 $key 和 $salt 生成随机值。它还定义了一个名为\
  \ encode() 的公共方法，该方法调用私有 encrypt() 方法：\n\n```php\n// /repo/src/Php7/Encrypt/Cipher.php\n\
  namespace Php7\\Encrypt;\nclass Cipher {\n    public $key = '';\n    public $salt\
  \ = 0;\n    public function __construct() {\n        $this->salt = rand(1,255);\n\
  \        $this->key = bin2hex(random_bytes(8));\n    }\n    public function encode(string\
  \ $plain) {\n        return $this->encrypt($plain);\n    }\n}\n```\n\n- 接下来，让我们定义一个名为\
  \ encrypt() 的私有方法，该方法使用 str_rot13() 生成加密文本。请注意，该方法被标记为 final。虽然这没有任何意义，但为了本说明的目的，请假设这是有意为之：\n\
  \n```php\nfinal private function encrypt(string $plain) {\n    return base64_encode(str_rot13($plain));\n\
  }\n```\n\n- 最后，让我们定义一个简短的调用程序，创建类实例并调用已定义的方法：\n\n```php\n// /repo/ch09/php7_oop_diffs_private_method.php\n\
  include __DIR__ . '/../src/Server/Autoload/Loader.php';\n$loader = new \\Server\\\
  Autoload\\Loader();\nuse Php7\\Encrypt\\{Cipher,OpenCipher};\n$text = 'Super secret\
  \ message';\n$cipher1 = new Cipher();\necho $cipher1->encode($text) . \"\\n\";\n\
  $cipher2 = new OpenCipher();\nvar_dump($cipher2->encode($text));\n```\n\n如果我们在 PHP\
  \ 7 中运行调用程序，我们将得到以下输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch09 ]#\nphp php7_oop_diffs_private_method.php\n\
  RmhjcmUgZnJwZKJnIHpyZmZudHI=\nPHP Fatal error: Cannot override final method Php7\\\
  Encrypt\\Cipher::encrypt() in /repo/src/Php7/Encrypt/OpenCipher.php on line 21\n\
  ```\n\n在这里，您可以看到 Cipher 的输出已正确生成。然而，已抛出致命错误，并显示一条消息，指出我们无法覆盖 final 方法。理论上，私有方法应该对子类完全不可见。然而，正如您从输出中清楚看到的那样，情况并非如此。Cipher\
  \ 超类私有方法的方法签名影响了我们在子类中重新定义相同方法的能力。\n\n然而在 PHP 8 中，这一悖论已得到解决。以下是同一代码在 PHP 8 中运行的输出：\n\
  \n```\nroot@php8_tips_php8 [ /repo/ch09 ]#\nphp php7_oop_diffs_private_method.php\n\
  PHP Warning: Private methods cannot be final as they are never overridden by other\
  \ classes in /repo/src/Php7/Encrypt/Cipher.php on line 17\nRmhjcmUgZnJwZXJnIHpyZmZudHI=\n\
  array(2) {\n[\"tag\"]=> string(24) \"woD6Vi73/IXLaKHFGUC3aA==\"\n[\"cipher\"]=>\
  \ string(28) \"+vd+jWKqo8WFPd7SakSvszkoIX0=\"\n```\n\n如前述输出所示，应用程序成功运行，并且父类和子类的输出都显示出来了。我们还可以看到一个警告，告知我们私有方法不能标记为\
  \ final。\n\n> **提示**\n> \n> 有关私有方法签名的背景讨论的更多信息，请查看这个文档参考：\n> https://wiki.php.net/rfc/inheritance_private_methods.\n\
  \n现在您已经了解了 PHP 8 如何防止子类看到超类中的私有方法，让我们把注意力转向 PHP 8 中匿名类的差异。\n\n## 控制匿名类的使用\n\n**匿名类**，根据其定义本身，没有名称。然而，为了信息目的，PHP\
  \ 信息函数如 `var_dump()`、`var_export()`、`get_class()`，以及 Reflection 扩展中的其他类会将匿名类简单报告为\
  \ `class@anonymous`。然而，当匿名类扩展另一个类或实现接口时，让 PHP 信息函数反映这一事实可能会有用。\n\n在 PHP 8 中，扩展类或实现接口的匿名类现在通过更改分配给匿名类的标签来反映这一事实，改为\
  \ Xyz@anonymous，其中 Xyz 是类或接口的名称。如果匿名类实现多个接口，则只会出现第一个接口。如果匿名类扩展类并同时实现一个或多个接口，则其标签中会出现其扩展的类名。下面的表格总结了这些可能性：\n\
  \n| 上下文 | 新名称 |\n|---|---|\n| 继承 Xyz | Xyz@anonymous |\n| 实现 Abc | Abc@anonymous\
  \ |\n| 实现 Abc, Def | Abc@anonymous |\n| 继承 Xyz 实现 Abc | Xyz@anonymous |\n\n表 9.4\
  \ – 匿名类提升\n\n请记住，PHP 已经可以测试匿名类以查看它是否属于某条继承线。例如，instanceof 运算符可用于此目的。以下示例说明了如何测试匿名类的继承性，以及如何查看其新名称：\n\
  \n- 对于此示例，我们将定义一个 DirectoryIterator 实例，从当前目录获取文件列表：\n- 然后，我们将定义一个扩展 FilterIterator\
  \ 的匿名类。在该类中，我们将定义 accept() 方法，该方法产生布尔结果。如果结果为 TRUE，则该项将出现在最终迭代中：\n\n```php\n// /repo/ch09/php8_oop_diff_anon_class_renaming.php\n\
  $iter = new DirectoryIterator(__DIR__);\n```\n\n```php\n$anon = new class ($iter)\
  \ extends FilterIterator {\n    public $search = '';\n    public function accept()\
  \ {\n        return str_contains(\n            $this->current(), $this->search);\n\
  \    }\n};\n```\n\n\n\n3. 接下来，我们将生成一个包含 bc_break 在名称中的文件列表：\n\n```\n$anon->search\
  \ = 'bc_break';\nforeach ($anon as $fn) echo $fn . \"\\n\";\n```\n\n4. 在接下来的两行中，我们将使用\
  \ instanceof 测试匿名类是否实现了 OuterInterface：\n\n```\nif ($anon instanceof OuterIterator)\n\
  \    echo \"This object implements OuterIterator\\n\";\n```\n\n5. 最后，我们将使用 var_dump()\
  \ 简单地转储匿名类的内容：\n\n```\necho var_dump($anon);\n```\n\n这里是在 PHP 8 下运行的输出！我们无法在 PHP\
  \ 7 中运行此示例，因为该版本缺少 str_contains() 函数！\n\n```\nroot@php8_tips_php8 [ /repo/ch09 ]#\n\
  php php8_oop_diff_anon_class_renaming.php\nphp8_bc_break_construct.php\nphp8_bc_break_serialization.php\n\
  php8_bc_break_destruct.php\nphp8_bc_break_sleep.php\nphp8_bc_break_scanner.php\n\
  php8_bc_break_serializable.php\nphp8_bc_break_magic_wrong.php\nphp8_bc_break_magic.php\n\
  php8_bc_break_magic_to_string.php\nThis object implements OuterIterator\nobject(FilterIterator@anonymous)#2\
  \ (1) {\n    [\"search\"]=> string(8) \"bc_break\"\n}\n```\n\n正如你所见，instanceof 正确报告匿名类实现了\
  \ OuterInterface（因为它扩展了 FilterIterator，而 FilterIterator 又实现了 OuterInterface）。你也可以看到\
  \ var_dump() 将匿名类的名称报告为 FilterIterator@anonymous。\n\n现在你对 PHP 8 中匿名类命名是如何变化的有了一个概念，让我们来看看命名空间处理的变化。\n\
  \n## 理解命名空间的变化\n\n命名空间的概念在 PHP 5.3 中引入，作为隔离类层级的一种手段。不幸的是，用于解析命名空间名称的原始算法存在多个缺陷。除了过于复杂之外，命名空间和类名在内部被标记化的方式也不一致，导致出现意外的错误。\n\
  \n在讨论其好处和潜在的向后兼容性破坏之前，让我们先看看命名空间标记化过程是如何变化的。\n\n## 发现标记化的差异\n\n标记化过程是解释过程的重要组成部分，并在你的\
  \ PHP 代码执行时发生。在生成字节码的过程中，PHP 程序代码会被 PHP 解析引擎分解为标记。\n\n下表总结了命名空间标记化的变化：\n\n| 命名空间\
  \ + 类 | 旧标记化 | 新标记化 |\n|---|---|---|\n| JustClass | T_STRING | T_STRING |\n| \\\
  AbsoluteClass | T_NS_SEPARATOR + T_STRING | T_NAME_FULLY_QUALIFIED |\n| Some\\Thing\\\
  Class | T_STRING + T_NS_SEPARATOR + T_STRING | T_NAME_QUALIFIED |\n| <namespace>\\\
  Class | T_NAMESPACE + T_NS_SEPARATOR + T_STRING | T_NAME_RELATIVE |\n\n表 9.5 – PHP\
  \ 8 中命名空间标记化差异\n\n正如你所见，PHP 8 的命名空间标记化要简单得多且更精简。\n\n> **提示**\n> \n> 有关解析器标记的更多信息，请参阅以下文档参考：https://www.php.net/manual/en/tokens.\n\
  \n这一变化的影响产生了极其积极的结果。首先，你现在可以在命名空间中使用保留关键字。此外，未来随着语言中引入新关键字，PHP 不会强制你更改应用程序中的命名空间。新的标记化过程也促进了\
  \ Attributes 与命名空间一起使用。\n\n首先，让我们看看在命名空间中使用关键字。\n\n## 在命名空间中使用保留关键字\n\nPHP 7 中的命名空间标记化过程会生成一系列字符串（T_STRING）和反斜杠（T_NS_SEPARATOR）标记。这种方法的问题在于，如果其中一个字符串碰巧是\
  \ PHP 关键字，解析过程中会立即抛出语法错误。然而，PHP 8 仅生成一个标记，如表 9.5 中前面所示。最终，这意味着你可以将几乎任何内容放在命名空间中，而不必担心保留关键字冲突。\n\
  \n以下代码示例说明了 PHP 8 与早期版本之间命名空间处理的差异。在此示例中，PHP 关键字被用作命名空间的一部分。在 PHP 7 中，由于其不准确的标记化过程，List\
  \ 被视为关键字而不是命名空间的一部分：\n\n```\n```php\n// /repo/ch09/php8_namespace_reserved.php\n\
  namespace List\\Works\\Only\\In\\PHP8;\nclass Test {\n    public const TEST = 'TEST';\n\
  }\necho Test::TEST . \"\\n\";\n```\n```\n\n这里是 PHP 7 的输出：\n\n```\n```\nroot@php8_tips_php7\
  \ [ /repo/ch09 ]#\nphp php8_namespace_reserved.php\nPHP Parse error: syntax error,\
  \ unexpected 'List' (T_LIST),\nexpecting '{' in /repo/ch09/php8_namespace_reserved.php\
  \ on line 3\n```\n```\n\n在 PHP 8 中，程序代码片段按预期工作，如下所示：\n\n```\n```\nroot@php8_tips_php8\
  \ [ /repo/ch09 ]#\nphp php8_namespace_reserved.php\nTEST\n```\n```\n\n现在你对标记化过程在\
  \ PHP 8 与早期 PHP 版本之间的差异以及其潜在好处有了一个概念，让我们来看看潜在的向后兼容代码破坏。\n\n## 暴露不良的命名空间命名实践\n\n\
  同样的 PHP 8 标记化过程使你不必担心关键字冲突，也可能暴露不良的命名空间命名实践。任何包含空白的命名空间现在都被视为无效。然而，无论如何，在命名空间中包含空白都是不好的做法！\n\
  \n以下简单代码示例说明了这一原则。在此示例中，你会注意到命名空间包含空白：\n\n// /repo/ch09/php7_namespace_bad.php\n\
  namespace Doesnt \\Work \\In \\PHP8;\nclass Test {\n    public const TEST = 'TEST';\n\
  }\necho Test::TEST . \"\\n\";\n\n如果我们在 PHP 7 中运行此代码，它可以正常工作。以下是 PHP 7 的输出：\n\n```\n\
  root@php8_tips_php7 [ /repo/ch09 ]#\nphp php7_namespace_bad.php\nTEST\n```\n\n然而，在\
  \ PHP 8 中，会抛出 ParseError，如下所示：\n\n```\nroot@php8_tips_php8 [ /repo/ch09 ]#\nphp\
  \ php7_namespace_bad.php\nPHP Parse error: syntax error, unexpected fully qualified\
  \ name \"\\Work\", expecting \"{\" in /repo/ch09/php7_namespace_bad.php on line\
  \ 3\n```\n\n空格充当解析器在标记化过程中使用的分隔符。在此代码示例中，PHP 8 假设命名空间是 Doesnt。下一个标记是 \\ Work，它标记了一个完全限定的类名。然而，在此时并不期望它，这就是为什么会抛出错误的原因。\n\
  \n这结束了我们对 PHP 8 中命名空间处理所做的更改的讨论。你现在处于更好的位置，可以在 PHP 8 中创建命名空间名称，这些名称不仅遵循最佳实践，而且还能利用其独立于关键字命名冲突的特性。\n\
  \n## 摘要\n\nPHP 8，正如你所学到的那样，在定义魔术方法方面严格得多。在本章中，你学习了方法签名更改以及如何通过正确使用魔术方法来减少潜在错误。你还学习了\
  \ Reflection 和 PDO 扩展中的方法签名更改。有了本章获得的知识，你可以在迁移到 PHP 8 时避免潜在问题。此外，你还学习了静态方法调用方式的变化，以及一种新的静态返回类型。\n\
  \n然后，你学习了如何最好地使用私有方法，以及如何对匿名类施加更大的控制。你还了解了一些关于新语法可能性以及由于语言更改而现在已过时的方法的提示。\n\n你还学习了如何正确使用接口和\
  \ trait 以促进代码的高效使用。你了解了引入的新接口，以使 DOM 扩展符合新的 DOM Living Standard。此外，你还深入了解了 DateTime\
  \ 扩展中引入的新方法的使用。\n\n最后，你学习了如何清理命名空间使用并生成更紧凑的代码。你现在对命名空间标记化过程的不准确性以及它在 PHP 8 中是如何改进的有了更好的理解。\n\
  \n下一章将为你呈现每个开发人员都努力追求的东西：提高性能的技巧、窍门和技术。\n\n\n"
- "## 10 提升性能\n\nPHP 8.x 引入了许多对性能产生积极影响的新特性。此外，许多内部改进，尤其是在数组处理和对象引用管理方面，导致了相比早期 PHP\
  \ 版本的实质性性能提升。此外，本章涵盖的许多 PHP 8 最佳实践带来了更高的效率和更低的内存使用。在本章中，您将了解如何优化 PHP 8 代码以实现最大性能。\n\
  \nPHP 8 包含一种被称为弱引用的技术。通过掌握本章最后一节讨论的该技术，您的应用程序将使用更少的内存。通过仔细回顾本章涵盖的材料并研究代码示例，您将能够编写更快、更高效的代码。这种精通将极大地提高您作为\
  \ PHP 开发人员的地位，并带来满意的客户，同时提高您的职业发展潜力。\n\n本章涵盖的主题包括以下内容：\n\n- 使用 **即时编译 (JIT)** 编译器\n\
  - 加速数组处理\n- 实现稳定排序\n- 使用弱引用提高效率\n\n### 技术要求\n\n要检查和运行本章提供的代码示例，推荐的最低硬件配置如下：\n\n\
  - 基于 x86_64 的台式电脑或笔记本电脑\n- 1 千兆字节（GB）可用磁盘空间\n- 4 GB 内存\n- 500 千比特每秒（Kbps）或更快的互联网连接\n\
  \n此外，您需要安装以下软件：\n\n- Docker\n- Docker Compose\n\n请参阅 *第 1 章，介绍新的 PHP 8 OOP 特性* 中的\
  \ *技术要求* 部分，了解有关 Docker 和 Docker Compose 安装的更多信息，以及如何构建用于演示本书中解释的代码的 Docker 容器。在本书中，我们将存放本书示例代码的目录称为\
  \ `/repo`。\n\n本章的源代码位于此处： https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices。\
  \ 我们现在可以开始讨论，先来看看备受期待的 JIT 编译器。\n\n### 使用 JIT 编译器\n\nPHP 8 引入了备受期待的 **JIT 编译器**。这是重要的一步，对\
  \ PHP 语言的长期可行性具有重要影响。尽管 PHP 已经具备生成和缓存 **字节码** 的能力，但在 JIT 编译器引入之前，PHP 没有直接缓存 **机器码**\
  \ 的能力。\n\n实际上，自 2011 年以来，已经有多次尝试为 PHP 添加 JIT 编译器功能。PHP 7 中看到的性能提升正是这些早期努力的直接结果。由于这些早期\
  \ JIT 编译器尝试并未显著提升性能，因此均未作为 **RFC（征求意见稿）** 提出。核心团队现在认为，任何进一步的性能提升只能通过使用 JIT 实现。作为附带好处，这为\
  \ PHP 作为非 Web 环境的语言使用打开了可能性。另一个好处是 JIT 编译器为使用 C 以外的语言开发 PHP 扩展提供了可能性。\n\n非常重要的是要密切关注本章提供的细节，因为正确使用新的\
  \ JIT 编译器有可能极大地提高您的 PHP 应用程序的性能。在深入实现细节之前，首先有必要解释 PHP 如何在没有 JIT 编译器的情况下执行字节码。然后我们将向您展示\
  \ JIT 编译器的工作原理。在此之后，您将更好地理解各种设置以及如何对其进行微调，以为您的应用程序代码产生最佳性能。\n\n现在让我们把注意力转向 PHP 在没有\
  \ JIT 编译器的情况下的工作方式。\n\n### 了解 PHP 在没有 JIT 时的工作原理\n\n当 PHP 安装在服务器上（或 Docker 容器中）时，除了核心扩展之外，安装的主要组件实际上是一个通常被称为\
  \ Zend Engine 的虚拟机（VM）。该 VM 的运行方式与 VMware 或 Docker 等虚拟化技术大不相同。Zend Engine 在性质上更接近\
  \ Java 虚拟机（JVM），因为它接受字节码并生成机器码。\n\n这就引出了一个问题：什么是字节码，什么是机器码？现在让我们来看看这个问题。\n\n###\
  \ 理解字节码和机器码\n\n机器码，或机器语言，是一组由 CPU 直接理解的硬件指令。每条机器码都是一条指令，会导致 CPU 执行特定操作。这些低级操作包括在寄存器之间移动信息、在内存中进出移动指定数量的字节、加法、减法等等。\n\
  \n机器码通常通过使用汇编语言变得 somewhat 人类可读。以下是用汇编语言呈现的机器码示例：\n\n```\nJIT$Mandelbrot::iterate:\
  \ ;\n    sub $0x10, %esp\n    cmp $0x1, 0x1c(%esi)\n    jb .L14\n    jmp .L1\n.ENTRY1:\n\
  \    sub $0x10, %esp\n.L1:\n    cmp $0x2, 0x1c(%esi)\njb .L15\nmov $0xec3800f0,\
  \ %edi\njmp .L2\n.ENTRY2:\nsub $0x10, %esp\n.L2:\ncmp $0x5, 0x48(%esi)\njnz .L16\n\
  vmovsd 0x40(%esi), %xmm1\nvsubsd 0xec380068, %xmm1, %xmm1\n```\n\n尽管在大多数情况下命令不易理解，但从汇编语言表示中可以看出，指令包括比较命令（cmp）、在寄存器和/或内存之间移动信息（mov），以及跳转到指令集中的另一点（jmp）。\n\
  \n字节码，也称为 **操作码**，是原始程序代码的高度简化的符号表示。字节码由解析过程（通常称为 **解释器**）生成，该过程将人类可读的程序代码分解为称为\
  \ **标记** 的符号以及值。值可以是程序代码中使用的任何字符串、整数、浮点数和布尔数据。\n\n以下是基于稍后所示用于创建 Mandelbrot 的示例代码生成的字节码片段示例：\n\
  \n```\n00000840  ff ff ff ff 00 00 00 00  ff ff ff ff ff ff ff ff  |................|\n\
  00000850  40 02 00 00 00 00 00 00  0d 00 00 00 00 ff ff ff ff  |@..............|\n\
  00000860  1d aa 83 9f 7a c3 f4 d5  20 08 00 00 00 00 00 00  |....z....... ...|\n\
  00000870  01 00 00 00 56 00 00 00  1d aa 83 9f 7a c3 f4 d5  |....V.....z....|\n\
  00000880  39 00 00 00 00 00 00 00  00 70 68 70 38 5c 6a 69  |9......php8\\ji|\n\
  00000890  74 5c 6d 61 6e 64 65 6c 62  62 72 6f 74 2f 72 65 70  |t\\mandelbrot/rep|\n\
  000008a0  6f 2f 73 72 63 2f 50 68 70  38 2f 4a 69 74 2f 4d  |o/src/Php8/Jit/M|\n\
  000008b0  61 6e 64 65 6c 62 72 6f 74  74 2e 70 68 70 3a 35 24  |andelbrot.php:5$|\n\
  000008c0  30 00 00 00 00 00 00 00  01 00 00 00 56 00 00 00  |0........V...|\n000008d0\
  \  8c 06 62 77 f6 61 07 b3  13 00 00 00 00 00 00 00  |..bw.a........|\n000008e0\
  \  50 68 70 38 5c 6a 69 74  5c 4d 61 6e 64 65 6c 62  |Php8\\Jit\\Mandelb|\n000008f0\
  \  72 6f 74 00 00 00 00 00  ff ff ff ff ff ff ff ff  |rot...........|\n```\n\n图\
  \ 10.1 – PHP 解析过程产生的字节码片段\n\n现在让我们来看看 PHP 程序的常规执行流程。\n\n### 理解常规 PHP 程序执行\n\n在常规\
  \ PHP 程序运行周期中，PHP 程序代码由称为 **解析** 的操作进行评估并分解为字节码。然后字节码被传递给 Zend Engine，后者进而将字节码转换为机器码。\n\
  \n当 PHP 第一次安装在服务器上时，安装过程会启动必要的逻辑，将 Zend Engine 定制为该特定服务器的特定 CPU 和硬件（或虚拟 CPU 和硬件）。因此，当您编写\
  \ PHP 代码时，您对最终运行代码的实际 CPU 的具体细节没有任何了解。提供硬件特定感知的是 Zend Engine。\n\n*图 10.2，接下来所示，说明了常规\
  \ PHP 执行：*\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_391_0.png)\n\n图 10.2 – 常规\
  \ PHP 程序执行流程\n\n尽管 PHP，尤其是 PHP 7，已经相当快，但获得额外速度仍然很有意义。为此，大多数安装还启用了 PHP **OPcache**\
  \ 扩展。在继续 JIT 编译器之前，让我们先快速了解一下 OPcache。\n\n### 理解 PHP OPcache 的运行机制\n\n顾名思义，PHP OPcache\
  \ 扩展在 PHP 程序首次运行时 *缓存* 操作码（字节码）。在后续程序运行中，字节码从缓存中取出，从而消除了解析阶段。这节省了大量时间，并且是在生产站点上启用的一项非常理想的功能。PHP\
  \ OPcache 扩展是核心扩展集的一部分；然而，它默认未启用。\n\n\n\n在启用此扩展之前，您必须首先确认您的 PHP 版本是否已使用 --enable-opcache\
  \ 配置选项编译。您可以通过在运行在 Web 服务器上的 PHP 代码中执行 phpinfo() 命令来检查这一点。从命令行，输入 php -i 命令。以下是使用本书中使用的\
  \ Docker 容器运行 php -i 的示例：\n\n```\nroot@php8_tips_php8 [ /repo/ch10 ]# php -i\nphpinfo()\n\
  PHP Version => 8.1.0-dev\nSystem => Linux php8_tips_php8 5.8.0-53-generic #60~20.04.1-Ubuntu\
  \ SMP Thu May 6 09:52:46 UTC 2021 x86_64\nBuild Date => Dec 24 2020 00:11:29\nBuild\
  \ System => Linux 9244ac997bc1 3.16.0-4-amd64 #1 SMP Debian 3.16.7-ckt11-1 (2015-05-24)\
  \ x86_64 GNU/Linux\nConfigure Command => './configure' '--prefix=/usr' '--sysconfdir=/etc'\
  \ '--localstatedir=/var' '--datadir=/usr/share/php' '--mandir=/usr/share/man' '--enable-fpm'\
  \ '--with-fpm-user=apache' '--with-fpm-group=apache'\n// not all options shown\n\
  '--with-jpeg' '--with-png' '--with-sodium=/usr' '--enable-opcache-jit' '--with-pcre-jit'\
  \ '--enable-opcache'\n```\n\n从输出中可以看到，OPcache 已包含在此 PHP 安装的配置中。要启用 OPcache，请添加或取消注释以下\
  \ php.ini 文件设置：\n\n- zend_extension=opcache\n- opcache.enable=1\n- opcache.enable_cli=1\n\
  \n最后一个设置是可选的。它决定 PHP 命令行执行的命令是否也由 OPcache 处理。启用后，还有许多其他 php.ini 文件设置会影响性能，然而，这些超出了本次讨论的范围。\n\
  \n> **Tip**\n> \n> 有关影响 OPcache 的 PHP php.ini 文件设置的更多信息，请查看此处：https://www.php.net/manual/en/opcache.configuration.php。\n\
  \n让我们现在来看看 JIT 编译器的运行方式，以及它与 OPcache 的区别。\n\n## Discovering PHP program execution\
  \ with the JIT compiler\n\n当前方法的问题在于，无论字节码是否被缓存，Zend Engine 每次程序请求时仍需要将字节码转换为机器码。JIT\
  \ 编译器提供的能力不仅是将字节码编译为机器码，还可以缓存机器码。该过程由创建请求跟踪的跟踪机制促进。跟踪允许 JIT 编译器确定哪些机器代码块需要优化和缓存。使用\
  \ JIT 编译器的执行流程在图 10.3 中进行了总结：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_393_0.png)\n\
  \n图 10.3 – 使用 JIT 编译器的 PHP 执行流程\n\n从图中可以看到，包含 OPcache 的正常执行流程仍然存在。主要区别在于请求可能会触发跟踪，导致程序流程立即转移到\
  \ JIT 编译器，有效地绕过了不仅是解析过程而且还绕过了 Zend Engine。JIT 编译器和 Zend Engine 都可以生成可直接执行的机器码。\n\
  \nJIT 编译器并非凭空出现。PHP 核心团队选择移植了性能高且经过充分测试的 DynASM 预处理汇编器。虽然 DynASM 最初是为 Lua 编程语言使用的\
  \ JIT 编译器开发的，但其设计使其非常适合作为任何基于 C 的语言（如 PHP！）的 JIT 编译器的基础。\n\nPHP JIT 实现的另一个有利方面是它不会产生任何\
  \ **Intermediate Representation (IR)** 代码。相比之下，用于运行使用 JIT 编译器技术运行 Python 代码的 **PyPy\
  \ VM**，必须先在 **graph structure** 中生成 IR 代码，用于流分析 and 优化，然后才生成实际的机器码。PHP JIT 中的 DynASM\
  \ 核心不需要此额外步骤，从而实现了比其他解释型编程语言更高的性能。\n\n> **Tip**\n> \n> 有关 DynASM 的更多信息，请查看此网站：`https://luajit.org/dynasm.html`。以下是\
  \ PHP 8 JIT 运行方式的优秀概述：`https://www.zend.com/blog/exploring-new-php-jit-compiler`。您也可以在此处阅读官方\
  \ JIT RFC：`https://wiki.php.net/rfc/jit`。\n\n现在您已经了解了 JIT 编译器如何融入 PHP 程序执行周期的总体流程，是时候学习如何启用它了。\n\
  \n## Enabling the JIT compiler\n\n由于 JIT 编译器的主要功能是缓存机器码，因此它作为 OPcache 扩展的独立部分运行。OPcache\
  \ 既充当启用 JIT 功能的网关，也从其自身分配中为 JIT 编译器分配内存。因此，为了启用 JIT 编译器，您必须首先启用 OPcache（请参阅上一节，*Understanding\
  \ the operation of PHP OPcache*）。\n\n为了启用 JIT 编译器，您必须首先确认 PHP 已使用 `--enable-opcache-jit`\
  \ 配置选项编译。然后，您可以通过简单地将非零值分配给 `php.ini` 文件的 `opcache.jit_buffer_size` 指令来启用或禁用 JIT\
  \ 编译器。\n\n值指定为整数——在这种情况下，值表示字节数；值为零（默认值），禁用 JIT 编译器；或者您可以分配一个数字后跟以下字母之一：\n\n- K:\
  \ 千字节\n- M: 兆字节\n- G: 千兆字节\n\n您为 JIT 编译器缓冲区大小指定的值必须小于您分配给 OPcache 的内存分配，因为 JIT 缓冲区是从\
  \ OPcache 缓冲区中取出。\n\n以下是将 OPcache 内存消耗设置为 256 M 并将 JIT 缓冲区设置为 64 M 的示例。这些值可以放在 php.ini\
  \ 文件的任何位置：\n\n```\nopcache.memory_consumption=256\nopcache.jit_buffer_size=64M\n\
  ```\n\n现在您已经了解了 JIT 编译器的运行方式以及如何启用它，极其重要的是您知道如何正确设置跟踪模式。\n\n## Configuring the tracing\
  \ mode\n\nphp.ini 设置 opcache.jit 控制 JIT 跟踪器操作。为方便起见，可以使用以下四种预设字符串之一：\n\n- `opcache.jit=disable`\n\
  \  完全禁用 JIT 编译器（无论其他设置如何）。\n- `opcache.jit=off`\n  禁用 JIT 编译器，但在大多数情况下您可以使用 `ini_set()`\
  \ 在运行时启用它。\n- `opcache.jit=function`\n  将 JIT 编译器跟踪器设置为函数模式。此模式对应于 **CPU Register\
  \ Trigger Optimization (CRTO)** 数字 1205（接下来解释）。\n- `opcache.jit=tracing`\n  将 JIT\
  \ 编译器跟踪器设置为跟踪模式。此模式对应于 CRTO 数字 1254（接下来解释）。在大多数情况下，此设置可为您提供最佳性能。\n- `opcache.jit=on`\n\
  \  这是跟踪模式的别名。\n\n> **Tip**\n> \n> 依赖运行时 JIT 激活存在风险，可能导致应用程序行为不一致。最佳做法是使用 `tracing`\
  \ 或 `function` 设置。\n\n这四个方便的字符串实际上解析为一个四位数。每个数字对应于 JIT 编译器跟踪器的不同方面。这四个数字不是位掩码，不像其他\
  \ `php.ini` 文件设置，并且按此顺序指定：`CRTO`。以下是每个数字的摘要。\n\n### C (CPU opt flags)\n\n第一个数字表示\
  \ CPU 优化设置。如果将此数字设置为 0，则不进行 CPU 优化。值为 1 可启用 **Advanced Vector Extensions (AVX) instructions**\
  \ 的生成。AVX 是英特尔和 AMD 微处理器的 x86 指令集架构的扩展。AVX 已在英特尔和 AMD 处理器上得到支持，自 2011 年以来。AVX2 可在大多数服务器型处理器上使用，例如英特尔\
  \ Xeon。\n\n### R (register allocation)\n\n第二个数字控制 JIT 编译器如何处理 **registers**。寄存器类似于\
  \ RAM，只是它们直接位于 CPU 内部。CPU 不断将信息移入和移出寄存器以执行操作（例如，加法、减法、执行逻辑 AND、OR 和 NOT 操作等）。与此设置相关的选项允许您禁用寄存器分配优化或在本地或全局级别允许它。\n\
  \n### T (JIT trigger)\n\n第三个数字决定 JIT 编译器何时触发。选项包括让 JIT 编译器在脚本首次加载时或首次执行时运行。或者，您可以指示\
  \ JIT 何时编译 **hot functions**。热函数是调用最频繁的函数。还有一个设置告诉 JIT 仅编译带有 `@jit` `docblock` 注解的函数。\n\
  \n### O (optimization level)\n\n第四个数字对应于优化级别。选项包括禁用优化、最小和选择性。您还可以指示 JIT 编译器根据单个函数、调用树或内部过程分析的结果进行优化。\n\
  \n\n\n\n> 提示\n> 有关四种 JIT 编译器跟踪器设置的完整分解，请查看此文档参考页面：https://www.php.net/manual/en/opcache.configuration.php#ini.opcache.jit.\n\
  \n现在让我们看看 JIT 编译器的实际运行情况。\n\n## 使用 JIT 编译器\n\n在本示例中，我们使用一个经典的基准测试程序来生成 **Mandelbrot**。这是一个极佳的测试，因为它极其计算密集。我们在此使用的实现取自\
  \ **Dmitry Stogov** 编写的实现代码，他是 PHP 核心开发团队成员之一。你可以在此处查看原始实现：https://gist.github.com/dstogov/12323ad13d3240aee8f1：\n\
  \n1. 我们首先定义 Mandelbrot 参数。尤其是迭代次数（MAX_LOOPS）非常重要。较大的数值会产生更多计算并减慢整体执行速度。我们还捕获开始时间：\n\
  \n```php\n// /repo/ch10/php8_jit_mandelbrot.php\ndefine('BAILOUT', 16);\ndefine('MAX_LOOPS',\
  \ 10000);\ndefine('EDGE', 40.0);\n$d1 = microtime(1);\n```\n\n2. 为了便于多次程序运行，我们添加了一个选项来捕获命令行参数\
  \ -n。如果存在此参数，则 Mandelbrot 输出将被抑制：\n\n```php\n$time_only = (bool) ($argv[1] ?? $_GET['time']\
  \ ?? FALSE);\n```\n\n3. 然后，我们定义一个函数 iterate()，直接取自 Dmitry Stogov 的 Mandelbrot 实现。实际代码在此未显示，可在前面提到的\
  \ URL 中查看。\n\n4. 接下来，我们通过遍历由 EDGE 确定的 X/Y 坐标来生成 ASCII 图像：\n\n```php\n$out = '';\n\
  $f = EDGE - 1;\nfor ($y = -$f; $y < $f; $y++) {\n    for ($x = -$f; $x < $f; $x++)\
  \ {\n        $out .= (iterate($x/EDGE,$y/EDGE) == 0)\n            ? '*' : ' ';\n\
  \    }\n    $out .= \"\\n\";\n}\n```\n\n5. 最后，我们生成输出。如果通过 Web 请求运行，输出将被包裹在 <pre>\
  \ 标签中。如果存在 -n 标志，则只显示经过的时间：\n\n```php\nif (!empty($_SERVER['REQUEST_URI'])) {\n\
  \    $out = '<pre>' . $out . '</pre>';\n}\nif (!$time_only) echo $out;\n$d2 = microtime(1);\n\
  $diff = $d2 - $d1;\nprintf(\"\\nPHP Elapsed %0.3f\\n\", $diff);\n```\n\n6. 我们首先在\
  \ PHP 7 Docker 容器中使用 -n 标志运行程序三次。以下是结果。请注意，在与本书一起使用的演示 Docker 容器中，经过的时间很容易超过 10\
  \ 秒：\n\n```\nroot@php8_tips_php7 [ /repo/ch10 ]#\nphp php8_jit_mandelbrot.php -n\n\
  PHP Elapsed 10.320\nroot@php8_tips_php7 [ /repo/ch10 ]#\nphp php8_jit_mandelbrot.php\
  \ -n\nPHP Elapsed 10.134\nroot@php8_tips_php7 [ /repo/ch10 ]#\nphp php8_jit_mandelbrot.php\
  \ -n\nPHP Elapsed 11.806\n```\n\n7. 现在我们转向 PHP 8 Docker 容器。首先，我们调整 php.ini 文件以禁用\
  \ JIT 编译器。以下是设置：\n\n```\nopcache.jit=off\nopcache.jit_buffer_size=0\n```\n\n8. 以下是使用\
  \ -n 标志在 PHP 8 中运行程序三次的结果：\n\n```\nroot@php8_tips_php8 [ /repo/ch10 ]#\nphp php8_jit_mandelbrot.php\
  \ -n\nPHP Elapsed 1.183\nroot@php8_tips_php8 [ /repo/ch10 ]#\nphp php8_jit_mandelbrot.php\
  \ -n\nPHP Elapsed 1.192\nroot@php8_tips_php8 [ /repo/ch10 ]#\nphp php8_jit_mandelbrot.php\
  \ -n\nPHP Elapsed 1.210\n```\n\n9. 立即可见切换到 PHP 8 的一个很好的理由！即使没有 JIT 编译器，PHP 8 也能在略高于\
  \ 1 秒的时间内执行相同的程序：时间约为 1/10！\n\n10. 接下来，我们修改 php.ini 文件设置以使用 JIT 编译器函数跟踪器模式。以下是使用的设置：\n\
  \n```\nopcache.jit=function\nopcache.jit_buffer_size=64M\n```\n\n11. 然后我们再次使用 -n\
  \ 标志运行相同的程序。以下是使用 JIT 编译器函数跟踪器模式在 PHP 8 中运行的结果：\n\n```\nroot@php8_tips_php8 [ /repo/ch10\
  \ ]#\nphp php8_jit_mandelbrot.php -n\nPHP Elapsed 0.323\nroot@php8_tips_php8 [ /repo/ch10\
  \ ]#\nphp php8_jit_mandelbrot.php -n\nPHP Elapsed 0.322\nroot@php8_tips_php8 [ /repo/ch10\
  \ ]#\nphp php8_jit_mandelbrot.php -n\nPHP Elapsed 0.324\n```\n\n12. 哇！我们成功将处理速度提高了\
  \ 3 倍。速度现在不到 1/3 秒！但如果我们尝试推荐的 JIT 编译器跟踪模式会怎样？以下是调用该模式的设置：\n\n```\nopcache.jit=tracing\n\
  opcache.jit_buffer_size=64M\n```\n\n13. 以下是我们最后一组程序运行的结果：\n\n```\nroot@php8_tips_php8\
  \ [ /repo/ch10 ]#\nphp php8_jit_mandelbrot.php -n\nPHP Elapsed 0.132\nroot@php8_tips_php8\
  \ [ /repo/ch10 ]#\nphp php8_jit_mandelbrot.php -n\nPHP Elapsed 0.132\nroot@php8_tips_php8\
  \ [ /repo/ch10 ]#\nphp php8_jit_mandelbrot.php -n\nPHP Elapsed 0.131\n```\n\n最后的结果，如输出所示，令人震惊。不仅我们可以比没有\
  \ JIT 编译器的 PHP 8 快 10 倍地运行相同的程序，而且比 PHP 7 快 *100 倍*！\n\n> **重要提示**\n> 需要注意的是，时间会根据你用于运行本书相关\
  \ Docker 容器的主机计算机而有所不同。你不会看到与此处所示完全相同的时间。\n\n现在让我们看看 JIT 编译器的调试。\n\n## 使用 JIT 编译器进行调试\n\
  \n使用 **XDebug** 或其他工具进行常规调试在使用 JIT 编译器时效果不佳。因此，PHP 核心团队添加了一个额外的 `php.ini` 文件选项 `opcache.jit_debug`，它会产生额外的调试信息。在这种情况下，可用的设置采用位标志的形式，这意味着你可以使用按位运算符（如\
  \ AND、OR、XOR 等）将它们组合起来。\n\n*表 10.1* 总结了可分配给 `opcache.jit_debug` 设置的值。请注意，标记为 **内部常量**\
  \ 的列不显示 PHP 预定义常量。这些值是内部 C 代码引用：\n\n| 内部常量 | 值 | 含义 |\n|---|---|---|\n| ZEND_JIT_DEBUG_ASM\
  \ | 1 | 转储汇编代码 |\n| ZEND_JIT_DEBUG_SSA | 2 | 转储静态单赋值 |\n| ZEND_JIT_DEBUG_REG_ALLOC\
  \ | 4 | 寄存器分配信息 |\n| ZEND_JIT_DEBUG_ASM_STUBS | 8 | 汇编存根 |\n| ZEND_JIT_DEBUG_PERF\
  \ | 16 | 为 Linux perf 创建 perf.map |\n| ZEND_JIT_DEBUG_PERF_DUMP | 32 | 为 Linux perf\
  \ 创建 perf.dump |\n| ZEND_JIT_DEBUG_OPROFILE | 64 | Linux Oprofile 调试信息 |\n| ZEND_JIT_DEBUG_VTUNE\
  \ | 128 | Intel VTune 调试信息 |\n| ZEND_JIT_DEBUG_GDB | 256 | 使用 GNU 调试器进行调试 |\n| ZEND_JIT_DEBUG_SIZE\
  \ | 512 | 内存大小 |\n| ZEND_JIT_DEBUG_ASM_ADDR | 1024 | 汇编寻址 |\n| ZEND_JIT_DEBUG_TRACE_START\
  \ | 4096 | 跟踪开始 |\n| ZEND_JIT_DEBUG_TRACE_STOP | 8192 | 跟踪停止 |\n| ZEND_JIT_DEBUG_TRACE_COMPILED\
  \ | 16384 | 跟踪编译 |\n| ZEND_JIT_DEBUG_TRACE_EXIT | 32768 | 跟踪退出 |\n| ZEND_JIT_DEBUG_TRACE_ABORT\
  \ | 65536 | 跟踪中止 |\n| ZEND_JIT_DEBUG_TRACE_BLACKLIST | 131072 | 跟踪黑名单 |\n| ZEND_JIT_DEBUG_TRACE_BYTECODE\
  \ | 262144 | 跟踪字节码引用 |\n| ZEND_JIT_DEBUG_TRACE_TSSA | 524288 | 跟踪静态单赋值 |\n| ZEND_JIT_DEBUG_TRACE_EXIT_INFO\
  \ | 1048576 | 跟踪退出信息 |\n\n表 10.1 – opcache.jit_debug 设置\n\n因此，例如，如果你想为 ZEND_JIT_DEBUG_ASM、ZEND_JIT_DEBUG_PERF\
  \ 和 ZEND_JIT_DEBUG_EXIT 启用调试，你可以在 php.ini 文件中按如下方式进行赋值：\n\n- 首先，你需要将想要设置的数值相加。在此示例中，我们将相加：\n\
  \n```\n1 + 16 + 32768\n```\n\n- 然后将总和应用到 php.ini 设置：\n\n```\nopcache.jit_debug=32725\n\
  ```\n\n- 或者， alternatively，使用按位或表示这些值：\n\n```\nopcache.jit_debug=1|16|32768\n```\n\
  \n根据调试设置，你现在可以使用 Linux perf 命令或 Intel VTune 等工具调试 JIT 编译器。\n\n以下是运行上一节讨论的 Mandelbrot\
  \ 测试程序时的部分调试输出示例。为说明目的，我们使用 php.ini 文件设置 opcache.jit_debug=32725：\n\n```\nroot@php8_tips\
  \ php8 [ /repo/ch10 ]#\nphp php8_jit_mandelbrot.php -n\n---- TRACE 1 start (loop)\
  \ iterate()\n/repo/ch10/php8_jit_mandelbrot.php:34\n---- TRACE 1 stop (loop)\n----\
  \ TRACE 1 Live Ranges\n#15.CV6($i): 0-0 last_use\n#19.CV6($i): 0-20 hint=#15.CV6($i)\n\
  ... not all output is shown\n---- TRACE 1 compiled\n---- TRACE 2 start (side trace\
  \ 1/7) iterate()\n/repo/ch10/php8_jit_mandelbrot.php:41\n---- TRACE 2 stop (return)\n\
  TRACE-2$iterate$41: ; (unknown)\n    mov $0x2, EG(jit_trace_num)\n    mov 0x10(%r14),\
  \ %rcx\n    test %rcx, %rcx\n    jz .L1\n    mov 0xb0(%r14), %rdx\n    mov %rdx,\
  \ (%rcx)\n    mov $0x4, 0x8(%rcx)\n... not all output is shown\n```\n\n输出向你展示的是以汇编语言呈现的机器代码。如果在使用\
  \ JIT 编译器时遇到程序代码问题，汇编语言转储可能有助于你找到错误源。\n\n但是，请注意汇编语言不可移植，并且完全面向所使用的 CPU。因此，你可能需要获取该\
  \ CPU 的硬件参考手册并查找正在使用的汇编语言代码。\n\n现在让我们看看影响 JIT 编译器运行的其他 php.ini 文件设置。\n\n\n\n## Discovering\
  \ additional JIT compiler settings\n\nTable 10.2 provides a summary of all other\
  \ opcache.jit* settings in the php.ini file that have not already been covered:\n\
  \n| opcache.* Setting | Type | Description |\n|---|---|---|\n| jit_bisect_limit\
  \ | int | 类似于断点，这会告诉 JIT 在达到此限制后停止。 使用它来隔离导致中断的过程。 |\n| jit_prof_threshold | float\
  \ | 如果你的 \"T\" 值设置为 2，此设置会设定函数被视为“热”的水平。 (# calls to this func) divided by the (#\
  \ calls to all funcs) must be > the value set here. For example, 0.1 means that\
  \ functions that comprise more than 10% of all calls will be compiled |\n| jit_max_root_traces\
  \ | int | 最大根跟踪数。 |\n| jit_max_side_traces | int | 最大侧跟踪数。 |\n| jit_max_exit_counters\
  \ | int | 侧跟踪退出计数器的最大数量。 限制侧跟踪的总数量。 |\n| jit_hot_loop | int | 循环在经过这么多次迭代后被视为“热”。\
  \ |\n| jit_hot_func | int | 函数在经过这么多次迭代后被视为“热”。 |\n| jit_hot_return | int | 返回在经过这么多次迭代后被视为“热”。\
  \ |\n| jit_hot_side_exit | int | 退出在经过这么多次迭代后被视为“热”。 |\n| jit_blacklist_root_trace\
  \ | int | 根跟踪编译在被列入黑名单前可以失败的最大次数。 |\n| jit_blacklist_side_trace | int | 侧跟踪编译在被列入黑名单前可以失败的最大次数。\
  \ |\n| jit_max_loop_unrolls | int | 在侧跟踪编译上尝试关闭循环失败并在被列入黑名单前的最大次数。 |\n| jit_max_recursive_calls\
  \ | int | 递归调用循环关闭可能失败的最大次数。 |\n| jit_max_recursive_returns | int | 递归返回循环关闭可能失败的最大次数。\
  \ |\n| jit_max_polymorphic_calls | int | 多态（动态或方法）调用可以内联的最大次数。 超过此限制的任何调用都被归类为巨型多态，不会被内联。\
  \ |\n\nTable 10.2 – Additional opcache.jit* php.ini file settings\n\nAs you can\
  \ see from the table, you have a high degree of control over how the JIT compiler\
  \ operates. Collectively, these settings represent thresholds that control decisions\
  \ the JIT compiler makes. These settings, if properly configured, allow the JIT\
  \ compiler to ignore infrequently used loops and function calls. We'll now leave\
  \ the exciting world of the JIT compiler and have a look at how to improve array\
  \ performance.\n\n## Speeding up array handling\n\nArrays are a vital part of any\
  \ PHP program. Indeed, dealing with arrays is unavoidable as much of the real-world\
  \ data your program handles day to day arrives in the form of an array. One example\
  \ is data from an HTML form posting. The data ends up in either $_GET or $_POST\
  \ as an array.\n\nIn this section, we'll introduce you to a little-known class included\
  \ with the SPL: the SplFixedArray class. Migrating your data from a standard array\
  \ over to a SplFixedArray instance will not only improve performance but requires\
  \ significantly less memory as well. Learning how to take advantage of the techniques\
  \ covered in this chapter can have a substantial impact on the speed and efficiency\
  \ of any program code currently using arrays with a massive amount of data.\n\n\
  ## Working with SplFixedArray in PHP 8\n\nThe SplFixedArray class, introduced in\
  \ PHP 5.3, is literally an object that acts like an array. Unlike ArrayObject, however,\
  \ this class requires you to place a hard limit on the array size, and only allows\
  \ integer indices. The reason why you might want to use SplFixedArray rather than\
  \ ArrayObject is SplFixedArray takes significantly less memory and is highly performant.\
  \ In fact, SplFixedArray actually takes less memory than a standard array with the\
  \ same data!\n\n## Comparing SplFixedArray with array and ArrayObject\n\nA simple\
  \ benchmark program illustrates the differences between a standard array, ArrayObject,\
  \ and SplFixedArray:\n\n- 1. First, we define a couple of constants used later in\
  \ the code:\n- 2. Next, we define a function that adds 1 million elements comprised\
  \ of a string 64 bytes long:\n\n```php\n// /repo/ch10/php7_spl_fixed_arr_size.php\n\
  define('MAX_SIZE', 1000000);\ndefine('PATTERN', \"%14s : %8.8f : %12s\\n\");\n```\n\
  \n```php\nfunction testArr($list, $label) {\n    $alpha = new InfiniteIterator(\n\
  \        new ArrayIterator(range('A','Z')));\n    $start_mem = memory_get_usage();\n\
  \    $start_time = microtime(TRUE);\n    for ($x = 0; $x < MAX_SIZE; $x++) {\n \
  \       $letter = $alpha->current();\n        $alpha->next();\n        $list[$x]\
  \ = str_repeat($letter, 64);\n    }\n    $mem_diff = memory_get_usage() - $start_mem;\n\
  \    return [$label, (microtime(TRUE) - $start_time),\n        number_format($mem_diff)];\n\
  }\n```\n\n- 3. We then call the function three times, supplying array, ArrayObject,\
  \ and SplFixedArray respectively as arguments:\n\n```php\nprintf(\"%14s : %10s :\
  \ %12s\\n\", '', 'Time', 'Memory');\n$result = testArr([], 'Array');\nvprintf(PATTERN,\
  \ $result);\n$result = testArr(new ArrayObject(), 'ArrayObject');\nvprintf(PATTERN,\
  \ $result);\n$result = testArr(\n    new SplFixedArray(MAX_SIZE), 'SplFixedArray');\n\
  vprintf(PATTERN, $result);\n```\n\n- 4. Here are the results from our PHP 7.1 Docker\
  \ container:\n\n```\nroot@php8_tips_php7 [ /repo/ch10 ]#\nphp php7_spl_fixed_arr_size.php\n\
  \                :      Time :       Memory\n        Array : 1.19430900 :  129,558,888\n\
  \    ArrayObject : 1.20231009 :  129,558,832\n  SplFixedArray : 1.19744802 :   96,000,280\n\
  ```\n\n- 5. In PHP 8, the amount of time taken is significantly less, as shown here:\n\
  \n```\nroot@php8_tips_php8 [ /repo/ch10 ]#\nphp php7_spl_fixed_arr_size.php\n  \
  \              :      Time :       Memory\n        Array : 0.13694692 :  129,558,888\n\
  \    ArrayObject : 0.11058593 :  129,558,832\n  SplFixedArray : 0.09748793 :   96,000,280\n\
  ```\n\nAs you can see from the results, PHP 8 handles arrays 10 times faster than\
  \ PHP 7.1. The amount of memory used is identical between the two versions. What\
  \ stands out, using either version of PHP, is that SplFixedArray uses significantly\
  \ less memory than either a standard array or ArrayObject. Let's now have a look\
  \ at how SplFixedArray usage has changed in PHP 8.\n\n## Working with SplFixedArray\
  \ changes in PHP 8\n\nYou might recall a brief discussion on the Traversable interface\
  \ in Chapter 7, Avoiding Traps When Using PHP 8 Extensions, in the Traversable to\
  \ IteratorAggregate migration section. The same considerations brought out in that\
  \ section also apply to SplFixedArray. Although SplFixedArray does not implement\
  \ Traversable, it does implement Iterator, which in turn extends Traversable.\n\n\
  In PHP 8, SplFixedArray no longer implements Iterator. Instead, it implements IteratorAggregate.\
  \ The benefit of this change is that SplFixedArray in PHP 8 is faster, more efficient,\
  \ and also safe to use in nested loops. The downside, and also a potential code\
  \ break, is if you are using SplFixedArray along with any of these methods: current(),\
  \ key(), next(), rewind(), or valid().\n\nIf you need access to array navigation\
  \ methods, you now must use the SplFixedArray::getIterator() method to access the\
  \ inner iterator, from which all of the navigation methods are available. A simple\
  \ code example, shown here, illustrates the potential code break:\n\n- 1. We start\
  \ by building an SplFixedArray instance from an array:\n- 2. We then use array navigation\
  \ methods to iterate through the array:\n\n```php\n// /repo/ch10/php7_spl_fixed_arr_iter.php\n\
  $arr = ['Person', 'Woman', 'Man', 'Camera', 'TV'];\n$fixed = SplFixedArray::fromArray($arr);\n\
  ```\n\n```php\nwhile ($fixed->valid()) {\n    echo $fixed->current() . '. ';\n \
  \   $fixed->next();\n}\n```\n\nIn PHP 7, the output is the five words in the array:\n\
  \n```\nroot@php8_tips_php7 [ /repo/ch10 ]#\nphp php7_spl_fixed_arr_iter.php\nPerson.\
  \ Woman. Man. Camera. TV.\n```\n\nIn PHP 8, however, the result is quite different,\
  \ as seen here:\n\n```\nroot@php8_tips_php8 [ /repo/ch10 ]#\nphp php7_spl_fixed_arr_iter.php\n\
  ```\n\n\n\n```\nPHP Fatal error: Uncaught Error: Call to undefined method SplFixedArray::valid()\
  \ in /repo/ch10/php7_spl_fixed_arr_iter.php:5\n```\n\n为了让示例在 PHP 8 中正常工作，你所需要做的就是使用\
  \ SplFixedArray::getIterator() 方法来访问内部迭代器。其余代码无需重写。以下是为 PHP 8 重写的修订代码示例：\n\n// /repo/ch10/php8_spl_fixed_arr_iter.php\n\
  $arr  = ['Person', 'Woman', 'Man', 'Camera', 'TV'];\n$obj  = SplFixedArray::fromArray($arr);\n\
  $fixed = $obj->getIterator();\nwhile ($fixed->valid()) {\n    echo $fixed->current()\
  \ . '. ';\n    $fixed->next();\n}\n```\n\n输出现在是五个单词，且没有错误：\n\n```\nroot@php8_tips_php8\
  \ [ /repo/ch10 ]#\nphp php8_spl_fixed_arr_iter.php\nPerson. Woman. Man. Camera.\
  \ TV.\n```\n\n现在你已经了解了如何改进数组处理性能，我们将把注意力转向数组性能的另一个方面：排序。\n\n## 实现稳定排序\n\n在设计数组排序逻辑时，原来的\
  \ PHP 开发者为了速度牺牲了稳定性。当时这被认为是一个合理的牺牲。然而，如果排序过程中涉及复杂对象，则需要稳定排序。\n\n在本节中，我们讨论什么是稳定排序，以及它为什么重要。如果能确保数据稳定排序，你的应用代码将产生更准确的输出，从而提高客户满意度。在深入了解\
  \ PHP 8 如何实现稳定排序之前，我们首先需要定义什么是稳定排序。\n\n## 理解稳定排序\n\n当用于排序的属性值相等时，在稳定排序中元素的原始顺序得到保证。这种结果更符合用户预期。让我们看一个简单的数据集并确定稳定排序应包含什么。为便于说明，假设我们的数据集包含访问时间和用户名条目：\n\
  \n```\n2021-06-01 11:11:11    Betty\n2021-06-03 03:33:33    Betty\n2021-06-01 11:11:11\
  \    Barney\n2021-06-02 02:22:22    Wilma\n2021-06-01 11:11:11    Wilma\n2021-06-03\
  \ 03:33:33    Barney\n2021-06-01 11:11:11    Fred\n```\n\n如果我们按时间排序，你会立刻注意到 2021-06-01\
  \ 11:11:11 有重复。如果对该数据集执行稳定排序，预期结果如下所示：\n\n```\n2021-06-01 11:11:11    Betty\n2021-06-01\
  \ 11:11:11    Barney\n2021-06-01 11:11:11    Wilma\n2021-06-01 11:11:11    Fred\n\
  2021-06-02 02:22:22    Wilma\n2021-06-03 03:33:33    Betty\n2021-06-03 03:33:33\
  \    Barney\n```\n\n你会注意到，从排序后的数据集中，重复时间 2021-06-01 11:11:11 的条目出现的顺序与它们最初输入的顺序相同。因此，我们可以说这个结果代表了稳定排序。\n\
  \n在理想世界中，同一原则也应适用于保留键/值关联的排序。稳定排序的另一个额外标准是，其性能与未受监管的排序相比不应有差异。\n\n> 提示\n> 有关 PHP\
  \ 8 稳定排序的更多信息，请在此查看官方 RFC：https://wiki.php.net/rfc/stable_sorting.\n\n在 PHP 8 中，核心\
  \ *排序*() 函数和 ArrayObject::*排序*() 方法已被重写以实现稳定排序。让我们看一个代码示例，说明在较早版本的 PHP 中可能出现的问题。\n\
  \n## 对比稳定与非稳定排序\n\n在此示例中，我们希望按时间对 Access 实例的数组进行排序。每个 Access 实例有两个属性，$name 和 $time。示例数据集包含重复的访问时间，但用户名不同：\n\
  \n- 1. 首先，我们定义 Access 类：\n- 2. 接下来，我们定义一个示例数据集，它由 CSV 文件 /repo/sample_data/access.csv\
  \ 组成，共 21 行。每行代表一个不同的名称和访问时间组合：\n\n// /repo/src/Php8/Sort/Access.php\nnamespace\
  \ Php8\\Sort;\nclass Access {\n    public $name, $time;\n    public function __construct($name,\
  \ $time) {\n        $this->name = $name;\n        $this->time = $time;\n    }\n\
  }\n```\n\n```\n\"Fred\",  \"2021-06-01 11:11:11\"\n\"Fred\",  \"2021-06-01 02:22:22\"\
  \n\"Betty\", \"2021-06-03 03:33:33\"\n\"Fred\",  \"2021-06-11 11:11:11\"\n\"Barney\"\
  ,\"2021-06-03 03:33:33\"\n\"Betty\", \"2021-06-01 11:11:11\"\n\"Betty\", \"2021-06-11\
  \ 11:11:11\"\n\"Barney\",\"2021-06-01 11:11:11\"\n\"Fred\",  \"2021-06-11 02:22:22\"\
  \n\"Wilma\", \"2021-06-01 11:11:11\"\n\"Betty\", \"2021-06-13 03:33:33\"\n\"Fred\"\
  ,  \"2021-06-21 11:11:11\"\n\"Betty\", \"2021-06-21 11:11:11\"\n\"Barney\",\"2021-06-13\
  \ 03:33:33\"\n\"Betty\",\"2021-06-23 03:33:33\"\n\"Barney\",\"2021-06-11 11:11:11\"\
  \n\"Barney\",\"2021-06-21 11:11:11\"\n\"Fred\",\"2021-06-21 02:22:22\"\n\"Barney\"\
  ,\"2021-06-23 03:33:33\"\n\"Wilma\",\"2021-06-21 11:11:11\"\n\"Wilma\",\"2021-06-11\
  \ 11:11:11\"\n```\n\n你会注意到，扫描示例数据后，所有条目时间为 11:11:11 的日期都是重复的，然而，你也会注意到对于任何给定日期，原始顺序始终是用户\
  \ Fred、Betty、Barney 和 Wilma。此外，请注意，对于时间为 03:33:33 的日期，Betty 的条目始终在 Barney 之前。\n\n\
  - 3. 然后我们定义一个调用程序。此程序要做的第一件事是配置自动加载并使用 Access 类：\n\n// /repo/ch10/php8_sort_stable_simple.php\n\
  require __DIR__ .\n'../src/Server/Autoload/Loader.php';\n$loader = new \\Server\\\
  Autoload\\Loader();\nuse Php8\\Sort\\Access;\n```\n\n- 4. 接下来，我们将示例数据加载到 $access\
  \ 数组中：\n\n```\n$access = [];\n$data = new SplFileObject(__DIR__\n . '../sample_data/access.csv');\n\
  while ($row = $data->fgetcsv())\n  if (!empty($row) && count($row) === 2)\n    $access[]\
  \ = new Access($row[0], $row[1]);\n```\n\n- 5. 然后我们执行 usort()。请注意，用户定义的回调函数对每个实例的时间属性进行比较：\n\
  \n```\nusort($access,\n  function($a, $b) { return $a->time <=> $b->time; });\n\
  ```\n\n- 6. 最后，我们遍历新排序的数组并显示结果：\n\n```\nforeach ($access as $entry)\n    echo $entry->time\
  \ . \"\\t\" . $entry->name . \"\\n\";\n```\n\n在 PHP 7 中，请注意，虽然时间是有序的，但名称并不反映预期的顺序\
  \ Fred、Betty、Barney 和 Wilma。以下是 PHP 7 的输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch10\
  \ ]#\nphp php8_sort_stable_simple.php\n2021-06-01 02:22:22    Fred\n2021-06-01 11:11:11\
  \    Fred\n2021-06-01 11:11:11    Wilma\n2021-06-01 11:11:11    Betty\n2021-06-01\
  \ 11:11:11    Barney\n2021-06-03 03:33:33    Betty\n2021-06-03 03:33:33    Barney\n\
  2021-06-11 02:22:22    Fred\n2021-06-11 11:11:11    Barney\n2021-06-11 11:11:11\
  \    Wilma\n2021-06-11 11:11:11    Betty\n2021-06-11 11:11:11    Fred\n2021-06-13\
  \ 03:33:33    Barney\n2021-06-13 03:33:33    Betty\n2021-06-21 02:22:22    Fred\n\
  2021-06-21 11:11:11    Fred\n2021-06-21 11:11:11    Betty\n2021-06-21 11:11:11 \
  \   Barney\n2021-06-21 11:11:11    Wilma\n2021-06-23 03:33:33    Betty\n2021-06-23\
  \ 03:33:33    Barney\n```\n\n正如输出所示，在第一组 11:11:11 日期中，最终顺序是 Fred、Wilma、Betty 和 Barney，而原始输入顺序为\
  \ Fred、Betty、Barney 和 Wilma。你还会注意到，对于日期和时间 2021-06-13 03:33:33，Barney 在 Betty 之前，而原始输入顺序则相反。根据我们的定义，PHP\
  \ 7 并未实现稳定排序！\n\n现在让我们看一下在 PHP 8 中运行的相同代码示例。以下是 PHP 8 的输出：\n\n```\nroot@php8_tips_php8\
  \ [/repo/ch10 ]#\nphp php8_sort_stable_simple.php\n2021-06-01 02:22:22      Fred\n\
  2021-06-01 11:11:11      Fred\n2021-06-01 11:11:11      Betty\n2021-06-01 11:11:11\
  \      Barney\n2021-06-01 11:11:11      Wilma\n2021-06-03 03:33:33      Betty\n\
  2021-06-03 03:33:33      Barney\n2021-06-11 02:22:22      Fred\n2021-06-11 11:11:11\
  \      Fred\n2021-06-11 11:11:11      Betty\n2021-06-11 11:11:11      Barney\n2021-06-11\
  \ 11:11:11      Wilma\n2021-06-13 03:33:33      Betty\n2021-06-13 03:33:33     \
  \ Barney\n2021-06-21 02:22:22      Fred\n2021-06-21 11:11:11      Fred\n2021-06-21\
  \ 11:11:11      Betty\n2021-06-21 11:11:11      Barney\n2021-06-21 11:11:11    \
  \  Wilma\n2021-06-23 03:33:33      Betty\n2021-06-23 03:33:33      Barney\n```\n\
  \n正如 PHP 8 的输出所示，对于所有 11:11:11 条目，原始输入顺序 Fred、Betty、Barney 和 Wilma 都得到保留。你还会注意到，对于日期和时间\
  \ 2021-06-13 03:33:33，Betty 一直在 Barney 之前。因此，我们可以得出结论，PHP 8 执行的是稳定排序。\n\n现在你可以看到\
  \ PHP 7 中的问题，并且已经了解到 PHP 8 解决了此问题，让我们来看看稳定排序对键的影响。\n\n\n\n## 检查稳定排序对键的影响\n\n稳定排序的概念在使用\
  \ asort()、uasort() 或等效的 ArrayIterator 方法时也会影响键/值对。接下来所示的示例中，ArrayIterator 被填充了 20\
  \ 个元素，每隔一个元素都是重复的。键是按顺序递增的十六进制数字：\n\n- 首先，我们定义一个函数来生成随机的 3 字母组合：\n\n// /repo/ch10/php8_sort_stable_keys.php\n\
  $randVal = function () {\n    $alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';\n    return\
  \ $alpha[rand(0,25)] . $alpha[rand(0,25)]\n        . $alpha[rand(0,25)];};\n```\n\
  \n- 接下来，我们用示例数据加载一个 ArrayIterator 实例。每隔一个元素是重复的。我们同时捕获开始时间：\n\n```\n$start = microtime(TRUE);\n\
  $max   = 20;\n$iter  = new ArrayIterator;\nfor ($x = 256; $x < $max + 256; $x +=\
  \ 2) {\n    $key = sprintf('%04X', $x);\n    $iter->offsetSet($key, $randVal());\n\
  \    $key = sprintf('%04X', $x + 1);\n    $iter->offsetSet($key, 'AAA'); // <--\
  \ duplicate\n}\n```\n\n- 然后，我们执行 ArrayIterator::asort() 并显示结果顺序以及经过的时间：\n\n// not\
  \ all code is shown\n$iter->asort();\nforeach ($iter as $key => $value) echo\n\"\
  $key\\t$value\\n\";\necho \"\\nElapsed Time: \" . (microtime(TRUE) - $start);\n\
  ```\n\n以下是该代码示例在 PHP 7 中运行的结果：\n\n```\nroot@php8_tips_php7 [ /repo/ch10 ]#\nphp\
  \ php8_sort_stable_keys.php\n0113    AAA\n010D    AAA\n0103    AAA\n0105    AAA\n\
  0111    AAA\n0107    AAA\n010F    AAA\n0109    AAA\n0101    AAA\n010B    AAA\n0104\
  \    CBC\n... some output omitted ...\n010C    ZJW\nElapsed Time: 0.00017094612121582\n\
  ```\n\n正如输出所示，虽然值是有序的，但在重复值的情况下，键的出现顺序是混乱的。相比之下，请看同一程序代码在 PHP 8 中运行的输出：\n\n```\n\
  root@php8_tips_php8 [/repo/ch10 ]#\nphp php8_sort_stable_keys.php\n0101    AAA\n\
  0103    AAA\n0105    AAA\n0107    AAA\n0109    AAA\n010B    AAA\n010D    AAA\n010F\
  \    AAA\n0111    AAA\n0113    AAA\n0100    BAU\n... some output omitted ...\n0104\
  \    QEE\nElapsed Time: 0.00010395050048828\n```\n\n输出显示，任何重复条目的键都以其原始顺序出现在输出中。输出证明\
  \ PHP 8 对键也实现了稳定排序，而不仅仅是对值。此外，正如经过时间的结果所示，PHP 8 已成功保持与之前相同（或更好）的性能。现在让我们把注意力转向 PHP\
  \ 8 中的另一个直接影响数组排序的差异：对非法排序函数的处理。\n\n## 处理非法排序函数\n\nPHP 7 及更早版本允许开发者在使用 usort() 或\
  \ uasort()（或等效的 ArrayIterator 方法）时使用非法函数而不受惩罚。了解这种不良做法对你来说非常重要。否则，当你将代码迁移到 PHP 8\
  \ 时，可能存在向后兼容性中断。\n\n在接下来所示的示例中，与“对比稳定和非稳定排序”部分所述的示例中创建的数组相同。非法排序函数返回一个布尔值，而 u*sort()\
  \ 回调需要返回两个元素之间的相对位置。直白地说，用户定义的函数或回调需要返回 -1 如果第一个操作数小于第二个，0 如果相等，1 如果第一个操作数大于第二个。如果我们重写定义\
  \ usort() 回调的代码行，非法函数可能如下所示：\n\n```\nusort($access, function($a, $b) {\n    return\
  \ $a->time < $b->time; });\n```\n\n在此代码片段中，我们没有使用会返回 -1、0 或 1 的 spaceship 运算符（<=>），而是使用小于号（<）。在\
  \ PHP 7 及以下版本中，返回布尔值的回调是可以接受的，并且会产生所需的结果。但实际上发生的是，PHP 解释器需要添加一个额外的操作来弥补缺失的操作。因此，如果回调仅执行此比较：\n\
  \n```\nop1 > op2\n```\n\nPHP 解释器会添加一个额外的操作：\n\n```\nop1 <= op2\n```\n\n在 PHP 8 中，非法排序函数会触发弃用通知。以下是重写后的代码在\
  \ PHP 8 中运行的情况：\n\n```\nroot@php8_tips_php8 [ /repo/ch10 ]#\nphp php8_sort_illegal_func.php\n\
  PHP Deprecated: usort(): Returning bool from comparison\nfunction is deprecated,\
  \ return an integer less than, equal to,\nor greater than zero in /repo/ch10/php8_sort_illegal_func.php\n\
  on line 30\n2021-06-01 02:22:22      Fred\n2021-06-01 11:11:11      Fred\n2021-06-01\
  \ 11:11:11      Betty\n2021-06-01 11:11:11      Barney\n... not all output is shown\n\
  ```\n\n正如输出所示，PHP 8 允许操作继续进行，并且在使用正确的回调时结果是一致的。然而，你也可以看到会发出 Deprecation 通知。\n\n\
  > **提示**\n> 你也可以在 PHP 8 中使用箭头函数。之前显示的回调可以重写如下：\n> \n> `usort($array, fn($a, $b)\
  \ => $a <=> $b).`\n\n你现在对什么是稳定排序以及它为什么重要有了更深入的理解。你也能够发现由于 PHP 8 与早期版本处理方式的差异而可能出现的问题。我们现在来看一下\
  \ PHP 8 中引入的其他性能改进。\n\n## 使用弱引用提高效率\n\n随着 PHP 的不断发展和成熟，越来越多的开发者转向使用 PHP 框架来促进快速应用开发。然而，这种做法的必然副产品是占用内存的越来越大且更复杂的对象。包含许多属性、其他对象或大型数组的大对象通常被称为\
  \ **昂贵对象。**\n\n加剧这种趋势导致潜在内存问题的是，所有 PHP 对象赋值都是自动按引用进行的。没有引用，使用第三方框架将变得极其繁琐。然而，当你按引用赋值对象时，对象必须完整地保留在内存中，直到所有引用都被销毁。只有在\
  \ unset 或覆盖对象之后，它才会被完全销毁。\n\n在 PHP 7.4 中，弱引用支持作为解决此问题的潜在方案被引入。PHP 8 通过添加弱映射类扩展了这一新功能。在本节中，你将了解这项新技术的工作原理，以及它如何对开发有利。让我们先来看看弱引用。\n\
  \n## 利用弱引用\n\n弱引用首次在 PHP 7.4 中引入，并在 PHP 8 中得到改进。该类作为对象创建的包装器，允许开发者以这样的方式使用对象引用，即超出作用域（例如\
  \ unset()）的对象不会受到垃圾回收的保护。\n\n目前在 pecl.php.net 上驻留着一些提供弱引用支持的 PHP 扩展。大多数实现都侵入 PHP\
  \ 语言核心的 C 语言结构，要么重载对象处理器，要么操作栈和各种 C 指针。在大多数情况下，其净结果是可移植性丧失和大量段错误。PHP 8 实现避免了这些问题。\n\
  \n如果你正在处理涉及大型对象且程序可能长时间运行的代码，那么掌握 PHP 8 弱引用的使用非常重要。在进入使用细节之前，让我们先看看类定义。\n\n## 查看\
  \ WeakReference 类定义\n\nWeakReference 类的正式定义如下：\n\n```php\nWeakReference {\n    public\
  \ __construct() : void\n    public static create (object $object) : WeakReference\n\
  \    public get() : object|null\n}\n```\n\n正如你所见，类定义相当简单。该类可用于为任何对象提供包装器。包装器使得完全销毁对象变得更容易，而不必担心可能存在残留引用导致对象仍驻留在内存中。\n\
  \n\n\n> **提示**\n> \n> 有关弱引用的背景和本质的更多信息，请在此查看： https://wiki.php.net/rfc/weakrefs。\
  \ 文档参考在这里： https://www.php.net/manual/en/class.weakreference.php.\n\n现在让我们看一个简单的示例以帮助理解。\n\
  \n## 使用弱引用\n\n本示例演示了弱引用如何使用。你将在本示例中看到，当通过引用进行普通对象赋值时，即使原始对象被 unset，它仍然保留在内存中。另一方面，如果你使用\
  \ WeakReference 分配对象引用，一旦原始对象被 unset，它就会完全从内存中移除：\n\n- 首先，我们定义四个对象。请注意，$obj2 是对\
  \ $obj1 的普通引用，而 $obj4 是对 $obj3 的弱引用：\n\n```php\n// /repo/ch010/php8_weak_reference.php\n\
  $obj1 = new class () { public $name = 'Fred'; };\n$obj2 = $obj1; // normal reference\n\
  $obj3 = new class () { public $name = 'Fred'; };\n$obj4 = WeakReference::create($obj3);\
  \ // weak ref\n```\n\n- 然后我们在 $obj1 被 unset 之前和之后显示 $obj2 的内容。由于 $obj1 和 $obj2 之间的连接是普通的\
  \ PHP 引用，$obj1 由于创建的强引用而保留在内存中：\n\n```php\nvar_dump($obj2);\nunset($obj1);\nvar_dump($obj2);\
  \ // $obj1 still loaded in memory\n```\n\n- 然后我们对 $obj3 和 $obj4 做同样的操作。请注意，我们需要使用\
  \ WeakReference::get() 来获取关联对象。一旦 $obj3 被 unset，与 $obj3 和 $obj4 相关的所有信息都会从内存中移除：\n\
  \n```php\nvar_dump($obj4->get());\nunset($obj3);\nvar_dump($obj4->get()); // both\
  \ $obj3 and $obj4 are gone\n```\n\n运行此代码示例在 PHP 8 中的输出如下：\n\n```\nroot@php8_tips_php8\
  \ [ /repo/ch10 ]#\nphp php8_weak_reference.php\nobject(class@anonymous)#1 (1) {\n\
  \  [\"name\"]=>  string(4) \"Fred\"\n}\nobject(class@anonymous)#1 (1) {\n  [\"name\"\
  ]=>  string(4) \"Fred\"\n}\nobject(class@anonymous)#2 (1) {\n  [\"name\"]=>  string(4)\
  \ \"Fred\"\n}\nNULL\n```\n\n输出告诉我们一个有趣的故事！第二次 var_dump() 操作显示，尽管 $obj1 已被 unset，但由于\
  \ $obj2 创建的强引用，它仍然像僵尸一样存活。如果您处理的是昂贵对象和复杂的应用程序代码，为了释放内存，您需要在内存被释放之前先找到并销毁所有引用！\n\n\
  另一方面，如果您确实需要内存，而不是进行直接对象赋值（在 PHP 中会自动按引用），请使用 WeakReference::create() 方法创建引用。弱引用具有普通引用的全部功能。唯一的区别是，如果它引用的对象被销毁或超出作用域，弱引用也会自动被销毁。\n\
  \n正如输出所示，最后一次 var_dump() 操作的结果为 NULL。这告诉我们对象确实已被销毁。当主对象被 unset 时，其所有弱引用都会自动消失。现在您已经对如何使用弱引用以及它们解决的潜在问题有了一些了解，是时候来看一个新的类\
  \ WeakMap 了。\n\n## 使用 WeakMap\n\n在 PHP 8 中，添加了一个新类 WeakMap，它利用了弱引用支持。新类的功能与 SplObjectStorage\
  \ 相似。以下是官方类定义：\n\n```php\nfinal WeakMap implements Countable,\n    ArrayAccess,\
  \ IteratorAggregate {\npublic function __construct()\npublic function count() :\
  \ int\npublic function getIterator() : Traversable\npublic function offsetExists(object\
  \ $object) : bool\npublic function offsetGet(object $object) : mixed\npublic function\
  \ offsetSet(object $object, mixed $value) : void\npublic function offsetUnset(object\
  \ $object) : void\n}\n```\n\n就像 SplObjectStorage 一样，这个新类表现为对象数组。由于它实现了 IteratorAggregate，您可以使用\
  \ getIterator() 方法来访问内部迭代器。因此，新类不仅提供传统的数组访问，还提供 OOP 迭代器访问，两者兼得！在深入了解如何使用 WeakMap\
  \ 的细节之前，了解 SplObjectStorage 的典型用法对您很重要。\n\n## 使用 SplObjectStorage 实现容器类\n\nSplObjectStorage\
  \ 类的一个潜在用途是将其用作依赖注入（DI）容器（也称为服务定位器或控制反转容器）的基础。DI 容器类旨在创建并保存对象实例以便轻松检索。\n\n在本示例中，我们使用来自\
  \ Laminas\\Filter\\* 类的昂贵对象数组加载一个容器类。然后我们使用容器来清理示例数据，之后我们 unset 过滤器数组：\n\n- 首先，我们基于\
  \ SplObjectStorage 定义一个容器类。（稍后，在下一节中，我们将开发另一个基于 WeakMap 的容器类，实现同样的功能。）以下是 UsesSplObjectStorage\
  \ 类。在 __construct() 方法中，我们将配置好的过滤器附加到 SplObjectStorage 实例：\n\n```php\n// /repo/src/Php7/Container/UsesSplObjectStorage.php\n\
  namespace Php7\\Container;\nuse SplObjectStorage;\nclass UsesSplObjectStorage {\n\
  \    public $container;\n    public $default;\n    public function __construct(array\
  \ $config = []) {\n        $this->container = new SplObjectStorage();\n        if\
  \ ($config) foreach ($config as $obj)\n            $this->container->attach(\n \
  \               $obj, get_class($obj));\n        $this->default = new class () {\n\
  \            public function filter($value) {\n                return $value; }};\n\
  \    }\n}\n```\n\n- 然后我们定义一个 get() 方法，它遍历 SplObjectStorage 容器并在找到时返回过滤器。如果未找到，则返回一个仅将数据直接传递的默认类：\n\
  \n```php\npublic function get(string $key) {\n    foreach ($this->container as $idx\
  \ => $obj)\n        if ($obj instanceof $key) return $obj;\n    return $this->default;\n\
  }\n```\n\n请注意，使用 foreach() 循环遍历 SplObjectStorage 实例时，我们返回的是值（$obj），而不是键。另一方面，如果使用\
  \ WeakMap 实例，我们需要返回键而不是值！\n\n然后我们定义一个调用程序，使用我们新创建的 UsesSplObjectStorage 类来包含过滤器集：\n\
  \n- 首先，我们定义自动加载并使用适当的类：\n\n```php\n// /repo/ch010/php7_weak_map_problem.php\nrequire\
  \ __DIR__ .\n'../../src/Server/Autoload/Loader.php';\n$loader = new \\Server\\Autoload\\\
  Loader();\nuse Laminas\\Filter\\{StringTrim, StripNewlines,\n    StripTags, ToInt,\
  \ Whitelist, UriNormalize};\nuse Php7\\Container\\UsesSplObjectStorage;\n```\n\n\
  - 接下来，我们定义一个示例数据数组：\n\n```php\n$data = [\n    'name'  => '<script>bad JavaScript</script>name',\n\
  \    'status' => 'should only contain digits 9999',\n    'gender' => 'FMZ only allowed\
  \ M, F or X',\n    'space'  => \"  leading/trailing whitespace or\\n\",\n    'url'\
  \    => 'unlikelysource.com/about',\n];\n```\n\n- 然后我们为所有字段分配必需的过滤器（$required）以及特定字段的过滤器（$added）：\n\
  \n```php\n$required = [StringTrim::class,\n            StripNewlines::class, StripTags::class];\n\
  $added = ['status'  => ToInt::class,\n          'gender'  => Whitelist::class,\n\
  \          'url'     => UriNormalize::class ];\n```\n\n- 之后，我们创建一个过滤器实例数组，用于填充我们的服务容器\
  \ UsesSplObjectStorage。请记住，每个过滤器类都带有大量开销，可以被视为昂贵对象：\n\n```php\n$filters = [\n  \
  \  new StringTrim(),\n    new StripNewlines(),\n    new StripTags(),\n    new ToInt(),\n\
  \    new Whitelist(['list' => ['M','F','X']]),\n    new UriNormalize(['enforcedScheme'\
  \ => 'https']),\n];\n$container = new UsesSplObjectStorage($filters);\n```\n\n-\
  \ 现在我们使用容器类循环遍历数据文件以检索过滤器实例。filter() 方法会生成特定于该过滤器的清理值：\n\n```php\nforeach ($data\
  \ as $key => &$value) {\n    foreach ($required as $class) {\n        $value = $container->get($class)->filter($value);\n\
  \    }\n}\n```\n\n\n\n```\nif (isset($added[$key])) {\n    $value = $container->get($added[$key])\n\
  \        ->filter($value);\n}\n}\nvar_dump($data);\n```\n\n6. 最后，我们抓取内存统计信息以形成 SplObjectStorage\
  \ 与 WeakMap 使用之间的比较基准。我们还取消设置 $filters，这理论上应该释放大量内存。我们运行 gc_collect_cycles() 来强制\
  \ PHP 垃圾回收过程，将释放的内存归还到内存池中：\n\n```\n$mem = memory_get_usage();\nunset($filters);\n\
  gc_collect_cycles();\n$end = memory_get_usage();\necho \"\\nMemory Before Unset:\
  \ $mem\\n\";\necho \"Memory After  Unset: $end\\n\";\necho 'Difference      : '\
  \ . ($end - $mem) . \"\\n\";\necho 'Peak Memory Usage : ' . memory_get_peak_usage();\n\
  ```\n\n以下是调用程序的运行结果，在 PHP 8 中运行：\n\n```\nroot@php8_tips_php8 [ /repo/ch10 ]#\nphp\
  \ php7_weak_map_problem.php\narray(5) {\n[\"name\"]=>  string(18) \"bad JavaScriptname\"\
  \n[\"status\"]=>  int(0)\n[\"gender\"]=>  NULL\n[\"space\"]=>  string(30) \"leading/trailing\
  \ whitespace or\"\n[\"url\"]=>  &string(32) \"https://unlikelysource.com/about\"\
  \n}\nMemory Before Unset: 518936\nMemory After  Unset: 518672\nDifference      :\
  \  264\nPeak Memory Usage : 780168\n```\n\n正如输出所示，我们的容器类工作完美，使我们能够访问任何存储的过滤器类。值得注意的是，执行\
  \ unset ($filters) 命令后释放的内存为 264 字节：并不多！\n\n你现在已经了解了 SplObjectStorage 类的典型用法。让我们现在来看一下\
  \ SplObjectStorage 类的一个潜在问题，以及 WeakMap 如何解决它。\n\n## 理解 WeakMap 相对于 SplObjectStorage\
  \ 的优势\n\nSplObjectStorage 的主要问题是，当分配的对象被取消设置或超出作用域时，它仍然保留在内存中。其原因是当对象附加到 SplObjectStorage\
  \ 实例时，是通过引用完成的。\n\n如果你只处理少量对象，可能不会遇到任何严重问题。如果你使用 SplObjectStorage 并为存储分配大量昂贵的对象，这最终可能导致长期运行的程序中出现内存泄漏。另一方面，如果你使用\
  \ WeakMap 实例进行存储，垃圾回收就可以移除该对象，从而释放内存。当你开始将 WeakMap 实例集成到常规编程实践中时，你最终会得到更高效的代码，占用更少的内存。\n\
  \n> **提示**\n> 有关 WeakMap 的更多信息，请在此处查看原始 RFC：https://wiki.php.net/rfc/weak_maps。另请查看文档：https://www.php.net/weakMap。\n\
  \n让我们现在重写上一节中的示例 (/repo/ch010/php7_weak_map_problem.php)，但这次使用 WeakMap：\n\n- 1.\
  \ 如前面的代码示例所述，我们定义了一个名为 UsesWeakMap 的容器类来保存我们的昂贵过滤器类。此类与上一节中显示的类的主要区别在于，UsesWeakMap\
  \ 使用 WeakMap 而不是 SplObjectStorage 进行存储。以下是类设置和 __construct() 方法：\n\n// /repo/src/Php7/Container/UsesWeakMap.php\n\
  namespace Php8\\Container;\nuse WeakMap;\nclass UsesWeakMap {\n```\n\n```php\npublic\
  \ $container;\npublic $default;\npublic function __construct(array $config = [])\
  \ {\n    $this->container = new WeakMap();\n    if ($config)\n        foreach ($config\
  \ as $obj)\n            $this->container->offsetSet(\n                $obj, get_class($obj));\n\
  \    $this->default = new class () {\n        public function filter($value) {\n\
  \            return $value; }};\n    }\n```\n```\n\n- 2. 这两个类之间的另一个区别是 WeakMap 实现了\
  \ IteratorAggregate。然而，这仍然允许我们在 get() 方法中使用简单的 foreach() 循环：\n\n```php\npublic function\
  \ get(string $key) {\n    foreach ($this->container as $idx => $obj)\n        if\
  \ ($idx instanceof $key) return $idx;\n    return $this->default;\n    }\n}\n```\n\
  \n请注意，使用 foreach() 循环迭代 WeakMap 实例时，我们返回键 ($idx) 而不是值！\n\n- 3. 然后我们定义一个调用程序来调用自动加载器并使用适当的过滤器类。此调用程序与上一节中的调用程序之间的最大区别在于，我们使用了基于\
  \ WeakMap 的新容器类：\n\n```php\n// /repo/ch010/php8_weak_map_problem.php\nrequire __DIR__\
  \ .\n'../../src/Server/Autoload/Loader.php';\n$loader = new \\Server\\Autoload\\\
  Loader();\nuse Laminas\\Filter\\ {StringTrim, StripNewlines,\n    StripTags, ToInt,\
  \ Whitelist, UriNormalize};\nuse Php8\\Container\\UsesWeakMap;\n```\n\n- 4. 与前一个示例一样，我们定义一个示例数据数组并分配过滤器。此代码未显示，因为它与前一个示例的步骤\
  \ 2 和 3 相同。\n\n- 5. 然后我们在一个数组中创建过滤器实例，该数组作为我们新容器类的参数。我们使用过滤器数组作为参数来创建容器类实例：\n\n\
  ```php\n$filters = [\n    new StringTrim(),\n    new StripNewlines(),\n    new StripTags(),\n\
  \    new ToInt(),\n    new Whitelist(['list' => ['M','F','X']]),\n    new UriNormalize(['enforcedScheme'\
  \ => 'https']),\n];\n$container = new UsesWeakMap($filters);\n```\n\n- 6. 最后，正如前一个示例的步骤\
  \ 6 所示，我们遍历数据并应用容器类中的过滤器。我们还收集并显示内存统计信息。\n\n以下是使用 WeakMap 的修订程序的输出，在 PHP 8 中运行：\n\
  \n```\nroot@php8_tips_php8 [/repo/ch10 ]#\nphp php8_weak_map_problem.php\narray(5)\
  \ {\n[\"name\"]=> string(18) \"bad JavaScriptname\"\n[\"status\"]=> int(0)\n[\"\
  gender\"]=> NULL\n[\"space\"]=> string(30) \"leading/trailing whitespace or\"\n\
  [\"url\"]=> &string(32) \"https://unlikelysource.com/about\"\n}\nMemory Before Unset:\
  \ 518712\nMemory After  Unset: 517912\nDifference       :   800\nPeak Memory Usage\
  \  : 779944\n```\n\n正如你所预期的那样，总体内存使用量略低。然而，最大的区别是取消设置 $filters 后的内存差异。在前一个示例中，差异为\
  \ 264 字节。在此示例中，使用 WeakMap 产生的差异为 800 字节。这意味着使用 WeakMap 有可能释放比使用 SplObjectStorage\
  \ 多三倍以上的内存！\n\n这结束了我们对弱引用和弱映射的讨论。你现在有能力编写更高效、占用更少内存的代码。存储的对象越大，节省内存的潜力就越大。\n\n##\
  \ Summary\n\n在本章中，你不仅了解了新的 JIT 编译器的工作原理，还了解了传统的 PHP 解释-编译-执行循环。使用 PHP 8 并启用 JIT\
  \ 编译器有可能将你的 PHP 应用程序加速三倍以上。\n\n在下一节中，你了解了什么是稳定排序，以及 PHP 8 如何实现这一重要技术。通过掌握稳定排序，你的代码将以合理的方式生成数据，从而提高客户满意度。\n\
  \n接下来的部分向你介绍了一种技术，通过利用 SplFixedArray 类可以大幅提高性能并减少内存消耗。之后，你了解了 PHP 8 对弱引用的支持以及新的\
  \ WeakMap 类。使用本章介绍的技术将使你的应用程序执行速度更快、运行更高效、占用更少内存。\n\n在下一章中，你将学习如何成功迁移到 PHP 8。\n\n\
  ## 11 迁移现有\n\n## 迁移现有\nPHP 应用到 PHP 8\n\n整本书中都已警告过潜在的代码破坏。遗憾的是，实际上并没有很好的工具可以扫描你的现有代码并检查潜在的代码破坏。在本章中，我们将带你开发一组类的基础，这些类构成了\
  \ PHP 8 **向后兼容 (BC)** 破坏扫描器的基础。此外，你将学习将现有客户 PHP 应用程序迁移到 PHP 8 的推荐流程。\n\n阅读完本章并仔细研究示例后，你将更好地处理\
  \ PHP 8 迁移。了解整体迁移流程后，你将更有信心并能够以最少的问题执行 PHP 8 迁移。\n\n本章涵盖的主题包括以下内容：\n\n- 了解开发、暂存和生产环境\n\
  - 学习如何在迁移前发现 BC 破坏\n- 执行迁移\n- 测试和排除迁移故障\n\n\n\n\n## 技术要求\n\n为了检查并运行本章提供的代码示例，推荐的最低硬件配置如下：\n\
  \n- 基于 x86_64 的台式电脑或笔记本电脑\n- 1 **千兆字节 (GB)** 可用磁盘空间\n- 4 GB 的内存\n- 500 **千比特每秒 (Kbps)**\
  \ 或更快的互联网连接\n\n此外，您还需要安装以下软件：\n\n- Docker\n- Docker Compose\n\n请参阅 *第 1 章，介绍新的 PHP\
  \ 8 OOP 特性* 中的 *技术要求* 部分，了解有关 Docker 和 Docker Compose 安装的更多信息，以及如何构建本書中用于演示所解释代码的\
  \ Docker 容器。在本書中，我们将恢复本書示例代码的目录称为 `/repo`。\n\n本章的源代码位于 https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices。我们现在可以开始讨论，看看在整体迁移过程中使用的环境。\n\
  \n## 了解开发、暂存和生产环境\n\n网站更新的最终目标是以尽可能无缝的方式将更新后的应用程序代码从开发环境移至生产环境。这种应用程序代码的移动被称为 **部署**。在此上下文中，移动涉及从一个\
  \ **环境** 复制应用程序代码和配置文件到另一个环境。\n\n在深入了解将应用程序迁移到 PHP 8 的细节之前，让我们先看看这些环境是什么。了解不同环境可能采取的形式对于您作为开发者的角色至关重要。有了这种理解，您就能以最少的错误将代码部署到生产环境。\n\
  \n## 定义环境\n\n我们使用 *环境* 一词来描述包括操作系统、Web 服务器、数据库服务器和 PHP 安装在内的软件栈组合。过去，环境等同于 *服务器*。然而，在这个现代时代，*服务器*\
  \ 这一术语具有误导性，因为它暗示着一个放在某个看不见的服务器机房机架上的金属盒子里的物理计算机。今天，鉴于云服务提供商的 abundance 和高性能虚拟化技术（例如\
  \ Docker）的存在，这种情况更可能不会发生。因此，当我们使用 *环境* 这一术语时，请理解其含义为物理或虚拟服务器。\n\n环境通常分为三个不同的类别：**开发**、**暂存**\
  \ 和 **生产**。一些组织还提供单独的 **测试** 环境。让我们先看看所有环境共有的内容。\n\n## 常见组件\n\n需要注意的是，所有环境中包含的内容都由生产环境决定。生产环境是应用程序代码的最终目的地。因此，所有其他环境应尽可能与操作系统、数据库、Web\
  \ 服务器和 PHP 安装相匹配。因此，例如，如果生产环境启用了 PHP OPCache 扩展，则所有其他环境也必须启用此扩展。\n\n所有环境，包括生产环境，至少需要操作系统和\
  \ PHP 安装。根据应用程序的需求，安装 Web 服务器和数据库服务器也很常见。Web 服务器和数据库服务器的类型和版本应尽可能与生产环境相匹配。\n\n作为一般规则，您的开发环境越接近生产环境，部署后出现错误的可能性就越小。\n\
  \n我们现在来看开发环境包含什么。\n\n## 开发环境\n\n开发环境是您最初开发和测试代码的地方。它的独特之处在于它拥有应用程序维护和开发所需的工具。这包括托管源代码存储库（例如\
  \ Git），以及启动、停止和重置环境所需的各种脚本。\n\n开发环境通常会有脚本来触发自动部署流程。这样的脚本可以代替 **提交钩子**，它们设计为在您向源代码存储库发出提交时激活。一个例子是\
  \ **Git Hooks**，可以放置在 `.git/hooks` 目录中的脚本文件。\n\n> **Tip**\n> 有关 Git Hooks 的更多信息，请查看此处的文档：\n\
  > `https://git-scm.com/book/en/v2/Customizing-Git-Git-Hooks.`\n\n传统的开发环境由一台个人计算机组成，其中包含数据库服务器、Web\
  \ 服务器和 PHP。这种传统范式没有考虑到目标生产环境中可能存在的差异。例如，如果您定期与 12 位客户合作，那么这 12 位客户拥有完全相同的操作系统、数据库服务器、Web\
  \ 服务器和 PHP 版本的可能性极小！*最佳实践* 是以虚拟机或 Docker 容器的形式尽可能精确地模拟生产环境。\n\n代码编辑器或 **IDE（集成开发环境）**\
  \ 因此不位于开发环境内部。相反，您在开发环境外部执行代码创建和编辑。然后，您可以通过共享目录直接将文件复制到虚拟开发环境中来本地推送更改，或者将更改提交到源代码存储库，然后从开发环境虚拟机内部拉取更改。\n\
  \n在开发环境中进行单元测试也是合适的。开发单元测试不仅能让您更有信心代码在生产环境中有效，而且也是在应用程序开发早期阶段发现错误的好方法。当然，您需要在本地环境中尽可能多地进行调试！在开发中捕获和修复错误通常只需要修复生产环境中发现的错误所需时间的十分之一！\n\
  \n现在让我们检查暂存环境。\n\n## 暂存环境\n\n对于大型应用程序开发项目来说，多个开发人员都在同一个代码库上工作是很常见的。在这种情况下，使用版本控制存储库至关重要。*暂存*\
  \ 环境是所有开发人员在开发环境测试和调试阶段完成后上传其代码的地方。\n\n暂存环境必须是生产环境的 *精确副本*。您可以将暂存环境想象为汽车工厂装配线上的最后一步。这里是将来自一个或多个开发环境的各种组件组装到位的地方。暂存环境是生产环境应有的外观的原型。\n\
  \n需要注意的是，暂存服务器通常具有直接的互联网访问权限；然而，它通常位于需要密码才能访问的安全区域。\n\n最后，让我们看看生产环境。\n\n## 生产环境\n\
  \n生产环境通常由客户直接维护和托管。该环境也被称为 **实时环境**。为了做一个宝莱坞制作的类比，如果开发环境是练习，暂存环境是彩排，那么生产环境就是现场演出（也许没有唱歌和跳舞！）。\n\
  \n生产环境具有直接的互联网访问权限，但受防火墙保护，并且通常还受入侵检测和预防系统（例如 `https://snort.org/`）的进一步保护。此外，生产环境可能隐藏在运行在面向互联网的\
  \ Web 服务器上的反向代理配置之后。否则，至少在理论上，生产环境应该是暂存环境的 *精确克隆*。\n\n现在您已经了解了应用程序代码从开发到生产所经过的环境，让我们来看一下\
  \ PHP 8 迁移中的一个关键第一步：发现潜在的 BC 代码破坏。\n\n## 在迁移前学习如何发现 BC 破坏\n\n理想情况下，您应该带着行动计划进入 PHP\
  \ 8 迁移。该行动计划的一个关键部分包括了解当前代码库中存在多少潜在的 BC 破坏。在本节中，我们将向您展示如何开发一个 BC 破坏嗅探器，以自动化查找数百个代码文件中潜在\
  \ BC 破坏的过程。\n\n首先，我们将退一步回顾迄今为止关于 PHP 8 中可能出现的 BC 问题所学到的内容。\n\n\n\n## 获取 BC 破坏概览\n\
  \n你已经知道，在阅读完本书的前几章后，潜在的代码破坏源自多个来源。让我们简要总结一下迁移后可能导致代码失败的一般趋势。请注意，我们在本章中不涵盖这些主题，因为这些主题已全部在本书的早期章节中介绍过：\n\
  \n- 资源到对象迁移\n- 支持操作系统库的最低版本\n- Iterator 到 IteratorAggregate 迁移\n- 已移除的函数\n- 用法变更\n\
  - 魔术方法签名强制执行\n\n许多变更都可以通过基于 preg_match() 或 strpos() 的简单回调来检测。用法的变更则更难以检测，因为乍一看，自动化破坏扫描器无法在不大量使用\
  \ eval() 的情况下检测用法的结果。\n\n让我们现在来看一下破坏扫描配置文件可能是什么样的。\n\n## 创建 BC 破坏扫描配置文件\n\n配置文件允许我们独立于\
  \ BC 破坏扫描器类开发一组搜索模式。使用这种方法，BC 破坏扫描器类定义了执行搜索的实际逻辑，而配置文件则提供特定条件列表以及警告和建议的补救措施。\n\n\
  相当多的潜在代码破坏可以通过简单地查找 PHP 8 中已移除的函数的存在来检测。为此，简单的 strpos() 搜索就足够了。另一方面，更复杂的搜索可能需要我们开发一系列回调。让我们先看看如何基于简单的\
  \ strpos() 搜索来开发配置。\n\n## 定义简单的 strpos() 搜索配置\n\n在简单的 strpos() 搜索的情况下，我们需要做的就是提供一个键/值对数组，其中键是已移除函数的名称，值是其建议的替代方案。然后\
  \ BC 破坏扫描器类中的搜索逻辑可以这样做：\n\n```\n$contents = file_get_contents(FILE_TO_SEARCH);\n\
  foreach ($config['removed'] as $key => $value)\n    if (strpos($contents, $key)\
  \ !== FALSE)  echo $value;\n```\n\n我们将在下一节介绍完整的 BC 破坏扫描器类实现。现在，我们只关注配置文件。以下是前几个\
  \ strpos() 搜索条目可能出现的样子：\n\n```\n// /repo/ch11/bc_break_scanner.config.php\nuse Migration\\\
  BreakScan;\nreturn [\n    // not all keys are shown\n    BreakScan::KEY_REMOVED\
  \ => [\n        '__autoload' => 'spl_autoload_register(callable)',\n        'each'\
  \ => 'Use \"foreach()\" or ArrayIterator',\n        'fgetss' => 'strip_tags(fgets($fh))',\n\
  \        'png2wbmp' => 'imagebmp',\n        // not all entries are shown\n    ],\n\
  ];\n```\n\n不幸的是，一些 PHP 8 向后不兼容性可能超出了简单 strpos() 搜索的能力。我们现在将注意力转向检测由 PHP 8 资源到对象迁移引起的潜在破坏。\n\
  \n## 检测与 is_resource() 相关的 BC 破坏\n\n在第 7 章《使用 PHP 8 扩展时避免陷阱》中，在 PHP 8 扩展资源到对象迁移部分，你了解到\
  \ PHP 普遍存在从资源转向对象的趋势。正如你可能回忆的那样，这种趋势本身并不会构成 BC 破坏的威胁。然而，如果在确认连接已建立时，你的代码使用 is_resource()，则存在\
  \ BC 破坏的潜在风险。\n\n为了考虑这种 BC 破坏的可能性，我们的 BC 破坏扫描配置文件需要列出任何以前产生资源但现在产生对象的函数。然后我们需要在\
  \ BC 破坏扫描类中添加一个方法（稍后讨论），该方法使用此列表。\n\n受影响函数的潜在配置键可能如下所示：\n\n```php\n// /repo/ch11/bc_break_scanner.config.php\n\
  return [  // not all keys are shown\n    BreakScan::KEY_RESOURCE => [\n        'curl_init',\n\
  \        'xml_parser_create',\n        // not all entries are shown\n    ],\n];\n\
  ```\n\n在破坏扫描类中，我们需要做的就是首先确认是否调用了 is_resource()，然后检查 BreakScan::KEY_RESOURCE 数组下列出的任何函数是否存在。\n\
  \n我们现在将注意力转向魔术方法签名违规。\n\n## 检测魔术方法签名违规\n\nPHP 8 严格执行魔术方法签名。如果你的类使用宽松的定义，其中不执行方法签名数据类型，并且不为魔术方法定义返回值的类型，那么你就不会受到潜在代码破坏的影响。另一方面，如果你的魔术方法签名确实包含数据类型，并且这些数据类型与\
  \ PHP 8 中强制执行的严格定义集合不匹配，那么你就遇到了潜在的代码破坏！\n\n因此，我们需要创建一组正则表达式来检测魔术方法签名违规。此外，我们的配置应包括正确的签名。这样，如果检测到违规，我们可以在结果消息中呈现正确的签名，从而加快更新过程。\n\
  \n魔术方法签名配置可能如下所示：\n\n```php\n// /repo/ch11/bc_break_scanner.config.php\nuse Php8\\\
  Migration\\BreakScan;\nreturn [\n    BreakScan::KEY_MAGIC => [\n'__call' => [ 'signature'\
  \ =>\n    '__call(string $name, array $arguments): mixed',\n    'regex' => '/__call\\\
  s*\\((string\\s)?'\n        . '\\$.*? (array\\s)?\\$.*?\\ ) (\\s*:\\s*mixed)?/',\n\
  \    'types' => ['string', 'array', 'mixed'],\n    // other configuration keys not\
  \ shown\n    '__wakeup' => ['signature' => '__wakeup(): void',\n    'regex' => '/__wakeup\\\
  s*\\(\\) (\\s*:\\s*void)?/',\n    'types' => ['void']],\n]\n    // other configuration\
  \ keys not shown\n];\n```\n\n你可能会注意到我们包含了一个额外的选项 types。这是为了自动生成正则表达式而包含的。执行此操作的代码未显示。如果你感兴趣，请查看\
  \ /path/to/repo/ch11/php7_build_magic_signature_regex.php。\n\n让我们看看当简单的 strpos()\
  \ 搜索不足时，你如何处理复杂的破坏检测。\n\n## 处理复杂的 BC 破坏检测\n\n在简单的 strpos() 搜索证明不足的情况下，我们可以开发另一组键/值对，其中值是回调。作为示例，考虑潜在的\
  \ BC 破坏，其中一个类定义了 __destruct() 方法，但也在 __construct() 方法中使用了 die() 或 exit()。在 PHP 8\
  \ 中，在这些情况下 __destruct() 方法可能不会被调用。\n\n在这种情况下，简单的 strpos() 搜索是不够的。相反，我们必须开发以下逻辑：\n\
  \n- 检查是否定义了 __destruct() 方法。如果是，则无需继续，因为在 PHP 8 中没有破坏的危险。\n- 检查 __construct() 方法是否使用了\
  \ die() 或 exit()。如果是，则发出潜在 BC 破坏的警告。\n\n在我们的 BC 破坏扫描配置数组中，回调采用匿名函数的形式。它接受文件内容作为参数。然后我们将回调分配给数组配置键，并包含在回调返回\
  \ TRUE 时要传递的警告消息：\n\n```php\n// /repo/ch11/bc_break_scanner.config.php\nreturn [\n\
  \    // not all keys are shown\n    BreakScan::KEY_CALLBACK => [\n        'ERR_CONST_EXIT'\
  \ => [\n            'callback' => function ($contents) {\n                $ptn =\
  \ '/__construct.*?\\{.*? (die|exit).*?}/im';\n                return (preg_match($ptn,\
  \ $contents)\n                    && strpos('__destruct', $contents)); },\n    \
  \        'msg' => 'WARNING: __destruct() might not get '\n                . 'called\
  \ if \"die()\" or \"exit()\" used '\n                . 'in __construct()',\n   \
  \     ], // etc.\n        // not all entries are shown\n];\n```\n\n在我们的 BC 破坏扫描器类中（稍后讨论），调用回调所需的逻辑可能如下所示：\n\
  \n```php\n$contents = file_get_contents(FILE_TO_SEARCH);\n$className = 'SOME_CLASS';\n\
  foreach ($config['callbacks'] as $key => $value)\n    if ($value['callback']($contents))\
  \ echo $value['msg'];\n```\n\n如果检测额外潜在 BC 破坏的要求超出了回调的能力，我们将在 BC 破坏扫描类内部直接定义一个单独的方法。\n\
  \n正如你所见，可以开发一个配置数组，不仅支持简单的 strpos() 搜索，还支持使用回调数组进行更复杂的搜索。\n\n现在你对配置数组中会包含什么有了一些概念，是时候定义执行破坏扫描的主要类了。\n\
  \n\n\n## 开发 BC 断裂扫描类\n\nBreakScan 类面向单个文件。在此类中，我们定义了利用刚才介绍的各种断裂扫描配置的方法。如果需要扫描多个文件，调用程序会生成一个文件列表并逐个将其传递给\
  \ BreakScan。\n\nBreakScan 类可以分为两个主要部分：定义基础设施的方法，以及定义如何执行特定扫描的方法。后者主要由配置文件结构决定。对于每个配置文件部分，我们需要一个\
  \ BreakScan 类方法。\n\n我们先来看一下基础设施方法。\n\n## 定义 BreakScan 类基础设施方法\n\n在本节中，我们来看 BreakScan\
  \ 类的初始部分。我们还将介绍执行基础设施相关活动的方法：\n\n- 首先，我们设置类基础设施，将其放置在 /repo/src/Php8/Migration 目录中：\n\
  \n// /repo/src/Php8/Migration/BreakScan.php\ndeclare(strict_types=1);\nnamespace\
  \ Php8\\Migration;\nuse InvalidArgumentException;\nuse UnexpectedValueException;\n\
  class BreakScan {\n- 接下来，我们定义一组类常量，用于渲染指示每次扫描后失败性质的消息：\n\n```\nconst ERR_MAGIC_SIGNATURE\
  \ = 'WARNING: magic method '\n    . 'signature for %s does not appear to match '\n\
  \    . 'required signature';\nconst ERR_NAMESPACE = 'WARNING: namespaces can no\
  \ '\n    . 'longer contain spaces in PHP 8.';\nconst ERR_REMOVED = 'WARNING: the\
  \ following function'\n    . 'has been removed: %s. Use this instead: %s';\n// not\
  \ all constants are shown\n```\n- 我们还定义了一组表示配置数组键的常量。这样做是为了在配置文件和调用程序（稍后讨论）中的键定义之间保持一致：\n\
  \n```php\nconst KEY_REMOVED = 'removed';\nconst KEY_CALLBACK = 'callbacks';\nconst\
  \ KEY_MAGIC = 'magic';\nconst KEY_RESOURCE = 'resource';\n```\n- 然后我们初始化关键属性，表示配置、待扫描文件的内容以及任何消息：\n\
  \n```php\npublic $config = [];\npublic $contents = '';\npublic $messages = [];\n\
  ```\n- __construct() 方法接受我们的断裂扫描配置文件作为参数，并遍历所有键以确保它们存在：\n\n```php\npublic function\
  \ __construct(array $config) {\n    $this->config = $config;\n    $required = [self::KEY_CALLBACK,\n\
  \        self::KEY_REMOVED,\n        self::KEY_MAGIC,\n        self::KEY_RESOURCE];\n\
  \    foreach ($required as $key) {\n        if (!isset($this->config[$key])) {\n\
  \            $message = sprintf(\n                self::ERR_MISSING_KEY, $key);\n\
  \            throw new Exception($message);\n        }\n    }\n}\n```\n- 然后我们定义一个读取待扫描文件内容的方法。请注意，我们移除了回车符\
  \ (\"\\r\") 和换行符 (\"\\n\")，以便通过正则表达式扫描更容易处理：\n\n```php\npublic function getFileContents(string\
  \ $fn) {\n    if (!file_exists($fn)) {\n        throw new Exception(\n         \
  \   sprintf(self::ERR_FILE_NOT_FOUND, $fn));\n    }\n    $this->contents = file_get_contents($fn);\n\
  \    $this->contents = str_replace([\"\\r\",\"\\n\"],\n        ['',' '], $this->contents);\n\
  \    return $this->contents;\n}\n```\n- 一些回调需要一种方法来仅提取类名或仅提取命名空间。为此，我们定义了静态 getKeyValue()\
  \ 方法：\n\n```\npublic static function getKeyValue(\n    string $contents, string\
  \ $key, string $end) {\n    $pos = strpos($contents, $key);\n    $end = strpos($contents,\
  \ $end,\n        $pos + strlen($key) + 1);\n    return trim(substr($contents,\n\
  \        $pos + strlen($key),\n        $end - $pos - strlen($key)));\n}\n```\n\n\
  该方法查找关键字（例如 class）。然后它找到关键字之后直到分隔符（例如 '; '）的内容。因此，如果你想获取类名，你可以执行以下操作：$name = BreakScan::getKeyValue($contents,'class',';')。\n\
  - 我们还需要一种方法来检索和重置 $this->messages。以下是执行此操作的两个方法：\n\n```\npublic function clearMessages()\
  \ : void {\n    $this->messages = [];\n}\npublic function getMessages(bool $clear\
  \ = FALSE) {\n    $messages = $this->messages;\n    if ($clear) $this->clearMessages();\n\
  \    return $messages;\n}\n```\n- 然后我们定义一个运行所有扫描的方法（将在下一节介绍）。该方法还收集检测到的潜在 BC 断裂数量并报告总数：\n\
  \n```php\npublic function runAllScans() : int {\n    $found = 0;\n    $found +=\
  \ $this->scanRemovedFunctions();\n    $found += $this->scanIsResource();\n    $found\
  \ += $this->scanMagicSignatures();\n    $found += $this->scanFromCallbacks();\n\
  \    return $found;\n}\n```\n\n现在你对基本 BreakScan 类基础设施的可能外观有了一些概念，让我们来看一下各个扫描方法。\n\
  \n## 检查各个扫描方法\n\n四个单独的扫描方法直接对应于断裂扫描配置文件中的顶级键。每个方法预计会在 $this->messages 中累积有关潜在 BC\
  \ 断裂的消息。此外，每个方法预计返回一个表示检测到的潜在 BC 断裂总数的整数。\n\n现在让我们按顺序检查这些方法：\n\n- 我们首先检查的方法是 scanRemovedFunctions()。在此方法中，我们搜索函数名后紧跟一个左括号\
  \ ' ('，或一个空格和左括号 ' ( '。如果找到函数，我们递增 $found，并将适当的警告和建议的替换添加到 $this->messages。如果未发现潜在断裂，我们添加成功消息并返回\
  \ 0：\n\n```php\npublic function scanRemovedFunctions() : int {\n    $found = 0;\n\
  \    $config = $this->config[self::KEY_REMOVED];\n    foreach ($config as $func\
  \ => $replace) {\n        $search1 = ' ' . $func . '(';\n        $search2 = ' '\
  \ . $func . ' (';\n        if (\n            strpos($this->contents, $search1) !==\
  \ FALSE\n            ||\n            strpos($this->contents, $search2) !== FALSE)\n\
  \        {\n            $this->messages[] = sprintf(\n                self::ERR_REMOVED,\
  \ $func, $replace);\n            $found++;\n        }\n    }\n    if ($found ===\
  \ 0)\n        $this->messages[] = sprintf(\n            self::OK_PASSED, __FUNCTION__);\n\
  \    return $found;\n}\n```\n\n这种方法的主要问题是，如果函数前面没有空格，其使用将无法被检测到。然而，如果我们在搜索中不包含前导空格，我们可能会出现误报。例如，如果不包含前导空格，break\
  \ 扫描器在查找 each() 时，每一个 foreach() 实例都会触发警告！\n- 接下来我们来看一个扫描 is_resource() 用法的方法。如果找到引用，此方法会遍历不再产生资源的功能列表。如果同时找到\
  \ is_resource() 和其中一个方法，则会标记潜在的 BC 断裂：\n\n```php\npublic function scanIsResource()\
  \ : int {\n    $found = 0;\n    $search = 'is_resource';\n    if (strpos($this->contents,\
  \ $search) === FALSE)\n        return 0;\n    $config = $this->config[self::KEY_RESOURCE];\n\
  \    foreach ($config as $func) {\n        if ((strpos($this->contents, $func) !==\
  \ FALSE)) {\n            $this->messages[] =\n                sprintf(self::ERR_IS_RESOURCE,\
  \ $func);\n            $found++;\n        }\n    }\n    if ($found === 0)\n    \
  \    $this->messages[] =\n            sprintf(self::OK_PASSED, __FUNCTION__);\n\
  \    return $found;\n}\n```\n- 然后我们来看遍历回调列表所需的步骤。正如你所回忆的，在简单的 strpos() 不足的情况下，我们需要使用回调。因此，我们首先收集所有回调子键并逐一循环。如果没有底层键\
  \ callback，我们抛出 Exception。否则，我们运行回调，并将 $this->contents 作为参数提供。如果发现任何潜在的 BC 断裂，我们添加适当的错误消息，并递增\
  \ $found：\n\n```\npublic function scanFromCallbacks() {\n    $found = 0;\n    $list\
  \ = array_keys($this->config[self::KEY_CALLBACK]);\n    foreach ($list as $key)\
  \ {\n        $config = $this->config[self::KEY_CALLBACK][$key] ?? NULL;\n      \
  \  if (empty($config['callback']) || !is_callable($config['callback'])) {\n    \
  \        $message = sprintf(self::ERR_INVALID_KEY, self::KEY_CALLBACK . ' => ' .\
  \ $key . ' => callback');\n            throw new Exception($message);\n        }\n\
  \        if ($config['callback']($this->contents)) {\n            $this->messages[]\
  \ = $config['msg'];\n            $found++;\n        }\n    }\n    return $found;\n\
  }\n```\n\n\n\n4. 最后，我们转向迄今为止最复杂的方法，该方法用于扫描无效的魔术方法签名。主要问题是方法签名差异很大，因此我们需要构建单独的正则表达式来正确测试有效性。正则表达式存储在\
  \ BC 断裂配置文件中。如果检测到魔术方法，我们会检索其正确的签名并将其添加到 $this->messages。\n\n5. 首先，我们通过查找匹配 function\
  \ __ 的任何内容来检查是否存在魔术方法：\n\n```\npublic function scanMagicSignatures() : int {\n \
  \   $found  = 0;\n    $matches = [];\n    $result  = preg_match_all(\n        '/function\
  \ __(.+?)\\b/',\n        $this->contents, $matches);\n```\n\n6. 如果匹配数组不为空，我们遍历匹配集合并将魔术方法名赋给\
  \ $key：\n\n```\nif (!empty($matches[1])) {\n    $config = $this->config[self::KEY_MAGIC]\
  \ ?? NULL;\n    foreach ($matches[1] as $name) {\n        $key = '__' . $name;\n\
  ```\n\n7. 如果与此推定的魔术方法匹配的配置键未设置，我们假设它要么不是魔术方法，要么是配置文件中不存在的方法，因此无需担心。否则，如果存在键，我们提取一个表示方法调用的子字符串并将其赋给\
  \ $sub：\n\n```\nif (empty($config[$key])) continue;\nif ($pos = strpos($this->contents,\
  \ $key)) {\n    $end = strpos($this->contents,\n        '{', $pos);\n    $sub =\
  \ (empty($sub) || !is_string($sub))\n        ? '' : trim($sub);\n```\n\n8. 然后我们从配置中提取正则表达式并将其与子字符串进行匹配。该模式代表该特定魔术方法的正确签名。如果\
  \ preg_match() 返回 FALSE，我们就知道实际签名不正确，并将其标记为潜在的 BC 断裂。我们检索并存储警告消息并递增 $found：\n\n\
  ```\n```php\n$ptn = $config[$key]['regex'] ?? '/.*/';\nif (!preg_match($ptn, $sub))\
  \ {\n    $this->messages[] = sprintf(\n        self::ERR_MAGIC_SIGNATURE, $key);\n\
  \    $this->messages[] =\n        $config[$key]['signature']\n        ?? 'Check\
  \ signature';\n    $found++;\n}}}}\nif ($found === 0)\n    $this->messages[] = sprintf(\n\
  \        self::OK_PASSED, __FUNCTION__);\nreturn $found;\n}\n```\n```\n\n这就结束了我们对\
  \ BreakScan 类的检查。现在我们将注意力转向定义运行 BreakScan 类中编程的扫描所需的调用程序。\n\n## 构建 BreakScan 类调用程序\n\
  \n调用 BreakScan 类的程序的主要任务是接受路径参数并递归构建位于该路径中的 PHP 文件列表。然后我们遍历列表，逐个提取每个文件的内容并运行 BC\
  \ 断裂扫描。最后，我们会根据选择的详细程度呈现简略或详细的报告。\n\n请记住，我们即将讨论的 BreakScan 类和调用程序都设计为在 PHP 7 下运行。我们不使用\
  \ PHP 8 的原因是我们假设开发人员希望在进行 PHP 8 更新之前运行 BC 断裂扫描器：\n\n1. 我们首先配置自动加载器，并从命令行 ($argv)\
  \ 或 URL ($_GET) 获取路径和详细程度级别。此外，我们提供将结果写入 CSV 文件的选项，并接受此类文件的名称作为参数。你可能会注意到，我们还执行了一定程度的输入清理，尽管理论上\
  \ BC 断裂扫描器只会在开发服务器上由开发人员直接使用：\n\n```\n```php\n// /repo/ch11/php7_bc_break_scanner.php\n\
  define('DEMO_PATH', __DIR__);\nrequire __DIR__ . '/../src/Server/Autoload/Loader.php';\n\
  $loader = new \\Server\\Autoload\\Loader();\nuse Php8\\Migration\\BreakScan;\n//\
  \ some code not shown\n$path = $_GET['path'] ?? $argv[1] ?? NULL;\n$show = $_GET['show']\
  \ ?? $argv[2] ?? 0;\n$show = (int) $show;\n$csv  = $_GET['csv'] ?? $argv[3] ?? '';\n\
  $csv  = basename($csv);\n```\n```\n\n2. 接下来我们确认路径。如果未找到，我们将退出并显示使用信息（$usage 未显示）：\n\
  \n```\n```php\nif (empty($path)) {\n    if (!empty($_SERVER['REQUEST_URI']))\n \
  \       echo '<pre>' . $usage . '</pre>';\n    else\n        echo $usage;\n    exit;\n\
  }\n```\n```\n\n3. 然后我们获取 BC 断裂配置文件并创建 BreakScan 实例：\n\n```\n```php\n$config = include\
  \ __DIR__\n    . '/php8_bc_break_scanner_config.php';\n$scanner = new BreakScan($config);\n\
  ```\n```\n\n4. 为了构建文件列表，我们使用 RecursiveDirectoryIterator，并将其包装在 RecursiveIteratorIterator\
  \ 中，从给定路径开始。然后该列表由 FilterIterator 过滤，仅将扫描限制为 PHP 文件：\n\n```\n```php\n$iter = new\
  \ RecursiveIteratorIterator(\n    new RecursiveDirectoryIterator($path));\n$filter\
  \ = new class ($iter) extends FilterIterator {\n    public function accept() {\n\
  \        $obj = $this->current();\n        return ($obj->getExtension() === 'php');\n\
  \    }\n};\n```\n```\n\n5. 如果开发人员选择 CSV 选项，则会创建 SplFileObject 实例。同时，我们写出一个标题数组。此外，我们定义一个匿名函数来写入\
  \ CSV 文件：\n\n```\n```php\nif ($csv) {\n    $csv_file = new SplFileObject($csv, 'w');\n\
  \    $csv_file->fputcsv(\n        ['Directory','File','OK','Messages']);\n}\n$write\
  \ = function ($dir, $fn, $found, $messages)\n    use ($csv_file) {\n    $ok = ($found\
  \ === 0) ? 1 : 0;\n    $csv_file->fputcsv([$dir, $fn, $ok, $messages]);\n    return\
  \ TRUE;\n};\n```\n```\n\n6. 我们通过遍历 FilterIterator 实例提供的文件列表来启动扫描。在逐个文件扫描时，每次循环 $found\
  \ 都会被清零。我们确实会维护 $total，以便在最后给出潜在 BC 断裂的总数。你可能还注意到我们区分文件和目录。如果目录发生变化，其名称将作为标题显示：\n\
  \n```\n$dir = '';\n$total = 0;\nforeach ($filter as $name => $obj) {\n    $found\
  \ = 0;\n    $scanner->clearMessages();\n    if (dirname($name) !== $dir) {\n   \
  \     $dir = dirname($name);\n        echo \"Processing Directory: $name\\n\";\n\
  \    }\n}\n```\n\n7. 我们使用 SplFileObject::isDir() 来确定文件列表中的项目是否为目录。如果是，则继续处理列表中的下一个项目。然后我们将文件内容推送到\
  \ $scanner 并运行所有扫描。消息随后以字符串形式检索：\n\n```\nif ($obj->isDir()) continue;\n$fn = basename($name);\n\
  $scanner->getFileContents($name);\n$found = $scanner->runAllScans();\n$messages\
  \ = implode(\"\\n\", $scanner->getMessages());\n```\n\n8. 我们使用 switch() 块根据 $show\
  \ 表示的显示级别采取行动。级别 0 仅显示发现潜在 BC 断裂的文件。级别 1 显示这些文件加上消息。级别 2 显示所有可能的输出，包括成功消息：\n\n```\n\
  switch ($show) {\n    case 2:\n        echo \"Processing: $fn\\n\";\n        echo\
  \ \"$messages\\n\";\n        if ($csv)\n            $write($dir, $fn, $found, $messages);\n\
  \        break;\n    case 1:\n        if (!$found) break;\n```\n\n```\necho \"Processing:\
  \ $fn\\n\";\necho BreakScan::WARN_BC_BREAKS . \"\\n\";\nprintf(BreakScan::TOTAL_BREAKS,\
  \ $found);\necho \"$messages\\n\";\nif ($csv)\n    $write($dir, $fn, $found, $messages);\n\
  break;\ncase 0 :\ndefault :\n    if (!$found) break;\n    echo \"Processing: $fn\\\
  n\";\n    echo BreakScan::WARN_BC_BREAKS . \"\\n\";\n    if ($csv)\n        $write($dir,\
  \ $fn, $found, $messages);\n}\n```\n\n9. 最后，我们累积总数并显示最终结果：\n\n```\n$total += $found;\n\
  }\necho \"\\n\" . str_repeat('-', 40) . \"\\n\";\necho \"\\nTotal number of possible\
  \ BC breaks: $total\\n\";\n```\n\n现在你对调用方式有了一个大致的了解，让我们来看看一次测试扫描的结果。\n\n## 扫描应用程序文件\n\
  \n为了演示目的，在本书附带的源代码中，我们包含了一个较旧版本的 phpLdapAdmin。你可以在 /path/to/repo/sample_data/phpldapadmin-1.2.3\
  \ 找到源代码。对于本次演示，我们打开了 PHP 7 容器的 shell 并运行了以下命令：\n\n```\nroot@php8_tips_php7 [ /repo\
  \ ]#\nphp ch11/php7_bc_break_scanner.php \\\n    sample_data/phpldapadmin-1.2.3/\
  \ 1 |less\n```\n\n以下是运行此命令的部分结果：\n\n```\n```\nProcessing: functions.php\nWARNING:\
  \ the code in this file might not be\ncompatible with PHP 8\nTotal potential BC\
  \ breaks: 4\nWARNING: the following function has been removed: function __autoload.\n\
  Use this instead: spl_autoload_register(callable)\nWARNING: the following function\
  \ has been removed: create_function. Use this instead: Use either \"function ()\
  \ {}\" or \"fn () => <expression>\"\nWARNING: the following function has been removed:\
  \ each.\n    Use this instead: Use \"foreach()\" or ArrayIterator\nPASSED this scan:\
  \ scanIsResource\nPASSED this scan: scanMagicSignatures\nWARNING: using the \"@\"\
  \ operator to suppress warnings\nno longer works in PHP 8.\n```\n\n从输出结果可以看出，尽管\
  \ functions.php 通过了 scanMagicSignatures 和 scanIsResource 扫描，但此代码文件使用了 PHP 8 中已移除的三个函数：__autoload()、create_function()\
  \ 和 each()。你还会注意到，此文件使用 @ 符号来抑制错误，而在 PHP 8 中这种做法已不再有效。\n\n如果您指定了 CSV 文件选项，您可以在任何电子表格程序中打开它。以下是它在\
  \ Libre Office Calc 中的显示方式：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_452_0.png)\n\
  \n图 11.1 – CSV 文件在 Libre Office Calc 中打开\n\n您现在已经了解如何创建自动程序来检测潜在的 BC 兼容性破坏。请记住，代码远非完美，并不能涵盖每一种可能的代码破坏。对于这种情况，您必须在仔细阅读本书内容后依靠自己的判断。\n\
  \n现在是时候将注意力转向实际的迁移工作本身了。\n\n## 执行迁移\n\n从当前版本实际迁移到 PHP 8 版本的过程与向现有应用程序部署新功能集的过程非常相似。如果可能，您可以考虑并行运行两个网站，直到您确信新版本按预期工作为止。许多组织出于此目的会并行运行\
  \ staging 环境和生产环境。\n\n在本节中，我们提供一份 **十二步指南** 来执行成功的迁移。\n虽然我们专注于迁移到 PHP 8，但这十二个步骤适用于您可能希望执行的任何\
  \ PHP 更新。理解并仔细遵循这些步骤对于生产网站的成功至关重要。这十二个步骤中包含许多可以在遇到问题时回滚到早期版本的位置。\n\n在进入细节之前，这里是从旧版本的\
  \ PHP 到 PHP 8 的十二步迁移过程的总体概述：\n\n-   1. 仔细查看位于 PHP 文档附录中的适当迁移指南。在我们的例子中，我们选择 *从 PHP\
  \ 7.4x 迁移到 PHP 8.0x。* (`https://www.php.net/manual/en/appendices.php`)。\n-   2.\
  \ 确保您的当前代码在当前版本的 PHP 上运行正常。\n-   3. 备份数据库（如有）、所有源代码以及任何相关文件和资源（例如 CSS、JavaScript\
  \ 或图形图像）。\n-   4. 在您的版本控制软件中为即将更新的应用程序代码创建一个新分支。\n-   5. 扫描 BC 兼容性破坏（可能使用上一节讨论的\
  \ `BreakScan` 类）。\n-   6. 更新任何不兼容的代码。\n-   7. 根据需要重复 *步骤 5* 和 *步骤 6*。\n-   8. 将您的源代码上传到存储库。\n\
  -   9. 在更新到 PHP 8 且与生产服务器高度相似的虚拟环境中测试源代码。\n-   10. 如果虚拟化模拟不成功，请返回 *步骤 5*。\n-   11.\
  \ 将 staging 服务器（或等效虚拟环境）更新到 PHP 8，确保您可以切换回旧版本。\n-   12. 运行您能想象到的每项测试。如果不成功，请切换回\
  \ master 分支并返回 *步骤 5*。如果成功，请将 staging 环境克隆到生产环境。\n\n让我们现在逐一查看每个步骤。\n\n### 第 1 步\
  \ – 查看迁移指南\n\n在 PHP 的每次主要发布中，PHP 核心团队都会发布一份 **迁移指南**。本书主要关注的指南是 *从 PHP 7.4.x 迁移到\
  \ PHP 8.0.x*，位于 `https://www.php.net/manual/en/migration80.php`。该迁移指南分为四个部分：\n\n\
  -   - 新功能\n-   - 向后不兼容的更改\n-   - 已弃用的功能\n-   - 其他更改\n\n如果您从 PHP 7.4 以外的版本迁移到 PHP\
  \ 8.0，您还应查看从当前 PHP 版本到 PHP 8 的所有过去迁移指南。我们现在将查看迁移过程中的其他推荐步骤。\n\n### 第 2 步 – 确保当前代码正常工作\n\
  \n在开始对当前代码库进行更改以确保其在 PHP 8 中工作之前，您必须绝对确保它现在正在工作。如果代码现在不能工作，迁移到 PHP 8 后肯定也不会工作！运行任何单元测试以及任何\
  \ **黑盒测试**，以确保代码在当前版本的 PHP 中功能正确。\n\n如果您在迁移前对当前代码进行任何更改，请确保这些更改反映在版本控制软件的主分支（通常称为\
  \ **主分支**）中。\n\n### 第 3 步 – 备份所有内容\n\n下一步是备份所有内容。这包括数据库、源代码、JavaScript、CSS、图像等。此外，请不要忘记备份重要的配置文件，例如\
  \ `php.ini` 文件、Web 服务器配置以及与 PHP 和 Web 通信相关的任何其他配置文件。\n\n### 第 4 步 – 创建版本控制分支\n\n\
  在此步骤中，您应该在版本控制系统中创建一个新分支并检出该分支。在主分支中，您应该只有当前可工作的代码。\n\n使用 Git 执行此类命令的方式可能如下：\n\n\
  ```\n$ git branch php8_migration\n$ git checkout php8_migration\nSwitched to branch\
  \ 'php8_migration'\n```\n\n所示的第一个命令创建了一个名为 php8_migration 的分支。第二个命令使 git 切换到新分支。在此过程中，您所有现有的代码都会被移植到新分支。主分支现在是安全的，并且不受在新分支中进行的任何更改的影响。\n\
  \n有关使用 Git 进行版本控制的更多信息，请查看这里：\nhttps://git-scm.com/.\n\n### 第 5 步 – 扫描 BC 兼容性破坏\n\
  \n现在是充分利用 BreakScan 类的时候了。运行调用程序，并将项目的起始目录路径以及详细程度级别（0、1 或 2）作为参数提供。您还可以指定 CSV 文件作为第三个选项，如图\
  \ 11.1 之前所示。\n\n### 第 6 步 – 修复不兼容性\n\n在此步骤中，了解破坏所在的位置后，您可以继续修复不兼容性。您应该能够以代码在当前版本的\
  \ PHP 中继续运行，同时也能在 PHP 8 中运行的方式进行修复。正如我们在本书中始终指出的那样，BC 兼容性破坏在很大程度上源于不良的编码实践。通过修复不兼容性，您同时改进了代码。\n\
  \n### 第 7 步 – 根据需要重复步骤 5 和 6\n\n有一句名言，在许多好莱坞电影中反复出现，医生对焦虑的病人说，服用两片阿司匹林，明天早上再打电话给我。相同的建议适用于处理\
  \ BC 兼容性破坏的过程。您必须有耐心，并继续修复和扫描、修复和扫描。一直这样做，直到扫描不再显示潜在的 BC 兼容性破坏为止。\n\n### 第 8 步 –\
  \ 将更改提交到存储库\n\n一旦您相对确信没有进一步的 BC 兼容性破坏，就该将更改提交到您在版本控制软件中创建的新 PHP 8 迁移分支了。现在就推送更改。之后，您就可以在生产服务器上解决\
  \ PHP 更新后从该分支检索更新后的代码。\n\n请记住这一点：您当前的工作代码安全地存储在主分支中。在此阶段，您只保存到 PHP 8 迁移分支，因此您可以随时切换回去。\n\
  \n### 第 9 步 – 在模拟虚拟环境中测试\n\n将此步骤视为真正的彩排。在此步骤中，您创建一个虚拟环境（例如使用 Docker 容器），使其尽可能接近生产服务器的模拟。在此虚拟环境中，您然后安装\
  \ PHP 8。虚拟环境创建后，您可以打开到其中的命令 shell，并从 PHP 8 迁移分支下载源代码。\n\n然后您可以运行单元测试，以及您认为有必要测试更新后代码的任何其他测试。希望这里能捕获任何额外的错误。\n\
  \n### 第 10 步 – 如果测试不成功则返回步骤 5\n\n如果在虚拟环境中执行的单元测试、黑盒测试或其他测试显示您的应用程序代码失败，您必须返回步骤 5。在明知会失败的情况下继续进行实时生产站点是极不明智的！\n\
  \n### 第 11 步 – 在 staging 环境上安装 PHP 8\n\n下一步是在 staging 环境中安装 PHP 8。正如您可能从本章第一部分讨论中回忆的那样，传统流程是从开发环境到\
  \ staging，然后到生产。一旦在 staging 环境上完成所有测试，您就可以将 staging 克隆到生产环境。\n\nPHP 安装在主要的 php.net\
  \ 网站上已有详细记录，因此这里无需进一步详细介绍。相反，在本节中我们为您提供 PHP 安装的简要概述，重点关注在 PHP 8 和当前 PHP 版本之间切换的能力。\n\
  \n\n\n> **提示**\n> 有关在各种环境中安装 PHP 的信息，请参阅此文档页面：https://www.php.net/manual/en/install.php.\n\
  \n为说明目的，我们选择讨论在 Linux 的两个主要分支上安装 PHP 8：Debian/Ubuntu 和 Red Hat/CentOS/Fedora。让我们从\
  \ Debian/Ubuntu Linux 开始。\n\n## 在 Debian/Ubuntu Linux 上安装 PHP 8\n\n安装 PHP 8 的最佳方式是通过可用的预编译二进制包。新版本的\
  \ PHP 通常在其发布日期之后很久才提供，PHP 8 也不例外。在这种情况下，建议您使用个人软件包档案（PPA）。托管在 https://launchpad.net/~ondrej\
  \ 的 PPA 是最全面且使用最广泛的。\n\n如果您想在自己的计算机上模拟以下步骤，请使用以下命令运行预装了 PHP 7.4 的 Ubuntu Docker\
  \ 镜像：\n\n```\ndocker run -it \\\n  unlikelysource/ubuntu_focal_with_php_7_4:latest\
  \ /bin/bash\n```\n\n为在 Debian 或 Ubuntu Linux 上安装 PHP 8，请在生产服务器（或演示容器）上打开一个命令 shell，并以\
  \ root 用户身份按以下步骤操作。或者，如果无法访问 root 用户，请在每个所示命令前加上 sudo。\n\n从命令 shell 安装 PHP 8，请按以下步骤操作：\n\
  \n- 1. 使用 apt 工具更新和升级当前软件包集。可以使用的任何软件包管理器；然而，我们展示 apt 的使用以保持此处涵盖的安装步骤之间的一致性：\n-\
  \ 2. 将 Ondrej PPA 仓库添加到您的 apt 源中：\n- 3. 安装 PHP 8。这仅安装 PHP 8 核心和基本扩展：\n\n```\napt\
  \ update\napt upgrade\n```\n\n```\nadd-apt-repository ppa:ondrej/php\n```\n\n```\n\
  apt install php8.0\n```\n\n- 4. 使用以下命令扫描仓库以查找其他扩展，并根据需要使用 apt 安装它们：\n\n```\napt\
  \ search php8.0-*\n```\n\n- 5. 执行 PHP 版本检查以确保您现在正在运行 PHP 8：\n\n```\nphp --version\n\
  ```\n\n以下是版本检查输出：\n\n```\nroot@ec873e16ee93:/# php --version\nPHP 8.0.7 (cli) (built:\
  \ Jun  4 2021 21:26:10) ( NTS )\nCopyright (c) The PHP Group\nZend Engine v4.0.7,\
  \ Copyright (c) Zend Technologies\nwith Zend OPcache v8.0.7, Copyright (c), by Zend\
  \ Technologies\n```\n\n现在您对 PHP 8 安装的大致流程有了基本了解，让我们看看如何在当前版本和 PHP 8 之间切换。为说明目的，我们假设在\
  \ PHP 8 安装之前，PHP 7.4 是当前的 PHP 版本。\n\n## 在 Debian 和 Ubuntu Linux 中切换 PHP 版本\n\n如果您检查\
  \ PHP 的位置，会注意到在安装 PHP 8 后，旧版本的 PHP 7.4 仍然存在。您可以使用 whereis php 来实现此目的。我们模拟的 Docker\
  \ Ubuntu 容器上的输出如下所示：\n\n```\nroot@ec873e16ee93:/# whereis php\nphp: /usr/bin/php\
  \ /usr/bin/php8.0 /usr/bin/php7.4 /usr/lib/php /etc/php /usr/share/php7.4-opcache\
  \ /usr/share/php8.0-opcache /usr/share/php8.0-readline /usr/share/php7.4-readline\
  \ /usr/share/php7.4-json /usr/share/php8.0-common /usr/share/php7.4-common\n```\n\
  \n如您所见，我们现在同时安装了 7.4 和 8.0 版本的 PHP。要在两者之间切换，请使用以下命令：\n\n```\nupdate-alternatives\
  \ --config php\n```\n\n然后您会看到一个选项屏幕，允许您选择应处于活动状态的 PHP 版本。以下是 Ubuntu Docker 镜像上输出屏幕的显示方式：\n\
  \n```\nroot@ec873e16ee93:/# update-alternatives --config php\nThere are 2 choices\
  \ for the alternative php\n(providing /usr/bin/php).\n  Selection    Path      \
  \          Priority   Status\n------------------------------------------------------------\n\
  * 0            /usr/bin/php8.0      80         auto mode\n  1            /usr/bin/php7.4\
  \      74         manual mode\n  2            /usr/bin/php8.0      80         manual\
  \ mode\nPress <enter> to keep the current choice[*], or type selection number:\n\
  ```\n\n切换后，您可以再次执行 php --version 以确认另一个 PHP 版本已处于活动状态。\n\n现在让我们把注意力转向 Red Hat Linux\
  \ 及其衍生版上的 PHP 8 安装。\n\n## 在 Red Hat、CentOS 或 Fedora Linux 上安装 PHP 8\n\n在 Red Hat、CentOS\
  \ 或 Fedora Linux 上安装 PHP 与 Debian/Ubuntu 安装程序相似。主要区别在于您很可能使用 dnf 和 yum 的组合来安装预编译的\
  \ PHP 二进制文件。\n\n如果您想跟随本节概述的安装，可以使用已预装 PHP 7.4 的 Fedora Docker 容器。以下是运行模拟的命令：\n\n\
  ```\ndocker run -it unlikelysource/fedora_34_with_php_7_4 /bin/bash\n```\n\n与上一节描述的\
  \ PPA 环境类似，在 Red Hat 世界中，Remi 的 RPM 仓库项目（http://rpms.remirepo.net/）以 Red Hat 软件包管理（RPM）格式提供预编译的二进制文件。\n\
  \n要在 Red Hat、CentOS 或 Fedora 上安装 PHP 8，请在生产服务器（或演示环境）上打开命令 shell，并以 root 用户身份按以下步骤操作：\n\
  \n- 1. 首先，最好确认您使用的操作系统版本和发行版。为此，使用 uname 命令，以及一个简单的 cat 命令来查看发行版（存储为 /etc 目录中的文本文件）：\n\
  \n```\n[root@9d4e8c93d7b6 /]# uname -a\nLinux 9d4e8c93d7b6 5.8.0-55-generic #62~20.04.1-Ubuntu\n\
  SMP Wed Jun 2 08:55:04 UTC 2021 x86_64 x86_64 x86_64\nGNU/Linux\n[root@9d4e8c93d7b6\
  \ /]# cat /etc/fedora-release\nFedora release 34 (Thirty Four)\n```\n\n- 2. 开始之前，请确保更新\
  \ dnf 并安装配置管理器：\n\n```\ndnf upgrade\ndnf install 'dnf-command(config-manager)'\n\
  ```\n\n- 3. 然后您将 Remi 的仓库添加到软件包源中，使用您偏好的版本号代替 NN：\n\n```\ndnf install \\\n    https://rpms.remirepo.net/fedora/remi-release-NN.rpm\n\
  ```\n\n- 4. 此时，您可以使用 dnf module list 确认已安装的 PHP 版本。我们还使用 grep 将显示的模块列表限制为仅 PHP。\
  \ [e] 表示已启用：\n\n```\n[root@56b9fbf499d6 /]# dnf module list | grep php\nphp    \
  \                 remi-7.4 [e]      common [d] [i],\ndevel, minimal          PHP\
  \ scripting language\nphp                     remi-8.0          common [d],\ndevel,\
  \ minimal          PHP scripting language\n```\n\n- 5. 然后我们检查当前 PHP 版本：\n\n```\n\
  [root@d044cbe477c8 /]# php --version\nPHP 7.4.20 (cli) (built: Jun  1 2021 15:41:56)\
  \ (NTS)\nCopyright (c) The PHP Group\nZend Engine v3.4.0, Copyright (c) Zend Technologies\n\
  ```\n\n- 6. 接下来，我们重置 PHP 模块并安装 PHP 8：\n\n```\ndnf -y module reset php\ndnf -y module\
  \ install php:remi-8.0\n```\n\n- 7. 另一次快速的 PHP 版本检查显示我们现在使用的是 PHP 8 而不是 PHP 7：\n\
  \n```\n[root@56b9fbf499d6 /]# php -v\nPHP 8.0.7 (cli) (built: Jun  1 2021 18:43:05)\n\
  ( NTS gcc x86_64 ) Copyright (c) The PHP Group\nZend Engine v4.0.7, Copyright (c)\
  \ Zend Technologies\n```\n\n- 8. 要切换回较早的 PHP 版本，请按以下操作，其中 X.Y 是您计划使用的版本：\n\n```\n\
  dnf -y module reset php\ndnf -y module install php:remi-X.Y\n```\n\n这完成了针对 Red Hat、CentOS\
  \ 或 Fedora 的 PHP 安装说明。对于此演示，我们只向您展示了 PHP 命令行安装。如果您计划将 PHP 与 Web 服务器一起使用，还需要安装适当的\
  \ PHP Web 服务器软件包和/或安装 PHP-FPM（FastCGI 处理模块）软件包。\n\n现在让我们看看最后一步。\n\n## 第 12 步 – 测试并将暂存环境克隆到生产环境\n\
  \n在最后一步，您从 PHP 8 迁移分支下载源代码到暂存环境并运行各种可想象的测试以确保一切正常工作。一旦您确信成功，就将暂存环境克隆到生产环境。\n\n如果您使用虚拟化，克隆过程可能只需创建相同的\
  \ Docker 容器或虚拟磁盘文件。否则，如果涉及实际硬件，您可能最终会克隆硬盘，或根据您的设置采用适当的方法。\n\n这结束了我们关于如何执行迁移的讨论。现在让我们看看测试和故障排除。\n\
  \n\n\n## 测试和排查迁移问题\n\n在理想情况下，迁移的故障排查会在实际迁移到生产环境之前，就在暂存服务器或模拟虚拟环境中进行。然而，正如经验丰富的开发者所熟知，我们需要为最好的情况做好希望，但也要为最坏的情况做好准备！在本节中，我们将介绍一些容易被忽视的测试和故障排查的额外方面。\n\
  \n为了本节的目的，如果你正在按照 Debian/Ubuntu 或 Red Hat/CentOS/Fedora 安装流程操作，可以退出临时 shell。返回本课程使用的\
  \ Docker 容器，并在 PHP 8 容器中打开一个命令 shell。如果不确定如何操作，请参阅第 1 章《Introducing New PHP 8 OOP\
  \ Features》（介绍新 PHP 8 OOP 特性）中的技术要求部分获取更多信息。\n\n## 测试和排查工具\n\n这里有太多优秀的测试和故障排查工具无法在此全部记录，因此我们重点介绍一些开源工具来帮助进行测试和故障排查。\n\
  \n## 使用 Xdebug\n\nXdebug 是一款提供诊断、分析、追踪和单步调试等功能的工具。它是 PHP 扩展，因此在遇到难以轻松解决的问题时，能够提供详细的信息。其主网站是\
  \ https://xdebug.org/。\n\n要启用 Xdebug 扩展，你可以像安装任何其他 PHP 扩展一样安装它：使用 pecl 命令，或从 https://pecl.php.net/package/xdebug\
  \ 下载并编译源代码。\n\n此外，至少应设置以下 /etc/php.ini 配置：\n\n```\nzend_extension=xdebug.so\nxdebug.log=/repo/xdebug.log\n\
  xdebug.log_level=7\nxdebug.mode=develop,profile\n```\n\n图 11.2 显示了从 /repo/ch11/php8_xdebug.php\
  \ 调用的 xdebug_info() 命令的输出：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_463_0.png)\n\
  \n图 11.2 – xdebug_info() 输出\n\n现在让我们来看另一个从外部视角检查应用程序的工具。\n\n## 使用 Apache JMeter\n\
  \n一个极其有用的用于测试 Web 应用程序的开源工具是 Apache JMeter（https://jmeter.apache.org/）。它允许你开发一系列模拟浏览器请求的测试计划。你可以模拟数百个用户请求，每个请求都有自己的\
  \ cookie 和会话。虽然主要设计用于 HTTP 或 HTTPS，但它也能够处理十几种其他协议。此外，除了出色的图形用户界面外，它还具有命令行模式，使得可以将\
  \ JMeter 纳入自动化部署流程成为可能。\n\n安装相当简单，只需从 `https://jmeter.apache.org/download_jmeter.cgi`\
  \ 下载一次即可。JMeter 运行前必须安装 **Java 虚拟机 (JVM)**。测试计划的执行超出了本书的范围，但文档相当详尽。此外，请记住 JMeter\
  \ 设计为在客户端运行，而不是在服务器上运行。因此，如果你想测试本书中 Docker 容器里的网站，你需要在本地计算机上安装 Apache JMeter，然后构建一个指向\
  \ Docker 容器的测试计划。通常 PHP 8 容器的 IP 地址为 `172.16.0.88`。\n\n图 11.3 显示了 Apache JMeter\
  \ 在本地计算机上运行的启动屏幕：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_464_0.png)\n\n图 11.3\
  \ – Apache JMeter\n\n从此屏幕你可以开发一个或多个测试计划，指定要访问的 URL、模拟 GET 和 POST 请求、设置用户数量等等。\n\n\
  > **提示**\n>\n> 如果在尝试运行 jmeter 时遇到此错误：`Can't load library: /usr/lib/jvm/java-11-openjdk-amd64/lib/libawt_xawt.so`，请尝试安装\
  \ *OpenJDK 8*。然后你可以使用前面部分提到的技术在 Java 版本之间切换。\n\n现在让我们来看看 PHP 8 升级后 Composer 可能出现的问题。\n\
  \n## 处理 Composer 问题\n\n迁移到 PHP 8 完成后，开发者常遇到的问题之一是第三方软件。在本节中，我们将讨论与流行的 PHP 包管理器 Composer\
  \ 使用相关的潜在问题。\n\n你可能遇到的第一个问题与 Composer 本身的版本有关。2020 年，Composer 版本 2 发布了。然而，托管在主打包网站（https://packagist.org/）上的\
  \ 30 万多个包并非全部已更新到版本 2。因此，为了安装某个包，你可能需要在这两个版本之间切换。每个版本的最新发行版可在以下位置获取：\n\n- 版本 1:\
  \ https://getcomposer.org/download/latest-1.x/composer.phar\n- 版本 2: https://getcomposer.org/download/latest-2.x/composer.phar\n\
  \n另一个更严重的问题与你可能使用的各种 Composer 包的平台要求有关。每个包都有自己的 composer.json 文件，并有自己的要求。在许多情况下，包提供者可能会添加\
  \ PHP 版本要求。\n\n问题在于，虽然大多数 Composer 包现在可以在 PHP 7 上运行，但其要求是以排除 PHP 8 的方式指定的。在 PHP\
  \ 8 更新后，当你使用 Composer 更新第三方包时，会出现错误并导致更新失败。具有讽刺意味的是，大多数 PHP 7 包在 PHP 8 上也能工作！\n\n\
  作为示例，我们安装一个名为 laminas-api-tools 的 Composer 项目。截至撰写时，虽然该包本身已为 PHP 8 做好准备，但其若干依赖包尚未准备好。运行安装\
  \ API 工具的命令时，会遇到以下错误：\n\n```\nroot@php8_tips_php8 [ /srv ]#\ncomposer create-project\
  \ laminas-api-tools/api-tools-skeleton\nCreating a \"laminas-api-tools/api-tools-skeleton\"\
  \ project at \"./api-tools-skeleton\"\nInstalling laminas-api-tools/api-tools-skeleton\
  \ (1.3.1p1)\n  - Downloading laminas-api-tools/api-tools-skeleton (1.3.1p1)\n  -\
  \ Installing laminas-api-tools/api-tools-skeleton (1.3.1p1):\nExtracting archive\n\
  Created project in /srv/api-tools-skeleton\nLoading composer repositories with package\
  \ information\nUpdating dependencies\nYour requirements could not be resolved to\
  \ an installable set of packages.\n    Problem 1\n      - Root composer.json requires\
  \ laminas/laminas-developer-tools dev-master, found laminas/laminas-developer-tools[dev-release-1.3,\
  \ 0.0.1, 0.0.2, 1.0.0alpha1, ..., 1.3.x-dev, 2.0.0, ..., 2.2.x-dev] but it does\
  \ not match the constraint.\n    Problem 2\n      - zendframework/zendframework\
  \ 2.5.3 requires php ^5.5 || ^7.0 -> your php version (8.1.0-dev) does not satisfy\
  \ that requirement.\n```\n\n核心问题，如刚才输出的最后一部分所示，是其中一个依赖包要求 PHP ^7.0。在 composer.json\
  \ 文件中，这表示从 PHP 7.0 到包括 PHP 8.0 的版本范围。在此特定示例中，所使用的 Docker 容器运行的是 PHP 8.1，因此我们出现了问题。\n\
  \n幸运的是，在这种情况下，我们有信心如果该包能在 PHP 8.0 上运行，也应该能在 PHP 8.1 上运行。因此，我们所需要做的就是添加 --ignore-platform-reqs\
  \ 标志。当我们重试安装时，如以下输出所示，安装成功：\n\n```\nroot@php8_tips_php8 [/srv]#\ncomposer create-project\
  \ --ignore-platform-reqs \\\n    laminas-api-tools/api-tools-skeleton\nCreating\
  \ a \"laminas-api-tools/api-tools-skeleton\" project at \"./api-tools-skeleton\"\
  \nInstalling laminas-api-tools/api-tools-skeleton (1.6.0)\n  - Downloading laminas-api-tools/api-tools-skeleton\
  \ (1.6.0)\n  - Installing laminas-api-tools/api-tools-skeleton (1.6.0):\nExtracting\
  \ archive\nCreated project in /srv/api-tools-skeleton\nInstalling dependencies from\
  \ lock file (including require-dev)\nVerifying lock file contents can be installed\
  \ on current\nplatform.\nPackage operations: 109 installs, 0 updates, 0 removals\n\
  \  - Downloading laminas/laminas-zendframework-bridge (1.3.0)\n  - Downloading laminas-api-tools/api-tools-asset-manager\
  \ (1.4.0)\n```\n\n-   下载 squizlabs/php_codesniffer (3.6.0)\n-   下载 dealerdirect/phpcodesniffer-composer-installer\
  \ (v0.7.1)\n-   下载 laminas/laminas-component-installer (2.5.0)\n... 未显示全部输出\n\n\
  在刚刚显示的输出中，未出现平台需求错误，我们可以继续使用该应用程序。\n\n现在让我们把注意力转向单元测试。\n\n### 使用单元测试\n\n使用 **PHPUnit**\
  \ 进行单元测试是在新功能添加后或 PHP 更新后确保应用程序能够运行的过程中的关键因素。大多数开发者会创建一组单元测试，至少执行证明应用程序按预期运行所需的最低限度操作。测试是扩展\
  \ `PHPUnit\\Framework\\TestCase` 的类中的方法。测试的核心被称为 **断言**。\n\n> 提示\n> 关于如何创建和运行测试的说明超出了本书的范围。然而，你可以在\
  \ PHPUnit 官方网站上查阅内容丰富且示例众多的优秀文档：https://phpunit.de/。\n\nPHP 迁移后你可能会遇到的问题是 **PHPUnit**\
  \ (https://phpunit.de/) 本身可能会失败！原因在于 PHPUnit 每年都会发布新版本，对应当年当前的 PHP 版本。旧版本的 PHPUnit\
  \ 基于官方支持的 PHP 版本。因此，当前为你的应用程序安装的 PHPUnit 版本很可能是一个较旧的版本，不支持 PHP 8。最简单的解决方案是使用 Composer\
  \ 执行更新。\n\n为了说明可能出现的问题，我们假设某个应用程序的测试目录目前包含 PHPUnit 5。如果我们在运行 PHP 7.1 的 Docker 容器中运行测试，一切按预期工作。以下是输出：\n\
  \n```\nroot@php8_tips_php7 [ /repo/test/phpunit5 ]# php --version\nPHP 7.1.33 (cli)\
  \ (built: May 16 2020 12:47:37) (NTS)\nCopyright (c) 1997-2018 The PHP Group\nZend\
  \ Engine v3.1.0, Copyright (c) 1998-2018 Zend Technologies\nwith Xdebug v2.9.1,\
  \ Copyright (c) 2002-2020, by Derick Rethans\nroot@php8_tips_php7 [ /repo/test/phpunit5\
  \ ]#\nvendor/bin/phpunit\nPHPUnit 5.7.27 by Sebastian Bergmann and contributors.\n\
  ........\n8 / 8 (100%)\nTime: 27 ms, Memory: 4.00MB\nOK (8 tests, 8 assertions)\n\
  ```\n\n然而，如果我们在运行 PHP 8 的 Docker 容器中运行相同版本，结果就大不相同：\n\n```\nroot@php8_tips_php8\
  \ [ /repo/test/phpunit5 ]# php --version\nPHP 8.1.0-dev (cli) (built: Dec 24 2020\
  \ 00:13:50) (NTS)\nCopyright (c) The PHP Group\nZend Engine v4.1.0-dev, Copyright\
  \ (c) Zend Technologies\n    with Zend OPcache v8.1.0-dev, Copyright (c),\n    by\
  \ Zend Technologies\nroot@php8_tips_php8 [ /repo/test/phpunit5 ]#\nvendor/bin/phpunit\n\
  PHP Warning:  Private methods cannot be final as they are never overridden by other\
  \ classes in /repo/test/phpunit5/vendor/phpunit/phpunit/src/Util/Configuration.php\
  \ on line 162\nPHPUnit 5.7.27 by Sebastian Bergmann and contributors.\n........\n\
  8 / 8 (100%)\nTime: 33 ms, Memory: 2.00MB\nOK (8 tests, 8 assertions)\n```\n\n正如输出所示，PHPUnit\
  \ 本身报告了错误。当然，简单的解决方案是，在升级到 PHP 8 后，你还需要重新运行 Composer 并更新应用程序中使用的所有第三方包。\n\n这结束了我们关于测试和故障排除的讨论。你现在已经了解可以引入哪些额外工具来协助测试和故障排除。请注意，这绝不是所有测试和故障排除工具的完整列表。还有很多很多，有的免费开源，有的提供免费试用期，还有一些只能通过购买获得。\n\

  \ ]#\nphp php8_pgsql_changes.php\nDeprecated: Function pg_errormessage() is\ndeprecated\
  \ in /repo/ch08/php8_pgsql_changes.php on\nline 22\narray(0) {}\n```\n\n输出中需要注意的两点主要事实是\
  \ pg_errormessage() 已被弃用，并且当查询未返回结果时，不是返回 FALSE 布尔值，而是返回空数组。不要忘记使用以下命令停止 PostgreSQL\
  \ 数据库：\n\n/etc/init.d/postgresql stop\n\n现在您对各种 PHP 8 扩展中的已弃用功能有了一定的了解，我们将注意力转向与安全相关的弃用。\n\
  \n## 处理已弃用或移除的安全相关功能\n\n对功能造成影响的任何更改都极其重要。忽略这些更改很容易不仅导致代码中断，还可能使您的网站暴露给潜在攻击者。在本节中，我们将介绍\
  \ PHP 8 中存在的一系列与安全相关的功能更改。让我们从检查过滤器开始讨论。\n\n## 检查 PHP 8 流过滤器更改\n\nPHP 输入/输出 (I/O)\
  \ 操作依赖于一个名为流的子系统。这种架构的一个有趣方面是能够向任何给定流附加流过滤器。您可以附加的过滤器可以是使用 stream_filter_register()\
  \ 注册的自定义定义的流过滤器，也可以是随 PHP 安装一起提供的预定义过滤器。\n\n您需要了解的一个重要更改是，在 PHP 8 中，所有 mcrypt.*\
  \ 和 mdecrypt.* 过滤器已被移除，以及 string.strip_tags 过滤器。如果您不确定 PHP 安装中包含哪些过滤器，您可以运行 phpinfo()，或者更好的是，使用\
  \ stream_get_filters()。\n\n以下是使用本书的 PHP 7 Docker 容器运行的 stream_get_filters() 输出：\n\
  \n```\nroot@php8_tips_php7 [ /repo/ch08 ]#\nphp -r \"print_r(stream_get_filters());\"\
  \nArray (\n    [0] => zlib.*\n    [1] => bzip2.*\n    [2] => convert.iconv.*\n \
  \   [3] => mcrypt.*\n    [4] => mdecrypt.*\n    [5] => string.rot13\n    [6] =>\
  \ string.toupper\n    [7] => string.tolower\n    [8] => string.strip_tags\n    [9]\
  \ => convert.*\n    [10] => consumed\n    [11] => dechunk\n)\n```\n\n以下是同一命令在 PHP\
  \ 8 Docker 容器中运行的情况：\n\n```\nroot@php8_tips_php8 [ /repo/ch08 ]#\nphp -r \"print_r(stream_get_filters());\"\
  \nArray (\n    [0] => zlib.*\n    [1] => bzip2.*\n    [2] => convert.iconv.*\n \
  \   [3] => string.rot13\n    [4] => string.toupper\n    [5] => string.tolower\n\
  \    [6] => convert.*\n    [7] => consumed\n    [8] => dechunk\n)\n```\n\n您会注意到从\
  \ PHP 8 的输出中，前面提到的过滤器都已被移除。任何使用所列三个过滤器中的任何一个的代码在 PHP 8 迁移后都会中断。我们现在来看自定义错误处理的更改。\n\
  \n## 处理自定义错误处理更改\n\n从 PHP 7.0 开始，大多数错误现在都会 **抛出**。例外情况是 PHP 引擎不知道存在错误条件的情况，例如内存不足、超出时间限制或发生段错误。另一个例外是程序故意使用\
  \ `trigger_error()` 函数触发错误时。\n\n使用 `trigger_error()` 函数捕获错误不是最佳实践。*最佳实践* 是开发面向对象的代码并将其放在\
  \ try/catch 结构中。然而，如果您被分配管理一个确实使用这种做法的应用程序，则传递给自定义错误处理程序的内容发生了变化。\n\n在 PHP 8 之前的版本中，传递给自定义错误处理程序第五个参数\
  \ `$errorcontext` 的数据是有关传递给函数参数的信息。在 PHP 8 中，此参数被忽略。为了说明差异，请查看接下来显示的简单代码示例。以下是导致此的步骤：\n\
  \n- 1. 首先，我们定义一个自定义错误处理程序，如下所示：\n\n// /repo/ch08/php7_error_handler.php\nfunction\
  \ handler($errno, $errstr, $errfile,\n    $errline, $errorcontext = NULL) {\n  \
  \  echo \"Number  : $errno\\n\";\n    echo \"String  : $errstr\\n\";\n    echo \"\
  File    : $errfile\\n\";\n    echo \"Line    : $errline\\n\";\n    if (!empty($errorcontext))\n\
  \        echo \"Context: \\n\"\n            . var_export($errorcontext, TRUE);\n\
  \    exit;\n}\n```\n\n2. 然后我们定义一个触发错误、设置错误处理程序并调用该函数的函数，如下所示：\n\n```\nfunction level1($a,\
  \ $b, $c) {\n    trigger_error(\"This is an error\", E_USER_ERROR);\n}\nset_error_handler('handler');\n\
  echo level1(TRUE, 222, 'C');\n```\n\n以下是 PHP 7 中运行的输出：\n\n```\nroot@php8_tips_php7\
  \ [ /repo/ch08 ]#\nphp php7_error_handler.php\nNumber : 256\nString : This is an\
  \ error\nFile   : /repo/ch08/php7_error_handler.php\nLine   : 17\nContext:\narray\
  \ (\n  'a' => true,\n  'b' => 222,\n  'c' => 'C',\n)\n```\n\n正如前面的输出所示，$errorcontext\
  \ 提供了有关函数接收到的参数的信息。相比之下，请查看 PHP 8 产生的输出，如下所示：\n\n```\nroot@php8_tips_php8 [ /repo/ch08\
  \ ]#\nphp php7_error_handler.php\nNumber : 256\nString : This is an error\nFile\
  \   : /repo/ch08/php7_error_handler.php\nLine   : 17\n```\n\n正如您所见，输出是相同的，只是缺少传入\
  \ $errorcontext 的信息。现在让我们来看一下生成回溯。\n\n\n\n## Dealing with changes to backtraces\n\
  \n令人惊讶的是，在 PHP 8 之前，可以通过回溯更改函数参数。这之所以可能，是因为由 debug_backtrace() 或 Exception::getTrace()\
  \ 生成的跟踪通过引用提供了对函数参数的访问。\n\n这是一种极其糟糕的做法，因为它允许程序在可能处于错误状态的情况下继续运行。此外，在审查此类代码时，参数数据是如何提供的并不清楚。因此，在\
  \ PHP 8 中，不再允许这种做法。debug_backtrace() 或 Exception::getTrace() 仍然像以前一样运行。唯一的区别是它们不再通过引用传递参数变量。\n\
  \n现在让我们来看看 PDO 错误处理的更改。\n\n## PDO error-handling mode default changed\n\n多年来，当使用\
  \ PDO 扩展的数据库应用程序未能产生结果时，初级 PHP 开发者感到困惑。在许多情况下，此问题的原因是未报告的简单 SQL 语法错误。这是由于在 PHP 8\
  \ 之前的版本中，默认的 PDO 错误模式为 PDO::ERRMODE_SILENT。\n\nSQL 错误不是 PHP 错误。因此，此类错误不会被正常的 PHP\
  \ 错误处理捕获。相反，PHP 开发者必须专门将 PDO 错误模式设置为 PDO::ERRMODE_WARNING 或 PDO::ERRMODE_EXCEPTION。PHP\
  \ 开发者现在可以松一口气了，因为从 PHP 8 开始，PDO 默认错误处理模式现在是 PDO::ERRMODE_EXCEPTION。\n\n在下面的示例中，PHP\
  \ 7 允许不正确的 SQL 语句静默失败：\n\n```php\n// /repo/ch08/php7_pdo_err_mode.php\n$dsn = 'mysql:host=localhost;dbname=php8_tips';\n\
  $pdo = new PDO($dsn, 'php8', 'password');\n$sql = 'SELECT propertyKey, hotelName\
  \ FROM hotels '\n    .\"WHERE country = 'CA'\";\n$stmt = $pdo->query($sql);\nif\
  \ ($stmt)\n    while($hotel = $stmt->fetch(PDO::FETCH_OBJ))\n        echo $hotel->hotelName\
  \ . ' ' . $hotel->propertyKey . \"\\n\";\nelse\n    echo \"No Results\\n\";\n```\n\
  \n在 PHP 7 中，唯一输出是 No Results，这既具有误导性又没有帮助。它可能会导致开发者认为没有结果，而实际上问题是 SQL 语法错误。\n\n\
  此处显示的在 PHP 8 中运行的输出更有帮助：\n\n```\nroot@php8_tips_php8 [ /repo/ch08 ]# php php7_pdo_err_mode.php\n\
  PHP Fatal error: Uncaught PDOException: SQLSTATE[42000]: Syntax error or access\
  \ violation: 1064 You have an error in your SQL syntax; check the manual that corresponds\
  \ to your MariaDB server version for the right syntax to use near 'SELECT propertyKey,\
  \ hotelName FROM hotels WHERE country = 'CA'' at line 1 in /repo/ch08/php7_pdo_err_mode.php:10\n\
  ```\n\n从前面的 PHP 8 输出中可以看到，实际问题已得到明确识别。\n\n> TIP\n> 有关此更改的更多信息，请参阅此 RFC：\n> https://wiki.php.net/rfc/pdo_default_errmode\n\
  \n接下来我们检查 track_errors php.ini 指令。\n\n## Examining the track_errors php.ini setting\n\
  \n从 PHP 8 开始，track_errors php.ini 指令已被移除。这意味着自动创建的变量 $php_errormsg 不再可用。在大多数情况下，PHP\
  \ 8 之前导致错误的东西现在已被转换为抛出 Error 消息。但是，对于 PHP 8 之前的版本，您仍然可以使用 error_get_last() 函数代替。\n\
  \n在下面的简单代码示例中，我们首先打开 track_errors 指令。然后我们在没有任何参数的情况下调用 strpos()，故意导致错误。然后我们依赖 $php_errormsg\
  \ 来揭示真正的错误：\n\n```\n// /repo/ch08/php7_track_errors.php\nini_set('track_errors',\
  \ 1);\n@strpos();\necho $php_errormsg . \"\\n\";\necho \"OK\\n\";\n```\n\n以下是 PHP\
  \ 7 中的输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch08 ]# php php7_track_errors.php\n\
  strpos() expects at least 2 parameters, 0 given\nOK\n```\n\n从前面的输出可以看到，$php_errormsg\
  \ 揭示了错误，并且代码块被允许继续。在 PHP 8 中，当然我们不允许在没有任何参数的情况下调用 strpos()。以下是输出：\n\n```\nroot@php8_tips_php8\
  \ [ /repo/ch08 ]# php php7_track_errors.php\nPHP Fatal error: Uncaught ArgumentCountError:\
  \ strpos() expects at least 2 arguments, 0 given in /repo/ch08/php7_track_errors.php:5\n\
  ```\n\n正如您所见，PHP 8 抛出 Error 消息。最佳做法是使用 try/catch 块并捕获可能抛出的任何 Error 消息。您也可以使用 error_get_last()\
  \ 函数。以下是重写后的示例，可在 PHP 7 和 PHP 8 中运行（未显示输出）：\n\n```\n// /repo/ch08/php8_track_errors.php\n\
  try {\n    strpos();\n    echo error_get_last()['message'];\n    echo \"\\nOK\\\
  n\";\n} catch (Error $e) {\n    echo $e->getMessage() . \"\\n\";\n}\n```\n\n您现在对\
  \ PHP 8 中已弃用或移除的功能有了一些了解。本章到此结束。\n\n## Summary\n\n在本章中，您了解了已弃用和移除的 PHP 功能。本章的第一部分涉及已移除的核心功能。更改的理由已得到解释，您了解到本章中描述的功能被移除的主要原因不仅是为了让您转向遵循最佳实践的代码，而且是为了让您使用更快、更高效的\
  \ PHP 8 功能。\n\n在下一部分，您了解了已弃用的功能。本节的关键主题是强调已弃用的函数、类和方法如何导致不良实践和漏洞百出的代码。您还获得了有关在许多关键\
  \ PHP 8 扩展中已被移除或弃用的功能的指导。\n\n您学习了如何定位和重写已弃用的代码，以及如何为已移除的功能开发变通方法。本章中学习的另一项技能包括如何重构使用涉及扩展的已移除功能的代码，最后但并非最不重要的是，您学习了通过重写依赖于已移除函数的代码来提高应用程序安全性。\n\
  \n在下一章中，您将通过掌握最佳实践来学习如何在 PHP 8 代码中获得更高的效率和性能。\n\n# Section 3: PHP 8 Best Practices\n\
  \n在本节中，您将了解 PHP 8 最佳实践。您将了解 PHP 8 如何引入了许多额外的控制来强制执行某些最佳实践。此外，还涵盖了在 PHP 8 中编写代码的最佳方式。\n\

  > https://wiki.php.net/rfc/shorter_attribute_syntax_change\n> \n> 有关 PHP DocBlocks\
  \ 的信息可在以下位置找到：\n> https://phpdoc.org/\n> \n> 有关 Doctrine ORM 的更多信息，请查看此处：\n> https://www.doctrine-project.org/projects/orm.html\n\

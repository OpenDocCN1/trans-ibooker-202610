  \n现在，让我们来看 PDO 扩展中的方法签名更改。\n\n## 处理 PDO 扩展签名更改\n\nPDO 扩展有两个重要的[content]\n此增强功能的缺点是，如果你的代码提供了不正确的参数或返回值类型，则会抛出\
  \ Error。另一方面，如果你的代码确实提供了正确参数数据类型和返回值类型，或者你的代码根本不使用参数或返回值数据类型，则此增强功能不会产生任何不利影响。\n\
  \n以下代码块总结了 PHP 8 及以上版本中魔术方法的新的参数和返回值数据类型：\n\n```\n__call(string $name, array $arguments):\
  \ mixed;\n__callStatic(string $name, array $arguments): mixed;\n__clone(): void;\n\
  __debugInfo(): ?array;\n__get(string $name): mixed;\n__invoke(mixed $arguments):\
  \ mixed;\n__isset(string $name): bool;\n__serialize(): array;\n__set(string $name,\
  \ mixed $value): void;\n__set_state(array $properties): object;\n__sleep(): array;\n\
  __unserialize(array $data): void;\n__unset(string $name): void;\n__wakeup(): void;\n\
  ```\n\n现在，让我们来看三个简单的示例，说明魔术方法签名更改的影响：\n\n- 1. 第一个示例涉及 NoTypes 类，该类定义了 __call()，但未定义任何数据类型：\n\
  \n```\n// /repo/ch09/php8_bc_break_magic.php\nclass NoTypes {\n    public function\
  \ __call($name, $args) {\n        return \"Attempt made to call '$name' \"\n   \
  \         . \"with these arguments: '\"\n            . implode(',', $args) . \"\
  '\\n\";\n    }\n}\n$no = new NoTypes();\necho $no->doesNotExist('A','B','C');\n\
  ```\n\n- 2. 以下示例（与前一个示例在同一文件中）是 MixedTypes 类，该类定义了 __invoke()，但使用的是 array 数据类型而不是\
  \ mixed：\n\n```\nclass MixedTypes {\n    public function __invoke(array $args) :\
  \ string {\n        return \"Arguments: \"\n            . implode(',', $args) .\
  \ \"\\n\";\n    }\n}\n$mixed= new MixedTypes();\necho $mixed(['A','B','C']);\n```\n\
  \n以下是前面步骤中所示代码示例的 PHP 7 输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch09 ]#\nphp php8_bc_break_magic.php\n\

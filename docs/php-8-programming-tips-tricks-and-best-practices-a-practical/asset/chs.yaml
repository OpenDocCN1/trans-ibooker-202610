  \ C 源代码 docblocks 中查找 @deprecation 注释：https://github.com/php/php-src/blob/master/ext/pgsql/pgsql.stub.php。这里有一个示例：\n\
  \n```\n/**\n * @alias pg_last_error\n * @deprecated\n */\nfunction pg_errormessage(\n\
  \    ?PgSql\\Connection $connection = null): string {}\n```\n\n在本节的最后一部分，我们总结了 PHP\
  \ 8 扩展中的已弃用功能。\n\n\n\n## PHP 8 扩展中的已弃用功能\n\n最后，为了让您更容易识别 PHP 8 扩展中的已弃用功能，我们提供了一个汇总。下表汇总了\

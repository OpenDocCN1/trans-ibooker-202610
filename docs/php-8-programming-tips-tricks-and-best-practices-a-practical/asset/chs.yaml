  \n下一章将向你介绍可以进一步提高性能的新颖且令人兴奋的 PHP 编程趋势。\n\n## 12 使用异步编程创建 PHP 8 应用程序\n\n近年来，一项令人兴奋的新技术席卷了\
  \ **PHP: Hypertext Preprocessor** (**PHP**) 社区：**异步编程**，也称为 **PHP async**。异步编程模型解决了使用传统同步编程模式编写的任何应用程序代码中存在的\n\
  \n## 理解 PHP 异步编程模型\n\n在深入了解如何使用异步库开发 PHP 应用的细节之前，重要的是退一步来看一下 PHP **异步编程模型**。理解它与传统的\
  \ **同步编程模型** 之间的差异，将为你在开发 PHP 应用时利用高性能打开一扇新世界的大门。让我们先来看一下同步编程模型，然后再深入探讨异步。\n\n##\
  \ 开发同步编程代码\n\n在传统的 PHP 编程中，代码以线性方式执行。一旦代码被编译成机器码，CPU 就会以顺序的方式一行接一行地执行代码，直到代码结束。这对于\
  \ PHP *过程式编程* 来说是完全正确的。令人惊讶的是，这对于 **面向对象编程 (OOP)** 也同样正确！无论你是否在代码中使用对象，OOP 代码都会被编译成字节码然后再编译成机器码，并以与过程式代码完全相同的方式以同步方式处理。\n\
  \n使用 OPcache 和 **即时编译 (JIT)** 编译器不会影响代码是否以同步方式运行。OPcache 和 JIT 编译器带来的唯一好处是能够比以往更快地运行同步代码。\n\
  \n> **重要说明**\n> \n> 请不要认为使用同步编程模型编写代码有什么问题！这种方法不仅经过验证且可靠，而且相当成功。此外，同步代码还得到许多辅助工具的支持，例如\
  \ PHPUnit、Xdebug、众多框架等等。\n\n然而，同步编程模型存在一个主要缺点。使用这种模型，CPU 必须不断等待某些任务完成，程序才被允许继续进行。在很大程度上，这类任务包括访问外部资源，例如执行数据库查询、写入日志文件或发送电子邮件。这类任务被称为\
  \ **阻塞操作**（会阻塞进度的操作）。\n\n下图给出了一个应用程序流程的视觉表示，其中涉及写入日志文件和发送电子邮件通知的阻塞操作：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_474_0.png)\n\
  \n图 12.1 – 同步编程模型\n\n正如图 12.1 所示，当应用程序写入日志文件时，CPU 会暂停程序代码的执行，直到操作系统 (OS) 通知日志文件的写入操作已完成。稍后，代码可能会发送电子邮件通知。同样，CPU\
  \ 会暂停代码执行，直到电子邮件发送操作完成。\n\n虽然每个等待间隔本身可能微不足道，但当把所有此类阻塞操作的等待间隔加在一起时——尤其是涉及冗长循环时——性能就会开始下降。\n\
  \n一种解决方案是大量实施缓存解决方案。另一种解决方案，如你所猜测的那样，是使用异步编程模型编写应用程序。现在就让我们来看一下。\n\n## 理解异步编程模型\n\
  \n异步操作的想法已经存在相当一段时间了。一个极其著名的例子是 Apache Web Server，其具有多处理模块 (MPMs)。MaxRequestWorkers\
  \ 指令允许你指定 Web 服务器可以处理的并发请求数量（有关更多信息，请参阅 https://httpd.apache.org/docs/current/mod/mpm_common.html#maxrequestworkers）。\n\
  \n异步编程模型通常涉及设置管理节点，被称为 worker。这允许程序执行继续进行，而无需等待任何特定任务完成。性能提升可能非常显著，尤其是在发生大量阻塞操作（例如文件系统访问或数据库查询）时。\n\
  \n下图可视化了如何使用异步编程模型完成写入日志文件和发送电子邮件的任务：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_475_0.png)\n\
  \n图 12.2 – 异步编程模型\n\n总等待时间会按分配的 worker 数量减少一个因子。图 12.2 所示的程序流程涉及的等待时间只有图 12.1 所示的一半。随着分配处理阻塞操作的\
  \ worker 数量增加，整体性能会提高。\n\n**重要说明**\n异步编程模型*不应混淆*与 **并行编程**。在并行编程中，任务是真正同时执行的，通常分配给不同的\
  \ CPU 或 CPU 核心。另一方面，异步编程按顺序运行，但允许顺序代码在等待阻塞操作（例如文件系统请求或数据库查询）的结果时继续进行。\n\n现在你已经对\
  \ PHP 异步编程模型的工作原理有了一个概念，让我们来看一下协程支持。\n\n## 使用异步协程支持\n\n*协程* 与 **线程** 类似，但运行在用户空间而不是内核空间，因此不需要涉及操作系统。如果此支持可用，协程支持组件会检测阻塞操作（例如读取或写入文件），并有效地暂停该操作，直到收到结果。这可以释放\
  \ CPU 在阻塞进程返回结果之前继续处理其他任务。此过程在机器码级别运行，因此对我们来说是不可检测的，除了我们的代码运行得更快这一事实。\n\n理论上，使用提供\
  \ **协程支持** 的扩展或框架可能会提升性能，即使你的代码使用同步编程模型编写。请注意，并非所有 PHP 异步框架或扩展都提供此支持，这可能会影响你为未来开发选择框架或扩展的选择。\n\
  \n**Swoole 扩展**（https://www.swoole.co.uk/）提供协程支持。另一方面，ReactPHP（https://reactphp.org/）是其中最受欢迎的\
  \ PHP 异步框架之一，除非与 Swoole 扩展（接下来讨论）或 PHP fibers（在 *了解 PHP 8.1 fibers* 部分讨论）一起使用，否则不提供协程支持。然而，ReactPHP\
  \ 如此受欢迎的一个原因正是 Swoole 扩展并非必需。如果你在一个无法控制 PHP 安装的主机环境中操作，你仍然可以使用 ReactPHP 并实现显著的性能提升，而无需触及\
  \ PHP 安装。\n\n我们现在将注意力转向为异步模型编写代码。\n\n## 创建 PHP 异步应用程序\n\n现在到了困难的部分！不幸的是，使用同步编程模型编写的应用程序无法利用异步模型所提供的好处。即使你使用提供协程支持的框架和/或扩展，除非你重构代码以遵循异步编程模型，否则你无法实现最大性能提升。\n\
  \n大多数 PHP 异步框架和扩展为你分离任务提供了多种方式。以下是更常用的方法的简要总结。\n\n## 事件循环\n\n从某种意义上说，**事件循环** 是一段重复执行的代码块，会持续运行直到发生指定的事件。所有\
  \ PHP 异步扩展和框架都以一种或另一种形式提供此功能。以回调形式出现的监听器被添加到事件循环中。当事件被触发时，监听器的逻辑将被调用。\n\nSwoole\
  \ 事件循环利用了 Linux epoll_wait（https://linux.die.net/man/2/epoll_wait）功能。由于基于硬件的事件通过伪文件句柄报告给\
  \ Linux，Swoole 事件循环允许开发者不仅基于实际文件的属性，而且基于产生 **文件描述符 (FD)** 的任何硬件进程来决定事件循环的开始和停止。\n\
  \n\n\nReactPHP 框架提供相同的功能，但默认使用 PHP 的 `stream_select()` 函数，代替操作系统的 `epoll_wait` 功能。这使得\
  \ ReactPHP 事件循环 **应用程序编程接口 (API)** 在服务器之间具有可移植性，尽管反应时间会变慢。ReactPHP 还提供基于 `ext-event`、`ext-ev`、`ext-uv`\
  \ 或 `ext-libevent` PHP 扩展定义事件循环的能力。利用这些扩展使 ReactPHP 能够访问硬件，就像 Swoole 一样。\n\n## Promises\n\
  \n一个 **promise** 是允许你将任务的处理推迟到稍后的软件构造。该概念最初作为 **CommonJS** 项目 (`http://wiki.commonjs.org/wiki/Promises/A`)\
  \ 的一部分提出。它被设计为同步和异步编程世界之间的桥梁。\n\n在同步编程中，函数（或类方法）通常要么 *成功* 要么 *失败*。在 PHP 中，失败的处理方式是故意抛出的异常或致命错误。在异步模型中，*promise*\
  \ 的一部分识别出三种状态：**已兑现**、**已失败** 和 **未兑现**。因此，当创建 *promise* 实例时，你需要提供三个处理程序，根据它们所代表的状态采取行动。\n\
  \n在 ReactPHP 的情况下，当你创建 `React\\Promise\\Promise` 实例时，你将 **解析器** 作为第一个构造函数参数提供。解析器本身需要三个分别标记为\
  \ `$resolve`、`$reject` 和 `$notify` 的回调。这三个对应于 promise 的三种可能状态：已兑现、已失败或未兑现。\n\n##\
  \ Streams\n\n许多异步框架为 PHP **流** 提供包装器。PHP 流最常用于处理涉及文件系统的操作。文件访问是一个阻塞操作，会导致程序执行暂停，直到操作系统返回结果。\n\
  \n为了避免文件访问阻塞异步应用程序的进展，会使用 `streams` 组件。例如，ReactPHP 在 `React\\Stream` 命名空间下提供类，实现\
  \ `ReadableStreamInterface` 或 `WritableStreamInterface`。这些类充当普通 PHP 流函数的包装器，例如 `fopen()`、`fread()`\
  \ 和 `fwrite()`，以及 `file_get_contents()` 和 `file_put_contents()`。ReactPHP 类使用内存来避免阻塞并将实际的读写推迟到稍后，从而允许异步活动继续。\n\
  \n## Timers\n\n**计时器** 是可以在给定间隔后运行的独立任务。在这方面，计时器类似于 JavaScript 的 `setTimeout()`\
  \ 函数。使用计时器安排的任务可以设置为仅运行一次，或在指定间隔连续运行。\n\n大多数 PHP 异步框架或扩展中的计时器实现通常避免使用 PHP 的 `pcntl_alarm()`\
  \ 函数。后者函数允许开发人员在经过一定秒数后向进程发送 `SIGALRM` 信号。然而，`pcntl_alarm()` 函数一次只允许设置一个，并且最低时间间隔以秒为单位。相比之下，PHP\
  \ 异步框架和扩展允许你精确设置多个计时器，精确到毫秒。PHP 异步计时器实现的另一个区别是它不依赖于 `declare(ticks=1)` 语句。\n\n计时器有许多潜在用途——例如，计时器可以检查包含\
  \ **完全自动化公共图灵测试来区分计算机和人类 (CAPTCHA)** 图像的目录并删除旧图像。另一个潜在用途是定期刷新缓存。\n\n## Channels\n\
  \n**通道** 是在并发进程之间通信的一种方式。通道的当前实现基于 1978 年由查尔斯·安东尼·霍尔爵士提出的代数模型。他的提案在多年中得到完善，并演变为他在\
  \ 1985 年出版的书籍 *通信顺序进程* 中描述的模型。通道和 **通信顺序进程 (CSP)** 模型是许多当前流行的语言（如 **Go.**）的特性。\n\
  \n与其它更复杂的方法相比，使用通道时 CSP 进程是匿名的，而通道是明确命名的。通道方法的另一个方面是，发送者在接收者准备好接收之前无法发送。这种简单原则减轻了实现大量共享锁定逻辑的需要。例如，在\
  \ Swoole 扩展中，通道用于实现连接池或作为调度并发任务的一种方式。\n\n现在你对 PHP 异步理论有了基本了解，是时候将理论付诸实践了。我们首先研究如何使用\
  \ Swoole 扩展。\n\n## Using the Swoole extension\n\nPHP **Swoole 扩展** 最早于 2013 年 12\
  \ 月在 PHP 扩展 C 库网站 (`https://pecl.php.net/`) 上提供。自那时起，它获得了相当大的关注。随着 PHP 8 中 JIT 编译器的引入，Swoole\
  \ 扩展重新引起了相当大的兴趣，因为它快速稳定，并且有能力使 PHP 应用程序运行得更快。总下载量接近 600 万，平均每月约 50,000 次。\n\n在本节中，你将了解该扩展、如何安装以及如何使用它。让我们首先对其进行概述。\n\
  \n## Examining the Swoole extension\n\n由于该扩展是用 C 语言编写的，一旦编译、安装并启用，就会向当前 PHP 安装添加一组函数和类。然而，该扩展利用了一些仅在源自\
  \ UNIX 的操作系统中可用的低级功能。这意味着，如果你在 Windows 服务器上运行，唯一能让使用 Swoole 扩展的 PHP 异步应用程序运行的方法是安装\
  \ **Windows Services for Linux (WSL)** 或在 Windows 服务器上设置应用程序在 Docker 容器中运行。\n\n\
  > **提示**\n> 如果你想在 Windows 服务器上尝试 PHP 异步，请考虑使用 ReactPHP（在 *使用 ReactPHP* 部分讨论），它不需要\
  \ Swoole 扩展所需的 OS 依赖项。\n\nPHP 异步的一个巨大优势是初始代码块会立即加载并保留在内存中，直到异步服务器实例停止。使用 Swoole\
  \ 扩展时也是如此。在你的代码中，你创建一个异步服务器实例，有效地将 PHP 转变为在指定端口监听的持续运行的守护进程。然而，这也是一个缺点，因为如果你对程序代码进行更改，异步服务器实例在重新加载之前不会识别这些更改。\n\
  \nSwoole 扩展的优秀特性之一是其 **协程支持**。从实际意义上讲，这意味着我们不必对使用同步编程模型编写的应用程序进行大手术。Swoole 会自动挑选出文件系统访问和数据库查询等阻塞操作，并允许这些操作被挂起，同时应用程序的其余部分继续进行。由于这种支持，你通常只需使用\
  \ Swoole 运行同步应用程序，即可获得即时的性能提升。\n\nSwoole 扩展的另一个非常棒的特性是 `Swoole\\Table`。此功能让你完全在内存中创建等同于数据库表的结构，可在多个进程之间共享。这种构造有许多可能的用途，其潜在的性能提升令人震惊。\n\
  \nSwoole 扩展具有监听 **用户数据报协议 (UDP)** 传输而非 **传输控制协议 (TCP)** 的能力。这是一个极其有趣的可能性，因为 UDP\
  \ 比 TCP 快得多。Swoole 还包括精确到毫秒的计时器实现，以及 MySQL、PostgreSQL、Redis 和 cURL 的异步客户端。Swoole\
  \ 扩展还让你能够使用 **Golang** 风格的通道设置 **进程间通信 (IPC)**。现在让我们看看如何安装 Swoole。\n\n## Installing\
  \ the Swoole extension\n\nSwoole 扩展可以使用与安装任何用 C 语言编写的 PHP 扩展相同的技术进行安装。一种方法是直接使用操作系统的包管理器。示例包括\
  \ Debian 或 Ubuntu Linux 的 `apt`（或其不太友好的表亲 `apt-get`），以及 Red Hat、CentOS 或 Fedora\
  \ 的 `yum` 或 `dnf`。使用操作系统包管理器时，Swoole 扩展以预编译二进制文件的形式提供。\n\n然而，推荐的方法是使用 `pecl` 命令。如果你的安装中没有此命令，可以以\
  \ root 用户登录后按如下方式在 Ubuntu 或 Debian 操作系统上安装 `pecl` 命令：`apt install php-pear`。对于 Red\
  \ Hat、CentOS 或 Fedora 安装，以下方法有效：`yum install php-pear`。\n\n使用 `pecl` 安装 Swoole 扩展时，你可以指定多个选项。这些选项总结如下：\n\
  \n\n| 选项 | 描述 |\n|---|---|\n| --enable-openssl | 将此设置为允许 Swoole 使用 OpenSSL。存在对操作系统库\
  \ `libssl.so` 的硬依赖。 |\n| --with-openssl-dir | 这告诉 Swoole 在何处查找 OpenSSL 库。本书中使用的\
  \ Docker 容器的一个示例为 `--with-openssl-dir=/usr/include/openssl`。 |\n| --enable-http2\
  \ | 这在你直接从命令行使用 Swoole 时尤其重要。此选项允许 Swoole 使用其内置库 `nghttp2` 处理 HTTP2 请求。 |\n| --enable-swoole-json\
  \ | 使 Swoole JSON 函数可用。PHP `ext/json` 也必须存在，然而这已是默认扩展。 |\n| --enable-swoole-curl\
  \ | 提供对 cURL 的原生支持。为使此功能正常工作，你还必须在操作系统上安装 `libcurl4` OpenSSL 开发库。 |\n| --enable-mysqlnd\
  \ | 此选项为 PHP `mysqlnd`（MySQL Native Driver）模块提供支持。推荐的选项是改用 PDO MySQL，在这种情况下你无需启用\
  \ `mysqlnd` 支持。 |\n| --enable-sockets | 如果你依赖 PHP Sockets 扩展，请使用此选项。启用后，由 Sockets\
  \ 扩展创建的连接可以由 `Swoole\\Event::add()` 处理。然而最佳实践是改用 `Coroutine\\Socket`。 |\n| --enable-debug\
  \ | 如果已安装 `gdb`（GNU 调试器），请启用此选项以进行 Swoole 调试。 |\n| --enable-debug-log | 仅用于开发环境，启用此选项以访问\
  \ Swoole 调试日志。 |\n| --enable-trace-log | 启用此选项可在调试日志中添加内核级跟踪。 |\n\n表 12.1 – Swoole\
  \ 扩展 pecl 安装选项\n\n有关这些选项的更多信息以及安装过程的概述，请查看此处：\n\n```\nhttps://www.swoole.co.uk/docs/get-started/installation\n\
  ```\n\n让我们现在来看一个示例安装，其中包含对 sockets、JavaScript Object Notation（JSON）和 cURL 的 Swoole\
  \ 支持，如下所示：\n\n- 1. 我们需要做的第一件事是更新 pecl channel。这是一个 PHP 扩展源代码存储库和功能的列表，很像 apt 或 yum\
  \ 包管理器中使用的 sources 列表。以下是执行此操作的的代码：\n```\npecl channel-update pecl.php.net\n```\n\
  - 2. 接下来，我们指定安装命令并使用 -D 标志添加选项，如下所示：\n```\npecl install -D \\\n    'enable-sockets=\"\
  yes\" \\\n    enable-openssl=\"no\" \\\n    enable-http2=\"no\" \\\n    enable-mysqlnd=\"\
  no\" \\\nenable-swoole-json=\"yes\" \\\n enable-swoole-curl=\"yes\" \\\n swoole\n\
  ```\n3. 这启动了扩展安装过程。你现在会看到各种 C 语言代码文件和头文件被下载，之后你的本地 C 编译器将被用来编译扩展。以下是编译过程的部分视图：\n\
  ```\nroot@php8_tips_php8 [/ ]# pecl install swoole\ndownloading swoole-4.6.7.tgz\
  \ ...\nStarting to download swoole-4.6.7.tgz (1,649,407 bytes)\n............................................................\n\
  ............................................................\n............................................................\n\
  ............................................................\n...............................................done:\
  \ 1,649,407 bytes\n364 source files, building\nrunning: phpize\nConfiguring for:\n\
  PHP Api Version:          20200930\nZend Module Api No:       20200930\nZend Extension\
  \ Api No:    420200930\nbuilding in /tmp/pear/temp/pear-build-defaultuserQakGt8/swoole-4.6.7\n\
  running: /tmp/pear/temp/swoole/configure --with-php-config=/usr/bin/php-config --enable-sockets=no\
  \ --enable-openssl=no --enable-http2=no --enable-mysqlnd=yes --enable-swoole-json=yes\
  \ --enable-swoole-curl=yes\n...\nBuild process completed successfully\nInstalling\
  \ '/usr/include/php/ext/swoole/config.h'\nInstalling '/usr/lib/php/extensions/no-debug-non-zts-20200930/swoole.so'\n\
  install ok: channel://pecl.php.net/swoole-4.6.7\nconfiguration option \"php_ini\"\
  \ is not set to php.ini location\nYou should add \"extension=swoole.so\" to php.ini\n\
  ```\n4. 如果未找到 C 编译器，你将收到警告。此外，你可能需要为你的操作系统安装 PHP 开发库。如果是这种情况，警告消息会为你提供进一步的指导。\n\n\
  5. 完成后，你需要启用扩展。这是通过在 `php.ini` 文件中添加 `extension=swoole` 来实现的。如果不确定其位置，请使用 `php -i`\
  \ 命令并查找 `php.ini` 文件的位置。以下是你可以从命令行发出以添加此指令的命令：\n```\necho \"extension=swoole\" >>/etc/php.ini\n\
  ```\n6. 然后你可以使用以下命令确认 Swoole 扩展的可用性：\n```\nphp --ri swoole\n```\n这完成了 Swoole 扩展的安装。如果你正在自定义编译\
  \ PHP，也可以在编译前运行 `configure` 时添加 `--enable-swoole` 选项。这会导致 Swoole 扩展与你的核心 PHP 安装一起编译并启用（并且允许你绕过刚刚概述的安装步骤）。我们现在将查看文档中提供的简短\
  \ *Hello World* 示例以测试安装。\n\n## 测试安装\n\nSwoole 文档提供了简单的示例，你可以用它快速测试安装是否成功。示例代码显示在\
  \ Swoole 文档主页面（`https://www.swoole.co.uk/docs/`）。出于版权原因，我们在此不予复现。以下是运行 *Hello World*\
  \ 测试的步骤：\n\n- 1. 首先，我们将 *Hello World* 示例从 https://www.swoole.co.uk/docs/ 复制到 `/path/to/repo/ch12/php8_swoole_hello_world.php`\
  \ 文件。\n\n接下来，我们修改了演示程序并将 `$server = new Swoole\\HTTP\\Server(\"127.0.0.1\", 9501);`\
  \ 改为 `$server = new Swoole\\HTTP\\Server(\"0.0.0.0\", 9501);`。\n\n此更改允许 Swoole 服务器在端口\
  \ 9501 上监听任何 **Internet Protocol（IP）** 地址。\n\n2. 然后我们修改了 /repo/ch12/docker-compose.yml\
  \ 文件以使端口 9501 在 Docker 容器外部可用，如下所示：\n```\nversion: \"3\"\nservices:\n  ...\n  php8-tips-php8:\n\
  \    ...\n    ports:\n      - 8888:80\n      - 9501:9501\n    ...\n```\n3. 为了使此更改生效，我们必须将服务停止并重新启动。从本地计算机上的命令提示符/终端窗口，使用这两个命令：\n\
  ```\n/path/to/repo/init.sh down\n/path/to/repo/init.sh up\n```\n4. 请注意，如果你正在运行 Windows，请移除\
  \ .sh。\n\n5. 然后我们进入 PHP 8 Docker 容器并运行 Hello World 程序，如下所示：\n```\n$ docker exec\
  \ -it php8_tips_php8 /bin/bash\n#### cd /repo/ch12\n#### php php8_swoole_hello_world.php\n\
  ```\n6. 最后，在 Docker 容器外部，我们打开浏览器访问此 IP 地址和端口：http://172.16.0.88:9501。\n\n以下屏幕截图显示了\
  \ Swoole *Hello World* 程序的结果：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_485_0.png)\n\
  \n图 12.3 – Swoole 演示 Hello World 程序输出\n\n在详细了解如何使用 Swoole 扩展来提高应用程序性能之前，我们需要检查一个是\
  \ PHP 异步模型主要候选的示例应用程序。\n\n## 检查一个示例 I/O 密集型应用程序\n\n为了说明目的，我们创建了一个作为 **REpresentational\
  \ State Transfer（REST）** API 编写的示例应用程序，设计用于在 PHP 8 中运行。示例应用程序提供了一个聊天或即时消息 API，具有以下简单功能：\n\
  \n- 使用 **HyperText Transfer Protocol（HTTP）** `POST` 方法向特定用户或所有用户发布消息。成功发布后，API 返回刚刚发布的消息。\n\
  - 带有 `from=username` 参数的 HTTP `GET` 方法返回与该用户名有关的全部消息以及发给所有用户的消息。如果设置了 `all=1` 参数，则返回所有用户名的列表。\n\
  - HTTP `DELETE` 方法从 `messages` 表中删除所有消息。\n\n本节仅显示应用程序代码的一部分。如果你对整个 `Chat` 应用程序感兴趣，源代码位于\
  \ `/path/to/repo/src/Chat` 下。主要的 API 端点在此提供：`http://172.16.0.81/ch12/php8_chat_ajax.php`。\n\
  \n\n\n以下示例在 PHP 8.1 Docker 容器中执行。请确保按如下方式停止现有容器，从本地计算机上的 Windows 计算机上的命令提示符：C:\\\
  path\\to\\repo\\init down。对于 Linux 或 Mac，从终端窗口：/path/to/repo/init.sh down。从 Windows\
  \ 计算机启动 PHP 8.1 容器：C:\\path\\to\\repo\\ch12\\init up。从 Linux 或 Mac 终端窗口：/path/to/repo/ch12/init.sh\
  \ up。\n\n以下示例在 PHP 8.1 Docker 容器中执行。请确保按如下方式停止现有容器，从本地计算机上的 Windows 计算机上的命令提示符：C:\\\
  path\\to\\repo\\init down\n\n对于 Linux 或 Mac，从终端窗口：\n\n```\n/path/to/repo/init.sh\
  \ down\n```\n\n从 Windows 计算机启动 PHP 8.1 容器：\n\n```\nC:\\path\\to\\repo\\ch12\\init\
  \ up\n```\n\n从 Linux 或 Mac 终端窗口：\n\n```\n/path/to/repo/ch12/init.sh up\n```\n\n\
  我们现在来看核心 API 程序本身的源代码，如下所示：\n\n- 1. 首先，我们定义一个 Chat\\Message\\Pipe 类，识别我们需要使用的所有外部类，如下所示：\n\
  \n```php\n// /repo/src/Chat/Message/Api.php;\nnamespace Chat\\Message;\nuse Chat\\\
  Handler\\ {GetHandler, PostHandler,\n    NextHandler,GetAllNamesHandler,DeleteHandler};\n\
  use Chat\\Middleware\\ {Access,Validate,ValidatePost};\nuse Chat\\Message\\Render;\n\
  use Psr\\Http\\Message\\ServerRequestInterface;\nclass Pipe {\n```\n```\n\n- 2.\
  \ 然后我们定义一个 exec() 静态方法，该方法调用一组符合 PHP 标准建议 15（PSR-15）的处理器。我们还通过调用 Chat\\Middleware\\\
  Access 中间件类的 process 方法来调用管道的第一阶段。NextHandler 的返回值被忽略：\n\n```php\npublic static\
  \ function exec(\n    ServerRequestInterface $request) {\n    $params = $request->getQueryParams();\n\
  ```\n```\n\n```\n$method = strtolower($request->getMethod());\n$dontcare = (new\
  \ Access())\n    ->process($request, new NextHandler());\n```\n\n3. 仍在同一方法中，我们使用\
  \ match() 构造来检查 HTTP GET、POST 和 DELETE 方法调用。如果方法是 POST，我们使用 Chat\\Middleware\\ValidatePost\
  \ 验证中间件类来验证 POST 参数。如果验证成功，则清理后的数据随后传递给 Chat\\Handler\\PostHandler。如果 HTTP 方法是 DELETE，我们直接调用\
  \ Chat\\Handler\\DeleteHandler：\n\n```\n$response = match ($method) {\n    'post'\
  \ => (new ValidatePost())\n        ->process($request, new PostHandler()),\n   \
  \ 'delete' => (new DeleteHandler())\n        ->handle($request),\n```\n\n4. 如果 HTTP\
  \ 方法是 GET，我们首先检查 all 参数是否已设置。如果设置，则调用 Chat\\Handler\\GetAllNamesHandler。否则，默认子句将数据通过\
  \ Chat\\Middleware\\Validate 传递。如果验证成功，则清理后的数据传递给 Chat\\Handler\\GetHandler：\n\n\
  ```\n'get' => (!empty($params['all'])\n    ? (new GetAllNamesHandler())->handle($request)\n\
  \    : (new Validate())->process($request,\n        new GetHandler())),\n    default\
  \ => (new Validate())\n        ->process($request, new GetHandler()});\n    return\
  \ Render::output($request, $response);\n}\n```\n\n5. 然后可以使用简短的常规程序调用核心 API 类，如下所示。在此调用程序中，我们使用\
  \ Laminas\\Diactoros\\ServerRequestFactory 构建一个符合 PSR-7 的 Psr\\Http\\Message\\ServerRequestInterface\
  \ 实例。然后请求通过 Pipe 类传递并生成响应：\n\n```\n// /repo/ch12/php8_chat_ajax.php\ninclude __DIR__\
  \ . '/vendor/autoload.php';\n```\n\n```php\nuse Laminas\\Diactoros\\ServerRequestFactory;\n\
  use Chat\\Message\\Pipe;\n$request = ServerRequestFactory::fromGlobals();\n$response\
  \ = Pipe::exec($request);\necho $response;\n```\n```\n\n我们还创建了一个测试程序（/repo/ch12/php8_chat_test.php—未显示），该程序以固定次数调用\
  \ API 端点（默认为 100）。每次迭代时，测试程序都会发布一条随机消息，该消息由随机收件人用户名、随机日期和 /repo/sample_data/geonames.db\
  \ 数据库中的顺序条目组成。测试程序接受两个参数。第一个参数是代表 API 的 URL。第二个（可选）参数代表迭代次数。\n\n以下是从 PHP 8.1 Docker\
  \ 容器中的命令外壳运行 /ch12/php8_chat_test.php 的示例结果：\n\n```\nroot@php8_tips_php8_1 [/repo/ch12\
  \ ]# php php8_chat_test.php \\\nhttp://localhost/ch12/php8_chat_ajax.php 10000 \
  \ bboyer :\nDubai:AE:2956587 : 2021-01-01 00:00:00\n1 fcompton :           Sharjah:AE:1324473\
  \ : 2022-02-02 01:01:01\n...\n998 hrivas : Caloocan City:PH:1500000 : 2023-03-19\
  \ 09:54:54\n999 lpena :             Budta:PH:1273715 : 2021-04-20 10:55:55\nFrom\
  \ User: dwallace\nElapsed Time: 3.3177478313446\n```\n```\n\n从输出中，注意经过的时间。在下一节中，使用\
  \ Swoole，我们可以将此时间减半！在使用 Swoole 之前，公平起见，我们应先加入 JIT 编译器。我们使用以下命令启用 JIT：\n\n```bash\n\
  #### php /repo/ch10/php8_jit_reset.php on\n```\n```\n\n在 PHP 8.0.0 中，您可能会遇到一些错误，甚至可能出现段错误。但是在\
  \ PHP 8.1 中，启用 JIT 编译器后 API 应该按预期工作。然而，JIT 编译器不太可能提高性能，因为频繁的 API 调用会导致应用程序等待。任何具有频繁阻塞\
  \ I/O 操作的应用程序都是异步编程模型的绝佳候选者。在继续之前，我们需要使用与之前相同的实用程序程序关闭 JIT，如下所示：\n\n```bash\n####\
  \ php /repo/ch10/php8_jit_reset.php off\n```\n```\n\n让我们现在看看如何使用 Swoole 扩展来提高此 I/O\
  \ 密集型应用程序的性能。\n\n## 使用 Swoole 扩展提高应用程序性能\n\n由于 Swoole 提供了协程支持，我们只需要重写 /repo/ch12/php8_chat_ajax.php\
  \ 调用程序，将其变成一个在 9501 端口监听的 Swoole 服务器实例的 API，即可提高 Chat 应用程序的性能。以下是重写主 API 调用程序的步骤：\n\
  \n- 1. 首先，我们启用自动加载并识别所需的外部类：\n\n```\n// /repo/ch12/php8_chat_swoole.php\ninclude\
  \ __DIR__ . '/vendor/autoload.php';\nuse Chat\\Message\\Pipe;\nuse Chat\\Http\\\
  SwooleToPsr7;\nuse Swoole\\Http\\Server;\nuse Swoole\\Http\\Request;\nuse Swoole\\\
  Http\\Response;\n```\n\n- 2. 接下来，我们启动 PHP 会话并创建一个监听任何 IP 地址 9501 端口的 Swoole\\HTTP\\\
  Server 实例：\n\n```\nsession_start();\n$server = new Swoole\\HTTP\\Server('0.0.0.0',\
  \ 9501);\n```\n\n- 3. 然后我们调用 on() 方法并将其与 start 事件关联。在这种情况下，我们记录日志以标识 Swoole 服务器何时启动。其他服务器事件记录在此处：https://www.swoole.co.uk/docs/modules/swoole-http-server-doc：\n\
  \n```\n$server->on(\"start\", function (Server $server) {\n    error_log('Swoole\
  \ http server is started at '\n        . 'http://0.0.0.0:9501');\n});\n```\n\n-\
  \ 4. 最后，我们定义一个主服务器事件，$server->on('request', function () {}), 用于处理传入请求。以下是实现此目的的代码：\n\
  \n```php\n$server->on(\"request\", function (\n    Request $swoole_request, Response\
  \ $swoole_response) {\n    $request = SwooleToPsr7::\n        swooleRequestToServerRequest($swoole_request);\n\
  \    $swoole_response->header(\n        \"Content-Type\", \"text/plain\");\n   \
  \ $response = Pipe::exec($request);\n    $swoole_response->end($response);\n});\n\
  $server->start();\n```\n```\n\n不幸的是，传递给与 on() 方法关联的回调的 Swoole\\Http\\Request 实例不符合\
  \ PSR-7！因此，我们需要定义一个 Chat\\Http\\SwooleToPsr7 类和一个 swooleRequestToServerRequest()\
  \ 方法，该方法使用静态调用执行转换。然后我们在 Swoole\\Http\\Response 实例上设置标头并从管道返回一个值以完成电路。\n\n请务必注意，标准\
  \ PHP 超全局变量，例如 $_GET 和 $_POST，从正在运行的 Swoole 服务器实例中并不能按预期工作。入口点是您用来从命令行启动 Swoole\
  \ 服务器的初始程序。唯一的传入请求参数是实际的初始程序文件名。任何后续输入都必须通过传递给 on() 函数的 Swoole\\Http\\Request 实例捕获。\n\
  \n在 https://php.net/swoole 上找到的文档并未显示 Swoole\\HTTP\\Request 和 Swoole\\HTTP\\Response\
  \ 类的所有可用方法。但是，在 Swoole 网站本身，您可以找到相关文档，也在此列出：\n\n- https://www.swoole.co.uk/docs/modules/swoole-http-request\n\
  - https://www.swoole.co.uk/docs/modules/swoole-http-response\n\n还值得注意的是，Swoole\\\
  HTTP\\Request 对象属性大致对应于 PHP 超全局变量，如下所示：\n\n\n| Swoole\\HTTP\\Request 属性 | 等效 PHP\
  \ 超全局变量 |\n|---|---|\n| Request::header | $_SERVER['HTTP_*'] |\n| Request::server\
  \ | $_SERVER[*] |\n| Request::get | $_GET |\n| Request::post | $_POST |\n| Request::cookie\
  \ | $_COOKIE |\n| Request::files | $_FILES |\n\n表 12.2 – Swoole 请求映射到 PHP 超全局变量\n\
  \n另一个需要考虑的是，在 Swoole 协程中使用 Xdebug 可能导致段错误和其他问题，甚至包括核心转储。最佳实践是在使用 pecl 首次安装 Swoole\
  \ 时，使用 --enable-debug 标志启用 Swoole 调试。测试应用程序时，我们按如下步骤进行：\n\n- 1. 从进入 PHP 8.1 Docker\
  \ 容器的命令 shell，我们按如下方式运行 Chat API 的 Swoole 版本。立即显示的消息是 $server->on(\"start\", function()\
  \ {}) 的结果：\n```\n#### cd /repo/ch12\n#### php php8_chat_swoole.php\nSwoole http\
  \ server is started at http://0.0.0.0:9501\n```\n- 2. 然后我们在主机计算机上打开另一个终端窗口，并再次进入\
  \ PHP 8.1 Docker 容器的 shell。从那里，我们可以按如下方式运行 /repo/ch12/php8_chat_test.php 测试程序：\n\
  ```\n#### cd /repo/ch12\n#### php php8_chat_test.php http://localhost:9501 1000\n\
  ```\n- 3. 注意这两个附加参数。第一个参数告诉测试程序使用 Swoole 版本的 API，而不是使用 Apache Web 服务器的旧版本。最后一个参数告诉测试程序运行\
  \ 1,000 次迭代。\n\n现在让我们查看输出，如下所示：\n```\nroot@php8_tips_php8_1 [ /repo/ch12 ]# php\
  \ php8_chat_test.php \\\n    http://localhost:9501 1000\n0    coconnel :     Dubai:AE:2956587\
  \ :  2021-01-01 00:00:00\n1    htyler :     Sharjah:AE:1324473 :  2022-02-02 01:01:01\n\
  ...\n998  cvalenci : Caloocan City:PH:1500 :  2023-03-19 09:54:54\n999 smccormi\
  \ : Budta:PH:1273715 : 2021-04-20 10:55:55\nFrom User: ajenkins\nElapsed Time: 1.8595671653748\n\
  ```\n\n输出最显著的特征是经过的时间。如果回顾上一节，你会注意到，使用 Apache 运行的传统 PHP 应用程序 API 完成 1,000 次迭代大约需要\
  \ 3.35 秒，而在 Swoole 下运行的相同 API 大约在 1.86 秒内完成：几乎快了一半！\n\n请注意，这是在没有任何额外优化的情况下。Swoole\
  \ 还有许多其他功能，我们可以使用，包括定义内存表、在额外的 worker 线程上生成任务，以及使用事件循环来促进缓存，等等。正如你所见，Swoole 立即可提供性能提升，并且非常值得作为从现有应用程序中获得更多性能的可能方式进行调查。\n\
  \n现在你已经对 Swoole 如何用于提高应用程序性能有了一些概念，让我们看看其他潜在的 PHP 异步解决方案。\n\n## 使用异步模式的选定 PHP 框架\n\
  \n有许多其他 PHP 框架实现了异步编程模型。在本节中，我们介绍 ReactPHP，即最流行的 PHP 异步框架之一，以及 Amp，另一个流行的 PHP 异步框架。此外，我们还展示了选定的\
  \ PHP 框架如何以异步模式使用。\n\n需要注意的是，许多能够以异步模式运行的 PHP 框架都依赖于 Swoole 扩展。唯一没有此依赖的是下一节介绍的 ReactPHP。\n\
  \n### 使用 ReactPHP\n\nReactPHP (https://reactphp.org/) 是 Reactor 软件设计模式的实现之一，并受到了非阻塞异步\
  \ Node.js 框架 (https://nodejs.org/en/) 等的启发。\n\n尽管 ReactPHP 没有像 Swoole 扩展那样提供自动性能提升，但它具有一个很大的优势，即它不依赖于\
  \ UNIX 或 Linux 的特性，因此可以在 Windows 服务器上运行。ReactPHP 的另一个优势是，除了作为标准扩展已包含的那些之外，它没有特定的\
  \ PHP 扩展依赖。\n\n任何 ReactPHP 应用程序的核心都是 React\\EventLoop\\Loop 类。如名称所示，Loop 实例有效地作为无限循环启动。大多数\
  \ PHP 无限循环会对应用程序造成灾难！然而，在这种情况下，循环与服务器实例一起使用，后者会持续监听给定端口上的请求。\n\nReactPHP 的另一个关键组件是\
  \ React\\Socket\\Server。该类在给定端口上打开一个套接字，使 ReactPHP 应用程序能够直接监听 HTTP 请求，而无需涉及 Web\
  \ 服务器。\n\nReactPHP 的其他功能包括能够监听 UDP 请求、非阻塞缓存以及异步 promise 的实现。ReactPHP 还具有 Stream\
  \ 组件，允许你延迟文件系统的读写操作，从而大大提高性能，因为你的应用程序不再需要等待此类文件 I/O 请求完成。\n\n使用 ReactPHP 的最后一个优势是它完全符合\
  \ PSR-7（HTTP 消息传递）。我们现在将查看使用 ReactPHP 重写的 Chat API 示例程序。以下是重写程序的步骤：\n\n- 1. 从进入\
  \ Docker PHP 8 容器的命令提示符，使用 Composer，我们安装必要的 ReactPHP 组件：\n- 2. 然后我们重写 /repo/ch12/php8_chat_swoole.php\
  \ 并将其重命名为 /repo/ch12/php8_chat_react.php。我们需要更改的第一件事是 use 语句：\n```\ncd /repo/ch12\n\
  composer require --ignore-platform-reqs react/event-loop\ncomposer require --ignore-platform-reqs\
  \ react/http\ncomposer require --ignore-platform-reqs react/socket\n```\n// /repo/ch12/php8_chat_react.php\n\
  include __DIR__ . '/vendor/autoload.php';\nuse Chat\\Message\\Pipe;\nuse React\\\
  EventLoop\\Factory;\nuse React\\Http\\Server;\nuse React\\Http\\Message\\Response\
  \ as ReactResponse;\nuse Psr\\Http\\Message\\ServerRequestInterface;\n```\n- 3.\
  \ 然后我们启动一个会话并创建 React\\EventLoop\\Loop 实例，如下所示：\n```\nsession_start();\n$loop =\
  \ Factory::create();\n```\n- 4. 现在我们定义一个处理程序，它接受 PSR-7 ServerRequestInterface 实例作为参数并返回\
  \ React\\Http\\Message\\Response 实例：\n```\n$server = new Server($loop,\nfunction\
  \ (ServerRequestInterface $request) {\n    return new ReactResponse(200,\n     \
  \   ['Content-Type' => 'text/plain'],\n        Pipe::exec($request)\n    );\n});\n\
  ```\n- 5. 然后我们设置一个 React\\Socket\\Server 实例在端口 9501 上监听并执行循环，如下所示：\n```\n$socket\
  \ = new React\\Socket\\Server(9501, $loop);\n$server->listen($socket);\necho \"\
  Server running at http://localhost:9501\\n\";\n$loop->run();\n```\n\n然后我们打开另一个进入\
  \ PHP 8.1 容器的命令 shell 并按如下方式启动 ReactPHP 服务器：\n```\nroot@php8_tips_php8_1 [/repo/ch12\
  \ ]# php php8_chat_react.php\n```\n\n从进入 PHP 8.1 容器的另一个命令 shell，我们可以按如下方式运行测试程序：\n\
  ```\nroot@php8_tips_php8_1 [/repo/ch12 ]# php php8_chat_test.php \\\nhttp://localhost:9501\n\
  ```\n\n输出（未显示）与使用 Swoole 扩展时显示的输出相似。\n\n接下来，我们来看另一个流行的 PHP 异步框架：Amp。\n\n### 使用 Amp\
  \ 实现 PHP 异步\n\n**Amp 框架** (https://amphp.org/) 与 ReactPHP 类似，提供定时器、promise 和流的实现。Amp\
  \ 还提供协程支持以及异步迭代器组件。后者极具吸引力，因为迭代对大多数 PHP 应用程序至关重要。如果可以将迭代移动到异步处理模式中，尽管可能涉及大量重构，它可能会极大地提升应用程序的性能。另一个有趣的转折是\
  \ Amp 可以直接使用任何 ReactPHP 组件！\n\n要安装 Amp，请使用 Composer。各种 Amp 组件可在独立的存储库中使用，因此你不必安装整个框架——只需要你需要的。PHP\
  \ Amp 服务器的实际实现与为 ReactPHP 显示的示例类似。\n\n现在让我们看另一个可以在 PHP 异步模式下运行的框架：**Mezzio**，以前称为\
  \ **Zend Expressive**。\n\n### 使用 Swoole 的 Mezzio\n\n**Mezzio** 框架 (https://docs.mezzio.dev/)\
  \ 是 Matthew Weier O'Phinney (https://mwop.net/) 的创作成果，代表了较老框架 **Zend Framework**\
  \ 和后来的 **Zend Expressive** 的延续。Mezzio 属于相对较新的 **微框架** 类别。微框架不依赖于老化的 **模型-视图-控制器\
  \ (MVC)** 软件设计模式，主要面向 **RESTful API 开发**。从实际角度来看，微框架支持 PHP 中间件原则，并以更少的开销和相应的更高速度运行。\n\
  \n为了使用 Swoole 使用 Mezzio 应用程序，只需要以下三件事：\n\n- 1. 安装 Swoole 扩展（本章前面已描述）。\n- 2. 安装 mezzio-swoole\
  \ 组件，如下所示：\n- 3. 然后你需要使用 Swoole 服务器实例运行 Mezzio。这可以通过以下命令实现：\n```\ncomposer require\
  \ mezzio/mezzio-swoole\n```\n/path/to/project/vendor/bin/laminas mezzio:swoole:start\n\
  \n\n\n4. 在你的 Mezzio 应用的配置文件中，你需要添加以下键：\n\n```\nreturn [\n    'mezzio-swoole' =>\
  \ [\n        'swoole-http-server' => [\n            'host' => '0.0.0.0',    // all\
  \ IP addresses\n            'port' => 9501,\n        ],\n    ],\n];\n```\n\n为了获得进一步的性能提升，你当然还应该重写代码的适当部分以利用\
  \ PHP 异步功能。接下来，我们来看一个超越异步的 PHP 扩展。\n\n## 使用 parallel 扩展\n\nparallel 扩展 (https://www.php.net/parallel)\
  \ 是为 PHP 7.2 及以上版本引入的。其目的是在 PHP 异步的基础上更进一步，进入全面并行处理的世界。parallel 扩展提供了五个关键的低级类，可作为并行处理应用程序的基础。使用此扩展允许\
  \ PHP 开发者编写类似于 Go 语言的并行代码。我们先从 parallel\\Runtime 开始。\n\n### parallel\\Runtime 类\n\
  \n每个 parallel\\Runtime 实例都会生成一个新的 PHP 线程。然后你可以使用 parallel\\Runtime::run() 来调度任务。run()\
  \ 的第一个参数是 Closure（匿名函数）。可选的第二个参数是 $argv，表示在运行时传递给任务的输入参数。parallel\\Runtime::close()\
  \ 用于优雅地关闭线程。当出现错误条件时，可以使用 parallel\\Runtime::kill() 立即退出线程。\n\n### parallel\\Future\
  \ 类\n\nA `parallel\\Future` 实例作为 `parallel\\Runtime::run()` 的返回值创建。它与 PHP 异步 *promise*（本章前面描述过）非常相似。此类有三个方法，列于此处，执行以下操作：\n\
  \n- `parallel\\Future::value()`\n  返回任务的已兑现值\n- `parallel\\Future::cancel()`\n \
  \ 取消代表 promise *失败* 状态的任务\n- `parallel\\Future::cancelled() | done()`\n  如果任务仍未兑现，则返回任务状态\n\
  \n### parallel\\Channel 类\n\n`parallel\\Channel` 类允许开发者在任务之间共享信息。使用 `__construct()`\
  \ 方法或 `make()` 来创建通道。如果未向 `__construct()` 供应参数或未向 `make()` 供应第二个参数，则通道被视为无缓冲。如果向\
  \ `__construct()` 供应整数或作为 `make()` 的第二个参数供应，则该值表示通道的 **容量**。然后你可以使用 `parallel\\\
  Channel::send()` 和 `parallel\\Channel::recv()` 方法通过通道发送和接收数据。\n\n无缓冲通道会阻塞对 `send()`\
  \ 的调用，直到有接收者，反之亦然。另一方面，缓冲通道在达到容量之前不会阻塞。\n\n### parallel\\Events 类\n\n`parallel\\\
  Events` 类类似于本章第一部分描述的 *事件循环*。此类具有 `addChannel()` 和 `addFuture()` 方法来添加要监视的通道和/或\
  \ future 实例。`setBlocking()` 方法允许事件循环以阻塞或非阻塞模式监视事件。使用 `setTimeout()` 方法设置整体控制周期（以毫秒为单位），以允许循环继续的时间。最后，`poll()`\
  \ 方法使事件循环轮询下一个事件。\n\n### 安装 parallel 扩展\n\nparallel 扩展可以使用 pecl 命令或使用预编译的二进制文件安装，就像任何其他非标准的\
  \ PHP 扩展一样。然而，必须极其重要地指出，此扩展仅在 Zend Thread Safety（ZTS）PHP 安装上工作。因此，如果使用 Docker，你需要获取\
  \ PHP ZTS 镜像，或者，如果自定义编译 PHP，你需要使用 --enable-zts（Windows）或 --enable-maintainer-zts（非\
  \ Windows）配置实用程序标志。\n\n现在你已经对如何在异步模式下使用一些选定的 PHP 扩展和框架有了一些概念，我们将展望未来并讨论 PHP 8.1\
  \ fibers。\n\n## 了解 PHP 8.1 fibers\n\n一份请求评论（RFC）于 2021 年 3 月由 Aaron Piotrowski 和\
  \ Niklas Keller 发布，两者都是 PHP 核心团队开发者，概述了在 PHP 语言核心中包含 fibers 支持的理由。RFC 在当月末得到批准，现在已在即将发布的\
  \ PHP 8.1 版本中实现。\n\nfiber 实现是低级的，这意味着它主要设计为作为 PHP 异步框架（如 ReactPHP 或 Amp）或扩展（如 Swoole\
  \ 扩展）的一部分使用。因为从 PHP 8.1 及以后，这将成为语言的核心部分，开发者不必太担心加载了哪些扩展。此外，这极大地增强了 PHP 异步框架，因为它们现在在语言核心中具有低级支持，大大提高了性能。让我们现在来看\
  \ Fiber 类本身。\n\n### 发现 Fiber 类\n\nPHP 8.1 Fiber 类提供了一个简陋的实现，异步框架和扩展开发者可以在此基础上构建计时器、事件循环、promise\
  \ 和其他异步构件。\n\n以下是正式的类定义：\n\n```\nfinal class Fiber {\n    public function __construct(callable\
  \ $callback) {}\n    public function start(mixed ...$args): mixed {}\n    public\
  \ function resume(mixed $value = null): mixed {}\n    public function throw(Throwable\
  \ $exception): mixed {}\n    public function isStarted(): bool {}\n    public function\
  \ isSuspended(): bool {}\n    public function isRunning(): bool {}\n    public function\
  \ isTerminated(): bool {}\n    public function getReturn(): mixed {}\n    public\
  \ static function this(): ?self {}\n    public static function suspend(\n      \
  \  mixed $value = null): mixed {}\n}\n```\n\n以下是 Fiber 类方法的摘要：\n\n| Fiber 方法 | 描述\
  \ |\n|---|---|\n| Fiber::start() | 启动 fiber 执行。随后与 fiber 关联的回调可以随意挂起、取消和恢复。任何参数都传递给回调。通过进行静态调用\
  \ $fiber::suspend() 来挂起 fiber。通过让它使用 $fiber->throw() 抛出异常来取消 fiber。 |\n| Fiber::resume()\
  \ | 重新启动 fiber 执行。返回 Fiber::suspend() 提供的值。 |\n| Fiber::suspend() | 此方法通过在分配给 fiber\
  \ 的回调内部进行静态调用来制作。然后你可以使用 suspend() 或 throw() 恢复或取消 fiber。 |\n| Fiber::throw() |\
  \ 调用此方法时，提供 Throwable 的实例。然后 fiber 被取消。 |\n| Fiber::isStarted()\nFiber::isSuspended()\n\
  Fiber::isRunning()\nFiber::isTerminated() | 这四个方法返回布尔值，并用于显示 fiber 的状态。 |\n| Fiber::getReturn()\
  \ | 就像 PHP Generator 一样，你可以使用此方法获取回调的返回值（如果有）。 |\n| Fiber::this() | 返回当前运行的 fiber\
  \ 实例。 |\n\n表 12.3 – Fiber 类方法摘要\n\n如表 12.3 所示，在创建 Fiber 实例后，使用 start() 运行与 fiber\
  \ 关联的回调。之后，你可以自由地使用 throw() 挂起、恢复或导致 fiber 失败。你也可以让回调在其自己的 fiber 中运行，并使用 getReturn()\
  \ 检索返回的信息。你可能还注意到 is*() 方法可用于在任何给定时刻确定 fiber 的状态。\n\n> **提示**\n> \n> 有关 PHP 8.1\
  \ fibers 实现的更多信息，请查看以下 RFC：https://wiki.php.net/rfc/fibers。\n\n让我们现在来看一个说明 fibers\
  \ 用法的示例。\n\n### 使用 fibers\n\nPHP 8.1 fibers 构成了 PHP 异步应用程序的基础。虽然 fibers 的主要受众是框架和扩展开发者，但任何\
  \ PHP 开发者都可以从此类中受益。为了说明 PHP fibers 可以解决的问题，让我们来看一个简单的示例。\n\n### 定义一个执行阻塞操作的示例程序\n\
  \n在此示例中，使用同步编程模型编写，我们执行以下三个操作：\n\n- 执行 HTTP GET 请求。\n- 执行数据库查询。\n- 将信息写入访问日志。\n\n\
  已经具备一些异步编程知识，你会意识到这三个任务都代表 *阻塞* 操作。我们将采取以下步骤：\n\n- 1. 首先，我们定义一个要包含的 PHP 文件来定义回调：\n\
  \n```\n// /repo/ch12/php8_fibers_include.php\ndefine('WAR_AND_PEACE',\n    'https://www.gutenberg.org/files/2600/2600-0.txt');\n\
  define('DB_FILE', __DIR__\n    . '/../sample_data/geonames.db');\ndefine('ACCESS_LOG',\
  \ __DIR__ . '/access.log');\n$callbacks = [\n    'read_url' => function (string\
  \ $url) {\n        return file_get_contents($url); },\n    'db_query' => function\
  \ (string $iso2) {\n        $pdo = new PDO('sqlite:' . DB_FILE);\n        $sql =\
  \ 'SELECT * FROM geonames '\n            . 'WHERE country_code = ?'\n        $stmt\
  \ = $pdo->prepare($sql);\n        $stmt->execute([$iso2]);\n        return var_export(\n\
  \            $stmt->fetchAll(PDO::FETCH_ASSOC), TRUE);\n    },\n    'access_log'\
  \ => function (string $info) {\n        $info = date('Y-m-d H:i:s') . \": $info\\\
  n\";\n```\n\nreturn file_put_contents(\n    ACCESS_LOG, $info, FILE_APPEND);\n},\n\
  ];\nreturn $callbacks;\n\n2. 接下来，我们定义一个包含回调定义并按顺序执行它们的 PHP 程序。我们使用 PHP 8 的 match\
  \ {} 构造来为适当的回调分配不同的参数。最后，我们通过简单地返回一个字符串并运行 strlen() 来返回回调生成的字节数：\n\n```php\n// /repo/ch12/php8_fibers_blocked.php\n\
  $start = microtime(TRUE);\n$callbacks = include __DIR__ . '/php8_fibers_include.php';\n\
  foreach ($callbacks as $key => $exec) {\n    $info = match ($key) {\n        'read_url'\
  \ => WAR_AND_PEACE,\n        'db_query' => 'IN',\n        'access_log' => __FILE__,\n\
  \        default => ''\n    };\n    $result = $exec($info);\n    echo \"Executing\
  \ $key\" . strlen($result) . \"\\n\";\n}\necho \"Elapsed Time:\" . (microtime(TRUE)\
  \ - $start) . \"\\n\";\n```\n\n如果我们按原样运行该程序，结果可以预见地糟糕，正如这里所示：\n\n```\nroot@php8_tips_php8_1\
  \ [ /repo/ch12 ]#\nphp php8_fibers_blocked.php\nExecuting read_url:      3359408\n\
  Executing db_query:      23194\nExecuting access_log:      2\nElapsed Time:6.0914640426636\n\
  ```\n\n下载托尔斯泰《战争与和平》的统一资源定位符（URL）请求花费了最多的时间，并产生了超过 300 万的字节数。总的经过时间略高于 6 秒。\n\n\
  让我们现在看看调用程序如何使用纤程重写。\n\n## 使用纤程的示例程序\n\n从 PHP 8.1 Docker 容器中，我们可以定义一个使用纤程的调用程序。以下是执行此操作的步骤：\n\
  \n- 1. 首先，我们像之前一样包含回调，如下所示：\n- 2. 接下来，我们创建 Fiber 实例来包装每个回调。然后我们使用 start() 启动回调，提供适当的信息：\n\
  - 3. 然后我们设置一个循环并检查每个回调是否已完成。如果是，我们从 getReturn() 输出结果并取消设置纤程：\n\n```php\n// /repo/ch12/php8_fibers_unblocked.php\n\
  $start = microtime(TRUE);\n$callbacks = include __DIR__\n    . '/php8_fibers_include.php';\n\
  ```\n\n```php\n$fibers = [];\nforeach ($callbacks as $key => $exec) {\n    $info\
  \ = match ($key) {\n        'read_url' => WAR_AND_PEACE,\n        'db_query' =>\
  \ 'IN',\n        'access_log' => __FILE__,\n        default => ''\n    };\n    $fibers[$key]\
  \ = new Fiber($exec);\n    $fibers[$key]->start($info);\n}\n```\n\n```php\n$count\
  \ = count($fibers);\n$names = array_keys($fibers);\nwhile ($count) {\n    $count\
  \ = 0;\n    foreach ($names as $name) {\n```\n\n```php\nif ($fibers[$name]->isTerminated())\
  \ {\n    $result = $fibers[$name]->getReturn();\n    echo \"Executing $name: \\\
  t\"\n        . strlen($result) . \"\\n\";\n    unset($names[$name]);\n} else {\n\
  \    $count++;\n}\n}\n}\necho \"Elapsed Time:\" . (microtime(TRUE) - $start) . \"\
  \\n\";\n```\n\n请注意，此示例仅用于说明。更可能的是你会使用现有的框架，如 ReactPHP 或 Amp，两者都已重写以利用 PHP 8.1 纤程。还需要注意的是，即使多个纤程同时运行，你能达到的最短运行时间与最长运行任务所花费的时间成直接比例。现在让我们看看纤程对\
  \ ReactPHP 和 Swoole 的影响。\n\n## 检查纤程对 ReactPHP 和 Swoole 的影响\n\n为了说明这一点，你需要在 PHP 8.1\
  \ Docker 容器中打开两个独立的命令 shell。按照上一节给出的说明进行操作，但打开两个命令 shell 而不是一个。然后我们将使用 /repo/ch12/php8_chat_test.php\
  \ 程序来测试纤程的效果。让我们运行第一个测试，使用内置 PHP Web 服务器作为对照。\n\n## 使用内置 PHP Web 服务器进行测试\n\n在第一个测试中，我们使用内置\
  \ PHP Web 服务器和传统的 /repo/ch12/php8_chat_ajax.php 实现。以下是我们将采取的步骤：\n\n- 1. 在两个命令 shell\
  \ 中，都切换到 /repo/ch12 目录，如下所示：\n- 2. 在第一个命令 shell 中，使用此命令使用内置 PHP Web 服务器运行标准 HTTP\
  \ 服务器：\n\n```bash\n#### cd /repo/ch12\n```\n\n```bash\n#### php -S localhost:9501\
  \ php8_chat_ajax.php\n```\n\n3. 在第二个命令 shell 中，如图所示执行测试程序：\n\n```\nphp php8_chat_test.php\
  \ http://localhost:9501 1000 --no\n```\n\n生成的输出应如下所示：\n\n```\nroot@php8_tips_php8_1\
  \ [/repo/ch12 ]#\nphp php8_chat_test.php http://localhost:9501 1000 --no\nFrom User:\
  \ pduarte\nElapsed Time: 1.687940120697\n```\n\n正如你所见，使用同步编程编写的传统代码在 1,000 次迭代中约为\
  \ 1.7 秒。现在让我们看看使用 ReactPHP 运行相同测试的情况。\n\n## 使用 ReactPHP 进行测试\n\n在第二个测试中，我们使用我们的\
  \ /repo/ch12/php8_chat_react.php ReactPHP 实现。以下是我们将采取的步骤：\n\n- 1. 在第一个命令 shell 中，按\
  \ Ctrl + C 退出内置 PHP Web 服务器。\n- 2. 使用 exit 退出并重新进入第一个命令 shell，然后使用 init shell（Windows）或\
  \ ./init.sh shell（Linux 或 Mac）。\n- 3. 使用以下命令启动 ReactPHP 服务器：\n- 4. 在第二个命令 shell\
  \ 中，如下执行测试程序：\n\n```\n#### php php8_chat_react.php\n```\n\n```\nphp php8_chat_test.php\
  \ http://localhost:9501 1000 --no\n```\n\n生成的输出应如下所示：\n\n```\nroot@php8_tips_php8_1\
  \ [/repo/ch12 ]#\nphp php8_chat_test.php http://localhost:9501 1000 --no\nFrom User:\
  \ klang\nElapsed Time: 1.2330160140991\n```\n\n从输出中可以看出，ReactPHP 从纤程中获得了很大益处。总经过时间为令人印象深刻的\
  \ 1,000 次迭代的 1.2 秒！\n\n这结束了我们对 PHP 8.1 纤程的讨论。你现在对纤程是什么以及如何在程序代码中直接使用它们有了概念，以及它们如何使外部\
  \ PHP 异步框架受益。\n\n## 摘要\n\n在本章中，你学习了传统同步编程与异步编程之间的区别。涵盖了事件循环、计时器、Promise 和通道等关键术语。这些知识使你能够确定代码块是否使用异步编程模型编写，以及如何重写现有同步模型应用程序的部分内容以利用异步功能。\n\
  \n然后你学习了 Swoole 扩展及其如何应用于现有应用程序代码以实现性能改进。你还学习了许多其他以异步方式运行的框架和扩展。你回顾了具体的代码示例，现在在编写异步代码方面有了先发优势。\n\
  \n在最后一节中，你被介绍到 PHP 8.1 纤程。然后你回顾了一个代码示例，展示了如何使用 PHP 8.1 纤程创建协作多任务函数和类方法。你还看到了选定的\
  \ PHP 异步框架如何从 PHP 8.1 纤程支持中受益，提供更多性能改进。\n\n这是本书的最后一章。我们希望你喜欢回顾 PHP 8 中提供的众多新功能和优势。你现在对在面向对象和过程式代码中应避免的潜在陷阱以及\
  \ PHP 8 扩展的各种更改也有了更深入的理解。有了这些知识，你不仅现在处于编写更好代码的位置，而且还拥有一个坚实的行动计划，可最大限度地减少 PHP 8 迁移后应用程序代码失败的可能性。\n\

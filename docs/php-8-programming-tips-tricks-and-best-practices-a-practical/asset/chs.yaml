  ReflectionParameter::isArray()\nReflectionParameter::isCallable()\nReflectionParameter::isDisabled()\
  \ | ReflectionParameter::getType()\n(相同)\n(相同)\n无 |\n| LibXML | libxml_disable_entity_loader()\

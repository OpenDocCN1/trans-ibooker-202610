  \n本节包含以下章节：\n\n- *第 9 章，掌握 PHP 8 最佳实践*\n- *第 10 章，改进性能*\n- *第 11 章，将现有 PHP 应用迁移到\
  \ PHP 8*\n- *第 12 章，使用异步编程创建 PHP 8 应用程序*\n\n## 9 Mastering PHP 8 Best Practices\n\
  \n在本章中，您将了解当前在 PHP 8 中强制执行的最佳实践。我们将介绍几个重要的方法签名更改以及它们的新用法如何延续 PHP 的总体趋势，帮助您生成更好的代码。我们还将看看私有方法、接口、trait\
  \ 和匿名类用法的变化。最后，我们将讨论命名空间解析中的重要更改。\n\n掌握本章将介绍的最佳实践不仅会让您朝着编写更好的代码迈进，还会帮助您避免因未能掌握这些新实践而可能出现的代码中断。此外，本章中讨论的技术将帮助您编写比过去更高效的代码。\n\
  \n在本章中，我们将介绍以下主题：\n\n- 发现方法签名更改\n- 处理私有方法\n- 使用接口和 trait\n- 控制匿名类用法\n- 理解命名空间中的更改\n\
  \n## Technical requirements\n\n要检查和运行本章提供的代码示例，推荐的最低硬件配置如下：\n\n- 基于 X86_64 的台式电脑或笔记本电脑\n\
  - 1 GB 可用磁盘空间\n- 4 GB RAM\n- 500 Kbps 或更快的互联网连接\n\n此外，您需要安装以下软件：\n\n- Docker\n-\
  \ Docker Compose\n\n请参阅第 1 章《Introducing New PHP 8 OOP Features》的 Technical requirements\
  \ 部分，了解有关如何安装 Docker 和 Docker Compose 以及如何构建本书中用于演示代码的 Docker 容器的更多信息。在本书中，我们将您恢复示例代码的目录称为\
  \ /repo。\n\n本章的源代码位于此处：https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices。我们将首先检查重要的方法签名更改。\n\
  \n## Discovering method signature changes\n\n在 PHP 8 中引入了若干方法签名更改。如果您的代码扩展了本节中描述的任何类或实现了任何方法，了解这些签名更改非常重要。只要您了解这些更改，您的代码将正常运行，从而减少错误。\n\
  \n在 PHP 8 中引入的签名更改反映了更新后的最佳实践。因此，如果您编写使用正确方法签名的代码，您就是遵循这些最佳实践。我们将通过回顾 PHP 8 对魔术方法签名的更改开始讨论。\n\
  \n## Managing magic method signatures\n\n在 PHP 8 中，魔术方法的定义和使用已朝着标准化迈出了重要一步。这是通过引入以严格参数和返回数据类型形式存在的精确魔术方法签名来实现的。与\
  \ PHP 8 中看到的大多数改进一样，此更新是为了防止魔术方法的误用。总体结果是代码更好，错误更少。\n\n\n\n此增强功能的缺点是，如果你的代码提供了不正确的参数或返回值类型，则会抛出\
  \ Error。另一方面，如果你的代码确实提供了正确参数数据类型和返回值类型，或者你的代码根本不使用参数或返回值数据类型，则此增强功能不会产生任何不利影响。\n\
  \n以下代码块总结了 PHP 8 及以上版本中魔术方法的新的参数和返回值数据类型：\n\n```\n__call(string $name, array $arguments):\
  \ mixed;\n__callStatic(string $name, array $arguments): mixed;\n__clone(): void;\n\
  __debugInfo(): ?array;\n__get(string $name): mixed;\n__invoke(mixed $arguments):\
  \ mixed;\n__isset(string $name): bool;\n__serialize(): array;\n__set(string $name,\
  \ mixed $value): void;\n__set_state(array $properties): object;\n__sleep(): array;\n\
  __unserialize(array $data): void;\n__unset(string $name): void;\n__wakeup(): void;\n\
  ```\n\n现在，让我们来看三个简单的示例，说明魔术方法签名更改的影响：\n\n- 1. 第一个示例涉及 NoTypes 类，该类定义了 __call()，但未定义任何数据类型：\n\
  \n```\n// /repo/ch09/php8_bc_break_magic.php\nclass NoTypes {\n    public function\
  \ __call($name, $args) {\n        return \"Attempt made to call '$name' \"\n   \
  \         . \"with these arguments: '\"\n            . implode(',', $args) . \"\
  '\\n\";\n    }\n}\n$no = new NoTypes();\necho $no->doesNotExist('A','B','C');\n\
  ```\n\n- 2. 以下示例（与前一个示例在同一文件中）是 MixedTypes 类，该类定义了 __invoke()，但使用的是 array 数据类型而不是\
  \ mixed：\n\n```\nclass MixedTypes {\n    public function __invoke(array $args) :\
  \ string {\n        return \"Arguments: \"\n            . implode(',', $args) .\
  \ \"\\n\";\n    }\n}\n$mixed= new MixedTypes();\necho $mixed(['A','B','C']);\n```\n\
  \n以下是前面步骤中所示代码示例的 PHP 7 输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch09 ]#\nphp php8_bc_break_magic.php\n\
  Attempt made to call 'doesNotExist' with these arguments:\n'A,B,C'\nArguments: 'A,B,C'\n\
  ```\n\n而在 PHP 8 下运行相同的代码示例：\n\n```\nroot@php8_tips_php8 [ /repo/ch09 ]#\nphp php8_bc_break_magic.php\n\
  Attempt made to call 'doesNotExist' with these arguments:\n'A,B,C'\nArguments: 'A,B,C'\n\
  ```\n\n正如你所见，两个输出集是相同的。所示的第一个类 NoTypes 可以工作，因为没有定义数据类型提示。有趣的是，MixedTypes 类在 PHP\
  \ 8 及以下版本中都能工作，因为新的 mixed 数据类型实际上是所有类型的联合。因此，你可以安全地使用任何特定数据类型代替 mixed。\n\n- 3. 在我们的最终示例中，我们将定义\
  \ WrongType 类。在此类中，我们将使用与 PHP 8 要求不匹配的返回数据类型定义一个名为 __isset() 的魔术方法。在这里，我们使用的是 string，而在\
  \ PHP 8 中，其返回类型需要是 bool：\n\n```\n// /repo/ch09/php8_bc_break_magic_wrong.php\nclass\
  \ WrongType {\n    public function __isset($var) : string {\n        return (isset($this->$var))\
  \ ? 'Y' : '';\n    }\n}\n$wrong = new WrongType();\necho (isset($wrong->nothing))\
  \ ? 'Set' : 'Not Set';\n```\n\n此示例在 PHP 7 中有效，因为它依赖于如果变量未设置则返回空字符串的事实，然后将其插值为空 FALSE\
  \ 布尔值。以下是 PHP 7 输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch09 ]#\nphp php8_bc_break_magic_wrong.php\n\
  Not Set\n```\n\n然而在 PHP 8 中，由于魔术方法签名现在已标准化，示例失败，如下所示：\n\n```\nroot@php8_tips_php8\
  \ [ /repo/ch09 ]#\nphp php8_bc_break_magic_wrong.php\nPHP Fatal error: WrongType::__isset():\
  \ Return type must be bool when declared in /repo/ch09/php8_bc_break_magic_wrong.php\
  \ on line 6\n```\n\n正如你所见，PHP 8 严格执行其魔术方法签名。\n\n> 提示\n> 最佳实践：修改使用魔术方法的任何代码，以遵循新的严格方法签名。有关严格魔术方法签名的更多信息，请访问\
  \ https://wiki.php.net/rfc/magic-methods-signature.\n\n你现在已经有了需要查找的内容以及如何纠正涉及魔术方法的潜在代码破坏的思路。现在，让我们来看\
  \ Reflection 扩展方法签名更改。\n\n## 检查 Reflection 方法签名更改\n\n向后兼容的代码破坏可能会发生，如果你的应用程序使用 invoke()\
  \ 或 newInstance() Reflection 扩展方法。在 PHP 7 及以下版本中，接下来的三个方法都接受无限数量的参数。然而，在方法签名中，只列出了一个参数，如下所示：\n\
  \n- `ReflectionClass::newInstance($args)`\n- `ReflectionFunction::invoke($args)`\n\
  - `ReflectionMethod::invoke($args)`\n\n在 PHP 8 中，方法签名准确地反映了实际情况，即 $args 前面加上了可变参数运算符。以下是新的方法签名：\n\
  \n- `ReflectionClass::newInstance(...$args)`\n- `ReflectionFunction::invoke(...$args)`\n\

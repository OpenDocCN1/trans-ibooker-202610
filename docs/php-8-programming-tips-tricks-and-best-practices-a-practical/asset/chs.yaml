  > \n> 有关 Rust 编程语言的信息可在以下书籍中找到：\n> https://www.packtpub.com/product/mastering-rust-second-edition/9781789346572\n\
  \n## Incorporating match expressions into your program code\n\n在 PHP 8 中引入的众多极其有用的功能中，**match\
  \ 表达式** 绝对脱颖而出。match 表达式是一种更准确的简写语法，有可能取代直接来自 C 语言的老旧 switch 语句。在本节中，你将学习如何通过用 match\
  \ 表达式替换 switch 语句来生成更简洁、更准确的程序代码。\n\n## Match expression general syntax\n\nmatch\
  \ 表达式语法与数组类似，其中键是要匹配的项，值是表达式。以下是 match 的通用语法：\n\n```\n$result = match(<EXPRESSION>)\
  \ {\n    <ITEM> => <EXPRESSION>,\n    [<ITEM> => <EXPRESSION>,]\n    default =>\
  \ <DEFAULT EXPRESSION>\n};\n```\n\n表达式必须是有效的 PHP 表达式。表达式的示例可能包括以下任何一种：\n\n- 一个特定值（例如，\"\
  some text\"）\n- 一个操作（例如，$a + $b）\n- 一个匿名函数或类\n\n唯一的限制是表达式必须在一行代码中定义。主要区别 match 与\
  \ switch 总结如下：\n\n| Switch | Match |\n|---|---|\n| 松散类型比较（例如 $a == $b） | 严格类型比较（例如\
  \ $a === $b） |\n| 不返回值 | 返回值 |\n| 需要 break | 不需要 break |\n| 每个 case 可有多条命令 | 每个\
  \ match 仅一条命令 |\n\n表 1.1 – match 与 switch 之间的差异\n\n\n\n除已提及的差异外，match 和 switch 都允许\
  \ case 聚合，并且都提供对默认情况的支持。\n\n## switch 和 match 示例\n\n这里有一个简单的示例，使用 switch 渲染货币符号：\n\
  \n```php\n// /repo/ch01/php7_switch.php\nfunction get_symbol($iso) {\n    switch\
  \ ($iso) {\n        case 'CNY' :\n            $sym = '¥';\n            break;\n\
  \        case 'EUR' :\n            $sym = '€';\n            break;\n        case\
  \ 'EGP' :\n            case 'GBP' :\n            $sym = '£';\n            break;\n\
  \        case 'THB' :\n            $sym = '฿';\n            break;\n        default\
  \ :\n            $sym = '$';\n    }\n    return $sym;\n}\n$test = ['CNY', 'EGP',\
  \ 'EUR', 'GBP', 'THB', 'MXD'];\nforeach ($test as $iso)\n    echo 'The currency\
  \ symbol for ' . $iso\n        . ' is ' . get_symbol($iso) . \"\\n\";\n```\n\n当执行此代码时，你会看到\
  \ $test 数组中每个 **国际标准化组织 (ISO)** 货币代码的货币符号。使用以下代码，在 PHP 8 中也可以获得与前述代码片段所示相同的结果：\n\
  \n```php\n// /repo/ch01/php8_switch.php\nfunction get_symbol($iso) {\n    return\
  \ match ($iso) {\n        'EGP', 'GBP' => '£',\n        'CNY'        => '¥',\n \
  \       'EUR'        => '€',\n        'THB'        => '฿',\n        default    \
  \  => '$'\n    };\n}\n$test = ['CNY', 'EGP', 'EUR', 'GBP', 'THB', 'MXD'];\nforeach\
  \ ($test as $iso)\n    echo 'The currency symbol for ' . $iso\n        . ' is '\
  \ . get_symbol($iso) . \"\\n\";\n```\n\n两个示例产生相同的输出，如下所示：\n\n```\nThe currency symbol\
  \ for CNY is ¥\nThe currency symbol for EGP is £\nThe currency symbol for EUR is\
  \ €\nThe currency symbol for GBP is £\nThe currency symbol for THB is ฿\nThe currency\
  \ symbol for MXD is $\n```\n\n如前所述，两个代码示例都为存储在 $test 数组中的 ISO 货币代码列表生成货币符号列表。\n\n\
  ## 复杂 match 示例\n\n回到我们的 CAPTCHA 项目，假设我们希望引入失真，使 CAPTCHA 字符更难阅读。为实现此目标，我们引入了多个 **策略**\
  \ 类，每个类产生不同的失真，如下表所述：\n\n| Php8\\Image\\Strategy\\* | 描述 |\n|---|---|\n| DotFill\
  \ ($num) | 用 $num 个点填充背景 |\n| LineFill ($num) | 用 $num 条线填充背景 |\n| RotateText ($angle)\
  \ | 将文本按 $angle 旋转 |\n| Shadow ($offset, $r, $g, $b) | 添加一个相隔 $offset 像素的阴影，其颜色由\
  \ $r、$g 和 $b（红、绿、蓝）决定 |\n\n表 1.2 – CAPTCHA 失真策略类\n\n在随机化要使用的策略列表后，我们使用 match 表达式来执行结果，如下所示：\n\
  \n- 1. 首先我们定义一个 **自动加载器**，导入要使用的类，并列出潜在的策略，如以下代码片段所示：\n- 2. 接下来，我们生成 CAPTCHA 短语，如下所示：\n\
  \n```php\n// /repo/ch01/php8_single_strategies.php\n// not all code is shown\nrequire_once\
  \ __DIR__ . '/../src/Server/Autoload/Loader.php';\n$loader = new \\Server\\Autoload\\\
  Loader();\nuse Php8\\Image\\SingleChar;\nuse Php8\\Image\\Strategy\\{LineFill,DotFill,Shadow,RotateText};\n\
  $strategies = ['rotate', 'line', 'line',\n    'dot', 'dot', 'shadow'];\n```\n\n\
  ```php\n$phrase = strtoupper(bin2hex(random_bytes(NUM_BYTES)));\n$length = strlen($phrase);\n\
  ```\n\n- 3. 然后我们遍历 CAPTCHA 短语中的每个字符并创建 SingleChar 实例。初始调用 writeFill() 创建白色背景画布。我们还需要调用\
  \ shuffle() 来随机化失真策略列表。该过程如下代码片段所示：\n\n```php\n$images = [];\nfor ($x = 0; $x <\
  \ $length; $x++) {\n    $char = new SingleChar($phrase[$x], FONT_FILE);\n    $char->writeFill();\n\
  \    shuffle($strategies);\n}\n```\n\n- 4. 然后我们遍历策略并在原始图像上分层失真。这就是 match 表达式发挥作用的地方。请注意，其中一个策略需要额外的代码行。由于\
  \ match 只能支持单个表达式，我们只需将多行代码包装到匿名函数中，如下所示：\n\n```php\nforeach ($strategies as $item)\
  \ {\n    $func = match ($item) {\n        'rotate' => RotateText::writeText($char),\n\
  \        'line' => LineFill::writeFill(\n            $char, rand(1, 10)),\n    \
  \    'dot' => DotFill::writeFill($char, rand(10, 20)),\n        'shadow' => function\
  \ ($char) {\n            $num = rand(1, 8);\n            $r   = rand(0x70, 0xEF);\n\
  \            $g   = rand(0x70, 0xEF);\n            $b   = rand(0x70, 0xEF);\n  \
  \          return Shadow::writeText(\n                $char, $num, $r, $g, $b);},\n\
  \        'default' => TRUE\n    };\n    if (is_callable($func)) $func($char);\n\
  }\n```\n\n- 5. 剩下的就是通过调用 writeText() 且不带参数来将图像与实际 CAPTCHA 短语叠加。之后，我们将失真图像保存为 **便携式网络图形\
  \ (PNG)** 文件以供显示，如以下代码片段所示：\n\n```php\n$char->writeText();\n$fn = $x . '_'\n   \
  \ . substr(basename(__FILE__), 0, -4)\n    . '.png';\n$char->save(IMG_DIR . '/'\
  \ . $fn);\n$images[] = $fn;\n}\ninclude __DIR__ . '/captcha_simple.phtml';\n```\n\
  \n以下是结果，从指向本书相关 Docker 容器的浏览器运行前述示例：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_45_0.png)\n\
  \n图 1.1 – 使用 match 表达式的失真 CAPTCHA\n\n接下来，我们将看一下另一个非常棒的功能：命名参数。\n\n> **提示**\n> 你可以在此处查看\
  \ match 表达式的原始提案：\n> https://wiki.php.net/rfc/match_expression_v2\n\n## 理解命名参数\n\
  \n命名参数代表了一种在调用具有大量参数的函数或方法时避免混淆的方式。这不仅有助于避免参数按错误顺序提供的问题，还可帮助你跳过具有默认值的参数。在本节中，你将学习如何应用命名参数来提高代码的准确性，减少未来维护周期中的混淆，并使方法和函数调用更简洁。我们首先通过检查使用命名参数所需的通用语法开始。\n\
  \n## 命名参数通用语法\n\n要使用命名参数，你需要知道函数或方法签名中使用的变量名称。然后你指定该名称，不带美元符号，后跟冒号和要提供的值，如下所示：\n\
  \n```\n$result = function_name( arg1 : <VALUE>, arg2 : <value> );\n```\n\n当调用 function_name()\
  \ 函数时，值将传递给对应于 arg1、arg2 等的参数。\n\n## 使用命名参数调用核心函数\n\n使用命名参数的最常见原因之一是在调用具有大量参数的核心\
  \ PHP 函数时。例如，以下是 setcookie() 的函数签名：\n\n```\nsetcookie ( string $name [, string $value\
  \ = \"\"\n    [, int $expires = 0 [, string $path = \"\"\n    [, string $domain\
  \ = \"\" [, bool $secure = FALSE\n    [, bool $httponly = FALSE ]]]]] ) : bool\n\
  ```\n\n假设你真正想要设置的参数只有 name、value 和 httponly。在 PHP 8 之前，你必须查找默认值并按顺序提供它们，直到到达你想要覆盖的参数。在以下情况下，我们希望将\
  \ httponly 设置为 TRUE：\n\n```\nsetcookie('test',1,0,0,'','',FALSE,TRUE);\n```\n\n\
  使用命名参数，PHP 8 中的等效写法如下：\n\n```\nsetcookie('test',1,httponly: TRUE);\n```\n\n请注意，我们不需要命名前两个参数，因为它们是按顺序提供的。\n\
  \n> **提示**\n> 在 PHP 扩展中，命名参数并不总是与你在 PHP 文档中函数或方法签名中看到的变量名称匹配。例如，函数 `imagefttext()`\
  \ 在其函数签名中显示变量 `$font_filename`。不过，如果你向下滚动一点，你会在 *参数* 部分看到，命名参数是 `fontfile`。\n> \n\
  > 如果你遇到致命错误：Unknown named parameter `$NAMED_PARAM`。始终使用文档 *参数* 部分中列出的名称，而不是函数或方法签名中变量的名称。\n\
  \n## 顺序独立性和文档\n\n命名参数的另一个用途是提供 **顺序独立性**。此外，对于某些核心 PHP 函数，参数数量之多导致文档噩梦。\n\n例如，请在此查看\
  \ `imagefttext()` 的函数签名（请注意，此函数是生成安全 CAPTCHA 图像的章节项目核心）：\n\n```php\nimagefttext\
  \ ( object $image , float $size , float $angle ,\n    int $x , int $y , int $color\
  \ , string $fontfile ,\n    string $text [, array $extrainfo ] ) : array\n```\n\n\
  正如你所想象的，6 个月后在审阅你的工作时，试图记住这些参数的名称和顺序可能会有问题。\n\n> **重要说明**\n> 在 PHP 8 中，图像创建函数（例如\
  \ `imagecreate()`）现在返回 `GdImage` 对象实例而不是资源。GD 扩展中的所有图像函数都已重写以适应此更改。无需重写你的代码！\n\n\
  \n\n\n因此，使用命名参数，以下函数调用在 PHP 8 中是可以接受的：\n\n```php\n// /repo/ch01/php8_named_args.php\n\
  // not all code is shown\n$rotation = range(40, -40, 10);\nforeach ($rotation as\
  \ $key => $offset) {\n    $char->writeFill();\n    [$x, $y] = RotateText::calcXYadjust($char,\
  \ $offset);\n    $angle = ($offset > 0) ? $offset : 360 + $offset;\n    imagettftext(\n\
  \        angle         : $angle,\n        color         : $char->fgColor,\n    \
  \    font_filename : FONT_FILE,\n        image         : $char->image,\n       \
  \ size          : 60,\n        x             : $x,\n        y             : $y,\n\
  \        text          : $char->text);\n    $fn = IMG_DIR . '/' . $baseFn . '_'\
  \ . $key . '.png';\n    imagepng($char->image, $fn);\n    $images[] = basename($fn);\n\
  }\n```\n\n上面展示的代码示例将一串失真的字符写入一组 PNG 图像文件。每个字符相对于其相邻图像顺时针旋转 10 度。请注意如何应用命名参数使 imagettftext()\
  \ 函数的参数更易于理解。\n\n命名参数也可以应用于你自己创建的函数和方法。在下一节中，我们将介绍新的数据类型。\n\n> 提示\n> 命名参数的详细分析可以在这里找到：\n\
  > https://wiki.php.net/rfc/named_params\n\n## 探索新的数据类型\n\n任何初级 PHP 开发者都会学习 PHP 可用的\
  \ **数据类型** 有哪些以及如何使用它们。基本数据类型包括 `int`（整数）、`float`、`bool`（布尔）和 `string`。复杂数据类型包括\
  \ `array` 和 `object`。此外，还有其他数据类型，例如 `NULL` 和 `resource`。在本节中，我们讨论 PHP 8 中引入的几种新的数据类型，包括联合类型和\
  \ mixed 类型。\n\n> **重要说明**\n> 极其重要的是不要将 **数据类型** 与 **数据格式** 混淆。本节描述数据类型。而数据格式则是一种用于\
  \ *表示* 数据的方式。数据格式的示例包括 XML、**JavaScript 对象表示法 (JSON)** 和 **YAML 不是标记语言 (YAML)**。\n\
  \n### 联合类型\n\n与 `int` 或 `string` 等其他数据类型不同，需要注意的是，并没有明确称为 `union` 的数据类型。相反，当你看到对\
  \ **联合类型** 的引用时，其含义是 PHP 8 引入了一种新的语法，允许你指定类型的联合，而不仅仅是一个。现在让我们来看一下联合类型的通用语法。\n\n\
  ### 联合类型语法\n\n联合类型的通用语法如下：\n\n```\nfunction ( type|type|type $var) {}\n```\n\n用\
  \ type 代替，你可以提供任何现有的数据类型（例如 float 或 string）。不过有一些限制，大多是完全合理的。下表总结了更重要的限制：\n\n| 不允许\
  \ | 不允许的示例 |\n|---|---|\n| void 不能包含在联合类型中 | void|int |\n| mixed 不能包含在联合类型中（下面会详细介绍）\
  \ | mixed|int |\n| 可空类型不能包含在联合类型中 | string|?array |\n| 不能同时包含 TRUE 和 FALSE 在联合类型中。\
  \ | TRUE|FALSE |\n| 不允许冗余类型 | int|float|int array|iterable|Traversable |\n\n表 1.3\
  \ – 不允许的联合类型\n\n从这个例外列表可以看出，定义联合类型主要是一个常识问题。\n\n> 提示\n> **最佳实践：** 使用联合类型时，**类型强制转换**（PHP\
  \ 在内部将数据类型转换为满足函数要求的过程）如果未强制严格类型检查可能会成为问题。因此，最佳实践是在使用联合类型的任何文件顶部添加以下内容：`declare(strict_types=1);`\n\
  > \n> 有关更多信息，请参阅此处的文档参考：\n> https://www.php.net/manual/en/language.types.declarations.php#language.types.declarations.strict\n\
  \n### 联合类型示例\n\n为了简单说明，让我们回到本章中用作示例的 SingleChar 类。其中一个方法是 colorAlloc()。此方法从图像分配颜色，利用\
  \ imagecolorallocate() 函数。它接受代表红、绿、蓝的整数值作为参数。\n\n假设第一个参数实际上可以是一个数组，表示三个值——每个分别代表红、绿、蓝。在这种情况下，第一个值的参数类型不能是\
  \ int，否则如果提供了数组，在开启严格类型检查时将抛出错误。\n\n在 PHP 的早期版本中，唯一的解决方案是移除第一个参数的任何类型检查，并在关联的 DocBlock\
  \ 中说明接受多种类型。以下是该方法在 PHP 7 中可能出现的样子：\n\n```php\n/**\n * Allocates a color resource\n\
  \ *\n * @param array|int $r\n * @param int $g\n * @param int $b\n * @return int\
  \ $color\n */\npublic function colorAlloc($r, $g = 0, $b = 0) {\n    if (is_array($r))\
  \ {\n        [$r, $g, $b] = $r;\n    }\n    return \\imagecolorallocate($this->image,\
  \ $r, $g, $b);\n}\n```\n\n第一个参数 $r 的数据类型的唯一指示是 @param array|int $r DocBlock 注释以及该参数没有关联的数据类型提示这一事实。在\
  \ PHP 8 中，利用联合类型，请注意这里的区别：\n\n```\n#[description(\"Allocates a color resource\"\
  )]\n#[param(\"int|array r\")]\n#[int(\"g\")]\n#[int(\"b\")]\n```\n\n```php\n#[returns(\"\
  int\")]\npublic function colorAlloc(\n    int|array $r, int $g = 0, int $b = 0)\
  \ {\n    if (is_array($r)) {\n        [$r, $g, $b] = $r;\n    }\n    return \\imagecolorallocate($this->image,\
  \ $r, $g, $b);\n}\n```\n\n在前面的示例中，除了存在指示第一个参数可以接受 array 或 int 类型 的属性外，在方法签名本身中，int|array\
  \ 联合类型也明确了这一选择。\n\n### mixed 类型\n\nmixed 是 PHP 8 中引入的另一种新类型。与联合类型不同，mixed 是一个实际的数据类型，表示类型的终极联合。它用于表示接受任何和所有数据类型。在某种意义上，PHP\
  \ 已经具备此功能：只需完全省略数据类型，即为隐含的 mixed 类型！\n\n> 提示\n> 你将在 PHP 文档中看到对 mixed 类型的引用。PHP 8\
  \ 通过将其作为实际数据类型来正式化这种表示。\n\n### 为什么使用 mixed 类型？\n\n稍等一下——你可能在此时会想：为什么还要使用 mixed 类型呢？为了让你安心，这是一个很好的问题，而且没有令人信服的理由使用此类型。\n\
  \n然而，通过在函数或方法签名中使用 mixed，你清楚地表明了对该参数使用的意图。如果你只是将数据类型留空，后来使用或审查你代码的其他开发者可能会认为你忘记添加类型。至少，他们会对未类型化参数的性质感到不确定。\n\
  \n### mixed 类型对继承的影响\n\n由于 mixed 类型代表了放宽的终极示例，它可用于在一个类扩展另一个类时放宽数据类型定义。以下是使用 mixed\
  \ 类型的示例，说明了这一原则：\n\n- 首先，我们按如下方式定义具有更严格的 object 数据类型的父类：\n\n// /repo/ch01/php8_mixed_type.php\n\
  declare(strict_types=1);\nclass High {\n    const LOG_FILE = __DIR__ . '../data/test.log';\n\
  \    protected static function logVar(object $var) {\n        $item = date('Y-m-d')\
  \ . ':'\n            . var_export($var, TRUE);\n        return error_log($item,\
  \ 3, self::LOG_FILE);\n    }\n}\n- 接下来，我们按如下方式定义扩展 High 的 Low 类：\n\n```\nclass Low\
  \ extends High {\n    public static function logVar(mixed $var) {\n        $item\
  \ = date('Y-m-d') . ':'\n            . var_export($var, TRUE);\n        return error_log($item,\
  \ 3, self::LOG_FILE);\n    }\n}\n```\n\n请注意在 Low 类中，logVar() 方法的数据类型已被放宽为 mixed。\n\
  \n- 最后，我们创建 Low 的一个实例并使用测试数据执行它。如以下代码片段所示的结果，你可以看到一切正常：\n\n```\nif (file_exists(High::LOG_FILE))\
  \ unlink(High::LOG_FILE)\n$test = [\n    'array' => range('A', 'F'),\n    'func'\
  \ => function () { return __CLASS__; },\n    'anon' => new class () {\n```\n\n\n\
  \n```\npublic function __invoke() {\n    return __CLASS__; } },\n];\nforeach ($test\
  \ as $item) Low::logVar($item);\nreadfile(High::LOG_FILE);\n```\n\n以下是前述示例的输出：\n\
  \n```\n2020-10-15:array (\n  0 => 'A',\n  1 => 'B',\n  2 => 'C',\n  3 => 'D',\n\
  \  4 => 'E',\n  5 => 'F',\n)2020-10-15:Closure::__set_state(array(\n))2020-10-15:class@anonymous/repo/ch01/php8_mixed_type.php:28$1::__set_state(array())\n\
  ```\n\n前述代码块记录了多种不同的数据类型，然后显示日志文件的内容。在此过程中，这向我们展示了在 PHP 8 中，当子类重写父类方法并用 mixed 数据类型替代更严格的数据类型（如\
  \ object）时，不存在继承问题。\n\n接下来，我们来看一下使用类型化属性。\n\n> 提示\n> **最佳实践：** 在定义函数或方法时，为所有参数分配特定的数据类型。如果接受几种不同的数据类型，则定义联合类型。否则，如果以上情况均不适用，则回退到\
  \ mixed 类型。\n> \n> 有关联合类型的详细信息，请参阅此文档页面：\n> https://wiki.php.net/rfc/union_types_v2\n\
  > \n> 有关 mixed 类型的更多信息，请在此查看： https://wiki.php.net/rfc/mixed_type_v2.\n\n## 使用类型化属性改进代码\n\
  \n本章的第一部分 *使用构造函数属性提升* 中，我们讨论了如何使用数据类型来控制作为函数或类方法参数提供的数据的类型。然而，这种方法无法保证数据类型永远不会改变。在本节中，您将学习如何在属性级别分配数据类型，从而在\
  \ PHP 8 中对变量的使用提供更严格的控制。\n\n### 什么是类型化属性？\n\n此功能极其重要，于 PHP 7.4 中引入并延续至 PHP 8。简单来说，**typed\
  \ property** 是具有预先分配数据类型的类属性。以下是一个简单示例：\n\n// /repo/ch01/php8_prop_type_1.php\n\
  declare(strict_types=1)\nclass Test {\n    public int $id = 0;\n    public int $token\
  \ = 0;\n    public string $name = '';\n}\n$test = new Test();\n$test->id = 'ABC';\n\
  ```\n\n在此示例中，如果我们尝试将代表除 int 类型以外的数据类型的值分配给 $test->id，将抛出 Fatal error。以下是输出：\n\n\
  ```\nFatal error: Uncaught TypeError: Cannot assign string to property Test::$id\
  \ of type int in /repo/ch01/php8_prop_type_1.php:11 Stack trace: #0 {main} thrown\
  \ in /repo/ch01/php8_prop_type_1.php on line 11\n```\n\n正如前述输出所示，当为类型化属性分配错误的数据类型时，会抛出\
  \ Fatal error。\n\n您已经接触过一种属性类型化的形式：**constructor property promotion**。使用构造函数属性提升定义的所有属性都会自动进行属性类型化！\n\
  \n### 为什么属性类型化很重要？\n\n类型化属性是 PHP 7 中首次出现的 PHP 整体趋势的一部分。该趋势旨在对代码的使用进行限制和收紧的语言改进。这会带来更好的代码，意味着更少的错误。\n\
  \n以下示例说明了仅依赖于属性类型提示来控制属性数据类型的危险：\n\n```php\n// /repo/ch01/php7_prop_danger.php\n\
  declare(strict_types=1);\nclass Test {\n    protected $id = 0;\n    protected $token\
  \ = 0;\n    protected $name = '';\n    public function __construct(\n        int\
  \ $id, int $token, string $name) {\n        $this->id = $id;\n        $this->token\
  \ = md5((string) $token);\n        $this->name = $name;\n    }\n}\n$test = new Test(111,\
  \ 123456, 'Fred');\nvar_dump($test);\n```\n\n在前述示例中，请注意在 __construct() 方法中，$token\
  \ 属性被意外转换为字符串。以下是输出：\n\n```\nobject(Test)#1 (3) {\n  [\"id\":protected]=>  int(111)\n\
  \  [\"token\":protected]=>\n  string(32) \"e10adc3949ba59abbe56e057f20f883e\"\n\
  \  [\"name\":protected]=>  string(4) \"Fred\"\n}\n```\n\n任何随后期望 $token 为整数的代码都可能失败或产生意外结果。现在，让我们看一下在\
  \ PHP 8 中使用类型化属性的相同情况：\n\n// /repo/ch01/php8_prop_danger.php\ndeclare(strict_types=1);\n\
  class Test {\n    protected int $id = 0;\n    protected int $token = 0;\n    protected\
  \ string $name = '';\n    public function __construct(\n        int $id, int $token,\
  \ string $name) {\n        $this->id = $id;\n        $this->token = md5((string)\
  \ $token);\n        $this->name = $name;\n    }\n}\n$test = new Test(111, 123456,\
  \ 'Fred');\nvar_dump($test);\n```\n\n属性类型化可防止预先分配的数据类型发生任何更改，如此处所示的输出所示：\n\n```\n\
  Fatal error: Uncaught TypeError: Cannot assign string to property Test::$token of\
  \ type int in /repo/ch01/php8_prop_danger.php:12\n```\n\n正如前述输出所示，当为类型化属性分配错误的数据类型时，会抛出\
  \ Fatal error。此示例表明，不仅为属性分配数据类型可以防止直接赋值时发生误用，而且还可以防止在类方法内部对属性的误用！\n\n### 属性类型化可以减少代码量\n\
  \n将属性类型化引入代码的另一个有益副作用是可能减少所需的代码量。作为示例，请考虑当前的做法，即将属性标记为 private 或 protected 的可见性，然后创建一系列\
  \ get 和 set 方法来控制访问（也称为 getters 和 setters）。\n\n它可能如下所示：\n\n- 首先，我们按如下方式定义一个具有受保护属性的\
  \ Test 类：\n\n```php\n// /repo/ch01/php7_prop_reduce.php\ndeclare(strict_types=1);\n\
  class Test {\n    protected $id = 0;\n    protected $token = 0;\n    protected $name\
  \ = '';\n```\n\n- 接下来，我们按如下方式定义一系列 get 和 set 方法来控制对受保护属性的访问：\n\n```php\n    public\
  \ function getId() { return $this->id; }\n    public function setId(int $id) { $this->id\
  \ = $id; }\n    public function getToken() { return $this->token; }\n    public\
  \ function setToken(int $token) {\n        $this->token = $token;\n    }\n    public\
  \ function getName() {\n        return $this->name;\n    }\n    public function\
  \ setName(string $name) {\n        $this->name = $name;\n    }\n}\n```\n\n- 然后我们按如下方式使用\
  \ set 方法分配值：\n\n```php\n$test = new Test();\n$test->setId(111);\n$test->setToken(999999);\n\
  $test->setName('Fred');\n```\n\n- 最后，我们按如下方式使用 get 方法检索属性值，将结果显示在表格中：\n\n```\n$pattern\
  \ = '<tr><th>%s</th><td>%s</td></tr>';\necho '<table width=\"50%\" border=1>';\n\
  printf ($pattern, 'ID', $test->getId());\nprintf ($pattern, 'Token', $test->getToken());\n\
  printf ($pattern, 'Name', $test->getName());\necho '</table>';\n```\n\n它可能如下所示：\n\
  \n|  |  |\n|---|---|\n| ID | 111 |\n| Token | 999999 |\n| Name | Fred |\n\n表 1.4\
  \ – 使用 Get 方法的输出\n\n将属性标记为 protected（或 private）并定义 getters 和 setters 的主要目的是控制访问。通常，这转化为希望防止属性数据类型发生变化的愿望。如果是这种情况，整个基础设施可以通过分配属性类型来替换。\n\
  \n简单地将可见性更改为 public 可以消除对 get 和 set 方法的需求；然而，它并不能防止属性数据被更改！使用 PHP 8 属性类型可以实现这两个目标：它消除了对\
  \ get 和 set 方法的需求，同时还防止数据类型被意外更改。\n\n请注意，使用 PHP 8 属性类型来实现相同结果所需的代码量少了多少：\n\n// /repo/ch01/php8_prop_reduce.php\n\
  declare(strict_types=1);\nclass Test {\n    public int $id = 0;\n    public int\
  \ $token = 0;\n    public string $name = '';\n}\n// assign values\n$test = new Test();\n\
  $test->id = 111;\n$test->token = 999999;\n$test->name = 'Fred';\n// display results\n\
  $pattern = '<tr><th>%s</th><td>%s</td></tr>';\necho '<table width=\"50%\" border=1>';\n\
  printf($pattern, 'ID', $test->id);\nprintf($pattern, 'Token', $test->token);\nprintf($pattern,\
  \ 'Name', $test->name);\necho '</table>';\n```\n\n前述所示的代码示例产生与前一个示例完全相同的输出，并且对属性数据类型的控制也更好。在此示例中使用类型化属性，我们实现了生产相同结果所需代码量减少\
  \ 50%！\n\n> 提示\n> **最佳实践：** 尽可能使用类型化属性，除非您明确希望允许数据类型更改的情况。\n\n## 摘要\n\n在本章中，您学习了如何使用新的\
  \ PHP 8 数据类型：mixed 和 union types 来编写更好的代码。您还了解了使用命名参数不仅可以提高代码的可读性，还可以帮助防止类方法和 PHP\
  \ 函数的意外误用，并提供了一种跳过默认参数的绝佳方式。\n\n本章还向您介绍了如何使用新的 Attribute 类作为 PHP DocBlocks 的最终替代品，从而提高代码的整体性能，同时提供记录类、方法和函数的可靠手段。\n\
  \n此外，我们还研究了 PHP 8 如何通过利用构造函数参数提升和类型化属性，大大减少早期 PHP 版本所需的代码量。\n\n在下一章中，您将了解函数式和过程式层面的新\
  \ PHP 8 功能。\n\n\n"
- "## 2 学习 PHP 8 的功能增强\n\n本章将带你了解在过程层面引入到 **PHP 8** 的重要新增功能和改进。所使用的代码示例展示了新的 PHP 8\
  \ 特性和技术，以促进过程式编程。\n\n精通本章中新的函数和技术的使用，将帮助你编写更快、更干净的应用程序。尽管本章重点关注命令和函数，但所有技术在开发类方法时也很有用。\n\
  \n本章涵盖以下主题：\n\n- 使用新的 PHP 8 运算符\n- 使用箭头函数\n- 理解统一变量语法\n- 学习新的数组和字符串处理技术\n- 使用授权器保护\
  \ SQLite 数据库\n\n### 技术要求\n\n若要检查并运行本章提供的代码示例，推荐的最低硬件配置如下：\n\n- 基于 x86_64 的台式电脑或笔记本电脑\n\
  - 1 千兆字节（GB）可用磁盘空间\n- 4 GB 随机存取存储器（RAM）\n- 500 千比特每秒（Kbps）或更快的互联网连接\n- 此外，你需要安装以下软件：\n\
  - Docker\n- Docker Compose\n\n请参阅 *第 1 章，介绍新的 PHP 8 面向对象编程特性* 中的 *技术要求* 部分，了解有关\
  \ Docker 和 Docker Compose 安装的更多信息，以及如何构建本书中用于演示所解释代码的 Docker 容器。在整个过程中，我们将本书示例代码恢复的目录称为\
  \ `/repo`。\n\n本章的源代码位于此处：`https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices.`\n\
  \n我们现在可以开始讨论，通过检查新的 PHP 8 运算符来展开。\n\n### 使用新的 PHP 8 运算符\n\nPHP 8 引入了许多新的 **运算符**。此外，PHP\
  \ 8 通常以统一且一致的方式引入这些运算符的使用方法。在本节中，我们将检查以下运算符：\n\n- 可变参数运算符\n- 空安全运算符\n- 拼接运算符\n-\
  \ 三元运算符\n\n让我们从对可变参数运算符的讨论开始。\n\n### 使用可变参数运算符\n\n**可变参数** 运算符由三个前导点（ . . . ）组成，位于普通的\
  \ PHP 变量（或对象属性）之前。该运算符实际上自 PHP 5.6 起就已存在于语言中。它也被称为以下名称：\n\n- Splat 运算符\n- Scatter\
  \ 运算符\n- Spread 运算符\n\n在深入了解 PHP 8 对该运算符的改进之前，让我们先快速了解一下该运算符的常规用法。\n\n### 未知数量的参数\n\
  \n可变参数运算符最常见的用途之一是在定义具有未知数量参数的函数时。\n\n在下面的代码示例中，multiVardump() 函数能够接受任意数量的变量。然后它连接\
  \ var_export() 的输出并返回一个字符串：\n\n```php\n// /repo/ch02/php7_variadic_params.php\n\
  function multiVardump(...$args) {\n    $output = '';\n    foreach ($args as $var)\n\
  \        $output .= var_export($var, TRUE);\n    return $output;\n}\n$a = new ArrayIterator(range('A','F'));\n\
  $b = function (string $val) { return str_rot13($val); };\n$c = [1,2,3];\n$d = 'TEST';\n\
  echo multiVardump($a, $b, $c);\necho multiVardump($d);\n```\n\n第一次调用函数时，我们提供了三个参数。第二次调用时，我们只提供了一个参数。由于我们使用了可变参数运算符，因此无需重写函数以适应更多或更少的参数。\n\
  \n> Tip\n>\n> PHP 中有一个 `func_get_args()` 函数可以将所有函数参数收集到一个数组中。然而，可变参数运算符更受青睐，因为它必须在函数签名中声明，因此使程序开发者的意图更加清晰。有关更多信息，请参阅\
  \ https://php.net/func_get_args.\n\n### 吸取剩余参数\n\n可变参数运算符的另一个用途是 **吸取** 任何剩余参数。这种技术允许你将强制参数与未知数量的可选参数混合使用。\n\
  \n在此示例中，where() 函数生成一个 WHERE 子句，用于添加到 **结构化查询语言（SQL）** SELECT 语句中。前两个参数是强制性的：没有参数就生成\
  \ WHERE 子句是不合理的！请查看这里的代码：\n\n```php\n// ch02/includes/php7_sql_lib.php\n// other\
  \ functions not shown\nfunction where(stdClass $obj, $a, $b = '', $c = '',\n   \
  \ $d = '') {\n    $obj->where[] = $a;\n    $obj->where[] = $b;\n    $obj->where[]\
  \ = $c;\n    $obj->where[] = $d;\n}\n```\n\n使用此函数的调用代码可能如下所示：\n\n```php\n// /repo/ch02/php7_variadics_sql.php\n\
  require_once __DIR__ . '/includes/php7_sql_lib.php';\n$start = '2021-01-01';\n$end\
  \   = '2021-04-01';\n$select = new stdClass();\nfrom($select, 'events');\ncols($select,\
  \ ['id', 'event_key',\n    'event_name', 'event_date']);\nlimit($select, 10);\n\
  where($select, 'event_date', '>=', \"'$start'\");\n```\n\n```php\nwhere($select,\
  \ 'AND');\nwhere($select, 'event_date', '<', \"'$end'\");\n$sql = render($select);\n\
  // remaining code not shown\n```\n\n你可能已经注意到，由于参数数量有限，where() 必须多次调用。这正是可变参数运算符的完美候选！以下是重写的\
  \ where() 函数可能的样子：\n\n```php\n// ch02/includes/php8_sql_lib.php\n// other functions\
  \ not shown\nfunction where(stdClass $obj, ...$args) {\n    $obj->where = (empty($obj->where))\n\
  \        ? $args\n        : array_merge($obj->where, $args);\n}\n```\n\n因为 ...$args\
  \ 总是以数组形式返回，为了确保对函数的任何额外调用不会丢失子句，我们需要执行 array_merge() 操作。以下是重写的调用程序：\n\n```php\n\
  // /repo/ch02/php8_variadics_sql.php\nrequire_once __DIR__ . '/includes/sql_lib2.php';\n\
  $start = '2021-01-01';\n$end   = '2021-04-01';\n$select = new stdClass();\nfrom($select,\
  \ 'events');\ncols($select, ['id', 'event_key',\n    'event_name', 'event_date']);\n\
  limit($select, 10);\nwhere($select, 'event_date', '>=', \"'$start'\",\n    'AND',\
  \ 'event_date', '<', \"'$end'\");\n$sql = render($select);\n// remaining code not\
  \ shown\n```\n\n生成的 SQL 语句如下所示：\n\n```\nSELECT id,event_key,event_name,event_date\n\
  FROM events\nWHERE event_date >= '2021-01-01'\n    AND event_date <= '2021-04-01'\n\
  LIMIT 10\n```\n\n前面的输出显示，我们的 SQL 生成逻辑生成了一个有效的语句。\n\n### 将可变参数运算符用作替代\n\n到目前为止，对于经验丰富的\
  \ PHP 开发者来说，这些都并不陌生。PHP 8 中不同的是，可变参数运算符现在可以在可能涉及放宽的情况中使用。\n\n为了正确描述可变参数运算符使用方式的差异，我们需要简要回到面向对象编程（OOP）。如果我们将刚才描述的\
  \ where () 函数重写为类方法，它可能如下所示：\n\n```\n// src/Php7/Sql/Where.php\nnamespace Php7\\\
  Sql;\nclass Where {\n    public $where = [];\n    public function where($a, $b =\
  \ '', $c = '', $d = '') {\n        $this->where[] = $a;\n        $this->where[]\
  \ = $b;\n        $this->where[] = $c;\n        $this->where[] = $d;\n        return\
  \ $this;\n    }\n    // other code not shown\n}\n```\n\n现在，假设我们有一个 Select 类，它扩展了\
  \ Where，但使用可变参数运算符重新定义了方法签名。它可能如下所示：\n\n```php\n// src/Php7/Sql/Select.php\nnamespace\
  \ Php7\\Sql;\nclass Select extends Where {\n    public function where(...$args)\
  \ {\n        $this->where = (empty($obj->where))\n            ? $args\n        \
  \    : array_merge($obj->where, $args);\n    }\n    // other code not shown\n}\n\
  ```\n\n使用可变参数运算符是合理的，因为用于制定 WHERE 子句的参数数量未知。以下是使用 OOP 重写的调用程序：\n\n```php\n// /repo/ch02/php7_variadics_problem.php\n\
  require_once __DIR__ . '/../src/Server/Autoload/Loader.php';\n$loader = new \\Server\\\
  Autoload\\Loader();\nuse Php7\\Sql\\Select;\n$start = \"'2021-01-01'\";\n$end  \
  \ = \"'2021-04-01'\";\n$select = new Select();\n$select->from($select, 'events')\n\
  \    ->cols($select, ['id', 'event_key',\n        'event_name', 'event_date'])\n\
  \    ->limit($select, 10)\n    ->where($select, 'event_date', '>=', \"'$start'\"\
  ,\n        'AND', 'event_date', '<=', \"'$end'\");\n$sql = $select->render();\n\
  // other code not shown\n```\n\n然而，当你在 PHP 7 下运行此示例时，会出现以下警告：\n\n```\nWarning: Declaration\
  \ of Php7\\Sql\\Select::where(...$args) should be compatible with Php7\\Sql\\Where::where($a,\
  \ $b = '', $c = '', $d = '') in /repo/src/Php7/Sql/Select.php on line 5\n```\n\n\
  \n\n请注意代码仍然可以工作；然而，可变参数运算符在 PHP 7 中不被视为可行的替代方案。以下是该代码在 PHP 8 下的运行情况（使用 /repo/ch02/php8_variadics_no_problem.php）：\n\
  \n## PHP 8.0.0\n\n原始输出\n\n```\nSELECT id,event_key,event_name,event_date FROM events\
  \ WHERE event_date >= '2021-01-01' AND event_date <= '2021-04-01' LIMIT 10\nID |\
  \ Key | Title | Date\n---|-----|-------|-----\n153 | CON-PRO-WQ-145 | Conservation\
  \ Promotion Symposium | 2021-02-15 00:00:00\n155 | TRE-PRO-DF-540 | Tree Promotion\

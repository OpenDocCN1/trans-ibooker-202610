  \ C 库，包括机器学习、光学字符识别、通信、加密等。\n\n本章加深了你对 PHP 在 C 语言层运行方式的理解。你学会创建和直接使用 C 语言数据结构，可与\
  \ PHP 语言交互甚至覆盖它。你也知道如何将任意 C 语言库功能直接集成到 PHP 应用。掌握此知识有助于你在开发自定义 PHP 扩展的公司提升职业前景。\n\
  \n下一章开启本书新部分 PHP 8 Tricks。下一部分将介绍升级到 PHP 8 的向后兼容性问题。下一章专门讨论与 OOP 相关的向后兼容性问题。\n\n\
  ## Section 2: PHP 8 Tricks\n\n本部分带你进入 PHP 8 的暗角：存在向后兼容性破坏之处。本部分指导将现有应用迁移到 PHP 8\
  \ 的关键流程。\n\n本部分包含以下章节：\n\n- Chapter 5, Discovering Potential OOP Backward-Compatibility\
  \ Breaks\n- Chapter 6, Understanding PHP 8 Functional Differences\n- Chapter 7,\
  \ Avoiding Traps When Using PHP 8 Extensions\n- Chapter 8, Learning about PHP 8's\
  \ Deprecated or Removed Functionality\n\n## 5 Discovering Potential OOP Backward-Compatibility\
  \ Breaks\n\n本章开启本书第 2 部分 *PHP 8 Tricks*。本部分让你发现 PHP 8 的暗角：存在 **backward-compatibility\
  \ breaks** 之处。本部分帮助你在迁移现有应用到 PHP 8 前规避问题。你将学习现有代码中可能导致 PHP 8 升级后失效的内容。掌握本部分主题后，你可修改现有代码使其在\
  \ PHP 8 升级后仍正常运行。\n\n本章将介绍特定于 **object-oriented programming (OOP)** 的新 PHP 8 功能。本章提供大量简短代码示例，清晰展示新特性和概念。本章有助于你快速利用\
  \ PHP 8 强大功能，将示例适配到自己的实践。本章重点关注对象导向代码在 PHP 8 迁移后可能破坏的情况。\n\n本章涵盖主题包括：\n\n- Discovering\
  \ core OOP coding differences\n- Navigating changes in magic methods\n- Taking control\
  \ of serialization\n- Understanding expanded PHP 8 variance support\n- Handling\
  \ **Standard PHP Library (SPL)** changes\n\n## Technical requirements\n\n检查和运行本章代码示例的最低推荐硬件如下：\n\
  \n- x86_64 based desktop PC or laptop\n- 1 gigabyte (GB) of free disk space\n- 4\
  \ GB of RAM\n- A 500 kilobits per second (Kbps) or faster internet connection\n\n\
  此外需安装以下软件：\n\n- Docker\n- Docker Compose\n\n请参阅 *Chapter 1, Introducing New PHP\
  \ 8 OOP Features* 中 *Technical requirements* 部分，了解 Docker 和 Docker Compose 安装及如何构建本书演示代码的\
  \ Docker 容器。本书中，样本代码恢复目录称为 `/repo`。\n\n本章源代码位于：https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices。\n\
  \n我们现在可开始讨论，通过检查核心 OOP 编码差异展开。\n\n## Discovering core OOP coding differences\n\n\
  PHP 8 中编写 OOP 代码的方式存在多项重大变化。本节聚焦三个可能带来向后兼容性破坏的关键领域。所讨论领域是与进行静态方法调用、处理对象属性和 PHP 自动加载相关的常见不良实践。\n\
  \n阅读本节并[content]\n在阅读本节并完成示例后，你能更好地发现 OOP 不良实践，并了解 PHP 8 对此类使用的限制。本章教授良好的编码实践，最终会让你成为更好的程序员。你也能处理\
  \ PHP 自动加载的变化，这些变化可能导致迁移到 PHP 8 的应用失败。\n\n让我们先看看 PHP 8 如何收紧了静态调用。\n\n### Handling\
  \ static calls in PHP 8\n\n令人惊讶的是，PHP 7 及以下版本允许开发者对未声明为静态的类方法进行静态调用。乍一看，任何审查你代码的未来开发者都会立即假设该方法已定义为静态。这可能导致意外行为，因为在错误假设下工作的未来开发者开始误用你的代码。\n\
  \n在此简单示例中，我们定义了一个 Test 类，其中包含 notStatic() 方法。在类定义之后的过程代码中，我们 echo 该方法的返回值，但在这样做的过程中我们进行了静态调用：\n\
  \n// /repo/ch05/php8_oop_diff_static.php\nclass Test {\n    public function notStatic()\
  \ {\n        return __CLASS__ . PHP_EOL;\n    }\n}\necho Test::notStatic();\n\n\
  当我们在 PHP 7 中运行此代码时，结果如下：\n\n```\nroot@php8_tips_php7 [ /repo/ch05 ]#\nphp php8_oop_diff_static.php\n\
  ```\n\n```\nPHP Deprecated:  Non-static method Test::notStatic() should not be called\
  \ statically in /repo/ch05/php8_oop_diff_static.php on line 11\nTest\n```\n\n正如输出所示，PHP\
  \ 7 发出弃用通知，但允许调用！在 PHP 8 中，结果却是致命错误，如下所示：\n\n```\nroot@php8_tips_php8 [ /repo/ch05\
  \ ]#\nphp php8_oop_diff_static.php\nPHP Fatal error:  Uncaught Error: Non-static\
  \ method\nTest::notStatic() cannot be called statically in /repo/ch05/\nphp8_oop_diff_static.php:11\n\
  ```\n\n使用静态方法调用语法调用非静态方法是一种不良实践，因为编写良好的代码会让代码开发者的意图非常清晰。如果你未将方法定义为静态，但后来以静态方式调用它，未来负责维护你代码的开发者可能会感到困惑，并对代码的原始意图做出错误假设。最终结果会是更多不良代码！\n\
  \n在 PHP 8 中，你不能再使用静态方法调用来调用非静态方法。让我们现在看看另一个涉及将对象属性视为键的不良实践。\n\n### Dealing with\
  \ object property handling changes\n\n数组一直是 PHP 从最早版本开始的核心功能。另一方面，OOP 直到 PHP 4 才引入。在\
  \ OOP 的早期，数组函数经常被扩展以适应对象属性。这导致对象与数组之间的区别变得模糊，进而催生了许多不良实践。\n\n为了在数组处理和对象处理之间保持清晰分离，PHP\
  \ 8 现在将 array_key_exists() 函数限制为仅接受数组作为参数。为了说明这一点，请考虑以下示例：\n\n- 1. 首先，我们定义一个只有一个属性的简单匿名类：\n\
  \n// /repo/ch05/php8_oop_diff_array_key_exists.php\n$obj = new class () { public\
  \ $var = 'OK.'; };\n\n\n\n2. 我们随后运行三个测试，每个测试都检查 $var 是否存在，使用 isset()、property_exists()\
  \ 和 array_key_exists()：\n\n// not all code is shown\n$default = 'DEFAULT';\necho\
  \ (isset($obj->var))\n    ? $obj->var : $default;\necho (property_exists($obj,'var'))\n\
  \    ? $obj->var : $default;\necho (array_key_exists('var',$obj))\n    ? $obj->var\
  \ : $default;\n```\n\n当我们在 PHP 7 中运行此代码时，所有测试都成功，如下所示：\n\n```\nroot@php8_tips_php7\
  \ [ /repo/ch05 ]#\nphp php8_oop_diff_array_key_exists.php\nOK.OK.OK.\n```\n\n然而在\
  \ PHP 8 中，会发生致命的 TypeError，因为 array_key_exists() 现在只接受数组作为参数。PHP 8 的输出如下所示：\n\n\
  ```\nroot@php8_tips_php8 [ /repo/ch05 ]#\nphp php8_oop_diff_array_key_exists.php\n\
  OK.OK.PHP Fatal error: Uncaught TypeError: array_key_exists(): Argument #2 ($array)\
  \ must be of type array, class@anonymous given in /repo/ch05/php8_oop_diff_array_key_exists.php:10\n\
  ```\n\n最佳实践是使用 property_exists() 或 isset()。我们现在将注意力转向 PHP 自动加载的更改。\n\n## 使用 PHP\
  \ 8 自动加载\n\n最初在 PHP 5.1 中引入的基本自动加载类机制在 PHP 8 中工作方式相同。主要区别在于，对在 PHP 7.2 中已弃用的全局函数\
  \ __autoload() 的支持已在 PHP 8 中完全移除。从 PHP 7.2 开始，开发人员被鼓励使用自 PHP 5.1 起就为此目的提供的 spl_autoload_register()\
  \ 来注册他们的自动加载逻辑。另一个主要区别是当无法注册自动加载器时 spl_autoload_register() 的反应方式。\n\n理解使用 `spl_autoload_register()`\
  \ 时自动加载过程的工作原理对您作为开发人员的工作至关重要。未能掌握 PHP 如何自动定位和加载类将限制您作为开发人员的成长能力，并可能对您的职业发展产生不利影响。\n\
  \n在深入了解 `spl_autoload_register()` 之前，让我们先看看 `__autoload()` 函数。\n\n## 了解 __autoload()\
  \ 函数\n\n`__autoload()` 函数被许多开发人员用作自动加载逻辑的主要来源。此函数的行为与 *魔法方法* 非常相似，这就是为什么它会根据上下文自动调用。会触发对\
  \ `__autoload()` 函数的自动调用的情况包括在创建新类实例的时刻，但此时类定义尚未加载。此外，如果类扩展了另一个类，自动加载逻辑也会被调用，以便在创建扩展它的子类之前加载超类。\n\
  \n使用 `__autoload()` 函数的优点是它定义起来相当容易，并且通常定义在网站的初始 `index.php` 文件中。缺点包括以下内容：\n\n-\
  \ `__autoload()` 是 PHP 的过程式函数；未使用 OOP 原则定义或控制。例如，在为应用程序定义单元测试时，这可能会成为一个问题。\n- 如果您的应用程序使用命名空间，则\
  \ `__autoload()` 函数必须定义在全局命名空间中；否则，`__autoload()` 函数所在命名空间之外的类将无法加载。\n- `__autoload()`\
  \ 函数与 `spl_autoload_register()` 配合不佳。如果您同时使用 `__autoload()` 函数和 `spl_autoload_register()`\
  \ 定义自动加载逻辑，则 `__autoload()` 函数的逻辑将被完全忽略。\n\n为了说明潜在问题，我们将定义一个 OopBreakScan 类，在第 11\
  \ 章《将现有 PHP 应用迁移到 PHP 8》中会更详细地讨论：\n\n- 1. 首先，我们定义 OopBreakScan 类，然后向其添加一个方法，该方法扫描文件内容以查找\
  \ __autoload() 函数。请注意，错误消息是 Base 类中定义的一个类常量，它只是警告 __autoload() 函数的存在：\n\n```php\n\
  namespace Migration;\nclass OopBreakScan extends Base {\n    public static function\
  \ scanMagicAutoloadFunction(\n        string $contents, array &$message) : bool\
  \ {\n        $found = 0;\n        $found += (stripos($contents,\n            'function\
  \ __autoload(') !== FALSE);\n        $message[] = ($found)\n            ? Base::ERR_MAGIC_AUTOLOAD\n\
  \            : sprintf(Base::OK_PASSED,\n                __FUNCTION__);\n      \
  \  return (bool) $found;\n    }\n    // remaining methods not shown\n}\n```\n\n\
  此类扩展了 Migration\\Base 类（未显示）。这很重要，因为任何自动加载逻辑不仅需要找到子类，还需要找到其超类。\n\n- 2. 接下来，我们定义一个调用程序，其中定义了魔术\
  \ __autoload() 函数：\n\n```php\n// /repo/ch05/php7_autoload_function.php\nfunction\
  \ __autoload($class) {\n    $fn = __DIR__ . '../src/'\n        . str_replace('\\\
  \\', '/', $class)\n        . '.php';\n    require_once $fn;\n}\n```\n\n- 3. 然后我们通过让调用程序扫描自身来使用该类：\n\
  \n```\nuse Migration\\OopBreakScan;\n$contents = file_get_contents(__FILE__);\n\
  $message = [];\nOopBreakScan::\n    scanMagicAutoloadFunction($contents, $message);\n\
  var_dump($message);\n```\n\n这里是 PHP 7 中运行的输出：\n\n```\nroot@php8_tips php7 [/repo/ch05\
  \ ]#\nphp php7_autoload_function.php\n/repo/ch05/php7_autoload_function.php:23:\n\
  array(1) {\n    [0] => string(96) \"WARNING: the \"__autoload()\" function is removed\
  \ in PHP 8: replace with \"spl_autoload_register()\"\"\n}\n```\n\n正如您从输出中看到的，Migration\\\
  OopBreakScan 类已被自动加载。我们知道这一点是因为调用了 scanMagicAutoloadFunction 方法，并且我们有其结果。此外，我们知道\
  \ Migration\\Base 类也被自动加载了。我们之所以知道这一点，是因为输出中出现的错误消息是超类的常量。\n\n然而，同一代码在 PHP 8 中运行会产生以下结果：\n\
  \n```\nroot@php8_tips php8 [/repo/ch05 ]#\nphp php7_autoload_function.php\nPHP Fatal\
  \ error: __autoload() is no longer supported, use spl_autoload_register() instead\
  \ in /repo/ch05/php7_autoload_function.php on line 4\n```\n\n这个结果并不令人惊讶，因为对魔术 __autoload()\
  \ 函数的支持已在 PHP 8 中移除。在 PHP 8 中，您必须改用 spl_autoload_register()。我们现在将注意力转向 spl_autoload_register()。\n\
  \n## 学习使用 spl_autoload_register()\n\nspl_autoload_register() 函数的主要优点是它允许您注册多个自动加载器。虽然这可能看起来有点过分，但想象一下这样的噩梦场景：您正在使用许多不同的开源\
  \ PHP 库……并且它们都有自己的自动加载器定义！只要所有此类库都使用 spl_autoload_register()，拥有多个自动加载器回调就不会有问题。\n\
  \n使用 spl_autoload_register() 注册的每个自动加载器必须是可调用的。以下任何一项都被视为可调用：\n\n- PHP 过程式函数\n-\
  \ 匿名函数\n- 可以以静态方式调用的类方法\n- 定义了 __invoke() 魔法方法的任何类实例\n- 这种形式的数组：[$instance, 'method']\n\
  \n> 提示\n> \n> Composer 维护自己的自动加载器，而它又依赖于 spl_autoload_register()。如果您使用 Composer\
  \ 管理开源 PHP 包，您只需在应用程序代码开始时包含 /path/to/project/vendor/autoload.php 即可使用 Composer\
  \ 自动加载器。要让 Composer 自动加载您的应用程序源代码文件，请在 composer.json 文件的 autoload : psr-4 键下添加一个或多个条目。有关更多信息，请参阅\
  \ https://getcomposer.org/doc/04-schema.md#psr-4。\n\n一个相当典型的自动加载器类可能如下所示。请注意，这是我们在本书中展示的许多\
  \ OOP 示例中使用的类：\n\n- 1. 在 __construct() 方法中，我们分配源目录。之后，我们使用上面提到的数组可调用语法调用 spl_autoload_register()：\n\
  \n// /repo/src/Server/Autoload/Loader.php\nnamespace Server\\Autoload;\nclass Loader\
  \ {\n    const DEFAULT_SRC = __DIR__ . '/../../';\n    public $src_dir = '';\n \
  \   public function __construct($src_dir = NULL) {\n\n```php\n$this->src_dir = $src_dir\n\
  ?? realpath(self::DEFAULT_SRC);\nspl_autoload_register([$this, 'autoload']);\n}\n\
  ```\n\n2. 实际的自动加载代码与我们在上面的 __autoload() 函数示例中展示的类似。以下是执行实际自动加载的方法：\n\n```php\npublic\
  \ function autoload($class) {\n    $fn = str_replace('\\\\', '/', $class);\n   \
  \ $fn = $this->src_dir . '/' . $fn . '.php';\n    $fn = str_replace('//', '/', $fn);\n\
  \    require_once($fn);\n}\n}\n```\n\n现在你已经对如何使用 spl_autoload_register() 函数有了一个概念，我们必须检查在运行\
  \ PHP 8 时可能出现的潜在代码中断。\n\n## PHP 8 中 spl_autoload_register() 的潜在代码中断\n\nspl_autoload_register()\
  \ 函数的第二个参数是一个可选的布尔值，默认为 FALSE。如果第二个参数设置为 TRUE，则在 PHP 7 及以下版本中，如果自动加载器注册失败，spl_autoload_register()\
  \ 函数会抛出一个 Exception。在 PHP 8 中，然而，如果第二个参数的数据类型不是 callable，则会抛出致命的 TypeError，而不管第二个参数的值如何！\n\
  \n下面所示的简单程序示例说明了这种危险。在此示例中，我们使用 spl_autoload_register() 函数注册一个不存在的 PHP 函数。我们将第二个参数设置为\
  \ TRUE：\n\n```php\n// /repo/ch05/php7_spl_spl_autoload_register.php\ntry {\n   \
  \ spl_autoload_register('does_not_exist', TRUE);\n    $data = ['A' => [1,2,3],'B'\
  \ => [4,5,6],'C' => [7,8,9]];\n    $response = new \\Application\\Strategy\\JsonResponse($data);\n\
  \    echo $response->render();\n} catch (Exception $e) {\n    echo \"A program error\
  \ has occurred\\n\";\n}\n```\n\n如果我们然后在 PHP 7 中运行这段代码，结果如下：\n\n```\nroot@php8_tips_php7\
  \ [ /repo/ch05 ]#\nphp php7_spl_spl_autoload_register.php\nA program error has occurred\n\
  ```\n\n如输出所示，会抛出一个 Exception。catch 块被调用，消息 A program error has occurred 出现。然而，当我们在\
  \ PHP 8 中运行相同的程序时，会抛出一个致命的 Error：\n\n```\nroot@php8_tips_php8 [ /repo/ch05 ]#\n\
  php php7_spl_spl_autoload_register.php\nPHP Fatal error: Uncaught TypeError: spl_autoload_register():\
  \ Argument #1 ($callback) must be a valid callback, no array or string given in\
  \ /repo/ch05/php7_spl_spl_autoload_register.php:12\n```\n\n显然，catch 块被绕过了，因为它设计用来捕获\
  \ Exception，而不是 Error。简单的解决方案是让 catch 块捕获 Throwable 而不是 Exception。这使得相同的代码可以在 PHP\
  \ 7 或 PHP 8 中运行\n\n以下是重写后的代码可能的样子。输出未显示，因为它与在 PHP 7 中运行的相同示例相同：\n\n```\n// /repo/ch05/php8_spl_spl_autoload_register.php\n\
  try {\n    spl_autoload_register('does_not_exist', TRUE);\n    $data = ['A' => [1,2,3],'B'\
  \ => [4,5,6],'C' => [7,8,9]];\n    $response = new \\Application\\Strategy\\JsonResponse($data);\n\
  \    echo $response->render();\n} catch (Throwable $e) {\n    echo \"A program error\
  \ has occurred\\n\";\n}\n```\n\n你现在对 PHP 8 的自动加载有了更好的理解，以及如何发现和纠正潜在的自动加载向后兼容性中断。现在让我们来看看\
  \ PHP 8 中与魔术方法相关的更改。\n\n## 导航魔术方法的更改\n\nPHP **魔法方法**是预定义的钩子，会中断 OOP 应用的正常流程。每个魔术方法，如果定义，会从对象实例创建的那一刻起改变应用程序的行为，直到实例\
  \ **超出作用域** 为止。\n\n> **重要提示**\n> 对象实例在被 unset 或覆盖时 *超出作用域*。对象实例也在定义在函数或类方法中，并且该函数或类方法的执行结束时超出作用域。最终，如果没有其他原因，对象实例会在\
  \ PHP 程序结束时超出作用域。\n\n本节将使你对 PHP 8 中引入的魔术方法使用和行为的重要更改有扎实的理解。一旦你理解本节中描述的情况，你将能够做出适当的代码修改，以防止在迁移到\
  \ PHP 8 时应用程序代码失败。\n\n让我们首先看看对象构造方法的更改。\n\n## 处理构造函数更改\n\n理想情况下，**类构造函数**是在对象实例创建时自动调用的方法，用于执行某种对象初始化。这种初始化最通常涉及使用作为参数提供给此方法的值填充对象属性。初始化还可以执行任何必要的任务，例如打开文件句柄、建立数据库连接等。\n\
  \n在 PHP 8 中，对类构造函数调用方式做了一些更改。这意味着在将应用程序迁移到 PHP 8 时存在向后兼容性中断的潜在风险。我们将首先检查的第一个更改与使用与类同名的方法作为类构造函数已弃用的用法有关。\n\
  \n## 处理方法与类同名更改\n\n在 PHP 4 版本中引入的第一个 PHP OOP 实现中，确定了与类同名的方法将承担类构造函数的角色，并在创建新对象实例时自动调用。\n\
  \n一个鲜为人知的事实是，即使在 PHP 8 中，函数、方法和甚至类名都是 *大小写不敏感* 的。因此 `$a = new ArrayObject();` 等同于\
  \ `$b = new arrayobject();`。另一方面，变量名是大小写敏感的。\n\n从 PHP 5 开始，随着一个新且更强大的 OOP 实现，魔术方法被引入。其中一个方法是\
  \ __construct()，专门保留用于类构造，设计用于取代旧的用法。使用与类同名的方法作为构造函数在 PHP 5 的剩余版本中得到支持，并且一直延续到 PHP\
  \ 7 的所有版本。\n\n在 PHP 8 中，对与类本身同名的类构造函数方法的支持已被移除。如果同时定义了 __construct() 方法，你将不会有问题：__construct()\
  \ 作为类构造函数具有优先权。如果没有 __construct() 方法，并且你检测到与类()同名的方法，你可能会失败。请记住，方法和类名都是大小写不敏感的！\n\
  \n看看下面的示例。它在 PHP 7 中有效，但在 PHP 8 中无效：\n\n- 1. 首先，我们定义一个 Text 类，其中有一个与类同名的类构造函数方法。构造函数方法基于提供的文件名创建一个\
  \ SplFileObject 实例：\n- 2. 然后我们添加三行过程式代码来使用该类，提供包含葛底斯堡演说的文件名：\n\n```\n// /repo/ch05/php8_oop_bc_break_construct.php\n\
  class Text {\n    public $fh = '';\n    public const ERROR_FN = 'ERROR: file not\
  \ found';\n    public function text(string $fn) {\n        if (!file_exists($fn))\n\
  \            throw new Exception(self::ERROR_FN);\n        $this->fh = new SplFileObject($fn,\
  \ 'r');\n    }\n    public function getText() {\n        return $this->fh->fpassthru();\n\
  \    }\n}\n```\n\n```\n$fn   = __DIR__ . '../sample_data/gettysburg.txt';\n$text\
  \ = new Text($fn);\necho $text->getText();\n```\n\n- 3. 在 PHP 7 中运行程序首先会产生一个弃用通知，然后是预期的文本。这里仅显示输出的前几行：\n\
  \n```\nroot@php8_tips_php7 [ /repo/ch05 ]#\nphp php8_bc_break_construct.php\nPHP\
  \ Deprecated: Methods with the same name as their class will not be constructors\
  \ in a future version of PHP; Text has a deprecated constructor in /repo/ch05/php8_bc_break_construct.php\
  \ on line 4\n\nFourscore and seven years ago our fathers brought forth on this continent\
  \ a new nation, conceived in liberty and dedicated to the proposition that all men\
  \ are created equal. ... <remaining text not shown>\n```\n\n- 4. 然而，在 PHP 8 中运行相同的程序时，会抛出致命的\
  \ Error，如此输出所示：\n\n```\nroot@php8_tips_php8 [ /repo/ch05 ]# php php8_bc_break_construct.php\n\
  PHP Fatal error: Uncaught Error: Call to a member function fpassthru() on string\
  \ in /repo/ch05/php8_bc_break_construct.php:16\n```\n\n需要注意的是，PHP 8 中显示的错误并没有告诉你程序失败的真正原因。因此，极其重要的是你扫描你的\
  \ PHP 应用程序，特别是旧的应用程序，以查看是否存在与类同名的方法。因此，最佳实践是简单地将与类同名的方法重命名为 __construct()。\n\n现在让我们看看\
  \ PHP 8 中如何解决类构造函数中处理 Exception 和 exit 的不一致问题。\n\n## 解决类构造函数中的不一致问题\n\nPHP 8 中解决的另一个问题与类构造方法要么抛出\
  \ Exception，要么执行 exit() 的情况有关。在 PHP 8 之前的版本中，如果在类构造函数中抛出 Exception，则如果定义了 __destruct()\
  \ 方法，则不会调用它。另一方面，如果在构造函数中使用 exit() 或 die()（这两个 PHP 函数彼此等效），则会调用 __destruct() 方法。在\
  \ PHP 8 中，此不一致性得到解决。现在，在任何一种情况下，__destruct() 方法都不会被调用。\n\n\n\n你可能会想知道为什么这很重要。你需要了解这一重要变更的原因在于，你可能在\
  \ __destruct() 方法中存在逻辑，而该方法在你同时调用 exit() 或 die() 的情况下会被调用。在 PHP 8 中，你已无法再依赖这段代码，这可能会导致向后兼容性破坏。\n\
  \n在此示例中，我们有两个连接类。ConnectPdo 使用 PDO 扩展来提供查询结果，而 ConnectMysqli 使用 MySQLi 扩展：\n\n-\
  \ 1. 我们首先定义一个指定查询方法的接口。该方法需要一个 SQL 字符串作为参数，并预期返回一个数组作为结果：\n- 2. 接下来，我们定义一个基类，其中定义了\
  \ __destruct() 魔术方法。由于该类实现了 ConnectInterface 但未定义 query()，因此被标记为抽象类：\n- 3. 接下来，我们定义\
  \ ConnectPdo 类。它继承自 Base，其 query() 方法使用 PDO 语法生成结果。__construct() 方法在创建连接出现问题时会抛出\
  \ PDOException：\n\n// /repo/src/Php7/Connector/ConnectInterface.php\nnamespace Php7\\\
  Connector;\ninterface ConnectInterface {\n    public function query(string $sql)\
  \ : array;\n}\n\n// /repo/src/Php7/Connector/Base.php\nnamespace Php7\\Connector;\n\
  abstract class Base implements ConnectInterface {\n    const CONN_TERMINATED = 'Connection\
  \ Terminated';\n    public $conn = NULL;\n    public function __destruct() {\n \
  \       $message = get_class($this)\n            . ':' . self::CONN_TERMINATED;\n\
  \        error_log($message);\n    }\n}\n```php\n// /repo/src/Php7/Connector/ConnectPdo.php\n\
  namespace Php7\\Connector;\nuse PDO;\nclass ConnectPdo extends Base {\n    public\
  \ function __construct(\n        string $dsn, string $usr, string $pwd) {\n    \
  \    $this->conn = new PDO($dsn, $usr, $pwd);\n    }\n    public function query(string\
  \ $sql) : array {\n        $stmt = $this->conn->query($sql);\n        return $stmt->fetchAll(PDO::FETCH_ASSOC);\n\
  \    }\n}\n```\n- 4. 以类似的方式，我们定义 ConnectMysqli 类。它继承自 Base，其 query() 方法使用 MySQLi\
  \ 语法生成结果。__construct() 方法在创建连接出现问题时会执行 die()：\n```php\n// /repo/src/Php7/Connector/ConnectMysqli.php\n\
  namespace Php7\\Connector;\nclass ConnectMysqli extends Base {\n    public function\
  \ __construct(\n        string $db, string $usr, string $pwd) {\n        $this->conn\
  \ = mysqli_connect('localhost',\n            $usr, $pwd, $db)\n            or die(\"\
  Unable to Connect\\n\");\n    }\n    public function query(string $sql) : array\
  \ {\n        $result = mysqli_query($this->conn, $sql);\n        return mysqli_fetch_all($result,\
  \ MYSQLI_ASSOC);\n    }\n}\n```\n- 5. 最后，我们定义一个调用程序，使用前面描述的两个连接类，并为连接字符串、用户名和密码定义无效值：\n\
  ```php\n// /repo/ch05/php8_bc_break_destruct.php\ninclude __DIR__ . '/../../vendor/autoload.php';\n\
  use Php7\\Connector\\{ConnectPdo,ConnectMysqli};\n$db = 'test';\n$usr = 'fake';\n\
  $pwd = 'xyz';\n$dsn = 'mysql:host=localhost;dbname=' . $db;\n$sql = 'SELECT event_name,\
  \ event_date FROM events';\n$ptn = \"%2d : %s : %s\\n\";\ntry {\n    $conn = new\
  \ ConnectPdo($dsn, $usr, $pwd);\n    var_dump($conn->query($sql));\n} catch (Throwable\
  \ $t) {\n    printf($ptn, __LINE__, get_class($t),\n        $t->getMessage());\n\
  }\n$conn = new ConnectMysqli($db, $usr, $pwd);\nvar_dump($conn->query($sql));\n\
  ```\n- 6. 接下来，在调用程序中，我们调用这两个类并尝试执行查询。连接故意失败，因为我们提供了错误的用户名和密码：\n- 7. 如上文讨论所述，PHP\
  \ 7 中运行的输出显示，在创建 ConnectPdo 实例时，PDOException 从类构造函数中抛出。另一方面，当 ConnectMysqli 实例失败时，会调用\
  \ die()，并显示消息 Unable to Connect。你还会在输出的最后一行看到来自 __destruct() 方法的错误日志信息。以下是该输出：\n\
  ```\nroot@php8_tips_php7 [ /repo/ch05 ]#\nphp php8_bc_break_destruct.php\n15 : PDOException\
  \ : SQLSTATE[28000] [1045] Access denied for user 'fake'@'localhost' (using password:\
  \ YES)\nPHP Warning: mysqli_connect(): (HY000/1045): Access denied for user 'fake'@'localhost'\
  \ (using password: YES) in /repo/src/Php7/Connector/ConnectMysqli.php on line 8\n\
  Unable to Connect\nPhp7\\Connector\\ConnectMysqli:Connection Terminated\n```\n-\
  \ 8. 在 PHP 8 中，无论哪种情况 __destruct() 方法都不会被调用，从而产生此处所示的输出。如输出所示，PDOException 被捕获，并且发出\
  \ die() 命令。__destruct() 方法没有任何输出。以下是 PHP 8 的输出：\n```\nroot@php8_tips_php8 [ /repo/ch05\
  \ ]#\nphp php8_bc_break_destruct.php\n15 : PDOException : SQLSTATE[28000] [1045]\
  \ Access denied for user 'fake'@'localhost' (using password: YES)\nPHP Warning:\
  \  mysqli_connect(): (HY000/1045): Access denied for user 'fake'@'localhost' (using\
  \ password: YES) in /repo/src/Php7/Connector/ConnectMysqli.php on line 8\nUnable\
  \ to Connect\n```\n现在你已经知道如何识别与 __destruct() 方法以及对 die() 或 exit() 的调用相关的潜在代码破坏问题，让我们将注意力转向\
  \ __toString() 方法的变更。\n\n## 处理 __toString() 的变更\n\n__toString() 魔术方法在对象作为字符串使用时被调用。一个经典的例子是当你简单地\
  \ echo 一个对象时。echo 命令期望一个字符串作为参数。当提供非字符串数据时，PHP 会执行类型转换以将数据转换为字符串。由于对象不能直接转换为字符串，PHP\
  \ 引擎随后会检查是否定义了 __toString()，如果是，则返回其值。\n\n此魔术方法的主要变更是引入了 Stringable，这是一个全新的接口。新的接口定义如下：\n\
  ```\ninterface Stringable {\n    public function __toString(): string;\n}\n```\n\
  在 PHP 8 中定义了 __toString() 魔术方法的任何类都会静默实现 Stringable 接口。这种新行为不会带来严重的代码破坏风险。然而，由于类现在实现了\
  \ Stringable 接口，你不再允许修改 __toString() 方法的签名。\n\n下面是一个简短的示例，揭示了与 Stringable 接口的新关联：\n\
  - 1. 在此示例中，我们定义一个定义了 __toString() 的 Test 类：\n- 2. 然后我们创建该类的一个实例，随后创建一个 ReflectionObject\
  \ 实例：\n// /repo/ch05/php8_bc_break_magic_to_string.php\nclass Test {\n    public\
  \ $fname = 'Fred';\n    public $lname = 'Flintstone';\n    public function __toString()\
  \ : string {\n        return $this->fname . ' ' . $this->lname;\n    }\n}\n```\n\
  $test = new Test;\n$reflect = new ReflectionObject($test);\necho $reflect;\n```\n\
  在 PHP 7 中运行的输出（此处显示）的前几行只是表明它是一个 Test 类的实例：\n```\nroot@php8_tips_php7 [ /repo/ch05\
  \ ]#\nphp php8_bc_break_magic_to_string.php\nObject of class [ <user> class Test\
  \ ] {\n@@ /repo/ch05/php8_bc_break_magic_to_string.php 3-12\n```\n然而，在 PHP 8 中运行相同的代码示例，会揭示与\
  \ Stringable 接口的隐式关联：\n```\nroot@php8_tips_php8 [ /repo/ch05 ]#\nphp php8_bc_break_magic_to_string.php\n\
  Object of class [ <user> class Test implements Stringable ] {\n@@ /repo/ch05/php8_bc_break_magic_to_string.php\
  \ 3-12\n```\n输出显示，即使你没有显式实现 Stringable 接口，该关联也在运行时创建，并由 ReflectionObject 实例揭示。\n\
  \n> **提示**\n> 有关魔术方法的更多信息，请查看此文档页面：https://www.php.net/manual/en/language.oop5.magic.php。\n\
  \n现在你已经了解了涉及魔术方法的 PHP 8 代码可能导致代码破坏的情况，让我们来看看序列化过程中的变更。\n\n## 控制序列化\n\n在许多情况下，原生的\
  \ PHP 数据需要存储在文件中或数据库表中。当前技术的难题在于，直接存储复杂 PHP 数据（如对象或数组）是不可能的，除非有某些例外情况。\n\n克服这一限制的一种方法是把对象或数组转换为字符串。**JSON（JavaScript\
  \ 对象表示法）**常因此原因而被选用。一旦数据被转换为字符串，就能轻松存储在任何文件或数据库中。然而，使用 JSON 格式化对象存在问题。虽然 JSON 足以很好地表示对象属性，但它无法直接恢复原始对象的类和方法。\n\
  \n为解决这一不足，PHP 语言包含两个原生函数，`serialize()` 和 `unserialize()`，它们可以轻松地将对象或数组转换为字符串并恢复到原始状态。尽管听起来很棒，但原生\
  \ PHP 序列化存在一些问题。\n\n在我们正确讨论现有 PHP 序列化架构的问题之前，我们需要更仔细地了解原生 PHP 序列化是如何工作的。\n\n## 理解\
  \ PHP 序列化\n\n当 PHP 对象或数组需要保存到非面向对象环境（如平面文件或关系数据库表）时，可以使用 `serialize()` 将对象或数组 *展平*\
  \ 为适合存储的字符串。相反，`unserialize()` 会恢复原始对象或数组。\n\n\n\n这里有一个简单的示例来演示这一概念：\n\n- 1. 首先，我们定义一个包含三个属性的类：\n\
  - 2. 然后我们创建一个实例，序列化该实例并显示结果字符串：\n- 3. 序列化后的对象如下所示：\n- 4. 然后我们将对象反序列化到一个新变量中，并使用\
  \ var_dump() 来检查两者：\n\n// /repo/ch05/php8_serialization.php\nclass Test {\n    public\
  \ $name = 'Doug';\n    private $key = 12345;\n    protected $status = ['A','B','C'];\n\
  }\n```\n\n```\n$test = new Test();\n$str = serialize($test);\necho $str . \"\\n\"\
  ;\n```\n\n```\nO:4:\"Test\":3:{s:4:\"name\";s:4:\"Doug\";s:9:\"Testkey\";\ni:12345;\n\
  s:9:\"*status\";a:3:{i:0;s:1:\"A\";i:1;s:1:\"B\";i:2;s:1:\"C\";}}\n```\n\n正如序列化字符串所示，字母\
  \ O 表示对象，a 表示数组，s 表示字符串，i 表示整数。\n\n```\n$obj = unserialize($str);\nvar_dump($test,\
  \ $obj);\n```\n\n5. 将 var_dump() 输出并排放置，可以清楚地看到恢复后的对象与原始对象完全相同：\n\n```\nobject(Test)#1\
  \ (3) {\n  [\"name\"]=> string(4)\n  \"Doug\"\n  [\"key\":\"Test\":private]=> int(12345)\n\
  \  [\"status\":protected]=>\n  array(3) {\n    [0]=> string(1)\n    \"A\"\n    [1]=>\
  \ string(1)\n    \"B\"\n    [2]=> string(1)\n    \"C\"\n  }\n}\n```\n\n```\nobject(Test)#2\
  \ (3) {\n  [\"name\"]=> string(4)\n  \"Doug\"\n  [\"key\":\"Test\":private]=> int(12345)\n\
  \  [\"status\":protected]=>\n  array(3) {\n    [0]=> string(1)\n    \"A\"\n    [1]=>\
  \ string(1)\n    \"B\"\n    [2]=> string(1)\n    \"C\"\n  }\n}\n```\n\n现在让我们来看一下提供旧版\
  \ PHP 序列化支持的魔术方法：__sleep() 和 __wakeup()。\n\n## 了解 __sleep() 魔术方法\n\n__sleep() 魔术方法的目的是提供一个过滤器，用于防止某些属性出现在序列化字符串中。以用户对象为例，你可能希望从序列化中排除敏感属性，例如国家识别号码、信用卡号码或密码。\n\
  \n以下是使用 __sleep() 魔术方法排除密码的示例：\n\n- 1. 首先，我们定义一个包含三个属性的 Test 类：\n\n// /repo/ch05/php8_serialization_sleep.php\n\
  class Test {\n    public $name = 'Doug';\n    protected $key = 12345;\n    protected\
  \ $password = '$2y$10$ux07vQNSA0ctbzZcZNA' .\n        '1xOa8hi6kchJrJZzqWcxpw/XQUjSNqacx.';\n\
  }\n```\n\n2. 然后我们定义一个 __sleep() 方法来排除 $password 属性：\n\n```\npublic function __sleep()\
  \ {\n    return ['name','key'];\n}\n}\n```\n\n3. 然后我们创建该类的一个实例并对其进行序列化。最后一行会输出序列化字符串的状态：\n\
  \n```\n$test = new Test();\n$str = serialize($test);\necho $str . \"\\n\";\n```\n\
  \n4. 在输出中，你可以清楚地看到 $password 属性不存在。以下是输出：\n\n```\nO:4:\"Test\":2:{s:4:\"name\";s:4:\"\
  Doug\",s:6:\"*key\";i:12345;}\n```\n\n这很重要，因为在大多数情况下，你需要序列化对象的理由是希望将其存储在某处，无论是会话文件还是数据库。如果文件系统或数据库随后被攻破，你就少了一个需要担心的安全漏洞！\n\
  \n## 了解 __sleep() 方法中的潜在代码破坏\n\n存在一个涉及 __sleep() 魔术方法的潜在代码破坏。在 PHP 8 之前的版本中，如果 __sleep()\
  \ 返回一个包含不存在属性的数组，它们仍会被序列化并赋值为 NULL。这种方法的问题在于，当对象随后被反序列化时，一个额外的属性会出现，而该属性按设计本不应存在！\n\
  \n在 PHP 8 中，__sleep() 魔术方法返回中不存在的属性会被静默忽略。如果你的旧代码预期旧行为并采取措施删除不需要的属性，甚至更糟，如果你的代码假设不需要的属性存在，你最终会遇到错误。这种假设极其危险，因为它们可能导致意外的代码行为。\n\
  \n为了说明这个问题，请看以下代码示例：\n\n1. 首先，我们定义一个 Test 类，其 __sleep() 返回一个不存在的变量：\n\n```\nclass\
  \ Test {\n    public $name = 'Doug';\n    public function __sleep() {\n        return\
  \ ['name', 'missing'];\n    }\n}\n```\n\n2. 接下来，我们创建一个 Test 实例并对其进行序列化：\n\n```\n\
  echo \"Test instance before serialization:\\n\";\n$test = new Test();\nvar_dump($test);\n\
  ```\n\n3. 然后我们将字符串反序列化为一个新的实例，$restored：\n\n```\necho \"Test instance after serialization:\\\
  n\";\n$stored = serialize($test);\n$restored = unserialize($stored);\nvar_dump($restored);\n\
  ```\n\n4. 理论上，两个对象实例 $test 和 $restored 应该相同。然而，请看在 PHP 7 中运行的输出：\n\n```\nroot@php8_tips_php7\
  \ [ /repo/ch05 ]#\nphp php8_bc_break_sleep.php\nTest instance before serialization:\n\
  /repo/ch05/php8_bc_break_sleep.php:13:\nclass Test#1 (1) {\n    public $name =>\
  \ string(4) \"Doug\"\n}\nTest instance after serialization:\nPHP Notice: serialize():\
  \ \"missing\" returned as member variable from __sleep() but does not exist in /repo/ch05/php8_bc_break_sleep.php\
  \ on line 16\nclass Test#2 (2) {\n    public $name => string(4) \"Doug\"\npublic\
  \ $missing => NULL\n}\n```\n\n5. 正如输出所示，两个对象显然 *not* 相同！然而，在 PHP 8 中，不存在的属性会被忽略。请看同一脚本在\
  \ PHP 8 中运行的情况：\n\n```\nroot@php8_tips_php8 [ /repo/ch05 ]# php php8_bc_break_sleep.php\n\
  Test instance before serialization:\nobject(Test)#1 (1) {\n  [\"name\"]=> string(4)\
  \ \"Doug\"\n}\nTest instance after serialization:\nPHP Warning: serialize(): \"\
  missing\" returned as member variable from __sleep() but does not exist in /repo/ch05/php8_bc_break_sleep.php\
  \ on line 16\nobject(Test)#2 (1) {\n  [\"name\"]=> string(4) \"Doug\"\n}\n```\n\n\
  你可能还会注意到，在 PHP 7 中会发出 Notice，而在 PHP 8 中，同样的情况会产生 Warning。在这种情况下进行迁移前的检查以发现潜在的代码破坏是困难的，因为你需要确定，如果魔术方法\
  \ __sleep() 已定义，列表中是否包含不存在的属性。\n\n现在让我们来看一下对应的方法，__wakeup()。\n\n## 了解 __wakeup()\n\
  \n__wakeup() 魔术方法的主要目的是对反序列化后的对象执行额外的初始化。例如恢复数据库连接或重新建立文件句柄。以下是一个非常简单的示例，使用 __wakeup()\
  \ 魔术重新打开文件句柄：\n\n- 1. 首先，我们定义一个在实例化时打开文件句柄的类。我们还定义了一个返回文件内容的方法：\n\n// /repo/ch05/php8_serialization_wakeup.php\n\
  class Gettysburg {\n    public $fn = __DIR__ . '/gettysburg.txt';\n    public $obj\
  \ = NULL;\n    public function __construct() {\n        $this->obj = new SplFileObject($this->fn,\
  \ 'r');\n    }\n    public function getText() {\n        $this->obj->rewind();\n\
  \        return $this->obj->fpassthru();\n    }\n}\n```\n\n2. 要使用该类，创建一个实例并运行 getText()。（这假定\
  \ $this->fn 引用的文件存在！）\n\n```\n$old = new Gettysburg();\necho $old->getText();\n\
  ```\n\n3. 输出（未显示）是葛底斯堡演说。\n\n4. 如果我们现在尝试序列化此对象，就会遇到问题。以下是会序列化对象的代码示例：\n\n```\n$str\
  \ = serialize($old);\n```\n\n5. 在此阶段，运行目前的代码，输出如下：\n\n```\nPHP Fatal error: Uncaught\
  \ Exception: Serialization of 'SplFileObject' is not allowed in /repo/ch05/php8_serialization_wakeup.php:19\n\
  ```\n\n6. 为了解决这个问题，我们回到类中并添加一个 __sleep() 方法，防止 SplFileObject 实例被序列化：\n\n```\npublic\
  \ function __sleep() {\n    return ['fn'];\n}\n```\n\n7. 如果我们随后重新运行代码来序列化对象，一切正常。以下是反序列化和调用\
  \ getText() 的代码：\n\n```\n$str = serialize($old);\n$new = unserialize($str);\necho\
  \ $new->getText();\n```\n\n\n\n8. 然而，如果我们随后尝试反序列化该对象，会出现另一个错误：\n\n```\nPHP Fatal\
  \ error: Uncaught Error: Call to a member function rewind() on null in /repo/ch05/php8_serialization_wakeup.php:13\n\
  ```\n\n当然，问题是文件句柄在序列化过程中丢失了。当对象被反序列化时，__construct() 方法未被调用。\n\n9. 这正是 __wakeup()\
  \ 魔术方法存在的目的。为了解决此错误，我们定义一个 __wakeup() 方法来调用 __construct() 方法：\n\n```\npublic function\
  \ __wakeup() {\n    self::__construct();\n}\n```\n\n10. 如果我们重新运行代码，现在会看到葛底斯堡演说两次（未显示）。\n\
  \n现在你对 PHP 原生序列化的工作原理有了大致了解，并且也对 __sleep() 和 __wakeup() 魔术方法以及潜在的代码破坏有所了解。让我们现在来看一个旨在促进对象自定义序列化的接口。\n\
  \n## 介绍 Serializable 接口\n\n为了便于对象的序列化，Serializable 接口从 PHP 5.1 开始被添加到语言中。该接口背后的想法是提供一种识别能够自行序列化的对象的方法。此外，该接口指定的方法旨在提供一定程度的对象序列化控制。\n\
  \n只要一个类实现了该接口，开发人员就可以确保定义了两个方法：serialize() 和 unserialize()。以下是接口定义：\n\n```\ninterface\
  \ Serializable {\n    public function serialize(): string|null\n    public function\
  \ unserialize(string $serialized): void\n}\n```\n\n任何实现该接口的类，其自定义的 serialize() 和\
  \ unserialize() 方法都会在原生序列化和反序列化期间自动调用。为了说明此技术，请考虑以下示例：\n\n- 1. 首先，我们定义一个实现 Serializable\
  \ 接口的类。该类定义了三个属性——两个为字符串类型，另一个表示日期和时间：\n- 2. 然后我们定义一个自定义的 serialize() 方法，在序列化对象属性之前初始化日期和时间。unserialize()\
  \ 方法将值恢复到所有属性：\n- 3. 然后我们创建一个实例并使用 var_dump() 检查其内容：\n- 4. var_dump() 的输出显示 u 属性尚未初始化：\n\
  \n// /repo/ch05/php8_bc_break_serializable.php\nclass A implements Serializable\
  \ {\n    private $a = 'A';\n    private $b = 'B';\n    private $u = NULL;\n}\n```\n\
  \n```\npublic function serialize() {\n    $this->u = new DateTime();\n    return\
  \ serialize(get_object_vars($this));\n}\npublic function unserialize($payload) {\n\
  \    $vars = unserialize($payload);\n    foreach ($vars as $key => $val)\n     \
  \   $this->$key = $val;\n}\n```\n\n```\n$a1 = new A();\nvar_dump($a1);\n```\n\n\
  ```\nobject(A)#1 (3) {\n  [\"a\":\"A\":private]=> string(1) \"A\"\n  [\"b\":\"A\"\
  :private]=> string(1) \"B\"\n  [\"u\":\"A\":private]=> NULL\n}\n```\n\n- 5. 然后我们对其进行序列化，并将其恢复到变量\
  \ $a2：\n\n```\n$str = serialize($a1);\n$a2 = unserialize($str);\nvar_dump($a2);\n\
  ```\n\n- 6. 从下面的 var_dump() 输出中，你可以看到对象已完全恢复。此外，我们知道自定义 serialize() 方法已被调用，因为 u\
  \ 属性已使用日期和时间值初始化。以下是输出：\n\n```\nobject(A)#3 (3) {\n  [\"a\":\"A\":private]=> string(1)\
  \ \"A\"\n  [\"b\":\"A\":private]=> string(1) \"B\"\n  [\"u\":\"A\":private]=> object(DateTime)#4\
  \ (3) {\n    [\"date\"]=> string(26) \"2021-02-12 05:35:10.835999\"\n    [\"timezone_type\"\
  ]=> int(3)\n    [\"timezone\"]=> string(3) \"UTC\"\n  }\n}\n```\n\n让我们现在来看一下实现 Serializable\
  \ 接口的对象的序列化过程中的问题。\n\n## 检查 PHP 可序列化接口问题\n\n早期序列化方法存在一个整体问题。如果要序列化的类定义了 __wakeup()\
  \ 魔术方法，它并不会在反序列化时立即调用。相反，任何已定义的 __wakeup() 魔术方法首先会被排队，整个对象链被反序列化，然后队列中的方法才会被执行。这可能导致对象的\
  \ unserialize() 方法所看到的内容与队列中的 __wakeup() 方法所看到的内容不匹配。\n\n这种架构缺陷可能导致在使用实现 Serializable\
  \ 接口的对象时出现不一致的行为和模糊的结果。许多开发者认为 Serializable 接口严重损坏，因为在嵌套对象序列化发生时需要创建反向引用。这种需求出现在嵌套序列化调用发生的情况中。\n\
  \n例如，当一个类定义的方法进而调用 PHP serialize() 函数时，就可能发生此类嵌套调用。在 PHP 8 之前，反向引用的创建顺序在 PHP 序列化中是预设的，可能导致连锁故障的雪崩。\n\
  \n解决方案是使用两个新的魔术方法来完全控制序列化和反序列化顺序，接下来将介绍。\n\n## 新的魔术方法来控制 PHP 序列化\n\n一种新的序列化控制方式首次在\
  \ PHP 7.4 中引入并延续到 PHP 8。为了利用这项新技术，你需要做的就是实现两个魔术方法：__serialize() 和 __unserialize()。如果实现了，PHP\
  \ 将序列化的控制完全交给 __serialize() 方法。同样，反序列化的控制完全由 __unserialize() 魔术方法控制。如果定义了 __sleep()\
  \ 和 __wakeup() 方法，则会被忽略。\n\n作为进一步的好处，PHP 8 在以下 SPL 类中提供了对这两个新魔术方法的完全支持：\n\n- ArrayObject\n\
  - ArrayIterator\n- SplDoublyLinkedList\n- SplObjectStorage\n\n> **最佳实践**\n> \n>\
  \ 为了完全控制序列化，请实现新的 __serialize() 和 __unserialize() 魔术方法。你不再需要实现 Serializable 接口，也不再需要定义\
  \ __sleep() 和 __wakeup()。有关 Serializable 接口最终弃用的更多信息，请参阅此 RFC：\n> https://wiki.php.net/rfc/phase_out_serializable.\n\
  \n作为新的 PHP 序列化用法的示例，请考虑以下代码示例：\n\n- 1. 在示例中，Test 类在实例化时使用随机密钥进行初始化：\n\n// /repo/ch05/php8_bc_break_serialization.php\n\
  class Test extends ArrayObject {\n    protected $id = 12345;\n    public $name =\
  \ 'Doug';\nprivate $key = '';\npublic function __construct() {\n    $this->key =\
  \ bin2hex(random_bytes(8));\n}\n}\n```\n\n- 2. 我们添加一个 getKey() 方法来显示当前密钥值：\n\n```\n\
  public function getKey() {\n    return $this->key;\n}\n```\n\n- 3. 序列化时，密钥会被从结果字符串中过滤掉：\n\
  \n```\npublic function __serialize() {\n    return ['id' => $this->id,\n       \
  \ 'name' => $this->name];\n}\n```\n\n- 4. 反序列化时，会生成一个新的密钥：\n\n```\npublic function\
  \ __unserialize($data) {\n    $this->id = $data['id'];\n    $this->name = $data['name'];\n\
  \    $this->__construct();\n}\n```\n\n- 5. 我们现在创建一个实例，并显示密钥：\n\n```\n$test = new\
  \ Test();\necho \"\\nOld Key: \" . $test->getKey() . \"\\n\";\n```\n\n密钥可能如下所示：\n\
  \n```\nOld Key: mXq78Dhp1ByDWuPtzK820g==\n```\n\n- 6. 我们添加代码来序列化对象并显示字符串：\n\n```\n\
  $str = serialize($test);\necho $str . \"\\n\";\n```\n\n序列化字符串可能如下所示：\n\n```\nO:4:\"\
  Test\":2:{s:2:\"id\";i:12345;s:4:\"name\";s:4:\"Doug\";}\n```\n\n请注意输出中秘密未出现在序列化字符串中。这很重要，因为如果序列化字符串的存储位置被攻破，可能会暴露安全漏洞，给攻击者提供入侵系统的途径。\n\
  \n- 7. 然后我们添加代码来反序列化字符串并显示密钥：\n\n```\n$obj = unserialize($str);\necho \"New Key:\
  \ \" . $obj->getKey() . \"\\n\";\n```\n\n这是最后的输出。请注意，已生成新的密钥：\n\n```\nNew Key: kDgU7FGfJn5q1OKcHEbyqQ==\n\
  ```\n\n如你所见，使用新的 PHP 序列化功能并不复杂。任何时序问题现在完全在你的控制之下，因为新的魔术方法是在对象被序列化和反序列化的顺序中执行的。\n\
  \n> **重要说明**\n> PHP 7.4 及以上版本*理解*来自旧版本 PHP 的序列化字符串，然而，由 PHP 7.4 或 8.x 序列化的字符串可能无法被旧版本\
  \ PHP 正确反序列化。\n\n> **提示**\n> 有关完整讨论，请参阅有关自定义序列化的 RFC：\n> https://wiki.php.net/rfc/custom_object_serialization\n\
  \n你现在对 PHP 序列化以及两个新魔术方法提供的改进支持有了全面的了解。现在是时候转换思路，检查 PHP 8 如何扩展方差支持。\n\n\n\n## 理解\
  \ PHP 8 扩展的方差支持\n\n方差的概念是 OOP 的核心。**Variance** 是一个总称，涵盖了各种 **subtypes** 之间的相互关系。约\
  \ 20 年前，一对早期的计算机科学家 Wing 和 Liskov 提出了一个重要的定理，它是 OOP 子类型核心，现在被称为 **the Liskov Substitution\
  \ Principle.**\n\n不深入精确的数学，这条原则可以概括如下：\n\n> *如果可以将 X 类的实例替换为 Y 类的实例，并且应用程序的行为在任何方面都不发生变化，则可以认为\
  \ X 类是 Y 类的子类型。*\n\n> **提示**\n> \n> 最初描述并提供了里氏替换原则精确数学公式化定义的论文可以在这里找到：*子类型的行为概念*，ACM\
  \ 程序设计语言和系统汇刊，由 B. Liskov 和 J. Wing 撰写，1994 年 11 月 (https://dl.acm.org/doi/10.1145/197320.197383)。\n\
  \n在本节中，我们将研究 PHP 8 如何以 **covariant returns** 和 **contravariant parameters** 的形式提供增强的方差支持。理解协变和逆变将提高你编写良好稳健代码的能力。没有这种理解，你的代码可能会产生不一致的结果并成为许多错误的来源。\n\
  \n让我们先介绍协变返回。\n\n### 理解协变返回\n\nPHP 中的协变支持旨在保留从最具体到最一般的类型的顺序。这种经典示例体现在 `try` / `catch`\
  \ 块的构建方式中：\n\n- 1. 在此示例中，`try` 块内创建了一个 PDO 实例。接下来的两个 `catch` 块首先查找 `PDOException`。之后是第二个\
  \ `catch` 块，它捕获实现 `Throwable` 的任何类。因为 PHP 的 `Exception` 和 `Error` 类都实现了 `Throwable`，第二个\
  \ `catch` 块最终成为除 `PDOException` 之外的任何错误的后备：\n\n```php\ntry {\n    $pdo = new PDO($dsn,\
  \ $usr, $pwd, $opts);\n} catch (PDOException $p) {\n    error_log('Database Error:\
  \ ' . $p->getMessage());\n} catch (Throwable $t) {\n    error_log('Unknown Error:\
  \ ' . $t->getMessage());\n}\n```\n\n- 2. 在此示例中，如果由于无效参数导致 PDO 实例失败，错误日志将具有条目 **Database\
  \ Error**，后跟从 PDOException 获取的消息。\n\n- 3. 另一方面，如果发生其他一般错误，错误日志将具有条目 **Unknown Error**，后跟来自其他\
  \ Exception 或 Error 类的消息。\n\n- 4. 在此示例中，catch 块的顺序被反转：\n\n```php\ntry {\n    $pdo\
  \ = new PDO($dsn, $usr, $pwd, $opts);\n} catch (Throwable $t) {\n    error_log('Unknown\
  \ Error: ' . $t->getMessage());\n} catch (PDOException $p) {\n    error_log('Database\
  \ Error: ' . $p->getMessage());\n}\n```\n\n- 5. 由于 PHP 协变支持的工作方式，第二个 catch 块永远不会被调用。相反，源自此代码块的所有错误日志条目都将以\
  \ **Unknown Error** 开头。\n\n现在让我们看看 PHP 协变支持如何应用于对象方法返回数据类型：\n\n- 1. 首先，我们定义一个接口\
  \ FactoryInterface，它标识一个方法 make()。此方法接受数组作为参数，并预期返回 ArrayObject 类型的对象：\n\n```php\n\
  interface FactoryInterface {\n    public function make(array $arr): ArrayObject;\n\
  }\n```\n\n- 2. 接下来，我们定义一个 ArrTest 类，它扩展了 ArrayObject：\n\n```php\nclass ArrTest extends\
  \ ArrayObject {\n    const DEFAULT_TEST = 'This is a test';\n}\n```\n\n- 3. ArrFactory\
  \ 类实现了 FactoryInterface 并完全定义了 make() 方法。注意，此方法返回的是 ArrTest 数据类型而不是 ArrayObject：\n\
  \n```php\nclass ArrFactory implements FactoryInterface {\n    protected array $data;\n\
  \    public function make(array $data): ArrTest {\n        $this->data = $data;\n\
  \        return new ArrTest($this->data);\n    }\n}\n```\n\n- 4. 在过程调用代码块中，我们创建\
  \ ArrFactory 的一个实例，并两次运行其 make() 方法，理论上产生两个 ArrTest 实例。然后我们使用 var_dump() 来揭示两个生成对象的当前状态：\n\
  \n```php\n$factory = new ArrFactory();\n$obj1 = $factory->make([1,2,3]);\n$obj2\
  \ = $factory->make(['A','B','C']);\nvar_dump($obj1, $obj2);\n```\n\n- 5. 在 PHP 7.1\
  \ 中，由于它不支持协变返回数据类型，会抛出致命 Error。输出显示，方法返回类型声明与 FactoryInterface 中定义的不匹配：\n\n```php\n\
  root@php8_tips_php7 [/repo/ch05 ]#\nphp php8_variance_covariant.php\nPHP Fatal error:\
  \  Declaration of ArrFactory::make(array $data): ArrTest must be compatible with\n\
  FactoryInterface::make(array $arr): ArrayObject in /repo/\nch05/php8_variance_covariant.php\
  \ on line 9\n```\n\n- 6. 当我们在 PHP 8 中运行相同的代码时，你可以看到为返回类型提供了协变支持。执行不受阻碍，如下所示：\n\n\
  ```php\nroot@php8_tips_php8 [ /repo/ch05 ]#\nphp php8_variance_covariant.php\nobject(ArrTest)#2\
  \ (1) {\n  [\"storage\":\"ArrayObject\":private]=>\n  array(3) {\n    [0]=>  int(1)\n\
  \    [1]=>  int(2)\n    [2]=>  int(3)\n  }\n}\nobject(ArrTest)#3 (1) {\n  [\"storage\"\
  :\"ArrayObject\":private]=>\n  array(3) {\n    [0]=>  string(1) \"A\"\n    [1]=>\
  \  string(1) \"B\"\n    [2]=>  string(1) \"C\"\n  }\n}\n```\n\nArrTest 扩展了 ArrayObject，并且是一个合适的子类型，清楚地符合里氏替换原则所定义的标准。正如你从最后的输出中看到的那样，PHP\
  \ 8 比早期版本的 PHP 更充分地拥抱了真正的 OOP 原则。最终结果是，使用 PHP 8 时，你的代码和应用程序架构可以更加直观和逻辑合理。\n\n现在让我们看看逆变参数。\n\
  \n### 使用逆变参数\n\n而协变关注的是从一般到具体的子类型的排序，**contravariance** 关注的是相反的方向：从具体到一般。在 PHP 7\
  \ 及更早版本中，逆变的完整支持不可用。因此，在 PHP 7 中实现接口或扩展抽象类时，参数类型提示是 **invariant**。\n\n另一方面，在 PHP\
  \ 8 中，由于支持逆变参数，你可以在顶层的超类和接口中自由地具体化。只要子类型兼容，你就可以在扩展或实现的类中将类型提示修改为更一般。\n\n这为你在定义接口或抽象类时定义整体架构提供了更大的自由。PHP\
  \ 8 中使用你的接口或超类的开发人员在实现派生类逻辑方面获得了更大的灵活性。\n\n让我们看看 PHP 8 对逆变参数的支持如何工作：\n\n- 1. 在此示例中，我们首先定义一个\
  \ IterObj 类，它扩展了内置的 ArrayIterator PHP 类：\n- 2. 我们然后定义一个抽象的 Base 类，它强制要求一个方法 stringify()。注意其唯一参数的数据类型是\
  \ IterObj：\n- 3. 接下来，我们定义一个 IterTest 类，它扩展了 Base 并为 stringify() 方法提供了实现。特别值得注意的是，我们覆盖了数据类型，将其更改为\
  \ iterable：\n\n```php\n// /repo/ch05/php8_variance_contravariant.php\nclass IterObj\
  \ extends ArrayIterator {}\n```\n\n```php\nabstract class Base {\n    public abstract\
  \ function stringify(IterObj $it);\n}\n```\n\n```php\nclass IterTest extends Base\
  \ {\n    public function stringify(iterable $it) {\n        return implode(',',\n\
  \            iterator_to_array($it)) . \"\\n\";\n    }\n}\nclass IterObj extends\
  \ ArrayIterator {}\n```\n\n- 4. 接下来的几行代码创建了 IterTest、IterObj 和 ArrayIterator 的实例。然后我们两次调用\
  \ stringify() 方法，提供后两个对象作为参数：\n\n```php\n$test = new IterTest();\n$objIt = new IterObj([1,2,3]);\n\
  $arrIt = new ArrayIterator(['A','B','C']);\necho $test->stringify($objIt);\necho\
  \ $test->stringify($arrIt);\n```\n\n- 5. 在 PHP 7.1 中运行此代码示例会产生预期的致命 Error，如下所示：\n\
  \n```php\nroot@php8_tips_php7 [ /repo/ch05 ]#\nphp php8_variance_contravariant.php\n\
  PHP Fatal error: Declaration of\nIterTest::stringify(iterable $it) must be compatible\
  \ with\nBase::stringify(IterObj $it) in /repo/ch05/php8_variance_contravariant.php\
  \ on line 11\n```\n\n因为 PHP 7.1 不提供逆变参数的支持，它将参数的数据类型视为不变的，并简单地显示一条消息，指出子类的的数据类型与父类中指定的数据类型不兼容。\n\
  \n- 6. PHP 8 另一方面提供了逆变参数的支持。因此，它认识到 Base 类中指定的数据类型 IterObj 是与 iterable 兼容的子类型。此外，提供的两个参数都与\
  \ iterable 兼容，允许程序执行继续进行。以下是 PHP 8 的输出：\n\n```php\nroot@php8_tips_php8 [ /repo/ch05\
  \ ]# php php8_variance_contravariant.php\n1,2,3\nA,B,C\n```\n\n你从 PHP 8 对协变返回和逆变参数的支持中获得的主要优势是能够不仅覆盖方法逻辑，还能覆盖方法签名。你会发现，虽然\
  \ PHP 8 在执行良好的编码实践方面更加严格，但增强的方差支持为你设计继承结构提供了更大的自由。在某种程度上，至少就参数和返回值数据类型而言，PHP 8 如果不是更不限制的话，也是更不限制的！\n\
  \n\n\n> 提示\n> 有关方差支持在 PHP 7.4 和 PHP 8 中如何应用的完整说明，请在此查看：https://wiki.php.net/rfc/covariant-returns-and-contravariant-parameters.\n\
  \n我们现在来看一下 SPL 的变化，以及这些变化在迁移到 PHP 8 后如何影响应用程序性能。\n\n## 处理标准 PHP 库（SPL）变更\n\nSPL\
  \ 是一个扩展，包含实现基本数据结构并增强 OOP 功能的关键类。它首次在 PHP 5 中引入，现在已默认包含在所有 PHP 安装中。涵盖整个 SPL 超出了本书的范围。相反，在本节中，我们讨论在运行\
  \ PHP 8 时 SPL 发生显著变化的地方。此外，我们还提供提示和指导，说明 SPL 变更可能导致现有应用程序停止工作。\n\n我们首先检查 SplFileObject\
  \ 类的变更。\n\n## 了解 SplFileObject 的变更\n\nSplFileObject 是一个优秀的类，它将大多数独立的 f*() 函数，例如\
  \ fgets()、fread()、fwrite() 等，整合到一个类中。SplFileObject::__construct() 方法的参数与 fopen()\
  \ 函数提供的参数相匹配。\n\nPHP 8 中的主要区别是，一个相对晦涩的方法 fgetss() 已从 SplFileObject 类中移除。SplFileObject::fgetss()\
  \ 方法在 PHP 7 及以下版本中可用，它与独立的 fgetss() 函数类似，因为它将 fgets() 与 strip_tags() 结合起来。\n\n为说明起见，假设您创建了一个允许用户上传文本文件的网站。在显示文本文件内容之前，您希望移除任何标记标签。以下是使用\
  \ fgetss() 方法实现此目的的示例：\n\n- 1. 我们首先定义一段获取文件名的代码：\n\n// /repo/ch05/php7_spl_splfileobject.php\n\
  $fn = $_GET['fn'] ?? '';\nif (!$fn || !file_exists($fn))\n    exit('Unable to locate\
  \ file');\n```\n\n- 2. 然后我们创建 SplFileObject 实例，并使用 fgetss() 方法逐行读取文件。最后，我们输出安全内容：\n\
  \n```\n$obj = new SplFileObject($fn, 'r');\n$safe = '';\nwhile ($line = $obj->fgetss())\
  \ $safe .= $line;\necho '<h1>Contents</h1><hr>' . $safe;\n```\n\n- 3. 假设要读取的文件如下：\n\
  \n```\n<h1>This File is Infected</h1>\n<script>alert('You Been Hacked');</script>\n\
  <img src=\"http://very.bad.site/hacked.php\" />\n```\n\n- 4. 使用此 URL 在 PHP 7.1 中运行的输出如下：\n\
  \nhttp://localhost:7777/ch05/php7_spl_splfileobject.php?\nfn=includes/you_been_hacked.html\n\
  \n正如接下来所示的输出，您可以看到所有 HTML 标记标签已被移除：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_206_0.png)\n\
  \n图 5.1 – 使用 SplFileObject::fgetss() 读取文件后的结果\n\n要在 PHP 8 中实现相同功能，以前显示的代码需要通过将 fgetss()\
  \ 替换为 fgets() 来修改。我们还需要在拼接到 $safe 的行上使用 strip_tags()。修改后的代码可能如下所示：\n\n// /repo/ch05/php8_spl_splfileobject.php\n\
  $fn = $_GET['fn'] ?? '';\nif (!$fn || !file_exists($fn))\n    exit('Unable to locate\
  \ file');\n```\n\n```\n$obj = new SplFileObject($fn, 'r');\n$safe = '';\nwhile ($line\
  \ = $obj->fgets())\n    $safe .= strip_tags($line);\necho '<h1>Contents</h1><hr>'\
  \ . $safe;\n```\n\n修改后代码的输出与图 5.1 中显示的输出相同。我们现在将注意力转向另一个 SPL 类的变更：SplHeap。\n\n##\
  \ 检查 SplHeap 的变更\n\nSplHeap 是一个基础类，用于表示作为二叉树结构的数据。还有两个额外的类构建于 SplHeap 之上。SplMinHeap\
  \ 将树组织为最小值在顶部。SplMaxHeap 则相反，将最大值放在顶部。\n\n堆结构在数据乱序到达的情况下尤其有用。一旦插入堆中，项目会自动放置到正确的位置。因此，在任何给定时刻，您都可以安全地显示堆，因为所有项目都会有序排列，而无需运行\
  \ PHP 的排序函数之一。\n\n保持自动排序的关键是定义一个抽象方法 compare()。由于该方法是抽象的，SplHeap 不能直接实例化。相反，您需要扩展该类并实现\
  \ compare()。\n\n在使用 SplHeap 时，在 PHP 8 中存在向后兼容的代码中断的可能性，因为 compare() 的方法签名必须完全如下：SplHeap::compare($value1,\
  \ $value2)。\n\n让我们看一个使用 SplHeap 按姓氏组织亿万富翁列表的代码示例：\n\n- 1. 首先，我们定义一个包含亿万富翁数据的文稿。在此示例中，我们只是从此来源复制并粘贴了数据：https://www.bloomberg.com/billionaires/。\n\
  - 2. 然后我们定义一个 BillionaireTracker 类，它从粘贴的文本中提取信息到有序对数组中。该类的完整源代码（此处未显示）可以在源代码仓库的此处找到：/repo/src/Services/BillionaireTracker.php。\n\
  \n以下是该类生成的数据的示例：\n\n```\narray(20) {\n    [0] =>  array(1) {\n        [177000000000]\
  \ =>  string(10) \"Bezos,Jeff\"\n    }\n    [1] =>  array(1) {\n        [157000000000]\
  \ =>  string(9) \"Musk,Elon\"\n    }\n    [2] =>  array(1) {\n        [136000000000]\
  \ =>  string(10) \"Gates,Bill\"\n    }\n    ... remaining data not shown\n```\n\n\
  正如您所见，数据以降序呈现，其中键代表净资产。相比之下，在我们的示例程序中，我们计划按姓氏升序生成数据。\n\n- 3. 然后我们定义一个标识亿万富翁数据源文件的常量，并设置自动加载器：\n\
  \n// /repo/ch05/php7_spl_splheap.php\ndefine('SRC_FILE', __DIR__\n    . '/../sample_data/billionaires.txt');\n\
  require_once __DIR__\n    . '/../src/Server/Autoload/Loader.php';\n$loader = new\
  \ \\Server\\Autoload\\Loader();\n```\n\n- 4. 接下来，我们创建 BillionaireTracker 类的实例并将结果赋给\
  \ $list：\n\n```\nuse Services\\BillionaireTracker;\n$tracker = new BillionaireTracker();\n\
  $list = $tracker->extract(SRC_FILE);\n```\n\n- 5. 现在是最有趣的部分：创建堆。为此，我们定义一个扩展 SplHeap\
  \ 的匿名类。然后我们定义一个 compare() 方法来执行必要的逻辑，以将插入的元素放置到正确的位置。PHP 7 允许您更改方法签名。在此示例中，我们以数组形式提供参数：\n\
  \n```\n$heap = new class () extends SplHeap {\n    public function compare(\n  \
  \      array $arr1, array $arr2) : int {\n        $cmp1 = array_values($arr2)[0];\n\
  \        $cmp2 = array_values($arr1)[0];\n        return $cmp1 <=> $cmp2;\n    }\n\
  };\n```\n\n您可能还注意到，$cmp1 的值是从第二个数组分配的，而 $cmp2 的值来自第一个数组。之所以这样切换，是因为我们希望生成升序结果。\n\
  \n- 6. 然后我们使用 SplHeap::insert() 将元素添加到堆中：\n\n```\nforeach ($list as $item)\n   \
  \ $heap->insert($item);\n```\n\n- 7. 最后，我们定义一个 BillionaireTracker::view() 方法（未显示）来遍历堆并显示结果：\n\
  \n```\n$patt = \"%20s\\t%32s\\n\";\n$line = str_repeat('-', 56) . \"\\n\";\necho\
  \ $tracker->view($heap, $patt, $line);\n```\n\n- 8. 以下是我们的程序在 PHP 7.1 中运行产生的输出：\n\
  \n```\nroot@php8_tips_php7 [ /repo/ch05 ]#\nphp php7_spl_splheap.php\n--------------------------------------------------------\n\
  \                Net Worth                              Name\n--------------------------------------------------------\n\
  \        84,000,000,000                        Ambani,Mukesh\n       115,000,000,000\
  \                        Arnault,Bernard\n        83,600,000,000               \
  \         Ballmer,Steve\n```\n\n```\n... some lines were omitted to save space ...\n\
  58,200,000,000                     Walton,Rob\n100,000,000,000                 \
  \   Zuckerberg,Mark\n--------------------------------------------------\n      \
  \                             1,795,100,000,000\n--------------------------------------------------\n\
  ```\n\n然而，您会注意到，当我们尝试在 PHP 8 中运行同一程序时，会抛出错误。以下是同一程序在 PHP 8 中运行的输出：\n\n```\nroot@php8_tips_php8\
  \ [ /repo/ch05 ]# php php7_spl_splheap.php\nPHP Fatal error: Declaration of SplHeap@anonymous::compare(array\
  \ $arr1, array $arr2): int must be compatible with SplHeap::compare(mixed $value1,\
  \ mixed $value2) in /repo/ch05/php7_spl_splheap.php on line 16\n```\n\n因此，为了使其正常工作，我们必须重新定义扩展\
  \ SplHeap 的匿名类。以下是该部分代码的修改版本：\n\n```\n$heap = new class () extends SplHeap {\n \
  \   public function compare($arr1, $arr2) : int {\n        $cmp1 = array_values($arr2)[0];\n\
  \        $cmp2 = array_values($arr1)[0];\n        return $cmp1 <=> $cmp2;\n    }\n\
  };\n```\n\n唯一的变化是在 compare() 方法签名中。执行时，结果（未显示）是相同的。PHP 8 的完整代码可在 /repo/ch05/php8_spl_splheap.php\
  \ 查看。\n\n这结束了我们对 SplHeap 类变更的讨论。请注意，相同的变更也适用于 SplMinHeap 和 SplMaxHeap。让我们现在来看一下\
  \ SplDoublyLinkedList 类中一个可能重要的变更。\n\n## 处理 SplDoublyLinkedList 的变更\n\nSplDoublyLinkedList\
  \ 类是一个迭代器，能够以 FIFO（先进先出）或 LIFO（后进先出）顺序显示信息。然而，更常见的是说您可以向前或向后遍历列表。\n\n\n\n这是任何开发人员库中的一个非常强大的补充。例如，要用\
  \ ArrayIterator 实现同样的功能，至少需要十几行代码！因此，PHP 开发者喜欢在需要随意双向导航列表的情况下使用此类。\n\n不幸的是，由于 push()\
  \ 和 unshift() 方法的返回值存在差异，可能导致代码中断。push() 方法用于在列表末尾添加值。另一方面，unshift() 方法将值添加到列表开头。\n\
  \n在 PHP 7 及更早版本中，这些方法如果成功则返回布尔值 TRUE。如果方法失败，则返回布尔值 FALSE。在 PHP 8 中，然而，这两种方法都不返回值。如果查看当前文档中的方法签名，你会看到返回数据类型为\
  \ void。潜在的代码中断可能在继续之前检查 push() 或 unshift() 的返回值时出现。\n\n让我们看一个简单的示例，该示例使用包含五个值的简单列表填充双向链表，并在\
  \ FIFO 和 LIFO 顺序下显示它们：\n\n1. 首先，我们定义一个扩展 SplDoublyLinkedList 的匿名类。我们还添加了一个 show()\
  \ 方法来显示列表的内容：\n\n// /repo/ch05/php7_spl_spldoublylinkedlist.php\n$double = new class()\
  \ extends SplDoublyLinkedList {\n    public function show(int $mode) {\n       \
  \ $this->setIteratorMode($mode);\n        $this->rewind();\n        while ($item\
  \ = $this->current()) {\n            echo $item . '. ';\n            $this->next();\n\
  \        }\n    }\n};\n2. 接下来，我们定义一个示例数据数组，并使用 push() 将值插入到链表中。请注意，使用了 if() 语句来确定操作是否成功或失败。如果操作失败，则抛出\
  \ Exception：\n```php\n$item = ['Person', 'Woman', 'Man', 'Camera', 'TV'];\nforeach\
  \ ($item as $key => $value)\n    if (!$double->push($value))\n        throw new\
  \ Exception('ERROR');\n```\n\n这是存在潜在代码中断的代码块。在 PHP 7 及更早版本中，push() 返回 TRUE 或 FALSE。在\
  \ PHP 8 中没有返回值。\n\n3. 然后我们使用 SplDoublyLinkedList 类常量将模式设置为 FIFO（向前），并显示列表：\n```php\n\
  echo \"************** Forward ****************\\n\";\n$forward = SplDoublyLinkedList::IT_MODE_FIFO\n\
  \          | SplDoublyLinkedList::IT_MODE_KEEP;\n$double->show($forward);\n```\n\
  \n4. 接下来，我们使用 SplDoublyLinkedList 类常量将模式设置为 LIFO（反向），并显示列表：\n```php\necho \"\\n\\\
  n************** Reverse ****************\\n\";\n$reverse = SplDoublyLinkedList::IT_MODE_LIFO\n\
  \          | SplDoublyLinkedList::IT_MODE_KEEP;\n$double->show($reverse);\n```\n\
  \n在 PHP 7.1 中运行的输出如下：\n```\nroot@php8_tips_php7 [ /repo/ch05 ]#\nphp php7_spl_spldoublylinkedlist.php\n\
  ************** Forward ****************\nPerson. Woman. Man. Camera. TV.\n**************\
  \ Reverse ****************\nTV. Camera. Man. Woman. Person.\n```\n\n5. 如果我们在 PHP\
  \ 8 中运行相同的代码，结果如下：\n```\nroot@php8_tips_php8 [ /home/ch05 ]#\nphp php7_spl_spldoublylinkedlist.php\n\
  PHP Fatal error: Uncaught Exception: ERROR in /home/ch05/php7_spl_spldoublylinkedlist.php:23\n\
  ```\n\n如果 push () 没有返回值，在 if () 语句内部 PHP 会假定为 NULL，而 NULL 又被解释为布尔值 FALSE！因此，在第一次\
  \ push () 命令之后，if () 块会导致抛出 Exception。由于 Exception 未被捕获，因此会生成致命错误。\n\n要重写此代码块使其在\
  \ PHP 8 中工作，只需删除 if () 语句，并不抛出 Exception。以下是重写后的代码块（在第 2 步中显示）可能的样子：\n```\n$item\
  \ = ['Person', 'Woman', 'Man', 'Camera', 'TV'];\nforeach ($item as $key => $value)\n\
  \    $double->push($value);\n```\n\n现在，如果我们执行重写后的代码，结果如下所示：\n```\nroot@php8_tips_php7\
  \ [ /home/ch05 ]#\nphp php8_spl_spldoublylinkedlist.php\n**************** Forward\
  \ *****************\nPerson. Woman. Man. Camera. TV.\n**************** Reverse *****************\n\
  TV. Camera. Man. Woman. Person.\n```\n\n现在你对如何使用 SplDoublyLinkedList 有了概念，并且也了解了与\
  \ push() 或 unshift() 相关的潜在代码中断。你还对在 PHP 8 中使用各种 SPL 类和函数时的潜在代码中断有了概念。本章的讨论到此结束。\n\
  \n## 摘要\n\n在本章中，你了解了在迁移到 PHP 8 时 OOP 代码中可能出现的问题。\n\n在第一部分中，你了解了 PHP 7 及更早版本中允许的许多不良实践，但现在在\
  \ PHP 8 中代表了潜在的代码中断。有了这些知识，你成为了一名更好的开发者，并且可以提供高质量的代码来造福你的公司。\n\n在下一部分中，你学习了使用魔术方法时的良好习惯。潜在的代码中断可能发生，因为\
  \ PHP 8 现在强制执行了在早期 PHP 版本中未见的程度的一致性。这些不一致涉及类构造函数的使用和魔术方法使用的某些方面。以下部分教你关于 PHP 序列化的知识以及\
  \ PHP 8 中所做的更改如何使你的代码在 serialize 和 unserialize 过程中更具弹性且不易受错误或攻击的影响。\n\n在本章中，你还了解了\
  \ PHP 8 对协变返回类型和逆变参数的增强支持。了解方差以及 PHP 8 中支持的改进情况，使你在 PHP 8 中开发类继承结构时能够更具创造性和灵活性。你现在知道如何编写在早期\
  \ PHP 版本中根本不可能的代码。\n\n最后部分涵盖了 SPL 中的多个关键类。你深入了解了如何在 PHP 8 中实现堆和链表等基本数据结构。该部分的信息对于帮助你避免涉及\
  \ SPL 的代码问题至关重要。\n\n下一章继续讨论潜在的代码中断。然而，下一章的重点是过程式代码而非面向对象代码。\n"
- "## 6 了解 PHP 8 功能差异\n\n在本章中，你将了解 PHP 8 命令或功能级别上的潜在向后兼容性中断。\n\n本章提供了重要信息，突出了迁移现有代码到\
  \ PHP 8 时的潜在陷阱。\n\n本章提供的信息至关重要，以便你能够生成可靠的 PHP 代码。\n\n在学习完本章的概念后，你将更能写出产生精确结果并避免不一致的代码。\n\
  \n本章涵盖的主题包括以下内容：\n\n- 学习关键的高级字符串处理差异\n- 了解 PHP 8 字符串到数字比较的改进\n- 处理算术、按位和连接操作的差异\n\
  - 利用区域设置独立性\n- 在 PHP 8 中处理数组\n- 精通安全函数和设置的更改\n\n## 技术要求\n\n为了检查和运行本章提供的代码示例，推荐的最低硬件配置如下：\n\
  \n- 基于 x86_64 的台式电脑或笔记本电脑\n- 1 GB 的可用磁盘空间\n- 4 GB RAM\n- 500 千比特每秒（Kbps）或更快的互联网连接\n\
  \n此外，你还需要安装以下软件：\n\n- Docker\n- Docker Compose\n\n请参阅 *第1章，介绍新的 PHP 8 OOP 特性* 中的\
  \ *技术要求* 部分，了解有关 Docker 和 Docker Compose 安装的更多信息，以及如何构建本书记载的代码演示所使用的 Docker 容器。在本书中，我们将恢复本书示例代码的目录称为\
  \ `/repo`。\n\n本章的源代码位于此处：\n```\nhttps://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices.\n\
  ```\n\n我们现在可以开始讨论，通过检查 PHP 8 中引入的字符串处理差异来开始。\n\n## 学习关键的高级字符串处理差异\n\n总体而言，PHP 8\
  \ 中的字符串函数已被收紧并标准化。\n\n你会发现 PHP 8 中的使用受到更严格的限制，这最终迫使你生成更好的代码。\n\n我们可以说 PHP 8 中字符串函数参数的性质和顺序更加统一，这就是为什么我们说\
  \ PHP 核心团队已规范化使用的原因。\n\n这些改进在处理数字字符串时尤其明显。\n\nPHP 8 字符串处理中的其他更改涉及参数的细微更改。\n\n在本节中，我们向你介绍\
  \ PHP 8 处理字符串的关键变化。\n\n了解 PHP 8 引入的处理改进固然重要，但也需要了解 PHP 8 之前字符串处理的缺陷。\n\n\n\n让我们先看一下\
  \ PHP 8 中用于搜索嵌入字符串的函数在字符串处理方面的一个特性。\n\n## 对 needle 参数变更的处理\n\n多个 PHP 字符串函数会搜索较大字符串中子字符串的存在。这些函数包括\
  \ strpos()、strrpos()、stripos()、strripos()、strstr()、strchr()、strrchr() 和 stristr()。所有这些函数都有两个共同的参数：needle\
  \ 和 haystack。\n\n## 区分 needle 和 haystack\n\n为了说明 needle 和 haystack 之间的区别，请看 strpos()\
  \ 的函数签名：\n\n```\nstrpos(string $haystack,string $needle,int $pos=0):\nint|false\n\
  ```\n\n$haystack 是搜索的目标。$needle 是要查找的子字符串。strpos() 函数返回子字符串在搜索目标中的位置。如果未找到子字符串，则返回布尔值\
  \ FALSE。其他 str*() 函数会产生不同类型的输出，这里不详细说明。\n\nPHP 8 处理 needle 参数的两种关键变化可能会破坏迁移到 PHP\
  \ 8 的应用程序。这些变化适用于 needle 参数不是字符串或 needle 参数为空的情况。让我们先来看非字符串 needle 参数的处理。\n\n##\
  \ 处理非字符串 needle 参数\n\n你的 PHP 应用程序可能没有采取适当的预防措施来确保此处提到的 str*() 函数的 needle 参数始终是字符串。如果是这种情况，在\
  \ PHP 8 中，needle 参数现在将始终被解释为字符串而不是 ASCII 码点。\n\n如果需要提供 ASCII 值，必须使用 chr() 函数将其转换为字符串。在下面的示例中，使用了\
  \ LF (\"\\n\") 的 ASCII 值而不是字符串。在 PHP 7 或更早版本中，strpos() 在执行搜索前会进行内部转换。在 PHP 8 中，该数字只是简单地强制转换为字符串，导致出现意外的结果。\n\
  \n这里有一个代码示例，用于搜索字符串中 LF 的存在。然而，请注意，提供的参数不是字符串，而是一个值为 10 的整数：\n\n```php\n// /repo/ch06/php8_num_str_needle.php\n\
  function search($needle, $haystack) {\n    $found = (strpos($haystack, $needle))\n\
  \        ? 'contains' : 'DOES NOT contain';\n    return \"This string $found LF\
  \ characters\\n\";\n}\n$haystack = \"We're looking\\nFor linefeeds\\nIn this\n \
  \   string\\n\";\n$needle = 10;        // ASCII code for LF\necho search($needle,\
  \ $haystack);\n```\n\n以下是在 PHP 7 中运行代码示例的结果：\n\n```\nroot@php8_tips_php7 [ /repo/ch06\
  \ ]#\nphp php8_num_str_needle.php\nThis string contains LF characters\n```\n\n而以下是在\
  \ PHP 8 中运行同一代码块的结果：\n\n```\nroot@php8_tips_php8 [ /repo/ch06 ]#\nphp php8_num_str_needle.php\n\
  This string DOES NOT contain LF characters\n```\n\n如你所见，将 PHP 7 的输出与 PHP 8 的输出进行比较，同一代码块会产生截然不同的结果。这是极难发现的潜在代码破坏，因为不会生成任何警告或错误。\n\
  \n最佳实践是对任何包含 PHP str*() 函数的函数或方法中的 needle 参数应用字符串类型提示。如果我们重写之前的示例，输出在 PHP 7 和 PHP\
  \ 8 中都是一致的。以下是使用类型提示重写的相同示例：\n\n```php\n// /repo/ch06/php8_num_str_needle_type_hint.php\n\
  declare(strict_types=1);\nfunction search(string $needle, string $haystack) {\n\
  \    $found = (strpos($haystack, $needle))\n        ? 'contains' : 'DOES NOT contain';\n\
  \    return \"This string $found LF characters\\n\";\n}\n$haystack = \"We're looking\\\
  nFor linefeeds\\nIn this\n    string\\n\";\n$needle  = 10;    // ASCII code for\
  \ LF\necho search($needle, $haystack);\n```\n\n现在，在任一版本的 PHP 中，输出如下：\n\n```\nPHP\
  \ Fatal error: Uncaught TypeError: search(): Argument #1 ($needle) must be of type\
  \ string, int given, called in /repo/ch06/php8_num_str_needle_type_hint.php on line\
  \ 14 and defined in /repo/ch06/php8_num_str_needle_type_hint.php:4\n```\n\n通过声明\
  \ strict_types=1，并为 $needle 参数添加 string 类型提示，任何误用你代码的开发人员都会收到明确的指示，表明这种做法是不可接受的。\n\
  \n现在让我们看看在 PHP 8 中当 needle 参数缺失时会发生什么。\n\n## 处理空 needle 参数\n\nstr*() 函数的另一个重大变化是\
  \ needle 参数现在可以为空（例如，任何使 empty() 函数返回 TRUE 的值）。这带来了显著的向后兼容性破坏的潜在风险。在 PHP 7 中，如果\
  \ needle 参数为空，strpos() 的返回值将是布尔值 FALSE，而在 PHP 8 中，空值首先被转换为字符串，从而产生完全不同的结果。\n\n如果计划将\
  \ PHP 版本更新到 8，了解这种潜在的代码破坏极其重要。空的 needle 参数在手动审查代码时很难发现。这是一个需要一套完善的单元测试来确保 PHP 迁移顺利进行的情况。\n\
  \n为了说明潜在问题，请考虑以下示例。假设 needle 参数为空。在这种情况下，传统的 if () 检查 strpos() 结果是否不与 FALSE 相同，会在\
  \ PHP 7 和 8 之间产生不同的结果。以下是代码示例：\n\n- 首先，我们定义一个使用 strpos() 报告 needle 值是否在 haystack\
  \ 中找到的函数。请注意对布尔值 FALSE 的严格类型检查：\n\n```php\n// php7_num_str_empty_needle.php\nfunction\
  \ test($haystack, $search) {\n    $pattern = '%15s | %15s | %10s' . \"\\n\";\n \
  \   $result  = (strpos($haystack, $search) !== FALSE)\n        ? 'FOUND' : 'NOT\
  \ FOUND';\n    return sprintf($pattern,\n        var_export($search, TRUE),\n  \
  \      var_export(strpos($haystack, $search),\n            TRUE),\n        $result);\n\
  };\n```\n\n- 然后我们将 haystack 定义为包含字母和数字的字符串。needle 参数以一组都被视为空的值数组形式提供：\n\n```php\n\
  $haystack = 'Something Anything 0123456789';\n$needles = ['', NULL, FALSE, 0];\n\
  foreach ($needles as $search)\n    echo test($haystack, $search);\n```\n\nPHP 7\
  \ 中的输出如下所示：\n\n```\nroot@php8_tips_php7 [/repo/ch06 ]#\nphp php7_num_str_empty_needle.php\n\
  PHP Warning:  strpos(): Empty needle in /repo/ch06/php7_num_str_empty_needle.php\
  \ on line 5\n// not all Warnings are shown ...\n'' | false | NOT FOUND\nNULL | false\
  \ | NOT FOUND\nfalse | false | NOT FOUND\n0 | false | NOT FOUND\n```\n\n在一系列警告之后，最终输出出现。如输出所示，strpos\
  \ ($haystack, $search) 的返回值在 PHP 7 中始终是布尔值 FALSE。\n\n然而，在 PHP 8 中运行同一代码的输出截然不同。以下是\
  \ PHP 8 的输出：\n\n```\nroot@php8_tips_php8 [ /repo/ch06 ]#\nphp php7_num_str_empty_needle.php\n\
  '' | 0 | FOUND\nNULL | 0 | FOUND\nfalse | 0 | FOUND\n0 | 19 | FOUND\n```\n\n在 PHP\
  \ 8 中，空的 needle 参数首先被静默转换为字符串。没有任何 needle 值返回布尔值 FALSE。这导致函数报告 needle 已找到。这显然不是期望的结果。然而，对于数字\
  \ 0 来说，它包含在 haystack 中，导致返回值为 19。\n\n让我们看看如何解决这个问题。\n\n## 使用 str_contains() 解决问题\n\
  \n前一节所示代码块的意图是确定 haystack 是否包含 needle。strpos() 并不是完成此任务的正确工具！请看改用 str_contains()\
  \ 的相同函数：\n\n```php\n// /repo/ch06/php8_num_str_empty_needle.php\nfunction test ($haystack,\
  \ $search) {\n    $pattern = '%15s | %15s | %10s' . \"\\n\";\n    $result  = (str_contains($search,\
  \ $haystack) !==\n                FALSE)\n                ? 'FOUND'  : 'NOT FOUND';\n\
  \    return sprintf($pattern,\n        var_export($search, TRUE),\n        var_export(str_contains($search,\
  \ $haystack),\n            TRUE),\n        $result);\n};\n```\n\n然后我们在 PHP 8 中运行修改后的代码，得到的结果与\
  \ PHP 7 中收到结果相似：\n\n```\nroot@php8_tips_php8 [ /repo/ch06 ]#\nphp php8_num_str_empty_needle.php\n\
  '' | false | NOT FOUND\nNULL | false | NOT FOUND\nfalse | false | NOT FOUND\n0 |\
  \ false | NOT FOUND\n```\n\n你可能会问为什么数字 0 在字符串中找不到？答案是 str_contains() 执行了更严格的搜索。整数\
  \ 0 与字符串 \"0\" 不同！现在让我们来看一下 v*printf() 系列；PHP 8 中对参数施加更严格控制的另一个字符串函数系列。\n\n## 处理\
  \ v*printf() 的变更\n\nv*printf() 函数族是 printf() 函数族的一个子集，其中包括 vprintf()、vfprintf()\
  \ 和 vsprintf()。该子集与主族之间的区别在于，v*printf() 函数设计为接受数组作为参数，而不是无限制的一系列参数。以下是一个简单的示例来说明这种差异：\n\
  \n- 1. 首先，我们定义一组将被插入到模式 $patt 中的参数：\n- 2. 然后我们使用一系列参数执行 printf() 语句：\n\n// /repo/ch06/php8_printf_vs_vprintf.php\n\
  $ord = 'third';\n$day = 'Thursday';\n$pos = 'next';\n$date = new DateTime(\"$ord\
  \ $day of $pos month\");\n$patt = \"The %s %s of %s month is: %s\\n\";\n```\n\n\
  ```\nprintf($patt, $ord, $day, $pos,\n    $date->format('l, d M Y'));\n```\n\n3.\
  \ 然后我们将参数定义为数组 $arr，并使用 vprintf() 生成相同的结果：\n\n```\n$arr = [$ord, $day, $pos, $date->format('l,\
  \ d M Y')];\nvprintf($patt, $arr);\n```\n\n以下是程序在 PHP 8 中运行的输出。在 PHP 7 中运行的输出相同（未显示）：\n\
  \n```\nroot@php8_tips_php8 [ /repo/ch06 ]#\nphp php8_printf_vs_vprintf.php\nThe\
  \ third Thursday of next month is: Thursday, 15 Apr 2021\nThe third Thursday of\
  \ next month is: Thursday, 15 Apr 2021\n```\n\n如你所见，两个函数的输出完全相同。唯一的用法区别是 vprintf()\
  \ 以数组形式接受参数。\n\nPHP 的早期版本允许开发者对传递给 v*printf() 函数族的参数随意处理。在 PHP 8 中，参数的数据类型现在被严格执行。只有在代码控制不存在以确保传递数组的情况下才会出现问题。另一个更重要的区别是\
  \ PHP 7 会允许 v*printf() 使用 ArrayObject，而 PHP 8 则不会。\n\n在这里显示的示例中，PHP 7 会发出警告，而 PHP\
  \ 8 则抛出错误：\n\n1. 首先，我们定义模式和源数组：\n\n// /repo/ch06/php7_vprintf_bc_break.php\n$patt\
  \ = \"\\t%s. %s. %s. %s. %s.\";\n$arr = ['Person', 'Woman', 'Man', 'Camera', 'TV'];\n\
  ```\n\n2. 然后我们定义一个测试数据数组，以测试 vsprintf() 接受哪些参数：\n\n```\n$args = [\n    'Array' =>\
  \ $arr,\n    'Int'   => 999,\n    'Bool'  => TRUE,\n    'Obj'   => new ArrayObject($arr)\n\
  ];\n```\n\n3. 然后我们定义一个 foreach() 循环遍历测试数据并调用 vsprintf()：\n\n```\nforeach ($args\
  \ as $key => $value) {\n    try {\n        echo $key . ': ' . vsprintf($patt, $value);\n\
  \    } catch (Throwable $t) {\n        echo $key . ': ' . get_class($t)\n      \
  \      . ': ' . $t->getMessage();\n    }\n}\n```\n\n以下是 PHP 7 中运行的输出：\n\n```\nroot@php8_tips_php7\
  \ [/repo/ch06 ]#\nphp php7_vprintf_bc_break.php\nArray:      Person. Woman. Man.\
  \ Camera. TV.\nPHP Warning:  vsprintf(): Too few arguments in /repo/ch06/php8_vprintf_bc_break.php\
  \ on line 14\nInt:\nPHP Warning:  vsprintf(): Too few arguments in /repo/ch06/php8_vprintf_bc_break.php\
  \ on line 14\nBool:\nObj:        Person. Woman. Man. Camera. TV.\n```\n\n从输出可以看出，在\
  \ PHP 7 中，数组和 ArrayObject 参数都被接受。以下是同一代码示例在 PHP 8 中运行的情况：\n\n```\nroot@php8_tips_php8\
  \ [/repo/ch06 ]#\nphp php7_vprintf_bc_break.php\nArray:      Person. Woman. Man.\
  \ Camera. TV.\nInt: TypeError:vsprintf(): Argument #2 ($values) must be of type\
  \ array, int given\nBool: TypeError:vsprintf(): Argument #2 ($values) must be of\
  \ type array, bool given\nObj: TypeError:vsprintf(): Argument #2 ($values) must\
  \ be of type array, ArrayObject given\n```\n\n如预期，PHP 8 的输出更加一致。在 PHP 8 中，v*printf()\
  \ 函数被严格限定为仅接受数组作为参数。不幸的是，你可能使用过 ArrayObject 的可能性很大。这很容易解决，只需在 ArrayObject 实例上使用\
  \ getArrayCopy() 方法即可，该方法返回一个数组。\n\n以下是同时适用于 PHP 7 和 PHP 8 的重写代码：\n\n```php\nif\
  \ ($value instanceof ArrayObject)\n    $value = $value->getArrayCopy();\necho $key\
  \ . ':' . vsprintf($patt, $value);\n```\n\n现在你已经知道在使用 v*printf() 函数时潜在代码中断的查找位置，让我们把注意力转向\
  \ PHP 8 中带空长度参数的字符串函数的工作方式差异。\n\n## 在 PHP 8 中处理空长度参数\n\n在 PHP 7 及更早版本中，NULL 长度参数会导致返回空字符串。在\
  \ PHP 8 中，NULL 长度参数现在被视为与省略长度参数相同。受影响的函数包括以下：\n\n- substr()\n- substr_count()\n\
  - substr_compare()\n- iconv_substr()\n\n在下一个示例中，PHP 7 返回空字符串，而 PHP 8 返回字符串的剩余部分。如果操作结果用于确认或否定子字符串的存在，则存在很高的代码中断风险：\n\
  \n1. 首先，我们定义一个干草堆和针。然后我们运行 strpos() 来获取针在干草堆中的位置：\n\n```php\n// /repo/ch06/php8_null_length_arg.php\n\
  $str = 'The quick brown fox jumped over the fence';\n$var = 'fox';\n$pos = strpos($str,\
  \ $var);\n```\n\n2. 接下来，我们提取子字符串，故意将长度参数留为空：\n\n```\n$res = substr($str, $pos, $len);\n\
  $find = ($res) ? '' : ' NOT';\necho \"$var is$find found in the string\\n\";\n```\n\
  \n以下是 PHP 7 中运行的输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch06 ]#\nphp php8_null_length_arg.php\n\
  PHP Notice: Undefined variable: len in /repo/ch06/php8_null_length_arg.php on line\
  \ 8\nResult  : fox is NOT found in the string\nRemainder:\n```\n\n如预期，PHP 7 发出 Notice。然而，由于\
  \ NULL 长度参数返回空字符串，搜索结果是不正确的。以下是同一代码在 PHP 8 中运行的情况：\n\n```\nroot@php8_tips_php8 [\
  \ /repo/ch06 ]#\nphp php8_null_length_arg.php\nPHP Warning: Undefined variable $len\
  \ in /repo/ch06/php8_null_length_arg.php on line 8\nResult  : fox is found in the\
  \ string\nRemainder: fox jumped over the fence\n```\n\nPHP 8 发出 Warning 并返回字符串的剩余部分。这与完全省略长度参数的行为一致。如果你的代码依赖于返回空字符串，则在\
  \ PHP 8 更新后存在潜在的代码中断。\n\n现在让我们来看一下 PHP 8 在 implode() 函数中使字符串处理更加统一的另一个情况。\n\n##\
  \ 检查 implode() 的变更\n\n两个广泛使用的 PHP 函数执行数组到字符串的转换及其反向操作：explode() 将字符串转换为数组，而 implode()\
  \ 将数组转换为字符串。然而，implode() 函数隐藏着一个深深的秘密：它的两个参数可以以任意顺序表达！\n\n请记住，当 PHP 于 1994 年首次推出时，初始目标是尽可能易于使用。这种方法取得了成功，以至于根据\
  \ w3techs 进行的最近一次服务器端编程语言调查显示，PHP 已成为今天超过 78% 的所有 Web 服务器的首选语言。（https://w3techs.com/technologies/overview/programming_language）\n\
  \n然而，出于一致性考虑，将 implode() 函数的参数与其镜像孪生函数 explode() 对齐是有意义的。因此，传递给 implode() 的参数现在必须按以下顺序排列：\n\
  \n```\nimplode(<GLUE STRING>, <ARRAY>);\n```\n\n以下是以任一顺序调用 implode() 函数的参数的代码示例：\n\
  \n// /repo/ch06/php7_implode_args.php\n$arr = ['Person', 'Woman', 'Man', 'Camera',\
  \ 'TV'];\necho __LINE__ . ':' . implode(' ', $arr) . \"\\n\";\necho __LINE__ . ':'\
  \ . implode($arr, ' ') . \"\\n\";\n```\n\n如 PHP 7 下面的输出所示，两个 echo 语句都产生结果：\n\n```\n\
  root@php8_tips_php7 [ /repo/ch06 ]# php php7_implode_args.php\n5:Person Woman Man\
  \ Camera TV\n6:Person Woman Man Camera TV\n```\n\n在 PHP 8 中，只有第一个语句成功，如下所示：\n\n\
  ```\nroot@php8_tips_php8 [ /repo/ch06 ]#\nphp php7_implode_args.php\n5:Person Woman\
  \ Man Camera TV\nPHP Fatal error: Uncaught TypeError: implode(): Argument #2 ($array)\
  \ must be of type ?array, string given in /repo/ch06/php7_implode_args.php:6\n```\n\
  \n很难发现 implode() 以错误顺序接收参数的地方。在 PHP 8 迁移之前最好的预警方式是记录使用 implode() 的所有 PHP 文件类别。另一个建议是利用\
  \ PHP 8 的命名参数功能（在第 1 章《介绍新的 PHP 8 OOP 功能》中介绍）。\n\n\n\n## 在 PHP 8 中学习常量的使用\n\n其中一个真正离谱的功能是\
  \ PHP 在 8 版本之前能够定义 *大小写不敏感* 的常量。在最初，PHP 首次引入时，许多开发者都在编写大量 PHP 代码，且明显缺乏任何形式的编码标准。当时的目标只是\
  \ *使其工作*。\n\n随着普遍趋向于强制执行良好编码标准的趋势，这一功能在 PHP 7.3 中被弃用，并在 PHP 8 中被移除。如果您使用 define()\
  \ 且第三个参数设置为 TRUE，则可能会出现向后兼容性中断。\n\n这里显示的示例在 PHP 7 中有效，但在 PHP 8 中并非完全有效：\n\n// /repo/ch06/php7_constants.php\n\
  define('THIS_WORKS', 'This works');\ndefine('Mixed_Case', 'Mixed Case Works');\n\
  define('DOES_THIS_WORK', 'Does this work?', TRUE);\necho __LINE__ . ':' . THIS_WORKS\
  \ . \"\\n\";\necho __LINE__ . ':' . Mixed_Case . \"\\n\";\necho __LINE__ . ':' .\
  \ DOES_THIS_WORK . \"\\n\";\necho __LINE__ . ':' . Does_This_Work . \"\\n\";\n\n\
  在 PHP 7 中，所有代码行按原样工作。以下是输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch06 ]# php php7_constants.php\n\
  7:This works\n8:Mixed Case Works\n9:Does this work?\n10:Does this work?\n```\n\n\
  请注意，define() 的第三个参数在 PHP 7.3 中已被弃用。因此，如果您在 PHP 7.3 或 7.4 中运行此代码示例，输出与添加弃用通知的情况相同。\n\
  \n然而，在 PHP 8 中，产生了相当不同的结果，如下所示：\n\n```\nroot@php8_tips_php8 [ /repo/ch06 ]# php\
  \ php7_constants.php\nPHP Warning: define(): Argument #3 ($case_insensitive) is\
  \ ignored since declaration of case-insensitive constants is no longer supported\
  \ in /repo/ch06/php7_constants.php on line 6\n7:This works\n8:Mixed Case Works\n\
  9:Does this work?\nPHP Fatal error: Uncaught Error: Undefined constant \"Does_This_Work\"\
  \ in /repo/ch06/php7_constants.php:10\n```\n\n正如您所期望的，第 7、8 和 9 行产生了预期的结果。然而，最后一条行会抛出致命错误，因为\
  \ PHP 8 中的常量现在是区分大小写的。此外，对于第三个 define() 语句会发出警告，因为在 PHP 8 中第三个参数被忽略。\n\n您现在对 PHP\
  \ 8 中引入的关键字符串处理差异有了大致了解。接下来我们将关注数字字符串与数字比较方式的变化。\n\n## 理解 PHP 8 字符串到数字比较的改进\n\n\
  在 PHP 中比较两个数值从未成为问题。比较两个字符串也不是问题。问题出现在字符串和数值数据（硬编码数字，或包含 float 或 int 类型数据的变量）之间的非严格比较中。在这种情况下，如果执行非严格比较，PHP\
  \ 总会将字符串转换为数值。\n\n字符串到数值的转换只有在字符串仅包含数字（或数值如加号、减号或小数分隔符）时才 100% 成功。在本节中，您将学习如何防止涉及字符串和数值数据的不准确非严格比较。掌握本章介绍的概念至关重要，如果您希望编写具有一致且可预测行为的代码。\n\
  \n在深入了解字符串到数值比较的细节之前，我们首先需要了解什么是非严格比较。\n\n## 学习严格比较和非严格比较\n\n类型转换的概念是 PHP 语言的重要组成部分。这一功能从语言的第一天起就被构建在其中。类型转换涉及在执行操作之前进行内部数据类型转换。这种能力对语言的成功至关重要。\n\
  \nPHP 最初设计用于在 Web 环境中运行，需要一种处理作为 HTTP 数据包一部分传输的数据的方法。HTTP 头部和主体以文本形式传输，并由 PHP 作为存储在一组超全局变量中的字符串接收，包括\
  \ $_SERVER、$_GET、$_POST 等。因此，PHP 语言需要在涉及数字的操作中快速处理字符串值。这是类型转换过程的工作。\n\n严格比较首先检查数据类型。如果数据类型匹配，则进行比较。调用严格比较的运算符包括\
  \ === 和 !== 等。某些函数具有强制严格数据类型的选项。一个例子是 in_array()。如果第三个参数设置为 TRUE，则会进行严格类型搜索。以下是\
  \ in_array() 的方法签名：\n\n```\nin_array(mixed $needle, array $haystack, bool $strict\
  \ = false)\n```\n\n非严格比较是在比较之前不进行数据类型检查。执行非严格比较的运算符包括 ==、!=、< 和 > 等。值得注意的是，switch\
  \ {} 语言结构在其 case 语句中执行非严格比较。如果对不同数据类型的操作数进行非严格比较，则会执行类型转换。\n\n现在让我们详细了解一下数字字符串。\n\
  \n## 检查数字字符串\n\n数字字符串是一个仅包含数字或数字字符的字符串，例如加号 (+) 、减号 (-) 和小数分隔符。\n\n> **重要说明**\n\
  > 需要注意的是，PHP 8 内部使用句点字符 (.) 作为小数分隔符。如果您需要在不使用句点作为小数分隔符的区域设置中渲染数字（例如，在法国，使用逗号 (,)\
  \ 作为小数分隔符），请使用 number_format() 函数（参见 https://www.php.net/number_format）。请参阅本章中 利用区域设置独立性\
  \ 部分了解更多信息。\n\n数字字符串也可以使用工程符号（也称为科学计数法）组成。格式不正确的数字字符串是包含除数字、加号、减号或小数分隔符以外的值的数字字符串。前导数字字符串以数字字符串开头，但后面跟随非数字字符。PHP\
  \ 引擎将任何既非数字也非前导数字的字符串视为非数字。\n\n在 PHP 的早期版本中，类型转换不一致地解析包含数字的字符串。在 PHP 8 中，只有数字字符串才能干净地转换为数字：不能存在前导或尾随空白或其他非数字字符。\n\
  \n例如，看看 PHP 7 和 8 如何处理此代码示例中的数字字符串：\n\n// /repo/ch06/php8_num_str_handling.php\n\
  $test = [\n    0 => '111',\n    1 => '   111',\n    2 => '111   ',\n    3 => '111xyz'\n\
  ];\n$patt = \"%d : %3d : '%-s'\\n\";\nforeach ($test as $key => $val) {\n    $num\
  \ = 111 + $val;\n    printf($patt, $key, $num, $val);\n}\n\n以下是 PHP 7 中运行的输出：\n\n\
  ```\nroot@php8_tips_php7 [ /repo/ch06 ]#\nphp php8_num_str_handling.php\n0 : 222\
  \ : '111'\n1 : 222 : '   111'\nPHP Notice:  A non well formed numeric value encountered\
  \ in /repo/ch06/php8_num_str_handling.php on line 11\n2 : 222 : '111   '\nPHP Notice:\
  \  A non well formed numeric value encountered in /repo/ch06/php8_num_str_handling.php\
  \ on line 11\n3 : 222 : '111xyz'\n```\n\n从输出中可以看到，PHP 7 认为带有尾随空格的字符串是格式不正确的。然而，带有前导空格的字符串被认为格式正确，并且在不生成\
  \ Notice 的情况下通过。带有非空白字符的字符串仍会被处理，但会产生 Notice。\n\n以下是 PHP 8 中运行的相同代码示例：\n\n```\n\
  root@php8_tips_php8 [ /repo/ch06 ]#\nphp php8_num_str_handling.php\n0 : 222 : '111'\n\
  1 : 222 : '  111'\n2 : 222 : '111  '\nPHP Warning:  A non-numeric value encountered\
  \ in /repo/ch06/php8_num_str_handling.php on line 11\n3 : 222 : '111xyz'\n```\n\n\
  PHP 8 在这方面更加一致，即包含前导或尾随空格的数字字符串被同等对待，并且不会生成 Notice 或 Warning。然而，最后一个字符串在 PHP 7 中曾是\
  \ Notice，现在会生成 Warning。\n\n> 提示\n> 您可以在 PHP 文档中阅读有关数字字符串的信息：\n> https://www.php.net/manual/en/language.types.numeric-strings.php\n\
  > 有关类型转换的更多信息，请查看以下网址：\n> https://www.php.net/manual/en/language.types.type-juggling.php\n\
  \n现在您已经对什么是格式正确和格式不正确的数字字符串有了大致了解，让我们将注意力转向 PHP 8 中处理数字字符串时可能出现的更严重向后兼容性中断问题。\n\n\
  ## 检测涉及数字字符串的向后兼容性中断\n\n您必须了解在 PHP 8 升级后代码可能中断的地方。在本小节中，我们向您展示了一些极其微妙的差异，这些差异可能产生重大后果。\n\
  \n潜在的代码中断可能在任何时候使用格式不正确的数字字符串时出现：\n\n- 使用 is_numeric()\n- 在字符串偏移量中（例如，$str['4x'])\n\
  \n- 使用按位运算符\n- 在递增或递减变量的值为非规范数字字符串时\n\n以下是修复代码的一些建议：\n\n- 考虑对可能包含前导或尾随空白的数字字符串使用\
  \ trim()（例如，嵌入在已发布表单数据中的数字字符串）。\n- 如果你的代码依赖于以数字开头的字符串，请使用显式类型转换以确保数字被正确插值。\n- 不要依赖空字符串（例如，$str\
  \ = '' ) 来干净地转换为 0。\n\n在下面的代码示例中，一个带有尾随空格的非规范字符串被赋给 $age：\n\n```php\n// /repo/ch06/php8_num_str_is_numeric.php\n\
  $age = '77  ';\necho (is_numeric($age))\n    ? \"Age must be a number\\n\"\n   \
  \ : \"Age is $age\\n\";\n```\n\n当我们在 PHP 7 中运行此代码时，is_numeric() 返回 TRUE。以下是 PHP\
  \ 7 的输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch06 ]#\nphp php8_num_str_is_numeric.php\n\
  Age is 77\n```\n\n另一方面，当我们在 PHP 8 中运行此代码时，is_numeric() 返回 FALSE，因为该字符串不被视为数字。以下是\
  \ PHP 8 的输出：\n\n```\nroot@php8_tips_php8 [ /repo/ch06 ]#\nphp php8_num_str_is_numeric.php\n\
  Age must be a number\n```\n\n正如你所见，PHP 7 和 PHP 8 之间字符串处理的差异可能导致应用程序行为不同，并可能产生灾难性的结果。现在让我们来看一下涉及规范字符串的不一致结果。\n\
  \n## 处理不一致的字符串到数字比较结果\n\n为了完成涉及字符串和数字数据的非严格比较，PHP 引擎首先执行类型 juggling 操作，在执行比较之前内部将字符串转换为数字。然而，即使是规范的数字字符串，也可能产生从人类角度来看会认为是不合逻辑的结果。\n\
  \n作为示例，请看一下这个代码示例：\n\n- 1. 首先我们对变量 $zero，其值为零，和变量 $string，其值为 ABC 进行非严格比较：\n- 2.\
  \ 以下非严格比较使用 in_array() 在 $array 数组中查找值为零的元素：\n- 3. 最后，我们对前导数字字符串 42abc88 和硬编码数字\
  \ 42 进行非严格比较：\n\n```\n$zero = 0;\n$string = 'ABC';\n$result = ($zero == $string)\
  \ ? 'is' : 'is not';\necho \"The value $zero $result the same as $string\\n\"\n\
  ```\n\n```\n$array = [1 => 'A', 2 => 'B', 3 => 'C'];\n$result = (in_array($zero,\
  \ $array))\n    ? 'is in' : 'is not in';\necho \"The value $zero $result\\n\"\n\
  \    . var_export($array, TRUE)\n```\n\n```\n$mixed = '42abc88';\n$result = ($mixed\
  \ == 42) ? 'is' : 'is not';\necho \"\\nThe value $mixed $result the same as 42\\\
  n\";\n```\n\n在 PHP 7 中运行的结果违背人类理解！以下是 PHP 7 的结果：\n\n```\nroot@php8_tips_php7 [/repo/ch06\
  \ ]#\nphp php7_compare_num_str.php\nThe value 0 is the same as ABC\nThe value 0\
  \ is in\narray (1 => 'A', 2 => 'B', 3 => 'C')\nThe value 42abc88 is the same as\
  \ 42\n```\n\n从人类角度来看，这些结果没有任何意义！从计算机角度来看，另一方面，它完全有意义。字符串 ABC 在转换为数字时最终得到的值为零。同样，当进行数组搜索时，每个数组元素仅具有字符串值，最终会被插值为空。\n\
  \n前导数字字符串的情况有点棘手。在 PHP 7 中，插值算法会将数字字符转换，直到遇到第一个非数字字符。一旦发生这种情况，插值就会停止。因此，字符串 42abc88\
  \ 在比较时变为整数 42。现在让我们看看 PHP 8 如何处理字符串到数字的比较。\n\n## 了解 PHP 8 中所做的比较更改\n\n在 PHP 8 中，如果将字符串与数字进行比较，只有数字字符串才被视为有效比较对象。使用指数表示法的字符串也被视为有效比较对象，以及带有前导或尾随空白的数字字符串。必须极其注意的是，PHP\
  \ 8 在转换字符串之前就会做出此判断。\n\n请看一下在 PHP 8 中运行的同一代码示例的输出，该示例在前一小节（处理不一致的字符串到数字比较结果）中描述：\n\
  \n```\nroot@php8_tips_php8 [ /repo/ch06 ]#\nphp php7_compare_num_str.php\nThe value\
  \ 0 is not the same as ABC\nThe value 0 is not in\narray (1 => 'A', 2 => 'B', 3\
  \ => 'C')\nThe value 42abc88 is not the same as 42\n```\n\n因此，正如输出所示，在 PHP 8 升级后，你的应用行为发生变化的可能性非常大。作为\
  \ PHP 8 字符串处理的最后说明，让我们看看如何避免升级问题。\n\n## 在 PHP 8 升级期间避免问题\n\n你面临的主要问题是 PHP 8 处理涉及不同数据类型操作数的非严格比较的方式不同。如果一个操作数是\
  \ int 或 float，另一个操作数是 string，升级后你可能会遇到问题。如果字符串是有效的数字字符串，非严格比较将不会有任何问题地进行。\n\n以下运算符受影响：<==>,\
  \ ==, !=, >, >=, <, 和 <=。如果选项标志设置为默认值，以下函数受影响：\n\n- `in_array()`\n- `array_search()`\n\
  - `array_keys()`\n- `sort()`\n- `rsort()`\n- `asort()`\n- `arsort()`\n- `array_multisort()`\n\
  \n> **Tip**\n> \n> 有关 PHP 8 中改进的数字字符串处理的更多信息，请参阅以下链接：https://wiki.php.net/rfc/saner-numeric-strings。相关的\
  \ PHP 8 更改记录在这里：https://wiki.php.net/rfc/string_to_number_comparison。\n\n最佳实践是通过为函数或方法提供类型提示来最小化\
  \ PHP 类型 juggling。你也可以在比较前强制数据类型。最后，考虑使用严格比较，尽管这在所有情况下可能并不合适。\n\n现在你已经了解了如何在 PHP\
  \ 8 中正确处理涉及数字字符串的比较，让我们现在来看一下 PHP 8 涉及算术、按位和连接操作的更改。\n\n## 处理算术、按位和连接操作中的差异\n\n\
  算术、按位和连接操作是任何 PHP 应用的核心。在本节中，你将了解在 PHP 8 迁移后这些简单操作中可能出现的隐藏危险。你必须了解 PHP 8 所做的更改，以便避免应用中出现潜在的代码中断。因为这些操作如此普通，没有这些知识，你将很难发现迁移后的错误。\n\
  \n我们先来看看 PHP 如何在算术和按位操作中处理非标量数据类型。\n\n## 处理算术和按位操作中的非标量数据类型\n\n从历史上看，PHP 引擎在算术或按位操作中使用混合数据类型时非常\
  \ *宽容*。我们已经查看过涉及 *数字*、*前导数字* 和 *非数字* 字符串和数字的比较操作。正如你所学，当使用非严格比较时，PHP 会调用类型 juggling\
  \ 在执行比较之前将字符串转换为数字。当 PHP 执行涉及数字和字符串的算术操作时也会发生类似的操作。\n\n在 PHP 8 之前，**非标量数据类型**（`string`、`int`、`float`\
  \ 或 `boolean` 以外的其他数据类型）在算术操作中是允许的。PHP 8 已遏制这种不良做法，不再允许 `array`、`resource` 或 `object`\
  \ 类型的操作数。当非标量操作数在算术操作中使用时，PHP 8 会一致地抛出 `TypeError`。此一般更改的唯一例外是，你仍然可以执行所有操作数均为 `array`\
  \ 类型的算术操作。\n\n> **Tip**\n> 有关算术和按位操作中重要更改的进一步信息，请查看这里：https://wiki.php.net/rfc/arithmetic_operator_type_checks。\n\
  \n这里有一个代码示例来说明 PHP 8 中算术运算符处理差异：\n\n- 1. 首先，我们定义示例非标量数据以在算术操作中进行测试：\n- 2. 然后我们尝试将整数\
  \ 99 添加到资源、对象，并对数组执行取模操作：\n\n```php\n// /repo/ch06/php8_arith_non_scalar_ops.php\n\
  $fn = __DIR__ . '../sample_data/gettysburg.txt';\n$fh = fopen($fn, 'r');\n$obj =\
  \ new class() { public $val = 99; };\n$arr = [1,2,3];\n```\n\n```php\necho \"Adding\
  \ 99 to a resource\\n\";\ntry { var_dump($fh + 99); }\ncatch (Error $e) { echo $e\
  \ . \"\\n\"; }\n```\n\n\n```\necho \"\\nAdding 99 to an object\\n\";\ntry { var_dump($obj\
  \ + 99); }\ncatch (Error $e) { echo $e . \"\\n\"; }\necho \"\\nPerforming array\
  \ % 99\\n\";\ntry { var_dump($arr % 99); }\ncatch (Error $e) { echo $e . \"\\n\"\
  ; }\n```\n\n3. 最后，我们将两个数组相加：\n\n```\necho \"\\nAdding two arrays\\n\";\ntry { var_dump($arr\
  \ + [99]); }\ncatch (Error $e) { echo $e . \"\\n\"; }\n```\n\n当我们运行代码示例时，注意 PHP\
  \ 7 如何执行静默转换并允许操作继续进行：\n\n```\nroot@php8_tips_php7 [ /repo/ch06 ]#\nphp php8_arith_non_scalar_ops.php\n\
  Adding 99 to a resource\n/repo/ch06/php8_arith_non_scalar_ops.php:10:\nint(104)\n\
  Adding 99 to an object\nPHP Notice: Object of class class@anonymous could not be\
  \ converted to int in /repo/ch06/php8_arith_non_scalar_ops.php on line 13\n/repo/ch06/php8_arith_non_scalar_ops.php:13:\n\
  int(100)\nPerforming array % 99\n/repo/ch06/php8_arith_non_scalar_ops.php:16:\n\
  int(1)\nAdding two arrays\n/repo/ch06/php8_arith_non_scalar_ops.php:19:\narray(3)\
  \ {\n  [0] => int(1)\n  [1] => int(2)\n  [2] => int(3)\n}\n```\n\n特别令人惊讶的是，我们可以对数组执行取模操作！在\
  \ PHP 7 中，给对象添加值时会生成一个 Notice。然而，PHP 将对象类型转换为整数，值为 1，从而使算术运算结果为 100。\n\n在 PHP 8\
  \ 中运行相同的代码示例，输出结果截然不同：\n\n```\nroot@php8_tips_php8 [ /repo/ch06 ]#\nphp php8_arith_non_scalar_ops.php\n\
  Adding 99 to a resource\nTypeError: Unsupported operand types: resource + int in\
  \ /repo/ch06/php8_arith_non_scalar_ops.php:10\nAdding 99 to an object\nTypeError:\
  \ Unsupported operand types: class@anonymous + int in /repo/ch06/php8_arith_non_scalar_ops.php:13\n\
  Performing array % 99\nTypeError: Unsupported operand types: array % int in /repo/ch06/php8_arith_non_scalar_ops.php:16\n\
  Adding two arrays\narray(3) {\n  [0]=>  int(1)\n  [1]=>  int(2)\n  [2]=>  int(3)\n\
  }\n```\n\n从输出可以看出，除了添加两个数组之外，PHP 8 一直会抛出 TypeError。在两种输出中，你可能会注意到，当添加两个数组时，第二操作数会被忽略。如果目标是合并两个数组，则必须改用\
  \ array_merge()。\n\n现在让我们把注意力转向 PHP 8 字符串处理中与运算符优先级相关的潜在重大变化。\n\n## 检查优先级的变更\n\n\
  运算符优先级，也称为运算顺序或运算符优先级，是一种在 18 世纪末和 19 世纪初建立的数学概念。PHP 也采用了数学运算符优先级规则，并增加了一个独特之处：连接运算符。PHP\
  \ 语言的创始人假设连接运算符与算术运算符具有相同的优先级。这一假设直到 PHP 8 的到来才从未受到质疑。\n\n在 PHP 8 中，算术运算优先于连接。连接运算符的降级现在将其置于位移运算符（<<\
  \ 和 >>）之下。在任何不使用括号明确定义混合算术和连接运算的地方，都存在潜在的向后兼容性破坏。\n\n这种改变本身不会抛出 Error 或生成 Warnings\
  \ 或 Notices，因此存在隐藏代码破坏的潜在风险。\n\n> **提示**\n> 有关此更改原因的更多信息，请参阅以下链接：\n> https://wiki.php.net/rfc/concatenation_precedence\n\
  \n以下示例最清楚地显示了此更改的影响：\n\n```\necho 'The sum of 2 + 2 is: ' . 2 + 2;\n```\n\n这是 PHP\
  \ 7 中此简单语句的输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch06 ]#\nphp -r \"echo 'The sum\
  \ of 2 + 2 is: ' . 2 + 2;\"\nPHP Warning: A non-numeric value encountered in Command\
  \ line code on line 1\n2\n```\n\n在 PHP 7 中，由于连接运算符与加法运算符具有相同的优先级，字符串 The sum of\
  \ 2 + 2 is: 首先与整数值 2 连接。然后新字符串被类型转换为整数，生成一个 Warning。新字符串的值被评估为 0，然后加上整数 2，输出结果为\
  \ 2。\n\n然而在 PHP 8 中，加法首先执行，然后结果与初始字符串连接。以下是 PHP 8 中运行的结果：\n\n```\nroot@php8_tips_php8\
  \ [ /repo/ch06 ]#\nphp -r \"echo 'The sum of 2 + 2 is: ' . 2 + 2;\"\nThe sum of\
  \ 2 + 2 is: 4\n```\n\n从输出可以看出，结果更符合人类的预期！\n\n另一个示例应能进一步说明降级连接运算符可能带来的差异。请看这行代码：\n\
  \n```\necho '1' . '11' + 222;\n```\n\n这是 PHP 7 中运行的结果：\n\n```\nroot@php8_tips_php7\
  \ [ /repo/ch06 ]#\nphp -r \"echo '1' . '11' + 222;\"\n333\n```\n\nPHP 7 首先执行连接，生成字符串\
  \ 111。然后将其类型转换并加到整数 222，结果为最终整数值 333。以下是 PHP 8 中运行的结果：\n\n```\nroot@php8_tips_php8\
  \ [ /repo/ch06 ]#\nphp -r \"echo '1' . '11' + 222;\"\n1233\n```\n\n在 PHP 8 中，第二字符串\
  \ 11 被类型转换并加到整数 222，产生中间值 233。然后将其类型转换为字符串并在前面加上 1，最终得到字符串值 1233。\n\n现在你已经了解了 PHP\
  \ 8 中算术、按位和连接运算的更改，让我们来看一下 PHP 8 中引入的一个新趋势：区域设置独立性。\n\n## 利用区域设置独立性\n\n在 PHP 8 之前的版本中，多个字符串函数和操作与区域设置绑定。净效果是数字的内部存储方式取决于区域设置。这种做法引入了细微的不一致，很难检测。在阅读完本章介绍的内容后，你将更能检测\
  \ PHP 8 升级后潜在的应用代码更改，从而避免应用失败。\n\n### 了解与区域设置依赖相关的问题\n\n在早期 PHP 版本中，区域设置依赖的不幸副作用是，从浮点到字符串再转换回浮点时结果不一致。当浮点值连接到字符串时也会出现不一致。OpCache\
  \ 执行的某些优化操作导致连接操作在设置区域设置之前发生，这又是可能产生不一致结果的一种方式。\n\n在 PHP 8 中，易受影响的操作和函数现在是区域设置无关的。这意味着所有浮点值现在都使用句点作为小数分隔符存储。默认区域设置不再默认从环境继承。如果需要设置默认区域设置，现在必须显式调用\
  \ setlocale()。\n\n### 查看受区域设置独立性影响的函数和操作\n\n大多数 PHP 函数不受切换到区域设置独立性的影响，原因很简单，区域设置与该函数或扩展无关。此外，大多数\
  \ PHP 函数和扩展已经是区域设置无关的。示例包括 PDO 扩展，以及诸如 var_export() 和 json_encode() 等函数，以及 printf()\
  \ 系列。\n\n受区域设置独立性影响的函数和操作包括以下内容：\n\n- `(string) $float`\n- `strval($float)`\n- `print_r($float)`\n\
  - `var_dump($float)`\n- `debug_zval_dump($float)`\n- `settype($float, \"string\"\
  )`\n- `implode([$float])`\n- `xmlrpc_encode($float)`\n\n以下代码示例说明了由于区域设置独立性而产生的处理差异：\n\
  \n- 1. 首先，我们定义一个要测试的区域设置数组。所选区域设置使用不同的方式表示数字的小数部分：\n- 2. 然后我们遍历区域设置，设置区域设置，并执行从浮点到字符串再到浮点的转换，在每个步骤中回显结果：\n\
  \n// /repo/ch06/php8_locale_independent.php\n$list = ['en_GB', 'fr_FR', 'de_DE'];\n\
  $patt = \"%15s | %15s \\n\";\n```\n\n```\nforeach ($list as $locale) {\n    setlocale(LC_ALL,\
  \ $locale);\n    echo \"Locale          : $locale\\n\";\n    $f = 123456.789;\n\
  \    echo \"Original        : $f\\n\";\n    $s = (string) $f;\n    echo \"Float\
  \ to String : $s\\n\";\n    $r = (float) $s;\n    echo \"String to Float : $r\\\
  n\";\n}\n```\n\n如果我们在 PHP 7 中运行此示例，请注意结果：\n\n```\nroot@php8_tips_php7 [ /repo/ch06\
  \ ]#\nphp php8_locale_independent.php\nLocale          : en_GB\nOriginal       \
  \ : 123456.789\nFloat to String : 123456.789\nString to Float : 123456.789\nLocale\
  \          : fr_FR\nOriginal        : 123456,789\nFloat to String : 123456,789\n\
  String to Float : 123456\nLocale          : de_DE\nOriginal        : 123456,789\n\
  Float to String : 123456,789\nString to Float : 123456\n```\n\n\n\n如您从输出中可以看到，数字在内部使用句点作为\
  \ en_GB 的小数分隔符，而逗号则用于 fr_FR 和 de_DE 区域设置。然而，当字符串转换回数字时，如果小数分隔符不是句点，则字符串会被视为前导数字字符串。在两种区域设置中，逗号的存在会停止转换过程。净效果是小数部分被丢弃，精度丢失。\n\
  \n结果在 PHP 8 中运行相同代码示例如下所示：\n\n```\nroot@php8_tips_php8 [ /repo/ch06 ]#\nphp php8_locale_independent.php\n\
  Locale          : en_GB\nOriginal        : 123456.789\nFloat to String : 123456.789\n\
  String to Float : 123456.789\nLocale          : fr_FR\nOriginal        : 123456.789\n\
  Float to String : 123456.789\nString to Float : 123456.789\nLocale          : de_DE\n\
  Original        : 123456.789\nFloat to String : 123456.789\nString to Float : 123456.789\n\
  ```\n\n在 PHP 8 中，不会丢失精度，并且数字始终使用句点作为小数分隔符表示，无论区域设置如何。\n\n请注意，您仍然可以通过使用 number_format()\
  \ 函数或使用 NumberFormatter 类（来自 Intl 扩展）根据其区域设置表示数字。有趣的是，NumberFormatter 类在内部以区域设置无关的方式存储数字！\n\
  \n> **提示**\n> \n> 有关更多信息，请查看本文： https://wiki.php.net/rfc/locale_independent_float_to_string.\n\
  > \n> 有关国际数字格式的更多信息，请参阅以下链接：\n> https://www.php.net/manual/en/class.numberformatter.php\n\
  \n现在您已经了解了 PHP 8 中存在的区域设置无关方面，我们需要查看数组处理方面的更改。\n\n## PHP 8 中的数组处理\n\n除了性能改进之外，PHP\
  \ 8 数组处理的两个主要更改涉及负偏移量的处理和大括号 ({ }) 的使用。由于这两个更改都可能导致 PHP 8 迁移后应用程序代码中断，因此在此涵盖它们很重要。了解此处提出的问题可以让您更快地使损坏的代码恢复工作。\n\
  \n让我们先来看负数组偏移量的处理。\n\n### 处理负偏移量\n\n在 PHP 中为数组赋值时，如果您未指定索引，PHP 会自动为您分配一个。如此选择索引是一个整数，表示比当前分配的最高整数键大一个的值。如果尚未分配整数索引键，则自动索引分配算法从零开始。\n\
  \n然而在 PHP 7 及更早版本中，在负整数索引的情况下，该算法并未一致应用。如果数字数组的索引以负数开头，则自动索引会跳至零 (0)，而不管下一个数字本应是什么。另一方面，在\
  \ PHP 8 中，自动索引始终按 +1 的值递增，无论索引是负整数还是正整数。\n\n如果您的代码依赖于自动索引，并且任何起始索引都是负数，则可能存在向后兼容的代码中断。此问题的检测很困难，因为自动索引会静默发生，而不会发出任何警告或通知。\n\
  \n以下代码示例说明了 PHP 7 和 PHP 8 之间行为的差异：\n\n- 1. 首先，我们定义一个仅使用负整数作为索引的数组。我们使用 var_dump()\
  \ 来显示此数组：\n\n// /repo/ch06/php8_array_negative_index.php\n$a = [-3 => 'CCC', -2\
  \ => 'BBB', -1 => 'AAA'];\nvar_dump($a);\n```\n\n2. 然后我们定义第二个数组并将第一个索引初始化为 -3。然后我们添加额外的数组元素，但不指定索引。这会导致自动索引发生：\n\
  \n```php\n$b[-3] = 'CCC';\n$b[] = 'BBB';\n$b[] = 'AAA';\nvar_dump($b);\n```\n\n\
  3. 如果我们然后在 PHP 7 中运行程序，请注意第一个数组呈现正确。只要它们是直接分配的，在 PHP 7 及更早版本中完全可以拥有负数组索引。以下是输出：\n\
  \n```bash\nroot@php8_tips_php7 [ /repo/ch06 ]#\nphp php8_array_negative_index.php\n\
  /repo/ch06/php8_array_negative_index.php:6:\narray(3) {\n  [-3] => string(3) \"\
  CCC\"\n  [-2] => string(3) \"BBB\"\n  [-1] => string(3) \"AAA\"\n}\n/repo/ch06/php8_array_negative_index.php:12:\n\
  array(3) {\n  [-3] => string(3) \"CCC\"\n  [0] => string(3) \"BBB\"\n  [1] => string(3)\
  \ \"AAA\"\n}\n```\n\n4. 然而，正如您从第二个 var_dump() 输出中看到的那样，自动数组索引会跳至零，而不管之前的高值如何。\n\n\
  5. 另一方面，在 PHP 8 中，您可以看到输出是一致的。以下是 PHP 8 的输出：\n\n```bash\nroot@php8_tips_php8 [ /repo/ch06\
  \ ]#\nphp php8_array_negative_index.php\narray(3) {\n  [-3]=> string(3) \"CCC\"\n\
  \  [-2]=> string(3) \"BBB\"\n  [-1]=> string(3) \"AAA\"\n}\n}\narray(3) {\n    [-3]=>\
  \ string(3) \"CCC\"\n    [-2]=> string(3) \"BBB\"\n    [-1]=> string(3) \"AAA\"\n\
  }\n```\n\n6. 如输出所示，数组索引会自动分配，按 1 的值递增，使两个数组相同。\n\n> 提示\n> 有关此增强功能的更多信息，请查看本文：\n\
  > https://wiki.php.net/rfc/negative_array_index.\n\n现在您已经了解了涉及负值的索引自动分配的潜在代码中断问题，让我们将注意力转向另一个感兴趣的领域：大括号的使用。\n\
  \n### 处理大括号使用更改\n\n大括号 ({ }) 对于创建 PHP 代码的任何开发人员来说都是熟悉的景象。PHP 语言以 C 语言编写，大量使用 C 语法，包括大括号。众所周知，大括号用于在控制结构（例如\
  \ if { }）中分隔代码块，在循环（例如 for () { }）中，在函数（例如 function xyz() { }）中，以及类中。\n\n然而在本小节中，我们将把对大括号使用的检查限制在与变量相关联的使用上。PHP\
  \ 8 中一个可能重大的更改是使用大括号来标识数组元素。自 PHP 8 起，使用大括号指定数组偏移量现已弃用。\n\n旧用法存在高度争议，原因如下：\n\n-\
  \ 其使用很容易与双引号字符串内的大括号使用混淆。\n- 大括号不能用于进行数组赋值。\n\n因此，PHP 核心团队需要么使大括号的使用与方括号 ([ ]) 一致……要么就去掉这种大括号用法。最终决定是移除对数组中使用大括号的支持。\n\
  \n> 提示\n> 有关更改背景的更多信息，请参阅以下链接： https://wiki.php.net/rfc/deprecate_curly_braces_array_access.\n\
  \n以下是说明该点的代码示例：\n\n- 1. 首先，我们定义一个回调数组，说明已删除或非法的 大括号用法：\n- 2. 然后我们使用 try/catch 块循环遍历回调以捕获抛出的错误：\n\
  \n// /repo/ch06/php7_curly_brace_usage.php\n$func = [\n    1 => function () {\n\
  \        $a = ['A' => 111, 'B' => 222, 'C' => 333];\n        echo 'WORKS: ' . $a{'C'}\
  \ . \"\\n\";\n    },\n    2 => function () {\n        eval('$a = {\"A\",\"B\",\"\
  C\"};');\n    },\n    3 => function () {\n        eval('$a = [\"A\",\"B\"]; $a{}\
  \ = \"C\";');\n    }\n];\n```\n\n```php\nforeach ($func as $example => $callback)\
  \ {\n    try {\n        echo \"\\nTesting Example $example\\n\";\n        $callback();\n\
  \    } catch (Throwable $t) {\n        echo $t->getMessage() . \"\\n\";\n    }\n\
  }\n```\n\n如果我们在 PHP 7 中运行示例，第一个回调有效。第二个和第三个会导致抛出 ParseError：\n\n```\nroot@php8_tips_php7\
  \ [ /repo/ch06 ]#\nphp php7_curly_brace_usage.php\nTesting Example 1\nWORKS: 333\n\
  Testing Example 2\nsyntax error, unexpected '{'\nTesting Example 3\nsyntax error,\
  \ unexpected '}'\n```\n\n当我们在 PHP 8 中运行相同的示例时，然而，没有任何示例有效。以下是 PHP 8 的输出：\n\n```\n\
  root@php8_tips_php8 [ /repo/ch06 ]#\nphp php7_curly_brace_usage.php\nPHP Fatal error:\
  \ Array and string offset access syntax with curly braces is no longer supported\
  \ in /repo/ch06/php7_curly_brace_usage.php on line 8\n```\n\n此潜在代码中断很容易检测到。然而，由于您的代码中有许多大括号，您可能需要等待致命错误被抛出才能捕获代码中断。\n\
  \n现在您已经了解了 PHP 8 中数组处理的更改，让我们来看看与安全相关的函数的更改。\n\n## 精通安全函数和设置的更改\n\nPHP 安全功能的任何更改都值得注意。不幸的是，鉴于当今世界的状况，对任何面向\
  \ Web 的代码的攻击都是必然的。因此，在本节中，我们讨论了 PHP 8 中与安全相关的 PHP 函数的几项更改。受影响的更改函数包括以下内容：\n\n- assert()\n\
  - password_hash()\n- crypt()\n\n\n\n此外，PHP 8 在使用 `php.ini` 文件中的 `disable_functions`\
  \ 指令定义任何函数时的处理方式发生了变化。让我们先来看看这个指令。\n\n## 理解禁用函数处理的变更\n\n网站托管公司通常提供大幅折扣的 **共享托管**\
  \ 套餐。一旦客户注册，托管公司的 IT 人员就会在共享服务器上创建账户，为控制磁盘空间使用分配磁盘配额，并在 Web 服务上创建 **虚拟主机** 定义。然而，这类托管公司面临的问题是，允许\
  \ PHP 无限制访问会给共享托管公司以及同一服务器上的其他用户带来安全风险。\n\n为解决此问题，IT 人员通常会将一个用逗号分隔的函数列表分配给 `php.ini`\
  \ 指令，**disable_functions**。这样一来，列表中的任何函数都无法在该服务器上运行的 PHP 代码中使用。 通常会出现在该列表上的函数是那些允许操作系统访问的函数，例如\
  \ `system()` 或 `shell_exec()`。\n\n只有内部 PHP 函数才能出现在该列表中。内部函数是指包含在 PHP 核心中的函数以及通过扩展提供的函数。用户定义的函数不受此指令影响。\n\
  \n## 检查禁用函数处理的差异\n\n在 PHP 7 及更早版本中，禁用函数无法重新定义。在 PHP 8 中，禁用函数被视为从未存在过，这意味着可以重新定义。\n\
  \n> **重要提示**\n> 仅仅因为你可以在 PHP 8 中重新定义禁用函数 *并不* 意味着原始功能已被恢复！\n\n为说明这一概念，我们首先在 `php.ini`\
  \ 文件中添加这一行：\n`disable_functions=system`。\n\n请注意，我们需要在 *两个* Docker 容器（PHP 7 和 PHP\
  \ 8）中都添加此项以完成说明。更新 `php.ini` 文件的命令如下所示：\n\n```\nroot@php8_tips_php7 [ /repo/ch06\
  \ ]#\necho \"disable_functions=system\">>/etc/php.ini\nroot@php8_tips_php8 [ /repo/ch06\
  \ ]#\necho \"disable_functions=system\">>/etc/php.ini\n```\n\n如果我们随后尝试使用 system()\
  \ 函数，则在 PHP 7 和 PHP 8 中都会失败。这里我们展示 PHP 8 的输出：\n\n```\nroot@php8_tips_php8 [ /repo/ch06\
  \ ]#\nphp -r \"system('ls -l');\"\nPHP Fatal error: Uncaught Error: Call to undefined\
  \ function system() in Command line code:1\n```\n\n我们随后定义一些程序代码来重新定义被禁止的函数：\n\n\
  // /repo/ch06/php8_disabled_funcs_redefine.php\nfunction system(string $cmd, string\
  \ $path = NULL) {\n    $output = '';\n    $path = $path ?? __DIR__;\n    if ($cmd\
  \ === 'ls -l') {\n        $iter = new RecursiveDirectoryIterator($path);\n     \
  \   foreach ($iter as $fn => $obj)\n            $output .= $fn . \"\\n\";\n    }\n\
  \    return $output;\n}\necho system('ls -l');\n```\n\n正如代码示例所示，我们创建了一个函数，它模仿 ls\
  \ -l Linux 系统调用的行为，但仅使用安全的 PHP 函数和类。然而，如果我们尝试在 PHP 7 中运行它，则会抛出致命错误。以下是 PHP 7 的输出：\n\
  \n```\nroot@php8_tips_php7 [ /repo/ch06 ]#\nphp php8_disabled_funcs_redefine.php\n\
  PHP Fatal error: Cannot redeclare system() in /repo/ch06/php8_disabled_funcs_redefine.php\
  \ on line 17\n```\n\n然而在 PHP 8 中，我们的函数重新定义成功了，如下所示：\n\n```\nroot@php8_tips_php8\
  \ [ /repo/ch06 ]#\nphp php8_disabled_funcs_redefine.php\n/repo/ch06/php8_printf_vs_vprintf.php\n\
  /repo/ch06/php8_num_str_non_wf_extracted.php\n/repo/ch06/php8_vprintf_bc_break.php\n\
  /repo/ch06/php7_vprintf_bc_break.php\n```\n\n```\n... not all output is shown ...\n\
  /repo/ch06/php7_curly_brace_usage.php\n/repo/ch06/php7_compare_num_str_valid.php\n\
  /repo/ch06/php8_compare_num_str.php\n/repo/ch06/php8_disabled_funcs_redefine.php\n\
  ```\n\n你现在已经对如何处理禁用函数有了一个概念。接下来，让我们来看看重要的 crypt() 函数的变更。\n\n## 了解 crypt() 函数的变更\n\
  \ncrypt() 函数自 PHP 4 版本以来一直是 PHP 哈希生成的支柱。其持久存在的一个原因是因为它有许多选项。如果你直接在代码中使用 crypt()，你会很高兴地注意到，如果提供了不可用的\
  \ salt 值，长期以来被认为已损坏的数据加密标准 (DES)，不再是 PHP 8 中的后备方案！salt 有时也被称为初始化向量 (IV)。\n\n另一个重要变更涉及\
  \ rounds 值。一次轮次就像洗牌：洗的次数越多，随机化程度越高（除非你面对的是拉斯维加斯的赌牌高手！）。在密码学中，块类似于牌。在每一轮中，密码学函数会应用于每个块。如果密码学函数很简单，哈希可以更快地生成；然而，需要更多的轮次才能完全随机化块。\n\
  \nSHA-1（安全哈希算法）家族使用快速但简单的算法，因此需要更多轮次。另一方面，SHA-2 家族使用更复杂的哈希函数，消耗更多资源，但轮次更少。\n\n在使用\
  \ PHP crypt() 函数与 CRYPT_SHA256（SHA-2 家族）结合时，PHP 8 不再静默地将 rounds 参数解析为最接近的限制。相反，crypt()\
  \ 将以 *0 返回值失败，与 glibc 行为一致。此外，在 PHP 8 中，第二个参数（salt）现在是强制性的。\n\n以下示例说明了使用 crypt()\
  \ 函数时 PHP 7 和 PHP 8 之间的差异：\n\n- 1. 首先，我们定义表示不可用 salt 值和非法轮次数的变量：\n\n// /repo/ch06/php8_crypt_sha256.php\n\
  $password = 'password';\n$salt = str_repeat('+x=', CRYPT_SALT_LENGTH + 1);\n$rounds\
  \ = 1;\n```\n\n- 2. 然后我们使用 crypt() 函数创建两个哈希。在第一次使用中，$default 是在提供无效 salt 参数后的结果。第二次使用中，$sha256\
  \ 提供了有效的 salt 值，但轮次数无效：\n\n```\n$default = crypt($password, $salt);\n$sha256 = crypt($password,\n\
  '$5$rounds=' . $rounds . '$' . $salt . '$');\necho \"Default : $default\\n\";\n\
  echo \"SHA-256 : $sha256\\n\";\n```\n\n以下是代码示例在 PHP 7 中运行的输出：\n\n```\nroot@php8_tips_php7\
  \ [ /repo/ch06 ]#\nphp php8_crypt_sha256.php\nPHP Deprecated: crypt(): Supplied\
  \ salt is not valid for DES. Possible bug in provided salt format. in /repo/ch06/php8_crypt_sha256.php\
  \ on line 7\nDefault : +xj31ZMTZkVA\nSHA-256 : $5$rounds=1000$+x=+x=+x=+x=+x=+\n\
  $3Si/vFn6/xmdTdyleJ17Rb9Heg6DWgkRVKS9T0Zzy/B\n```\n\n注意 PHP 7 如何静默修改原始请求。在第一种情况下，crypt()\
  \ 回退到 DES（！）。在第二种情况下，PHP 7 静默地将 rounds 值从 1 修改为最接近的限制 1000。\n\n另一方面，同一代码在 PHP 8\
  \ 中运行会失败并返回 *0，如下所示：\n\n```\nroot@php8_tips_php8 [ /repo/ch06 ]#\nphp php8_crypt_sha256.php\n\
  Default : *0\nSHA-256 : *0\n```\n\n正如我们在本书中反复强调的，当 PHP 为你做出假设时，最终你会得到产生不一致结果的糟糕代码。在刚才显示的代码示例中，最佳实践是定义一个类方法或函数，以对参数施加更大的控制。通过这种方式，你可以验证参数，避免依赖\
  \ PHP 的假设。\n\n接下来，我们来看看 password_hash() 函数的变更。\n\n## 处理 password_hash() 的变更\n\n\
  多年来，太多开发者误用了 crypt()，PHP 核心团队决定添加一个包装函数 password_hash()。这被证明是一个巨大的成功，现在是使用最广泛的安全函数之一。以下是\
  \ password_hash() 的函数签名：\n\n```\npassword_hash(string $password, mixed $algo, array\
  \ $options=?)\n```\n\n当前支持的算法包括 bcrypt、Argon2i 和 Argon2id。建议你使用预定义的算法常量：PASSWORD_BCRYPT、PASSWORD_ARGON2I\
  \ 和 PASSWORD_ARGON2ID。PASSWORD_DEFAULT 算法目前设置为 bcrypt。选项因算法而异。如果使用 PASSWORD_BCRYPT\
  \ 或 PASSWORD_DEFAULT 算法，选项包括 cost 和 salt。\n\n常规 wisdom 建议最好使用 password_hash() 函数创建的随机生成的\
  \ salt。在 PHP 7 中，salt 选项已被弃用，并在 PHP 8 中被忽略。这不会导致向后兼容性中断，除非你因其他原因依赖 salt。\n\n在此代码示例中，使用了非随机\
  \ salt 值：\n\n// /repo/ch06/php8_password_hash.php\n$salt = 'xxxxxxxxxxxxxxxxxxxxxxxx';\n\
  $password = 'password';\n$hash = password_hash(\n    $password, PASSWORD_DEFAULT,\
  \ ['salt' => $salt]);\necho $hash . \"\\n\";\nvar_dump(password_get_info($hash));\n\
  ```\n\n在 PHP 7 输出中，会发出弃用 Notice：\n\n```\nroot@php8_tips_php7 [ /repo/ch06 ]# php\
  \ php8_password_hash.php\nPHP Deprecated: password_hash(): Use of the 'salt' option\
  \ to password_hash is deprecated in /repo/ch06/php8_password_hash.php on line 6\n\
  $2y$10$xxxxxxxxxxxxxxxxxxxxxxu0d9YtxiLKHM/198x//sqUV1V2XTZEZ.\n/repo/ch06/php8_password_hash.php:8:\n\
  array(3) {\n  'algo' => int(1)\n```\n\n\n\n```\n'algoName' => string(6) \"bcrypt\"\
  \n'options' => array(1) { 'cost' => int(10) }\n}\n```\n\n你还会注意到，从 PHP 7 的输出中，非随机盐值清晰可见。还有一点需要注意的是，当执行\
  \ password_get_info() 时，algo 键显示的值是一个整数，对应于其中一个预定义的算法常量。\n\nPHP 8 的输出有所不同，如下所示：\n\
  \n```\nroot@php8_tips_php8 [ /repo/ch06 ]# php php8_password_hash.php\nPHP Warning:\
  \ password_hash(): The \"salt\" option has been ignored, since providing a custom\
  \ salt is no longer supported in /repo/ch06/php8_password_hash.php on line 6\n$2y$10$HQNRjL.kCkXaR1ZAOFI3TuBJd11k4YCRWmtrIlB7ZDaX1Jngh9UNW\n\
  array(3) {\n[\"algo\"]=> string(2) \"2y\"\n[\"algoName\"]=> string(6) \"bcrypt\"\
  \n[\"options\"]=> array(1) { [\"cost\"]=> int(10) }\n}\n```\n\n你可以看出盐值被忽略了，而是使用了随机盐。与\
  \ Notice 不同，PHP 8 会针对使用 salt 选项发出 Warning。输出的另一个需要注意的点是，在 PHP 8 中调用 password_get_info()\
  \ 时，algorithm 键返回的是字符串而不是整数。这是因为预定义的算法常量现在是字符串值，对应于在 crypt() 函数中使用时的签名。\n\n我们将在下一小节中检查的最后一个函数是\
  \ assert()。\n\n## 了解 assert() 的更改\n\nassert() 函数通常与测试和诊断相关。我们将其包含在此小节中，因为它通常具有安全影响。开发人员在尝试追踪潜在安全漏洞时有时会使用此函数。\n\
  \n要使用 assert() 函数，你必须首先通过在 php.ini 文件中添加设置 zend.assertions=1 来启用它。启用后，你可以在应用程序代码中的任何位置放置一个或多个\
  \ assert() 函数调用。\n\n## 理解 assert() 用法的更改\n\n从 PHP 8 开始，不再可能向 `assert()` 提供要求值的字符串参数：相反，你必须提供一个表达式。这会导致潜在的代码中断，因为在\
  \ PHP 8 中，字符串被视为表达式，因此始终解析为布尔值 `TRUE`。此外，`assert.quiet_eval` php.ini 指令以及与 `assert_options()`\
  \ 一起使用的预定义常量 `ASSERT_QUIET_EVAL` 在 PHP 8 中已被移除，因为它们现在没有效果。\n\n为了说明潜在问题，我们首先通过设置\
  \ php.ini 指令 `zend.assertions=1` 来激活断言。然后我们按如下方式定义一个示例程序：\n\n- 1. 我们使用 `ini_set()`\
  \ 使 `assert()` 抛出异常。我们还定义了一个变量 `$pi`：\n- 2. 然后我们尝试将断言作为表达式 `$pi === M_PI`：\n- 3.\
  \ 在最后一个 try/catch 块中，我们尝试将断言作为字符串：\n\n```php\n// /repo/ch06/php8_assert.php\nini_set('assert.exception',\
  \ 1);\n$pi = 22/7;\necho 'Value of 22/7: ' . $pi . \"\\n\";\necho 'Value of M_PI:\
  \ ' . M_PI . \"\\n\";\n```\n\n```php\ntry {\n    $line   = __LINE__ + 2;\n    $message\
  \ = \"Assertion expression failed ${line}\\n\";\n    $result  = assert($pi === M_PI,\n\
  \        new AssertionError($message));\n    echo ($result) ? \"Everything's OK\\\
  n\"\n        : \"We have a problem\\n\";\n} catch (Throwable $t) {\n    echo $t->getMessage()\
  \ . \"\\n\";\n}\n```\n\n```php\ntry {\n    $line   = __LINE__ + 2;\n    $message\
  \ = \"Assertion string failed ${line}\\n\";\n    $result  = assert('$pi === M_PI',\n\
  \        new AssertionError($message));\n    echo ($result) ? \"Everything's OK\\\
  n\"\n        : \"We have a problem\\n\";\n} catch (Throwable $t) {\n    echo $t->getMessage()\
  \ . \"\\n\";\n}\n```\n\n- 4. 当我们在 PHP 7 中运行程序时，一切按预期工作：\n\n```\nroot@php8_tips_php7\
  \ [ /repo/ch06 ]# php php8_assert.php\nValue of 22/7: 3.1428571428571\nValue of\
  \ M_PI: 3.1415926535898\nAssertion as expression failed on line 18\nAssertion as\
  \ a string failed on line 28\n```\n\n- 5. M_PI 的值来自数学扩展，比简单地将 22 除以 7 要准确得多！因此，两个断言都会抛出异常。然而在\
  \ PHP 8 中，输出明显不同：\n\n```\nroot@php8_tips_php8 [ /repo/ch06 ]# php php8_assert.php\n\
  Value of 22/7: 3.1428571428571\nValue of M_PI: 3.1415926535898\nAssertion as expression\
  \ failed on line 18\nEverything's OK\n```\n\n字符串形式的断言被解释为表达式。因为字符串不为空，布尔结果为 TRUE，从而返回假阳性。如果你的代码依赖于字符串形式的断言结果，它注定会失败。然而从\
  \ PHP 8 的输出可以看出，表达式形式的断言在 PHP 8 中与 PHP 7 中工作方式相同。\n\nTip\n提示\n最佳实践：不要在生产代码中使用 assert()。如果你确实使用\
  \ assert()，始终提供表达式，而不是字符串。\n\n现在你对安全相关函数的更改有了一定的了解，我们就此结束本章。\n\n## 摘要\n\n在本章中，你了解了\
  \ PHP 8 与早期版本之间字符串处理方面的差异，以及如何开发解决字符串处理差异的变通方法。正如你所学，PHP 8 对字符串函数参数的数据类型施加了更大的控制，并引入了在参数缺失或为空时的行为一致性。正如你所学，PHP\
  \ 早期版本的一个大问题是，代表你做了几个静默假设，导致出现大量意外结果的潜在风险。\n\n在本章中，我们还强调了涉及数字字符串与数字数据比较的问题。你不仅了解了数字字符串、类型转换和非严格比较，还了解了\
  \ PHP 8 如何纠正早期版本中存在的数字字符串处理固有缺陷。 本章涵盖的另一个主题展示了与若干运算符在 PHP 8 中行为不同的相关潜在问题。你学习了如何发现潜在问题，并被提供了改进代码健壮性的最佳实践。\n\
  \n本章还讨论了许多 PHP 函数对区域设置依赖的问题，以及 PHP 8 如何解决此问题。你了解到在 PHP 8 中，浮点表示现在是统一的，不再依赖于区域设置。你还了解了\
  \ PHP 8 处理数组元素的方式的更改以及若干安全相关函数的更改。\n\n本章涵盖的提示、技巧和技术提高了人们对 PHP 早期版本不一致行为的认识。有了这种新的认识，你能更好地控制\
  \ PHP 代码的使用。你现在也更能发现可能导致 PHP 8 迁移后代码中断的情况，这使你比其他开发人员更具优势，最终能编写可靠且一致的 PHP 代码。\n\n\
  下一章将向你展示如何避免涉及 PHP 扩展更改的潜在代码中断。\n"
- "## 7 在使用 PHP 8 扩展时避免陷阱\n\nPHP：超文本预处理器（PHP）语言的主要优势之一是其扩展。PHP 8 中引入的 PHP 语言更改也要求扩展开发团队同时更新其扩展。在本章中，你将了解对扩展做出的主要更改以及在将现有应用程序更新到\
  \ PHP 8 时如何避免陷阱。\n\n一旦你完成本章介绍的示例代码和主题的审阅，你将能够为迁移到 PHP 8 准备任何现有的 PHP 代码。除了了解各种扩展的更改外，你还将深入了解其运行方式。这种能力将使你在\
  \ PHP 8 中使用扩展时做出明智的决策。\n\n本章涵盖的主题包括以下内容：\n\n- 了解从资源到对象的转变\n- 了解 **可扩展标记语言** (**XML**)\
  \ 扩展的更改\n- 避免使用更新后的 `mbstring` 扩展时出现的问题\n- 处理 `gd` 扩展的更改\n- 发现 `Reflection` 扩展的更改\n\
  - 处理其他扩展的陷阱\n\n## 技术要求\n\n要检查和运行本章提供的代码示例，最低推荐硬件如下所示：\n\n- 基于 x86_64 的台式电脑或笔记本电脑\n\
  - 1 **千兆字节** (**GB**) 可用磁盘空间\n- 4 GB **随机存取存储器** (**RAM**)\n- 500 **千位每秒** (**Kbps**)\
  \ 或更快的互联网连接\n\n此外，你需要安装以下软件：\n\n- Docker\n- Docker Compose\n\n请参阅 *第 1 章，介绍新的 PHP\
  \ 8 OOP 功能* 中的 *技术要求* 部分，了解有关 Docker 和 Docker Compose 安装的更多信息，以及如何构建本书中用于演示代码的 Docker\
  \ 容器。在本书中，我们将恢复本书示例代码的目录称为 `/repo`。\n\n\n\n本章的源代码位于此处：\n\n```\nhttps://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices/tree/main/ch07\n\
  ```\n\n我们现在可以通过考察 PHP 8 中向对象而非资源发展的整体趋势来开始我们的讨论。\n\n## 理解从资源到对象的转变\n\nPHP 语言与资源的关系一直不太融洽。资源代表与外部系统的连接，例如文件句柄或使用客户端\
  \ URL（cURL）扩展连接到远程 Web 服务。然而，资源的一个大问题是它们违抗数据类型化的尝试。无法区分文件句柄和 cURL 连接——它们都被标识为资源。\n\
  \n在 PHP 8 中，已做出重大努力远离资源并用对象取代它们。在 PHP 8 之前，这一趋势最早的例子之一是 PDO 类。当你创建一个 PDO 实例时，它会自动创建数据库连接。从\
  \ PHP 8 开始，许多以前产生资源的功能现在改为产生对象实例。让我们从查看现在产生对象而非资源的扩展函数开始讨论。\n\n## PHP 8 扩展资源到对象迁移\n\
  \n很重要，你要了解 PHP 8 中哪些函数现在产生对象而不是资源。好消息是，扩展函数也已被重写，以便接受对象作为参数而非资源。坏消息是，在你初始化资源（现在是对象）并使用\
  \ is_resource() 函数测试成功时，存在潜在的向后兼容代码中断。\n\n下表总结了以前返回资源但现在返回对象实例的函数：\n\n| 扩展 | 函数\
  \ | 返回值 |\n|---|---|---|\n| 核心 | socket_create() <br> socket_create_listen() <br>\
  \ socket_accept() <br> socket_import_stream() <br> socket_addrinfo_connect() <br>\
  \ socket_addrinfo_bind() <br> socket_wsprotocol_info_import() <br> socket_addrinfo_lookup()\
  \ | Socket <br> Socket <br> Socket <br> Socket <br> Socket <br> Socket <br> Socket\
  \ <br> array of AddressInfo |\n| cURL | curl_init() <br> curl_multi_init() <br>\
  \ curl_share_init() | CurlHandle <br> CurlMultiHandle <br> CurlShareHandle |\n|\
  \ Enchant | enchant_broker_init() <br> enchant_broker_request_dict() <br> enchant_broker_request_pwl_dict()\
  \ | EnchantBroker <br> EnchantDictionary <br> EnchantDictionary |\n| GD | imagecreate*()\
  \ | GdImage |\n| OpenSSL | openssl_x509_read() <br> openssl_csr_sign() <br> openssl_csr_new()\
  \ <br> openssl_pkey_new() | OpenSSLCertificate <br> OpenSSLCertificate <br> OpenSSLCertificateSigningRequest\
  \ <br> OpenSSLAsymmetricKey |\n| Semaphore | msg_get_queue() <br> sem_get() <br>\
  \ shm_attach() | SysvMessageQueue <br> SysvSemaphore <br> SysvSharedMemory |\n|\
  \ 共享内存 | shmop_open() | Shmop |\n| XML 解析器 | xml_parser_create() <br> xml_parser_create_ns()\
  \ | XMLParser <br> XMLParser |\n| Zlib | inflate_init() <br> deflate_init() | InflateContext\
  \ <br> DeflateContext |\n\n表 7.1 – PHP 8 资源到对象迁移\n\n表 7.1 是函数现在产生对象而非资源的宝贵指南。在将任何现有应用程序迁移到\
  \ PHP 8 之前，请查阅此表。下一节将详细说明潜在的向后兼容代码中断以及如何调整有问题的代码的指南，然后再介绍好处。\n\n## 涉及 is_resource()\
  \ 的潜在代码中断\n\n你可能会遇到的问题是，PHP 8 之前编写的代码假定表 7.1 中列出的函数返回资源。因此，聪明的开发者习惯使用 is_resource()\
  \ 作为测试连接是否成功建立的手段。\n\n虽然这是一种极其合理的检查方式，但此技术在 PHP 8 升级后现在引入了向后兼容的代码中断。以下示例演示了此问题。\n\
  \n在此代码示例中，为外部网站初始化了 cURL 连接。接下来的几行使用 is_resource() 函数测试成功：\n\n```php\n// ///repo/ch07/php7_ext_is_resource.php\n\
  $url = 'https://unlikelysource.com/';\n$ch  = curl_init($url);\nif (is_resource($ch))\n\
  \    echo \"Connection Established\\n\";\nelse\n    throw new Exception('Unable\
  \ to establish connection');\n```\n\nPHP 7 的以下输出显示成功：\n\n```\nroot@php8_tips_php7\
  \ [ /repo/ch07 ]#\nphp php7_ext_is_resource.php\nConnection Established\n```\n\n\
  同一代码在 PHP 8 中运行的输出不成功，如下所示：\n\n```\nroot@php8_tips_php8 [ /repo/ch07 ]#\nphp php7_ext_is_resource.php\n\
  PHP Fatal error:  Uncaught Exception: Unable to establish connection in /repo/ch07/php7_ext_is_resource.php:9\n\
  ```\n\nPHP 8 的输出具有误导性，因为连接已建立！然而，因为程序代码正在检查 cURL 句柄是否为资源，所以代码抛出 Exception 错误。失败的原因是返回的是\
  \ CurlHandle 实例而不是资源。\n\n在这种情况下，你可以通过用 !empty()（非空）代替 is_resource()，使代码在 PHP 8 和任何更早的\
  \ PHP 版本中都能成功运行，从而避免代码中断，如下所示：\n\n```php\n// ///repo/ch07/php8_ext_is_resource.php\n\
  $url = 'https://unlikelysource.com/';\n$ch  = curl_init($url);\nif (!empty($ch))\n\
  \    echo \"Connection Established\\n\";\nelse\n    throw new Exception('Unable\
  \ to establish connection');\nvar_dump($ch);\n```\n\n代码示例在 PHP 7 中运行的输出如下：\n\n```\n\
  root@php8_tips php7 [ /repo/ch07 ]#\nphp php8_ext_is_resource.php\nConnection Established\n\
  /repo/ch07/php8_ext_is_resource.php:11:\nresource(4) of type (curl)\n```\n\n同一代码示例在\
  \ PHP 8 中运行的输出如下：\n\n```\nroot@php8_tips php8 [ /repo/ch07 ]#\nphp php8_ext_is_resource.php\n\
  Connection Established\nobject(CurlHandle)#1 (0) {}\n```\n\n从两个输出中可以看到，代码运行成功：在\
  \ PHP 7 中，$ch 是一个资源。在 PHP 8 中，$ch 是一个 CurlHandle 实例。现在你已经了解了关于 is_resource() 的潜在问题，让我们来看看由此变化带来的优势。\n\
  \n## 对象相对于资源的优势\n\n在 PHP 8 之前，在将资源传递给函数或方法或从函数或方法返回资源时，没有办法提供数据类型。相对于资源产生对象的一个明显优势是，你可以利用对象类型提示。\n\
  \n为了说明这一优势，想象一组实现策略软件设计模式的超文本传输协议（HTTP）客户端类。一种策略涉及使用 cURL 扩展发送消息。另一种策略使用 PHP 流，如下所示：\n\
  \n- 1. 我们首先定义一个 Http/Request 类。类构造函数将给定的 URL 解析为其组成部分，如以下代码片段所示：\n\n```php\n// /repo/src/Http/Request.php\n\
  namespace Http;\nclass Request {\n    public $url      = '';\n    public $method\
  \   = 'GET';\n    // not all properties shown\n    public $query    = '';\n    public\
  \ function __construct(string $url) {\n$result = [];\n$parsed = parse_url($url);\n\
  $vars   = array_keys(get_object_vars($this));\nforeach ($vars as $name)\n    $this->$name\
  \ = $parsed[$name] ?? '';\n    if (!empty($this->query))\n        parse_str($this->query,\
  \ $result);\n    $this->query = $result;\n    $this->url   = $url;\n}\n}\n```\n\n\
  - 2. 接下来，我们定义一个使用 cURL 扩展发送消息的 CurlStrategy 类。请注意，__construct() 方法使用构造函数参数提升。你可能还会注意到，我们为\
  \ $handle 参数提供了 CurlHandle 数据类型。这是一个仅在 PHP 8 中可用的巨大优势，并且确保创建此策略类实例的任何程序都必须提供正确资源数据类型。代码如下所示：\n\
  \n```php\n// /repo/src/Http/Client/CurlStrategy.php\nnamespace Http\\Client;\nuse\
  \ CurlHandle;\nuse Http\\Request;\nclass CurlStrategy {\n    public function __construct(\n\
  \        public CurlHandle $handle) {}\n```\n\n- 3. 然后我们定义用于发送消息的实际逻辑，如下所示：\n\n\
  ```php\npublic function send(Request $request) {\n    // not all code is shown\n\
  \    curl_setopt($this->handle,\n        CURLOPT_URL, $request->url);\n    if (strtolower($request->method)\
  \ === 'post') {\n        $opts = [CURLOPT_POST => 1,\n            CURLOPT_POSTFIELDS\
  \ =>\n                http_build_query($request->query)];\n        curl_setopt_array($this->handle,\
  \ $opts);\n```\n\n```\n}\n    return curl_exec($this->handle);\n}\n}\n```\n\n4.\
  \ 我们然后可以用 StreamsStrategy 类做同样的事情。再次注意，在下面的代码片段中，我们如何使用类作为构造函数参数类型提示以确保策略的正确使用：\n\
  \n// /repo/src/Http/Client/StreamsStrategy.php\nnamespace Http\\Client;\nuse SplFileObject;\n\
  use Exception;\nuse Http\\Request;\nclass StreamsStrategy {\n    public function\
  \ __construct(\n        public ?SplFileObject $obj) {}\n    // remaining code not\
  \ shown\n```\n\n5. 然后我们定义一个调用程序来调用两个策略并传递结果。在设置自动加载之后，我们创建一个新的 Http\\Request 实例，提供一个任意\
  \ URL 作为参数，如下所示：\n\n// //repo/ch07/php8_objs_returned.php\nrequire_once __DIR__\n\
  \    . './../../src/Server/Autoload/Loader.php';\n$autoload = new \\Server\\Autoload\\\
  Loader();\nuse Http\\Request;\nuse Http\\Client\\{CurlStrategy,StreamsStrategy};\n\
  $url = 'https://api.unlikely-source.com/api?city=Livonia&country=US';\n$request\
  \ = new Request($url);\n```\n\n6. 接下来，我们定义一个 StreamsStrategy 实例并发送请求，如下所示：\n\n```\n\
  $streams = new StreamsStrategy();\n$response = $streams->send($request);\necho $response;\n\
  ```\n\n7. 然后我们定义一个 CurlStrategy 实例并发送相同的请求，如下所示的代码片段所示：\n\n```\n$curl = new CurlStrategy(curl_init());\n\
  $response = $curl->send($request);\necho $response;\n```\n\n两个策略的输出是相同的。这里显示了部分输出（请注意，此示例只能在\
  \ PHP 8 中使用！）：\n\n```\nroot@php8_tips_php8 [ /repo/ch07 ]#\nphp php8_objs_returned.php\n\
  CurlStrategy Results:\n{\"data\":[{\"id\":\"1227826\",\"country\":\"US\",\"postcode\"\
  :\"14487\",\"city\":\"Livonia\",\"state_prov_name\":\"New York\",\"state_prov_code\"\
  :\"NY\",\"locality_name\":\"Livingston\",\"locality_code\":\"051\",\"region_name\"\
  :\"\",\"region_code\":\"\",\"latitude\":\"42.8135\",\"longitude\":\"-77.6635\",\"\
  accuracy\":\"4\"},{\"id\":\"1227827\",\"country\":\"US\",\"postcode\":\"14488\"\
  ,\"city\":\"Livonia Center\",\"state_prov_name\":\"New York\",\"state_prov_code\"\
  :\"NY\",\"locality_name\":\"Livingston\",\"locality_code\":\"051\",\"region_name\"\
  :\"\",\"region_code\":\"\",\"latitude\":\"42.8215\",\"longitude\":\"-77.6386\",\"\
  accuracy\":\"4\"}]}\n```\n\n现在让我们看一下资源到对象迁移的另一个方面：它对迭代的影响。\n\n## Traversable 到 IteratorAggregate\
  \ 迁移\n\n`Traversable` 接口首次在 PHP 5 中引入。它没有方法，主要用于允许对象使用简单的 foreach() 循环进行迭代。随着 PHP\
  \ 开发的不断演进，经常需要获取内部迭代器。因此，在 PHP 8 中，许多以前实现 Traversable 的类现在改为实现 IteratorAggregate。\n\
  \n这并不意味着增强的类不再支持 `Traversable` 接口固有的能力。恰恰相反：`IteratorAggregate` 扩展了 `Traversable`！此增强意味着您现在可以对受影响的类的任何实例调用\
  \ `getIterator()`。这可能具有巨大的好处，因为在 PHP 8 之前，没有办法访问各种扩展中使用的内部迭代器。下表总结了受此增强影响的扩展和类：\n\
  \n| 扩展 | 实现 IteratorAggregate |\n|---|---|\n| Date | DatePeriod |\n| DOM | DOMNamedNodeMap\
  \ and DOMNodeList |\n| Intl | IntlBreakIterator and ResourceBundle |\n| MySQLi |\
  \ mysqli_result |\n| PDO_MySQL | PDOStatement |\n| SPL | SplFixedArray |\n\n表 7.2\
  \ – 现在实现 IteratorAggregate 而不是 Traversable 的类\n\n在本节中，您了解到了 PHP 8 中引入的一项重要更改：使用对象而非资源的趋势。您学到的一个优点是，与资源相比，对象允许您获得更大的控制权。本节中涵盖的另一个优点是，PHP\
  \ 8 向 `IteratorAggregate` 的转变允许访问以前无法访问的内置迭代器。\n\n我们现在将注意力转向基于 XML 的扩展的更改。\n\n##\
  \ 了解 XML 扩展的更改\n\nXML 版本 1.0 于 1998 年作为 **万维网联盟 (W3C)** 规范引入。XML 与 **超文本标记语言 (HTML)**\
  \ 有些相似；然而，XML 的主要目的是提供一种可供机器和人类阅读的格式化数据的方式。XML 仍然被广泛使用的原因之一是它易于理解，并且在表示树形结构数据方面做得非常出色。\n\
  \nPHP 提供了许多扩展，允许您同时使用和生成 XML 文档。在 PHP 8 中，对其中许多扩展引入了一些更改。就其大部分而言，这些更改是微小的；然而，如果您希望成为一名全面且知情的\
  \ PHP 开发者，了解这些更改非常重要。\n\n让我们首先看看 `XMLWriter` 扩展的更改。\n\n## 检查 XMLWriter 扩展差异\n\n\
  所有 XMLWriter 扩展过程函数现在接受并返回 XMLWriter 对象而不是资源。如果您查看 XMLWriter 扩展的官方 PHP 文档，您会发现没有对过程函数的引用。其原因有二：首先，PHP\
  \ 语言正慢慢远离离散的过程函数，而青睐 **面向对象编程 (OOP)**。\n\n第二个原因是 XMLWriter 过程函数实际上只是 XMLWriter OOP\
  \ 方法的包装器！例如，xmlwriter_open_memory() 是 XMLWriter::openMemory() 的包装器，xmlwriter_text()\
  \ 是 XMLWriter::text() 的包装器，等等。\n\n如果您真的坚持使用过程式编程技术使用 XMLWriter 扩展，xmlwriter_open_memory()\
  \ 在 PHP 8 中创建 XMLWriter 实例而不是资源。同样，所有 XMLWriter 扩展过程函数都使用 XMLWriter 实例而不是资源。\n\n\
  与本章中提到的现在生成对象实例而不是资源的任何扩展一样，可能存在向后兼容的破坏。一个这样的破坏示例是您在使用 XMLWriter 过程函数并使用 is_resource()\
  \ 检查是否已创建资源时。我们在这里不向您展示示例，因为问题和解决方案与上一节中描述的相同：使用 !empty() 而不是 is_resource()。\n\n\
  使用 XMLWriter 扩展 OOP **应用程序编程接口 (API)** 而不是过程 API 是一个 *最佳实践*。幸运的是，OOP API 自 PHP 5.1\
  \ 起就已可用。以下是供下一个示例使用的示例 XML 文件：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<fruit>\n    <item>Apple</item>\n    <item>Banana</item>\n</fruit>\n```\n\n\
  这里显示的示例在 PHP 7 和 8 中都有效。此示例的目的是使用 XMLWriter 扩展构建前面显示的 XML 文档。以下是完成此操作的步骤：\n\n- 1.\
  \ 我们首先创建 XMLWriter 实例。然后我们打开共享内存连接并初始化 XML 文档类型，如下所示：\n\n```php\n// //repo/ch07/php8_xml_writer.php\n\
  $xml = new XMLWriter();\n```\n\n```php\n$xml->openMemory();\n$xml->startDocument('1.0',\
  \ 'UTF-8');\n```\n\n- 2. 接下来，我们使用 startElement() 初始化 fruit 根节点，并添加一个值为 Apple 的子节点\
  \ item，如下所示：\n\n```php\n$xml->startElement('fruit');\n$xml->startElement('item');\n\
  $xml->text('Apple');\n$xml->endElement();\n```\n\n- 3. 接下来，我们添加另一个值为 Banana 的子节点\
  \ item，如下所示：\n\n```php\n$xml->startElement('item');\n$xml->text('Banana');\n$xml->endElement();\n\
  ```\n\n- 4. 最后，我们关闭 fruit 根节点并结束 XML 文档。以下代码片段中的最后一条命令显示当前 XML 文档：\n\n```php\n$xml->endElement();\n\
  $xml->endDocument();\necho $xml->outputMemory();\n```\n\n以下是 PHP 7 中运行示例程序的输出：\n\
  \n```\nroot@php8_tips_php7 [/repo/ch07 ]# php php8_xml_writer.php\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<fruit><item>Apple</item><item>Banana</item></fruit>\n\
  ```\n\n正如您所见，所需的 XML 文档已生成。如果我们在 PHP 8 中运行相同的程序，结果是相同的（未显示）。\n\n我们现在将注意力转向 SimpleXML\
  \ 扩展的更改。\n\n## 处理 SimpleXML 扩展的更改\n\nSimpleXML 扩展是面向对象的并且被广泛使用。因此，了解 PHP 8 中对该扩展所做的一些重大更改至关重要。好消息是您不需要重写任何代码！更好的消息是，这些更改大大提高了\
  \ SimpleXML 扩展的功能。\n\n\n\n\n自 PHP 8 起，SimpleXMLElement 类现在实现了标准 PHP 库（SPL）RecursiveIterator\
  \ 接口，并包含了 SimpleXMLIterator 类的功能。在 PHP 8 中，SimpleXMLIterator 现在是 SimpleXMLElement\
  \ 的一个空扩展。考虑到 XML 常常用于表示复杂的树形结构数据，这一看似简单的更新具有重要意义。\n\n例如，请查看温莎王朝家族树的局部视图，如下所示：\n\n\
  ![](img/dbf2674d5b31107c344104b5edcb21c5_271_0.png)\n\n图 7.1 – 复杂树形结构数据的示例\n\n如果我们用\
  \ XML 来建模，它可能看起来像这样：\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!-- /repo/ch07/tree.xml\
  \ -->\n<family>\n    <branch name=\"Windsor\">\n        <descendent gender=\"M\"\
  >George V</descendent>\n<spouse gender=\"F\">Mary of Teck</spouse>\n<branch name=\"\
  George V\">\n    <descendent gender=\"M\">George VI</descendent>\n    <spouse gender=\"\
  F\">Elizabeth Bowes-Lyon</spouse>\n    <branch name=\"George VI\">\n        <descendent\
  \ gender=\"F\">Elizabeth II</descendent>\n        <spouse gender=\"M\">Prince Philip</spouse>\n\
  \        <branch name=\"Elizabeth II\">\n            <descendent gender=\"M\">Prince\
  \ Charles</descendent>\n            <spouse gender=\"F\">Diana Spencer</spouse>\n\
  \            <spouse gender=\"F\">Camilla Parker Bowles</spouse>\n            <branch\
  \ name=\"Prince Charles\">\n                <descendent gender=\"M\">William</descendent>\n\
  \                <spouse gender=\"F\">Kate Middleton</spouse>\n            </branch>\n\
  \            <!-- not all nodes are shown -->\n        </branch>\n    </branch>\n\
  </branch>\n</branch>\n</family>\n```\n\n然后我们开发代码来解析树。然而在 PHP 8 之前的版本中，我们需要定义一个递归函数来解析整个树。为此，我们将遵循以下步骤：\n\
  \n- 1. 我们首先定义一个递归函数，用于显示后代的姓名和配偶（如有），如下面的代码片段所示。该函数还会识别后代的性别并检查是否存在子嗣。如果为真，则函数会再次调用自身：\n\
  \n```\nfunction recurse($branch) {\n    foreach ($branch as $node) {\n        echo\
  \ $node->descendent;\n        echo ($node->descendent['gender'] == 'F')\n      \
  \      ? ', daughter of '\n            : ', son of ';\n        echo $node['name'];\n\
  \        if (empty($node->spouse)) echo \"\\n\";\n        else echo \", married\
  \ to {$node->spouse}\\n\";\n        if (!empty($node->branch))\n            recurse($node->branch);\n\
  \    }\n}\n```\n\n- 2. 然后我们从外部 XML 文件创建一个 SimpleXMLElement 实例并调用递归函数，如下所示：\n\n```\n\
  // /repo/ch07/php7_simple_xml.php\n$fn = __DIR__ . './includes/tree.xml';\n$xml\
  \ = simplexml_load_file($fn);\nrecurse($xml);\n```\n\n此代码块在 PHP 7 和 PHP 8 中均可运行。以下是\
  \ PHP 7 下的输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch07 ]#\nphp php7_simple_xml.php\n\
  George V, son of Windsor, married to Mary of Teck\nGeorge VI, son of George V, married\
  \ to Elizabeth Bowes-Lyon\nElizabeth II, daughter of George VI, married to Philip\n\
  Prince Charles, son of Elizabeth II, married to Diana Spencer\nWilliam, son of Prince\
  \ Charles, married to Kate Middleton\nHarry, son of Prince Charles, married to Meghan\
  \ Markle\nPrincess Anne, daughter of Elizabeth II, married to M. Phillips\nPrincess\
  \ Margaret, daughter of George VI, married to A. Jones\nEdward VIII, son of George\
  \ V, married to Wallis Simpson\nPrincess Mary, daughter of George V, married to\
  \ H.Lascelles\nPrince Henry, son of George V, married to Lady Alice Montagu\nPrince\
  \ George, son of George V, married to Princess Marina\nPrince John, son of George\
  \ V\n```\n\n然而在 PHP 8 中，由于 SimpleXMLElement 现在实现了 RecursiveIterator，产生相同结果的代码更简单。\n\
  \n- 3. 与前面示例一样，我们从外部文件定义一个 SimpleXMLElement 实例。然而无需定义递归函数——我们只需要定义一个 RecursiveIteratorIterator\
  \ 实例，如下所示：\n\n```php\n// /repo/ch07/php8_simple_xml.php\n$fn = __DIR__ . '/includes/tree.xml';\n\
  $xml = simplexml_load_file($fn);\n$iter = new RecursiveIteratorIterator($xml,\n\
  \    RecursiveIteratorIterator::SELF_FIRST);\n```\n\n- 4. 之后，我们只需要一个简单的 foreach()\
  \ 循环，其内部逻辑与前一个示例相同。无需检查是否存在分支节点，也无需递归——这些都由 RecursiveIteratorIterator 实例处理！所需的代码如下所示：\n\
  \n```php\nforeach ($iter as $branch) {\n    if (!empty($branch->descendent)) {\n\
  \        echo $branch->descendent;\n        echo ($branch->descendent['gender']\
  \ == 'F')\n            ? ', daughter of '\n            : ', son of ';\n        echo\
  \ $branch['name'];\n        if (empty($branch->spouse)) echo \"\\n\";\n        else\
  \ echo \", married to {$branch->spouse}\\n\";\n    }\n}\n```\n\n此代码示例在 PHP 8 下的输出如下所示。如你所见，输出完全相同：\n\
  \n```\nroot@php8_tips_php8 [ /repo/ch07 ]# php php8_simple_xml.php\nGeorge V, son\
  \ of Windsor, married to Mary of Teck\nGeorge VI, son of George V, married to Elizabeth\
  \ Bowes-Lyon\nElizabeth II, daughter of George VI, married to Philip\nPrince Charles,\
  \ son of Elizabeth II, married to Diana Spencer\nWilliam, son of Prince Charles,\
  \ married to Kate Middleton\nHarry, son of Prince Charles, married to Meghan Markle\n\
  Princess Anne, daughter of Elizabeth II, married to M. Phillips\nPrincess Margaret,\
  \ daughter of George VI, married to A. Jones\nEdward VIII, son of George V, married\
  \ to Wallis Simpson\nPrincess Mary, daughter of George V, married to H.Lascelles\n\
  Prince Henry, son of George V, married to Lady Alice Montagu\nPrince George, son\
  \ of George V, married to Princess Marina\nPrince John, son of George V\n```\n\n\
  > 重要提示\n> 请注意，使用 Docker 容器运行这些示例时，此处显示的输出已略作修改以适应页面宽度。\n\n现在让我们来看一下其他 XML 扩展的更改。\n\
  \n## 了解其他 XML 扩展更改\n\nPHP 8 的其他 XML 扩展也有一些更改。大多数情况下，这些更改很小，不会造成显著的向后兼容代码中断的潜在风险。然而，如果我们不讨论这些额外更改就疏忽了。我们建议您浏览本小节中的剩余更改，以便提高您的认识。使用这些\
  \ XML 扩展将使您能够排查在 PHP 8 更新后行为不一致的应用程序代码。\n\n### 对 libxml 扩展的更改\n\n**libxml** 扩展利用了\
  \ **Expat C 库**，提供了各种 PHP XML 扩展使用的 XML 解析函数（https://libexpat.github.io/）。\n\n服务器上安装的\
  \ libxml 版本有新的要求。运行 PHP 8 时的最低版本必须为 2.9.0（或更高）。此更新要求的主要好处之一是提高对 **XML 外部实体** (**XXE**)\
  \ 处理攻击的防护。\n\n推荐的 libxml 最低版本默认禁用了依赖于 libxml 扩展的 PHP XML 扩展加载外部 XML 实体的能力。这反过来减少了为防止\
  \ XXE 攻击而采取昂贵且耗时的额外步骤的需求。\n\n> **提示**\n> 有关 XXE 攻击的更多信息，请使用以下链接咨询 **开放式 Web 应用程序安全项目**\
  \ (**OWASP**)：https://owasp.org/www-community/vulnerabilities/XML_External_Entity_(XXE)_Processing.\n\
  \n### 对 XMLReader 扩展的更改\n\n`XMLReader` 扩展补充了 `XMLWriter` 扩展。`XMLWriter` 扩展旨在生成 XML\
  \ 文档，而 `XMLReader` 扩展旨在读取。\n\n两个方法 `XMLReader::open()` 和 `XMLReader::xml()` 现在被定义为\
  \ **静态方法**。您仍然可以创建 `XMLReader` 实例，但如果您扩展 `XMLReader` 并重写其中任何一个方法，请确保将其声明为静态。\n\n\
  ### 对 XMLParser 扩展的更改\n\n`XMLParser` 扩展是 PHP 最古老的 XML 扩展之一。因此，它几乎完全由过程函数组成，而不是类和方法。然而在\
  \ PHP 8 中，该扩展遵循了从资源转向对象的趋势。因此，当您运行 `xml_parser_create()` 或 `xml_parser_create_ns()`\
  \ 时，会创建一个 `XMLParser` 实例而不是资源。\n\n如 *涉及 is_resource() 的潜在代码中断* 部分所述，您只需将使用 `is_resource()`\
  \ 的任何检查替换为 `!empty()` 即可。资源到对象迁移的另一个副作用是使 `xml_parser_free()` 函数变得多余。要停用解析器，只需使用\
  \ `XMLParser` 对象即可。\n\n现在您已经了解了与 XML 扩展相关的更改，这将帮助您更高效地解析和管理 XML 数据。通过利用本节中提到的新功能，您可以编写比\
  \ PHP 8 之前更高效、性能更好的代码。现在让我们来看一下 `mbstring` 扩展。\n\n\n\n## 避免更新 mbstring 扩展时出现的问题\n\
  \nmbstring 扩展最早在 PHP 4 中引入，此后一直是该语言的活跃组成部分。该扩展最初的目的是提供对各种日文字符编码系统的支持。此后，增加了对多种其他编码的支持——最显著的是基于\
  \ **通用编码字符集 2 (UCS-2)**、**UCS-4**、**Unicode 转换格式 8 (UTF-8)**、**UTF-16**、**UTF-32**、**Shift_JIS\
  \ 日本工业标准 (SJIS)** 和 **国际标准化组织 8859 (ISO-8859)** 等的编码支持。\n\n如果不确定服务器支持哪些编码，只需按如下方式运行\
  \ `mb_list_encodings()` 命令（显示部分输出）：\n\n```\nroot@php8_tips_php7 [ /repo/ch07 ]#\n\
  php -r \"var_dump(mb_list_encodings());\"\nCommand line code:1:\narray(87) {\n \
  \   ... only selected output is shown ...\n    [14] => string(7) \"UCS-4BE\"\n \
  \   [16] => string(5) \"UCS-2\"\n    [19] => string(6) \"UTF-32\"\n    [22] => string(6)\
  \ \"UTF-16\"\n    [25] => string(5) \"UTF-8\"\n    [26] => string(5) \"UTF-7\"\n\
  \    [27] => string(9) \"UTF7-IMAP\"\n    [28] => string(5) \"ASCII\"\n    [29]\
  \ => string(6) \"EUC-JP\"\n    [30] => string(4) \"SJIS\"\n    [31] => string(9)\
  \ \"eucJP-win\"\n    [32] => string(11) \"EUC-JP-2004\"\n    [76] => string(6) \"\
  KOI8-R\"\n    [78] => string(9) \"ArmSCII-8\"\n    [79] => string(5) \"CP850\"\n\
  \    [80] => string(6) \"JIS-ms\"\n    [81] => string(16) \"ISO-2022-JP-2004\"\n\
  \    [86] => string(7) \"CP50222\"\n}\n```\n\n如前面的输出所示，我们在书中使用的 PHP 7.1 Docker 容器支持\
  \ 87 种编码。在 PHP 8.0 Docker 容器中（未显示输出），支持 80 种编码。现在让我们看看 PHP 8 中引入的更改，从 mb_str*()\
  \ 函数开始。\n\n### 发现 mb_str*() 函数中 needle 参数的差异\n\n在第 6 章《理解 PHP 8 功能差异》中，你了解到 PHP\
  \ 8 对核心 str*pos()、str*str() 和 str*chr() 函数的 needle 参数处理引入了更改。两个主要的 needle 参数差异是能够接受空的\
  \ needle 参数以及严格的类型检查以确保 needle 参数仅为字符串。为了保持一致性，PHP 8 在对应的 mb_str*() 函数中引入了相同的更改。\n\
  \n首先让我们先查看空 needle 参数的处理。\n\n### mb_str*() 函数的空 needle 参数处理\n\n为了使 mbstring 扩展与核心字符串函数的这一更改保持一致，以下\
  \ mbstring 扩展函数现在允许空的 needle 参数。需要注意的是，这并不意味着参数可以省略或为可选！此更改的含义是，作为 needle 参数提供的值现在也可以包括被视为空的内容。快速了解\
  \ PHP 认为为空的内容的好方法可以在 empty() 函数的文档中找到（https://www.php.net/empty）。以下是现在允许空 needle\
  \ 参数值的 mbstring 函数列表：\n\n- `mb_strpos()`\n- `mb_strrpos()`\n- `mb_stripos()`\n-\
  \ `mb_strripos()`\n- `mb_strstr()`\n- `mb_stristr()`\n- `mb_strrchr()`\n- `mb_strrichr()`\n\
  \n> 提示\n> \n> 这里提到的八个 mbstring 扩展函数各自与其核心 PHP 对应函数完全平行。有关这些函数的更多信息，请查看此参考文档：https://www.php.net/manual/en/ref.mbstring.php。\n\
  \n下面简短的代码示例说明了上述八个函数中的空 needle 处理。以下是导致此的步骤：\n\n1. 首先，我们初始化一个多字节文本字符串。在以下示例中，这是\
  \ *敏捷的棕色狐狸跳过了栅栏* 的泰语翻译。needle 参数设为 NULL，并初始化要测试的函数数组：\n\n```php\n// /repo/ch07/php8_mb_string_empty_needle.php\n\
  $text   = 'สุนัขจิ้งจอกสีน้ำตาลกระโดดข้ามรั้วอย่างรวดเร็ว';\n$needle = NULL;\n$funcs\
  \  = ['mb_strpos',  'mb_strrpos', 'mb_stripos',\n           'mb_strripos', 'mb_strstr',\
  \ 'mb_stristr',\n           'mb_strrchr',  'mb_strrichr'];\n```\n\n2. 然后我们定义一个 printf()\
  \ 模式，并循环遍历要测试的函数。对每个函数调用，我们提供文本后跟空的 needle 参数，如下所示：\n\n```php\n$patt = \"Testing:\
  \ %12s : %s\\n\";\nforeach ($funcs as $str)\n    printf($patt, $str, $str($text,\
  \ $needle));\n```\n\nPHP 7 的输出如下所示：\n\n```\nroot@php8_tips_php7 [ /repo/ch07 ]#\n\
  php php8_mb_string_empty_needle.php\nPHP Warning:  mb_strpos(): Empty delimiter\
  \ in /repo/ch07/php8_mb_string_empty_needle.php on line 12\nTesting:      mb_strpos\
  \ :\nTesting:      mb_strrpos :\nPHP Warning:  mb_stripos(): Empty delimiter in\
  \ /repo/ch07/php8_mb_string_empty_needle.php on line 12\nTesting:      mb_stripos\
  \ :\nTesting:      mb_strripos :\n```\n\n```\nPHP Warning:  mb_strstr(): Empty delimiter\
  \ in /repo/ch07/php8_mb_string_empty_needle.php on line 12\nTesting:      mb_strstr\
  \ :\nPHP Warning:  mb_stristr(): Empty delimiter in /repo/ch07/php8_mb_string_empty_needle.php\
  \ on line 12\nTesting:      mb_stristr :\nTesting:      mb_strrchr :\nTesting: \
  \     mb_strrichr :\n```\n\n如你所见，输出为空，并且在某些情况下会发出 Warning 消息。PHP 8 中的输出截然不同，如预期所示，如下所示：\n\
  \n```\nroot@php8_tips_php8 [ /repo/ch07 ]#\nphp php8_mb_string_empty_needle.php\n\
  Testing:      mb_strpos : 0\nTesting:      mb_strrpos : 46\nTesting:      mb_stripos\
  \ : 0\nTesting:      mb_strripos : 46\nTesting:      mb_strstr : สุนัขจึงอกสั่นน้ำตาลกระโดดข้ามรั้วอย่างรวดเร็ว\n\
  Testing:      mb_stristr : สุนัขจึงอกสั่นน้ำตาลกระโดดข้ามรั้วอย่างรวดเร็ว\nTesting:\
  \      mb_strrchr :\nTesting:      mb_strrichr :\n```\n\n有趣的是，当此代码在 PHP 8 中运行时，空的\
  \ needle 参数对于 mb_strpos() 和 mb_stripos() 返回整数 0 的值，对于 mb_strrpos() 和 mb_strripos()\
  \ 返回整数 46。在 PHP 8 中，空的 needle 参数在此情况下被解释为字符串的开头或结尾。mb_strstr() 和 mb_stristr() 的结果均为整个字符串。\n\
  \n### mb_str*() 函数的数据类型检查\n\n为了与核心 str*() 函数保持一致，对应的 mb_str*() 函数中的 needle 参数必须是字符串类型。如果提供\
  \ American Standard Code for Information Interchange (ASCII) 值而不是字符串，受影响的函数现在将抛出\
  \ ArgumentTypeError 错误。本小节未显示示例，因为第 6 章《理解 PHP 8 功能差异》已在核心 str*() 函数中提供了此差异的示例。\n\
  \n### mb_strrpos() 的差异\n\n在 PHP 的早期版本中，允许将字符编码作为第三个参数传递给 mb_strrpos() 而不是偏移量。这种不良做法在\
  \ PHP 8 中不再受支持。相反，你可以提供 0 作为第三个参数，或者考虑使用 PHP 8 的命名参数（在第 1 章《Introducing New PHP\
  \ 8 OOP Features》中的“Understanding named arguments”部分讨论）以避免必须为可选参数提供值。\n\n现在让我们看一个代码示例，演示\
  \ PHP 7 和 PHP 8 之间处理上的差异。按如下方式操作：\n\n- 1. 我们首先定义一个常量来表示要使用的字符编码。分配一个代表敏捷的棕色狐狸跳过了栅栏的泰语翻译的文本字符串。然后我们使用\
  \ mb_convert_encoding() 确保使用正确的编码。代码在以下片段中说明：\n- 2. 然后我们将栅栏的泰语翻译分配给 $needle 并输出字符串的长度和\
  \ $needle 在文本中的位置。然后我们调用 mb_strrpos() 查找 $needle 的最后一次出现。请注意，在以下代码片段中，我们故意遵循使用编码作为第三个参数而不是偏移量的不良做法：\n\
  \n```php\n// /repo/ch07/php7_mb_string_strpos.php\ndefine('ENCODING', 'UTF-8');\n\
  $text    = 'สุนัขจิ้งจอกสีน้ำตาลกระโดดข้ามรั้วอย่างรวดเร็ว';\n$encoded = mb_convert_encoding($text,\
  \ ENCODING);\n```\n\n```php\n$needle  = 'รั้ว';\necho 'String Length: '\n    . mb_strlen($encoded,\
  \ ENCODING) . \"\\n\";\necho 'Substring Pos: '\n    . mb_strrpos($encoded, $needle,\
  \ ENCODING) . \"\\n\";\n```\n\n此代码示例的输出在 PHP 7 中完美运行，如下所示：\n\n```\nroot@php8_tips_php7\
  \ [ /repo/ch07 ]#\nphp php7_mb_string_strpos.php\nString Length: 46\nSubstring Pos:\
  \ 30\n```\n\n\n\n从前面的输出可以看到，多字节字符串的长度为 46，针的位置为 30。另一方面，在 PHP 8 中，我们会得到一个致命的 Uncaught\
  \ TypeError 消息，如下所示：\n\n```\nroot@php8_tips_php8 [ /repo/ch07 ]#\nphp php7_mb_string_strpos.php\n\
  String Length: 46\nPHP Fatal error: Uncaught TypeError: mb_strrpos(): Argument #3\
  \ ($offset) must be of type int, string given in /repo/ch07/php7_mb_string_strpos.php:14\n\
  ```\n\n从 PHP 8 的输出可以看到，mb_strrpos() 的第三个参数必须是整数形式的偏移值。重写此示例的一个简单方法是利用 PHP 8 的命名参数。以下是重写的代码行：\n\
  \n```\necho 'Substring Pos: '\n    . mb_strrpos($encoded, $needle, encoding:ENCODING)\
  \ . \"\\n\";\n```\n\n输出与 PHP 7 示例相同，此处不显示。现在让我们转向 mbstring 扩展的正则表达式（regex）处理差异。\n\
  \n## Examining changes to mb_ereg*() functions\n\nmb_ereg*() 函数的更改\n\nThe mb_ereg*()\
  \ family of functions allows regex processing of strings encoded using multi-byte\
  \ character sets. In contrast, the core PHP language provides the Perl Compatible\
  \ Regular Expressions (PCRE) family of functions, with modern and more up-to-date\
  \ functionality.\n\nmb_ereg*() 函数族允许对使用多字节字符集编码的字符串进行正则表达式处理。相比之下，PHP 核心语言提供了 Perl\
  \ 兼容正则表达式（PCRE）函数族，具有更现代、更新的功能。\n\nIf you add a u (lowercase letter U) modifier\
  \ to a regex pattern when using the PCRE functions, any UTF-8 encoded multi-byte\
  \ character string is accepted. However, UTF-8 is the only multi-byte character\
  \ encoding accepted. If you are dealing with other character encodings and wish\
  \ to perform regex functionality, you will need to either convert to UTF-8 or use\
  \ the mb_ereg*() family of functions. Let's now have a look at a number of changes\
  \ to the mb_ereg*() family of functions.\n\n如果在使用 PCRE 函数时在正则表达式模式中添加 u（小写字母 U）修饰符，则接受任何\
  \ UTF-8 编码的多字节字符字符串。但是，UTF-8 是唯一被接受的多字节字符编码。如果您处理的是其他字符编码并且希望执行正则表达式功能，则需要将其转换为\
  \ UTF-8 或使用 mb_ereg*() 函数族。现在让我们看一下 mb_ereg*() 函数族的许多更改。\n\n## Oniguruma library\
  \ required in PHP 8\n\nPHP 8 需要 Oniguruma 库\n\nOne change to this family of functions\
  \ is in how your PHP installation is compiled. In PHP 8, your operating system must\
  \ provide the libonig library. This library provides Oniguruma functionality. (See\
  \ https://github.com/kkos/oniguruma for more information.) The older --with-onig\
  \ PHP source-compile-configure option has been removed in favor of using pkg-config\
  \ to detect libonig.\n\n此函数族的一个更改在于 PHP 安装的编译方式。在 PHP 8 中，您的操作系统必须提供 libonig 库。该库提供\
  \ Oniguruma 功能。（有关更多信息，请参阅 https://github.com/kkos/oniguruma。）旧的 --with-onig PHP\
  \ 源代码编译配置选项已被移除，取而代之的是使用 pkg-config 来检测 libonig。\n\n## Changes to mb_ereg_replace()\n\
  \nmb_ereg_replace() 的更改\n\nFormerly, you were able to supply an integer as an argument\
  \ to mb_ereg_replace(). This argument was interpreted as an ASCII code point. In\
  \ PHP 8, such an argument is now typecast as string. If you need an ASCII code point,\
  \ you need to use mb_chr() instead. As the typecast to string is done silently,\
  \ there is a potential backward-compatible code break, in that you won't see any\
  \ Notice or Warning messages.\n\n以前，您可以向 mb_ereg_replace() 供应一个整数作为参数。该参数被解释为 ASCII\
  \ 代码点。在 PHP 8 中，此类参数现在被类型转换为字符串。如果您需要 ASCII 代码点，则需要改用 mb_chr()。由于类型转换是静默完成的，因此存在潜在的向后兼容代码中断，即您不会看到任何\
  \ Notice 或 Warning 消息。\n\nThe following program code example illustrates the differences\
  \ between PHP 7 and PHP 8. We'll follow these next steps:\n\n以下程序代码示例说明了 PHP 7 和\
  \ PHP 8 之间的差异。我们将按以下步骤进行：\n\n- 1. First, we define the encoding to be used and assign\
  \ the Thai translation of *Two quick brown foxes jumped over the fence* as a multi-byte\
  \ string to `$text`. Next, we use `mb_convert_encoding()` to ensure that the proper\
  \ encoding is used. We then set `mb_ereg*` to the chosen encoding, using `mb_regex_encoding()`.\
  \ The code is illustrated in the following snippet:\n- 1. 首先，我们定义要使用的编码，并将 *两只敏捷的棕色狐狸跳过了栅栏*\
  \ 的泰语翻译分配为多字节字符串赋给 `$text`。接下来，我们使用 `mb_convert_encoding()` 来确保使用正确的编码。然后，我们使用 `mb_regex_encoding()`\
  \ 将 `mb_ereg*` 设置为所选编码。代码在以下片段中说明：\n- 2. We then call `mb_ereg_replace()` and supply\
  \ as a first argument an integer value 50, and replace it with the string \"3\"\
  . Both the original and modified strings are echoed. You can view the code here:\n\
  - 2. 然后我们调用 `mb_ereg_replace()` 并以整数值 50 作为第一个参数提供，并将其替换为字符串 \"3\"。原始字符串和修改后的字符串都会被输出。您可以在此处查看代码：\n\
  \n```php\n// /repo/ch07/php7_mb_string_strpos.php\ndefine('ENCODING', 'UTF-8');\n\
  $text = 'สุนัขจิ้งจอกสีน้ำตาล 2 ตัวกระโดดข้ามรั้ว';\n$str = mb_convert_encoding($text,\
  \ ENCODING);\nmb_regex_encoding(ENCODING);\n```\n\n```php\n$mod1 = mb_ereg_replace(50,\
  \ '3', $str);\necho \"Original: $str\\n\";\necho \"Modified: $mod1\\n\";\n```\n\n\
  Note that the first argument for mb_ereg_replace() should be a string, but we supply\
  \ an integer instead. In versions of the mbstring extension prior to PHP 8, if an\
  \ integer is supplied as the first argument, it's treated as an ASCII code point.\n\
  \n请注意，mb_ereg_replace() 的第一个参数应为字符串，但我们提供的是整数。在 PHP 8 之前的 mbstring 扩展版本中，如果提供整数作为第一个参数，则将其视为\
  \ ASCII 代码点。\n\nIf we run this code example in PHP 7, the number 50 is interpreted\
  \ as the ASCII code point value for \"2\", as expected, as we can see here:\n\n\
  如果我们在 PHP 7 中运行此代码示例，数字 50 将被解释为 \"2\" 的 ASCII 代码点值，正如预期的那样，如下所示：\n\n```\nroot@php8_tips_php7\
  \ [ /repo/ch07 ]#\nphp php7_mb_string_ereg_replace.php\nOriginal: สุนัขจิ้งจอกสีน้ำตาล\
  \ 2 ตัวกระโดดข้ามรั้ว\nModified: สุนัขจิ้งจอกสีน้ำตาล 3 ตัวกระโดดข้ามรั้ว\n```\n\
  \nAs you can see from the preceding output, the number 2 is replaced by the number\
  \ 3. In PHP 8, however, the number 50 is typecast into a string. As this source\
  \ string doesn't contain the number 50, no replacements are made, as we can see\
  \ here:\n\n从前面的输出可以看到，数字 2 被数字 3 替换。然而在 PHP 8 中，数字 50 被类型转换为字符串。由于源字符串不包含数字 50，因此没有进行任何替换，如下所示：\n\
  \n```\nroot@php8_tips_php8 [ /repo/ch07 ]#\nphp php7_mb_string_ereg_replace.php\n\
  Original: สุนัขจิ้งจอกสีน้ำตาล 2 ตัวกระโดดข้ามรั้ว\nModified: สุนัขจิ้งจอกสีน้ำตาล\
  \ 2 ตัวกระโดดข้ามรั้ว\n```\n\nThe danger here is that if your code relies upon this\
  \ silent interpretation process, your application might either fail or exhibit inconsistent\
  \ behavior. You'll also note a lack of Notice or Warning messages. PHP 8 relies\
  \ upon the developer to supply the correct arguments!\n\n这里的危险在于，如果您的代码依赖于这种静默解释过程，您的应用程序可能会失败或表现出不一致的行为。您还会注意到缺少\
  \ Notice 或 Warning 消息！PHP 8 依赖开发者提供正确的参数！\n\nThe *best practice*, if you do actually\
  \ need to use an ASCII code point, is to use `mb_chr()` to produce the desired search\
  \ string. The modified code example might look like this:\n\n*最佳实践* 是，如果您确实需要使用\
  \ ASCII 代码点，请使用 `mb_chr()` 来生成所需的搜索字符串。修改后的代码示例可能如下所示：\n\n```\n$mod1 = mb_ereg_replace(mb_chr(50),\
  \ '3', $str);\n```\n\nYou now have an idea about what changed in the `mbstring`\
  \ extension. Without this information, you could easily end up writing faulty code.\
  \ Developers who are unaware of this information might end up making mistakes in\
  \ PHP 8, such as assuming the `mbstring` aliases are still in place. Such mistaken\
  \ understanding can easily cause hours of lost time tracking down errors in program\
  \ code following a PHP 8 migration.\n\n您现在对 `mbstring` 扩展发生了什么变化有了大致了解。没有这些信息，您很容易写出有缺陷的代码。不了解这些信息的开发者可能会在\
  \ PHP 8 中犯错误，例如假设 `mbstring` 别名仍然存在。这种错误的理解很容易导致在 PHP 8 迁移后花费数小时追踪程序代码中的错误。\n\n\
  It's now time to have a look at another extension with major changes: the GD extension.\n\
  \n现在是时候查看另一个发生重大更改的扩展：GD 扩展。\n\n## Dealing with changes to the GD extension\n\n\
  处理 GD 扩展的更改\n\nThe **GD extension** is an image-manipulation extension that leverages\
  \ the GD library. GD originally stood for **GIF Draw**. Oddly, the GD library had\
  \ to withdraw support for the **Graphics Interchange Format (GIF)** after Unisys\
  \ revoked the open source license for the compression technology used when generating\
  \ GIFs. After 2004, however, the Unisys patent on this technology expired and GIF\
  \ support was restored. As it stands today, the PHP GD extension offers support\
  \ for the **Joint Photographic Experts Group (JPEG or JPG)**, **Portable Network\
  \ Graphic (PNG)**, **GIF**, **X BitMap (XBM)**, **X PixMap (XPM)**, **Wireless Bitmap\
  \ (WBMP)**, **WebP**, and **Bitmap (BMP)** formats.\n\n**GD 扩展** 是一个利用 GD 库的图像处理扩展。GD\
  \ 最初代表 **GIF Draw**。奇怪的是，在 Unisys 撤销用于生成 GIF 的压缩技术的开源许可后，GD 库不得不撤回对 **图形交换格式 (GIF)**\
  \ 的支持。然而在 2004 年之后，Unisys 对该技术的专利到期，GIF 支持得以恢复。截至目前，PHP GD 扩展提供对 **联合摄影专家组 (JPEG\
  \ 或 JPG)**、**便携式网络图形 (PNG)**、**GIF**、**X 位图 (XBM)**、**X 像素图 (XPM)**、**无线位图 (WBMP)**、**WebP**\
  \ 和 **位图 (BMP)** 格式的支持。\n\n> **Tip**\n> For more information on the GD library,\
  \ see https://libgd.github.io/.\n> **提示**\n> 有关 GD 库的更多信息，请参阅 https://libgd.github.io/.\n\
  \nLet's now have a look at the impact of resource-to-object migration on the GD\
  \ extension.\n\n现在让我们看看资源到对象迁移对 GD 扩展的影响。\n\n## GD extension resource-to-object\
  \ migration\n\nGD 扩展资源到对象迁移\n\nAs with other PHP extensions that previously used\
  \ *resources*, the GD extension has also primarily migrated from *resource* to *object*.\
  \ As mentioned in the *PHP 8 extension resource-to-object migration* section, all\
  \ of the `imagecreate*()` functions now produce GdImage objects rather than resources.\n\
  \n与其他以前使用 *资源* 的 PHP 扩展一样，GD 扩展也主要从 *资源* 迁移到 *对象*。如 *PHP 8 扩展资源到对象迁移* 部分所述，所有 `imagecreate*()`\
  \ 函数现在生成 GdImage 对象而不是资源。\n\nFor an example of how this might present a code break\
  \ after a PHP 8 migration, run these examples in two different browser tabs (on\
  \ your local computer) and compare the difference. First, we run the PHP 7 example\
  \ using this URL: http://172.16.0.77/ch07/php7_gd_is_resource.php. Here is the result:\n\
  \n作为 PHP 8 迁移后可能出现代码中断的示例，请在两个不同的浏览器标签页（在本地计算机上）运行这些示例并比较差异。首先，我们使用此 URL 运行 PHP\
  \ 7 示例：http://172.16.0.77/ch07/php7_gd_is_resource.php。结果如下：\n\n![](img/dbf2674d5b31107c344104b5edcb21c_285_0.png)\n\
  \nFigure 7.2 – PHP 7 GD image resource\n\n图 7.2 – PHP 7 GD 图像资源\n\nAs you can see\
  \ from the preceding output, a resource extension is identified, but there's no\
  \ descriptive information. Now, let's run the PHP 8 example using this URL: http://172.16.0.88/ch07/php8_gd_is_resource.php.\
  \ Here is the result:\n\n从前面的输出可以看到，识别出资源扩展，但没有描述性信息。现在，让我们使用此 URL 运行 PHP 8 示例：http://172.16.0.88/ch07/php8_gd_is_resource.php。结果如下：\n\
  \n![](img/dbf2674d5b31107c344104b5edcb21c_286_0.png)\n\nFixed point implementation\
  \ of the bilinear interpolation (default (also on image creation))\n\n双线性插值的定点实现（默认（也在图像创建时））\n\
  \nFigure 7.3 – PHP 8 GD image object instance\n\n图 7.3 – PHP 8 GD 图像对象实例\n\nThe\
  \ output from PHP 8 not only identifies the return type as a GdImage instance but\
  \ also displays descriptive information below the image.\n\nPHP 8 的输出不仅将返回类型识别为\
  \ GdImage 实例，还在图像下方显示描述性信息。\n\nWe now turn our attention to other GD extension changes.\n\
  \n我们现在将注意力转向 GD 扩展的其他更改。\n\n## GD extension compile flag changes\n\nGD 扩展编译标志更改\n\
  \nThe GD extension not only leverages the GD library but a number of supporting\
  \ libraries as well. These libraries are needed to provide support for the various\
  \ graphics formats. Previously, when compiling a custom version of PHP from the\
  \ source code, you needed to specify the location of the libraries for JPEG, PNG,\
  \ XPM, and VPX formats. In addition, as compression is an important aspect in reducing\
  \ the overall final file size, the location of ZLIB was needed as well.\n\nGD 扩展不仅利用\
  \ GD 库，还利用了许多支持库。这些库是提供各种图形格式支持所必需的。以前，从源代码编译自定义 PHP 版本时，您需要指定 JPEG、PNG、XPM 和 VPX\
  \ 格式库的位置。此外，由于压缩是减少最终文件总大小的重要方面，还需要 ZLIB 的位置。\n\nWhen compiling PHP 8 from source,\
  \ there are a number of significant configuration flag changes that were first introduced\
  \ in PHP 7.4 and subsequently carried into PHP 8. The primary change is that you\
  \ no longer need to specify the directory where libraries are located. PHP 8 now\
  \ locates libraries using the pkg-config operating system equivalent.\n\n从源代码编译\
  \ PHP 8 时，有许多重要的配置标志更改，这些更改首次在 PHP 7.4 中引入，随后保留到 PHP 8。主要更改是您不再需要指定库所在的目录。PHP 8\
  \ 现在使用 pkg-config 操作系统等效方式定位库。\n\n\n\n下表总结了编译标志的更改。这些标志在实际编译过程之前与 configure 实用程序一起使用：\n\
  \n| 旧编译标志 | 新编译标志 |\n|---|---|\n| --with-gd | --enable-gd |\n| --with-jpeg-dir=DIR\
  \ | --with-jpeg |\n| --with-xpm-dir=DIR | --with-xpm |\n| --with-vpx-dir=DIR | --with-webp\
  \ |\n| --with-png-dir=DIR | 已移除：需要 libpng |\n| --with-zlib-dir | 已移除：需要 zlib |\n\
  \n表 7.3 – GD 编译选项更改\n\n从表中可以看出，大多数情况下，大多数 --with-*-dir 选项都被 --with-* 替换。此外，PNG 和\
  \ ZLIB 支持现在是自动的；但是，您必须在操作系统上安装 libpng 和 zlib。\n\n我们现在来看看 GD 扩展的其他次要更改。\n\n## 其他\
  \ GD 扩展更改\n\n除了上一节描述的主要更改之外，还发生了许多其他次要更改，表现为函数签名更改和一个新函数。让我们从 imagecropauto() 函数开始讨论。\n\
  \n以下是 imagecropauto() 的旧函数签名：\n\n```\nimagecropauto(resource $image , int $mode\
  \ = -1,\n    float $threshold = .5 , int $color = -1 )\n```\n\n在 PHP 8 中，$image\
  \ 参数现在的类型为 GdImage。$mode 参数现在默认为 IMG_CROP_DEFAULT 预定义常量。\n\n另一个更改影响 imagepolygon()、imageopenpolygon()\
  \ 和 imagefilledpolygon() 函数。以下是 imagepolygon() 的旧函数签名：\n\n```\nimagepolygon(resource\
  \ $image, array $points,\n    int $num_points, int $color)\n```\n\n在 PHP 8 中，$num_points\
  \ 参数现在是可选的。如果省略，点的数量将按如下方式计算：count($points) / 2。但是，这意味着 $points 数组中的元素数量必须是偶数！\n\
  \n最后的重要更改是新增了一个函数 `imagegetinterpolation()`。以下是其函数签名：\n\n```\nimagegetinterpolation(GdImage\
  \ $image) : int\n```\n\n返回值是一个整数，其本身并不是很有用。但是，如果您查看 `imagesetinterpolation()` 函数的文档（`https://www.php.net/manual/en/function.imagesetinterpolation.php`），您将看到插值方法代码的列表以及解释。\n\
  \n您现在已经了解了在 GD 扩展中引入了哪些更改。接下来我们检查 `Reflection` 扩展的更改。\n\n## 发现 Reflection 扩展的更改\n\
  \n**Reflection extension** 用于对对象、类、方法、函数等执行 *introspection*。`ReflectionClass` 和\
  \ `ReflectionObject` 分别提供有关类或对象实例的信息。`ReflectionFunction` 提供有关过程级函数的信息。此外，`Reflection`\
  \ 扩展有一组由刚才提到的主类产生的次要类。这些次要类包括由 `ReflectionClass::getMethod()` 产生的 `ReflectionMethod`、由\
  \ `ReflectionClass::getProperty()` 产生的 `ReflectionProperty` 等等。\n\n您可能会想：*Who uses\
  \ this extension?* 答案是：任何需要对外部类集进行分析的应用程序。这可能包括执行自动 **code generation**、**testing**\
  \ 或 **documentation generation** 的软件。执行 **hydration**（从数组填充对象）的类也受益于 `Reflection`\
  \ 扩展。\n\n> **提示**\n>\n> 书中没有足够的篇幅来涵盖每一个 `Reflection` 扩展类和方法。如果您希望获取更多信息，请查看此处的文档参考：`https://www.php.net/manual/en/book.reflection.php`。\n\
  \n现在让我们看一个 `Reflection` 扩展的使用示例。\n\n## Reflection 扩展使用\n\n我们现在将展示一个代码示例，演示如何使用 Reflection\
  \ 扩展生成 docblocks（docblock 是使用特殊语法来表示方法的目的、其传入参数和返回值 的 PHP 注释）。以下是导致此结果的步骤：\n\n-\
  \ 1. 我们首先定义一个 __construct() 方法，该方法创建目标类的 ReflectionClass 实例，如下所示：\n- 2. 然后我们定义一个\
  \ check() 方法，该方法获取所有类方法，返回一个 ReflectionMethod 实例数组，如下所示：\n- 3. 然后我们遍历所有方法并使用 getDocComment()\
  \ 检查是否已存在 docblock，如下所示：\n- 4. 如果 docblock 尚不存在，我们开始一个新的 docblock，然后调用 getParameters()，它返回一个\
  \ ReflectionParameter 实例数组，如以下代码片段所示：\n\n// /repo/src/Services/DocBlockChecker.php\n\
  namespace Services;\nuse ReflectionClass;\nclass DocBlockChecker {\n    public $target\
  \ = '';    // class to check\n    public $reflect = NULL; // ReflectionClass instance\n\
  \    public function __construct(string $target) {\n        $this->target = $target;\n\
  \        $this->reflect = new ReflectionClass($target);\n    }\n```\n\n```\npublic\
  \ function check() {\n    $methods = [];\n    $list = $this->reflect->getMethods();\n\
  ```\n\n```\nforeach ($list as $refMeth) {\n    $docBlock = $refMeth->getDocComment();\n\
  ```\n\n```\nif (!$docBlock) {\n    $docBlock = \"/**\\n * \"\n```\n\n```\n. $refMeth->getName()\
  \ . \"\\n\";\n$params = $refMeth->getParameters();\n```\n\n- 5. 如果我们确实有参数，我们收集信息以供显示，如下所示：\n\
  \n```\nif ($params) {\n    foreach ($params as $refParm) {\n        $type = $refParm->getType()\n\
  \            ?? 'mixed';\n        $type = (string) $type;\n        $name = $refParm->getName();\n\
  \        $default = '';\n        if (!$refParm->isVariadic()\n            && $refParm->isOptional())\
  \ {\n            $default=$refParm->getDefaultValue(); }\n        if ($default ===\
  \ '') {\n            $default = \"(empty string)\"; }\n        $docBlock .= \" *\
  \ @param $type \"\n            . \"\\${$name} : $default\\n\";\n    }\n}\n```\n\n\
  - 6. 然后我们设置返回类型并将 docblock 分配给随后返回的 $methods 数组，如下所示：\n\n```\nif ($refMeth->isConstructor())\n\
  \    $return = 'void';\nelse\n    $return = $refMeth->getReturnType()\n        ??\
  \ 'mixed';\n    $docBlock .= \" * @return $return\\n\";\n    $docBlock .= \" */\\\
  n\";\n}\n$methods[$refMeth->getName()] = $docBlock;\n}\nreturn $methods;\n}\n}\n\
  ```\n\n- 7. 现在新的 docblock 检查类已完成，我们定义一个调用程序，如以下代码片段所示。调用程序针对 /repo/src/Php7/Reflection/Test.php\
  \ 类（此处未显示）。该类包含具有参数和返回值的混合方法：\n\n// //repo/ch07/php7_reflection_usage.php\n$target\
  \ = 'Php7\\Reflection\\Test';\nrequire_once __DIR__\n    . '../src/Server/Autoload/Loader.php';\n\
  use Server\\Autoload\\Loader;\nuse Services\\DocBlockChecker;\n$autoload = new Loader();\n\
  $checker = new DocBlockChecker($target);\nvar_dump($checker->check());\n```\n\n\
  调用程序的输出如下所示：\n\n```\nroot@php8_tips_php7 [ /repo/ch07 ]#\nphp php7_reflection_usage.php\n\
  /repo/ch07/php7_reflection_usage.php:10:\narray(4) {\n  '__construct' =>  string(75)\n\
  \"/**\n * __construct\n * @param PDO $pdo : (empty string)\n * @return void\n */\"\
  \n  'fetchAll' =>  string(41)\n\"/**\n * fetchAll\n * @return Generator\n */\"\n\
  \  'fetchByName' =>  string(80)\n\"/**\n * fetchByName\n * @param string $name :\
  \ (empty string)\n * @return array\n */\"\n}\n```\n\n```\n'fetchLastId' => string(38)\n\
  \"/**\n * fetchLastId\n * @return int\n */\"\n}\n```\n\n正如您所见，这个类构成了潜在的自动文档或代码生成应用程序的基础。\n\
  \n现在让我们看看 Reflection 扩展的改进。\n\n## 了解 Reflection 扩展的改进\n\nReflection 扩展也进行了一些改进，您可能需要了解这些改进。请记住，虽然使用\
  \ Reflection 扩展的开发人员数量有限，但您有一天可能会遇到使用此扩展的代码的情况。如果在 PHP 8 升级后注意到异常行为，本节涵盖的材料将为您在故障排除过程中提供先机。\n\
  \n### ReflectionType 修改\n\nReflectionType 类现在在 PHP 8 中是抽象的。当您使用 ReflectionProperty::getType()\
  \ 或 ReflectionFunction::getReturnType() 方法时，您可能会注意到返回的是 ReflectionNamedType 实例。此更改不会影响程序代码的正常功能，除非您依赖于返回\
  \ ReflectionType 实例。然而，ReflectionNamedType 扩展了 ReflectionType，因此任何 instanceof 操作都不会受到影响。\n\
  \n还值得注意的是，isBuiltIn() 方法已从 ReflectionType 移动到 ReflectionNamedType。同样，由于 ReflectionNamedType\
  \ 扩展了 ReflectionType，这不应在当前代码中造成任何向后兼容性中断。\n\n\n\n## ReflectionParameter::*DefaultValue*\
  \ 方法增强\n\n在 PHP 较早的版本中，ReflectionParameter 与默认值相关的 方法 无法反映内部 PHP 函数。这在 PHP 8 中已发生变化。以下\
  \ ReflectionParameter 方法现在也能从内部函数返回默认值信息：\n\n- getDefaultValue()\n- getDefaultValueConstantName()\n\
  - isDefaultValueAvailable()\n- isDefaultValueConstant()\n\n如列表所示，方法名称自解释。我们现在将展示一个利用这些增强功能的代码示例。以下是通往此处的步骤：\n\
  \n1. 首先，我们定义一个接受 ReflectionParameter 实例并返回包含参数名称和默认值的数组的函数，如下所示：\n\n```php\n// /repo/ch07/php8_reflection_parms_defaults.php\n\
  $func = function (ReflectionParameter $parm) {\n    $name = $parm->getName();\n\
  \    $opts = NULL;\n    if ($parm->isDefaultValueAvailable())\n        $opts = $parm->getDefaultValue();\n\
  ```\n\n2. 接下来，我们定义一个 switch() 语句来清理选项，如下所示：\n\n```php\nswitch (TRUE) {\n    case\
  \ (is_array($opts)) :\n        $tmp = '';\n        foreach ($opts as $key => $val)\n\
  \            $tmp .= $key . ':' . $val . ',';\n        $opts = substr($tmp, 0, -1);\n\
  \        break;\n    case (is_bool($opts)) :\n        $opts = ($opts) ? 'TRUE' :\
  \ 'FALSE';\n        break;\n    case ($opts === '') :\n        $opts = \"''\";\n\
  \        break;\n    default :\n        $opts = 'No Default';\n}\n    return [$name,\
  \ $opts];\n};\n```\n\n3. 然后我们确定要反射的函数并获取其参数。在以下示例中，我们反射 setcookie()：\n\n```php\n\
  $test = 'setcookie';\n$ref = new ReflectionFunction($test);\n$parms = $ref->getParameters();\n\
  ```\n\n4. 然后我们遍历 ReflectionParameter 实例的数组并生成输出，如下所示：\n\n```php\n$patt = \"%18s\
  \ : %s\\n\";\nforeach ($parms as $obj)\n    vprintf($patt, $func($obj));\n```\n\n\
  以下是 PHP 7 中运行的输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch07 ]#\nphp php8_reflection_parms_defaults.php\n\
  Reflecting on setcookie\n        Parameter : Default(s)\n        ------------ :\
  \ ------------\n        name : No Default\n        value : No Default\n        expires\
  \ : No Default\n        path : No Default\n        domain : No Default\n       \
  \ secure : No Default\n        httponly : No Default\n```\n\n结果始终为 No Default，因为在\
  \ PHP 7 及更早版本中，Reflection 扩展无法读取内部 PHP 函数的默认值。相比之下，PHP 8 的输出要准确得多，如下所示：\n\n```\n\
  root@php8_tips_php8 [ /repo/ch07 ]#\nphp php8_reflection_parms_defaults.php\nReflecting\
  \ on setcookie\n    Parameter : Default(s)\n    ------------ : ------------\n  \
  \  name : No Default\n    value : ''\nexpires_or_options : No Default\n    path\
  \ : ''\n    domain : ''\n    secure : FALSE\n    httponly : FALSE\n```\n\n如输出所示，PHP\
  \ 8 中的 Reflection 扩展能够准确报告内部函数默认值！\n\n现在让我们看看 Reflection 扩展的其他更改。\n\n## 其他 Reflection\
  \ 扩展更改\n\n在 PHP 8 之前的版本中，ReflectionMethod::isConstructor() 和 ReflectionMethod::isDestructor()\
  \ 无法反射接口中定义的魔术方法。在 PHP 8 中，这两个方法现在会对接口中定义的相应魔术方法返回 TRUE。\n\n使用 ReflectionClass::getConstants()\
  \ 或 ReflectionClass::getReflectionConstants() 方法时，现在已添加一个新的 $filter 参数。该参数允许您按可见性级别过滤结果。因此，新参数可以接受以下任何新添加的预定义常量：\n\
  \n- ReflectionClassConstant::IS_PUBLIC\n- ReflectionClassConstant::IS_PROTECTED\n\
  - ReflectionClassConstant::IS_PRIVATE\n\n您现在已经对如何使用 Reflection 扩展以及 PHP 8 迁移后应期待什么有了一定的了解。是时候看看\
  \ PHP 8 中发生变化的许多其他扩展了。\n\n## 处理其他扩展的陷阱\n\nPHP 8 对本章中已讨论的扩展之外的多个 PHP 扩展引入了许多其他值得注意的更改。正如我们在本书中一再强调的那样，作为\
  \ PHP 开发人员了解这些更改对您未来的职业生涯至关重要。\n\n我们先来看看数据库扩展的更改。\n\n## 新的数据库扩展操作系统库要求\n\n使用 MySQL、MariaDB、PostgreSQL\
  \ 或 PHP 数据对象（PDO）的任何开发人员都需要了解支持操作系统库的新要求。下表总结了 PHP 8 中所需的新最低版本：\n\n| 扩展 | 库 | 最低版本\
  \ |\n|---|---|---|\n| PgSQL | libpq | 9.1 |\n| PDO_PGSQL | libpq | 9.1 |\n| MySQLi\
  \ | libmysqlclient | 5.1 |\n| PDO_MySQL | libmysqlclient | 5.1 |\n\n表 7.4 – PHP\
  \ 8 数据库库要求\n\n如前表所示，有两个主要库更改。libpq 影响 PostgreSQL 扩展和 PDO 扩展的驱动程序。libmysqlclient\
  \ 是 MySQL Improved（MySQLi）扩展使用的库，也是 PDO 扩展的 MySQL 驱动程序。还应注意，如果您使用的是 MariaDB，即流行的\
  \ MySQL 开源版本，则新的最低 MySQL 库要求也适用于您。\n\n现在您已经了解了数据库扩展的更改，我们接下来将关注 ZIP 扩展。\n\n## 审查\
  \ ZIP 扩展的更改\n\nZIP 扩展用于以编程方式创建和管理压缩归档文件，利用 libzip 操作系统库。还存在其他压缩扩展，例如 Zlib、bzip2、LZF、PHP\
  \ 归档格式（phar）和 Roshal 归档压缩（RAR）；然而，没有其他扩展提供 ZIP 扩展提供的丰富功能范围。此外，大多数其他扩展都是专用用途，通常不适合通用的\
  \ ZIP 文件管理。\n\n我们先来看看该扩展最值得注意的更改。\n\n## 处理 ZIP 扩展 OOP 迁移\n\nZIP 扩展的最大更改是可能在未来导致大规模向后兼容代码中断的更改。自\
  \ PHP 8 起，过程式 API（所有过程式函数）已被弃用！尽管这目前不会影响任何代码，但所有 ZIP 扩展函数最终将被从语言中移除。\n\n最佳实践是使用\
  \ ZipArchive 类将任何 ZIP 扩展过程式代码迁移到 OOP API。以下代码示例说明了如何从过程式代码迁移到对象代码，打开 test.zip 文件并生成条目列表：\n\
  \n```php\n// /repo/ch07/php7_zip_functions.php\n$fn = __DIR__ . '/includes/test.zip';\n\
  $zip = zip_open($fn);\n$cnt = 0;\nif (!is_resource($zip)) exit('Unable to open zip\
  \ file');\nwhile ($entry = zip_read($zip)) {\n    echo zip_entry_name($entry) .\
  \ \"\\n\";\n    $cnt++;\n}\necho \"Total Entries: $cnt\\n\";\n```\n\n以下是 PHP 7 中运行的输出：\n\
  \n```\nroot@php8_tips_php7 [ /repo/ch07 ]#\nphp php7_zip_functions.php\nch07/includes/\n\
  ch07/includes/test.zip\nch07/includes/tree.xml\nch07/includes/test.png\nch07/includes/kitten.jpg\n\
  ch07/includes/reflection.html\nch07/php7_ext_is_resource.php\nch07/php7_gd_is_resource.php\n\
  ... not all entries shown ...\nch07/php8_simple_xml.php\nch07/php8_xml_writer.php\n\
  ch07/php8_zip_oop.php\nTotal Entries: 27\n```\n\n如前输出所示，共找到 27 个条目。（另请注意，并非所有 ZIP\
  \ 文件条目都显示。）然而，如果我们在 PHP 8 中尝试相同的代码示例，我们会得到非常不同的结果，如下所示：\n\n```\nroot@php8_tips_php8\
  \ [ /repo/ch07 ]#\nphp php7_zip_functions.php\nPHP Deprecated: Function zip_open()\
  \ is deprecated in /repo/ch07/php7_zip_functions.php on line 5\nPHP Deprecated:\
  \ Function zip_read() is deprecated in /repo/ch07/php7_zip_functions.php on line\
  \ 8\nPHP Deprecated: Function zip_entry_name() is deprecated in /repo/ch07/php7_zip_functions.php\
  \ on line 9\nch07/includes/\nPHP Deprecated: Function zip_entry_name() is deprecated\
  \ in /repo/ch07/php7_zip_functions.php on line 9\n... not all entries shown ...\n\
  ch07/php8_zip_oop.php\nPHP Deprecated: Function zip_read() is deprecated in /repo/ch07/php7_zip_functions.php\
  \ on line 8\nTotal Entries: 27\n```\n\n如前面的 PHP 8 输出所示，代码示例可以工作，但会发出一系列弃用 Notice\

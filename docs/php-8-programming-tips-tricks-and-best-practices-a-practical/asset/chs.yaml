  ```\n\n而在 PHP 8 下运行相同的代码示例：\n\n```\nroot@php8_tips_php8 [ /repo/ch09 ]#\nphp php8_bc_break_magic.php\n\
  Attempt made to call 'doesNotExist' with these arguments:\n'A,B,C'\nArguments: 'A,B,C'\n\
  ```\n\n正如你所见，两个输出集是相同的。所示的第一个类 NoTypes 可以工作，因为没有定义数据类型提示。有趣的是，MixedTypes 类在 PHP\
  \ 8 及以下版本中都能工作，因为新的 mixed 数据类型实际上是所有类型的联合。因此，你可以安全地使用任何特定数据类型代替 mixed。\n\n- 3. 在我们的最终示例中，我们将定义\

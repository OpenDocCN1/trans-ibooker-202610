  \n## 摘要\n\n在本章中，你了解了 PHP 8 在过程层面引入的许多更改。你首先了解了新的空安全运算符，它可以大幅缩短对象引用链可能失败的任何代码。你还了解了三元运算符和可变参数运算符的使用如何得到收紧和改进，以及连接运算符在优先级顺序中已被降级。本章还涵盖了箭头函数的优点和缺点，以及它们如何用作匿名函数的简洁替代方案。\n\
  \n本章后面的部分向你展示了 PHP 8 如何继续 PHP 7 中首次引入的统一变量语法趋势。你了解了 PHP 8 如何解决剩余的不一致问题，包括插值字符串和魔术常量解引用，以及数组和字符串处理的改进，这些改进有望使你的\
  \ PHP 8 更干净、更简洁、性能更高。\n\n最后，在最后一节中，你了解了提供 SQLite 授权回调支持的新功能，从而在使用 SQLite 作为数据库时终于可以提供一定程度的安全性。\n\
  \n在下一章中，你将了解 PHP 8 错误处理增强功能。\n\n## 3 利用错误处理增强功能\n\n如果你从事 PHP 开发有一段时间了，你会注意到随着语言不断成熟，越来越多的保障措施被引入，最终强制执行良好的编码实践。沿着这一思路，PHP\
  \ 8 的关键改进之一是其先进的错误处理能力。在本章中，你将了解哪些 Notices 已被升级为 Warnings，以及哪些 Warnings 已被升级为 Errors。\n\
  \n本章能让你很好地理解安全增强的背景和意图，从而更好地控制代码的使用。此外，至关重要的是要了解以前仅生成 Warnings 但现在也生成 Errors 的错误条件，以便在升级到\
  \ PHP 8 后采取措施防止应用程序失败。\n\n本章涵盖以下主题：\n\n- 了解 PHP 8 错误处理\n- 处理现在变为错误的警告\n- 了解被提升为警告的通知\n\
  - 处理 @ 错误控制运算符\n\n## 技术要求\n\n要检查和运行本章提供的代码示例，最低推荐硬件如下：\n\n- 基于 x86_64 的台式电脑或笔记本电脑\n\
  - 1 千兆字节（GB）可用磁盘空间\n- 4 GB 随机存取存储器（RAM）\n- 500 千比特每秒（Kbps）或更快的互联网连接\n\n此外，你需要安装以下软件：\n\
  \n- Docker\n- Docker Compose\n\n请参阅第 1 章《Introducing New PHP 8 OOP Features》的 Technical\
  \ requirements 部分，了解有关 Docker 和 Docker Compose 安装的更多信息，以及如何构建用于演示本书中解释的代码的 Docker\
  \ 容器。在本书中，我们将恢复本书示例代码的目录称为 /repo。\n\n本章的源代码位于此处：\n\n```\nhttps://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices\n\
  ```\n\n我们现在可以开始讨论，通过检查新的 PHP 8 运算符。\n\n## 了解 PHP 8 错误处理\n\n历史上，许多 PHP 错误情况被分配的错误级别远低于其实际严重性。这给开发者一种虚假的安全感，因为看到只有\
  \ Notice 就让他们认为代码没有缺陷。许多情况以前只会生成 Notice 或 Warning，而实际上其严重性值得更多关注。\n\n在本节中，我们将介绍\
  \ PHP 8 中的许多错误处理增强功能，这些增强功能继续了强制执行良好编码实践的整体趋势。本章的讨论将帮助你重新审视代码，着眼于提高效率并减少今后的维护问题。\n\
  \n在接下来的几个小节中，我们将查看某些 Notice 和 Warning 错误条件的更改，这些更改可能会影响你的代码。我们首先来看看 PHP 8 如何处理未定义变量的变化。\n\
  \n## 未定义变量处理\n\nPHP 的一个臭名昭著的特性是它如何处理 **未定义变量**。请看这段简单的代码块。请注意 $a 和 $b 变量尚未定义：\n\n\
  // /repo/ch03/php8_undef_var.php\n$c = $a + $b;\nvar_dump($c);\n\n在 PHP 7 下运行，以下是输出：\n\
  \n```\nPHP Notice:  Undefined variable: a in\n/repo/ch03/php7_undef_var.php on line\
  \ 3\nPHP Notice:  Undefined variable: b in /repo/ch03/php7_undef_var.php on line\
  \ 3\nint(0)\n```\n\n正如输出所示，PHP 7 会发出 Notice，告知我们正在使用未定义的变量。如果我们使用 PHP 8 运行完全相同的代码，你可以很快看到以前的\
  \ Notice 已被提升为 Warning，如下所示：\n\n```\nPHP Warning:  Undefined variable $a in /repo/ch03/php8_undef_var.php\
  \ on line 3\nPHP Warning:  Undefined variable $b in /repo/ch03/php8_undef_var.php\
  \ on line 3\nint(0)\n```\n\nPHP 8 中此错误级别提升的理由是，未定义变量的使用被许多开发者认为是一种无害的做法，实际上 **非常危险**！*为什么？*，你可能会问。答案是\
  \ PHP 会静默地、在你未明确指示的情况下，将任何未定义变量的值分配为 NULL。有效地，你的程序依赖于 PHP 的默认行为，而该行为可能在语言的未来升级中发生变化。\n\
  \n我们在本章的接下来的几节中介绍其他错误级别提升。请注意，Notice 被提升为 Warning 的情况 *不会影响你的代码的运行*。不过，它可能会引起你对更多潜在问题的注意，如果是这样，就有助于生成更好的代码。与未定义变量不同，未定义常量的错误现在已被进一步提升，如下一小节所述。\n\
  \n## 未定义常量处理\n\n在 PHP 8 下运行时的 **未定义常量** 处理方式已发生变化。然而，在这种情况下，以前是 Warning 的内容现在在 PHP\
  \ 8 中变为 Error。请看这段看起来无害的代码块：\n\n// /repo/ch03/php7_undef_const.php\necho PHP_OS\
  \ . \"\\n\";\necho UNDEFINED_CONSTANT . \"\\n\";\necho \"Program Continues ... \\\
  n\";\n\n第一行回显 PHP_OS **预定义常量**，用于标识操作系统。在 PHP 7 中会生成一个 Notice；然而，最后的输出行是 Program\
  \ Continues ...，如下所示：\n\n```\nPHP Notice: Use of undefined constant UNDEFINED_CONSTANT\
  \ - assumed 'UNDEFINED_CONSTANT' in /repo/ch03/php7_undef_const.php on line 6\n\
  Program Continues ...\n```\n\n相同的代码在 PHP 8 中运行现在会产生致命错误，如下所示：\n\n```\nPHP Fatal\
  \ error: Uncaught Error: Undefined constant \"UNDEFINED_CONSTANT\" in /repo/ch03/php8_undef_const.php:6\n\
  ```\n\n因此，任何你留下的不良代码，如果在使用前未先定义常量，将会在 PHP 8 中崩溃！一个好习惯是在应用程序代码开始时为所有变量分配默认值。如果你计划使用常量，最好尽快定义它们，最好在同一位置。\n\
  \n> **重要说明**\n> 一个想法是在 *包含的文件* 中定义所有常量。如果是这种情况，请确保使用此类常量的任何程序脚本已加载包含常量定义的文件。\n\n\
  > **提示**\n> **最佳实践**：在使用前在程序代码开始时为所有变量分配默认值。确保在使用前定义任何自定义常量。如果是这种情况，请确保使用此类常量的任何程序脚本已加载包含常量定义的文件。\n\
  \n\n\n## 错误级别默认值\n\n有用的是注意，分配给 php.ini 文件 error_reporting 指令的错误级别默认值在 PHP 8 中已更新。在\
  \ PHP 7 中，默认的 error_reporting 级别如下：\n\n```\nerror_reporting=E_ALL & ~E_NOTICE &\
  \ ~E_STRICT & ~E_DEPRECATED\n```\n\n在 PHP 8 中，新的级别要简单得多，如下所示：\n\n```\nerror_reporting=E_ALL\n\
  ```\n\n还值得注意的是，php.ini 文件设置 display_startup_errors 现在默认已启用。这对于生产服务器可能是一个问题，因为您的网站在\
  \ PHP 启动时可能会无意中泄露错误信息。\n\n本节的关键要点是，过去 PHP 仅通过发出 Notices 或 Warnings 就允许你逃脱某些不良实践。然而，正如本节所述，未解决\
  \ Warning 或 Notice 生成背后的问题的危险在于 PHP 默默地代表你采取的行动。不依赖 PHP 代替你做决定可以减少隐藏的逻辑错误。遵循良好的编码实践，例如在使用变量之前为所有变量分配默认值，有助于避免此类错误。现在让我们更仔细地看看\
  \ PHP 8 中 Warnings 被提升为 Errors 的错误情况。\n\n## 现在为错误的警告的处理\n\n本节我们将介绍与对象、数组和字符串相关的升级后的\
  \ PHP 8 错误处理。我们还将检查过去 PHP 发出 Warning 但 PHP 8 现在抛出 Error 的情况。了解本节中讨论的任何潜在错误情况至关重要。原因很简单：如果未能解决本节所述的情况，在服务器升级到\
  \ PHP 8 时你的代码将会中断。\n\n开发者经常面临时间压力。可能是有大量新功能或其他变更必须完成。在其他情况下，资源被抽调到其他项目，导致可用于维护的开发者更少。Warnings\
  \ 通常被忽略，因为应用程序仍在运行，因此许多开发者只是关闭错误显示并希望一切顺利。\n\n多年来，堆积如山的糟糕代码不断累积。不幸的是，PHP 社区现在正在为此付出代价，表现为需要花费数小时才能追踪的神秘运行时错误。通过将某些过去仅引发\
  \ `Warning` 的危险实践提升为 `Error`，不良的编码实践在 PHP 8 中会迅速显现，因为 `Errors` 是致命的，会导致应用程序停止运行。\n\
  \n让我们先从检查对象错误处理中的错误提升开始。\n\n> **重要说明**\n> 作为一般规则，在 PHP 8 中，当尝试 *写入* 数据时，`Warnings`\
  \ 会被提升为 `Errors`。另一方面，对于相同的一般情况（例如，尝试读取/写入不存在对象的属性），当尝试 *读取* 数据时，`Notice` 会在 PHP\
  \ 8 中被提升为 `Warning`。总体思路是写入尝试可能导致数据丢失或损坏，而读取尝试则不会。\n\n## 对象错误处理中被提升的警告\n\n以下是与对象处理相关的现在为\
  \ `Errors` 的 `Warnings` 的简要总结。如果尝试执行以下操作，PHP 8 将抛出 `Error`：\n\n- 对非对象的属性进行递增/递减\n\
  - 修改非对象的属性\n- 为非对象的属性赋值\n- 从空值创建默认对象\n\n让我们看一个简单的例子。在以下代码片段中，一个值被赋给不存在的对象 $a。然后该值被递增：\n\
  \n```php\n// /repo/ch03/php8_warn_prop_nobj.php\n$a->test = 0;\n$a->test++;\nvar_dump($a);\n\
  ```\n\n这是 PHP 7 的输出：\n\n```\nPHP Warning:  Creating default object from empty value\
  \ in /repo/ch03/php8_warn_prop_nobj.php on line 4\nclass stdClass#1 (1) {\n    public\
  \ $test =>\n        int(1)\n}\n```\n\n如你所见，在 PHP 7 中，stdClass() 实例会被静默创建并发出 Warning，但操作仍被允许继续。如果我们在\
  \ PHP 8 下运行相同的代码，请注意输出的差异：\n\n```\nPHP Fatal error:  Uncaught Error: Attempt to\
  \ assign property \"test\" on null in /repo/ch03/php8_warn_prop_nobj.php:4\n```\n\
  \n好消息是，在 PHP 8 中会抛出 Error，这意味着我们可以通过实现 try() / catch() 块轻松捕获它。例如，以下是之前显示的代码可能被重写的写法：\n\
  \n```\ntry {\n    $a->test = 0;\n    $a->test++;\n    var_dump($a);\n} catch (Error\
  \ $e) {\n    error_log(__FILE__ . ':' . $e->getMessage());\n}\n```\n\n如你所见，这三行中的任何问题现在都被安全地包裹在\
  \ try() / catch() 块中，这意味着可以进行恢复。我们现在将注意力转向数组错误处理增强功能。\n\n## 数组处理中被提升的警告\n\nPHP 7\
  \ 及更早版本中允许的许多关于数组的不良实践现在会抛出 Error。正如前一小节所述，PHP 8 数组错误处理变更旨在对我们在此描述的错误情况给出更强力的响应。这些增强的最终目标是促使开发者走向良好的编码实践。\n\
  \n以下是被提升为错误的数组处理警告简要列表：\n\n- 无法向数组添加元素，因为下一个元素已被占用\n- 无法取消设置非数组变量中的偏移量\n- 只能解包数组和\
  \ Traversable 类型\n- 非法的偏移类型\n\n现在让我们逐一检查此列表中的每个错误条件。\n\n## 下一个元素已被占用\n\n为了说明下一个数组元素无法分配因为它已被占用的一个可能场景，请看这个简单的代码示例：\n\
  \n```\n// ch03/php8_warn_array_occupied.php\n$a[PHP_INT_MAX] = 'This is the end!';\n\
  $a[] = 'Off the deep end';\n```\n\n假设由于某种原因，对数组元素的赋值使用了最大可能的整数作为数字键（由 PHP_INT_MAX\
  \ 预定义常量表示）。如果随后我们尝试为下一个元素赋值，就会出现问题！\n\n运行这段代码块在 PHP 7 中的结果如下：\n\n```\nPHP Warning:\
  \ Cannot add element to the array as the next element is already occupied in\n/repo/ch03/php8_warn_array_occupied.php\
  \ on line 7\narray(1) {\n    [9223372036854775807] =>\n    string(16) \"This is\
  \ the end!\"\n}\n```\n\n然而在 PHP 8 中，Warning 已被提升为 Error，结果输出如下：\n\n```\nPHP Fatal\
  \ error: Uncaught Error: Cannot add element to the array as the next element is\
  \ already occupied in\n/repo/ch03/php8_warn_array_occupied.php:7\n```\n\n接下来，我们将关注在非数组变量中使用偏移量。\n\
  \n## 非数组变量中的偏移量\n\n将非数组变量当作数组处理可能会产生意外的结果，除非某些实现了 Traversable 的对象类（如 ArrayObject\
  \ 或 ArrayIterator）。一个典型例子是在字符串上使用数组样式的偏移量。\n\n在某些情况下，使用数组语法访问字符串字符是有用的。一个例子是检查统一资源定位符（URL）是否以尾随逗号或斜杠结尾。在以下代码示例中，我们检查\
  \ URL 是否以尾随斜杠结尾。如果是，我们使用 substr() 将其去掉：\n\n```\n// ch03/php8_string_access_using_array_syntax.php\n\
  $url = 'https://unlikelysource.com/';\nif ($url[-1] == '/')\n    $url = substr($url,\
  \ 0, -1);\necho $url;\n// returns: \"https://unlikelysource.com\"\n```\n\n在前面的示例中，$url[-1]\
  \ 数组语法使你能够访问字符串中的最后一个字符。\n\n> **提示**\n> \n> 你也可以使用新的 PHP 8 `str_ends_with()` 函数来实现同样的功能！\n\
  \n然而，字符串绝对不是数组，也不应该被当作数组处理。为了避免不良代码可能导致意外结果，PHP 8 已限制了使用数组语法引用字符串字符的轻微滥用。\n\n在以下代码示例中，我们尝试对字符串使用\
  \ unset()：\n\n```\n// ch03/php8_warn_array_unset.php\n$alpha = 'ABCDEF';\nunset($alpha[2]);\n\
  var_dump($alpha);\n```\n\n\n\n前面的代码示例实际上会在 PHP 7 和 8 中都生成致命错误。同样，不要将非数组（或非 Traversable\
  \ 对象）用作 foreach() 循环的参数。在下面所示的示例中，一个字符串被作为参数提供给 foreach()：\n\n```php\n// ch03/php8_warn_array_foreach.php\n\
  $alpha = 'ABCDEF';\nforeach ($alpha as $letter) echo $letter;\necho \"Continues\
  \ ... \\n\";\n```\n\n在 PHP 7 及更早版本中，会生成一个 Warning，但代码会继续执行。以下是 PHP 7.1 中运行时的输出：\n\
  \n```\nPHP Warning: Invalid argument supplied for foreach() in /repo/ch03/php8_warn_array_foreach.php\
  \ on line 6\nContinues ...\n```\n\n有趣的是，PHP 8 也允许代码继续执行，但 Warning 消息更为详细，如下所示：\n\
  \n```\nPHP Warning: foreach() argument must be of type array|object, string given\
  \ in /repo/ch03/php8_warn_array_foreach.php on line 6\nContinues ...\n```\n\n接下来，我们来看一下过去可以勉强通过解包非数组/非\
  \ Traversable 类型的情况。\n\n## Array unpacking\n\n看到这个小节标题后，你可能会问：什么是数组解包？与解引用概念类似，解包数组只是从数组中提取值到独立变量的术语。例如，考虑以下简单代码：\n\
  \n- 1. 我们通过定义一个简单的函数来开始示例，该函数将两个数字相加，如下所示：\n\n```php\n// ch03/php8_array_unpack.php\n\
  function add($a, $b) { return $a + $b; }\n```\n\n- 2. 为了下面的说明，假设数据是以数字对的数组形式存在，每个都需要相加：\n\
  \n```\n$vals = [ [18,48], [72,99], [11,37] ];\n```\n\n- 3. 在循环中，我们使用可变参数运算符 (...)\
  \ 在调用 add() 函数时解包数组对，如下所示：\n\n```php\nforeach ($vals as $pair) {\n    echo 'The\
  \ sum of ' . implode(' + ', $pair) .\n    ' is ';\n    echo add(...$pair);\n}\n\
  ```\n\n刚才展示的示例演示了开发者如何通过使用可变参数运算符强制解包。然而，许多 PHP 数组函数在内部执行解包操作。考虑以下示例：\n\n- 1. 首先，我们定义一个数组，其元素由字母表中的字母组成。如果我们\
  \ echo array_pop() 的返回值，我们会看到字母 Z 作为输出，如以下代码片段所示：\n\n```php\n// ch03/php8_warn_array_unpack.php\n\
  $alpha = range('A','Z');\necho array_pop($alpha) . \"\\n\";\n```\n\n- 2. 我们可以使用\
  \ implode() 将数组展平成字符串，并使用字符串解引用返回最后一个字母来实现相同的结果，如以下代码片段所示：\n\n```\n$alpha = implode('',\
  \ range('A','Z'));\necho $alpha[-1];\n```\n\n- 3. 然而，如果我们尝试如图所示对字符串使用 array_pop()，在\
  \ PHP 7 及更早版本中会得到一个 Warning：\n\n```php\necho array_pop($alpha);\n```\n\n- 4. 在 PHP\
  \ 7.1 下运行时的输出如下：\n\n```\nZ\nPHP Warning: array_pop() expects parameter 1 to be array,\
  \ string given in /repo/ch03/php8_warn_array_unpack.php on line 14\n```\n\n- 5.\
  \ 而在 PHP 8 下运行同一代码文件的输出如下：\n\n```\nZ\nPHP Fatal error: Uncaught TypeError: array_pop():\n\
  Argument #1 ($array) must be of type array, string given\nin /repo/ch03/php8_warn_array_unpack.php:14\n\
  ```\n\n正如我们提到的，这里是另一个过去导致 Warning 现在在 PHP 8 中导致 TypeError 的示例。然而，这两组输出也说明了尽管你可以像数组一样解引用字符串，但字符串不能以与数组相同的方式被解包。\n\
  \n接下来，我们检查非法偏移类型。\n\n## Illegal offset types\n\n根据 PHP 文档 (https://www.php.net/manual/en/language.types.array.php)，数组是有序的键/值对列表。数组键，也称为索引或偏移量，可以是两种数据类型之一：整数或字符串。如果数组仅由整数键组成，通常被称为数字数组。另一方面，关联数组是指使用字符串索引的术语。非法偏移是指数组键的数据类型既不是整数也不是字符串的情况。\n\
  \n> **重要说明**\n> 有趣的是，以下代码片段不会生成 Warning 或 Error：$x = (float) 22/7; $arr[$x] = 'Value\
  \ of Pi';.\n> $x 的值在数组赋值之前首先转换为整数，截断任何小数部分。\n\n例如，查看这段代码片段。请注意，最后一个数组元素的索引键是一个对象：\n\
  \n```php\n// ch03/php8_warn_array_offset.php\n$obj = new stdClass();\n$b = ['A'\
  \ => 1, 'B' => 2, $obj => 3];\nvar_dump($b);\n```\n\n在 PHP 7 下运行的输出会产生带有 Warning\
  \ 的 var_dump() 输出，如下所示：\n\n```\nPHP Warning: Illegal offset type in /repo/ch03/php8_warn_array_offset.php\
  \ on line 6\n```\n\n```\narray(2) {\n  'A' => int(1)\n  'B' => int(2)\n}\n```\n\n\
  然而在 PHP 8 中，var_dump() 从未被执行，因为会抛出 TypeError，如下所示：\n\n```\nPHP Fatal error: Uncaught\
  \ TypeError: Illegal offset type in /repo/ch03/php8_warn_array_offset.php:6\n```\n\
  \n关于非法数组偏移的相同原则在使用 unset() 时也存在，如此代码示例所示：\n\n```php\n// ch03/php8_warn_array_offset.php\n\
  $obj = new stdClass();\n$b = ['A' => 1, 'B' => 2, 'C' => 3];\nunset($b[$obj]);\n\
  var_dump($b);\n```\n\n对数组索引键的更严格控制在使用 empty() 或 isset() 中的非法偏移时也能看到，如此代码片段所示：\n\n\
  ```php\n// ch03/php8_warn_array_empty.php\n$obj = new stdClass();\n$obj->c = 'C';\n\
  $b = ['A' => 1, 'B' => 2, 'C' => 3];\n$message = (empty($b[$obj])) ? 'NOT FOUND'\
  \ : 'FOUND';\necho \"$message\\n\";\n```\n\n在这两个之前的代码示例中，在 PHP 7 及更早版本中代码示例会伴随 Warning\
  \ 完成，而在 PHP 8 中会抛出 Error。除非捕获该 Error，否则代码示例将不会完成。\n\n> Tip\n> **最佳实践：** 初始化数组时，请确保数组索引数据类型是整数或字符串。\n\
  \n接下来，我们来看字符串处理中的错误提升。\n\n## Promoted warnings in string handling\n\n关于对象和数组的提升警告的相同讨论也适用于\
  \ PHP 8 字符串错误处理。在本小节中，我们检查两种被提升为 Errors 的字符串处理 Warning，概述如下：\n\n- 字符串中不包含的偏移量\n\
  - 空字符串偏移量\n\n让我们先检查字符串中不包含的偏移量。\n\n### Offset not contained in the string.\n\n作为第一个情况的示例，请查看以下代码示例。在这里，我们从一个分配了字母表所有字母的字符串开始。然后我们使用\
  \ strpos() 返回字母 Z 的位置，从偏移量 0 开始。在下一行，我们做同样的事情；然而，偏移量 27 超出了字符串末尾：\n\n```php\n//\
  \ /repo/ch03/php8_error_str_pos.php\n$str = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';\necho\
  \ $str[strpos($str, 'Z', 0)];\necho $str[strpos($str, 'Z', 27)];\n```\n\n在 PHP 7\
  \ 中，如预期一样，返回 Z 的输出，并伴随 strpos() 的 Warning 以及一个关于偏移量转换（将在下一节详细介绍）的 Notice。以下是 PHP\
  \ 7 的输出：\n\n```\nZ\nPHP Warning: strpos(): Offset not contained in string in /repo/ch03/php8_error_str_pos.php\
  \ on line 7\nPHP Notice: String offset cast occurred in /repo/ch03/php8_error_str_pos.php\
  \ on line 7\n```\n\n然而在 PHP 8 中，会抛出致命的 ValueError，如下所示：\n\n```\nZ\nPHP Fatal error:\
  \ Uncaught ValueError: strpos(): Argument #3 ($offset) must be contained in argument\
  \ #1 ($haystack) in /repo/ch03/php8_error_str_pos.php:7\n```\n\n我们需要传达的关键点是，过去允许这种糟糕的代码存在是勉强可以接受的。然而在升级到\
  \ PHP 8 后，正如输出所示，你的代码将失败。现在，让我们来看空字符串偏移量。\n\n### Empty string offset error handling\n\
  \n信不信由你，在 PHP 7 之前的版本中，开发者可以通过将空值赋给目标偏移量来从字符串中删除字符。例如，查看这段代码块：\n\n```php\n// /repo/ch03/php8_error_str_empty.php\n\
  $str = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';\n$str[5] = '';\necho $str . \"\\n\";\n```\n\
  \n此代码示例的意图是从 $str 表示的字符串中删除字母 F。令人惊讶的是，在 PHP 5.6 中，你可以从此截图中看到该尝试完全成功：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_121_0.png)\n\
  \n图 3.1 – 显示成功字符删除的 PHP 5.6 输出\n\n请注意，我们在本书中用于演示代码的虚拟环境允许访问 PHP 7.1 和 PHP 8。为了正确演示\
  \ PHP 5 的行为，我们挂载了一个 PHP 5.6 Docker 镜像并截取了结果的屏幕截图。\n\n\n\n然而在 PHP 7 中，此做法被禁止并会发出\
  \ Warning，如下所示：\n\n```\nPHP Warning: Cannot assign an empty string to a string offset\
  \ in /repo/ch03/php8_error_str_empty.php on line 5\nABCDEFGHIJKLMNOPQRSTUVWXYZ\n\
  ```\n\n从前面的输出可以看出，脚本仍被允许执行；然而，尝试删除字母 F 并未成功。正如我们所讨论的，在 PHP 8 中，Warning 被提升为 Error，整个脚本会中止，如下所示：\n\
  \n```\nPHP Fatal error: Uncaught Error: Cannot assign an empty string to a string\
  \ offset in /repo/ch03/php8_error_str_empty.php:5\n```\n\n接下来我们将考察在 PHP 8 中哪些原先的\
  \ Notices 被提升为 Warnings 的情况。\n\n## 理解被提升为警告的通知\n\n在 PHP 7 之前的版本中，有一些情况被认为对 PHP 引擎运行时的稳定性影响较小而被低估。不幸的是，新手（或也许是懒惰的！）PHP\
  \ 开发者在急于将代码投入生产时，往往习惯于直接忽略 Notices。\n\n多年来 PHP 标准已大幅收紧，导致 PHP 核心团队将某些错误条件从 Notice\
  \ 升级为 Warning。这两种错误报告级别都不会导致代码停止工作。然而，PHP 核心团队认为将 Notice 提升为 Warning 会使不良编程实践更加明显。Warnings\
  \ 更不可能被忽略，最终有助于代码质量提升。\n\n以下是一些在早期 PHP 版本中会导致发出 Notice 的错误条件，而在 PHP 8 中同样的条件现在会生成\
  \ Warning 的简要列表：\n\n- 尝试访问不存在的对象属性\n- 尝试访问不存在的静态属性\n- 使用不存在的键尝试访问数组元素\n- 误用资源作为数组偏移量\n\
  - 模糊的字符串偏移量转换\n- 不存在或未初始化的字符串偏移量\n\n让我们先来看一下涉及对象的情况中的 Notice 提升。\n\n### 不存在对象属性访问的处理\n\
  \n在早期版本的 PHP 中，尝试访问不存在的属性时会发出 Notice。唯一的例外是自定义类中定义了魔术方法 __get() 和/或 __set() 的情况。\n\
  \n在下面的代码示例中，我们定义了一个 Test 类，其中包含两个属性，其中一个被标记为静态：\n\n// /repo/ch03/php8_warn_undef_prop.php\n\
  class Test {\n    public static $stat = 'STATIC';\n    public $exists = 'NORMAL';\n\
  }\n$obj = new Test();\n```\n\n然后我们尝试输出已存在和不存在的属性，如下所示：\n\n```\necho $obj->exists;\n\
  echo $obj->does_not_exist;\n```\n\n不出所料，在 PHP 7 中尝试输出不存在的属性时，输出会返回一个 Notice，如下所示：\n\
  \n```\nNORMAL\nPHP Notice:  Undefined property: Test::$does_not_exist in\n/repo/ch03/php8_warn_undef_prop.php\
  \ on line 14\n```\n\n同一份代码文件在 PHP 8 中现在会返回一个 Warning，如下所示：\n\n```\nNORMAL\nPHP Warning:\
  \  Undefined property: Test::$does_not_exist in /repo/ch03/php8_warn_undef_prop.php\
  \ on line 14\n```\n\n**重要说明**\n\nTest::$does_not_exist 错误信息并不意味着我们尝试了静态访问。它仅仅表示\
  \ $does_not_exist 属性与 Test 类相关联。\n\n现在我们添加尝试访问不存在的静态属性的代码行，如下所示：\n\n```\ntry {\n\
  \    echo Test::$stat;\n    echo Test::$does_not_exist;\n} catch (Error $e) {\n\
  \    echo __LINE__ . ':' . $e;\n}\n```\n\n有趣的是，PHP 7 和 PHP 8 现在都会发出致命错误，如下所示：\n\n\
  ```\nSTATIC\n22:Error: Access to undeclared static property Test::$does_not_exist\
  \ in /repo/ch03/php8_warn_undef_prop.php:20\n```\n\n任何原本会发出 Warning 的代码块现在发出 Error\
  \ 都值得关注。如果可能，请扫描代码中对静态类属性的静态引用并确保它们已定义。否则，在升级到 PHP 8 后，你的代码将失败。\n\n现在让我们来看一下不存在偏移量的处理。\n\
  \n### 不存在偏移量的处理\n\n如前一节所述，通常情况下，读取数据时 Notices 被提升为 Warnings，而写入数据时 Warnings 被提升为\
  \ Errors（这可能导致数据丢失）。不存在偏移量的处理遵循这一逻辑。\n\n在下面的示例中，数组键取自一个字符串。在这两种情况下，偏移量都不存在：\n\n\
  // /repo/ch03/php8_warn_undef_array_key.php\n$key = 'ABCDEF';\n$vals = ['A' => 111,\
  \ 'B' => 222, 'C' => 333];\necho $vals[$key[6]];\n```\n\n在 PHP 7 中，结果是一个 Notice，如下所示：\n\
  \n```\nPHP Notice: Uninitialized string offset: 6 in /repo/ch03/php8_warn_undef_array_key.php\
  \ on line 6\nPHP Notice: Undefined index:  in /repo/ch03/php8_warn_undef_array_key.php\
  \ on line 6\n```\n\n在 PHP 8 中，结果是一个 Warning，如下所示：\n\n```\nPHP Warning: Uninitialized\
  \ string offset 6 in /repo/ch03/php8_warn_undef_array_key.php on line 6\nPHP Warning:\
  \ Undefined array key \"\" in /repo/ch03/php8_warn_undef_array_key.php on line 6\n\
  ```\n\n此示例进一步说明了 PHP 8 错误处理增强的一般原理：如果你的代码向不存在的偏移量写入数据，以前是 Warning 的情况在 PHP 8 中变为\
  \ Error。前面的输出显示了在 PHP 8 中尝试从不存在的偏移量读取数据时，现在会发出 Warning。接下来要检查的 Notice 提升涉及资源 ID\
  \ 的误用。\n\n### 误用资源 ID 作为数组偏移量\n\n在创建与应用程序代码外部服务的连接时，会生成一个资源。这种数据类型的经典示例是文件句柄。在下面的代码示例中，我们打开一个文件句柄（从而创建资源）指向\
  \ gettysburg.txt 文件：\n\n```php\n// /repo/ch03/php8_warn_resource_offset.php\n$fn\
  \ = __DIR__ . '../sample_data/gettysburg.txt';\n$fh = fopen($fn, 'r');\necho $fh\
  \ . \"\\n\";\n```\n\n请注意，我们在最后一行直接输出资源。这会显示资源 ID 编号。然而，如果我们现在尝试将资源 ID 用作数组偏移量，PHP\
  \ 7 会生成一个 Notice，如下所示：\n\n```\nResource id #5\nPHP Notice: Resource ID#5 used as\
  \ offset, casting to integer (5) in /repo/ch03/php8_warn_resource_offset.php on\
  \ line 9\n```\n\nPHP 8 如预期会生成一个 Warning，如下所示：\n\n```\nResource id #5\nPHP Warning:\
  \ Resource ID#5 used as offset, casting to integer (5) in /repo/ch03/php8_warn_resource_offset.php\
  \ on line 9\n```\n\n请注意，在 PHP 8 中，许多以前产生资源 的函数现在改为产生对象。此主题在 *Chapter 7, Avoiding\
  \ Traps When Using PHP 8 Extensions* 中有所涵盖。\n\n> Tip\n> **Best practice**: Do not\
  \ use resource IDs as array offsets!\n\n现在我们将注意力转向在模糊字符串偏移量情况下被提升为 Warnings 的与字符串相关的\
  \ Notices。\n\n### 模糊的字符串偏移量转换\n\n将注意力转向字符串处理，我们再次回顾使用数组语法识别字符串中单个字符的想法。如果 PHP 需要执行内部类型转换来评估字符串偏移量，但该类型转换的位置不明确，则可能会发生\
  \ **ambiguous string offset cast**。\n\n在这个非常简单的示例中，我们定义一个包含字母表所有字母的字符串。然后我们定义一个键数组，其值分别为：NULL；一个布尔值\
  \ TRUE；以及一个浮点数 22/7（圆周率的近似值）。然后我们遍历这些键并尝试将键用作字符串偏移量，如下所示：\n\n```php\n// /repo/ch03/php8_warn_amb_offset.php\n\
  $str = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';\n$ptr = [ NULL, TRUE, 22/7 ];\nforeach ($ptr\
  \ as $key) {\n    var_dump($key);\n    echo $str[$key];\n}\n```\n\n正如你可能预料到的，在 PHP\
  \ 7 中运行的输出会产生 A、B 和 D，以及一系列 Notices，如下所示：\n\n```\nNULL\nPHP Notice: String offset\
  \ cast occurred in /repo/ch03/php8_warn_amb_offset.php on line 8\nA\n/repo/ch03/php8_warn_amb_offset.php:7:\n\
  bool(true)\nPHP Notice: String offset cast occurred in /repo/ch03/php8_\n```\n\n\
  warn_amb_offset.php 第 8 行\nB\n/repo/ch03/php8_warn_amb_offset.php:7:\ndouble(3.1428571428571)\n\
  PHP 通知：字符串偏移转换发生在 /repo/ch03/php8_warn_amb_offset.php 第 8 行\nD\n\nPHP 8 一致地产生相同的结果，但在这种情况下，Warning\
  \ 已取代 Notice：\n\n```\nNULL\nPHP Warning: String offset cast occurred in /repo/ch03/php8_warn_amb_offset.php\
  \ on line 8\nA\nbool(true)\nPHP Warning: String offset cast occurred in /repo/ch03/php8_warn_amb_offset.php\
  \ on line 8\nB\nfloat(3.142857142857143)\nPHP Warning: String offset cast occurred\
  \ in /repo/ch03/php8_warn_amb_offset.php on line 8\nD\n```\n\n现在让我们看一下不存在的偏移量处理。\n\
  \n## 未初始化或不存在的字符串偏移量\n\n这种类型的错误旨在捕获使用超出范围的偏移量访问字符串的情况。 这里有一个非常简单的代码示例来说明这种情况：\n\n\
  // /repo/ch03/php8_warn_un_init_offset.php\n$str = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';\n\
  echo $str[27];\n```\n\n在 PHP 7 中运行此代码会产生一个 Notice。 以下是 PHP 7 的输出：\n\n```\nPHP Notice:\
  \ Uninitialized string offset: 27 in /repo/ch03/php8_warn_un_init_offset.php on\
  \ line 5\n```\n\n可以预见，PHP 8 的输出会产生一个 Warning，如下所示：\n\n```\nPHP Warning: Uninitialized\
  \ string offset 27 in /repo/ch03/php8_warn_un_init_offset.php on line 5\n```\n\n\
  本节中的所有示例都证实了 PHP 8 普遍趋向于强制执行最佳编码实践的趋势。\n\n> 提示\n> \n> 有关提升的 Notices 和 Warnings 的更多信息，请参阅本文：https://wiki.php.net/rfc/engine_warnings.\n\
  \n现在，我们将注意力转向（臭名昭著的）@ 警告抑制器。\n\n## 处理 @ 错误控制运算符\n\n多年来，许多 PHP 开发者一直使用 @ 错误控制运算符来掩盖错误。\
  \ 在使用不可靠的 PHP 库和编写不良的代码时尤其如此。 不幸的是，这种使用的净效果只会传播不良代码！\n\n许多 PHP 开发者抱有侥幸心理，相信当他们使用\
  \ @ 运算符防止错误显示时，问题似乎神奇地消失了！ 相信我说的话：它并没有！ 在本节中，我们首先检查 @ 运算符的传统用法，然后检查 PHP 8 中 @ 运算符的变化。\n\
  \n> 提示\n> \n> 有关传统 @ 运算符语法和用法的更多信息，请参阅此文档参考页面：https://www.php.net/manual/en/language.operators.errorcontrol.php.\n\
  \n## @ 运算符用法\n\n在给出代码示例之前，再次强调非常重要，我们并不提倡使用这种机制！ 相反——在每种情况下都应避免这种用法。 如果出现错误消息，最好的解决方案是修复错误，而不是将其静音！\n\
  \n在下面的代码示例中，定义了两个函数。 bad() 函数故意触发错误。 worse() 函数包含一个存在解析错误的文件。 请注意，当调用函数时，@ 符号位于函数名称之前，导致错误输出被抑制：\n\
  \n```\n```php\n// /repo/ch03/php8_at_silencer.php\nfunction bad() {\n    trigger_error(__FUNCTION__,\
  \ E_USER_ERROR);\n}\nfunction worse() {\n    return include __DIR__ .  '/includes/\n\
  \        causes_parse_error.php';\n}\necho @bad();\necho @worse();\necho \"\\nLast\
  \ Line\\n\";\n```\n```\n\n在 PHP 7 中，根本没有任何输出，如下所示：\n\n```\n```bash\nroot@php8_tips_php7\
  \ [ /repo/ch03 ]# php php8_at_silencer.php\nroot@php8_tips_php7 [ /repo/ch03 ]#\n\
  ```\n```\n\n有趣的是，在 PHP 7 中程序实际上不允许继续：我们从未看到 Last Line 输出。 这是因为，尽管被屏蔽，但仍然生成了一个致命错误，导致程序失败。\
  \ 然而在 PHP 8 中，致命错误并未被屏蔽，如下所示：\n\n```\n```bash\nroot@php8_tips_php8 [ /repo/ch03\
  \ ]# php8 php8_at_silencer.php\nPHP Fatal error:  bad in /repo/ch03/php8_at_silencer.php\
  \ on\nline 5\n```\n```\n\n现在让我们看一下 PHP 8 中关于 @ 运算符的另一个差异。\n\n## @ 运算符和 error_reporting()\n\
  \nerror_reporting() 函数通常用于覆盖 php.ini 文件中设置的 error_reporting 指令。 然而，此函数的另一个用途是返回最新的错误代码。\
  \ 然而，在 PHP 8 之前的版本中存在一个奇怪的例外，即如果使用 @ 运算符，error_reporting() 会返回 0 值。\n\n在下面的代码示例中，我们定义了一个错误处理程序，当它被调用时报告收到的错误编号和字符串。\
  \ 此外，我们还显示 error_reporting() 返回的值：\n\n```\n```php\n// /repo/ch03/php8_at_silencer_err_rep.php\n\
  function handler(int $errno , string $errstr) {\n    $report = error_reporting();\n\
  \    echo 'Error Reporting : ' . $report . \"\\n\";\n    echo 'Error Number    \
  \ : ' . $errno . \"\\n\";\n    echo 'Error String     : ' . $errstr . \"\\n\";\n\
  \    if (error_reporting() == 0) {\n        echo \"IF statement works!\\n\";\n \
  \   }\n}\n```\n```\n\n如前所述，我们定义了一个故意触发错误的 bad() 函数，然后使用 @ 运算符调用该函数，如下所示：\n\n```\n\
  ```php\nfunction bad() {\n    trigger_error('We Be Bad', E_USER_ERROR);\n}\nset_error_handler('handler');\n\
  echo @bad();\n```\n```\n\n在 PHP 7 中，你会注意到 error_reporting() 返回 0，因此导致 IF statement\
  \ works! 出现在输出中，如下所示：\n\n```\n```\nroot@php8_tips_php7 [ /repo/ch03 ] #\nphp php8_at_silencer_err_rep.php\n\
  Error Reporting : 0\nError Number     : 256\nError String     : We Be Bad\nIF statement\
  \ works!\n```\n```\n\n另一方面，在 PHP 8 中运行，error_reporting() 返回上一个错误的值——在本例中为 4437。\
  \ 当然，if () 表达式失败，导致没有额外输出。 以下是同一代码在 PHP 8 中运行的结果：\n\n```\nroot@php8_tips_php8 [\
  \ /repo/ch03 ] #\nphp8_at_silencer_err_rep.php\nError Reporting : 4437\nError Number\
  \   : 256\nError String   : We Be Bad\n```\n\n这结束了对 PHP 8 中 @ 运算符使用差异的讨论。\n\n> 提示\n\
  > \n> **最佳实践：** 不要使用 @ 错误控制运算符！ @ 运算符的意图是抑制错误消息的显示，但你需要考虑为什么首先会出现此错误消息。 通过使用 @ 运算符，你只是在回避提供问题的解决方案！\n\
  \n## 摘要\n\n在本章中，你了解了 PHP 8 中错误处理的主要变化概述。 你还获得了可能出现错误情况的示例，现在对如何在 PHP 8 中正确管理错误有了概念。\
  \ 你现在有了重构代码的坚实路径，这些代码在 PHP 8 下现在会产生错误。 如果你的代码可能导致前面描述的任何条件，即以前的 Warnings 现在是 Errors，你的代码可能会中断。\n\
  \n同样，虽然前面描述的第二组错误条件过去只会产生 Notices，但这些相同的条件现在会引起 Warning。 新的 Warning 集给了你调整有缺陷代码的机会，防止你的应用程序退化为严重不稳定的状态。\n\
  \n最后，你了解到使用 @ 运算符是强烈不鼓励的。 在 PHP 8 中，此语法将不再屏蔽致命错误。 在下一章中，你将学习如何在 PHP 8 中创建 C 语言结构并直接调用\
  \ C 语言函数。\n"
- "## 4 直接调用 C 语言\n\n## 直接调用 C 语言\n\n本章介绍了 **外部函数接口 (FFI)**。 在本章中，你将了解 FFI 是什么、它有什么用以及如何使用它。\
  \ 本章中的这些信息对于有兴趣使用直接 C 语言调用进行快速自定义原型设计的开发者非常重要。\n\n在本章中，你不仅了解将 FFI 引入 PHP 语言背后的背景，还学习如何将\
  \ C 语言结构和函数直接合并到你的代码中。 虽然——正如你将要了解的那样——这不应为了获得更高的速度而这样做，但它确实使你能够将任何 C 语言库直接合并到你的\
  \ PHP 应用程序中。 这种能力为 PHP 迄今为止无法使用的整个功能世界打开了大门。\n\n本章涵盖的主题包括以下内容：\n\n- 了解 FFI\n- 学习在哪里使用\
  \ FFI\n- 检查 FFI 类\n- 在应用程序中使用 FFI\n- 使用 PHP 回调\n\n\n\n\n## Technical requirements\n\
  \n为了检查并运行本章提供的代码示例，这里列出了最低推荐硬件：\n\n- 基于 X86_64 的台式电脑或笔记本电脑\n- 1 **千兆字节 (GB)** 的可用磁盘空间\n\
  - 4 GB 的 **随机存取存储器 (RAM)**\n- 500 **千比特每秒 (Kbps)** 或更快的互联网连接\n\n此外，您需要安装以下软件：\n\n\
  - Docker\n- Docker Compose\n\n请参阅 *第 1 章，介绍新的 PHP 8 OOP 特性* 中的 *技术要求* 部分，了解有关 Docker\
  \ 和 Docker Compose 安装的更多信息，以及如何构建本书中用于演示代码的 Docker 容器。在本书中，我们将恢复示例代码的目录称为 `/repo`。\n\
  \n本章的源代码位于此处：\n\n```\nhttps://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices\n\
  ```\n\n我们现在可以开始讨论，首先了解 FFI。\n\n## Understanding FFI\n\nFFI 的主要目的是允许任何编程语言能够将用其他语言编写的外部库中的代码和函数调用纳入其中。早期的一个例子是\
  \ 1980 年代微型计算机能够使用 `PEEK` 和 `POKE` 命令将汇编语言纳入原本缓慢的 **初学者通用符号指令代码 (BASIC)** 编程语言脚本中。与许多其他语言不同，PHP\
  \ 在 PHP 7.4 之前不具备此功能，尽管自 2004 年以来一直在讨论。\n\n为了全面了解 PHP 8 中的 FFI，有必要 digress 并看看为什么\
  \ FFI 花了这么长时间才完全被纳入 PHP 语言。也有必要快速了解一下 PHP 扩展的一般情况，以及处理 C 语言代码的能力。我们首先研究 PHP 与 C\
  \ 语言之间的关系。\n\n## Relationship between PHP and the C language\n\n**C 语言** 由 Dennis\
  \ Ritchie 于 1972 年底在贝尔实验室开发。从那时起，尽管引入了其面向对象的表亲 C++，该语言仍然主导着编程语言领域。PHP 本身是用 C 编写的；因此，能够直接加载\
  \ C 共享库并直接访问 C 函数和数据结构，是对 PHP 语言的一个非常重要的补充。\n\n将 FFI 扩展引入 PHP 语言使 PHP 能够加载并直接处理\
  \ C 结构和 C 函数。为了在何时何地明智地决定使用 FFI 扩展，让我们先看看 PHP 扩展的一般情况。\n\n## Understanding PHP extensions\n\
  \n**PHP 扩展**，顾名思义，*扩展* PHP 语言。每个扩展都可以添加 **面向对象编程 (OOP)** 类以及过程级函数。每个扩展都有一个不同的逻辑目的——例如，GD\
  \ 扩展处理图形图像操作，而 PDO 扩展处理数据库访问。\n\n作为一个类比，请考虑一家医院。在医院里，您有急诊、手术、儿科、骨科、心内科、X 光等部门。每个部门都是自成体系的，并服务于不同的目的。部门共同组成医院。同样，PHP\
  \ 就像医院，而它的扩展就像各个部门。\n\n并非所有扩展都相等。一些被称为 **核心扩展** 的扩展在安装 PHP 时始终可用。其他扩展必须手动下载、编译并启用。现在让我们看看核心扩展。\n\
  \n## Accessing PHP core extensions\n\nPHP 核心扩展直接包含在位于此处的 PHP 主源代码存储库中：https://github.com/php/php-src/tree/master/ext。如果您访问此网页，您将看到子目录列表，如以下屏幕截图所示。每个子目录都包含构成特定扩展的\
  \ C 语言代码：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_136_0.png)\n\n图 4.1 – GitHub\
  \ 上看到的 PHP 核心扩展\n\n因此，当 PHP 安装在服务器上时，所有核心扩展也会被编译和安装。我们现在将简要了解一下不属于核心的扩展。\n\n## Examining\
  \ non-core PHP extensions\n\n不属于核心的 PHP 扩展通常由特定供应商维护（**Microsoft** 是一个例子）。非常典型的是，非核心扩展被视为可选且使用不广泛。\n\
  \n一旦非核心扩展开始被越来越多地使用，很有可能最终会被迁移到核心。这方面的例子很多。最近的一个是 JSON 扩展：它现在不仅是核心的一部分，而且在 PHP 8\
  \ 中此扩展无法再被禁用。\n\n核心扩展也可能被移除。一个例子是 `mcrypt` 扩展。它在 PHP 7.1 中已被弃用，因为该扩展所依赖的基础库已被 *废弃*\
  \ 超过 9 年。在 PHP 7.2 中，它正式从核心中移除。我们现在考虑在哪里找到非核心扩展。\n\n## Finding non-core extensions\n\
  \n在这一点上，您可能会问一个合乎逻辑的问题：*您从哪里获取非核心扩展？* 通常，非核心扩展可直接从供应商处获取，从 `github.com` 获取，或从此网站获取：`http://pecl.php.net/`。多年来，人们抱怨\
  \ `pecl.php.net` 包含过时且未维护的代码。虽然这部分是真的，但在这个网站上确实存在最新且积极维护的代码也是事实。\n\n例如，如果您查看 MongoDB\
  \ 的 PHP 扩展，您会看到最后一次发布是在 2020 年 11 月底。以下屏幕截图显示了该扩展的 **PHP 扩展社区库 (PECL)** 网站页面：\n\n\
  | Version | State | Release Date | Downloads |\n|---|---|---|---|\n| **1.9.0** |\
  \ stable | 2020-11-25 | mongodb-1.9.0.tgz (1269.9kB) DLL [Changelog] |\n\n图 4.2\
  \ – PHP MongoDB 扩展的 pecl.php.net 页面\n\n在许多情况下，供应商更喜欢完全控制扩展。这意味着您需要访问他们的网站来获取 PHP\
  \ 扩展。一个例子是 Microsoft SQL Server 的 PHP 扩展，可在此 **统一资源定位符 (URL)** 找到：`https://docs.microsoft.com/en-us/sql/connect/php/download-drivers-php-sql-server?view=sql-server-ver15`。\n\
  \n本小节的关键要点是 PHP 语言通过其扩展得到增强。扩展是用 C 语言编写的。因此，能够直接在 PHP 脚本内部模拟原型扩展的逻辑是非常重要的。现在让我们把注意力转向您应该在哪里使用\
  \ FFI。\n\n## Learning where to use FFI\n\n直接将 C 库导入 PHP 的潜力令人震惊。其中一位 PHP 核心开发者实际上使用\
  \ FFI 扩展将 PHP 绑定到 C 语言 **TensorFlow** 机器学习平台！\n\n> **提示**\n> \n> 有关 TensorFlow 机器学习平台的信息，请访问此网页：https://www.tensorflow.org/。要了解\
  \ PHP 如何绑定到此库，请在此查看：https://github.com/dstogov/php-tensorflow。\n\n正如我们在本节中向您展示的那样，FFI\
  \ 扩展并不是满足您所有需求的万能解决方案。本节讨论 FFI 扩展的主要优势和劣势，并为您提供使用指南。我们在本节中驳斥的一个神话是，使用 FFI 扩展进行直接\
  \ C 语言调用会加快 PHP 8 程序的执行速度。首先，让我们看看 FFI 扩展为何花了这么长时间才进入 PHP。\n\n## Adopting FFI into\
  \ PHP\n\n第一个 FFI 扩展实际上是在 2004 年 1 月由 PHP 核心开发者 **Wez Furlong** 和 **Ilia Alshanetsky**\
  \ 在 PECL 网站 (https://pecl.php.net/) 上为 PHP 5 引入的。然而，该项目从未通过 Alpha 阶段，开发在不到一个月的时间内被放弃。\n\
  \n随着 PHP 在接下来的 14 年中不断发展和成熟，很明显 PHP 将受益于能够直接在 PHP 脚本中快速原型化潜在扩展的能力。没有这种能力，PHP 有可能落后于\
  \ Python 和 Ruby 等其他语言。\n\n在过去，由于缺乏快速原型化能力，扩展开发者被迫先使用 pecl 编译其完整扩展并安装，然后才能在 PHP 脚本中测试它。在某些情况下，开发者甚至必须\
  \ *重新编译 PHP 本身* 才能测试其新扩展！相比之下，FFI 扩展允许开发者将 C 函数调用 *直接放置* 在 PHP 脚本中以便立即测试。\n\n从 PHP\
  \ 7.4 开始并延续到 PHP 8，核心开发者 Dmitry Stogov 提出了一个改进版本的 FFI 扩展。在令人信服的概念验证之后（参见前面的提示框，关于\
  \ PHP 绑定到 TensorFlow 机器学习平台），该版本的 FFI 扩展被纳入 PHP 语言。\n\n> **提示**\n> \n> 原始 FFI PHP\
  \ 扩展可以在此处找到：http://pecl.php.net/package/ffi。有关修订后的 FFI 提案的更多信息，请参阅以下文章：https://wiki.php.net/rfc/ffi。\n\
  \n现在让我们研究为什么不应使用 FFI 来提高速度。\n\n\n\n## 不要为了速度使用 FFI\n\n因为 FFI 扩展允许 PHP 直接访问 C 语言库，人们很容易认为你的\
  \ PHP 应用会突然以机器语言的速度飞快运行。遗憾的是，事实并非如此。FFI 扩展需要在执行前先打开给定的 C 库，然后解析并伪编译一个 FFI 实例。FFI\
  \ 扩展随后充当 C 库代码与 PHP 脚本之间的桥梁。\n\n对于一些读者来说，FFI 扩展相对迟缓的性能并不仅限于 PHP 8 可能会令人宽慰。其他语言在使用自己的\
  \ FFI 实现时也会遭受同样的节流效应。这里有基于 *Ary 3 基准测试* 的一个出色的性能比较：https://wiki.php.net/rfc/ffi#php_ffi_performance.\n\
  \n如果你查看刚才引用的网页上显示的表格，你会看到 Python FFI 实现在 0.343 秒内完成了基准测试，而仅使用原生 Python 代码运行同一基准测试则耗时\
  \ 0.212 秒。\n\n查看同一表格，PHP 7.4 FFI 扩展在 0.093 秒内运行了基准测试（比 Python 快 30 倍！），而仅使用原生 PHP\
  \ 代码运行同一基准测试则耗时 0.040 秒。\n\n下一个合乎逻辑的问题是：*为什么要使用 FFI 扩展呢？* 这将在下一节中介绍。\n\n## 为什么使用\
  \ FFI 扩展？\n\n前一个问题的答案很简单：该扩展主要设计用于快速 **PHP 扩展原型开发**。PHP 扩展是该语言的生命线。没有扩展，PHP 只是 *另一种编程语言*。\n\
  \n当高级开发者首次着手一个编程项目时，他们需要确定该项目的最佳语言。一个关键因素是可用的扩展数量以及这些扩展的维护活跃程度。一般来说，积极维护的扩展数量与使用该语言的项目长期成功潜力之间存在直接相关性。\n\
  \n因此，如果有办法加快扩展开发速度，PHP 语言本身的长期可行性就会得到改善。FFI 扩展为 PHP 语言带来的价值在于它能够直接在 PHP 脚本中测试扩展原型，而无需经过完整的编译-链接-加载-测试周期。\n\
  \n除了快速原型开发之外，FFI 扩展的另一个用例是允许 PHP 直接访问晦涩或专有的 C 代码。一个例子是用于控制工厂机器的自定义 C 代码。为了让 PHP\
  \ 运行工厂，可以使用 FFI 扩展将 PHP 直接绑定到控制各种机器的 C 库。\n\n最后，该扩展的另一个用例是使用它来预加载 C 库，可能减少内存消耗。在展示使用示例之前，让我们先看看\
  \ FFI 类及其方法。\n\n## 检查 FFI 类\n\n正如本章所述，并非每个开发者都需要使用 FFI 扩展。直接使用 FFI 扩展的经验会加深你对 PHP\
  \ 语言内部机制的理解，而这种加深的理解可能对你作为 PHP 开发者的职业生涯产生积极影响：未来你很可能会被一家开发了自定义 PHP 扩展的公司雇佣。在这种情况下知道如何操作\
  \ FFI 扩展，可以让你为自定义 PHP 扩展开发新功能，同时帮助你排查扩展问题。\n\nFFI 类由 20 个方法组成，可分为四个大类，概述如下：\n\n\
  - **创建型**：此类方法创建可从 FFI 扩展 **应用程序编程接口**（API）获得的类的实例。\n- **比较**：比较方法旨在比较 C 数据值。\n\
  - **信息性**：这组方法提供有关 C 数据值的元数据，包括大小和 *对齐方式*。\n- **基础设施**：基础设施方法用于执行诸如复制、填充和释放内存等后勤操作。\n\
  \n> 提示\n> 完整的 FFI 类文档在这里：https://www.php.net/manual/en/class.ffi.php.\n\n有趣的是，所有\
  \ FFI 类方法都可以以静态方式调用。现在是时候深入研究与 FFI 相关的类的细节和用法了，从 *创建型* 方法开始。\n\n## 使用 FFI 创建型方法\n\
  \n属于创建型类别的 FFI 方法旨在直接生成 FFI 实例或由 FFI 扩展提供的类的实例。在使用 FFI 扩展提供的 C 函数时，重要的是要认识到你不能直接将原生\
  \ PHP 变量传递给函数并期望它能工作。数据必须首先作为 FFI 数据类型创建或导入到 FFI 数据类型中，然后才能将 FFI 数据类型传递给 C 函数。为了创建\
  \ FFI 数据类型，请使用表 4.1 中汇总的一个函数，如下所示：\n\n| FFI 方法 | 返回 | 注释 |\n|---|---|---|\n| `arrayType()`\
  \ | `FFI\\CType` | 生成一个 C 数组。第一个参数是由调用 `FFI::type()` 产生的数据类型。第二个参数是一个表示数组维度的数组。\
  \ |\n| `cdef()` | `FFI` | 作为参数你必须提供一个 C 语言代码块。返回的 FFI 实例在 PHP 程序和 C 语言库之间提供桥梁。 |\n\
  | `new()` | `FFI\\CData` | 生成一个原生 C 数据结构。如果第一个参数是字符串，它必须是有效的 C 类型。否则，将 `FFI\\CType`\
  \ 对象作为第一个参数提供。 |\n| `scope()` | `FFI` | 基于 *预加载* 的 C 声明创建 FFI 实例。 |\n| `string()`\
  \ | `string` | 从由给定字节数组成的 `FFI\\CData` 实例返回一个原生 PHP 字符串。 |\n| `type()` | `FFI\\\
  CType` | 创建一个可与其它 FFI 扩展类一起使用的 `FFI\\CType` 对象。 |\n\n表 4.1 – FFI 类创建型方法摘要\n\ncdef()\
  \ 和 scope() 方法都直接生成 FFI 实例，而其他方法生成可用于创建 FFI 实例的对象实例。string() 用于从原生 C 变量中提取给定数量的字节。让我们看看如何创建和使用\
  \ FFI\\CType 实例。\n\n## 创建和使用 FFI\\CType 实例\n\n必须特别注意，一旦创建了 FFI\\CType 实例，不要像原生 PHP\
  \ 变量那样简单地为其赋值。之所以如此，是因为 PHP 是松散类型的，这样做只会覆盖 FFI\\CType 实例。相反，要为 FFI\\CType 实例分配标量值，请使用其\
  \ cdata 属性。\n\n以下示例创建一个 $arr C 数组。然后用值填充原生 C 数组直到其最大大小，之后我们使用简单的 var_dump() 来查看其内容。我们将按以下步骤进行：\n\
  \n- 1. 首先，我们使用 FFI::arrayType() 创建数组。作为参数，我们提供 FFI::type() 方法和维度。然后我们使用 FFI::new()\
  \ 创建 FFI\\Ctype 实例。代码如下所示：\n- 2. 或者，我们也可以将操作合并为单个语句，如下所示：\n- 3. 然后我们初始化三个提供测试数据的变量，如以下代码片段所示。请注意，原生的\
  \ PHP count() 函数可用于 FFI\\CData 数组类型：\n- 4. 现在我们可以像 PHP 数组一样填充值，只是我们需要使用 cdata 属性以便将元素保留为\
  \ FFI\\CType 实例。代码如下所示：\n\n```php\n// /repo/ch04/php8_ffi_array.php\n$type = FFI::arrayType(FFI::type(\"\
  char\"), [3, 3]);\n$arr  = FFI::new($type);\n```\n\n```php\n$arr  = FFI::new(FFI::type(\"\
  char [3] [3]\"));\n```\n\n```php\n$pos  = 0;\n$val  = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';\n\
  $y_max = count($arr);\n```\n\n```php\nfor ($y = 0; $y < $y_max; $y++) {\n    $x_max\
  \ = count($arr[$y]);\n    for ($x = 0; $x < $x_max; $x++) {\n        $arr[$y][$x]->cdata\
  \ = $val[$pos++];\n    }\n}\nvar_dump($arr)\n```\n\n在前面的示例中，我们使用嵌套的 for() 循环用字母填充二维\
  \ 3 x 3 数组。如果现在执行一个简单的 var_dump()，我们将得到以下结果：\n\n```bash\nroot@php8_tips_php8 [/repo/ch04\
  \ ]# php\n    php8_ffi_array.php\n```\n\n\n\n```\nobject(FFI\\CData:char[3][3])#2\
  \ (3) {\n    [0]=> object(FFI\\CData:char[3])#3 (3) {\n        [0]=> string(1) \"\
  A\"\n        [1]=> string(1) \"B\"\n        [2]=> string(1) \"C\"\n    }\n    [1]=>\
  \ object(FFI\\CData:char[3])#1 (3) {\n        [0]=> string(1) \"D\"\n        [1]=>\
  \ string(1) \"E\"\n        [2]=> string(1) \"F\"\n    }\n    [2]=> object(FFI\\\
  CData:char[3])#4 (3) {\n        [0]=> string(1) \"G\"\n        [1]=> string(1) \"\
  H\"\n        [2]=> string(1) \"I\"\n    }\n}\n```\n\n从输出中首先需要注意的重要一点是，所有索引都是整数。从输出中得到的第二个结论是，这显然不是原生的\
  \ PHP 数组。var_dump() 显示给我们，每个数组元素都是一个 FFI\\CData 实例。此外，请注意 C 语言字符串被当作数组处理。\n\n由于该数组的类型为\
  \ char，我们可以使用 FFI::string() 来显示其中一行。以下是产生 ABC 响应的命令：\n\n```\necho FFI::string($arr[0],\
  \ 3);\n```\n\n任何尝试将 FFI\\CData 实例提供给接受数组作为参数的 PHP 函数都注定会失败，即使它被定义为数组类型。在下面的代码片段中，请注意如果将此命令添加到前面的代码块中会产生的输出：\n\
  \n```\necho implode(',', $arr);\n```\n\n正如接下来所示的输出，你可以看到，由于数据类型不是数组，implode() 会引发致命错误。以下是\
  \ resulting 输出：\n\n```\nPHP Fatal error: Uncaught TypeError: implode(): Argument\
  \ #2 ($array) must be of type ?array, FFI\\CData given in /repo/ch04/php8_ffi_array.php:25\n\
  ```\n\n你现在已经知道如何创建和使用 FFI\\CType 实例。现在让我们把注意力转向创建 FFI 实例。\n\n## 创建和使用 FFI 实例\n\n\
  如本章引言中所述，FFI 扩展促进了快速原型设计。因此，使用 FFI 扩展，你可以一次开发一个设计用于新扩展的 C 函数，并在 PHP 应用程序内部立即对其进行测试。\n\
  \n> **重要提示**\n> FFI 扩展不会编译 C 代码。为了使用 FFI 扩展中的 C 函数，你必须首先使用 C 编译器将 C 代码编译成共享库。你将在本章最后一节\
  \ *在应用程序中使用 FFI* 中学习如何执行此操作。\n\n为了在 PHP 和原生 C 库函数调用之间建立桥梁，你需要创建一个 FFI 实例。FFI 扩展需要你提供一个\
  \ C 定义，该定义定义了 C 函数签名以及计划使用的 C 库。FFI::cdef() 和 FFI::scope() 都可以直接用于创建 FFI 实例。\n\n\
  以下示例使用 FFI::cdef() 来绑定两个原生 C 库函数。以下是发生的情况：\n\n- 1. 第一个原生方法 srand() 用于为随机化序列设置种子。rand()，另一个原生\
  \ C 函数，调用序列中的下一个数字。$key 变量保存随机化的最终结果。$size 表示要调用的随机数个数。代码在以下片段中说明：\n- 2. 然后我们通过调用\
  \ cdef() 创建 FFI 实例，并在字符串 $code 中标识原生 C 函数，该字符串取自 libc.so.6 原生 C 库，如下所示：\n\n// /repo/ch04/php8_ffi_cdef.php\n\
  $key = '';\n$size = 4;\n```\n\n```\n$code = <<<EOT\n    void srand (unsigned int\
  \ seed);\n    int rand (void);\nEOT;\n$ffi = FFI::cdef($code, 'libc.so.6');\n```\n\
  \n3. 然后我们通过调用 srand() 为随机化设置种子。然后，在循环中，我们调用 rand() 原生 C 库函数来生成随机数。我们使用 sprintf()\
  \ 原生 PHP 函数将结果整数转换为十六进制，其输出附加到 $key，然后输出。代码如下所示：\n\n```php\n$ffi->srand(random_int(0,\
  \ 999));\nfor ($x = 0; $x < $size; $x++)\n    $key .= sprintf('%x', $ffi->rand());\n\
  echo $key\n```\n\n以下是前面代码片段的输出。请注意，结果值可用作随机密钥：\n\n```\n```\nroot@php8_tips_php8\
  \ [/repo/ch04 ]# php php8_ffi_cdef.php\n23f306d51227432e7d8d921763b7eedf\n```\n\
  ```\n\n在输出中，你会看到一系列连接的随机整数转换为十六进制。请注意，每次调用脚本时，结果值都会发生变化。\n\n**提示**\n对于真正的随机化，使用\
  \ random_int() 原生 PHP 函数可能更好。openssl 扩展中也包含一些优秀的密钥生成函数。此处所示的示例主要旨在让你熟悉 FFI 扩展的使用。\n\
  \n**重要提示**\nFFI 扩展还包括两个额外的创建方法：\nFFI::load() 和 FFI::scope()。FFI::load() 用于在预加载过程中直接从\
  \ C 头文件（*.h）加载 C 函数定义。FFI::scope() 使预加载的 C 函数可通过 FFI 扩展使用。有关预加载的更多信息，请在此处查看 FFI\
  \ 文档中的完整预加载示例：https://www.php.net/manual/en/ffi.examples-complete.php。\n\n现在让我们看看\
  \ FFI 扩展中用于比较原生 C 数据类型的函数。\n\n## 使用 FFI 比较数据\n\n需要记住的是，当你使用 FFI 扩展创建 C 语言数据结构时，它存在于你的\
  \ PHP 应用程序之外。如你在前面的示例中看到的（参见 创建和使用 FFI\\CType 实例 部分），PHP 在一定程度上可以与 C 数据交互。然而，对于比较目的，最好使用\
  \ FFI::memcmp()，因为原生 PHP 函数可能会返回不一致的结果。\n\nFFI 扩展中可用的两个比较函数在此总结于表 4.2 中：\n\n| FFI\
  \ 方法 | 返回 | 说明 |\n|---|---|---|\n| isNull() | bool | 如果 FFI\\CData 实例为空指针则返回 TRUE。\
  \ |\n| memcmp() | int | 其操作方式与 PHP strcmp() 函数或 <=> 运算符非常相似。如果第一个 FFI\\CData 实例小于第二个，则返回小于\
  \ 0 的值。如果两者相等，则返回 0，如果第二个参数的值大于第一个，则返回大于 0 的值。 |\n\n表 4.2 – FFI 类比较方法摘要\n\n可以使用\
  \ FFI::isNull() 来确定 FFI\\CData 实例是否为空。更有趣的是 FFI::memcmp()。尽管此函数的操作方式与 spaceship\
  \ 运算符（<=>）相同，但它接受第三个参数，表示你希望包含在比较中的字节数。以下示例说明了此用法：\n\n- 1. 我们首先定义一组四个变量，表示可以包含多达六个字符的\
  \ FFI\\CData 实例，并用示例数据填充这些实例，如下所示：\n\n// /repo/ch04/php8_ffi_memcmp.php\n$a = FFI::new(\"\
  char[6]\");\n$b = FFI::new(\"char[6]\");\n$c = FFI::new(\"char[6]\");\n$d = FFI::new(\"\
  char[6]\");\n```\n\n2. 回想一下，C 语言将字符数据视为数组，因此我们不能直接分配字符串，即使使用 cdata 属性。因此，我们需要定义一个匿名函数，用字母填充这些实例。我们使用以下代码来实现此目的：\n\
  \n```\n$populate = function ($cdata, $start, $offset, $num) {\n    for ($x = 0;\
  \ $x < $num; $x++)\n        $cdata[$x + $offset] = chr($x + $offset +\n        \
  \                            $start);\n    return $cdata;\n};\n```\n\n3. 接下来，我们使用该函数用不同的字母集填充四个\
  \ FFI\\CData 实例，如下所示：\n\n```\n$a = $populate($a, 65, 0, 6);\n$b = $populate($b,\
  \ 65, 0, 3);\n$b = $populate($b, 85, 3, 3);\n$c = $populate($c, 71, 0, 6);\n$d =\
  \ $populate($d, 71, 0, 6);\n```\n\n4. 现在我们可以使用 FFI::string() 方法来显示迄今为止的内容，如下所示：\n\
  \n```\n$patt = \"%2s : %6s\\n\";\nprintf($patt, '$a', FFI::string($a, 6));\nprintf($patt,\
  \ '$b', FFI::string($b, 6));\nprintf($patt, '$c', FFI::string($c, 6));\nprintf($patt,\
  \ '$d', FFI::string($d, 6));\n```\n\n5. 以下是 printf() 语句的输出：\n\n```\n$a : ABCDEF\n\
  $b : ABCXYZ\n$c : GHIJKL\n$d : GHIJKL\n```\n\n\n\n6. 从输出中可以看到，$c 和 $d 的值相同。$a 和\
  \ $b 的前三个字符相同，但最后三个不同。\n\n7. 此时，如果我们尝试使用 spaceship 运算符（<=>）进行比较，结果如下：\n\n```\nPHP\
  \ Fatal error: Uncaught FFI\\Exception: Comparison of incompatible C types\n```\n\
  \n8. 同样地，即使数据是字符类型，尝试使用 strcmp()，结果如下：\n\n```\nPHP Warning: strcmp() expects parameter\
  \ 1 to be string, object given\n```\n\n9. 因此，我们唯一的替代方案是使用 FFI::memcmp()。在下面显示的比较集中，请注意第三个参数为\
  \ 6，表示 PHP 应比较最多六个字符：\n\n```\n$p = \"%20s : %2d\\n\";\nprintf($p, 'memcmp($a, $b,\
  \ 6)', FFI::memcmp($a, $b, 6));\nprintf($p, 'memcmp($c, $a, 6)', FFI::memcmp($c,\
  \ $a, 6));\nprintf($p, 'memcmp($c, $d, 6)', FFI::memcmp($c, $d, 6));\n```\n\n10.\
  \ 如预期所示，输出与在原生 PHP 字符串上使用 spaceship 运算符的结果相同，如下所示：\n\n```\nmemcmp($a, $b, 6) : -1\n\
  memcmp($c, $a, 6) : 1\nmemcmp($c, $d, 6) : 0\n```\n\n11. 注意如果我们将比较限制为仅三个字符会发生什么。以下是添加到代码块中的另一个\
  \ FFI::memcmp() 比较，将第三个参数设置为 3：\n\n```\necho \"\\nUsing FFI::memcmp() but not full\
  \ length\\n\";\nprintf($p, 'memcmp($a, $b, 3)', FFI::memcmp($a, $b, 3));\n```\n\n\
  12. 从此处显示的输出可以看到，通过将 memcmp() 限制为仅三个字符，$a 和 $b 被认为是相等的，因为它们都以相同的三个字符 a、b 和 c 开头：\n\
  \n```\nUsing FFI::memcmp() but not full length\nmemcmp($a, $b, 3) : 0\n```\n\n从此示例中需要汲取的最重要一点是，你需要在比较的字符数与所比较数据的性质之间找到平衡。比较的字符越少，整体操作越快。然而，如果数据的性质使得出现错误结果成为可能，则必须增加字符数并承受轻微的性能损失。\n\
  \n现在让我们来看一下从 FFI 扩展数据中收集信息。\n\n## 从 FFI 扩展数据中提取信息\n\n当你使用 FFI 实例和原生 C 数据结构时，原生 PHP\
  \ 信息方法如 strlen() 和 ctype_digit() 不会产生有用的信息。因此，FFI 扩展包含三种旨在产生有关 FFI 扩展数据信息的 方法。这三种方法在表\
  \ 4.3 中进行了总结：\n\n| FFI 方法 | 返回值 | 注释 |\n|---|---|---|\n| alignof() | int | 返回 FFI\\\
  CType 或 FFI\\CData 实例的对齐方式。一种很好的可视化返回值的方式是内存中的块大小。 |\n| sizeof() | int | 返回 FFI\\\
  CType 或 FFI\\CData 实例使用的内存量。 |\n| typeof() | FFI\\CType | 返回 FFI\\CData 对象的数据类型。返回的数据类型不是\
  \ PHP 原生数据类型。相反，返回的是标识 C 数据类型的 FFI\\CType 实例。 |\n\n表 4.3 – FFI 类信息方法的总结\n\n我们首先查看\
  \ FFI::typeof()，然后深入研究另外两种方法。\n\n## 使用 FFI::typeof() 确定 FFI 数据的性质\n\n下面是一个说明 FFI::typeof()\
  \ 用法的示例。该示例还演示了在处理 FFI 数据时，原生 PHP 信息函数不会产生有用的结果。我们的做法如下：\n\n- 1. 首先，我们定义一个 $char\
  \ C 字符串并用字母表的最初六个字母填充，如下所示：\n- 2. 然后我们尝试使用 strlen() 获取字符串的长度。在以下代码片段中，请注意 $t::class\
  \ 的使用：这相当于 get_class($t)。此用法仅在 PHP 8 及以上版本可用：\n- 3. 在 PHP 7.4 中，结果是 Warning 消息。然而，在\
  \ PHP 8 中，如果你向 strlen() 传递除字符串之外的任何内容，将抛出致命的 Error 消息。以下是此时的 PHP 8 输出：\n- 4. 以类似的方式，尝试使用\
  \ ctype_alnum()，如下所示：\n- 5. 以下是步骤 4 中显示的 echo 命令的输出：\n\n// /repo/ch04/php8_ffi_typeof.php\n\
  $char = FFI::new(\"char[6]\");\nfor ($x = 0; $x < 6; $x++)\n    $char[$x] = chr(65\
  \ + $x);\n```\n\n```\ntry {\n    echo 'Length of $char is ' . strlen($char);\n}\
  \ catch (Throwable $t) {\n    echo $t::class . ':' . $t->getMessage();\n}\n```\n\
  \n```\nTypeError:strlen(): Argument #1 ($str) must be of type string, FFI\\CData\
  \ given\n```\n\n```\necho '$char is ' .\n    ((ctype_alnum($char)) ? 'alpha' : 'non-alpha');\n\
  ```\n\n```\n$char is non-alpha\n```\n\n6. 如你所见，我们使用原生 PHP 函数无法获得有关 FFI 数据的任何有用信息！然而，使用\
  \ FFI::typeOf()，如下面所示，会返回更好的结果：\n\n```php\n$type = FFI::typeOf($char);\nvar_dump($type);\n\
  ```\n\n7. 以下是 var_dump() 的输出：\n\n```\nobject(FFI\\CType:char[6])#3 (0) {}\n```\n\
  \n从最终输出可以看到，我们现在有了有用的信息！现在让我们来看一下另外两个 FFI 信息方法。\n\n## 使用 FFI::alignof() 和 FFI::sizeof()\n\
  \n在进入展示这两种方法用法的实际示例之前，了解 **对齐** 到底意味着什么很重要。为了理解对齐，你需要对大多数计算机中内存的组织方式有一个基本的了解。\n\n\
  RAM 仍然是在程序运行周期期间临时存储信息的最高效方式。你的计算机的 **中央处理器 (CPU)** 在程序执行时将信息移入和移出内存。内存按并行数组组织。alignof()\
  \ 返回的对齐值是指可以从对齐内存数组的并行切片中一次获取的字节数。在旧计算机中，4 是一个典型值。对于大多数现代微型计算机，8 或 16（或更大）的值很常见。\n\
  \n现在让我们来看一个示例，说明这两种 FFI 扩展信息方法是如何使用的，以及该信息如何带来性能改进。我们将按以下方式进行：\n\n1. 首先，我们创建一个 FFI\
  \ 实例 $ffi，其中定义了两个分别标记为 Good 和 Bad 的 C 结构体。请注意，在以下代码片段中，两个结构体具有相同的属性；然而，属性的排列顺序不同：\n\
  \n```php\n$struct = 'struct Bad { char c; double d; int i; }; '\n    . 'struct Good\
  \ { double d; int i; char c; }; ';\n$ffi = FFI::cdef($struct);\n```\n\n2. 然后我们从\
  \ $ffi 中提取两个结构体，如下所示：\n\n```\n$bad = $ffi->new(\"struct Bad\");\n$good = $ffi->new(\"\
  struct Good\");\nvar_dump($bad, $good);\n```\n\n3. var_dump() 输出如下所示：\n\n```\nobject(FFI\\\
  CData:struct Bad)#2 (3) {\n    [\"c\"]=> string(1) \"\"\n    [\"d\"]=> float(0)\n\
  \    [\"i\"]=> int(0)\n}\nobject(FFI\\CData:struct Good)#3 (3) {\n    [\"d\"]=>\
  \ float(0)\n    [\"i\"]=> int(0)\n    [\"c\"]=> string(1) \"\"\n}\n```\n\n4. 然后我们使用这两种信息方法来报告这两个数据结构，如下所示：\n\
  \n```\necho \"\\nBad Alignment:\\t\" . FFI::alignof($bad);\necho \"\\nBad Size:\\\
  t\" . FFI::sizeof($bad);\necho \"\\nGood Alignment:\\t\" . FFI::alignof($good);\n\
  echo \"\\nGood Size:\\t\" . FFI::sizeof($good);\n```\n\n此代码示例的最后四行输出如下所示：\n\n```\n\
  Bad Alignment:  8\nBad Size:       24\nGood Alignment: 8\nGood Size:      16\n```\n\
  \n从输出可以看到，FFI::alignof() 的返回值告诉我们对齐块为 8 字节宽。然而，你也可以看到 Bad 结构体占用的字节大小比 Good 结构体所需的\
  \ 大 50%。由于这两个数据结构具有完全相同的属性，任何理智的开发人员都会选择 Good 结构体。\n\n从此示例可以看到，FFI 扩展信息方法能够让我们了解如何最好地组织我们的\
  \ C 数据以产生最有效的结果。\n\n> **提示**\n> \n> 有关 C 语言中 `sizeof()` 和 `alignof()` 之间差异的精彩讨论，请参阅本文：https://stackoverflow.com/questions/11386946/whats-the-difference-between-sizeof-and-alignof.\n\
  \n你现在已经了解了 FFI 扩展信息方法是什么，并看到了一些使用示例。现在让我们来看一下与基础设施相关的 FFI 扩展方法。\n\n## 使用 FFI 基础设施方法\n\
  \nFFI 扩展基础设施类别方法可以被视为 *幕后* 组件，支持 C 函数绑定正常工作所需的基础设施。正如我们在本章中反复强调的，如果你希望从 PHP 应用程序中直接访问\
  \ C 数据结构，则需要 FFI 扩展。因此，如果你需要执行等同于 PHP `unset()` 语句以释放内存，或 PHP `include()` 语句以包含外部程序代码的操作，FFI\
  \ 扩展基础设施方法提供了原生 C 数据与 PHP 之间的桥梁。\n\n表 4.4 总结了此类别中的方法，如下所示：\n\n| FFI 方法 | 返回值 | 注释\
  \ |\n|---|---|---|\n| `addr()` | `FFI\\CData` | 创建指向 C 数据的指针 |\n| `cast()` | `FFI\\\
  CData` | 执行 C 语言类型转换 |\n| `free()` | `void` | 释放 FFI 指针。PHP 中没有直接等价物 |\n| `memcpy()`\
  \ | `void` | 从一个 `FFI\\CData` 实例复制指定字节到另一个实例。 |\n| `memset()` | `void` | 使用由 `$value`\
  \ 组成的 `$size` 字节填充 `FFI\\CData` 实例。 |\n\n表 4.4 – FFI 类基础设施方法\n\n\n\n先来看看 FFI::addr()、free()、memset()\
  \ 和 memcpy()。\n\n## 使用 FFI::addr()、free()、memset() 和 memcpy()\n\nPHP 开发者经常通过 **引用**\
  \ 为变量赋值。这使得对一个变量的更改会自动反映到另一个变量中。在向函数或方法传递参数时使用引用尤其有用，当你需要返回多个值时。通过引用传递允许函数或方法返回无限数量的值。\n\
  \nFFI::addr() 方法为现有的 FFI\\CData 实例创建一个 C 指针。就像 PHP 引用一样，对指针关联的数据所做的任何更改也会同样发生。\n\
  \n在使用 FFI::addr() 方法构建示例的过程中，我们还向你介绍 FFI::memset()。该函数与 PHP 的 str_repeat() 函数类似，因为它（FFI::memset()）用特定值填充指定数量的字节。在此示例中，我们使用\
  \ FFI::memset() 用字母填充一个 C 字符字符串。\n\n在本小节中，我们还将查看 FFI::memcpy()。此函数用于将数据从一个 FFI\\\
  CData 实例复制到另一个实例。与 FFI::addr() 方法不同，FFI::memcpy() 创建的克隆与复制数据的来源没有任何关联。此外，我们介绍 FFI::free()，一种用于释放使用\
  \ FFI::addr() 创建的指针的方法。\n\n让我们看看这些 FFI 扩展方法如何使用，如下所示：\n\n- 1. 首先，创建一个 FFI\\CData\
  \ 实例 $arr，由六个字符的 C 字符串组成。请注意在以下代码片段中使用 FFI::memset()，另一种基础设施方法，用 **美国信息交换标准代码**（ASCII）代码\
  \ 65 填充字符串：字母 A：\n\n```\n// /repo/ch04/php8_ffi_addr_free_memset_memcpy.php\n$size\
  \ = 6;\n$arr  = FFI::new(FFI::type(\"char[$size]\"));\nFFI::memset($arr, 65, $size);\n\
  echo FFI::string($arr, $size);\n```\n\n- 2. 使用 FFI::string() 方法的 echo 结果如下所示：\n\n\
  ```\nAAAAAA\n```\n\n- 3. 如输出所示，出现了六个 ASCII 代码 65（字母 A）的实例。然后我们创建另一个 FFI\\CData 实例\
  \ $arr2，并使用 FFI::memcpy() 将六个字符从一个实例复制到另一个实例，如下所示：\n\n```\n$arr2 = FFI::new(FFI::type(\"\
  char[$size]\"));\nFFI::memcpy($arr2, $arr, $size);\necho FFI::string($arr2, $size);\n\
  ```\n\n- 4. 不出所料，输出与第 2 步中的输出相同，如下所示：\n\n```\nAAAAAA\n```\n\n- 5. 接下来，我们为 $arr 创建一个\
  \ C 指针。请注意，当指针被赋值时，它们在原生的 PHP var_dump() 函数中显示为数组元素。然后我们可以更改数组元素 0 的值，并使用 FFI::memset()\
  \ 用字母 B 填充它。代码显示在以下片段中：\n\n```\n$ref = FFI::addr($arr);\nFFI::memset($ref[0], 66,\
  \ 6);\necho FFI::string($arr, $size);\nvar_dump($ref, $arr, $arr2);\n```\n\n- 6.\
  \ 以下是与第 5 步中显示的剩余代码相关的输出：\n\n```\nBBBBBB\nobject(FFI\\CData:char(*)[6])#2 (1) {\n\
  \  [0]=> object(FFI\\CData:char[6])#4 (6) {\n    [0]=> string(1) \"B\"\n    [1]=>\
  \ string(1) \"B\"\n    [2]=> string(1) \"B\"\n    [3]=> string(1) \"B\"\n    [4]=>\
  \ string(1) \"B\"\n    [5]=> string(1) \"B\"\n  }\n}\nobject(FFI\\CData:char[6])#3\
  \ (6) {\n  [0]=> string(1) \"B\"\n  [1]=> string(1) \"B\"\n  [2]=> string(1) \"\
  B\"\n  [3]=> string(1) \"B\"\n[4]=>  string(1) \"B\"\n[5]=>  string(1) \"B\"\n}\n\
  object(FFI\\CData:char[6])#4 (6) {\n    [0]=>  string(1) \"A\"\n    [1]=>  string(1)\
  \ \"A\"\n    [2]=>  string(1) \"A\"\n    [3]=>  string(1) \"A\"\n    [4]=>  string(1)\
  \ \"A\"\n    [5]=>  string(1) \"A\"\n}\n```\n\n如输出所示，我们首先有一个 BBBBBB 字符串。你可以看到指针的形式是\
  \ PHP 数组。原始 FFI\\CData 实例 $arr 现在已更改为字母 B。然而，前面的输出也清楚地表明，副本 $arr2 不受对 $arr 或其 $ref[0]\
  \ 指针所做的更改的影响。\n\n- 7. 最后，为了释放使用 FFI::addr() 创建的指针，我们使用 FFI::free()。此方法类似于原生的 PHP\
  \ unset() 函数，但设计用于处理 C 指针。以下是添加到我们示例中的最后一行代码：\n\n```\nFFI::free($ref);\n```\n\n\
  现在你已经对如何处理 C 指针以及如何用信息填充 C 数据有了一定的了解，让我们看看如何对 FFI\\CData 实例进行类型转换。\n\n## 了解 FFI::cast()\n\
  \n在 PHP 中，类型转换过程经常发生。它用于 PHP 被要求执行涉及不同数据类型操作时。以下代码块显示了这一经典示例：\n\n```\n$a = 123;\n\
  $b = \"456\";\necho $a + $b;\n```\n\n在这个简单的示例中，$a 被赋予 int（整数）数据类型，而 $b 被赋予 string\
  \ 类型。echo 语句要求 PHP 首先将 $b 类型转换为 int，执行加法，然后将结果类型转换为 string。\n\n原生 PHP 还允许开发人员通过在变量或表达式前加上所需数据类型（用括号括起来）来强制数据类型。上一代码片段的重写示例可能如下所示：\n\
  \n```\n$a = 123;\n$b = \"456\";\necho (string) ($a + (int) $b);\n```\n\n强制类型转换使你的意图对使用你代码的其他开发人员非常清晰。它还保证了结果，因为强制类型转换对代码流程的控制更强，而不依赖于\
  \ PHP 的默认行为。\n\nFFI 扩展具有类似的功能，即 FFI::cast() 方法。如本章所述，FFI 扩展数据与 PHP 隔离，且不受 PHP 类型转换的影响。为了强制数据类型，你可以使用\
  \ FFI::cast() 根据需要返回一个并行的 FFI\\CData 类型。让我们在以下步骤中看看如何操作：\n\n- 1. 在此示例中，我们创建一个类型为\
  \ int 的 FFI\\CData 实例 $int1。我们使用其 cdata 属性为其赋值为 123，如下所示：\n\n```\n// /repo/ch04/php8_ffi_cast.php\n\
  // not all lines are shown\n$patt = \"%2d : %16s\\n\";\n$int1 = FFI::new(\"int\"\
  );\n$int1->cdata = 123;\n$bool = FFI::cast(FFI::type(\"bool\"), $int1);\nprintf($patt,\
  \ __LINE__, (string) $int1->cdata);\nprintf($patt, __LINE__, (string) $bool->cdata);\n\
  ```\n\n- 2. 如此处所示的输出所示，整数值 123 在类型转换为 bool（布尔）时，输出显示为 1：\n\n```\n8 :           \
  \    123\n9 :                 1\n```\n\n- 3. 接下来我们创建一个类型为 int 的 FFI\\CData 实例 $int2\
  \ 并赋值为 123。然后我们将其类型转换为 float 并再次转换回 int，如以下代码片段所示：\n\n```\n$int2 = FFI::new(\"int\"\
  );\n$int2->cdata = 123;\n$float1 = FFI::cast(FFI::type(\"float\"), $int2);\n$int3\
  \   = FFI::cast(FFI::type(\"int\"), $float1);\nprintf($patt, __LINE__, (string)\
  \ $int2->cdata);\nprintf($patt, __LINE__, (string) $float1->cdata);\nprintf($patt,\
  \ __LINE__, (string) $int3->cdata);\n```\n\n- 4. 最后三行的输出相当令人满意。我们看到原始值 123 表示为 1.7235971111195E-43。当转换回\
  \ int 时，我们的原始值得以恢复。以下是最后三行的输出：\n\n```\n15 :               123\n16 : 1.7235971111195E-43\n\
  17 :               123\n```\n\n- 5. FFI 扩展与 C 语言一样，并不允许转换所有类型。例如，在最后一块代码中，我们尝试将类型为\
  \ float 的 FFI\\CData 实例 $float2 类型转换为 char，如下所示：\n\n```\ntry {\n    $float2 = FFI::new(\"\
  float\");\n    $float2->cdata = 22/7;\n    $char1  = FFI::cast(FFI::type(\"char[20]\"\
  ),\n        $float2);\n    printf($patt, __LINE__, (string) $float2->cdata);\n \
  \   printf($patt, __LINE__, (string) $char1->cdata);\n} catch (Throwable $t) {\n\
  \    echo get_class($t) . ':' . $t->getMessage();\n}\n```\n\n- 6. 结果是灾难性的！如此处所示的输出所示，抛出\
  \ FFI\\Exception：\n\n```\nFFI\\Exception: attempt to cast to larger type\n```\n\n\
  在本节中，我们讨论了一系列 FFI 扩展方法，这些方法创建 FFI 扩展对象实例、比较值、收集信息并处理创建的 C 数据基础结构。你了解到有 FFI 扩展方法与原生\
  \ PHP 语言中的这些相同功能相对应。在下一节中，我们将回顾一个实用示例，该示例使用 FFI 扩展将 C 函数库合并到 PHP 脚本中。\n\n\n\n##\
  \ 在应用程序中使用 FFI\n\n任何共享 C 库（通常带有 *.so 扩展名）都可以使用 FFI 扩展包含在 PHP 应用程序中。如果你计划使用任何核心 PHP\
  \ 库或安装 PHP 扩展时产生的库，重要的是要注意你有能力修改 PHP 语言本身的行为。\n\n在我们研究其工作原理之前，让我们先看看如何使用 FFI 扩展将外部\
  \ C 库合并到 PHP 脚本中。\n\n## 将外部 C 库集成到 PHP 脚本中\n\n为了说明目的，我们使用一个可能源自计算机科学 101（CS101）课程的简单函数：著名的冒泡排序。该算法在初学者的计算机科学课程中被广泛使用，因为它易于理解。\n\
  \n> **重要提示**\n> **冒泡排序**是一种极其低效的排序算法，早已被更快的排序算法如 **希尔排序**、**快速排序** 或 **归并排序** 算法所取代。虽然冒泡排序算法没有权威参考资料，你可以在这里阅读对其的良好总体讨论：https://en.wikipedia.org/wiki/Bubble_sort.\n\
  \n在本小节中，我们不讨论算法的细节。相反，本小节的目的是演示如何获取现有的 C 库并将其中的一个函数合并到 PHP 脚本中。我们现在向你展示原始 C 源代码，如何将其转换为共享库，以及——最后——如何使用\
  \ FFI 将库合并到 PHP 中。我们将执行以下操作：\n\n- 1. 第一步，当然是将 C 代码编译为目标代码。以下是此示例中使用的冒泡排序 C 代码：\n\
  \n```c\n#include <stdio.h>\nvoid bubble_sort(int [], int);\nvoid bubble_sort(int\
  \ list[], int n) {\n    int c, d, t, p;\n    for (c = 0 ; c < n - 1; c++) {\n  \
  \      p = 0;\n        for (d = 0 ; d < n - c - 1; d++) {\n            if (list[d]\
  \ > list[d+1]) {\n                t = list[d];\nlist[d] = list[d+1];\nlist[d+1]\
  \ = t;\np++;\n}\n}\nif (p == 0) break;\n}\n}\n```\n\n- 2. 然后，我们使用 GNU C 编译器（包含在此课程使用的\
  \ Docker 镜像中）按如下方式将 C 代码编译为目标代码：\n\n```\ngcc -c -Wall -Werror -fpic bubble.c\n```\n\
  \n- 3. 接下来，我们将目标代码合并到共享库中。此步骤是必要的，因为 FFI 扩展只能访问共享库。我们运行以下代码来执行此操作：\n\n```\ngcc -shared\
  \ -o libbubble.so bubble.o\n```\n\n- 4. 我们现在准备定义使用新共享库的 PHP 脚本。我们首先定义一个显示 FFI\\\
  CData 数组输出的函数，如下所示：\n\n```\n// /repo/ch04/php8_ffi_using_func_from_lib.php\nfunction\
  \ show($label, $arr, $max)\n{\n    $output = $label . \"\\n\";\n    for ($x = 0;\
  \ $x < $max; $x++)\n        $output .= $arr[$x] . ',';\n    return substr($output,\
  \ 0, -1) . \"\\n\";\n}\n```\n\n- 5. 接下来是关键部分：定义 FFI 实例。我们使用 FFI::cdef() 来实现此目的并提供两个参数。第一个参数是函数签名，第二个参数是我们新创建的共享库的路径。两个参数都可以在以下代码片段中看到：\n\
  \n```\n$bubble = FFI::cdef(\n    \"void bubble_sort(int [], int);\",\n    \"./libbubble.so\"\
  );\n```\n\n- 6. 然后，我们使用 rand() 函数创建一个包含 16 个值的整数数组作为 FFI\\CData 元素，并用随机整数填充。代码如下所示：\n\
  \n```\n$max = 16;\n$arr_b = FFI::new('int[' . $max . ']');\nfor ($i = 0; $i < $max;\
  \ $i++)\n    $arr_b[$i]->cdata = rand(0,9999);\n```\n\n- 7. 最后，我们在排序前显示数组的内容，执行排序，然后显示排序后的内容。请注意，在以下代码片段中，我们使用来自\
  \ FFI 实例的 bubble_sort() 调用执行排序：\n\n```\necho show('Before Sort', $arr_b, $max);\n\
  $bubble->bubble_sort($arr_b, $max);\necho show('After Sort', $arr_b, $max);\n```\n\
  \n- 8. 输出结果不出所料，在排序前显示一组随机整数。排序后，值按顺序排列。以下是第 7 步中所示代码的输出：\n\n```\nBefore Sort\n\
  245,8405,8580,7586,9416,3524,8577,4713,\n9591,1248,798,6656,9064,9846,2803,304\n\
  After Sort\n245,304,798,1248,2803,3524,4713,6656,7586,\n8405,8577,8580,9064,9416,9591,9846\n\
  ```\n\n现在你已经了解如何使用 FFI 扩展将外部 C 库集成到 PHP 应用程序中，我们转向最后一个主题：PHP 回调。\n\n## 使用 PHP 回调\n\
  \n正如我们在本节开头提到的，可以使用 FFI 扩展来合并属于实际 PHP 语言（或其扩展）的共享 C 库。这种集成很重要，因为它允许你通过访问 PHP 共享\
  \ C 库中定义的 C 数据结构，在 C 库中读取和写入原生 PHP 数据。\n\n## 了解 PHP 回调固有的危险\n\n重要的是要理解，各种 PHP 共享库中定义的\
  \ C 函数通常被多个 PHP 函数使用。因此，如果你在 C 层覆盖其中一个低级函数，你可能会在 PHP 应用程序中遇到意外行为。\n\n另一个已知问题是覆盖原生\
  \ PHP C 函数很可能导致内存泄漏。随着时间的推移，使用此类覆盖的长期运行应用程序可能会失败，并可能导致服务器崩溃！\n\n最后一点需要考虑的是，PHP 回调功能并非在所有\
  \ FFI 平台上都受支持。因此，虽然代码可能在 Linux 服务器上运行，但在 Windows 服务器上可能无法运行（或可能无法以相同方式运行）。\n\n>\
  \ **提示**\n> 与其使用 FFI PHP 回调来覆盖原生 PHP C 库功能，不如直接定义自己的 PHP 函数可能更容易、更快、更安全！\n\n现在你已经了解使用\
  \ PHP 回调所涉及的危险，让我们来看一个示例实现。\n\n## 实现 PHP 回调\n\n在以下示例中，zend_write 内部 PHP 共享库 C 函数使用回调被覆盖，该回调在输出末尾添加换行符（LF）。请注意，此覆盖会影响依赖于它的任何原生\
  \ PHP 函数，包括 echo、print、printf：换句话说，任何产生直接输出的 PHP 函数。要实现 PHP 回调，请按照以下步骤操作：\n\n- 1.\
  \ 首先，我们使用 FFI::cdef() 定义一个 FFI 实例。第一个参数是 zend_write 的函数签名。代码如下所示：\n\n```\n// /repo/ch04/php8_php_callbacks.php\n\
  $zend = FFI::cdef(\"\ntypedef int (*zend_write_func_t) (\n    const char *str,size_t\
  \ str_length);\n    extern zend_write_func_t zend_write;\n\");\n```\n\n- 2. 然后，我们添加代码以确认，未修改时，echo\
  \ 不会在末尾添加额外的 LF。你可以在这里看到代码：\n\n```\necho \"Original echo command does not output\
  \ LF:\\n\";\necho 'A','B','C';\necho 'Next line';\n```\n\n- 3. 不出所料，输出产生 ABCNext\
  \ line。输出中没有回车或 LF，如下所示：\n\n```\nOriginal echo command does not output LF:\nABCNext\
  \ line\n```\n\n- 4. 然后，我们将 zend_write 的指针克隆到 $orig_zend_write 变量中。如果我们不这样做，我们将无法使用原始函数！代码如下所示：\n\
  \n```\n$orig_zend_write = clone $zend->zend_write;\n```\n\n- 5. 接下来，我们以匿名函数的形式生成一个\
  \ PHP 回调，以覆盖原始的 zend_write 函数。在函数中，我们调用原始的 zend_write 函数并在其输出后附加 LF，如下所示：\n\n```\n\
  $zend->zend_write = function($str, $len) {\n    global $orig_zend_write;\n    $ret\
  \ = $orig_zend_write($str, $len);\n    $orig_zend_write(\"\\n\", 1);\n    return\
  \ $ret;\n};\n```\n\n- 6. 剩余代码重新运行前一步所示的 echo 命令，如下所示：\n\n```\necho 'Revised echo\
  \ command adds LF:';\necho 'A','B','C';\n```\n\n\n\n7. 以下输出演示了 PHP echo 命令现在在每个命令末尾产生一个\
  \ LF：\n\n| 修订后的 echo 命令添加 LF： |\n|---|\n| A |\n| B |\n| C |\n\n还需要注意的是，修改 PHP 库\
  \ C 语言 zend_write 函数会影响使用此 C 语言函数的所有 PHP 原生函数。这包括 print()、printf()（及其变体）等等。\n\n\
  这结束了我们关于在 PHP 应用程序中使用 FFI 扩展的讨论。你现在知道如何从外部共享库中合并原生 C 函数。你也知道如何用 PHP 回调替换原生 PHP 核心或扩展共享库，从而有潜力改变\
  \ PHP 语言本身的行为。\n\n## Summary\n\n在本章中，你了解了 FFI、其历史以及它如何用于促进快速 PHP 扩展原型制作。你还了解到，尽管\
  \ FFI 扩展不应被用于提高速度，它也用于允许你的 PHP 应用程序直接调用来自外部 C 库的原生 C 函数。这种能力的强大之处通过一个从外部 C 库调用冒泡排序函数的示例得以证明。这种相同的能力可以扩展到涵盖数千个可用的\
  \ C 库，包括机器学习、光学字符识别、通信、加密；无穷无尽。\n\n在本章中，你对 PHP 本身在 C 语言级别的运行方式有了更深入的理解。你学习了如何创建和直接使用\
  \ C 语言数据结构，从而能够与 PHP 语言交互，甚至覆盖它。此外，你现在也有了如何将任何 C 语言库的功能直接合并到 PHP 应用程序中的想法。这一知识的进一步好处是，如果你在一家计划开发或已经开发了自己的自定义\
  \ PHP 扩展的公司找到工作，它有助于增强你的职业前景。\n\n下一章标志着本书新部分 PHP 8 Tricks 的开始。在下一部分，你将了解升级到 PHP\
  \ 8 时的向后兼容性问题。下一章专门针对与 OOP 相关的向后兼容性问题。\n"

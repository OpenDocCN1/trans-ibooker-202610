  \ | 2021-03-22 00:00:00\n158 | TRE-BEN-UC-744 | Tree Benefit Summit | 2021-03-19\
  \ 00:00:00\n160 | HOR-IND-QM-995 | Horticulture Industry Showcase | 2021-02-27 00:00:00\n\
  166 | WIN-BEN-AE-715 | Wind Power Benefit Meeting | 2021-03-12 00:00:00\n178 | HOR-PRO-QT-891\
  \ | Horticulture Promotion Seminar | 2021-03-06 00:00:00\n182 | DOG-BEN-YQ-576 |\
  \ Dog Benefit Summit | 2021-03-16 00:00:00\n188 | CAT-PRO-BM-255 | Cat Promotion\
  \ Show | 2021-02-25 00:00:00\n211 | DOG-BEN-GZ-755 | Dog Benefit Conference | 2021-03-28\
  \ 00:00:00\n```\n\n图 2.1 – 在扩展类中可接受的可变参数运算符\n\n> **提示**\n> 以下是两个 PHP 文档参考，解释了 PHP\
  \ 可变参数运算符背后的原因：\n> \n> https://wiki.php.net/rfc/variadics\n> \n> https://wiki.php.net/rfc/argument_unpacking\n\
  \n现在让我们来看一下空安全运算符。\n\n## 使用空安全运算符\n\n**nullsafe** 运算符用于对象属性引用的链中。如果链中的某个属性不存在（换句话说，被视为\
  \ NULL），则该运算符会安全地返回 NULL 值，而不会发出警告。\n\n例如，假设我们有以下 **可扩展标记语言 (XML)** 文件：\n\n```\n\
  <?xml version='1.0' standalone='yes'?>\n<produce>\n    <file>/repo/ch02/includes/produce.xml</file>\n\
  \    <dept>\n        <fruit>\n<apple>11</apple>\n<banana>22</banana>\n<cherry>33</cherry>\n\
  </fruit>\n<vegetable>\n<artichoke>11</artichoke>\n<beans>22</beans>\n<cabbage>33</cabbage>\n\
  </vegetable>\n</dept>\n</produce>\n```\n\n下面是一个扫描 XML 文档并显示数量的代码片段：\n\n```\n// /repo/ch02/php7_nullsafe_xml.php\n\
  $xml = simplexml_load_file(__DIR__ .\n    '/includes/produce.xml');\n$produce =\
  \ [\n    'fruit' => ['apple','banana','cherry','pear'],\n    'vegetable' => ['artichoke','beans','cabbage','squash']\n\
  ];\n$pattern = \"%10s : %d\\n\";\nforeach ($produce as $type => $items) {\n    echo\
  \ ucfirst($type) . \":\\n\";\n    foreach ($items as $item) {\n        $qty = getQuantity($xml,\
  \ $type, $item);\n        printf($pattern, $item, $qty);\n    }\n}\n```\n\n我们还需要定义一个\
  \ getQuantity() 函数，该函数首先检查该属性是否不为空，然后再继续到下一级，如下所示：\n\n```\nfunction getQuantity(SimpleXMLElement\
  \ $xml,\n    string $type, string $item) {\n    $qty = 0;\n    if (!empty($xml->dept))\
  \ {\n        if (!empty($xml->dept->$type)) {\n            if (!empty($xml->dept->$type->$item))\
  \ {\n                $qty = $xml->dept->$type->$item;\n            }\n        }\n\
  \    }\n    return $qty;\n}\n```\n\n随着你开始处理更深的嵌套级别，检查属性是否存在所需的函数变得越来越复杂。这正是可以采用空安全运算符的地方。\n\
  \n请看相同的程序代码，但无需 getQuantity() 函数，如下所示：\n\n```php\n// /repo/ch02/php8_nullsafe_xml.php\n\
  $xml = simplexml_load_file(__DIR__ .\n    '/includes/produce.xml');\n$produce =\
  \ [\n    'fruit' => ['apple','banana','cherry','pear'],\n    'vegetable' => ['artichoke','beans','cabbage','squash']\n\
  ];\n$pattern = \"%10s : %d\\n\";\nforeach ($produce as $type => $items) {\n    echo\
  \ ucfirst($type) . \":\\n\";\n    foreach ($items as $item) {\n        printf($pattern,\
  \ $item,\n            $xml?->dept?->$type?->$item);\n    }\n}\n```\n\n现在让我们来看一下空安全运算符的另一个用途。\n\
  \n## 使用空安全运算符来短路链\n\n空安全运算符在用于包含对象属性引用、数组元素方法调用和静态引用的连接操作链中也很实用。\n\n作为说明，这里有一个返回匿名类的配置文件。它根据文件类型定义了不同的数据提取方法：\n\
  \n```php\n// ch02/includes/nullsafe_config.php\nreturn new class() {\n    const\
  \ HEADERS = ['Name','Amt','Age','ISO','Company'];\n    const PATTERN = \"%20s |\
  \ %16s | %3s | %3s | %s\\n\";\n    public function json($fn) {\n        $json =\
  \ file_get_contents($fn);\n        return json_decode($json, TRUE);\n    }\n   \
  \ public function csv($fn) {\n        $arr = [];\n        $fh = new SplFileObject($fn,\
  \ 'r');\n        while ($node = $fh->fgetcsv()) $arr[] = $node;\n        return\
  \ $arr;\n    }\n    public function txt($fn) {\n        $arr = [];\n        $fh\
  \ = new SplFileObject($fn, 'r');\n        while ($node = $fh->fgets())\n       \
  \     $arr[] = explode(\"\\t\", $node);\n        return $arr;\n    }\n    // all\
  \ code not shown\n};\n```\n\n该类还包括一个用于显示数据的方法，如以下代码片段所示：\n\n```php\npublic function\
  \ display(array $data) {\n    $total = 0;\n    vprintf(self::PATTERN, self::HEADERS);\n\
  \    foreach ($data as $row) {\n        $total += $row[1];\n        $row[1] = number_format($row[1],\
  \ 0);\n        $row[2] = (string) $row[2];\n        vprintf(self::PATTERN, $row);\n\
  \    }\n}\necho 'Combined Wealth: '\n    . number_format($total, 0) . \"\\n\";\n\
  }\n```\n\n在调用程序中，为了安全地执行 display() 方法，我们需要在执行回调之前添加 is_object() 额外安全检查以及 method_exists()，如下代码片段所示：\n\
  \n```\n// /repo/ch02/php7_nullsafe_short.php\n$config = include __DIR__ .\n    '/includes/nullsafe_config.php';\n\
  $allowed = ['csv' => 'csv','json' => 'json','txt'\n    => 'txt'];\n$format  = $_GET['format']\
  \ ?? 'txt';\n$ext     = $allowed[$format] ?? 'txt';\n$fn      = __DIR__ . '/includes/nullsafe_data.'\
  \ . $ext;\nif (file_exists($fn)) {\n    if (is_object($config)) {\n        if (method_exists($config,\
  \ 'display')) {\n            if (method_exists($config, $ext)) {\n             \
  \   $config->display($config->$ext($fn));\n            }\n        }\n    }\n}\n\
  ```\n\n与前一个示例一样，可以使用空安全运算符来确认 $config 是否为对象。只需在第一个对象引用中使用空安全运算符，如果对象或方法不存在，运算符就会短路整个链并返回\
  \ NULL。\n\n以下是使用 PHP 8 空安全运算符重写的代码：\n\n```\n// /repo/ch02/php8_nullsafe_short.php\n\
  $config = include __DIR__ .\n    '/includes/nullsafe_config.php';\n$allowed = ['csv'\
  \ => 'csv','json' => 'json',\n    'txt' => 'txt'];\n$format = $_GET['format'] ??\
  \ $argv[1] ?? 'txt';\n$ext = $allowed[$format] ?? 'txt';\n$fn = __DIR__ . '/includes/nullsafe_data.'\
  \ . $ext;\nif (file_exists($fn)) {\n    $config?->display($config->$ext($fn));\n\
  }\n```\n\n如果 $config 返回为 NULL，整个操作链将被取消，不会生成任何警告或通知，并且返回值（如果有）为 NULL。净结果是我们节省了编写三个额外的\
  \ if () 语句！\n\n**提示**\n有关使用此运算符时的其他注意事项的更多信息，请在此查看：https://wiki.php.net/rfc/nullsafe_operator.\n\
  \n**重要说明**\n为了将格式参数传递给示例代码文件，您需要按如下方式从浏览器运行代码：http://localhost:8888/ch02/php7_nullsafe_short.php?format=json.\n\
  \n接下来，我们来看一下连接运算符的更改。\n\n## 连接运算符已被降级\n\n尽管 **连接** 运算符的确切用法（例如，句点 (.)）在 PHP 8 中没有改变，但在其在\
  \ **运算符优先级** 中的相对位置上做出了一个极其重要的更改。在 PHP 的早期版本中，连接运算符在优先级方面被认为与较低阶的算术运算符加号 (+) 和减号\
  \ (-) 相等。接下来，让我们来看一下传统运算符优先级的一个潜在问题：违反直觉的结果。\n\n\n\n## 处理违反直觉的结果\n\n不幸的是，这种安排会产生意外的结果。以下代码片段在使用\
  \ PHP 7 执行时呈现出违反直觉的输出：\n\n```\n// /repo/ch02/php7_ops_concat_1.php\n$a = 11;\n$b\
  \ = 22;\necho \"Sum: \" . $a + $b;\n```\n\n仅从代码来看，你会期望输出类似 \"Sum:33\" 的内容。事实并非如此！请查看在\
  \ PHP 7.1 上运行时的以下输出：\n\n```\nroot@php8_tips_php7 [ /repo/ch02 ]# php php7_ops_concat_1.php\n\
  PHP Warning:  A non-numeric value encountered in /repo/ch02/php7_ops_concat_1.php\
  \ on line 5\nPHP Stack trace:\nPHP  1. {main}() /repo/ch02/php7_ops_concat_1.php:0\n\
  Warning: A non-numeric value encountered in /repo/ch02/php7_ops_concat_1.php on\
  \ line 5\nCall Stack:\n  0.0001    345896    1. {main}()\n22\n```\n\n此时，你可能在想，代码从不说谎，11\
  \ + 22 的和怎么会变成 22，就像我们在前面的输出（最后一行）中看到的那样？\n\n答案涉及运算符优先级：从 PHP 7 开始，它始终是从左到右。因此，如果我们使用括号使运算顺序更清晰，实际发生的情况如下：\n\
  \n```\necho (\"Sum: \" . $a) + $b;\n```\n\n11 被连接到 \"Sum: \"，结果得到字符串 \"Sum: 11\"\
  。该字符串随后被类型转换为空整数，导致 0 + 22 的表达式，从而得到我们的结果。\n\n如果你在 PHP 8 中运行相同的代码，请注意这里的差异：\n\n\
  ```\nroot@php8_tips_php8 [ /repo/ch02 ]# php php8_ops_concat_1.php\nSum: 33\n```\n\
  \n如你所见，算术运算符优先于连接运算符。使用括号，这就是 PHP 8 中代码的有效处理方式：\n\n```\necho \"Sum: \" . ($a + $b);\n\
  ```\n\n> Tip\n> **最佳实践：** 使用括号以避免依赖运算符优先级而产生的复杂问题。有关降低连接运算符优先级的理由的更多信息，请查看此处：\n\
  > https://wiki.php.net/rfc/concatenation_precedence.\n\n我们现在将注意力转向三元运算符。\n\n## 使用嵌套三元运算符\n\
  \n**三元运算符** 对 PHP 语言来说并不新鲜。\n\n然而，它们在 PHP 8 中的解释方式存在一个主要差异。\n\n这一变化与该运算符传统的 **左结合行为**\
  \ 有关。\n\n为了说明，让我们看一个简单的例子，如下所示：\n\n- 1. 在此示例中，假设我们使用 RecursiveDirectoryIterator\
  \ 类结合 RecursiveIteratorIterator 类来扫描目录结构。起始代码可能如下所示：\n- 2. 然后我们定义一个函数，该函数匹配包含 $searchPath\
  \ 搜索路径并以 $searchExt 扩展名结尾的文件，如下所示：\n\n```\n// /repo/ch02/php7_nested_ternary.php\n\
  $path = realpath(__DIR__ . '../');\n$searchPath = '/ch';\n$searchExt = 'php';\n\
  $dirIter = new RecursiveDirectoryIterator($path);\n$itIter = new RecursiveIteratorIterator($dirIter);\n\
  ```\n\n```\nfunction find_using_if($iter, $searchPath, $searchExt) {\n    $matching\
  \ = [];\n    $non_match = [];\n    $discard = [];\n    foreach ($iter as $name =>\
  \ $obj) {\n        if (!$obj->isFile()) {\n            $discard[] = $name;\n   \
  \     } elseif (!strpos($name, $searchPath)) {\n            $discard[] = $name;\n\
  \        } elseif ($obj->getExtension() != $searchExt) {\n            $non_match[]\
  \ = $name;\n        } else {\n            $matching[] = $name;\n        }\n    }\n\
  \    show($matching, $non_match);\n}\n```\n\n- 3. 然而，与其使用 if / elseif / else，一些开发者可能会倾向于使用嵌套三元运算符重构此函数。以下是前一步中使用的相同代码可能的样子：\n\
  \n```php\nfunction find_using_tern($iter, $searchPath,\n    $searchExt) {\n    $matching\
  \ = [];\n    $non_match = [];\n    $discard = [];\n    foreach ($iter as $name =>\
  \ $obj) {\n        $match = !$obj->isFile()\n            ? $discard[] = $name\n\
  \            : !strpos($name, $searchPath)\n                ? $discard[] = $name\n\
  \                : $obj->getExtension() != $searchExt\n                    ? $non_match[]\
  \ = $name\n                    : $matching[] = $name;\n    }\n    show($matching,\
  \ $non_match);\n}\n```\n\n两个函数的输出在 PHP 7 中产生相同的结果，如以下屏幕截图所示：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_77_0.png)\n\
  \n图 2.2 – 使用 PHP 7 的嵌套三元输出\n\n在 PHP 8 中，不使用括号的嵌套三元运算不再被允许。以下是运行相同代码块时的输出：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_77_1.png)\n\
  \n图 2.3 – 使用 PHP 8 的嵌套三元输出\n\n> Tip\n> \n> **最佳实践：** 使用括号以避免嵌套三元运算出现问题。\n> 有关三元运算符嵌套差异的更多信息，请查看本文：\
  \ https://wiki.php.net/rfc/ternary_associativity.\n\n你现在已经对新的空安全运算符有了概念。你还了解了三个现有运算符——可变参数、连接和三元运算符——其功能已略有修改。你现在处于一个良好的位置，可以在升级到\
  \ PHP 8 时避免潜在的危害。让我们现在来看另一个新特性，箭头函数。\n\n## 使用箭头函数\n\n箭头函数实际上最早是在 PHP 7.4 中引入的。然而，由于许多开发者并不关注每一个发布更新，在本书中包含对这一优秀新特性的介绍是很重要的。\n\
  \n在本节中，你将了解箭头函数的语法，以及与匿名函数相比的优缺点。\n\n### 通用语法\n\n简单来说，箭头函数是传统匿名函数的简写语法，就像三元运算符是\
  \ if () {} else {} 的简写语法一样。箭头函数的通用语法如下所示：\n\n```\nfn(<ARGS>) => <EXPRESSION>\n```\n\
  \n<ARGS> 是可选的，并且包含在任何其他用户定义 PHP 函数中看到的任何内容。<EXPRESSION> 可以包含任何标准 PHP 表达式，例如函数调用、算术运算等。\n\
  \n现在让我们看看箭头函数和匿名函数之间的差异。\n\n### 箭头函数与匿名函数\n\n在本小节中，你将了解箭头函数和匿名函数之间的差异。为了成为一名高效的\
  \ PHP 8 开发者，了解箭头函数何时以及在何处可以替代匿名函数并提高代码性能是很重要的。\n\n在深入了解箭头函数之前，让我们先看一个简单的匿名函数。在以下示例中，分配给\
  \ $addOld 的匿名函数产生两个参数的和：\n\n```php\n// /repo/ch02/php8_arrow_func_1.php\n$addOld\
  \ = function ($a, $b) { return $a + $b; };\n```\n\n在 PHP 8 中，你可以产生完全相同的结果，如下所示：\n\
  \n```\n$addNew = fn($a, $b) => $a + $b;\n```\n\n尽管代码更易读，但这一新特性有优缺点，总结如下表所示：\n\n\
  |  | 匿名函数 | 箭头函数 |\n|---|---|---|\n| 代码更少 | 否 | 是 |\n| 继承变量 | 需要 use() | 是 |\n|\
  \ 可以嵌套 | 是 | 是 |\n| $this 自动绑定 | 是 | 是 |\n| $$ 间接支持 | 是 | 否 |\n| 多行代码 | 是 | 否 |\n\
  \n表 2.1 – 匿名函数与箭头函数\n\n从上表可以看出，箭头函数比匿名函数更高效。然而，由于缺乏间接支持和多行代码支持，有时你仍需要使用匿名函数。\n\n\
  ### 变量继承\n\n匿名函数与任何标准 PHP 函数类似，只有在将值作为参数传递、使用 global 关键字或添加 use() 修饰符时，才会识别其作用域外的变量。\n\
  \n以下是 DateTime 实例通过 use() 继承到匿名函数中的示例：\n\n```php\n// /repo/ch02/php8_arrow_func_2.php\n\
  // not all code shown\n\n$old = function ($today) use ($format) {\n    return $today->format($format);\n\
  };\n```\n\n以下是使用箭头函数实现完全相同功能的方式：\n\n```php\n$new = fn($today) => $today->format($format);\n\
  ```\n\n如你所见，语法极其简洁易读。现在让我们检查一个包含箭头函数的实际示例。\n\n\n\n## 实践示例：使用箭头函数\n\n回到生成难以阅读的 CAPTCHA\
  \ 的想法（首次在第 1 章《介绍新的 PHP 8 OOP 特性》中提出），让我们看看如何通过引入箭头函数来提高效率并减少所需的代码量。我们现在将检查一个生成基于文本的\
  \ CAPTCHA 的脚本，如下所示：\n\n- 1. 首先，我们定义一个函数，该函数生成一个由随机选择的字母、数字和特殊字符组成的字符串。请注意在以下代码片段中新的\
  \ PHP 8 match 表达式与箭头函数（已突出显示）的使用：\n\n```php\n// /repo/ch02/php8_arrow_func_3.php\n\
  function genKey(int $size) {\n    $alpha1  = range('A','Z');\n    $alpha2  = range('a','z');\n\
  \    $special = '!@#$%^&*()_+./[]{}|=-';\n    $len     = strlen($special) - 1;\n\
  \    $numeric = range(0, 9);\n    $text    = '';\n    for ($x = 0; $x < $size; $x++)\
  \ {\n        $algo = rand(1,4);\n        $func = match ($algo) {\n            1\
  \ => fn() => $alpha1[array_rand($alpha1)],\n            2 => fn() => $alpha2[array_rand($alpha2)],\n\
  \            3 => fn() => $special[rand(0,$len)],\n            4 => fn() =>\n  \
  \              $numeric[array_rand($numeric)],\n            default => fn() => ''\n\
  \        };\n        $text .= $func();\n    }\n    return $text;\n}\n```\n\n- 2.\
  \ 然后我们定义一个 textCaptcha() 函数来生成文本 CAPTCHA。我们首先定义两个表示算法和颜色的数组。然后将它们 *打乱* 以进一步随机化。我们还定义\
  \ **超文本标记语言 (HTML)** <span> 元素以生成大字符和小字符，如以下代码片段所示：\n\n```php\nfunction textCaptcha(string\
  \ $text) {\n    $algos = ['upper','lower','bold',\n        'italics','large','small'];\n\
  \    $color = ['#EAA8A8','#B0F6B0','#F5F596',\n        '#E5E5E5','white','white'];\n\
  \    $lgSpan = '<span style=\"font-size:32pt;\">';\n    $smSpan = '<span style=\"\
  font-size:8pt;\">';\n    shuffle($algos);\n    shuffle($color);\n```\n\n- 3. 接下来，我们定义一系列\
  \ InfiniteIterator 实例。这是一个有用的 **标准 PHP 库 (SPL)** 类，它允许你在迭代结束时无需检查即可继续调用 next()。这个迭代器类所做的是自动将指针移回数组顶部，从而允许你无限迭代。代码可在以下片段中看到：\n\
  \n```php\n$bkgTmp = new ArrayIterator($color);\n$bkgIter = new InfiniteIterator($bkgTmp);\n\
  $algoTmp = new ArrayIterator($algos);\n$algoIter = new InfiniteIterator($algoTmp);\n\
  $len = strlen($text);\n```\n\n- 4. 然后我们一次构建一个字符的文本 CAPTCHA，应用适当的算法和背景颜色，如下所示：\n\n\
  ```php\n$captcha = '';\nfor ($x = 0; $x < $len; $x++) {\n    $char = $text[$x];\n\
  \    $bkg = $bkgIter->current();\n    $algo = $algoIter->current();\n    $func =\
  \ match ($algo) {\n        'upper' => fn() => strtoupper($char),\n        'lower'\
  \ => fn() => strtolower($char),\n```\n\n```php\n'bold' => fn() => \"<b>$char</b>\"\
  ,\n'italics' => fn() => \"<i>$char</i>\",\n'large' => fn() => $lgSpan\n. $char .\
  \ '</span>',\n'small' => fn() => $smSpan\n. $char . '</span>',\ndefault => fn()\
  \ => $char\n};\n$captcha .= '<span style=\"background-color:'\n. $bkg . ';\">'\n\
  . $func() . '</span>';\n$algoIter->next();\n$bkgIter->next();\n}\nreturn $captcha;\n\
  }\n```\n\n再次注意，使用 match 和箭头函数的混合来实现所需的结果。\n\n脚本的其余部分只是简单地调用这两个函数，如下所示：\n\n```php\n\
  $text = genKey(8);\necho \"Original: $text<br />\\n\";\necho 'Captcha : ' . textCaptcha($text)\
  \ . \"\\n\";\n```\n\n这是从浏览器查看 /repo/ch02/php8_arrow_func_3.php 的输出可能的样子：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_82_0.png)\n\
  \n图 2.4 - 来自 php8_arrow_func_3.php 的输出\n\n> **提示**\n> 有关箭头函数的更多背景信息，请在此查看：\n> `https://wiki.php.net/rfc/arrow_functions_v2.`\n\
  > 有关 InfiniteIterator 的信息，请在此查看 PHP 文档：\n> `https://www.php.net/InfiniteIterator.`\n\
  \n现在让我们看看 *统一变量语法*。\n\n## 理解统一变量语法\n\nPHP 7.0 中引入的最激进的举措之一是规范化 PHP 语法的努力。早期版本 PHP\
  \ 的问题在于，在某些情况下操作是从左到右解析的，而在其他情况下则是从右到左解析的。这种不一致是许多编程漏洞和困难的根本原因。因此，PHP 核心开发团队启动了名为\
  \ **统一变量语法** 的举措。但首先，让我们定义构成统一变量语法举措的关键点。\n\n## 定义统一变量语法\n\n统一变量语法既不是协议也不是正式的语言构造。相反，它是一项指导原则，力求确保所有操作以统一且一致的方式执行。\n\
  \n以下是对该举措的一些关键点：\n\n- 变量的顺序和引用的统一性\n- 函数调用的统一性\n- 解决数组解引用问题\n- 提供在单个命令中混合函数调用和数组解引用的能力\n\
  \n> **提示**\n> 有关 PHP 7 统一变量语法原始提案的更多信息，请在此查看：`https://wiki.php.net/rfc/uniform_variable_syntax.`\n\
  \n现在让我们检查统一变量语法举措如何影响 PHP 8。\n\n## 统一变量语法如何影响 PHP 8？\n\n统一变量语法举措在所有 PHP 7 版本中都非常成功，过渡相对顺利。然而，有几个区域尚未升级到此标准。因此，引入了一项新提案来解决这些遗留问题。PHP\
  \ 8 中已对以下内容引入了统一性：\n\n- 解引用插值字符串\n- 魔术常量的不一致解引用\n- 类常量解引用的一致性\n- new 和 instanceof\
  \ 的增强表达式支持\n\n在进入这些领域的每个示例之前，我们必须首先定义 *解引用* 的含义。\n\n## 定义解引用\n\n**解引用** 是提取数组元素或对象属性值的过程。它还指获取对象方法或函数调用的返回值的过程。以下是一个简单示例：\n\
  \n```php\n// /repo/ch02/php7_dereference_1.php\n$alpha = range('A','Z');\necho $alpha[15]\
  \ . $alpha[7] . $alpha[15];\n// output: PHP\n```\n\n$alpha 数组包含 26 个元素，表示字母 A 到\
  \ Z。此示例对数组进行解引用，提取第 7 和第 15 个元素，输出为 PHP。对函数或方法调用进行解引用只是意味着执行函数或方法并访问结果。\n\n## 解引用插值字符串\n\
  \n下一个示例有点疯狂，请仔细跟随。以下示例在 PHP 8 中有效，但在 PHP 7 或更早版本中无效：\n\n```php\n// /repo/ch02/php8_dereference_2.php\n\
  $alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';\n$num = '0123456789';\n$test = [15, 7, 15,\
  \ 34];\nforeach ($test as $pos)\n    echo \"$alpha$num\"[$pos];\n```\n\n在此示例中，两个字符串\
  \ $alpha 和 $num 在 foreach() 循环中使用双引号进行插值。以下是 PHP 7 的输出：\n\n```\nroot@php8_tips_php7\
  \ [ /repo/ch02 ]# php php7_dereference_2.php\nPHP Parse error: syntax error, unexpected\
  \ '[', expecting ',' or ';' in /repo/ch02/php7_dereference_2.php on line 7\nParse\
  \ error: syntax error, unexpected '[', expecting ',' or ';' in /repo/ch02/php7_dereference_2.php\
  \ on line 7\n```\n\n同样的代码在 PHP 8 中产生以下输出：\n\n```\nroot@php8_tips_php8 [ /repo/ch02\
  \ ]# php php8_dereference_2.php\nPHP8\n```\n\n结论是 PHP 7 在解引用插值字符串的方式上不一致，而 PHP 8\
  \ 展示了改进的一致性。\n\n## 魔术常量的不一致解引用\n\n在 PHP 7 及更早版本中，常量可以被解引用而魔术常量不能。以下是一个简单示例，可生成当前文件的最后三个字母：\n\
  \n```php\n// /repo/ch02/php8_dereference_3.php\ndefine('FILENAME', __FILE__);\n\
  echo FILENAME[-3] . FILENAME[-2] . FILENAME[-1];\necho __FILE__[-3] . __FILE__[-2]\
  \ . __FILE__[-1];\n```\n\n这里是 PHP 7 中的结果：\n\n```\nroot@php8_tips_php7 [ /repo/ch02\
  \ ]# php php7_dereference_3.php\nPHP Parse error: syntax error, unexpected '[',\
  \ expecting ',' or ';' or ';' in /repo/ch02/php7_dereference_3.php on line 7\nParse\
  \ error: syntax error, unexpected '[', expecting ',' or ';' in /repo/ch02/php7_dereference_3.php\
  \ on line 7\n```\n\n而这里是 PHP 8 中的结果：\n\n```\nroot@php8_tips_php8 [ /repo/ch02 ]#\
  \ php php8_dereference_3.php\nphpphp\n```\n\n再次强调，这里要说明的是，PHP 8 中的解引用操作被一致地应用（这是一件好事！）。\n\
  \n## 类常量解引用的一致性\n\n在尝试解引用类常量时会出现一个相关问题。为了最好地说明这个问题，假设我们有三个类。第一个类 JsonResponse 以\
  \ JavaScript 对象表示法（JSON）格式生成数据，如以下代码片段所示：\n\n```\nclass JsonResponse {\n    public\
  \ static function render($data) {\n        return json_encode($data, JSON_PRETTY_PRINT);\n\
  \    }\n}\n```\n\n第二个类 SerialResponse 使用内置的 PHP serialize() 函数生成响应，如以下代码片段所示：\n\n\
  ```\nclass SerialResponse {\n    public static function render($data) {\n      \
  \  return serialize($data);\n    }\n}\n```\n\n最后，一个 Test 类能够生成任一响应，如以下代码片段所示：\n\n\
  ```\nclass Test {\n    const JSON = ['JsonResponse'];\n    const TEXT = 'SerialResponse';\n\
  \    public static function getJson($data) {\n        echo self::JSON[0]::render($data);\n\
  \    }\n    public static function getText($data) {\n        echo self::TEXT::render($data);\n\
  \    }\n}\n```\n\n正如本节前面示例中所见，早期 PHP 版本中的结果是不一致的。调用 Test::getJson($data) 工作正常。然而，调用\
  \ Test::getText($data) 会产生以下错误：\n\n```\nroot@php8_tips_php7 [ /repo/ch02 ]# php\
  \ php7_dereference_4.php\nPHP Parse error: syntax error, unexpected '::' (T_PAAMAYIM_NEKUDOTAYIM),\
  \ expecting ',' or ';' in /repo/ch02/php7_dereference_4.php on line 26\nParse error:\
  \ syntax error, unexpected '::' (T_PAAMAYIM_NEKUDOTAYIM), expecting ',' or ';' in\
  \ /repo/ch02/php7_dereference_4.php on line 26\n```\n\n在 PHP 8 下完全相同的代码对前面所示类中定义的两种方法调用都产生一致的结果，如下所示：\n\
  \n```\nroot@php8_tips_php8 [ /repo/ch02 ]# php php8_dereference_4.php\n{\n    \"\
  A\": 111,\n    \"B\": 222,\n    \"C\": 333}\na:3:{s:1:\"A\";i:111;s:1:\"B\";i:222;s:1:\"\
  C\";i:333;}\n```\n\n总结一下，在 PHP 8 中，类常量现在以统一的方式进行解引用，使你能够生成更简洁的代码。现在，让我们看看 PHP 8\
  \ 如何允许你在比以前更多的地方使用表达式。\n\n## new 和 instanceof 的增强表达式支持\n\nPHP 7 编程带来的乐趣之一是可以几乎在任何地方使用任意\
  \ PHP 表达式。在这个简单示例中，请注意在引用 $nav 数组的方括号内使用 $_GET['page'] ?? 'home' 任意表达式：\n\n```\n\
  // /repo/ch02/php7_arbitrary_exp.php\n$nav = [\n    'home'     => 'home.html',\n\
  \    'about'    => 'about.html',\n    'services' => 'services/index.html',\n   \
  \ 'support'  => 'support/index.html',\n];\n$html = __DIR__ . '/../includes/'\n \
  \   . $nav[$_GET['page'] ?? 'home'];\n```\n\n然而，在 PHP 7 及更早版本中，如果表达式涉及 new 或 instanceof\
  \ 关键字，则无法做到这一点。正如你可能猜到的那样，这一不一致性已在 PHP 8 中得到解决。现在可以实现以下操作：\n\n```\n// /repo/ch02/php8_arbitrary_exp_new.php\n\
  // definition of the JsonResponse and SerialResponse\n// classes are shown above\n\
  $allowed = [\n    'json' => 'JsonResponse',\n    'text' => 'SerialResponse'\n];\n\
  $data = ['A' => 111, 'B' => 222, 'C' => 333];\necho (new $allowed[$_GET['type']\
  \ ?? 'json'])\n    ->render($data);\n```\n\n此代码示例展示了在与 new 关键字结合使用时，在数组引用内部使用任意表达式。\n\
  \n> **提示**\n> \n> 有关 PHP 8 中统一变量语法更新的更多信息，请参阅本文：https://wiki.php.net/rfc/variable_syntax_tweaks.\n\
  \n现在让我们看看 PHP 8 中可用于字符串和数组处理的新的技术。\n\n## 学习新的数组和字符串处理技术\n\nPHP 8 的数组和字符串处理技术有了许多改进。虽然本书篇幅不足以涵盖每一个增强功能，但我们将在本节中检查更重要的改进。\n\
  \n## 使用 array_splice()\n\narray_splice() 函数介于 substr() 和 str_replace() 之间：它允许你用另一个数组替换一个数组的子集。其使用却变得不方便，当你只需要用不同的内容替换数组的最后一部分时。快速查看语法即可发现不便之处——替换参数前面是长度参数，如下所示：\n\
  \n```\narray_splice(&$input, $offset [, $length [, $replacement]]) : array\n```\n\
  \n传统上，开发人员首先对原始数组运行 count() 并将其用于长度参数，如下所示：\n\n```\narray_splice($arr, 3, count($arr),\
  \ $repl);\n```\n\n在 PHP 8 中，第三个参数可以为 NULL，从而节省一次对 count() 的额外调用。如果你利用 PHP 8 的命名参数功能，代码会变得更加简洁。以下是为\
  \ PHP 8 编写的相同代码片段：\n\n```\narray_splice($arr, 3, replacement: $repl);\n```\n\n下面是另一个清楚地展示\
  \ PHP 7 和 PHP 8 之间差异的示例：\n\n```\n// /repo/ch02/php7_array_splice.php\n$arr = ['Person',\
  \ 'Camera', 'TV', 'Woman', 'Man'];\n$repl = ['Female', 'Male'];\n$tmp = $arr;\n\
  $out = array_splice($arr, 3, count($arr), $repl);\nvar_dump($arr);\n$arr = $tmp;\n\
  $out = array_splice($arr, 3, NULL, $repl);\nvar_dump($arr);\n```\n\n如果你在 PHP 7 中运行代码，请注意最后一个\
  \ var_dump() 实例的结果，如下所示：\n\n```\nrepo/ch02/php7_array_splice.php:11:\narray(7) {\n\
  \  [0] => string(6) \"Person\"\n  [1] => string(6) \"Camera\"\n  [2] => string(2)\
  \ \"TV\"\n  [3] => string(6) \"Female\"\n  [4] => string(4) \"Male\"\n  [5] => string(5)\
  \ \"Woman\"\n  [6] => string(3) \"Man\"\n}\n```\n\n在 PHP 7 中，为 array_splice() 的第三个参数提供\
  \ NULL 值会导致两个数组简单合并，这不是期望的结果！\n\n现在，请在此查看最后一个 var_dump() 的输出，但这次是在 PHP 8 下运行：\n\n\
  ```\nroot@php8_tips_php8 [/repo/ch02 ]# php php8_array_splice.php\n// some output\
  \ omitted\narray(5) {\n  [0]=> string(6) \"Person\"\n  [1]=> string(6) \"Camera\"\
  \n  [2]=> string(2) \"TV\"\n  [3]=> string(6) \"Female\"\n  [4]=> string(4) \"Male\"\
  \n}\n```\n\n正如你所见，在 PHP 8 下运行，将第三个参数设为 NULL 与为 array_splice() 的第三个参数提供数组 count()\
  \ 具有相同的功能。你还会注意到，在 PHP 8 中数组元素的总数为 5，而在 PHP 7 中运行相同代码时总数为 7。\n\n## 使用 array_slice()\n\
  \narray_slice() 函数对数组的操作与 substr() 对字符串的操作一样。早期 PHP 版本的一个大问题是，内部 PHP 引擎会顺序遍历整个数组，直到达到所需的偏移量。如果偏移量很大，性能会随着数组大小的增加而直接下降。\n\
  \n在 PHP 8 中，使用了一种不需要顺序数组迭代的不同算法。随着数组大小的增加，性能改进变得越来越明显。\n\n- 在此所示示例中，我们首先构建一个约有 600\
  \ 万条目的庞大数组：\n\n```\n// /repo/ch02/php8_array_slice.php\nini_set('memory_limit',\
  \ '1G');\n$start = microtime(TRUE);\n$arr   = [];\n$alpha = range('A', 'Z');\n$beta\
  \  = $alpha;\n$loops = 10000;      // size of outer array\n$iters = 500;       \
  \ // total iterations\n$drip  = 10;         // output every $drip times\n$cols \
  \ = 4;\nfor ($x = 0; $x < $loops; $x++)\n    foreach ($alpha as $left)\n       \
  \ foreach ($beta as $right)\n            $arr[] = $left . $right . rand(111,999);\n\
  ```\n\n- 接下来，我们遍历数组，取随机偏移量均大于 999,999。这迫使 array_slice() 努力工作，并显示出 PHP 7 和 8 之间显著的性能差异，如以下代码片段所示：\n\
  \n```\n$max = count($arr);\nfor ($x = 0; $x < $iters; $x++ ) {\n    $offset = rand(999999,\
  \ $max);\n    $slice  = array_slice($arr, $offset, 4);\n    // not all display logic\
  \ is shown\n}\n$time = (microtime(TRUE) - $start);\necho \"\\nElapsed Time: $time\
  \ seconds\\n\";\n```\n\n\n\n在 PHP 7 下运行代码时的输出如下：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_92_0.png)\n\
  \n图 2.5 – 使用 PHP 7 的 array_slice() 示例\n\n请注意，在 PHP 8 下运行相同代码时性能差异巨大：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_92_1.png)\n\
  \n图 2.6 – 使用 PHP 8 的 array_slice() 示例\n\n> **重要说明**\n> \n> 新算法仅在数组不包含 NULL 值元素时才有效。如果数组包含\
  \ NULL 元素，则会触发旧算法，并进行顺序迭代。\n\n现在让我们把注意力转向一些优秀的新字符串函数。\n\n## 检测字符串的开头、中间和结尾\n\nPHP\
  \ 开发者经常需要处理的问题是检查出现在字符串开头、中间或结尾的字符集。当前字符串函数集的问题在于它们*并非设计*用于处理子字符串的存在或缺失。相反，当前函数集的设计目的是确定子字符串的*位置*。随后，这些位置可以以布尔方式进行解释，以确定子字符串是否存在。\n\
  \n这种方法的问题可以用一句归于温斯顿·丘吉尔爵士的名言来概括：\n\n> \"高尔夫是一项旨在用专门为此目的设计得极不合适的武器，将一个很小的球打入一个更小的洞的游戏。\"\
  \n> \n> – 温斯顿·S·丘吉尔\n\n现在让我们来看一下解决此问题的三个非常有用的新字符串函数。\n\n### str_starts_with()\n\n\
  我们检查的第一个函数是 `str_starts_with()`。为了说明其用法，请考虑以下代码示例，其中我们在开头查找 `https`，在结尾查找 `login`，如下代码片段所示：\n\
  \n// /repo/ch02/php7_starts_ends_with.php\n$start = 'https';\nif (substr($url, 0,\
  \ strlen($start)) !== $start)\n    $msg .= \"URL does not start with $start\\n\"\
  ;\n// not all code is shown\n\n正如本节介绍中所提到的，为了确定字符串是否以 `https` 开头，我们需要同时调用 `substr()`\
  \ 和 `strlen()`。这两个函数都不是为给出我们期望的答案而设计的。此外，必须同时使用这两个函数会在代码中引入低效，并导致不必要的资源利用增加。\n\n\
  相同的代码可以用 PHP 8 如下编写：\n\n// /repo/ch02/php8_starts_ends_with.php\n$start = 'https';\n\
  if (!str_starts_with($url, $start))\n    $msg .= \"URL does not start with $start\\\
  n\";\n// not all code is shown\n\n### str_ends_with()\n\n与 `str_starts_with()` 类似，PHP\
  \ 8 引入了一个新函数 `str_ends_with()`，可用于确定字符串的结尾是否与某个值匹配。为了说明此新函数的用途，请考虑使用 `strrev()`\
  \ 和 `strpos()` 的旧 PHP 代码，可能如下所示：\n\n```\n$end = 'login';\nif (strpos(strrev($url),\
  \ strrev($end)) !== 0)\n    $msg .= \"URL does not end with $end\\n\";\n```\n\n\
  在一次操作中，`$url` 和 `$end` 都需要被反转，这一过程的成本会随着字符串长度的增加而成比例地变得更加昂贵。此外，正如前面提到的，`strpos()`\
  \ 的目的是返回子字符串的*位置*，而不是确定其是否存在。\n\n在 PHP 8 中，相同的功能可以如下实现：\n\n```\nif (!str_ends_with($url,\
  \ $end))\n    $msg .= \"URL does not end with $end\\n\";\n```\n\n### str_contains()\n\
  \n在此上下文中，最后一个函数是 `str_contains()`。正如我们所讨论的，在 PHP 7 及更早版本中，除了 `preg_match()` 之外，没有特定的\
  \ PHP 函数可以告诉你子字符串是否存在于字符串中。\n\n使用 `preg_match()` 的问题，正如我们一再被警告的那样，是性能下降。为了处理*正则表达式*，`preg_match()`\
  \ 首先需要分析模式。然后它必须进行第二次遍历，以确定字符串的哪一部分与模式匹配。这就时间和资源利用而言是一项极其昂贵的操作。\n\n> **重要说明**\n\
  > \n> 当我们提到某项操作在时间和资源方面*昂贵*时，请记住，如果你的脚本只有几十行代码和/或你没有在循环中重复该操作数千次，那么使用本节描述的新函数和技术可能不会看到显著的性能提升。\n\
  \n在以下示例中，一个 PHP 脚本使用 preg_match() 搜索 GeoNames 项目中人口超过 15,000 的城市数据库，以查找任何包含伦敦引用的条目：\n\
  \n// /repo/ch02/php7_str_contains.php\n$start  = microtime(TRUE);\n$target  = '/\
  \ London /i';\n$data_src = __DIR__ . '/../sample_data/cities15000_min.txt';\n$fileObj\
  \  = new SplFileObject($data_src, 'r');\nwhile ($line = $fileObj->fgetcsv(\"\\t\"\
  )) {\n    $tz   = $line[17] ?? '';\n    if ($tz) unset($line[17]);\n    $str   =\
  \ implode(' ', $line);\n    $city  = $line[1] ?? 'Unknown';\n    $local1 = $line[10]\
  \ ?? 'Unknown';\n    $iso   = $line[8] ?? '??';\n    if (preg_match($target, $str))\n\
  \        printf(\"%25s : %12s : %4s\\n\", $city, $local1,\n            $iso);\n\
  }\necho \"Elapsed Time: \" . (microtime(TRUE) - $start) . \"\\n\";\n\n在 PHP 7 中运行时的输出如下：\n\
  \n![](img/dbf2674d5b31107c344104b5edcb21c5_95_0.png)\n\n图 2.7 – 使用 preg_match()\
  \ 扫描 GeoNames 文件\n\n在 PHP 8 中，通过将 if 语句替换为以下代码可以实现相同的输出：\n\n// /repo/ch02/php8_str_contains.php\n\
  // not all code is shown\n    if (str_contains($str, $target))\n        printf(\"\
  %25s : %12s : %4s\\n\", $city, $local1,\n            $iso);\n\nPHP 8 的输出如下：\n\n\
  ![](img/dbf2674d5b31107c344104b5edcb21c5_96_0.png)\n\n图 2.8 – 使用 str_contains()\
  \ 扫描 GeoNames 文件\n\n正如你从两个不同的输出屏幕中看到的，PHP 8 代码运行大约需要 0.14 微秒，而 PHP 7 中为 0.19 微秒。单独来看这并不是巨大的性能提升，但正如本节前面提到的，更多数据、更长的字符串和更多的迭代会放大你获得的任何微小性能提升。\n\
  \n> 提示\n> **最佳实践**：实现微小性能提升的小代码修改最终会累积成较大的整体性能提升！\n> \n> 有关 GeoNames 开源项目的更多信息，请访问他们的网站：https://www.geonames.org/.\n\
  \n你现在已经了解如何以及在何处使用这三个新的字符串函数。你还能够编写更高效的代码，使用专门设计用于检测目标字符串开头、中间或结尾子字符串存在或缺失的函数。\n\
  \n最后，我们通过查看新的 SQLite3 授权器来结束本章，增添一点乐趣。\n\n## 使用授权器保护 SQLite 数据库\n\n许多 PHP 开发者更喜欢使用\
  \ SQLite 作为数据库引擎，而不是 PostgreSQL、MySQL、Oracle 或 MongoDB 等独立的数据库服务器。使用 SQLite 的原因有很多，但通常归结为以下几点：\n\
  \n- **SQLite 是一个基于文件的数据库**：你不需要安装单独的数据库服务器。\n- **易于分发**：唯一的要求是目标服务器需要安装 SQLite 可执行文件。\n\
  - **SQLite 轻量级**：由于没有持续运行的服务器，它占用更少的资源。\n\n尽管如此，其缺点是可扩展性不强。如果需要处理相当大量的数据，那么安装更强大的数据库服务器可能更好。另一个潜在的重大缺点是\
  \ SQLite 没有安全性，这将在下一小节中介绍。\n\n> **提示**\n> 有关 SQLite 的更多信息，请查看其主网页：\n> https://sqlite.org/index.html.\n\
  \n### 等一下……没有安全？\n\n*是的，你听对了：* 默认情况下，根据其设计，SQLite 没有安全性。当然，这正是许多开发者喜欢使用它的原因：没有安全性使其超级易于使用！\n\
  \n这是一个示例代码块，它连接到 SQLite 数据库并对 geonames 表进行简单查询。它返回印度人口超过 200 万的城市列表：\n\n```php\n\
  // /repo/ch02/php8_sqlite_query.php\ndefine('DB_FILE', __DIR__ . '/tmp/sqlite.db');\n\
  $sqlite = new SQLite3(DB_FILE);\n$sql = 'SELECT * FROM geonames '\n    . 'WHERE\
  \ country_code = :cc AND population > :pop';\n$stmt = $sqlite->prepare($sql);\n\
  $stmt->bindValue(':cc', 'IN');\n$stmt->bindValue(':pop', 2000000);\n$result = $stmt->execute();\n\
  ```\n\n```\nwhile ($row = $result->fetchArray(SQLITE3_ASSOC)) {\n    printf(\"%20s\
  \ : %2s : %16s\\n\",\n        $row['name'], $row['country_code'],\n        number_format($row['population']));\n\
  } // not all code is shown\n```\n\n大多数其他数据库扩展在建立连接时至少需要用户名和密码。正如前面的代码片段所示，`$sqlite`\
  \ 实例是在完全没有任何安全措施的情况下创建的：没有用户名也没有密码。\n\n## 什么是 SQLite 授权回调？\n\nSQLite3 引擎现在允许您向 SQLite\
  \ 数据库连接注册一个 **授权回调**。回调例程在向数据库发送 **预处理语句** 进行编译时被调用。以下是为 SQLite3 实例设置授权回调的通用语法：\n\
  \n```\n$sqlite3->setAuthorizer(callable $callback);\n```\n\n预计回调返回其中一个三个 SQLite3\
  \ 类常量，每个常量代表一个整数值。如果回调返回的不是这三个值之一，则假定为 `SQLite3::DENY`，并且操作不会继续。接下来显示的表格列出了三个预期的返回值：\n\
  \n| 常量 | 描述 |\n|---|---|\n| SQLite3::OK | 成功 |\n| SQLite3::IGNORE | 语句允许准备，但被渲染为中性\
  \ |\n| SQLite3::DENY | 拒绝访问 |\n\n表 2.2 – 有效的 SQLite 授权回调返回值\n\n现在您对回调有了大致了解，让我们看看它是如何被调用的。\n\
  \n## 会发送什么到回调？\n\n当您执行 `$sqlite->prepare($sql)` 时会调用回调。此时，SQLite3 引擎会向回调传递一到五个参数。第一个参数是\
  \ **操作代码**，它决定了剩余参数的性质。因此，以下可能是您最终定义的回调的适当通用函数签名：\n\n```\nfunction NAME (int $actionCode,\
  \ ...$params)\n{ /* callback code */ };\n```\n\n操作代码在很大程度上反映了要准备的 SQL 语句。下面的表格总结了一些更常见的操作代码：\n\
  \n| 代码（第1个参数） | 第2个参数 | 第3个参数 | SQL |\n|---|---|---|---|\n| SQLITE_READ | 表名 | 列名\
  \ | SELECT (each result) |\n| SQLITE_SELECT | NULL | NULL | SELECT (first issued)\
  \ |\n| SQLITE_INSERT | 表名 | NULL | INSERT |\n| SQLITE_UPDATE | 表名 | 列名 | UPDATE\
  \ |\n| SQLITE_DELETE | 表名 | NULL | DELETE |\n| SQLITE_CREATE_* | 创建的项目名称 | 表名或 NULL\
  \ | CREATE TABLE | INDEX | VIEW 等 |\n| SQLITE_DROP_* | 创建的项目名称 | 表名或 NULL | DROP\
  \ TABLE | INDEX | VIEW 等 |\n\n表 2.3 – 发送到回调的常见操作代码\n\n现在是时候看一个使用示例了。\n\n## 授权器使用示例\n\
  \n在下面的示例中，我们允许从 SQLite geonames 表读取，但不允许插入、删除或更新：\n\n- 1. 我们首先在 /repo/ch02/includes/\
  \ 目录中定义一个 auth_callback.php 包含文件。在包含文件中，我们首先定义回调中使用的常量，如以下代码片段所示：\n\n```\n// /repo/ch02/includes/auth_callback.php\n\
  define('DB_FILE', '/tmp/sqlite.db');\ndefine('PATTERN', '%-8s | %-4s | %-28s | %-15s');\n\
  define('DEFAULT_TABLE', 'Unknown');\ndefine('DEFAULT_USER', 'guest');\ndefine('ACL'\
  \ , [\n    'admin' => [\n        'users' => [SQLite3::READ, SQLite3::SELECT,\n \
  \           SQLite3::INSERT, SQLite3::UPDATE,\n            SQLite3::DELETE],\n \
  \       'geonames' => [SQLite3::READ, SQLite3::SELECT,\nSQLite3::INSERT, SQLite3::UPDATE,\n\
  SQLite3::DELETE],\n],\n'guest' => [\n'geonames' => [SQLite3::READ,\nSQLite3::SELECT],\n\
  ],\n]);\n```\n\n访问控制列表（ACL）的工作方式是：主要的外层键是用户（例如 admin 或 guest）；次要键是表（例如 users 或 geonames）；值是允许该用户和表使用的\
  \ SQLite3 操作代码数组。\n\n在前面显示的示例中，admin 用户对两个表都有所有权限，而 guest 用户只能从 geonames 表读取。\n\n\
  - 2. 接下来，我们定义实际的授权回调函数。函数中需要做的第一件事是将默认返回值设置为 SQLite3::DENY。我们还检查操作代码是否为 SQLite3::SELECT，如果是，则直接返回\
  \ OK。此操作代码在首次处理 SELECT 语句时发出，并且不提供有关表或列的任何信息。代码可在以下片段中看到：\n\n```\nfunction auth_callback(int\
  \ $code, ...$args) {\n    $status = SQLite3::DENY;\n    $table  = DEFAULT_TABLE;\n\
  \    if ($code === SQLite3::SELECT) {\n        $status = SQLite3::OK;\n```\n\n-\
  \ 3. 如果操作代码不是 SQLite3::SELECT，我们需要在做出允许或拒绝操作的决定之前先确定涉及哪个表。表名作为提供给我们回调的第二个参数报告。\n\
  \n- 4. 这里是使用可变参数运算符的完美时机，因为我们不确定可能会传递多少个参数。然而，对于主要关注的操作（例如 INSERT、UPDATE 或 DELETE），放在\
  \ $args 中的第一个位置的是表名。否则，我们从会话中获取表名。\n\n代码在以下片段中说明：\n\n```\n} else {\n    if (!empty($args[0]))\
  \ {\n        $table = $args[0];\n    } elseif (!empty($_SESSION['table'])) {\n \
  \       $table = $_SESSION['table'];\n    }\n```\n\n- 5. 类似地，我们按如下方式从会话中检索用户名：\n\
  \n```\n$user = $_SESSION['user'] ?? DEFAULT_USER;\n```\n\n- 6. 接下来，我们检查用户是否在 ACL\
  \ 中定义，然后检查表是否已为该用户分配权限。如果给定的操作代码在与用户和表组合关联的数组中，则返回 SQLite3::OK。\n\n代码显示在以下片段中：\n\
  \n```\nif (!empty(ACL[$user])) {\n    if (!empty(ACL[$user][$table])) {\n      \
  \  if (in_array($code, ACL[$user][$table])) {\n            $status = SQLite3::OK;\n\
  \        }\n    }\n}\n```\n\n- 7. 然后我们将表名存储在会话中并返回状态代码，如以下代码片段所示：\n\n```\n} // end\
  \ of \"if ($code === SQLite3::SELECT)\"\n$_SESSION['table'] = $table;\nreturn $status;\n\
  } // end of function definition\n```\n\n我们现在将注意力转向调用程序。\n\n- 8. 在包含定义授权回调的 PHP 文件之后，我们通过接受命令行参数、**统一资源定位符（URL）**\
  \ 参数或简单地分配 admin 来模拟获取用户名，如以下代码片段所示：\n\n```php\n// /repo/ch02/php8_sqlite_auth_admin.php\n\
  include __DIR__ . '/includes/auth_callback.php';\n// Here we simulate the user acquisition:\n\
  session_start();\n$_SESSION['user'] =\n    $argv[1] ?? $_GET['usr'] ?? DEFAULT_USER;\n\
  ```\n\n- 9. 接下来，我们创建两个数组并使用 shuffle() 使其顺序随机。我们从随机化的数组中构建用户名、电子邮件和 ID 值，如以下代码片段所示：\n\
  \n```php\n$name = ['jclayton','mpaulovich','nrousseau',\n    'jporter'];\n$email\
  \ = ['unlikelysource.com',\n    'lfphpcloud.net','phptraining.net'];\nshuffle($name);\n\
  shuffle($email);\n$user_name = $name[0];\n$user_email = $name[0] . '@' . $email[0];\n\
  $id = md5($user_email . rand(0,999999));\n```\n\n- 10. 然后我们创建 SQLite3 实例并分配授权回调，如下所示：\n\
  \n```php\n$sqlite = new SQLite3(DB_FILE);\n$sqlite->setAuthorizer('auth_callback');\n\
  ```\n\n- 11. SQL INSERT 语句现在被定义并发送到 SQLite 进行准备。请注意，这就是授权回调被调用的时候。\n\n代码显示在以下片段中：\n\
  \n```\n$sql = 'INSERT INTO users '\n. 'VALUES (:id, :name, :email, :pwd)';\n$stmt\
  \ = $sqlite->prepare($sql);\n```\n\n- 12. 如果授权回调拒绝该操作，语句对象为 NULL，因此最好使用 if () 语句来测试其是否存在。如果存在，我们然后继续绑定值并执行语句，如以下代码片段所示：\n\
  \n```\nif ($stmt) {\n    $stmt->bindValue(':id', $id);\n    $stmt->bindValue(':name',\
  \ $user_name);\n    $stmt->bindValue(':email', $user_email);\n    $stmt->bindValue(':pwd',\
  \ 'password');\n    $result = $stmt->execute();\n```\n\n- 13. 为了确认结果，我们定义了一个 SQL\
  \ SELECT 语句来显示 users 表的内容，如下所示：\n\n```\n$sql = 'SELECT * FROM users';\n$result =\
  \ $sqlite->query($sql);\nwhile ($row = $result->fetchArray(SQLITE3_ASSOC))\n   \
  \ printf(\"%-10s : %-10s\\n\",\n        $row['user_name'], $row['user_email']);\n\
  }\n```\n\n**重要说明**\n此处未显示所有代码。有关完整代码，请参阅 `/repo/ch02/php8_sqlite_auth_admin.php`。\n\
  \n\n\n以下是运行调用程序时将用户设置为管理员的结果：\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_104_0.png)\n\
  \nFigure 2.9 – SQLite3 authorization callback: admin user\n\n前一张截图的输出显示操作成功，因为我们以管理员用户身份运行，拥有足够的授权权限。以下是将用户设置为访客时的输出：\n\
  \n![](img/dbf2674d5b31107c344104b5edcb21c5_104_1.png)\n\nFigure 2.10 – SQLite3 authorization\
  \ callback: guest user\n\n输出显示运行 prepare() 的尝试不成功，因为我们以权限不足的用户身份运行。\n\n至此，我们对这一备受期待的功能的讨论结束。你现在知道如何为原本不安全的数据库技术添加授权。\n\

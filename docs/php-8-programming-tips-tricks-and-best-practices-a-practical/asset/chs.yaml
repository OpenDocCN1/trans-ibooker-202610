  enchant_dict_is_in_session()\nenchant_broker_free()\nenchant_broker_free_dict()\n\
  enchant_broker_set_dict_path()\nenchant_broker_get_dict_path() | enchant_dict_add()\n\
  enchant_dict_is_added()\nunset ($enchantObject)\n(相同)\n无：不再支持\n(相同) |\n| OCI8 |\

- pgno: 250
  md: 'In addition, there was a change in how PHP 8 treats any functions defined in
    the `php.ini` file using the `disable_functions` directive. Let''s have a look
    at this directive to begin with.


    # Understanding changes in disabled functions handling


    Web hosting companies often offer heavily discounted **shared hosting** packages.
    Once a customer signs up, the IT staff at the hosting company creates an account
    on the shared server, assigns a disk quota to control disk space usage, and creates
    a **virtual host** definition on the web service. The problem such hosting companies
    face, however, is that allowing unrestricted access to PHP poses a security risk
    to both the shared hosting company as well as other users on the same server.


    To address this issue, IT staff often assign a comma-separated list of functions
    to the `php.ini` directive, **disable_functions**. In so doing, any function on
    this list cannot be used in PHP code running on that server. Functions that typically
    end up on this list are those that allow operating system access, such as `system()`
    or `shell_exec()`.


    Only internal PHP functions can end up on this list. Internal functions are those
    included in the PHP core as well as functions provided via extensions. User-defined
    functions are not affected by this directive.


    # Examining disabled functions'' handling differences


    In PHP 7 and earlier, disabled functions could not be re-defined. In PHP 8, disabled
    functions are treated as if they never existed, which means re-definition is possible.


    > **Important note**

    > Just because you can redefine the disabled function in PHP 8 *does not* mean
    that the original functionality has been restored!


    To illustrate this concept, we first add this line to the `php.ini` file:

    `disable_functions=system`.


    Note that we need to add this to *both* Docker containers (both PHP 7 and PHP
    8) in order to complete the illustration. The commands to update the `php.ini`
    files are shown here:


    ```

    root@php8_tips_php7 [ /repo/ch06 ]#

    echo "disable_functions=system">>/etc/php.ini

    root@php8_tips_php8 [ /repo/ch06 ]#

    echo "disable_functions=system">>/etc/php.ini

    ```'
  merge: -1
  img_proc: true

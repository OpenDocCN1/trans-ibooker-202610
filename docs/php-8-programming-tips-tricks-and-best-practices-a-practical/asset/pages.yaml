    \ (1) {\n    public $test =>\n        int(1)\n}\n```\n\nAs you can see, in PHP\
    \ 7 a stdClass() instance is silently created and a Warning is issued, but the\
    \ operation is allowed to continue. If we run the same code under PHP 8, notice\
    \ here the difference in output:\n\n```\nPHP Fatal error:  Uncaught Error: Attempt\
    \ to assign property \"test\" on null in /repo/ch03/php8_warn_prop_nobj.php:4\n\
    ```\n\nThe good news is in PHP 8 the Error is thrown, which means we could easily\

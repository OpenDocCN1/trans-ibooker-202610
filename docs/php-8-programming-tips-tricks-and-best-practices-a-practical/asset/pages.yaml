    $alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';\n$num = '0123456789';\n$test = [15, 7,\
    \ 15, 34];\nforeach ($test as $pos)\n    echo \"$alpha$num\"[$pos];\n```\n\nIn\

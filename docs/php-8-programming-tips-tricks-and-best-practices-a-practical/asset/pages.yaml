- pgno: 461
  md: '6. Next, we reset the PHP module, and install PHP 8:


    ```

    dnf -y module reset php

    dnf -y module install php:remi-8.0

    ```


    7. Another quick PHP version check shows us that we are now using PHP 8 instead
    of PHP 7:


    ```

    [root@56b9fbf499d6 /]# php -v

    PHP 8.0.7 (cli) (built: Jun  1 2021 18:43:05)

    ( NTS gcc x86_64 ) Copyright (c) The PHP Group

    Zend Engine v4.0.7, Copyright (c) Zend Technologies

    ```


    8. To switch back to the earlier version of PHP, proceed as follows, where X.Y
    is the version you plan to use:


    ```

    dnf -y module reset php

    dnf -y module install php:remi-X.Y

    ```


    This completes the PHP installation instructions for Red Hat, CentOS, or Fedora.
    For this demonstration, we only showed you the PHP command-line installation.
    If you plan to use PHP with a web server, you also need to install either the
    appropriate PHP web server package, and/or install the PHP-FPM (FastCGI Processing
    Module) package.


    Let''s now have a look at the last step.


    # Step 12 – Test and clone the staging environment to production


    In the last step, you download the source code from your PHP 8 migration branch
    onto the staging environment and run every imaginable test to make sure everything''s
    working. Once you are assured of success, you then clone the staging environment
    onto the production environment.


    If you are using virtualization, the clone procedure might simply involve creating
    an identical Docker container or virtual disk file. Otherwise, if actual hardware
    is involved, you will probably end up cloning the hard drive, or whatever method
    is appropriate for your setup.


    This concludes our discussion of how to perform the migration. Let''s now have
    a look at testing and troubleshooting.'
  merge: -1

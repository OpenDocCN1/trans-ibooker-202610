- pgno: 78
  md: '# Using arrow functions


    Arrow functions were actually first introduced in PHP 7.4. However, as many developers
    do not follow every single release update, it''s important to include coverage
    of this excellent new feature in this book.


    In this section, you will learn about arrow functions and their syntax, as well
    as advantages and disadvantages compared with anonymous functions.


    # Generic syntax


    Simply put, an arrow function is a shorthand syntax for the traditional anonymous
    function, much like the ternary operator is a shorthand syntax for if () {} else
    {}. The generic syntax for an arrow function is shown here:


    ```

    fn(<ARGS>) => <EXPRESSION>

    ```


    <ARGS> is optional and include anything seen in any other user-defined PHP function.
    <EXPRESSION> can include any standard PHP expression such as function calls, arithmetic
    operations, and so forth.


    Let''s now have a look at the differences between arrow functions and anonymous
    functions.


    # Arrow functions versus anonymous functions


    In this subsection, you will learn the differences between arrow functions and
    anonymous functions. In order to become an effective PHP 8 developer, it''s important
    to gain an understanding of where and when arrow functions might replace anonymous
    functions and improve code performance.


    Before getting into arrow functions, let''s look at a simple anonymous function.
    In the following example, the anonymous function assigned to $addOld produces
    the sum of the two arguments:


    ```

    ```php

    // /repo/ch02/php8_arrow_func_1.php

    $addOld = function ($a, $b) { return $a + $b; };

    ```

    ```


    In PHP 8, you can produce exactly the same result, as follows:


    ```

    $addNew = fn($a, $b) => $a + $b;

    ```


    Although the code is much more readable, there are advantages and disadvantages
    to this new feature, summarized in this table:'
  merge: -1
  img_proc: true
- pgno: 79
  md: "|  | Anonymous Function | Arrow Function |\n|---|---|---|\n| Less code | No\
    \ | Yes |\n| Inherits variables | requires use() | Yes |\n| Can be nested | Yes\
    \ | Yes |\n| $this automatically bound | Yes | Yes |\n| $$ indirection supported\
    \ | Yes | No |\n| Multiple lines of code | Yes | No |\n\nTable 2.1 – Anonymous\
    \ functions versus arrow functions\n\nAs you can see from the preceding table,\
    \ arrow functions are more efficient than anonymous functions. However, the lack\
    \ of indirection and lack of support for multiple lines means that you still need\
    \ to use anonymous functions on occasion.\n\n# Variable inheritance\n\nAnonymous\
    \ functions, much like any standard PHP function, only recognize variables outside\
    \ their scope if you pass the value as a parameter, use a global keyword, or add\
    \ a use() modifier.\n\nHere is an example of where a DateTime instance is inherited\
    \ into an anonymous function by way of use():\n\n```\n```php\n// /repo/ch02/php8_arrow_func_2.php\n\
    // not all code shown\n\n$old = function ($today) use ($format) {\n    return\
    \ $today->format($format);\n};\n```\n```\n\nHere is exactly the same thing using\
    \ an arrow function:\n\n```\n```php\n$new = fn($today) => $today->format($format);\n\
    ```\n```\n\nAs you can see, the syntax is extremely readable and concise. Let's\
    \ now examine a practical example that incorporates arrow functions."
  merge: -1
  img_proc: true
- pgno: 80
  md: "# Practical example: Using arrow functions\n\nReturning to the idea of producing\

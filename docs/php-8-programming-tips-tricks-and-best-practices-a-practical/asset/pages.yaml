- pgno: 301
  md: "# Examining PCRE extension changes\n\nThe **PCRE** extension contains a number\
    \ of functions designed to perform pattern matching using *regular expressions*.\
    \ The term *regular expression* is commonly shortened to *regex*. A **regex**\
    \ is a string that describes another string. Here are some changes to note in\
    \ the PCRE extension.\n\nInvalid escape sequences in patterns are no longer interpreted\
    \ as literals. In the past, you could use an X modifier; however, that modifier\
    \ is now ignored in PHP 8. Happily, to assist you with internal PCRE pattern-analysis\
    \ errors, a new `preg_last_error_msg()` function has been added that returns a\
    \ human-readable message when PCRE errors are encountered.\n\nThe `preg_last_error()`\
    \ function allows you to determine whether or not an internal PCRE error occurred\
    \ during pattern analysis. This function only returns an integer, however. Prior\
    \ to PHP 8, it was up to the developer to look up the code and to figure out the\
    \ actual error.\n\n> Tip\n> A list of error codes returned by `preg_last_error()`\
    \ can be found here:\n> https://www.php.net/manual/en/function.preg-last-error.php#refsect1-function.preg-last-error-returnvalues\n\
    \nA brief code example follows that illustrates the aforementioned issues. Here\
    \ are the steps leading to this:\n\n+   1. First, we define a function that performs\
    \ a match and checks to see if any errors have occurred, as follows:\n\n```\n\
    $pregTest = function ($pattern, $string) {\n    $result  = preg_match($pattern,\
    \ $string);\n    $lastErr = preg_last_error();\n    if ($lastErr == PREG_NO_ERROR)\
    \ {\n        $msg = 'RESULT: ';\n        $msg .= ($result) ? 'MATCH' : 'NO MATCH';\n\
    \    } else {\n        $msg = 'ERROR : ';\n        if (function_exists('preg_last_error_msg'))\n\
    \            $msg .= preg_last_error_msg();\n        else\n```"

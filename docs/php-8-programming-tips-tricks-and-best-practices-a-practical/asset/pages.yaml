- pgno: 312
  md: "| City | Coordinates |\n|---|---|\n| Mexico City : | 19.42847,-99.12766 |\n\
    | Moscow : | 55.75222,37.61556 |\n| Mumbai : | 19.07283,72.88261 |\n| Seoul :\
    \ | 37.566,126.9784 |\n| Shanghai : | 31.22222,121.45806 |\n| Shenzhen : | 22.54554,114.0683\
    \ |\n| São Paulo : | -23.5475,-46.63611 |\n| Tianjin : | 39.14222,117.17667 |\n\
    \nThis code example won't work in PHP 8, however, because each() has been removed.\
    \ The *best practice* is to move toward an **object-oriented programming (OOP)**\
    \ approach: use ArrayIterator instead of each(). The next code example produces\
    \ exactly the same results as previously but uses object classes instead of procedural\
    \ functions:\n\n+   1. Instead of using fopen(), we instead create an SplFileObject\
    \ instance. You'll also notice in the following code snippet that instead of creating\

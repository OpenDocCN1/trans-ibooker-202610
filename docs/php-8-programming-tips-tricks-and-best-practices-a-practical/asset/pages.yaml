- pgno: 40
  md: "# Incorporating match expressions into your program code\n\nAmong the many\
    \ incredibly useful features introduced in PHP 8, **match expressions** definitely\
    \ stand out. Match expressions are a more accurate shorthand syntax that can potentially\
    \ replace the tired old switch statement that came directly from the C language.\
    \ In this section, you will learn how to produce cleaner and more accurate program\
    \ code by replacing switch statements with match expressions.\n\n# Match expression\
    \ general syntax\n\nMatch expression syntax is much like that of an array, where\
    \ the key is the item to match and the value is an expression. Here is the general\
    \ syntax for match:\n\n```\n$result = match(<EXPRESSION>) {\n    <ITEM> => <EXPRESSION>,\n\
    \    [<ITEM> => <EXPRESSION>,]\n    default => <DEFAULT EXPRESSION>\n};\n```\n\
    \nThe expression must be a valid PHP expression. Examples of expressions could\
    \ include any of the following:\n\n+   - A specific value (for example, \"some\
    \ text\")\n+   - An operation (for example, $a + $b)\n+   - An anonymous function\
    \ or class\n\nThe only limitation is that the expression has to be defined in\
    \ a single line of code. Major differences between match and switch are summarized\
    \ here:\n\n| Switch | Match |\n|---|---|\n| Loose type comparisons (for example\
    \ $a == $b) | Strict type comparisons (for example $a === $b) |\n| Does not return\
    \ a value | Returns a value |\n| Requires break | Does not require break |\n|\
    \ Multiple commands per case | One command per match |\n\nTable 1.1 – Differences\
    \ between match and switch"
  merge: -1
  img_proc: true
- pgno: 41
  md: "Other than the differences noted, match and switch both allow case aggregation,\
    \ as well as providing support for a default case.\n\n# switch and match examples\n\
    \nHere is a simple example that renders a currency symbol using switch:\n\n```\n\
    // /repo/ch01/php7_switch.php\nfunction get_symbol($iso) {\n    switch ($iso)\
    \ {\n        case 'CNY' :\n            $sym = '¥';\n            break;\n     \
    \   case 'EUR' :\n            $sym = '€';\n            break;\n        case 'EGP'\
    \ :\n            case 'GBP' :\n            $sym = '£';\n            break;\n \
    \       case 'THB' :\n            $sym = '฿';\n            break;\n        default\
    \ :\n            $sym = '$';\n    }\n    return $sym;\n}\n$test = ['CNY', 'EGP',\
    \ 'EUR', 'GBP', 'THB', 'MXD'];\nforeach ($test as $iso)\n    echo 'The currency\
    \ symbol for ' . $iso\n        . ' is ' . get_symbol($iso) . \"\\n\";\n```"
  merge: -1
  img_proc: true
- pgno: 42
  md: "When this code is executed, you see the currency symbols for each of the **International\
    \ Organization for Standardization (ISO)** currency codes in the $test array.\
    \ The same result as that shown in the preceding code snippet can be obtained\
    \ in PHP 8, using the following code:\n\n```\n```php\n// /repo/ch01/php8_switch.php\n\
    function get_symbol($iso) {\n    return match ($iso) {\n        'EGP', 'GBP' =>\
    \ '£',\n        'CNY'        => '¥',\n        'EUR'        => '€',\n        'THB'\
    \        => '฿',\n        default      => '$'\n    };\n}\n$test = ['CNY', 'EGP',\
    \ 'EUR', 'GBP', 'THB', 'MXD'];\nforeach ($test as $iso)\n    echo 'The currency\
    \ symbol for ' . $iso\n        . ' is ' . get_symbol($iso) . \"\\n\";\n```\n```\n\
    \nBoth examples produce an identical output, as illustrated here:\n\n```\n```\n\
    The currency symbol for CNY is ¥\nThe currency symbol for EGP is £\nThe currency\
    \ symbol for EUR is €\nThe currency symbol for GBP is £\nThe currency symbol for\
    \ THB is ฿\nThe currency symbol for MXD is $\n```\n```\n\nAs mentioned previously,\
    \ both code examples produce a list of currency symbols for the list of ISO currency\
    \ codes stored in the $test array."
  merge: -1
  img_proc: true
- pgno: 43
  md: "# Complex match example\n\nReturning to our CAPTCHA project, assume that we\
    \ wish to introduce distortion to make the CAPTCHA characters more difficult to\
    \ read. To accomplish this goal, we introduce a number of **strategy** classes,\
    \ each producing a different distortion, as summarized in this table:\n\n| Php8\\\
    Image\\Strategy\\* | Description |\n|---|---|\n| DotFill ($num) | Fills background\
    \ with $num dots |\n| LineFill ($num) | Fills background with $num lines |\n|\
    \ RotateText ($angle) | Rotates text by $angle |\n| Shadow ($offset, $r, $g, $b)\
    \ | Adds a shadow with $offset pixels apart, with a color determined by $r, $g\
    \ and $b (red, green, blue) |\n\nTable 1.2 – CAPTCHA distortion strategy classes\n\
    \nAfter randomizing the list of strategies to be employed, we use a match expression\
    \ to execute the results, as follows:\n\n+   1. First we define an **autoloader**,\
    \ import the classes to be used, and list potential strategies to employ, as illustrated\
    \ in the following code snippet:\n+   \n+   2. Next, we generate the CAPTCHA phrase,\
    \ as follows:\n\n```\n// /repo/ch01/php8_single_strategies.php\n// not all code\
    \ is shown\nrequire_once __DIR__ . '../src/Server/Autoload/Loader.php';\n$loader\
    \ = new \\Server\\Autoload\\Loader();\nuse Php8\\Image\\SingleChar;\nuse Php8\\\
    Image\\Strategy\\{LineFill,DotFill,Shadow,RotateText};\n$strategies = ['rotate',\
    \ 'line', 'line',\n    'dot', 'dot', 'shadow'];\n```\n\n```\n$phrase = strtoupper(bin2hex(random_bytes(NUM_BYTES)));\n\
    $length = strlen($phrase);\n```"
  merge: -1
  img_proc: true
- pgno: 44
  md: "3. We then loop through each character in the CAPTCHA phrase and create a SingleChar\
    \ instance. The initial call to writeFill() creates the white background canvas.\
    \ We also need to call shuffle() to randomize the list of distortion strategies.\
    \ The process is illustrated in the following code snippet:\n\n```\n```php\n$images\
    \ = [];\nfor ($x = 0; $x < $length; $x++) {\n    $char = new SingleChar($phrase[$x],\
    \ FONT_FILE);\n    $char->writeFill();\n    shuffle($strategies);\n}\n```\n```\n\
    \n4. We then loop through the strategies and layer distortions upon the original\
    \ image. This is where the match expression comes into play. Notice that one strategy\
    \ needs additional lines of code. Because match can only support a single expression,\
    \ we simply wrap the multiple lines of code into an anonymous function, as follows:\n\
    \n```\n```php\nforeach ($strategies as $item) {\n    $func = match ($item) {\n\
    \        'rotate' => RotateText::writeText($char),\n        'line' => LineFill::writeFill(\n\
    \            $char, rand(1, 10)),\n        'dot' => DotFill::writeFill($char,\
    \ rand(10, 20)),\n        'shadow' => function ($char) {\n            $num = rand(1,\
    \ 8);\n            $r   = rand(0x70, 0xEF);\n            $g   = rand(0x70, 0xEF);\n\
    \            $b   = rand(0x70, 0xEF);\n            return Shadow::writeText(\n\
    \                $char, $num, $r, $g, $b);},\n        'default' => TRUE\n    };\n\
    \    if (is_callable($func)) $func($char);\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 45
  md: "5. All that remains to be done is to overlay the image with the actual CAPTCHA\
    \ phrase by calling writeText() with no arguments. After that, we save the distorted\
    \ image as a **Portable Network Graphics (PNG)** file for display, as illustrated\
    \ in the following code snippet:\n\n```\n```php\n$char->writeText();\n$fn = $x\
    \ . '_'\n    . substr(basename(__FILE__), 0, -4)\n    . '.png';\n$char->save(IMG_DIR\
    \ . '/' . $fn);\n$images[] = $fn;\n}\ninclude __DIR__ . '/captcha_simple.phtml';\n\
    ```\n```\n\nHere is the result, running the preceding example from a browser that\
    \ points to the Docker container associated with this book:\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_45_0.png)\n\
    \nFigure 1.1 – Distorted CAPTCHA using match expression\n\nNext, we'll have a\
    \ look at another really great feature: named arguments.\n\n> **Tip**\n> You can\
    \ see the original proposal for match expressions here:\n> https://wiki.php.net/rfc/match_expression_v2"
  merge: -1

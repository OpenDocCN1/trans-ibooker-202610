- pgno: 495
  md: '# Implementing PHP async using Amp


    The **Amp framework** (https://amphp.org/), much like ReactPHP, provides implementations
    of timers, promises, and streams. Amp also provides coroutine support, as well
    as an asynchronous iterator component. The latter is extremely intriguing, as
    iteration is essential to most PHP applications. If you can move iteration into
    an asynchronous mode of processing, while potentially involving a lot of refactoring,
    it might provide an immense boost to your application''s performance. Another
    interesting twist is that Amp can directly use any ReactPHP components!


    To install Amp, use Composer. The various Amp components are available in discrete
    repositories, so you don''t have to install the entire framework—only what you
    need. The actual implementation of a PHP Amp server is much like the example shown
    for ReactPHP.


    Let''s now have a look at another framework that can operate in PHP async mode:
    **Mezzio**, formerly called **Zend Expressive**.


    # Using Mezzio with Swoole


    The **Mezzio** framework (https://docs.mezzio.dev/) is the brainchild of Matthew
    Weier O''Phinney (https://mwop.net/) and represents a continuation of an older
    framework, **Zend Framework**, and a later one, **Zend Expressive**. Mezzio falls
    into the relatively new category of a **micro framework**. Micro frameworks do
    not have any reliance on the aging **Model-View-Controller (MVC)** software design
    pattern and are mainly oriented toward **RESTful API development**. In practical
    terms, micro frameworks support the principle of PHP middleware and operate with
    much less overhead and correspondingly greater speed.


    In order to use a Mezzio application with Swoole, just the following three things
    are needed:


    +   1. Install the Swoole extension (described earlier in this chapter).

    +   2. Install the mezzio-swoole component, like this:

    +   3. You would then need to run Mezzio using a Swoole server instance. This
    can be accomplished with the following command:


    ```

    composer require mezzio/mezzio-swoole

    ```


    ```

    /path/to/project/vendor/bin/laminas mezzio:swoole:start

    ```'

- pgno: 88
  md: "# Enhanced expression support for new and instanceof\n\nOne of the joys associated\
    \ with PHP 7 programming is the ability to use arbitrary PHP expressions just\
    \ about anywhere. In this simple example, note the use of a $_GET['page'] ?? 'home'\
    \ arbitrary expression inside the square brackets referencing the $nav array:\n\
    \n```\n// /repo/ch02/php7_arbitrary_exp.php\n$nav = [\n    'home'     => 'home.html',\n\
    \    'about'    => 'about.html',\n    'services' => 'services/index.html',\n \
    \   'support'  => 'support/index.html',\n];\n$html = __DIR__ . '/../includes/'\n\
    \    . $nav[$_GET['page'] ?? 'home'];\n```\n\nIn PHP 7 and earlier versions, however,\
    \ the same thing is not possible if the expression involves the new or instanceof\
    \ keyword. As you may have guessed, this inconsistency has been addressed in PHP\
    \ 8. The following is now possible:\n\n```\n// /repo/ch02/php8_arbitrary_exp_new.php\n\
    // definition of the JsonRespone and SerialResponse\n// classes are shown above\n\
    $allowed = [\n    'json' => 'JsonResponse',\n    'text' => 'SerialResponse'\n\
    ];\n$data = ['A' => 111, 'B' => 222, 'C' => 333];\necho (new $allowed[$_GET['type']\
    \ ?? 'json'])\n    ->render($data);\n```\n\nThis code example shows the use of\
    \ an arbitrary expression inside the array reference, used in conjunction with\
    \ the new keyword.\n\n> **Tip**\n> \n> For more information on uniform variable\
    \ syntax updates in PHP 8, see this article: https://wiki.php.net/rfc/variable_syntax_tweaks."

- pgno: 46
  md: "# Understanding named arguments\n\nNamed arguments represent a way to avoid\
    \ confusion when calling functions or methods with a large number of arguments.\
    \ This not only helps avoid problems with arguments being supplied in an incorrect\
    \ order, but also helps you to skip arguments with defaults. In this section,\
    \ you will learn how to apply named arguments to improve the accuracy of your\
    \ code, reduce confusion during future maintenance cycles, and make your method\
    \ and function calls more concise. We start by examining the generic syntax required\
    \ to use named arguments.\n\n# Named argument generic syntax\n\nIn order to use\
    \ named arguments, you need to know the names of the variables used in the function\
    \ or method signature. You then specify that name, without the dollar sign, followed\
    \ by a colon and the value to be supplied, as follows:\n\n```\n$result = function_name(\
    \ arg1 : <VALUE>, arg2 : <value> );\n```\n\nWhen the function_name() function\
    \ is invoked, the values are passed to the arguments corresponding to arg1, arg2,\
    \ and so on.\n\n# Calling core functions using named arguments\n\nOne of the most\
    \ common reasons to use named arguments is when you call a core PHP function that\
    \ has a large number of parameters. As an example, here's the function signature\
    \ for setcookie():\n\n```\nsetcookie ( string $name [, string $value = \"\"\n\
    \    [, int $expires = 0 [, string $path = \"\"\n    [, string $domain = \"\"\
    \ [, bool $secure = FALSE\n    [, bool $httponly = FALSE ]]]]] ) : bool\n```\n\
    \nLet's say that all you really wanted to set were the name, value, and httponly\
    \ arguments. Before PHP 8, you would have had to look up the default values and\
    \ supply them, in order, until you got to the one you wished to override. In the\
    \ following case, we wish to set httponly to TRUE:\n\n```\nsetcookie('test',1,0,0,'','',FALSE,TRUE);\n\
    ```\n\nUsing named arguments, the equivalent in PHP 8 would be as follows:\n\n\
    ```\nsetcookie('test',1,httponly: TRUE);\n```"
  merge: -1
  img_proc: true
- pgno: 47
  md: "Note that we do not need to name the first two parameters as they are supplied\
    \ in order.\n\n> **Tip**\n> In PHP extensions, named arguments do not always match\
    \ the names of variables you see in the PHP documentation for function or method\
    \ signatures. As an example, the function `imagefttext()` shows a variable `$font_filename`\
    \ in its function signature. If you scroll down a bit further, however, you'll\
    \ see in the *Parameters* section, that the named parameter is `fontfile`.\n>\
    \ \n> If you encounter a fatal Error: Unknown named parameter `$NAMED_PARAM`.\
    \ Always use the name as listed in the *Parameters* section of the documentation\
    \ rather than the name of the variable in the function or method signature.\n\n\
    # Order independence and documentation\n\nAnother use for named arguments is to\
    \ provide **order independence**. In addition, for certain core PHP functions,\
    \ the sheer number of parameters presents a documentation nightmare.\n\nAs an\
    \ example, have a look here at the function signature for `imagefttext()` (note\
    \ that this function is central to the chapter project of producing a secure CAPTCHA\
    \ image):\n\n```\n```php\nimagefttext ( object $image , float $size , float $angle\
    \ ,\n    int $x , int $y , int $color , string $fontfile ,\n    string $text [,\
    \ array $extrainfo ] ) : array\n```\n```\n\nAs you can imagine, trying to remember\
    \ the names and order of these parameters when reviewing your work 6 months later\
    \ might be problematic.\n\n> **Important note**\n> In PHP 8, the image creation\
    \ functions (for example, `imagecreate()`) now return a `GdImage` object instance\
    \ instead of a resource. All image functions in the GD extension have been rewritten\
    \ to accommodate this change. There's no need to rewrite your code!"
  merge: -1
  img_proc: true

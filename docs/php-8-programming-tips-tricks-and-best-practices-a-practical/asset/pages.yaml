- pgno: 324
  md: "> **Tip**\n> \n> Starting with PHP 5.3, an official **Request for Comments\
    \ (RFC)** process was initiated. The status of any proposal can be viewed at https://wiki.php.net/rfc.\n\
    \nLet's start by examining deprecated usage in parameter order.\n\n# Deprecated\
    \ usage in parameter order\n\nThe term *usage* refers to how you call functions\
    \ and class methods in your application code. You will discover that in PHP 8,\
    \ older usages were allowed that are now considered bad practices. Understanding\
    \ how PHP 8 enforces best practices in code usage helps you to write better code.\n\
    \nIf you define a function or method with a mixture of mandatory and optional\
    \ parameters, most PHP developers agree that the optional parameters should follow\
    \ the mandatory parameters. In PHP 8, this usage best practice, if not followed,\
    \ will result in a Deprecation notice. The rationale behind the decision to deprecate\
    \ this usage is to avoid potential logic errors.\n\nThis simple example demonstrates\
    \ this usage difference. In the following example, we define a simple function\
    \ that accepts three arguments. Note that the $op optional parameter is sandwiched\
    \ between two mandatory parameters, $a and $b:\n\n```\n// /repo/ch08/php7_usage_param_order.php\n\
    function math(float $a, string $op = '+', float $b) {\n    switch ($op) {\n  \
    \      // not all cases are shown\n        case '+' :\n        default :\n   \
    \         $out = \"$a + $b = \" . ($a + $b);\n    }\n    return $out . \"\\n\"\
    ;\n}\n```\n\nIf we echo the results of the add operation in PHP 7, there is no\
    \ problem, as we can see here:\n\n```\nroot@php8_tips_php7 [ /repo/ch08 ]#\nphp\
    \ php7_usage_param_order.php\n22 + 7 = 29\n```"
  merge: -1
  img_proc: true
- pgno: 325
  md: "In PHP 8, however, there is a Deprecation notice, after which the operation\
    \ is allowed to continue. Here is the output running in PHP 8:\n\n```\nroot@php8_tips_php8\
    \ [ /repo/ch08 ]#\nphp php7_usage_param_order.php\nPHP Deprecated: Required parameter\
    \ $b follows optional parameter $op in /repo/ch08/php7_usage_param_order.php on\
    \ line 4\n22 + 7 = 29\n```\n\nA Deprecation notice is a signal to the developer\
    \ that this usage is considered a bad practice. In this case, a best practice\
    \ would be to modify the function signature and list all mandatory parameters\
    \ first.\n\nHere is the rewritten example, acceptable to all versions of PHP:\n\
    \n```\n// /repo/ch08/php8_usage_param_order.php\nfunction math(float $a, float\
    \ $b, string $op = '+') {\n    // remaining code is the same\n}\n```\n\nIt's important\
    \ to note that the following usage is still allowed in PHP 8:\n\n```\nfunction\
    \ test(object $a = null, $b) {}\n```\n\nHowever, a better way to write the same\
    \ function signature and still stay within the best practice of listing mandatory\
    \ parameters first would be to rewrite this signature, as follows:\n\n```\nfunction\
    \ test(?object $a, $b) {}\n```\n\nYou now know about features removed from the\
    \ PHP 8 core. Let's now have a look at removed functionality in PHP 8 extensions.\n\
    \n# Working with removed functionality in PHP 8 extensions\n\nIn this section,\
    \ we will have a look at removed functionality in PHP 8 extensions. This information\
    \ is extremely important in order to avoid writing code that does not work in\
    \ PHP 8. Further, an awareness of removed functionality helps you prepare existing\
    \ code for a PHP 8 migration."
  merge: -1
  img_proc: true
- pgno: 326
  md: "The following table summarizes removed functionality in extensions:\n\n| Extension\
    \ | Removed Function | Suggested Replacement |\n|---|---|---|\n| Exif | read_exif_data()\
    \ | exif_read_data() |\n| GD | image2wbmp()\n png2wbmp()\n jpeg2wbmp() | create\
    \ the image as normal, then use imagewbmp() |\n| GMP | gmp_random() | gmp_random_range()\
    \ or gmp_random_bits() |\n| Imap | imap_header() | imap_headerinfo() |\n| LDAP\
    \ | ldap_sort() | $res = ldap_search(); and then: usort($res); |\n| LDAP | ldap_control_paged_result()\n\
    \ ldap_control_paged_result_response() | $res = ldap_search(); and then implement\
    \ pagination using FilterIterator |\n| OCI8 | oci_internal_debug()\n ociinternaldebug()\
    \ | None |\n| Zlib | gzgetss() | strip_tags(gzgets()) |\n\nTable 8.2 – Functions\
    \ removed from PHP 8 extensions\n\nThe preceding table provides a useful list\
    \ of removed functions. Use this list to check against your existing code prior\
    \ to a PHP 8 migration.\n\nLet's now have a look at a potentially serious change\
    \ to the mbstring extension.\n\n# Discovering mbstring extension changes\n\nThe\
    \ mbstring extension has had two major changes that have massive potential for\
    \ a backward-compatible code break. The first change is that a significant number\
    \ of convenience aliases have been removed. The second major change is that support\
    \ for the mbstring PHP function overloading capability has been removed. Let's\
    \ first have a look at removed aliases.\n\n# Handling mbstring extension removed\
    \ aliases\n\nAt the request of a number of developers, the PHP development team\
    \ responsible for this extension graciously created a series of aliases, replacing\
    \ mb_*() with mb*(). The exact rationale for granting this request has been lost\
    \ in time. The burden of supporting such a massive number of aliases, however,\
    \ wastes a tremendous amount of time every time the extension needs to be updated.\
    \ Accordingly, the PHP development team voted to remove these aliases from the\
    \ mbstring extension in PHP 8.\n\nThe following table provides a list of the aliases\
    \ removed, as well as which function to use in their place:"
  merge: -1
  img_proc: true
- pgno: 327
  md: "| Alias | Use Instead |\n|---|---|\n| `mbereg` | `mb_ereg()` |\n| `mbereg_match`\
    \ | `mb_ereg_match()` |\n| `mbereg_replace` | `mb_ereg_replace()` |\n| `mbereg_search`\
    \ | `mb_ereg_search()` |\n| `mbereg_search_getpos` | `mb_ereg_search_getpos()`\
    \ |\n| `mbereg_search_getregs` | `mb_ereg_search_getregs()` |\n| `mbereg_search_init`\
    \ | `mb_ereg_search_init()` |\n| `mbereg_search_pos` | `mb_ereg_search_pos()`\
    \ |\n| `mbereg_search_regs` | `mb_ereg_search_regs()` |\n| `mbereg_search_setpos`\
    \ | `mb_ereg_search_setpos()` |\n| `mberegi` | `mb_eregi()` |\n| `mberegi_replace`\
    \ | `mb_eregi_replace()` |\n| `mbregex_encoding` | `mb_regex_encoding()` |\n|\
    \ `mbsplit` | `mb_split()` |\n\nTable 8.3 – Removed mbstring aliases\n\nLet's\
    \ now have a look at another major change in string handling, pertaining to function\
    \ overloading.\n\n# Working with mbstring extension function overloading\n\nThe\
    \ function overloading feature allows standard PHP string functions (for example,\
    \ `substr()`) to be silently replaced with their mbstring extension equivalences\
    \ (for example, `mb_substr()`) if the php.ini directive `mbstring.func_overload`\
    \ is assigned a value. The value assigned to this directive takes the form of\
    \ a bitwise flag. Depending on the setting of this flag, the `mail()`, `str*()`,\
    \ `substr()`, and `split()` functions could be subject to overloading. This feature\
    \ was deprecated in PHP 7.2 and has been removed in PHP 8.\n\nIn addition, three\
    \ mbstring extension constants related to this feature have also been removed.\
    \ The three constants are `MB_OVERLOAD_MAIL`, `MB_OVERLOAD_STRING`, and `MB_OVERLOAD_REGEX`.\n\
    \n> **Tip**\n> \n> For more information on this feature, visit the following link:\n\
    > \n> `https://www.php.net/manual/en/mbstring.overload.php`"
  merge: -1
  img_proc: true
- pgno: 328
  md: 'Any code that relies upon this functionality will break. The only way to avoid
    serious application failure is to rewrite the affected code and replace the silently
    substituted PHP core string functions with the intended mbstring extension functions.


    In the following example, when mbstring.func_overload is enabled, PHP 7 reports
    the same values for both strlen() and mb_strlen():


    ```

    // /repo/ch08/php7_mbstring_func_overload.php

    $str = ''วันนี้สบายดีไหม'';

    $len1 = strlen($str);

    $len2 = mb_strlen($str);

    echo "Length of ''$str'' using ''strlen()'' is $len1\n";

    echo "Length of ''$str'' using ''mb_strlen()'' is $len2\n";

    ```


    Here is the output in PHP 7:


    ```

    root@php8_tips_php7 [ /repo/ch08 ]#

    php php7_mbstring_func_overload.php

    Length of ''วันนี้สบายดีไหม'' using ''strlen()'' is 45

    Length of ''วันนี้สบายดีไหม'' using ''mb_strlen()'' is 15


    root@php8_tips_php7 [ /repo/ch08 ]#

    echo "mbstring.func_overload=7" >> /etc/php.ini


    root@php8_tips_php7 [ /repo/ch08 ]#

    php php7_mbstring_func_overload.php

    Length of ''วันนี้สบายดีไหม'' using ''strlen()'' is 15

    Length of ''วันนี้สบายดีไหม'' using ''mb_strlen()'' is 15

    ```


    As you can see from the preceding output, once the mbstring.func_overload setting
    is enabled in the php.ini file, the results reported by strlen() and mb_strlen()
    are identical. This is because calls to strlen() are silently diverted to mb_strlen()
    instead. In PHP 8, the output (not shown) shows the results in both cases because
    the mbstring.func_overload setting is ignored. strlen() reports a length of 45,
    and mb_strlen() reports a length of 15.


    To determine if your code is vulnerable to this backward-compatible break, check
    your php.ini file and see if the mbstring.func_overload setting has a value other
    than zero.'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'You now have an idea of where to look for potential code breaks pertaining
    to the `mbstring` extension. At this time, we turn our attention to changes in
    the Reflection extension.


    # Reworking code that uses Reflection*::export()


    In the Reflection extension, a critical difference between PHP 8 and earlier versions
    is that all of the `Reflection*::export()` methods have been removed! The primary
    reason for this change is that simply echoing the Reflection object produces exactly
    the same results as using `export()`.


    If you have any code that currently uses any of the `Reflection*::export()` methods,
    you need to rewrite the code to use the `__toString()` method instead.


    # Discovering other deprecated PHP 8 extension functionality


    In this section, we review a number of other significant deprecated functionality
    of note in PHP 8 extensions. First, we look at XML-RPC.


    # Changes to the XML-RPC extension


    In versions of PHP prior to PHP 8, the XML-RPC extension was part of the core
    and always available. Starting with PHP 8, this extension has quietly been moved
    to the **PHP Extension Community Library (PECL)** (http://pecl.php.net/) and is
    no longer included in a standard PHP distribution by default. You can still install
    and use this extension. This change is easily confirmed by scanning the list of
    extensions in the PHP core here: https://github.com/php/php-src/tree/master/ext.


    This will not present a backward-compatible code break. However, if you perform
    a standard PHP 8 installation and then migrate code that contains references to
    XML-RPC, your code might generate a fatal `Error` message and display a message
    that XML-RPC classes and/or functions are not defined. In this situation, simply
    install the XML-RPC extension using `pecl` or any other method normally used to
    install non-core extensions.


    We now turn our attention to the DOM extension.'
  merge: -1
  img_proc: true
- pgno: 330
  md: "# Changes made to the DOM extension\n\nSince PHP 5, the Document Object Model\
    \ (DOM) extension included a number of classes in its source code repository that\
    \ were never implemented. In PHP 8, a decision was made to support DOM as a living\
    \ standard (much like with HTML 5). A living standard is one that does not feature\
    \ a set series of releases, but rather incorporates a continuous set of releases\
    \ in an effort to keep up with web technology.\n\n> **Tip**\n> \n> For more information\
    \ on the proposed DOM living standard, have a look at this reference: https://dom.spec.whatwg.org/.\
    \ For a good discussion on moving the PHP DOM extension onto a living standard\
    \ basis, have a look at the *Working with interfaces and traits* section of *Chapter\
    \ 9, Mastering PHP 8 Best Practices.*\n\nMainly due to the move toward a living\
    \ standard, the following unimplemented classes have been removed from the DOM\
    \ extension as of PHP 8:\n\n+   - `DOMNameList`\n+   - `DOMImplementationList`\n\
    +   - `DOMConfiguration`\n+   - `DOMError`\n+   - `DOMErrorHandler`\n+   - `DOMImplementationSource`\n\
    +   - `DOMLocator`\n+   - `DOMUserDataHandler`\n+   - `DOMTypeInfo`\n\nThese classes\
    \ were never implemented, which means that your source code will not suffer any\
    \ backward-compatibility breaks.\n\nLet's now have a look at deprecations in the\
    \ PHP PostgreSQL extension."
  merge: -1
  img_proc: true
- pgno: 331

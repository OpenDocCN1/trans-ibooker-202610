    RmhjcmUgZnJwZXJnIHpyZmZudHI=

    array(2) {

    ["tag"]=> string(24) "woD6Vi73/IXLaKHFGUC3aA=="

    ["cipher"]=> string(28) "+vd+jWKqo8WFPd7SakSvszkoIX0="

    ```


    As you can see from the preceding output, the application succeeded, and output
    from both the parent and child classes is being displayed. We can also see a Warning,
    informing us that the private methods cannot be marked as final.


    Tip


    For more information on the background discussion on private method signatures,
    have a look at this documentation reference:

    https://wiki.php.net/rfc/inheritance_private_methods.


    Now that you have an idea of how PHP 8 prevents subclasses from seeing private
    methods in the superclass, let''s turn our attention to differences in anonymous
    classes in PHP 8.


    # Controlling anonymous class usage


    **Anonymous classes**, by their very definition, do not have a name. However,
    for the purposes of information, PHP informational functions such as `var_dump()`,
    `var_export()`, `get_class()`, and other classes in the Reflection extension will
    report the anonymous class simply as `class@anonymous`. However, when an anonymous
    class extends another class or implements an interface, it might be of some use
    to have PHP informational functions reflect this fact.'
  merge: -1
  img_proc: true
- pgno: 380
  md: "In PHP 8, anonymous classes that extend a class or implement an interface now\
    \ reflect that fact by changing the label that's assigned to the anonymous class\
    \ to Xyz@anonymous, where Xyz is the name of the class or interface. If the anonymous\
    \ class implements more than one interface, only the first interface will appear.\
    \ If the anonymous class extends a class and also implements one or more interfaces,\
    \ the name of the class it extends will appear in its label. The following table\
    \ summarizes these possibilities:\n\n| Context | New Name |\n|---|---|\n| extends\
    \ Xyz | Xyz@anonymous |\n| implements Abc | Abc@anonymous |\n| implements Abc,\
    \ Def | Abc@anonymous |\n| extends Xyz implements Abc | Xyz@anonymous |\n\nTable\
    \ 9.4 – Anonymous class promotion\n\nBear in mind that PHP can already test the\
    \ anonymous class to see if it falls under a certain line of inheritance. The\
    \ instanceof operator, for example, can be used for this purpose. The following\
    \ example illustrates how to test the anonymous class for inheritance, as well\
    \ as how to view its new name:\n\n+   1. For this example, we will define a DirectoryIterator\
    \ instance that grabs a list of files from the current directory:\n+   2. Then,\
    \ we will define an anonymous class that extends FilterIterator. In this class,\
    \ we will define the accept() method, which produces a Boolean result. If the\
    \ result is TRUE, then that item will appear in the final iteration:\n\n```\n\
    // /repo/ch09/php8_oop_diff_anon_class_renaming.php\n$iter = new DirectoryIterator(__DIR__);\n\
    ```\n\n```\n$anon = new class ($iter) extends FilterIterator {\n    public $search\
    \ = '';\n    public function accept() {\n        return str_contains(\n      \
    \      $this->current(), $this->search);\n    }\n};\n```"
  merge: -1
  img_proc: true
- pgno: 381
  md: "3. Next, we will produce a list of files that contain bc_break in their name:\n\
    \n```\n$anon->search = 'bc_break';\nforeach ($anon as $fn) echo $fn . \"\\n\"\
    ;\n```\n\n4. In the next two lines, we will use instanceof to test whether the\
    \ anonymous class implements OuterIterface:\n\n```\nif ($anon instanceof OuterIterator)\n\
    \    echo \"This object implements OuterIterator\\n\";\n```\n\n5. Finally, we\
    \ will simply dump the contents of the anonymous class using var_dump():\n\n```\n\
    echo var_dump($anon);\n```\n\nHere is the output running under PHP 8. We cannot\
    \ run this example in PHP 7 as that version lacks the str_contains() function!\n\
    \n```\nroot@php8_tips_php8 [ /repo/ch09 ]#\nphp php8_oop_diff_anon_class_renaming.php\n\
    php8_bc_break_construct.php\nphp8_bc_break_serialization.php\nphp8_bc_break_destruct.php\n\
    php8_bc_break_sleep.php\nphp8_bc_break_scanner.php\nphp8_bc_break_serializable.php\n\
    php8_bc_break_magic_wrong.php\nphp8_bc_break_magic.php\nphp8_bc_break_magic_to_string.php\n\
    This object implements OuterIterator\nobject(FilterIterator@anonymous)#2 (1) {\n\
    \    [\"search\"]=> string(8) \"bc_break\"\n}\n```\n\nAs you can see, instanceof\
    \ correctly reports that the anonymous class implements OuterInterface (because\
    \ it extends FilterIterator, which, in turn, implements OuterInterface). You can\
    \ also see that var_dump() reports the name of the anonymous class as FilterIterator@anonymous."
  merge: -1

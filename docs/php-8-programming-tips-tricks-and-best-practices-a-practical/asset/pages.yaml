    \nFigure 2.5 – array_slice() example using PHP 7\n\nNotice here the massive performance\
    \ difference when running the same code under PHP 8:\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_92_1.png)\n\
    \nFigure 2.6 – array_slice() example using PHP 8\n\n> **Important note**\n> \n\
    > The new algorithm is only effective if the array does not contain elements with\
    \ a NULL value. If the array contains NULL elements, the old algorithm is triggered,\
    \ and a sequential iteration occurs.\n\nLet's now turn our attention to some excellent\
    \ new string functions."

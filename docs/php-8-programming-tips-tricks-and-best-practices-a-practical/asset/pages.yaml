    You now know how DateTimeImmutable might be used, and you also have an idea of
    how to convert into DateTime. You''ll be pleased to know that in PHP 8, the conversion
    between the two object types has been made much easier with the introduction of
    the createFromInterface() method.


    # Examining the createFromInterface() method


    In PHP 8, it''s much easier to convert between DateTime and DateTimeImmutable,
    and back again. A new method called createFromInterface() has been added to both
    classes. The method signature simply calls for a DateTimeInterface instance, which
    means that instances of either DateTime or DateTimeImmutable are acceptable arguments
    for this method.


    The following brief code example demonstrates how easy it is to convert from one
    type into another in PHP 8:


    +   1. First, let''s define a DateTimeImmutable instance and echo its class and
    date:


    ```

    ```php

    // /repo/ch09/php8_date_time.php

    $fmt = ''l, d M Y'';

    $dti = new DateTimeImmutable(''last day of next month'');

    echo $dti::class . '':'' . $dti->format($fmt) . "\n";

    ```

    ```'

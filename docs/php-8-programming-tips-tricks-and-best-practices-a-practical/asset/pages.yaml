    The most important thing to take away from this illustration is that you need
    to find a balance between the number of characters to compare and the nature of
    the data you are comparing. The fewer characters compared, the faster the overall
    operation. However, if the nature of the data is such that erroneous results are
    possible, you must increase the character count and suffer a slight loss in performance.


    Let''s now have a look at gathering information from FFI extension data.


    # Extracting information from FFI extension data


    When you are using FFI instances and native C data structures, native PHP informational
    methods such as strlen() and ctype_digit() do not yield useful information. Accordingly,
    the FFI extension includes three methods designed to produce information about
    FFI extension data. These three methods are summarized here in Table 4.3:


    | FFI Method | Returns | Notes |

    |---|---|---|

    | alignof() | int | Returns the alignment of an FFI\CType or FFI\CData instance.
    A great way to visualize the return value would be the block size in memory. |

    | sizeof() | int | Returns the amount of memory used by an FFI\CType or FFI\CData
    instance. |

    | typeof() | FFI\CType | Returns the data type of an FFI\CData object. The data
    type returned is not a PHP native data type. Instead what''s returned is an FFI\CType
    instance that identifies the C data type. |


    Table 4.3 – Summary of FFI class informational methods


    We first look at FFI::typeof(), after which we dive into the other two methods.'

- pgno: 317
  md: 'The remainder of the code example is exactly the same as described earlier
    and is not shown here. Likewise, the output is exactly the same. The performance
    time is also approximately the same.


    We now turn our attention to money_format().


    # Working with money_format()


    The money_format() function, first introduced in PHP 4.3, is designed to display
    monetary values using international currencies. If you are maintaining an international
    PHP-based website that has any financial transactions, you might be affected by
    this change after a PHP 8 update.


    The latter was introduced in PHP 5.3, and should thus not cause your code to break.
    Let''s have a look at a simple example involving money_format() and how it can
    be rewritten to work in PHP 8, as follows:


    +   1. We first assign an amount to a $amt variable. We then set the monetary
    locale to en_US (**United States**, or **US**) and echo the value using money_format().
    We use the %n format code for national formatting, followed by the %i code for
    international rendering. In the latter case, the **International Organization
    for Standardization (ISO)** currency code (**US Dollars**, or **USD**) is displayed.
    The code is illustrated in the following snippet:

    +   2. We then change the monetary locale to de_DE (Germany) and echo the same
    amount in both national and international formats, as follows:


    ```

    ```php

    // /repo/ch08/php7_money_format.php

    $amt = 1234567.89;

    setlocale(LC_MONETARY, ''en_US'');

    echo "Natl: " . money_format(''%n'', $amt) . "\n";

    echo "Intl: " . money_format(''%i'', $amt) . "\n";

    ```

    ```


    ```

    ```php

    setlocale(LC_MONETARY, ''de_DE'');

    echo "Natl: " . money_format(''%n'', $amt) . "\n";

    echo "Intl: " . money_format(''%i'', $amt) . "\n";

    ```

    ```'

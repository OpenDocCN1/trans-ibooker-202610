    # Examining changes to implode()


    Two widely used PHP functions perform array to string conversion and the reverse:
    explode() converts a string to an array, and implode() converts an array to a
    string. However, there lurks a deep dark secret with the implode() function: its
    two parameters can be expressed in any order!'

    \nAs you can see from the output, Closure simply ignored the attempt to bind another\
    \ class and produced the expected output. In addition, a Warning message was generated,\
    \ notifying you of the illegal bind attempt.\n\nLet's now have a look at differences\
    \ in comment handling.\n\n# Differences in comment handling\n\nPHP has traditionally\
    \ supported a number of symbols to denote comments. One such symbol is the hash\
    \ sign (#). Due to the introduction of a new language construct known as Attributes,\
    \ however, the hash sign immediately followed by an opening square bracket (#\
    \ [) is no longer allowed to denote a comment. Support for the hash sign not immediately\
    \ followed by an opening square bracket continues to serve as a comment delimiter.\n\
    \nHere is a brief example that works in PHP 7 and earlier, but not in PHP 8:\n\
    \n```\n// /repo/ch08/php7_hash_bracket_comment.php\ntest = new class() {\n   \
    \ # This works as a comment\n    public $works = 'OK';\n    #[ This does not work\
    \ in PHP 8 as a comment]\n    public $worksPhp7 = 'OK';\n```"

- pgno: 445
  md: "4. Finally, we turn to by far the most complex method, which scans for invalid\
    \ magic method signatures. The primary problem is that the method signatures vary\
    \ widely, thus we need to build separate regular expressions to properly test\
    \ validity. The regular expressions are stored in the BC break configuration file.\
    \ If a magic method is detected, we retrieve its correct signature and add that\
    \ to $this->messages.\n\n5. First, we check to see if there are any magic methods\
    \ by looking for anything that matches function __:\n\n```\npublic function scanMagicSignatures()\
    \ : int {\n    $found  = 0;\n    $matches = [];\n    $result  = preg_match_all(\n\
    \        '/function __(.+?)\\b/',\n        $this->contents, $matches);\n```\n\n\
    6. If the array of matches is not empty, we loop through the set of matches and\
    \ assign to $key the magic method name:\n\n```\nif (!empty($matches[1])) {\n \
    \   $config = $this->config[self::KEY_MAGIC] ?? NULL;\n    foreach ($matches[1]\
    \ as $name) {\n        $key = '__' . $name;\n```\n\n7. If the configuration key\
    \ matching this presumed magic method is not set, we assume it's either not a\
    \ magic method, or is a method not in the configuration file, and thus nothing\
    \ to worry about. Otherwise, if a key is present, we extract a substring representing\
    \ the method call that is assigned to $sub:\n\n```\nif (empty($config[$key]))\
    \ continue;\nif ($pos = strpos($this->contents, $key)) {\n    $end = strpos($this->contents,\n\
    \        '{', $pos);\n    $sub = (empty($sub) || !is_string($sub))\n        ?\
    \ '' : trim($sub);\n```"

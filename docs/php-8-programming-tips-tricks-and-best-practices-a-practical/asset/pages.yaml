    Let’s now have a look at another aspect of resource-to-object migration: its effect
    on iteration.


    # Traversable to IteratorAggregate migration


    The Traversable interface was first introduced in PHP 5. It has no methods and
    was mainly created to allow objects to iterate using a simple foreach() loop.
    As PHP development continues to evolve, a need often arises to obtain the inner
    iterator. Accordingly, in PHP 8, many classes that formerly implemented Traversable
    now implement IteratorAggregate instead.'

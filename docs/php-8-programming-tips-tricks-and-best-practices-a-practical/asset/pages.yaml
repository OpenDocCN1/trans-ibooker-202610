- pgno: 178
  md: '# Navigating changes in magic methods


    PHP **magic methods** are predefined hooks that interrupt the normal flow of an
    OOP application. Each magic method, if defined, alters the behavior of the application
    from the minute the object instance is created, up until the point where the instance
    goes **out of scope**.


    > **Important note**

    > An object instance goes *out of scope* when it''s unset or overwritten. Object
    instances also go out of scope when defined in a function or class method, and
    the execution of that function or class method ends. Ultimately, if for no other
    reason, an object instance goes out of scope when the PHP program ends.


    This section will give you a solid understanding of important changes to magic
    method usage and behavior introduced in PHP 8. Once you understand the situations
    described in this section, you will be in a position to make the appropriate code
    modifications to prevent your application code from failing should you migrate
    to PHP 8.


    Let''s first have a look at changes to the object construct method.


    # Dealing with constructor changes


    Ideally, the **class constructor** is a method that''s called automatically when
    the object instance is created and is used to perform some sort of object initialization.
    This initialization most typically involves populating object properties with
    values supplied as arguments to this method. The initialization could also perform
    any necessary tasks such as opening file handles, establishing a database connection,
    and so forth.


    In PHP 8, a number of changes in how the class constructor is invoked have been
    made. This means there''s a potential for a backwards compatibility break when
    you migrate your application to PHP 8. The first change we''ll examine has to
    do with deprecated usage of a method with the same name as the class being used
    as the class constructor.


    # Handling changes in a method and class of the same name


    In the first PHP OOP implementation, introduced in PHP version 4, it was determined
    that a method with the same name as the class would assume the role of class constructor,
    and would be automatically called when a new object instance was created.


    It''s a little known fact that, even in PHP 8, functions, methods, and even class
    names, are *case-insensitive*. Thus `$a = new ArrayObject();` is equivalent to
    `$b = new arrayobject();`. Variable names, on the other hand, are case-sensitive.'
  merge: -1
  img_proc: true
- pgno: 179
  md: "Starting with PHP 5, along with a new and much more robust OOP implementation,\
    \ magic methods were introduced. One of these methods is __construct(), specifically\
    \ reserved for class construction, designed to replace the older usage. Using\
    \ a method with the same name as the class as a constructor was supported through\
    \ the remaining versions of PHP 5, and all the way through all versions of PHP\
    \ 7 as well.\n\nIn PHP 8, support for a class constructor method with the same\
    \ name as the class itself has been removed. If a __construct() method is also\
    \ defined, you will have no problem: __construct() takes precedence as a class\
    \ constructor. If there is no __construct() method, and you detect a method with\
    \ the same name as the class(), you have the potential for failure. Please bear\
    \ in mind that both method and class names are case-insensitive!\n\nHave a look\
    \ at the following example. It works in PHP 7 but not in PHP 8:\n\n+   1. First,\
    \ we define a Text class with a class constructor method of the same name. The\
    \ constructor method creates an SplFileObject instance based upon the supplied\
    \ filename:\n+   2. We then add three lines of procedural code to exercise the\
    \ class, supplying the filename of a file containing the Gettysburg Address:\n\
    \n```\n// /repo/ch05/php8_oop_bc_break_construct.php\nclass Text {\n    public\
    \ $fh = '';\n    public const ERROR_FN = 'ERROR: file not found';\n    public\
    \ function text(string $fn) {\n        if (!file_exists($fn))\n            throw\
    \ new Exception(self::ERROR_FN);\n        $this->fh = new SplFileObject($fn, 'r');\n\
    \    }\n    public function getText() {\n        return $this->fh->fpassthru();\n\

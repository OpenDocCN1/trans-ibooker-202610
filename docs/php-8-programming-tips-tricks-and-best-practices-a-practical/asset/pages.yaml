- pgno: 186
  md: '> **Tip**

    > For more information on magic methods, have a look at this documentation page:
    https://www.php.net/manual/en/language.oop5.magic.php.


    Now that you have an understanding of the situations where PHP 8 code involving
    magic methods could cause a code break, let''s have a look at changes in the serialization
    process.


    # Taking control of serialization


    There are many times when native PHP data needs to be stored in a file, or in
    a database table. The problem with current technology is that direct storage of
    complex PHP data such as objects or arrays is simply not possible, with some exceptions.


    One way to overcome this limitation is to convert the object or array into a string.
    **JSON (JavaScript Object Notation)** is often chosen for this reason. Once the
    data has been converted into a string, it can easily be stored in any file or
    database. However, there is a problem with formatting objects with JSON. Although
    JSON is able to represent object properties well enough, it''s incapable of directly
    restoring the original object''s class and methods.


    To address this deficiency, the PHP language includes two native functions, `serialize()`
    and `unserialize()`, that can easily convert objects or arrays into a string and
    restore them back to their original state. As wonderful as this sounds, there
    are a number of issues associated with native PHP serialization.


    Before we can properly discuss the problem with the existing PHP serialization
    architecture, we need to have a closer look at how native PHP serialization works.


    # Understanding PHP serialization


    When a PHP object or array needs to be saved to a non-OOP environment such as
    a flat file or relational database table, `serialize()` can be used to *flatten*
    an object or array into a string, suitable for storage. Conversely, `unserialize()`
    restores the original object or array.'
  merge: -1
  img_proc: true
- pgno: 187
  md: "Here is a simple example that demonstrates this concept:\n\n+   1. First, we\
    \ define a class with three properties:\n+   2. We then create an instance, serialize\
    \ the instance, and display the resulting string:\n+   3. Here is how the serialized\
    \ object appears:\n+   4. We then unserialize the object into a new variable and\
    \ use var_dump() to examine the two:\n\n```\n// /repo/ch05/php8_serialization.php\n\
    class Test {\n    public $name = 'Doug';\n    private $key = 12345;\n    protected\
    \ $status = ['A','B','C'];\n}\n```\n\n```\n$test = new Test();\n$str = serialize($test);\n\
    echo $str . \"\\n\";\n```\n\n```\nO:4:\"Test\":3:{s:4:\"name\";s:4:\"Doug\";s:9:\"\
    Testkey\";\ni:12345;\ns:9:\"*status\";a:3:{i:0;s:1:\"A\";i:1;s:1:\"B\";i:2;s:1:\"\
    C\";}}\n```\n\nAs you can see from the serialized string, the letter O designates\
    \ Object, a is for array, s is for string and i is for integer.\n\n```\n$obj =\
    \ unserialize($str);\nvar_dump($test, $obj);\n```"

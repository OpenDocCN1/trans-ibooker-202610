  md: 'As you can see from the preceding output, in the PHP 7.1 Docker container we
    use for the book, 87 encodings are supported. In the PHP 8.0 Docker container
    (output not shown), 80 encodings are supported. Let''s now have a look at the
    changes introduced in PHP 8, starting with the mb_str*() functions.


    # Discovering needle-argument differences in mb_str*() functions


    In Chapter 6, Understanding PHP 8 Functional Differences, you learned how PHP
    8 introduced changes to needle-argument handling in the core str*pos(), str*str(),
    and str*chr() functions. The two primary needle-argument differences are the ability
    to accept an empty needle argument and strict type checking to ensure the needle
    argument is a string only. In order to maintain consistency, PHP 8 introduces
    the same changes in the corresponding mb_str*() functions.


    Let''s have a look at empty needle-argument handling first.


    # mb_str*() function empty needle-argument handling


    To keep the mbstring extension in line with this change to the core string functions,
    the following mbstring extension functions now allow an empty needle argument.
    It''s important to note that this doesn''t mean the argument can be omitted or
    is optional! What is meant by this change is that any value supplied as the needle
    argument can now also include what is considered empty. A good, quick way to learn
    what PHP considers to be empty can be found in the documentation for the empty()
    function (https://www.php.net/empty). Here is a list of mbstring functions that
    now allow an empty needle-argument value:


    +   - `mb_strpos()`

    +   - `mb_strrpos()`

    +   - `mb_stripos()`

    +   - `mb_strripos()`

    +   - `mb_strstr()`

    +   - `mb_stristr()`

    +   - `mb_strrchr()`

    +   - `mb_strrichr()`'

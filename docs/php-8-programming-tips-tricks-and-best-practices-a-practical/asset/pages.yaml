- pgno: 438
  md: "In our BC break scan configuration array, the callback takes the form of an\
    \ anonymous function. It accepts the file contents as an argument. We then assign\
    \ the callback to an array configuration key and include the warning message to\
    \ be delivered if the callback returns TRUE:\n\n```\n```php\n// /repo/ch11/bc_break_scanner.config.php\n\
    return [\n    // not all keys are shown\n    BreakScan::KEY_CALLBACK => [\n  \
    \      'ERR_CONST_EXIT' => [\n            'callback' => function ($contents) {\n\
    \                $ptn = '/__construct.*?\\{.*? (die|exit).*?}/im';\n         \
    \       return (preg_match($ptn, $contents)\n                    && strpos('__destruct',\
    \ $contents)); },\n            'msg' => 'WARNING: __destruct() might not get '\n\
    \                . 'called if \"die()\" or \"exit()\" used '\n               \
    \ . 'in __construct()',\n        ], // etc.\n        // not all entries are shown\n\
    ];\n```\n```\n\nIn our BC break scanner class (discussed next), the logic needed\
    \ to invoke the callbacks might appear as follows:\n\n```\n```php\n$contents =\
    \ file_get_contents(FILE_TO_SEARCH);\n$className = 'SOME_CLASS';\nforeach ($config['callbacks']\
    \ as $key => $value)\n    if ($value['callback']($contents)) echo $value['msg'];\n\
    ```\n```\n\nIf the requirements to detect additional potential BC breaks are beyond\
    \ the capabilities of a callback, we would then define a separate method directly\
    \ inside the BC break scan class.\n\nAs you can see, it's possible to develop\
    \ a configuration array that supports not only simple strpos() searches, but also\
    \ searches of greater complexity using an array of callbacks.\n\nNow that you\
    \ have an idea of what would go into a configuration array, it's time to define\
    \ the main class that performs the break scanning."

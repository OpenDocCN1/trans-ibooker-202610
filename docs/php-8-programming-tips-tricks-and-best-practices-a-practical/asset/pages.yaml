- pgno: 205
  md: "> Tip\n> For a full explanation of how variance support is applied in PHP 7.4\
    \ and PHP 8, have a look here: https://wiki.php.net/rfc/covariant-returns-and-contravariant-parameters.\n\
    \nWe'll now have a look at changes to the SPL and how those changes can have an\
    \ impact on application performance after migrating to PHP 8.\n\n# Handling Standard\
    \ PHP Library (SPL) changes\n\nThe SPL is an extension that contains key classes\
    \ that implement basic data structures and enhance OOP functionality. It was first\
    \ introduced in PHP 5 and is now included by default in all PHP installations.\
    \ Covering the entire SPL is beyond the scope of this book. Instead, in this section,\
    \ we discuss where significant changes have occurred in the SPL when running PHP\
    \ 8. In addition, we give you tips and guidance on SPL changes that have the potential\
    \ to cause your existing applications to stop working.\n\nWe start by examining\
    \ changes to the SplFileObject class.\n\n# Understanding changes to SplFileObject\n\
    \nSplFileObject is an excellent class that incorporates most of the standalone\
    \ f*() functions, such as fgets(), fread(), fwrite(), and so forth, into a single\
    \ class. SplFileObject::__construct() method arguments mirror the arguments provided\
    \ to the fopen() function.\n\nThe main difference in PHP 8 is that a relatively\
    \ obscure method, fgetss(), has been removed from the SplFileObject class. The\
    \ SplFileObject::fgetss() method, available in PHP 7 and below, mirrors the standalone\
    \ fgetss() function in that it combines fgets() with strip_tags().\n\nFor the\
    \ sake of illustration, let's assume you have created a website that allows users\
    \ to upload text files. Before displaying content from the text file, you wish\
    \ to remove any markup tags. Here is an example that uses the fgetss() method\
    \ to accomplish this:\n\n+   1. We first define a block of code that acquires\
    \ the filename:\n\n```\n// /repo/ch05/php7_spl_splfileobject.php\n$fn = $_GET['fn']\
    \ ?? '';\nif (!$fn || !file_exists($fn))\n    exit('Unable to locate file');\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 206
  md: "2. We then create the SplFileObject instance, and read the file line by line\
    \ using the fgetss() method. At the end, we echo the safe contents:\n\n```\n$obj\
    \ = new SplFileObject($fn, 'r');\n$safe = '';\nwhile ($line = $obj->fgetss())\
    \ $safe .= $line;\necho '<h1>Contents</h1><hr>' . $safe;\n```\n\n3. Let's say\
    \ that the file to be read is this:\n\n```\n<h1>This File is Infected</h1>\n<script>alert('You\
    \ Been Hacked');</script>\n<img src=\"http://very.bad.site/hacked.php\" />\n```\n\
    \n4. Here is the output running in PHP 7.1 using this URL:\n\nhttp://localhost:7777/ch05/php7_spl_splfileobject.php?\n\
    fn=includes/you_been_hacked.html\n\nAs you can see from the output shown next,\
    \ all HTML markup tags have been removed:\n\n![](img/dbf2674d5b31107c344104b5edcb21c5_206_0.png)\n\
    \nFigure 5.1 – Result after reading a file using SplFileObject::fgetss()\n\nTo\
    \ accomplish the same thing in PHP 8, the code shown previously would need to\
    \ be modified by replacing fgetss() with fgets(). We would also need to use strip_tags()\
    \ on the line concatenated to $safe. Here is how the modified code might appear:\n\
    \n```\n// /repo/ch05/php8_spl_splfileobject.php\n$fn = $_GET['fn'] ?? '';\nif\
    \ (!$fn || !file_exists($fn))\n    exit('Unable to locate file');\n```"
  merge: -1

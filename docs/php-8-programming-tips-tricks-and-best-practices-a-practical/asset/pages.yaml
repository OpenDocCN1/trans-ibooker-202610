    # Understanding the dangers inherent to PHP callbacks


    It’s important to understand that the C functions defined in the various PHP shared
    libraries are often used by multiple PHP functions. Accordingly, if you override
    one of the low-level functions at the C level, you might experience unexpected
    behavior in your PHP application.


    Another known issue is that overriding native PHP C functions has a high probability
    of producing memory leaks. Over time, a long-running application that uses such
    overrides can fail, and can potentially crash the server!


    A final consideration is that the PHP callback capability is not supported on
    all FFI platforms. Accordingly, although the code might work on a Linux server,
    it might not work (or might not work the same) on a Windows server.


    > **Tip**


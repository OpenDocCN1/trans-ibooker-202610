- pgno: 93
  md: "# Detecting string beginning, middle, and end\n\nSomething PHP developers deal\
    \ with on a constant basis is having to check for sets of characters that appear\
    \ at the beginning, middle, or end of a string. The problem with the current set\
    \ of string functions is that they are *not designed* to deal with the presence\
    \ or absence of a substring. Rather, the current set of functions is designed\
    \ to determine the *position* of a substring. This, in turn, can then be interpolated\
    \ in a Boolean manner to determine the presence or absence of a substring.\n\n\
    The problem with this approach is summarized in a famous quote attributed to Sir\
    \ Winston Churchill:\n\n> \"Golf is a game whose aim is to hit a very small ball\
    \ into an ever smaller hole, with weapons singularly ill-designed for the purpose.\"\
    \n> \n> – Winston S. Churchill\n\nLet's now have a look at three incredibly useful\
    \ new string functions that address this issue.\n\n# str_starts_with()\n\nThe\
    \ first function we examine is `str_starts_with()`. To illustrate its use, consider\
    \ a code example where we're looking for `https` at the beginning and `login`\
    \ at the end, as illustrated in the following code snippet:\n\n```\n// /repo/ch02/php7_starts_ends_with.php\n\
    $start = 'https';\nif (substr($url, 0, strlen($start)) !== $start)\n    $msg .=\
    \ \"URL does not start with $start\\n\";\n// not all code is shown\n```\n\nAs\
    \ we mentioned in the introduction to this section, in order to determine if a\
    \ string starts with `https`, we need to invoke both `substr()` and `strlen()`.\
    \ Neither function is designed to give us the desired answer. Further, having\
    \ to use both functions introduces inefficiency in our code and results in a needless\
    \ resource utilization increase.\n\nThe same code can be written in PHP 8, as\
    \ follows:\n\n```\n// /repo/ch02/php8_starts_ends_with.php\n$start = 'https';\n\
    if (!str_starts_with($url, $start))\n    $msg .= \"URL does not start with $start\\\
    n\";\n// not all code is shown\n```"
  merge: -1
  img_proc: true
- pgno: 94
  md: "# str_ends_with()\n\nIn a similar vein to `str_starts_with()`, PHP 8 has introduced\
    \ a new function, `str_ends_with()`, that can be used to determine if the end\
    \ of a string matches some value. To illustrate the usefulness of this new function,\
    \ consider old PHP code using `strrev()` and `strpos()`, which might appear as\
    \ follows:\n\n```\n$end = 'login';\nif (strpos(strrev($url), strrev($end)) !==\
    \ 0)\n    $msg .= \"URL does not end with $end\\n\";\n```\n\nIn an operation,\
    \ both `$url` and `$end` need to be reversed, a process that can gets progressively\
    \ more expensive in direct proportion to the length of the string. Also, as mentioned\
    \ earlier, the purpose of `strpos()` is to return the *position* of a substring,\
    \ not to determine its presence or absence.\n\nThe same functionality is achieved\
    \ as follows in PHP 8:\n\n```\nif (!str_ends_with($url, $end))\n    $msg .= \"\
    URL does not end with $end\\n\";\n```\n\n# str_contains()\n\nThe last function\
    \ in this context is `str_contains()`. As we've discussed, in PHP 7 and earlier\
    \ there was no specific PHP function that tells you whether or not a substring\
    \ exists within a string, aside from `preg_match()`.\n\nThe problem with using\
    \ `preg_match()`, as we've all been warned time and again, is performance degradation.\
    \ In order to process a *regular expression*, `preg_match()` needs to first analyze\
    \ the pattern. It then has to perform a second pass in order to determine which\
    \ part of the string matches the pattern. This is an enormously expensive operation\
    \ in terms of time and resource utilization.\n\n> **Important note**\n> \n> When\
    \ we mention that an operation is *expensive* in terms of time and resources,\
    \ please bear in mind that if your script only consists of a few dozen lines of\
    \ code and/or you are not repeating the operation thousands of times in a loop,\
    \ chances are that you will not see any significant performance gains using the\
    \ new functions and techniques described in this section."
  merge: -1
  img_proc: true

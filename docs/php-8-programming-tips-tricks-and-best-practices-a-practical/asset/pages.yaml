    \ this chapter dealt with core functionality that has been removed. The rationale\
    \ for the change was explained, and you learned that the main reason for removing\
    \ the functionality described in this chapter is not only to move you toward code\
    \ that follows best practices but to have you use PHP 8 functionality that is\
    \ faster and more efficient."

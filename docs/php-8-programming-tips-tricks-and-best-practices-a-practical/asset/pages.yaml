- pgno: 247
  md: "```\n}\narray(3) {\n    [-3]=> string(3) \"CCC\"\n    [-2]=> string(3) \"BBB\"\
    \n    [-1]=> string(3) \"AAA\"\n}\n```\n\n6. As you can see from the output, the\
    \ array indexes are automatically assigned, incremented by a value of 1, making\
    \ the two arrays identical.\n\n> Tip\n> For more information on this enhancement,\
    \ have a look at this article:\n> https://wiki.php.net/rfc/negative_array_index.\n\
    \nNow that you are aware of the potential code break regarding auto-assignment\
    \ of indexes involving negative values, let’s turn our attention to the other\
    \ area of interest: the use of curly braces.\n\n# Handling curly brace usage changes\n\
    \nCurly braces ({ }) are a familiar sight for any developer creating PHP code.\
    \ The PHP language, written in C, makes extensive use of C syntax, including curly\
    \ braces. It is well known that curly braces are used to delineate blocks of code\
    \ in control structures (for example, if { }), in loops (for example, for () {\
    \ }), in functions (for example, function xyz() { }), and classes.\n\nIn this\
    \ subsection, however, we will restrict our examination of curly brace usage to\
    \ that associated with variables. One potentially significant change in PHP 8\
    \ is the use of curly braces to identify an array element. The use of curly braces\
    \ to designate array offsets is now deprecated as of PHP 8.\n\nThe old usage has\
    \ been highly contentious given the following:\n\n+   - Its use can easily be\
    \ confused with the use of curly braces inside doubly quoted strings.\n+   - Curly\
    \ braces cannot be used to make array assignments.\n\nAccordingly, the PHP core\
    \ team needed to either make the use of curly braces consistent with square brackets\
    \ ([ ]) ... or just get rid of this curly brace usage. The final decision was\
    \ to remove support for curly braces with arrays."

  md: "8. However, if we then attempt to unserialize the object, another error occurs:\n\
    \n```\nPHP Fatal error: Uncaught Error: Call to a member function rewind() on\
    \ null in /repo/ch05/php8_serialization_wakeup.php:13\n```\n\nThe problem, of\
    \ course, is that the file handle was lost during serialization. When the object\
    \ was unserialized, the __construct() method was not called.\n\n9. This is exactly\
    \ why the __wakeup() magic method exists. To resolve the error, we define a __wakeup()\
    \ method that calls the __construct() method:\n\n```\npublic function __wakeup()\
    \ {\n    self::__construct();\n}\n```\n\n10. If we rerun the code, we now see\
    \ the Gettysburg Address twice (not shown).\n\nNow you have an idea of how PHP\
    \ native serialization works, and also know a bit about the __sleep() and __wakeup()\
    \ magic methods, as well as potential code breaks. Let’s now have a look at an\
    \ interface that was designed to facilitate the custom serialization of objects.\n\
    \n# Introducing the Serializable interface\n\nIn order to facilitate the serialization\
    \ of objects, the Serializable interface was added to the language beginning with\
    \ PHP 5.1. The idea behind this interface was to provide a way of identifying\
    \ objects that had the ability to serialize themselves. In addition, the methods\
    \ specified by this interface were designed to provide some degree of control\
    \ over object serialization.\n\nAs long as a class implements this interface,\
    \ developers are assured that two methods are defined: serialize() and unserialize().\
    \ Here is the interface definition:\n\n```\ninterface Serializable {\n    public\
    \ serialize() : string|null\n    public unserialize (string $serialized) : void\n\
    }\n```"

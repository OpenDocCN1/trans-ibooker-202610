- pgno: 130
  md: "In the following code example, we define an error handler that reports on the\
    \ received error number and string when it's invoked. In addition, we also display\
    \ the value returned by error_reporting():\n\n```\n```php\n// /repo/ch03/php8_at_silencer_err_rep.php\n\
    function handler(int $errno , string $errstr) {\n    $report = error_reporting();\n\
    \    echo 'Error Reporting : ' . $report . \"\\n\";\n    echo 'Error Number  \
    \   : ' . $errno . \"\\n\";\n    echo 'Error String     : ' . $errstr . \"\\n\"\
    ;\n    if (error_reporting() == 0) {\n        echo \"IF statement works!\\n\"\
    ;\n    }\n}\n```\n```\n\nAs before, we define a bad() function that deliberately\
    \ triggers an error, and then call the function using the @ operator, as follows:\n\
    \n```\n```php\nfunction bad() {\n    trigger_error('We Be Bad', E_USER_ERROR);\n\
    }\nset_error_handler('handler');\necho @bad();\n```\n```\n\nIn PHP 7, you'll note\
    \ that error_reporting() returns 0, thus causing IF statement works! to appear\
    \ in the output, as illustrated here:\n\n```\n```\nroot@root@php8_tips_php7 [\
    \ /repo/ch03 ] #\nphp php8_at_silencer_err_rep.php\nError Reporting : 0\nError\
    \ Number     : 256\nError String     : We Be Bad\nIF statement works!\n```\n```"
  merge: -1

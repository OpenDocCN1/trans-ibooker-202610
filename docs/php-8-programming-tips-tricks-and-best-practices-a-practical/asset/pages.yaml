- pgno: 360
  md: "In this example, the extended ::class syntax is used to determine the type\
    \ of error that's thrown:\n\n+   1. When an Error or Exception is thrown, it's\
    \ best practice to make an entry in the error log. In this example, which works\
    \ in both PHP 7 and PHP 8, the class name of this Error or Exception is included\
    \ in the log message:\n\n```\n```php\n// /repo/ch09/php7_class_and_obj.php\ntry\
    \ {\n    $pdo = new PDO();\n    echo 'No problem';\n} catch (Throwable $t) {\n\
    \    $msg = get_class($t) . ':' . $t->getMessage();\n    error_log($msg);\n}\n\
    ```\n```\n\n+   2. In PHP 8, you can achieve the same result by rewriting the\
    \ example, as follows:\n\n```\n```php\n// /repo/ch09/php8_class_and_obj.php\n\
    try {\n    $pdo = new PDO();\n    echo 'No problem';\n} catch (Throwable $t) {\n\
    \    $msg = $t::class . ':' . $t->getMessage();\n    error_log($msg);\n}\n```\n\
    ```\n\nAs you can see from the second block of code, the syntax is more concise\
    \ and avoids the use of a procedural function. We must stress, however, that in\
    \ this example, there is no performance gain.\n\nNow that you are aware of changes\
    \ in special ::class constant usage, let's have a quick look at commas."
  merge: -1

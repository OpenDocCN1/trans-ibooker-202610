    \ $key . ':' . $val . ',';\n        $opts = substr($tmp, 0, -1);\n        break;\n\
    \    case (is_bool($opts)) :\n        $opts = ($opts) ? 'TRUE' : 'FALSE';\n  \
    \      break;\n    case ($opts === '') :\n        $opts = \"''\";\n        break;\n\
    ```\n```"

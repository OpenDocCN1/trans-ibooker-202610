- pgno: 318
  md: "Here is the output in PHP 7.1:\n\n```\nroot@php8_tips_php7 [ /repo/ch08 ]#\
    \ php php7_money_format.php\nNatl: $1,234,567.89\nIntl: USD 1,234,567.89\nNatl:\
    \ 1.234.567,89 EUR\nIntl: 1.234.567,89 EUR\n```\n\nYou might note from the output\
    \ that money_format() did not render the Euro symbol, only the ISO code (EUR).\
    \ It did, however, properly format the amounts, using a comma for the thousands\
    \ separator, a period for the decimal separator for the en_US locale, and the\
    \ reverse for the de_DE locale.\n\nA best practice is to replace any usage of\
    \ money_format() with NumberFormatter::formatCurrency(). Here is the preceding\
    \ example, rewritten to work in PHP 8. Please note that the same example will\
    \ also work in any version of PHP from 5.3 onward! We'll proceed as follows:\n\
    \n+   1. First, we assign the amount to $amt and create a NumberFormatter instance.\
    \ In creating this instance, we supply arguments that indicate the locale and\
    \ type of number—in this case, currency. We then use the formatCurrency() method\
    \ to produce the national representation of this amount, as illustrated in the\
    \ following code snippet:\n+   2. In order to produce the ISO currency code—in\
    \ this case, USD—we need to use the setSymbol() method. Otherwise, the default\
    \ is to produce the $ currency symbol instead of the USD ISO code. We then use\
    \ the format() method to render the output. Note the trailing space after USD\
    \ in the following code snippet. This is to prevent the ISO code from running\
    \ into the number when echoed!\n\n```\n// /repo/ch08/php8_number_formatter_fmt_curr.php\n\
    $amt = 1234567.89;\n$fmt = new NumberFormatter('en_US',\n    NumberFormatter::CURRENCY\
    \ );\necho \"Natl: \" . $fmt->formatCurrency($amt, 'USD') . \"\\n\";\n```\n\n\
    ```\n$fmt->setSymbol(NumberFormatter::CURRENCY_SYMBOL,'USD ');\necho \"Intl: \"\
    \ . $fmt->format($amt) . \"\\n\";\n```"

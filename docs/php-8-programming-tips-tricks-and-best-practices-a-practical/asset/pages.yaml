- pgno: 372
  md: '2. Then, create a DateTime instance from $dti and add an interval of 90 days,
    displaying its class and current date:


    ```

    $dtt = DateTime::createFromInterface($dti);

    $dtt->add(new DateInterval(''P90D''));

    echo $dtt::class . '':'' . $dtt->format($fmt) . "\n";

    ```


    3. Finally, create a DateTimeImmutable instance from $dtt and display its class
    and date:


    ```

    $dtx = DateTimeImmutable::createFromInterface($dtt);

    echo $dtx::class . '':'' . $dtx->format($fmt) . "\n";

    ```


    Here is the output of this code example, running in PHP 8:


    ```

    root@php8_tips_php8 [/repo/ch09 ]# php php8_date_time.php

    DateTimeImmutable:Wednesday, 30 Jun 2021

    DateTime:Tuesday, 28 Sep 2021

    DateTimeImmutable:Tuesday, 28 Sep 2021

    ```


    As you can see, we used the same createFromInterface() method to create instances.
    Bear in mind, of course, that we are not actually converting the class instance
    into another. Instead, we are creating cloned instances, but of a different class
    type.


    You now know why you may want DateTimeImmutable instead of DateTime. You also
    know that in PHP 8, a new method called createFromInterface() provides a uniform
    way to create instances of one from the other. Next, we''ll have a look at how
    handling traits has been refined in PHP 8.


    # Understanding PHP 8 trait handling refinements


    The implementation of traits was first introduced in PHP version 5.4. Since that
    time, a continuous stream of refinements has been made. PHP 8 continues that trend
    by providing a means to clearly identify which methods are used when multiple
    traits have conflicting methods. Also, in addition to removing inconsistencies
    in visibility declarations, PHP 8 irons out problems in how traits handled (or
    did not handle!) abstract methods.'

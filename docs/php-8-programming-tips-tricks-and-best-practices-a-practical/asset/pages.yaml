- pgno: 439
  md: "# Developing a BC break scan class\n\nThe BreakScan class is oriented toward\
    \ a single file. In this class, we define methods that utilize the various break\
    \ scan configuration just covered. If we need to scan multiple files, the calling\
    \ program produces a list of files and passes them to BreakScan one at a time.\n\
    \nThe BreakScan class can be broken down into two main parts: methods that define\
    \ infrastructure, and methods that define how to conduct given scans. The latter\
    \ is primarily dictated by the structure of the configuration file. For each configuration\
    \ file section, we'll need a BreakScan class method.\n\nLet's have a look at the\
    \ infrastructural methods first.\n\n# Defining BreakScan class infrastructural\
    \ methods\n\nIn this section, we have a look at the initial part of the BreakScan\
    \ class. We also cover methods that perform infrastructure-related activities:\n\
    \n1. First, we set up the class infrastructure, placing it in the /repo/src/Php8/Migration\
    \ directory:\n\n```\n// /repo/src/Php8/Migration/BreakScan.php\ndeclare(strict_types=1);\n\
    namespace Php8\\Migration;\nuse InvalidArgumentException;\nuse UnexpectedValueException;\n\
    class BreakScan {\n```\n\n2. Next, we define a set of class constants to render\
    \ messages indicating the nature of any given post-scan failure:\n\n```\nconst\
    \ ERR_MAGIC_SIGNATURE = 'WARNING: magic method '\n    . 'signature for %s does\
    \ not appear to match '\n    . 'required signature';\nconst ERR_NAMESPACE = 'WARNING:\
    \ namespaces can no '\n    . 'longer contain spaces in PHP 8.';\nconst ERR_REMOVED\
    \ = 'WARNING: the following function'\n    . 'has been removed: %s. Use this instead:\
    \ %s';\n// not all constants are shown\n```"

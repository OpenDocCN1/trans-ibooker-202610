    \ and is not shown here. Let's now turn our attention to mbstring extension's\
    \ regular expression (regex)-handling differences.\n\n# Examining changes to mb_ereg*()\
    \ functions\n\nThe mb_ereg*() family of functions allows regex processing of strings\
    \ encoded using multi-byte character sets. In contrast, the core PHP language\
    \ provides the Perl Compatible Regular Expressions (PCRE) family of functions,\
    \ with modern and more up-to-date functionality.\n\nIf you add a u (lowercase\
    \ letter U) modifier to a regex pattern when using the PCRE functions, any UTF-8\
    \ encoded multi-byte character string is accepted. However, UTF-8 is the only\
    \ multi-byte character encoding accepted. If you are dealing with other character\
    \ encodings and wish to perform regex functionality, you will need to either convert\
    \ to UTF-8 or use the mb_ereg*() family of functions. Let's now have a look at\
    \ a number of changes to the mb_ereg*() family of functions.\n\n# Oniguruma library\
    \ required in PHP 8\n\nOne change to this family of functions is in how your PHP\
    \ installation is compiled. In PHP 8, your operating system must provide the libonig\
    \ library. This library provides Oniguruma functionality. (See https://github.com/kkos/oniguruma\
    \ for more information.) The older --with-onig PHP source-compile-configure option\
    \ has been removed in favor of using pkg-config to detect libonig."

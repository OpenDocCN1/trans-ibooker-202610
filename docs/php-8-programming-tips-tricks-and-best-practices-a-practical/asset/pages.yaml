    ;\nprintf(BreakScan::TOTAL_BREAKS, $found);\necho \"$messages\\n\";\nif ($csv)\n\
    \    $write($dir, $fn, $found, $messages);\nbreak;\ncase 0 :\ndefault :\n    if\
    \ (!$found) break;\n    echo \"Processing: $fn\\n\";\n    echo BreakScan::WARN_BC_BREAKS\

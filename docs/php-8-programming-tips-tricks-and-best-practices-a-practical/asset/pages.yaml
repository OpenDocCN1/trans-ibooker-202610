- pgno: 338
  md: "# Dealing with changes to backtraces\n\nAmazingly, before PHP 8, it was possible\
    \ to change function arguments through a backtrace. This was possible because\
    \ traces produced by either debug_backtrace() or Exception::getTrace() provided\
    \ access to function arguments by reference.\n\nThis is an extremely bad practice\
    \ because it allows your program to continue to operate despite potentially being\
    \ in an error state. Further, when reviewing such code, it's not clear how the\
    \ argument data is being provided. Accordingly, in PHP 8, this practice is no\
    \ longer allowed. Both debug_backtrace() or Exception::getTrace() still operate\
    \ as before. The only difference is that they no longer pass argument variables\
    \ by reference.\n\nLet's now have a look at changes to PDO error handling.\n\n\
    # PDO error-handling mode default changed\n\nFor many years, novice PHP developers\
    \ were mystified when their database applications using the PDO extension failed\
    \ to produce results. The reason for this problem, in many cases, was a simple\
    \ SQL syntax error that was not reported. This was due to the fact that in PHP\
    \ versions prior to PHP 8, the default PDO error mode was PDO::ERRMODE_SILENT.\n\
    \nSQL errors are not PHP errors. Accordingly, such errors are not captured by\
    \ normal PHP error handling. Instead, PHP developers had to specifically set the\
    \ PDO error mode to either PDO::ERRMODE_WARNING or PDO::ERRMODE_EXCEPTION. PHP\
    \ developers can now breathe a sigh of relief because, as of PHP 8, the PDO default\
    \ error-handling mode is now PDO::ERRMODE_EXCEPTION.\n\nIn the following example,\
    \ PHP 7 allows the incorrect SQL statement to silently fail:\n\n```\n```php\n\
    // /repo/ch08/php7_pdo_err_mode.php\n$dsn = 'mysql:host=localhost;dbname=php8_tips';\n\
    $pdo = new PDO($dsn, 'php8', 'password');\n$sql = 'SELEK propertyKey, hotelName\
    \ FUM hotels '\n    .\"WARE country = 'CA'\";\n$stmt = $pdo->query($sql);\nif\
    \ ($stm)\n    while($hotel = $stmt->fetch(PDO::FETCH_OBJ))\n        echo $hotel->name\
    \ . ' ' . $hotel->key . \"\\n\";\nelse\n    echo \"No Results\\n\";\n```\n```"
  merge: -1
  img_proc: true

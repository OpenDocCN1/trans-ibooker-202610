- pgno: 189
  md: "2. We then define a __sleep() method that excludes the $password property:\n\
    \n```\npublic function __sleep() {\n    return ['name','key'];\n}\n}\n```\n\n\
    3. We then create an instance of this class and serialize it. The last line echoes\
    \ the state of the serialized string:\n\n```\n$test = new Test();\n$str = serialize($test)\n\
    echo $str . \"\\n\";\n```\n\n4. In the output, you can clearly see that the $password\
    \ property is not present. Here is the output:\n\n```\nO:4:\"Test\":2:{s:4:\"\
    name\";s:4:\"Doug\",s:6:\"*key\";i:12345;}\n```\n\nThis is important in that,\
    \ in most cases, the reason you need to serialize an object is you wish to store\
    \ it somewhere, whether that be in a session file or in a database. If the filesystem\
    \ or database is subsequently compromised, you have one less security vulnerability\
    \ to worry about!\n\n# Understanding a potential code break in the __sleep() method\n\
    \nThere is a potential code break involving the __sleep() magic method. In versions\
    \ prior to PHP 8, if __sleep() returns an array with non-existent properties,\
    \ they are still serialized and assigned a value of NULL. The problem with this\
    \ approach is that when the object is subsequently unserialized, an extra property\
    \ now appears, one that is not there by design!\n\nIn PHP 8, non-existent properties\
    \ in the __sleep() magic method return are silently ignored. If your legacy code\
    \ anticipates the old behavior and takes steps to delete the unwanted property,\
    \ or even worse, if your code assumes the unwanted property exists, you will ultimately\
    \ have an error. Such assumptions are extremely dangerous as they can lead to\
    \ unexpected code behavior."

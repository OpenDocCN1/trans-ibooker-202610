- pgno: 393
  md: 'Let''s now have a look at how the JIT compiler operates, and how it differs
    from OPcache.


    # Discovering PHP program execution with the JIT compiler


    The problem with the current approach is that whether or not the bytecode is cached,
    it''s still necessary for the Zend Engine to convert the bytecode into machine
    code each and every time the program request is made. What the JIT compiler offers
    is the ability to not only compile bytecode into machine code but to cache machine
    code as well. The process is facilitated by a tracing mechanism that creates traces
    of requests. The trace allows the JIT compiler to determine which blocks of machine
    code need to be optimized and cached. The execution flow using the JIT compiler
    is summarized in Figure 10.3:


    ![](img/dbf2674d5b31107c344104b5edcb21c5_393_0.png)


    Figure 10.3 – PHP execution flow with the JIT compiler


    As you can see from the diagram, the normal execution flow incorporating OPcache
    is still present. The main difference is that a request might invoke a trace,
    causing the program flow to shift immediately to the JIT compiler, effectively
    bypassing not only the parsing process but the Zend Engine as well. Both the JIT
    compiler and the Zend Engine can produce machine code ready for direct execution.


    The JIT compiler did not evolve out of thin air. The PHP core team elected to
    port the highly performant and well-tested DynASM preprocessing assembler. Although
    DynASM was primarily developed for the JIT compiler used by the Lua programming
    language, its design is such that it''s perfectly suited to form the basis of
    a JIT compiler for any C-based language (such as PHP!).'
  merge: -1
  img_proc: true
- pgno: 394
  md: "Another favorable aspect of the PHP JIT implementation is that it doesn't produce\
    \ any **Intermediate Representation (IR)** code. In contrast, the **PyPy VM**\
    \ used to run Python code using JIT compiler technology, has to first produce\
    \ IR code in a **graph structure**, used for flow analysis and optimization, before\
    \ the actual machine code is produced. The DynASM core in the PHP JIT doesn't\
    \ require this extra step, resulting in greater performance than is possible in\
    \ other interpreted programming languages.\n\n> **Tip**\n> \n> For more information\
    \ on DynASM, have a look at this website: `https://luajit.org/dynasm.html`. Here's\
    \ an excellent overview of how the PHP 8 JIT operates: `https://www.zend.com/blog/exploring-new-php-jit-compiler`.\
    \ You can also read the official JIT RFC here: `https://wiki.php.net/rfc/jit`.\n\
    \nNow that you have an idea of how the JIT compiler fits into the general flow\
    \ of a PHP program execution cycle, it's time to learn how to enable it.\n\n#\
    \ Enabling the JIT compiler\n\nBecause the primary function of the JIT compiler\
    \ is to cache machine code, it operates as an independent part of the OPcache\
    \ extension. OPcache serves as a gateway to both enable JIT functionality as well\
    \ as to allocate memory to the JIT compiler from its own allotment. Therefore,\
    \ in order to enable the JIT compiler, you must first enable OPcache (see the\
    \ previous section, *Understanding the operation of PHP OPcache*).\n\nIn order\
    \ to enable the JIT compiler, you must first confirm that PHP has been compiled\
    \ with the `--enable-opcache-jit` configuration option. You are then in a position\
    \ to enable or disable the JIT compiler by simply assigning a non-zero value to\
    \ the `php.ini` file's `opcache.jit_buffer_size` directive.\n\nValues are specified\
    \ either as an integer – in which case, the value represents the number of bytes;\
    \ a value of zero (the default), which disables the JIT compiler; or you can assign\
    \ a number followed by any of the following letters:\n\n+   - K: Kilobytes\n+\
    \   - M: Megabytes\n+   - G: Gigabytes"
  merge: -1
  img_proc: true
- pgno: 395
  md: 'The value you specify for the JIT compiler buffer size must be less than the
    memory allocation you assigned to OPcache because the JIT buffer is taken out
    of the OPcache buffer.


    Here is an example that sets the OPcache memory consumption to 256 M and the JIT
    buffer to 64 M. These values can be placed anywhere in the php.ini file:


    ```

    opcache.memory_consumption=256

    opcache.jit_buffer_size=64M

    ```


    Now that you have an idea of how the JIT compiler works, and how it can be enabled,
    it''s extremely important that you know how to properly set the tracing mode.


    # Configuring the tracing mode


    The php.ini setting opcache.jit controls the JIT tracer operation. For convenience,
    one of the following four preset strings can be used:


    +   - `opcache.jit=disable`

    +     Completely disables the JIT compiler (regardless of other settings).

    +   - `opcache.jit=off`

    +     Disables the JIT compiler but (in most cases) you can enable it at runtime
    using `ini_set()`.

    +   - `opcache.jit=function`

    +     Sets the JIT compiler tracer to function mode. This mode corresponds to
    the **CPU Register Trigger Optimization (CRTO)** digits 1205 (explained next).

    +   - `opcache.jit=tracing`

    +     Sets the JIT compiler tracer to tracing mode. This mode corresponds to the
    CRTO digits 1254 (explained next). In most cases, this setting gives you the best
    performance.

    +   - `opcache.jit=on`

    +     This is an alias for tracing mode.


    > **Tip**

    > Relying upon runtime JIT activation is risky and can produce inconsistent application
    behavior. The best practice is to use either the `tracing` or the `function` setting.'
  merge: -1
  img_proc: true
- pgno: 396
  md: 'The four convenience strings actually resolve into a four-digit number. Each
    digit corresponds to a different aspect of the JIT compiler tracer. The four digits
    are not bitmasks unlike other `php.ini` file settings and are specified in this
    order: `CRTO`. Here is a summary of each of the four digits.


    # C (CPU opt flags)


    The first digit represents CPU optimization settings. If you set this digit to
    0, no CPU optimization takes place. A value of 1 enables the generation of **Advanced
    Vector Extensions (AVX) instructions.** AVX are extensions to the x86 instruction
    set architecture for microprocessors from Intel and AMD. AVX has been supported
    on Intel and AMD processors since 2011. AVX2 is available on most server-type
    processors such as Intel Xeon.


    # R (register allocation)


    The second digit controls how the JIT compiler deals with **registers.** Registers
    are like RAM, except that they reside directly inside the CPU itself. The CPU
    constantly moves information in and out of registers in order to perform operations
    (for example, adding, subtracting, performing logical AND, OR, and NOT operations,
    and so forth). The options associated with this setting allow you to disable register
    allocation optimization or allow it at either the local or global level.


    # T (JIT trigger)


    The third digit dictates when the JIT compiler should trigger. Options include
    having the JIT compiler operate the first time a script is loaded or upon first
    execution. Alternatively, you can instruct the JIT when to compile **hot functions**.
    Hot functions are ones that are called the most frequently. There is also a setting
    that tells JIT to only compile functions marked with the `@jit` `docblock` annotation.


    # O (optimization level)


    The fourth digit corresponds to the optimization level. Options include disabling
    optimization, minimal, and selective. You can also instruct the JIT compiler to
    optimize based upon individual functions, call trees, or the results of inner
    procedure analysis.'
  merge: -1
  img_proc: true

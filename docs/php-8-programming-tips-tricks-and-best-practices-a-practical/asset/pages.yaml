- pgno: 391
  md: '# Understanding conventional PHP program execution


    In a conventional PHP program run cycle, the PHP program code is evaluated and
    broken down into bytecode by an operation known as **parsing**. The bytecode is
    then passed to the Zend Engine, which in turn converts the bytecode into machine
    code.


    When PHP is first installed on a server, the installation process kicks in the
    necessary logic that tailors the Zend Engine to the specific CPU and hardware
    (or virtual CPU and hardware) for that particular server. Thus, when you write
    PHP code, you have no awareness of the particulars of the actual CPU that eventually
    runs your code. It is the Zend Engine that provides hardware-specific awareness.


    *Figure 10.2, shown next, illustrates conventional PHP execution:*


    ![](img/dbf2674d5b31107c344104b5edcb21c5_391_0.png)


    Figure 10.2 – Conventional PHP program execution flow


    Although PHP, especially PHP 7, is quite fast, it''s still of interest to gain
    additional speed. For this purpose, most installations also enable the PHP **OPcache**
    extension. Let''s have a quick look at OPcache before moving on to the JIT compiler.


    # Understanding the operation of PHP OPcache


    As the name implies, the PHP OPcache extension *caches* opcode (bytecode) the
    first time a PHP program is run. On subsequent program runs, the bytecode is drawn
    from the cache, eliminating the parsing phase. This saves a significant amount
    of time and is a highly desirable feature to enable on a production site. The
    PHP OPcache extension is part of the set of core extensions; however, it''s not
    enabled by default.'
  merge: -1
  img_proc: true
- pgno: 392
  md: "Before enabling this extension, you must first confirm that your version of\
    \ PHP has been compiled with the --enable-opcache configure option. You can check\
    \ this by executing the phpinfo() command from inside PHP code running on your\
    \ web server. From the command line, enter the php -i command. Here is an example\
    \ running php -i from the Docker container used for this book:\n\n```\nroot@php8_tips_php8\
    \ [ /repo/ch10 ]# php -i\nphpinfo()\nPHP Version => 8.1.0-dev\nSystem => Linux\
    \ php8_tips_php8 5.8.0-53-generic #60~20.04.1-Ubuntu SMP Thu May 6 09:52:46 UTC\
    \ 2021 x86_64\nBuild Date => Dec 24 2020 00:11:29\nBuild System => Linux 9244ac997bc1\
    \ 3.16.0-4-amd64 #1 SMP Debian 3.16.7-ckt11-1 (2015-05-24) x86_64 GNU/Linux\n\
    Configure Command => './configure' '--prefix=/usr' '--sysconfdir=/etc' '--localstatedir=/var'\
    \ '--datadir=/usr/share/php' '--mandir=/usr/share/man' '--enable-fpm' '--with-fpm-user=apache'\
    \ '--with-fpm-group=apache'\n// not all options shown\n'--with-jpeg' '--with-png'\
    \ '--with-sodium=/usr' '--enable-opcache-jit' '--with-pcre-jit' '--enable-opcache'\n\
    ```\n\nAs you can see from the output, OPcache was included in the configuration\
    \ for this PHP installation. To enable OPcache, add or uncomment the following\
    \ php.ini file settings:\n\n+   - zend_extension=opcache\n+   - opcache.enable=1\n\
    +   - opcache.enable_cli=1\n\nThe last setting is optional. It determines whether\
    \ or not PHP commands executed from the command line are also processed by OPcache.\
    \ Once enabled, there are a number of other php.ini file settings that affect\
    \ performance, however, these are beyond the scope of this discussion.\n\n> **Tip**\n\
    > \n> For more information on PHP php.ini file settings that affect OPcache, have\

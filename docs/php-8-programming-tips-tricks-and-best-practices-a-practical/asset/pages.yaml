- pgno: 403
  md: '# Discovering additional JIT compiler settings


    Table 10.2 provides a summary of all other opcache.jit* settings in the php.ini
    file that have not already been covered:


    | opcache.* Setting | Type | Description |

    |---|---|---|

    | jit_bisect_limit | int | Much like a break point, this tells JIT to stop after
    this limit has been reached. Use this to isolate the process causing the break.
    |

    | jit_prof_threshold | float | If your "T" value is set to 2, this setting sets
    the level at which a function is considered "hot". (# calls to this func) divided
    by the (# calls to all funcs) must be > the value set here. For example, 0.1 means
    that functions that comprise more than 10% of all calls will be compiled |

    | jit_max_root_traces | int | Maximum number of root traces. |

    | jit_max_side_traces | int | Maximum number of side traces. |

    | jit_max_exit_counters | int | Maximum number of side trace exit counters. Puts
    a limit on the total number of side traces. |

    | jit_hot_loop | int | A loop is considered "hot" after this many iterations.
    |

    | jit_hot_func | int | A function is considered "hot" after this many iterations.
    |

    | jit_hot_return | int | A return is considered "hot" after this many iterations.
    |

    | jit_hot_side_exit | int | An exit is considered "hot" after this many iterations.
    |

    | jit_blacklist_root_trace | int | Maximum times a root trace compilation can
    fail before being blacklisted. |

    | jit_blacklist_side_trace | int | Maximum times a side trace compilation can
    fail before being blacklisted. |

    | jit_max_loop_unrolls | int | Maximum times a an attempt to close the loop on
    a side trace compilation can fail before being blacklisted. |

    | jit_max_recursive_calls | int | Maximum number of times recursive call loops
    closings can fail. |

    | jit_max_recursive_returns | int | Maximum number of times recursive return loops
    closings can fail. |

    | jit_max_polymorphic_calls | int | Maximum number of times polymorphic (dynamic
    or method) calls can be inlined. Any call above this limit is classed as megamorphic
    and is not inlined. |


    Table 10.2 – Additional opcache.jit* php.ini file settings


    As you can see from the table, you have a high degree of control over how the
    JIT compiler operates. Collectively, these settings represent thresholds that
    control decisions the JIT compiler makes. These settings, if properly configured,
    allow the JIT compiler to ignore infrequently used loops and function calls. We''ll
    now leave the exciting world of the JIT compiler and have a look at how to improve
    array performance.


    # Speeding up array handling


    Arrays are a vital part of any PHP program. Indeed, dealing with arrays is unavoidable
    as much of the real-world data your program handles day to day arrives in the
    form of an array. One example is data from an HTML form posting. The data ends
    up in either $_GET or $_POST as an array.'
  merge: -1
  img_proc: true
- pgno: 404
  md: "In this section, we'll introduce you to a little-known class included with\
    \ the SPL: the SplFixedArray class. Migrating your data from a standard array\
    \ over to a SplFixedArray instance will not only improve performance but requires\
    \ significantly less memory as well. Learning how to take advantage of the techniques\
    \ covered in this chapter can have a substantial impact on the speed and efficiency\
    \ of any program code currently using arrays with a massive amount of data.\n\n\
    # Working with SplFixedArray in PHP 8\n\nThe SplFixedArray class, introduced in\
    \ PHP 5.3, is literally an object that acts like an array. Unlike ArrayObject,\
    \ however, this class requires you to place a hard limit on the array size, and\
    \ only allows integer indices. The reason why you might want to use SplFixedArray\
    \ rather than ArrayObject is SplFixedArray takes significantly less memory and\
    \ is highly performant. In fact, SplFixedArray actually takes less memory than\
    \ a standard array with the same data!\n\n# Comparing SplFixedArray with array\
    \ and ArrayObject\n\nA simple benchmark program illustrates the differences between\
    \ a standard array, ArrayObject, and SplFixedArray:\n\n+   1. First, we define\
    \ a couple of constants used later in the code:\n+   2. Next, we define a function\
    \ that adds 1 million elements comprised of a string 64 bytes long:\n\n```\n```php\n\
    // /repo/ch10/php7_spl_fixed_arr_size.php\ndefine('MAX_SIZE', 1000000);\ndefine('PATTERN',\
    \ \"%14s : %8.8f : %12s\\n\");\n```\n```\n\n```\n```php\nfunction testArr($list,\
    \ $label) {\n    $alpha = new InfiniteIterator(\n        new ArrayIterator(range('A','Z')));\n\
    \    $start_mem = memory_get_usage();\n    $start_time = microtime(TRUE);\n  \
    \  for ($x = 0; $x < MAX_SIZE; $x++) {\n        $letter = $alpha->current();\n\
    \        $alpha->next();\n        $list[$x] = str_repeat($letter, 64);\n    }\n\
    \    $mem_diff = memory_get_usage() - $start_mem;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 405

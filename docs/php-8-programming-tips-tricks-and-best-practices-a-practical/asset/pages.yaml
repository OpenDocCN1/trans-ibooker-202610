    Let’s now have a look at other XML extension changes.


    # Understanding other XML extension changes


    There have been a number of changes to other PHP 8 XML extensions. For the most
    part, the changes are minor and do not present a significant potential for a backward-compatible
    code break. However, we would be remiss if we did not address these additional
    changes. We recommend that you go through the remaining changes present in this
    subsection so that your awareness is raised. Using these XML extensions will empower
    you to troubleshoot application code that is behaving inconsistently after a PHP
    8 update.


    # Changes to the libxml extension


    The **libxml** extension leverages the **Expat C library**, providing XML parsing
    functions used by the various PHP XML extensions (https://libexpat.github.io/).


    There is a new requirement for the version of libxml installed on your server.
    The minimum version when running PHP 8 must be 2.9.0 (or above). One of the major
    benefits of this updated requirement is to increase protection against **XML external
    entity** (**XXE**) processing attacks.


    The recommended minimum version of libxml disables the ability of PHP XML extensions
    that rely upon the libxml extension to load external XML entities by default.
    This, in turn, reduces the need for costly and time-consuming extra steps to protect
    against XXE attacks.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '> **Tip**

    > For more information on XXE attacks, consult the **Open Web Application Security
    Project** (**OWASP**) using this link: https://owasp.org/www-community/vulnerabilities/XML_External_Entity_(XXE)_Processing.


    # Changes to the XMLReader extension


    The `XMLReader` extension complements the `XMLWriter` extension. Where the `XMLWriter`
    extension is designed to produce an XML document, the `XMLReader` extension is
    designed to read.


    Two methods, `XMLReader::open()` and `XMLReader::xml()`, are now defined as **static
    methods**. You can still create `XMLReader` instances, but if you extend `XMLReader`
    and override either of these methods, be sure to declare them as static.


    # Changes to the XMLParser extension


    The `XMLParser` extension is one of the oldest PHP XML extensions. Accordingly,
    it almost entirely consists of procedural functions rather than classes and methods.
    In PHP 8, however, this extension follows a trend toward producing objects rather
    than resources. Thus, when you run `xml_parser_create()` or `xml_parser_create_ns()`,
    an `XMLParser` instance is created rather than a resource.


    As mentioned in the *Potential code break involving is_resource()* section, all
    you need to do is to replace any checks using `is_resource()` with `!empty()`
    instead. Another side effect of resource-to-object migration is to make redundant
    the `xml_parser_free()` function. To deactivate the parser, simply use the `XmlParser`
    object.


    Now that you have an understanding of the changes associated with XML extensions,
    this will help you to more efficiently parse and otherwise manage XML data. By
    taking advantage of the new features mentioned in this section, you can produce
    code that''s much more efficient and that offers better performance than was possible
    prior to PHP 8. Let''s now have a look at the `mbstring` extension.'

- pgno: 234
  md: "# Dealing with inconsistent string-to-numeric comparison results\n\nTo complete\
    \ a non-strict comparison involving string and numeric data, the PHP engine first\
    \ performs a type-juggling operation that internally converts the string to a\
    \ number before performing the comparison. Even a well-formed numeric string,\
    \ however, can yield results that would be viewed as nonsensical from a human\
    \ perspective.\n\nAs an example, have a look at this code sample:\n\n+   1. First\
    \ we perform a non-strict comparison between a variable, $zero, with a value of\
    \ zero and a variable, $string, with a value of ABC:\n+   2. The following non-strict\
    \ comparison uses in_array() to locate a value of zero in the $array array:\n\
    +   3. Finally, we perform a non-strict comparison between a leading-numeric string,\
    \ 42abc88, and a hardcoded number, 42:\n\n```\n$zero = 0;\n$string = 'ABC';\n\
    $result = ($zero == $string) ? 'is' : 'is not';\necho \"The value $zero $result\
    \ the same as $string\\n\"\n```\n\n```\n$array = [1 => 'A', 2 => 'B', 3 => 'C'];\n\
    $result = (in_array($zero, $array))\n    ? 'is in' : 'is not in';\necho \"The\
    \ value $zero $result\\n\"\n    . var_export($array, TRUE)\n```\n\n```\n$mixed\
    \ = '42abc88';\n$result = ($mixed == 42) ? 'is' : 'is not';\necho \"\\nThe value\
    \ $mixed $result the same as 42\\n\";\n```\n\nThe results running in PHP 7 defy\
    \ human comprehension! Here are the PHP 7 results:\n\n```\nroot@php8_tips_php7\
    \ [/repo/ch06 ]#\nphp php7_compare_num_str.php\nThe value 0 is the same as ABC\n\
    The value 0 is in\narray (1 => 'A', 2 => 'B', 3 => 'C')\nThe value 42abc88 is\
    \ the same as 42\n```"

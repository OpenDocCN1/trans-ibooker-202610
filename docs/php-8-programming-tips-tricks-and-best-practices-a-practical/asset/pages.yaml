- pgno: 63
  md: "# Using the variadics operator\n\nThe **variadics** operator consists of three\
    \ leading dots ( . . . ) preceding a normal PHP variable (or object property).\
    \ This operator has actually been with the language since PHP 5.6. It's also referred\
    \ to as the following:\n\n+   - Splat operator\n+   - Scatter operator\n+   -\
    \ Spread operator\n\nBefore we dive into the improvements PHP 8 has made using\
    \ this operator, let's have a quick look at how the operator is normally used.\n\
    \n# Unknown number of arguments\n\nOne of the most common uses for the variadics\
    \ operator is in a situation where you define a function with an unknown number\
    \ of arguments.\n\nIn the following code example, the multiVardump() function\
    \ is able to accept any number of variables. It then concatenates the var_export()\
    \ output and returns a string:\n\n```\n```php\n// /repo/ch02/php7_variadic_params.php\n\
    function multiVardump(...$args) {\n    $output = '';\n    foreach ($args as $var)\n\
    \        $output .= var_export($var, TRUE);\n    return $output;\n}\n$a = new\
    \ ArrayIterator(range('A','F'));\n$b = function (string $val) { return str_rot13($val);\
    \ };\n$c = [1,2,3];\n$d = 'TEST';\necho multiVardump($a, $b, $c);\necho multiVardump($d);\n\
    ```\n```\n\nThe first time the function is called, we provide three arguments.\
    \ The second time it's called, we only provide a single argument. Because we used\
    \ a variadics operator, there's no need to rewrite the function to accommodate\
    \ more or fewer arguments."
  merge: -1
  img_proc: true
- pgno: 64
  md: "> Tip\n> \n> There is a `func_get_args()` PHP function that gathers all function\
    \ arguments into an array. The variadics operator is preferred, however, as it\
    \ must be stated in the function signature, and thus makes the intentions of the\
    \ program developer much clearer. For more information, see https://php.net/func_get_args.\n\
    \n# Vacuuming up remaining arguments\n\nAnother use for the variadics operator\
    \ is to **vacuum up** any remaining arguments. This technique allows you to mix\
    \ mandatory parameters with an unknown number of optional parameters.\n\nIn this\
    \ example, a where() function produces a WHERE clause to be added to a **Structured\
    \ Query Language (SQL)** SELECT statement. The first two arguments are mandatory:\
    \ it's not reasonable to produce a WHERE clause with no arguments! Have a look\
    \ at the code here:\n\n```\n```php\n// ch02/includes/php7_sql_lib.php\n// other\
    \ functions not shown\nfunction where(stdClass $obj, $a, $b = '', $c = '',\n \
    \   $d = '') {\n    $obj->where[] = $a;\n    $obj->where[] = $b;\n    $obj->where[]\
    \ = $c;\n    $obj->where[] = $d;\n}\n```\n```\n\nThe calling code using this function\
    \ might look like this:\n\n```\n```php\n// /repo/ch02/php7_variadics_sql.php\n\
    require_once __DIR__ . '/includes/php7_sql_lib.php';\n$start = '2021-01-01';\n\
    $end   = '2021-04-01';\n$select = new stdClass();\nfrom($select, 'events');\n\
    cols($select, ['id', 'event_key',\n    'event_name', 'event_date']);\nlimit($select,\
    \ 10);\nwhere($select, 'event_date', '>=', \"'$start'\");\n```\n```"
  merge: -1

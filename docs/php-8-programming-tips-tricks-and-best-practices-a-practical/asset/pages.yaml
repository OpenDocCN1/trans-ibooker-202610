    SHA-256 : *0

    ```


    As we have stressed repeatedly in this book, when PHP makes assumptions for you,
    ultimately you end up with bad code that produces inconsistent results. In the
    code example just shown, the best practice would be to define a class method or
    function that exerts greater control over its parameters. In this manner, you
    can validate the parameters and avoid having to rely upon PHP assumptions.



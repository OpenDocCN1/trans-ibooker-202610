    \nThe first FFI extension was actually introduced for PHP 5 on the PECL website\
    \ (https://pecl.php.net/) in January 2004 by PHP core developers **Wez Furlong**\
    \ and **Ilia Alshanetsky**. The project never passed its Alpha stage, however,\
    \ and development was dropped within a month.\n\nAs PHP developed and matured\

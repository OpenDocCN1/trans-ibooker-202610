- pgno: 361
  md: "# Taking advantage of trailing commas\n\nPHP has long allowed the use of trailing\
    \ commas when defining arrays. For example, the syntax shown here is not uncommon:\n\
    \n```\n$arr = [1, 2, 3, 4, 5,];\n```\n\nHowever, doing the same thing in a function\
    \ or method signature is not allowed:\n\n```\nfunction xyz ($fn, $ln, $mid = '',)\
    \ { /* code */ }\n```\n\nAlthough it's not really such a big deal, it's annoying\
    \ to be able to add a trailing comma when defining an array, but not be allowed\
    \ the same liberty when it comes to function or method signatures!\n\nPHP 8 now\
    \ allows you to use trailing commas in both function and method signatures. The\
    \ new rule also applies to use () statements associated with anonymous functions.\n\
    \nTo illustrate this change, consider the following example. In this example,\
    \ an anonymous function is defined that renders a full name:\n\n```\n// /repo/ch09/php8_trailing_comma.php\n\
    $full = function ($fn, $ln, $mid = '',) {\n    $mi = ($mid) ? strtoupper($mid[0])\
    \ . '. ' : '';\n    return $fn . ' ' . $mi . $ln;\n};\necho $full('Fred', 'Flintstone',\
    \ 'John');\n```\n\nAs you can see, there's a comma following the third argument\
    \ to the anonymous function. Here is the output from PHP 7:\n\n```\nroot@php8_tips_php7\
    \ [ /repo/ch09 ]#\nphp php8_trailing_comma.php\nPHP Parse error: syntax error,\
    \ unexpected ')', expecting variable (T_VARIABLE) in /repo/ch09/php8_trailing_comma.php\
    \ on line 4\n```\n\nIn PHP 8, the trailing comma is allowed and the expected output\
    \ appears, as shown here:\n\n```\nroot@php8_tips_php8 [ /repo/ch09 ]#\nphp php8_trailing_comma.php\n\
    Fred J. Flintstone\n```"
  merge: -1
  img_proc: true
- pgno: 362
  md: "Although having a trailing comma in function or method definitions is not necessarily\
    \ a best practice, it does make PHP 8 consistent in its overall treatment of trailing\
    \ commas.\n\nNow, let's turn our attention to methods that still exist but no\
    \ longer have any use.\n\n# Learning about methods that are no longer required\n\
    \nPrimarily as a result of the PHP 8 resource-to-object migration, a number of\
    \ functions and methods are no longer required. They are not deprecated at the\
    \ time of writing, but these functions no longer serve any practical use.\n\n\
    As an analogy, in versions of PHP before PHP 8, you would use fopen() to open\
    \ a file handle resource. Once you had finished working on the file, you would\
    \ normally use fclose() on the file handle resource to close the connection.\n\
    \nNow, let's assume that you are using SplFileObject instead of fopen(). When\
    \ the work with the file has been completed, you can simply unset the object.\
    \ This accomplishes the same thing as using fclose(), making fclose() redundant.\n\
    \nThe following table summarizes functions that exist, and can still be used,\
    \ but no longer have any practical value in PHP 8. The ones marked with an asterisk\
    \ are also deprecated:\n\n| Extension | Functions No Longer Useful |\n|---|---|\n\
    | cURL | curl_close()\n curl_multi_close()\n curl_share_close() |\n| Exif | read_exif_data()\
    \ |\n| GD | imagedestroy() |\n| OpenSSL | openssl_x509_free() * |\n| Shared Memory\
    \ | shmop_close() * |\n| XMLParser | xml_parser_free() |\n\nTable 9.1 – Functions\
    \ that are no longer useful\n\nNow that you have an idea of what major method\
    \ signature and usage changes have been made in PHP 8, let's have a look at the\
    \ best practices to take into consideration when working with interfaces and traits."
  merge: -1
  img_proc: true
- pgno: 363
  md: '# Working with interfaces and traits


    The PHP 8 trait implementation has been expanded in several ways. There are also
    several new interfaces that can potentially alter how you work with the DOM and
    DateTime extensions. For the most part, the changes improve the abilities of these
    two extensions. However, as method signatures have changed in some cases, you
    may run into a potential code break. Due to this, it''s important to pay close
    attention to the discussion presented in this section to ensure that existing
    and future PHP code remains functional.


    First, let''s have a look at the new DOM extension interfaces.


    # Discovering new DOM extension interfaces


    The *cost of living* economic statistic is issued each year by many world governments.
    It depicts how much it costs an average citizen to live year by year. As web technology
    matures, a similar principal has been applied – first to HTML, and now to DOM.
    The **DOM Living Standard** is maintained by the **Web Hypertext Application Technology
    Working Group (WHATWG)** (`https://whatwg.org/`).


    The reason why this information is important to PHP developers is that in PHP
    8, the decision was made to move the PHP DOM extension to the DOM Living Standard.
    Accordingly, starting with PHP 8, a series of incremental and continuous changes
    will be applied to this extension in accordance with changes to the living standard.


    For the most part, the changes are backward compatible. However, since some method
    signatures change to maintain adherence to the standard, you may experience code
    breaks. The most significant change to the DOM extension in PHP 8 is the introduction
    of two new interfaces. Let''s examine these interfaces, and then discuss their
    impact on PHP development.


    # Examining the new DOMParentNode interface


    The first of the two new interfaces is **DOMParentNode**. The following classes
    implement this interface in PHP 8:


    +   - `DOMDocument`

    +   - `DOMElement`

    +   - `DOMDocumentFragment`'
  merge: -1
  img_proc: true
- pgno: 364
  md: "Here is the interface definition:\n\n```\ninterface DOMParentNode {\n    public\
    \ readonly ?DOMElement $firstElementChild;\n    public readonly ?DOMElement $lastElementChild;\n\
    \    public readonly int $childElementCount;\n    public function append(\n  \
    \      ...DOMNode|string|null $nodes) : void;\n    public function prepend(\n\
    \        ...DOMNode|string|null $nodes) : void;\n}\n```\n\nIt's important to note\
    \ that there is no readonly attribute available to PHP developers. However, the\
    \ interface specification shows the properties as read only because they are internally\
    \ generated and cannot be changed.\n\n> **Tip**\n> There actually was a PHP RFC\
    \ that was introduced in 2014 that proposed adding a readonly attribute to class\
    \ properties. This proposal was withdrawn, however, as the same effect can be\
    \ achieved by defining a constant or simply marking a property private! For more\
    \ information on this proposal, see https://wiki.php.net/rfc/readonly_properties.\n\
    \nThe following table summarizes the properties and methods of the new DOMParentNode\
    \ interface:\n\n| Method / Property | Description |\n|---|---|\n| $firstElementChild\
    \ | Contains either the first DOMElement instance in this object, or NULL. |\n\
    | $lastElementChild | Contains either the last DOMElement instance in this object,\
    \ or NULL. |\n| $elementChildCount | Integer value representing the total number\
    \ of child elements in this object. |\n| append() | Appends the node to the end\
    \ of the current list of child nodes. |\n| prepend() | Adds the node to the beginning\
    \ of the current list of child nodes. |\n\nTable 9.2 – DOMParentNode interface\
    \ methods and properties"
  merge: -1
  img_proc: true
- pgno: 365
  md: "The functionality represented by the new interface doesn't add anything new\
    \ to the existing DOM capabilities. Its main purpose is to bring the PHP DOM extension\
    \ in line with the living standard.\n\n> **Tip**\n> There is another purpose for\
    \ architecturally renovating the DOM extension in the future. In future versions\
    \ of PHP, the DOM extension will have the capability of manipulating an entire\
    \ branch of the DOM tree. When you issue an `append()`, for example, in the future,\
    \ you will be able to append not only the one node, but all its child nodes as\
    \ well. For more information, see the following RFC: https://wiki.php.net/rfc/dom_living_standard_api.\n\
    \nNow, let's have a look at the second new interface.\n\n# Examining the new DOMChildNode\
    \ interface\n\nThe second of the two new interfaces is **DOMChildNode**. The `DOMElement`\
    \ and `DOMCharacterData` classes implement this interface in PHP 8.\n\nHere is\
    \ the interface definition:\n\n```\ninterface DOMChildNode {\n    public readonly\
    \ ?DOMElement $previousElementSibling;\n    public readonly ?DOMElement $nextElementSibling;\n\
    \    public function remove() : void;\n    public function before(\n        ...DOMNode|string|null\
    \ $nodes) : void;\n    public function after(\n        ...DOMNode|string|null\
    \ $nodes) : void;\n    public function replaceWith(\n        ...DOMNode|string|null\
    \ $nodes) : void;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 366
  md: 'The following table summarizes the methods and properties of DOMChildNode:


    | Method / Property | Description |

    |---|---|

    | $previousElementSibling | Contains either the previous DOMElement instance at
    the same node level in this object, or NULL. |

    | $nextElementSibling | Contains either the next DOMElement instance at the same
    node level in this object, or NULL. |

    | remove() | Simplified way of removing this node. Alleviates the need to first
    acquire the parent node. |

    | before() | Adds the node at the same level in this object before this node.
    |

    | after() | Adds the node at the same level in this object after this node. |

    | replaceWith() | Replaces this node with specified element. |


    Table 9.3 – DOMChildNode interface methods and properties


    In this case, the functionality departs slightly from the existing DOM capabilities.
    The most significant departure is DOMChildNode::remove(). Before PHP 8, to remove
    a node, you had to access its parent. Assuming that $topic is a DOMElement instance,
    PHP 7 or earlier code may appear as follows:


    ```

    $topic->parentNode->removeChild($topic);

    ```


    In PHP 8, the same code can be written as follows:


    ```

    $topic->remove();

    ```


    Aside from the new methods mentioned in the two tables shown previously, DOM functionality
    remains the same. Now, let''s have a look at how moving a child node might be
    rewritten in PHP 8 to take advantage of the new interfaces.


    # DOM usage example – comparing PHP 7 and PHP 8


    To illustrate the use of the new interfaces, let''s have a look at a code example.
    In this section, we will present a block of code that uses the DOM extension to
    move a node that represents Topic X from one document to another:


    +   1. Here is an HTML fragment that contains a set of nested <div> tags:


    ```

    <!DOCTYPE html>

    <!-- /repo/ch09/dom_test_1.html -->

    <div id="content">

    <div id="A">Topic A</div>

    ```'

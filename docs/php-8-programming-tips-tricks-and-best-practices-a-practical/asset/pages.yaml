- pgno: 195
  md: "5. We then serialize it, and restore it to a variable, $a2:\n\n```\n$str =\
    \ serialize($a1);\n$a2 = unserialize($str);\nvar_dump($a2);\n```\n\n6. From the\
    \ var_dump() output below, you can see that the object has been fully restored.\
    \ In addition, we know that the custom serialize() method was invoked because\
    \ the u property is initialized with a date and time value. Here is the output:\n\
    \n```\nobject(A)#3 (3) {\n  [\"a\":\"A\":private]=> string(1) \"A\"\n  [\"b\"\
    :\"A\":private]=> string(1) \"B\"\n  [\"u\":\"A\":private]=> object(DateTime)#4\
    \ (3) {\n    [\"date\"]=> string(26) \"2021-02-12 05:35:10.835999\"\n    [\"timezone_type\"\
    ]=> int(3)\n    [\"timezone\"]=> string(3) \"UTC\"\n  }\n}\n```\n\nLet's now have\
    \ a look at issues with the serialization process for objects that implement the\
    \ Serializable interface.\n\n# Examining PHP serializable interface issues\n\n\
    There is an overall problem with the earlier approach to serialization. If a class\
    \ to be serialized has defined a __wakeup() magic method, it's not invoked immediately\
    \ upon unserialization. Rather, any defined __wakeup() magic methods are first\
    \ queued up, the entire chain of objects is unserialized, and only then are methods\
    \ in the queue executed. This can result in a mismatch between what is seen by\
    \ an object's unserialize() method compared to what is seen by its queued __wakeup()\
    \ method.\n\nThis architectural flaw can result in inconsistent behavior and ambiguous\
    \ results when dealing with objects that implement the Serializable interface.\
    \ Many developers consider the Serializable interface to be severely broken due\
    \ to the need to create back references when the serialization of nested objects\
    \ occurs. This need arises in situations where nested serialization calls occur."
  merge: -1
  img_proc: true
- pgno: 196
  md: "Such nested calls might occur, for example, when a class defines a method that\
    \ in turn calls the PHP serialize() function. The order in which back references\
    \ are created is preset in PHP serialization prior to PHP 8, potentially causing\
    \ an avalanche of cascading failures.\n\nThe solution is to use two new magic\
    \ methods to give you complete control over serialization and unserialization\
    \ sequencing, described next.\n\n# New magic methods to control PHP serialization\n\
    \nA new way of controlling serialization was first introduced in PHP 7.4 and carried\
    \ over into PHP 8. In order to take advantage of this new technology, all you\
    \ need to do is to implement two magic methods: __serialize() and __unserialize().\
    \ If implemented, PHP turns control over serialization entirely to the __serialize()\
    \ method. Likewise, unserialization is entirely controlled by the __unserialize()\
    \ magic method. The __sleep() and __wakeup() methods, if defined, are ignored.\n\
    \nAs a further benefit, PHP 8 provides full support for the two new magic methods\
    \ in the following SPL classes:\n\n+   - ArrayObject\n+   - ArrayIterator\n+ \
    \  - SplDoublyLinkedList\n+   - SplObjectStorage\n\n> **Best practice**\n> \n\
    > To gain full control over serialization, implement the new __serialize() and\
    \ __unserialize() magic methods. You no longer need to implement the Serializable\
    \ interface, nor do you need to define __sleep() and __wakeup(). For more information\
    \ on the eventual discontinuation of the Serializable interface, see this RFC:\n\
    > https://wiki.php.net/rfc/phase_out_serializable.\n\nAs an example of the new\
    \ PHP serialization usage, consider the following code example:\n\n1. In the example,\
    \ a Test class is initialized with a random key upon instantiation:\n\n```\n//\
    \ /repo/ch05/php8_bc_break_serialization.php\nclass Test extends ArrayObject {\n\
    \    protected $id = 12345;\n    public $name = 'Doug';\n```"
  merge: -1
  img_proc: true
- pgno: 197
  md: "```\nprivate $key = '';\npublic function __construct() {\n    $this->key =\
    \ bin2hex(random_bytes(8));\n}\n```\n\n2. We add a getKey() method that reveals\
    \ the current key value:\n\n```\npublic function getKey() {\n    return $this->key;\n\
    }\n```\n\n3. When serialized, the key is filtered out of the resulting string:\n\
    \n```\npublic function __serialize() {\n    return ['id' => $this->id,\n     \
    \   'name' => $this->name];\n}\n```\n\n4. Upon unserialization, a new key is generated:\n\
    \n```\npublic function __unserialize($data) {\n    $this->id = $data['id'];\n\
    \    $this->name = $data['name'];\n    $this->__construct();\n}\n```\n\n5. We\
    \ now create an instance, and reveal the key:\n\n```\n$test = new Test();\necho\
    \ \"\\nOld Key: \" . $test->getKey() . \"\\n\";\n```\n\nHere is how the key might\
    \ appear:\n\n```\nOld Key: mXq78Dhp1ByDWuPtzK820g==\n```\n\n6. We add code to\
    \ serialize the object and display the string:\n\n```\n$str = serialize($test);\n\
    echo $str . \"\\n\";\n```"

- pgno: 55
  md: "# Improving code using typed properties\n\nIn the first section of this chapter,\
    \ *Using constructor property promotion*, we discussed how data types can be used\
    \ to control the type of data supplied as arguments to functions or class methods.\
    \ What this approach fails to do, however, is guarantee that the data type never\
    \ changes. In this section, you will learn how assigning a data type at the property\
    \ level provides stricter control over the use of variables in PHP 8.\n\n# What\
    \ are typed properties?\n\nThis extremely important feature was introduced in\
    \ PHP 7.4 and continues in PHP 8. Simply put, a **typed property** is a class\
    \ property with a data type preassigned. Here is a simple example:\n\n```\n//\
    \ /repo/ch01/php8_prop_type_1.php\ndeclare(strict_types=1)\nclass Test {\n   \
    \ public int $id = 0;\n    public int $token = 0;\n    public string $name = '';\n\
    }\n$test = new Test();\n$test->id = 'ABC';\n```\n\nIn this example, if we attempt\
    \ to assign a value representing a data type other than int to $test->id, a Fatal\
    \ error is thrown. Here is the output:\n\n```\nFatal error: Uncaught TypeError:\
    \ Cannot assign string to property Test::$id of type int in /repo/ch01/php8_prop_type_1.php:11\
    \ Stack trace: #0 {main} thrown in /repo/ch01/php8_prop_type_1.php on line 11\n\
    ```\n\nAs you can see from the preceding output, a Fatal error is thrown when\
    \ the wrong data type is assigned to a typed property.\n\nYou have already been\
    \ exposed to one form of property typing: **constructor property promotion**.\
    \ All properties defined using constructor property promotion are automatically\
    \ property typed!"
  merge: -1
  img_proc: true
- pgno: 56
  md: "# Why is property typing important?\n\nTyped properties is part of a general\
    \ trend in PHP first seen in PHP 7. The trend is toward making language refinements\
    \ that restrict and tighten the use of your code. This leads to better code, which\
    \ means fewer bugs.\n\nThe following example illustrates the danger of relying\
    \ solely upon property-type hinting to control the data type of properties:\n\n\
    ```\n```php\n// /repo/ch01/php7_prop_danger.php\ndeclare(strict_types=1);\nclass\
    \ Test {\n    protected $id = 0;\n    protected $token = 0;\n    protected $name\
    \ = '';\n    public function __construct(\n        int $id, int $token, string\

  md: "# ReflectionParameter::*DefaultValue* methods enhanced\n\nIn earlier versions\
    \ of PHP, ReflectionParameter methods pertaining to default values were unable\
    \ to reflect internal PHP functions. This has changed in PHP 8. The following\
    \ ReflectionParameter methods are now also able to return default value information\

    Although, for the most part, the commands are not easily understood, you can see
    from the assembly language representation that the instructions include commands
    to compare (cmp), move information between registers and/or memory (mov), and
    jump to another point in the instruction set (jmp).


    Bytecode, also called **opcode**, is a greatly reduced symbolic representation
    of the original program code. Bytecode is produced by a parsing process (often
    called the **interpreter**) that breaks human-readable program code into symbols
    known as **tokens**, along with values. Values would be any string, integer, float,
    and Boolean data used in the program code.


    Here is an example of a fragment of the bytecode produced based upon the example
    code (shown later) used to create a Mandelbrot:



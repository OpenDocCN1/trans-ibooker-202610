- pgno: 57
  md: "Any subsequent code expecting $token to be an integer might either fail or\
    \ produce unexpected results. Now, have a look at the same thing in PHP 8 using\
    \ typed properties:\n\n```\n// /repo/ch01/php8_prop_danger.php\ndeclare(strict_types=1);\n\
    class Test {\n    protected int $id = 0;\n    protected int $token = 0;\n    protected\
    \ string $name = '';\n    public function __construct(\n        int $id, int $token,\
    \ string $name) {\n        $this->id = $id;\n        $this->token = md5((string)\
    \ $token);\n        $this->name = $name;\n    }\n}\n$test = new Test(111, 123456,\
    \ 'Fred');\nvar_dump($test);\n```\n\nProperty typing prevents any change to the\
    \ preassigned data type from occurring, as you can see from the output shown here:\n\
    \n```\nFatal error: Uncaught TypeError: Cannot assign string to property Test::$token\
    \ of type int in /repo/ch01/php8_prop_danger.php:12\n```\n\nAs you can see from\
    \ the preceding output, a Fatal error is thrown when the wrong data type is assigned\
    \ to a typed property. This example demonstrates that not only does assigning\
    \ a data type to a property prevent misuse when making direct assignments, but\
    \ it also prevents misuse of the property inside class methods as well!\n\n# Property\
    \ typing can lead to a reduction in code\n\nAnother beneficial side effect of\
    \ introducing property typing to your code is a potential reduction in the amount\
    \ of code needed. As an example, consider the current practice of marking properties\
    \ with a visibility of private or protected, and then creating a series of get\
    \ and set methods to control access (also called getters and setters)."
  merge: -1

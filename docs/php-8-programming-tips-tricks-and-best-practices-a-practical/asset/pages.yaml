    \ look at a potentially significant change in the SplDoublyLinkedList class.\n\
    \n# Handling changes in SplDoublyLinkedList\n\nThe SplDoublyLinkedList class is\
    \ an iterator that's able to display information in either FIFO (First-In, First-Out)\
    \ or LIFO (Last-In, First-Out) order. It's more common, however, to say that you\
    \ can iterate through the list in either forward or reverse order."

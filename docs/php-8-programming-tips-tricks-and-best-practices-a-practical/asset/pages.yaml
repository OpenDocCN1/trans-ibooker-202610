    \ example that makes use of these enhancements. Here are the steps leading to\
    \ this:\n\n1. First, we define a function that accepts a ReflectionParameter instance\
    \ and returns an array with the parameter name and default value, as follows:\n\
    \n```\n```php\n// /repo/ch07/php8_reflection_parms_defaults.php\n$func = function\
    \ (ReflectionParameter $parm) {\n    $name = $parm->getName();\n    $opts = NULL;\n\
    \    if ($parm->isDefaultValueAvailable())\n        $opts = $parm->getDefaultValue();\n\
    ```\n```\n\n2. Next, we define a switch() statement to sanitize the options, as\
    \ follows:\n\n```\n```php\nswitch (TRUE) {\n    case (is_array($opts)) :\n   \

    \ final output, we now have useful information! Let's now have a look at the other\
    \ two FFI informational methods.\n\n# Making use of FFI::alignof() and FFI::sizeof()\n\
    \nBefore getting into a practical example showing the use of these two methods,\
    \ it's important to understand what exactly is meant by **alignment**. In order\
    \ to understand alignment, you need to have a basic understanding of how memory\
    \ is organized in most computers.\n\nRAM is still the fastest way to temporarily\
    \ store information used during a program run cycle. Your computer's **central\
    \ processing unit (CPU)** moves information in and out of memory as the program\
    \ executes. Memory is organized in parallel arrays. The alignment value returned\
    \ by alignof() would be how many bytes can be obtained at once from parallel slices\
    \ of the aligned memory arrays. In older computers, a value of 4 was typical.\
    \ For most modern microcomputers, values of 8 or 16 (or greater) are common.\n\
    \nLet's now have a look at an example that illustrates how these two FFI extension\
    \ informational methods are used, and how that information can produce a performance\
    \ improvement. This is how we'll proceed:\n\n1. First, we create a FFI instance,\
    \ $ffi, in which we define two C structures labeled Good and Bad. Notice in the\
    \ following code snippet that both structures have the same properties; however,\
    \ the properties are arranged in a different order:\n\n```\n```php\n$struct =\
    \ 'struct Bad { char c; double d; int i; }; '\n    . 'struct Good { double d;\
    \ int i; char c; }; '\n    ';\n$ffi = FFI::cdef($struct);\n```\n```"

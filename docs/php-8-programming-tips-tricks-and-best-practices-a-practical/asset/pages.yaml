    Let''s now have a look at *uniform variable syntax.*


    # Understanding uniform variable syntax


    One of the most radical initiatives introduced in PHP 7.0 was an effort at normalizing
    PHP syntax. The problem with earlier versions of PHP was that in some cases operations
    were parsed from left to right, whereas in other cases this was done from right
    to left. This inconsistency was the root cause of any of a number of programming
    vulnerabilities and difficulties. As a result, an initiative known as **uniform
    variable syntax** was launched by the PHP core development team. But first, let''s
    define key points that form the uniform variable syntax initiative.


    # Defining uniform variable syntax


    Uniform variable syntax is neither a protocol nor a formal language construct.
    Rather, it is a guiding principle that strives to ensure all operations are performed
    in a uniform and consistent manner.


    Here are some key points from this initiative:


    +   - Uniformity in the order and referencing of variables

    +   - Uniformity in function calls

    +   - Straightening out problems with array de-referencing

    +   - Providing the ability to mix function calls and array de-referencing in
    a single command


    > **Tip**

    > For more information on the original proposal for PHP 7 uniform variable syntax,
    have a look here: `https://wiki.php.net/rfc/uniform_variable_syntax.`


    Let''s now examine how the uniform variable syntax initiative affects PHP 8.'

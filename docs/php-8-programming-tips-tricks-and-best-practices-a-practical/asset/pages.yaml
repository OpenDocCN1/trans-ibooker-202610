- pgno: 332
  md: '# Deprecated functionality in PHP 8 extensions


    Finally, in order to make it easier for you to identify deprecated functionality
    in PHP 8 extensions, we provide a summary. The following table summarizes functionality
    deprecated in PHP 8 extensions:


    | Extension | Deprecated Functionality | Suggested Replacement |

    |---|---|---|

    | Enchant | enchant_dict_add_to_personal()

    enchant_dict_is_in_session()

    enchant_broker_free()

    enchant_broker_free_dict()

    enchant_broker_set_dict_path()

    enchant_broker_get_dict_path() | enchant_dict_add()

    enchant_dict_is_added()

    unset ($enchantObject)

    (same)

    None: no longer supported

    (same) |

    | OCI8 | OCI-Lob

    OCI-Collection | OCILob

    OCICollection |

    | ODBC | odbc_connect()

    odbc_exec() | No longer re-uses connections

    The flags parameter is removed |

    | PostgreSQL | PGSQL_LIBPQ_VERSION_STR | PGSQL_LIBPQ_VERSION |

    |  | pg_connect() | Must now use a connection string |

    |  | pg_lo_import(), pg_lo_export() | First argument is now the connection |

    |  | pg_fetch_all() | Now returns empty array if no results |

    | Reflection | ReflectionParameter::getClass()

    ReflectionParameter::isArray()

    ReflectionParameter::isCallable()

    ReflectionParameter::isDisabled() | ReflectionParameter::getType()

    (same)

    (same)

    None |

    | LibXML | libxml_disable_entity_loader() | None: no longer needed |



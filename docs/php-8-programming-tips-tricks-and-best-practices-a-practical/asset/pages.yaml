    ```\nobject(Test)#2 (3) {\n  [\"name\"]=> string(4)\n  \"Doug\"\n  [\"key\":\"\
    Test\":private]=> int(12345)\n  [\"status\":protected]=>\n  array(3) {\n    [0]=>\
    \ string(1)\n    \"A\"\n    [1]=> string(1)\n    \"B\"\n    [2]=> string(1)\n\
    \    \"C\"\n  }\n}\n```\n\nLet's now have a look at the magic methods that supply\
    \ legacy PHP serialization support: __sleep() and __wakeup().\n\n# Understanding\
    \ the __sleep() magic method\n\nThe purpose of the __sleep() magic method is to\
    \ provide a filter used to prevent certain properties from appearing in the serialized\
    \ string. To use a user object as an example, you may wish to exclude sensitive\
    \ properties such as a national identification number, credit card number, or\
    \ password from the serialization.\n\nHere is an example using the __sleep() magic\
    \ method to exclude a password:\n\n+   1. First, we define a Test class with three\
    \ properties:\n\n```\n// /repo/ch05/php8_serialization_sleep.php\nclass Test {\n\
    \    public $name = 'Doug';\n    protected $key = 12345;\n    protected $password\
    \ = '$2y$10$ux07vQNSA0ctbzZcZNA' .\n        '1xOa8hi6kchJrJZzqWcxpw/XQUjSNqacx.';\n\
    }\n```"

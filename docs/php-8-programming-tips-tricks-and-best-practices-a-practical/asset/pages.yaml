    # Summary


    In this chapter, you learned how to write better code using the new PHP 8 data
    types: mixed and union types. You also learned about how using named arguments
    can not only improve the readability of your code but can also help prevent accidental
    misuse of class methods and PHP functions, as well as providing a great way to
    skip over default arguments.


    This chapter also taught you how the new Attribute class can be used as an eventual
    replacement for PHP DocBlocks, serving to improve the overall performance of your
    code while providing a solid means of documenting classes, methods, and functions.


    In addition, we looked at how PHP 8 can greatly reduce the amount of code needed
    by earlier PHP versions by taking advantage of constructor argument promotion
    and typed properties.


    In the next chapter, you will learn about new PHP 8 features at the functional
    and procedural level.'

- pgno: 430
  md: '# Technical requirements


    To examine and run the code examples provided in this chapter, the minimum recommended
    hardware is the following:


    +   - An x86_64-based desktop PC or laptop

    +   - 1 **gigabyte (GB)** free disk space

    +   - 4 GB of RAM

    +   - 500 **kilobits per second (Kbps)** or faster internet connection


    In addition, you will need to install the following software:


    +   - Docker

    +   - Docker Compose


    Please refer to the *Technical requirements* section of *Chapter 1, Introducing
    New PHP 8 OOP Features*, for more information on Docker and Docker Compose installation,
    as well as how to build the Docker container used to demonstrate the code explained
    in this book. In this book, we refer to the directory in which you restored the
    sample code for this book as `/repo`.


    The source code for this chapter is located at https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices.
    We can now begin our discussion by having a look at environments used as part
    of the overall migration process.


    # Understanding development, staging, and production environments


    The ultimate goal for a website update is to move the updated application code
    from development to production in as seamless a manner as possible. This movement
    of application code is referred to as **deployment**. Movement, in this context,
    involves copying application code and configuration files from one **environment**
    to another.


    Before we get into the details of migrating an application to PHP 8, let''s first
    have a look at what these environments are. Gaining an understanding of what form
    the different environments might take is critical to your role as a developer.
    With this understanding, you are in a better position to deploy your code to production
    with a minimal amount of errors.'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# Defining an environment


    We use the word *environment* to describe a combination of software stacks that
    include the operating system, web server, database server, and PHP installation.
    In the past, the environment equated to a *server*. In this modern age, however,
    the term *server* is deceptive in that it implies a physical computer in a metal
    box sitting on a rack in some unseen server room. Today, this is more likely not
    going to be the case, given the abundance of cloud service providers and highly
    performant virtualization technologies (for example, Docker). Accordingly, when
    we use the term *environment*, understand this to mean either a physical or virtual
    server.


    Environments are generally classified into three distinct categories: **development**,
    **staging**, and **production**. Some organizations also provide a separate **testing**
    environment. Let’s first have a look at what is common across all environments.


    # Common components


    It’s important to note that what goes into all environments is driven by what
    is in the production environment. The production environment is the final destination
    of your application code. Accordingly, all other environments should match the
    operating system, database, web server, and PHP installation as closely as possible.
    Thus, for example, if the production environment enables the PHP OPCache extension,
    all other environments must enable this extension as well.


    All environments, including the production environment, need to have an operating
    system and PHP installation at a minimum. Depending on the needs of your application,
    it’s also quite common to have a web server and database server installed. The
    type and version of the web and database server should match that of the production
    environment as closely as possible.


    As a general rule, the closer your development environment matches that of the
    production environment, the less chance there is of a bug cropping up after deployment.


    We now look at what goes into a development environment.


    # Development environment


    The development environment is where you initially develop and test your code.
    It is unique in that it has the tools needed for application maintenance and development.
    This would include housing a source code repository (for example, Git), as well
    as various scripts needed to start, stop, and reset the environment.'
  merge: -1
  img_proc: true
- pgno: 432
  md: 'Often the development environment will have scripts to trigger an automated
    deployment procedure. Such scripts could take the place of **commit hooks**, designed
    to activate when you issue a commit to your source code repository. One example
    of this is **Git Hooks**, script files that can be placed in the `.git/hooks`
    directory.


    > **Tip**

    > For more information on Git Hooks, have a look at the documentation here:

    > `https://git-scm.com/book/en/v2/Customizing-Git-Git-Hooks.`


    The traditional development environment consisted of a personal computer with
    a database server, web server, and PHP. This conventional paradigm fails to take
    into account the variations that might be present in the target production environment.
    If you have 12 customers that you work with regularly, for example, it''s highly
    unlikely that all 12 customers have exactly the same OS, database server, web
    server, and version of PHP! The *best practice* is to model the production environment
    as closely as possible in the form of a virtual machine or Docker container.


    The code editor or **IDE (Integrated Development Environment)** is thus not located
    inside the development environment. Rather, you perform code creation and editing
    outside of the development environment. You would then push your changes locally
    either by directly copying files into the virtual development environment via
    a shared directory, or by committing changes to the source code repository, and
    then pulling the changes from inside the development environment virtual machine.


    It''s also appropriate to perform unit testing in the development environment.
    Developing unit tests will not only give you greater assurance that your code
    works in production, but is also a great way to spot bugs in the early stages
    of application development. And, of course, you need to do as much debugging as
    possible in the local environment! Catching and fixing a bug in development generally
    takes a tenth of the time you might spend fixing a bug found in production!


    Let''s now examine the staging environment.


    # Staging environment


    It''s quite common for large application development projects to have multiple
    developers all working on the same code base. In this situation, using version
    control repositories is critical. The *staging* environment is where all of the
    developers upload their code after development environment testing and debugging
    phases are complete.'
  merge: -1
  img_proc: true
- pgno: 433
  md: 'The staging environment must be an *exact copy* of the production environment.
    You can visualize the staging environment as the last step on an assembly line
    in a car plant. This is where all of the various pieces coming from one or more
    development environments are fit into place. The staging environment is a prototype
    of how production should appear.


    It''s important to note that often the staging server has direct internet access;
    however, it''s usually located in a secure area that requires a password before
    you can gain access.


    Finally, let''s have a look at the production environment.


    # Production environment


    The production environment is often maintained and hosted by the client directly.
    This environment is also referred to as the **live environment**. To make an analogy
    to a Bollywood production, if the development environment is practice, the staging
    environment is the dress rehearsal, and the production environment is the live
    show (perhaps minus the singing and dancing!).


    The production environment has direct internet access but is protected by a firewall,
    and is often further protected by an intrusion detection and prevention system
    (for example, `https://snort.org/`). In addition, the production environment may
    be hidden behind a reverse proxy configuration that runs on an internet-facing
    web server. Otherwise, at least theoretically, the production environment should
    be an *exact clone* of the staging environment.


    Now that you have an idea about the environments through which the application
    code moves on its way from development to production, let''s have a look at a
    critical first step in a PHP 8 migration: spotting potential BC code breaks.


    # Learning how to spot BC breaks before a migration


    Ideally, you should go into the PHP 8 migration with an action plan in hand. A
    critical part of this action plan includes getting an idea of how many potential
    BC breaks exist in your current code base. In this section, we show you how to
    develop a BC break sniffer that automates the process of looking through hundreds
    of code files for potential BC breaks.


    First, we''ll step back and review what we''ve learned so far about BC issues
    that might arise in PHP 8.'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# Gaining an overview of BC breaks


    You already know, having read the previous chapters in this book, that potential
    code breaks originate from several sources. Let''s briefly summarize the general
    trends that might lead to code failure after a migration. Please note that we
    do not cover these topics in this chapter as these are the topics that have all
    been covered in earlier chapters in this book:


    +   - Resource-to-object migration

    +   - Minimum versions for supporting OS libraries

    +   - Iterator to IteratorAggregate migration

    +   - Removed functions

    +   - Usage changes

    +   - Magic method signature enforcement


    Many of the changes can be detected by adding a simple callback based upon preg_match()
    or strpos(). Usage changes are much more difficult to detect as at a glance there''s
    no way for an automated break scanner to detect the result of usage without making
    extensive use of eval().


    Let''s now have a look at how a break scan configuration file might appear.


    # Creating a BC break scan configuration file


    A configuration file allows us to develop a set of search patterns independently
    of the BC break scanner class. Using this approach, the BC break scanner class
    defines the actual logic used to conduct the search whereas the configuration
    file provides a list of specific conditions along with a warning and suggested
    remedial actions.


    Quite a few potential code breaks can be detected by simply looking for the presence
    of the functions that have been removed in PHP 8. For this purpose, a simple strpos()
    search will suffice. On the other hand, a more complex search might require that
    we develop a series of callbacks. Let''s first have a look at how configuration
    might be developed based on a simple strpos() search.'
  merge: -1
  img_proc: true
- pgno: 435
  md: "# Defining a simple strpos() search configuration\n\nIn the case of a simple\
    \ strpos() search, all we need to do is to provide an array of key/value pairs,\
    \ where the key is the name of the removed function, and the value is its suggested\
    \ replacement. The search logic in the BC break scanner class can then do this:\n\
    \n```\n$contents = file_get_contents(FILE_TO_SEARCH);\nforeach ($config['removed']\
    \ as $key => $value)\n    if (str_pos($contents, $key) !== FALSE)  echo $value;\n\
    ```\n\nWe will cover the full BC break scanner class implementation in the next\
    \ section. For now, we just focus on the configuration file. Here's how the first\
    \ few strpos() search entries might appear:\n\n```\n// /repo/ch11/bc_break_scanner.config.php\n\
    use Migration\\BreakScan;\nreturn [\n    // not all keys are shown\n    BreakScan::KEY_REMOVED\
    \ => [\n        '__autoload' => 'spl_autoload_register(callable)',\n        'each'\
    \ => 'Use \"foreach()\" or ArrayIterator',\n        'fgetss' => 'strip_tags(fgets($fh))',\n\
    \        'png2wbmp' => 'imagebmp',\n        // not all entries are shown\n   \
    \ ],\n];\n```\n\nUnfortunately, some PHP 8 backward incompatibilities might prove\
    \ beyond the abilities of a simple strpos() search. We now turn our attention\
    \ toward detecting potential breaks caused by the PHP 8 resource-to-object migration.\n\
    \n# Detecting BC breaks associated with is_resource()\n\nIn Chapter 7, Avoiding\
    \ Traps When Using PHP 8 Extensions, in the PHP 8 extension resource to object\
    \ migration section, you learned that there is a general trend in PHP away from\
    \ resources and toward objects. As you may recall, this trend in and of itself\
    \ does not pose any threat of a BC break. However, if, in confirming that the\
    \ connection has been made, your code uses is_resource(), there is a potential\
    \ for a BC break."
  merge: -1
  img_proc: true
- pgno: 436
  md: "In order to account for this BC break potential, our BC break scan configuration\
    \ file needs to list any of the functions that formerly produced a resource but\
    \ now produce an object. We then need to add a method in the BC break scan class\
    \ (discussed next) that makes use of this list.\n\nThis is how the potential configuration\
    \ key of affected functions might appear:\n\n```\n```php\n// /repo/ch11/bc_break_scanner.config.php\n\
    return [  // not all keys are shown\n    BreakScan::KEY_RESOURCE => [\n      \
    \  'curl_init',\n        'xml_parser_create',\n        // not all entries are\
    \ shown\n    ],\n];\n```\n```\n\nIn the break scan class, all we need to do is\
    \ to first confirm that is_resource() is called, and then check to see if any\
    \ of the functions listed under the BreakScan::KEY_RESOURCE array are present.\n\
    \nWe now turn out attention to magic method signature violations.\n\n# Detecting\
    \ magic method signature violations\n\nPHP 8 strictly enforces magic method signatures.\
    \ If your classes use loose definitions where you do not perform method signature\
    \ data typing, and if you do not define a return value data type for magic methods,\
    \ you are safe from a potential code break. On the other hand, if your magic method\
    \ signatures do contain data types, and those data types do not match the strictly\
    \ defined set enforced in PHP 8, you have a potential code break on your hands!\n\
    \nAccordingly, we need to create a set of regular expressions needed to detect\
    \ magic method signature violations. In addition, our configuration should include\
    \ the correct signature. In this manner, if a violation is detected, we can present\
    \ the correct signature in the resulting message, speeding up the update process.\n\
    \nThis is how a magic method signature configuration might appear:\n\n```\n```php\n\
    // /repo/ch11/bc_break_scanner.config.php\nuse Php8\\Migration\\BreakScan;\nreturn\
    \ [\n    BreakScan::KEY_MAGIC => [\n```\n```"
  merge: -1
  img_proc: true
- pgno: 437
  md: "```\n'__call' => [ 'signature' =>\n    '__call(string $name, array $arguments):\
    \ mixed',\n    'regex' => '/__call\\s*\\((string\\s)?'\n        . '\\$.*? (array\\\
    s)?\\$.*?\\ ) (\\s*:\\s*mixed)?/',\n    'types' => ['string', 'array', 'mixed'],\n\
    \    // other configuration keys not shown\n    '__wakeup' => ['signature' =>\
    \ '__wakeup(): void',\n    'regex' => '/__wakeup\\s*\\(\\) (\\s*:\\s*void)?/',\n\
    \    'types' => ['void']],\n]\n    // other configuration keys not shown\n];\n\
    ```\n\nYou might notice that we included an extra option, types. This is included\
    \ in order to automatically generate a regular expression. The code that does\
    \ this is not shown. If you are interested, have a look at /path/to/repo/ch11/php7_build_magic_signature_regex.php.\n\
    \nLet's have a look at how you might handle complex break detection where a simple\
    \ strpos() search is not sufficient.\n\n# Addressing complex BC break detection\n\
    \nIn the case where a simple strpos() search proves insufficient, we can develop\
    \ another set of key/value pairs where the value is a callback. As an example,\
    \ take the potential BC break where a class defines a __destruct() method, but\
    \ also uses die() or exit() in the __construct() method. In PHP 8 it's possible\
    \ the __destruct() method might not get called under these circumstances.\n\n\
    In such a situation, a simple strpos() search is insufficient. Instead, we must\
    \ develop logic that does the following:\n\n+   - Checks to see if a __destruct()\
    \ method is defined. If so, no need to continue further as there is no danger\
    \ of a break in PHP 8.\n+   - Checks to see if die() or exit() is used in the\
    \ __construct() method. If so, issue a warning of a potential BC break."

    \ date is always users Fred, Betty, Barney, and Wilma. Additionally, note that\
    \ for dates with a time of 03:33:33, entries for Betty always precede Barney.\n\
    \n3. We then define a calling program. The first thing to do in this program is\
    \ to configure autoloading and use the Access class:\n\n```\n// /repo/ch010/php8_sort_stable_simple.php\n\
    require __DIR__ .\n'../src/Server/Autoload/Loader.php';\n$loader = new \\Server\\\
    Autoload\\Loader();\nuse Php8\\Sort\\Access;\n```\n\n4. Next, we load the sample\
    \ data into the $access array:\n\n```\n$access = [];\n$data = new SplFileObject(__DIR__\n\
    \ . '../sample_data/access.csv');\nwhile ($row = $data->fgetcsv())\n  if (!empty($row)\
    \ && count($row) === 2)\n    $access[] = new Access($row[0], $row[1]);\n```\n\n\
    5. We then execute usort(). Note that the user-defined callback function performs\
    \ a comparison of the time properties of each instance:\n\n```\nusort($access,\n\
    \  function($a, $b) { return $a->time <=> $b->time; });\n```"

- pgno: 181
  md: "You may be wondering why this is of concern. The reason why you need to be\
    \ aware of this important change is that you might have logic residing in the\
    \ __destruct() method that was called in a situation where you also might call\
    \ either exit() or die(). In PHP 8, you can no longer rely upon this code, which\
    \ may cause a backwards compatibility break.\n\nIn this example, we have two connection\
    \ classes. ConnectPdo uses the PDO extension to provide query results, whereas\
    \ ConnectMysqli uses the MySQLi extension:\n\n+   1. We begin by defining an interface\
    \ specifying a query method. This method requires a SQL string as an argument\
    \ and is expected to return an array as a result:\n+   2. Next, we define a base\
    \ class in which there is a __destruct() magic method defined. Because this class\
    \ implements ConnectInterface but doesn't define query(), it's marked abstract:\n\
    +   3. Next, we define the ConnectPdo class. It extends Base, and its query()\
    \ method uses PDO syntax to produce a result. The __construct() method throws\
    \ a PDOException if there is a problem creating the connection:\n\n```\n// /repo/src/Php7/Connector/ConnectInterface.php\n\
    namespace Php7\\Connector;\ninterface ConnectInterface {\n    public function\
    \ query(string $sql) : array;\n}\n```\n\n```\n// /repo/src/Php7/Connector/Base.php\n\
    namespace Php7\\Connector;\nabstract class Base implements ConnectInterface {\n\
    \    const CONN_TERMINATED = 'Connection Terminated';\n    public $conn = NULL;\n\
    \    public function __destruct() {\n        $message = get_class($this)\n   \
    \         . ':' . self::CONN_TERMINATED;\n        error_log($message);\n    }\n\
    }\n```\n\n```\n// /repo/src/Php7/Connector/ConnectPdo.php\nnamespace Php7\\Connector;\n\
    use PDO;\n```"

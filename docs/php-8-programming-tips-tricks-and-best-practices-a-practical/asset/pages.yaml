    TypeError: Unsupported operand types: array % int in /repo/ch06/php8_arith_non_scalar_ops.php:16\n\
    Adding two arrays\narray(3) {\n  [0]=>  int(1)\n  [1]=>  int(2)\n  [2]=>  int(3)\n\
    }\n```\n\nAs you can see from the output, PHP 8 consistently throws a TypeError,\
    \ except when adding two arrays. In both outputs, you may observe that when adding\
    \ two arrays, the second operand is ignored. If the objective is to combine the\
    \ two arrays, you must use array_merge() instead.\n\nLet’s now turn our attention\
    \ to a potentially significant change in PHP 8 string handling pertaining to the\
    \ order of precedence.\n\n# Examining changes in the order of precedence\n\nThe\
    \ order of precedence, also known as the order of operations, or operator precedence,\
    \ is a mathematical concept established in the late 18th and early 19th centuries.\
    \ PHP also adopted the mathematical operator precedence rules, with a unique addition:\
    \ the concatenate operator. An assumption was made by the founders of the PHP\
    \ language that the concatenate operator had equal precedence over the arithmetic\
    \ operators. This assumption was never challenged until the arrival of PHP 8."

- pgno: 281
  md: "# Differences in mb_strrpos()\n\nIn earlier versions of PHP, you were allowed\
    \ to pass a character encoding as a third argument to mb_strrpos() instead of\
    \ an offset. This bad practice is no longer supported in PHP 8. Instead, you can\
    \ either supply 0 as a third argument or consider using PHP 8 named arguments\
    \ (discussed in Chapter 1, Introducing New PHP 8 OOP Features, in the Understanding\
    \ named arguments section) to avoid having to supply a value as an optional parameter.\n\
    \nLet's now look at a code example that demonstrates the differences in handling\
    \ between PHP 7 and PHP 8. Proceed as follows:\n\n+   1. We first define a constant\
    \ to represent the character encoding we wish to use. A text string representing\
    \ a Thai language translation for The quick brown fox jumped over the fence is\
    \ assigned. We then use mb_convert_encoding() to ensure the correct encoding is\
    \ used. The code is illustrated in the following snippet:\n+   2. We then assign\
    \ the Thai language translation of fence to $needle and echo the length of the\
    \ string and the position of $needle in the text. We then invoke mb_strrpos()\
    \ to find the last occurrence of $needle. Note in the following code snippet that\
    \ we deliberately follow the bad practice of using the encoding as a third argument\
    \ rather than an offset:\n\n```\n```php\n// /repo/ch07/php7_mb_string_strpos.php\n\
    define('ENCODING', 'UTF-8');\n$text    = 'สุนัขจิ้งจอกสีน้ำตาลกระโดดข้ามรั้วอย่างรวดเร็ว';\n\
    $encoded = mb_convert_encoding($text, ENCODING);\n```\n```\n\n```\n```php\n$needle\

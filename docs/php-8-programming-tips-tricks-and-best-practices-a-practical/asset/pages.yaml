- pgno: 172
  md: 'An understanding of how the autoloading process works when using `spl_autoload_register()`
    is critical to your work as a developer. Failure to grasp how PHP automatically
    locates and loads classes will limit your ability to grow as a developer and could
    have a detrimental impact on your career path.


    Before getting into `spl_autoload_register()`, let''s first have a look at the
    `__autoload()` function.


    # Understanding the __autoload() function


    The `__autoload()` function was used by many developers as the primary source
    of autoloading logic. This function behaves much as a *magic method* does and
    that''s why it''s called automatically depending on the context. Circumstances
    that would trigger an automatic call to the `__autoload()` function include the
    moment when a new class instance is created, but where the class definition has
    not yet been loaded. Further, if the class extends another class, the autoload
    logic is also invoked in order to load the super class prior to the creation of
    the subclass that extends it.


    The advantage of using the `__autoload()` function was that it was quite easy
    to define, and was often defined in a website''s initial `index.php` file. The
    disadvantages included the following:


    +   - `__autoload()` was a PHP procedural function; not defined nor controlled
    using OOP principles. This can become an issue when defining unit tests for an
    application, for example.

    +   - If your application uses namespaces, the `__autoload()` function must be
    defined in the global namespace; otherwise, classes outside of the namespace in
    which the `__autoload()` function is defined will fail to load.

    +   - The `__autoload()` function doesn''t work well with `spl_autoload_register()`.
    If you define autoloading logic using both the `__autoload()` function and `spl_autoload_register()`,
    the `__autoload()` function logic is entirely ignored.'
  merge: -1
  img_proc: true
- pgno: 173
  md: "To illustrate potential problems, we'll define an OopBreakScan class, discussed\
    \ in more detail in Chapter 11, Migrating Existing PHP Apps to PHP 8:\n\n+   1.\
    \ First, we define and then add a method to the OopBreakScan class that scans\
    \ the file contents for the __autoload() function. Note that the error message\
    \ is a class constant defined in the Base class that simply warns of the presence\
    \ of the __autoload() function:\n\n```\n```php\nnamespace Migration;\nclass OopBreakScan\
    \ extends Base {\n    public static function scanMagicAutoloadFunction(\n    \
    \    string $contents, array &$message) : bool {\n        $found = 0;\n      \
    \  $found += (stripos($contents,\n            'function __autoload(') !== FALSE);\n\
    \        $message[] = ($found)\n            ? Base::ERR_MAGIC_AUTOLOAD\n     \
    \       : sprintf(Base::OK_PASSED,\n                __FUNCTION__);\n        return\
    \ (bool) $found;\n    }\n    // remaining methods not shown\n}\n```\n```\n\nThis\
    \ class extends a Migration\\Base class (not shown). This is significant as any\
    \ autoloading logic needs to find not only the subclass but its super class as\
    \ well.\n\n+   2. Next, we define a calling program in which a magic __autoload()\
    \ function is defined:\n\n```\n```php\n// /repo/ch05/php7_autoload_function.php\n\
    function __autoLoad($class) {\n    $fn = __DIR__ . '../src/'\n        . str_replace('\\\
    \\', '/', $class)\n        . '.php';\n    require_once $fn;\n}\n```\n```"

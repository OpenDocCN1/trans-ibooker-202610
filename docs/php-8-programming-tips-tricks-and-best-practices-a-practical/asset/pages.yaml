- pgno: 194
  md: "Any class that implements this interface has its custom serialize() and unserialize()\
    \ methods automatically invoked during native serialization or unserialization.\
    \ To illustrate this technique, consider the following example:\n\n+   1. First,\
    \ we define a class that implements the Serializable interface. The class defines\
    \ three properties – two of type string, the other representing date and time:\n\
    +   2. We then define a custom serialize() method that initializes the date and\
    \ time before serializing the object's properties. The unserialize() method restores\
    \ values to all properties:\n+   3. We then create an instance and examine its\
    \ contents using var_dump():\n+   4. The output from var_dump() shows us that\
    \ the u property is not yet initialized:\n\n```\n// /repo/ch05/php8_bc_break_serializable.php\n\
    class A implements Serializable {\n    private $a = 'A';\n    private $b = 'B';\n\
    \    private $u = NULL;\n}\n```\n\n```\npublic function serialize() {\n    $this->u\
    \ = new DateTime();\n    return serialize(get_object_vars($this));\n}\npublic\
    \ function unserialize($payload) {\n    $vars = unserialize($payload);\n    foreach\
    \ ($vars as $key => $val)\n        $this->$key = $val;\n}\n}\n```\n\n```\n$a1\
    \ = new A();\nvar_dump($a1);\n```\n\n```\nobject(A)#1 (3) {\n  [\"a\":\"A\":private]=>\
    \ string(1) \"A\"\n  [\"b\":\"A\":private]=> string(1) \"B\"\n  [\"u\":\"A\":private]=>\
    \ NULL\n}\n```"

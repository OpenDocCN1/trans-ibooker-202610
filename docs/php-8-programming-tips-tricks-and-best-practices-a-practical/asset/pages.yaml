- pgno: 175
  md: "# Learning to use spl_autoload_register()\n\nThe primary advantage of the spl_autoload_register()\
    \ function is that it allows you to register more than one autoloader. Although\
    \ this might seem like overkill, imagine the nightmare scenario where you are\
    \ using a number of different open source PHP libraries... and where they all\
    \ have their own autoloaders defined! As long as all such libraries use spl_autoload_register(),\
    \ having multiple autoloader callbacks poses no problem.\n\nEach autoloader registered\
    \ using spl_autoload_register() must be callable. Any of the following are considered\
    \ callable:\n\n+   - A PHP procedural function\n+   - An anonymous function\n\
    +   - A class method that can be called in a static manner\n+   - Any class instance\
    \ that defines the __invoke() magic method\n+   - An array in this form: [$instance,\
    \ 'method']\n\n> Tip\n> \n> Composer maintains its own autoloader, which in turn\
    \ relies upon spl_autoload_register(). If you are using Composer to manage your\
    \ open source PHP packages, you can simply include /path/to/project/vendor/autoload.php\
    \ at the start of your application code to use the Composer autoloader. To have\
    \ Composer autoload your application source code files, add one or more entries\
    \ into the composer.json file under the autoload : psr-4 key. For more information,\
    \ see https://getcomposer.org/doc/04-schema.md#psr-4.\n\nA quite typical autoloader\
    \ class might appear as follows. Note that this is the class we use for many of\
    \ the OOP examples shown in this book:\n\n+   1. In the __construct() method,\
    \ we assign the source directory. Following that, we call spl_auto_register()\
    \ using the array callable syntax noted above:\n\n```\n// /repo/src/Server/Autoload/Loader.php\n\
    namespace Server\\Autoload;\nclass Loader {\n    const DEFAULT_SRC = __DIR__ .\
    \ '/../../';\n    public $src_dir = '';\n    public function __construct($src_dir\
    \ = NULL) {\n```"
  merge: -1
  img_proc: true

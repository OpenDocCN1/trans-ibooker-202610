- pgno: 146
  md: '# Comparing data using FFI


    It''s important to keep in mind that when you create a C-language data structure
    using the FFI extension, it exists outside of your PHP application. As you saw
    in the preceding example (see the Creating and using FFI\CType instances section),
    PHP can interact with the C data to a certain extent. However, for comparison
    purposes, it''s best to use FFI::memcmp(), as native PHP functions might return
    inconsistent results.


    The two comparison functions available in the FFI extension are summarized here
    in Table 4.2:


    | FFI Method | Returns | Notes |

    |---|---|---|

    | isNull() | bool | Returns TRUE if the FFI\CData instance is a null pointer.
    |

    | memcmp() | int | Operates in much the same manner as the PHP strcmp() function,
    or the <=> operator. Returns a value less than 0 if the first FFI\CData instance
    is less than the second. Returns 0 if both are equal, and returns a value greater
    than 0 if the second agrument''s value is greater than the first. |


    Table 4.2 – Summary of FFI class comparison methods


    FFI::isNull() can be used to determine whether or not the FFI\CData instance is
    NULL. What is more interest is FFI::memcmp(). Although this function operates
    in the same manner as the spaceship operator (<=>), it accepts a third argument
    that represents how many bytes you wish to include in the comparison. The following
    example illustrates this usage:


    +   1. We first define a set of four variables representing FFI\CData instances
    that can contain up to six characters and populate the instances with sample data,
    as follows:


    ```

    // /repo/ch04/php8_ffi_memcmp.php

    $a = FFI::new("char[6]");

    $b = FFI::new("char[6]");

    $c = FFI::new("char[6]");

    $d = FFI::new("char[6]");

    ```'
  merge: -1
  img_proc: true
- pgno: 147
  md: "2. Recall that the C language treats character data as an array, so we can't\
    \ just directly assign a string, even if using the cdata property. Accordingly,\
    \ we need to define an anonymous function that populates the instances with letters\
    \ of the alphabet. We use the following code to do this:\n\n```\n```\n$populate\
    \ = function ($cdata, $start, $offset, $num) {\n    for ($x = 0; $x < $num; $x++)\n\
    \        $cdata[$x + $offset] = chr($x + $offset +\n                         \
    \           $start);\n    return $cdata;\n};\n```\n```\n\n3. Next, we use the\
    \ function to populate the four FFI\\CData instances with differing sets of letters,\
    \ as follows:\n\n```\n```\n$a = $populate($a, 65, 0, 6);\n$b = $populate($b, 65,\
    \ 0, 3);\n$b = $populate($b, 85, 3, 3);\n$c = $populate($c, 71, 0, 6);\n$d = $populate($d,\
    \ 71, 0, 6);\n```\n```\n\n4. We can now use the FFI::string() method to display\
    \ the contents thus far, as follows:\n\n```\n```\n$patt = \"%2s : %6s\\n\";\n\
    printf($patt, '$a', FFI::string($a, 6));\nprintf($patt, '$b', FFI::string($b,\
    \ 6));\nprintf($patt, '$c', FFI::string($c, 6));\nprintf($patt, '$d', FFI::string($d,\
    \ 6));\n```\n```\n\n5. Here is the output from the printf() statements:\n\n```\n\
    ```\n$a : ABCDEF\n$b : ABCXYZ\n$c : GHIJKL\n$d : GHIJKL\n```\n```"

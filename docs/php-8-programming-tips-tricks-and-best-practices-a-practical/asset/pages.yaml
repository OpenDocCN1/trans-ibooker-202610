- pgno: 148
  md: '6. As you can see from the output, the values of $c and $d are the same. The
    first three characters for $a and $b are the same, but the last three are different.


    7. At this point, if we were to try to use the spaceship operator (<=>) for comparison,
    the result would be the following:


    ```

    PHP Fatal error: Uncaught FFI\Exception: Comparison of incompatible C types

    ```


    8. Likewise, an attempt to use strcmp(), even though the data is a character type,
    the result would be as follows:


    ```

    PHP Warning: strcmp() expects parameter 1 to be string, object given

    ```


    9. Accordingly, our only alternative is to use FFI::memcmp(). In the set of comparisons
    shown here, note that the third argument is 6, indicating PHP should compare up
    to six characters:


    ```

    $p = "%20s : %2d\n";

    printf($p, ''memcmp($a, $b, 6)'', FFI::memcmp($a, $b, 6));

    printf($p, ''memcmp($c, $a, 6)'', FFI::memcmp($c, $a, 6));

    printf($p, ''memcmp($c, $d, 6)'', FFI::memcmp($c, $d, 6));

    ```


    10. As expected, the output is the same as using the spaceship operator on native
    PHP strings, as shown here:


    ```

    memcmp($a, $b, 6) : -1

    memcmp($c, $a, 6) : 1

    memcmp($c, $d, 6) : 0

    ```


    11. Note what happens if we restrict the comparison to only three characters.
    Here is another FFI::memcmp() comparison added to the code block, setting the
    third argument to 3:


    ```

    echo "\nUsing FFI::memcmp() but not full length\n";

    printf($p, ''memcmp($a, $b, 3)'', FFI::memcmp($a, $b, 3));

    ```'

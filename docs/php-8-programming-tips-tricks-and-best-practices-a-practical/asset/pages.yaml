    Now that you have an idea of changes in array handling in PHP 8, let''s have a
    look at changes in security-related functions.


    # Mastering changes in security functions and settings


    Any changes to PHP security features are worth noting. Unfortunately, given the
    state of the world today, attacks on any web-facing code are a given. Accordingly,
    in this section, we address several changes to security-related PHP functions
    in PHP 8. The changed functions affected include the following:


    +   - assert()

    +   - password_hash()

    +   - crypt()'

- pgno: 319
  md: "3. We then format the same amount using the de_DE locale, as follows:\n\n```\n\
    $fmt = new NumberFormatter( 'de_DE',\n    NumberFormatter::CURRENCY );\necho \"\
    Natl: \" . $fmt->formatCurrency($amt, 'EUR') . \"\\n\";\n$fmt->setSymbol(NumberFormatter::CURRENCY_SYMBOL,\
    \ 'EUR');\necho \"Intl: \" . $fmt->format($amt) . \"\\n\";\n```\n\nHere is the\
    \ output from PHP 8:\n\n```\nroot@php8_tips_php8 [ /repo/ch08 ]#\nphp php8_number_formatter_fmt_curr.php\n\
    Natl: $1,234,567.89\nIntl: USD 1,234,567.89\nNatl: 1.234.567,89 €\nIntl: 1.234.567,89\
    \ EUR\n```\n\nAs you can see from the output, the comma decimal is reversed between\
    \ the en_US and de_DE locales, as expected. You also see that both the currency\
    \ symbols, as well as the ISO currency codes, are correctly rendered.\n\nNow that\
    \ you have an idea of how to replace money_format(), let's have a look at other\
    \ programming code usage that has been removed in PHP 8.\n\n# Discovering other\
    \ PHP 8 usage changes\n\nThere are a number of program code usage changes that\
    \ you need to be aware of in PHP 8. We'll start with a look at two typecasts that\
    \ are no longer allowed.\n\n# Removed typecasts\n\nDevelopers often use forced\
    \ typecasts in order to ensure the data type of a variable is appropriate for\
    \ a particular usage. As an example, when processing a HyperText Markup Language\
    \ (HTML) form submission, for the sake of argument, let's say one of the form\
    \ elements represents a monetary amount. A quick and easy way to sanitize this\
    \ data element is to typecast it to a float data type, as follows:\n\n```\n$amount\
    \ = (float) $_POST['amount'];\n```\n\nHowever, rather than typecast to float,\
    \ some developers prefer to use real or double. Interestingly, all three produce\
    \ exactly the same result! In PHP 8, the typecast to real has been removed. If\
    \ your code uses this typecast, a best practice is to change it to float."

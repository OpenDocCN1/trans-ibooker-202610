- pgno: 121
  md: 'The key point we need to convey in this situation is that allowing such bad
    coding to remain was marginally acceptable in the past. Following a PHP 8 upgrade,
    however, as you can clearly see from the output, your code will fail. Now, let''s
    have a look at empty string offsets.


    # Empty string offset error handling


    Believe it or not, in versions of PHP prior to PHP 7, developers were allowed
    to remove characters from a string by assigning an empty value to the target offset.
    As an example, have a look at this block of code:


    ```

    // /repo/ch03/php8_error_str_empty.php

    $str = ''ABCDEFGHIJKLMNOPQRSTUVWXYZ'';

    $str[5] = '''';

    echo $str . "\n";

    ```


    The intent of this code example is to remove the letter F from the string represented
    by $str. Amazingly, in PHP 5.6, you can see from this screenshot that the attempt
    is entirely successful:


    ![](img/dbf2674d5b31107c344104b5edcb21c5_121_0.png)


    Figure 3.1 – PHP 5.6 output showing successful character removal


    Please note that the virtual environments we use to demonstrate code in this book
    allow access to both PHP 7.1 and PHP 8. In order to properly demonstrate how PHP
    5 behaved, we mounted a PHP 5.6 Docker image and took a screenshot of the result.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'In PHP 7, however, this practice is prohibited and a Warning is issued, as
    seen here:


    ```

    PHP Warning: Cannot assign an empty string to a string offset in /repo/ch03/php8_error_str_empty.php
    on line 5

    ABCDEFGHIJKLMNOPQRSTUVWXYZ

    ```


    As you can see from the preceding output, the script is allowed to execute; however,
    the attempt to remove the letter F is unsuccessful. In PHP 8, as we have discussed,
    the Warning is promoted to an Error and the entire script aborts, as shown here:


    ```

    PHP Fatal error: Uncaught Error: Cannot assign an empty string to a string offset
    in /repo/ch03/php8_error_str_empty.php:5

    ```


    We next examine situations where former Notices are promoted to Warnings in PHP
    8.


    # Understanding notices promoted to warnings


    There are a number of situations that are considered less critical to the stability
    of the PHP engine during runtime that were underrated in versions of PHP prior
    to PHP 7. Unfortunately, it was customary for new (or perhaps lazy!) PHP developers
    to simply ignore Notices in their rush to get their code into production.


    PHP standards have dramatically tightened over the years, leading the PHP core
    team to upgrade certain error conditions from Notice to Warning. Neither error
    reporting level will cause the code to stop working. However, it is felt by the
    PHP core team that the Notice-to-Warning promotion will make bad programming practices
    keenly visible. Warnings are much less likely to be ignored, ultimately leading
    to better code.


    Here is a brief list of error conditions leading to a Notice being issued in earlier
    versions of PHP, where the same condition now generates a Warning in PHP 8:


    +   - Non-existent object property access attempts

    +   - Non-existent static property access attempts

    +   - Attempt to access an array element using a non-existent key

    +   - Misusing a resource as an array offset

    +   - Ambiguous string offset cast

    +   - Non-existent or uninitialized string offset


    Let''s first have a look at Notice promotions in cases involving objects.'
  merge: -1
  img_proc: true

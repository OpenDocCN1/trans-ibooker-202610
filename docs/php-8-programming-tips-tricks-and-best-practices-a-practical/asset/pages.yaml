- pgno: 309
  md: '# Discovering what has been removed from the core


    In this section, we consider not only functions and classes that have been removed
    from PHP 8, but we will also have a look at usage that has been removed as well.
    We will then have a look at class methods and functions that still exist but no
    longer serve any useful purpose due to other changes in PHP 8. Knowing which functions
    have been removed is extremely important in order to protect against a potential
    code break following a PHP 8 migration.


    Let''s start by examining functions removed in PHP 8.


    # Examining functions removed in PHP 8


    There are a number of functions in the PHP language that have only been retained
    thus far in order to maintain backward compatibility. However, maintenance of
    such functions drains resources away from core language development. Further,
    for the most part, such functions have been superseded by better programming constructs.
    Accordingly, there has been a slow process whereby such commands have been slowly
    dropped from the language as evidence has mounted that they are no longer being
    used.


    > **Tip**

    > The PHP core team occasionally runs statistical analysis on PHP repositories
    based on GitHub. In this way, they are able to determine the frequency of usage
    of the various commands in the PHP core.'
  merge: -1
  img_proc: true
- pgno: 310
  md: "The table shown next summarizes the functions that have been removed in PHP\
    \ 8 and what to use in their place:\n\n| Removed Function | Suggested Replacement\
    \ |\n|---|---|\n| __autoload() | spl_autoload_register() |\n| convert_cyr_string()\
    \ | mb_convert_encoding() |\n| create_function() | function () {}<br>fn () =>\
    \ <expression> |\n| each() | ArrayIterator |\n| ezmlm_hash() | none other than\
    \ running an OS command |\n| fgetss() | strip_tags(fgets()) |\n| get_magic_quotes_gpc()\n\
    get_magic_quotes_runtime() | none: the magic quotes feature itself has been removed\
    \ from PHP |\n| hebrevc() | hebrev() |\n| is_real() | is_float() |\n| money_format()\
    \ | NumberFormatter::formatCurrency |\n| restore_include_path() | ini_restore('include_path')\
    \ |\n\nTable 8.1 – PHP 8 removed functions and suggested replacements\n\nFor the\
    \ remainder of this section, we cover a few of the more important removed functions\
    \ and give you suggestions on how to refactor your code to achieve the same results.\
    \ Let's start by examining each().\n\n# Working with each()\n\neach() was introduced\
    \ in PHP 4 as a way of walking through an array, producing key/value pairs upon\
    \ each iteration. The syntax and usage of each() is extremely simple and is oriented\
    \ toward procedural usage. We'll show a short code example that demonstrates each()\
    \ usage, as follows:\n\n+   1. In this code example, we first open a connection\
    \ to a data file containing city data from the GeoNames (https://geonames.org)\
    \ project, as follows:\n\n```\n// /repo/ch08/php7_each.php\n$data_src = __DIR__\n\
    \    . '../sample_data/cities15000_min.txt';\n$fh       = fopen($data_src, 'r');\n\
    $pattern  = \"%30s : %20s\\n\";\n$target   = 1000000;\n$data     = [];\n```"
  merge: -1
  img_proc: true
- pgno: 311
  md: "2. We then use the fgetcsv() function to pull a row of data into $line, and\
    \ pack latitude and longitude information into a $data array. Note in the following\
    \ code snippet that we filter out rows of data on cities with a population less\
    \ than $target (in this case, less than 10 million):\n\n```\nwhile ($line = fgetcsv($fh,\
    \ '', \"\\t\")) {\n    $popNum = $line[14] ?? 0;\n    if ($popNum > $target) {\n\
    \        $city = $line[1] ?? 'Unknown';\n        $data[$city] = $line[4] . ','\
    \ . $line[5];\n    }\n}\n```\n\n3. We then close the file handle and sort the\
    \ array by city name. To present the output, we use each() to walk through the\
    \ array, producing key/value pairs, where the city is the key, and latitude and\
    \ longitude is the value. The code is illustrated in the following snippet:\n\n\
    ```\nfclose($fh);\nksort($data);\nprintf($pattern, 'City', 'Latitude/Longitude');\n\
    printf($pattern, '----', '------------------');\nwhile ([$city, $latLon] = each($data))\
    \ {\n    $city = str_pad($city, 30, ' ', STR_PAD_LEFT);\n    printf($pattern,\
    \ $city, $latLon);\n}\n```\n\nHere is the output as it appears in PHP 7:\n\n```\n\
    root@php8_tips_php7 [/repo/ch08]# php php7_each.php\n                City :  \
    \ Latitude/Longitude\n                ---- :   ------------------\n          \
    \  Beijing :    39.9075,116.39723\n        Buenos Aires :   -34.61315,-58.37723\n\
    \              Delhi :    28.65195,77.23149\n              Dhaka :    23.7104,90.40744\n\
    \          Guangzhou :    23.11667,113.25\n           Istanbul :    41.01384,28.94966\n\
    \            Karachi :    24.8608,67.0104\n```"

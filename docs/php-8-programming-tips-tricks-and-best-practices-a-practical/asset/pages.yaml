    \ the PHP script for immediate testing.\n\nStarting with PHP 7.4 and carried on\
    \ into PHP 8, an improved version of the FFI extension was proposed by core developer\
    \ Dmitry Stogov. After a compelling proof of concept (see the preceding Tip box\
    \ regarding PHP binding to the TensorFlow machine learning platform), this FFI\
    \ extension version was incorporated into the PHP language.\n\n> **Tip**\n> \n\
    > The original FFI PHP extension can be found here: http://pecl.php.net/package/ffi.\

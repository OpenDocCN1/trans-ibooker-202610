- pgno: 313
  md: "3. Finally, we sort by key, rewind to the top, and loop while the iteration\
    \ still has more values. We use key() and current() methods to retrieve key/value\
    \ pairs, as follows:\n\n```\n```php\n$data->ksort();\n$data->rewind();\nprintf($pattern,\
    \ 'City', 'Latitude/Longitude');\nprintf($pattern, '----', '------------------');\n\
    while ($data->valid()) {\n    $city = str_pad($data->key(), 30, ' ', STR_PAD_LEFT);\n\
    \    printf($pattern, $city, $data->current());\n    $data->next();\n}\n```\n\
    ```\n\nThis code example will actually work in any version of PHP, from PHP 5.1\
    \ up to and including PHP 8! The output is exactly as shown in the preceding PHP\
    \ 7 output and is not duplicated here.\n\nLet's now have a look at create_function().\n\
    \n# Working with create_function()\n\nPrior to PHP 5.3, the only way to assign\
    \ a function to a variable was to use create_function(). Starting with PHP 5.3,\
    \ the preferred approach is to define an anonymous function. Anonymous functions,\
    \ although technically part of the procedural programming application programming\
    \ interface (API), are actually instances of the Closure class, and thus also\
    \ belong to the realm of OOP.\n\n> **Tip**\n> If the functionality you need can\
    \ be condensed into a single expression, in PHP 8 you also have the option of\
    \ using an **arrow function.**\n\nWhen the function defined by create_function()\
    \ was executed, PHP executed the eval() function internally. The result of this\
    \ architecture, however, is awkward syntax. Anonymous functions are equivalent\
    \ in performance and more intuitive to use."
  merge: -1
  img_proc: true
- pgno: 314
  md: "The following example demonstrates create_function() usage. The objective of\
    \ this example is to scan a web-server access log and sort the results by Internet\
    \ Protocol (IP) address:\n\n1. We start by recording the start time in microseconds.\
    \ Later, we use this value to determine performance. Here's the code you'll need:\n\
    \n```\n// /repo/ch08/php7_create_function.php\n$start = microtime(TRUE);\n```\n\
    \n2. Next, use create_function() to define a callback that reorganizes the IP\
    \ address at the start of each line into uniform segments of exactly three digits\
    \ each. We need to do this in order to perform a proper sort (defined later).\
    \ The first argument to create_function() is a string the represents the parameters.\
    \ The second argument is the actual code to be executed. The code is illustrated\
    \ in the following snippet:\n\n```\n$normalize = create_function(\n    '&$line,\
    \ $key',\n    '$split = strpos($line, \" \");'\n    . '$ip = trim(substr($line,\
    \ 0, $split));'\n    . '$remainder = substr($line, $split);'\n    . '$tmp = explode(\"\
    .\", $ip);'\n    . 'if (count($tmp) === 4)'\n    . '    $ip = vsprintf(\"%03d.%03d.%03d.%03d\"\
    , $tmp);'\n    . '$line = $ip . $remainder;'\n);\n```\n\nNote the extensive use\
    \ of strings. This awkward syntax can easily lead to syntax or logic errors, as\
    \ most code editors make no effort to interpret commands embedded in a string.\n\
    \n3. Next, we define a sorting callback to be used with usort(), as follows:\n\
    \n```\n$sort_by_ip = create_function(\n    '$line1, $line2',\n    'return $line1\
    \ <=> $line2;' );\n```"
  merge: -1
  img_proc: true
- pgno: 315
  md: "4. We then pull the contents of the access log into an array using the file()\
    \ function. We also move $sorted to a file to hold the sorted access log entries.\
    \ The code is illustrated in the following snippet:\n\n```\n$orig  = __DIR__ .\
    \ '../sample_data/access.log';\n$log   = file($orig);\n$sorted = new SplFileObject(__DIR__\n\
    \    './access_sorted_by_ip.log', 'w');\n```\n\n5. We are then able to normalize\
    \ the IP address using array_walk() and perform a sort using usort(), as follows:\n\
    \n```\narray_walk($log, $normalize);\nusort($log, $sort_by_ip);\n```\n\n6. Finally,\
    \ we write the sorted entries to the alternate log file and display the time difference\
    \ between start and stop, as follows:\n\n```\nforeach ($log as $line) $sorted->fwrite($line);\n\
    $time = microtime(TRUE) - $start;\necho \"Time Diff: $time\\n\";\n```\n\nWe are\
    \ not showing the completed alternate access log as it's far too lengthy to be\
    \ included in the book. Instead, here are a dozen lines pulled out from the middle\
    \ of the listing to give you an idea of the output:\n\n```\n094.198.051.136 -\

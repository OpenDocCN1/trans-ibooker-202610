    \    trigger_error(\"This is an error\", E_USER_ERROR);\n}\nset_error_handler('handler');\n\
    echo level1(TRUE, 222, 'C');\n```\n\nHere's the output running in PHP 7:\n\n```\n\
    root@php8_tips_php7 [ /repo/ch08 ]#\nphp php7_error_handler.php\nNumber : 256\n\
    String : This is an error\nFile   : /repo/ch08/php7_error_handler.php\nLine  \
    \ : 17\nContext:\narray (\n  'a' => true,\n  'b' => 222,\n  'c' => 'C',\n)\n```\n\
    \nAs you can see from the preceding output, $errorcontext provides information\
    \ about the arguments received by the function. In contrast, have a look at the\
    \ output produced by PHP 8, shown here:\n\n```\nroot@php8_tips_php8 [ /repo/ch08\
    \ ]#\nphp php7_error_handler.php\nNumber : 256\nString : This is an error\nFile\
    \   : /repo/ch08/php7_error_handler.php\nLine   : 17\n```\n\nAs you can see, the\
    \ output is identical except for a lack of information coming into $errorcontext.\

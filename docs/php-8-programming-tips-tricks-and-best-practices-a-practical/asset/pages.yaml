  md: "+   9. We then define a method that runs all scans (covered in the next section).\
    \ This method also collects the number of potential BC breaks detected and reports\
    \ back the total:\n\n```\n```php\npublic function runAllScans() : int {\n    $found\
    \ = 0;\n    $found += $this->scanRemovedFunctions();\n    $found += $this->scanIsResource();\n\

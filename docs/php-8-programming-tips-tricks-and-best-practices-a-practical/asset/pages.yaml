- pgno: 307
  md: '# 8

    Learning about

    PHP 8''s Deprecated

    or Removed

    Functionality


    This chapter walks you through functionality that has been deprecated or removed
    in PHP Hypertext Preprocessor 8 (PHP 8). This information is extremely important
    for any developer to know. Any code that uses removed functionality must be rewritten
    before an upgrade to PHP 8. Likewise, any deprecation is a clear signal to you
    that you must rewrite any code that depends upon such functionality, or risk problems
    in the future.


    After you have read the material in this chapter and followed the example application
    code, you can detect and rewrite code that has been deprecated. You can also develop
    workarounds for functionality that has been removed and learn how to refactor
    code that uses removed functionality involving extensions. Another important skill
    you will learn from this chapter is how to improve application security by rewriting
    code depending on removed functions.'
  merge: -1
  img_proc: true

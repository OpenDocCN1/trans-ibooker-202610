    As you can see, using the new PHP serialization feature is not complicated. Any
    timing issues are now fully in your control because the new magic methods are
    executed in the order in which the objects are serialized and unserialized.


    > **Important note**

    > PHP 7.4 and above *understands* serialized strings from older versions of PHP,
    however, strings serialized by PHP 7.4 or 8.x might not be properly unserialized
    by older versions of PHP.


    > **Tip**

    > For a full discussion, please see the RFC on custom serialization:

    > https://wiki.php.net/rfc/custom_object_serialization



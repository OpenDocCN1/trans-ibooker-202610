    ```\n\nThis concludes our examination of the BreakScan class. Now we turn our\
    \ attention to defining the calling program needed to run the scans programmed\
    \ into the BreakScan class.\n\n# Building a BreakScan class calling program\n\n\
    The main job of the program that calls the BreakScan class is to accept a path\
    \ argument and to recursively build a list of PHP files located in that path.\

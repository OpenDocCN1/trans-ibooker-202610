- pgno: 149
  md: '12. As you can see from the output shown here, by restricting memcmp() to only
    three characters, $a and $b are considered equal because they both start with
    the same three characters, a, b, and c:


    ```

    Using FFI::memcmp() but not full length

    memcmp($a, $b, 3) : 0


    \ = 'AAA';\nvar_dump($b);\n```\n```\n\n3. If we then run the program in PHP 7,\
    \ note that the first array is rendered correctly. It's entirely possible to have\
    \ negative array indexes in PHP 7 and earlier as long as they're directly assigned.\

- pgno: 303
  md: "# Working with Intl extension changes\n\nThe **Intl extension** consists of\
    \ several classes that handle a number of application aspects that might change\
    \ depending on the locale. The various classes handle such tasks as internationalized\
    \ number and currency formatting, text parsing, calendar generation, time and\
    \ date formatting, and character-set conversion, among other things.\n\nThe main\
    \ change introduced to the Intl extension in PHP 8 is the following new date formats:\n\
    \n+   - IntlDateFormatter::RELATIVE_FULL\n+   - IntlDateFormatter::RELATIVE_LONG\n\
    +   - IntlDateFormatter::RELATIVE_MEDIUM\n+   - IntlDateFormatter::RELATIVE_SHORT\n\
    \nA code example follows, showing the new formats. Here are the steps leading\
    \ to this:\n\n1. First, we define a DateTime instance and an array containing\
    \ the new format codes, as follows:\n\n```\n```php\n$dt = new DateTime('tomorrow');\n\
    $pt = [IntlDateFormatter::RELATIVE_FULL,\n    IntlDateFormatter::RELATIVE_LONG,\n\
    \    IntlDateFormatter::RELATIVE_MEDIUM,\n    IntlDateFormatter::RELATIVE_SHORT\n\
    ];\n```\n```\n\n2. We then loop through the formats and echo the output, as follows:\n\
    \n```\n```php\nforeach ($pt as $fmt)\n    echo IntlDateFormatter::formatObject($dt,\
    \ $fmt).\"\\n\";\n```\n```\n\nThis example doesn't work in PHP 7. Here is the\
    \ output from PHP 8:\n\n```\n```\nroot@php8_tips_php8 [ /repo/ch07 ]#\nphp php8_intl_date_fmt.php\n\
    tomorrow at 12:00:00 AM Coordinated Universal Time\ntomorrow at 12:00:00 AM UTC\n\
    tomorrow, 12:00:00 AM\ntomorrow, 12:00 AM\n```\n```"
  merge: -1
  img_proc: true
- pgno: 304
  md: 'As you can see, the new relative date formats work quite well! We now briefly
    return to the cURL extension.


    # Understanding cURL extension changes


    The cURL extension leverages libcurl (http://curl.haxx.se/) to provide powerful
    and highly efficient HTTP client capabilities. In PHP 8, you must have libcurl
    version 7.29 (or above) installed on your server''s operating system.


    Another difference in PHP 8 is that this extension now uses objects rather than
    resources. This change was described earlier in this chapter, in Table 7.1, PHP
    8 resource-to-object migration. An example was shown in the Potential code break
    involving is_resource() section. A side effect of this change is that any of the
    curl*close() functions are redundant, as the connection is closed when the object
    is unset or otherwise goes out of scope.


    Let''s now have a look at changes to the COM extension.


    # Reviewing COM extension changes


    **Component Object Model (COM)** is a Windows-only extension that enables programming
    code written in one language to call and interoperate with code written in any
    other COM-aware programming language. This information is important for any PHP
    developers who plan to develop PHP applications that run on Windows servers.


    The most significant change to the COM extension is that case sensitivity is now
    automatically enforced. Accordingly, you can no longer import from type libraries
    any constants that are case-insensitive. In addition, you can no longer specify
    $case_insensitive, the second argument to the com_load_typelib() function, as
    FALSE.


    Along these lines, COM extension php.ini settings that deal with case sensitivity
    have been altered. These include the following:


    +   - `com.autoregister_casesensitive`: Permanently enabled in PHP 8.

    +   - `com.typelib_file`: Any type libraries whose names end with either `#cis`
    or `#case_insensitive` no longer cause the constants to be treated as case-insensitive.


    One change is a new php.ini setting, com.dotnet_version. This setting sets the
    **.NET** version to use for dotnet objects. We now examine other extension changes
    of note.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Examining other extension changes


    There are a few other changes to other PHP extensions that deserve a mention.
    Table 7.5, shown next, summarizes these changes:


    | Extension | Functions | Notes |

    |---|---|---|

    | Date | mktime()

    gmmktime() | The first argument ($hour) is now mandatory |

    | Enchant | enchant_broker_list_dicts()

    enchant_broker_describe()

    enchant_dict_suggest() | If no results, these three functions now return an empty
    array instead of NULL |

    | Tidy | tidy_repair_string() | The $use_include_path parameter is no longer supported.
    |


    Table 7.5 – PHP 8 database library requirements


    You now have an idea about changes to extensions in PHP 8. This wraps up the chapter.
    Now, it''s time for a recap!


    # Summary


    One of the most important concepts you learned in this chapter is a general trend
    away from resources and toward objects. You learned where this trend is noticeable
    in the various PHP extensions covered in this chapter, and how to develop workarounds
    to avoid problems in code that relies upon resources. You also learned how to
    detect and develop code to address changes in XML extensions, especially in the
    SimpleXML and XMLWriter extensions.


    Another important extension with significant changes covered in this chapter is
    the mbstring extension. You learned to detect code that relies upon changed mbstring
    functionality. As you learned, changes to the mbstring extension for the most
    part mirror changes made to the equivalent core PHP string functions.


    You also learned about major changes to the GD, Reflection, and ZIP extensions.
    In this chapter, you also learned about changes to a number of database extensions,
    as well as a medley of additional extension changes to note. All in all, with
    the awareness you will have gained by reading this chapter and by studying the
    examples, you are now in a better position to prevent your applications from failing
    after you have performed a PHP 8 upgrade.


    In the next chapter, you will learn about functionality that has been deprecated
    or removed in PHP 8.'

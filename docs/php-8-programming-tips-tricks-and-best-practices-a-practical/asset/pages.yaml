- pgno: 256
  md: "# Understanding changes to assert() usage\n\nAs of PHP 8, it's no longer possible\
    \ to present `assert()` with string arguments to be evaluated: instead, you must\
    \ provide an expression. This presents a potential code break because in PHP 8,\
    \ the string is treated as an expression, and therefore always resolves to the\
    \ Boolean `TRUE`. Also, both the `assert.quiet_eval` php.ini directive, and the\
    \ `ASSERT_QUIET_EVAL` pre-defined constant used with `assert_options()`, have\
    \ been removed in PHP 8 as they now have no effect.\n\nTo illustrate the potential\
    \ problem, we first activate assertions by setting the php.ini directive, `zend.assertions=1`.\
    \ We then define an example program as follows:\n\n+   1. We use `ini_set()` to\
    \ cause `assert()` to throw an exception. We also define a variable, `$pi`:\n\
    +   2. We then attempt an assertion as an expression, `$pi === M_PI`:\n+   3.\
    \ In the last try/catch block, we attempt an assertion as a string:\n\n```\n```php\n\
    // /repo/ch06/php8_assert.php\nini_set('assert.exception', 1);\n$pi = 22/7;\n\
    echo 'Value of 22/7: ' . $pi . \"\\n\";\necho 'Value of M_PI: ' . M_PI . \"\\\
    n\";\n```\n```\n\n```\n```php\ntry {\n    $line   = __LINE__ + 2;\n    $message\
    \ = \"Assertion expression failed ${line}\\n\";\n    $result  = assert($pi ===\
    \ M_PI,\n        new AssertionError($message));\n    echo ($result) ? \"Everything's\
    \ OK\\n\"\n        : \"We have a problem\\n\";\n} catch (Throwable $t) {\n   \
    \ echo $t->getMessage() . \"\\n\";\n}\n```\n```\n\n```\n```php\ntry {\n    $line\
    \   = __LINE__ + 2;\n    $message = \"Assertion string failed ${line}\\n\";\n\
    \    $result  = assert('$pi === M_PI',\n        new AssertionError($message));\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 257
  md: "```\necho ($result) ? \"Everything's OK\\n\"\n: \"We have a problem\\n\";\n\
    } catch (Throwable $t) {\n    echo $t->getMessage() . \"\\n\";\n}\n```\n\n4. When\
    \ we run the program in PHP 7, everything works as expected:\n\n```\nroot@php8_tips_php7\
    \ [ /repo/ch06 ]# php php8_assert.php\nValue of 22/7: 3.1428571428571\nValue of\
    \ M_PI: 3.1415926535898\nAssertion as expression failed on line 18\nAssertion\
    \ as a string failed on line 28\n```\n\n5. The value of M_PI comes from the math\
    \ extension, and is far more accurate than simply dividing 22 by 7! Accordingly,\
    \ both assertions throw an exception. In PHP 8, however, the output is significantly\
    \ different:\n\n```\nroot@php8_tips_php8 [ /repo/ch06 ]# php php8_assert.php\n\
    Value of 22/7: 3.1428571428571\nValue of M_PI: 3.1415926535898\nAssertion as expression\
    \ failed on line 18\nEverything's OK\n```\n\nThe assertion as a string is interpreted\
    \ as an expression. Because the string is not empty, the Boolean result is TRUE,\
    \ returning a false positive. If your code relies upon the result of an assertion\
    \ as a string, it is bound to fail. As you can see from the PHP 8 output, however,\
    \ an assertion as an expression works the same in PHP 8 as in PHP 7.\n\nTip\n\
    Best practice: Do not use assert() in production code. If you do use assert(),\
    \ always provide an expression, not a string.\n\nNow that you have an idea of\
    \ changes to security-related functions, we bring this chapter to a close."

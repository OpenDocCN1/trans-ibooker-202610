- pgno: 283
  md: '# Changes to mb_ereg_replace()


    Formerly, you were able to supply an integer as an argument to mb_ereg_replace().
    This argument was interpreted as an ASCII code point. In PHP 8, such an argument
    is now typecast as string. If you need an ASCII code point, you need to use mb_chr()
    instead. As the typecast to string is done silently, there is a potential backward-compatible
    code break, in that you won''t see any Notice or Warning messages.


    The following program code example illustrates the differences between PHP 7 and
    PHP 8. We''ll follow these next steps:


    +   1. First, we define the encoding to be used and assign the Thai translation
    of *Two quick brown foxes jumped over the fence* as a multi-byte string to `$text`.
    Next, we use `mb_convert_encoding()` to ensure that the proper encoding is used.
    We then set `mb_ereg*` to the chosen encoding, using `mb_regex_encoding()`. The
    code is illustrated in the following snippet:

    +   2. We then call `mb_ereg_replace()` and supply as a first argument an integer
    value 50, and replace it with the string "3". Both the original and modified strings
    are echoed. You can view the code here:


    ```

    ```php

    // /repo/ch07/php7_mb_string_strpos.php

    define(''ENCODING'', ''UTF-8'');

    $text = ''สุนัขจิ้งจอกสีน้ำตาล 2 ตัวกระโดดข้ามรั้ว'';

    $str = mb_convert_encoding($text, ENCODING);

    mb_regex_encoding(ENCODING);

    ```

    ```


    ```

    ```php

    $mod1 = mb_ereg_replace(50, ''3'', $str);

    echo "Original: $str\n";

    echo "Modified: $mod1\n";

    ```

    ```


    Note that the first argument for mb_ereg_replace() should be a string, but we
    supply an integer instead. In versions of the mbstring extension prior to PHP
    8, if an integer is supplied as the first argument, it''s treated as an ASCII
    code point.


    If we run this code example in PHP 7, the number 50 is interpreted as the ASCII
    code point value for "2", as expected, as we can see here:


    ```

    ```

    root@php8_tips_php7 [ /repo/ch07 ]#

    php php7_mb_string_ereg_replace.php

    Original: สุนัขจิ้งจอกสีน้ำตาล 2 ตัวกระโดดข้ามรั้ว

    Modified: สุนัขจิ้งจอกสีน้ำตาล 3 ตัวกระโดดข้ามรั้ว

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'As you can see from the preceding output, the number 2 is replaced by the number
    3. In PHP 8, however, the number 50 is typecast into a string. As this source
    string doesn''t contain the number 50, no replacements are made, as we can see
    here:


    ```

    root@php8_tips_php8 [ /repo/ch07 ]#

    php php7_mb_string_ereg_replace.php

    Original: สุนัขจิ้งจอกสีน้ำตาล 2 ตัวกระโดดข้ามรัว

    Modified: สุนัขจิ้งจอกสีน้ำตาล 2 ตัวกระโดดข้ามรัว

    ```


    The danger here is that if your code relies upon this silent interpretation process,
    your application might either fail or exhibit inconsistent behavior. You''ll also
    note a lack of Notice or Warning messages. PHP 8 relies upon the developer to
    supply the correct arguments!


    The *best practice*, if you do actually need to use an ASCII code point, is to
    use `mb_chr()` to produce the desired search string. The modified code example
    might look like this:


    ```

    $mod1 = mb_ereg_replace(mb_chr(50), ''3'', $str);

    ```


    You now have an idea about what changed in the `mbstring` extension. Without this
    information, you could easily end up writing faulty code. Developers who are unaware
    of this information might end up making mistakes in PHP 8, such as assuming the
    `mbstring` aliases are still in place. Such mistaken understanding can easily
    cause hours of lost time tracking down errors in program code following a PHP
    8 migration.


    It''s now time to have a look at another extension with major changes: the GD
    extension.


    # Dealing with changes to the GD extension


    The **GD extension** is an image-manipulation extension that leverages the GD
    library. GD originally stood for **GIF Draw**. Oddly, the GD library had to withdraw
    support for the **Graphics Interchange Format (GIF)** after Unisys revoked the
    open source license for the compression technology used when generating GIFs.
    After 2004, however, the Unisys patent on this technology expired and GIF support
    was restored. As it stands today, the PHP GD extension offers support for the
    **Joint Photographic Experts Group (JPEG or JPG)**, **Portable Network Graphic
    (PNG)**, **GIF**, **X BitMap (XBM)**, **X PixMap (XPM)**, **Wireless Bitmap (WBMP)**,
    **WebP**, and **Bitmap (BMP)** formats.'
  merge: -1
  img_proc: true

    \ \"UTF-8\"\n    [26] => string(5) \"UTF-7\"\n    [27] => string(9) \"UTF7-IMAP\"\
    \n    [28] => string(5) \"ASCII\"\n    [29] => string(6) \"EUC-JP\"\n    [30]\
    \ => string(4) \"SJIS\"\n    [31] => string(9) \"eucJP-win\"\n    [32] => string(11)\
    \ \"EUC-JP-2004\"\n    [76] => string(6) \"KOI8-R\"\n    [78] => string(9) \"\
    ArmSCII-8\"\n    [79] => string(5) \"CP850\"\n    [80] => string(6) \"JIS-ms\"\
    \n    [81] => string(16) \"ISO-2022-JP-2004\"\n    [86] => string(7) \"CP50222\"\

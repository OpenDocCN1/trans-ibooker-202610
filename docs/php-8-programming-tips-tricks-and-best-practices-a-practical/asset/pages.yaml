    Now, let''s turn our attention to changes in the DateTime extension.


    # Using new DateTime methods


    When working with date and time, it''s often useful to create DateTimeImmutable
    instances. DateTimeImmutable objects are the same as DateTime objects, except
    that their property values cannot be altered. Knowing how to switch back and forth
    between DateTime and DateTimeImmutable is a useful technique and can save you
    from many hidden logic errors.


    Before we discuss the improvements that were made in PHP 8, let''s have a look
    at the potential problem that DateTimeImmutable solves.


    # Use case for DateTimeImmutable


    In this simple example, an array of three instances will be created representing
    30, 60, and 90 days from today. These will be used to form the basis of a 30-60-90-day
    accounts receivable aging report:


    +   1. First, let''s initialize a few key variables that represent the interval,
    date format, and array to hold the final values:


    ```

    // /repo/ch09/php7_date_time_30-60-90.php

    $days = [0, 30, 60, 90];

    ```'

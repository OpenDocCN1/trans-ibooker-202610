    It''s important to note that the error shown in PHP 8 does not tell you the real
    reason why the program failed. Hence, it''s extremely important that you scan
    your PHP applications, especially older applications, to see if there''s a method
    with the same name as the class. Accordingly, the best practice is to simply rename
    the method having the same name as the class to __construct().


    Now let''s have a look at how inconsistencies in handling Exception and exit in
    the class constructor have been addressed in PHP 8.


    # Addressing inconsistencies in the class constructor


    Another issue addressed in PHP 8 has to do with a situation where the class construct
    method either throws an Exception, or executes exit(). In PHP versions prior to
    PHP 8, if an Exception is thrown in the class constructor, the __destruct() method,
    if defined, is not called. On the other hand, if either exit() or die() (both
    PHP functions are equivalent to each other) is used in the constructor, the __destruct()
    method is called. In PHP 8, this inconsistency is addressed. Now, in either case,
    the __destruct() method is not called.'

- pgno: 460
  md: "To install PHP 8 on Red Hat, CentOS, or Fedora, open a command shell onto the\
    \ production server (or demo environment) and, as the root user, and proceed as\
    \ follows:\n\n1. First of all, it's a good idea to confirm the OS version and\
    \ release you're using. For that purpose, the uname command is used, along with\
    \ a simple cat command to view the release (stored as a text file in the /etc\
    \ directory):\n\n```\n[root@9d4e8c93d7b6 /]# uname -a\nLinux 9d4e8c93d7b6 5.8.0-55-generic\
    \ #62~20.04.1-Ubuntu\nSMP Wed Jun 2 08:55:04 UTC 2021 x86_64 x86_64 x86_64\nGNU/Linux\n\
    [root@9d4e8c93d7b6 /]# cat /etc/fedora-release\nFedora release 34 (Thirty Four)\n\
    ```\n\n2. Before getting started, be sure to update dnf and install the configuration\
    \ manager:\n\n```\ndnf upgrade\ndnf install 'dnf-command(config-manager)'\n```\n\
    \n3. You would then add Remi's repository to your package sources, using the version\
    \ number you prefer in place of NN:\n\n```\ndnf install \\\n    https://rpms.remirepo.net/fedora/remi-release-NN.rpm\n\
    ```\n\n4. At this point, you can confirm the versions of PHP installed using dnf\
    \ module list. We also use grep to limit the list of modules shown to PHP only.\
    \ The [e] designation indicates enabled:\n\n```\n[root@56b9fbf499d6 /]# dnf module\
    \ list | grep php\nphp                     remi-7.4 [e]      common [d] [i],\n\
    devel, minimal          PHP scripting language\nphp                     remi-8.0\
    \          common [d],\ndevel, minimal          PHP scripting language\n```\n\n\
    5. We then check the current version of PHP:\n\n```\n[root@d044cbe477c8 /]# php\
    \ --version\nPHP 7.4.20 (cli) (built: Jun  1 2021 15:41:56) (NTS)\nCopyright (c)\
    \ The PHP Group\nZend Engine v3.4.0, Copyright (c) Zend Technologies\n```"

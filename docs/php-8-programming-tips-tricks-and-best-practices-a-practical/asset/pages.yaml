- pgno: 133
  md: '# 4


    # Making Direct C-Language Calls


    This chapter introduces the **Foreign Function Interface (FFI)**. In this chapter,
    you will learn what FFI is all about, what it''s good for, and how to use it.
    This information in this chapter is important for developers interested in rapid
    custom prototyping using direct C-language calls.


    In this chapter, not only do you learn about the background behind introducing
    FFI into the PHP language, but you also learn how to incorporate C-language structures
    and functions directly into your code. Although—as you will learn—this should
    not be done to achieve greater speed, it does give you the ability to incorporate
    any C-language libraries directly into your PHP application. This ability opens
    the doors to an entire world of functionality hitherto unavailable to PHP.


    Topics covered in this chapter include the following:


    +   - Understanding FFI

    +   - Learning where to use FFI

    +   - Examining the FFI class

    +   - Using FFI in an application

    +   - Working with PHP callbacks'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Technical requirements


    To examine and run the code examples provided in this chapter, the minimum recommended
    hardware is listed here:


    +   - X86_64-based desktop PC or laptop

    +   - 1 **gigabyte (GB)** free disk space

    +   - 4 GB of **random-access memory (RAM)**

    +   - 500 **kilobits per second (Kbps)** or faster internet connection


    In addition, you will need to install the following software:


    +   - Docker

    +   - Docker Compose


    Please refer to the *Technical requirements* section of *Chapter 1, Introducing
    New PHP 8 OOP Features*, for more information on Docker and Docker Compose installation,
    as well as how to build the Docker container used to demonstrate code explained
    in this book. In this book, we refer to the directory in which you restored the
    sample code as `/repo`.


    The source code for this chapter is located here:


    ```

    https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices

    ```


    We can now begin our discussion by gaining an understanding of FFI.


    # Understanding FFI


    The main purpose of a FFI is to allow any given programming language the ability
    to incorporate code and function calls from external libraries written in other
    languages. An early example of this was the ability of 1980s microcomputers to
    incorporate assembler language into otherwise sluggish **Beginners'' All-purpose
    Symbolic Instruction Code (BASIC)** programming language scripts using the `PEEK`
    and `POKE` commands. Unlike many other languages, PHP did not have this capability
    prior to PHP 7.4, although it had been under discussion since 2004.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'In order to gain a full understanding of FFI in PHP 8, it''s necessary to digress
    and have a look at why it took so long for FFI to be fully adopted into the PHP
    language. It''s also necessary to take a quick look at PHP extensions in general,
    and the ability to work with C-language code. We first examine the relationship
    between PHP and the C language.


    # Relationship between PHP and the C language


    The **C language** was developed at Bell Labs by Dennis Ritchie in late 1972.
    Since that time, despite the introduction of its object-oriented cousin C++, this
    language continues to dominate the programming language landscape. PHP itself
    is written in C; accordingly, the ability to directly load C-shared libraries,
    and to gain direct access to C functions and data structures, is an incredibly
    important addition to the PHP language.


    The introduction of the FFI extension into the PHP language gives PHP the ability
    to load and directly work with both C structures and C functions. In order to
    make intelligent decisions about where and when you might want to use the FFI
    extension, let''s look at PHP extensions in general.


    # Understanding PHP extensions


    **PHP extensions**, as the title implies, *extend* the PHP language. Each extension
    can add **object-oriented programming (OOP)** classes as well as procedural-level
    functions. Each extension serves a distinct logical purpose—for example, the GD
    extension handles graphic image manipulation, while the PDO extension handles
    database access.


    As an analogy, consider a hospital. In the hospital, you have departments such
    as Emergency, Surgery, Pediatrics, Orthopedics, Cardiac, X-Ray, and so forth.
    Each department is self-contained and serves a distinct purpose. Collectively
    the departments form the hospital. In a like manner, PHP is like the hospital,
    and its extensions are like the various departments.


    Not all extensions are equal. Some extensions, referred to as **core extensions**,
    are always available when PHP is installed. Other extensions must be downloaded,
    compiled, and enabled manually. Let''s now have a look at core extensions.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Accessing PHP core extensions


    PHP core extensions are directly included in the main PHP source code repository
    located here: https://github.com/php/php-src/tree/master/ext. If you go to this
    web page, you''ll see a list of subdirectories, as shown in the following screenshot.
    Each subdirectory contains C-language code comprising the particular extension:


    ![](img/dbf2674d5b31107c344104b5edcb21c5_136_0.png)


    Figure 4.1 – PHP core extensions seen on GitHub


    Thus, when PHP is installed on a server, all of the core extensions are compiled
    and installed as well. We will now have a brief look at extensions that are not
    part of the core.


    # Examining non-core PHP extensions


    PHP extensions that are not part of the core are usually maintained by a specific
    vendor (**Microsoft** is an example). Very typically, non-core extensions are
    considered optional and are not widely used.


    Once a non-core extension starts getting used more and more frequently, it''s
    quite possible that it will eventually be migrated into the core. Examples of
    this are numerous. The most recent is the JSON extension: it''s now not only part
    of the core, but in PHP 8 this extension can no longer be disabled.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'It''s also possible for a core extension to be removed. An example of this
    is the `mcrypt` extension. This was deprecated in PHP 7.1 as the underlying library
    upon which this extension relied had been *abandoned* for over 9 years. In PHP
    7.2, it was formally removed from the core. We now consider where to find non-core
    extensions.


    # Finding non-core extensions


    A logical question you might ask at this point is: *Where do you get non-core
    extensions?* In general, non-core extensions are available directly from the vendor,
    from `github.com`, or from this website: `http://pecl.php.net/`. There have been
    complaints over the years that `pecl.php.net` contains outdated and unmaintained
    code. Although this is partially true, it is also true that up-to-date, actively

- pgno: 217
  md: 'Let''s first have a look at an aspect of PHP 8 string handling in functions
    that search for embedded strings.


    # Handling changes to the needle argument


    A number of PHP string functions search for the presence of a substring within
    a larger string. These functions include strpos(), strrpos(), stripos(), strripos(),
    strstr(), strchr(), strrchr(), and stristr(). All of these functions have these
    two parameters in common: the needle and the haystack.


    # Differentiating between the needle and the haystack


    To illustrate the difference between the needle and the haystack, have a look
    at the function signature for strpos():


    ```

    strpos(string $haystack,string $needle,int $pos=0):

    int|false

    ```


    $haystack is the target of the search. $needle is the substring to be sought.
    The strpos() function returns the position of the substring within the search
    target. If the substring is not found, the Boolean FALSE is returned. The other
    str*() functions produce different types of output that we will not detail here.


    Two key changes in how PHP 8 handles the needle argument have the potential to
    break an application migrated to PHP 8. These changes apply to situations where
    the needle argument is not a string or where the needle argument is empty. Let''s
    have a look at non-string needle argument handling first.


    # Dealing with non-string needle arguments


    Your PHP application might not be taking the proper precautions to ensure that
    the needle argument to the str*() functions mentioned here is always a string.
    If that is the case, in PHP 8, the needle argument will now always be interpreted
    as a string rather than an ASCII code point.


    If you need to supply an ASCII value, you must use the chr() function to convert
    it to a string. In the following example, the ASCII value for LF ("\n") is used
    instead of a string. In PHP 7 or below, strpos() performs an internal conversion
    before running the search. In PHP 8, the number is simply typecast into a string,
    yielding unexpected results.'
  merge: -1
  img_proc: true
- pgno: 218
  md: "Here is a code example that searches for the presence of LF within a string.\
    \ However, note that instead of providing a string as an argument, an integer\
    \ with a value of 10 is provided:\n\n```\n```php\n// /repo/ch06/php8_num_str_needle.php\n\
    function search($needle, $haystack) {\n    $found = (strpos($haystack, $needle))\n\
    \        ? 'contains' : 'DOES NOT contain';\n    return \"This string $found LF\
    \ characters\\n\";\n}\n$haystack = \"We're looking\\nFor linefeeds\\nIn this\n\
    \    string\\n\";\n$needle = 10;        // ASCII code for LF\necho search($needle,\
    \ $haystack);\n```\n```\n\nHere are the results of the code sample running in\
    \ PHP 7:\n\n```\n```\nroot@php8_tips_php7 [ /repo/ch06 ]#\nphp php8_num_str_needle.php\n\
    This string contains LF characters\n```\n```\n\nAnd here are the results of the\
    \ same code block running in PHP 8:\n\n```\n```\nroot@php8_tips_php8 [ /repo/ch06\
    \ ]#\nphp php8_num_str_needle.php\nThis string DOES NOT contain LF characters\n\
    ```\n```\n\nAs you can see, comparing the output in PHP 7 with the output in PHP\
    \ 8, the same code block yields radically different results. This is an extremely\
    \ difficult potential code break to spot as no Warnings or Errors are generated.\n\
    \nThe best practice is to apply a string type hint to the needle argument of any\
    \ function or method that incorporates one of the PHP str*() functions. If we\
    \ rewrite the previous example, the output is consistent in both PHP 7 and PHP\
    \ 8. Here is the same example rewritten using a type hint:\n\n```\n```php\n//\
    \ /repo/ch06/php8_num_str_needle_type_hint.php\ndeclare(strict_types=1);\nfunction\
    \ search(string $needle, string $haystack) {\n    $found = (strpos($haystack,\
    \ $needle))\n        ? 'contains' : 'DOES NOT contain';\n```\n```"

    \ number of entries (per directory) using ZipArchive::count(). You may also have\
    \ noticed that to check to see if the ZIP archive is opened properly, in PHP 8\
    \ you can no longer use is_resource().\n\n# New ZipArchive class methods\n\nIn\
    \ addition to resource-to-object migration, a number of improvements have been\
    \ made to the ZipArchive class. One such improvement is that the following new\
    \ methods have been added:\n\n+   - setMtimeName()\n+   - setMtimeIndex()\n+ \
    \  - registerProgressCallback()\n+   - registerCancelCallback()\n+   - replaceFile()\n\
    +   - isCompressionMethodSupported()\n+   - isEncryptionMethodSupported()\n\n\
    The method names are self-explanatory. Mtime refers to **modification time**.\n\
    \n# New options for addGlob() and addPattern()\n\nThe ZipArchive::addGlob() and\
    \ ZipArchive::addPattern() methods have a new set of options. These two methods\
    \ are similar in that both are used to add files to the archive. The difference\
    \ is that addGlob() uses the same file pattern as the core PHP glob() command,\
    \ whereas addPattern() filters files using a regex. The new set of options is\
    \ summarized here:\n\n+   - flags: Lets you combine the appropriate class constants\
    \ using *bitwise operators*\n+   - comp_method: Specifies the compression method\
    \ using any of the ZipArchive::CM_* constants as an argument"
  merge: -1

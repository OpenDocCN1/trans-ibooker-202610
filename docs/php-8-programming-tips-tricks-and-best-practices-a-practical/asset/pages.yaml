- pgno: 448
  md: "3. We then grab the BC break configuration file and create a BreakScan instance:\n\
    \n```\n```php\n$config = include __DIR__\n    . '/php8_bc_break_scanner_config.php';\n\
    $scanner = new BreakScan($config);\n```\n```\n\n4. To build a list of files we\
    \ use a RecursiveDirectoryIterator, wrapped inside a RecursiveIteratorIterator,\
    \ starting from the given path. This list is then filtered by FilterIterator,\
    \ limiting the scan to PHP files only:\n\n```\n```php\n$iter = new RecursiveIteratorIterator(\n\
    \    new RecursiveDirectoryIterator($path));\n$filter = new class ($iter) extends\
    \ FilterIterator {\n    public function accept() {\n        $obj = $this->current();\n\
    \        return ($obj->getExtension() === 'php');\n    }\n};\n```\n```\n\n5. If\
    \ the developer chooses the CSV option, an SplFileObject instance is created.\
    \ At the same time, we write out an array of headers. Further, we define an anonymous\
    \ function that writes to the CSV file:\n\n```\n```php\nif ($csv) {\n    $csv_file\
    \ = new SplFileObject($csv, 'w');\n    $csv_file->fputcsv(\n        ['Directory','File','OK','Messages']);\n\
    }\n$write = function ($dir, $fn, $found, $messages)\n    use ($csv_file) {\n \
    \   $ok = ($found === 0) ? 1 : 0;\n    $csv_file->fputcsv([$dir, $fn, $ok, $messages]);\n\
    \    return TRUE;\n};\n```\n```"
  merge: -1
  img_proc: true
- pgno: 449
  md: "6. We launch the scan by looping through the list of files presented by the\
    \ FilterIterator instance. As we are scanning file by file, on each pass $found\
    \ is zeroed out. We do maintain $total, however, to give a total count of potential\
    \ BC breaks at the end. You might also note that we distinguish files from directories.\
    \ If the directory changes, its name is displayed as a header:\n\n```\n$dir =\
    \ '';\n$total = 0;\nforeach ($filter as $name => $obj) {\n    $found = 0;\n  \
    \  $scanner->clearMessages();\n    if (dirname($name) !== $dir) {\n        $dir\
    \ = dirname($name);\n        echo \"Processing Directory: $name\\n\";\n    }\n\
    }\n```\n\n7. We use SplFileObject::isDir() to determine if the item in the file\
    \ list is a directory. If so, we continue with the next item on the list. We then\
    \ push the file contents into $scanner and run all scans. Messages are then retrieved\
    \ in the form of a string:\n\n```\nif ($obj->isDir()) continue;\n$fn = basename($name);\n\
    $scanner->getFileContents($name);\n$found = $scanner->runAllScans();\n$messages\
    \ = implode(\"\\n\", $scanner->getMessages());\n```\n\n8. We use a switch() block\
    \ to take action based on the display level represented by $show. Level 0 only\
    \ shows files where potential BC breaks are found. Level 1 shows that plus messages.\
    \ Level 2 shows all possible output, including success messages:\n\n```\nswitch\
    \ ($show) {\n    case 2:\n        echo \"Processing: $fn\\n\";\n        echo \"\
    $messages\\n\";\n        if ($csv)\n            $write($dir, $fn, $found, $messages);\n\
    \        break;\n    case 1:\n        if (!$found) break;\n```"
  merge: -1
  img_proc: true
- pgno: 450

    \ support is now automatic; however, you must have libpng and zlib installed on\
    \ your operating system.\n\nWe will now have a look at other minor changes to\
    \ the GD extension.\n\n# Other GD extension changes\n\nAside from the major changes\
    \ described in the previous section, a number of other minor changes have taken\
    \ place, in the form of function signature changes and a new function. Let's start\
    \ this discussion by having a look at the imagecropauto() function.\n\nHere is\
    \ the old function signature for imagecropauto():\n\n```\nimagecropauto(resource\
    \ $image , int $mode = -1,\n    float $threshold = .5 , int $color = -1 )\n```\n\
    \nIn PHP 8, the $image parameter is now of type GdImage. The $mode parameter now\
    \ defaults to an IMG_CROP_DEFAULT predefined constant.\n\nAnother change affects\

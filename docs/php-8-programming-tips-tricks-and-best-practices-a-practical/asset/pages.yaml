- pgno: 406
  md: "# Working with SplFixedArray changes in PHP 8\n\nYou might recall a brief discussion\
    \ on the Traversable interface in Chapter 7, Avoiding Traps When Using PHP 8 Extensions,\
    \ in the Traversable to IteratorAggregate migration section. The same considerations\
    \ brought out in that section also apply to SplFixedArray. Although SplFixedArray\
    \ does not implement Traversable, it does implement Iterator, which in turn extends\
    \ Traversable.\n\nIn PHP 8, SplFixedArray no longer implements Iterator. Instead,\
    \ it implements IteratorAggregate. The benefit of this change is that SplFixedArray\
    \ in PHP 8 is faster, more efficient, and also safe to use in nested loops. The\
    \ downside, and also a potential code break, is if you are using SplFixedArray\
    \ along with any of these methods: current(), key(), next(), rewind(), or valid().\n\
    \nIf you need access to array navigation methods, you now must use the SplFixedArray::getIterator()\
    \ method to access the inner iterator, from which all of the navigation methods\
    \ are available. A simple code example, shown here, illustrates the potential\
    \ code break:\n\n+   1. We start by building an SplFixedArray instance from an\
    \ array:\n+   2. We then use array navigation methods to iterate through the array:\n\
    \n```\n// /repo/ch10/php7_spl_fixed_arr_iter.php\n$arr = ['Person', 'Woman', 'Man',\
    \ 'Camera',\n' TV'];$fixed = SplFixedArray::fromArray($arr);\n```\n\n```\nwhile\
    \ ($fixed->valid()) {\n    echo $fixed->current() . '. ';\n    $fixed->next();\n\
    }\n```\n\nIn PHP 7, the output is the five words in the array:\n\n```\nroot@php8_tips_php7\
    \ [ /repo/ch10 ]#\nphp php7_spl_fixed_arr_iter.php\nPerson. Woman. Man. Camera.\
    \ TV.\n```\n\nIn PHP 8, however, the result is quite different, as seen here:\n\
    \n```\nroot@php8_tips_php8 [ /repo/ch10 ]#\nphp php7_spl_fixed_arr_iter.php\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 407
  md: "```\nPHP Fatal error: Uncaught Error: Call to undefined method SplFixedArray::valid()\
    \ in /repo/ch10/php7_spl_fixed_arr_iter.php:5\n```\n\nIn order to get the example\
    \ working in PHP 8, all you need to do is to use the SplFixedArray::getIterator()\
    \ method to access the inner iterator. The remainder of the code does not need\
    \ to be rewritten. Here is the revised code example rewritten for PHP 8:\n\n```\n\
    // /repo/ch10/php8_spl_fixed_arr_iter.php\n$arr  = ['Person', 'Woman', 'Man',\
    \ 'Camera', 'TV'];\n$obj  = SplFixedArray::fromArray($arr);\n$fixed = $obj->getIterator();\n\
    while ($fixed->valid()) {\n    echo $fixed->current() . '. ';\n    $fixed->next();\n\
    }\n```\n\nThe output is now the five words, without any errors:\n\n```\nroot@php8_tips_php8\
    \ [ /repo/ch10 ]#\nphp php8_spl_fixed_arr_iter.php\nPerson. Woman. Man. Camera.\
    \ TV.\n```\n\nNow that you have an idea of how to improve array handling performance,\
    \ we'll turn our attention to yet another aspect of array performance: sorting.\n\
    \n# Implementing stable sort\n\nWhen designing the logic for array sorting, the\
    \ original PHP developers sacrificed stability for speed. At the time, this was\
    \ considered a reasonable sacrifice. However, if complex objects are involved\
    \ in the sorting process, a stable sort is needed.\n\nIn this section, we discuss\
    \ what stable sort is, and why it's important. If you can ensure that data is\
    \ stably sorted, your application code will produce more accurate output, which\
    \ results in greater customer satisfaction. Before we get into the details of\
    \ how PHP 8 enables stable sorting, we first need to define what a stable sort\
    \ is."
  merge: -1
  img_proc: true
- pgno: 408
  md: '# Understanding stable sorts


    When the values of properties used for the purposes of a sort are equal, in a
    stable sort the original order of elements is guaranteed. Such a result is closer
    to user expectations. Let''s have a look at a simple dataset and determine what
    would comprise a stable sort. For the sake of illustration, let''s assume our
    dataset includes entries for access time and username:


    ```

    2021-06-01 11:11:11    Betty

    2021-06-03 03:33:33    Betty

    2021-06-01 11:11:11    Barney

    2021-06-02 02:22:22    Wilma

    2021-06-01 11:11:11    Wilma

    2021-06-03 03:33:33    Barney

    2021-06-01 11:11:11    Fred

    ```


    If we wish to sort by time, you will note right away that there are duplications
    for 2021-06-01 11:11:11. If we were to perform a stable sort on this dataset,
    the expected outcome would appear as follows:


    ```

    2021-06-01 11:11:11    Betty

    2021-06-01 11:11:11    Barney

    2021-06-01 11:11:11    Wilma

    2021-06-01 11:11:11    Fred

    2021-06-02 02:22:22    Wilma

    2021-06-03 03:33:33    Betty

    2021-06-03 03:33:33    Barney

    ```


    You''ll notice from the sorted dataset that entries for the duplicate time of
    2021-06-01 11:11:11 appear in the order they were originally entered. Thus, we
    can say that this result represents a stable sort.


    In an ideal world, the same principle should also apply to a sort that retains
    the key/value association. One additional criterion for a stable sort is that
    it should offer no difference in performance compared to an unregulated sort.


    > Tip

    > For more information on PHP 8 stable sorts, have a look at the official RFC
    here: https://wiki.php.net/rfc/stable_sorting.'
  merge: -1
  img_proc: true
- pgno: 409
  md: "In PHP 8, the core *sort*() functions and ArrayObject::*sort*() methods have\
    \ been rewritten to achieve a stable sort. Let's have a look at a code example\
    \ that illustrates the issue that may arise in earlier versions of PHP.\n\n# Contrasting\
    \ stable and non-stable sorting\n\nIn this example, we wish to sort an array of\
    \ Access instances by time. Each Access instance has two properties, $name and\
    \ $time. The sample dataset contains duplicate access times, but with different\
    \ usernames:\n\n+   1. First, we define the Access class:\n+   2. Next, we define\
    \ a sample dataset that consists of a CSV file, /repo/sample_data/access.csv,\
    \ with 21 rows. Each row represents a different name and access time combination:\n\
    \n```\n// /repo/src/Php8/Sort/Access.php\nnamespace Php8\\Sort;\nclass Access\
    \ {\n    public $name, $time;\n    public function __construct($name, $time) {\n\
    \        $this->name = $name;\n        $this->time = $time;\n    }\n}\n```\n\n\
    ```\n\"Fred\",  \"2021-06-01 11:11:11\"\n\"Fred\",  \"2021-06-01 02:22:22\"\n\"\
    Betty\", \"2021-06-03 03:33:33\"\n\"Fred\",  \"2021-06-11 11:11:11\"\n\"Barney\"\
    ,\"2021-06-03 03:33:33\"\n\"Betty\", \"2021-06-01 11:11:11\"\n\"Betty\", \"2021-06-11\
    \ 11:11:11\"\n\"Barney\",\"2021-06-01 11:11:11\"\n\"Fred\",  \"2021-06-11 02:22:22\"\
    \n\"Wilma\", \"2021-06-01 11:11:11\"\n\"Betty\", \"2021-06-13 03:33:33\"\n\"Fred\"\
    ,  \"2021-06-21 11:11:11\"\n\"Betty\", \"2021-06-21 11:11:11\"\n```"
  merge: -1
  img_proc: true
- pgno: 410
  md: "```\n\"Barney\",\"2021-06-13 03:33:33\"\n\"Betty\",\"2021-06-23 03:33:33\"\n\
    \"Barney\",\"2021-06-11 11:11:11\"\n\"Barney\",\"2021-06-21 11:11:11\"\n\"Fred\"\
    ,\"2021-06-21 02:22:22\"\n\"Barney\",\"2021-06-23 03:33:33\"\n\"Wilma\",\"2021-06-21\
    \ 11:11:11\"\n\"Wilma\",\"2021-06-11 11:11:11\"\n```\n\nYou will note, scanning\
    \ the sample data, that all of the dates that have 11:11:11 as an entry time are\

- pgno: 59
  md: "4. Finally, we display the results in a table, using the get methods to retrieve\
    \ property values, as follows:\n\n```\n$pattern = '<tr><th>%s</th><td>%s</td></tr>';\n\
    echo '<table width=\"50%\" border=1>';\nprintf ($pattern, 'ID', $test->getId());\n\
    printf ($pattern, 'Token', $test->getToken());\nprintf ($pattern, 'Name', $test->getName());\n\
    echo '</table>';\n```\n\nHere is how that might appear:\n\n| ID | 111 |\n| Token\
    \ | 999999 |\n| Name | Fred |\n\nTable 1.4 – Output using Get methods\n\nThe main\
    \ purpose achieved by marking properties as protected (or private) and by defining\
    \ getters and setters is to control access. Often, this translates into a desire\
    \ to prevent the property data type from changing. If this is the case, the entire\
    \ infrastructure can be replaced by assigning property types.\n\nSimply changing\
    \ the visibility to public alleviates the need for get and set methods; however,\
    \ it does not prevent the property data from being changed! Using PHP 8 property\
    \ types achieves both goals: it eliminates the need for get and set methods and\
    \ also prevents the data type from being accidentally changed.\n\nNotice here\
    \ how much less code is needed to achieve the same results in PHP 8 using property\
    \ typing:\n\n```\n// /repo/ch01/php8_prop_reduce.php\ndeclare(strict_types=1);\n\
    class Test {\n    public int $id = 0;\n    public int $token = 0;\n    public\
    \ string $name = '';\n}\n// assign values\n$test = new Test();\n$test->id = 111;\n\
    $test->token = 999999;\n```"

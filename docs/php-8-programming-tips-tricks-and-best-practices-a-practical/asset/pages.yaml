    \ improve efficiency and reduce the amount of coding required. We now examine\
    \ a script that produces a text-based CAPTCHA, as follows:\n\n+   1. First, we\
    \ define a function that generates a string consisting of a random selection of\
    \ letters, numbers, and special characters. Note in the following code snippet\
    \ the use of the new PHP 8 match expression combined with arrow functions (highlighted):\n\
    \n```\n```php\n// /repo/ch02/php8_arrow_func_3.php\nfunction genKey(int $size)\
    \ {\n    $alpha1  = range('A','Z');\n    $alpha2  = range('a','z');\n    $special\
    \ = '!@#$%^&*()_+./[]{}|=-';\n    $len     = strlen($special) - 1;\n    $numeric\
    \ = range(0, 9);\n    $text    = '';\n    for ($x = 0; $x < $size; $x++) {\n \
    \       $algo = rand(1,4);\n        $func = match ($algo) {\n            1 =>\

  md: "Bear in mind that both the BreakScan class and the calling program we are about\
    \ to discuss are designed to run under PHP 7. The reason we do not use PHP 8 is\
    \ because we assume that a developer would wish to run the BC break scanner before\
    \ they do a PHP 8 update:\n\n1. We start by configuring the autoloader and getting\
    \ the path and verbosity levels either from the command line ($argv) or from the\
    \ URL ($_GET). In addition, we present an option to write the results to a CSV\
    \ file and accept as a parameter the name of such a file. You might note that\
    \ we also perform a degree of input sanitization, although theoretically the BC\
    \ break scanner will only be used on a development server, directly by a developer:\n\
    \n```\n```php\n// /repo/ch11/php7_bc_break_scanner.php\ndefine('DEMO_PATH', __DIR__);\n\
    require __DIR__ . '../src/Server/Autoload/Loader.php';\n$loader = new \\Server\\\
    Autoload\\Loader();\nuse Php8\\Migration\\BreakScan;\n// some code not shown\n\
    $path = $_GET['path'] ?? $argv[1] ?? NULL;\n$show = $_GET['show'] ?? $argv[2]\
    \ ?? 0;\n$show = (int) $show;\n$csv  = $_GET['csv'] ?? $argv[3] ?? '';\n$csv \
    \ = basename($csv);\n```\n```\n\n2. We next confirm the path. If it's not found,\
    \ we exit and display usage information ($usage is not shown):\n\n```\n```php\n\
    if (empty($path)) {\n    if (!empty($_SERVER['REQUEST_URI']))\n        echo '<pre>'\
    \ . $usage . '</pre>';\n    else\n        echo $usage;\n    exit;\n}\n```\n```"
  merge: -1

- pgno: 471
  md: '# 12


    # Creating PHP 8 Applications Using Asynchronous Programming


    In recent years, an exciting new technology has taken the **PHP: Hypertext Preprocessor**
    (**PHP**) community by storm: **asynchronous programming**, also known as **PHP
    async**. The asynchronous programming model addresses an issue present in any
    application code written using the traditional synchronous mode of programming:
    your application is forced to wait for certain tasks to complete before providing
    results. The **central processing unit (CPU)** (or CPUs) of the server upon which
    your application is running sits idle while mundane **input/output (I/O)** tasks
    are performed. PHP async allows your application to take full advantage of hardware
    resources by suspending blocking I/O tasks until later. The net effect is a massive
    increase in performance, as well as the ability to handle a geometrically larger
    number of user requests.'
  merge: -1
  img_proc: true
- pgno: 472
  md: 'After reading through this chapter and carefully studying the examples, you
    will be able to develop PHP async applications. In addition, you will be able
    to take advantage of the async capabilities of selected PHP extensions and frameworks.
    By the time you are done working through this chapter, you will be in a position
    to improve the performance of your applications, from 5 times up to a staggering
    40 times faster!


    Topics covered in this chapter include the following:


    +   - Understanding the PHP async programming model

    +   - Using the Swoole extension

    +   - Using selected PHP frameworks in async mode

    +   - Learning about PHP 8.1 fibers


    # Technical requirements


    The minimum hardware required to examine and run the code examples provided in
    this chapter is listed here:


    +   - x86_64 based desktop PC or laptop

    +   - 1 **gigabyte (GB)** free disk space

    +   - 4 GB of **random-access memory (RAM)**

    +   - 500 **kilobits per second (Kbps)** or faster internet connection


    In addition, you will need to install the following software:


    +   - Docker

    +   - Docker Compose


    Please refer to the *Technical requirements* section of *Chapter 1, Introducing
    New PHP 8 OOP Features*, for more information on the Docker and Docker Compose
    installation, as well as how to build the Docker container used to demonstrate
    the code explained in this book. In this book, we refer to the directory in which
    you restored the sample code for the book as `/repo`.


    The source code for this chapter is located here: `https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices.`


    We can now begin our discussion by having a look at PHP async.'
  merge: -1
  img_proc: true
- pgno: 473
  md: "# Understanding the PHP async programming model\n\nBefore we get into the details\
    \ of how to develop PHP applications using asynchronous libraries, it's important\
    \ to step back and have a look at the PHP **asynchronous programming model**.\
    \ Understanding the difference between this and the conventional **synchronous\
    \ programming model** opens a new world of high performance for you to utilize\
    \ when developing PHP applications. Let's first have a look at the synchronous\
    \ programming model, after which we'll dive into async.\n\n# Developing synchronous\
    \ programming code\n\nIn traditional PHP programming, code executes in a linear\
    \ fashion. Once the code has been compiled into machine code, the CPU executes\
    \ the code one line after another in a sequential manner until the code ends.\
    \ This is certainly true of PHP *procedural programming*. Surprising to some,\
    \ this is also true for **object-oriented programming (OOP)** as well! Regardless\
    \ of whether or not you use objects as part of your code, the OOP code gets compiled\
    \ into first-byte code and then machine code, and is processed in a synchronous\
    \ manner in exactly the same manner as is procedural code.\n\nUsing OPcache and\
    \ the **Just-in-Time (JIT)** compiler has no bearing on whether or not the code\
    \ operates in a synchronous manner. The only thing that OPcache and the JIT compiler\
    \ bring to the table is the ability to operate synchronous code faster than was\
    \ otherwise possible.\n\n> **Important note**\n> \n> Please do not get the impression\
    \ that there is something wrong with writing code using the synchronous programming\
    \ model! This approach is not only tried and true but also quite successful. Furthermore,\
    \ synchronous code is supported by many ancillary tools such as PHPUnit, Xdebug,\
    \ numerous frameworks, and many others.\n\nThere is a major drawback to the synchronous\
    \ programming model, however. Using this model, the CPU has to constantly wait\
    \ for certain tasks to complete before the program is allowed to move along. To\
    \ a large extent, such tasks include access to an external resource, such as making\
    \ a database query, writing to a log file, or sending an email. Such tasks are\
    \ referred to as **blocking operations** (operations that block progress)."
  merge: -1
  img_proc: true
- pgno: 474
  md: 'The following diagram gives you a visual representation of an application flow,
    which involves the blocking operations of writing to a log file and sending an
    email notification:


    ![](img/dbf2674d5b31107c344104b5edcb21c5_474_0.png)


    Figure 12.1 – Synchronous programming model


    As you can see from Figure 12.1, when an application writes to a log file, the
    CPU puts a hold on program code execution until the operating system (OS) signals
    that the log file''s write operation has finished. Later, the code might send
    out an email notification. Again, the CPU puts a hold on code execution until
    the email send operation has concluded.


    Although each waiting interval may be insignificant in and of itself, when you
    add together the waiting intervals for all such blocking operations—especially
    if lengthy loops are involved—performance starts to degrade.


    One solution is to liberally implement a caching solution. Another solution, as
    you may have guessed, is to write your application using the asynchronous programming
    model. Let''s have a look at that right now.


    # Understanding the asynchronous programming model


    The idea behind asynchronous operations has been around for quite some time. One
    extremely well-known example is Apache Web Server, with its Multi-Processing Modules
    (MPMs). The MaxRequestWorkers directive allows you to specify how many simultaneous
    requests the web server can handle (see https://httpd.apache.org/docs/current/mod/mpm_common.html#maxrequestworkers
    for more information).


    The asynchronous programming model usually involves setting up management nodes,
    referred to as workers. This allows program execution to continue without having
    to wait for any given task to complete. The gain in performance can be quite dramatic,
    especially in situations where a large number of blocking operations (for example,
    filesystem access or database queries) occur.'
  merge: -1
  img_proc: true
- pgno: 475
  md: 'The following diagram visualizes how the tasks of writing to a log file and
    sending an email might be accomplished using the asynchronous programming model:


    ![](img/dbf2674d5b31107c344104b5edcb21c5_475_0.png)


    Figure 12.2 – Asynchronous programming model


    The total waiting time is reduced by a factor of how many workers are assigned.
    The program flow shown in Figure 12.2 would involve half the waiting time as that
    shown in Figure 12.1. Overall performance improves as the number of workers assigned
    to handle blocking operations increases.


    **Important note**

    The asynchronous programming model is *not to be confused* with **parallel programming**.
    In parallel programming, tasks are literally executed simultaneously, often being
    assigned to different CPUs or CPU cores. Asynchronous programming, on the other
    hand, operates sequentially but allows the sequential code to continue while waiting
    for the results of a blocking operation (for example, a filesystem request or
    a database query).


    Now that you have an idea of how the PHP async programming model works, let''s
    have a look at coroutine support.


    # Working with async coroutine support


    *Coroutines* are similar to **threads** but operate in user space, not kernel
    space, and thus do not need to involve the OS. If this support is available, the
    coroutine support component detects blocking operations (such as reading or writing
    to a file) and effectively suspends that operation until results are received.
    This frees up the CPU to proceed with other tasks until the results have been
    returned from the blocking process. This process operates at the machine-code
    level and is thus undetectable to us, other than the fact that our code runs faster.'
  merge: -1
  img_proc: true
- pgno: 476
  md: 'Theoretically, using an extension or framework that provides **coroutine support**
    might boost performance, even if your code is written using the synchronous programming
    model. Please note that not all PHP async frameworks or extensions offer this
    support, which might, in turn, influence your choice of framework or extension
    to use for future development.


    The **Swoole extension** (https://www.swoole.co.uk/) offers coroutine support.
    On the other hand, ReactPHP (https://reactphp.org/), one of the most popular PHP
    async frameworks, does not offer coroutine support unless used with the Swoole
    extension (discussed next) or with PHP fibers (discussed in the *Learning about
    PHP 8.1 fibers* section). One of the reasons why ReactPHP is so popular, however,
    is the very fact that the Swoole extension is not required. If you are operating
    in a hosting environment where you do not have control over the PHP installation,
    you can still use ReactPHP and achieve a substantial performance gain, without
    having to touch the PHP installation.


    We now turn our attention to writing code for the async model.


    # Creating a PHP async application


    Now comes the hard part! Unfortunately, an application written using the synchronous
    programming model does not take advantage of what the async model has to offer.
    Even if you are using a framework and/or extension that provides coroutine support,
    you do not realize maximum performance gain unless you refactor your code to follow
    the async programming model.


    Most PHP async frameworks and extensions offer a number of ways for you to separate
    tasks. Here is a brief summary of the more commonly used approaches.


    # Event loops


    In a certain sense, an **event loop** is a repetitive block of code that runs
    continuously until a specified event occurs. All of the PHP async extensions and
    frameworks offer this feature in one form or another. Listeners that take the
    form of a callback are added to an event loop. When an event is triggered, the
    listener''s logic is invoked.


    The Swoole event loop leverages Linux epoll_wait (https://linux.die.net/man/2/epoll_wait)
    functionality. Because hardware-based events report to Linux through pseudo file
    handles, the Swoole event loop allows the developer to base the starting and stopping
    of the event loop not only on attributes of actual files but also of any hardware
    process that produces a **file descriptor (FD)**.'
  merge: -1
  img_proc: true
- pgno: 477
  md: 'The ReactPHP framework offers the same functionality, but uses the PHP `stream_select()`
    function by default, in place of the OS `epoll_wait` functionality. This makes
    the ReactPHP event loop **application programming interface (API)** portable between
    servers, although reaction time will be slower. ReactPHP also offers the ability
    to define an event loop based on the `ext-event`, `ext-ev`, `ext-uv`, or `ext-libevent`
    PHP extensions. Leveraging these extensions gives ReactPHP access to the hardware,
    much as does Swoole.


    # Promises


    A **promise** is a software construct that allows you to defer the processing
    of a task until later. The concept was first proposed as part of the **CommonJS**
    project (`http://wiki.commonjs.org/wiki/Promises/A`). It was designed as a bridge
    between the synchronous and asynchronous programming worlds.


    In synchronous programming, a function (or class method) generally either *succeeds*
    or *fails*. In PHP, a failure is handled as either a deliberately thrown exception
    or a fatal error. In the asynchronous model, three states are identified as part
    of a *promise*: **fulfilled**, **failed**, and **unfulfilled**. Accordingly, when
    a *promise* instance is created, you need to supply three handlers that take action
    based upon the state they represent.


    In the case of ReactPHP, when you create a `React\Promise\Promise` instance, you
    supply a **resolver** as the first constructor argument. The resolver itself requires
    three callbacks labeled `$resolve`, `$reject`, and `$notify`. These three correspond
    to the three possible states of a promise: fulfilled, failed, or unfulfilled.


    # Streams


    Many async frameworks provide a wrapper for PHP **streams**. PHP streams are most
    often used to handle operations involving the filesystem. File access is a blocking
    operation that causes program execution to pause until the OS returns the results.


    In order to avoid having file access block the progress of an async application,
    a `streams` component is used. ReactPHP, for example, provides classes under the
    `React\Stream` namespace that implement `ReadableStreamInterface` or `WritableStreamInterface`.
    These classes serve as a wrapper for ordinary PHP stream functions such as `fopen()`,
    `fread()`, and `fwrite()`, as well as `file_get_contents()` and `file_put_contents()`.
    The ReactPHP classes use memory to avoid blocking and defer the actual read or
    write until later, thus allowing asynchronous activities to continue.'
  merge: -1
  img_proc: true
- pgno: 478
  md: '# Timers


    **Timers** are separate tasks that can be set to run after a given interval. In
    this respect, timers resemble the JavaScript `setTimeout()` function. Tasks scheduled
    using timers can be set to run one time only, or continuously at specified intervals.


    The timer implementation in most PHP async frameworks or extensions generally
    avoids using the PHP `pcntl_alarm()` function. The latter function allows a developer
    to send a `SIGALRM` signal to a process after a certain number of seconds. The
    `pcntl_alarm()` function only allows you to set one at a time, however, and the
    lowest time interval is measured in seconds. In contrast, PHP async frameworks
    and extensions allow you to set multiple timers accurately, to the millisecond.
    Another difference in PHP async timer implementation is that it is not dependent
    upon the `declare(ticks=1)` statement.


    There are many potential uses for timers—for example, a timer could check a directory
    that contains **Completely Automated Public Turing test to tell Computers and
    Humans Apart (CAPTCHA)** images and can remove old ones. Another potential use
    would be to refresh the cache periodically.


    # Channels


    **Channels** are a means of communicating between concurrent processes. The current
    implementation of channels is based upon an algebraic model proposed in 1978 by
    Sir Charles Antony Hoare. His proposal was refined over the years and evolved
    into the model described in his book *Communicating Sequential Processes*, published
    in 1985. Channels and the **communicating sequential processes (CSP)** model are
    a feature of many currently popular languages such as **Go.**


    In contrast to other more complicated approaches, when using channels the CSP
    processes are anonymous, whereas the channel is explicitly named. Another aspect
    of the channel approach is that the sender is prevented from sending until the
    receiver is ready to receive. This simple principle alleviates having to implement
    an excessive amount of shared locking logic. In the Swoole extension, for example,
    channels are used to implement connection pools or as a means of scheduling concurrent
    tasks.


    Now that you have a basic understanding of PHP async theory, it''s time to put
    the theory into practice. We start by examining how to use the Swoole extension.'
  merge: -1
  img_proc: true
- pgno: 479
  md: '# Using the Swoole extension


    The PHP **Swoole extension** was first made available on the PHP extension C library
    website (`https://pecl.php.net/`) in December 2013. Since that time, it''s gained
    considerable attention. With the introduction of the JIT compiler in PHP 8, there
    has been a considerable amount of renewed interest in the Swoole extension as
    it''s fast and stable and is in a position to make PHP applications run even faster.
    The total number of downloads is close to 6 million, and the average number per
    month is around 50,000.


    In this section, you will learn about the extension, how it''s installed, and
    how it''s used. Let''s first get an overview of the extension.


    # Examining the Swoole extension


    Because the extension is written in the C language, once it''s compiled, installed,
    and enabled, a set of functions and classes are added to your current PHP installation.
    The extension leverages certain low-level features that are only available in
    OSes derived from UNIX, however. This means that if you are running a Windows
    server, the only way you can get a PHP async application that uses the Swoole
    extension running is by installing **Windows Services for Linux (WSL)** or by
    setting up your application to run in a Docker container on the Windows server.


    > **Tip**

    > If you want to experiment with PHP async on a Windows server, consider using
    ReactPHP (discussed in the *Working with ReactPHP* section), which does not have
    the OS dependencies required by the Swoole extension.


    One of the big advantages of PHP async is that the initial block of code gets
    loaded immediately and stays in memory until the asynchronous server instance
    stops. This is the case when using the Swoole extension. In your code, you create
    an asynchronous server instance that effectively turns PHP into a continuously
    running daemon listening on the designated port. This is also a disadvantage,
    however, in that if you make changes to your program code, the changes are not
    recognized by the async server instance until you reload it.'
  merge: -1
  img_proc: true
- pgno: 480
  md: 'One of the great features of the Swoole extension is its **coroutine support**.
    What this means, in real-life terms, is that we don''t have to perform major surgery
    on applications written using the synchronous programming model. Swoole will automatically
    pick out blocking operations such as filesystem access and database queries and
    allow these operations to be placed on hold while the rest of the application
    proceeds. Because of this support, you can often simply run the synchronous application
    using Swoole, resulting in an immediate performance boost.


    Another really great feature of the Swoole extension is `Swoole\Table`. This feature
    lets you create, entirely in memory, the equivalent of a database table that can
    be shared between multiple processes. There are many possible uses for such a
    construct, and the potential performance gain is truly staggering.


    The Swoole extension has the ability to listen for **User Datagram Protocol (UDP)**
    transmissions rather than **Transmission Control Protocol (TDP)** ones. This is
    an extremely interesting possibility as UDP is much faster than TCP. Swoole also
    includes a timer implementation accurate to the millisecond, as well as async
    clients for MySQL, PostgreSQL, Redis, and cURL. The Swoole extension also gives
    you the ability to set up **inter-process communication (IPC)** using **Golang**
    style channels. Let''s now have a look at installing Swoole.


    # Installing the Swoole extension


    The Swoole extension can be installed using the same techniques you would deploy
    to install any PHP extension written in the C language. One approach is to simply
    use your OS package manager. Examples include `apt` (or its less friendly cousin,
    `apt-get`) for Debian or Ubuntu Linux, and `yum` or `dnf` for Red Hat, CentOS,
    or Fedora. When using an OS package manager, the Swoole extension is made available
    in the form of precompiled binaries.


    The recommended approach, however, is to use the `pecl` command. If this command
    is not available on your installation, the `pecl` command can be installed (logged
    in as a root user) as follows on an Ubuntu or Debian OS: `apt install php-pear`.
    For a Red Hat, CentOS, or Fedora installation, the following works: `yum install
    php-pear`.


    When installing the Swoole extension using `pecl`, you can specify a number of
    options. These options are summarized here:'
  merge: -1
  img_proc: true
- pgno: 481
  md: "| Option | Description |\n|---|---|\n| --enable-openssl | Set this to allows\
    \ Swoole to use OpenSSL. There's a hard dependency on the OS library `libssl.so`.\
    \ |\n| --with-openssl-dir | This tells Swoole where to find the OpenSSL library.\
    \ An example for the Docker container used for this book would be `--with-openssl-dir=/usr/include/openssl`.\
    \ |\n| --enable-http2 | This is especially important when you are using Swoole\
    \ directly from the comand line. This option allows Swoole to process HTTP2 requests\
    \ using its own built-in library `nghttp2`. |\n| --enable-swoole-json | Makes\
    \ Swoole JSON functions available. PHP `ext/json` must also be present, however\
    \ this is already a default extension. |\n| --enable-swoole-curl | Provides native\
    \ support for cURL. For this to work properly you must also have the `libcurl4`\
    \ OpenSSL development library installed on your OS. |\n| --enable-mysqlnd | This\
    \ option provides support for the PHP `mysqlnd` (MySQL Native Driver) module.\
    \ The recommended option is to use PDO MySQL instead, in which case you do not\
    \ need to enable `mysqlnd` support. |\n| --enable-sockets | Use this option is\
    \ you rely upon the PHP Sockets extension. Once enabled, connections created by\

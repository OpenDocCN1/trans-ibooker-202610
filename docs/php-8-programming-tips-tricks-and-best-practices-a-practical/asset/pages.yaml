- pgno: 107
  md: '# 3

    Taking Advantage of Error-Handling Enhancements


    If you''ve been a PHP developer for any length of time, you will have noticed
    that as the language continues to mature, more safeguards are put into place that
    ultimately enforce good coding practices. Along these lines, one of the key improvements
    in PHP 8 is its advanced error-handling capabilities. In this chapter, you will
    learn which Notices have been upgraded to Warnings, and which Warnings have been
    upgraded to Errors.


    This chapter gives you an excellent understanding of the background and intent
    of the security enhancements, allowing you to better control the use of your code.
    In addition, it''s critical to be aware of error conditions that formerly only
    generated Warnings but now also generate Errors, in order to take measures to
    prevent your applications from failing following an upgrade to PHP 8.


    The following topics are covered in this chapter:


    +   - Understanding PHP 8 error handling

    +   - Dealing with warnings that are now errors

    +   - Understanding notices promoted to warnings

    +   - Handling the @ error control operator'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Technical requirements


    To examine and run the code examples provided in this chapter, the minimum recommended
    hardware is listed here:


    +   - x86_64 based desktop PC or laptop

    +   - 1 gigabyte (GB) free disk space

    +   - 4 GB of random-access memory (RAM)

    +   - 500 kilobits per second (Kbps) or faster internet connection


    In addition, you will need to install the following software:


    +   - Docker

    +   - Docker Compose


    Please refer to the Technical requirements section of Chapter 1, Introducing New
    PHP 8 OOP Features, for more information on Docker and Docker Compose installation,
    as well as how to build the Docker container used to demonstrate the code explained
    in this book. Throughout this book, we refer to the directory in which you restored
    the sample code for this book as /repo.


    The source code for this chapter is located here:


    ```

    https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices

    ```


    We can now begin our discussion by examining new PHP 8 operators.


    # Understanding PHP 8 error handling


    Historically, many PHP error conditions were assigned an error level far below
    their actual severity. This gave developers a false sense of security as seeing
    only a Notice led them to believe that their code was not deficient. Many situations
    only formerly generated a Notice or a Warning when in fact their seriousness merited
    greater attention.


    In this section, we look at a number of error-handling enhancements in PHP 8 that
    continue with the overall trend of enforcing good coding practices. The discussion
    in this chapter will help you to re-examine your code, with an eye toward greater
    efficiency and fewer maintenance issues down the road.


    In the next several subsections, we have a look at changes to certain Notice and
    Warning error conditions that could have an impact on your code. Let''s first
    have a look at changes in how PHP 8 handles undefined variables.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Undefined variable handling


    One notorious feature of PHP is how it treats **undefined variables**. Have a
    look at this simple block of code. Note that the $a and $b variables have not
    been defined:


    ```

    // /repo/ch03/php8_undef_var.php

    $c = $a + $b;

    var_dump($c);

    ```


    Running under PHP 7, here''s the output:


    ```

    PHP Notice:  Undefined variable: a in

    /repo/ch03/php7_undef_var.php on line 3

    PHP Notice:  Undefined variable: b in /repo/ch03/php7_undef_var.php on line 3

    int(0)

    ```


    As you can see from the output, PHP 7 emits a Notice, letting us know we are using
    variables that have not been defined. If we run exactly the same code using PHP
    8, you can quickly see that what was previously a Notice has been promoted to
    a Warning, as illustrated here:


    ```

    PHP Warning:  Undefined variable $a in /repo/ch03/php8_undef_var.php on line 3

    PHP Warning:  Undefined variable $b in /repo/ch03/php8_undef_var.php on line 3

    int(0)

    ```


    The reasoning behind this error-level promotion in PHP 8 is that the use of undefined
    variables, thought by many developers to be a harmless practice, is actually **quite
    dangerous**! *Why?*, you might ask. The answer is that PHP silently, without your
    explicit direction, assigns a value of NULL to any undefined variable. Effectively,
    your program is relying upon a default behavior of PHP that could change in future
    upgrades to the language.


    We cover other error-level promotions in the next few sections of this chapter.
    Please note, however, that situations where Notices are promoted to Warnings *will
    not affect the functioning of your code*. It might serve to bring more potential
    problems to your attention, however, and if so, serves the purpose of producing
    better code. Unlike undefined variables, undefined constants'' errors have now
    been even further promoted, as you''ll see in the next subsection.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Undefined constant handling


    The treatment of **undefined constants** has changed when running under PHP 8.
    However, in this case, what was previously a Warning is now an Error in PHP 8.
    Have a look at this innocuous-looking block of code:


    ```

    // /repo/ch03/php7_undef_const.php

    echo PHP_OS . "\n";

    echo UNDEFINED_CONSTANT . "\n";

    echo "Program Continues ... \n";

    ```


    The first line echoes a PHP_OS **pre-defined constant** that identifies the operating
    system. In PHP 7, a Notice is generated; however, the last line of output is Program
    Continues ..., as shown here:


    ```

    PHP Notice: Use of undefined constant UNDEFINED_CONSTANT - assumed ''UNDEFINED_CONSTANT''
    in /repo/ch03/php7_undef_const.php on line 6

    Program Continues ...

    ```


    The same code now produces a fatal error when running in PHP 8, as shown here:


    ```

    PHP Fatal error: Uncaught Error: Undefined constant "UNDEFINED_CONSTANT" in /repo/ch03/php8_undef_const.php:6

    ```


    Accordingly, any bad code you have lying around that fails to first define any
    constants before use will crash and burn in PHP 8! A good habit is to assign a
    default value to all variables at the start of your application code. If you plan
    to use constants, it''s also a good idea to define them as soon as possible, preferably
    in one place.


    > **Important note**

    > One idea is to define all constants in an *included file*. If this is the case,
    be sure that any program script using such constants has loaded the file containing
    the constant definition.


    > **Tip**

    > **Best practice**: Assign default values to all variables at the beginning of
    your program code before use. Be sure to define any custom constants before they
    are used. If this is the case, be sure that any program script using such constants
    has loaded the file containing the constant definition.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Error-level defaults


    It''s useful to note that the error-level defaults assigned to the php.ini file
    error_reporting directive have been updated in PHP 8. In PHP 7, the default error_reporting
    level was as follows:


    ```

    error_reporting=E_ALL & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED

    ```


    In PHP 8, the new level is much simpler, as you can see here:


    ```

    error_reporting=E_ALL

    ```


    It''s also worth noting that the php.ini file setting display_startup_errors is
    now enabled by default. This might be an issue for production servers, as your
    website might start to unintentionally reveal error information upon PHP startup.


    The key takeaway from this section is that in the past, PHP has allowed you to
    get away with certain bad practices by only issuing Notices or Warnings. As you''ve
    learned in this section, however, the danger in not addressing the issues behind
    the Warning or Notice generation lies in the actions PHP silently takes on your
    behalf. Not relying upon PHP to make decisions on your behalf leads to fewer hidden
    logic errors. Following good coding practices, such as that of assigning defaults
    to all variables before they are used, helps you to avoid such errors. Let''s
    now have a closer look at error situations where Warnings have been promoted to
    Errors in PHP 8.


    # Dealing with warnings that are now errors


    In this section, we look at upgraded PHP 8 error handling pertaining to objects,
    arrays, and strings. We also examine situations where, in the past, PHP issued
    a Warning but where PHP 8 now throws an Error. It is critical that you become
    aware of any of the potential error situations addressed in this section. The
    reason is simple: if you fail to address the situations described in this section,
    when your server is upgraded to PHP 8 your code will break.


    Developers are often pressed for time. It could be that there''s a massive queue
    of new features or other changes that must be made. In other cases, resources
    have been pulled away to other projects, meaning fewer developers are available
    to perform maintenance. Warnings are often ignored because the application continues
    to run, so many developers simply turn off the error display and hope for the
    best.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'Over the years, mountains upon mountains of badly written code have accumulated.
    Unfortunately, the PHP community is now paying the price, in the form of mysterious
    runtime errors that take hours to track down. By promoting to `Error` certain
    dangerous practices previously raising only a `Warning`, bad coding practices
    quickly become apparent in PHP 8 as `Errors` are fatal and cause the application
    to stop running.


    Let''s start by examining error promotion in object error handling.


    > **Important note**

    > As a general rule, in PHP 8, `Warnings` are promoted to `Errors` when an attempt
    is made to *write* data. On the other hand, for the same general circumstance
    (for example, attempting to read/write properties of non-existent objects), a
    `Notice` is promoted to a `Warning` in PHP 8 when an attempt is made to *read*
    data. The overall rationale is that write attempts could result in loss or corruption
    of data, whereas read attempts do not.


    # Promoted warnings in object error handling


    Here is a brief summation of `Warnings` that are now `Errors` pertaining to the
    treatment of objects. PHP 8 will throw an `Error` if you attempt to do the following:


    +   - Increment/decrement a property of a non-object

    +   - Modify a property of a non-object

    +   - Assign a value to a property of a non-object

    +   - Create a default object from an empty value


    Let''s have a look at a simple example. In the following code snippet, a value
    is assigned to a non-existent object, $a. This value is then incremented:


    ```

    ```php

    // /repo/ch03/php8_warn_prop_nobj.php

    $a->test = 0;

    $a->test++;

    var_dump($a);

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 113
  md: "Here is the PHP 7 output:\n\n```\nPHP Warning:  Creating default object from\

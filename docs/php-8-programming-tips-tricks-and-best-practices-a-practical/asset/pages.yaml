    +   - Docker

    +   - Docker Compose


    Please refer to the *Technical requirements* section in *Chapter 1, Introducing
    New PHP 8 OOP Features*, for more information on Docker and Docker Compose installation,
    as well as how to build the Docker container used to demonstrate the code explained
    in this book. In this book, we refer to the directory in which you restored the
    sample code for this book as `/repo`.


    The source code for this chapter is located here:


    ```

    https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices.

    ```


    We can now begin our discussion by examining the differences in string handling
    introduced in PHP 8.


    # Learning key advanced string handling differences


    String functions in general have been tightened and normalized in PHP 8. You will
    find that usage is more heavily restricted in PHP 8, which ultimately forces you
    to produce better code. We can say that the nature and order of string function
    arguments is much more uniform in PHP 8, which is why we say that the PHP core
    team has normalized usage.


    These improvements are especially evident when dealing with numeric strings. Other
    changes in PHP 8 string handling involve minor changes to arguments. In this section,
    we introduce you to the key changes in how PHP 8 handles strings.


    It’s important to understand not only the handling improvements introduced in
    PHP 8 but also to understand the deficiencies in string handling prior to PHP
    8.'

- pgno: 65
  md: "```\n```php\nwhere($select, 'AND');\nwhere($select, 'event_date', '<', \"'$end'\"\
    );\n$sql = render($select);\n// remaining code not shown\n```\n```\n\nYou might\
    \ have noted that where() has to be called multiple times as the number of arguments\
    \ is limited. This is a perfect candidate for the variadics operator! Here is\
    \ how the rewritten where() function might look:\n\n```\n```php\n// ch02/includes/php8_sql_lib.php\n\
    // other functions not shown\nfunction where(stdClass $obj, ...$args) {\n    $obj->where\
    \ = (empty($obj->where))\n        ? $args\n        : array_merge($obj->where,\
    \ $args);\n}\n```\n```\n\nBecause ...$args is always returned as an array, to\
    \ ensure any additional calls to the function do not lose clauses we need to perform\

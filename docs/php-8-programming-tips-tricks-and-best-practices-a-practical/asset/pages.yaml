    |


    Figure 4.2 – pecl.php.net page for the PHP MongoDB extension


    In many cases, the vendor prefers to retain full control over the extension. This
    means you need to go to their website to obtain the PHP extension. An example
    of this is the PHP extension for Microsoft SQL Server, found at this **Uniform
    Resource Locator (URL)**: `https://docs.microsoft.com/en-us/sql/connect/php/download-drivers-php-sql-server?view=sql-server-ver15`.


    The key takeaway from this subsection is that the PHP language is enhanced through
    its extensions. The extensions are written in the C language. Accordingly, the
    ability to model the logic of a prototype extension directly inside a PHP script
    is extremely important. Let''s now turn our attention to where you should use
    FFI.


    # Learning where to use FFI



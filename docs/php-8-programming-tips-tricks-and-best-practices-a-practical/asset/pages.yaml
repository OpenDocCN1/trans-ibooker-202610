    \ - - [21/Mar/2021:23:38:44 -0400]\n    \"GET /wp-login.php HTTP/1.0\" 200 34605\n\
    095.052.077.114 - - [10/Mar/2021:22:45:55 -0500]\n    \"POST /career HTTP/1.0\"\

    });\n$server->start();\n```\n```\n\nUnfortunately, a Swoole\\Http\\Request instance\
    \ passed to the callback associated with the on() method is not PSR-7-compliant!\
    \ Accordingly, we need to define a Chat\\Http\\SwooleToPsr7 class and a swooleRequestToServerRequest()\
    \ method that performs the conversion using a static call. We then set headers\
    \ on the Swoole\\Http\\Response instance and return a value from the pipe to complete\
    \ the circuit.\n\nIt's extremely important for you to note that the standard PHP\
    \ superglobals, such as $_GET and $_POST, do not work as expected from a running\
    \ Swoole server instance. The main point of entry is the initial program you use\

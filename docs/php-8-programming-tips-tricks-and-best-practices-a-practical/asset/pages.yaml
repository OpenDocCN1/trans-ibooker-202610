- pgno: 258
  md: '# Summary


    In this chapter, you learned about differences in string handling between PHP
    8 and earlier versions, and how to develop workarounds that address differences
    in string handling. As you learned, PHP 8 exerts greater control over the data
    types of string function arguments, as well as introducing consistency in what
    happens if an argument is missing or null. As you learned, a big problem with
    earlier versions of PHP is that several assumptions were silently made on your
    behalf, resulting in a huge potential for unexpected results.


    In this chapter, we also highlighted issues involving comparisons between numeric
    strings and numeric data. You learned not only about numeric strings, type-juggling,
    and non-strict comparisons, but also how PHP 8 corrects flaws inherent in numeric
    string handling that were present in earlier versions. Another topic covered in
    this chapter demonstrated potential issues having to do with how several operators
    behave differently in PHP 8. You learned how to spot potential problems and were
    given best practices to improve the resilience of your code.


    This chapter also addressed how a number of PHP functions retained dependence
    upon the locale setting, and how this problem has been addressed in PHP 8. You
    learned that in PHP 8, floating-point representations are now uniform and no longer
    dependent upon the locale. You also learned about changes in how PHP 8 addresses
    array elements as well as changes in several security-related functions.


    The tips, tricks, and techniques covered in this chapter raise awareness of inconsistent
    behavior in earlier versions of PHP. With this new awareness, you are in a better
    position to gain greater control over the use of PHP code. You are also now in
    a better position to detect situations that could lead to potential code breaks
    following a PHP 8 migration, giving you an advantage over other developers, and
    ultimately leading you to write PHP code that performs reliably and consistently.


    The next chapter shows you how to avoid potential code breaks involving changes
    to PHP extensions.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# 7

    Avoiding Traps

    When Using PHP 8

    Extensions


    One of the main strengths of the PHP: Hypertext Preprocessor (PHP) language is
    its extensions. Changes to the PHP language introduced in PHP 8 also require extension
    development teams to update their extensions at the same time. In this chapter,
    you will learn which major changes to extensions have been made and how to avoid
    traps when updating an existing application to PHP 8.


    Once you have finished reviewing the sample code and topics presented in this
    chapter, you will be able to prepare any existing PHP code for migration to PHP
    8. In addition to learning about the changes to the various extensions, you will
    also gain deep insight into their operation. This ability will allow you to make
    informed decisions when using extensions in PHP 8.'

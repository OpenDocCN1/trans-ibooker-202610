- pgno: 316
  md: "```\n095.163.255.032 - - [13/Apr/2021:15:09:40 -0400]\n\"GET /robots.txt HTTP/1.0\"\
    \ 200 78\n095.163.255.036 - - [18/Apr/2021:01:06:33 -0400]\n\"GET /robots.txt\
    \ HTTP/1.0\" 200 78\n```\n\nIn PHP 8, to accomplish the same task, we define anonymous\
    \ functions instead of using create_function(). Here is how the rewritten code\
    \ example might appear in PHP 8:\n\n1. Again, we start by recording the start\
    \ time, as with the PHP 7 code example just described. Here's the code you'll\
    \ need to accomplish this:\n\n```\n// /repo/ch08/php8_create_function.php\n$start\
    \ = microtime(TRUE);\n```\n\n2. Next, we define a callback that normalizes the\
    \ IP address into four blocks of three digits each. We use exactly the same logic\
    \ as in the previous example; however, this time, we define commands in the form\
    \ of an anonymous function. This takes advantage of code editor helpers, and each\
    \ line is viewed by the code editor as an actual PHP command. The code is illustrated\
    \ in the following snippet:\n\n```\n$normalize = function (&$line, $key) {\n \
    \   $split = strpos($line, ' ');\n    $ip = trim(substr($line, 0, $split));\n\
    \    $remainder = substr($line, $split);\n    $tmp = explode(\".\", $ip);\n  \
    \  if (count($tmp) === 4)\n        $ip = vsprintf(\"%03d.%03d.%03d.%03d\", $tmp);\n\
    \    $line = $ip . $remainder;\n};\n```\n\nBecause each line in the anonymous\
    \ function is treated exactly as if you were defining a normal PHP function, you\
    \ are less likely to have typos or syntax errors.\n\n3. In a similar manner, we\
    \ define the sort callback in the form of an arrow function, as follows:\n\n```\n\
    $sort_by_ip = fn ($line1, $line2) => $line1 <=> $line2;\n```"

- pgno: 382
  md: "Now that you have an idea of how anonymous class naming has changed in PHP\
    \ 8, let's have a look at changes in namespace handling.\n\n# Understanding changes\
    \ in namespaces\n\nThe concept of a namespace was introduced in PHP 5.3 as a means\
    \ of isolating hierarchies of classes. Unfortunately, the original algorithm that\
    \ was used to parse namespace names had several flaws. In addition to being overly\
    \ complicated, the way in which namespace and class names were tokenized internally\
    \ was performed in an inconsistent manner, leading to unexpected errors.\n\nBefore\
    \ we get into the benefits and potential backward compatible breaks, let's have\
    \ a look at how the namespace tokenization process has changed.\n\n# Discovering\
    \ differences in tokenization\n\nThe tokenization process is an important part\
    \ of the interpretation process and takes place when your PHP code is executed.\
    \ In the process of producing byte code, the PHP program code is broken down into\
    \ tokens by the PHP parsing engine.\n\nThe following table summarizes namespace\
    \ tokenization changes:\n\n| Namespace + Class | Old Tokenization | New Tokenization\
    \ |\n|---|---|---|\n| JustClass | T_STRING | T_STRING |\n| \\AbsoluteClass | T_NS_SEPARATOR\
    \ + T_STRING | T_NAME_FULLY_QUALIFIED |\n| Some\\Thing\\Class | T_STRING + T_NS_SEPARATOR\
    \ + T_STRING | T_NAME_QUALIFIED |\n| <namespace>\\Class | T_NAMESPACE + T_NS_SEPARATOR\
    \ + T_STRING | T_NAME_RELATIVE |\n\nTable 9.5 – Namespace tokenization differences\
    \ in PHP 8\n\nAs you can see, PHP 8 namespace tokenization is much simpler and\
    \ streamlined.\n\n> **Tip**\n> \n> For more information on parser tokens, have\
    \ a look at the following documentation reference: https://www.php.net/manual/en/tokens."
  merge: -1
  img_proc: true
- pgno: 383
  md: "The impact of this change produces extremely positive results. For one, you\
    \ can now use reserved key words as part of a namespace. Also, in the future,\
    \ as new keywords are introduced into the language, PHP will not force you to\
    \ change namespaces in your applications. The new tokenization process also facilitates\
    \ the use of Attributes with namespaces.\n\nFirst, let's have a look at using\
    \ keywords in a namespace.\n\n# Using reserved keywords in a namespace\n\nThe\
    \ namespace tokenization process in PHP 7 produced a series of string (T_STRING)\
    \ and backslash (T_NS_SEPARATOR) tokens. The problem with this approach is that\
    \ if one of the strings happened to be a PHP keyword, a syntax error was immediately\
    \ thrown during the parsing process. PHP 8, however, produces just a single token,\
    \ as shown earlier, in Table 9.5. Ultimately, this means that you can put pretty\
    \ much anything in a namespace and don't have to worry about reserved keyword\
    \ conflicts.\n\nThe following code example illustrates the difference in namespace\
    \ handling between PHP 8 and earlier versions. In this example, a PHP keyword\
    \ is being used as part of the namespace. In PHP 7, due to its inaccurate tokenization\
    \ process, List is seen as a keyword rather than part of the namespace:\n\n```\n\
    ```php\n// /repo/ch09/php8_namespace_reserved.php\nnamespace List\\Works\\Only\\\
    In\\PHP8;\nclass Test {\n    public const TEST = 'TEST';\n}\necho Test::TEST .\
    \ \"\\n\";\n```\n```\n\nHere is the output from PHP 7:\n\n```\n```\nroot@php8_tips_php7\
    \ [ /repo/ch09 ]#\nphp php8_namespace_reserved.php\nPHP Parse error: syntax error,\
    \ unexpected 'List' (T_LIST),\nexpecting '{' in /repo/ch09/php8_namespace_reserved.php\
    \ on line 3\n```\n```\n\nIn PHP 8, the program code snippet works as expected,\
    \ as shown here:\n\n```\n```\nroot@php8_tips_php8 [ /repo/ch09 ]#\nphp php8_namespace_reserved.php\n\
    TEST\n```\n```"
  merge: -1
  img_proc: true
- pgno: 384
  md: "Now that you have an idea of how the tokenization process differs between PHP\
    \ 8 and earlier PHP versions, as well as its potential benefits, let's have a\
    \ look at potential backward compatible code breaks.\n\n# Exposing bad namespace\
    \ naming practices\n\nThe same PHP 8 tokenization process that releases you from\
    \ having to worry about keyword conflicts may also end up exposing bad namespace\
    \ naming practices. Any namespaces with white space in them are now considered\
    \ invalid. However, it's a bad practice to include whitespace in a namespace anyhow!\n\
    \nThe following simple code example illustrates this principle. In this example,\
    \ you'll notice that the namespace includes white space:\n\n```\n// /repo/ch09/php7_namespace_bad.php\n\
    namespace Doesnt \\Work \\In \\PHP8;\nclass Test {\n    public const TEST = 'TEST';\n\
    }\necho Test::TEST . \"\\n\";\n```\n\nIf we run this code in PHP 7, it works OK.\
    \ Here's the PHP 7 output:\n\n```\nroot@php8_tips_php7 [ /repo/ch09 ]#\nphp php7_namespace_bad.php\n\
    TEST\n```\n\nIn PHP 8, however, a ParseError is thrown, as shown here:\n\n```\n\
    root@php8_tips_php8 [ /repo/ch09 ]#\nphp php7_namespace_bad.php\nPHP Parse error:\
    \ syntax error, unexpected fully qualified name \"\\Work\", expecting \"{\" in\
    \ /repo/ch09/php7_namespace_bad.php on line 3\n```\n\nThe space serves as a delimiter\
    \ that's used by the parser during the tokenization process. In this code example,\
    \ PHP 8 assumes that the namespace is Doesnt. The next token is \\ Work, which\
    \ marks a fully qualified class name. However, it's not expected at this point,\
    \ which is why an error was thrown."
  merge: -1
  img_proc: true
- pgno: 385
  md: 'This concludes our discussion on the changes that have been made to namespace
    handling in PHP 8. You are now in a better position to create namespace names
    in PHP 8 that not only follow best practices, but also take advantage of its independence
    from keyword naming conflicts.


    # Summary


    PHP 8, as you learned, is much stricter in terms of how it defines magic methods.
    In this chapter, you learned about method signature changes and how to reduce
    potential bugs by using magic methods properly. You also learned about the method
    signature changes in both the Reflection and PDO extensions. With the knowledge
    you''ve gained in this chapter, you can avoid potential problems when migrating
    to PHP 8. In addition, you learned about changes in how static methods can be
    called, as well as a new static return type.


    Then, you learned how to make the best use of private methods, as well as how
    to exert greater control over anonymous classes. You also picked up a few tips
    on new syntax possibilities and which methods are now obsolete due to changes
    in the language.


    You also learned how to correctly use interfaces and traits to facilitate efficient
    use of your code. You learned about the new interfaces that were introduced to
    bring the DOM extension up to the new DOM Living Standard. In addition, you gained
    insights into using new methods introduced in the DateTime extension.


    Finally, you learned how to clean up namespace usage and produce tighter code.
    You now have a better understanding of how the namespace tokenization process
    was inaccurate and how it''s been improved in PHP 8.


    The next chapter will present you with something every developer strives for:
    tips, tricks, and techniques to improve performance.'
  merge: -1
  img_proc: true

    The last function we will examine, in the next subsection, is assert().


    # Learning about changes to assert()


    The assert() function is normally associated with testing and diagnostics. We
    include it in this subsection, as it often has security implications. Developers
    sometimes use this function when attempting to trace potential security vulnerabilities.


    To use the assert() function, you must first enable it by adding a php.ini file
    setting zend.assertions=1. Once enabled, you can place one or more assert() function
    calls at any place within your application code.'

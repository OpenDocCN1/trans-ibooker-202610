    # Understanding the benefits of WeakMap over SplObjectStorage


    The main problem with SplObjectStorage is that when an assigned object gets unset
    or otherwise goes out of scope, it still remains in memory. The reason for this
    is when the object is attached to the SplObjectStorage instance, it''s done by
    reference.


    If you''re only dealing with a small number of objects, you''ll probably not experience
    any serious issues. If you use SplObjectStorage and assign a large number of expensive
    objects for storage, this could eventually cause memory leaks in long-running
    programs. If, on the other hand, you use a WeakMap instance for storage, garbage
    collection is allowed to remove the object, which in turn frees up memory. When
    you start to integrate WeakMap instances into your regular programming practice,
    you end up with more efficient code that takes up much less memory.


    > **Tip**

    > For more information about WeakMap, have a look at the original RFC here: https://wiki.php.net/rfc/weak_maps.
    Also have a look at the documentation: https://www.php.net/weakMap.



    \ php8_array_negative_index.php\n/repo/ch06/php8_array_negative_index.php:6:\n\
    array(3) {\n  [-3] => string(3) \"CCC\"\n  [-2] => string(3) \"BBB\"\n  [-1] =>\
    \ string(3) \"AAA\"\n}\n/repo/ch06/php8_array_negative_index.php:12:\narray(3)\
    \ {\n  [-3] => string(3) \"CCC\"\n  [0] => string(3) \"BBB\"\n  [1] => string(3)\
    \ \"AAA\"\n}\n```\n```\n\n4. However, as you can see from the second var_dump()\
    \ output, automatic array indexing skips to zero regardless of the previous high\
    \ value.\n\n5. In PHP 8, on the other hand, you can see that the output is consistent.\
    \ Here's the PHP 8 output:\n\n```\n```bash\nroot@php8_tips_php8 [ /repo/ch06 ]#\n\
    php php8_array_negative_index.php\narray(3) {\n  [-3]=> string(3) \"CCC\"\n  [-2]=>\
    \ string(3) \"BBB\"\n  [-1]=> string(3) \"AAA\"\n}\n```\n```"

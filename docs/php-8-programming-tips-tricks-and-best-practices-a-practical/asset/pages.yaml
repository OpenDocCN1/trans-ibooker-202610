- pgno: 417
  md: "In PHP 7.4, a potential solution to this problem was introduced in the form\
    \ of weak reference support. PHP 8 expanded upon this new ability by adding a\
    \ weak map class. In this section, you'll learn how this new technology works,\
    \ and how it can prove advantageous to development. Let's first have a look at\
    \ weak references.\n\n# Taking advantage of weak references\n\nWeak references\
    \ were first introduced in PHP 7.4, and have been refined in PHP 8. This class\
    \ serves as a wrapper for object creation that allows the developer to use references\
    \ to objects in such a manner whereby out-of-scope (for example, unset ()) objects\
    \ are not protected from garbage collection.\n\nThere are a number of PHP extensions\
    \ currently residing on pec1.php.net that provide support for weak references.\
    \ Most of the implementations hack into the C language structures of the PHP language\
    \ core, and either overload object handlers, or manipulate the stack and various\
    \ C pointers. The net result, in most cases, is a loss of portability and lots\
    \ of segmentation faults. The PHP 8 implementation avoids these problems.\n\n\
    It's important to master the use of PHP 8 weak references if you are working on\
    \ program code that involves large objects and where the program code might run\
    \ for a long time. Before getting into usage details, let's have a look at the\
    \ class definition.\n\n# Reviewing the WeakReference class definition\n\nThe formal\
    \ definition for the WeakReference class is as follows:\n\n```\n```php\nWeakReference\
    \ {\n    public __construct() : void\n    public static create (object $object)\
    \ : WeakReference\n    public get() : object|null\n}\n```\n```\n\nAs you can see,\
    \ the class definition is quite simple. The class can be used to provide a wrapper\
    \ around any object. The wrapper makes it easier to completely destroy an object\
    \ without fear there may be a lingering reference causing the object to still\
    \ reside in memory."
  merge: -1
  img_proc: true
- pgno: 418
  md: "> **Tip**\n> \n> For more information on the background and nature of weak\
    \ references, have a look here: https://wiki.php.net/rfc/weakrefs. The documentation\
    \ reference is here: https://www.php.net/manual/en/class.weakreference.php.\n\n\
    Let's now have a look at a simple example to help your understanding.\n\n# Using\
    \ weak references\n\nThis example demonstrates how weak references could be used.\
    \ You will see in this example that when a normal object assignment by reference\
    \ is made, even if the original object is unset, it still remains loaded in memory.\
    \ On the other hand, if you assign the object reference using WeakReference, once\
    \ the original object is unset, it's completely removed from memory:\n\n1. First,\
    \ we define four objects. Note that $obj2 is a normal reference to $obj1, whereas\
    \ $obj4 is a weak reference to $obj3:\n\n```\n```php\n// /repo/ch010/php8_weak_reference.php\n\
    $obj1 = new class () { public $name = 'Fred'; };\n$obj2 = $obj1; // normal reference\n\
    $obj3 = new class () { public $name = 'Fred'; };\n$obj4 = WeakReference::create($obj3);\
    \ // weak ref\n```\n```\n\n2. We then display the contents of $obj2 before and\
    \ after $obj1 is unset. Because the connection between $obj1 and $obj2 is a normal\
    \ PHP reference, $obj1 remains in memory due to the strong reference created:\n\
    \n```\n```php\nvar_dump($obj2);\nunset($obj1);\nvar_dump($obj2); // $obj1 still\
    \ loaded in memory\n```\n```\n\n3. We then do the same for $obj3 and $obj4. Note\
    \ that we need to use WeakReference::get() to obtain the associated object. Once\
    \ $obj3 is unset, all information pertaining to both $obj3 and $obj4 is removed\
    \ from memory:\n\n```\n```php\nvar_dump($obj4->get());\nunset($obj3);\nvar_dump($obj4->get());\
    \ // both $obj3 and $obj4 are gone\n```\n```"
  merge: -1
  img_proc: true

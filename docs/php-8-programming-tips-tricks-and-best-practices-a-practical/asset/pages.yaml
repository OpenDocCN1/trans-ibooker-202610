    Let''s now have a look at JIT compiler debugging.


    # Debugging with the JIT compiler


    Normal debugging using **XDebug** or other tools will not work effectively when
    using the JIT compiler. Accordingly, the PHP core team added an additional `php.ini`
    file option, `opcache.jit_debug`, which produces additional debugging information.
    In this case, the settings available take the form of bit flags, which means you
    can combine them using bitwise operators such as AND, OR, XOR, and so forth.


    *Table 10.1* summarizes values that can be assigned as an `opcache.jit_debug`
    setting. Please note that the column labeled **Internal Constant** does not show
    PHP predefined constants. These values are internal C code references:'
  merge: -1
  img_proc: true
- pgno: 401
  md: '| Internal Constant | Value | Meaning |

    |---|---|---|

    | ZEND_JIT_DEBUG_ASM | 1 | Dump assembler code |

    | ZEND_JIT_DEBUG_SSA | 2 | Dump static single assignments |

    | ZEND_JIT_DEBUG_REG_ALLOC | 4 | Register allocation info |

    | ZEND_JIT_DEBUG_ASM_STUBS | 8 | Assembler stubs |

    | ZEND_JIT_DEBUG_PERF | 16 | Create perf.map for Linux perf |

    | ZEND_JIT_DEBUG_PERF_DUMP | 32 | Create perf.dump for Linux perf |

    | ZEND_JIT_DEBUG_OPROFILE | 64 | Debug info for Linux Oprofile |

    | ZEND_JIT_DEBUG_VTUNE | 128 | Debug info for Intel VTune |

    | ZEND_JIT_DEBUG_GDB | 256 | Debug using GNU debugger |

    | ZEND_JIT_DEBUG_SIZE | 512 | Memory sizing |

    | ZEND_JIT_DEBUG_ASM_ADDR | 1024 | Assembler addressing |

    | ZEND_JIT_DEBUG_TRACE_START | 4096 | Trace start |

    | ZEND_JIT_DEBUG_TRACE_STOP | 8192 | Trace stop |

    | ZEND_JIT_DEBUG_TRACE_COMPILED | 16384 | Trace compiled |

    | ZEND_JIT_DEBUG_TRACE_EXIT | 32768 | Trace exit |

    | ZEND_JIT_DEBUG_TRACE_ABORT | 65536 | Trace abort |

    | ZEND_JIT_DEBUG_TRACE_BLACKLIST | 131072 | Trace blacklist |

    | ZEND_JIT_DEBUG_TRACE_BYTECODE | 262144 | Trace bytecode reference |

    | ZEND_JIT_DEBUG_TRACE_TSSA | 524288 | Trace static single assignment |

    | ZEND_JIT_DEBUG_TRACE_EXIT_INFO | 1048576 | Trace exit information |


    Table 10.1 – opcache.jit_debug settings


    So, for example, if you wish to enable debugging for ZEND_JIT_DEBUG_ASM, ZEND_JIT_DEBUG_PERF,
    and ZEND_JIT_DEBUG_EXIT, you could make the assignment in the php.ini file as
    follows:


    +   1. First, you need to add up the values you wish to set. In this example,
    we would add:

    +   2. You then apply the sum to the php.ini setting:

    +   3. Or, alternatively, represent the values using bitwise OR:


    ```

    1 + 16 + 32768

    ```


    ```

    opcache.jit_debug=32725

    ```


    ```

    opcache.jit_debug=1|16|32768

    ```


    Depending on the debug setting, you are now in a position to debug the JIT compiler
    using tools such as the Linux perf command, or Intel VTune.'

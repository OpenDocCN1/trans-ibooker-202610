- pgno: 227
  md: 'Please bear in mind that when PHP was first introduced in 1994, the initial
    goal was to make it as easy to use as possible. This approach succeeded, to the
    point where PHP is the language of choice on over 78% of all web servers today
    according to a recent survey of server-side programming languages conducted by
    w3techs. (https://w3techs.com/technologies/overview/programming_language)


    However, in the interests of consistency, it makes sense to align the parameters
    of the implode() function with its mirror twin, explode(). Accordingly, arguments
    supplied to implode() must now be in this order:


    ```

    implode(<GLUE STRING>, <ARRAY>);

    ```


    Here is the code example that calls the implode() function with arguments in either
    order:


    ```

    // /repo/ch06/php7_implode_args.php

    $arr = [''Person'', ''Woman'', ''Man'', ''Camera'', ''TV''];

    echo __LINE__ . '':'' . implode('' '', $arr) . "\n";

    echo __LINE__ . '':'' . implode($arr, '' '') . "\n";

    ```


    As you can see from the PHP 7 output below, both echo statements produce results:


    ```

    root@php8_tips_php7 [ /repo/ch06 ]# php php7_implode_args.php

    5:Person Woman Man Camera TV

    6:Person Woman Man Camera TV

    ```


    In PHP 8, only the first statement succeeds, as shown here:


    ```

    root@php8_tips_php8 [ /repo/ch06 ]#

    php php7_implode_args.php

    5:Person Woman Man Camera TV

    PHP Fatal error: Uncaught TypeError: implode(): Argument #2 ($array) must be of
    type ?array, string given in /repo/ch06/php7_implode_args.php:6

    ```


    It will be extremely difficult to spot where implode() is receiving parameters
    in the wrong order. The best way to be forewarned prior to a PHP 8 migration would
    be to make a note of all classes of PHP files that use implode(). Another suggestion
    would be to take advantage of the PHP 8 named arguments feature (covered in Chapter
    1, Introducing New PHP 8 OOP Features).'

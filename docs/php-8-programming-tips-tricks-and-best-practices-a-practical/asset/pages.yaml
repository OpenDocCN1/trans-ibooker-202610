  md: "# Dealing with counter-intuitive results\n\nUnfortunately, this arrangement\
    \ produces unexpected results. The following code snippet presents a counter-intuitive\
    \ output when executed using PHP 7:\n\n```\n// /repo/ch02/php7_ops_concat_1.php\n\
    $a = 11;\n$b = 22;\necho \"Sum: \" . $a + $b;\n```\n\nJust looking at the code,\
    \ you would expect output something along the lines of \"Sum:33\". That's not\
    \ the case! Have a look at the following output when running on PHP 7.1:\n\n```\n\
    root@php8_tips_php7 [ /repo/ch02 ]# php php7_ops_concat_1.php\nPHP Warning:  A\
    \ non-numeric value encountered in /repo/ch02/php7_ops_concat_1.php on line 5\n\
    PHP Stack trace:\nPHP  1. {main}() /repo/ch02/php7_ops_concat_1.php:0\nWarning:\
    \ A non-numeric value encountered in /repo/ch02/php7_ops_concat_1.php on line\
    \ 5\nCall Stack:\n  0.0001    345896    1. {main}()\n22\n```\n\nAt this point,\
    \ you're probably wondering, as the code never lies where does the sum of 11 +\
    \ 22 come out to 22, as we see in the preceding output (last line)?\n\nThe answer\
    \ involves order of precedence: starting with PHP 7, it's consistently left-to-right.\
    \ So, if we use parentheses to make the order of operations clearer, this is what\
    \ actually happens:\n\n```\necho (\"Sum: \" . $a) + $b;\n```\n\n11 gets concatenated\
    \ to \"Sum: \", resulting in \"Sum: 11\". as a string. The string is then type-juggled\
    \ to an integer, resulting in a 0 + 22 expression, which gives us our result.\n\
    \nIf you run the same code in PHP 8, notice the difference here:\n\n```\nroot@php8_tips_php8\
    \ [ /repo/ch02 ]# php php8_ops_concat_1.php\nSum: 33\n```"

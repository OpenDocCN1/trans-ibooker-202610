    \ later), you need to be aware that a couple of dozen aliases have been deprecated\
    \ in the PHP 8 PostgreSQL extension. As with the aliases removed from the mbstring\
    \ extension, the aliases we cover in this section are without underscore characters\
    \ in the latter part of the alias name.\n\nThis table summarizes the aliases removed,\
    \ and which functions to call in their place:\n\n| Alias | Use Instead | Alias\
    \ | Use Instead |\n|---|---|---|---|\n| pg_errormessage() | pg_last_error() |\
    \ pg_getlastoid() | pg_last_oid() |\n| pg_numrows() | pg_num_rows() | pg_locreate()\
    \ | pg_lo_create() |\n| pg_numfields() | pg_num_fields() | pg_lounlink() | pg_lo_unlink()\
    \ |\n| pg_cmdtuples() | pg_affected_rows() | pg_loopen() | pg_lo_open() |\n| pg_fieldname()\
    \ | pg_field_name() | pg_loclose() | pg_lo_close() |\n| pg_fieldsize() | pg_field_size()\
    \ | pg_loread() | pg_lo_read() |\n| pg_fieldtype() | pg_field_type() | pg_lowrite()\
    \ | pg_lo_write() |\n| pg_fieldnum() | pg_field_num() | pg_loreadall() | pg_lo_read_all()\
    \ |\n| pg_result() | pg_fetch_result() | pg_loimport() | pg_lo_import() |\n| pg_fieldprlen()\
    \ | pg_field_prtlen() | pg_loexport() | pg_lo_export() |\n| pg_fieldisnull() |\
    \ pg_field_is_null() | pg_setclientencoding() | pg_set_client_encoding() |\n|\
    \ pg_freeresult() | pg_free_result() | pg_clientencoding() | pg_client_encoding()\
    \ |\n\nTable 8.4 – Deprecated functionality in PostgreSQL extension\n\nPlease\
    \ note that it's often difficult to find documentation on deprecations. In this\
    \ case, you can consult the PHP 7.4 to PHP 8 migration guide here: https://www.php.net/manual/en/migration80.deprecated.php#migration80.deprecated.pgsql.\
    \ Otherwise, you can always look in the C source code docblocks for @deprecation\

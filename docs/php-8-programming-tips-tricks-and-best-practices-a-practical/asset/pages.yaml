- pgno: 261
  md: 'The source code for this chapter is located here:


    ```

    https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices/tree/main/ch07

    ```


    We can now begin our discussion by examining the overall trend in PHP 8 toward
    objects rather than resources.


    # Understanding the shift from resources to objects


    The PHP language has always had an uneasy relationship with resources. Resources
    represent a connection to an external system such as a file handle or a connection
    to a remote web service using the client URL (cURL) extension. One big problem
    with resources, however, is that they defy attempts at data typing. There''s no
    way to distinguish a file handle from a cURL connection—they''re both identified
    as resources.


    In PHP 8, a major effort has taken place to move away from resources and to replace
    them with objects. One of the earliest examples of this trend prior to PHP 8 is
    the PDO class. When you create a PDO instance, it automatically creates a database
    connection. Starting with PHP 8, many functions that previously produced a resource
    now produce an object instance instead. Let''s start our discussion by having
    a look at extension functions that now produce objects rather than resources.


    # PHP 8 extension resource-to-object migration


    It''s important for you to be aware of which functions in PHP 8 now produce objects
    instead of resources. The good news is that the extension functions have also
    been rewritten to accommodate an object as an argument rather than a resource.
    The bad news is that there is a potential backward-compatible code break where
    you initialize the resource (now object) and test for success using the is_resource()
    function.'
  merge: -1
  img_proc: true
- pgno: 262

- pgno: 154
  md: 'Let''s first have a look at FFI::addr(), free(), memset(), and memcpy().


    # Working with FFI::addr(), free(), memset(), and memcpy()


    PHP developers often assign a value to a variable by **reference**. This allows
    a change in one variable to be automatically reflected in another. The use of
    references is especially useful when passing parameters to a function or method
    where you need to return more than a single value. Passing by reference allows
    the function or method to return an unlimited number of values.


    The FFI::addr() method creates a C pointer to an existing FFI\CData instance.
    Just as with a PHP reference, any changes made to the data associated with the
    pointer will likewise be changed.


    In the process of building an example using the FFI::addr() method, we also introduce
    you to FFI::memset(). This function is much like the str_repeat() PHP function,
    in that it (FFI::memset()) populates a specified number of bytes with a specific
    value. In this example, we use FFI::memset() to populate a C character string
    with letters of the alphabet.


    In this subsection, we also have a look at FFI::memcpy(). This function is used
    to copy data from one FFI\CData instance to another. Unlike the FFI::addr() method,
    FFI::memcpy() creates a clone that has no connection to the source of the copied
    data. In addition, we introduce FFI::free(), a method used to release a pointer
    created using FFI::addr().


    Let''s have a look at how these FFI extension methods can be used, as follows:


    1. First, a FFI\CData instance, $arr, is created, consisting of a C string of
    six characters. Note in the following code snippet the use of FFI::memset(), another
    infrastructural method, to populate the string with **American Standard Code for
    Information Interchange** (ASCII) code 65: the letter A:


    ```

    // /repo/ch04/php8_ffi_addr_free_memset_memcpy.php

    $size = 6;

    $arr  = FFI::new(FFI::type("char[$size]"));

    FFI::memset($arr, 65, $size);

    echo FFI::string($arr, $size);

    ```


    2. The echo result using the FFI::string() method is shown here:


    ```

    AAAAAA

    ```'

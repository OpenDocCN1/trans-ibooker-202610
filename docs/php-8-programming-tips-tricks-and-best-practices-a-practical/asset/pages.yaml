  md: "5. Now comes the part of most interest: creating the heap. To accomplish this,\
    \ we define an anonymous class that extends SplHeap. We then define a compare()\
    \ method that performs the necessary logic to place inserted elements in their\
    \ proper place. PHP 7 allows you to change the method signature. In this example,\
    \ we provide arguments in the form of an array:\n\n```\n$heap = new class () extends\

- pgno: 415
  md: "The output shows that the keys for any duplicate entries appear in the output\
    \ in their original order. The output demonstrates that PHP 8 implements stable\
    \ sorting for not only values but for keys as well. Further, as the elapsed time\
    \ results show, PHP 8 has managed to retain the same (or better) performance as\
    \ before. Let's now turn our attention to another difference in PHP 8 that directly\
    \ affects array sorting: the handling of illegal sort functions.\n\n# Handling\
    \ illegal sort functions\n\nPHP 7 and earlier allows developers to get away with\
    \ an illegal function when using usort() or uasort() (or the equivalent ArrayIterator\
    \ methods). It's extremely important for you to be aware of this bad practice.\
    \ Otherwise, when you migrate your code to PHP 8, a potential backward-compatibility\
    \ break exists.\n\nIn the example shown next, the same array is created as in\
    \ the example described in the Contrasting stable and non-stable sorting section.\
    \ The illegal sort function returns a Boolean value, whereas the u*sort() callback\
    \ needs to return the relative position between the two elements. In literal terms,\
    \ the user-defined function, or callback, needs to return -1 if the first operand\
    \ is less than the second, 0 if equal, and 1 if the first operand is greater than\
    \ the second. If we rewrite the line of code the defines the usort() callback,\
    \ an illegal function might appear as follows:\n\n```\nusort($access, function($a,\
    \ $b) {\n    return $a->time < $b->time; });\n```\n\nIn this code snippet, instead\
    \ of using the spaceship operator (<=>), which would return -1, 0, or 1, we use\
    \ a less-than symbol (<). In PHP 7 and below, a callback that returns a boolean\
    \ return value is acceptable and produces the desired results. But what actually\
    \ happens is that the PHP interpreter needs to add an additional operation to\
    \ make up the missing operation. Thus, if the callback only performs this comparison:\n\
    \n```\nop1 > op2\n```\n\nThe PHP interpreter adds an additional operation:\n\n\
    ```\nop1 <= op2\n```\n\nIn PHP 8, illegal sort functions spawn a deprecation notice.\
    \ Here is the rewritten code running in PHP 8:\n\n```\nroot@php8_tips_php8 [ /repo/ch10\
    \ ]#\nphp php8_sort_illegal_func.php\nPHP Deprecated: usort(): Returning bool\
    \ from comparison\nfunction is deprecated, return an integer less than, equal\
    \ to,\n```"
  merge: -1

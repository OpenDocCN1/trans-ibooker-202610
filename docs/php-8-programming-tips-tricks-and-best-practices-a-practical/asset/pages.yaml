  img_proc: true
- pgno: 370
  md: "```\n$fmt = 'Y-m-d';\n$aging = [];\n```\n\n2. Now, let's define a loop that\
    \ adds the intervals to a DateTime instance to produce (hopefully!) an array representing\
    \ days 0, 30, 60, and 90. Veteran developers have most likely already spotted\
    \ the problem!\n\n```\n$dti = new DateTime('now');\nforeach ($days as $span) {\n\
    \    $interval = new DateInterval('P' . $span . 'D');\n    $item = $dti->add($interval);\n\
    \    $aging[$span] = clone $item;\n}\n```\n\n3. Next, display the set of dates\
    \ that have been produced:\n\n```\necho \"Day\\tDate\\n\";\nforeach ($aging as\
    \ $key => $obj)\n    echo \"$key\\t\" . $obj->format($fmt) . \"\\n\";\n```\n\n\
    4. The output, which is a complete disaster, is shown here:\n\n```\nroot@php8_tips_php7\
    \ [ /repo/ch09 ]#\nphp php7_date_time_30-60-90.php\nDay    Date\n0      2021-11-20\n\
    30     2021-06-23\n60     2021-08-22\n90     2021-11-20\n```\n\nAs you can see,\
    \ the problem is that the DateTime class is not immutable. Thus, every time we\
    \ add a DateInterval, the original value is altered, resulting in the inaccurate\
    \ dates shown.\n\n5. By making one simple alteration, however, we can correct\
    \ this problem. Instead of originally creating a DateTime instance, all we need\
    \ to do is create a DateTimeImmutable instance instead:\n\n```\n$dti = new DateTimeImmutable('now');\n\
    ```"

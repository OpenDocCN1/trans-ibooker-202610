  md: 'Native PHP also allows the developer to force the data type by prepending the
    desired data type in parentheses in front of the variable or expression. The rewritten
    example from the previous code snippet might appear as follows:


    ```

    $a = 123;

    $b = "456";

    echo (string) ($a + (int) $b);

    ```


    Forced type casting makes your intention extremely clear to other developers who
    make use of your code. It also guarantees results in that forcing the type cast
    exerts greater control over the flow of your code, and does not rely upon PHP
    default behavior.


    The FFI extension has a similar capability in the form of the FFI::cast() method.
    As you have seen throughout this chapter, FFI extension data is isolated from
    PHP and is immune to PHP type casting. In order to force the data type, you can
    use FFI::cast() to return a parallel FFI\CData type as required. Let''s see how
    to do that in the following steps:


    +   1. In this example, we create a FFI\CData instance, $int1, of type int. We
    use its cdata property to assign a value 123, as follows:


    ```

    // /repo/ch04/php8_ffi_cast.php

    // not all lines are shown

    $patt = "%2d : %16s\n";

    $int1 = FFI::new("int");

    $int1->cdata = 123;

    $bool = FFI::cast(FFI::type("bool"), $int1);

    printf($patt, __LINE__, (string) $int1->cdata);

    printf($patt, __LINE__, (string) $bool->cdata);

    ```


    +   2. As you can see from the output shown here, the integer value of 123, when
    typecast to bool (Boolean), shows up in the output as 1:


    ```

    8 :               123

    9 :                 1

    ```


    +   3. Next we create a FFI\CData instance, $int2, of type int and assign a value
    123. We then typecast it to float and back again to int, as illustrated in the
    following code snippet:


    ```

    $int2 = FFI::new("int");

    $int2->cdata = 123;

    ```'

- pgno: 444
  md: "```\nsprintf(self::OK_PASSED, __FUNCTION__);\nreturn $found;\n}\n```\n\n3.\
    \ We then have a look at what’s required to go through our list of callbacks.\
    \ As you recall, we need to employ callbacks in situations where a simple strpos()\

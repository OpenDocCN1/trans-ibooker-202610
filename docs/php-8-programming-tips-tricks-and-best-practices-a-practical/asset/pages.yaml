- pgno: 120
  md: '# Promoted warnings in string handling


    The same discussion about promoted warnings pertaining to objects and arrays also
    applies to PHP 8 string error handling. In this subsection, we examine two string-handling
    Warnings promoted to Errors, outlined here:


    +   - Offset not contained in the string

    +   - Empty string offset

    +   - Let''s start by examining offsets not contained in a string.


    # Offset not contained in the string.


    As an example of the first situation, have a look at the following code sample.
    Here, we start with a string assigned all letters of the alphabet. We then use
    strpos() to return the position of the letter Z, starting at offset 0. On the
    next line, we do the same thing; however, the offset of 27 is off the end of the
    string:


    ```

    // /repo/ch03/php8_error_str_pos.php

    $str = ''ABCDEFGHIJKLMNOPQRSTUVWXYZ'';

    echo $str[strpos($str, ''Z'', 0)];

    echo $str[strpos($str, ''Z'', 27)];

    ```


    In PHP 7, as expected, an output of Z is returned, with a Warning from strpos()
    and a Notice that an offset cast (more on that in the next section) occurred.
    Here is the PHP 7 output:


    ```

    Z

    PHP Warning: strpos(): Offset not contained in string in /repo/ch03/php8_error_str_pos.php
    on line 7

    PHP Notice: String offset cast occurred in /repo/ch03/php8_error_str_pos.php on
    line 7

    ```


    In PHP 8, however, a fatal ValueError is thrown, as seen here:


    ```

    Z

    PHP Fatal error: Uncaught ValueError: strpos(): Argument #3 ($offset) must be

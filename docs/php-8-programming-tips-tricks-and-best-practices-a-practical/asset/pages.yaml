- pgno: 97
  md: "# Securing SQLite databases with the authorizer\n\nMany PHP developers prefer\
    \ to use SQLite as their database engine rather than a separate database server\
    \ such as PostgreSQL, MySQL, Oracle, or MongoDB. The reasons for using SQLite\
    \ are many, but often come down to the following:\n\n+   - **SQLite is a file-based\
    \ database**: You don't have to install a separate database server.\n+   - **It's\
    \ easy to distribute**: The only requirement is that the target server needs to\
    \ have the SQLite executable installed.\n+   - **SQLite is lightweight**: Since\
    \ there's no constantly running server, it takes fewer resources.\n\nThat said,\
    \ the downside is that it's not very scalable. If you have a fairly substantial\
    \ amount of data to deal with, it's probably better to install a more powerful\
    \ database server. The other potentially major drawback is that SQLite has no\
    \ security, covered in the next subsection.\n\n> **Tip**\n> For more information\
    \ about SQLite, please have a look at their main web page:\n> https://sqlite.org/index.html.\n\
    \n# Wait a minute... no security?\n\n*Yes, you heard correctly:* by default, by\
    \ its very design, SQLite has no security. That, of course, is the reason many\
    \ developers like to use it: having no security makes it super-easy to work with!\n\
    \nHere's a sample block of code that connects to a SQLite database and conducts\
    \ a simple query of the geonames table. It returns a list of cities in India where\
    \ the population is greater than 2 million:\n\n```\n```php\n// /repo/ch02/php8_sqlite_query.php\n\
    define('DB_FILE', __DIR__ . '/tmp/sqlite.db');\n$sqlite = new SQLite3(DB_FILE);\n\
    $sql = 'SELECT * FROM geonames '\n    . 'WHERE country_code = :cc AND population\
    \ > :pop';\n$stmt = $sqlite->prepare($sql);\n$stmt->bindValue(':cc', 'IN');\n\
    $stmt->bindValue(':pop', 2000000);\n$result = $stmt->execute();\n```\n```"
  merge: -1
  img_proc: true
- pgno: 98
  md: "```\nwhile ($row = $result->fetchArray(SQLITE3_ASSOC)) {\n    printf(\"%20s\
    \ : %2s : %16s\\n\",\n        $row['name'], $row['country_code'],\n        number_format($row['population']));\n\
    } // not all code is shown\n```\n\nMost other database extensions require at least\
    \ a username and password when establishing a connection. As you can see in the\
    \ preceding code snippet, the `$sqlite` instance is created with absolutely no\
    \ security involved: no username or password.\n\n# What's a SQLite authorization\
    \ callback?\n\nThe SQLite3 engine now allows you to register an **authorization\
    \ callback** to your SQLite database connection. The callback routine is invoked\
    \ when sending a **prepared statement** to the database for compilation. Here\
    \ is the generic syntax to set an authorization callback on a SQLite3 instance:\n\
    \n```\n$sqlite3->setAuthorizer(callable $callback);\n```\n\nThe callback is expected\
    \ to return one of three SQLite3 class constants, each of which represents an\
    \ integer value. If the callback returns anything other than one of these three\
    \ values, `SQLite3::DENY` is assumed and the operation does not proceed. The table\
    \ shown next lists the three expected return values:\n\n| Constant | Description\
    \ |\n|---|---|\n| SQLite3::OK | Success |\n| SQLite3::IGNORE | Statement is allowed\
    \ to prepare, but is rendered neutral |\n| SQLite3::DENY | Deny access |\n\nTable\
    \ 2.2 – Valid SQLite authorization callback return values\n\nNow that you've got\
    \ an idea about the callback, let's have a look at how it gets invoked.\n\n# What\
    \ gets sent to the callback?\n\nThe callback is invoked when you execute `$sqlite->prepare($sql)`.\
    \ At that time, the SQLite3 engine passes between one to five parameters to the\
    \ callback. The first argument is an **action code** that determines the nature\
    \ of the remaining arguments. Accordingly, the following might be an appropriate\
    \ generic function signature for the callback that you ultimately define:"
  merge: -1
  img_proc: true
- pgno: 99
  md: "```\nfunction NAME (int $actionCode, ...$params)\n{ /* callback code */ };\n\
    ```\n\nThe action codes for the most part mirror the SQL statement to be prepared.\
    \ The following table summarizes a number of more common action codes:\n\n| Code\
    \ (1st Param) | 2nd Param | 3rd Param | SQL |\n|---|---|---|---|\n| SQLITE_READ\
    \ | Table Name | Column Name | SELECT (each result) |\n| SQLITE_SELECT | NULL\
    \ | NULL | SELECT (first issued) |\n| SQLITE_INSERT | Table Name | NULL | INSERT\
    \ |\n| SQLITE_UPDATE | Table Name | Column Name | UPDATE |\n| SQLITE_DELETE |\
    \ Table Name | NULL | DELETE |\n| SQLITE_CREATE_* | Name of item created | Either\
    \ Table Name or NULL | CREATE TABLE | INDEX | VIEW and so on |\n| SQLITE_DROP_*\
    \ | Name of item created | Either Table Name or NULL | DROP TABLE | INDEX | VIEW\
    \ and so on |\n\nTable 2.3 – Common action codes sent to callback\n\nIt's now\
    \ time to have a look at a usage example.\n\n# Authorizer usage example\n\nIn\
    \ the following example, we're allowed to read from the SQLite geonames table,\
    \ but not to insert, delete, or update:\n\n+   1. We start by defining an auth_callback.php\
    \ include file in the /repo/ch02/includes/ directory. In the include file, we\
    \ first define constants that are used in the callback, as illustrated in the\
    \ following code snippet:\n\n```\n// /repo/ch02/includes/auth_callback.php\ndefine('DB_FILE',\
    \ '/tmp/sqlite.db');\ndefine('PATTERN', '%-8s | %-4s | %-28s | %-15s');\ndefine('DEFAULT_TABLE',\
    \ 'Unknown');\ndefine('DEFAULT_USER', 'guest');\ndefine('ACL' , [\n    'admin'\
    \ => [\n        'users' => [SQLite3::READ, SQLite3::SELECT,\n            SQLite3::INSERT,\
    \ SQLite3::UPDATE,\n            SQLite3::DELETE],\n        'geonames' => [SQLite3::READ,\
    \ SQLite3::SELECT,\n```"
  merge: -1
  img_proc: true
- pgno: 100
  md: "```\nSQLite3::INSERT, SQLite3::UPDATE,\nSQLite3::DELETE],\n],\n'guest' => [\n\
    'geonames' => [SQLite3::READ,\nSQLite3::SELECT],\n],\n]);\n```\n\nThe way the\
    \ access control list (ACL) works is that the primary outer key is the user (for\
    \ example, admin or guest); the secondary key is the table (for example, users\
    \ or geonames); and the value is an array of SQLite3 action codes allowed for\
    \ this user and table.\n\nIn the example shown previously, the admin user has\
    \ all rights to both tables, whereas the guest user can only read from the geonames\
    \ table.\n\n2. Next, we define the actual authorization callback function. The\
    \ first thing in the function we need to do is set the default return value to\
    \ SQLite3::DENY. We also check to see if the action code is SQLite3::SELECT, in\
    \ which case we simply return OK. This action code is issued when a SELECT statement\
    \ is first processed and does not provide any information on tables or columns.\
    \ The code can be seen in the following snippet:\n\n```\nfunction auth_callback(int\
    \ $code, ...$args) {\n    $status = SQLite3::DENY;\n    $table  = DEFAULT_TABLE;\n\
    \    if ($code === SQLite3::SELECT) {\n        $status = SQLite3::OK;\n```\n\n\
    3. If the action code is anything other than SQLite3::SELECT, we need to first\
    \ determine which table is involved before we can make a decision to allow or\
    \ deny the action. The table name is reported as the second argument provided\
    \ to our callback.\n\n4. Here is the perfect time to use a variadics operator\
    \ as we are unsure exactly how many parameters might be passed. However, for the\
    \ major operations of concern (for example, INSERT, UPDATE, or DELETE), what is\
    \ placed into the first position in $args is the table name. Otherwise, we get\
    \ the table name from the session."
  merge: -1
  img_proc: true

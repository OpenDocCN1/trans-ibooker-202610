- pgno: 220
  md: "To illustrate the potential problem, consider the following example. Assume\
    \ that the needle argument is empty. In this situation, a traditional if () check\
    \ to see whether the strpos() result is not identical to FALSE produces different\
    \ results between PHP 7 and 8. Here is the code example:\n\n1. First, we define\
    \ a function that reports whether or not the needle value is found in the haystack\
    \ using strpos(). Note the strict type check against the Boolean FALSE:\n\n```\n\
    // php7_num_str_empty_needle.php\nfunction test($haystack, $search) {\n    $pattern\
    \ = '%15s | %15s | %10s' . \"\\n\";\n    $result  = (strpos($haystack, $search)\
    \ !== FALSE)\n        ? 'FOUND' : 'NOT FOUND';\n    return sprintf($pattern,\n\
    \        var_export($search, TRUE),\n        var_export(strpos($haystack, $search),\n\
    \            TRUE),\n        $result);\n};\n```\n\n2. We then define the haystack\
    \ as a string with letters and numbers. The needle argument is provided in the\
    \ form of an array of values that are all considered empty:\n\n```\n$haystack\
    \ = 'Something Anything 0123456789';\n$needles = ['', NULL, FALSE, 0];\nforeach\
    \ ($needles as $search)\n    echo test($haystack, $search);\n```\n\nThe output\
    \ in PHP 7 appears as follows:\n\n```\nroot@php8_tips_php7 [/repo/ch06 ]#\nphp\
    \ php7_num_str_empty_needle.php\nPHP Warning:  strpos(): Empty needle in /repo/ch06/php7_num_str_empty_needle.php\
    \ on line 5\n// not all Warnings are shown ...\n'' | false | NOT FOUND\nNULL |\
    \ false | NOT FOUND\nfalse | false | NOT FOUND\n0 | false | NOT FOUND\n```"
  merge: -1
  img_proc: true
- pgno: 221
  md: "After a set of Warnings, the final output appears. As you can see from the\
    \ output, the return value from strpos ($haystack, $search) is consistently the\
    \ Boolean FALSE in PHP 7.\n\nThe output running the same code in PHP 8, however,\
    \ is radically different. Here is the output from PHP 8:\n\n```\nroot@php8_tips_php8\
    \ [ /repo/ch06 ]#\nphp php7_num_str_empty_needle.php\n'' | 0 | FOUND\nNULL | 0\
    \ | FOUND\nfalse | 0 | FOUND\n0 | 19 | FOUND\n```\n\nIn PHP 8, the empty needle\
    \ argument is first silently converted to a string. None of the needle values\
    \ return the Boolean FALSE. This causes the function to report that the needle\
    \ has been found. This is certainly not the desired result. In the case of the\
    \ number 0, however, it is contained in the haystack, resulting in a value of\
    \ 19 being returned.\n\nLet's have a look at how this problem might be addressed.\n\
    \n# Solving the problem using str_contains()\n\nThe intent of the code block shown\
    \ in the previous section is to determine whether or not the haystack contains\
    \ the needle. strpos() is not the right tool to accomplish this task! Have a look\
    \ at the same function using str_contains() instead:\n\n```\n// /repo/ch06/php8_num_str_empty_needle.php\n\
    function test ($haystack, $search) {\n    $pattern = '%15s | %15s | %10s' . \"\
    \\n\";\n    $result  = (str_contains($search, $haystack) !==\n               \
    \ FALSE)\n                ? 'FOUND'  : 'NOT FOUND';\n    return sprintf($pattern,\n\
    \        var_export($search, TRUE),\n        var_export(str_contains($search,\
    \ $haystack),\n            TRUE),\n        $result);\n};\n```"
  merge: -1
  img_proc: true
- pgno: 222
  md: "If we then run the modified code in PHP 8, we get results similar to those\
    \ received from PHP 7:\n\n```\nroot@php8_tips_php8 [ /repo/ch06 ]#\nphp php8_num_str_empty_needle.php\n\
    '' | false | NOT FOUND\nNULL | false | NOT FOUND\nfalse | false | NOT FOUND\n\
    0 | false | NOT FOUND\n```\n\nYou might ask why is it that the number 0 is not\
    \ found in the string? The answer is that str_contains() does a stricter search.\
    \ Integer 0 is not the same as the string \"0\"! Let's now have a look at the\
    \ v*printf() family; another family of string functions that exerts stricter control\
    \ over its arguments in PHP 8.\n\n# Dealing with v*printf() changes\n\nThe v*printf()\
    \ family of functions is a subset of the printf() family of functions that include\
    \ vprintf(), vfprintf(), and vsprintf(). The difference between this subset and\
    \ the main family is that the v*printf() functions are designed to accept an array\
    \ as an argument rather than an unlimited series of arguments. Here is a simple\
    \ example that illustrates the difference:\n\n+   1. First, we define a set of\
    \ arguments that will be inserted into a pattern, $patt:\n+   2. We then execute\
    \ a printf() statement using a series of arguments:\n\n```\n// /repo/ch06/php8_printf_vs_vprintf.php\n\
    $ord = 'third';\n$day = 'Thursday';\n$pos = 'next';\n$date = new DateTime(\"$ord\
    \ $day of $pos month\");\n$patt = \"The %s %s of %s month is: %s\\n\";\n```\n\n\
    ```\nprintf($patt, $ord, $day, $pos,\n    $date->format('l, d M Y'));\n```"
  merge: -1
  img_proc: true
- pgno: 223
  md: "3. We then define the arguments as an array, $arr, and use vprintf() to produce\
    \ the same result:\n\n```\n$arr = [$ord, $day, $pos, $date->format('l, d M Y')];vprintf($patt,\
    \ $arr);\n```\n\nHere is the output of the program running in PHP 8. The output\
    \ is the same running in PHP 7 (not shown):\n\n```\nroot@php8_tips_php8 [ /repo/ch06\
    \ ]#\nphp php8_printf_vs_vprintf.php\nThe third Thursday of next month is: Thursday,\
    \ 15 Apr 2021\nThe third Thursday of next month is: Thursday, 15 Apr 2021\n```\n\
    \nAs you can see, the output of both functions is identical. The only usage difference\
    \ is that vprintf() accepts the parameters in the form of an array.\n\nPrior versions\
    \ of PHP allowed a developer to play fast and loose with arguments presented to\
    \ the v*printf() family of functions. In PHP 8, the data type of the arguments\
    \ is now strictly enforced. This only presents a problem where code controls do\
    \ not exist to ensure that an array is presented. Another even more important\
    \ difference is that PHP 7 will allow ArrayObject with v*printf(), whereas PHP\
    \ 8 will not.\n\nIn the example shown here, PHP 7 issues a Warning, whereas PHP\
    \ 8 throws an Error:\n\n1. First, we define the pattern and the source array:\n\
    \n```\n// /repo/ch06/php7_vprintf_bc_break.php\n$patt = \"\\t%s. %s. %s. %s. %s.\"\
    ;\n$arr = ['Person', 'Woman', 'Man', 'Camera', 'TV'];\n```\n\n2. We then define\
    \ a test data array in order to test which arguments are accepted by vsprintf():\n\
    \n```\n$args = [\n    'Array' => $arr,\n    'Int'   => 999,\n    'Bool'  => TRUE,\n\
    \    'Obj'   => new ArrayObject($arr)\n];\n```"

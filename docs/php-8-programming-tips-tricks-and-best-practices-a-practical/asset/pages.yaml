    \ the code shown previously might be rewritten:\n\n```\ntry {\n    $a->test =\
    \ 0;\n    $a->test++;\n    var_dump($a);\n} catch (Error $e) {\n    error_log(__FILE__\
    \ . ':' . $e->getMessage());\n}\n```\n\nAs you can see, any problems with the\
    \ three lines are now wrapped safely inside a try() / catch() block, meaning that\
    \ recovery is possible. We now turn our attention to array error-handling enhancements.\n\

- pgno: 387
  md: '# 10

    Improving Performance


    PHP 8.x introduces a number of new features that have a positive effect on performance.
    Also, a number of internal improvements, especially in array handling and managing
    object references, lead to a substantive performance increase over earlier PHP
    versions. In addition, many of the PHP 8 best practices covered in this chapter
    lead to greater efficiency and lower memory usage. In this chapter, you''ll discover
    how to optimize your PHP 8 code to achieve maximum performance.


    PHP 8 includes a technology referred to as weak references. By mastering this
    technology, discussed in the last section of this chapter, your applications will
    use far less memory. By carefully reviewing the material covered in this chapter
    and by studying the code examples, you will be able to write faster and more efficient
    code. Such mastery will vastly improve your standing as a PHP developer and result
    in satisfied customers, as well as improving your career potential.


    Topics covered in this chapter include the following:


    +   - Working with the **Just-In-Time (JIT)** compiler

    +   - Speeding up array handling

    +   - Implementing stable sort

    +   - Using weak references to improve efficiency'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# Technical requirements


    To examine and run the code examples provided in this chapter, the minimum recommended
    hardware is the following:


    +   - x86_64 based desktop PC or laptop

    +   - 1 gigabyte (GB) free disk space

    +   - 4 GB of RAM

    +   - 500 kilobits per second (Kbps) or faster internet connection


    In addition, you will need to install the following software:


    +   - Docker

    +   - Docker Compose


    Please refer to the *Technical requirements* section of *Chapter 1, Introducing
    New PHP 8 OOP Features*, for more information on Docker and Docker Compose installation,
    as well as how to build the Docker container used to demonstrate the code explained
    in this book. In this book, we refer to the directory in which you stored the
    sample code for this book as `/repo`.


    The source code for this chapter is located here: https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices.
    We can now begin our discussion by having a look at the long-awaited JIT compiler.


    # Working with the JIT compiler


    PHP 8 introduces the long-awaited **JIT compiler**. This is an important step
    and has important ramifications for the long-term viability of the PHP language.
    Although PHP already had the ability to produce and cache **bytecode**, before
    the introduction of the JIT compiler, PHP did not have the ability to directly
    cache **machine code**.


    There have actually been several attempts to add JIT compiler capabilities to
    PHP, dating back to 2011. The performance boost seen in PHP 7 was a direct result
    of these early efforts. None of the earlier JIT compiler efforts were proposed
    as **RFCs (Requests for Comments)** as they didn''t significantly improve performance.
    The core team now feels that any further performance gains can now only be achieved
    using JIT. As a side benefit, this opens the possibility of PHP being used as
    a language for non-web environments. Another benefit is that the JIT compiler
    opens the possibility to develop PHP extensions in languages other than C.'
  merge: -1
  img_proc: true
- pgno: 389
  md: "It's extremely important to pay close attention to the details given in this\
    \ chapter as proper use of the new JIT compiler has the potential to greatly improve\
    \ the performance of your PHP applications. Before we get into implementation\
    \ details, it's first necessary to explain how PHP executes bytecode without the\
    \ JIT compiler. We'll then show you how the JIT compiler works. After this, you\
    \ will be in a better position to understand the various settings and how they\
    \ can be fine-tuned to produce the best possible performance for your application\
    \ code.\n\nLet's now turn our attention to how PHP works without the JIT compiler.\n\
    \n# Discovering how PHP works without JIT\n\nWhen PHP is installed on a server\
    \ (or in a Docker container), in addition to the core extensions, the main component\
    \ installed is actually a virtual machine (VM) often referred to as the Zend Engine.\
    \ This VM operates in a manner quite different from virtualization technologies\
    \ such as VMware or Docker. The Zend Engine is closer in nature to the Java Virtual\
    \ Machine (JVM) in that it accepts bytecode and produces machine code.\n\nThis\
    \ begs the question: what is bytecode and what is machine code? Let's have a look\
    \ at this question now.\n\n# Understanding bytecode and machine code\n\nMachine\
    \ code, or machine language, is a set of hardware instructions understood by the\
    \ CPU directly. Each piece of machine code is an instruction that causes the CPU\
    \ to perform a specific operation. These low-level operations include moving information\
    \ between registers, moving a given number of bytes in or out of memory, adding,\
    \ subtracting, and so forth.\n\nMachine code is often rendered somewhat human-readable\
    \ by using assembly language. Here is an example of machine code rendered in assembly\
    \ language:\n\n```\nJIT$Mandelbrot::iterate: ;\n    sub $0x10, %esp\n    cmp $0x1,\
    \ 0x1c(%esi)\n    jb .L14\n    jmp .L1\n.ENTRY1:\n    sub $0x10, %esp\n.L1:\n\
    \    cmp $0x2, 0x1c(%esi)\n```"
  merge: -1
  img_proc: true

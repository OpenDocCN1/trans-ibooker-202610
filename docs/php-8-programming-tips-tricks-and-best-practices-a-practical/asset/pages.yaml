    # Examining a sample I/O-intensive application


    For the sake of illustration, we have created a sample application written as
    a **REpresentational State Transfer (REST)** API, designed to run in PHP 8. The
    sample application presents a chat or instant messaging API with the following
    simple features:


    +   - Use a **HyperText Transfer Protocol (HTTP)** `POST` method to post a message
    either to a specific user or to all users. After a successful posting, the API
    returns the message just posted.

    +   - An HTTP `GET` method with a `from=username` parameter returns all messages
    to and from that username and messages to all users. If the `all=1` parameter
    is set, it returns a list of all usernames.

    +   - An HTTP `DELETE` method removes all messages from the `messages` table.


    Only parts of the application code are shown in this section. If you are interested
    in the entire `Chat` application, the source code is located under `/path/to/repo/src/Chat`.
    The primary API endpoint is provided here: `http://172.16.0.81/ch12/php8_chat_ajax.php`.'

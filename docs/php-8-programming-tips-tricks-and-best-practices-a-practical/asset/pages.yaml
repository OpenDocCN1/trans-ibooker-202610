- pgno: 25
  md: '# 1


    # Introducing New PHP 8 OOP Features


    In this chapter, you are introduced to new **PHP: Hypertext Preprocessor 8 (PHP
    8)** features specific to **Object-Oriented Programming (OOP)**. The chapter features
    a set of classes that can be used to generate CAPTCHA images (**CAPTCHA** is an
    acronym for **Completely Automated Public Turing test to tell Computers and Humans
    Apart**), clearly illustrating new PHP 8 features and concepts. This chapter is
    critical in helping you quickly incorporate new PHP 8 features into your own practice.
    In doing so, your code will run faster and more efficiently, with fewer bugs.


    The following topics are covered in this chapter:


    +   - Using constructor property promotion

    +   - Working with attributes

    +   - Incorporating match expressions into your program code

    +   - Understanding named arguments

    +   - Exploring new data types

    +   - Improving code using typed properties'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Technical requirements


    To examine and run the code examples provided in this chapter, the minimum recommended
    hardware is listed here:


    +   - x86_64-based desktop PC or laptop

    +   - 1 gigabyte (**GB**) free disk space

    +   - 4 GB of **random-access memory** (**RAM**)

    +   - 500 **kilobits per second** (**Kbps**) or faster internet connection


    In addition, you will need to install the following software:


    +   - Docker

    +   - Docker Compose


    This book uses a pre-built Docker image that contains all the needed software
    to create and run the PHP 8 code examples covered in this book. You do not need
    to install PHP, Apache, or MySQL on your computer: just use Docker and the provided
    image.


    To set up a test environment to run the code examples, proceed as follows:


    +   1. Install Docker.

    +      If you are running Windows, start here:

    +      `https://docs.docker.com/docker-for-windows/install/`

    +      If you are on a Mac, start here:

    +      `https://docs.docker.com/docker-for-mac/install/`

    +      If you are on Linux, have a look here:

    +      `https://docs.docker.com/engine/install/`

    +   2. Install Docker Compose. For all operating systems, start here:

    +      `https://docs.docker.com/compose/install/`

    +   3. Install the source code associated with this book onto your local computer.

    +      If you have installed Git, use the following command:


    ```

    git clone https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices.git
    ~/repo

    ```'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'Otherwise, you can simply download the source code from this Uniform Resource
    Locator (URL): https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices/archive/main.zip.
    You can then unzip into a folder you create, which we refer to as /repo in this
    book.


    4. You can now start the Docker daemon running. For Windows or Mac, all you need
    to do is to activate the Docker Desktop app.


    If you are running Ubuntu or Debian Linux, issue this command:


    ```

    sudo service docker start

    ```


    For Red Hat, Fedora, or CentOS, use this command:


    ```

    sudo systemctl start docker

    ```


    5. Build a Docker container associated with this book and bring it online. To
    do so, proceed as follows.


    From your local computer, open Command Prompt (terminal window). Change the directory
    to /repo. For the first time only, issue the docker-compose build command to build
    the environment. Note that you might need root (administrator) privileges to run
    Docker commands. If this is the case, either run as administrator (for Windows)
    or preface the command with sudo. Depending on your connection speed, the initial
    build might take quite a bit of time to complete!


    6. To bring the container up, proceed as follows


    7. From your local computer, open Command Prompt (terminal window). Change the
    directory to /repo. Bring the Docker container online in background mode by running
    the following command:


    ```

    docker-compose up -d

    ```


    Note that you actually don''t need to build the container separately. If the container
    is not built when you issue the docker-compose up command, it will be built automatically.
    On the other hand, it might be convenient to build the container separately, in
    which case docker build will suffice.


    Here''s a useful command to ensure all containers are running:


    ```

    docker-compose ps

    ```'

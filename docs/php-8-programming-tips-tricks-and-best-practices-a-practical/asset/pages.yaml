- pgno: 91
  md: "# Using array_slice()\n\nThe array_slice() function operates on arrays as much\
    \ as substr() does on strings. The big problem with earlier versions of PHP is\
    \ that internally, the PHP engine iterated through the entire array sequentially\
    \ until the desired offset was reached. If the offset is large, performance suffers\
    \ in direct correlation to the size of the array.\n\nIn PHP 8, a different algorithm\
    \ is used that does not require sequential array iteration. As the size of the\
    \ array increases, performance improvement becomes increasingly evident.\n\n1.\
    \ In the example shown here, we first build a massive array of approximately 6\
    \ million entries:\n\n```\n// /repo/ch02/php8_array_slice.php\nini_set('memory_limit',\
    \ '1G');\n$start = microtime(TRUE);\n$arr   = [];\n$alpha = range('A', 'Z');\n\
    $beta  = $alpha;\n$loops = 10000;      // size of outer array\n$iters = 500; \
    \       // total iterations\n$drip  = 10;         // output every $drip times\n\
    $cols  = 4;\nfor ($x = 0; $x < $loops; $x++)\n    foreach ($alpha as $left)\n\
    \        foreach ($beta as $right)\n            $arr[] = $left . $right . rand(111,999);\n\
    ```\n\n2. Next, we iterate through the array, taking random offsets all greater\
    \ than 999,999. This forces array_slice() to work hard, and shows a significant\
    \ performance difference between PHP 7 and 8, as illustrated in the following\
    \ code snippet:\n\n```\n$max = count($arr);\nfor ($x = 0; $x < $iters; $x++ )\
    \ {\n    $offset = rand(999999, $max);\n    $slice  = array_slice($arr, $offset,\
    \ 4);\n    // not all display logic is shown\n}\n$time = (microtime(TRUE) - $start);\n\
    echo \"\\nElapsed Time: $time seconds\\n\";\n```"
  merge: -1
  img_proc: true

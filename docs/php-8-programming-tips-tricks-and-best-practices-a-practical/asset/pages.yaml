  img_proc: true
- pgno: 84
  md: '# How does uniform variable syntax affect PHP 8?


    The uniform variable syntax initiative was extremely successful in all versions
    of PHP 7, and the transition was relatively smooth. There were a few areas not
    upgraded to this standard, however. Accordingly, a new proposal was introduced
    to address these holdouts. Uniformity has been introduced to the following in
    PHP 8:


    +   - De-referencing interpolated strings

    +   - Inconsistent de-referencing of magic constants

    +   - Consistency in class-constant dereferencing

    +   - Enhanced expression support for new and instanceof


    Before getting into examples of each of these areas, we must first define what
    is meant by *de-referencing*.


    # Defining de-referencing


    **De-referencing** is the process of extracting the value of an array element
    or object property. It also refers to the process of obtaining the return value
    for an object method or function call. Here''s a simple example:


    ```

    // /repo/ch02/php7_dereference_1.php

    $alpha = range(''A'',''Z'');

    echo $alpha[15] . $alpha[7] . $alpha[15];

    // output: PHP

    ```


    The $alpha alpha contains 26 elements representing the letters A through Z. This
    example de-references the array, extracting the 7th and 15th elements, producing
    an output of PHP. De-referencing a function or method call simply means executing
    the function or method and accessing the results.'
  merge: -1
  img_proc: true

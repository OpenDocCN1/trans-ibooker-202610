    Let''s now have a look at Reflection extension improvements.


    # Learning about Reflection extension improvements


    There have also been a number of improvements to the Reflection extension that
    might be important for you to know about. Please bear in mind that, although there
    are a limited number of developers who use the Reflection extension, you might
    one day find yourself in a situation where you are working with code that uses
    this extension. If you notice odd behavior after a PHP 8 upgrade, the material
    covered in this section gives you a head start in the troubleshooting process.


    # ReflectionType modifications


    The ReflectionType class is now abstract in PHP 8. When you use the ReflectionProperty::getType()
    or ReflectionFunction::getReturnType() methods, you might note that a ReflectionNamedType
    instance is returned. This change does not affect the normal functioning of your
    program code, unless you are relying upon a ReflectionType instance being returned.
    However, ReflectionNamedType extends ReflectionType, so any instanceof operations
    will not be affected.


    It’s also worth noting that the isBuiltIn() method has been moved from ReflectionType
    to ReflectionNamedType. Again, since ReflectionNamedType extends ReflectionType,
    this should not present any backward-compatible break in your current code.'

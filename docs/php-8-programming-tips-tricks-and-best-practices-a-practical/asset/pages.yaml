- pgno: 493
  md: 'The core of any ReactPHP application is the React\EventLoop\Loop class. As
    the name implies, a Loop instance starts up effectively as an infinite loop. Most
    PHP infinite loops spell disaster for your application! In this case, however,
    the loop is used with a server instance that continuously listens to requests
    on a given port.


    Another key component of ReactPHP is React\Socket\Server. This class opens a socket
    on the given port, enabling a ReactPHP application to listen for HTTP requests
    directly without having to involve a web server.


    Other features of ReactPHP include the ability to listen for UDP requests, a non-blocking
    cache, and the implementation of async promises. ReactPHP also features a Stream
    component that allows you to defer filesystem reads and writes, greatly speeding
    up performance because your application no longer has to wait for such file I/O
    requests to finish.


    One final advantage to using ReactPHP is that it''s fully compliant with PSR-7
    (HTTP messaging). We''ll now look at the example program that runs the Chat API
    described earlier, rewritten using ReactPHP. Here are the steps to rewrite the
    program:


    +   1. From Command Prompt into the Docker PHP 8 container, using Composer, we
    install the necessary ReactPHP components:

    +   2. We then rewrite /repo/ch12/php8_chat_swoole.php and rename it as /repo/ch12/php8_chat_react.php.
    The first thing we need to change are the use statements:


    ```

    cd /repo/ch12

    composer require --ignore-platform-reqs react/event-loop

    composer require --ignore-platform-reqs react/http

    composer require --ignore-platform-reqs react/socket

    ```


    ```

    // /repo/ch12/php8_chat_react.php

    include __DIR__ . ''/vendor/autoload.php'';

    use Chat\Message\Pipe;

    use React\EventLoop\Factory;

    use React\Http\Server;

    use React\Http\Message\Response as ReactResponse;

    use Psr\Http\Message\ServerRequestInterface;

    ```'

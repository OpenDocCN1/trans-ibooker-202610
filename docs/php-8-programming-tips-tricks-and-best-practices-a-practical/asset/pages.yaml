    \ rewritten as follows:\n> \n> `usort($array, fn($a, $b) => $a <=> $b).`\n\nYou\
    \ now have a greater understanding of what a stable sort is, and why it's important.\
    \ You also are able to spot potential problems due to differences in handling\
    \ between PHP 8 and earlier versions. We'll now have a look at other performance\
    \ improvements introduced in PHP 8.\n\n# Using weak references to improve efficiency\n\
    \nAs PHP continues to grow and mature, more and more developers are turning to\
    \ PHP frameworks to facilitate rapid application development. A necessary by-product\
    \ of this practice, however, is ever larger and more complex objects occupying\
    \ memory. Large objects that contain many properties, other objects, or sizeable\
    \ arrays are often referred to as **expensive objects.**\n\nCompounding the potential\
    \ memory issues caused by this trend is the fact that all PHP object assignments\
    \ are automatically made by reference. Without references, the use of third-party\
    \ frameworks would become cumbersome in the extreme. When you assign an object\
    \ by reference, however, the object must remain in memory, in its entirety, until\
    \ all references are destroyed. Only then, after unsetting or overwriting the\
    \ object, is it entirely destroyed."

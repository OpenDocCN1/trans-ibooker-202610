- pgno: 211
  md: "This is a very powerful addition to any developer's library. To do the same\
    \ thing with ArrayIterator, for example, would require at least a dozen lines\
    \ of code! Accordingly, PHP developers like to use this class for situations where\
    \ they need to navigate a list in either direction at will.\n\nUnfortunately,\
    \ there is a potential code break due to a difference in the return value of the\
    \ push() and unshift() methods. The push() method is used to add a value at the\
    \ end of the list. The unshift() method, on the other hand, adds value to the\
    \ beginning of the list.\n\nIn PHP 7 and below, these methods, if successful,\
    \ returned Boolean TRUE. If the method failed, it returned Boolean FALSE. In PHP\
    \ 8, however, neither method returns a value. If you look at the method signature\
    \ in the current documentation, you will see a return data type of void. The potential\
    \ code break can arise where you check to return a value of either push() or unshift()\
    \ before continuing.\n\nLet's have a look at a simple example that populates a\
    \ doubly linked list with a simple list of five values, and displays them in both\
    \ FIFO and LIFO order:\n\n+   1. First, we define an anonymous class that extends\
    \ SplDoublyLinkedList. We also add a show() method that displays the contents\
    \ of the list:\n\n```\n// /repo/ch05/php7_spl_spldoublylinkedlist.php\n$double\
    \ = new class() extends SplDoublyLinkedList {\n    public function show(int $mode)\
    \ {\n        $this->setIteratorMode($mode);\n        $this->rewind();\n      \
    \  while ($item = $this->current()) {\n            echo $item . '. ';\n      \
    \      $this->next();\n        }\n    }\n};\n```"
  merge: -1
  img_proc: true
- pgno: 212
  md: "2. Next, we define an array of sample data, and use push() to insert the value\
    \ into the linked list. Note that an if() statement is used to determine whether\
    \ the operation succeeds or fails. If the operation fails, an Exception is thrown:\n\
    \n```\n```php\n$item = ['Person', 'Woman', 'Man', 'Camera', 'TV'];\nforeach ($item\
    \ as $key => $value)\n    if (!$double->push($value))\n        throw new Exception('ERROR');\n\
    ```\n```\n\nThis is the block of code where the potential code break exists. In\
    \ PHP 7 and below, push() returns TRUE or FALSE. In PHP 8, there is no return\
    \ value.\n\n3. We then use the SplDoublyLinkedList class constants to set the\
    \ mode to FIFO (forward), and display the list:\n\n```\n```php\necho \"**************\
    \ Foward ****************\\n\";\n$forward = SplDoublyLinkedList::IT_MODE_FIFO\n\
    \          | SplDoublyLinkedList::IT_MODE_KEEP;\n$double->show($forward);\n```\n\
    ```\n\n4. Next, we use the SplDoublyLinkedList class constants to set the mode\
    \ to LIFO (reverse), and display the list:\n\n```\n```php\necho \"\\n\\n**************\
    \ Reverse ****************\\n\";\n$reverse = SplDoublyLinkedList::IT_MODE_LIFO\n\
    \          | SplDoublyLinkedList::IT_MODE_KEEP;\n$double->show($reverse);\n```\n\
    ```\n\nHere is the output running in PHP 7.1:\n\n```\n```\nroot@php8_tips_php7\
    \ [ /repo/ch05 ]#\nphp php7_spl_spldoublylinkedlist.php\n************** Foward\
    \ ****************\nPerson. Woman. Man. Camera. TV.\n************** Reverse ****************\n\
    TV. Camera. Man. Woman. Person.\n```\n```"
  merge: -1
  img_proc: true
- pgno: 213
  md: "5. If we run the same code in PHP 8, this is the result:\n\n```\nroot@php8_tips_php8\
    \ [ /home/ch05 ]#\nphp php7_spl_spldoublylinkedlist.php\nPHP Fatal error: Uncaught\
    \ Exception: ERROR in /home/\nch05/php7_spl_spldoublylinkedlist.php:23\n```\n\n\
    If no value is returned by push (), inside the if () statement PHP assumes NULL,\
    \ which in turn is interpolated as Boolean FALSE! Accordingly, after the first\
    \ push () command, the if () block causes an Exception to be thrown. Because the\
    \ Exception is not caught, a fatal Error is generated.\n\nTo rewrite this block\
    \ of code to work in PHP 8, all you need to do is to remove the if () statement,\
    \ and not throw an Exception. Here's how the rewritten code block (shown in Step\
    \ 2) might appear:\n\n```\n$item = ['Person', 'Woman', 'Man', 'Camera', 'TV'];\n\
    foreach ($item as $key => $value)\n    $double->push($value);\n```\n\nNow, if\
    \ we execute the rewritten code, the results are seen here:\n\n```\nroot@php8_tips_php7\
    \ [ /home/ch05 ]#\nphp php8_spl_spldoublylinkedlist.php\n**************** Foward\
    \ *****************\nPerson. Woman. Man. Camera. TV.\n**************** Reverse\
    \ *****************\nTV. Camera. Man. Woman. Person.\n```\n\nNow you have an idea\
    \ of how to use SplDoublyLinkedList, and also know about the potential code break\
    \ relating to push() or unshift(). You also have an idea about potential code\
    \ breaks when using various SPL classes and functions in PHP 8. This concludes\
    \ our discussion for this chapter."

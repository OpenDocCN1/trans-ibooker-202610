- pgno: 245
  md: 'Now that you are aware of the locale-independent aspects present in PHP 8,
    we need to have a look at changes in array handling.


    # Handling arrays in PHP 8


    Aside from improvements in performance, the two main changes in PHP 8 array handling
    pertain to the handling of negative offsets and curly brace ({ }) usage. Since
    both of these changes could result in application code breaks following a PHP
    8 migration, it''s important to cover them here. Awareness of the issues presented
    here gives you a better chance to get broken code working again in short order.


    Let''s have a look at negative array offset handling first.


    # Dealing with negative offsets


    When assigning a value to an array in PHP, if you do not specify an index, PHP
    will automatically assign one for you. The index chosen in this manner is an integer
    that represents a value one higher than the highest currently assigned integer
    key. If no integer index key has yet been assigned, the automatic index assignment
    algorithm starts at zero.


    In PHP 7 and below, however, this algorithm is not applied consistently in the
    case of a negative integer index. If a numeric array started with a negative number
    for its index, auto-indexing jumps to zero (0) regardless of what the next number
    would ordinarily be. In PHP 8, on the other hand, automatic indexing consistently
    increments by a value of +1 regardless of whether the index is a negative or positive
    integer.


    A possible backward-compatible code break is present if your code relies upon
    auto-indexing, and any of the starting indices are negative numbers. Detection
    of this issue is difficult as auto-indexing occurs silently, without any Warnings
    or Notices.


    The following code example illustrates the difference in behavior between PHP
    7 and PHP 8:


    +   1. First, we define an array with only negative integers as indexes. We use
    var_dump() to reveal this array:


    ```

    // /repo/ch06/php8_array_negative_index.php

    $a = [-3 => ''CCC'', -2 => ''BBB'', -1 => ''AAA''];

    var_dump($a);

    ```'
  merge: -1
  img_proc: true

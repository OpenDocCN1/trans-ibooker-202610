- pgno: 169
  md: "We can now begin our discussion by examining core OOP coding differences.\n\
    \n# Discovering core OOP coding differences\n\nThere are a number of significant\
    \ changes to how you are able to write OOP code in PHP 8. In this section, we\
    \ focus on three key areas that might present you with potential backward-compatibility\
    \ breaks. The areas we address in this section are common bad practices associated\
    \ with making static method calls, handling object properties, and PHP autoloading.\n\
    \nAfter reading this section, and working your way through the examples, you are\
    \ in in a better position to spot OOP bad practices and to learn how PHP 8 has\
    \ placed restrictions on such usage. In this chapter, you learn good coding practices,\
    \ which will ultimately make you a better programmer. You will also be able to\
    \ address changes in PHP autoloading that can potentially cause failure in an\
    \ application migrated to PHP 8.\n\nLet's first look at how PHP 8 has tightened\
    \ up on making static calls.\n\n# Handling static calls in PHP 8\n\nSurprisingly,\
    \ PHP versions 7 and below allowed developers to make a static call to a class\
    \ method not declared static. At first glance, any future developer reviewing\
    \ your code immediately assumes that the method has been defined as static. This\
    \ can lead to unexpected behavior as the future developer, operating under a false\
    \ assumption, starts to misuse your code.\n\nIn this simple example, we define\
    \ a Test class with a nonStatic() method. In the procedural code that follows\
    \ the class definition, we echo the return value of this method, however, in doing\
    \ so we make a static call:\n\n```\n// /repo/ch05/php8_oop_diff_static.php\nclass\
    \ Test {\n    public function notStatic() {\n        return __CLASS__ . PHP_EOL;\n\
    \    }\n}\necho Test::notStatic();\n```\n\nWhen we run this code in PHP 7, here\
    \ is the result:\n\n```\nroot@php8_tips_php7 [ /repo/ch05 ]#\nphp php8_oop_diff_static.php\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 170

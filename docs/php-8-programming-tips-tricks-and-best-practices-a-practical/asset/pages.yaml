- pgno: 413
  md: "# Examining the effect of stable sorting on keys\n\nThe concept of stable sorting\
    \ also affects key/value pairs when using asort (), uasort (), or the equivalent\
    \ ArrayIterator methods. In the example shown next, ArrayIterator is populated\
    \ with 20 elements, every other element being a duplicate. The key is a hexadecimal\
    \ number that increments sequentially:\n\n1. First, we define a function to produce\
    \ random 3-letter combinations:\n\n```\n// /repo/ch010/php8_sort_stable_keys.php\n\
    $randVal = function () {\n    $alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';\n    return\
    \ $alpha[rand(0,25)] . $alpha[rand(0,25)]\n        . $alpha[rand(0,25)];};\n```\n\
    \n2. Next, we load an ArrayIterator instance with sample data. Every other element\
    \ is a duplicate. We also capture the starting time:\n\n```\n$start = microtime(TRUE);\n\
    $max   = 20;\n$iter  = new ArrayIterator;\nfor ($x = 256; $x < $max + 256; $x\
    \ += 2) {\n    $key = sprintf('%04X', $x);\n    $iter->offsetSet($key, $randVal());\n\
    \    $key = sprintf('%04X', $x + 1);\n    $iter->offsetSet($key, 'AAA'); // <--\
    \ duplicate\n}\n```\n\n3. We then perform ArrayIterator::asort () and display\
    \ the resulting order along with the elapsed time:\n\n```\n// not all code is\
    \ shown\n$iter->asort();\nforeach ($iter as $key => $value) echo\n\"$key\\t$value\\\
    n\";\necho \"\\nElapsed Time: \" . (microtime(TRUE) - $start);\n```\n\nHere is\
    \ the result of this code example running in PHP 7:\n\n```\nroot@php8_tips_php7\
    \ [ /repo/ch10 ]#\nphp php8_sort_stable_keys.php\n0113    AAA\n```"

    }\n```\n```\n\n3. We then call the function three times, supplying array, ArrayObject,\
    \ and SplFixedArray respectively as arguments:\n\n```\n```php\nprintf(\"%14s :\
    \ %10s : %12s\\n\", '', 'Time', 'Memory');\n$result = testArr([], 'Array');\n\
    vprintf(PATTERN, $result);\n$result = testArr(new ArrayObject(), 'ArrayObject');\n\
    vprintf(PATTERN, $result);\n$result = testArr(\n    new SplFixedArray(MAX_SIZE),\
    \ 'SplFixedArray');\nvprintf(PATTERN, $result);\n```\n```\n\n4. Here are the results\
    \ from our PHP 7.1 Docker container:\n\n```\n```\nroot@php8_tips_php7 [ /repo/ch10\
    \ ]#\nphp php7_spl_fixed_arr_size.php\n                :      Time :       Memory\n\
    \        Array : 1.19430900 :  129,558,888\n    ArrayObject : 1.20231009 :  129,558,832\n\
    \  SplFixedArray : 1.19744802 :   96,000,280\n```\n```\n\n5. In PHP 8, the amount\
    \ of time taken is significantly less, as shown here:\n\n```\n```\nroot@php8_tips_php8\
    \ [ /repo/ch10 ]#\nphp php7_spl_fixed_arr_size.php\n                :      Time\
    \ :       Memory\n        Array : 0.13694692 :  129,558,888\n    ArrayObject :\
    \ 0.11058593 :  129,558,832\n  SplFixedArray : 0.09748793 :   96,000,280\n```\n\
    ```\n\nAs you can see from the results, PHP 8 handles arrays 10 times faster than\
    \ PHP 7.1. The amount of memory used is identical between the two versions. What\
    \ stands out, using either version of PHP, is that SplFixedArray uses significantly\
    \ less memory than either a standard array or ArrayObject. Let's now have a look\
    \ at how SplFixedArray usage has changed in PHP 8."

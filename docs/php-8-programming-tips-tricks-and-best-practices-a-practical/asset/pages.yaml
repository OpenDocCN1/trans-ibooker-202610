- pgno: 199
  md: "# Understanding PHP 8 expanded variance support\n\nThe concept of variance\
    \ is at the heart of OOP. **Variance** is an umbrella term that covers how the\
    \ various **subtypes** interrelate. Some 20 years ago, a pair of early computer\
    \ scientists, Wing and Liskov, devised an important theorem that is at the heart\
    \ of OOP subtypes, now known as **the Liskov Substitution Principle.**\n\nWithout\
    \ going into the precise mathematics, this principle can be paraphrased as follows:\n\
    \n> *Class X can be considered a subtype of class Y if you are able to substitute\
    \ an instance of X in place of an instance of Y, and the application's behavior\
    \ does not change in any way.*\n\n> **Tip**\n> \n> The actual paper that first\
    \ described and provided the precise mathematical formulaic definition of the\
    \ Liskov Substitution Principle can be found here: *A behavioral notion of subtyping*,\
    \ ACM Transactions on Programming Languages and Systems, by B. Liskov and J. Wing,\
    \ November 1994 (https://dl.acm.org/doi/10.1145/197320.197383).\n\nIn this section,\
    \ we examine how PHP 8 provides enhanced variance support in the form of **covariant\
    \ returns** and **contravariant parameters**. An understanding of covariance and\
    \ contravariance will increase your ability to write good solid code. Without\
    \ this understanding, your code might produce inconsistent results and become\
    \ the source of many bugs.\n\nLet's start by covering covariant returns.\n\n#\
    \ Understanding covariant returns\n\nCovariance support in PHP is designed to\
    \ preserve the ordering of types from the most specific to the most general. A\
    \ classic example of this is seen in how `try` / `catch` blocks are formulated:\n\
    \n+   1. In this example, a PDO instance is created inside the `try` block. The\
    \ following two `catch` blocks look first for a `PDOException`. Following this\
    \ is a second `catch` block that catches any class that implements `Throwable`.\
    \ Because both the PHP `Exception` and `Error` classes implement `Throwable`,\
    \ the second `catch` block ends up as a fallback for any error other than a `PDOException`:\n\
    \n```\n```php\ntry {\n    $pdo = new PDO($dsn, $usr, $pwd, $opts);\n```\n```"
  merge: -1
  img_proc: true
- pgno: 200
  md: "```\n} catch (PDOException $p) {\n    error_log('Database Error: ' . $p->getMessage());\n\
    } catch (Throwable $t) {\n    error_log('Unknown Error: ' . $t->getMessage());\n\
    }\n```\n\n2. In this example, if a PDO instance fails due to invalid parameters,\
    \ the error log would have the entry **Database Error** followed by a message\
    \ gleamed from the PDOException.\n\n3. On the other hand, if some other general\
    \ error occurred, the error log would have the entry **Unknown Error** followed\
    \ by the message coming from some other Exception or Error class.\n\n4. In this\
    \ example, however, the order of the catch blocks is reversed:\n\n```\ntry {\n\
    \    $pdo = new PDO($dsn, $usr, $pwd, $opts);\n} catch (Throwable $t) {\n    error_log('Unknown\
    \ Error: ' . $t->getMessage());\n} catch (PDOException $p) {\n    error_log('Database\
    \ Error: ' . $p->getMessage());\n}\n```\n\n5. Due to the way PHP covariance support\
    \ works, the second catch block would never be invoked. Instead, all error log\
    \ entries originating from this block of code would have an entry starting with\
    \ **Unknown Error**.\n\nLet's now have a look at how PHP covariance support applies\
    \ to object method return data types:\n\n1. First, we define an interface, FactoryIterface,\
    \ that identifies a method, make(). This method accepts an array as an argument\
    \ and is expected to return an object of type ArrayObject:\n\n```\ninterface FactoryInterface\
    \ {\n    public function make(array $arr): ArrayObject;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 201
  md: "2. Next, we define an ArrTest class that extends ArrayObject:\n\n```\nclass\
    \ ArrTest extends ArrayObject {\n    const DEFAULT_TEST = 'This is a test';\n\
    }\n```\n\n3. The ArrFactory class implements FactoryInterface and fully defines\
    \ the make() method. Note, however, that this method returns the ArrTest data\
    \ type and not ArrayObject:\n\n```\nclass ArrFactory implements FactoryInterface\
    \ {\n    protected array $data;\n    public function make(array $data): ArrTest\
    \ {\n        $this->data = $data;\n        return new ArrTest($this->data);\n\
    \    }\n}\n```\n\n4. In the block of procedural calling code, we create an instance\
    \ of ArrFactory, and run its make() method twice, theoretically producing two\
    \ ArrTest instances. We then use var_dump() to reveal the current state of the\
    \ two objects produced:\n\n```\n$factory = new ArrFactory();\n$obj1 = $factory->make([1,2,3]);\n\
    $obj2 = $factory->make(['A','B','C']);\nvar_dump($obj1, $obj2);\n```\n\n5. In\
    \ PHP 7.1, as it does not support covariant return data types, a fatal Error is\
    \ thrown. The output, shown here, tells us that the method return type declaration\
    \ doesn't match what's been defined in FactoryInterface:\n\n```\nroot@php8_tips_php7\
    \ [/repo/ch05 ]#\nphp php8_variance_covariant.php\nPHP Fatal error:  Declaration\
    \ of ArrFactory::make(array $data): ArrTest must be compatible with\nFactoryInterface::make(array\
    \ $arr): ArrayObject in /repo/\nch05/php8_variance_covariant.php on line 9\n```"
  merge: -1
  img_proc: true
- pgno: 202
  md: "+   6. When we run the same code in PHP 8, you can see that covariance support\
    \ is provided for return types. Execution proceeds unhindered, as shown here:\n\
    \n```\nroot@php8_tips_php8 [ /repo/ch05 ]#\nphp php8_variance_covariant.php\n\
    object(ArrTest)#2 (1) {\n  [\"storage\":\"ArrayObject\":private]=>\n  array(3)\
    \ {\n    [0]=>  int(1)\n    [1]=>  int(2)\n    [2]=>  int(3)\n  }\n}\nobject(ArrTest)#3\
    \ (1) {\n  [\"storage\":\"ArrayObject\":private]=>\n  array(3) {\n    [0]=>  string(1)\
    \ \"A\"\n    [1]=>  string(1) \"B\"\n    [2]=>  string(1) \"C\"\n  }\n}\n```\n\
    \nArrTest extends ArrayObject and is a suitable subtype that clearly meets the\
    \ criteria defined by the Liskov Substitution Principle. As you can see from the\
    \ last output, PHP 8 more fully embraces true OOP principles than the earlier\
    \ versions of PHP. The end result is that your code and application architecture\
    \ can be much more intuitive and logically reasonable when using PHP 8.\n\nLet's\
    \ now have a look at contravariant parameters.\n\n# Using contravariant parameters\n\
    \nWhereas covariance concerns the ordering of subtypes from general to specific,\
    \ **contravariance** concerns the reverse: from specific to general. In PHP 7\
    \ and earlier, full support for contravariance was not available. Accordingly,\
    \ implementing an interface or extending an abstract class, in PHP 7, parameter\
    \ type hints are **invariant**."
  merge: -1
  img_proc: true
- pgno: 203
  md: "In PHP 8, on the other hand, due to support for contravariant parameters, you\
    \ are free to be specific in top-level super classes and interfaces. As long as\
    \ the subtype is compatible, you can then modify the type hint in the extending\
    \ or implementing class to be more general.\n\nThis gives you much more freedom\
    \ in defining an overall architecture where you define interfaces or abstract\
    \ classes. Developers using your interfaces or super classes are given a great\
    \ deal more flexibility in PHP 8 when it comes to implementing descendent class\
    \ logic.\n\nLet's have a look at how PHP 8 support for contravariant parameters\
    \ works:\n\n+   1. In this example, we first define a IterObj class that extends\
    \ the built-in ArrayIterator PHP class:\n+   2. We then define an abstract Base\
    \ class that mandates a method, stringify(). Note that the data type for its only\
    \ argument is IterObj:\n+   3. Next, we define a IterTest class that extends Base\
    \ and provides an implementation for the stringify() method. Of particular interest\
    \ is that we override the data type, changing it to iterable:\n\n```\n```php\n\
    // /repo/ch05/php8_variance_contravariant.php\nclass IterObj extends ArrayIterator\
    \ {}\n```\n```\n\n```\n```php\nabstract class Base {\n    public abstract function\
    \ stringify(IterObj $it);\n}\n```\n```\n\n```\n```php\nclass IterTest extends\
    \ Base {\n    public function stringify(iterable $it) {\n        return implode(',',\n\
    \            iterator_to_array($it)) . \"\\n\";\n    }\n}\nclass IterObj extends\
    \ ArrayIterator {}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 204
  md: '4. The next few lines of code create instances of IterTest, IterObj, and ArrayIterator.
    We then invoke the stringify() method twice, supplying each of the latter objects
    as an argument:


    ```

    $test = new IterTest();

    $objIt = new IterObj([1,2,3]);

    $arrIt = new ArrayIterator([''A'',''B'',''C'']);

    echo $test->stringify($objIt);

    echo $test->stringify($arrIt);

    ```


    5. Running this code example in PHP 7.1 produces the expected fatal Error as shown
    here:


    ```

    root@php8_tips_php7 [ /repo/ch05 ]#

    php php8_variance_contravariant.php

    PHP Fatal error: Declaration of

    IterTest::stringify(iterable $it) must be compatible with

    Base::stringify(IterObj $it) in /repo/ch05/php8_variance_contravariant.php on
    line 11

    ```


    Because PHP 7.1 does not provide support for contravariant parameters, it treats
    the data type for its parameters as invariant, and simply displays a message indicating
    that the data type of the child class is incompatible with the data type specified
    in the parent class.


    6. PHP 8, on the other hand, provides support for contravariant parameters. Accordingly,
    it recognizes that IterObj, the data type specified in the Base class, is a subtype
    compatible with iterable. Further, both arguments provided are compatible with
    iterable as well, allowing program execution to proceed. Here is the PHP 8 output:


    ```

    root@php8_tips_php8 [ /repo/ch05 ]# php php8_variance_contravariant.php

    1,2,3

    A,B,C

    ```


    The main advantage you derive from PHP 8 support for covariant returns and contravariant
    parameters is the ability to override not only method logic but the method signature
    as well. You will find that although PHP 8 is much stricter in its enforcement
    of good coding practices, the enhanced variance support gives you greater freedom
    in designing your inheritance structure. In a certain sense, at least with regards
    to parameter and return value data types, PHP 8 is, if anything, less restrictive!'

- pgno: 235
  md: 'From a human perspective, none of these results make any sense! From the computer''s
    perspective, on the other hand, it makes perfect sense. The string ABC, when converted
    to a number, ends up with a value of zero. Likewise, when the array search is
    made, each array element, having only a string value, ends up being interpolated
    as zero.


    The case of the leading-numeric string is a bit trickier. In PHP 7, the interpolation
    algorithm converts numeric characters until the first non-numeric character is
    encountered. Once that happens, the interpolation stops. Accordingly, the string
    42abc88 becomes an integer, 42, for comparison purposes. Now let''s have a look
    at how PHP 8 handles string-to-numeric comparisons.


    # Understanding comparison changes made in PHP 8


    In PHP 8, if a string is compared with a number, only numeric strings are considered
    valid for comparison. Strings in exponential notation are also considered valid
    for comparison, as well as numeric strings with leading or trailing whitespace.
    It''s extremely important to note that PHP 8 makes this determination before converting
    the string.


    Have a look at the output of the same code example described in the previous subsection
    (Dealing with inconsistent string-to-numeric comparison results), running in PHP
    8:


    ```

    root@php8_tips_php8 [ /repo/ch06 ]#

    php php7_compare_num_str.php

    The value 0 is not the same as ABC

    The value 0 is not in

    array (1 => ''A'', 2 => ''B'', 3 => ''C'')

    The value 42abc88 is not the same as 42

    ```


    So, as you can see from the output, there is a massive potential for your application
    to change its behavior following a PHP 8 upgrade. As a final note in PHP 8 string
    handling, let''s look at how you can avoid upgrade issues.


    # Avoiding problems during a PHP 8 upgrade


    The main issue you face is the difference in how PHP 8 handles non-strict comparisons
    that involve operands with different data types. If one operand is either int
    or float, and the other operand is string, you have a potential problem post-upgrade.
    If the string is a valid numeric string, the non-strict comparison will proceed
    without any issues.'
  merge: -1
  img_proc: true

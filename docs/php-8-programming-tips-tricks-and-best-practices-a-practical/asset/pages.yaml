    \ be used as a random key:\n\n```\n```\nroot@php8_tips_php8 [/repo/ch04 ]# php\
    \ php8_ffi_cdef.php\n23f306d51227432e7d8d921763b7eedf\n```\n```\n\nIn the output,\
    \ you see a string of concatenated random integers converted to hexadecimal. Note\
    \ that the resulting value changes each time the script is invoked.\n\n**Tip**\n\
    For true randomization, it might be better to just use the random_int() native\
    \ PHP function. There are also excellent key-generation functions that form part\
    \ of the openssl extension. The example shown here is primarily designed to familiarize\
    \ you with FFI extension usage.\n\n**Important note**\nThe FFI extension also\
    \ includes two additional creational methods:\nFFI::load() and FFI::scope(). FFI::load()\
    \ is used to directly load C-function definitions from a C header (*.h) file during\
    \ the preloading process. FFI::scope() makes the preloaded C functions available\
    \ for use via the FFI extension. For more information on preloading, have a look\
    \ at a complete preloading example in the FFI documentation here: https://www.php.net/manual/en/ffi.examples-complete.php.\n\
    \nLet's now have a look at FFI extension functions used for comparison between\

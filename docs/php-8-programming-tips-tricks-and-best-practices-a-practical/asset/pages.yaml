  md: "# Using FFI in an application\n\nAny shared C library (generally with a *.so\
    \ extension) can be included in a PHP application using the FFI extension. If\
    \ you plan to work with any of the core PHP libraries or libraries produced when\
    \ PHP extensions are installed, it's important to note that you have the ability\
    \ to modify the behavior of the PHP language itself.\n\nBefore we examine how\
    \ that works, let's first have a look at incorporating an external C library into\
    \ a PHP script using the FFI extension.\n\n# Integrating an external C library\
    \ into a PHP script\n\nFor the purposes of illustration, we use a simple function\
    \ that might have originated from a Computer Science 101 (CS101) class: the famous\
    \ bubble sort. This algorithm is widely used in beginner's computer science classes\
    \ because it's easy to follow.\n\n> **Important note**\n> The **bubble sort**\
    \ is an extremely inefficient sort algorithm and has long been superseded by faster\
    \ sorting algorithms such as the **shell sort**, **quick sort**, or **merge sort**\
    \ algorithms. Although there is no authoritative reference for the bubble-sort\
    \ algorithm, you can read a good general discussion of it here: https://en.wikipedia.org/wiki/Bubble_sort.\n\
    \nIn this subsection, we do not go through details of the algorithm. Rather, the\
    \ purpose of this subsection is to demonstrate how to take an existing C library\
    \ and incorporate one of its functions into a PHP script. We now show you the\
    \ original C source code, how to convert it into a shared library, and—finally—how\
    \ to incorporate the library into PHP using FFI. Here's what we'll do:\n\n+  \
    \ 1. The first step, of course, is to compile the C code into object code. Here\
    \ is the bubble-sort C code used for this example:\n\n```\n```c\n#include <stdio.h>\n\
    void bubble_sort(int [], int);\nvoid bubble_sort(int list[], int n) {\n    int\
    \ c, d, t, p;\n    for (c = 0 ; c < n - 1; c++) {\n        p = 0;\n        for\
    \ (d = 0 ; d < n - c - 1; d++) {\n            if (list[d] > list[d+1]) {\n   \
    \             t = list[d];\n```\n```"

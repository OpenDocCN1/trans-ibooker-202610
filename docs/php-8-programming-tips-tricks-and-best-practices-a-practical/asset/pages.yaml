- pgno: 373
  md: "As a developer, having a complete mastery of the use of traits enables you\
    \ to write code that is both more efficient and easier to maintain. Traits can\
    \ help you avoid producing redundant code. They solve the problem of needing the\
    \ same logic available across namespaces, or across different class inheritance\
    \ structures. The information presented in this section enables you to make proper\
    \ use of traits in code running under PHP 8.\n\nFirst, let's examine how conflicts\
    \ between traits are resolved in PHP 8.\n\n# Resolving method conflicts between\
    \ traits\n\nMultiple traits can be used by simply listing the trait names separated\
    \ by commas. A potential problem can arise, however, if two traits define the\
    \ same method. To resolve such conflicts, PHP offers the as keyword. In PHP 7\
    \ and below, to avoid a conflict between two methods of the same name, you could\
    \ simply rename one of the methods. The code to perform the renaming might appear\
    \ as follows:\n\n```\nuse Trait1, Trait2 { <METHOD> as <NEW_NAME>; }\n```\n\n\
    The problem with this approach, however, is that PHP is making a silent assumption:\
    \ METHOD is assumed to come from Trait1! In its continuing efforts to enforce\
    \ good coding practices, PHP 8 no longer allows this assumption. The solution\
    \ in PHP 8 is to be more specific by using insteadof rather than as.\n\nHere is\
    \ a trivial example that illustrates this problem:\n\n+   1. First, let's define\
    \ two traits that define the same method, test(), but return a different result:\n\
    \n```\n// /repo/ch09/php7_trait_conflict_as.php\ntrait Test1 {\n    public function\
    \ test() {\n        return '111111';\n    }\n}\ntrait Test2 {\n    public function\
    \ test() {\n        return '222222';\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 374
  md: "2. Then, define an anonymous class that uses both traits and specifies test()\
    \ as otherTest() to avoid a naming collision:\n\n```\n$main = new class () {\n\
    \    use Test1, Test2 { test as otherTest; }\n    public function test() { return\
    \ 'TEST'; }\n};\n```\n\n3. Next, define a block of code to echo the return value\
    \ of both methods:\n\n```\necho $main->test() . \"\\n\";\necho $main->otherTest()\
    \ . \"\\n\";\n```\n\nHere is the output in PHP 7:\n\n```\nroot@php8_tips_php7\
    \ [ /repo/ch09 ]#\nphp php7_trait_conflict_as.php\nTEST\n111111\n```\n\nAs you\
    \ can see, PHP 7 silently assumes that we mean to rename Trait1::test() as otherTest().\
    \ From the example code, however, it's not at all clear that this is the programmer's\
    \ intention!\n\nRunning the same code example in PHP 8, we get a different result:\n\
    \n```\nroot@php8_tips_php8 [ /repo/ch09 ]#\nphp php7_trait_conflict_as.php\nPHP\
    \ Fatal error:  An alias was defined for method test(), which exists in both Test1\
    \ and Test2. Use Test1::test or Test2::test to resolve the ambiguity in /repo/ch09/php7_trait_conflict_as.php\
    \ on line 6\n```\n\nClearly, PHP 8 does not make such silent assumptions as they\
    \ can easily lead to unexpected behavior. In this example, the best practice would\
    \ be to use the scope resolution (::) operator. Here is the rewritten code:\n\n\
    ```\n$main = new class () {\n    use Test1, Test2 { Test1::test as otherTest;\
    \ }\n    public function test() { return 'TEST'; }\n};\n```"
  merge: -1
  img_proc: true
- pgno: 375
  md: "If we were to rerun the code in PHP 8, the output would be the same as the\
    \ output shown for PHP 7. The scope resolution operator affirms that Trait1 is\
    \ the source trait for the test() method, thus avoiding any ambiguity. Now, let's\
    \ have a look at how PHP 8 traits handle abstract method signatures.\n\n# Working\
    \ with trait abstract signature checking\n\nAs API developers are well aware,\
    \ marking a method as abstract is how you can signal to API users that a method\
    \ is mandatory, but has yet to be defined. This technique allows the API developer\
    \ to dictate not only the method name, but its signature as well.\n\nIn PHP 7\
    \ and below, however, abstract methods defined in a trait ignored the signature,\
    \ defeating part of the purpose of using an abstract method in the first place!\
    \ When you use a trait with an abstract method in PHP 8, its signature is checked\
    \ against the implementation in the class using the trait.\n\nThe following example\
    \ works in PHP 7 but fails in PHP 8 as the method signature is different:\n\n\
    +   1. First, let's declare strict type checking and define a trait with an abstract\
    \ method; that is, add(). Note the method signature calls for integer data types\
    \ all around:\n+   2. Next, define an anonymous class that uses the trait and\
    \ defines add(). Note that the data types for the class are float all around:\n\
    +   3. Then, echo the results of adding 111.111 and 222.222:\n\n```\n```php\n\
    // /repo/ch09/php7_trait_abstract_signature.php\ndeclare(strict_types=1);\ntrait\
    \ Test1 {\n    public abstract function add(int $a, int $b) : int;\n}\n```\n```\n\
    \n```\n```php\n$main = new class () {\n    use Test1;\n    public function add(float\
    \ $a, float $b) : float {\n        return $a + $b;\n    }\n};\n```\n```\n\n```\n\
    ```php\necho $main->add(111.111, 222.222) . \"\\n\";\n```\n```"
  merge: -1
  img_proc: true
- pgno: 376
  md: "The results of this small code example running in PHP 7 are surprising:\n\n\
    ```\nroot@php8_tips_php7 [ /repo/ch09 ]#\nphp php7_trait_abstract_signature.php\n\
    333.333\n```\n\nAs you can see from the results, the method signature of the abstract\
    \ definition in the trait is completely ignored! In PHP 8, however, the outcome\
    \ is much different. Here is the code's output running in PHP 8:\n\n```\nroot@php8_tips_php8\
    \ [ /repo/ch09 ]#\nphp php7_trait_abstract_signature.php\nPHP Fatal error: Declaration\
    \ of class@anonymous::add(float $a, float $b): float must be compatible with Test1::add(int\
    \ $a, int $b): int in /repo/ch09/php7_trait_abstract_signature.php on line 9\n\
    ```\n\nThe preceding PHP 8 output shows us that good coding practices are enforced,\
    \ regardless of the source of the abstract method definition.\n\nThe last topic\
    \ in this section will show you how to handle abstract private methods in traits.\n\
    \n# Handling private abstract methods in traits\n\nGenerally, in PHP, you can't\
    \ enforce control over an abstract private method in an abstract super class as\
    \ it will not be inherited. In PHP 8, however, you can define an abstract private\
    \ method in a trait! This can be used as a use-of-code enforcement mechanism when\
    \ you're doing API development where the using class is required to define a specified\
    \ private method.\n\nPlease note that although you can designate an abstract method\
    \ as private in a PHP 8 trait, trait method visibility can easily be overridden\
    \ in the class that uses the trait. Accordingly, we will not show any code examples\
    \ in this section as the effect of a private abstract trait method is exactly\
    \ the same as using an abstract trait method at other visibility levels.\n\n>\
    \ **Tip**\n> \n> For more information on trait abstract method handling in PHP\
    \ 8, have a look at this RFC: https://wiki.php.net/rfc/abstract_trait_method_validation."
  merge: -1
  img_proc: true
- pgno: 377
  md: "Now, let's have a look at general usage changes in private methods.\n\n# Dealing\
    \ with private methods\n\nOne of the reasons why developers create a super class\
    \ is to exert a certain degree of control over the method signatures of subclasses.\
    \ During the parsing phase, PHP normally confirms that the method signatures match.\
    \ This leads to proper use of your code by other developers.\n\nIn the same vein,\
    \ it does not make sense to have PHP perform the same rigorous method signature\
    \ check if a method is marked as private. The purpose of a private method is that\
    \ it is invisible to the extending class. If you define a method of the same name\
    \ in the extending class, you should be free to define it at will.\n\nTo illustrate\
    \ this problem, let's define a class called Cipher with a private method called\
    \ encrypt (). The OpenCipher subclass redefines this method, causing a fatal error\
    \ when running under PHP 7:\n\n+   1. First, let's define a Cipher class whose\
    \ constructor generates random values for $key and $salt. It also defines a public\
    \ method called encode () that makes a call to the private encrypt () method:\n\
    \n```\n```php\n// /repo/src/Php7/Encrypt/Cipher.php\nnamespace Php7\\Encrypt;\n\
    class Cipher {\n    public $key = '';\n    public $salt = 0;\n    public function\
    \ __construct() {\n        $this->salt = rand(1,255);\n        $this->key = bin2hex(random_bytes(8));\n\
    \    }\n    public function encode(string $plain) {\n        return $this->encrypt($plain);\n\
    \    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 378
  md: "2. Next, let's define a private method called encrypt() that produces encrypted\
    \ text using str_rot13(). Note that the method is marked as final. Although this\
    \ does not make any sense, for the purposes of this illustration, assume that\
    \ this is intended:\n\n```\nfinal private function encrypt(string $plain) {\n\
    \    return base64_encode(str_rot13($plain));\n}\n}\n```\n\n3. Finally, let's\
    \ define a brief calling program that creates class instances and calls the methods\
    \ that have been defined:\n\n```\n// /repo/ch09/php7_oop_diffs_private_method.php\n\
    include __DIR__ . '/../src/Server/Autoload/Loader.php';\n$loader = new \\Server\\\
    Autoload\\Loader();\nuse Php7\\Encrypt\\{Cipher,OpenCipher};\n$text = 'Super secret\
    \ message';\n$cipher1 = new Cipher();\necho $cipher1->encode($text) . \"\\n\"\
    ;\n$cipher2 = new OpenCipher();\nvar_dump($cipher2->encode($text));\n```\n\nIf\
    \ we run the calling program in PHP 7, we'll get the following output:\n\n```\n\
    oot@php8_tips_php7 [ /repo/ch09 ]#\nphp php7_oop_diffs_private_method.php\nRmhjcmUgZnJwZKJnIHpyZmZudHI=\n\
    PHP Fatal error: Cannot override final method Php7\\Encrypt\\\nCipher::encrypt()\
    \ in /repo/src/Php7/Encrypt/OpenCipher.php on\nline 21\n```\n\nHere, you can see\
    \ that the output from Cipher was correctly produced. However, a fatal Error has\
    \ been thrown, along with a message stating that we are unable to override a final\
    \ method. Theoretically, a private method should be completely invisible to the\
    \ subclass. However, as you can clearly see from the output, this is not the case.\
    \ The method signature of a private method of the Cipher superclass affects our\
    \ ability to redefine the same method in the subclass."
  merge: -1
  img_proc: true

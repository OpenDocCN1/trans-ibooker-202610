    \ also use the error_get_last() function. Here is a rewritten example that works\
    \ in both PHP 7 and PHP 8 (output not shown):\n\n```\n// /repo/ch08/php8_track_errors.php\n\
    try {\n    strpos();\n    echo error_get_last()['message'];\n    echo \"\\nOK\\\
    n\";\n} catch (Error $e) {\n    echo $e->getMessage() . \"\\n\";\n}\n```\n\nYou\
    \ now have an idea about PHP functionality that has been deprecated or removed\
    \ in PHP 8. That concludes this chapter.\n\n# Summary\n\nIn this chapter, you\

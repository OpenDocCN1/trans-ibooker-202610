    PHP Deprecated:  Non-static method Test::notStatic() should not be called statically
    in /repo/ch05/php8_oop_diff_static.php on line 11

    Test

    ```


    As you can see from the output, PHP 7 issues a deprecation notice, but allows
    the call to be made! In PHP 8, however, the result is a fatal Error, as shown
    here:


    ```

    root@php8_tips_php8 [ /repo/ch05 ]#

    php php8_oop_diff_static.php

    PHP Fatal error:  Uncaught Error: Non-static method

    Test::notStatic() cannot be called statically in /repo/ch05/

    php8_oop_diff_static.php:11

    ```


    Calling a non-static method using static method call syntax is a bad practice
    in the sense that well-written code makes the intention of the code developer
    crystal clear. If you do not define a method as static, but later call it in a
    static sense, a developer assigned to maintain your code in the future might become
    confused and could make wrong assumptions about the original intent of the code.
    The end result will be even more bad code!


    In PHP 8, you can no longer call a non-static method using a static method call.
    Let''s now have a look at another bad practice involving treating object properties
    as keys.


    # Dealing with object property handling changes


    Arrays have been a central feature in PHP all the way back to the earliest versions.
    OOP, on the other hand, was not introduced until PHP 4. In the early days of OOP,
    array functions were often expanded to accommodate object properties. This led
    to a blurring of the distinction between an object and an array, which in turn
    spawned a number of bad practices.


    In order to maintain a clear separation between array handling and object handling,
    PHP 8 now restricts the array_key_exists() function to only accept an array as
    an argument. To illustrate this, consider the following example:


    +   1. First, we define a simple anonymous class with a single property:


    ```

    // /repo/ch05/php8_oop_diff_array_key_exists.php

    $obj = new class () { public $var = ''OK.''; };

    ```'

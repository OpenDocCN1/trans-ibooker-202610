- pgno: 144
  md: "# Creating and using FFI instances\n\nAs mentioned in the chapter introduction,\
    \ the FFI extension facilitates rapid prototyping. Accordingly, using the FFI\
    \ extension, you can develop the C functions designed to go into your new extension\
    \ one at a time, and test them right away inside a PHP application.\n\n> **Important\
    \ note**\n> The FFI extension does not compile C code. In order to use a C function\
    \ with the FFI extension, you must first compile the C code into a shared library\
    \ using a C compiler. You will learn how to do this in the last section in this\
    \ chapter, *Using FFI in an application.*\n\nIn order to bridge between PHP and\
    \ a native C-library function call, you need to create a FFI instance. The FFI\
    \ extension needs you to supply a C definition that defines the C function signature\
    \ and the C library that you plan to use. Both FFI::cdef() and FFI::scope() can\
    \ be used to directly create FFI instances.\n\nThe following example uses FFI::cdef()\
    \ to bind two native C-library functions. This is what happens:\n\n+   1. The\
    \ first native method, srand(), is used to seed a randomization sequence. rand(),\
    \ the other native C function, calls the next number in the sequence. The $key\
    \ variable holds the final product of the randomization. $size represents the\
    \ number of random numbers to call. The code is illustrated in the following snippet:\n\
    +   \n+   2. We then create the FFI instance by invoking cdef() and identifying\
    \ the native C functions in a string $code, taken out of the libc.so.6 native\
    \ C library, as follows:\n\n```\n// /repo/ch04/php8_ffi_cdef.php\n$key = '';\n\
    $size = 4;\n```\n\n```\n$code = <<<EOT\n    void srand (unsigned int seed);\n\
    \    int rand (void);\nEOT;\n$ffi = FFI::cdef($code, 'libc.so.6');\n```"
  merge: -1
  img_proc: true
- pgno: 145
  md: "3. We then seed the randomization by calling srand(). Then, in a loop, we invoke\
    \ the rand() native C library function to produce a random number. We use the\
    \ sprintf() native PHP function to convert the resulting integer to hex, the output\
    \ of which is appended to $key, which is echoed. The code can be seen here:\n\n\
    ```\n```php\n$ffi->srand(random_int(0, 999));\nfor ($x = 0; $x < $size; $x++)\n\
    \    $key .= sprintf('%x', $ffi->rand());\necho $key\n```\n```\n\nAnd here is\

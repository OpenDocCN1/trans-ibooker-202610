- pgno: 29
  md: "# Using constructor property promotion\n\nAside from the Just-In-Time (JIT)\
    \ compiler, one of the greatest new features introduced in PHP 8 is constructor\
    \ property promotion. This new feature combines property declarations and argument\
    \ lists in the __construct() method signature, as well as assigning defaults.\
    \ In this section, you will learn how to substantially reduce the amount of coding\
    \ required in property declarations as well as in the __construct() method signature\
    \ and body.\n\n# Property promotion syntax\n\nThe syntax needed to invoke constructor\
    \ property promotion is identical to that used in PHP 7 and earlier, with the\
    \ following differences:\n\n+   - You need to define a visibility level\n+   -\
    \ You do not have to explicitly declare the properties in advance\n+   - You do\
    \ not need to make assignments in the body of the __construct() method\n\nHere\
    \ is a bare-bones example of code that uses constructor property promotion:\n\n\
    ```\n```php\n// /repo/ch01/php8_prop_promo.php\ndeclare(strict_types=1);\nclass\
    \ Test {\n    public function __construct(\n        public int $id,\n        public\
    \ int $token = 0,\n        public string $name = '')\n    { }\n}\n$test = new\
    \ Test(999);\nvar_dump($test);\n```\n```\n\nWhen the preceding code block is executed,\
    \ this is the output:\n\n```\n```\nobject(Test)#1 (3) {\n  [\"id\"]=> int(999)\n\
    \  [\"token\"]=> int(0)\n  [\"name\"]=> string(0) \"\"\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 30
  md: "This shows that an instance of Test type has been created using default values.\
    \ Now, let's have a look at how this feature might save a substantial amount of\
    \ coding.\n\n# Using property promotion for code reduction\n\nIn a conventional\
    \ OOP PHP class, the following three things need to be done:\n\n+   1. Declare\
    \ the properties, as follows:\n+   2. Identify the properties and their data type\
    \ in the __construct() method signature, as follows:\n\n```\n/repo/src/Php8/Image/SingleChar.php\n\
    namespace Php7\\Image;\nclass SingleChar {\n    public $text      = '';\n    public\
    \ $fontFile = '';\n    public $width     = 100;\n    public $height    = 100;\n\
    \    public $size      = 0;\n    public $angle     = 0.00;\n    public $textX\
    \     = 0;\n    public $textY     = 0;\n```\n\n```\nconst DEFAULT_TX_X = 25;\n\
    const DEFAULT_TX_Y = 75;\nconst DEFAULT_TX_SIZE  = 60;\nconst DEFAULT_TX_ANGLE\
    \ = 0;\npublic function __construct(\n    string $text,\n    string $fontFile,\n\
    \    int $width  = 100,\n    int $height = 100,\n    int $size   = self::DEFAULT_TX_SIZE,\n\
    \    float $angle = self::DEFAULT_TX_ANGLE,\n    int $textX  = self::DEFAULT_TX_X,\n\
    \    int $textY  = self::DEFAULT_TX_Y)\n```"
  merge: -1
  img_proc: true
- pgno: 31
  md: "3. In the body of the __construct() method, assign values to properties, like\
    \ this:\n\n```\n{\n    $this->text     = $text;\n    $this->fontFile = $fontFile;\n\
    \    $this->width    = $width;\n    $this->height   = $height;\n    $this->size\
    \     = $size;\n    $this->angle    = $angle;\n    $this->textX    = $textX;\n\
    \    $this->textY    = $textY;\n    // other code not shown\n}\n```\n\nAs the\
    \ number of constructor arguments increases, the amount of work you need to do\
    \ also increases significantly. When constructor property promotion is applied,\
    \ the amount of code required to do the same as previously shown is reduced to\
    \ one-third of the original.\n\nLet's now have a look at the same block of code\
    \ as shown previously, but rewritten using this powerful new PHP 8 feature:\n\n\
    ```\n// /repo/src/Php8/Image/SingleChar.php\n// not all code shown\npublic function\
    \ __construct(\n    public string $text,\n    public string $fontFile,\n    public\
    \ int    $width  = 100,\n    public int    $height = 100,\n    public int    $size\
    \   = self::DEFAULT_TX_SIZE,\n    public float  $angle  = self::DEFAULT_TX_ANGLE,\n\
    \    public int    $textX  = self::DEFAULT_TX_X,\n    public int    $textY  =\
    \ self::DEFAULT_TX_Y)\n{ // other code not shown }\n```\n\nAmazingly, what took\
    \ 24 lines of code in PHP 7 and earlier can be collapsed into eight lines of code\
    \ using this new PHP 8 feature!\n\nYou are completely free to include other code\
    \ in the constructor. In many cases, however, constructor property promotion takes\
    \ care of everything normally done in the __construct() method, which means you\
    \ can literally leave it empty ({ })."
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Now, in the next section, you learn about a new feature called attributes.


    > **Tip**

    > Have a look at the full SingleChar class for PHP 7 here:

    > https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices/tree/main/src/Php7/Image

    > Also, the equivalent PHP 8 class is found here:

    > https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices/tree/main/src/Php8/Image

    > For more information on this new feature, have a look at the following:

    > https://wiki.php.net/rfc/constructor_promotion


    # Working with attributes


    Another significant addition to PHP 8 is the addition of a brand-new class and
    language construct known as **attributes**. Simply put, attributes are replacements
    for traditional PHP comment blocks that follow a prescribed syntax. When the PHP
    code is compiled, these attributes are converted internally into Attribute class
    instances.


    This new feature is not going to have an immediate impact on your code today.
    It will start to become more and more influential, however, as the various PHP
    open source vendors start to incorporate attributes into their code.


    The Attribute class addresses a potentially significant performance issue we discuss
    in this section, pertaining to an abuse of the traditional PHP comment block to
    provide meta-instructions. Before we dive into that issue and how Attribute class
    instances address the problem, we first must review PHP comments.


    # Overview of PHP comments


    The need for this form of language construct arose with the increasing use (and
    abuse!) of the plain workhorse PHP comment. As you are aware, comments come in
    many forms, including all of the following:


    ```

    # This is a "bash" shell script style comment

    // this can either be inline or on its own line

    /* This is the traditional "C" language style */

    ```'
  merge: -1
  img_proc: true
- pgno: 33
  md: "```\n```\n/**\n * This is a PHP \"DocBlock\"\n */\n```\n```\n\nThe last item,\
    \ the famous PHP DocBlock, is now so widely used it's become a de facto standard.\
    \ The use of DocBlocks is not a bad thing. On the contrary—it's often the only\
    \ way a developer is able to communicate information about properties, classes,\
    \ and methods. The problem only arises in how it is treated by the PHP interpretation\
    \ process.\n\n# PHP DocBlock considerations\n\nThe original intent of the PHP\
    \ DocBlock has been stretched by a number of extremely important PHP open-source\
    \ projects. One striking example is the Doctrine Object-Relational Mapper (ORM)\
    \ project. Although not mandatory, many developers choose to define ORM properties\
    \ using annotations nested inside PHP DocBlocks.\n\nHave a look at this partial\
    \ code example, which defines a class interacting with a database table called\
    \ events:\n\n```\n```\nnamespace Php7\\Entity;\nuse Doctrine\\ORM\\Mapping as\
    \ ORM;\n/**\n * @ORM\\Table(name=\"events\")\n * @ORM\\Entity(\"Application\\\
    Entity\\Events\")\n */\nclass Events {\n    /**\n     * @ORM\\Column(name=\"id\"\
    ,type=\"integer\",nullable=false)\n     * @ORM\\Id\n     * @ORM\\GeneratedValue(strategy=\"\
    IDENTITY\")\n     */\n    private $id;\n    /**\n     * @ORM\\Column(name=\"event_key\"\
    , type=\"string\",\n         length=16, nullable=true, options={\"fixed\"=true})\n\
    \     */\n    private $eventKey;\n    // other code not shown\n```\n```"
  merge: -1
  img_proc: true
- pgno: 34
  md: 'If you were to use this class as part of a Doctrine ORM implementation, Doctrine
    would open the file and parse the DocBlocks, searching for @ORM annotations. Despite
    some concerns over the time and resources needed to parse DocBlocks, this is an
    extremely convenient way to define the relationship between object properties
    and database table columns, and is popular with developers who use Doctrine.


    > **Tip**

    > Doctrine offers a number of alternatives to this form of ORM, including **Extensible
    Markup Language (XML)** and native PHP arrays. For more information, see https://www.doctrine-project.org/projects/doctrine-orm/en/latest/reference/annotations-reference.html#annotations-reference.


    # Hidden dangers associated with the misuse of DocBlocks


    There is yet another danger associated with this abuse of the original purpose
    of a DocBlock. In the php.ini file, there is a setting named opcache.save_comments.
    If disabled, this would cause the OpCode cache engine (OPcache) to ignore all
    comments, including DocBlocks. If this setting is in effect, a Doctrine-based
    application using @ORM annotations in DocBlocks would malfunction.


    Another problem has to do with how comments are parsed—or, more to the point,
    how comments are not parsed. In order to use the contents of a comment, the PHP
    application needs to open the file and parse it line by line. This is an expensive
    process in terms of time and resource utilization.


    # The Attribute class


    In order to address hidden dangers, in PHP 8 a new Attribute class is provided.
    Instead of using DocBlocks with annotations, developers can define the equivalent
    in the form of attributes. An advantage of using attributes rather than DocBlocks
    is that they are a formal part of the language and are thus tokenized and compiled
    along with the rest of your code.'
  merge: -1
  img_proc: true
- pgno: 35
  md: "> **Important note**\n> In this chapter, and also in the PHP documentation,\
    \ reference to *attributes* refers to instances of the `Attribute` class.\n> \n\
    > Actual performance metrics are not yet available that compare the loading of\
    \ PHP code containing DocBlocks with the loading of code that contains attributes.\n\
    \nAlthough the benefits of this approach are not yet seen, as the various open\
    \ source project vendors start to incorporate attributes into their offerings\
    \ you will start to see an improvement in speed and performance.\n\nHere is the\
    \ Attribute class definition:\n\n```\nclass Attribute {\n    public const int\
    \ TARGET_CLASS = 1;\n    public const int TARGET_FUNCTION = (1 << 1);\n    public\
    \ const int TARGET_METHOD = (1 << 2);\n    public const int TARGET_PROPERTY =\
    \ (1 << 3);\n    public const int TARGET_CLASS_CONSTANT = (1 << 4);\n    public\
    \ const int TARGET_PARAMETER = (1 << 5);\n    public const int TARGET_ALL = ((1\
    \ << 6) - 1);\n    public function __construct(\n        int $flags = self::TARGET_ALL)\
    \ {}\n}\n```\n\nAs you can see from the class definition, the main contribution\
    \ from this class, used internally by PHP 8, is a set of class constants. The\
    \ constants represent bit flags that can be combined using bitwise operators.\n\
    \n# Attribute syntax\n\nAttributes are enclosed using a special syntax borrowed\
    \ from the Rust programming language. What goes inside the square brackets is\
    \ pretty much left to the developer. An example can be seen in the following snippet:\n\
    \n```\n#[attribute(\"some text\")]\n// class, property, method or function (or\
    \ whatever!)\n```"
  merge: -1
  img_proc: true
- pgno: 36
  md: "Returning to our example of the SingleChar class, here's how it might appear\
    \ using traditional DocBlocks:\n\n```\n```php\n// /repo/src/Php7/Image/SingleChar.php\n\
    namespace Php7\\Image;\n/**\n * Creates a single image, by default black on white\n\
    \ */\nclass SingleChar {\n    /**\n     * Allocates a color resource\n     *\n\
    \     * @param array|int $r,\n     * @param int $g\n     * @param int $b]\n  \
    \   * @return int $color\n     */\n    public function colorAlloc()\n    { /*\
    \ code not shown */ }\n}\n```\n```\n\nNow, have a look at the same thing using\
    \ attributes:\n\n```\n```php\n// /repo/src/Php8/Image/SingleChar.php\nnamespace\
    \ Php8\\Image;\n#[description(\"Creates a single image\")]\nclass SingleChar {\n\
    \    #[SingleChar\\colorAlloc\\description(\"Allocates color\")]\n    #[SingleChar\\\
    colorAlloc\\param(\"r\",\"int|array\")]\n    #[SingleChar\\colorAlloc\\param(\"\
    g\",\"int\")]\n    #[SingleChar\\colorAlloc\\param(\"b\",\"int\")]\n    #[SingleChar\\\
    colorAlloc\\returns(\"int\")]\n    public function colorAlloc() { /* code not\
    \ shown */ }\n}\n```\n```\n\nAs you can see, in addition to providing a more robust\
    \ compilation and avoiding the hidden dangers mentioned, it's also more efficient\
    \ in terms of space usage."
  merge: -1
  img_proc: true
- pgno: 37
  md: "> Tip\n> \n> What goes inside the square brackets does have some restrictions;\
    \ for example, although #[returns(\"int\")] is allowed, this is not:\n> #[return(\"\
    int\")]. The reason for this is because return is a keyword.\n> \n> Another example\
    \ has to do with union types (explained in the Exploring new data types section).\
    \ You can use #[param(\"int|array test\")] in an attribute, but this is not allowed:\
    \ #[int|array(\"test\")]. Another peculiarity is that class-level attributes must\
    \ be placed immediately before the class keyword and after any use statements.\n\
    \n# Viewing attributes using Reflection\n\nIf you need to get attribute information\
    \ from a PHP 8 class, the Reflection extension has been updated to include attribute\
    \ support. A new getAttributes() method that returns an array of ReflectionAttribute\
    \ instances has been added.\n\nIn the following block of code, all the attributes\
    \ from the Php8\\Image\\SingleChar::colorAlloc() method are revealed:\n\n```\n\
    <?php\n// /repo/ch01/php8_attrib_reflect.php\ndefine('FONT_FILE', __DIR__ . '../../fonts/FreeSansBold.ttf');\n\
    require_once __DIR__ . '../../src/Server/Autoload/Loader.php';\n$loader = new\
    \ \\Server\\Autoload\\Loader();\nuse Php8\\Image\\SingleChar;\n$char    = new\
    \ SingleChar('A', FONT_FILE);\n$reflect = new ReflectionObject($char);\n$attribs\
    \ = $reflect->getAttributes();\necho \"Class Attributes\\n\";\nforeach ($attribs\
    \ as $obj) {\n    echo \"\\n\" . $obj->getName() . \"\\n\";\n    echo implode(\"\
    \\t\", $obj->getArguments());\n}\necho \"Method Attributes for colorAlloc()\\\
    n\";\n$reflect = new ReflectionMethod($char, 'colorAlloc');\n```"
  merge: -1
  img_proc: true
- pgno: 38
  md: "```\n$attribs = $reflect->getAttributes();\nforeach ($attribs as $obj) {\n\
    \    echo \"\\n\" . $obj->getName() . \"\\n\";\n    echo implode(\"\\t\", $obj->getArguments());\n\
    }\n```\n\nHere is the output from the code shown in the preceding snippet:\n\n\
    ```\n<pre>Class Attributes\n\nPhp8\\Image\\SingleChar\nPhp8\\Image\\description\n\
    Creates a single image, by default black on whiteMethod\nAttributes for colorAlloc()\n\
    Php8\\Image\\SingleChar\\colorAlloc\\description\nAllocates a color resource\n\
    Php8\\Image\\SingleChar\\colorAlloc\\param\nr      int|array\nPhp8\\Image\\SingleChar\\\
    colorAlloc\\param\ng      int\nPhp8\\Image\\SingleChar\\colorAlloc\\param\nb \
    \     int\nPhp8\\Image\\SingleChar\\colorAlloc\\returns\nint\n```\n\nThe preceding\
    \ output shows that attributes can be detected using the Reflection extension\
    \ classes. Finally, the actual method is shown in this code example:\n\n```\n\
    namespace Php8\\Image;use Attribute;\nuse Php8\\Image\\Strategy\\ {PlainText,PlainFill};\n\
    #[SingleChar]\n#[description(\"Creates black on white image\")]\nclass SingleChar\
    \ {\n    // not all code is shown\n    #[SingleChar\\colorAlloc\\description(\"\
    Allocates color\")]\n    #[SingleChar\\colorAlloc\\param(\"r\",\"int|array\")]\n\
    \    #[SingleChar\\colorAlloc\\param(\"g\",\"int\")]\n```"
  merge: -1
  img_proc: true
- pgno: 39
  md: "```\n#[SingleChar\\colorAlloc\\param(\"b\",\"int\")]\n#[SingleChar\\colorAlloc\\\
    returns(\"int\")]\npublic function colorAlloc(\n    int|array $r, int $g = 0,\
    \ int $b = 0) {\n    if (is_array($r))\n        [$r, $g, $b] = $r;\n    return\
    \ \\imagecolorallocate(\n        $this->image, $r, $g, $b);\n}\n}\n```\n\nNow\
    \ that you have an idea of how attributes can be used, let's continue our coverage\
    \ of new features by discussing match expressions, followed by named arguments.\n\
    \n> **Tip**\n> \n> For more information on this new feature, have a look at the\
    \ following web page:\n> https://wiki.php.net/rfc/attributes_v2\n> \n> Also, see\
    \ this update:\n> https://wiki.php.net/rfc/shorter_attribute_syntax_change\n>\
    \ \n> Information on PHP DocBlocks can be found here:\n> https://phpdoc.org/\n\
    > \n> For more information about Doctrine ORM, have a look here:\n> https://www.doctrine-project.org/projects/orm.html\n\
    > \n> Documentation on php.ini file settings can be found here:\n> https://www.php.net/manual/en/ini.list.php\n\
    > \n> Read about PHP Reflection here:\n> https://www.php.net/manual/en/language.attributes.reflection.php\n\
    > \n> Information about the Rust programming language can be found in this book:\n\
    > https://www.packtpub.com/product/mastering-rust-second-edition/9781789346572"

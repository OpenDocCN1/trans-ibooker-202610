  md: "In the following code example, two functions are defined. The bad() function\
    \ deliberately triggers an error. The worse() function includes a file in which\
    \ there is a parse error. Note that when the functions are called, the @ symbol\
    \ precedes the function name, causing the error output to be suppressed:\n\n```\n\
    ```php\n// /repo/ch03/php8_at_silencer.php\nfunction bad() {\n    trigger_error(__FUNCTION__,\
    \ E_USER_ERROR);\n}\nfunction worse() {\n    return include __DIR__ .  '/includes/\n\
    \        causes_parse_error.php';\n}\necho @bad();\necho @worse();\necho \"\\\
    nLast Line\\n\";\n```\n```\n\nIn PHP 7, there's simply no output at all, as shown\
    \ here:\n\n```\n```bash\nroot@php8_tips_php7 [ /repo/ch03 ]# php php8_at_silencer.php\n\
    root@php8_tips_php7 [ /repo/ch03 ]#\n```\n```\n\nWhat's interesting to note is\
    \ that the program is actually not allowed to continue in PHP 7: we never saw\
    \ the Last Line output. This is because, although masked, a fatal error was nonetheless\
    \ generated, causing the program to fail. In PHP 8, however, the fatal error is\
    \ not masked, as seen here:\n\n```\n```bash\nroot@php8_tips_php8 [ /repo/ch03\
    \ ]# php8 php8_at_silencer.php\nPHP Fatal error:  bad in /repo/ch03/php8_at_silencer.php\
    \ on\nline 5\n```\n```\n\nLet's now have a look at another difference in PHP 8\
    \ regarding the @ operator.\n\n# @ operator and error_reporting()\n\nThe error_reporting()\
    \ function is normally used to override the error_reporting directive set in the\
    \ php.ini file. Another use of this function, however, is to return the latest\
    \ error code. However, an odd exception was present in versions of PHP prior to\
    \ PHP 8, in that error_reporting() returned a value of 0 if the @ operator was\
    \ used."

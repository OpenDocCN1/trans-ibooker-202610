- pgno: 297
  md: "# Reviewing changes to the ZIP extension\n\nThe ZIP extension is used to programmatically\
    \ create and manage compressed archive files, leveraging the libzip operating\
    \ system library. Other compression extensions exist, such as Zlib, bzip2, LZF,\
    \ PHP Archive Format (phar), and Roshal Archive Compressed (RAR); however, none\
    \ of the other extensions offers the rich range of functionality offered by the\
    \ ZIP extension. Also, for the most part, the other extensions are special-purpose\
    \ and are generally unsuitable for generic ZIP file management.\n\nLet's first\
    \ have a look at the most notable change to this extension.\n\n# Dealing with\
    \ ZIP extension OOP migration\n\nThe biggest change to the ZIP extension is one\
    \ that presents a potentially massive backward-compatible code break down the\
    \ road. As of PHP 8, the procedural API (all procedural functions) has been deprecated!\
    \ Although this does not affect any code at present, all ZIP extension functions\
    \ will eventually be removed from the language.\n\nThe best practice is to migrate\
    \ any ZIP extension procedural code over to the OOP API using the ZipArchive class.\
    \ The following code example illustrates how to migrate from procedural code to\
    \ object code, opening a test.zip file and producing a list of entries:\n\n```\n\
    ```php\n// /repo/ch07/php7_zip_functions.php\n$fn = __DIR__ . '/includes/test.zip';\n\
    $zip = zip_open($fn);\n$cnt = 0;\nif (!is_resource($zip)) exit('Unable to open\
    \ zip file');\nwhile ($entry = zip_read($zip)) {\n    echo zip_entry_name($entry)\
    \ . \"\\n\";\n    $cnt++;\n}\necho \"Total Entries: $cnt\\n\";\n```\n```\n\nHere\
    \ is the output running in PHP 7:\n\n```\n```\nroot@php8_tips_php7 [ /repo/ch07\
    \ ]#\nphp php7_zip_functions.php\nch07/includes/\nch07/includes/test.zip\nch07/includes/tree.xml\n\
    ch07/includes/test.png\n```\n```"
  merge: -1

  md: '# Summary


    In this chapter, you learned how the term *environment* is used rather than *server*
    because many websites these days use virtualized services. You then learned about
    three distinct environments used during the deployment phase: development, staging,
    and production.


    An automated tool that is able to scan your application code for potential code
    breaks was introduced next. As you learned in that section, a break-scanning application
    might consist of a configuration file that addresses removed functionality, changes
    to method signatures, functions that no longer produce resources, and a set of
    callbacks for complex usage detection, a scanning class, and a calling program
    that gathers filenames.


    Next, you were shown a typical twelve-step PHP 8 migration procedure that ensures
    a greater chance of success when you are finally ready to upgrade the production
    environment. Each step is designed to spot potential code breaks, with fallback
    procedures in case something goes wrong. You also learned how to install PHP 8
    on two common platforms as well as how to easily revert to the older version.
    Finally, you learned about a number of free open source tools that can assist
    in testing and troubleshooting.


    All in all, after carefully reading this chapter and studying the examples, you
    are now in a position to not only use existing testing and troubleshooting tools,
    but now have an idea of how to develop your own scanning tool that greatly reduces
    the risk of a potential code break after a PHP 8 migration. You also now have
    an excellent idea what is involved in a migration to PHP 8, and can carry out
    smoother transitions without fear of failure. Your new ability to anticipate and
    fix migration problems will ease any anxiety you might otherwise have experienced.
    You can also look forward to having happy and satisfied customers.


    The next chapter introduces you to new and exciting trends in PHP programming
    that can improve performance even further.'

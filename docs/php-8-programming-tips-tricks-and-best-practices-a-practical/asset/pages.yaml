- pgno: 184
  md: "8. In PHP 8, the __destruct() method is not called in either case, resulting\
    \ in the output shown here. As you can see in the output, the PDOException is\
    \ caught, and the die() command is issued. There is no output from the __destruct()\
    \ method. The PHP 8 output is shown here:\n\n```\nroot@php8_tips_php8 [ /repo/ch05\
    \ ]#\nphp php8_bc_break_destruct.php\n15 : PDOException : SQLSTATE[28000] [1045]\
    \ Access denied for user 'fake'@'localhost' (using password: YES)\nPHP Warning:\
    \  mysqli_connect(): (HY000/1045): Access denied for user 'fake'@'localhost' (using\
    \ password: YES) in /repo/src/Php7/Connector/ConnectMysqli.php on line 8\nUnable\
    \ to Connect\n```\n\nNow that you have an idea how to spot a potential code break\
    \ with regards to the __destruct() method along with a call to either die() or\
    \ exit(), let's turn our attention to changes to the __toString() method.\n\n\
    # Working with changes to __toString()\n\nThe __toString() magic method is invoked\
    \ when an object is used as a string. A classic example is when you simply echo\
    \ an object. The echo command expects a string as an argument. When non-string\
    \ data is provided, PHP performs type juggling to convert the data to string.\
    \ As an object cannot be readily converted to string, the PHP engine then looks\
    \ to see if __toString() is defined, and if so, returns its value.\n\nThe major\
    \ change in this magic method is the introduction of Stringable, a brand new interface.\
    \ The new interface is defined as follows:\n\n```\ninterface Stringable {\n  \
    \  public function __toString(): string;\n}\n```\n\nAny class running in PHP 8\
    \ that defines the __toString() magic method silently implements the Stringable\
    \ interface. This new behavior doesn't present any serious potential for a code\
    \ break. However, since the class now implements the Stringable interface, you\
    \ are no longer allowed to modify the __toString() method signature."

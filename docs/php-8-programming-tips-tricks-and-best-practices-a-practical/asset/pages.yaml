- pgno: 268
  md: 'This doesn''t mean that the enhanced classes no longer support the abilities
    inherent in the `Traversable` interface. Quite the contrary: `IteratorAggregate`
    extends `Traversable`! This enhancement means that you can now call `getIterator()`
    on an instance of any of the affected classes. This is potentially of immense
    benefit as prior to PHP 8, there was no way to access the inner iterator used
    in the various extensions. The following table summarizes the extensions and classes
    affected by this enhancement:


    | Extension | Implements IteratorAggregate |

    |---|---|

    | Date | DatePeriod |

    | DOM | DOMNamedNodeMap and DOMNodeList |

    | Intl | IntlBreakIterator and ResourceBundle |

    | MySQLi | mysqli_result |

    | PDO_MySQL | PDOStatement |

    | SPL | SplFixedArray |


    Table 7.2 – Classes that now implement IteratorAggregate instead of Traversable


    In this section, you were introduced to a significant change introduced in PHP
    8: the trend toward using objects rather than resources. One of the advantages
    you learned is that objects allow you greater control as compared to resources.
    Another advantage covered in this section is that the movement in PHP 8 toward
    `IteratorAggregate` allows access to built-in iterators that were previously inaccessible.


    We now turn our attention to changes to XML-based extensions.


    # Learning about changes to XML extensions


    XML version 1.0 was introduced as a **World Wide Web Consortium (W3C)** specification
    in 1998. XML bears some resemblance to **HyperText Markup Language (HTML)**; however,
    the main purpose of XML is to provide a way to format data that''s readable to
    both machines and humans. One of the reasons why XML is still widely used is because
    it''s easily understandable and does a stellar job at representing tree-structured
    data.


    PHP provides a number of extensions that allow you to both consume and produce
    XML documents. There have been a few changes introduced to many of these extensions
    in PHP 8. For the most part, these changes are minor; however, it''s important
    to be aware of these changes if you wish to be a well-rounded and informed PHP
    developer.


    Let''s first have a look at changes to the `XMLWriter` extension.'

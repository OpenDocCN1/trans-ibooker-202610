- pgno: 254
  md: "# Dealing with changes to password_hash()\n\nOver the years, so many developers\
    \ had misused crypt() that the PHP core team decided to add a wrapper function,\
    \ password_hash(). This proved to be a smashing success and is now one of the\
    \ most widely used security functions. Here is the function signature for password_hash():\n\
    \n```\npassword_hash(string $password, mixed $algo, array $options=?)\n```\n\n\
    Algorithms currently supported include bcrypt, Argon2i, and Argon2id. It's recommended\
    \ that you use the predefined constants for algorithms: PASSWORD_BCRYPT, PASSWORD_ARGON2I,\
    \ and PASSWORD_ARGON2ID. The PASSWORD_DEFAULT algorithm is currently set to bcrypt.\
    \ Options vary according to the algorithm. If you use either PASSWORD_BCRYPT or\
    \ the PASSWORD_DEFAULT algorithms, the options include cost and salt.\n\nConventional\
    \ wisdom suggests that it's better to use the randomly generated salt created\
    \ by the password_hash() function. In PHP 7, the salt option was deprecated and\
    \ is now ignored in PHP 8. This won't cause a backward-compatible break unless\
    \ you're relying on salt for some other reason.\n\nIn this code example, a non-random\
    \ salt value is used:\n\n```\n// /repo/ch06/php8_password_hash.php\n$salt = 'xxxxxxxxxxxxxxxxxxxxxxxx';\n\
    $password = 'password';\n$hash = password_hash(\n    $password, PASSWORD_DEFAULT,\
    \ ['salt' => $salt]);\necho $hash . \"\\n\";\nvar_dump(password_get_info($hash));\n\
    ```\n\nIn the PHP 7 output, a deprecation Notice is issued:\n\n```\nroot@php8_tips_php7\
    \ [ /repo/ch06 ]# php php8_password_hash.php\nPHP Deprecated: password_hash():\
    \ Use of the 'salt' option to password_hash is deprecated in /repo/ch06/php8_password_hash.php\
    \ on line 6\n$2y$10$xxxxxxxxxxxxxxxxxxxxxxu0d9YtxiLKHM/198x//sqUV1V2XTZEZ.\n/repo/ch06/php8_password_hash.php:8:\n\
    array(3) {\n  'algo' => int(1)\n```"
  merge: -1

    We next examine the track_errors php.ini directive.


    # Examining the track_errors php.ini setting


    As of PHP 8, the track_errors php.ini directive has been removed. This means that
    the $php_errormsg automatically created variable is no longer available. For the
    most part, anything that caused an error prior to PHP 8 has now been converted
    to throw an Error message instead. However, for versions of PHP prior to PHP 8,
    you can still use the error_get_last() function instead.


    In the following simple code example, we first set the track_errors directive
    on. We then call strpos() without any arguments, deliberately causing an error.
    We then rely on $php_errormsg to reveal the true error:


    ```

    // /repo/ch08/php7_track_errors.php

    ini_set(''track_errors'', 1);

    @strpos();

    echo $php_errormsg . "\n";

    echo "OK\n";

    ```'

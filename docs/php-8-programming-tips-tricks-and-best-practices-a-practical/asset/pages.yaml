- pgno: 496
  md: "4. In the configuration file for your Mezzio application, you would need to\
    \ add the following key:\n\n```\nreturn [\n    'mezzio-swoole' => [\n        'swoole-http-server'\
    \ => [\n            'host' => '0.0.0.0',    // all IP addresses\n            'port'\
    \ => 9501,\n        ],\n    ],\n];\n```\n\nTo gain further performance improvements,\
    \ you should of course also rewrite the appropriate portions of your code to take\
    \ advantage of PHP async functionality. Next, we have a look at a PHP extension\
    \ that goes beyond async.\n\n# Working with the parallel extension\n\nThe parallel\
    \ extension (https://www.php.net/parallel) was introduced to work with PHP 7.2\
    \ and above. Its purpose is to go the next step beyond PHP async and into the\
    \ world of full-blown parallel processing. The parallel extension provides five\
    \ key low-level classes that can form the basis for a parallel-processing application.\
    \ Using this extension allows PHP developers to write parallel code much like\
    \ the Go language. Let's start with parallel\\Runtime.\n\n# The parallel\\Runtime\
    \ class\n\nEach parallel\\Runtime instance spawns a new PHP thread. You can then\
    \ use parallel\\Runtime::run() to schedule a task. The first argument to run()\
    \ is Closure (an anonymous function). The optional second argument is $argv, representing\
    \ input arguments passed to the task at runtime. parallel\\Runtime::close() is\
    \ used to gracefully shut down a thread. When an error condition arises, a thread\
    \ can be immediately exited using parallel\\Runtime::kill()."
  merge: -1
  img_proc: true
- pgno: 497
  md: '# The parallel\Future class


    A `parallel\Future` instance is created as a return value from `parallel\Runtime::run()`.
    It acts much like a PHP async *promise* (described earlier in this chapter). This
    class has three methods, listed here, that perform the following actions:


    +   - `parallel\Future::value()`

    +     Returns the fulfilled value of the task

    +   - `parallel\Future::cancel()`

    +     Cancels the task that represents a promise *failed* state

    +   - `parallel\Future::cancelled() | done()`

    +     Returns task state if it''s still unfulfilled


    # The parallel\Channel class


    The `parallel\Channel` class allows developers to share information between tasks.
    Use the `__construct()` method or `make()` to create a channel. If no argument
    is supplied to `__construct()` or if a second argument to `make()` is not supplied,
    the channel is considered unbuffered. If an integer is supplied to `__construct()`
    or as a second argument to `make()`, the value represents the channel''s **capacity**.
    You can then use the `parallel\Channel::send()` and `parallel\Channel::recv()`
    methods to send and receive data through the channel.


    Unbuffered channels block calls to `send()` until there is a receiver and vice
    versa. Buffered channels, on the other hand, do not block until the capacity has
    been reached.


    # The parallel\Events class


    The `parallel\Events` class is similar to the *event loop* described in the first
    section of this chapter. This class has `addChannel()` and `addFuture()` methods
    to add channels and/or future instances to monitor. The `setBlocking()` method
    allows the event loop to monitor events in either blocking or non-blocking modes.
    Use the `setTimeout()` method to set an overall control period (in milliseconds)
    for how long the loop is allowed to continue. Finally, the `poll()` method causes
    the event loop to poll for the next event.'
  merge: -1
  img_proc: true
- pgno: 498
  md: "# Installing the parallel extension\n\nThe parallel extension can be installed\
    \ with the pecl command or using precompiled binaries, just as any other non-standard\
    \ PHP extension. It's extremely important to note, however, that this extension\
    \ only works on Zend Thread Safety (ZTS) PHP installations. Accordingly, if using\
    \ Docker, you would need to obtain a PHP ZTS image, or, if custom-compiling PHP,\
    \ you would need to use either the --enable-zts (Windows) or --enable-maintainer-zts\
    \ (non-Windows) configure utility flag.\n\nNow that you have an idea of how to\
    \ use a number of selected PHP extensions and frameworks in async mode, we'll\
    \ look into the future and discuss PHP 8.1 fibers.\n\n# Learning about PHP 8.1\
    \ fibers\n\nA Request for Comments (RFC) was published in March 2021 by Aaron\
    \ Piotrowski and Niklas Keller, both PHP core team developers, outlining the case\
    \ for including support for fibers in the PHP language core. The RFC was ratified\
    \ at the end of the month and has now been implemented in the upcoming 8.1 version\
    \ of PHP.\n\nThe fiber implementation is low-level, meaning that it is mainly\
    \ designed to be used as part of a PHP async framework such as ReactPHP or Amp,\
    \ or an extension such as the Swoole extension. Because this will, as of PHP 8.1\
    \ and beyond, be a core part of the language, developers will not have to worry\
    \ so much about which extensions are loaded. Also, this greatly enhances PHP async\
    \ frameworks as they now have low-level support, directly in the language core,\
    \ greatly improving performance. Let's now have a look at the Fiber class itself.\n\
    \n# Discovering the Fiber class\n\nThe PHP 8.1 Fiber class offers a bare-bones\
    \ implementation upon which async framework and extension developers can build\
    \ timers, event loops, promises, and other async artifacts.\n\nHere is the formal\
    \ class definition:\n\n```\nfinal class Fiber {\n    public function __construct(callable\
    \ $callback) {}\n    public function start(mixed ...$args): mixed {}\n    public\
    \ function resume(mixed $value = null): mixed {}\n    public function throw(Throwable\
    \ $exception): mixed {}\n    public function isStarted(): bool {}\n    public\
    \ function isSuspended(): bool {}\n```"
  merge: -1
  img_proc: true
- pgno: 499
  md: "```\npublic function isRunning(): bool {}\npublic function isTerminated():\
    \ bool {}\npublic function getReturn(): mixed {}\npublic static function this():\
    \ ?self {}\npublic static function suspend(\n    mixed $value = null): mixed {}\n\
    }\n```\n\nHere is a summary of the Fiber class methods:\n\n| Fiber method | Description\
    \ |\n|---|---|\n| Fiber::start() | Starts fiber execution. The callback associated\
    \ with the fiber can then be suspended, canceled and resumed at will. Any arguments\
    \ are passed to the callback. Suspend the fiber by making a static call $fiber::suspend().\
    \ Cancel the fiber by having it throw an exception using $fiber->throw(). |\n\
    | Fiber::resume() | Restarts fiber execution. Returns the value provided by Fiber::suspend().\
    \ |\n| Fiber::suspend() | This method is made via a static call from inside the\
    \ callback assigned to the fiber. You can then resume or cancel the fiber using\
    \ suspend() or throw(). |\n| Fiber::throw() | When calling this method, provide\
    \ an instance of Throwable. The fiber is then canceled. |\n| Fiber::isStarted()\n\
    Fiber::isSuspended()\nFiber::isRunning()\nFiber::isTerminated() | These four methods\
    \ return a boolean and are used to display the state of the fiber. |\n| Fiber::getReturn()\
    \ | Much like a PHP Generator, you can use this method to get the value provided\
    \ by the callback's return (if any). |\n| Fiber::this() | Returns the currently\
    \ running fiber instance. |\n\nTable 12.3 – Fiber class method summary\n\nAs you\
    \ can see from Table 12.3, after creating a Fiber instance, use start() to run\
    \ the callback associated with the fiber. After that, you are free to suspend,\
    \ resume, or cause the fiber to fail, using throw(). You can also just let the\
    \ callback run in its own fiber, and use getReturn() to retrieve the returned\
    \ information. You might also note that the is*() methods can be used to determine\
    \ the fiber's state at any given moment.\n\n> **Tip**\n> \n> For more information\
    \ on the PHP 8.1 fibers implementation, please have a look at the following RFC:\
    \ https://wiki.php.net/rfc/fibers.\n\nLet's now have a look at an example that\
    \ illustrates the use of fibers."
  merge: -1
  img_proc: true
- pgno: 500
  md: "# Using fibers\n\nPHP 8.1 fibers form the basis of a PHP async application.\
    \ Although the primary audience for fibers is framework and extension developers,\
    \ any PHP developer can benefit from this class. To illustrate the problem PHP\
    \ fibers can solve, let's have a look at a simple example.\n\n# Defining a sample\
    \ program that performs blocking operations\n\nIn this example, written using\
    \ the synchronous programming model, we perform three actions, as follows:\n\n\
    +   - Execute an HTTP GET request.\n+   - Perform a database query.\n+   - Write\
    \ information to an access log.\n\nAlready having some knowledge of async programming,\
    \ you realize that all three tasks represent *blocking* operations. Here are the\
    \ steps we'll take:\n\n+   1. First, we define a PHP file to be included that\
    \ defines the callbacks:\n\n```\n// /repo/ch12/php8_fibers_include.php\ndefine('WAR_AND_PEACE',\n\
    \    'https://www.gutenberg.org/files/2600/2600-0.txt');\ndefine('DB_FILE', __DIR__\n\
    \    . '/../sample_data/geonames.db');\ndefine('ACCESS_LOG', __DIR__ . '/access.log');\n\
    $callbacks = [\n    'read_url' => function (string $url) {\n        return file_get_contents($url);\
    \ },\n    'db_query' => function (string $iso2) {\n        $pdo = new PDO('sqlite:'\
    \ . DB_FILE);\n        $sql = 'SELECT * FROM geonames '\n            . 'WHERE\
    \ country_code = ?'\n        $stmt = $pdo->prepare($sql);\n        $stmt->execute([$iso2]);\n\
    \        return var_export(\n            $stmt->fetchAll(PDO::FETCH_ASSOC), TRUE);\n\
    \    },\n    'access_log' => function (string $info) {\n        $info = date('Y-m-d\
    \ H:i:s') . \": $info\\n\";\n```"
  merge: -1
  img_proc: true
- pgno: 501
  md: "```\nreturn file_put_contents(\n    ACCESS_LOG, $info, FILE_APPEND);\n},\n\
    ];\nreturn $callbacks;\n```\n\n2. Next, we define a PHP program that includes\
    \ the callbacks' definition and executes them sequentially. We use a PHP 8 match\
    \ {} construct to assign different arguments to pass to the appropriate callback.\
    \ Finally, we return the number of bytes generated by the callback by simply returning\
    \ a string and running strlen():\n\n```\n// /repo/ch12/php8_fibers_blocked.php\n\
    $start = microtime(TRUE);\n$callbacks = include __DIR__ . '/php8_fibers_include.php';\n\
    foreach ($callbacks as $key => $exec) {\n    $info = match ($key) {\n        'read_url'\
    \ => WAR_AND_PEACE,\n        'db_query' => 'IN',\n        'access_log' => __FILE__,\n\
    \        default => ''\n    };\n    $result = $exec($info);\n    echo \"Executing\
    \ $key\" . strlen($result) . \"\\n\";\n}\necho \"Elapsed Time:\" . (microtime(TRUE)\

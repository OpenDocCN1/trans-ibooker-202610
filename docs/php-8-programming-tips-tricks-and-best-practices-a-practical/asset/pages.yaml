  md: "# Examining XMLWriter extension differences\n\nAll XMLWriter extension procedural\
    \ functions now accept and return XMLWriter objects instead of resources. If you\
    \ have a look at the official PHP documentation for the XMLWriter extension, however,\
    \ you'll see no references to the procedural functions. The reason for this is\
    \ twofold: first, the PHP language is slowly moving away from discrete procedural\
    \ functions in favor of **object-oriented programming (OOP)**.\n\nThe second reason\
    \ is that XMLWriter procedural functions are in reality just wrappers for XMLWriter\
    \ OOP methods! As an example, xmlwriter_open_memory() is a wrapper for XMLWriter::openMemory(),\
    \ xmlwriter_text() is a wrapper for XMLWriter::text(), and so forth.\n\nIf you\
    \ are really set on using the XMLWriter extension using procedural programming\
    \ techniques, xmlwriter_open_memory() creates an XMLWriter instance in PHP 8 rather\
    \ than a resource. Likewise, all XMLWriter extension procedural functions work\
    \ with XMLWriter instances rather than resources.\n\nAs with any of the extensions\
    \ mentioned in this chapter that now produce object instances rather than resources,\
    \ a potential backward-compatible break is possible. An example of such a break\
    \ would be where you are using XMLWriter procedural functions and is_resource()\
    \ to check to see if a resource has been created. We do not show you an example\
    \ here, as the problem and the solution are the same as described in the previous\
    \ section: use !empty() instead of is_resource().\n\nIt is a *best practice* to\
    \ use the XMLWriter extension OOP **application programming interface (API)**\
    \ instead of the procedural API. Fortunately, the OOP API has been available since\
    \ PHP 5.1. Here is a sample XML file to be used in the next example:\n\n```\n\
    ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<fruit>\n    <item>Apple</item>\n\
    \    <item>Banana</item>\n</fruit>\n```\n```\n\nThe example shown here works in\

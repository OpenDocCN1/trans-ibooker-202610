    $data_src = __DIR__\n    . '../sample_data/cities15000_min.txt';\n$fh       =\
    \ new SplFileObject($data_src, 'r');\n$pattern  = \"%30s : %20s\\n\";\n$target\
    \   = 10000000;\n$data     = new ArrayIterator();\n```\n\n```\nwhile ($line =\

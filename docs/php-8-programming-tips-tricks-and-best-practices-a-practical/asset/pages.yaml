- pgno: 346
  md: '# Technical requirements


    To examine and run the code examples provided in this chapter, the minimum recommended
    hardware is as follows:


    +   - X86_64-based desktop PC or laptop

    +   - 1 GB free disk space

    +   - 4 GB of RAM

    +   - 500 Kbps or faster internet connection


    In addition, you will need to install the following software:


    +   - Docker

    +   - Docker Compose


    Please refer to the Technical requirements section of Chapter 1, Introducing New
    PHP 8 OOP Features, for more information on how to install Docker and Docker Compose,
    as well as how to build the Docker container used to demonstrate the code in this
    book. In this book, we will refer to the directory that you restored the sample
    code in as /repo.


    The source code for this chapter is located here: https://github.com/PacktPublishing/PHP-8-Programming-Tips-Tricks-and-Best-Practices.
    We will start by examining significant method signature changes.


    # Discovering method signature changes


    Several method signature changes have been introduced in PHP 8. Understanding
    these signature changes is important if your code extends any of the classes or
    implements any of the methods described in this section. As long as you are aware
    of these changes, your code will function correctly, resulting in fewer bugs.


    The signature changes that were introduced in PHP 8 reflect the updated best practices.
    Accordingly, if you write code that uses the correct method signatures, you are
    following these best practices. We will begin our discussion by reviewing PHP
    8 changes to magic method signatures.


    # Managing magic method signatures


    In PHP 8, the definition and use of magic methods has taken a significant step
    toward standardization. This was accomplished by introducing precise magic method
    signatures in the form of strict argument and return data types. As with most
    of the improvements seen in PHP 8, this update was included to prevent the misuse
    of magic methods. The overall result is better code with fewer bugs.'
  merge: -1
  img_proc: true
- pgno: 347
  md: "The downside of this enhancement is that if you have code that provides an\
    \ incorrect argument or return value type, an Error is thrown. On the other hand,\
    \ if your code does provide the correct argument data type and return value type,\
    \ or if your code does not use argument or return value data types at all, this\
    \ enhancement will have no adverse effects.\n\nThe following code block summarizes\
    \ the new argument and return value data types for magic methods in PHP 8 and\
    \ above:\n\n```\n__call(string $name, array $arguments): mixed;\n__callStatic(string\
    \ $name, array $arguments): mixed;\n__clone(): void;\n__debugInfo(): ?array;\n\
    __get(string $name): mixed;\n__invoke(mixed $arguments): mixed;\n__isset(string\
    \ $name): bool;\n__serialize(): array;\n__set(string $name, mixed $value): void;\n\
    __set_state(array $properties): object;\n__sleep(): array;\n__unserialize(array\
    \ $data): void;\n__unset(string $name): void;\n__wakeup(): void;\n```\n\nNow,\
    \ let's have a look at three simple examples that illustrate the impact of the\
    \ magic method signature changes:\n\n+   1. The first example involves the NoTypes\
    \ class, which defines __call() but does not define any data types:\n\n```\n//\
    \ /repo/ch09/php8_bc_break_magic.php\nclass NoTypes {\n    public function __call($name,\
    \ $args) {\n        return \"Attempt made to call '$name' \"\n            . \"\
    with these arguments: '\"\n            . implode(',', $args) . \"'\\n\";\n   \
    \ }\n}\n$no = new NoTypes();\necho $no->doesNotExist('A','B','C');\n```"
  merge: -1
  img_proc: true
- pgno: 348
  md: "2. The following example (in the same file as the preceding example) is of\
    \ the MixedTypes class, which defines __invoke() but uses an array data type rather\
    \ than a mixed one:\n\n```\nclass MixedTypes {\n    public function __invoke(array\
    \ $args) : string {\n        return \"Arguments: \"\n            . implode(',',\
    \ $args) . \"\\n\";\n    }\n}\n$mixed= new MixedTypes();\necho $mixed(['A','B','C']);\n\
    ```\n\nHere is the PHP 7 output for the code sample shown in the preceding steps:\n\
    \n```\nroot@php8_tips_php7 [ /repo/ch09 ]#\nphp php8_bc_break_magic.php\nAttempt\
    \ made to call 'doesNotExist' with these arguments:\n'A,B,C'\nArguments: 'A,B,C'\n\
    ```\n\nAnd here is the same code sample but running under PHP 8:\n\n```\nroot@php8_tips_php8\
    \ [ /repo/ch09 ]#\nphp php8_bc_break_magic.php\nAttempt made to call 'doesNotExist'\
    \ with these arguments:\n'A,B,C'\nArguments: 'A,B,C'\n```\n\nAs you can see, the\
    \ two sets of output are identical. The first class shown, NoTypes, works because\
    \ no data type hints were defined. Interestingly, the MixedTypes class works in\
    \ both PHP 8 and below since the new mixed data type is actually a union of all\
    \ types. Accordingly, you are safe to use any specific data type in place of mixed."
  merge: -1
  img_proc: true
- pgno: 349
  md: "+   3. In our final example, we will define the WrongType class. In this class,\
    \ we will define a magic method called __isset() using a return data type that\
    \ doesn’t match the PHP 8 requirement. Here, we are using string, whereas in PHP\
    \ 8, its return type needs to be bool:\n\n```\n// /repo/ch09/php8_bc_break_magic_wrong.php\n\
    class WrongType {\n    public function __isset($var) : string {\n        return\
    \ (isset($this->$var)) ? 'Y' : '';\n    }\n}\n$wrong = new WrongType();\necho\
    \ (isset($wrong->nothing)) ? 'Set' : 'Not Set';\n```\n\nThis example works in\
    \ PHP 7 because it relies on the fact that the empty string is returned in this\
    \ example if the variable is not set, and is then interpolated as a FALSE Boolean.\
    \ Here is the PHP 7 output:\n\n```\nroot@php8_tips_php7 [ /repo/ch09 ]#\nphp php8_bc_break_magic_wrong.php\n\
    Not Set\n```\n\nIn PHP 8, however, because magic method signatures are now standardized,\
    \ the example fails, as shown here:\n\n```\nroot@php8_tips_php8 [ /repo/ch09 ]#\n\
    php php8_bc_break_magic_wrong.php\nPHP Fatal error: WrongTypes::__isset(): Return\
    \ type must be bool when declared in /repo/ch09/php8_bc_break_magic_wrong.php\
    \ on line 6\n```\n\nAs you can see, PHP 8 strictly enforces its magic method signatures.\n\
    \n> Tip\n> Best Practice: Revise any code that uses magic methods to follow the\
    \ new strict method signatures. For more information on strict magic method signatures,\
    \ go to https://wiki.php.net/rfc/magic-methods-signature."
  merge: -1
  img_proc: true
- pgno: 350
  md: "You now have an idea of what to look for and how to correct potential code\
    \ breaks involving magic methods. Now, let's have a look at Reflection extension\
    \ method signature changes.\n\n# Examining Reflection method signature changes\n\
    \nBackward compatible code breaks may occur if your application is using either\
    \ the invoke() or newInstance() Reflection extension method. In PHP 7 and below,\
    \ all three methods listed next accepted an unlimited number of arguments. However,\
    \ in the method signature, only one argument was listed, as follows:\n\n+   -\
    \ `ReflectionClass::newInstance($args)`\n+   - `ReflectionFunction::invoke($args)`\n\
    +   - `ReflectionMethod::invoke($args)`\n\nIn PHP 8, the method signatures accurately\
    \ reflect reality in that $args is preceded by the variadics operator. Here are\
    \ the new method signatures:\n\n+   - `ReflectionClass::newInstance(...$args)`\n\
    +   - `ReflectionFunction::invoke(...$args)`\n+   - `ReflectionMethod::invoke($object,\
    \ ...$args)`\n\nThis change will only break your code if you have a custom class\
    \ that extends any of these three classes, and where your custom class also overrides\
    \ any of the three methods listed in the previous bulleted list.\n\nFinally, the\
    \ isBuiltin() method has been moved from ReflectionType to ReflectionNamedType.\
    \ This presents a potential code break if you are using ReflectionType::isBuiltIn().\n\
    \nNow, let's have a look at method signature changes in the PDO extension.\n\n\
    # Dealing with PDO extension signature changes\n\nThe PDO extension has two method\
    \ signature changes that are of importance. These changes are needed to address\
    \ inconsistencies in method calls when different **fetch modes** are applied.\
    \ Here is the new method signature for PDO::query():\n\n```\nPDO::query(string\
    \ $query,\n    ?int $fetchMode = null, mixed ...$fetchModeArgs)\n```"
  merge: -1
  img_proc: true
- pgno: 351
  md: "This is the new signature for PDOStatement::setFetchMode():\n\n```\n```php\n\
    PDOStatement::setFetchMode(int $mode, mixed ...$args)\n```\n```\n\n> > **Tip**\n\
    > >\n> > The PDO::query() method signature changes are referenced in the PHP 7.4\
    \ to PHP 8 migration guide, here: https://www.php.net/manual/en/migration80.incompatible.php#migration80.incompatible.pdo.\n\
    \nThe two new method signatures are much more uniform than the old signatures,\
    \ and they completely cover syntactical differences when you're using different\
    \ fetch modes. A simple code example that performs PDO::query() using two different\
    \ fetch modes illustrates why the method signature needed to be normalized:\n\n\
    1. Let's start by including a configuration file that contains database connection\
    \ parameters. From this, we will create a PDO instance:\n\n```\n```php\n// /repo/ch09/php8_pdo_signature_change.php\n\
    $config = include __DIR__ . '../src/config/config.php';\n$db_cfg = $config['db-config'];\n\
    $pdo    = new PDO($db_cfg['dsn'], $db_cfg['usr'], $db_cfg['pwd']);\n```\n```\n\
    \n2. Now, let's define a SQL statement and send it so that it can be prepared:\n\
    \n```\n```php\n$sql    = 'SELECT hotelName, city, locality, '\n    . 'country,\
    \ postalCode FROM hotels '\n    . 'WHERE country = ? AND city = ?';\n$stmt   =\
    \ $pdo->prepare($sql);\n```\n```\n\n3. Next, we will execute the prepared statement\
    \ and set the fetch mode to PDO::FETCH_ASSOC. Notice that when we use this fetch\
    \ mode, only one argument is provided to the setFetchMode() method:\n\n```\n```php\n\
    $stmt->execute(['IN', 'Budhera']);\n$stmt->setFetchMode(PDO::FETCH_ASSOC);\nwhile\
    \ ($row = $stmt->fetch()) var_dump($row);\n```\n```"
  merge: -1
  img_proc: true
- pgno: 352
  md: "4. Finally, we will execute the same prepared statement for a second time.\
    \ This time, we will set the fetch mode to PDO::FETCH_CLASS. Notice that when\
    \ we use this fetch mode, two arguments are provided to the setFetchMode() method:\n\
    \n```\n$stmt->execute(['IN', 'Budhera']);\n$stmt->setFetchMode(\n    PDO::FETCH_CLASS,\
    \ ArrayObject::class);\nwhile ($row = $stmt->fetch()) var_dump($row);\n```\n\n\
    The output in the first query is an associative array. The second query produces\
    \ an ArrayObject instance. Here is the output:\n\n```\nroot@php8_tips_php8 [/repo/ch09\
    \ ]#\nphp php8_pdo_signature_change.php\narray(5) {\n    [\"hotelName\"]=> string(10)\
    \ \"Rose Lodge\"\n    [\"city\"]=> string(7) \"Budhera\"\n    [\"locality\"]=>\
    \ string(7) \"Gurgaon\"\n    [\"country\"]=> string(2) \"IN\"\n    [\"postalCode\"\
    ]=> string(6) \"122505\"\n}\nobject(ArrayObject)#3 (6) {\n    [\"hotelName\"]=>\
    \ string(10) \"Rose Lodge\"\n    [\"city\"]=> string(7) \"Budhera\"\n    [\"locality\"\
    ]=> string(7) \"Gurgaon\"\n    [\"country\"]=> string(2) \"IN\"\n    [\"postalCode\"\
    ]=> string(6) \"122505\"\n    [\"storage\":\"ArrayObject\":private]=> array(0)\
    \ { }\n}\n```\n\nIt's important to observe that even though the method signatures\
    \ have changed, you can keep your existing code as-is: this does not present a\
    \ backward compatible code break!\n\nNow, let's have a look at methods that are\
    \ declared as static.\n\n# Dealing with newly defined static methods\n\nAnother\
    \ potentially significant change seen in PHP 8 is that several methods are now\
    \ declared static. If you are already using the classes and methods described\
    \ here as direct object instances, then you do not have a problem."
  merge: -1
  img_proc: true
- pgno: 353
  md: "The following methods are now declared as static:\n\n+   - `tidy::repairString()`\n\
    +   - `tidy::repairFile()`\n+   - `XMLReader::open()`\n+   - `XMLReader::xml()`\n\
    \nThe potential for a code break my occur if you override one of the classes mentioned\
    \ previously. In this case, you must declare the overridden method as static.\
    \ Here is a simple example that illustrates the potential problem:\n\n1. First,\
    \ let's define a string that has mismatched <div> tags:\n\n```\n```php\n// /repo/ch08/php7_tidy_repair_str_static.php\n\
    $str = <<<EOT\n<DIV>\n    <Div>Some Content</div>\n        <Div>Some Other Content\n\
    </div>\nEOT;\n```\n```\n\n2. Then, define an anonymous class that extends tidy,\
    \ fixes the string, and returns the string with all HTML tags in lowercase:\n\n\
    ```\n```php\n$class = new class() extends tidy {\n    public function repairString($str)\
    \ {\n        $fixed = parent::repairString($str);\n        return preg_replace_callback(\n\
    \            '/<.+?>/',\n            function ($item) {\n                return\
    \ strtolower($item); },\n            $fixed);\n    }\n};\n```\n```"
  merge: -1
  img_proc: true
- pgno: 354
  md: "+   3. Finally, echo the repaired string:\n\n```\necho $class->repairString($str);\n\
    ```\n\nIf we run this code example in PHP 7, the output will be as follows:\n\n\
    ```\nroot@php8_tips_php7 [ /repo/ch09 ]#\nphp php7_tidy_repair_str_static.php\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title></title>\n</head>\n<body>\n<div>\n<div>Some\
    \ Content</div>\n<div>Some Other Content</div>\n</div>\n</body>\n</html>\n```\n\
    \nAs you can see, the mismatched <div> tag has been repaired, and a properly formatted\
    \ HTML document has been produced. You'll also note that all the tags are in lowercase.\n\
    \nIn PHP 8, however, a method signature issue arises, as you can see here:\n\n\
    ```\nroot@php8_tips_php8 [ /repo/ch09 ]#\nphp php7_tidy_repair_str_static.php\n\
    PHP Fatal error: Cannot make static method tidy::repairString() non static in\
    \ class tidy@anonymous in /repo/ch09/php7_tidy_repair_str_static.php on line 11\n\
    ```\n\nAs you can see, in PHP 8, the repairString() method is now declared as\
    \ static. The method signature for repairString() in the anonymous class we defined\
    \ earlier needs to be rewritten, as follows:\n\n```\npublic static function repairString(\n\
    \    string $str,\n    array|string|null $config = null,\n    ?string $encoding\
    \ = null) { // etc.\n```"
  merge: -1
  img_proc: true
- pgno: 355
  md: "The output (not shown), once rewritten, is the same as the PHP 7 output shown\
    \ earlier. Also, note that the last line can now also be written as follows:\n\
    \n```\necho $class::repairString($str);\n```\n\nNow that you know about the methods\
    \ that are newly defined as static, let's look at a related topic; that is, the\
    \ static return type.\n\n# Working with the static return type\n\nThe static keyword\
    \ is used in several contexts in PHP. Its basic uses are beyond the scope of this\
    \ discussion. In this section, we will focus on a new usage for static as a return\
    \ data type.\n\nSince static is considered a subtype of self, it can be used to\
    \ widen the narrower return type of self. The static keyword cannot be used as\
    \ a type hint, however, as it would violate the Liskov Substitution Principle.\
    \ It would also confuse developers as static is already used in too many other\
    \ contexts.\n\n> Tip\n> The following article describes the background discussion\
    \ that preceded the introduction of the static return type: https://wiki.php.net/rfc/static_return_type.\
    \ The following documentation references late static binding: https://www.php.net/manual/en/language.oop5.late-static-bindings.php.\
    \ The Liskov Substitution Principle was discussed in Chapter 5, Discovering Potential\
    \ OOP Backward-Compatibility Breaks, in the Understanding expanded PHP 8 variance\
    \ support section.\n\nThe most common use for this new return data type would\
    \ be in classes that use the fluent interface. The latter is a technique whereby\
    \ an object method returns an instance of the current object state, thus allowing\
    \ a chain of method calls to be used in a fluent (readable) manner. In the following\
    \ example, note how the object builds a SQL SELECT statement:\n\n+   1. First,\
    \ we must define a Where class that accepts an unlimited number of arguments to\
    \ form a SQL WHERE clause. Note the return data type of static:\n\n```\n// /src/Php8/Sql/Where.php\n\
    namespace Php8\\Sql;\nclass Where {\n    public $where = [];\n    public function\
    \ where(...$args) : static {\n```"
  merge: -1
  img_proc: true
- pgno: 356
  md: "```\n$this->where = array_merge($this->where, $args);\nreturn $this;\n}\n//\
    \ not all code is shown\n}\n```\n\n2. Now, let's define the main class, Select,\
    \ which provides methods for building parts of a SQL SELECT statement. Again,\
    \ notice that the methods shown all return the current class instance and have\
    \ a return data type of static:\n\n```\n// /src/Php8/Sql/Select.php\nnamespace\
    \ Php8\\Sql;\nclass Select extends Where {\n    public $from = '';\n    public\
    \ $limit = 0;\n    public $offset = 0;\n    public function from(string $table)\
    \ : static {\n        $this->from = $table;\n        return $this;\n    }\n  \
    \  public function order(string $order) : static {\n        $this->order = $order;\n\
    \        return $this;\n    }\n    public function limit(int $num) : static {\n\
    \        $this->limit = $num;\n        return $this;\n    }\n    // not all methods\
    \ and properties are shown\n}\n```\n\n3. Finally, we must define a calling program\
    \ that provides the values needed to build the SQL statement. Note that the echo\
    \ statement uses the fluent interface to make programmatically creating the SQL\
    \ statement much easier to follow:\n\n```\n// /repo/ch09/php8_static_return_type.php\n\
    require_once __DIR__\n    . './../../src/Server/Autoload/Loader.php';\n```"
  merge: -1
  img_proc: true
- pgno: 357
  md: "```\n$loader = new \\Server\\Autoload\\Loader();\nuse Php8\\Sql\\Select;\n\
    $start = \"'2021-06-01'\";\n$end   = \"'2021-12-31'\";\n$select = new Select();\n\
    echo $select->from('events')\n    ->cols(['id', 'event_name', 'event_date'])\n\
    \    ->limit(10)\n    ->where('event_date', '>=', $start)\n    ->where('AND',\
    \ 'event_date', '<=', $end)\n    ->render();\n```\n\nHere is the output of the\
    \ code example running in PHP 8:\n\n```\nroot@php8_tips_php8 [ /repo/ch09 ]#\n\
    php php8_static_return_type.php\nSELECT id,event_name,event_date FROM events WHERE\
    \ event_date >= '2021-06-01' AND event_date <= '2021-12-31' LIMIT 10\n```\n\n\
    This example doesn't work in PHP 7, of course, as the static keyword is not available\
    \ as a return data type. Next, let's have a look at the extended use of the special\
    \ ::class constant.\n\n# Extending the use of the ::class constant\n\nThe special\
    \ ::class constant is an extremely useful construct in that it can silently expand\
    \ into a full namespace, plus a classname string. Understanding how it is used,\
    \ as well as how its use has been extended in PHP 8, can save you lots of time.\
    \ Its use can also make your code much more readable, especially if you're dealing\
    \ with lengthy namespaces and class names.\n\nThe special ::class constant is\
    \ a combination of the scope resolution operator (::) and the class keyword. Unlike\
    \ ::parent, ::self, and ::static, however, the ::class construct can be used outside\
    \ a class definition. In a sense, the ::class construct is a sort of magic constant\
    \ in that it causes the class it's associated with to magically expand into its\
    \ full namespace, plus class name.\n\nBefore we get into how its use has been\
    \ expanded in PHP 8, let's have a look at its conventional usage."
  merge: -1
  img_proc: true
- pgno: 358
  md: "# Conventional ::class constant usage\n\nThe special `::class` constant is\
    \ frequently used in situations where you have a lengthy namespace and wish to\
    \ not only save yourself a lot of unneeded typing, but also preserve the readability\
    \ of your source code.\n\nIn this simple example, using the `Php7\\Image\\Strategy`\
    \ namespace, we wish to create a list of strategy classes:\n\n+   1. First, let's\
    \ identify the namespace and set up the autoloader:\n+   2. Before the special\
    \ `::class` constant was introduced, to produce a list of full namespace class\
    \ names, you had to write it all out as a string, as shown here:\n+   3. Using\
    \ the special `::class` constant, you can reduce the amount of typing required,\
    \ and you can also make the code more readable, as shown here:\n\n```\n// /repo/ch09/php7_class_normal.php\n\
    namespace Php7\\Image\\Strategy;\nrequire_once __DIR__\n  './../../src/Server/Autoload/Loader.php';\n\
    $autoload = new \\Server\\Autoload\\Loader();\n```\n\n```\n$listOld = [\n  'Php7\\\
    Image\\Strategy\\DotFill',\n  'Php7\\Image\\Strategy\\LineFill',\n  'Php7\\Image\\\
    Strategy\\PlainFill',\n  'Php7\\Image\\Strategy\\RotateText',\n  'Php7\\Image\\\
    Strategy\\Shadow'\n];\nprint_r($listOld);\n```\n\n```\n$listNew = [\n  DotFill::class,\n\
    \  LineFill::class,\n  PlainFill::class,\n  RotateText::class,\n  Shadow::class\n\
    ];\nprint_r($listNew);\n```"
  merge: -1
  img_proc: true
- pgno: 359
  md: "If we run this code example, we'll see that the two lists are identical in\
    \ both PHP 7 and PHP 8. Here's the PHP 7 output:\n\n```\nroot@php8_tips_php7 [\
    \ /repo/ch09 ]#\nphp php7_class_normal.php\nArray (\n    [0] => Php7\\Image\\\
    Strategy\\DotFill\n    [1] => Php7\\Image\\Strategy\\LineFill\n    [2] => Php7\\\
    Image\\Strategy\\PlainFill\n    [3] => Php7\\Image\\Strategy\\RotateText\n   \
    \ [4] => Php7\\Image\\Strategy\\Shadow\n)\nArray (\n    [0] => Php7\\Image\\Strategy\\\
    DotFill\n    [1] => Php7\\Image\\Strategy\\LineFill\n    [2] => Php7\\Image\\\
    Strategy\\PlainFill\n    [3] => Php7\\Image\\Strategy\\RotateText\n    [4] =>\
    \ Php7\\Image\\Strategy\\Shadow\n)\n```\n\nAs you can see, the special ::class\
    \ constant causes class names to be expanded into their full namespace, plus class\
    \ name, at compile time, causing both lists to contain identical information.\n\
    \nNow, let's have a look at special ::class constant usage in PHP 8.\n\n# Expanded\
    \ special ::class constant usage\n\nIn line with other improvements in syntax\
    \ uniformity seen in PHP 8, it's now possible to use the special ::class constant\
    \ on active object instances. Although the effect is the same as using get_class(),\
    \ it makes sense to use the special ::class constant as part of the general best\
    \ practice of moving away from procedural and toward OOP."

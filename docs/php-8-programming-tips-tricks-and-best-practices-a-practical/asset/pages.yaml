- pgno: 452
  md: 'If you specified the CSV file option, you can open it in any spreadsheet program.
    Here''s how it appears in Libre Office Calc:


    ![](img/dbf2674d5b31107c344104b5edcb21c5_452_0.png)


    Figure 11.1 – CSV file open in Libre Office Calc


    You now have an idea of how to create an automated procedure to detect potential
    BC breaks. Please bear in mind that the code is far from perfect and doesn''t
    cover every single possible code break. For that, you must rely upon your own
    judgment after having carefully reviewed the material in this book.


    It''s now time to turn our attention to the actual migration itself.


    # Performing the migration


    Performing the actual migration from your current version to PHP version 8 is
    much like the process of deploying a new set of features to an existing application.
    If possible, you might consider running two websites in parallel until such time
    as you are confident the new version works as expected. Many organizations run
    the staging environment in parallel with the production environment for this purpose.'
  merge: -1
  img_proc: true
- pgno: 453
  md: 'In this section, we present a **twelve-step guide** to perform a successful
    migration.

    Although we are focused on migrating to PHP 8, these twelve steps can apply to
    any PHP update you may wish to perform. Understanding and following these steps
    carefully is critical to the success of your production website. Included in the
    twelve steps are plenty of places where you can revert to an earlier version if
    you encounter problems.


    Before we get into details, here is a general overview of a twelve-step migration
    process going from an older version of PHP to PHP 8:


    +   1. Carefully review the appropriate migration guide located in the PHP documentation
    appendices. In our case, we choose *Migrating from PHP 7.4x to PHP 8.0x.* (`https://www.php.net/manual/en/appendices.php`).

    +   2. Make sure your current code works on the current version of PHP.

    +   3. Back up the database (if any), all source code, and any associated files
    and assets (for example, CSS, JavaScript, or graphics images).

    +   4. Create a new branch for the soon-to-be-updated application code in your
    version control software.

    +   5. Scan for BC breaks (possibly using the `BreakScan` class discussed in the
    previous section).

    +   6. Update any incompatible code.

    +   7. Repeat *steps 5* and *6* as needed.

    +   8. Upload your source code to the repository.

    +   9. Test the source code in a virtual environment updated to PHP 8 that closely
    simulates the production server.

    +   10. If the virtualized simulation is not successful, return to *step 5*.

    +   11. Update the staging server (or equivalent virtual environment) to PHP 8,
    making sure you can switch back to the old version.

    +   12. Run every test you can imagine. If not successful, switch back to the
    master branch and return to *step 5*. If successful, clone the staging environment
    to production.


    Let''s now look at each step in turn.'
  merge: -1
  img_proc: true
- pgno: 454
  md: '# Step 1 – Review the migration guide


    With every major release of PHP, the PHP core team posts a **migration guide**.
    The guide we are mainly concerned with in this book is *Migrating from PHP 7.4.x
    to PHP 8.0.x*, located at `https://www.php.net/manual/en/migration80.php`. This
    migration guide is broken down into four sections:


    +   - New Features

    +   - Backward Incompatible Changes

    +   - Deprecated Features

    +   - Other Changes


    If you are migrating to PHP 8.0 from a version other than PHP 7.4, you should
    also review all of the past migration guides from your current PHP version, up
    to PHP 8. We''ll now have a look at other recommended steps in the migration process.


    # Step 2 – Make sure the current code works


    Before you start to make changes to the current code base to ensure it works in
    PHP 8, it''s absolutely critical for you to make sure it''s working. If the code
    isn''t working now, it surely will not work once you migrate to PHP 8! Run any
    unit tests along with any **black-box tests** to ensure the code is functioning
    correctly in the current version of PHP.


    If you make any changes to the current code before migration, be sure these changes
    are reflected in the main branch (often called the **master branch**) of your
    version control software.


    # Step 3 – Back up everything


    The next step is to back up everything. This includes the database, source code,
    JavaScript, CSS, images, and so forth. Also, please do not forget to back up important
    configuration files such as the `php.ini` file, the webserver configuration, and
    any other configuration file associated with PHP and web communications.


    # Step 4 – Create a version control branch


    In this step, you should create a new branch in your version control system and
    check out that branch. In the main branch, you should only have code that currently
    works.'
  merge: -1
  img_proc: true
- pgno: 455
  md: 'This is how such a command might work using Git:


    ```

    $ git branch php8_migration

    $ git checkout php8_migration

    Switched to branch ''php8_migration''

    ```


    The first command shown creates a branch called php8_migration. The second command
    causes git to switch to the new branch. In the process, all of your existing code
    gets ported to the new branch. The main branch is now safe and preserved from
    any changes made while in the new branch.


    For more information on version control using Git, have a look here:

    https://git-scm.com/.


    # Step 5 – Scan for BC breaks


    Now it''s time to put the BreakScan class to good use. Run the calling program
    and supply as arguments the starting directory path for your project as well as
    a verbosity level (0, 1, or 2). You can also specify a CSV file as a third option,
    as shown earlier in Figure 11.1.


    # Step 6 – Fix incompatibilities


    In this step, knowing where the breaks reside, you can proceed to fix the incompatibilities.
    You should be able to do so in such a way that the code continues to run in the
    current version of PHP but can also run in PHP 8. As we''ve pointed out consistently
    throughout this book, BC breaks, for the most part, stem from bad coding practices.
    By fixing the incompatibilities, you improve your code at the same time.


    # Step 7 – Repeat steps 5 and 6 as needed


    There''s a famous line, repeated in many Hollywood movies, where the doctor says
    to the anxious patient, take two aspirin and call me in the morning. The same
    advice applies to the process of addressing BC breaks. You must be patient, and
    continue to fix and scan, fix and scan. Keep on doing this until the scan reveals
    no more potential BC breaks.'
  merge: -1
  img_proc: true
- pgno: 456
  md: '# Step 8 – Commit changes to the repository


    Once you are relatively confident there are no further BC breaks, it’s time to
    commit changes to the new PHP 8 migration branch you created in your version control
    software. Go ahead and push the changes at this point. You are then in a position
    to retrieve the updated code from this branch once you’ve sorted out the PHP update
    on the production server.


    Remember this important point: your current working code is safely stored in the
    main branch. You are only saving to the PHP 8 migration branch at this stage,
    so you can always switch back.


    # Step 9 – Test in a simulated virtual environment


    Think of this step as a dress rehearsal for the real thing. In this step, you
    create a virtual environment (for example, using a Docker container) that most
    closely simulates the production server. In this virtual environment, you then
    install PHP 8. Once the virtual environment has been created, you can open a command
    shell into it, and download your source code from the PHP 8 migration branch.


    You can then run unit tests, and any other tests you deem necessary in order to
    test the updated code. Hopefully, this is where you’ll trap any additional errors.


    # Step 10 – Return to step 5 if the test is unsuccessful


    If the unit tests, black-box tests, or other testing performed in the virtual
    environment show that your application code fails, you must return to step 5.
    To proceed to the live production site in the face of certain failure would be
    extremely ill-advised!


    # Step 11 – Install PHP 8 on the staging environment


    The next step is to install PHP 8 in the staging environment. As you might recall
    from our discussion in the first part of this chapter, the traditional flow is
    from the development environment, to staging, and then on to production. Once
    all testing has been completed on the staging environment, you can then clone
    staging to production.


    PHP installation is well documented on the main php.net website, so there is no
    need for further detail here. Instead, in this section we give you a light overview
    of PHP installation, with a focus on the ability to switch between PHP 8 and your
    current PHP version.'
  merge: -1
  img_proc: true
- pgno: 457
  md: "> **Tip**\n> For information on installing PHP in various environments, consult\
    \ this documentation page: https://www.php.net/manual/en/install.php.\n\nFor the\
    \ purpose of illustration, we choose to discuss PHP 8 installation on two of the\
    \ main branches of Linux: Debian/Ubuntu and Red Hat/CentOS/Fedora. Let's start\
    \ with Debian/Ubuntu Linux.\n\n# Installing PHP 8 on Debian/Ubuntu Linux\n\nThe\
    \ best way to install PHP 8 is via the available set of pre-compiled binaries.\
    \ Newer PHP versions tend to be made available much later than their release date,\
    \ and PHP 8 is no exception. In this case, it's recommended that you resort to\
    \ using a (Personal Package Archive(PPA). The PPA hosted at https://launchpad.net/~ondrej\
    \ is the most extensive and widely used.\n\nIf you want to simulate the following\
    \ steps on your own computer, run an Ubuntu Docker image with PHP 7.4 pre-installed\
    \ using this command:\n\n```\ndocker run -it \\\n  unlikelysource/ubuntu_focal_with_php_7_4:latest\
    \ /bin/bash\n```\n\nIn order to install PHP 8 on Debian or Ubuntu Linux, open\
    \ a command shell onto the production server (or demo container), and, as the\
    \ root user, proceed as follows. Alternatively, if root user access isn't available,\
    \ preface each command shown with sudo.\n\nFrom the command shell, to install\
    \ PHP 8, proceed as follows:\n\n+   1. Update and upgrade the current set of packages\
    \ using the apt utility. Any package manager can be used; however, we show the\
    \ use of apt to maintain consistency between the installation steps covered here:\n\
    +   2. Add the Ondrej PPA repository to your apt sources:\n+   3. Install PHP\
    \ 8. This installs only the PHP 8 core and basic extensions:\n\n```\napt update\n\
    apt upgrade\n```\n\n```\nadd-apt-repository ppa:ondrej/php\n```\n\n```\napt install\
    \ php8.0\n```"
  merge: -1
  img_proc: true
- pgno: 458
  md: '4. Use the following command to scan the repository for additional extensions
    and use apt to install them as needed:


    ```

    apt search php8.0-*

    ```


    5. Do a PHP version check to ensure you''re now running PHP 8:


    ```

    php --version

    ```


    Here is the version check output:


    ```

    root@ec873e16ee93:/# php --version

    PHP 8.0.7 (cli) (built: Jun  4 2021 21:26:10) ( NTS )

    Copyright (c) The PHP Group

    Zend Engine v4.0.7, Copyright (c) Zend Technologies

    with Zend OPcache v8.0.7, Copyright (c), by Zend Technologies

    ```


    Now that you have a basic idea of how a PHP 8 installation might proceed, let''s
    have a look at how to switch between the current version and PHP 8. For the purposes
    of illustration, we assume that PHP 7.4 is the current PHP version prior to the
    PHP 8 installation.


    # Switching between PHP versions in Debian and Ubuntu Linux


    If you check to see where PHP is located, you will note that PHP 7.4, the earlier
    version, still exists following the PHP 8 installation. You can use whereis php
    for this purpose. The output on our simulation Docker Ubuntu container appears
    as follows:


    ```

    root@ec873e16ee93:/# whereis php

    php: /usr/bin/php /usr/bin/php8.0 /usr/bin/php7.4 /usr/lib/php /etc/php /usr/share/php7.4-opcache
    /usr/share/php8.0-opcache /usr/share/php8.0-readline /usr/share/php7.4-readline
    /usr/share/php7.4-json /usr/share/php8.0-common /usr/share/php7.4-common

    ```


    As you can see, we now have both the 7.4 and 8.0 versions of PHP installed. To
    switch between the two, use this command:


    ```

    update-alternatives --config php

    ```'
  merge: -1
  img_proc: true

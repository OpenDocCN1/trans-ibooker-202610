- pgno: 228
  md: '# Learning about constants usage in PHP 8


    One of the truly outrageous capabilities of PHP prior to version 8 was the ability
    to define *case-insensitive* constants. In the beginning, when PHP was first introduced,
    many developers were writing lots of PHP code with a notable absence of any sort
    of coding standard. The objective at the time was just to *make it work.*


    In line with the general trend toward enforcing good coding standards, this ability
    was deprecated in PHP 7.3 and removed in PHP 8. A backward-compatible break might
    appear if you are using define() with the third parameter set to TRUE.


    The example shown here works in PHP 7, but not entirely in PHP 8:


    ```

    // /repo/ch06/php7_constants.php

    define(''THIS_WORKS'', ''This works'');

    define(''Mixed_Case'', ''Mixed Case Works'');

    define(''DOES_THIS_WORK'', ''Does this work?'', TRUE);

    echo __LINE__ . '':'' . THIS_WORKS . "\n";

    echo __LINE__ . '':'' . Mixed_Case . "\n";

    echo __LINE__ . '':'' . DOES_THIS_WORK . "\n";

    echo __LINE__ . '':'' . Does_This_Work . "\n";

    ```


    In PHP 7, all lines of code work as written. Here is the output:


    ```

    root@php8_tips_php7 [ /repo/ch06 ]# php php7_constants.php

    7:This works

    8:Mixed Case Works

    9:Does this work?

    10:Does this work?

    ```


    Please note that the third argument of define() was deprecated in PHP 7.3. Accordingly,
    if you run this code example in PHP 7.3 or 7.4, the output is identical with the
    addition of a Deprecation notice.


    In PHP 8, however, quite a different result is produced, as shown here:


    ```

    root@php8_tips_php8 [ /repo/ch06 ]# php php7_constants.php

    PHP Warning: define(): Argument #3 ($case_insensitive) is ignored since declaration
    of case-insensitive constants is no longer supported in /repo/ch06/php7_constants.php
    on line 6

    7:This works

    8:Mixed Case Works

    ```'

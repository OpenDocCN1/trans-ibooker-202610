- pgno: 240
  md: 'In PHP 8, arithmetic operations are given precedence over concatenation. The
    concatenate operator demotion now places it below the bit shift operators (<<
    and >>). There is a potential backward-compatible break in any place where you
    don''t use parentheses to clearly define mixed arithmetic and concatenate operations.


    This change, in itself, will not throw an Error or generate Warnings or Notices,
    and thereby presents the potential for a hidden code break.


    > **Tip**

    > For more information on the reasoning for this change, refer to the following
    link:

    > https://wiki.php.net/rfc/concatenation_precedence


    The following example most clearly shows the effect of this change:


    ```

    echo ''The sum of 2 + 2 is: '' . 2 + 2;

    ```


    Here is the output of this simple statement in PHP 7:


    ```

    root@php8_tips_php7 [ /repo/ch06 ]#

    php -r "echo ''The sum of 2 + 2 is: '' . 2 + 2;"

    PHP Warning: A non-numeric value encountered in Command line code on line 1

    2

    ```


    In PHP 7, because the concatenate operator has equal precedence over the addition
    operator, the string The sum of 2 + 2 is: is first concatenated with the integer
    value 2. The new string is then type juggled to an integer, generating a Warning.
    The value of the new string is evaluated at 0, which is then added to integer
    2, producing the output of 2.


    In PHP 8, however, the addition takes place first, after which the result is concatenated
    with the initial string. Here is the result running in PHP 8:


    ```

    root@php8_tips_php8 [ /repo/ch06 ]#

    php -r "echo ''The sum of 2 + 2 is: '' . 2 + 2;"

    The sum of 2 + 2 is: 4

    ```


    As you can see from the output, the result is much closer to human expectations!'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'One more illustration should drive home the differences demoting the concatenate
    operator can make. Have a look at this line of code:


    ```

    echo ''1'' . ''11'' + 222;

    ```


    Here is the result running in PHP 7:


    ```

    root@php8_tips_php7 [ /repo/ch06 ]#

    php -r "echo ''1'' . ''11'' + 222;"

    333

    ```


    PHP 7 performs the concatenation first, producing a string, 111. This is type
    juggled and added to integer 222, resulting in a final value integer, 333. Here
    is the result running in PHP 8:


    ```

    root@php8_tips_php8 [ /repo/ch06 ]#

    php -r "echo ''1'' . ''11'' + 222;"

    1233

    ```


    In PHP 8, the second string, 11, is type juggled and added to integer 222, producing
    an interim value, 233. This is type juggled to a string and prepended with 1,
    resulting in a final string value of 1233.


    Now that you are aware of changes to arithmetic, bitwise, and concatenation operations
    in PHP 8, let''s have a look at a new trend introduced in PHP 8: locale independence.


    # Taking advantage of locale independence


    In versions of PHP prior to PHP 8, several string functions and operations were
    tied to the locale. The net effect was that numbers were internally stored differently
    depending on the locale. This practice introduced subtle inconsistencies that
    were extremely difficult to detect. After reviewing the material presented in
    this chapter, you will be in a better position to detect potential application
    code changes following a PHP 8 upgrade, thereby avoiding application failure.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Understanding the problems associated with locale dependence


    The unfortunate side effect of locale dependence in earlier PHP versions was inconsistent
    results when typecasting from float to string and then back again. Inconsistencies
    were also seen when a float value was concatenated to a string. Certain optimizing
    operations performed by OpCache resulted in the concatenation operation occurring
    before the locale had been set, yet another way in which inconsistent results
    might be produced.


    In PHP 8, vulnerable operations and functions are now locale-independent. What
    this means is that all float values are now stored using a period as the decimal
    separator. The default locale is no longer inherited from the environment by default.
    If you need the default locale to be set, you must now explicitly call setlocale().


    # Reviewing functions and operations affected by locale independence


    Most PHP functions are not affected by the switch to locale independence for the
    simple reason that locale is irrelevant to that function or extension. Furthermore,
    most PHP functions and extensions are already locale-independent. Examples include
    the PDO extension, along with functions such as var_export() and json_encode(),
    and the printf() family.


    Functions and operations affected by locale independence include the following:


    +   - `(string) $float`

    +   - `strval($float)`

    +   - `print_r($float)`

    +   - `var_dump($float)`

    +   - `debug_zval_dump($float)`

    +   - `settype($float, "string")`

    +   - `implode([$float])`

    +   - `xmlrpc_encode($float)`'
  merge: -1
  img_proc: true
- pgno: 243

    socket_import_stream() <br> socket_addrinfo_connect() <br> socket_addrinfo_bind()
    <br> socket_wsprotocol_info_import() <br> socket_addrinfo_lookup() | Socket <br>
    Socket <br> Socket <br> Socket <br> Socket <br> Socket <br> Socket <br> array
    of AddressInfo |

    | cURL | curl_init() <br> curl_multi_init() <br> curl_share_init() | CurlHandle
    <br> CurlMultiHandle <br> CurlShareHandle |

    | Enchant | enchant_broker_init() <br> enchant_broker_request_dict() <br> enchant_broker_request_pwl_dict()
    | EnchantBroker <br> EnchantDictionary <br> EnchantDictionary |

    | GD | imagecreate*() | GdImage |

    | OpenSSL | openssl_x509_read() <br> openssl_csr_sign() <br> openssl_csr_new()
    <br> openssl_pkey_new() | OpenSSLCertificate <br> OpenSSLCertificate <br> OpenSSLCertificateSigningRequest
    <br> OpenSSLAsymmetricKey |

    | Semaphore | msg_get_queue() <br> sem_get() <br> shm_attach() | SysvMessageQueue
    <br> SysvSemaphore <br> SysvSharedMemory |

    | Shared Memory | shmop_open() | Shmop |

    | XML Parser | xml_parser_create() <br> xml_parser_create_ns() | XMLParser <br>
    XMLParser |

    | Zlib | inflate_init() <br> deflate_init() | InflateContext <br> DeflateContext
    |


    Table 7.1 – PHP 8 resource-to-object migration


    Table 7.1 serves as a valuable guide to functions that now produce objects rather
    than resources. Consult this table before you migrate any existing applications
    to PHP 8. The next section gives you a detailed look at a potential backward-compatible
    code break and guidelines on how to adjust problematic code, before moving on
    to the benefits.


    # Potential code break involving is_resource()


    A problem you might face is that code written prior to PHP 8 assumes the functions
    listed in Table 7.1 return a resource. Accordingly, clever developers were in
    the habit of using is_resource() as a test to see if a connection was successfully
    established.


    Although this was an extremely sensible way to check, this technique now introduces
    a backward-compatible code break after a PHP 8 upgrade. The following example
    demonstrates this issue.'

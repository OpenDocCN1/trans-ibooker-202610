- pgno: 58
  md: "Here is how that might appear:\n\n1. First, we define a Test class with protected\
    \ properties, as follows:\n\n```\n```php\n// /repo/ch01/php7_prop_reduce.php\n\
    declare(strict_types=1);\nclass Test {\n    protected $id = 0;\n    protected\
    \ $token = 0;\n    protected $name = '';\n```\n```\n\n2. Next, we define a series\
    \ of get and set methods to control access to the protected properties, as follows:\n\
    \n```\n```php\n    public function getId() { return $this->id; }\n    public function\
    \ setId(int $id) { $this->id = $id; }\n    public function getToken() { return\
    \ $this->token; }\n    public function setToken(int $token) {\n        $this->token\
    \ = $token;\n    }\n    public function getName() {\n        return $this->name;\n\
    \    }\n    public function setName(string $name) {\n        $this->name = $name;\n\
    \    }\n}\n```\n```\n\n3. We then use the set methods to assign values, as follows:\n\
    \n```\n```php\n$test = new Test();\n$test->setId(111);\n$test->setToken(999999);\n\
    $test->setName('Fred');\n```\n```"
  merge: -1

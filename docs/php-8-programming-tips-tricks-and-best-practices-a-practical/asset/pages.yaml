    # Summary


    In this chapter, you learned the difference between conventional synchronous programming
    and asynchronous programming. Key terms such as event loops, timers, promises,
    and channels were covered. This knowledge gives you the ability to determine when
    a block of code is written using the asynchronous programming model, and how to
    rewrite portions of existing synchronous model applications to take advantage
    of asynchronous features.


    You then learned about the Swoole extension and how it can be applied to existing
    application code to achieve performance improvements. You also learned about a
    number of other frameworks and extensions that operate in an asynchronous manner.
    You reviewed concrete code examples and now have a headstart on writing asynchronous
    code.


    In the last section, you were introduced to PHP 8.1 fibers. You then reviewed
    a code example showing you how to create cooperative multitasking functions and
    class methods using PHP 8.1 fibers. You also saw how selected PHP async frameworks
    are able to benefit from PHP 8.1 fiber support, providing even more performance
    improvements.


    This is the last chapter in the book. We hope you have enjoyed reviewing the vast
    array of new features and benefits made available in PHP 8. You also now have
    a deeper understanding of potential traps to avoid in object-oriented and procedural
    code, as well as various changes to PHP 8 extensions. With this knowledge, not
    only are you now in a position to write better code, but you also have a solid
    plan of action that minimizes the chance of application code failure following
    a PHP 8 migration.'

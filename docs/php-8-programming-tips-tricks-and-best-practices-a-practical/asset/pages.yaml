- pgno: 139
  md: '# Do not use FFI for speed


    Because the FFI extension allows PHP direct access to C-language libraries, there
    is a temptation to believe that your PHP applications will suddenly operate blindingly
    fast, at machine-language speeds. Unfortunately, this is not the case. The FFI
    extension needs to first open the given C library and then parse and pseudo-compile
    a FFI instance before execution. The FFI extension then acts as a bridge between
    the C-library code and the PHP script.


    It might be of relief to some readers that relatively sluggish FFI extension performance
    is not limited to PHP 8. Other languages suffer the same throttling effect when
    using their own FFI implementations. There''s an excellent performance comparison,
    based upon the *Ary 3 benchmark*, available here: https://wiki.php.net/rfc/ffi#php_ffi_performance.


    If you have a look at the table shown on the web page just referenced, you''ll
    see that the Python FFI implementation performed the benchmark in 0.343 seconds,
    whereas running the same benchmark using only native Python code executed in 0.212
    seconds.


    Looking at the same table, the PHP 7.4 FFI extension ran the benchmark in 0.093
    seconds (30 times faster than Python!), whereas the same benchmark running with
    just native PHP code executed in 0.040 seconds.


    The next logical question is: *Why should you use the FFI extension at all?* This
    is covered in the next section.


    # Why use the FFI extension?


    The answer to the preceding question is simple: this extension is primarily designed
    for rapid **PHP extension prototyping**. PHP extensions are the lifeblood of the
    language. Without extensions, PHP is *just another programming language*.


    When senior-level developers first embark upon a programming project, they need
    to determine the best language for the project. One key factor is how many extensions
    are available and how actively these are maintained. There is generally a direct
    correlation between the number of actively maintained extensions and the long-term
    success potential of a project using that language.


    So, if there''s a way to speed up extension development, the long-term viability
    of the PHP language itself is improved. The value the FFI extension brings to
    the PHP language is its ability to test an extension prototype directly in a PHP
    script without having to go through the entire compile-link-load-test cycle.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'Another use case for the FFI extension, outside of rapid prototyping, is a
    way to allow PHP direct access to obscure or proprietary C code. An example of
    this would be the custom C code written to control factory machines. In order
    to have PHP run the factory, the FFI extension can be used to bind PHP directly
    to the C libraries controlling the various machines.


    Finally, another use case for this extension is to use it to preload C libraries,
    potentially reducing memory consumption. Before we show usage examples, let''s
    have a look at the FFI class and its methods.


    # Examining the FFI class


    As you learned in this chapter, not every developer has a need to use the FFI
    extension. Having direct experience with the FFI extension deepens your understanding
    of the internals of the PHP language, and this deepened understanding can have
    a beneficial impact on your career as a PHP developer: it''s quite possible that
    at some point in the future, you will be employed by a company that has developed
    a custom PHP extension. Knowing how to operate the FFI extension in this situation
    allows you to develop new features for a custom PHP extension, as well as helping
    you to troubleshoot extension problems.


    The FFI class consists of 20 methods that fall into four broad categories, outlined
    as follows:


    +   - **Creational**: Methods in this category create instances of classes available
    from the FFI extension **application programming interface** (API).

    +   - **Comparison**: Comparison methods are designed to compare C data values.

    +   - **Informational**: This set of methods gives you metadata on C data values,
    including size and *alignment*.

    +   - **Infrastructural**: Infrastructural methods are used to carry out logistical
    operations such as copying, populating, and releasing memory.


    > Tip

    > The complete FFI class is documented here: https://www.php.net/manual/en/class.ffi.php.


    Interestingly, all FFI class methods can be called in a static manner. It''s now
    time to take a dive into the details and usage of the class associated with FFI,
    starting with the *creational* methods.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Working with FFI creational methods


    The FFI methods that fall into the creational category are designed to produce
    either FFI instances directly or instances of classes provided by the FFI extension.
    When working with C functions made available through the FFI extension, it''s
    important to recognize that you cannot directly pass native PHP variables into
    the function and expect it to work. The data must first be either created as a
    FFI data type or imported into a FFI data type, before the FFI data type can be
    passed into the C function. In order to create a FFI data type, use one of the
    functions summarized in Table 4.1, shown here:


    | FFI Method | Returns | Notes |

    |---|---|---|

    | `arrayType()` | `FFI\CType` | Produces a C array. The first argument is the
    data type produced by a call to `FFI::type()`. The second argument is an array
    representing the dimensions of the array. |

    | `cdef()` | `FFI` | As an argument you must provide a C language code block.
    The FFI instance returned provides a bridge between the PHP program and the C
    language library. |

    | `new()` | `FFI\CData` | Produces a native C data structure. If the first argument
    is a string, it must be a valid C type. Otherwise, supply an `FFI\CType` object
    as the first argument. |

    | `scope()` | `FFI` | Creates an FFI instance based upon *pre-loaded* C declarations.
    |

    | `string()` | `string` | Returns a native PHP string from an `FFI\CData` instance
    consisting of given number of bytes. |

    | `type()` | `FFI\CType` | Creates an `FFI\CType` object that can be used with
    other FFI extension classes. |


    Table 4.1 – Summary of FFI class creational methods


    Both the cdef() and scope() methods produce a direct FFI instance, while the other
    methods produce object instances that can be used to create a FFI instance. string()
    is used to extract a given number of byes from a native C variable. Let''s have
    a look at creating and using FFI\CType instances.


    # Creating and using FFI\CType instances


    It''s extremely important to note that once the FFI\CType instance has been created,
    do not simply assign a value to it as if it were a native PHP variable. Doing
    so would simply overwrite the FFI\CType instance due to the fact that PHP is loosely
    typed. Instead, to assign a scalar value to a FFI\CType instance, use its cdata
    property.'
  merge: -1
  img_proc: true

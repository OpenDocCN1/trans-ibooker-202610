  \ 642\n653. 643\n654. 644\n655. 645\n656. 646\n\n# 主编作者\n\n![](img/ffirsuf001.png)\n\
  \n**ARTHUR DEANE, CISSP, CCSP**，是 Capital One Financial 的高级总监，负责信用卡部门的信息安全活动。在加入\
  \ Capital One 之前，Arthur 在 Google、Amazon 和 PwC 担任过安全领导职务，并在美国联邦政府担任过多个安全工程和咨询职务。\n\
  \nArthur 是美国大学的兼职教授，也是 Howard University 计算机科学顾问委员会的成员。他拥有罗切斯特理工学院（RIT）的电气工程学士学位和马里兰大学的信息安全硕士学位。Arthur\
  \ 也是 *CCSP for Dummies* 的作者。\n\n![](img/ffirsuf002.png)\n\n**AARON KRAUS, CISSP,\
  \ CCSP**，是一名信息安全专业人士，在安全风险管理、审计和网络安全教学方面拥有超过 15 年的经验。他曾在美国联邦政府民用机构、金融服务、保险和科技初创公司等行业担任安全和合规领导职务。\n\
  \nAaron 是 Learning Tree International 的课程作者、讲师和网络安全课程主任，最近教授了官方 (ISC)² CISSP CBK\
  \ 复习研讨会。他是 *The Official (ISC)*^(*2*) *Guide to the CCSP CBK, 3rd Edition* 的合著者，并担任多本\
  \ Wiley 出版物的技术编辑，包括 *(ISC)*^(*2*) *CCSP Certified Cloud Security Professional Official\
  \ Study Guide, 2nd Edition*；*CCSP Official (ISC)*^(*2*) *Practice Tests*；*The Official\
  \ (ISC)*^(*2*) *Guide to the CISSP CBK Reference, 5th Edition*；和 *(ISC)*^(*2*) *CISSP\
  \ Certified Information Systems Security Professional Official Practice Tests, 2nd\
  \ Edition*。\n\n# 技术审阅者\n\n![](img/ffirsuf003.png)\n\n\n\n\n\n**MICHAEL S. WILLS,\
  \ CAMS, CISSP, SSCP,** 是 Embry-Riddle Aeronautical University – Worldwide 商学院应用与创新信息技术助理教授，在那里他继续从事网络安全和信息保障方面的研究生和本科教学与研究。\n\
  \nMike 还曾担任英国联合情报委员会、司法部和国防科学与技术实验室的科学与技术政策顾问，帮助他们就从密码学和虚拟世界，到蓬勃发展的监控社会，再到大规模破坏武器（而不仅仅是“毁灭”）的扩散及其对全球、区域、国家和个人安全的影响等议题形成运营和政策共识。有一段时间，这使他有时被称为英国关于外层空间法的非驻地专家。\n\
  \nMike 通过为 (ISC)² 编写、编辑和更新书籍、学习指南和课程材料，支持了 (ISC)² 的工作，涵盖其 SSCP 和 CISSP 项目。他撰写了 *SSCP\
  \ Official Study Guide, 2nd Edition*（Sybex, 2019），随后很快撰写了 *SSCP Official Common\
  \ Book of Knowledge, 5th Edition*。他是 (ISC)² 2021 年官方 CISSP 和 SSCP 培训材料更新的首席作者。Mike\
  \ 还为数字身份和网络欺诈检测与预防的多个行业圆桌会议和白皮书做出贡献，并曾就这些及相关主题担任 ACAMS 的小组讨论嘉宾和网络研讨会演讲者。\n\n# 前言\n\
  \n![](img/flastuf001.png)\n\n获得全球认可的 CISSP^® 安全认证是提升职业生涯并证明您在广泛领域内对网络安全概念的深入了解的可靠途径。无论您是拿起这本书来补充参加考试的准备，还是作为现有的\
  \ CISSP 将其用作桌面参考，您都会发现 *The Official (ISC)*^(*2*®) *CISSP^® CBK^® Reference* 是了解\
  \ CISSP CBK 八个领域所涵盖安全概念的完美入门读物。\n\nCISSP 是信息安全市场中最受全球认可的认证。它立即表明持证人拥有设计、工程、实施和管理信息安全项目和团队以抵御日益复杂的攻击所需的先进网络安全技能和知识。它还传达了对\
  \ (ISC)² 网络安全专家制定的最佳实践、政策和程序的遵守。\n\n作为信息安全教育和认证领域的公认领导者，(ISC)² 推动全球信息安全专业人员的发展。作为拥有\
  \ (ISC)² 会员所有福利的 CISSP，您是全球超过 161,000 名认证专业人士网络的一部分，他们正在努力激励一个安全可靠的网络世界。\n\n* CISSP\
  \ CBK* 汲取自全面、最新的全球知识体系，为您提供有关安全专业人员应熟悉的技能、技术和最佳实践的宝贵见解，包括信息技术生态系统中不同要素如何相互作用。\n\n\
  如果您是有经验的 CISSP，您会发现 *CISSP CBK* 的这一版是不可或缺的参考资料。如果您仍在积累加入 CISSP 行列所需的经验和知识，*CISSP\
  \ CBK* 是一次深入探索，可用于补充您的学习。\n\n作为全球最大的非营利认证信息安全专业人员会员组织，(ISC)² 认识到有必要验证的不仅是信息安全能力，还包括构建、管理和领导安全组织的能力。本综合汇编由主题专家团队撰写，以结构化格式涵盖所有\
  \ CISSP 目标和子目标，并为每个目标提供通用实践、通用词汇表以及对广泛接受的计算标准和案例研究的引用。\n\n从未有过如此多的机会让敬业的专业人士推进职业生涯并激励一个安全可靠的网络世界。*CISSP\
  \ CBK* 将成为您保护组织的常伴之物，并将在未来多年为您服务。\n\n诚挚地，\n\n![An illustration of the Signature\
  \ of Clar Rosso.](img/flastg001.png)\n\nClar Rosso\n\nCEO, (ISC)²\n\n# 引言\n\nCERTIFIED\
  \ INFORMATION SYSTEMS Security Professional（CISSP）认证标识了一名在广泛的安全实践和原则方面展示了技能、知识和能力的专业人士。该考试涵盖八个实践领域，这些领域被编纂在\
  \ CISSP 通用知识体系（CBK）中。CBK 提出了 CISSP 可在其日常角色中用于识别和管理数据和信息系统安全风险的主题，其基础建立在机密性、完整性、可用性、不可否认性和真实性（CIANA）等基本安全概念之上，以及隐私和安全（CIANA+PS）。可以为数据和系统实施多种控制，其目标是保护或减轻对这些基础原则的每个方面的安全风险。\n\
  \n全球专业人士进入信息安全的方式多种多样，每个候选人的经验必须结合认证的全球覆盖范围带来的行业和地区实践和视角的差异。对于大多数安全从业者来说，获得 CISSP\
  \ 需要学习和掌握新学科，而且专业人员不太可能在日常工作中涉及全部八个领域。CISSP CBK 是安全知识的基线标准，帮助安全从业者应对新的和不断演变的风险，本指南提供易于参考的信息，帮助从业者应用安全主题和原则。该基线必须与读者的自身经验和读者组织的独特运营环境相联系才能有效。安全变化的快速步伐也要求从业者持续保持知识，因此\
  \ CISSP 证书持有者还期望通过继续教育来保持知识。像本指南这样的参考资料，以及行业会议、网络研讨会和研究等其他内容来源，对于保持这些知识至关重要。\n\n\
  CBK 中呈现的领域是循序渐进的，从 Chapter 1，“Security and Risk Management” 中的基本安全和风险管理概念的基础开始，以及在\
  \ Chapter 2，“Asset Security” 中识别、估值和应用适当的资产安全风险缓解措施的基础主题。通过应用架构和工程概念，可以将安全应用于复杂的技术环境，这些概念在\
  \ Chapter 3，“Security Architecture and Engineering” 中呈现。Chapter 4，“Communication\
  \ and Network Security” 详细说明了通信网络面临的关键风险以及其发挥的关键防御作用，而 Chapter 5，“Identity and Access\
  \ Management” 涵盖了识别用户（人类和非人类）并控制其对系统、数据和其他资源访问的关键实践。一旦安全计划设计完成，收集有关其有效性的信息并对其进行评估至关重要，这在\
  \ Chapter 6，“Security Assessment and Testing” 中有所涉及，并保持整个事务的运行——也称为安全运营或 SecOps，这在\
  \ Chapter 7，“Security Operations” 中有所涉及。最后，软件发挥的重要作用在 Chapter 8，“Software Development\
  \ Security” 中得到解决，该章节涵盖了安全开发软件的原则以及对软件和开发环境的风险和威胁。以下以更详细的方式为每个章节提供概述。\n\n## 安全与风险管理\n\
  \n\n\n\n\nCISSP CBK 的基础是对数据及其所处理的 information 系统的风险评估和管理。安全与风险管理域介绍了构建风险管理计划所需的\
  \ CIANA+PS 基础概念。利用这些概念，安全从业人员可以构建治理、风险和合规（GRC）计划，使组织能够设计实施安全控制所需的治理体系。这些控制应解决组织面临的风险以及任何必要的法律和监管合规义务。\n\
  \n风险管理原则必须贯穿组织的整个运营，因此业务连续性（BC）、人员安全和供应链风险管理等主题也在本域中介绍。确保在中断情况下仍能继续运营支持可用性目标，而妥善设计的人员安全控制则需要培训计划以及完善记录的政策和其他安全指导。\n\
  \n本域中提出了一个关键概念：（ISC）² 专业道德准则。所有 CISSP 候选人必须在认证流程中同意受该准则约束，而持有证书者若违反准则将面临包括吊销证书在内的处罚。无论从业人员从事安全领域的哪个方向，遵守道德准则以维护职业的完整性对于建立对安全职业的信任都至关重要。\n\
  \n## 资产安全\n\n资产是组织用于创造价值的任何事物，包括思想、流程、信息和计算硬件。对资产进行分类和分类使组织能够优先分配有限的安全资源，以实现成本与效益的适当平衡，本域介绍了资产估值、分类和分类以及资产处理的重要概念，以便根据资产价值应用适当的保护。资产的价值决定了其所需的保护级别，这通常以安全基线或资产所有者必须满足的合规义务的形式表达。\n\
  \nCISSP 证书持有者将花费大量时间关注数据和信息安全问题。本域介绍了数据生命周期，以提供确定数据安全要求的明确阶段。保护始于定义处理数据的角色和流程，一旦数据创建后，必须遵循这些流程。这包括在创建、使用、归档以及不再需要时的最终销毁期间管理数据，并侧重于数据的三种主要状态：使用中、传输中和静态。\n\
  \n对于许多组织而言，处理敏感数据将涉及保护特定数据类型（如个人身份信息（PII）或与支付卡相关的交易数据）的法律或监管义务。支付卡数据受支付卡行业（PCI）理事会监管，而\
  \ PII 通常需要保护以遵守欧盟通用数据保护条例（EU GDPR）等区域或地方法律。两个合规框架都规定了组织在收集、处理和使用受监管数据时必须满足的具体保护义务。\n\
  \n## 安全架构与工程\n\n安全架构与工程域涵盖了在各种系统上实施和管理安全控制的相关主题。介绍了用于构建安全计划的安全设计原则，例如安全默认值、零信任和隐私设计。本域还涵盖了常见的[content]\n\
  \nCISSP CBK 的基础是对数据及其所处理的 information 系统的风险评估和管理。安全与风险管理域介绍了构建风险管理计划所需的 CIANA+PS\
  \ 基础概念。利用这些概念，安全从业人员可以构建治理、风险和合规（GRC）计划，使组织能够设计实施安全控制所需的治理体系。这些控制应解决组织面临的风险以及任何必要的法律和监管合规义务。\n\

- '# DOMAIN 5


  ## Identity and Access Management


  `IDENTITY AND ACCESS MANAGEMENT` (`IAM` or `IDAM`) 是信息安全的基础。控制对资源的访问需要能够识别并验证请求访问的实体，并使其对其采取的行动负责。实体可以是用户、系统、应用程序或流程，IAM
  由四个基础要素组成：识别、身份验证、授权和问责 (`IAAA`)。


  本章确定了每个 `IAAA` 要素以及它们如何配置和执行，这构成了许多访问控制系统的基础。对资产的物理和逻辑访问控制通常始于建立身份并为用户提供凭据，然后在每次请求访问时出示并进行身份验证。时不时地，这些凭据必须进行审查和更新，并在其使用寿命结束时退役。创建和退役访问凭据被称为
  *provisioning* 和 *deprovisioning*，而凭据管理流程可以被视为一个生命周期。


  IAM 涉及组织安全计划的几乎每个方面，因此认证信息系统安全专业人员 (`CISSP`) 最好确保存在足够的程序和技术系统来支持访问控制安排。这从了解身份信息的要求、选择和实施满足这些要求的系统开始，并确保像访问审查这样的管理控制支持技术控制以保持系统的安全。


  ## CONTROL PHYSICAL AND LOGICAL ACCESS TO ASSETS


  物理访问控制对几乎所有读者来说都很熟悉——门、窗帘、围栏等是控制对房屋、学校和办公楼等建筑物物理访问的常见日常物品。逻辑访问控制同样无处不在，尽管它们对未经训练的眼睛来说并不总是那么明显。需要密码、个人识别码
  (`PIN`) 或共享对称密钥才能访问的系统都是逻辑访问控制的例子。逻辑和物理访问措施均旨在限制哪些用户或系统可以访问特定资产，如系统中的数据或存放在保险箱中的贵重物品。


  有各种访问控制方法，选择正确的组合需要安全从业者了解组织的资产和控制访问的优先事项。例如，贵重物理资产和对强保密性的要求需要强有力的物理访问控制，而对数据完整性有严格要求的信息系统可能需要应用逻辑等技术控制来满足要求。


  访问控制系统通常对访问对象的主题实施控制。*subject* 可以是用户或程序，而 *object* 是主题试图访问的任何东西，如文件、应用程序、设施或数据库。通过这些系统控制访问对于执行保密性、完整性和不可否认性等安全概念至关重要。


  ### Access Control Definitions


  访问控制模型使用标准术语集来讨论各种概念。以下内容在本章其余部分中使用：


  *   **Objects** 是需要访问控制的资产。常见的对象包括信息，如文件或数据集，以及系统对象，如计算资源和网络。物理访问控制模型将设施作为对象处理，例如办公楼、计算机房和敏感信息处理设施。所有对象都有一个共同的需求，即保护基本安全属性，包括保密性、完整性、可用性、不可否认性和真实性
  (`CIANA`)。


  *   **Subjects** 可以是人类用户或非人类实体，如系统、进程和设备。主题需要访问对象，如文件、系统和设施，访问控制的基本实践定义了此类访问如何被授予、使用和监控。


  *   **Access** 是主题被允许对对象执行或做的任何事情。例如，人类用户可以被允许或拒绝进入设施，系统用户可以被允许读取访问但被拒绝对文件的写入和更新访问，非人类用户如系统进程可以根据所涉对象的敏感级别被允许或拒绝访问特定数据对象。与控制访问相关的[content]


  许多与第三方连接相关的考虑与本章“远程访问”部分以及本书其余部分所涵盖的主题一致。你应遵循最佳实践，例如传输中加密、强访问控制程序以及强大的电子邮件过滤。此外，对任何第三方连接进行持续监控应成为标准做法，以识别新的威胁、意外行为或偏离已商定
  SLA 的情况。


  与第三方连接相关的风险主要类别之一是合规风险。作为你和你的客户数据的所有者，你的组织有责任了解外部方如何管理和保护你的数据。你必须确认他们的控制措施符合保护数据的法律和监管义务，包括（但不限于）托管和处理数据的服务器和系统的地理位置方面的考虑。合规报告，例如
  `SOC2` 报告，可以作为评估与第三方连接相关的安全和合规风险的良好起点，而 SLA 再次在追究第三方责任方面发挥关键作用。


  ## SUMMARY


  通信和网络安全过去曾局限于保护组织物理范围内的资产和信息。今天，企业边界已发生了巨大变化。公司可能在家里、咖啡店或酒店大堂拥有员工。公司的边界远远超出了其物理建筑的范围，因此用于在公共和私人通信网络和媒体上传输时提供保密性、完整性和可用性的结构、传输方法、传输格式和安全方法已发生变化以适应这些扩展的边界。


  本章包含诸如电话、数据通信、OSI 模型的各个层以及传输媒体和协议等基本概念。了解通信技术接口的历史发展、互操作性以及利用安全控制使一切协同工作并保护信息的高级方法，对于网络安全专业人员来说是无价的。


  安全专业人员需要培养改进和管理远程访问、虚拟化和云服务以实现新业务和工作场所模式的技能。伴随着这些信息技术变革而来的有安全挑战和机遇。继续支撑适当安全管理的基础概念之一是，没有单一解决方案能够满足所有差距。安全专业人员必须理解描述纵深防御的分层解决方案方法。例如，访问控制、身份验证和加密协同工作以扩展企业计算边界、允许员工随时随地工作并降低提供信息安全的成本。安全攻击的性质也将继续演变。在本章中，我们讨论了
  `DDoS`、`MITM` 和网络钓鱼等几种攻击类型，以强调信息安全作为一个职业的重要性及其动态性。随着威胁的变化，我们遏制它们的方法也必须随之改变。



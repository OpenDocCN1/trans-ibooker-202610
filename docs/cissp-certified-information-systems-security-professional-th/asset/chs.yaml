  \ 4.3 The TCP/IP reference model](img/c04f003.png)\n\n**FIGURE 4.3 The TCP/IP reference\
  \ model**\n\nTCP/IP 模型中的每一层都对应于七层 OSI 模型中的一个或多个层。有关比较，请参阅 Figure 4.4。\n\n![FIGURE\
  \ 4.4 Comparison of the OSI and TCP/IP models](img/c04f004.png)\n\n**FIGURE 4.4\

  (`PIN`) 或共享对称密钥才能访问的系统都是逻辑访问控制的例子。逻辑和物理访问措施均旨在限制哪些用户或系统可以访问特定资产，如系统中的数据或存放在保险箱中的贵重物品。


  有各种访问控制方法，选择正确的组合需要安全从业者了解组织的资产和控制访问的优先事项。例如，贵重物理资产和对强保密性的要求需要强有力的物理访问控制，而对数据完整性有严格要求的信息系统可能需要应用逻辑等技术控制来满足要求。


  访问控制系统通常对访问对象的主题实施控制。*subject* 可以是用户或程序，而 *object* 是主题试图访问的任何东西，如文件、应用程序、设施或数据库。通过这些系统控制访问对于执行保密性、完整性和不可否认性等安全概念至关重要。


  ### Access Control Definitions


  访问控制模型使用标准术语集来讨论各种概念。以下内容在本章其余部分中使用：


  *   **Objects** 是需要访问控制的资产。常见的对象包括信息，如文件或数据集，以及系统对象，如计算资源和网络。物理访问控制模型将设施作为对象处理，例如办公楼、计算机房和敏感信息处理设施。所有对象都有一个共同的需求，即保护基本安全属性包括保密性、完整性、可用性、不可否认性和真实性
  (`CIANA`)。


  *   **Subjects** 可以是人类用户或非人类实体，如系统、进程和设备。主题需要访问对象，如文件、系统和设施，访问控制的基本实践定义了此类访问如何被授予、使用和监控。


  *   **Access** 是主题被允许对对象执行或做的任何事情。例如，人类用户可以被允许或拒绝进入设施，系统用户可以被允许读取访问但被拒绝写入和更新访问文件，非人类用户如系统进程可以根据所涉对象的敏感级别被允许或拒绝访问特定数据对象。与控制访问相关的概念包括授权，在本章中进行了讨论。


  ### Information






  信息通常是访问控制模型中的一个对象，而访问控制系统旨在根据主体提供的凭证来限制访问。最明显的例子是保护保密性——系统在授予访问权限之前会验证用户的凭证，从而防止未经授权的用户访问数据。可以使用多种模型来为此目的设计访问控制系统，并在本章后面进行讨论。


  保护信息的完整性也可以成为限制访问的目标，如果授权控制得以实施，则只有经过适当培训的用户才能进行更改。安全策略通常利用访问控制系统来同时执行保密性和完整性：只有授权用户可以访问策略，而只有特定授权用户（如特定部门的受过培训的成员）才能进行更改。如果存储策略文档的系统支持更改日志和版本历史记录，则安全概念的不可否认性也将通过访问控制系统强制执行，因为任何对文档进行更改的用户都会生成日志条目。


  识别信息访问控制的需求是安全从业人员的基本要求。并非所有信息都需要相同类型或级别的保护，并且保护特定信息的要求会随着时间的推移而变化。例如，股票所有权通常是公开信息，因为股票交易是公开信息。股票交易通常在执行前保密，这可以提供竞争优势，因此保密要求会很高。然而，一旦交易执行并公开，该需求就会发生显著变化；在这种环境中使用的任何访问控制系统都需要理解此信息生命周期，并在每个阶段确保应用充分且具有成本效益的保护。


  ### Systems


  系统是一个难以定义的术语。任何硬件、软件、人员、策略、程序和其他资源的集合都可能构成一个系统，尽管该术语通常用于讨论电子信息系统。安全从业人员必须了解其组织中使用的系统的功能和目标，以及模拟流程、纸质数据或系统的电子元素等组件，以便设计适当的身份和访问管理控制。


  系统需求可能要求多个安全目标，例如关键信息的保密性、可用性或完整性、系统本身的可用性，或系统用户的真实性和不可否认性。正确实施访问控制，特别是存在敏感数据和信息对象的的信息系统中，是
  CISSP 需要执行的基本任务。访问控制对于数据的安全和隐私至关重要，并支持 CIANA 的基本安全概念，这些概念在 Chapter 1，“Security and
  Risk Management” 中有所介绍。CIANA 概念在系统级 IAM 中常见的实现方式如下：


  * **Confidentiality** 要求系统中的信息免受未经授权的访问而保持安全。设施级别的物理访问控制将很重要，同时系统或组件级别的限制对于物理访问控制（如上锁的保险箱）和逻辑访问控制（如全盘加密
  FDE）也很重要。

  * **Integrity** 可以通过访问控制得到支持，通过防止未经授权的用户对信息进行更改。

  * **Availability** 控制和完整性控制通常共享一个共同的实现；例如，上锁的服务器机柜可防止未经授权的用户恶意或意外关闭系统。这可以防止数据丢失或损坏以及系统可用性的丧失。

  * **Authenticity** 利用 IAM 中的身份验证来证明系统中的信息、命令或其他信息是可信的。如果主体成功证明了身份，则可能对主体或其提供的任何数据的可信度做出判断。

  * **Nonrepudiation** 与真实性有共同之处。不可否认性意味着用户或系统无法否认特定操作，并且要求 IAM 系统实施足够的问责制以证明该操作是由特定主体执行的。这取决于
  IAM 系统唯一识别和验证主体的能力，以及系统操作和识别信息的日志记录。


  为电子数据和系统访问设计、实施和维护 IAM 是安全从业人员经常执行的任务。这些任务需要大量的思考和分析，因为每个组织的流程和系统都是独特的。一个主要区别是访问控制决策制定和执行的实现。


  *Centralized* IAM 管理使用专门的访问控制职能，如团队或特定部门来管理所有访问控制，这具有非常严格的监督和监控的优势。集中式 IAM 的缺点是存在单点故障。*Decentralized*
  IAM 管理将职能分解，通常将访问控制决策分配给系统或信息所有者。这可以提供更大的自由和灵活性，但潜在的缺点是执行不一致和缺乏统一监督。


  ### Devices


  设备是信息系统的组件，也是系统本身，因此它们需要充分的 IAM。用户工作站包括笔记本电脑、台式机和平板电脑，都是具有存储、处理和网络能力的完整信息系统，这些功能需要适当的如受限逻辑访问的安全控制。对云计算服务存储和处理数据的日益使用也增加了组织必须考虑的设备数量，因为这些服务可以从任何互联网连接的设备访问。


  设备 IAM 的主要关注点是确保访问仅限于授权用户。访问数据的设备类型激增导致了 IAM 挑战，例如早期智能手机仅支持四位数字 PIN 而非复杂密码。这些设备的快速发展也带来了安全优势，例如生物识别传感器（如指纹读取器和面部几何扫描仪）的商品化。这些设备的成本更低、效果更好，意味着它们可以纳入更广泛的系统，从而为多因素身份验证
  MFA 提供更多选项。


  设备有效 IAM 的一个要素是适当的端点安全。诸如端点检测和响应 EDR 等实践在 Chapter 4，“Communication and Network Security”
  和 Chapter 7，“Security Operations” 中有更详细的介绍。必须确保访问控制以尊重这些设备的安全性。例如，移动设备管理 MDM 系统中维护的资产清单应指明每个设备的拥有者、主要用户或保管人。这支持在设备受损时进行事件响应能力。






  设备在访问控制模型中既可以是对象也可以是主体。如果它们包含敏感数据或授予对敏感功能的访问权限，那么控制对设备对象的访问就很重要。设备也可以被视为主体或非人类用户；已知的
  workstation 可以通过设备指纹、数字证书、cookie 文件等进行识别。当设备尝试访问敏感对象时，这些标识符可能会被提供以对设备进行身份验证。如果使用新的、不可信的设备登录，访问控制系统应配置为在授予设备访问权限之前要求额外的身份验证，例如
  MFA。这种概念在网络访问控制（NAC）中得到应用，详见 第 4 章，它将设备视为对象并对加入网络的新设备应用额外标准。例如，用户的个人笔记本电脑可能会被置于隔离网络中，直到其补丁级别和
  EDR 软件得到验证为止。


  许多现代计算设备的可移植性也对保密性构成挑战。笔记本电脑、平板电脑、智能手机，甚至一些功能强大的台式电脑现在都足够小巧轻便，可以轻松携带。这意味着它们容易被盗、丢失，甚至在设备无人看管时在用户不知情的情况下被访问。诸如
  MDM 之类的工具可以抵消这些设备及其所含数据的风险，具有以下功能：


  * **设备保护：** 这会在每个设备上强制执行安全策略，包括密码复杂度、软件更新以及限制可以安装或使用的应用程序。EDR 软件也有助于识别可疑或恶意活动并启动额外的保护措施，如隔离、锁定或擦除设备。

  * **设备限制：** 这会识别不受支持的硬件或已被 *越狱* 的系统，后者移除了设备及其操作系统的标准限制。越狱设备也会移除制造商施加的标准保护，这可能导致未经授权的数据访问。

  * **远程锁定或擦除：** 如果设备被报告为被盗/丢失，这允许组织防止未经授权的用户获得访问权限。远程锁定可以在设备找到后恢复，而远程擦除可能会删除所有数据或使设备无法使用；它通常仅在设备无法恢复的情况下使用。

  * **容器化：** 将组织数据置于逻辑容器中可将其与设备上的其他应用程序访问隔离。这对于允许用户从个人设备访问组织资源的自带设备（BYOD）政策的组织来说是一种常见选择。对个人设备的限制可能难以执行，因此限制仅限于容器，如果用户丢失设备或离职，容器可以被锁定或擦除。


  物理访问控制是设备安全控制的关键要素。在典型的办公环境中，组织的物理访问控制为设施内的所有设备提供共享保护。便携式设备带来了挑战，因为设备通常会离开安全设施。在这种情况下，必须为便携式设备用户提供适当的政策和培训，例如绝不在公共场所无人看管，或在旅行时将设备存放在无标记的包或酒店保险箱中。


  ### 设施


  设施为其包含的所有系统、设备和信息提供共享安全，因此确保充分的保护至关重要。物理安全在讨论信息系统安全时尤为重要——如果攻击者能够获得对设备的物理访问权限，那么即使是最好的逻辑安全控制也可能不足以防止
  unwanted 数据访问。


  传统的设施物理安全措施通常遵循安全边界范式，采用分层防御，提供不断增加的安全级别。第 7 章 包含更多细节以及物理纵深防御策略如何实施的图表。本节介绍设计和支持可部署的底层
  IAM 系统的要求。


  #### 物理访问控制系统


  *物理访问控制系统*（PACSs）包括物理安全实施，如大门、围栏、旋转门、安全徽章和警卫。它们还包括操作这些控制所需的行政程序，例如警卫监控时间表、徽章要求、装卸码头程序以及访客登记和陪同。


  在设计 PACS 时，建立保护要求至关重要，因为对物理基础设施的更改比软件升级等更改更困难。必须首先确定的第一个要求是究竟谁需要访问指定的设施。计算机房或配线间等功能区域可能只需要有限、不频繁的访问，这使得物理安全实施任务更容易，因为用户群体很小。其他设施，特别是办公楼，将具有更复杂的访问要求，因为更多个人需要访问，并且访客或商业合作伙伴使用此类设施的情况可能很常见。


  一旦确定了访问要求，就可以开发和实施 PACS 设计。所选控制的复杂性必须反映所保护资产的价值——没有敏感数据或资产的设施不太可能需要 24/7 警卫和先进的入侵检测传感器。元素可能包括以下一项或多项：


  * **用户识别：** 进入或离开安全区域的人员、车辆和其他资源应被识别。这可以通过徽章、贴纸、射频识别（RFID）标签、条形码等适当方式实现。人类通常会通过身份证、贴纸或徽章进行识别，而车辆或交付物可能通过
  RFID 标签、条形码或快速响应（QR）码进行识别。

  * **设备识别：** 非人类用户可以通过多种方法在整个设施或出入口点进行跟踪，包括识别贴纸和 RFID 标签。这允许跟踪和控制进入和离开设施的资产流动，并且可以与财产和资产管理系统集成。

  * **围栏和大门**：围栏可以防止 unwanted 访问或根据设施的敏感性设计为引导人员进入受控入口点。大门提供了实施额外检查的能力，例如出示身份证或输入代码，在此进行识别和身份验证。

  * **安全门**：与大门类似，安全门提供了做出访问决策的机会——未经授权的用户被拒绝访问，而能够出示适当凭证的人则被授予访问权限。这可以通过出示某种形式的身份证件或授权令牌（如智能卡、智能手机应用程序或
  PIN 码）来完成。

  * **锁和钥匙**：尽管通常安装在大门或门上，锁也可以用于控制对单个资产的物理访问，例如文件柜中的纸质数据、存放在保险箱中的敏感笔记本电脑或容纳敏感系统的上锁服务器机柜。锁可以是模拟的，需要持有钥匙或知道代码来控制访问。数字锁可以通过要求知道唯一代码或利用生物识别技术来提供对多个用户的唯一识别。






  *   `Intrusion detection sensors`: 这些是侦查型控制措施，可以用于识别是否获得了不当访问。示例包括热（红外）、声音（声波）以及重量或压力传感器，它们可以根据体温、玻璃破碎声或入侵者走动时的移动来检测入侵者。


  *   `Turnstile or mantrap`: 转闸和单人门禁都是专门设计用来限制进入设施的速率。转闸通常一次只允许一个人通过，而单人门禁要求用户先出示一套凭证进入安全门厅，然后再出示另一套凭证才能从门厅进入主区域。这些装置可用于防范`piggybacking`，即一名用户试图在紧跟授权用户其后而不出示凭证的情况下获得访问权限。


  *   `CCTV surveillance`: 视频监控可以承担多种控制功能。摄像头的存在本身可能足以阻止或防止某些非授权访问，而捕获的画面可用于检测和应对情况。闭路电视（CCTV）画面通常需要人工审查才能发挥效果。然而，人工智能（AI）的最新进展使摄像头能够检测运动甚至特定物体如动物或人，从而实现持续监控并生成更智能的警报。


  *   `Guards`: 保安人员是最有用、最灵活但也是最昂贵的物理访问控制形式之一。与只能遵循预设响应的技术系统不同，保安人员可以动态响应、进行批判性思考，并在需要时迅速赶赴事件现场。然而，保安人员也会产生技术系统所没有的额外成本，例如福利、休假以及无法持续工作。


  设计 PACS 时还必须考虑紧急情况，因为人的生命、健康和安全始终是首要关切。PACS 在正常情况下的目标是限制物理访问；在火灾或职场暴力等紧急情况下，访问控制应设计为允许快速高效的疏散。安全门可以与火灾探测系统集成，并在火灾报警时设计为失效开启，或配备覆盖装置使门打开的同时触发警报。


  ## 设施的扩展定义


  多种因素的结合创造了组织设施构成的新定义。服务器不再在计算机房中与组织控制的桌面工作站通信，云服务提供商（CSP）和个人拥有的智能手机已成为许多组织需要保护的新的“办公室”。确保组织无法控制的资产的物理安全几乎是不可能的，因此可能需要在
  PACS 替代方案中采用补偿性控制措施。


  如在 Chapter 1 中所述，资产所有者和保管人共同承担实施适当安全措施的责任。BYOD 或用于工作目的的个人设备的用户是这些设备的所有者，而被分配使用的组织资产的保管人则是其保管人。所有作为所有者或保管人的用户都必须强制接受这些设备的适当安全程序培训。该培训应涵盖常见的安保措施，如对设备保持物理控制，绝不在无人看管时将其解锁或使其可访问，以及防止未经授权的各方访问敏感资源。


  MDM 和 MFA 可以结合起来，为远程工作增加、基于云的系统和 BYOD 带来的挑战提供强大的补偿性控制。传统上，用户及其连接的设备都被视为可信的。`zero
  trust` 的新兴范式意味着没有任何用户、设备或流程被视为可信；相反，所有访问都必须包括适当的身份验证，并且可能要求请求方满足某些标准。MFA 使组织能够对请求访问的实体获得更大的保证，而
  MDM 可用于强制执行安全策略限制，例如在用户设备上使用复杂密码或加密。


  身份联合也在推动设施定义的改变。联合身份系统中的用户不会全部属于同一组织，也不太可能在同一设施工作。除了本章后面讨论的联合身份的技术实现外，安全从业者还应确保对通过联合共享身份的任何第三方应用供应链风险管理实践。


  云服务的扩展使用也在推动 IAM 的演进。使用云服务的组织与云中数据和系统的控制权共享——CSP 始终负责物理安全和与基础设施相关的逻辑安全方面，而组织始终负责控制其在云中的数据的逻辑访问。迁移到云的组织将失去设计、实施和管理
  CSP 拥有的物理和逻辑控制的能力。


  迁移到云通常涉及显著的 IT 成本节约；CISSP 应确保风险评估能够捕捉到这种控制丧失所固有的增加风险，并确保有足够的补偿性控制措施。补偿性控制措施可能包括增加活动日志记录和监督、仅使用经批准的
  CSP 或特定 CSP 的特定服务，以及在将数据存储在云应用中之前进行额外的数据加密并由组织控制加密密钥。如果补偿性控制措施的成本大于迁移到云的成本节约，那么组织更有意义地自行托管。


  ### Applications


  对应用程序的访问必须基于健全的访问管理原则授予，例如需知原则和最小权限原则。应用程序提供对数据的访问，为其设计 IAM 策略时应从以下角度考虑访问：


  *   `Access to applications`: 并非所有用户都需要访问组织中使用的所有应用程序——销售团队成员不太可能需要访问人力资源（HR）应用程序，而人力资源团队成员不需要访问内部会计应用程序。基于角色的访问控制（RBAC）模型有助于识别常见的需知标准并授予适当但不过度的访问权限。


  *   `Access by applications to specific data`: 可以利用访问控制来强制执行应用程序之间数据流的限制。这在 MDM
  中尤其相关，其中容器化应用部署到用户的个人设备。这些应用在逻辑上与设备上的其他应用隔离，防止未受管理的未经授权应用访问组织数据。


  *   `Access within applications`: 应用程序通常提供多级用户访问，例如普通用户和超级用户或管理员访问。大型应用程序还可能包含多个数据集，如为每个项目或部门设置唯一文件夹的文档管理系统。`Granularity`
  描述了可控制访问的级别——粒度高的应用程序支持为每个用户定制对特定对象的访问，而粒度低的应用程序仅允许对应用程序及其包含的所有数据进行基本的允许/拒绝。不充分的粒度可能导致安全损失，如果用户，即使是内部的、非恶意的用户，获得了未经授权的访问。






  应用程序也可以作为访问控制系统中的主体来处理。它们是非人类用户，可以访问其他系统、应用程序和数据。这种访问通常是在没有人类用户直接监督的情况下发生的，例如按计划运行或自动运行的批处理作业。应用程序也可以是访问控制中的对象，对控制访问有各种需求。运行应用程序的能力通常允许访问数据，因此任何访问该应用程序的主体都可以访问该数据。应用程序本身也可以是一个有价值的对象，因为访问可能需要许可证。在大型组织中，管理许可证以及对所有正在使用的应用程序具有访问权限的用户可能是一项全职工作。


  ## 管理人员、设备和服务的识别与认证


  所有 IAM 系统都必须实现四个关键要素：识别、认证、授权和问责（`IAAA`）。创建用户身份、向其授予系统权限、在用户登录时授权用户，以及对用户操作进行监督，所有这些都依赖于在
  IAM 系统中实施适当的控制。


  `Identification` 是主体（如用户、系统或进程）声明身份的过程。这通常通过提供数字用户名或用户 ID 来完成，但也可能使用身份证等物理凭证。需要注意的是，身份管理是一个独特的流程，它甚至在主体尝试访问对象之前就开始了，并且身份管理流程将在后面的章节中更详细地介绍。`Authentication`
  是证明所声明身份的过程，主体通过提供其控制下的某些信息来完成此操作。用于认证的因素包括用户所知道的东西、用户所拥有的东西，或用户所具有的某种特征的测量值。这些被称为因素，示例包括以下内容：

  * `Type 1:` 这是用户或实体所知道的东西，例如密码、密码短语或安全问题的答案。

  * `Type 2:` 这是用户或实体所拥有的东西，例如预先注册的移动设备或实体钥匙卡。

  * `Type 3:` 这是用户生物特征之一的测量值，例如手部几何形状、指纹、虹膜扫描或面部几何形状。

  * `Type 4:` 这是认证的一个新兴领域，正式定义可能有所不同。访问控制系统可以考虑主体尝试认证的方式和位置的细节，例如访问是否来自之前使用过的设备还是新设备。基于策略的访问控制可以根据此信息提供各种认证路径，例如如果用户在已知受信任的设备上，则只需提供用户名和密码。如果访问来自新设备或位置，则会生成
  MFA 提示。


  `Authorization` 是一个双重概念。在配置期间创建身份时，必须授予访问权限或权限，这是一个授权操作。每次主体请求访问时，系统还应再次确认授权，以确保主体仍有权访问给定的对象。此外，系统应强制执行对主体所采取的系统操作的
  `accountability`，这通常通过记录操作以供审查来实现。


  ### 身份管理实施


  典型组织中的用户将需要访问多个系统，例如电子邮件、协作工具以及来自合作伙伴或服务提供商的外部工具或系统。登录这些系统需要用户拥有一个或多个身份，而在任何超过基本计算环境的组织中，管理这些身份都可能很困难。


  身份管理（`IdM`）系统不仅有助于管理用户访问的身份，而且它们管理的身份还能够实现认证、授权和问责功能，因为这些功能都依赖于经过验证的身份。IdM 的功能可以由独立系统提供，也可以与更大的
  IAM 工具集成。这些功能支持访问管理生命周期中的关键任务，可能包括以下一项或多项：

  * `Provisioning`：IdM 工具可能提供一种方法，通过请求身份创建来启动访问管理生命周期，并支持访问请求审查和批准流程。请求可能由多个方发起，包括用户、用户的经理，甚至人力资源部门，具体取决于组织内实施的
  IAM 模型。

  * `Deprovisioning:` IdM 也应支持类似的去配置用户流程；去配置请求可能由访问审查员、人力资源、系统所有者等发起。去配置操作可能包括暂时暂停用户账户，例如在休假期间，或永久性地在用户退休时。其他操作可能包括删除或禁用身份。操作的选择应由问责要求驱动——禁用用户账户可防止同一身份在未来被重复使用，并在需要历史日志时可能导致混淆。

  * `Identity and account management:` IdM 可以支持集中式和分散式的账户管理功能，例如通过集中式机构（帮助台）或分散式服务（自助服务）进行密码重置。

  * `Authorization management:` 一旦创建身份，IdM 就支持该身份的初始访问授权。例如，一旦创建用户账户，就可将其放入具有特定权限分配的组中。

  * `Identity review:` IdM 通过提供有关授予身份的授权的关键详细信息来支持对身份和访问的监督。账户和访问的此列表构成了访问审查的基础——所有当前访问都将被审查其适当性，并在不再需要时进行去配置。


  IdM 支持额外的功能，如本章其他地方讨论的身份联合，以及单点登录（`SSO`），这是一个可以同时提供安全性和运营效益的特性。在 SSO 环境中，用户只需认证一次，可能针对
  SSO 门户或主应用程序（如网页邮件）。从那里，通过初始认证操作生成的令牌共享，授予对其他资源的访问权限。这提供了安全优势，因为用户需要记住的密码数量减少，从而降低了用户写下密码或选择不良密码的可能性。用户也受益，因为需要记住的密码更少。


  尽管 SSO 提供了好处，但它也可能成为两种方式的单点故障。首先，如果 SSO 离线或无法访问，则所有启用 SSO 的应用程序的访问也不可用。其次，如果用户的身份被泄露，通过
  SSO 授予的广泛访问权限会被放大——相比之下，在非 SSO 环境中，如果用户的身份被泄露，则只会授予对一个系统的访问权限。有趣的是，同样的能力也使从身份泄露中恢复变得更容易，因为使用
  SSO 身份的攻击者可以一次性被锁定在所有系统之外。权衡 SSO 的好处与潜在风险是安全从业者在选择 SSO 时的关键任务。本章后面将讨论各种 SSO 解决方案的具体好处和缺点，包括
  Kerberos 和开放授权（`OAuth`）。


  ### 单/多因素认证





  # 身份验证


  身份验证需要提供证明所声明身份有效性的信息；也就是说，用户确实是他们声称的那个人。身份验证因素有三种类型，它们的区别在于用于证明所声明身份的内容。这些包括用户所知道的东西（`Type
  1`）、用户所拥有的东西（`Type 2`），或对用户所是或所做的测量（`Type 3`）。


  ## 单因素和多因素身份验证


  单因素身份验证只需一个因素即可验证身份。最著名的例子是 `username`，即身份，以及 `password`，即 `Type 1` 身份验证因素。几乎所有系统都支持这种组合，用户在登录时也非常习惯使用它们。多因素身份验证顾名思义，需要使用一个以上的身份验证因素，例如
  `username`、`password`，以及来自身份验证器应用的随机生成的代码。在此示例中，同时使用了 `Type 1` 和 `Type 2` 身份验证因素，因此这是双因素身份验证（`2FA`）。一个要求
  `username`、身份验证器应用代码和指纹的系统才是真正的 `MFA`，因为它需要全部三种身份验证因素。


  `MFA` 有助于防范钓鱼攻击等账户入侵。仅仅窃取用户的 `password` 是不够的，窃取额外的身份验证所需的工作量会使攻击变得不切实际甚至不可能。用户提供的用于身份验证的信息越多，例如
  `password` 和来自受信任智能手机的身份验证器应用代码，系统就越信任用户是合法的。


  与其他安全技术一样，需要确保在安全性和可用性目标之间取得平衡——要求用户每次登录时都打开智能手机应用并输入代码可能会变得负担沉重。在组织可以实施物理访问控制的设施中，未经授权访问的风险可能会得到部分缓解，这意味着
  `MFA` 可能只需在用户首次登录时每天要求一次。对于在组织物理控制范围外的设施中工作的移动设备用户，如果访问的数据或系统足够敏感，则可能需要更频繁的 `MFA`。


  已经进行了复杂的钓鱼攻击，其中设置了假网站让用户使用其 `username`、`password`，以及来自智能手机应用的随机生成的身份验证器代码进行登录。由于这些代码过期很快（通常
  90 秒或更短），这些复杂的攻击依赖于自动化。捕获的凭据必须立即在合法网站上使用，攻击者才能获得访问权限。


  ## Type 1 身份验证因素


  `Type 1` 身份验证因素是用户所知道的东西，例如 `password`、`PIN`，或安全问题的答案。基于知识的身份验证被广泛理解和接受；密码、密码短语、秘密词或类似内容在日常生活中被广泛使用。


  `Passwords` 或密码短语是常见的 `Type 1` 身份验证因素，大多数操作系统、应用程序和信息系统都支持其使用。尽管被广泛接受，但密码安全实践的指导最近发生了范式转变。之前的指导主要基于美国国家标准与技术研究所特别出版物（`NIST
  SP 800-63`），对安全从业人员和普通用户来说都很熟悉。所谓的强密码应至少为八个字符，经常更改，并包含大写、小写、特殊和数字字符的混合。


  虽然这种指导在攻击者主要采用手动手段尝试规避访问控制时是合理的，但在廉价、高性能计算硬件时代，它已被证明是不够的。`NIST SP 800-63` 系列文档现在包含管理数字身份、联合
  IdM 和身份验证因素管理的指导。这些更新的指导，特别是 `800-63B`，“数字身份指南，身份验证和生命周期管理”，对管理身份验证因素采用了基于风险的方法。这包括
  `Type 1` 因素，具体指导如下：


  * **强调可用性而非复杂性：** 对复杂密码或密码短语的要求会导致难以记住但攻击者容易猜测的密码，例如在基本词后加上变化的数字，如“password123”和“password
  246”。更新的指导强调允许使用常见单词的更长密码短语而不增加复杂性要求，并提供更宽松的输入尝试次数以考虑用户输错。

  * **更强调长度而非复杂性：** 系统更倾向于实施密码短语而非密码，因为它们能创建更容易记住的身份验证材料。例如，密码短语可能是“RiskBasedSecurityIsTheFuture”，而复杂的密码可能是“r!skB@s3d”。前者更容易让用户记住，而后者更可能导致用户意外锁定。

  * **更改频率降低**：由于复杂性增加，更新的指导要求密码更改频率降低。密码短语更难猜测或破解，因此当前指导要求仅在被泄露时才更改。


  所有 `Type 1` 身份验证因素都有共同的优势和劣势。由于它们依赖用户记住秘密信息，如果用户忘记了秘密，就可能无效。当用于程序或脚本存储密码的系统账户时，忘记信息不是问题；相反，身份验证因素被泄露是主要弱点，因为计算机系统无法判断提供密码的是有效用户还是窃取了身份验证信息的攻击者。


  ## Type 2 身份验证因素


  `Type 2` 身份验证因素是用户所拥有的东西，例如数字证书、身份识别徽章或智能卡。受信任的设备也是日益流行的 `Type 2` 因素，因为便携式计算设备已变得无处不在。物理身份验证令牌和基于智能手机的身份验证器应用也是流行的
  `Type 2` 因素。它们以数字代码的形式提供额外的身份验证信息，用户必须在登录期间输入，进一步证明其所声明身份的真实性——只有指定用户应知道其密码并有权访问身份验证令牌或应用。


  受信任设备身份验证因素的使用可以是静态的也可以是动态的。静态示例是组织发放的工作站，该工作站配置了用于登录虚拟专用网络（`VPN`）的数字证书。登录期间，用户必须提供其密码，并且
  `VPN` 客户端还提供证书进行验证。虽然不是万无一失，但这种方法降低了被盗用户凭据的可用性并降低了用户 *friction*，即用户在使用系统时遇到的困难。如果
  `VPN` 每次登录都需要密码和令牌代码，用户必须时刻随身携带令牌。将第二个身份验证因素存储在设备上可以减轻用户的负担，同时实现安全目标。


  与 `Type 1` 因素不同，`Type 2` 因素不要求用户记住相关信息——用户在度假前更改密码可能难以回忆，但使用身份验证器应用不会出现同样问题。然而，一些
  `Type 2` 因素确实要求用户记住随身携带设备，例如令牌、智能卡或受信任的智能手机。如果设备丢失或被盗，或需要电力但电池没电，如智能手机身份验证器应用的情况，用户将无法成功身份验证。





  保护物理设备的保密性和可用性是一个重要的安全考虑因素，如果使用这些设备的话。用户应接受与这些设备相关的充分安全程序的培训，例如保持对其的物理控制，并在设备丢失或被盗时立即报告。制定事件响应场景和程序以处理与
  Type 2 身份验证因素相关的问题也很重要。帮助台人员应接受如何处理丢失或被盗的智能手机或身份验证硬件的培训，并且还必须存在适当的<|message|>技术控制，例如用于注销或取消授权这些设备的中央控制台。


  ### Type 3 身份验证因素


  生物特征是对人类用户的测量，通常被称为你所拥有的或所做的东西。人类生理特征或行为的独特性使得它们可用于证明身份。这包括通过扫描测量身体部位的几何形状，如面部或指纹识别，记录和比较语音样本，甚至监测用户输入样本文本（如密码短语）时的节奏和韵律。Type
  3 身份验证很少单独用作单一因素，但通常用作 MFA 的第二或第三因素。


  生物特征提供了证明身份真实性的最强方法之一，因为所测量的特征具有高度独特性——世界上只有极少数人会有显著相似的指纹或视网膜。复杂的生物特征系统还可以检测伪造的凭证，尽管所有系统都可能被攻破或被欺骗，并且有些系统存在缺陷或偏见，例如面部识别系统难以区分某些种族或肤色的人。


  生物特征的额外弱点包括以下几点，这要求安全从业者平衡身份验证需求和对生物特征解决方案的接受度：


  * **文化接受度：** 尽管不具侵入性，生物特征扫描仪仍需要可见的皮肤和对身体部位的公开访问，这在文化上可能不可接受。需要面部扫描的外部门在面部遮盖很常见的地方会成问题，因此安全从业者在设计身份验证方案时必须平衡用户和文化要求。

  * **可访问性：** 残障用户可能难以使用生物特征系统，甚至缺乏所需的身体部位——缺少右手的用户将无法使用仅支持右手扫描的手部几何扫描仪。使用生物特征还引入了疾病传播的担忧；如果用户必须将身体部位与扫描仪接触，则必须考虑适当的消毒。

  * **身体变化：** 随着时间的推移，用于生物特征身份验证的一些特征可能会发生变化，例如用户因疾病失去声音、眼睛退化，或疾病导致身体特征改变。生物特征系统必须支持用户在这种情况下更新其身份验证信息的方式，因为变化的生物特征会导致误拒。

  * **无法轻易更改：** 与 Type 1 和 Type 2 身份验证因素不同，如果身份验证系统被攻破，用户没有简单的方法更改生物特征。人类的指纹或面部几何等身体特征无法轻易改变。这些系统应始终被归类为包含个人身份信息（PII），因为生物特征可用于唯一识别个人。选择使用此类系统会因其将存储和处理的数据类型而引入额外风险。


  生物特征的使用存在许多问题，包括保持其保密性的相对难度。人类无法轻易防止指纹留在物理物体上，而高质量的照片由于社交媒体和监控几乎无处不在。对生物特征系统的重要测试是其确定“活体”或所呈现的生物特征数据是否来自活人还是照片等复制品的能力。这一概念在
  Dorothy Denning 的工作中被详细探讨，可在此处找到：`liveness.com`。


  ### 常见访问控制错误


  身份验证系统可能出现误拒或误接错误。误拒发生在系统拒绝对正确授权的主体进行访问时，而误接发生在系统授予未授权主体访问权限时。访问控制系统可以根据其出现这些错误的频率进行衡量，这些指标称为误拒率（FRR）和误接率（FAR），也称为
  Type 1 和 Type 2 错误。


  访问控制，如所有安全控制一样，实施需要成本。更昂贵的系统可能提供更多功能，而增加用户登录步骤会降低生产力，因为用户花费更多时间执行安全操作。成本更高的系统可能包括更敏感的身份验证机制，如生物特征传感器，从而提高
  FRR。相比之下，成本更低且生物特征机制不那么敏感的系统可能会遭受更高的 FAR，从而向未授权用户授予访问权限。交叉错误率（CER）是 Type 1 和 Type
  2 错误相等时的点，CER 是选择身份验证系统时的重要因素。对低价值资产的 Type 2（FAR）错误风险不如对高价值资产的影响严重，因为未授权访问高价值资产的影响会更大。


  ### 问责制


  提供 *问责制* 的系统为用户和流程提供了一种机制，使其对其行为和决策负责。知道是谁（用户或流程）做了什么（操作）是问责制的基础，依赖于用户或流程的唯一识别和已证实的真实性。记录和监控操作是执行问责制的最常见方式，而执行审计或审查是利用收集的信息验证系统中执行活动的常见方式。


  强制执行问责制需要强身份验证。如果所有用户共享相同的凭证，即使所有操作都被记录，也无法识别哪个用户执行了特定操作。所需问责制水平应在选择 IAM 工具时作为系统要求记录下来。例如，财务管理系统需要像
  MFA 这样强大的问责制以满足监管要求，因为许多金融交易都受审计约束。设计用于内部社交互动的系统可能仅需要基本的用户名和密码，这足以让用户对其在平台上分享的材料负责。


  设计具有职责分离（SOD）的流程或系统对于执行问责制很有用。要求第二用户审查和批准或执行请求提供了一种让用户对其特定政策或要求负责的方法。例如，如果用户费用报告要求所有费用都提供收据，报告审查员可以通过验证提交的信息并将任何不完整的报告退回给提交者来执行此要求。


  ### 会话管理


  *会话* 是通信设备之间的交换，例如客户端和服务器在用户请求网页或执行诸如填写在线购物车和下订单等功能时交换信息。*会话管理* 是启动、管理和终止会话的做法，这一点至关重要，因为会话信息是一种身份验证方法。






  # 超文本传输协议 (HTTP) 与会话管理


  `Hypertext Transfer Protocol (HTTP)` 是无状态的——发送到 Web 服务器的每个请求都是在不知道任何先前请求的情况下处理的。会话可用于维护持久状态，例如用户放入在线购物车的商品，这反过来又允许更复杂的应用程序。每个用户的会话都是唯一标识的，用户浏览或放入购物车的商品都与唯一的会话标识符绑定。使用无状态的
  `HTTP` 实现有状态体验的能力，即跟踪交互上下文的能力，导致了多种安全问题。


  在购物车示例中，会话是在用户通过提供用户名和密码登录购物应用程序时创建的。会话 ID 以 cookie 文件的形式提供给用户，随后在后续请求中将其发送回 Web
  应用。这允许应用程序将请求置于该特定用户的先前操作上下文中——例如，使用购物车中的所有商品继续结账。


  通过跟踪令牌实现会话管理导致了许多安全漏洞，包括以下内容：


  * `Session hijacking:` 如果攻击者冒充其中一个真实通信方，则会话会被劫持，通常目的是误导信息。中间人攻击通常用于劫持会话，因为信息在双方之间流动。会话重放攻击类似，涉及攻击者拦截会话令牌并随后使用它冒充授权用户。

  * `Session sidejacking:` 用户可以通过在同一网络上执行数据包嗅探来窃取会话 cookie 信息，从而劫持会话，这使攻击者能够冒充授权用户。

  * `Session fixation:` 固定攻击针对的是重用会话 ID 的 Web 应用程序。这种重用允许攻击者使用现有的会话 ID 诱骗用户的浏览器使用特定会话
  ID 进行身份验证。一旦通过身份验证，攻击者也可以使用授予该 ID 的凭据。


  开放 Web 应用程序安全项目 (`OWASP`) 发布了一份关于会话管理最佳实践的指南，以及避免、检测或减轻 Web 应用程序中会话管理漏洞的方法。会话管理备忘单可在
  `cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html` 找到。


  关于安全颁发和管理会话 ID 的指导包括确保其足够长且复杂，以避免猜测有效会话 ID 等弱点，并确保会话令牌不包含明显可识别的信息，如用户名和密码的明文。对于会话令牌以
  cookie 形式存在的 Web 应用程序，还建议配置适当的安全性，例如设置 `Secure` 属性以强制浏览器在发送 cookie 时使用 `HTTPS`。


  ## 注册、证明和身份建立


  用户访问的配置始于身份的创建，这需要用户提供一定量的信息并由配置组织验证。这可以简单到选择一个屏幕名称来在注册在线应用程序时声明身份，也可以复杂到在访问包含敏感数据的系统或设施时提交政府验证的身份证明。


  `NIST SP 800-63-3`，“数字身份指南”，详细说明了凭证服务提供商 (`CSP`) 在创建身份时可使用的身份证明流程。该框架包括身份保证级别 (`IALs`)，对应于在执行身份证明时需要缓解的不同风险级别。


  * `IAL1:` 这是最低级别，仅要求用户自行声明身份。`CSP` 不需要将个人与经过验证的现实生活身份关联。`IAL1` 适用于问责制不延伸至现实世界后果的系统，例如需要对用户行为采取刑事行动。

  * `IAL2:` 此级别要求 `CSP` 当面或远程提交身份证明文件，且所需证据必须将用户与现实世界身份关联。`IAL2` 在就业情况下经常使用，其中必须向雇主提交有效的身份证明文件。

  * `IAL3:` 这是最高保证级别，要求当面进行身份证明、出示政府签发的身份证件等高度可靠的身份证据，并由受过训练的 `CSP` 人员正式审查身份和支持文件。`CSP`
  人员可以当面核实个人的身份和文件，而当面要求提供了用户就是其声称的人的额外信心。


  一旦身份信息以适当级别呈现、验证并得到验证，就可为用户建立身份。这通常采取在系统上创建用户账户或用户名的形式，但也可能导致签发设施徽章或身份验证令牌等凭证。如果设施允许访客访问，进入设施时访客很可能存在一个简化流程：他们必须出示凭证供警卫或接待员验证，并签发访客徽章。


  负责设计身份管理系统 `CISSP` 必须考虑系统及其数据的<|message|> 安全要求，如真实性、保密性和完整性。一种或多种这些属性的丧失将导致不同的影响，例如不便或个人困扰、组织声誉受损、敏感信息未经授权披露，甚至可能危及人员安全。以航空运营为例，不同员工可能有不同的身份识别要求，具体取决于其工作的敏感性。机场内为乘客提供指引的迎宾员可能对生命、健康和安全没有任何影响，因此只需要
  `IAL 2`，而机械师和维护人员则需要更广泛的审查。


  ## 联合身份管理


  *联合身份管理* (`FIM`) 方案中的用户可以对参与联合的任何一个系统进行身份验证，然后被授予访问其他联合系统的权限。需要共享信息和系统访问的组织进行联合，以减少为每个用户管理多套凭据的管理和用户开销。这些组织可以是独立实体，例如需要在项目上协作的商业伙伴，甚至是组织内部的部门，其中维护着独特的
  IT 系统，而联合身份系统的目的与 `SSO` 类似。它可以简化账户创建和管理的管理开销，使用户受益于更轻松的访问，并允许简化访问取消授权等安全优势。


  开销的减少是联合的主要优势，因此为跨组织联合身份管理提供了商业理由。对于安全从业者来说，正确评估联合中存在的风险至关重要；然而，另一个组织的身份管理实践现在将影响联合授予访问的任何系统。如果联合组织没有同等的安全控制，则对联合系统的风险会增加。


  ## 凭证管理系统






  一个凭证将身份验证器，例如密码或数字证书，与标识符（如用户名或进程）绑定。凭证管理系统（`CMSs`）提供工具来配置、管理和审计以及取消配置这些凭证。密码管理器是
  `CMS` 的一个常见示例，公共密钥基础设施（`PKI`）中用于管理数字证书的注册机构（`RAs`）和证书颁发机构（`CAs`）也是如此。`RA` 是在 `PKI`
  中设计用于提供身份证明的功能，用户在此提交其身份信息以证明身份并获取数字证书。`CA` 由任何获得数字证书的用户用来验证其真实性。


  一个 `CMS` 应支持注册用户、证明其声称的身份、向已验证用户签发凭证以及支持对现有凭证进行管理和监督所需的过程。这些包括以下注册步骤：

  *   **Sponsorship：** 经授权的实体，例如雇主，赞助用户向服务提供商请求凭证。

  *   **Enrollment：** 用户注册凭证并提供所需信息以声明身份，这将取决于凭证服务提供商实施的 IAL。

  *   **Credential production：** 凭证由服务提供商生成，可能采用数字证书、身份徽章、智能卡等形式。

  *   **Issuance：** 凭证提供给用户。

  *   **Credential lifecycle management：** 在凭证的整个生命周期中，可能需要进行审计、监督或维护。这可能包括撤销不再需要的凭证，因用户更改姓名或角色等事件而重新签发，在用户辞职时暂停凭证，或在用户休假和返回组织时暂停和恢复凭证。


  ## Single Sign-On


  `SSO` 描述了一种系统，其中用户具有统一的登录体验——他们登录到单一服务，并使用相同的凭证获得访问其他工具或资源的权限。实现 `SSO` 有多种方式，其中这两种方法很受欢迎：

  *   **Web-based dashboard or portal：** 用户使用一套凭证登录特定网站，并被提供链接以访问额外的 `SSO` 启用应用程序。这种类型的
  `SSO` 通常支持遗留软件或无法进行身份联合的应用程序；相反，`SSO` 软件存储用户的凭证，并在用户从 `SSO` 门户访问时将其传输到目标应用程序。

  *   **Federated identity：** 用户登录到单一工作资源，如 Microsoft 365 或 Google Workspace 协作平台。经过身份验证后，他们能够使用组织凭证登录到其他外部资源，例如网络或智能手机应用程序。


  `SSO` 在可用性和安全性方面具有主要优势和劣势。`SSO` 减少了用户记忆和管理密码的负担，这有两个关键好处：选择的弱密码会更少，用户记住各种密码的开销也更小。然而，`SSO`
  中固有的集中化也可能是一个缺点——如果用户的 `SSO` 账户被攻破，那么所有 `SSO` 启用的应用程序也都会被攻破。这种单点故障并非完全是缺点。然而，被攻破的
  `SSO` 账户确实会授予广泛的访问权限，但也提高了响应速度，因为暂停被攻破的账户也会暂停对所有 `SSO` 启用应用程序的访问。`SSO` 还可以作为访问日志数据的单一来源，因为所有访问都由一个系统管理。这种集中的监督点可以实现对被攻破账户或可疑内部人员访问的更快检测和响应，因为日志数据可在单一系统中进行分析。


  ## Just-In-Time


  *Just-in-time* (`JIT`) 身份和访问管理有两个主要用例，两者都侧重于仅在需要时配置访问权限。用户的账户为合法用户和攻破凭证的攻击者提供相同级别的访问权限，而
  `JIT` 身份是一种减少这种内部威胁的方法。


  `JIT` 身份的第一个用例是在请求访问时才创建用户身份。在一个典型示例中，员工加入组织并创建主要账户，通常用于提供电子邮件访问。根据用户的角色或工作职能，他们可能还需要访问其他系统。在传统的访问管理模型中，此访问必须逐系统授予。在
  `JIT` 模型中，用户基于角色被授权访问资源，并且使用安全断言标记语言（`SAML`）在用户首次访问资源时配置身份和授权。这减少了与用户管理相关的管理开销。


  `JIT` 通常作为特权账户管理（`PAM`）的一个要素来实现，`PAM` 处理对特权账户（如系统管理员）凭证的管理。由于此类用户被授予广泛的、可能具有破坏性的授权，因此建议遵循最小必要访问原则并严格限制这些权限。`JIT`
  访问管理策略不会让凭证始终可供用户使用，而是将访问这些功能所需的凭证放入安全保险库。当用户需要访问时，他们可以通过访问保险库来提升权限，这提供了额外的控制机会。访问保险库中的凭证，有时称为特权提升，是可以记录的事件并触发额外的安全监督。这通常被称为
  *break the glass* 流程，指的是旧式报警系统，要求用户打破玻璃面板以访问报警按钮，从而降低了意外激活的可能性。`PAM` 工具还可以为凭证实施时间限制，并在时间限制到期后自动更改它们，从而限制提升权限的使用时间。


  ## FEDERATED IDENTITY WITH A THIRD-PARTY SERVICE


  *Identity as a service* (`IDaaS`) 是联合身份概念的扩展，解决了跨不同团队、业务部门和组织协作需求增加的问题。这可能是由业务合作伙伴之间数据和信息系统共享增加或组织采用托管在组织直接控制之外的云服务所驱动的。


  与其为将 IAM 方案扩展到外部实体而开发自定义方法，第三方 `IDaaS` 可以与传统系统以及外部或基于云的系统提供原生集成。`IDaaS` 默认实现 `SAML`
  和 `OAuth` 等联合解决方案，并且这些解决方案通常旨在满足在内部和外部系统之间启用 IAM 的需求。


  使用第三方 `IDaaS` 的决定要求安全从业者权衡访问外部系统的运营需求与两个主要风险。第一，`IDaaS` 可能成为单点故障——依赖 `IDaaS` 进行访问控制的系统在
  `IDaaS` 宕机时不可用，尽管如果组织已使用集中式 IAM，则此风险很小。`IDaaS` 实际上可能降低风险，如果所选第三方具有比组织内部托管更强大的正常运行时间能力，尽管当然如果
  `IDaaS` 提供商停止对目标系统的支持或停止运营，组织将陷入困境。






  The second risk to consider is the loss of control inherent in using a third party,
  which is common to any decision to use a cloud service. Identification is the foundation
  of access control, so the potential risk of outsourcing this function can be high.
  If the `IDaaS` provider suffers a data breach, the organization''s identity and
  access management information could be compromised.


  ## On Premises


  On premises, sometimes shortened to `on-prem`, describes an architecture that exists
  in a facility controlled by the organization, such as a Lightweight Directory Access
  Protocol (`LDAP`) or Microsoft Active Directory (`AD`) system hosted in the organization''s
  offices or data center. Many organizations have these systems deployed to support
  existing or legacy applications and infrastructure.


  Key benefits of on-premises management systems include total control over the hardware
  and software used in the IAM system, unlike cloud or third-party systems where the
  organization gives up some control to the service provider. As a `CISSP`, it is
  important to review the benefit of total control against the additional costs incurred,
  such as full-time administrators needed to maintain a complex IAM system like Microsoft
  `AD`.


  Extending an existing on-premise identity management system to cloud-based applications
  or federating it with external parties like business partners can prove difficult
  or impossible, if the tools in use were not designed to support this type of use.
  Retaining control over both the IAM system and the hardware offers security control
  opportunities, but limited federation capabilities can force organizations to seek
  alternatives. Many legacy IAM solutions can be quite complex to administer, which
  presents additional risk in the form of cost to maintain them and the potential
  for misconfiguration due to lack of adequate skills or understanding of a complex
  system.


  The process of extending an existing IAM typically requires additional software
  and proper security configuration that allows the on-premise IAM to communicate
  with systems outside the organization''s control. This might be achieved with native
  extensions or plugins to the IAM tool or with a separate application like a `SAML`
  gateway or `SSO` provider.


  ## Cloud


  Newer organizations may be “cloud-first” or “cloud-native,” meaning they lack any
  on-premise or legacy infrastructure. Older organizations may pursue a strategy of
  migrating to cloud-only solutions due to the cost savings they provide. In both
  cases, a legacy IAM solution would be a poor fit due to significant costs to acquire
  hardware, software, and personnel skills to manage it; a cloud-based `IDaaS` is
  likely to be a more cost-effective solution.


  Cloud-based `IDaaS` solutions act as an IAM broker and can be used to manage access
  controls for the organization''s cloud-based systems and federated with other applications,
  services, or even organizations using the same `IDaaS`. Organizations migrating
  into the cloud can take advantage of hybrid `IDaaS`, which extends the `IDaaS` to
  support identity and access management for legacy applications, or `SSO` portal
  features, which allow users to access non-`SSO` applications by storing the credentials
  and facilitating automatic sign in.


  Popular cloud services, including software as a service (`SaaS`) tools, offer native
  integration with popular cloud `IDaaS` platforms, which reduces administrative overhead
  associated with user provisioning. This can be used to implement `JIT` provisioning
  for new user accounts on cloud services; when a user attempts to log into a service
  for the first time, their authorization to use it is checked with the `IDaaS` provider.
  If they are authorized, an account is created; this benefits users and administrators,
  as it automates the process of checking authorizations and provisioning accounts.


  ## Hybrid


  Hybrid `IDaaS` is a combined deployment of IAM elements in both the cloud and on
  premises and is often used as part of a migration strategy in organizations where
  legacy infrastructure requires an on-premise solution. For example, this hybrid
  approach is commonly used in Windows environments that rely on legacy `AD` for current
  applications migrating to a cloud-based setup with `Azure AD`, which is a cloud-based
  `IDaaS` platform hosted in the Microsoft Azure cloud. Both the legacy `AD` and `Azure
  AD` run simultaneously and synchronize information, with the ultimate goal of total
  migration to the cloud-based solution once all legacy applications have been identified
  and migrated.


  Other third-party `IDaaS` solutions can also integrate with existing on-premise
  IAM tools and act as a centralized point for credential management. Even if the
  organization does not plan to migrate completely to cloud solutions, legacy applications
  continue to use the on-premise IAM provider, while any cloud services or federated
  third parties can use the cloud-based `IDaaS` provider. This divided access control
  approach offers benefits to users, who are required to maintain only one set of
  credentials, and acts like an `SSO` to reduce management overhead.


  The risks of a hybrid setup like this include the need to dedicate sufficient resources
  to maintaining dual IAM implementation. Many organizations assume a move to the
  cloud means no resources are required for on-premise maintenance, but the hybrid
  approach does not completely remove this need. Additionally, the hybrid approach
  introduces the same risk as cloud-based IAM due to a third party managing identities
  and can pose additional risk if a breach of the `IDaaS` grants access to internal
  resources that rely on on-premise IAM synchronized with the `IDaaS` provider.


  ## IMPLEMENT AND MANAGE AUTHORIZATION MECHANISMS


  Authorization can be the decision to grant a subject access to an object and confirmation
  that a subject is authorized to access an object when they attempt to access it.
  This implies decisions that are made before access, when a user is first enrolled
  in an IAM, as well as decisions made at the time of use when a user makes a request,
  such as trying to open a file or access a system. Authorization is simple to manage
  if a few subjects, like users or processes, require access to a few objects, like
  documents or an entire information system. However, complex organizations with hundreds
  or thousands of subjects accessing millions of objects are impossible to manage
  without a structured and orderly methodology. Even an organization with a hundred
  users and multiple information systems for various teams or departments will find
  that manually managing access on a per-user basis is inefficient at best, and at
  worst is totally impossible.


  Access control models, which are described in the following sections, provide ways
  of identifying subjects and objects and establishing relationships to determine
  authorization. These relationships are foundational to access control systems, and
  the decision to allow or deny access supports fundamental security objectives like
  maintaining confidentiality, integrity, and authenticity of data. These models also
  provide a variety of methods for managing complex subject-object access needs, so
  they are useful to security practitioners in organizations with more than a few
  users and systems.


  Modern information systems and IT environments often implement a mix of access control
  models, such as firewalls utilizing rule-based access control, file sharing systems
  with discretionary access control, and HR departments that identify specific job
  functions and associated permissions needed for role-based access control. `NIST
  SP 800-192`, “Verification and Test Methods for Access Control Policies/Models,”
  provides definitions of these models and guidance on how to identify requirements
  for an access control model to apply to a specific system or organization.


  ### Role-Based Access Control





  RBAC 是一种根据用户在组织中的角色将主体映射到一组对象的模型。角色是一组工作职能，通常由部门或职位定义，所授予的访问权限基于该特定角色的需求。角色映射到对象访问授权，所有被授予特定角色的主体都获得相同的访问权限。


  例如，负责安全的用户可能被授予安全分析师角色。具有安全分析师角色的用户被授予对安全信息和事件管理（SIEM）平台的读写访问权限，但被拒绝系统管理员权限，如 Windows
  域管理员或 Linux `sudo`。在这种情况下，角色授予对安全日志的访问权限，但阻止分析师访问被监控的系统，这有两个目的。首先，分析师不需要访问权限来执行系统管理员功能，非分析师用户也不需要访问
  SIEM，因此角色实现了最小权限原则。


  其次，这种基于角色的访问可以保护数据完整性，从而支持问责制。在设计良好的 RBAC 模型中，所谓的毒性角色组合应被阻止。在此示例中，任何具有系统管理员角色的用户都应被禁止担任安全分析师角色，防止管理员用户对系统采取恶意操作并同时从
  SIEM 日志中删除其操作的证据。


  RBAC 减少了创建和管理用户授权的管理和开销。如果法律部门的成员需要访问 15 个系统，更有效的做法是创建一个具有这些系统访问权限的角色，然后将新成员放入与该角色关联的组中。这支持访问控制的重要安全目标，同时减少实施安全所需资源，符合业务或组织目标。


  ### 基于规则的访问控制

  基于规则的访问控制，通常拼写出来以避免与基于角色的模型混淆或缩写为 RuBAC，是基于预定义规则列表来确定授权。从物理角度来看，宾客名单就是 RuBAC 模型。如果某人在宾客名单上，则授予其参加聚会的权限；否则，拒绝入场。


  信息系统通常通过访问控制列表（ACL）实现 RuBAC。常见示例包括静态防火墙规则集，其定义允许和阻止的 IP 地址或端口，以及文件 ACL，其定义有权访问文件的人员及其权限，如读或写。当进行访问尝试时，系统会根据规则集进行审查。传统的或无状态防火墙会检查传入数据包是否来自允许的
  IP 地址，而文件系统会将当前用户与文件的 ACL 进行比对，以确定请求的动作是否允许。


  基于规则的系统还实现了隐式和显式权限的概念。在隐式允许系统中，除非定义规则禁止访问，否则所有访问都被允许，就像商店对公众开放，除了已知会偷窃的特定顾客。这些不受欢迎的用户被明确拒绝入场。


  隐式拒绝则相反——只有批准名单上的人才允许入场，其他人均被拒绝。这有时被称为 *deny all* 或 *allow by exception*，是基本的安全最佳实践，因为它减少了未经授权访问的机会。


  ### 强制访问控制

  强制访问控制（MAC）模型通常与军事或政府组织相关联，采用静态和分层的访问控制方法。MAC 可以被描述为 *nondiscretionary access control*
  模型，其中访问控制是系统性强制执行的，不由数据所有者或其他人自行决定。


  MAC 是通过对主体和对象应用安全标签来实现的；例如，绝密、机密和未分类。当对象创建时，所有者或创建者负责分配适当的安全标签。当主体尝试访问对象时，系统会验证安全标签并强制执行适当的访问控制。例如，安全标签为机密的用户将被拒绝访问安全标签为绝密的文件，但将被授予访问标签为机密或未分类的文件的权限。


  在 第 3 章 “安全架构与工程” 中讨论的 Bell–LaPadula 和 Biba 安全模型是 MAC 的示例，常被用作现代系统访问控制功能的基础原则。两个模型描述的基本规则使用基于标签的数据保密性或完整性描述来实现
  MAC。每个模型的属性描述了如何根据主体安全标签和尝试访问的对象标签来限制对对象的访问。


  ### 自主访问控制

  在自主访问控制（DAC）模型中，访问决策由系统或数据所有者做出，他们自行决定哪些主体可以访问对象。对于文件，文件所有者可以定义其他可以访问该文件的用户。这扩展到这些用户可以执行的功能，如读取或更新文件。这可能表现为授予文档的公共读取访问权限，同时指定一小群可以更改文件的编辑者。


  DAC 是一种分布式模型，在没有中央机构拥有足够信息做出访问控制决策时可能很有用。社交媒体网站是常见示例；上传图片等内容的用户最适合确定内容是否应可供平台的任何其他用户访问，或是否应限制为特定用户组，如密友或家人。在业务环境中，所有者通常是系统或数据集的所有者、创建者或保管人。集中式
  IT 部门可能无法确定谁需要访问共享驱动器上的特定文件，但文件夹所有者确实知道哪些用户需要访问以进行协作。


  DAC 的灵活性和去中心化特性也是潜在的安全缺点。当大量数据所有者做出访问控制决策时，强制执行一致性更困难，而数据所有者更改权限的能力可能被内部威胁滥用。


  ### 基于属性的访问控制

  基于属性的访问控制（ABAC），有时被称为 *policy-based access control*，是一种新兴的访问控制模型，它结合有关主体的属性并将其与策略进行评估以做出访问控制决策。例如，属性可能是用户的身份、作为数据录入专业人员的角色以及一天中的时间。当用户尝试访问系统时，这些属性会与策略进行比较，策略规定数据录入用户的访问仅在标准工作时间内允许。如果数据录入用户在正常工作时间外尝试此访问，则访问请求将被拒绝。


  ABAC 比其他访问控制模型提供更大的灵活性，可用于实现更动态和基于风险的访问控制。例如，用户可能仅在从新设备登录时才需要输入多因素身份验证。ABAC 与 RBAC
  模型相似，但定义复杂的策略来允许或拒绝访问，而不是二元的允许/拒绝决策。有状态防火墙是 ABAC 的一个示例；如果主机传入流量对应于先前建立的通信会话，则允许该流量；否则，拒绝主机流量。传统或无状态防火墙如果阻止此类流量，可能对组织造成阻碍，这凸显了选择具有足够强大功能以支持组织需求的访问控制机制的重要性。





  实现 ABAC 的系统利用一组策略属性来做出访问控制决策。可以测试的属性示例包括主体或对象所在的位置、请求发起的时间、请求者的角色，以及请求是否来自新设备。例如，例行用户在其标准工作站上在正常工作时间之外请求访问敏感生产文件时可以被允许。如果同一用户尝试访问相同数据，但请求来自之前未见过的设备且位于外国，则应拒绝访问。用户可能正在旅行并试图保持工作效率，但用户凭据很可能已被盗用的风险显著增加。


  ### 基于风险的访问控制


  基于风险的访问控制模型建立在风险会随时间变化的假设之上。与认为风险是静态且不考虑风险随时间变化的其他模型不同，基于风险的模型可以使用多种参数来确定授权，从而提供动态访问控制。在
  RBAC 或 RuBAC 等其他模型中，风险随时间的动态性必须通过手动更新访问控制（例如授予或撤销访问权限）来处理。实现这些模型的系统无法实时响应这些动态变化。


  例如，IAM 可以集成威胁情报数据，并根据可用情报做出动态身份验证决策。如果另一个业务部门或合作组织遭到钓鱼攻击，那么 IAM 可能会暂时提高登录时 MFA 的频率以应对威胁增加。同样，如果组织的
  SIEM 检测到失败登录尝试次数增加，则可以自动实施临时防火墙规则以阻止与失败登录相关的流量，这可能使暴力攻击变得困难或不可能。


  基于风险的模型可以利用多种因素来动态定义身份验证要求。金融机构经常利用此模型在单个账户级别检测欺诈。很少旅行或进行在线购买的人的账户与频繁旅行者或在线购物者的风险状况不同，因此编写适用于所有账户持有者的静态规则几乎是不可能的。相反，一个账户的欺诈指标是任何在特定地理区域之外进行的购买，而另一个账户的指标是在实体零售店而不是在线零售商进行的购买。


  ## 管理身份和访问授予生命周期


  创建账户的行为称为 `provisioning`。这包括在创建账户之前审查用户身份证明以确认其身份，以及设计用于审查和批准访问请求的程序。当账户不再需要时，访问权限会通过
  `deprovisioning` 移除，这发生在用户离职或变更角色时，或系统账户在退役期间终止时。


  必须定期进行审查，以确定所有已授予的账户是否仍然准确。任何不需要的账户或权限过度的情况都应使用适当的去授权操作（如撤销、禁用或删除账户或授权）终止。这种去授权通常侧重于移除访问权限，但去授权并不一定意味着账户被删除。相反，它可能出于问责目的而保留，因为用户的操作记录在日志文件中。


  审查还可能发现需要但尚未授予的访问权限，这可以通过授予新的访问权限来解决。Figure 5.1 描述了此访问管理生命周期。


  ![FIGURE 5.1 The access management lifecycle](img/c05f001.png)


  **FIGURE 5.1 The access management lifecycle**


  ### 账户访问审查


  用户账户与个人相关联，而系统账户与非人类访问需求相关联。这些通常采用系统或服务账户的形式，用于执行备份、数据库维护或代表用户执行请求或流程等关键系统功能。非人类账户还包括设备，例如物联网
  (IoT) 或系统应用程序编程接口 (API) 调用。用户账户和系统账户都必须定期审查，以确保它们仅被授予执行其预期功能所需的访问权限。


  在制定访问审查策略时，安全从业人员必须平衡多个重要因素。审查的频率和要审查的账户可能由法律或监管义务决定。例如，非管理访问可能有年度审查周期，而管理账户必须每季度审查。由配置不当的管理账户可能造成的更大损害证明了进行更频繁审查的额外开销是合理的。


  用户访问的审查程序必须包括识别用户被授予的系统、数据和权限。一旦识别出，这些访问属性必须与组织的访问策略以及最小权限等 IAM 实践进行核对。审查应针对每个用户包含以下要素，以及对访问适当性的检查：


  * 用户可以访问的所有账户，无论是通过直接分配还是通过共享凭据使用。

  * 用户可以访问的所有敏感数据集或系统

  * 用户可以在每个系统或数据集上执行的操作，例如读取、写入或删除。

  * 识别任何过度的权限，例如未执行管理操作但被授予管理访问权限的用户。

  * 不活跃或休眠账户，特别是分配给已离职或变更角色的用户的账户。

  * 分配给用户的角色以及角色授予的访问权限的任何潜在有毒组合。有毒组合发生在用户基于角色的访问违反分离职责等控制措施或造成利益冲突时。


  系统和服务账户的策略也应定义，并且必须在审查频率与授予的特权之间取得平衡。非人类账户的变化将少于用户账户，因为它们不受晋升或工作变更等人类行为的影响，这些行为需要调整特权。然而，它们仍可能因不当的访问级别而带来安全风险——例如，默认本地管理员账户可能在故障排除期间启用。如果在故障排除完成后未正确停用或禁用，则存在被利用的风险。


  在其他情况下，系统或服务账户可能默认被授予提升的特权，但在特定系统中实施时这些权限并不需要。系统可能包括默认本地管理员账户，如果计算机是 Windows 域或
  MDM 等远程管理方案的一部分，则不需要该账户，或者服务账户即使工作站上未激活特定服务也保持启用状态。在这些情况下，访问审查类似于配置审计；两者都旨在识别系统配置，例如默认系统账户特权，与安全基线不一致的情况。






  执行访问审查可能耗时且可能具有破坏性，如果账户因不当访问被错误标记。实施自动化对于及时进行审查至关重要，并且一些访问管理工具可以用于补充审查，通过主动控制来增强，例如在设定时间内未使用的账户将被禁用。诸如
  SIEM 或安全编排、自动化和响应（SOAR）之类的安全工具可用于执行这些自动化审查。不进行审查的风险是不当或非预期的访问，这可能被内部威胁利用，或被入侵了有效用户账户的攻击者利用。


  ## 账户使用审查


  用户、系统和非人类账户都应接受其所执行操作审查。这可以帮助组织识别权限的不想要或不当使用，以及账户权限不当的情况。使用审查可能是访问审查的一部分，可以使用 SIEM
  等自动化工具执行，甚至可能涉及偶尔监督的过程，例如一年多次随机审计系统活动以发现意外或不当使用。


  CISSP 可以通过使用审查实现多个安全目标，尽管主要原因是强制执行系统使用的问责制。自动化系统使用审查应在 JIT 身份系统使用时集成，以便在特权被使用时进行审查。例如，如果用户访问了管理凭据，这可能是合法的支持案例，也可能是攻击者的特权提升。将特权提升与工单或支持案例关联起来可以证明访问是必要的，而无缘无故访问管理凭据则是值得调查的可疑事件。


  ## 授予权限与撤销权限


  授予权限是启用或创建访问的操作，而撤销权限是相反的操作，可能包括暂停、终止甚至删除访问凭据。这些流程通常与员工变动相关，如入职或离职、岗位调动或角色变更，如晋升。这些员工管理流程通常不由安全从业人员处理，因此安全团队必须与负责团队如人力资源或
  IT 部门妥善协调流程，以确保安全措施得到设计、集成到流程中并得到正确执行。


  撤销权限是一个特别重要的任务，因为如果不再需要访问的用户仍能访问数据和系统，风险会增加。必须执行访问审查以识别用户有权访问的系统和数据，并在访问被撤销时获得确认。访问管理政策和程序应考虑用户访问在以下三种主要情况下发生变化：


  * **敌对或非自愿**情况包括员工因公司决定而被解雇。这种类型的离职风险更高，因为员工可能不满或报复性行为，流程通常要求更快地撤销权限并加强监督。

  * **友好或自愿**情况包括员工辞职或退休，通常风险较低。在这些情况下，访问撤销可能进行得更缓慢，验证可以留到下一次访问审查以发现任何错误。

  * **工作变动**在一些高安全组织中被视为与友好撤销权限相同以作额外预防。用户的当前访问将被完全撤销，并为用户变更后的工作角色请求并授予新的访问。


  支持自助授予或自助撤销权限的系统必须在系统开发过程中解决访问控制要求。例如，允许用户自行注册账户的在线购物网站很可能会实施 RBAC。一个角色将是“客户”，有权访问与该特定用户相关的信息，而另一个角色可能是“客户支持”，用于需要访问所有客户有限信息的内部用户。用户自行授予账户的要求将根据应用程序类型而有所不同，并且身份证明要求必须考虑到与必须收集的身份证明材料相关的任何法律或监管合规要求。撤销权限很可能属于隐私立法或法规，因此必须提供禁用并可能删除与用户相关数据的适当方法。


  ## 角色定义


  角色通过为分配特定角色的所有用户提供通用访问要求集来简化访问管理。例如，组织的角色可能根据部门定义，因此具有 IT 角色的用户被授予访问所有 IT 系统的权限，而财务用户被授予访问财务系统的权限。当新用户加入时，他们被放入组或分配特定角色，从而授予他们访问适当系统的权限。这简化了访问授予和撤销的过程，因为只需执行一个操作，而不是为将用户添加到每个系统而执行多个操作。


  定义角色的过程必须遵循访问管理原则如最小权限原则，也可作为实施安全控制如职责分离的一种方式。例如，如果用户能够将自己的个人数据上传到 HR 系统但不应能够查询系统，则可以授予非
  HR 角色写入权限并拒绝读取权限。系统和角色的矩阵对于可视化这些权限非常有用。


  ## 特权提升


  特权提升是获得更高权限的过程。例如，如果具有只读访问权限的用户发现一个允许其写入数据的漏洞，这就使其特权超出了应有的范围。提升可能导致负面安全结果，如机密性、完整性、真实性甚至可用性的丧失，如果用户的提升特权允许其破坏系统操作。


  特权提升也有合法用例。具有授权执行管理功能的<|message|> 用户不应始终使用其管理员账户，因为他们通常不需要访问其所有功能，并且可能无意中执行命令。诸如
  Unix 系统上的 `sudo` 或其他系统的凭据保险库之类的功能可用于实施 *break-the-glass* 流程。需要时，用户可以虚拟地打破玻璃并获得凭据访问，这可能会触发诸如安全警报或增加日志记录之类的操作。如果访问不当，这些操作使防御者有更大的发现机会。


  设计良好的 IAM 应限制用户对特权账户的访问，并且仅在必要时允许访问。例如，即使是系统管理员也不需要使用其管理特权来执行例行任务，如检查电子邮件或在网页浏览器中阅读新闻。实施对管理特权的限制可降低这些特权被意外或故意滥用的可能性。例如，如果用户在进行休闲网页浏览时未以管理员身份登录，则来自恶意网站的驱动下载可以被限制为无法以管理员级凭据执行。实施此类特权提升的方法示例包括以下内容：






  `sudo` on Linux and Unix systems allows an authenticated user to perform superuser
  actions for a limited amount of time if they can provide the proper credentials.
  The extra act of authenticating creates a barrier to accidental misuse of administrative
  privileges.


  Break-the-glass procedures or credential vaulting place administrative credentials
  in a restricted-access tool. Gaining access to the credentials requires a deliberate
  process and can be a trigger for alerts or alarms, thereby providing security with
  insight into the use of these credentials.


  Managed service accounts are nonhuman accounts designed to perform specific functions.
  They are typically configured to perform only their designated function and cannot
  be used to log in to a system, which makes attacks like phishing these account credentials
  nearly impossible.


  Privilege escalation attacks are a common security threat as well. In a vertical
  escalation attack, the attacker is seeking to gain increased privileges on a system,
  such as using Structured Query Language (`SQL`) injection to gain direct database
  access when the user is only authorized to access data through a web front end.
  Horizontal privilege escalation, also known as lateral movement, is an attack method
  that grants access to systems or resources the user is not authorized for and may
  exploit improperly configured `IAM` tools or features like roles. Horizontal escalation
  is often targeted at accessing other systems using already compromised credentials;
  goals may include performing vertical escalation on another system or gaining access
  to additional sources or types of data.


  ## IMPLEMENT AUTHENTICATION SYSTEMS


  Once credentials are provisioned, subjects will use them to access resources. The
  credentials presented when the subject requests access must be authenticated, and
  a variety of authentication systems exist to support various use cases. These include
  local authentication functions that provide access to one computer or set of files
  and networked authentication systems like `LDAP` or `IDaaS`, which grants access
  to resources hosted across a network. Users are not always connected to the network
  or may need access across multiple networks, so authentication systems that support
  remote access or federated identities can also be useful to achieve access control
  security objectives, while still meeting user requirements.


  ### OpenID Connect/Open Authorization


  Open Authorization (`OAuth`) is an “open protocol to allow secure authorization
  in a simple and standard method from web, mobile, and desktop applications,” as
  defined by the OAuth community website (`oauth.net`). The project is an Internet
  Engineering Task Force (`IETF`) working group, which lends its broad, global support,
  and, as the name implies, it is focused on authorization rather than authentication.
  The community website contains a variety of resources including specifications for
  platform-specific implementations and best-practice guides for using OAuth in various
  applications.


  OAuth defines four key roles that systems in an OAuth federation must implement
  to exchange authorization information:


  *   Resource owner: Any entity that grants access to a protected resource, such
  as an information system or dataset.

  *   Resource server: Any server hosting the protected resource, which accepts and
  responds to access requests.

  *   Client: Any application making requests for access to protected resources.

  *   Authorization server: Any server issuing access tokens to clients after successful
  authentication; tokens are used across the federated system to gain access.


  Open ID Connect (`OIDC`) adds authentication functions built on top of OAuth version
  2.0 and federates identity management to provide users with an authentication experience
  similar to SSO. It is often implemented in web applications; and in OIDC, the user
  is presented with a choice of identity providers (`IdPs`), which are usually common
  email or social media platforms like Gmail, LinkedIn, or Twitter.


  The user selects an `IdP`, which then provides authentication information to the
  relying party using OAuth. The authentication information in OIDC is passed from
  an OIDC provider (`OP`) to the relying party (`RP`) in the form of a token, which
  contains claims about the user and authentication of their asserted identity. IDaaS
  provider Okta has an illustrated developer blog highlighting the key steps of OIDC
  authentication (`developer.okta.com/blog/2019/10/21/illustrated-guide-to-oauth-and-oidc`).


  As an example, a user registers for the eBay web application using a Twitter account;
  in the future, they can authenticate to eBay if they are able to successfully log
  in to Twitter. If they have authenticated to Twitter before opening eBay, then they
  may not even be required to perform any action — eBay can make an OIDC request to
  Twitter, which has an active, authenticated session for the user, and access is
  automatically granted. This user convenience can be beneficial to reduce the burden
  of user logins, but also carries risks similar to SSO. If the `OP` is unavailable,
  then all `RP`s will also lose availability. Other similar IdPs include Google, LinkedIn,
  Microsoft, and Apple, which provide user identification and authentication services
  that can be implemented in other websites, web apps, and many common smartphone
  apps.


  ### Security Assertion Markup Language


  `SAML` is a framework for different systems to exchange security assertions, which
  consist of information needed to enforce access controls. It uses Extensible Markup
  Language (`XML`) to format messages regarding identities, resources, and access
  information like authentication and authorization. In SAML, there are three roles:
  first is the user agent (like a web browser) that makes a request to the second
  role, which is a service provider (like a web application). The service provider
  relies on the assertion made by the third role, called an identity provider (`IdP`),
  for user identification, authentication, and authorization.


  There are four components in SAML:


  *   Assertions define SAML attributes like how authentication and authorization
  message protocols or frameworks are to be used by the services.

  *   Bindings define the request-response pairs to be used by the three roles to
  communicate.

  *   Protocols include `HTTP` and simple object access protocol (`SOAP`), which are
  used to package and exchange messages between roles.

  *   Profiles are the combination of assertions, bindings, and protocols in use within
  a specific SAML implementation.


  The current version of SAML, v2.0, is an `OASIS` standard. Documentation and best
  practices for SAML implementation are maintained on the SAML wiki (`wiki.oasis-open.org/security/FrontPage`).
  SAML is most often used to provide an SSO experience to end users. Users access
  resources using normal system functions like clicking links to access a web application.
  Security assertion information can be provided as part of a custom URL pointing
  to the web application or sent as a cookie to the web application. This information
  is based on the user''s previously provided information, such as their login credentials
  entered when signing into their computer or a web portal, which then grants access
  to other SAML-enabled applications.


  ### Kerberos


  Kerberos is one of the earliest examples of an SSO designed to reduce the need for
  users to maintain separate accounts across multiple systems, and to reduce the overhead
  of individual information systems performing identification and authentication.
  It is widely implemented in modern information systems including Microsoft `AD`.






  在 Kerberos 环境中，经过“kerberized”处理的应用程序或系统不再依赖自身进行用户身份验证，而是依赖 Kerberos 服务器进行身份验证。信息通过票据交换，票据用于标识用户是否真实以及是否应被授予访问特定资源的权限。用户真实性通过对称加密来证明，这要求用户必须控制自己的密钥才能进行身份验证。


  Kerberos 域包含一组服务和资源，包括以下内容：


  *   **Principals：** 这些是使用 Kerberos 进行标识和身份验证的各方，包括用户以及服务或应用程序。

  *   **Key Distribution Center (KDC)：** KDC 用于为新用户进行注册并维护密钥数据库。

  *   **Authentication Server (AS)：** AS 通过交换加密数据来执行对主体的身份验证功能。如果主体能够使用预共享的对称密钥（一种第
  2 类身份验证因素）成功解密，则认为其已通过身份验证。

  *   **Ticket Granting Server (TGS)：** Kerberos 使用票据运行，票据类似于令牌。TGS 向已通过身份验证的主体提供一张票据，使其能够请求服务票据。服务票据由
  kerberized 应用程序使用，以向已正确身份验证的用户授予访问权限。


  用户请求访问 Kerberos 域中的资源时，需遵循三步流程来标识、身份验证，然后获得资源访问权限：


  1.  客户端通过传递使用客户端密钥加密的消息来向 AS 进行身份验证。如果成功，客户端将获得票据授予票据（TGT），该票据授予用户请求特定服务的服务票据的能力。

  2.  客户端通过提供 TGT 来请求服务票据。如果其有权访问该服务，则会签发服务票据。

  3.  客户端向目标服务提供服务票据，如果票据有效则被授予访问权限。


  Kerberos 项目由 MIT 发起并维护。完整文档和代码可在 `web.mit.edu/kerberos` 找到。许多流行的 IAM 工具也实现了 Kerberos，例如
  Microsoft AD。


  ### Remote Authentication Dial-In User Service/Terminal Access Controller Access
  Control System Plus


  远程身份验证拨入用户服务（RADIUS）最初设计于 1990 年代初，由名称中包含拨入即可证明。当时，远程访问通常意味着使用调制解调器和传统电话线路，但其提供的身份验证、授权和计费（AAA）功能已在许多现代系统中实现，例如
  802.1X 身份验证，该协议得到广泛支持并被现代桌面和智能手机操作系统使用。RADIUS 接受远程用户凭据并执行身份验证以强制执行访问控制，同时还提供远程会话的计费，例如传输的数据量。RADIUS
  标准在 IETF RFC 2865 中规定，可在 `https://datatracker.ietf.org/doc/html/rfc2865` 获取。


  另一种提供 AAA 功能的协议是终端访问控制器访问控制系统加（TACACS+），最初由 Cisco 系统设计。TACACS+ 通常用于控制对网络基础设施资源（如路由器）的访问，并使登录用户能够执行维护和其他管理功能。它支持用户身份验证并提供集中式用户访问授权方法，以及用户访问和操作的审计。其描述见
  IETF RFC 8907，网址为 `datatracker.ietf.org/doc/html/rfc8907`。


  ## SUMMARY


  安全性常被等同于数据的保密性，因此一个完全安全的系统只需不提供任何访问即可，这也保证了绝对的完整性。然而，可用性也是安全的一部分，因此必须授予对系统的访问权限。这会带来对安全其他要素的风险，包括真实性、不可否认性和保密性。IAM
  由旨在将访问限制在仅得到适当授权用户的流程和工具组成。这种限制必须在系统可用性的需求与其他要求之间取得平衡，例如防止不必要的更改或数据未经授权的访问。


  IAM 涵盖逻辑和物理访问控制、身份证明等管理控制、访问配置生命周期，以及身份联合或提供安全远程访问等技术系统实现。用于配置、审查和取消配置访问的生命周期应始终设计为管理提供对数据和系统访问所固有的风险，并将其与组织使命或目标取得平衡，而这些使命或目标由用户访问和处理数据来支持。

  '
- "# DOMAIN 6\n\nSecurity Assessment and Testing\n\n**AN *ASSESSMENT* IS AN** 对对象的评估，例如特定风险发生的可能性或组织安全流程文档的质量。*audit*\
  \ 类似，但是一种更正式的流程，涉及针对既定标准进行系统分析，以确定对象是否满足一组标准。两者都旨在衡量目标，例如组织面临的技术风险或系统的安全态势。例如，风险评估会识别组织拥有的资产，然后衡量或估计可能影响这些资产的风险的可能性和影响。相比之下，系统审计确定所讨论的系统是否满足支付卡行业数据安全标准（PCI\
  \ DSS）等权威机构设定的特定客观要求。\n\n审计和评估这两个术语经常被互换使用，但对于 CISSP 来说，了解它们之间的差异并在设计或监控安全计划时适当使用每个术语非常重要。两者都用于收集执行监督所需的信息，并支持确定安全控制的有效性和任何必要的补救措施的努力。\n\
  \n评估或审计的输出是一份报告，详细说明所采取的行动和发现。这可能包括具体的差距或问题清单，这些代表了组织的风险。未按预期工作的控制被称为 *deficiencies*，并指出了未得到适当缓解的风险。差距是组织缺少风险缓解的领域，可能由于新风险或现有控制不足所致。在这两种情况下，这些输出应像任何其他风险一样对待——优先修复并制定明确的补救行动计划。\n\
  \n测试是一种收集信息的方法。它可作为执行审计或评估的一部分使用，也可作为安全监控和监督的一部分独立使用。自动化和常规测试可以持续验证安全控制的有效性，并提供及时的数据以纠正问题。\n\
  \n## DESIGN AND VALIDATE ASSESSMENT, TEST, AND AUDIT STRATEGIES\n\n与所有安全措施一样，审计、评估和测试都会产生成本。Certified\
  \ Information Systems Security Professional（CISSP）应意识到这些成本，并制定策略以高效利用资源来执行监控活动，因为它们可用于识别和解决风险。审计或评估的范围和目标应设计为确保基于其对组织的价值以及满足监管或合同要求等义务，对适当的系统、流程和服务进行评估。\n\
  \n\n\n\n\n各种审计和评估方法标准都存在，可作为指导组织战略的起点。利用标准方法具有关键优势，包括可重复的测试和随时间推移更具可比性的结果。逐年按照同一标准进行审计可以证明组织在安全工作上的支出带来的投资回报（`ROI`），以及关键安全实践或流程成熟度的提升。本文介绍的所有概念将在本章后面的“Conduct\
  \ or Facilitate Security Audits”部分中更详细地重新讨论。\n\n## Internal\n\n审计、评估和测试可以从两个角度进行。内部评估是在组织内部进行，使用组织的人员和资源。任何使用第三方评估员或审计员的情况都构成外部视角，这将在下一节中讨论。在设计审计策略时，不同的情况将驱动内部、外部或甚至同时使用两种审计视角的选择。\n\
  \n要进行内部审计，组织必须在员工中具备足够的技能和知识，必须有足够的时间和资源来执行审计，并且审计或评估不得要求由完全没有利益冲突的独立观察者执行。内部视角进行的评估适用于持续或连续评估流程的一部分，并且通常作为持续监控的一部分使用，并辅以频率较低的外部审计。\n\
  \n根据组织规模，可能需要有一名全职员工专门从事评估活动，或者评估的某些部分可分配给多名员工。例如，访问控制审查通常每季度进行一次，可能只需要几个小时的工作，因此一名\
  \ IT 员工可以在其他工作任务之外执行它们。在拥有复杂用户访问需求、多个办公室以及数百或数千个系统的跨国大型组织中，访问控制审查可能是一份全职工作。\n\n\
  有一句通用的说法：“谁写了政策就不应该去审计它”，而减轻利益冲突是审计或评估策略中的重要要素。内部审计员可能无意中对缺陷视而不见，也可能出于维护其职位利益而故意掩盖错误或不足。在某些情况下，这种利益冲突可以通过使用不直接向被审计部门主管汇报的内部审计团队来缓解。\n\
  \n虽然利益冲突可能是内部审计的问题，但对组织使用的技能、流程和系统的更深入了解是一个潜在的积极因素。内部测试人员可以利用内部人士的知识更准确地执行测试或评估，这有助于识别与内部威胁相关的问题。对具有复杂规则的复杂系统（如职责分离（`SoD`））进行测试对外部人员来说可能具有挑战性。\n\
  \n以下是在内部进行可能最合适的测试类型：\n* 漏洞扫描，尤其是例行扫描以查找未修补软件或未知资产\n* 流程和程序审计，如变更管理或培训完成情况\n* 钓鱼模拟\n\
  \n## External\n\n进行审计、评估和测试的另一个视角是组织外部。外部审计员不应有利益冲突，因为他们是受付费进行公正评估，而不是提供使自己的部门看起来良好的报告。外部评估还可以利用专业技能和知识，这些技能和知识很有价值但不需要全职。执行渗透测试，通常称为渗透测试，是一项重要且有价值的技能，但由于所需的专业技能和高薪，雇用全职渗透测试员对大多数组织来说都不具成本效益。聘请外部机构执行测试并与其他组织分摊成本是一种更明智的方法。\n\
  \n使用外部公司进行评估、测试或审计可以识别组织无意中不了解的问题；一双新的眼睛往往能更快地发现问题并提供组织原本会错过的见解。在某些情况下，尤其是出于法律或监管原因，外部测试可能是建议的甚至是必需的，例如针对成熟度模型的成熟度评估，这将在第\
  \ 8 章，“Software Development Security”中更详细地介绍。\n\n出于合规目的的审计——例如，`PCI-DSS`、`ISO 27001`和美国政府的联邦风险和授权管理计划（`FedRAMP`）——都要求使用独立的、授权的第三方审计员或评估员。这些评估的结果对于与被审计公司做生意的任何组织也需要可靠，因此使用没有利益冲突的第三方可以提高审计提供的保证。\n\
  \n## Third-Party\n\n大多数组织依赖一系列相互连接的组织，即*供应链*来支持其运营。一个拥有员工进行基本数据处理和协作的标准办公大楼就依赖硬件制造商、公用事业提供商以及可能还有云服务，仅举几例。供应链中的漏洞可能会影响组织，因此需要审计策略来识别供应链中的风险和相关缓解措施。\n\
  \n供应链审计是在第 1 章，“Security and Risk Management”中介绍的主题，是任何安全风险管理计划的重要组成部分。健全的第三方审计策略必须确定范围，以包括对组织运营至关重要的任何第三方、处理对组织有价值的任何数据的第三方，或提供受监管服务（如支付处理）的第三方。审计可以由组织资源执行，也可以由组织聘请的第三方审计员对供应商进行审计。一些供应商可能能够提供由受信任第三方执行的报告，例如服务组织控制\
  \ 2（`SOC 2`）类型 II 报告，该报告提供有关供应商安全控制及其有效性的详细信息。`CISSP`必须核实其组织使用的服务是否在供应商提供的审计报告范围内。\n\
  \n# CONDUCT SECURITY CONTROL TESTING\n\n测试控制措施对于确保其按预期实施和运行以减轻风险至关重要。随着时间的推移，流程和系统会发生变化，组织面临的风险也在演变，因此`CISSP`必须设计控制测试计划，以提供有关控制状态的可靠和准确数据。这是至关重要的监督工作，必须支持在发现控制存在缺陷或不再有效时采取行动的能力。\n\
  \n测试可以从内部或外部视角进行，并且可能针对人员、流程和技术方面的复杂控制实施。例如，测试媒体处置控制可能涉及政策和程序审查、员工访谈、处置记录检查，以及对已处置的硬盘或其他媒体进行物理抽样，通过将其插入计算机来测试数据是否可恢复。\n\
  \n## Vulnerability Assessment\n\n\n\n\n\n漏洞，即可能被利用的弱点，是风险管理的主要组成部分，并在第 1 章中有详细讨论。漏洞通常比风险评估更频繁地被披露，因此持续的漏洞评估是持续监控策略的关键要素。服务器、路由器、操作系统和应用程序等硬件和软件资产都可能受到攻击，因此在攻击者之前进行技术测试以识别漏洞是有用的。发现漏洞是过程中的一个步骤——评估漏洞的影响并优先处理修复工作也很重要，这正是安全从业人员技能发挥价值的地方。\n\
  \n评估已识别的漏洞包括分析其对组织的影响，考虑到组织独特的配置或情况。例如，允许攻击者完全接管并删除数据的漏洞对于组织的财务系统来说会造成极大的破坏，但对于仅分享办公室咖啡馆每日菜单等新闻的内部公司门户来说，只会造成轻微的干扰。员工随时可以走到咖啡馆查看打印的菜单！漏洞扫描器的输出还可以识别不安全协议的使用，例如文件传输协议（FTP），通常应避免使用。然而，可能存在补偿性控制措施来降低风险，例如网络分段或仅将\
  \ FTP 用于公开访问的非敏感数据。\n\n## 资产清单\n\n识别组织的关键资产是执行漏洞评估的重要前提。了解要扫描的系统类型及其关键性对于选择合适的扫描工具和优先安排扫描工作至关重要。资产清单应捕获来自其他组织流程的数据，例如业务影响评估（BIA），该评估可识别每个系统、应用程序或数据资产的关键性。对高度关键系统的漏洞应优先处理，因为利用低关键性系统的漏洞不太可能扰乱运营。\n\
  \n资产清单还可能捕获重要数据，例如系统分类，用于确定漏洞评估的范围。处理敏感或受监管信息的系统可能对漏洞评估有特定要求，例如必须扫描的频率、执行扫描时使用的特定配置，或用于比较的基线。扫描目标的范围也可以使用资产清单来确定；例如，清单中标记为\
  \ PCI 的所有资产可能使用 PCI 合规配置每周扫描一次，而内部非敏感资产可能使用组织的 安全基线配置每月扫描一次。\n\n## 扫描工具功能和注意事项\n\
  \n许多流行的扫描工具可以识别主机、网络或应用程序中的漏洞。这些包括免费使用的开源工具以及商业选项；选择使用开源或商业工具可能包括支持的可用性、扫描特定系统或平台的能力以及操作工具所需的技能水平等因素。专有工具可能提供更多功能和支持，但价格也相应更高。\n\
  \n大多数扫描工具提供类似的基础功能集并以相同的方式运行。这些自动化工具识别目标，可能是单个网络端点或一系列 IP 地址，然后发送网络流量并监听响应以确定 IP\
  \ 地址是否在使用。一旦发现资产，扫描就会执行其他自动化操作以识别漏洞，例如端口扫描以识别 FTP 等活动服务，或系统特定检查，例如查询 Windows 注册表以识别已安装的软件和补丁级别。一些扫描器可以执行应用程序特定检查，例如识别\
  \ Web 服务器支持的加密密码套件。\n\n一旦漏洞扫描器识别出相关信息，它就可以将此信息与已知漏洞列表进行比较。例如，运行过时 Linux 内核版本的 Linux\
  \ Web 服务器可以与该版本中已知漏洞的列表进行交叉引用；漏洞扫描器的输出就是漏洞列表，可用于识别需要采取的补救措施——在这种情况下，应用补丁。扫描输出应为每个发现识别关键性或严重性评级，通常使用通用标准，例如通用漏洞评分系统（CVSS）分数或特定的通用漏洞和暴露（CVE）引用。\n\
  \n在选择和配置漏洞扫描器时，有几个重要考虑因素可确保其提供有价值的输出。CISSP 应该了解这些因素如何影响工具的输出，并在两者之间取得平衡，以确保从工具中获得最大收益。\n\
  \n* **义务**，例如法律、合同或监管要求，可能规定扫描的范围、覆盖范围或频率。免费漏洞扫描器可能适用于没有受监管数据的较小环境，但对于受严格监管的金融服务公司来说可能不足。\n\
  * 扫描器的**深度、范围或覆盖范围**，包括通过使用管理员凭据对扫描目标进行身份验证来执行高级扫描的能力——有时称为*凭据扫描*。漏洞扫描器可能会产生误报或仅通过查看外部可访问信息提供低分辨率信息，但许多扫描器可以配置凭据，例如管理员密码或安全外壳协议（SSH）密钥，允许扫描器登录并执行额外检查。\n\
  * **平台支持**是具有混合 IT 环境的组织的主要考虑因素，例如 Linux 和 Windows 服务器操作系统或 macOS 和 Windows 工作站操作系统。与所有\
  \ IT 工具一样，漏洞扫描器的要求应被定义，例如平台支持或执行凭据扫描的能力。\n* **云环境**可能对漏洞扫描提出独特挑战。软件即服务（SaaS）环境可能由于其带来的运营开销而阻止用户执行漏洞扫描，这会降低系统性能，并且并非所有漏洞扫描器都可针对本地网络之外的目标运行。一些服务提供商会分享他们自己的漏洞扫描实践的详细信息，这可以作为供应链风险管理的一部分进行审查。\n\
  \n## 常见漏洞评估问题\n\n与许多自动化安全工具一样，漏洞扫描器可能会导致问题或遇到问题。避免这些问题需要安全从业人员进行规划以制定策略。以下是一些常见示例：\n\
  \n* 流量过大和拒绝服务（DoS）\n* 警报或事件\n* 跨职能所有权\n* 数据完整性污染\n* 网络分段\n\n### 流量过大和 DoS\n\n漏洞扫描器会产生大量流量，消耗网络带宽，并可能导致网络和系统出现\
  \ DoS 状况，这些网络和系统难以处理信息。适当的配置可降低这些问题的可能性，例如实施请求节流以限制扫描器在给定时间段内生成的请求数量。凭据扫描也有助于减少流量——凭据扫描可以直接从服务器操作系统读取配置信息以查看哪些端口是开放的，而无需向每个端口单独发送流量。\n\
  \n\n\n\n## 漏洞扫描注意事项\n扫描调度也可能很有用，以确保扫描在用户活动较低时进行。将扫描分散到更长的时间段内也很有用——每天扫描少数几台主机可以降低对整个网络扫描的影响。\n\
  \n### 警报与事件\n扫描主机以识别开放端口、已知漏洞或其他弱点是攻击者常用的策略。当漏洞扫描器执行相同操作时，特别是如果扫描触发了 DoS 攻击或异常主机活动，它会生成安全警报并可能触发事件响应（IR）流程。许多安全工具旨在标记攻击者和漏洞扫描器共同使用的活动，例如顺序端口扫描。攻击者可能会按顺序向每个端口号发送请求以识别可被利用的开放服务，这看起来与漏洞扫描器识别开放服务相似。配置其他安全工具以忽略合法的漏洞活动至关重要，例如将来自漏洞扫描器\
  \ IP 地址的端口扫描标记为非可疑。\n\n### 跨职能所有权\n跨职能团队和扫描结果的所有权可能是一个问题，要求 CISSP 不仅具备安全技能，还具备项目和业务管理技能。漏洞扫描器通常由安全或\
  \ IT 团队拥有，而发现漏洞的应用程序和网络资产则属于另一个团队。在这些团队之间建立关系至关重要，以确保漏洞得到认真对待并得到解决；否则，资产所有者可能会简单地忽略安全团队发来的有关扫描器发现问题的电子邮件！\n\
  即使资产所有者对漏洞评估的发现持开放态度，传达任何发现的背景也可能存在额外问题。例如，非安全人员通常不理解 CVSS 分数，因此这些分数对于优先修复发现的问题没有用处。向受众传达背景信息很重要，可能需要以最适合资产所有者的方式格式化结果。\n\
  \n### 数据完整性污染\n漏洞扫描器可以执行自动操作，例如在 Web 应用程序上填写表单字段以检查包括结构化查询语言（SQL）注入或跨站脚本（XSS）在内的漏洞。此测试数据显然不是属于系统的真实数据，可能会导致期望系统中存储有效数据的报告或流程出现问题。某些扫描器可以配置为忽略某些类型的字段，例如电子邮件地址（这可能导致发送非预期消息），或扫描器可以配置为输入一种可识别的测试数据，该数据在扫描后可以轻松忽略或清理。可能有必要对完全不同的环境进行漏洞评估，例如与生产环境配置完全相同但没有实时生产数据的暂存环境。\n\
  \n### 网络分段\n使用防火墙等访问控制将网络的不同部分分段或隔离是一种安全最佳实践，但在尝试进行漏洞扫描时可能会造成问题。漏洞扫描器本身就是一个网络端点，并且需要访问扫描范围内所有其他端点；如果网络使用虚拟局域网（VLANs）、路由器或防火墙规则进行分段，扫描器可能无法到达其目标。零信任网络架构和微分段在云计算环境中尤其具有挑战性，在这些环境中这些原则是默认设置，并且访问遵循默认拒绝、例外允许的模型。分布式扫描是一种架构，它将扫描代理放置在网络段内部以允许该段中的端点被扫描，然后将结果汇总到中央控制台。\n\
  \n## 渗透测试\n渗透测试，或简称渗透测试，与漏洞评估类似，但更进一步。漏洞评估仅识别并报告系统中的漏洞，而在渗透测试中，测试人员将尝试利用已识别的漏洞。测试人员寻求模仿攻击者用于识别和利用漏洞的相同流程，这些测试人员通常被称为道德黑客。道德黑客有一个关键区别——结果是一份组织可以用来修复漏洞的报告，而真实攻击的结果通常是经济利益、盗窃或破坏。\n\
  渗透测试中漏洞的利用既有好处也有缺点。如果存在补偿性控制措施，很难证明漏洞扫描器的结果是否真的可以被利用。渗透测试人员通常使用漏洞扫描器来识别漏洞，然后尝试利用它们，从而证明或否定漏洞的严重性。这种方法的潜在缺点包括成本以及由于测试活动而导致中断风险增加。聘请合格的渗透测试人员比单纯运行漏洞扫描工具更昂贵，并且对缺陷的主动利用可能导致系统停机和停机时间；尽管测试人员通常避免造成中断，但事故或非预期后果可能会发生并且确实会发生。\n\
  提供给渗透测试人员的信息量取决于组织对测试的目标。不同的信息级别及其支持的测试目标包括以下内容：\n* 白盒或水晶盒测试是完全透明的。渗透测试人员对要测试的系统或网络有完全了解，例如\
  \ IP 地址和系统版本号。此名称暗示了对被测试“盒子”内部的透明度或照明，因为测试人员拥有详细信息和知识。这允许更完整的测试覆盖范围并模拟内部威胁，尽管旨在将此信息隐藏在外部人员之外，例如网络地址转换（NAT）的控制措施不会被评估。\n\
  * 黑盒测试向攻击者提供零知识，而是依靠他们进行侦察以收集详细信息。该名称表明系统内部（“盒子”）对测试人员完全处于阴影或黑暗中。这可以验证旨在将信息如内部网络配置隐藏在外部人员之外而设计的控制措施，但存在测试人员无法发现的资产而遗漏的风险。\n\
  * 灰盒测试结合了白盒和黑盒方法的元素。会向渗透测试人员提供一些信息，但他们也负责查找其他信息如内部网络配置。\n与渗透测试人员不同，攻击者通常不受时间和需要按计费小时工作以支持客户服务等限制。决心的攻击者可以花费数周、数月甚至数年观察组织的网络和资源，而渗透测试合同很少持续超过几周。即使是技术高超的渗透测试人员也可能在此有限时间内遗漏某些内容，因此灰盒测试提供了混合优势。\n\
  \n### 渗透测试规则\n渗透测试是一种本质上危险的活动，可能导致内部事件甚至法律问题。如果测试导致非预期后果，许多渗透测试合同都包括对提供测试服务的个人或组织的赔偿；这可以防止订购测试的组织采取法律行动，例如提起诉讼。如果没有此类合同，渗透测试人员如果其测试活动导致中断，可能被指控犯有刑事活动或业务中断。\n\
  \n\n\n# 渗透测试参与规则与阶段\n\n渗透测试参与应包含明确的行为规则，其中记录了渗透测试团队可以执行行为的严格指导方针。例如，如果发现漏洞并且可以被利用来发起拒绝服务攻击，渗透测试人员应记录它，但可能被禁止利用该漏洞。制定适当的行为规则和管理渗透测试参与是\
  \ `CISSP` 需要执行的关键任务。\n\n## 行为规则\n\n渗透测试的行为规则文档应为测试人员提供一套遵循的底线规则，并为组织提供足够的协调必要资源和计划的信息。例如，如果测试可能触发安全事件，则可能需要对适当人员进行简报，以确保他们相应地校准响应。与激活应急计划相比，第一步可能是确认事件是否由测试活动导致。在这种情况下，组织的完整响应能力未被测试，渗透测试人员的结果可用于识别和解决安全缺陷。行为规则文档中通常定义的项目包括以下内容：\n\
  \n* 测试范围内的系统、办公室或其他目标有哪些？\n* 是否有任何系统、办公室或其他目标被明确排除在测试范围之外？\n* 是否禁止任何测试方法，例如社会工程或密码破解？\n\
  * 物理安全是否在范围之内？如果是，包含哪些设施或目标？\n* 测试人员将被授予什么级别的访问权限？可能会为测试人员配置账户，以便评估内部威胁，或在他们能够获得未经授权的访问时执行验证活动。\n\
  * 预期的沟通方式和频率是什么？一些组织可能要求立即通知任何潜在的关键安全问题，而其他组织可能满意等待最终报告。\n* 谁执行测试，允许使用什么设备和软件，以及测试何时进行？\n\
  * 处理敏感数据（如内部网络配置、客户记录等）应使用什么程序？\n* 测试结束时敏感数据将如何安全处置？\n* 预期的服务水平是什么。例如，如果实施了修复，测试人员是否会立即进行重新测试或等待定义的重新测试期？\n\
  * 对文档的期望是什么，具体来说是发现的任何问题的细节，展示为验证测试结果而完成的工作，以及任何报告的格式？\n\n## 渗透测试阶段\n\n渗透测试活动可以根据渗透测试人员的目标分解为一系列逻辑相连的阶段。第一个目标是收集信息，这些信息用于查找测试人员随后尝试利用的漏洞。最后阶段是记录报告，这正是渗透测试与攻击流程分歧的地方——大多数攻击者不会记录其发现结果以帮助组织改进网络防御！图\
  \ 6.1 总结了这些阶段，下面各节将对其进行描述。\n\n![图 6.1 渗透测试阶段](img/c06f001.png)\n\n**图 6.1 渗透测试阶段**\n\
  \n### 第 1 阶段：发现或侦察\n\n发现或侦察要求渗透测试人员收集有关目标的信息。这通常从开源情报（`OSINT`）开始，因为测试人员希望模仿攻击者并保持未被发现。`OSINT`\
  \ 来源包括以下内容：\n\n* **社交媒体** 用于识别目标或用于网络钓鱼的有用个人详细信息。\n* **公开记录** 如域名系统（`DNS`）或包含有关服务或位置信息的公司网站。\n\
  * **攻击面数据** 如枚举与目标 DNS 记录关联的 IP 地址以及有关正在使用服务的潜在详细信息。也可以使用公开可用的工具 `Shodan` 或 `Have\
  \ I Been Pwned`。\n* **物理观察** 如监控员工行动、拍照、路过或观察设施，或翻垃圾桶以获取纸质副本。\n\n渗透测试人员通常会尝试规避组织的检测，并寻求组织监控能力之外的信息，如\
  \ DNS 记录，这些记录可公开访问并由域名注册商维护。并非所有渗透测试人员都会进行广泛的发现，尤其是在白盒或灰盒测试中，组织已提供这些信息。\n\n### 第\
  \ 2 阶段：扫描和探测\n\n一旦在第 1 阶段收集了基本信息，测试人员就会识别潜在目标并收集更详细的信息。例如，通向包含非敏感数据的营销网站的 IP 地址可能被归类为低优先级目标，而明显托管高价值目标（如\
  \ `remote.*` 或 `webmail.*`）的 URL 则会被优先考虑更高。\n\n扫描和探测需要向组织或目标系统发送一些流量，这会带来被组织安全流程检测到的风险。以下是渗透测试人员在此阶段可能使用的工具和资源：\n\
  \n* **网络足迹分析：** 测试人员定义网络的足迹，即存在哪些端点以及其上运行的服务。像 `Nmap`、`nslookup`、`ping` 扫描和端口扫描之类的工具用于执行查询，以确定网络上活动的网络主机和服务。\n\
  * **横幅抓取：** 测试人员分析端点返回的信息，其中通常包含有用的信息，包括软件名称和版本。\n* **漏洞扫描：** 虽然这是一种显而易见的方法，但使用漏洞扫描器会提高渗透测试人员的效率。这些工具可自动执行诸如足迹分析和从横幅中解析信息等任务。\n\
  * **利用工具包：** 像 `Metasploit` 这样的工具将侦察、足迹分析、漏洞扫描以及部分或完全自动化的利用组合到单一软件界面中。由于这些工具结合了多种功能，因此在多个阶段中使用。\n\
  \n### 第 3 阶段：利用\n\n这个第三阶段不言自明——测试人员利用已识别的漏洞并尝试获得访问权限。他们可能会使用参与规则中定义的多样化方法，这些方法将在后面的章节中详细讨论。利用的目标是获得不应可访问的系统或数据的访问权限。以下是一些自动和手动利用工具：\n\
  \n* **利用工具包** 如 `Metasploit`，可自动化渗透测试的许多方面\n* **密码破解器** 如 `John the Ripper`、`Hashcat`\
  \ 或 `Hydra`，如果测试人员收集了哈希密码并需要识别有效密码，则很有用\n* **监控工具和代理** 如 `Wireshark` 和 `Burp Suite`，允许测试人员捕获、分析和修改网络流量\n\
  * **应用程序安全工具** 如 `Nikto` 或模糊测试工具，可识别并尝试利用诸如缓冲区溢出或 SQL 注入之类的应用程序漏洞\n\n虽然渗透测试人员试图模仿攻击者，但他们可能存在一些限制。攻击者通常不会在时间框架或预算内工作，这使他们拥有更多资源用于搜寻和利用漏洞。渗透测试人员可能仅限于标准工具集，而攻击者可能拥有更多自由来尝试新工具和流程。\n\
  \n\n\n由于渗透测试活动可能导致实际的运营和安全事件，因此安全从业人员密切监控流程非常重要。虽然渗透测试人员通常会避免造成重大中断，但他们可能会发现导致应用程序崩溃或数据损坏的漏洞。诸如运营中断之类的非预期后果应迅速告知测试人员，以便停止测试活动，并且可能还需要内部沟通来提醒人员进行测试活动，避免采取激进措施，例如启动昂贵的灾难恢复计划。\n\
  \n## 第 4 阶段：后利用\n\n一旦测试人员获得初始访问权限，他们将尝试 *横向移动* 或利用该访问权限获得进一步访问。例如，入侵非军事区（DMZ）中的系统价值并不高，因为敏感数据通常不会存储在此处。然而，DMZ\
  \ 资产可能被授权连接到内部网络段上的端点，这可能使测试人员未经授权访问更有价值的目标。\n\n被攻破的 DMZ 甚至可用于重复第 2 阶段活动，并对网络外部无法访问的内部资源进行网络足迹探测。发现的端点或资产将被分类，并将重点关注高价值目标。一旦网络端点被枚举，就会使用各种技术对其进行指纹识别——目标是发现有用的详细信息，如操作系统和应用程序软件版本。测试人员会在被发现、时间耗尽或用尽所有已识别可能性之前，对这些目标尝试利用。\n\
  \n## 第 5 阶段：报告\n\n在整个测试过程中，应创建文档以记录执行的所有活动、发现的漏洞以及测试人员获得的任何访问权限。这些发现会被汇总成报告，通常测试人员会为组织提供修复任何已识别漏洞的建议。该报告通常在正式会议上提交，这标志着渗透测试任务的结束。\n\
  \n不同的报告或报告的不同部分可能针对不同的受众设计。执行摘要通常会包含范围、所执行测试的高层次概述以及发现数量，常用于与管理层或组织外部用户共享，而更技术性详细的报告部分则放在单独的文档或附录中，供内部\
  \ IT 人员使用。\n\n## 物理渗透测试\n\n物理安全是保护系统和数据的重要方面，因此一些组织可能需要进行物理渗透测试。测试人员尝试未经授权访问办公室或数据中心等设施，目的是识别物理安全控制中的潜在弱点。诸如携带笨重物品并请他人代为开门或伪装成官方人员出现之类的社会工程手段经常被利用。\n\
  \n在某些情况下，未经授权的物理访问特定设施是非法的，因此应为物理渗透测试人员提供一张 *免罪金牌* 卡，详细说明其活动的目的以及组织内可以核实其说法的联系人。如果测试人员被捕获或拘留，则测试结束，因为他们未能获得访问权限并逃避检测，并且可以出示该卡以帮助他们避免潜在的法律麻烦，例如被逮捕并被控非法入侵。在高安全性的组织中，尤其是有武装警卫的组织中，重要的是与警卫人员等利益相关者妥善协调渗透测试，以确保他们在发现测试人员时能够适当应对。\n\
  \n## 日志审查\n\n日志和监控的基础知识在 第 7 章，“安全运营” 中有所介绍，但 CISSP 应该记住日志在安全计划中作为侦测控制发挥着重要作用。它们可以由大多数系统、端点、设备和应用程序生成，并且应打开日志生成功能并配置为捕获有意义的信息。通过审查这些信息使其变得有用——如果攻击者已获得访问权限，而记录恶意活动的日志被忽略，攻击者可能会逃避检测。\n\
  \n评估和审计通常依赖日志条目作为证据，直接证明组织的 technical controls 已到位并按预期运行。例如，如果组织的访问控制策略规定对关键系统的访问仅在正常工作时间内可用，则审计人员可能会查找该控制的正面和负面执行情况：执行此限制的系统配置，以及显示用户在尝试在定义时间之外访问时被拒绝访问的日志。\n\
  \n日志管理实践本身也受审计和评估的约束。应制定日志生成、管理和审查的政策、程序和技术配置，审计人员可能会检查这些内容以确定是否符合 ISO 27001 控制\
  \ A.12.4、PCI-DSS 要求 10.6 或 NIST SP 800-53 中审计和问责（AU）系列控制等标准。\n\n## 合成事务\n\n合成事务是对受监控目标运行的自动化活动，用于衡量其性能。对于\
  \ Web 应用程序，这可能涉及使用测试用户账户登录，以验证应用程序是否响应登录请求或对查询返回数据。术语 *交易* 不一定指金融交易，而可以是查询数据或请求服务等任何系统活动。受监控对象可以是任何系统或应用程序，例如\
  \ DNS 或动态主机配置协议（DHCP）服务器，而合成事务是对 DNS 解析或 IP 地址分配的请求。\n\n合成事务可作为测试机制用于多种目的：\n\n*\
  \   **SLA 监控：** 主机或基于云的服务可能保证一定的服务水平，例如保证 99.9% 可用时间的 SaaS 应用程序。合成事务可用于每小时登录应用程序，以验证服务是否达到约定的水平。\n\
  \n*   **数据完整性监控：** 具有复杂业务逻辑的系统可能有处理数据的动态规则。合成事务可用于监控这些规则，并在处理一组测试数据未产生预期结果时提醒管理员，这表明业务逻辑规则存在问题。\n\
  \n*   **系统或服务监控：** 即使没有服务水平协议（SLA），系统也可以被监控以确保其在线并按预期响应。这通常被称为 *心跳监控*，是一种侦测控制，可识别离线或无响应的服务。\n\
  \n真实用户监控（RUM）通常与合成事务一起讨论。RUM 实时监控用户与应用程序或服务交互的情况，可用于检测缓慢或无响应的页面等问题的有用。遗憾的是，RUM 工具也带来了隐私问题，因为它们通常会记录用户与应用程序或网页的每一次交互。这包括用户输入的敏感数据，可能被\
  \ RUM 代理捕获。即使应用程序保护用户输入的数据，RUM 工具也可能不保护；一些 RUM 工具因记录和存储敏感或受监管的信息（如财务数据和用户密码）而导致数据泄露。\n\
  \n## 代码审查和测试\n\n\n\n# 代码审查与测试\n\n代码构成软件，是信息系统的基础，因此审查和测试代码以识别并修复缺陷是一项基本的安全控制措施。代码中的错误或漏洞可能会影响整个系统的安全性以及其存储或处理的数据。有关代码审查、测试和软件安全的其他主题在\
  \ 第 8 章 中有所涵盖，包括用于评估或描述软件漏洞的常见框架，如通用弱点枚举（CWE）、CVSS 以及开放式 Web 应用程序安全项目（OWASP）十大安全漏洞。\n\
  \n尽管 CISSP 可能不直接负责编写或维护系统中的代码（这是软件开发人员的职责），但了解充分的代码审查和测试措施的重要性至关重要。代码测试应设计并实施以检测和纠正软件漏洞，理想情况下应在代码编写时接近时间点检测到缺陷。在代码仍在开发期间进行更改通常更容易，并且可以使用两种主要方法来支持这一目标：\n\
  * **Black-box testing:** 测试人员无法访问源代码或应用程序的内部工作原理，模拟外部攻击者或用户的视角。\n* **White-box testing:**\
  \ 测试人员可以访问源代码或了解应用程序的内部元素，如应用程序编程接口（`API`），而局外人则无法获得。\n\n代码测试可以使用自动化工具或手动流程进行，例如代码同行评审，开发人员手动审查和编辑同行的作品以发现错误。诸如\
  \ *static code analysis* 之类的自动化工具使用软件来模拟代码的执行并识别潜在的漏洞，例如缓冲区溢出或程序执行期间可能出现的不一致数据条件。*Dynamic\
  \ analysis* 测试实际运行的程序以观察系统或应用程序的行为。\n\nCISSP 应确保代码审查和测试控制措施满足安全和业务需求的目标。例如，测试应提供应用程序代码的充分覆盖，以检测缺陷，而不会在软件开发过程中引入不可接受的延迟。DevSecOps\
  \ 中的开发实践在持续集成/持续交付（`CI/CD`）管道中大量依赖于自动化、可重复的测试，以平衡交付速度和安全性，而诸如安全编排、自动化和响应（`SOAR`）等新兴安全概念也同样侧重于自动化安全事件响应；这两个主题在\
  \ 第 8 章 中有详细介绍。这些测试应通过不定期进行的渗透测试或正式代码测试等手动测试来补充，以确保进行更深入的分析。\n\n## Misuse Case Testing\n\
  \n误用案例或负面测试旨在评估系统或应用程序对意外输入或情况的响应方式，并识别在这些意外情况下可能被利用的漏洞。在软件开发的背景下，用例描述了参与者（通常是用户或流程）与系统之间预期的交互。例如，系统登录的用例将描述用户到达登录提示、输入其凭据，然后根据情况被授予或拒绝访问的步骤。*misuse\
  \ case* 描述的是相反的情况：当系统未按预期使用时会发生什么？\n\n当用户在登录提示时提供不完整或意外的信息时，已在多个应用程序中发现漏洞。用例期望用户输入用户名和密码；相反，用户输入用户名但将密码留空。这可能会导致应用程序崩溃，更糟糕的是——苹果的\
  \ macOS 存在一个漏洞，其中通过提供用户名“`root`”并将密码字段留空即可访问安全配置设置，如 `CVE-2017-13872` 所记录。\n\n误用案例测试的常见要素应纳入系统测试计划和活动中，通常侧重于在应用程序字段中输入意外值时的系统行为，例如不正确的数据格式或与预期显著不同的数据。例如，当在期望输入数值值的字段中输入一串文本，或将整本书的文本粘贴到仅设计用于包含几个词的字段中时，应用程序会如何表现？空值或空白值也应考虑，如先前描述的身份验证漏洞所示，其中用户名和空白密码错误地授予了访问权限。\n\
  \n误用案例可以测试应用程序在非故意情况下的行为，例如用户意外地在其手机号码字段中输入姓名。*Abuse case* 测试模拟系统或功能可能以未预期的方式被滥用的方式，并具体描述攻击者可能如何利用此弱点。对这些案例建模有助于识别对系统或其数据的威胁，并有助于设计控制措施以减轻风险。OWASP\
  \ 提供了 Abuse Case 建模和测试的速查表：`cheatsheetseries.owasp.org/cheatsheets/Abuse_Case_Cheat_Sheet.html`。\n\
  \n## Test Coverage Analysis\n\n测试覆盖率是指系统或应用程序中经过测试的函数数量，可以表示为已测试的系统总量的百分比，或测试的具体数量，例如函数或模块。测试涉及成本，因此安全从业人员的一个关键关注点是确保即使由于成本原因无法测试所有功能，也能为关键系统功能实现充分的测试覆盖率。由于代码测试可能是组织内其他团队的责任，CISSP\
  \ 可能是负责传达需求并验证测试计划设计以确保所选工具和测试策略达到预期覆盖水平的利益相关者。\n\n测试覆盖率分析衡量四个主要标准，以识别正在测试的程序或系统的子元素：\n\
  * **Branch coverage** 确保控制语句中的每个分支都已执行。\n* **Condition coverage** 要求代码中的每个布尔表达式都针对真和假条件进行验证。\n\
  * **Function coverage** 确保程序中的每个函数都被调用。\n* **Statement coverage** 验证程序中每个语句的执行。\n\
  \n额外的覆盖率测量包括更高级的标准，如 *decision coverage*，它验证函数和分支覆盖的组合以测试各种输入和输出场景，以及 *parameter\
  \ coverage* 以测试接受参数输入的函数的行为。这可以识别与意外或格式错误的输入相关的漏洞，对于接受用户提供数据的应用程序尤其有用。\n\n在理想情况下，系统或应用程序的测试覆盖率将为\
  \ 100%，但与此级别测试相关的成本和复杂性可能具有禁止性。CISSP 在制定可接受的测试覆盖率要求时，应确定诸如系统处理的数据的敏感性、对人类生命或安全的影响以及系统的组织关键性等标准，并应确保测试覆盖率充足。“充分”的定义在系统和组织之间会有所不同，但通常，像用户管理、系统管理和敏感数据处理等敏感功能应进行最彻底的测试。还可以考虑补偿控制措施来减轻未测试的系统元素，例如物理隔离系统或额外的持续监控目标。\n\
  \n## Interface Testing\n\n\n\n一个 *接口* 是与系统交互的接触点。示例包括用户界面（UI），它为人类用户提供与系统交互的方式，以及\
  \ API，用于系统间交互。UI 通常采用图形用户界面（GUI）形式，带有窗口和菜单，或使用命令行界面（CLI）进行基于文本的交互。API 可以使用多种方法实现，例如用于\
  \ Web 应用程序的表述性状态转移（REST）API、进程间通信（IPC）和远程过程调用（RPC）。\n\n评估接口功能和安全性是系统测试的关键部分。应在接口中实施安全控制，以支持保密性等安全目标，通过访问控制，或通过记录使用接口执行的操作来实现不可否认性。接口测试可能是开发人员进行的标准软件开发测试的一部分，也是安全从业人员监督的安全测试活动中的关键要素，例如漏洞评估、渗透测试以及像入侵模拟这样的安全测试。\n\
  \n与许多系统测试功能一样，接口测试应确定接口在典型使用和异常情况（如处理意外或格式错误的输入）下是否按预期行为。接口如同系统的所有元素一样，应具有明确记录的需求、测试用例和验收标准，以确定它们是否充分实现了所需的数据保护级别。\n\
  \n拥有大型复杂系统或分布式组件的组织可能会发现服务器接口测试是一个合适的关注领域。应用程序服务器、Web 服务器和数据库之间的接口是安全控制实施的关键点，应作为目标以测试多层安全控制的有效性。例如，如果\
  \ Web 应用程序接受用户提供的输入，则必须测试应用程序的输入验证控制，以确保其拒绝不正确的数据。如果此控制失败，则到应用程序服务器的接口还可能包含逻辑以验证传入数据是否符合预期参数，提供纵深防御的输入验证控制。\n\
  \nWeb 应用程序接口尤其复杂，因为可能包含组织无法控制的系统。具有外部用户的 Web 应用程序可能需要独特的访问管理控制，例如会话管理，以识别、验证和跟踪用户交互。如果\
  \ cookie 用于存储会话令牌或其他标识信息等信息，则在定义接口测试要求时应考虑外部用户系统与 Web 应用程序之间的接口。\n\n### 入侵攻击模拟\n\
  入侵攻击模拟或违规和攻击模拟（BAS）是一种新兴的自动化测试方法，旨在模拟现实攻击者尝试获得未经授权的访问。BAS 结合了漏洞扫描和自动化渗透测试的元素。BAS\
  \ 工具利用不断更新的攻击方法和新发现漏洞的数据库来测试组织抵御新演变威胁的能力。实施 BAS 解决方案可使此测试更频繁地进行，比传统的季度漏洞扫描或年度渗透测试等方法更早地发现潜在漏洞。\n\
  \nBAS 工具执行模拟攻击，其模式基于尝试入侵网络或系统时使用的真实攻击向量。如果模拟攻击被阻止，则安全控制按预期发挥作用。然而，如果攻击成功，则可能表明控制存在缺陷或存在现有控制未解决的新风险。BAS\
  \ 执行的攻击类别通常按目标或向量分类，可能包括以下内容：\n\n* **Endpoint:** BAS 对网络端点执行操作或针对网络端点执行操作，例如创建文件或进程以匹配已知恶意软件签名，从而测试端点检测和响应（EDR）能力。这可以通过\
  \ BAS 设备或控制台远程完成，也可利用在端点上运行的软件代理完成。\n* **Network:** BAS 发送应被阻止的网络流量，如果已知不良或恶意流量未被防火墙或路由器等控制阻止，则会生成警报。\n\
  * **Email:** BAS 生成并发送的测试消息可以测试垃圾邮件过滤器、电子邮件欺骗控制和内容过滤器。如果消息到达收件箱或被打开，则表明电子邮件安全控制存在缺陷。\n\
  * **Behavior-based:** 高级 BAS 功能可以测试基于行为的安全控制，例如监控恶意网络扫描或应由 Web 应用程序防火墙（WAF）阻止的与应用程序的复杂交互的安全工具。\n\
  \n### 合规检查\n合规框架通常结合特定行业或地区的风险集合，所需的安全控制旨在减轻这些风险。合规不应被视为安全目标，而应作为帮助组织风险管理计划的起点。\n\
  \n合规检查是监督的一部分，旨在验证为满足合规目标而实施的控制的状态。审计是检查此状态的常见方法；有关开展或促进审计的进一步细节将在本章后面介绍。正式审计或评估按既定时间表进行，例如\
  \ PCI-DSS 和 SOC 2 的年度审计，或每三年一次的 ISO 27001 审计。\n\n大多数合规框架都认识到，单次时间点的审计不是监控安全风险的有效方式。计划审计的目的是在特定时间点评估安全计划，合规框架通常包括对关键控制或领域进行更频繁评估的要求。一些合规审计，如\
  \ SOC 2 Type II 和 ISO 27001，要求在一段时间内评估安全性，因此审计人员将审查特定时间段（通常为过去一年）的数据和工件，以确定组织的安全计划在该期间是否按预期运行。以下是一些需要合规审计的安全和合规框架示例：\n\
  \n* **ISO 27001** 审计每三年由外部审计员执行以获得认证，而组织必须进行持续监控和监督，包括年度内部审计和监督审计。\n* **PCI-DSS**\
  \ 要求组织每年由第三方审计员进行审计，并执行例行内部活动，例如季度漏洞扫描。\n* **FedRAMP** 要求在初始完整安全评估后进行持续年度评估，并要求对关键风险实施持续监控策略，以维持运营授权（ATO）状态。\n\
  \n合规检查和持续监控（在 第 7 章 中讨论）具有共同目标：尽快识别弱点，并在攻击者发现弱点之前采取纠正措施。合规检查可以发现由于风险情况变化而存在缺陷或无效的控制，或不再得到正确执行的控制。CISSP\
  \ 应在执行这些合规检查的成本和运营开销与组织面临的威胁态势之间取得平衡，包括不合规的风险。\n\n## 收集安全流程数据\n\n\n\n# 监控安全控制有效性\n\
  \n## 持续监控与指标\n\n一旦组织识别出风险并实施了适当的控制措施来减轻这些风险，就必须监控这些控制措施的状态及其实现预期风险缓解效果的有效性。CISSP\
  \ 必须确保收集和分析足够的数据，以支持对组织安全控制措施减轻风险效果的监控和监督。持续监控的策略和实践在 第 7 章 中进行了讨论，后续章节将讨论应监控的数据来源。\n\
  \n持续监控是一项复杂的任务，要求组织具备成熟的网络安全能力。与任何复杂流程一样，最好分阶段实施，从基础工作开始，例如进行彻底的风险评估并设计安全控制计划以减轻已识别的风险。一旦这些控制措施到位，就可以制定日志记录和监控策略，从启用所有系统的日志记录、集中日志文件以及使用安全信息和事件管理（SIEM）平台等工具实现监控自动化等基础工作开始。\n\
  \n监控安全流程和控制实施所产生的数据量可能使监控任务变得难以承受。与查看原始数据相比，测量或指标对于识别趋势或有用信息非常有用。数据趋势可通过自动化手段进行分析，以生成诸如关键绩效指标（KPI）等趋势数据，而新兴的人工智能和机器学习（AI/ML）领域为自动化数据分析任务提供了一些解决方案。\n\
  \nCISSP 应能够在查看所有可能的安全流程数据源时识别出需要监控的相关信息。逐一审查每个变更请求单并不是有效利用时间的方式，但监控需要回滚的变更数量可以成为识别变更审查流程不足的有用方法。该指标支持明显的后续步骤——应审查变更审查流程和需要回滚的变更，任何发现都可为流程变更提供参考。\n\
  \n设计安全指标计划需要两个关键要素。首先，必须了解安全计划目标，因为这是指标的参考点。其次，安全控制必须提供测量或量化的方式。例如，如果所有登录都需要多因素身份验证，则可以查询访问控制日志以确定该要求是否\
  \ 100% 得到执行。\n\n## 技术控制与流程\n\n技术或逻辑控制是通过电子系统实现的，例如用于访问信息系统的用户名和密码提示，或防火墙的配置以拒绝来自已知恶意源的流量。由于电子系统通常原生支持日志记录，因此从技术控制中收集数据可能很简单。技术流程数据可能包括作为组织日志记录和监控策略一部分捕获的信息，也可能通过对该日志数据的分析生成。示例包括应用程序用户访问日志以及路由器或防火墙等网络设备的日志。\n\
  \n设计技术指标计划应以衡量组织实施多层安全性的有效性为目的。为此，有用的是在以下类别中捕获指标：\n\n* **Prevent:** 预防性技术流程包括数据加密和保护解密密钥的访问、网络访问控制（如虚拟专用网络（VPN））以及端点控制（如基于主机的防火墙）。\n\
  * **Detect:** 这些技术流程包括检测事件或偏差的任何控制措施，例如 EDR 和 SIEM。侦测性安全数据可能来自与运营重叠的控制措施，例如监控硬件或软件状态以检测意外中断。\n\
  * **Respond:** 当出现问题时，应急控制旨在纠正问题，包括 EDR 以及基于网络和主机的入侵防御系统（IPS）。\n\n## 管理控制\n\n管理控制是在政策和程序中实施的，例如可接受使用政策、访问审查程序以及人员安全控制（如工作轮换）。与技术安全流程不同，管理流程不会自动生成可轻松监控的审计日志等数据。有关管理流程的数据可能来自对流程\
  \ *工件* 的评估，工件是在流程执行期间创建或使用的对象。\n\n工件通常是间接来源，例如警卫记录他们在特定时间对设施进行了巡查，或警卫为巡查中发现的未锁工作站提交的事件报告。巡查记录表明流程已执行，而事件报告提供了违反屏幕清理政策的用户详情。直接来源通常包括文档，这可能令人困惑，因为文档通常以数字形式使用信息系统进行管理。即使数据来自信息系统，它仍然支持衡量管理控制。\n\
  \n例如，组织禁止在组织发放的设备上使用个人社交媒体的政策。该政策将具有管理组件，如可接受使用政策和员工培训与意识，并可能包括技术控制，如网络内容过滤器或阻止列表。关于该控制实施情况的指标可以衡量以下内容：\n\
  \n* **Policy reach:** 有多少用户通过签署表示已阅读并理解该政策？\n* **Education effectiveness:** 有多少用户尝试访问受限内容？\n\
  * **Technology effectiveness:** 根据网络流量，有多少用户能够访问受限内容，技术控制在执行政策方面的有效性如何？\n\n## 账户管理\n\
  \n账户是一组用于访问资源的凭证。用户名和密码是用户访问的常见示例，还有其他类型的凭证，如加密密钥，可用于保护数据并识别访问它的用户、系统或流程。身份和访问管理，包括用于配置、审查和取消配置这些访问控制元素的识别、身份验证、授权以及账户管理生命周期，均在\
  \ 第 5 章 “身份和访问管理” 中介绍。\n\n账户管理数据是在收集安全流程数据时需要重点关注的关键领域，因为访问控制是信息系统安全的基础。访问控制也是混合控制类型的典型示例——政策通过流程和程序实施，通过技术系统实施，并可能需要物理控制，如管理设施访问或保护账户令牌（如智能卡）。\n\
  \n例如，信息系统的账户管理要求。为了限制和监控访问，可以实施以下控制措施。这些控制措施生成的数据应被收集和分析以评估有效性。\n\n* **Administrative\
  \ process** 用于请求用户访问，包括在授予访问权限之前进行正式请求和批准。这可能需要访问请求单或纸质访问请求表。所有用户账户必须有相应的请求和批准文件，其中必须包含用户角色、访问理由和必要批准等所有必需信息。对这些流程和工件的审计和其他保证活动也是管理控制的一部分。\n\
  \n\n\n### 技术实现\n可能包括提交请求的系统、执行审查和审批的流程，以及用户账户创建的实际身份和访问管理工具，如 Active Directory、Okta\
  \ 或本地计算机操作系统。高度敏感的系统还可能使用网络访问控制，例如隔离的 VLAN 或限制性防火墙规则。如果系统支持唯一的 API 登录凭据，则可能还需要一种安全分发\
  \ API 密钥的安全方法，例如安全的 API 站点，以提供访问权限。\n\n### 物理\n控制措施也将用于强制执行访问控制，例如将信息系统组件放置在访问受限的空间中。用户访问控制的实现还可能利用物理设备，如令牌、智能卡或受信任设备，这些设备需要政策、程序和培训以确保受限的物理访问得到维护。\n\
  \n从账户管理流程中收集的关键流程数据包括以下内容：\n* 按时进行账户管理，例如在用户变更角色或离职后在规定时间内移除访问权限\n* 及时收到账户配置或去配置的通知，例如用户加入或离开组织后\
  \ 24 小时内通知\n* 按照组织定义的计划正确执行账户审查\n* 正确执行流程，例如密码的越权分发、密码重置前的适当验证，或正确配置的网络访问控制\n\n\
  ### 管理审查和批准\n管理层负责定义和执行组织的使命，包括安全和隐私等支持职能。在某些组织中，像 CISSP 这样的安全从业者会担任执行角色以管理使命目标，而在其他组织中，安全从业者将被要求向管理层提供与安全和隐私流程相关的数据。管理层对安全计划的支持和赞助至关重要，因为它提供了方向和支持。\n\
  本章讨论的每种技术和程序都在管理层监督安全计划中发挥作用。评估、审计以及对安全流程指标的持续监控为管理层提供及时数据，这对于决策至关重要，例如识别组织风险和适当的缓解措施。示例包括短期决策，如灾难导致需要启动业务连续性计划（BCP），或长期决策，如由于自托管与外包的成本效益而将架构从本地托管更改为基于云的系统。\n\
  应执行对安全流程数据的管理审查和批准，以确保控制措施按预期发挥作用；也就是说，它们将风险降低到可接受的水平，并且先前接受的风险仍在可接受的参数范围内。对组织运营环境的变化可能会使控制措施失效，即使它们以前足以降低风险。示例包括推出新的业务线、新增系统或流程、新的合规或监管义务，以及组织变更，如合并、收购和剥离。\n\
  为了对安全计划进行充分的审查和监督，组织的领导层将监控各种来源。持续监控计划应生成指标和绩效指标，这些指标依赖于安全流程数据。这些主题在本章的另一部分中讨论，与\
  \ 第 7 章 中涵盖的持续监控流程密切相关。\n\n### 合规性管理审查\n有几个框架正式定义了与安全相关的管理审查和批准流程。此监督任务是治理和风险管理的一个关键要素，其内容在\
  \ 第 1 章 中有所介绍。具体的安全和合规框架及其对管理审查的要求包括以下内容：\n* **ISO 27001** 控制措施 9.3 规定管理层必须定期审查信息安全计划的“持续适用性、充分性和有效性。”\n\
  * **NIST and FedRAMP** 定义了评估和授权以及持续监控的管理角色。管理层必须审查评估信息系统的计划和评估结果，然后通过签发运行授权（ATO）做出正式决定以授权系统使用。管理层使用持续监控数据以确保风险缓解措施保持有效。\n\
  * **Certification and accreditation** 与评估和授权类似。*Certification* 是根据一组标准正式评估系统或流程的过程，而\
  \ *accreditation* 是关于系统执行指定功能的适用性的正式决定。任何组织都可以使用此方法来制定管理流程，以根据安全能力和要求正式评估和批准系统。\n\
  * **SOC 2** 要求管理层建立“绩效衡量指标”，并生成和使用“相关、质量信息以支持内部控制的运行。”\n* **Control Objectives for\
  \ Information Technologies (COBIT)** 是 IT 和网络安全的管理框架，侧重于高层管理任务，如规划充足的资源、容量，以及监督任务，如审查组织的控制计划。\n\
  \n高级和执行经理并不是唯一负责审查和批准安全控制有效性的利益相关者。信息系统所有者、数据所有者和保管人也负责确保在处理数据时有足够的控制措施到位，并报告他们遇到的任何问题或缺陷。\n\
  \n### 关键绩效和风险指标\n作为 CISSP，重要的是不仅要衡量现有绩效，还要保持对未来情况可能如何变化的认识。安全指标传达现有安全控制在降低风险方面的有效性，并监控可能在未来影响组织的风险状态。关键绩效指标（KPI）是现有风险缓解措施的监控工具，而关键风险指标（KRI）使组织能够保持对潜在未来风险的认识。两者对于治理、风险和合规（GRC）计划都至关重要，并为\
  \ GRC 战略提供主动和被动的输入。\n每个组织都会发现不同的指标有用，并且在确定哪些指标有意义且值得监控时必须考虑各种因素。为了举一个非安全方面的例子，汽油便宜但道路维护不善的司机可能会监控汽车轮胎的健康状况。同一辆车在汽油昂贵但道路维护良好的地方的司机可能会更关心汽车每加仑英里或每升公里的性能。两者都是提供可用信息的有用指标，但情况决定了在特定情况下哪一个更适用。CISSP\
  \ 必须了解其安全计划的业务背景，并确保 KPI 和 KRI 的选择能够提供这些有用信息。这需要与利益相关者协调，包括用户社区、管理层，以及可能的外部方，如监管机构或业务合作伙伴。\n\
  \n#### 关键绩效指标\n\n\n\n# 关键绩效指标、指标和风险指标\n\n## 关键绩效指标\n\nKPI 和指标这两个术语经常被互换使用，但存在差异。指标只是简单的度量，例如应用于计算环境中的补丁数量。绩效指标使用指标并提供上下文（一种指示）。例如，环境中已修补终端点的数量除以终端点总数是补丁管理计划有效性的指标。如果组织期望在七天后达到\
  \ 100% 的补丁覆盖率，则此 KPI 可用于衡量该计划相对于期望的绩效。如果该数字低于期望，则表明需要采取补救措施，例如手动应用补丁或将未修补的终端点从网络中隔离，直到它们得到妥善修复。\n\
  \n在为组织的安保计划设计 KPI 时，了解组织所需的信息很有帮助，并且必须确保 KPI 提供清晰的信息以支持决策。KPI 应该存在以识别控制措施在减轻风险方面的有效性，并提供通知如果控制措施无效，这表明风险可能更有可能发生。必须建立绩效基线，以及对所监控流程的上下限的阈值。流程可能对绩效有严格或宽松的要求，阈值将反映这一点——在严格流程中，基线的任何偏差都是令人担忧的原因，而在宽松流程中允许更大的变化。\n\
  \n补丁部署时间框架是 KPI 的一个很好的例子。如果组织将基线设定为补丁发布后七天，那么在严格情况下，七天窗口后部署的任何补丁都是负面指标。在宽松的例子中，发布后\
  \ 8–10 天部署的补丁可能是可以接受的，但不需要额外操作。KPI 甚至可用于衡量改进工作的成功——如果补丁始终在七天内部署，则改进是有效的。\n\n开发高质量的\
  \ KPI 可能具有挑战性。存在框架，包括 ISO 27004，“安全技术——信息安全管理——监控、测量、分析和评估”，以及 NIST SP 800-55，“信息安全绩效测量指南”。卡内基梅隆大学的软件工程研究所（SEI）还开发了一个名为目标-问题-指标-度量（GQIM）方法的框架，该框架旨在帮助组织定义提供有意义信息的测量策略。该方法文档可在\
  \ `resources.sei.cmu.edu/asset_files/TechnicalNote/2016_004_001_455107.pdf` 找到。\n\
  \n确定目标和监控频率应通过识别组织目标、关键系统以及为减轻对这些目标或系统的风险而采取的控制措施来完成。始终如一地，衡量成本与收益之间的平衡至关重要，因为每天对流程或系统进行采样可能代价高昂。需要跟踪的重要指标并为其定义\
  \ KPI 的示例包括以下内容：\n\n*   **平均检测时间 (MTTD)**：它衡量检测安全事件或威胁所需的平均时间。\n*   **平均解决时间 (MTTR)：**\
  \ 它衡量解决事件所需的时间。\n*   **安全评分：** 许多厂商提供安全记分卡或等级，这可以作为组织安全工作成熟度的指标。请注意，这些外部提供的评分可能无法涵盖所有必要细节，因此获得\
  \ A 或 100%，类似于通过合规审计，不应被解释为完全安全。\n*   **投资回报率：** 对于许多 CISSP 来说，这是一个具有挑战性的领域，因为财务等业务问题通常超出了技术或安全从业人员的范围。然而，控制措施的风险降低效果必须始终与其成本相平衡。管理层可能需要一个指标来显示特定安全控制措施或计划在降低成本方面的有效性——例如，如果网络钓鱼每月给组织造成\
  \ 100 小时的生产力损失，那么反钓鱼培训的成本必须低于 100 小时，并且导致因成功钓鱼攻击而造成的生产力损失减少。\n\n### 关键风险指标\n\nKRI\
  \ 可以为组织提供未来风险的窗口，并且应设计为捕捉不断变化的风险格局可能如何影响组织。KRI 的指示可以推动主动缓解行动——例如，防火墙拦截的恶意流量量增加可能表明在防火墙不堪重负之前升级防火墙。KRI\
  \ 通常支持长期管理决策，例如防火墙升级项目需要提前时间进行 IT 预算和资源分配，以避免恶意外部人员导致系统中断的风险。\n\nKRI 的来源包括漏洞扫描、审计和评估、安全事件响应、恶意软件感染和遏制率以及其他安全流程数据等常见安全实践。指标应衡量现有安全控制措施应对不断变化的风险的充分性。\n\
  \n继续之前补丁部署的例子，KRI 可能会设定为最新补丁存在于特定百分比的终端点上。如果补丁部署延迟且未修补终端点的数量超过阈值，则组织面临任何未修补漏洞被利用的风险。采取纠正措施，如启动安全事件响应并手动部署补丁可能是适当的响应。其他有价值的\
  \ KRI 示例包括以下内容：\n\n*   **安全事件数量：** 安全事件数量的增加可能表明威胁环境已经改变，需要更强大的安全工具或额外人员。\n*   **发现数量：**\
  \ 审计和评估中发现的增加可能表明安全计划存在缺陷，需要额外的关注或资源。\n*   **检测到或报告的钓鱼尝试次数：** 钓鱼尝试的增加通常是攻击的前兆，因为攻击者寻求获得有效凭证以访问组织的资源。额外的系统监控、多因素身份验证（MFA）和用户培训都可作为对该威胁的响应而部署。\n\
  \n### 备份验证数据\n\n数据和系统备份是完整性和可用性的基本控制，因此确保在数据丢失或损坏的情况下可以使用它们至关重要。第一步是识别组织为继续运营所需的关键数据或系统，并设计适合恢复需求的备份策略，这将在\
  \ 第 7 章 中更详细地介绍。\n\n一旦建立了执行备份的程序和系统，验证备份过程和备份数据的完整性就很重要。两者都可以通过从备份媒体执行测试恢复来评估，以确保所有必需的数据都存在且可读。如果数据丢失，可能表明备份配置问题，例如目录或系统被排除在备份之外，或备份媒体损坏。一些备份系统将完整性检查作为标准操作的一部分，并且可以配置为自动验证备份完整性，如果检测到完整性丢失则生成警报，并自动重试备份过程。\n\
  \n### 培训和意识\n\n\n\n建立和维护一个提供安全意识、教育和培训的计划至关重要，因为用户既可以是对抗攻击的关键防线，也可以是攻击的高价值目标。设计该计划的主题在\
  \ 第 1 章 中有更详细的介绍。为了测试和评估安全培训和意识计划的有效性，以下指标可能有用：\n\n* **培训完成率：** 未完成培训的用户可能更容易错过诸如钓鱼邮件或异常系统行为之类的迹象。\n\
  * **长期信息保留和习惯养成：** 如果用户参加培训、完成测验后立即忘记信息，则该计划无效。\n* **覆盖范围：** 威胁和风险不断演变；培训计划必须更新以应对这些。\n\
  * **受众需求：** 一些安全实践过于技术化或可能对所有用户都不重要，因此向受众提供适当水平的知识和培训材料很重要。\n\n## 灾难恢复和业务连续性\n\n\
  业务连续性和灾难恢复 (BCDR) 主题，包括收集需求的策略、设计应对计划以及测试计划，均在 第 1 章 和 第 7 章 中讨论。需求收集和测试过程的输出是监控和衡量有效性的重要来源，因为\
  \ BCDR 活动支持保持可用性的目标。\n\n在审计、评估和监控 BCDR 活动时收集的信息应能回答以下问题。不足或否定的答案表明存在弱点，可能通过更新计划文件或迭代业务影响分析\
  \ (BIA) 或计划演练等流程来解决。\n\n* 是否存在适当的计划文件，并且已更新？示例包括 BCDR 计划、业务连续性计划 (COOP) 或单独的 BC\
  \ 和 DR 计划。\n* 关键人员是否了解其在计划下的角色和职责？\n* 新员工是否在入职过程中接受了关键 BCDR 角色的培训？这可以是安全培训和 BCDR\
  \ 数据收集之间的共享指标。\n* 计划的当前版本是否易于访问且安全存储？\n* 组织的当前关键功能是否已在计划中体现？\n* 是否发生了未在计划中反映的重大组织变更？示例包括重大的\
  \ IT 架构变更以及并购、剥离或重组等业务活动。\n* 计划是否定期测试，并且在测试期间发现的任何缺陷是否已得到解决？\n* 组织是否依赖关键第三方或服务？如果是，这些依赖关系是否经过测试？\n\
  * 变更管理等其他流程是否与 BCDR 计划集成，以确保组织变更在规划文件中得到正确反映？\n\n## 分析测试输出并生成报告\n\n安全评估（如漏洞扫描、渗透测试、差距评估、持续监控和审计）会产生大量数据。审查所有生成的输出耗时且可能对非安全从业者来说是不可能的，尽管安全团队以外的用户确实需要访问与安全流程相关的数据。因此，生成报告至关重要，这些报告总结了测试和评估活动的主要细节，包括进行测试所使用的情况或假设、测试期间执行的操作、发现或发现的问题以及解决发现问题的任何建议补救措施。\n\
  \n准备报告的安全从业者必须首先确定报告的受众或使用者，这对于确定要包含的适当详细程度和类型至关重要。跨国公司的执行委员会不太可能对导致缓冲区溢出漏洞的具体代码问题感兴趣，而可能更关心战略风险管理行动，例如增加开发人员安全培训预算或要求更严格的应用程序安全测试。负责修复漏洞的开发人员更关心代码扫描仪等安全测试工具的原始输出，因此包含战略流程改进的报告是不合适的。\n\
  \n设计报告的过程可能需要根据多个受众的需求构建内容，模块化结构可能很有用。执行摘要和高层次的发现概述可以放在一个部分中，与高管、业务合作伙伴或客户共享，因为这些群体通常不需要高度详细的信息。测试的技术细节可以放在附录中，可单独与需要该详细程度来解决任何发现的适当技术受众共享。许多安全工具（如漏洞扫描器）也可以配置为以多种格式呈现相同的信息——为高管或安全从业者监控的仪表板，如果用户选择，还可以通过下钻获得更详细的信息。\n\
  \n在测试期间，还可能生成多份报告，这需要采用生命周期方法来管理文档。在正式安全评估中，在测试完成后可能会创建并共享草案报告，以尽快传达信息。评估人员仍需进行额外工作以完成报告，例如根据补偿控制措施调整严重性或关键性并删除任何误报。共享草案报告中包含的信息可能很棘手，因为初始报告中的“关键”发现一旦考虑补偿控制措施后，在最终报告中可能被标记为“中等”；如果在没有完整背景的情况下共享，初始评级可能会引起恐慌。\n\
  \n使用自动化工具执行的安全评估可能会自动生成报告；然而，出于几个原因，这些报告可能用处有限。安全从业者必须决定自动报告是否提供适当的信息，或是否需要人工报告。许多工具使用标准化格式（如基础\
  \ CVSS 分数）提供信息来定义关键性，但不考虑可能较不严重的 CVSS 环境或时间分数。这会扭曲发现的关键性，可能需要人工报告来弥补。\n\n### 典型审计报告内容\n\
  \nCISSP 很可能需要阅读审计或评估报告，并且根据工作分配也可能被要求撰写报告。了解这些报告的常见部分以及它们通常包含的内容至关重要：\n\n* **执行摘要：**\
  \ 本部分包含对测试活动和发现的高层次概述，通常不超过一页。\n  **仪表板** 以类似的高层次信息呈现，但没有叙述，常出现在漏洞扫描仪等自动化、重复性测试工具中。它们提供发现的摘要，并通常支持深入到更技术数据的能力。\n\
  * **假设或限制：** 测试通常涉及限制，例如时间或活动范围有限。由于这可能导致系统的某些部分未被测试，因此明确说明这些假设以提供报告发现的背景非常重要。\n\
  * **范围：** 读者了解发现和测试活动的覆盖范围至关重要。例如，像渗透测试或 SOC 2 审计之类的评估可能仅限于特定系统、网络或设施，因此报告不包括与该范围之外对象相关的漏洞的详细信息。\n\
  \n\n\n* **活动摘要：** 已执行的测试、评估或审计活动应进行汇总，以展示评估团队所执行的工作。\n* **发现或问题：** 发现、缺陷或问题通常以表格或项目符号列表形式呈现，每个条目都应包括发现位置、严重程度以及支持该发现的任何证据等细节。\n\
  * **建议：** 评估人员可能会提供通用建议，例如“Apply all current patches”或更详细的建议，例如在特定 Web 服务器上应禁用哪些密码套件以及相关的系统配置命令。\n\
  * **附录：** 相关信息通常会被放在附录中以备参考，因为安全测试工具生成的原始数据可能复杂且冗长。将此类信息放在附录中可以提供一份更易于快速查阅的报告，同时也能为可能需要的更技术性的受众提供细节。\n\
  \n## Remediation\n识别安全控制中的缺陷或问题是执行安全测试、评估、审查和审计的主要目标。因此，CISSP 必须实施一个名为 *remediation*\
  \ 的流程来处理任何发现。这需要项目管理技能，例如对需执行的工作进行优先级排序、确定时间表和里程碑，以及跟踪工作直至完成。审计发现可以作为安全计划其他领域（如风险分析）的输入，并可使用该领域的流程进行处理。例如，关于控制措施不足的审计发现代表着尚未得到充分缓解的风险。风险管理流程通常涉及记录现有控制措施的缓解效果，因此该审计发现应触发对相关风险的审查。\n\
  \n当组织收到一组评估发现时，应制定计划来解决这些问题。这些计划的目标相同，尽管各种安全和合规框架使用不同的名称，如行动计划和里程碑（POAM）、风险缓解计划或审计问题缓解计划。无论名称如何，它们具有相似的特征：\n\
  * 发现的细节\n* 缓解或其他相关情况\n* 优先级\n* 解决时间框架\n* 所需资源\n* 里程碑（关键日期）和期望\n\n一旦补救计划已执行，重新进行测试以验证修复是否足够是明智的，特别是对于软件或技术控制漏洞而言。重新测试通常是渗透测试的既定阶段。测试人员甚至可能在报告发布前就提前通知已确认的发现，以便组织在重新测试前有更多时间解决这些问题。例行评估，如每月漏洞扫描，也可用于验证已实施的修复是否成功。\n\
  \n## Exception Handling\n当审计或其他安全评估发现无法补救的问题时，必须通过例外流程来处理。这与记录政策例外类似并遵循相同的步骤，当特定系统无法满足政策中规定的要求时使用政策例外。虽然可以授予例外，但应注意例外仅应在临时基础上授予。如果永久请求例外，或同一问题频繁导致例外请求，这表明政策或风险管理决策未与组织的客观目标保持一致。可能需要更新政策以实现这种一致性，或需要审查和更新管理治理决策。\n\
  \n由于这些例外代表无法缓解已识别风险的能力，它们需要组织的安全职能和管理部门给予特别关注。这体现在对例外的文件记录以及相关细节和正式审查与批准上，该批准明确说明组织对风险的理解和接受程度。例外处理通常记录的信息如下：\n\
  * **风险详情：** 风险、缺陷或问题的具体情况，包括何时发现以及由谁发现。\n* **例外原因：** 风险管理的预期结果是缓解，因此管理层需要了解为何特定风险无法得到缓解的细节。\n\
  * **补偿性控制：** 即使风险无法直接处理以满足组织的风险阈值，也可能通过补偿性控制（如增加监控）进行部分缓解。\n* **例外批准：** 管理层必须明确决定承担额外风险，记录审查和批准流程可为此决策提供问责。\n\
  * **时间：** 大多数例外应临时授予。如果已识别的缺陷需要长期计划来解决风险，例如大型 IT 项目，则例外仅应授予完成项目所需预计时间。\n\n## Ethical\
  \ Disclosure\nWeb 应用、网站和服务（如 API）很可能包含漏洞。有一群不断增长的安全研究人员会识别并向受影响资源负责的组织报告这些问题，目标是在恶意行为者发现之前负责任地披露漏洞。这些研究人员通常是道德黑客，此过程被称为道德或负责任披露。\n\
  \n拥有 Web 资源的组织中的安全从业人员应确保已为漏洞的道德披露做好准备。这可能具有挑战性，因为道德黑客或安全研究人员在组织之外，沟通往往出乎意料。一种推荐的做法是制定并分享一份公开可用的披露政策，概述以下几个关键点：\n\
  * 如何报告漏洞以及应期望什么，例如何时期望初步响应、提交的任何发现需要多长时间进行验证，以及可能后续要求提供哪些额外信息。\n* 对报告漏洞的任何付款或认可。一些研究人员不期望任何认可，而其他人可能对在漏洞修复时以补丁或安全更新中致谢等形式公开认可其工作感到满意。\n\
  * 明确在范围之内或范围之外的任何安全要素。许多组织选择排除不符合组织运营需求的“最佳实践”缺失报告、低关键性项目以及仅导致轻微运营问题的漏洞。\n\n作为安全研究人员或道德黑客，或作为提供此类服务的组织，确保您的工作遵循这些政策的要求非常重要。虽然可能存在一些可进行尊重性辩论的领域，例如特定漏洞的关键性，但有几条道德披露规则是不容辩论的：\n\
  * 发现的任何漏洞都应报告给负责组织，并且绝不应仅为个人金钱或声誉收益而使用。\n* 所有工作都应出于善意进行，组织应得到善意的推定。已识别的漏洞通常在特定时间后才公开披露，这给了组织时间来解决漏洞。如果组织做出响应并要求额外时间进行补救，则在修复可用之前不建议提前进行披露。\n\
  * 在法律允许的范围内行事。\n* 作为组织，应乐于接受漏洞披露，除非研究人员以虐待方式行为，否则不要采取敌对态度。\n\n\n\n许多组织正选择以漏洞赏金或披露奖励的形式向道德黑客提供经济激励。由于罪犯通常受利润驱动，为负责任的披露付费会改变经济状况，使其有利于合法研究和负责任的披露。存在第三方公司来管理道德披露流程以及对已识别漏洞的付款。这些服务提供了经过验证的安全研究人员库的优势，使用漏洞赏金提供商可以成为组织安全测试和评估策略的有价值补充。\n\
  \n如果安全研究人员或组织在不拥有或控制的系统中发现漏洞，则需要考虑与道德披露相关的四种情况。关于这些安全研究以及漏洞披露的规则、法律和法规在不同司法辖区差异很大且不断演变，因此任何进行安全研究的个人或组织都应为其活动寻求法律指导。负责任披露发现的特殊情况包括以下内容：\n\
  * **非披露：** 可能存在合同或法律义务阻止披露漏洞；例如，当披露漏洞可能损害正在进行的刑事调查时。\n* **完全披露：** 这是一种哲学论点，即任何时候发现弱点时，都应尽快完整、透明地向负责修复的组织报告。虽然改善安全的目标是值得称赞的，但许多供应商可能对试图报告漏洞的研究人员持敌对态度。\n\
  * **负责任披露：** 这一原则规定发现者有责任及时向组织报告弱点，并在公开披露之前给予组织足够的时间修复漏洞。\n* **强制报告：** 在某些情况下，向执法部门或其他当局报告发现的漏洞可能是强制性的。世界各地的法律和监管框架各不相同，因此如果发现者位于一个司法辖区，而负责软件或系统的组织位于另一个司法辖区，这可能是一个困难的情况。\n\
  * **举报：** 举报人是指感到有道德义务报告危险或非法情况的人，许多司法辖区都有法律旨在保护举报人免受报复。在发现安全漏洞的情况下，如果举报人遵循披露发现漏洞的正确渠道，则可能免于因版权侵权或其他数字犯罪而被起诉。\n"
- '# 进行或促进安全审计

  安全从业人员通常负责进行或促进审计，在这两种情况下，目标是相同的：对照标准比较组织的某个方面。进行审计或担任审计员需要对审计中使用的流程、目标和技术有透彻的理解和知识。促进审计不需要那么多的知识，但在审计前准备时，了解审计流程会有所帮助。


  ## 设计审计计划

  组织的审计计划可以设计为进行内部审计、促进外部审计，或根据需要两者兼顾。适当的资源、监督和管理层的支持至关重要，同样重要的是执行审计的现实时间表。一次性、特定时间点的审计提供了安全计划的有用快照，但定期审计计划允许随时间跟踪计划并显示改进。


  ### 常见审计框架

  如果组织正在追求特定类型的审计，例如 FedRAMP 或 SOC 2，则审计计划将由标准决定，因为这是外部审计员必须遵循的内容。审计框架也可以用作设计内部计划时最佳实践的指南。事实上，设计与外部审计员使用的相同标准保持一致的内部计划是有意义的，因为它允许组织发现外部审计员可能发现的相同问题。


  这些是提供可据此执行审计标准的常见信息安全框架：

  * **SSAE 18** 是《鉴证业务准则声明》，审计员在执行 SOC 2 审计时使用。

  * **ISO/IEC 15408-1:2009**，“信息技术 — 安全技术 — 信息技术安全评估准则”，是通用标准认证的基础，通用标准认证是对技术产品按照一组定义的安全功能要求进行的正式评估流程。本文件和
  ISO/IEC 18045 可免费获取。

  **ISO/IEC 18045:2008**，“信息技术 — 安全技术 — 信息技术安全评估方法”，是 ISO 15048 的配套文件，并提供了一致的准则和评估方法的标准。

  * **ISO/IEC 27006:2015**，“信息技术 — 安全技术 — 信息安全管理体系审核和认证机构的要求”，是审计员执行针对 ISO 27001 的认证审核的官方要求和指导集合。

  * **NIST 特刊 (SP) 800-53A**，“评估联邦信息系统和组织中的安全和隐私控制”，是评估 NIST SP 800-53 中概述的控制措施的指南。它引入了一套简单的测试程序来评估控制有效性：测试、检查或访谈。虽然适用于美国政府机构，但可免费获取，任何组织都可改编使用。

  **NIST 网络安全框架 (CSF)** 和 **FedRAMP 安全评估框架 (SAF)** 也可免费获取，可用于执行与 NIST SP 800-53A 中类似的评估方法进行评估。


  ## 抽样

  在设计审计计划时，收集信息和获得保证的工作成本应与风险可见性的收益相平衡。抽样是审计中使用的技术，用于在保持识别缺陷的保证的同时减少工作量。例如，配置审计可能会从
  1,000 台服务器的总体中选择 100 台以减少所需工作量。样本应具有代表性——如果组织在 Windows 和 Linux 之间平均分配，则应检查每种服务器类型各
  50 台。


  ## 内部审计

  内部审计由组织员工执行，提供审计员熟悉流程、工具和人员的好处。这种同样的熟悉程度也可能是内部审计的缺点，因为熟悉环境的人可能会无意中忽略问题——对问题进行第二双眼睛的检查通常能发现问题。然而，专门负责执行审计和管理补救的团队成员可能比交付报告后不再有进一步互动的外部审计员更有效。


  内部审计员也可能缺乏进行客观评估的足够独立性。发现可能影响财务绩效或审计员与团队成员关系的重要问题可能会产生淡化发现问题的动机。在某些组织中，这可以通过将审计员设为公司内的独立团队来解决，但对于小型组织而言，这可能不是可行的选择。




  内部审计在为外部审计做准备时通常很有用，可用于在外部审计前发现并纠正问题。在外部审计对业务有重大影响的情况下，例如 PCI 或其他监管审计，进行内部就绪评估或模拟审计是一种审慎的风险规避措施。内部审计可在组织的治理中发挥关键作用，因为它们向管理层提供报告，显示政策和其他治理措施的实施情况如何。


  ## 外部审计

  外部审计由组织外部的人员执行，通常是监管合规审计的要求。外部审计师的关键优势是对被审计组织的完全独立——审计师完全投入于审计过程，不应存在忽视或压制发现的利益冲突。他们还可能具备执行审计所需的高专业技能，例如使用
  SSAE 18 标准执行的 SOC 2 审计需要注册会计师（CPA）的技能；这可能不是大多数组织内部团队所具备的技能组合。


  使用外部审计师有两个潜在缺点。首先是成本，对于大型和复杂的审计而言可能十分可观，可能涉及差旅、审计师计费工时以及与所聘审计公司的技能水平相匹配的服务费（通常声誉更高的公司收费更多）。对组织运营缺乏了解也可能是一个缺点，因为外部审计师必须花费比已熟悉情况的内部审计师更多的时间学习，或者外部审计师可能完全遗漏某个细节，例如具体的政策用语。这可能导致假阳性审计发现。


  使用外部审计师在许多合规框架中是强制性的，例如 PCI、ISO 27001 以及 Cloud Security Alliance 安全信任保证与风险（CSA STAR）。独立的第三方有助于保证报告中的发现是可靠的，这对业务合作伙伴或客户等各方有利。某些行业和政府组织的监管机构可能拥有自己的审计师来评估其监管的组织。在这些情况下，促进这些外部审计必须成为
  CISSP 的高度优先事项，因为大多数监管机构可以采取诸如罚款或因不合规而暂停业务运营等行动。


  ## 第三方审计

  第三方审计是用于外部供应商、厂商和合作伙伴的重要风险管理工具。安全从业人员可能负责执行此类审计，也可能是外部方提供的审计报告的使用者。两者目标相同：识别可能影响贵组织的第三方任何风险，以及已实施的风险缓解措施。常见示例包括
  SOC 2 和 CSA STAR 审计，这些审计通常明确出于与第三方共享组织安全计划细节的目的而进行。


  对能够访问贵组织敏感数据的第三方的安全实践进行审计尤为关键。许多隐私和数据安全法律明确将数据泄露的法律责任归于数据控制者，即使数据处理者（如云服务）是泄露原因。这些审计可以识别提供商处实施的控制措施，以及这些缓解措施是否将风险降低到组织可接受的水平。


  无论是使用 SOC 2 报告还是对第三方控制措施进行审计，安全从业人员都应寻求回答与安全计划相关的以下问题：

  *   他们在选择控制措施和审计其有效性时使用什么标准？

  *   共享了哪些细节？如果仅有有限信息可用，是否存在被隐藏的缺陷？

  *   存在哪些发现，以及第三方对风险的回应是什么？

  *   存在哪些计划来补救任何发现？


  第三方风险评估可能由于现代供应链的复杂性而迅速变得复杂。在组织的托管服务提供商中运行的信息系统会继承来自第三方托管服务、用于运行系统的软件以及实物商品和服务供应商的风险。这些第三方的供应链中存在的风险也可能对组织构成风险，这是一种第四方关系。识别供应链中的供应商并确保审计和评估的充分覆盖在
  第 1 章 中有更详细的讨论。


  ## 摘要

  评估、审计、测试和评估都具有相似的目标，即识别安全控制计划中的问题。目标范围从低级别的项目（如单个硬件组件）一直到高级别的组织范围安全计划。从这些组件收集数据并将其与预期值进行比较，可为组织提供对其所实施的风险缓解控制措施有效性的洞察。这些评估可以使用内部资源或外部资源进行，也可由服务提供商、供应商和业务合作伙伴等第三方提供。


  安全评估和测试在很大程度上依赖于收集和管理数据。组织流程如安全意识和 BCDR 应被检查以获取支持这些监督职能所需的数据，但数据本身不足以证明其价值，因此 CISSP
  还应审查如何生成指标，即 KPI 和 KRI 的形式，以识别纠正或避免风险所需采取的行动。这些指标应与组织的战略、治理和合规需求相联系。

  '
- "# 第 7 域\n\n## 安全运营\n**安全运营侧重于** 保持组织的各项安全控制处于功能状态，以及在人员、流程和技术方面维护安全所需的流程和程序。组织必须识别和评估所面临的风险，然后以安全控制的形式应用适当的风险缓解措施。安全运营（SecOps）涵盖组织内广泛的基础职能。其中许多领域将超出安全从业人员的管辖范围，例如物理安全，通常由建筑或设施工程师处理，但安全职能仍需对确保安全得到正确理解和处理负责。毕竟，即使是最好的逻辑访问控制也是毫无价值的，如果攻击者可以走到工作站前并访问其包含的数据！\n\
  \nSecOps 涵盖不同的职能，例如数据和运营设施的物理安全、事件响应、支持或进行调查、处理调查期间收集的材料和证据以及执行数字取证。其中许多领域高度专业化，而注册信息系统安全专业人员（CISSP）是通用认证。通才安全从业人员可能不具备执行所有这些职能所需的技能，但拥有这些技能很重要，无论是通过招聘或培训团队成员还是通过使用服务提供商。\n\
  \n如果做得正确，SecOps 应以最少的开销、成本或其他影响支持业务或组织运营。拥有组织有价值资产的全面清单并实施保护和监控它们的策略是安全职能的最终目标。本章概述了在维护实施以缓解风险的各种控制措施时需要解决的重要问题，包括最重要的：人员生命、健康和安全。\n\
  \n## 了解并遵守调查\n\n\n\n# 调查、证据收集/处理与数字取证\n\n调查、证据收集/处理与数字取证需要高度专业化的技能。这与医疗保健类似——你可能有资格在没有专业人士指导的情况下吃均衡饮食和锻炼，但如果需要大手术，就需要专业的外科医生。一些安全从业人员会专门从事数字取证和事件响应（DFIR）并持有这些领域的资质。对于许多\
  \ CISSP 证书持有者而言，支持调查和取证的过程需要与合适的专家协调，以妥善处理调查，因为存在需要专业技能和培训才能防止证据被篡改或销毁的关键问题。\n\n\
  正如该子域名称所暗示的那样，安全从业人员不一定负责管理调查，但需要遵守相关专业人员的外部要求。本节介绍了安全事件调查的要素以及安全从业人员必须发挥的关键作用；对于更深入的技术探讨，推荐阅读\
  \ John Bandler 和 Antonia Merzon 所著的书籍 *网络犯罪调查：面向每个人的综合资源*。\n\n调查通常源于安全事件响应（IR），而在\
  \ IR 流程中，安全通才最有可能发挥最重要作用。任何事件都可能被认为严重到需要正式调查，可能的场景包括涉嫌刑事活动、严重违反安全政策以及无法解释的服务中断或停机。所应用的严格程度以及文档或证人证言等输出将根据调查类型而有所不同。\n\
  \n## 证据收集与处理\n\n证据是任何表明命题为真或事实的信息；更简单地说，它是支持陈述的信息。例如，Alice 于上午 10 点进入建筑物的门禁控制记录以及她于上午\
  \ 10:10 访问受限金库的 CCTV 录像支持了 Alice 进入金库的断言，但不一定支持 Alice 从金库窃取敏感资产的断言。\n\n在调查安全事件时可能收集多种类型的证据。最明显的是数字证据，如日志文件、录音、计算机文件以及内存或硬盘等计算机系统组件。纸质材料也可能成为重要证据，尽管庞大的数据集很少会被打印出来。根据犯罪类型，可能需要收集指纹、头发或\
  \ DNA 等物证，这不仅超出了大多数 CISSP 知识范围，而且完全超出了数字取证的范围。此类调查可能涉及具有执法背景的多学科专业团队，而 CISSP 的角色将是支持并遵守这些专业人员的任何要求。\n\
  \n### 收集数字证据\n\n由于数字信息的独特属性，收集数字证据可能特别具有挑战性，并且在开始事件响应时，保护所收集证据的完整性必须是首要关注点。数字证据通常寿命短暂，例如仅在\
  \ 24 小时后就会被覆盖的日志文件，或在系统断电时丢失的易失性 RAM 中的信息。云服务进一步使问题复杂化，因为它们将信息存储在组织控制之外，可能无法提供数字证据。除非信息已写入专门设计为防止其被更改的特定介质，否则几乎所有数字信息都很容易被更改。这些因素使数字证据收集成为一项高度专业化的工作——调查人员必须不采取任何干扰所收集证据完整性的行动。否则，数据将无法作为证据被依赖来提出指控，因为如果证据在收集或分析过程中被篡改，被告可能会对证据的真实性提出质疑。\n\
  \n证据收集可能在初步事件响应期间就开始，远在正式调查之前，因此必须确保在响应期间收集的信息被视为未来可能成为证据来处理。为此，IR 流程必须编写为包括以下最佳实践：\n\
  \n* **记录并记录一切**，包括所采取所有行动的日期、时间、地点、所收集任何证据的状况以及相关人员。\n* **始终制作副本** 的数字证据，并在可能的情况下对副本进行分析和调查。首选位级复制，因为它不仅对设备上的目录和文件，而且对任何已删除文件、数据残留和未分配空间都进行精确复制。这种复制方式比仅复制目录和文件的逻辑备份耗时更长、占用空间更大，但能提供更完整的证据。\n\
  * **防止不必要的更改**，方法是使用数据副本，如果发生不必要的更改，可以在不丢失证据的情况下丢弃副本，并使用硬件或软件来防止数据更改。简单地将可移动存储设备插入现代计算机就会导致数据更改，因为操作系统会执行诸如搜索索引等功能；在这些正常操作期间写入的数据可能会不可逆地损坏可能需要作为证据的数据。应使用称为\
  \ *写保护器* 的硬件设备和软件来防止媒体发生不必要的更改。\n* **验证完整性**，以证明在收集或分析过程中未引入不必要的更改。这通常涉及计算和比较哈希值，以证明用于分析的数据与收集的数据相同，并且数据在分析过程中未被更改导致结果失真。\n\
  * **注意破坏性更改** 并尽一切可能避免。当出现问题时，存在自然倾向要关闭系统或退出应用程序，但这会冒着破坏存储在易失性内存如 RAM 或临时数据如应用程序缓存中的重要数据的风险。IR\
  \ 程序应编写为在防止进一步损害的需求与保留潜在证据的需求之间取得平衡；与其拔掉受损系统的插头，不如将其隔离在网络段中，以便在不破坏证据的情况下进行调查。\n\n\
  ### 处理数字证据\n\n一旦数字证据被收集，最高优先级就是在调查人员处理证据时保持其完整性，定义为 *保管链*。保管链并不能证明信息在任何方面都没有发生变化；相反，它证明对证据所做的更改是在受控的方式下进行的，未干扰信息的完整性和真实性，因此其作为证据的可靠性。收集移动设备并将其带到实验室进行取证分析本身在技术上就是一种更改，但只要证据处于受过训练的专业人员保管之下，并且在运输过程中未做任何更改，这些设备所包含的任何信息都可信赖。\n\
  \n\n\n# 数字证据标准与处理\n\n存在收集和处理数字证据的标准。对于不专门从事 DFIR 的安全从业人员而言，这些来源的建议最有可能在 IR 流程或程序中得到实施。在国际标准化组织（ISO）27000\
  \ 系列中，有 ISO/IEC 27037:2012，《信息技术 – 安全技术 – 数字证据的识别、收集、获取和保存指南》，该标准为从台式机和笔记本电脑、手机、个人电子设备（包括移动导航设备）以及实施传输控制协议/互联网协议（TCP/IP）网络的计算机网络或设备收集和处理证据提供了指导。尽管发布于\
  \ 2012 年，该 ISO 标准已于 2018 年进行了审查，仍然有效。\n\n美国国家标准与技术研究所（NIST）特别出版物 800-86，《将取证技术整合到事件响应的指南》，也提供了将数字证据收集纳入\
  \ IR 实践的指导和建议，并涵盖了文件、网络流量、计算机应用程序和操作系统等数据源。该文件最后更新于 2006 年，并为创建 DFIR 程序提供了战略层面的指导，而这些程序又需要与组织\
  \ IT 环境相关的当前技能和能力。NIST 计算机安全资源中心（CSRC）拥有大量资源，包括项目和出版物，涉及当前取证关注的问题，如移动设备、云计算以及高级持续性威胁（APT）活动的分析，可在\
  \ `csrc.nist.gov` 找到。\n\n云计算由于其运行的本质，对数字取证领域构成了特定挑战。诸如全球数据复制和托管等高可用性功能可能使确定犯罪或事件的确切发生地变得困难，如果事件发生在不同的法律管辖区，调查和收集证据的选项可能有限。在选择云服务模型和云服务提供商（CSP）时，CISSP\
  \ 必须理解并提供意见，以平衡业务需求，例如成本节约、运营功能以及数字取证支持等安全能力。\n\n## 报告与文档记录\n\n证据与其它数据一样，会具有对其可靠性至关重要的重要元数据。谁收集了证据、何时收集以及使用了哪些步骤等细节必须记录下来，尽管所需元数据的级别将取决于所进行的调查类型。内部行政调查需要证据，但不需要高度严格的处理程序，而提交给法院的信息则需要彻底的文档记录和经确认的元数据来支持保管链。\n\
  \n文档应在证据的整个生命周期中创建，从事件的初始检测开始，包括采取的任何调查步骤、调查期间发现的信息以及对证据采取的所有行动。该文档应允许明确确定执行操作的时间和人员，类似于访问控制中的问责原则。任何犯罪调查电视节目的粉丝都会熟悉——当一次访谈开始时，侦探会在录音中报出自己的姓名和时间以便识别，并且任何发现的证据都会被装袋并贴标签以便保存并记录其收集条件。诸如工单系统和检查清单等调查工具应设计为自动捕获此信息或确保调查员正确记录它。\n\
  \n调查和证据的报告应包含足够的信息来说明事件的细节，而无需主观解释。收集的信息应清晰呈现，并附带预期受众所需的所有相关元数据，例如法院要求的保管链。\n\n\
  提交给法院的证据必须符合最严格的标准。被认为不可采纳而导致调查人员找到后续证据的证据可能导致所有证据都变得无用。总体而言，所有证据都应遵循以下原则：\n\n*\
  \   **准确性**：证据和文档不得包含错误、与其它证据冲突或缺乏完整性。由于证据被用来证明案件，任何不准确都会削弱这种能力。\n*   **真实性**：真实的信息或证据来源无可争议，这由保管链证明。非真实信息在最好的情况下会显示出无能，在最坏的情况下会质疑提交者的可信度。伪造或篡改的信息绝不应使用。排除相反信息也是有问题的，不被视为良好做法。\n\
  *   **可理解性**：这是一个棘手的问题，因为数字信息通常需要特定的技术知识才能理解。法庭上的律师和法官或在非法庭程序中审查案件的商业专业人士可能缺乏解释恶意软件取证或网络流量分析等复杂技术主题的能力。专家证人可以作为将技术术语翻译或解释为更友好的语言的有用资源。\n\
  *   **令人信服**：用户登录受限工作站本身不足以成为金融犯罪已被犯下的令人信服的证据。展示用户的行为以及他们收到大量意外银行付款的证据，在讲述特定用户犯下欺诈行为的故事时更具说服力。\n\
  *   **客观性**：证据必须能够独立支持论点或断言。显示用户活动的审计日志是客观的，而安全从业人员“有一种预感”用户道德可疑则是主观陈述，并不能明确证明案件。\n\
  *   **可采纳性**：这主要适用于提交给民事或刑事审判法院的证据。如果证据符合法院为支持法律论点而引入证据的要求，则该证据可被采纳。例如，直接证据如数字取证检查通常可被采纳，而传闻证据如“Sanjay\
  \ 听说 Lupita 与团队成员分享了她的密码”则不可采纳。\n\n安全从业人员不太可能是证据专家，因此寻求法律顾问、执法部门或其他调查专业人士的建议至关重要，以确保您收集、处理和准备的证据是充分的。\n\
  \n## 调查技术\n\n在第 6 章《安全评估与测试》中讨论的“检查、访谈和测试”审计技术与用于调查安全事件和犯罪的技术相似。基本思想相同——收集和检查证据以支持结论。然而，在调查中存在一些独特问题，例如嫌疑人在被询问或调查时的法律权利。CISSP\
  \ 可能会被要求支持或处理调查中的任务，并且与所有证据处理一样，应遵循专业人员的指导和建议。\n\n以下是安全从业人员应熟悉的四个主要调查技术：\n\n\n\n\
  ## 数据捕获\n包括收集审计日志或网络流量等数据，以及专门的技术，例如收集事件现场及其相关调查的照片或视频证据。*自动化捕获*使用传统监控工具进行，并可利用组织的持续监控基础设施，如安全信息和事件管理（SIEM）工具或录制的摄像机画面。*手动捕获*是指法证调查人员采用的技术，如复制数据和媒体，以及通过照片或视频记录事件或犯罪现场。\n\
  \n## 面谈\n是一种旨在从个人（通常是证人或了解事件情况者）获取信息的工具。面谈遵循问答格式，调查人员提出旨在获取信息的问题并记录答案，尽管被访者也可能作出陈述。一般而言，如果当地法律允许并且已记录被访者的适当许可，面谈应被记录。还鼓励多方面谈以提供信息更大可靠性，无论是安排多名面谈者，还是安排被访者代表在场以证明所收集信息的准确性。被访者通常具有法律权利，例如拒绝或终止面谈的能力，安全从业人员必须谨慎遵守所有法律——私自（像\
  \ CISSP 这样的私人公民）无故强行扣留某人，在大多数地方都是非法的！\n\n## 审讯\n比面谈要求更严格，通常由执法专业人员执行。审讯针对涉嫌犯罪的个人进行，通常在该个人被逮捕后进行。嫌疑人享有特定的法律权利，如果未遵守，这些权利可能导致审讯中获取的信息被视为不可采纳。\n\
  \n## 外部请求\n调查人员可以向第三方（如互联网服务提供商（ISP）、政府机构）提出，或向特定方提出正式的信息请求，以收集信息。这些通常需要法律批准和程序，如搜查令和小额诉讼传票，因此安全从业人员在调查中可能仅与发起这些请求有间接关系。然而，如果被要求提供证据，CISSP\
  \ 可能会受到这些程序的约束。在这些情况下，来自适当法律顾问的指导至关重要，无论是个人律师还是公司法律顾问。\n\n### 数字取证工具、战术和程序\n执行取证任务需要经过适当培训的专业人员，当然必须为其提供适当的工具和资源。组织必须决定分析师和调查人员是内部员工还是承包商，还是仅在需要时才调用的外部供应商。保留所需人才和资源在内部的成本必须与更快的响应时间和更定制化的程序带来的好处相权衡，并应考虑需要正式调查的事件发生的频率。\n\
  \n调查和取证团队应包括在计算机网络协议、安全工具和平台、系统管理员以及威胁和漏洞管理实践方面具有多样化技能和经验的人员。任何需要取证专业知识的调查很可能对组织而言是关键优先事项，因此取证团队成员应被授予能够联系组织任何成员并期望得到合作的权限，即使这会中断该成员的常规任务。在某些情况下，组织成员可能会被临时重新分配以支持调查，类似于事件响应团队。\n\
  \n#### 工具\n数字取证专家使用物理取证工具，即使他们主要关注并处理数字或电子信息。取证工作需要跟踪和案件管理软件和设备、工作站，以及隔离且专用于取证的工作空间，以防止正在调查的证据受到污染。其他工具包括以下内容：\n\
  \n##### 写保护器和驱动器镜像工具\n设计用于允许检查或镜像存储设备（通常是硬盘），而不向存储设备写入任何数据，否则将违反证据的完整性。\n\n#####\
  \ 法拉第容器\n如袋子或盒子，其屏蔽以防止与物理设备之间的无线电通信。当数字证据存在于智能手机、平板电脑甚至笔记本电脑等便携设备上时，这些设备尤其有用，因为这些设备可以使用蓝牙、WiFi\
  \ 或蜂窝连接等无线协议发送和接收命令。这可能会无意中更改数据，例如安装应用更新从而覆盖关键证据，或设备可被篡改以通过远程锁定或擦除来销毁证据。\n\n#####\
  \ 视频和音频记录\n工具可用于记录犯罪或事件的证据，也可用于记录调查团队的活动以支持任何证据的完整性。分析人员在进行取证分析时不必花费额外时间记录所采取的步骤，只需简单地记录其工作的视频或音频日志即可。\n\
  \n一旦收集了所有物理证据，就必须对其进行分析，而取证调查人员可以使用各种软件工具。这些工具可以根据其预期用途或专业领域进行分类：\n\n##### 网络流量分析\n\
  工具如 Wireshark 可用于网络数据包捕获（pcap）和网络流量分析，通过重建通信会话。随着软件定义网络（SDN）和虚拟化云基础设施的兴起，这些软件工具可能会取代使用\
  \ SPAN 端口捕获流量的等物理网络取证工具；其中一些捕获和分析可能由安全编排、自动化和响应（SOAR）或安全信息和事件管理（SIEM）等工具主动执行，作为组织持续监控策略的一部分。\n\
  \n##### 日志分析工具\n如 SIEM 工具通常对调查人员很有用，可作为重建导致事件发生的一系列事件的方式。成熟度较低的组织可能没有部署 SIEM 工具，在这种情况下，日志可以手动收集并导入\
  \ SIEM 工具进行分析。\n\n##### 数据恢复工具\n帮助调查人员恢复已删除或被覆盖的文件和信息。大多数操作系统在用户删除文件时不会删除实际数据，而只是更新跟踪文件在磁盘上的存储位置以及空闲空间所在位置的分配表。已删除文件的内容仍然存在，但如果请求的话，没有任何东西可以阻止在那里写入新文件；如果没有写入新文件，只需读取驱动器上每个扇区的信息即可轻松恢复信息。根据媒体类型，甚至可能使用高度专业化的物理设备在磁盘被覆盖后重建数据。\n\
  \n##### 虚拟机\n（VM）并非专门的取证工具，但对调查目的很有用。疑似恶意软件可以复制到并在与所有其他系统隔离的 VM 上运行，这使其可以在不威胁感染其他系统的情况下进行观察和调查。此类虚拟实验室或测试环境比其物理对应物更容易设置和拆除。\n\
  \n##### 代码分析\n工具包括设计用于逆向工程软件的反编译器，以及设计用于在源代码级别观察程序功能的二进制分析工具。\n\n\n\n## 哈希\n工具对调查人员至关重要，并非因为它们能提供对所分析数据的任何洞察，而是由于它们在证明所收集和分析的数据持续完整性方面发挥着关键作用。哈希值和消息摘要可用于证明诸如应用程序或电子邮件之类的数据在传输过程中未被更改，并且哈希也可用于证明数据未被调查人员篡改。这证明了数据可以在支持任何断言或指控时被信赖。\n\
  \n## 工具包\n是为特定目的（如法证调查）提供通用工具的软件套件，并且有许多法证工具包由商业供应商、开源项目制作，或甚至由特定法证专家挑选的工具组成以支持其工作。这些工具包结合了对法证调查人员有用的多种资源，包括系统特定分析软件，如\
  \ Windows 注册表分析器、数据恢复和重建应用程序，以及前面讨论过的工具，如网络流量分析器和软件写保护器。\n\n## 技术与程序\n为法证技术和易于遵循的程序做好培训准备非常重要，即使是受过训练的专业人员也在进行法证调查和事故调查。事故发生期间的情况经常具有压力大且时间敏感的性质，因此准备和工作辅助工具将证明有用。\n\
  第一步是定义事故期间使用的流程和程序，这属于 IR 计划的范畴。许多调查始于对事故的响应；在响应期间收集的细节如果事故原因被发现为犯罪或其他严重事项，则可能需要稍后进行法证分析。数字证据的收集、处理和调查的\
  \ documented 标准包括 ISO 27041、27042、27043 和 27050。SANS 还为调查人员和响应人员提供了许多有用的资源，包括速查表、快速入门指南以及针对常见任务（如使用\
  \ Linux 进行恶意软件分析或恶意文档分析）的海报。这些可以在 `digital-forensics.sans.org/community/cheat-sheets`\
  \ 找到。NIST 还为法证调查人员提供资源，重点在于确保软件法证工具的质量以及为调查人员开发技能和培训计划。这些资源可以在 NIST 计算机取证工具测试计划（CFTT）网站上找到：`nist.gov/itl/ssd/software-quality-group/computer-forensics-tool-testing-program-cftt`。\n\
  这里提供了一套通用的法证分析程序步骤。这些步骤可以主动启动以调查疑似事故，或在证据指向严重安全问题时通过升级事故响应以进行进一步调查而被调用。\n\n### 定义优先级\n\
  组织在响应事故时可能追求的三种可能的优先级是——尽快恢复正常运营、将损害降至最低，或保留有关事故的最大细节。通过擦除和重新镜像机器来恢复正常运营可以迅速让事情重新运行，但关键数据会丢失。完全将系统离线以进行调查可能会导致业务运营完全停止或需要昂贵的重复设备采购。组织必须确定每种情况的要求并选择适当的一组行动。\n\
  \n### 识别数据源\n所有事故都需要发现相关信息，并且需要根据已识别的来源及时采取某些行动。例如，一些日志数据是短暂的，必须在被覆盖之前捕获，而一些内存可能会被频繁覆盖或易失，意味着存储在其中的数据只能在短时间内被收集。一些数据可能已经作为持续监控的一部分被捕获并长期存储，从而更容易访问。所有数据源必须迅速识别并优先收集。\n\
  \n### 规划数据收集并执行\n一旦识别出数据源，就必须制定计划并付诸行动以收集所需信息。该计划应优先考虑临时数据，如设计为被覆盖的临时文件，以及易失性内存存储，如机器断电时消失的\
  \ RAM。执行数据收集涉及使用前面讨论的调查技术，并且可能需要正式流程，例如获取搜查令或传票。此步骤使用的工具将根据信息来源而有所不同，例如不同操作系统上数据恢复所需的特定程序以及不同类型媒体的物理收集和存储工具。\n\
  \n### 记录并保持完整性\n数据收集是保管链中的第一个环节，因此对所做工作的记录至关重要。包括证据收集的时间以及其所经历的任何处理在内的细节必须记录在案。在某些情况下，证据本身已包含所需的元数据，例如\
  \ SIEM 工具中的只读日志文件，其中应包含日期和时间戳信息。在其他情况下，完整性元数据必须作为流程的一部分进行计算，例如在收集文件时计算哈希值，以证明所分析的证据自收集以来未被更改。\n\
  \n### 查找隐藏或已擦除的数据\n调查所需的关键信息可能已被删除、覆盖或存在于隐藏目录中。在某些情况下，攻击者或恶意软件会故意删除或混淆数据以混淆调查，而在其他情况下，数据可能在常规系统操作或无辜用户行为期间被删除或覆盖。除非采用诸如覆盖或加密粉碎之类的特殊手段，否则已删除的数据可能可通过硬件或软件工具恢复。\n\
  \n### 执行分析\n收集后，对数据进行法证调查。这可能涉及简单任务，例如审查文档、文件和通信以查找可疑用户活动，或更复杂的任务，例如网络流量分析以确定恶意软件如何在网络中传播。它甚至可能需要高度先进的任务，例如逆向工程恶意软件以调查事故。确定时间线或事件顺序也至关重要。\n\
  \n## 痕迹\nLocard 交换原则是法证中的指导思想，以一位法证科学家和犯罪学家命名，他观察到罪犯会在犯罪现场留下其存在的痕迹并带走某物，两者都可作为法证证据。在对物理犯罪的调查中，这被称为痕迹证据，如头发、纤维和\
  \ DNA。在计算机犯罪中，数字取证通常侧重于 *痕迹*，即用户或程序与设备交互时留下的数字痕迹。寻找这些是数字取证的主要目标之一，因为这些活动痕迹讲述了事故的故事，并且在支持任何指控或案件方面至关重要。\n\
  鉴于数字取证的专业性质，该领域对培训和认证有高级要求。许多具有执法使命的政府组织和专门的 DFIR 提供商拥有内部培训和技能发展计划，涵盖应寻找哪些痕迹以及如何恢复它们。\n\
  \n### 计算机\n\n\n\n\n在几乎所有情况下，使用计算机都会留下所执行活动的痕迹，而像安装程序或执行特定命令之类的操作会留下对调查人员有用的证据。日志文件会在系统事件（如登录）发生时创建，系统配置文件如\
  \ Windows Registry 或 Unix `.plist` 文件会被更新，并且文件会被写入、修改和删除。有关某起事件的一些信息可能由现有工具（如端点检测与响应（`EDR`）或基于主机的入侵检测系统（`HIDS`）代理）收集，而其他信息则需要人工调查。下面的列表强调了三大主要计算平台上一些常见的证据来源。它并非详尽无遗，就像系统管理员一样，取证调查人员通常也会专攻其中一个平台。\n\
  \n## 常见证据来源\n\n* `Windows`: Windows 系统维护着可通过 `Event Viewer` 访问的日志，其中包含关键的系统、应用程序和安全事件条目。如果用户或恶意程序未采取额外步骤，已删除的文件可能仍在\
  \ `Recycle Bin` 中，并且还可能找到隐藏的元数据或已删除但可恢复的文件。`Windows Registry` 也是一个有用的信息来源，因为它包含配置更改和已安装软件的记录。\n\
  * `macOS`: Windows `Event Viewer` 和 `Recycle Bin` 在 Mac 上的等效物分别称为 `Console` 和 `Trash`，其调查遵循许多相同的程序。一些\
  \ macOS 特定技术也可证明是有用的调查点，例如自动生成的 `Time Machine` 备份系统、`Spotlight` 索引和系统范围搜索功能，以及被称为属性列表（`PLIST`）文件的配置文件。\n\
  * `Linux`: 与 Windows 和 macOS 的桌面版本不同，许多 Linux 系统设计为仅使用命令行界面（`CLI`）运行。访问证据的原生图形工具可能不存在，因此需要第三方工具包，或调查人员必须熟悉标准文件系统才能找到相关数据。示例包括存储用户文件的\
  \ `/usr` 文件夹、用于临时文件的 `/tmp`（易失性数据的重要来源，因为大多数 Linux 系统在重启时会删除此目录中的数据），以及存储频繁更改的文件的\
  \ `/var`，包括缓存、日志文件和有关当前正在运行进程的信息。\n* `Browsers`: 用户的浏览历史包含足够的数据，以至于现在常有人开玩笑说个人有责任在某人去世后删除其浏览历史。然而，如果恶意软件感染的根本原因是用户访问了特定网站，则访问记录、放置的\
  \ cookie 以及网站本地存储的任何数据等活动记录都可能提供信息。\n* `Local storage`: 物理调查通常涉及查看文件柜等物理存储，数字取证应通过浏览本地文件系统或可移动介质来执行数字等价操作。也许罪犯保留了一些支持调查的活动日志，或者存在可以证明某些操作（如关键文件删除）的元数据。\n\
  * `Cloud storage`: 由于缺乏对云系统的物理控制，证据可能要求调查人员遵循法律程序，如申请搜查令。云服务的种类繁多意味着取证调查可能针对与调查物理计算机类似的虚拟机，也可能针对完全新颖的工具，如微服务，在这些工具中甚至没有标准取证证据。\n\
  \n## 网络\n\n传输中的数据是一种短暂的状态；也就是说，数据在通信网络中移动但不会存储在那里。然而，这些通信的元数据对于调查事件至关重要，在许多情况下，可以使用通信元数据识别或追踪事件中的存储数据或行为者。以下是一些网络证据来源：\n\
  * `NetFlow` 分析提供了网络设备（通常是交换机）上 Internet 协议（`IP`）流量和流量的概览。它可用于识别通信的详细信息，例如用于通信的端口、协议和地址。\n\
  * `Packet analysis`（通常称为 `pcap`）很有用，因为它同时捕获通信的详细信息和数据本身。数据包嗅探工具可以捕获网络中传输的数据包并重建发送或接收的数据，这些数据可以进一步分析。\n\
  * `Known bad traffic` 可用于识别可疑或不需要的活动，例如服务器向已知垃圾邮件域发送数据或与已知恶意软件服务器（如命令与控制（`C2`）或僵尸网络）通信。\n\
  * `Network device log files` 可能包含大量有用的信息，如果已配置为存储。交换机和路由器等设备包含通过网络的流量详细信息，而代理或虚拟专用网络（`VPN`）集中器等以安全为重点的工具是与安全事件相关的证据的有用来源。\n\
  \n## 移动设备\n\n运行 Apple `iOS` 和 Google `Android` 的智能手机的取证调查在重大刑事案件后经常登上新闻，因为加密使取证变得困难甚至不可能。由于这些设备高度便携且包含大量敏感私人信息，强加密通常默认实现。如果调查人员没有解锁设备和解密其数据所需的信息，这使得取证变得困难甚至不可能。这些设备设计的软件通常假设有互联网连接也是一个潜在问题——智能手机应用程序可能不会本地存储数据，而是从云端访问数据。在这种情况下，取证需要识别所有数据源并执行适当的搜索技术，如收集物理设备证据并对云托管数据签发搜查令。\n\
  \n从移动设备收集证据将遵循之前讨论的许多相同程序。`iOS` 是 macOS 的变体，而 `Android` 是基于 Linux 的系统，因此收集证据的过程可能相似但使用专用工具。这些设备主要面向消费者的特性也可能成为调查人员的福音，因为编码不良或功能有限的应用程序可能阻止用户彻底删除数据。这些设备中的始终在线连接通常包括蜂窝、WiFi、蓝牙和近场通信（`NFC`）标准，因此网络取证与其它设备相似，只是网络接口更多且针对特定协议的工具更多。\n\
  \n移动设备持续连接带来的一个独特情况是数据可能丢失或被销毁。像 Apple 的 `Find My` 和 Google 的 `Find My Device` 之类的服务允许远程锁定或擦除丢失或被盗的手机，从而销毁关键证据。如果组织可以防止在可能包含证据的设备上执行这些操作，移动设备管理（`MDM`）会很有用。在这些情况下，物理设备需要特殊处理，包括将其放入法拉第袋中并在适当屏蔽的房间内分析，以防止蜂窝、WiFi\
  \ 等信号到达设备。\n\n## 执行日志记录和监控活动\n\n\n\n# 日志记录与监控\n\n日志记录和监控可能有些令人困惑，因为日志记录既涉及主动的防护措施，也涉及被动的对策。定义日志策略是主动的，包括要捕获哪些事件、数据存储位置以及强制性的审查或监控活动。事件的发生及其在日志中的记录显然是被动的活动，而对日志进行分析或审查以确定发生了什么本质上是事后活动。定义日志策略、选择有效的工具来实现它，以及基于所记录的数据进行主动监控或审查，是安全风险管理的基本要素。\n\
  \n## 入侵检测与预防\n\n入侵检测系统（IDS）和入侵预防系统（IPS）是狭义定义的<|message|>安全工具类别，尽管在实践中，它们通常具有重叠的功能。两者都旨在检测入侵迹象，但\
  \ IDS 在检测并生成警报时停止，而 IPS 则更进一步以缓解入侵活动。一旦检测到入侵，IPS 可以采取多种行动，例如实施防火墙规则以阻止恶意流量、将文件恢复到被入侵前的状态，甚至关闭应用程序、服务或服务器以防止进一步入侵。\n\
  \nIDS 和 IPS 可以部署为基于网络的（NIDS 和 NIPS）或基于主机的（HIDS 和 HIPS）变体。基于网络的系统通常是专用设备，用于扫描所有网络流量以寻找攻击迹象。它们应放置在网络的关键瓶颈处，以监控重要的流量，例如非军事区（DMZ）与内部网络之间的连接，或\
  \ VPN 终结器与内部网络之间的连接。NIDS 和 NIPS 可以与其他安全设备（如防火墙和代理）集成，这些设备也部署在相同的网络节点上，而 IPS 尤其受益于这种集成，因为它允许监控和响应操作集成到单个设备中；例如，可以终止\
  \ NIPS 识别的恶意连接的代理。\n\n基于主机的系统旨在部署在特定的网络端点（如服务器或工作站）上，通常以软件代理的形式。HIDS 和 HIPS 监控主机特定的网络流量，利用来自其他工具（如反恶意软件）的信号来检测攻击，或对关键系统或应用程序文件进行哈希以检测意外更改。新兴的\
  \ EDR 领域将反恶意软件、配置管理以及 HIDS/HIPS 等功能结合到单个软件代理中。\n\n## 安全信息和事件管理\n\n即使在小型 IT 环境中，日志数据的量也可能迅速变得难以承受——单台用户工作站每天可生成数百或数千条日志条目。SIEM\
  \ 是多种工具和功能（如日志集中化、日志数据完整性保护和分析）的组合，用于从存储在日志中的数据生成可操作的情报。\n\nSIEM 是对一个广泛的工具类别的宽泛定义，不同厂商可能以不同方式实现。然而，大多数\
  \ SIEM 工具提供与集中和管理日志数据相关的特定服务，以及从日志条目中提取有用信息以识别潜在事件。这些包括以下内容：\n\n*   **集中化**：各个系统生成自己的日志文件，如果不将它们汇总到中央存储库中，搜索日志的任务将是巨大的。在如此大的环境中进行分析是不可行的，因此集中日志文件至关重要。SIEM\
  \ 工具可以利用端点上的标准功能，通常称为转发，将其日志文件数据的副本发送到中央位置。不支持日志转发的端点可以配备软件代理来收集和转发日志。数据应从包括服务器、用户工作站、网络设备、云服务、应用程序以及防火墙等安全工具在内的设备中捕获。集中化还可以强制执行日志数据的重要访问控制：拥有受监控系统凭据的用户可能能够删除或更改这些系统上的日志，但可以很容易地被拒绝访问\
  \ SIEM 工具的权限。\n\n*   **规范化**：Windows 系统生成的日志文件中的数据与 Linux 系统生成的文件类似但不完全相同。例如包括数字用户\
  \ ID 与用户名，或时间戳格式不同，如 YYYY-MM-DD 与 DD-MM-YY，这些差异会使跨系统搜索和关联流量变得困难。规范化发生在日志转发到 SIEM\
  \ 时——数据被转换为标准化格式或应用标准标签以保持一致性。\n\n*   **关联与检测**：一旦集中并规范化，数据就可以被处理以关联跨系统的活动并检测潜在的可疑行为。用户可能每天在同一时间登录其工作站并与公司应用程序交互，从而在工作站、目录服务器和应用程序上生成日志事件。同一用户在不同时间远程登录并从应用程序下载大量数据很容易被检测为异常。\n\
  \    *   *关联*是指发现数据之间的关系；在前面的示例中，来自唯一位置且在不同时间进行的登录偏离了常态。这种偏差是对用户正常或预期行为的关联，从而可以检测到潜在的可疑事件，例如用户账户被入侵并用于数据外泄。\n\
  \    *   更先进的 SIEM 工具提供集成以执行精细检测。例如，与旅行系统的集成可用于确定员工是否安排了有记录的工作出差，这降低了在奇怪时间或从新位置登录是恶意的概率。还可以关联其他外部信息来源，例如来自外部威胁情报源的数据或\
  \ CSP 的状态信息，以将应用程序停机与已知的云服务中断关联起来。通过此类外部来源为数据添加上下文称为 *丰富*。\n\n*   **警报**：一旦数据被集中、规范化并分析，SIEM\
  \ 的最终价值体现在生成警报上。SIEM 工具的速度和持续监控能力使安全运营中心（SOC）分析师等人力资源从翻阅数据的繁琐任务中解脱出来。相反，SIEM 可以为分析师生成工单或其他任务以供调查，这更好地利用了批判性思维和分析技能。工单或工作跟踪应捕获这些调查的详细信息，包括分配的分析师、采取的步骤以及导致工单或在调查期间捕获的任何证据。\n\
  \n## 持续监控\n\n安全控制评估在 2000 年代初期仍然高度集中于正式的、特定时间点的流程，如审计或认证和认可。流行的框架如 ISO 27001 和美国政府的《联邦信息安全管理法》（FISMA）采用三年一次的审计周期；因此，许多安全计划仅在组织准备审计或接受审计时每三年进行一次监控活动。快速演变的威胁形势推动了对更频繁保证的需求，从而形成了持续监控的实践。\n\
  \n\n\n# 持续监控\n\n持续监控顾名思义，需要更频繁的一系列检查，以确定安全控制措施是否到位并有效运行以降低风险。目标是在控制失效或因技术或威胁变化而变得无效时提供更及时的信息，从而使组织能够更快地响应。持续监控需要使用自动化，并高度关注指标，以提供有关控制措施的数据并指示所需的变化。\n\
  \n## 设计持续监控策略\n\n设计持续监控策略时，重要的是解决几个关键问题。这始于政策和高层支持，并应使组织能够记录设计和运行持续监控计划的策略。制定该策略时需要考虑的方面包括以下内容：\n\
  \n### 定义的参考点\n有效监控需要一组基线度量以进行持续比较。这可能是一个合规框架，如 PCI-DSS、ISO 27001 或 NIST SP 800-53。系统基线对于监控服务器和应用程序等信息系统组件也可能有用，可以是组织特定的基线或公共参考，如\
  \ CIS 基准。许多框架和基线还将包含优先级信息，以指导持续监控的实施。优先级更高的控制措施首先被选定实施，并以更频繁或更集中的监控为目标。优先级较低的控制措施可能评估频率较低。\n\
  \n### 自动化\n审计即使是中等复杂度的信息系统也是一项重大工作，定期执行其中一部分活动也不是一件小事。自动化检查至关重要，首先要确定实现此自动化所需的数据源。可以以编程方式读取和分析的日志文件或系统信息是常见的起点，SIEM\
  \ 工具中的信息也有助于实现近实时事件分析以检测异常行为。用于支持自动化安全监控的工具变得越来越普遍，例如 EDR 和用户实体行为分析（UEBA）代理，两者都会自动扫描网络端点，以查找违反策略的可疑活动或逃避检测机制的威胁。\n\
  \n### 频率\n持续监控理想情况下应从静态审计转向更频繁的检查，但这并不意味着控制措施会一直被评估。确定控制评估节奏应由控制的优先级以及评估成本驱动，包括与监控解决方案相关的财务成本以及任何运营影响，如系统容量降低。\n\
  \n### 适当的指标\nIT 环境中有许多有趣的数字可供监控，但持续监控计划中定义的指标应提供有关控制有效性的可操作情报。此外，对指标的解释必须谨慎进行。跟踪给定系统中每年发现的错误数量可能有用，但软件包含错误是意料之中的，该数字并不能提供关于漏洞管理有效性的有意义见解。跟踪补丁部署窗口是衡量组织有效处理软件缺陷带来的风险的更有意义的指标。指标应支持在检测到偏差时做出明确的决策。\n\
  \n### 定义的行动计划\n没有上下文和行动计划，指标毫无用处。汽车仪表盘显示重要信息，如油位，驾驶员（希望）能够理解——油箱满意味着继续行驶，油箱接近空意味着是时候停车加油了。持续监控计划的指标应提供类似的行动呼吁，因此定义可接受范围和应对偏差的行动计划至关重要。如果配置管理工具在补丁可用两周后显示补丁部署水平低于\
  \ 75%，则强制重启以进行补丁可能是合适的下一步。\n\n### 平衡成本与价值\n监控控制有效性实际上可以提高控制措施的价值——如果风险缓解措施变得无效但组织仍在为其付费，这笔钱就浪费了。如果检测到变化并采取补救措施，控制措施将继续提供价值。平衡持续监控计划的成本与所获得的价值更像是一项业务活动而非技术活动，但安全从业者理解并有效传达这一价值很重要。\n\
  \n有关持续监控系统的指导可在 NIST SP 800-37 中找到，特别强调在 NIST 风险管理框架（RMF）内实施实践并利用 SP 800-53 控制框架和\
  \ SP 800-53A 评估方法（`csrc.nist.gov/publications/detail/sp/800-137/final`）。另一项可免费获得的美国政府倡议是美国网络安全和基础设施局（CISA）持续诊断和缓解（CDM）计划（`us-cert.cisa.gov/cdm/home`）。ISO\
  \ 27004，“Security techniques – Information security management – Monitoring, measurement,\
  \ analysis and evaluation，”也为设计和执行安全控制有效性的监督和监控提供了一个框架。\n\n## 出口监控\n\n当攻击者获得对网络的访问权限时，通常目的是窃取存储或处理在该网络上的敏感信息。这被称为\
  \ *exfiltration*，它依赖于使用标准端口、协议和服务（如电子邮件、FTP 或 HTTP）发送信息。在许多情况下，这是在不试图隐藏活动的情况下进行的，而是将其伪装在高流量数据源（如\
  \ HTTP 流量）内部。由于使用端口 80 的网页和其他流量数量庞大，组织可能难以密切监控流量。\n\n出口点被称为 *egress*；在网络术语中，这些可以是\
  \ Web、FTP 或电子邮件服务器，而在物理形式上，出口点可能是门、装卸码头或垃圾容器，笔记本电脑、可移动媒体甚至纸质材料等硬件可以从中移除。因此，出口监控包括监控和限制哪些数据和存储设备可以离开受控环境。\n\
  \n数据丢失或数据泄漏防护（DLP）是管理离开网络的电子数据的一种工具，这些工具可以使用常见模式或签名识别信息，例如四组四位数字——1111 1111 1111\
  \ 1111——这通常是 Visa 或 Mastercard 信用卡号码。DLP 工具可以训练以识别特定于组织的敏感信息。如果您的组织使用账号或其他唯一标识符，DLP\
  \ 工具可以配置为使用 *regular expressions* 在数据集中扫描并识别它们，*regular expressions* 是结构化搜索参数，例如\
  \ `CUSTIDnnnnaaa`。在此示例中，CUSTID 始终存在，而 `n` 代表数字，`a` 代表字母。任何与此配置匹配的数据字符串都可以被 DLP 识别。\n\
  \n\n\nDLP 解决方案在识别数据后可以执行多项重要功能。发现是指基于模式匹配、签名或数据标签扫描网络以识别数据的过程，DLP 可用于查找网络上存储的未知敏感数据存储位置。它还可用于识别网络中流动的敏感数据，例如当文件从文件共享复制到工作站或作为电子邮件附件发送时。根据\
  \ DLP 的配置，这些操作可能仅生成警报、暂时阻止操作并要求用户确认其确实打算发送文件，或完全阻止该操作。DLP 操作的选择将取决于所涉数据的敏感性。\n\n\
  除监控数据离开组织控制范围外，一些组织可能会实施 *入站* 监控以识别进入网络的数据。不应处理或存储的数据可能会被拒绝；例如，包含信用卡信息的电子表格的电子邮件可能会被邮件服务器拒绝。这可防止组织被迫执行清理和补救任务以遏制数据泄露。物理入站和出站监控也可能是合适的，例如筛查进入或离开设施的物理介质，以确保数据不会通过可移动介质等方式违反组织政策进行传输。\n\
  \n## Log Management\n\n日志是许多安全运营活动的重要信息来源，主要包括持续监控和事件响应（IR）。包括 ISO 27001 和 NIST\
  \ SP 800-53 在内的多个框架定义了创建日志策略时需要考虑的关键要素。此外，NIST SP 800-92 提供了安全管理日志数据的关键要求，以及标准化和分析收集信息的流程（`csrc.nist.gov/publications/detail/sp/800-92/final`）。\n\
  \n### Define Auditable Events and Thresholds\n\n定义可审计事件和日志记录阈值是主动的安全决策。确定哪些事件写入日志文件、哪些不写入是在活动发生前进行的，需要谨慎平衡。日志记录过多，数据会变得难以处理，无论是存储空间还是所需的审查工作量。日志记录过少，组织将无法在发生事件时有效重建发生的细节。\n\
  \n大多数平台都提供基于某些事件信息设置可审计事件阈值的能力，而定制应用程序应具有支持日志记录的文档化要求。例如，像未发现问题的系统状态检查之类的标准信息事件可以忽略，而对重要系统配置文件所做的更改则必须被记录。应利用威胁情报和组织面临的风险来定义可审计事件——如果组织面临增加的钓鱼尝试，则增加对异常账户活动的日志记录是合理的。其他需要考虑的可审计事件包括以下内容：\n\
  \n*   系统登录、文件或数据访问以及应用程序访问等成功和不成功的访问尝试\n*   用户权限的更改，尤其是使用 `sudo` 或其他管理员权限等权限提升\n\
  *   对安全工具（如 DLP）的更改或禁用\n*   敏感文件的复制或导出\n*   应用程序中执行的敏感数据交易\n\n日志必须包含足够详细的细节以重建信息系统上发生的操作，包括谁、何事、何时。这意味着要捕获关于主体（用户或进程）、客体（文件、应用程序等）和操作（读取、写入、执行、删除等）的足够详细信息。为支持这些要求而应捕获的数据点通常包括以下内容：\n\
  \n*   用户或进程 ID\n*   时间戳，最好采用 UTC 或整个组织使用的标准化时区等标准化格式\n*   设备标识符、主机名、IP 地址或类似信息\n\
  *   访问的对象名称，如文件名或函数\n*   触发日志事件的策略标识符，例如登录失败、管理员权限使用或文件删除\n\n### Protect Log Data\n\
  \nNIST SP 800-92 规定了安全管理和保护日志数据的要求，特别强调保护数据的保密性和完整性。它引用了各种要求保护日志数据的合规框架，包括支付卡行业数据安全标准（PCI\
  \ DSS），并强调了日志数据完整性的关键作用。已记录的信息可能成为未来安全事件的证据，因此日志收集和保护策略必须设计为提供真实数据的可辩护依据以及完整的不间断保管链。日志中包含的数据可能高度敏感，因为内部机密信息（如\
  \ IP 地址等系统信息），甚至应用程序日志中可能的受保护信息，如个人身份信息（PII）。\n\n需要依赖于取证的日志必须具有完整的不间断保管链，因此日志文件通常写入高完整性存储介质，如一次写入多次读取（WORM）磁盘，这些磁盘在物理上防止日志数据在写入后被更改。将日志文件存储在具有不同访问权限的隔离系统上也有助于保证完整性，SIEM\
  \ 工具可以实现这种职责分离。系统管理员可以篡改其管理的系统上的日志文件，但如果日志被转发到其无法访问的 SIEM 工具，篡改就会变得困难得多。在日志文件被写入、复制或转发时，应通过对原始文件进行哈希并存储哈希值以供后续比较来进行完整性检查。\n\
  \n日志中可能有意捕获敏感信息，例如系统事件信息，或偶然捕获，如应用程序日志中经常出现的情况。应用程序错误可能包含意外数据，例如导致错误的用户的表单输入。如果未经授权的用户能够查看这些信息，就可能发生内部数据泄露，因此保护日志通常需要将访问权限限制为仅授权的安全人员。再次强调，SOC\
  \ 人员使用的 SIEM 或其他工具可以与生成日志的系统分开部署，从而避免对数据的未经授权访问。\n\n尽管完整性和保密性对日志数据至关重要，可用性也是一个问题。随着更多事件被记录，日志数据会随时间增加，因此需要充分的容量规划。这包括确保存储空间充足，也可能涉及确定审计日志在被覆盖前保留的时间长度。对于服务器上的本地存储，可能实施两周左右的短时间以节省空间，而在\
  \ SIEM 工具上，日志数据可能保留数月、数年或无限期。日志数据可使用离线、成本更低的存储方法进行归档，这些方法以较低成本提供较慢的访问速度。\n\n## Threat\
  \ Intelligence\n\n基于风险的安全需要对风险进行整体理解，包括可被威胁利用的漏洞。诸如补丁管理之类的安全实践侧重于被动地识别和解决漏洞。威胁情报是一种主动活动，使安全从业人员能够识别针对其组织的威胁和威胁行为者。例如，威胁情报可能有助于识别被潜伏恶意软件入侵的系统，该系统已被威胁行为者访问但尚未使用。在这种情况下，通过隔离受感染的终端并移除恶意软件，可以防止更大、可能更严重的泄露。\n\
  \n### Threat Feeds\n\n\n\n## 威胁情报来源\n可用于威胁情报的信息来源因组织的行业、地区和技术成熟度水平而异。具备高技术技能且拥有大量安全从业人员的组织可能具备自行进行威胁狩猎并生成相关信息的能力和资源。然而，存在威胁情报供应商，他们通过进行威胁狩猎和研究来创建相关信息的数据源，并以易于消费的形式提供数据。这些源从常规电子邮件或其他警报到可通过应用程序编程接口（API）访问的数据源不等，可与\
  \ SIEM 和 SOAR 工具集成。SIEM 集成可能会生成警报，而 SOAR 则可以主动响应，例如部署补丁、制定新的防火墙规则，甚至隔离受影响的系统。\n\n\
  除了威胁情报供应商外，还有免费可用的来源。在许多国家，负责网络安全职能的政府机构会发送通知，例如美国的 CISA 和加拿大网络安全中心。称为信息共享和分析中心（ISACs）的行业特定组织也会向其成员提供威胁信息。由于\
  \ ISACs 专注于特定行业，因此可以提供更有针对性的信息，而会员资格通常要求组织直接从事或以某种方式与该特定行业相关。ISACs 存在于零售和酒店、金融服务、市政府和医疗保健等多个行业。\n\
  \n## 威胁狩猎\n正如名称所示，威胁猎人是寻找威胁数据的分析人员或软件代理。这些数据与有关如何应对威胁的有用信息相结合，构成了可用于采取具体行动的威胁情报。威胁猎人可以在组织的各个层面寻找威胁：\n\
  * **战略** 对组织的威胁是高层问题，例如需要首席信息安全官（CISO）指导组织的安保计划，或在遭受此类攻击严重打击的行业中需要更好的钓鱼培训。\n* **战术**\
  \ 威胁猎人生成的细节通常被称为入侵指标（IoCs），这些指标是在安全事件的取证分析期间收集的。这些细节可用于检测针对其他系统的特定威胁，与恶意软件签名用于更新反恶意软件工具以发现已知病毒文件的方式类似。\n\
  * **操作** 威胁狩猎旨在了解攻击者的工具、技术和流程（TTPs），在某些情况下可能非常技术化，在其他情况下可能简单如“金融服务公司正面临来自特定国家的分布式拒绝服务攻击增加。”\n\
  \n威胁狩猎通常作为特定组织之外的安全研究的一部分进行，研究人员社区通常出于让每个人更安全的精神分享他们的工作和发现。因此，威胁细节通常在博客等社交论坛、会议演讲和\
  \ Twitter 上分享，而 IoCs 等相关信息则与 SOAR、SIEM 和渗透测试工具包等安全工具集成。由威胁狩猎活动产生的行业特定威胁情报源可以在各自的行业特定\
  \ ISAC 中找到。\n\n一些威胁猎人所做的工作依赖于搜索深网或暗网，两者都需要特定的一套技术知识和技能才能访问。*深网* 包括可通过互联网访问但未公开的内容，例如在线银行信息、私人社交媒体\
  \ feed，甚至新闻网站等付费墙后的内容。*暗网*，相比之下，存在于非公开可访问的网络上，需要使用 Tor 网络等特殊访问方法。访问所需的技能和复杂性正是威胁情报源成为有价值工具的原因，因为对于许多组织而言，获取具备此知识的人才的成本是难以承受的。\n\
  \n## 用户和实体行为分析\n虽然名称复杂，但 UEBA 相对来说是一个相当直接的安全功能。实体是非人类网络参与者，包括路由器和服务器等硬件以及软件进程、线程或守护进程。用户是登录并与信息系统交互的人类用户。UEBA\
  \ 结合机器学习和统计分析模型来分析和定义与信息系统交互的用户和实体的正常或预期行为基线。任何偏离此预期基线的活动都会被标记为可疑，并可作为其他安全工具的输入。\n\
  \n考虑 Alice，她每天大约在上午 10 点登录工作站，并且通常每天从内部财务系统下载 10–100 MB 的数据。下周一，Alice 的工作站开始从法律部门和研究与开发部门所属的高敏感系统下载数百\
  \ GB 的数据，并向外部 IP 地址发送 GB 级数据。这显然是一个可疑的情况，但传统安全工具可能由于缺乏针对 Alice 及其工作站的定向监控而遗漏。\n\n\
  UEBA 允许根据单个用户或实体制定有针对性和个性化的安全基线。Alice 的先前活动表明向外部来源上传大量数据是不寻常的——这可能表明她的职位职能发生了变化，她的工作站感染了恶意软件，或者她开始向竞争对手出售公司信息。如果\
  \ Bob 在制造部门工作，他可能会定期与公司外的制造合作伙伴交换大型设计文件，因此阻止所有大文件数据传输的安全工具显然会有问题。UEBA 提供了更精细的执行以及适应独特用户和组织需求的能力。\n\
  \nUEBA 监控的输出可以作为 SOAR 或 IPS 等其他安全工具的有用输入。服务器上可疑活动的警报可能会触发受影响机器的网络隔离，将其置于隔离的虚拟局域网（VLAN）中，或者如果在用户工作站上检测到可疑活动，则可以暂时暂停用户的访问凭据。可疑活动警报可以触发人工调查；如果触发活动出乎意料但合法，则可以移除阻止。如果警报与恶意活动有关，则响应可限制造成的损害。\n\
  \n这种有针对性的方法使安全工具能够通过为每个组织的独特情况提供适应性来实现更好的成本效益权衡。在一个组织中，一些用户需要向其工作站下载大量数据，而从事类似工作的不同组织可能实施全虚拟化桌面且无本地存储。UEBA\
  \ 提供了识别独特组织基线并为偏离该基线的行为生成警报的灵活性。\n\n# 执行配置管理\n配置管理是正式流程，用于识别关键资产，其状态——也称为 *配置* ——应受控制，并实施旨在实现该目标的做法。保持信息系统处于已知良好或安全状态是可取的，以确保诸如安全代理、操作系统配置（如全盘加密（FDE））或将系统置于受控访问网络中之类的安全控制继续发挥作用。对这些配置进行更改可能会改变系统的安全态势，因此受配置管理控制的资产必须经过正式的变更审批流程以控制不必要的配置更改。\n\
  \n\n\nCM 需要若干基础要素。`Configuration items`（CIs）是配置管理下的项目，可包括整个系统、单个终端和源代码。CI 的安全配置称为\
  \ `baseline`，任何偏离基线的更改都需要使用正式的变更请求和审批流程，即变更管理。随着时间的推移，所有系统都会自然发生诸如修补、升级和功能扩展等变更。\n\
  \n组织关于实施硬件和软件资产配置管理的指导，包括所需角色、职责和资源，应记录在配置管理计划中。CMB 通常是负责实施和维护变更管理实践的组织机构，尽管这些流程需要全组织参与。负责系统维护的\
  \ IT 人员将参与维护系统配置，而变更管理中一些不明显的作用包括采购和物理安全等职能，以及维护采购订单管理和交付验证等控制措施，可防止不必要的变更。\n\n\
  ## Provisioning\n\nProvisioning 是指设置和部署系统或应用程序，与 CM 实践的联系显而易见——如果系统配置存在标准，在配置时遵循该标准是合理的。部署信息系统可能简单到在现有操作系统上安装应用程序，也可能涉及设计整个系统并开发自定义应用程序代码或组件。\n\
  \n传统 CM 的配置要求可能包括仅采购已批准的硬件/软件，然后根据定义的基线（在“Baselining”部分描述）进行安装和配置。这可能需要大量手工工作，因此存在诸如脚本和预配置系统安装镜像等工具，以加快流程并降低出错几率。虚拟化的出现使此任务变得更简单，因为\
  \ VM 可以从已应用所有必要配置的镜像中自动创建。\n\n基于虚拟化优势的 Provisioning 在云计算领域已演进为高度自动化的系统和资源部署。虚拟化云服务允许在全球分布的数据中心中大规模配置，这依赖于系统部署和配置的定义文件。`Infrastructure\
  \ as code`（IaC）是指使用基于文本的定义文件来指定虚拟系统参数，例如内存和处理能力的大小，以及诸如应启用或禁用哪些系统服务之类的配置。由于定义文件相对较小且易于阅读，因此可以轻松进行彻底审查并确保系统配置符合预期的基线。IaC\
  \ 环境中部署的自动化特性也意味着人为错误的可能性更小。\n\n### Asset Inventory\n\n在配置时，将资产录入资产清单是 CM 流程的重要要素。组织无法对其不知道的资产进行配置管理，因此记录新的硬件、软件、云服务和其他信息系统资产至关重要。由于其基础性作用，资产清单可能值得采用纵深防御策略实施，既包括主动的也包括被动的清单控制。\n\
  \n主动资产清单控制包括与硬件、软件和服务采购的采购订单和财务系统集成。当组织获取新资产时，会连同制造商、主机名、版本/型号/序列号等详细信息一起录入清单。部署新硬件/软件也可以与清单更新服务集成，而自动化部署使流程变得更简单，因为使用\
  \ IaC 部署新服务时可以自动更新清单数据。当系统退役时，清单也可以通过移除或将这些资产标记为已退役的方式主动更新，使用相同的人工或自动化方法。\n\n被动清单控制主要包括发现之前未知的资产并将其添加到清单的过程。许多\
  \ CM 工具、网络漏洞扫描器和云管理控制台都提供枚举或发现资产的能力，此列表可以与现有清单进行比较以识别差异。这种类型的侦测控制安全性较低，因为之前未知的资产可能是不需要的或配置错误的，但随着自动化程度的提高，近乎持续的资产检测扫描可以成为更新清单的合理方法。\n\
  \n## Baselining\n\nA `baseline` 是系统的一组约定属性——在 CM 和安全上下文中，它是已知可实现期望安全状态的配置集合。基线提供了确定组织已实现的风险缓解程度的参考点，以及识别组织控制措施是否按预期运行的方式。维护基线的已知良好状态是配置管理的最终目标，而密切相关的变更管理实践则关注以受控方式从一个已知良好状态转移到另一个状态。\n\
  \n每个组织都可以开发自己的安全基线以满足独特需求，尽管也有可供任何组织按原样使用或作为起点的标准基线。包括以下内容：\n\n* `DISA STIGs`：由于它们是为具有严格安全标准的美国国防部设计的，因此这些基线不太可能广泛适用，因为为了符合\
  \ STIG 必须禁用许多常见功能。然而，组织可以将其作为高安全性的起点，然后进行范围界定和定制以启用所需功能。STIG 适用于各种平台。\n\n* `CIS\
  \ Benchmarks`：CIS 发布免费的安全基准文档，涵盖 Apple、Google、Microsoft 和 Linux 各版本的各种桌面和移动设备，以及包括防火墙和路由器在内的网络设备，以及\
  \ Amazon、Microsoft、Apache 和 Oracle 等云和服务器操作系统，仅举几例。这些基于全球最佳实践，通常比 DISA STIGs 限制更少。\n\
  \n* `Vendor-provided guidance`：包括 Microsoft、Amazon 和 Apple 在内的大型技术厂商发布其产品的最佳安全实践和建议，其中包括加固和基线配置。这些包括有关如何启用特定安全增强功能（如开启静态数据加密）的文档。它们还包括有关可能提供有用功能但安全风险增加的配置或功能的文档，例如对不支持多因素身份验证（MFA）的旧应用程序提供基本用户名/密码身份验证支持。\n\
  \n配置管理和合规工具通常将上述基准纳入配置管理审计的自动化能力中。基线提供了统一的参考点，因此这些工具会执行扫描以识别未按预期基线配置的系统，而 STIGs\
  \ 和 CIS Benchmarks 的免费可用性使其成为热门选择。配置管理审计通常涉及将一组系统与预期基线进行比较，以识别 `configuration drift`，即系统已被修改而不再按照预期安全基线配置的情况。\n\
  \n## Automation\n\n\n\n安全配置错误仍然是安全事件的主要原因之一，而配置管理审计是检查这些配置错误的关键方法。即使是中等复杂度的 IT 环境，也可能难以频繁审计。持续监控策略需要更频繁的数据收集；结合对频繁应用程序和系统交付的期望不断提高，并得到向\
  \ DevOps 和 Agile 方法论的转变支持，需要自动化配置管理解决方案。\n\n由 DevOps 和动态云服务的使用所支持的主动配置管理策略涉及使用 *不可变基础设施*，即未设计为可更改的基础设施。每次部署系统时，不可变基础设施都会被拆除，然后使用\
  \ IaC 定义文件重建。对基础设施的更改需要此拆除和重建过程，该过程是自动化的，并且比传统的逐系统升级更不易出错且劳动强度更低。虚拟化云环境使此过程变得简单，并且存在专门用于此目的的工具。这些包括厂商无关的工具以及来自主要\
  \ CSP 的工具，如 Amazon Web Services (AWS) CloudFormation 和 Microsoft Azure Resource\
  \ Manager。\n\n自动化不仅支持资源的部署，还可用于实施持续审计。存在专门的配置管理工具，可通过查询系统配置文件（如 Windows 注册表）来验证系统和应用程序配置。此功能也可在其他工具中使用，例如漏洞扫描器和自动化合规检查工具，而文件完整性监控（FIM）是一种使用关键文件的哈希值（例如系统和应用程序源代码或配置文件）来检测不需要更改的技术。存在独立的\
  \ FIM 工具，并且此功能也内置于许多 HIDS 和 EDR 解决方案中。\n\n# 应用基础安全运营概念\n\nSecOps 中良好的安全实践的基础上有几个概念，包括需知、岗位轮换和服务等级协议（SLAs）。这些控制措施包括安全计划的基础要素以及可在组织多个控制措施或部分中实施的总体概念。例如，基于最小权限限制访问需要人员安全以及物理和逻辑访问控制的结合。这些概念不应仅作为单独的控制措施实施，还应作为指导组织人员、流程和技术中其他控制措施的选择、实施和操作的策略。\n\
  \n## 需知/最小权限\n\n需知和最小权限经常被互换使用，但两者之间存在细微差别。*需知* 是一个概念，描述用户根据组织定义的要求访问特定信息，例如项目或系统中包含的数据。财务部门的角色用户如果与财务无关，则没有要求访问技术研究项目中的敏感数据，而研究项目成员可能不需要访问公司的总账。需知通常用于设计访问控制系统，在这些系统中希望实现隔离，即即使在组织中从事不同项目的相同工作或职能的用户也被隔离，无法访问其他项目的数据。以这种方式隔离信息通常被称为\
  \ *隔离*。\n\n*最小权限* 描述的是旨在为用户提供执行其工作职能所需绝对最少访问量的访问控制，有时也称为 *最小必要访问*。此访问应足以执行分配的工作职能，而不应超出该要求；例如，数据录入专员可能不需要管理员权限即可完成其工作职能。\n\
  \n最小权限和需知构成了访问管理的基石，也是实施 第 5 章 “身份和访问管理 (IAM)” 中讨论的控制措施的基础。从整个组织的角度来看，这些概念可在构建业务运营和设计信息系统时应用，这就是为什么它们是\
  \ SecOps 关注点的原因。如果具有不同需知要求的用户将使用同一系统，则该系统必须实现在粒度级别上限制访问的能力。如果没有，可能需要多个系统实例来正确隔离数据；随着虚拟化和云服务的出现，这变得显著更容易。\n\
  \n这些概念也可应用于查看不同时间所需的个人用户访问。例如，系统管理员在执行工作时并不需要始终具有提升的权限。在进行系统配置更改时，显然需要提升的管理员权限，但检查电子邮件或撰写报告可以用普通用户权限完成。单独的用户和管理员账户的架构，或提供类似\
  \ `sudo` 的权限提升方法，实现了符合这些原则的访问控制。访问管理中的一个新兴概念是即时访问，用户在需要时被授予特权凭据的访问权限，并在需要凭据的任务完成后撤销权限。\n\
  \n## 职责分离\n\n分离职责或责任可以实现多重益处。它可以通过使欺诈活动更难以实施来挫败内部威胁，并且还通过要求多方参与来支持数据和流程的完整性。这提高了检测错误的几率，并可以通过防止单个用户篡改数据来保护数据的真实性。\n\
  \n职责分离（SoD）通过将流程步骤分给多名人员来限制资源滥用或恶意活动的可能性。典型示例包括费用报销提交，其中员工提交费用报销单，必须由财务管理员批准后才能支付，或零售商店中收银员和经理在每天结束时都必须共同清点和验证现金。在这两种情况下，流程效率降低，但目的是使任何个人更难实施欺诈、犯错或单独实施后果严重的行动。要做到这些，两名个人必须串通或被迫实施欺诈，这比个人单独行动或被胁迫更困难。\n\
  \n上述收银员和经理结账场景是 *双重控制* 的示例，这是一种需要两个或更多个人执行相同操作以实现目标的过程。*双人完整性* 是另一个相关概念，即没有单个个人可以在没有另一名授权个人在场的情况下访问资产，如文件或设备。实施此措施的其他系统包括加密密钥托管恢复，其中多个用户必须登录托管系统才能恢复密钥。\n\
  \n## 特权账户管理\n\n权限，通常称为许可，是用户在系统上被授予的能力。特权账户是具有提升访问级别的账户，通常是管理员或超级用户；这种提升的访问级别也意味着与这些账户相关的风险更高——由于管理员可以执行更多功能，如果他们犯错、恶意行为或凭据被盗，固有风险更大。\n\
  \n\n\n# 管理特权账户\n\n管理特权账户会在用户管理生命周期中增加额外的要求。在特权用户甚至被授予权限之前，最好先识别信息系统和组织流程运行所需的岗位和特权功能。这些角色，例如数据库管理员（DBAs）和访问控制管理员，应在设计时考虑到最小权限和职责分离（SoD）等原则，并且系统架构选择可能由这些要求驱动。例如，DBA\
  \ 可能不需要访问其管理的数据库中的实际数据，因此采用应用层加密是合适的选择，这样可以让 DBA 访问数据库但阻止访问明文数据。此外，特权账户可能专门用于管理功能，用户应获得其他非管理员凭据用于日常任务，如网页浏览或检查电子邮件。\n\
  \n特权账户通常在访问管理生命周期中需要更高的严谨程度，例如更频繁的审查。不同阶段的额外控制措施包括以下内容：\n\n* **Provisioning**：请求或需要特权访问的用户应接受额外的申请和审查程序。这可能需要在授予访问权限前提供更多文档并进行多级审查或批准。这些审查可能利用其他安全流程如人员筛选，特权用户需接受更彻底的背景调查。\n\
  \n* **Use**：如果可能，提升访问的凭据应有时间限制并自动过期。即时特权访问管理允许用户在有限时间内并遵循可审计的程序获得临时特权凭据。Unix 和 Linux\
  \ 系统可通过 `sudo` 实现此功能，其在需要重新认证前可在设定时间内使用。还存在专用的特权访问管理系统，可用于实施所谓的“break the glass”\
  \ 过程，即在紧急情况下可在有限时间内访问管理凭据。时间期满后，凭据会自动重置。应记录管理特权的用途，并在可能的情况下为特权和非特权活动使用单独的账户。在必须使用特权账户时，也应采用额外的认证机制，例如强制\
  \ MFA。\n\n* **Review**：监控策略应侧重于特权账户的使用情况，且针对特权账户应更频繁地执行自动化或手动日志审查等监控任务。审查应识别意外或恶意的凭据使用。意外误用可能是用户在执行非特权工作前忘记从特权账户注销，而恶意使用可能是特权账户从不同国家远程使用。\n\
  \n* **Deprovisioning**：合规框架或义务可能要求特权账户活动保留更长时间，特别是当特权访问涉及医疗保健或金融信息等敏感数据时。归档与特权用户相关的日志或采用独特的去授权操作，如暂停账户而非删除，都是特权账户的常见做法，因为它们支持对这些用户所执行的高权限操作的调查。\n\
  \n## 职务轮换\n\n在员工之间轮换工作有两个主要好处。它提供了跨岗位培训机会，使员工有机会提升技能，并为组织提供更强的韧性。如果某人休假或无法工作，其他人可以接替这些工作职责。这种可用性方面是\
  \ CISSP 应考虑在组织内实施职务轮换的一个原因，因为它支持业务连续性（BC）、灾难恢复（DR）和韧性能力。\n\n职务轮换的第二个功能是减轻内部威胁如欺诈。单个员工重复执行相同功能时有机会实施欺诈并掩盖痕迹，但如果下个月由另一名员工执行该工作，被发现的可能性就会增加。这与职责分离或职责分离一起使用，如果要实施欺诈则迫使多名员工串谋。当未来会有未知员工轮换到该职位时，串谋变得更加困难。\n\
  \n在职务轮换期间接手流程的新用户也有机会发现并纠正非恶意的错误，这支持完整性。强制休假或休假，要求员工暂时脱离工作，也能有效发现欺诈性或无意的错误，并提供支持可用性的跨岗位培训机会。\n\
  \n职务轮换也可以作为长期策略来破坏潜在的恶意外部人员对员工的攻击。开源情报（OSINT）通常用于收集诸如工作职能、部门或角色等信息，这在制作 spear phishing\
  \ 或其他社会工程场景时很有用。如果员工不在同一角色中停留较长时间，此类情报的价值会大大降低。\n\n## 服务等级协议\n\n组织越来越多地以外部方提供的服务形式获取技术。CSPs\
  \ 和管理式安全服务提供商（MSSPs）是两个常见示例。由于构建云 IT 基础设施或安全功能如 SOC 所带来的成本，企业可能更倾向于向专业提供商支付这些服务的费用。在这种情况下，组织成为服务采购方，而\
  \ CSP 或 MSSP 是提供方。\n\n管理服务提供商可能具有挑战性，因为提供方在采购方直接控制之外。如果组织希望 IT 系统提供高可用性和 99.9% 的正常运行时间，他们可以将其指定为内部系统开发人员和运营人员必须满足的要求。当使用提供方时，这些相同要求变为服务等级要求（SLRs），必须由双方记录并达成一致。SLRs\
  \ 应该是必须满足的经常性或持续性需求，而非诸如满足灾难恢复时间目标等不频繁事件。SLRs 的相互协议即为 SLA，它规范了对 SLRs 的共同理解。\n\n\
  SLA 目标应是离散且可衡量的，例如一年内应用程序正常运行时间达 99%。这可通过计算 `365 × 0.99 = 361.35` 来衡量。为了满足 SLA，应用程序必须在一年中的至少\
  \ 361 天内可访问并执行所需功能。换句话说，应用程序全年停机时间不应超过四天。这些商定的指标必须记录并仔细审查以确保双方一致同意。如果服务提供方将维护窗口排除在正常运行时间之外而采购方不排除，则双方对正常运行时间的计算可能不同，导致对服务是否满足要求产生分歧。\n\
  \nSLA 监控是一种第三方风险管理形式，应成为持续监控的关键部分。针对不同类型的 SLA 存在不同的策略；对于监控正常运行时间，有合成交易等工具，可验证交易结果是否符合预期结果，或心跳技术，可检查网页是否加载。SLA\
  \ 报告也可以为响应时间等服务计算，其中提供方必须在特定时间内响应支持工单。\n\n\n\nSLA 是一份服务提供商与采购方之间签署的具有法律约束力的文件，可能包括当服务未达到目标时的付款差异条款。如果未满足\
  \ SLA，则提供商必须提供与服务不可用或性能下降持续时间成比例的折扣或积分。这些条款和条件可能不是安全从业人员的直接责任，但确保在需要时存在替代控制措施以弥补服务故障非常重要。\n\
  \n# 应用资源保护\n\n本书几乎全部内容都涉及保护资源，包括流程、程序和工具，以维护组织有价值资产的保密性、完整性和可用性。媒体是可以存储数据的任何材料，因此需要采取技术措施以确保数据免受未经授权的披露、篡改或破坏得到充分保护。\n\
  \n许多组织会以透明度措施的形式发布其媒体、信息和记录处理政策，以便客户或用户了解其提交的数据将如何被处理和存储。制定媒体处理政策时可使用的资源包括 ISO 27001\
  \ 中的 A.8.3“媒体处理”要求，或 NIST 特刊 800-53 中的媒体保护（MP）控制族。关于安全媒体销毁程序的具体指导，NIST SP 800-88\
  \ 修订版 1《媒体清理指南》是一份可自由获取的资源，涵盖了安全销毁媒体和数据的具体方法和工具。\n\n虽然 ISO 和 NIST 文件为保护媒体提供了高层次标准，但许多组织还必须根据行业法规遵循具体指导。CISSP\
  \ 应该了解这些要求，并确保任何资源保护政策和程序都考虑到了它们。例如，安全地粉碎可移动 USB 驱动器是对数据泄露的有效保护，但某些行业法规完全禁止使用此类设备。在这种情况下，必须制定政策和技术控制措施以防止数据写入\
  \ USB 驱动器，而非专注于其安全销毁。\n\n## 媒体管理\n\n媒体可以是纸质记录到传统硬盘或固态硬盘（HDD 或 SSD）等任何东西，并且越来越多地包括云环境中的存储。数据应根据组织的分类政策进行分类，并且确定的分类级别应用于选择适当的控制措施。\n\
  \n### 标记和标识\n\n所有媒体都应以某种方式进行标记以指示其所含数据的分类，并且在可行时，数据还应包含其分类级别的标识符。在传统纸质副本中，这可能是带有分类级别的水印或文档页眉/页脚，而数字文档可以有水印、页眉/页脚，甚至像文件标签、文件名或其他嵌入属性等元数据来指示分类级别。\n\
  \n出于多种原因，标记数字媒体可能更困难。如果信息系统包含多个文件或数据集，正确的分类级别是什么？在这种情况下，政策应提供答案——通常媒体被分类为其所含数据的最高级别。同样，如果信息系统包含多个存储设备，政策和媒体程序应规定是否必须对每个存储设备单独进行标记。存储设备尺寸不断缩小可能使标记数据变得困难，因为没有足够的空间容纳所有重要信息，而像\
  \ VM 这样的其他技术则带来额外挑战。在 VM 的情况下，其创建所在的集群或数据中心可能是将其“标记”为特定分类级别的方法，并且必须制定限制以防止 VM 移动到分类级别较低的集群。\n\
  \n### 处理\n\n标签的目的应是传达数据的分类级别，进而影响用户在处理媒体和数据时的行为。用户必须接受分类级别和媒体处理程序的培训。例如，如果数据位于标记为“仅限内部使用”的驱动器上，则用户可能会接受培训，永远不要将该驱动器或其数据从组织控制的设施中取出。处理程序还包括销毁或处置要求，这些要求可能在标签上标明，并在下一节中讨论。\n\
  \n## 媒体保护技术\n\n保护媒体涉及应用数据分类所指示的安全控制。必须记录应用必要控制的流程和程序，用户必须接受培训，当然，用户必须实际实施所需控制。\n\
  \n组织应使用最小权限原则限制对媒体的访问，并为授权人员提供物理安全措施。这些措施可能包括上锁的袋子或箱子、安全电缆或其他物理安全手段，以及关于正确使用此类工具的培训。媒体还应不时接受盘点和检查，以确保其得到核算并得到妥善处理。\n\
  \n### 运输媒体\n\n尽管数据在传输中的控制通常在保护网络通信的背景下讨论，但数据也可以通过物理媒体运输。确保在运输中保护媒体的控制包括以下内容：\n\n\
  *   **Encrypt** 在媒体上存储数据之前加密数据，或使用需要用户输入凭据才能访问数据的自加密媒体。\n*   **Hash** 对写入可移动媒体的数据进行哈希处理，并将数据的当前哈希值与原始值进行比较，以确保数据在运输过程中未被更改。\n\
  *   **Physically secure** 使用上锁的箱子、不明显的标记以及严格的快递员或其他运输人员程序来确保媒体位置的知晓并防止其受损或被盗，从而对媒体进行物理保护。\n\
  \n### 清理和处置\n\n如果媒体中包含的数据不再需要，可以对其进行清理，之后媒体可以被重复使用、出售或处置。存在各种清理和处置方法，并在 第 2 章，“资产安全”中作为数据生命周期的一部分进行了讨论。选择销毁方法必须考虑多个因素，包括销毁速度以及媒体的任何预期再利用。显然，物理销毁的媒体无法再利用，但通过覆盖来清理媒体所需的时间可能过于\
  \ excessive，以至于简单地购买新媒体更具成本效益。\n\n在 FDE 的情况下，可以利用现有的安全控制进行数据清理或销毁。如果销毁了解密所需的密钥，则磁盘上\
  \ FDE 数据的保密性可以得到保持。清理磁盘只需安全销毁密钥即可，该过程称为 *cryptoshredding* 或 *cryptographic erasure*。对于无法覆盖或消磁的\
  \ SSD，这可能是物理销毁的可行替代方案，而在组织对存储媒体没有物理控制的云存储解决方案中，这通常是确保安全数据处置的唯一方法。\n\n媒体销毁通常涉及昂贵的设备并需要使用授权的销毁提供商。在这种情况下，对销毁供应商的适当管理将是关键的合同和\
  \ SLA 活动。组织和提供商应就销毁任务的具体物理安全标准达成一致，并且合同应包含要求对因从已销毁媒体中恢复而导致的数据泄露进行保险的条款。\n\n# 开展事件管理\n\
  \n\n\nThere is a subtle but important difference between *事件* and *事故*; both are\
  \ important for continuous monitoring and the practice of incident management.\n\
  \n*   *事件*是任何可观察的项目，如例行的用户或系统操作，例如用户成功登录系统或文件被访问。许多例行事件会被记录但不需要额外操作。\n*   *事故*是既非计划又对组织产生不利影响的事件。它们通常需要由\
  \ IT、运营和安全人员中的某些组合进行调查和补救。事故的例子包括系统意外重启、勒索软件阻止用户访问系统，或计划内的系统停机超出分配时间。\n\n所有事故都应被调查并得到补救，以尽快恢复组织的正常运营并最大程度地减少如生产力损失或收入损失等影响。恢复正常服务是事件管理的首要目标。虽然传统的事件管理流程侧重于手动检测、调查和响应事故，但\
  \ SOAR 平台旨在减少管理事故所需的时间。它们通过收集和分析数据来检测事故，然后自动化防御和保护系统所需的响应操作来实现这一点。\n\n并非所有事故都需要安全团队参与。例如，由于新产品发布导致系统利用率增加是预期的，只需运营资源增加额外容量即可。然而，由外国国家发起的协调\
  \ DDoS 攻击则需要 IT 和安全人员共同参与才能成功补救。\n\n## 事件管理计划\n\n许多安全框架将事件处理称为*事件响应*，而 ITIL 等运营框架使用*事件管理*。两者的目标基本相同——处理事故并使组织恢复正常运营。这种\
  \ IR 能力的基础是一个有文档记录的 IR 计划，这是一种主动控制措施，旨在帮助组织在事故发生时更有效地响应。\n\nIR 计划应记录识别、分类和补救事故影响所需的工具、资源和流程。IR\
  \ 计划通常包含以下内容：\n\n*   事故类型的定义，例如内部运营事故、安全事故或需要第一响应人员的紧急情况。\n*   事件响应团队（IR 团队）人员。所需团队成员和技能将取决于事故类型，但应始终任命一名事件响应协调员来评估情况并确定所需的技能和行动。\n\
  *   各类事故中 IR 团队人员的角色和职责。这包括组织内部的角色，以及执法机构或业务合作伙伴等外部利益相关方的职责。\n*   所需资源，例如便于检测和响应的运营或安全管理工具，如\
  \ SIEM 或 IDS。清单和程序文档在紧急情况下很有用，可确保团队成员在压力事件中执行正确的职能。\n*   事件管理流程必须根据本节介绍的生命周期阶段进行规划，包括人员在事故首次被检测到、正在分诊以及补救计划确定后应遵循的流程。必须先检测到事故才能开始流程，然后\
  \ IRT 将执行适当的步骤进行调查、响应和补救。\n\n所有事件响应框架都强调通过识别可能发生的场景并在发生前为每种情况制定适当的响应策略来提前为事故做准备的重要性。事故可能是一种高压力情况，*临时*响应不如预先计划、演练过的响应更可取。存在多种标准来支持组织开发事件响应能力，如以下列表所示：\n\
  \n*   ITIL 框架事件管理流程\n*   NIST 特刊 800-61，“计算机安全事件处理指南”\n*   ISO 27035，“安全事件管理”\n\
  *   欧洲网络和信息安全局（ENISA），“CSIRT 设置指南”\n*   ISACA，“事件管理和响应”\n\n组织事件管理能力的另一个重要方面是根据事故的影响和严重性对其进行适当的分类和优先级排序。这类似于风险评估，其中风险根据其潜在影响和可能性进行分析。事故已经发生，因此通常通过以下方式衡量：\n\
  \n*   **严重性/影响**：事故对运营的影响\n*   **紧迫性**：为避免不可接受的影响，必须在该时间范围内解决事故\n\n许多组织使用零到五的优先级评分（P0–P5）来对事故进行分类。P0\
  \ 是最关键的，P5 是最不关键的，IRT 成员使用此评分来优先安排他们必须执行的工作。在许多组织中，达到或超过特定优先级评级的事故也可能触发其他组织能力，例如启动\
  \ BC 或 DR 计划。\n\n### 事件响应测试和演练\n\nIR 规划是一种主动控制，因此 IR 计划必须在事故发生前得到记录。对 IR 计划进行测试和演练具有两个重要功能。首先，在非紧急情况下测试计划可以帮助识别差距、疏忽或可能妨碍计划在真实事故中成功执行的问题。其次，演练可用于培训\
  \ IR 团队成员的职责，这减少了真实事故中的混乱或浪费，因为团队成员能够凭记忆做出响应。\n\nIR 测试可以针对特定场景进行演练，目标是确定计划处理该类型事故的有效性。例如，勒索软件的广泛爆发可作为场景，用于衡量备份程序或系统接管运营的有效性。IR\
  \ 演练可以与其他计划（如 BC 和 DR）的测试或演练相结合，因为安全事故通常会造成需要激活这些其他流程的情况。\n\n### 第三方考虑\n\n大多数组织将依赖某些外部实体，包括供应商或厂商，尤其是公用事业和云计算等服务。IR\
  \ 和业务连续性和灾难恢复（BCDR）等活动可能需要包括这些厂商，以确保与外部服务提供商的适当协调，使组织能够继续运作。IR 计划应识别任何关键的外部服务提供商或第三方，如数字取证和事件响应（DFIR）提供商、网络保险承运商、法律或通信专家以及可能需要参与事件响应的数据泄露专家。IR\
  \ 计划还应包含这些第三方的联系信息，以确保组织在事故期间能够调动所需的任何服务。\n\n需要在紧急情况下使用其服务的第三方应包含在 IR 计划中。每个提供商的联系信息应记录以便快速参考，以及需要提供商参与的情况。第三方的角色和职责也应记录，以便团队清楚哪些任务必须内部执行，哪些任务将由第三方处理。\n\
  \n## 检测\n\n\n\n# 事件响应流程\n\n## 检测\n在组织能够采取适当的响应措施之前，必须先检测到事件。监控运营和风险的工具和流程会检测到事件，然后向安全分析师生成警报或信号。自动化平台如\
  \ SIEM 工具、安全工具如反恶意软件，甚至人类都可以充当侦探，注意到异常并报告，无论是通过生成自动警报还是提交事件报告。\n组织的日志和监控策略应以尽可能快速地识别并警报潜在事件为中心。当检测到事件时，应自动创建文档以开始跟踪与事件相关的工作和决策——像\
  \ SIEM 工具这样的工具会创建工作工单，可在其中记录后续步骤。该流程最初可能会产生误报，但通过持续改进和调整检测能力，自动化工具和警报应随着时间的推移变得更准确。\n\
  事件的检测可以通过生成事件报告并启动服务工单或检查清单等资源来自动触发事件响应流程，以开始调查。或者，检测可能会经过审查流程，在此期间分析师会审查事件并进行一些基础研究，以确定事件是否合法或为误报。如果分析师认为事件有效，则启动响应程序。\n\
  \n## 响应\n分诊是针对已确认事件的早期响应流程，旨在识别事件类型的严重性和分类。对于技术事件，SOAR 工具可自动化部分或全部响应。如果事件已完全被 SOAR\
  \ 遏制，则无需额外分诊。如果事件无法完全被 SOAR 遏制，则识别事件的影响（如数据泄露以及受影响的用户或系统）至关重要。\n这些因素指导组建具有适当资源来处理当前特定事件的\
  \ IR 团队。例如，影响基于 Windows 的系统的勒索软件事件不太可能需要 Linux 管理员技能，而 Linux 系统的数据泄露事件则肯定需要 Linux\
  \ 管理员以及泄露响应人员，例如法律顾问。\nIR 阶段最明显的部分是开始应对当前事件，其中包括收集证据并做出如何恢复正常运营的决策。IR 计划应包含针对可能事件的基于场景的指导，以指导团队行动，例如应对广泛的恶意软件爆发或敏感数据泄露。遵循\
  \ documented procedures 并使用检查清单对于确保协调一致的响应至关重要，尽管 IR 计划中不太可能涵盖所有可能的情况。在不确定的情况下，IR\
  \ 协调员或 IR 团队负责人必须根据现有信息做出决策并相应地协调团队响应。\nIR 团队必须在事件被宣布后立即开始收集和保存证据。如前所述关于证据收集和处理，在开始时并不总是能够确定事件是否需要执法部门介入或在法庭上出示证据。如果事件需要这些行动，所收集的证据必须保留证据链，因此\
  \ IR 团队的活动应遵循严格标准，以确保收集的任何信息以后都可以使用。\n在响应期间，还将执行报告的初始要素。报告的主要目标是准确记录事件发生前、期间和之后的情况，因此\
  \ IR 团队应生成包括以下内容的文档：\n*   事件检测的摘要\n*   调查和响应事件所采取的详细步骤，包括 IR 团队开展的任何活动的团队成员姓名、时间和目的\n\
  *   调查期间收集的与事件相关的任何信息系统事件、IoC 和证据\n*   攻击的来源以及调查期间收集的 TTPs 的任何证据（如适用）\n*   面谈或其他信息收集活动的证据\n\
  调查和响应事件的过程会产生大量数据，如果没有结构，数据可能难以使用或无法使用。通讯和安全公司 Verizon 制定了一个用于分类、捕获和管理与事件响应相关数据的框架，称为\
  \ VERIS 框架。这提供了一种结构化的方法来捕获和管理 IR 数据，这对于指导 IR 团队的活动很有用。项目的详细信息可在以下位置找到：`veriscommunity.net`。\n\
  \n## 缓解\n缓解是组织开始实施修复事件所需措施的阶段。这需要了解事件原因，以及解决问题的<|message|> 人力和技术资源。缓解侧重于快速遏制事件并阻止影响蔓延，可能涉及短期修复以解决即时问题，但也包括长期修复以解决根本原因。\n\
  隔离或遏制事件通常涉及隔离、隔离检疫或以其他方式禁用有问题的系统或组件，如用户账户、服务器或工作站。这些步骤将高度依赖于事件类型——例如，恶意软件感染可能涉及受影响服务器的逻辑隔离或物理断开网络连接以防止恶意软件传播，而广泛的钓鱼攻击可能需要重置组织中所有用户密码并禁用电子邮件以防止更多用户受影响。鉴于潜在事件情况的多样性，缓解应遵循剧本、检查清单或其他准备好的反应指南，以减少所需的决策量——处于危机情况的人并不总是做出最佳决策，因此提前规划至关重要。\n\
  在缓解期间，需要报告响应工作的细节，因为所采取的行动可用于估计事件的影响并推动持续决策。例如，如果感染恶意软件的系统可以轻松隔离并从备份中恢复，对组织的影响很小。然而，如果同样的恶意软件感染已在网络中广泛传播，隔离和恢复可能不是有效的缓解措施。报告这些结果将有助于高层决策是否激活其他计划，如\
  \ BCDR。关于事件的情报迅速变化的可能性可能需要使用例行检查会议，例如每小时一次的状态简报，以确保所有利益相关者了解情况并能够相应行动。\n\n## 报告\n\
  尽管报告是单一的 IR 阶段，但现实是报告在整个 IR 过程中持续进行。在整个过程中，各种利益相关者都需要信息更新，既用于态势感知，也为 IR 团队履行职责提供所需资源。然而，在不同时间点和针对不同利益相关者需要正式报告，应指定单一的\
  \ IR 协调员来处理与高层管理或公众等利益相关者的正式沟通。\n\n### 内部报告\n\n\n\n## 报告\n事件报告将由不同的内部利益相关者出于各种目的要求。事件响应团队成员需要状态报告以保持团队活动与恢复正常运营的目标一致，并且他们需要诸如受影响的系统或数据、执行的调查步骤以及任何发现等详细信息。这些报告可能是非正式的，并在调查过程中生成，例如事件响应团队成员完成检查清单或记录事件调查和缓解活动。\n\
  对管理层和决策者的更正式报告也将是必需的。根据事件和所需步骤，报告可能是非正式的，例如仪表板上显示成功解决事件数量的指标，或针对特别严重事件的高度正式报告。在后一种情况下，该报告可能会提交给高级管理人员，以推动长期响应所需的战略决策，例如将关键服务的托管从本地迁移到云以减少停机时间。正式报告或通知关键决策者通常也是激活其他组织计划（如\
  \ BCDR）所必需的。\n\n### 外部报告\n事件响应团队成员在某些情况下可能需要为外部利益相关者准备报告。报告的内容、数据格式以及报告所需的时间线将根据外部利益相关者的要求而有所不同，因此事件响应团队通常需要与通信或法律专家协调以确保合规。请注意，本节的任何内容均不涉及数据泄露事件的报告，该内容将在后面的章节中详细说明。非泄露相关的外部报告在各种情况下可能都是必需的，包括以下情况：\n\
  * **政府组织**（包括政府承包商和关键基础设施提供商等私营部门实体）可能需要向政府机构（如计算机应急响应团队 CERT）报告某些网络安全事件，如入侵或数据泄露。这些机构通常要求特定的报告或提交信息的方法和时间框架。\n\
  * **行业监管机构**如支付卡行业（PCI）可能要求如果安全事件达到某些阈值（如受影响用户数量或泄露记录数量）则进行报告。在某些情况下，行业监管机构将拥有自己的事件响应团队和能力，可以被激活以协助调查。\n\
  * **执法机构**在事件由刑事活动引起的情况下将要求报告并共享详细信息。\n* **业务合作伙伴、供应商和服务提供商**可能需要报告任何可能影响其业务或与受影响组织共享的数据的事件。这些报告的要求将在合同中规定，并在规划事件响应团队与通信相关的能力时应予以考虑。如果这些外部利益相关者是导致调查组织受影响的事件或泄露的原因，他们也可能需要被通知。\n\
  * **用户、客户和公众**可能需要被告知影响服务可用性或可用性的安全事件。为外部各方提供服务的组织可能需要在事件期间通知这些各方服务可能暂停或降级。请注意，这不包括数据泄露，后者将在下一部分进行说明。\n\
  \n### 泄露报告\n数据泄露的定义在不同的法律、法规和安全框架之间略有差异，但本质上是任何未经授权访问数据的情况。该定义可包括内部和外部用户，但不同法规对报告有不同的要求。作为一名安全从业者，了解组织处理的数据类型、了解运营的法规或司法管辖区并获得有关组织泄露报告要求的适当法律指导非常重要。\n\
  在大多数隐私立法中，要求在一定时间内向监管机构报告影响私人信息的泄露。该时间段通常是在组织发现泄露后的一定小时数内，这为基本事件分诊和响应提供了时间——但值得注意的是，初始报告通常必须在完整的事件响应流程完成之前提交。在提交初始泄露报告时，调查和分诊可能仍在进行中，并且很可能监管机构会在事件响应进展时要求更新。具有泄露报告要求的隐私法律包括美国各州法律、加拿大联邦和省级法律、许多南美和亚洲国家的联邦法律，以及欧盟《通用数据保护条例》（GDPR）以及欧盟每个成员国的数据保护法律。\n\
  其中许多法律还要求直接通知任何受影响个人，并可能要求额外的泄露后义务。这些义务可能包括对潜在身份盗窃的持续监控，此类义务的成本应成为组织治理和合规策略中的关键考虑因素。\n\
  \n## 恢复\n恢复的主要目标是恢复正常运营。并非所有事件都涉及恢复，例如仅导致员工受纪律处分的安全政策违规。那一步缓解措施就是事件响应流程的结束，因为正常运营并未受到干扰；如果员工利用软件漏洞窃取敏感数据，则包括系统修补和泄露响应的恢复活动是合适的。\n\
  恢复可能在检测发生后立即开始，并持续到事件完全结束。用户对钓鱼邮件做出响应后更改密码之类的操作可以是恢复步骤，而恢复阶段在组织恢复到正常的服务运营水平时结束。如果因事件宣布了\
  \ BCDR 事件，则恢复阶段可能持续到该声明也被解决为止。\n\n## 补救\n补救是一项旨在根除事件所确定的任何根本原因的长期战略活动。被确定为事件根本原因的潜在漏洞必须在补救期间得到解决，例如允许软件漏洞被利用的补丁部署监控不足。如果用户点击了钓鱼链接并输入了其凭据，补救措施可能包括为所有员工提供更强大的反钓鱼培训、阻止已知的恶意电子邮件发送者或钓鱼攻击中使用的域名，以及实施旨在阻止钓鱼的电子邮件安全工具。\n\
  事件造成的损害也在补救期间得到解决。这可能包括向监管机构、客户或受事件影响的用户等利益相关者支付货币费用/和解金。解决根本原因的长期组织措施，例如增加安全人员或资源，如果组织认为鉴于所面临的威胁这些额外资源是必要的，也可以是补救步骤。\n\
  \n## 经验教训\n事件得到补救后，记录事件响应过程中学到的任何经验教训非常重要。这有两个目标：首先确定需要进行的事件响应流程改进，其次解决任何潜在或根本原因以防止事件再次发生。应收集和分析事件响应流程的指标以支持这一决策，其目的是突出事件响应的积极和消极方面以促进改进。\n\
  \n\n\n经验教训应在正式流程中收集、记录，并作为行动项目分配，明确完成责任。这些教训应识别出哪些做得好以及未来事件中可以改进之处，而该流程通常被称为 *事后分析*\
  \ 或 *行动后* 报告。该流程应由中立方主持，帮助参与者区分与事件相关的相关事实和个人感受。事件可能具有压力且充满挑战，因此主持人的角色至关重要，以确保事实和指标得到妥善记录以支持改进工作。\n\
  \n## 运行和维护检测与预防措施\n\n安全控制可以通过防止风险发生并降低其可能性来缓解风险，或检测已发生的风险以触发旨在降低影响的纠正措施。CISSP 应使用纵深防御范式设计安全计划，其中控制措施分层以同时发挥预防性和检测性功能。这种安排提供了主动和被动风险缓解，而实施的控制类型和数量必须与资产价值和相关实施成本相平衡。\n\
  \n为了真正有效，下文讨论的安全控制措施（如防火墙、入侵检测以及包含机器学习和人工智能的下一代工具）不应被视为纯粹的技术解决方案。必须考虑人员和流程，才能使这些工具真正有价值并实现缓解风险的目标。由于安全工具配置不当或更糟的是被忽视，本可更早阻止或完全预防的安全事件已经发生。调查和响应警报以及正确配置\
  \ SIEM 等平台的流程比拥有最新技术更重要，因为技术最终必须支持负责处理复杂风险的人类分析师。\n\n安全从业人员将在这些控制措施的选择、实施、持续管理和监控的多个阶段参与其中。例如，安全团队可能是选择防火墙等网络安全工具的关键利益相关者，并在收集需求时应征求其意见。IT\
  \ 或网络运营人员可能负责安装和维护防火墙，但防火墙生成的关于潜在网络攻击的日志数据是安全团队拥有的持续监控流程的关键输入。\n\n运行和维护这些工具要求安全从业人员与其他部门或团队协作，因此有效的沟通和合作技能对\
  \ CISSP 来说需要成为优先事项。确保 IT 和运营团队理解他们维护的安全措施的要求和重要性至关重要，而成为有效的合作伙伴需要当这些团队遇到问题时提供互惠支持。当网络管理员请求在防火墙上开放端口时简单地说“不”，并不能支持\
  \ CISSP 将安全与组织使命相一致的使命，特别是如果请求的端口是合法业务目的所必需的。\n\n### 防火墙\n\n防火墙是访问控制设备，旨在隔离和控制网络不同段之间信息流。它们通过分析流量并应用规则来确定流量是否被转发（允许）或丢弃（拒绝）来实现这一点。根据防火墙的类型，它们可用于防止外部访问网络段中的资源、防止恶意请求到达应用程序，甚至控制特定主机的信息流入和流出。\n\
  \n有几种类型的防火墙，安全从业人员了解每种防火墙最有效地部署的具体用例非常重要。它们包括以下内容：\n\n*   **静态包检查（无状态）**：这是原始的防火墙类型，旨在检查网络数据包并将其与规则集进行比较。例如，防火墙可能会在数据包头中看到\
  \ TCP 目标端口 23（Telnet）并丢弃该数据包，因为 Telnet 是不安全的协议。静态防火墙运行速度非常快，但在视频会议等复杂情况下难以应对，因为使用的端口不易确定，这使得定义规则变得困难。\n\
  \n*   **有状态**：这是静态防火墙的演进，提供防火墙理解通信上下文（称为状态）的能力。有状态防火墙通常会阻止高编号端口上的流量，但如果该终端之前已使用端口\
  \ 20/21（FTP）建立连接，则允许特定终端的流量。由于 FTP 客户端通常会协商自定义端口用于传输文件，在之前流量的上下文中允许较高端口是有意义的。有状态防火墙具有更高的智能和灵活性，但会带来更高的处理开销和成本。\n\
  \n*   **Web 应用防火墙（WAF）和 API 网关**：这是一种高度专门化的网络访问控制设备形式，旨在处理特定类型的流量，而通用防火墙处理所有网络流量。WAF\
  \ 和 API 网关分析专门针对 Web 应用程序或应用程序 API 的流量，可用于缓解 SQL 注入等复杂攻击。这些设备对 HTTP 会话应用一组规则并查找与应用程序的异常交互，可以识别在原始网络流量中不易察觉的攻击。\n\
  \n*   **基于主机的防火墙**：这些安装在特定终端上并使用特定于该终端的规则集。它们可以是有用的纵深防御措施，如果基于网络的防火墙失效则提供保护，但也会在终端上引入处理开销。它们在虚拟化环境中特别有用，并可实现\
  \ *微分段*，即单个终端存在于其自己的网络段中并具有自定义访问规则。\n\n*   **下一代防火墙（NGFW）**：这更像是一个营销术语而非一种独特的防火墙类型，但\
  \ NGFW 将多个安全功能组合到单个设备中。这可能包括有状态防火墙和 API 网关，许多还包括基于人工智能或外部威胁数据的先进分析。NGFW 还结合了入侵检测或\
  \ VPN 服务等其他网络安全保护。集中这些功能可以降低配置网络安全设备的开销，但缺点是可能存在单点故障。\n\n*   **安全组**：这些存在于 SDN 和云环境中，执行与防火墙许多相同的功能。全球负载均衡的应用程序可能存在于世界各地的多个数据中心，难以放置防火墙来控制高度动态的虚拟化资源。安全组（也称为网络安全组\
  \ \\[NSGs\\]）是一个抽象层，定义所需保护，虚拟化基础设施根据定义文件创建和部署，过程类似于 IaC。这种动态创建允许一致而灵活的部署并支持微分段。\n\
  \n防火墙、安全组和微分段是在零信任网络架构中有用的访问控制设备，在该架构中网络的任何部分都不会被隐式信任。组织控制范围内的单个终端和子网仍被视为潜在恶意，因此需要严格的访问控制。这假设攻击可能由受信任的内部人员或获得内部人员凭证的攻击者实施。\n\
  \n### 入侵检测系统和入侵预防系统\n\n\n\n# 入侵检测与预防系统\n\nIDS 可以检测系统入侵尝试，而 IPS 既可以检测也可以对系统入侵尝试做出反应。IDS\
  \ 是一种被动设备，它分析流量或活动，并在检测到活动匹配已知恶意模式、偏离正常或预期系统操作，或两者兼有时生成警报。例如，大量的半完成 TCP 握手——其中同步（SYN）数据包被接收但从未被确认——是不寻常的，并且是\
  \ TCP SYN 洪水攻击的已知特征。更复杂的 IDS 可能会监控关键系统文件和系统使用模式，并在系统上的活动偏离既定基线时生成警报。\n\nIPS 更进一步。与其仅仅生成警报并要求人工采取行动，IPS\
  \ 可以自动做出预防性响应。在 TCP SYN 洪水示例中，IPS 可能会实施新的防火墙规则以阻止创建半开连接的 IP 地址的流量。虽然有明显的益处，例如更快的响应，从而减少入侵的影响，但\
  \ IPS 也可能采取不想要的行动。在可疑系统行为的情况下，相关系统可能会被关闭，从而使其无法使用。如果意外行为是合法的，IPS 就无意中造成了可用性损失。\n\
  \nIDS 和 IPS 都可以以两种方式部署，部署模型以及位置对于确保设备能够看到其有效所需的所有流量至关重要。基于网络的 IDS/IPS（NIDS/NIPS）位于网络上，应放置以观察所有流量，例如在网络的边缘，以获得最佳可见性。然而，与防火墙类似，NIDS/NIPS\
  \ 在虚拟化环境中可能会遇到困难，在这种环境中，VM 之间的网络流量永远不会跨越交换机。基于主机的 IDS/IPS（HIDS/HIPS）部署在特定主机上以监控流量，这有助于克服流量可见性问题，但会带来许可证、处理开销以及与终端兼容性方面的额外成本。\n\
  \n## 白名单/黑名单\n\n术语 *白名单* 和 *黑名单* 正被 *允许列表* 和 *拒绝列表* 等其他术语所取代；无论术语如何，这些都指明确允许或明确拒绝的实体列表，例如应用程序、IP\
  \ 地址、网络端点，甚至来自特定国家的网络流量。\n\n明确允许或拒绝实体将根据实体类型采用不同的实施方法。仅允许来自已知、组织控制的 IP 地址的网络流量访问云服务是防止外部人员非预期访问的常见策略，并迫使合法用户通过组织控制的网络连接，在这些网络中强制执行监控。阻止来自已知托管犯罪活动且贵组织不与其交互的国家的全部流量可以降低攻击的可能性。这两者都可以使用防火墙或\
  \ VPN 等网络技术来实现。\n\n允许列表或拒绝列表也可以在其他工具中使用，例如操作系统、应用商店和电子邮件客户端。可以通过应用商店购买政策、配置管理工具，甚至内部培训材料（如“为访问企业电子邮件，只能使用已批准的智能手机电子邮件应用。”）来创建并执行明确批准和拒绝的应用列表。许多电子邮件安全工具提供从已知恶意域名或电子邮件服务器过滤流量的能力，这有效地拒绝了潜在恶意消息到达用户收件箱，并是一种拒绝列表形式。\n\
  \n## 第三方提供的安全服务\n\nCISSP 必须做出的一个关键决定是是否在组织内部构建安全流程和服务，或从外部来源获取这些服务。大多数组织的核心竞争力在于安全以外的领域，有限的资源必须在组织内共享以实现各种安全和运营目标。从第三方获取安全服务可提供两个主要优势：更便宜的安全能力，以及专业知识。这些优势必须与使用第三方固有的控制权丧失、第三方可能成为攻击目标的可能性以及管理第三方的额外开销相平衡。\n\
  \n汇集和共享资源是一个基本商业概念，事实上也是使用云计算服务的主要驱动因素。MSSP 执行常见的安​​全功能，如 SOC 或 DFIR，其中构建功能、雇用合适人员并在内部运行服务通常是一项昂贵的任务。MSSP\
  \ 通常拥有先进的工具、资源和知识，可以在所有客户之间共享这些资源。MSSP 的客户以更低的成本获得更强大的安全能力，这支持 CISSP 将安全与组织目标保持一致的目标。\n\
  \nMSSP 也存在缺点，因此组织必须就使用这些外部安全服务做出明智的决定。与任何第三方一样，由于关系间接，资源管理更为复杂，因此需要强有力的合同语言和 SLA\
  \ 管理。MSSP 通常可以访问有关组织的敏感数据，因此必须解决数据安全问题——共享组织网络架构等数据的风险不得超过 MSSP 提供的增强安全能力的好处。\n\n\
  最后，MSSP 成为攻击者试图通过供应链入侵多个组织的攻击目标的情况并不少见。许多安全工具，如漏洞扫描器，需要特权访问才能执行安全功能，并且 MSSP 可能会被授权对他们监控的基础设施执行管理功能。入侵拥有\
  \ 1,000 名客户的 MSSP 是获得对 1,000 个组织的特权访问的好方法，因此选择具有健全内部安全计划的 MSSP 是一个重要考虑因素。\n\n通常从第三方获取的安全服务包括以下内容：\n\
  \n*   **SOC**：完全或部分 SOC 外包对于处理构建和运行 24x7 SOC 运营的成本和复杂性非常有用。组织的自有 SOC 可能在非工作时间由第三方补充，或完全外包。\n\
  *   **DFIR**：作为持续监控的自然延伸，调查事件和收集证据可能包含在 MSSP 的服务中。它也可能作为另一工具（如托管检测和响应（MDR））的一部分包含在内，后者通过分析和修复服务增强了传统的反恶意软件。数字取证需要高度专业化的知识，而这种知识并非每天都需要，第三方\
  \ DFIR 公司仅在需要时提供访问。\n*   **Threat intelligence**：威胁情报服务提供有关可能针对组织的威胁的有用信息，通常特定于行业或技术。这些可以集成到持续监控和风险评估等程序中，以及可以自动化对已知威胁响应的\
  \ SOAR 等技术。\n\n## 沙箱\n\n沙箱可能是一个有些令人困惑的术语，因为它既适用于广泛的概念，也适用于特定技术。在最基本层面上，沙箱是一个隔离的环境，其连接到沙箱外部资源的能力受到限制。该术语的示例包括没有与其他系统连接的\
  \ VM，研究人员可以在其中执行恶意软件而不用担心感染其他系统（有时称为引爆）。概念验证软件环境也可以是沙箱，用户可以在其中进行实验，而不会违反实时系统的数据完整性。\n\
  \n\n\n除了概念上的沙箱外，还有软件强制执行的沙箱，它们实施了一套限制性规则来规范应用程序在执行期间的行为。一个例子是苹果的 iOS，它对应用进行沙箱化以限制其可以访问的数据和功能。有些规则是绝对的，而其他规则是可以配置的——应用无法在后台持久运行，而应用只能在获得用户明确许可的情况下访问其他应用中的数据。\n\
  \nMDM 可以作为智能手机上的额外安全层添加，它将沙箱概念扩展到容器——不要将其与应用程序容器化概念混淆，该概念在 第 8 章，“软件开发安全”中有所介绍。MDM\
  \ 容器在用户智能手机上安装特定的一组应用，以允许访问组织数据，但限制来自安全容器外部的任何内容的 数据访问。这些限制可以作为防止文件级数据访问的规则来实现，以及用户限制，例如防止在沙箱应用内进行复制粘贴或截图功能。\n\
  \n## Honeypots/Honeynets\n如果部署得当，蜜罐或蜜网可以用于检测或收集未经授权尝试访问数据和信息系统的信息。对外人来说，蜜罐看起来像是数据库或服务器等有价值的资源，但实际上并不包含有价值的数据。然而，试图访问它们的攻击者可能会被分散注意力或转移目标，远离高价值目标，并且通过访问蜜罐，还会泄露有关他们自己的信息，如其\
  \ IP 地址。\n\n在大多数司法管辖区，使用蜜罐或蜜网存在重大的法律问题，特别是关于诱捕的概念。诱捕是指代理人诱使某人犯罪，从而使犯罪者对犯罪责任获得法律辩护。蜜罐或蜜网绝不应以吸引目标为明确目的而设置，也不应设计为“抓住坏人”，而应是被动观察工具。存在第三方蜜罐服务，它们提供了一种简单部署和监控蜜罐设备的方式。这些服务处理与蜜罐相关的法律挑战并避免诱捕，它们生成的警报可以集成到\
  \ SIEM 或 SOAR 工具中。\n\n## Anti-malware\n反恶意软件是首批广泛的信息或网络安全问题之一，防病毒（A/V）软件可追溯至互联网和个人计算的兴起。随着威胁从简单的计算机病毒演变为包括特洛伊木马、广告软件以及结合恶意软件与社会工程学的骗局或诈骗等更复杂的威胁，*反恶意软件*\
  \ 一词逐渐取代了 A/V。\n\nA/M 软件应使用纵深防御模型部署，以确保流量和活动能够被彻底扫描以检测恶意活动。该软件可以部署在电子邮件服务器或文件共享等关键资源上，也可部署在网络监控工具中，这些工具旨在查找网络流量中的特定攻击模式，例如与\
  \ SQL Slammer 蠕虫相关的对 UDP 端口 1434 的突发流量增加。\n\nA/M 最新的演进源于这样一种认识：任何连接到网络的设备端点都可能成为恶意软件的目标。这包括用户工作站、路由器、服务器、平板电脑等移动设备，甚至像家用电器这样的物联网（IoT）设备。EDR\
  \ 解决方案是下一代产品，将 A/M 功能与其他工具（如基于主机的防火墙、文件完整性监控和 UEBA）结合起来。一些提供商还提供对 EDR 检测到的警报或事件做出响应的服务，这通常以\
  \ MDR 的形式销售，结合了检测能力和第三方安全服务，以解决终端安全风险。\n\n反恶意软件、A/V 和 EDR 使用多种方法来识别和响应计算机系统上的恶意软件和活动。*基于签名*\
  \ 的工具会查找与已知恶意软件相关的签名，例如特定文件或活动模式。更复杂的检测可能依赖于对活动模式的统计分析，即 *启发式*，以检测潜在的恶意行为。一旦检测到，工具可以执行诸如隔离受影响的文件或系统以及向用户或集中式仪表板生成警报等操作。这些警报可以与\
  \ SIEM 等工具集成以实现集中监控和响应，甚至可以与 SOAR 集成以实现事件响应的自动化。\n\n## Machine Learning and Artificial\
  \ Intelligence Based Tools\n机器学习（ML）和人工智能（AI）是数据科学的新兴领域。ML 关注通过经验改进计算机算法；例如，让计算机识别狗的照片，然后由人工验证哪些照片确实包含狗，哪些包含其他动物。算法学习并改进未来的识别；这些算法可用于各种应用，例如通过观察用户将哪些邮件标记为垃圾邮件来过滤不需要的电子邮件，并且广泛应用于旨在学习和适应组织独特环境的安全工具中。\n\
  \nAI 是计算机科学的一个领域，旨在设计能够表现出智能思维或问题解决能力的计算机系统，尽管该术语通常用于描述仅模仿人类任务（如玩策略类棋盘游戏或操作自动驾驶汽车）的系统。AI\
  \ 和 ML 都需要大量数据进行学习，并且将组织数据提供给第三方用于训练 AI 或 ML 模型固有地存在诸多安全和隐私问题。\n\nAI 和 ML 在安全工具中的好处包括更快地检测和响应事件，因为这些工具\
  \ 24x7 工作，无需睡眠或休假。如果配置正确，它们还可以消除决策中的人为错误因素——尽管是否甚至有可能为高度复杂且难以理解的安全问题（如处理零日漏洞）配置此类系统值得商榷。EDR\
  \ 和 IDS 等应用是 AI 的常见实施点，用于在处理新型威胁（如新兴恶意软件）时提高检测和决策速度。\n\nAI 和 ML 的另一个潜在缺点是其决策的黑箱特性，这可能使发现错误或理解其输出变得困难。这种情况类似于在不展示计算过程的情况下解决复杂的数学问题——不可能识别解决方案中的潜在错误或了解解决方案是如何得出的。由于\
  \ ML 和 AI 算法的专有性，可能无法访问底层数据来分析这些工具的决策，因此基于警报采取行动可能很困难。与任何新技术一样，需要谨慎。\n\n## IMPLEMENT\
  \ AND SUPPORT PATCH AND VULNERABILITY MANAGEMENT\n包含超过几行代码的软件很可能包含不可预见的错误，即使是简单的软件也运行在其他包含漏洞的复杂系统组件之上。与其他运营问题类似，CISSP\
  \ 或安全从业人员可能不直接参与补丁的安装，但需要安全方面的输入来设计流程和技术系统，以确保及时部署补丁以解决软件漏洞。资产清单和配置管理流程与漏洞和补丁管理密切相关。资产清单识别出必须保持安全的系统，这意味着监控漏洞并安装可用补丁，而配置管理则要求在部署新软件版本或补丁级别时更新基线。\n\
  \n### Patch Management\n\n\n\n# 补丁管理\n\n补丁是一种旨在解决特定软件漏洞或问题的软件更新。并非所有补丁都修复安全问题——有些是为了解决功能限制或错误而设计的。智能手机应用和主要计算机操作系统现在都支持补丁的自动安装，因此术语\
  \ *软件更新* 也变得常见——这可能会有些令人困惑，因为软件更新是一个宽泛的类别，可能包括添加新功能。然而，软件更新的自动化特性是有益的，使用这一功能正成为最佳实践，因为它确保关键安全更新能够自动安装。\n\
  \n补丁管理流程的输入包括供应商公开通知用户补丁可用性，例如微软每月一次的 Patch Tuesday 和甲骨文每季度一次的 Critical Patch Update。这些补丁的通知通常会在供应商的支持网站上广泛发布，并通过\
  \ Windows Server Update Services (WSUS) 等软件工具向用户广播。内部开发的系统也需要补丁来解决在审计或扫描中发现的功能或安全问题，在这种情况下，组织的发布或部署流程应包括通知相关团队补丁可用。\n\
  \n补丁管理是一个涉及多方利益相关者的流程，包括发现漏洞的研究人员或测试人员、编写补丁的开发人员以及安装补丁的支持人员。涵盖所有利益相关者的通用安全补丁流程必须包括以下内容：\n\
  \n* **漏洞检测** 由扫描工具、安全研究人员、用户报告错误等进行。\n* **发布补丁** 由供应商或开发团队在漏洞得到验证并编写相关代码以解决它之后发布。\n\
  * **评估补丁适用性** 由各组织的管理人员确定在特定环境中是否需要该补丁。\n* **测试** 补丁以确保其不会引入不想要或有问题的更改。\n* **应用和跟踪**\
  \ 补丁以确保其不会对功能产生负面影响并部署到所有相关系统。许多组织会根据补丁所解决漏洞的严重性制定补丁部署的 SLA；例如，关键补丁必须在发布后七天内部署。\n\
  * **回滚** 如果遇到问题。\n* **文档记录** 包含补丁的系统，该系统成为用于配置管理的新的基线。\n\n补丁管理与其他许多运营问题一样，可能涉及内部流程和第三方混合。云服务提供商\
  \ (CSP) 或托管服务提供商 (MSP) 可能负责部分或全部补丁管理，并且应制定 SLA 并进行适当监控以确保补丁及时应用。\n\n软件组成分析 (SCA)，在\
  \ 第 8 章 中有更详细的讨论，是漏洞和补丁管理中的另一个第三方要素。软件部署的一部分应是分析任何第三方依赖项并确保始终使用这些依赖项的最新版本。否则，过时且易受攻击的软件将被纳入信息系统，从而使系统变得脆弱。\n\
  \n## 漏洞管理\n\n漏洞是风险的一半，因此漏洞管理实践是安全从业人员职责的重要组成部分。漏洞管理计划可以简单到为小型组织基于云的 IT 基础设施面临的威胁进行年度漏洞识别，也可以复杂到跨国组织拥有专门的威胁狩猎团队全年工作以识别和测试组织的漏洞。工作量和投资水平应与所有安全决策一样，与组织的需求保持一致，可能包括以下内容：\n\
  \n* **威胁狩猎** 是寻找逃避组织现有安全解决方案并可能利用未知漏洞的威胁的做法。其范围通常很广，可以持续进行。\n* **漏洞扫描** 通常是一种旨在检测已知漏洞（如不安全配置或未修补软件）的自动化活动，并且通常是识别补丁管理失败的关键检测控制。与其他方法相比，漏洞扫描器有一个显著缺陷——它们只能检测已创建签名的已知漏洞。然而，它们可以几乎持续运行以快速识别已知漏洞。\n\
  * **红队演练** 涉及针对漏洞的有针对性的测试形式，通常针对特定资产。人工测试人员在自动化工具的协助下可以发现以前未知的漏洞并尝试规避由蓝队运营的组织防御机制。两者之间的对抗关系是测试的一部分，红队的成功定义为通过利用发现的漏洞获取目标，而蓝队的成功定义为对同一目标的防御。\n\
  * **渗透测试和漏洞赏金** 是旨在检测漏洞的人工运行测试，可能范围广泛或狭窄。渗透（pen）测试人员按其服务的聘用获得报酬，而漏洞赏金猎人则按其发现的每个已验证漏洞获得单独的赏金。与红队演练不同，渗透测试或漏洞赏金的范围通常更广，且参与规则可能要求测试人员仅记录而不利用其发现的任何漏洞。\n\
  \n漏洞管理中的许多流程和工作流非常适合使用 SOAR 工具进行自动化，例如漏洞扫描和相应的补丁部署以修复已识别的漏洞。\n\n## 理解并参与变更管理流程\n\
  \n变更管理关注保持组织有效运行并从一个安全状态转移到另一个安全状态。它与配置管理密切相关，但配置管理关注的是保持组织的系统处于已知良好状态，而变更管理则涉及审查、批准和管理变更的实施，以从一个已知良好状态转移到另一个已知良好状态。安全从业人员是这两个学科的利益相关者，应对流程和程序要求提供意见。\n\
  \n变更范围可以从对现有应用程序或系统的轻微修改到添加/退役整个信息系统。为了在不影响安全性的情况下做到这一点，组织必须主动执行一系列正式的活动和流程，以请求、审查、实施和记录所有变更。许多组织利用票务系统记录变更管理所需的步骤。创建变更请求是第一步，请求应捕获重要细节，如变更目的、变更理由、负责人、所需资源以及任何预期影响。\n\
  \n请求后，变更将由变更控制委员会或变更咨询委员会 (CCB 或 CAB) 进行审查。此次审查必须验证拟议变更是否提供与其相关成本相适应的业务利益/价值，正式审查变更的影响，并确保任何潜在影响或风险已连同缓解计划一起记录。此次审查可能涉及测试，可能包括决策分析等额外流程，如果变更委员会需要请求者提供额外信息，则可以迭代。\n\
  \n\n\n## 变更管理\n\n一旦变更获得批准，即可由负责人根据 documented plan 执行。由于许多变更会导致获取新的硬件、软件或 IT 服务，因此在变更过程中会同时存在多个安全问题，包括获取安全管理、安全测试，以及如果变更规模足够大时使用组织的认证和授权流程。虽然一个\
  \ `CISSP` 可能不直接参与采购和部署新硬件等流程，但与相关团队协调以确保流程得到遵循至关重要。\n\n变更管理流程中固有延迟，就像任何需要寻求批准的流程一样。这种延迟是有意为之的，允许有时间收集评估变更影响所需的信息。在某些情况下，这种延迟是不希望的，因此组织的变更管理可能具有灵活性。组织可能会为变更使用自定义类别。`ITIL`\
  \ 定义的类别提供了有用的参考点，详细说明如下：\n\n* `Standard changes`：这些变更风险较低，被认为不太可能产生负面影响，因此预先批准以减少运营开销。示例包括应用标准补丁、添加标准资产以解决容量问题（即部署标准服务器构建以提供额外的处理能力），或从批准列表中安装软件。\n\
  * `Normal changes`：这些变更在实施前需要完整的变更管理流程的请求和审查。它们通常遵循基于变更委员会常规会议节奏的计划。\n* `Emergency\
  \ changes`：在安全事件等紧急情况下，应对事件的过程不应因召集变更管理会议并获得批准，或进行大量测试以排除紧急补丁的潜在负面影响而受阻。在这些情况下，变更管理审查可能在事后进行——变更根据需要进行以处理事件或紧急情况，所有细节均记录下来以供后续审查。一些组织在这些情况下使用修改后的变更流程，其中采用精简的决策或负担较小的流程来平衡安全性和速度。\n\
  \n## 实施恢复策略\n\n恢复主要与可用性安全目标相关，并包含确保组织具备恢复其关键数据、流程和系统的足够能力的策略。这些关键资产是通过执行业务影响分析（`BIA`）来识别的，`BIA`\
  \ 列举了关键资产和能力，所设计的恢复策略应平衡组织的可用性需求与相关成本。\n\n`BIA` 确立了管理层批准的关键流程或功能的 acceptable level\
  \ of operation，并确立了用于设计恢复策略的关键参数。在发生扰乱正常运营的事件时，恢复能力负责恢复此最低可接受的服务水平。恢复通过多个关键指标来衡量，例如以下内容：\n\
  \n* `Recovery time objective (RTO)`：事件或灾难发生后，在使用应急程序恢复系统或流程（而非完全恢复正常）之前所经过的时间。\n\
  * `Recovery point objective (RPO)`：灾难发生时可容忍的数据丢失量，通常以交易或数据点的数量表示。`RPO` 也可以用时间表示，例如\
  \ `RPO` 不超过一天的数据。\n* `Maximum tolerable or allowable downtime (MTD or MAD)`：组织在没有资产或流程的情况下可以存活的时间，超过此时间组织可能不再可行。`RTO`\
  \ 应始终小于 `MTD`；否则，恢复就毫无意义，因为组织会在恢复发生前停止运作。\n\n所有恢复指标都应由业务关键性和成本决策驱动。起初，所有系统和流程都将被视为关键并被赋予非常严格的\
  \ `RTOs`；一旦业务领导者看到高可用性或冗余系统的成本，这些指定很可能会改变。与所有运营任务一样，此过程涉及多项技能和团队，包括业务分析师、技术管理员和安全团队。\n\
  \n### 备份存储策略\n\n数据备份对于防止因各种原因导致的数据丢失至关重要，包括用户错误、设备故障、恶意软件损坏、勒索软件攻击或自然灾害。设计备份策略需要了解\
  \ `RPO` 和 `RTO` 等要求，因为需要做出不同的技术和计划选择。例如，如果备份每周仅执行一次，则无法满足数据丢失 24 小时的 `RPO`——在此情况下，可能丢失长达六天的数据。\n\
  \n有多种备份方法，每种方法都有不同的成本和收益。`Full backups` 运行时间最长，使用空间最多，因为它们备份所有数据。`Differential backups`\
  \ 捕获自上次完整备份以来更改的所有数据，因此运行更快且需要更少的存储。`Incremental backups` 捕获自上次完整备份或增量备份以来更改的所有数据，因此捕获的数据量最小，运行最快。在恢复时，增量备份通常需要最长的恢复时间，因为它们需要上次完整备份和此后制作的所有增量备份，而差异备份仅需要上次完整备份和差异备份。版本、快照和归档也可以用作关键数据的备份，只要这些替代副本能够承受主信息系统存储的丢失、损坏或故障即可。\n\
  \n设计备份计划需要在备份和恢复方面平衡所需的成本和速度。所需保留期限将决定存储容量大小，而更多的存储显然会花费更多资金。完整备份过程还需要更多的处理能力和系统时间，这可能成为正常系统运营的额外成本。具有非常高的\
  \ `RTO` 或 `RPO` 的系统不太可能需要每周一次完整备份和每天两次增量备份，因此与该备份相关的成本是不合理的。\n\n#### 备份的完整性和保密性\n\
  \n尽管备份与可用性原则密切相关，但备份数据的完整性也是至关重要的。一些专用备份系统提供在数据写入备份介质（如硬盘或磁带驱动器）后执行数据完整性检查的能力。即使进行系统性的完整性检查，执行测试恢复以验证数据也是最佳实践，既可再次检查完整性，也可确保备份了正确的数据。\n\
  \n由于备份包含来自实时生产环境的所有数据，因此必须以至少相同级别的安全控制来对待备份介质。在许多情况下，需要替代或额外的控制措施；例如，如果备份介质发送到异地存储设施。备份介质上数据的访问要求也可能不同，因此可以利用独特的访问控制，如对静态数据的更强大的加密，以抵消介质在运送到异地存储设施途中被拦截的威胁。实时系统会轮换用于保护静态实时数据的加密密钥，但旧密钥必须保留，以便仍能读取用该密钥加密的备份驱动器上的数据。备份介质及其包含的数据应记录在资产清单中，并在风险评估和缓解过程中得到充分考虑。\n\
  \n#### RAID\n\n\n\n# 数据存储、备份与弹性\n\n## RAID\n\nRAID 可指廉价磁盘冗余阵列或独立磁盘。RAID 背后的概念是将多个磁盘池化，这可能比单个等效大小的磁盘更便宜，以提供更大的空间、更高的读写速度、数据容错性，或三者的某种组合。\n\
  \nRAID 控制器用作磁盘的接口，磁盘被呈现为逻辑存储点。控制器处理数据操作，如在请求时拆分和重新组合文件。将多个磁盘池化可为用户访问创建一个更大的磁盘，而\
  \ `striping` 将传入数据拆分为更小块写入多个驱动器以提高读写速度。`Mirroring` 复制数据并将其写入多个驱动器，而 `parity calculations`\
  \ 使用数学模型允许即使某些条带丢失也能重建条带数据。镜像和奇偶校验都提高了对物理驱动器故障的容错能力。\n\n常见的 RAID 配置以数字标识——有些并不常用甚至不可行，但最常见的是以下几种：\n\
  * `RAID 0` 是一种无容错的条带磁盘阵列；主要优势是读写性能提升。\n* `RAID 1` 是一种提供容错但无读写性能优势的镜像阵列。\n* `RAID\
  \ 5` 是带奇偶校验阵列的条带化，可提高读写性能并提供容错。\n* `RAID 0+1 and 1+0` 是嵌套 RAID，以不同顺序实现 RAID 0 和\
  \ 1 的双重功能。0+1 是镜像的条带阵列，而 1+0 是条带的镜像阵列。两者都结合了容错性和性能提升。\n\n## Cloud\n\n云计算改变了备份策略，正如它改变了计算的各个方面。如软件即服务（SaaS）之类的云服务通常配置为高可用性、自动数据复制和\
  \ `data durability`，即主动管理数据以保持完整性和可用性。在这种情况下，备份策略可能只是使用云计算服务。对于高关键性应用，非云备份或替代方案可能是合理的。\n\
  \n云也可以仅用于备份目的，由于其可用性以及相对于旧解决方案（如异地磁带备份存储）的相对低成本。在这种情况下，像基础设施即服务（IaaS）或平台即服务（PaaS）之类的存储解决方案可能适合获取可放置备份数据的存储容量。PaaS\
  \ 可用于创建与组织生产环境类似的环境，如数据库，以便在中断时轻松切换。与所有云服务一样，数据物理控制的丧失需要与成本节约进行权衡。在将数据存储到云环境之前进行加密可能是一种有用的保护措施，前提是加密过程不会导致恢复出现不可接受的延迟。\n\
  \n## Recovery Site Strategies\n\n恢复站点配置和位置的选择应由其所能支持的恢复速度及其与主位置的接近度的成本效益分析驱动。许多框架为选择恢复站点位置提供具体指导，以确保其在地理上与影响主站点的任何大规模事件隔离。然而，恢复站点越远，在必须迁移操作的情况下，关键人员到达所需的时间就越长。在\
  \ RTO 和 MTD 窗口非常短的组织中，将员工、资源和流程永久性地分配到多个站点是一种可接受但成本高昂的解决方案，称为 `mirror site`。\n\n\
  物理恢复站点使用温度等级进行分类，表示灾难发生时其可用性状态。`cold site` 是一个空设施，必须先配备设备和公用设施后才有用，这需要时间且不支持短 RTO，但它也不会在事件发生前产生重复基础设施的高成本。`Warm\
  \ sites` 拥有部分设备但也需要部分建设，而 `hot site` 拥有与主站点相同的 infrastructure 和数据，成本高昂但有助于满足短 RTO\
  \ 或 RPO。\n\n第三方供应商存在于温站和热站恢复，帮助分担构建和维护这些能力相关的部分成本。另一种恢复选项是 `mobile site`，即可在需要时快速部署的数据处理设施。这些通常是部署在易于移动的结构（如集装箱）中的服务器机架，可装载到卡车、火车或船上并轻松运送到所需地点。许多政府灾害响应机构使用此类移动数据中心，在自然灾害后提供移动计算服务。\n\
  \n`Cloud bursting` 是一种相对较新的恢复策略，在灾难发生时临时利用云服务。使用基础设施即代码和类似技术（如容器化）使得在云中快速部署新虚拟基础设施在技术上成为可能，尽管需要数据的系统在云中执行数据恢复仍可能需要时间。Cloud\
  \ bursting 可以是在组织自己的本地环境不可用时临时使用云环境，也可以在本地系统需求增加时用于增加临时容量。\n\n## Multiple Processing\
  \ Sites\n\n组织可以通过主动设计跨多个处理站点的流程或功能来防范灾害影响，这些站点应地理分布以防止同一灾害影响多个站点。例如，处理来信的数据处理器可以根据邮政编码将邮件路由到该国东部和西部地区的设施。两个设施执行相同的流程，在西部地区发生灾难时，邮件将被重新路由到东部地区，并增加人员处理数据处理。\n\
  \n多处理站点的明显好处是内置的冗余。同样的冗余带来的缺点是租金、人员和设备成本更高。对于处理数据的组织，还存在在多个处理站点之间复制和同步数据的技术挑战，磁盘或数据库镜像等解决方案可能有用。许多云服务本质上旨在支持此用例，即时复制的数据存储是许多云数据库和\
  \ SaaS 工具的标准功能。这可以解决站点之间数据同步和复制相关的风险，但与任何迁移到云或外包服务提供商一样，存在与失去数据控制相关的增加风险。\n\n##\
  \ System Resilience, High Availability, Quality of Service, and Fault Tolerance\n\
  \n弹性描述了系统或流程抵抗故障的能力，通常依赖于考虑故障并内置纠正措施的稳健设计。示例包括能够检测卡住或挂起的进程并通过终止和重试进程自动重启它们的系统。CSP\
  \ 通常以高度弹性设计其服务，不仅为了满足客户 SLA 义务，还为了自动化其控制的庞大基础设施的监控和维护。\n\n\n\n# 可用性、服务质量与容错\n\n\
  系统可以被设计以满足严格的可用性水平，且这些要求应作为系统开发的一部分进行记录。高可用性（HA）配置是一种选择——通过使用负载均衡器或集群等技术，系统可在某个组件故障时提供冗余和请求的动态重路由。服务质量（QoS）经常被应用于网络技术，以便在带宽有限的情况下对非常重要流量进行优先级排序。这可能是应优先于非必要数据（如用户网页浏览）的重要任务数据，也可能是时间敏感型数据，例如必须及时传输以保持音视频同步的远程会议流。\n\
  \n容错在数据中心设计上下文中有特定含义。根据 Uptime Institute 等级定义，Tier IV 为“能够在不影响 IT 的情况下承受站点基础设施的任何非计划故障”。这要求数据中心为电力和网络连接等公用设施保持足够的冗余组件和分布，这成本高昂。对于能够承受中断的应用或系统，存在\
  \ Tier I、II 和 III，它们提供较低的保证正常运行时间，通常成本更低。等级规范和资源可在 Uptime Institute 网站找到：`uptimeinstitute.com/tiers`。\n\
  \n容错系统更一般地，如其名称所示，能够容忍硬件、软件或数据处理的故障并继续运行。RAID 可能能够容忍一块磁盘的丢失，如果其配置允许重建丢失的数据，或者数据库系统可以通过回滚并重试失败的交易来容忍故障，前提是适当的中间件应用程序支持此功能。\n\
  \n## 实施灾难恢复流程\n\n在完成业务影响分析（BIA）后，组织可以开始主动规划在事件中断正常功能、流程和服务交付时该怎么做。DR 专注于恢复和恢复正常的\
  \ IT、信息和电信服务。DR 支持 BC 的总体目标，而 BC 主要关注在事件发生时继续开展业务。BC 和 DR，通常合称为 BCDR，都需要为各种系统设定\
  \ RTO 和 RPO。基于这些指标，组织可以选择支持这些恢复目标的技术解决方案，并设计在灾难响应中激活或切换到备用系统和程序所需的流程。由于恢复跨职能组织流程需要跨职能团队参与，安全从业人员不仅是关键利益相关者，还需要与其他职能密切协作。\n\
  \n当授权个人做出正式判定，评估情况并确定组织在当前情况下无法继续执行正常功能时，即 *宣布* 灾难或应急情况。宣布可能在灾难发生前进行，例如预测的极端天气，也可能源于不可预见的灾难，如重大火灾，或作为最初由\
  \ IR 流程处理的事件的升级。事件宣布后，DR 流程被激活，以将运营转移到 DR 计划中确定的替代方案。\n\nDR 是 BC 的子集，专注于灾难发生时恢复\
  \ IT 服务和功能。相比之下，BC 专注于组织的业务运营连续性，而这些运营依赖于在 DR 计划中处理的系统和数据。一旦灾难得到遏制或以其他方式处理，DR 计划用于识别并执行将运营恢复到原始站点或选定的新主站点的必要步骤。这些组合的流程领域和相关计划文件有时被称为\
  \ BCDR。\n\n### 响应\n\n安全从业人员通常负责对灾难情况的初始响应；通常，最资深的安全官员是被授权宣布灾难的有限人员之一。宣布涉及重大财务成本并暂停正常流程和运营，因此这不是轻率做出的决定，不应由未经培训的员工做出。\n\
  \n对灾难的响应所需采取的行动将根据灾难类型而有所不同。在压力条件下，人们往往无法做出最佳决策，因此最好在 DR 和 BC 计划中记录预先批准的响应和行动计划作为指导。这些行动计划结合计划的培训和演练，可加快响应速度并帮助在灾难期间指导决策。计划中需要解决的一些任务包括以下内容：\n\
  \n*   **人员生命、健康和安全**，这始终是首要关注点。能够物理破坏数据或系统的灾难，如极端天气或社会动荡，也会危及人员，而数据和系统的保护是次要问题。\n\
  *   **协调响应**行动，在指定灾难或危机协调员的指导和监督下进行，对提供重点至关重要。\n*   **清晰且一致的沟通**必须向各种利益相关者包括员工、高级管理层，以及可能公众或执法部门做出。\n\
  *   **记录**所做的一切，以支持灾后审查，并为保险或法律行动所需的任何证据提供支持。\n\n### 人员\n\n在所有情况下，人类的生命、健康和安全是安全最重要的目标。在灾难或应急运营期间，人员可能面临新的风险，可能来自扰乱运营的同一灾难，或来自响应行动，如新人员在不熟悉的环境中进行设备安装。安全从业人员在规划时必须考虑这些因素，并确保\
  \ BC 或 DR 计划包含减少风险的措施。\n\n除了人员安全考虑之外，BCDR 计划还必须记录继续组织关键流程所需人员的角色和职责。这些人员可能拥有与组织的流程、系统以及如何运行、操作或维护它们相关的特定知识或技能。对于关键职能，如灾难宣布或危机沟通，应在计划中记录指定人员和联系方式，以确保职责明确分配。人员实践如轮岗和交叉培训可以支持应急运营，因为能够履行多重角色的人员在紧急情况下至关重要。\n\
  \n重大灾难或事件可能需要超出正常福利或士气运营范围的人员家属协调。在正常运营期间，安排住房或托儿等关切通常由员工自行负责，但在灾难发生时，可能需要迁移运营和人员。在这种情况下，特别是如果迁移时间较长，计划应包括为人员及其家属安排基本需求（如住房和食物）的安排。应考虑前往备用站点的交通，因为具有物理影响的灾难，如天气或社会动荡，可能使常规交通无法使用。\n\
  \n### 通信\n\n在事件期间让利益相关者了解相关信息至关重要。危机沟通困难的原因在于信息有限或快速变化，以及需要及时通知各种内部和外部利益相关者。不完整或部分信息可能因谣言和恐惧而复杂化，因此制定一个考虑到动态环境并提供清晰信息的危机沟通计划至关重要。\n\
  \n\n\n# 危机沟通与灾难恢复\n\n“单一声音”原则对于危机沟通至关重要，并规定组织在沟通时应保持统一的声音，尤其是在与外部利益相关者（如媒体或公众）沟通时。多名人员的多个说法，即使出于最好的意图，也可能令人困惑或可能造成危险。该原则应被记录并作为培训的一部分——任何收到媒体或其他外部人士请求的人员必须避免发表声明，而是转交给适当的沟通联系人。\n\
  \n危机沟通中的不同利益相关者将需要不同的信息和传递方式。每一次沟通的目的还应根据所涉及的利益相关者以及方法、响应要求等要求进行评估，具体包括以下内容：\n\n\
  *   **内部利益相关者**包括员工和管理层，他们不仅需要有关事件的信息，还需要参与响应的指导。员工可能被指派到替代工作地点或被要求撤离，指示中应包含与安全相关信息。\n\
  \n    与内部利益相关者沟通的方法和渠道可以包括主动方法，如电话树，要求每个被呼叫人员做出响应，或被动方法，如发布在员工可以访问的网站上的消息。所选方法应考虑接收人员的关键程度以及所传达的信息。\n\
  \n*   **外部利益相关者**可以包括客户或用户、公众成员以及可能受组织应急运营影响的业务合作伙伴或供应商。一些服务提供商可能被纳入此类别，而像承包商员工等其他人员可能被视为内部利益相关者。执法机构和响应提供商（如\
  \ DFIR 公司）也是关键的外部利益相关者，他们需要信息和访问权限来执行与响应行动相关的工作。\n\n    与外部利益相关者沟通的方法和渠道可能由法律或合同义务决定，例如在发生泄露时进行隐私通知。根据情况应使用主动和被动方法，例如主动邮寄或致电客户通知他们，或发布供公众传阅的新闻稿。\n\
  \n### 评估\n\n灾难评估类似于风险评估——主要目标是确定影响并优先安排应对所需步骤。这涉及识别灾难的性质和来源，例如人为或自然，并确定恢复行动的优先级，例如将人员疏散到替代地点或优雅地关闭设备并将运营迁移到替代设施。该过程可能是持续进行的，由于事件具有动态性，响应团队必须识别事件或灾难的当前和可能未来的影响。\n\
  \n灾难评估的结果必须传达给管理层和决策者以确定正确的行动方案。如果存在写得良好的 BCDR 计划，则响应应遵循现有的程序或步骤，并进行适当调整以适应特定灾难的具体情况。这些步骤当然需要优先考虑生命、健康和安全，并应考虑到对客户、监管义务的任何影响，以及直接和间接成本，如收入损失和声誉损失。\n\
  \n评估还将在恢复后进行，以确定灾难或事件的总体影响。该评估应包括组织的总财务成本，包括恢复成本和任何业务或生产力损失，以及如何改进未来灾难和连续性运营的信息。记录并使用经验教训将在后面的章节中更详细地讨论。\n\
  \n### 修复\n\n组织可能在相对较长的时间内运行灾难或应急流程，而恢复活动将在这些流程实施的同时开始。应急运营通常低于组织期望或理想的服务水平，但支持核心功能和流程的连续性。一旦达到这一最低水平，DR\
  \ 团队的重点就会转向恢复受灾难影响的原始站点或设施。在某些情况下，原始设施可能完全被毁，需要新的设施，因此可以使用术语 *主站点* 以避免旧设施和新设施之间的混淆。*恢复*\
  \ 的目标是恢复关键业务功能——通常是在降低的产能下——而 *修复* 的目标是在主站点恢复正常服务水平。\n\n将服务和运营转移到已修复或新的主站点可能与转移到替代站点一样具有破坏性，并包括相同后勤任务，如搬迁人员和设备。然而，修复通常发生在更理想的非紧急条件下。返回主站点的决定将由站点本身的安全性和可行性驱动。例如，如果建筑物因自然灾害受损，则必须在可以使用之前进行修复并可能获得入住认证。这需要\
  \ DR 团队持续评估并向负责做出修复决定的管理层报告。\n\n修复中存在许多超出安全团队管辖范围的变量，但安全从业人员仍然是关键利益相关者。安全职能可能在 DR\
  \ 计划中被分配关键角色，并且可能需要在有关在搬迁至主站点期间保护数据等决策上征求意见。\n\n### 培训和意识\n\nBC 和 DR 计划必须编写并测试，关键人员必须接受计划细节及其分配职责的培训。所有人员都应接受基本生命、健康和安全计划的培训，包括如何识别和应对紧急情况，如火灾或组织运营所在地区特定的极端天气准备。这些培训的目的有二：人员获得训练有素的响应，从而在紧急情况下加快反应时间；演练提供了识别计划中弱点的机会。\n\
  \n在 BC 和 DR 计划中确定的具有特定职责的人员需要更高级的培训。这些包括具有宣布权限的人员以及具有分配角色和职责的关键人员。IT 和安全在恢复 IT 服务以及确保应急运营期间安全控制保持有效方面具有明显的作用。人力资源、财务和法律团队等其他职能可能根据灾难类型发挥关键作用。人员可能需要额外的福利，如医疗或搬迁援助，而应对灾难产生的费用可能需要特别批准。如果灾难影响法律或合同义务，则需要法律顾问来确定必须满足的任何要求。\n\
  \n应定期提供培训和意识机会，以确保知识保持最新。定期消防或疏散演练是一种方法，BC 或 DR 计划的常规测试和演练对于关键人员的交叉培训和知识更新非常有用。\n\
  \n### 经验教训\n\n持续改进是许多组织流程（包括 BC 和 DR）的有用模式。至少，应在修复完成后进行正式审查，并且在时间允许的情况下，可利用额外机会来识别：\n\
  \n*   进行良好的行动或流程。\n*   进行不佳的行动或流程。\n\n\n\n# 事后审查与经验教训\n\n员工和人员的行动可能促进或阻碍恢复和重建。需要注意的是，这不应旨在归咎或指责，而是为了识别改进机会。因此，安排一名引导员有助于避免个人感到受迫害等问题。\n\
  \n这类审查可能被称为事后分析、行动后报告、回顾或经验教训。目标是识别计划或响应中运作良好的部分，以及未按计划进行的内容，并在未来灾难情况下的具体改进机会。\n\
  \n对灾难进行根本原因分析也可能很有价值，以识别降低未来事件发生可能性或影响的主动措施。例如，导致需要将灾难恢复到备用设施的广泛恶意软件爆发，可用于证明投资更强大的\
  \ EDR 工具的成本合理性。无论事后收集了什么信息，都必须将其用于推动 BCDR 规划和流程的改进。\n\n## 测试灾难恢复计划\n\n设计和记录 DR 计划是减轻灾难影响的一种方式，尽管可能导致灾难的风险可能需要其他旨在降低其发生概率的缓解措施，例如用于遏制火灾损害并防止其摧毁整个设施的消防系统。测试\
  \ DRP 是一种必要的、主动的风险缓解措施，具有两个主要目的。\n\n首先，测试可以识别计划中不正确的假设或过时的信息，如果不加以纠正，会限制计划的有效性。其次，测试或演练计划的过程为员工提供了宝贵的培训机会。像消防演习一样的排练响应，能够为员工建立训练有素的响应能力，并在真实灾难或紧急情况下提高行动的有效性，因为人员将执行熟悉的程序。最后，可见的\
  \ BCDR 规划、测试和演练向员工、客户和其他利益相关者提供了组织认真对待安全的保证。\n\n最佳的测试方法从简单开始，原因在于测试固有的成本和潜在中断，以及建立测试能力的需求。对程序不熟悉的员工应有机会随着时间的推移积累知识，而不是参与复杂的测试，因为如果处理不当可能导致真实事件。接下来描述的\
  \ DR 计划测试类型按从简单到复杂的顺序排列；除了从简单开始外，像通读这样负担较小的测试也可以更频繁地进行。即使每年进行一次全面中断测试，每季度进行一次通读也有助于识别组织中尚未反映在计划中的变化。\n\
  \nDR 计划测试的输出应为经验教训和计划更新，CISSP 可能会负责将其纳入计划。一旦必要的更改完成，计划应分发给关键的 DR 和 BC 人员，并且应采用抗灾格式。例如，可以分发计划的纸质副本，并指示员工将其存放在家中，以防中断导致信息系统或组织设施无法使用。\n\
  \n### Read-through/Tabletop\n\n最简单的 BCDR 测试类型是对计划进行通读，通常由包括管理人员或各利益相关方代表的小组执行。这通常涉及组织中任何专职的\
  \ BCDR 人员、安全和 IT 部门以及其他业务部门的代表。\n\n在通读中，会审查每个 BCDR 团队成员负责或承担责任的关键信息。这包括核实灾难期间通信所需的信息和程序，目标是发现缺失或过时的细节，以及任何不正确的假设。\n\
  \n桌面推演召集关键利益相关者，并将计划放在他们面前——在桌面上——进行响应角色扮演。每个参与者不仅讨论计划中呈现的信息，还讨论他们为执行程序将采取的步骤、场景中所需的信息以及他们预见的问题。主持人可以帮助记录细节，保持场景推进，并记录发现的任何需求、问题或计划更新。\n\
  \n通读和桌面推演是测试成本最低的方法，无论是时间、成本还是对正常运营的潜在干扰。即使采用更完善的测试形式，如年度模拟，通读也推荐作为更频繁的补充，以识别和纠正过时的信息。\n\
  \n### Walkthrough\n\n实地演练在桌面推演的基础上扩展，但模拟在 DRP 中描述的实际地点进行响应。响应团队不仅讨论计划要素，还根据演练场景（如火灾导致数据中心无法使用）规定的要求，实际行走或移动执行相应的计划步骤。例如，在此场景中，网络工程团队不会仅仅说“Felicia\
  \ and Joe drive to the alternate facility”，而是这些人员实际开车前往该设施。实际行走响应步骤可以让关键参与者建立一定的熟悉度，并有助于发现响应所需的缺失或搬迁设备等细节。\n\
  \n实际演练响应的目标有两个方面。它可以挑战所做的假设，例如“staff relocate to the alternate facility within one\
  \ hour of a disaster declaration”。如果设施距离太远，无法在一小时内到达，RTO 显然无法满足。其次，它为员工提供了熟悉程序或设施的机会，使其在实际灾难发生时能够更快响应。\n\
  \n### Simulation\n\n大多数人熟悉消防演习或火灾报警测试，这是一种灾难响应模拟形式。在火灾发生时，人员应有序撤离到指定的集合点。一些人员将被分配特殊职责，以确保所有人员已撤离设施，而其他人员可能负责确保残疾人员得到疏散协助。这种模拟对运营有明显的生产力损失影响，但在火灾情况下保护生命和安全的好处证明了这一成本的合理性。\n\
  \n消防演习是一种模拟，但其他场景也可用于模拟响应能力。例如，可以召集 DR 团队并提供一个需要激活备用设施、从异地存储中召回数据并加载的场景。这可以用来验证系统是否能够按照定义的\
  \ RTO 和 RPO 指标恢复，并且备份数据完整性完好。\n\n### Parallel\n\n在并行测试中，受灾难场景影响的系统与其备用系统并排测试，以确保备用系统能够处理现实的运营负载。如果组织拥有镜像热站点，则所有传入数据和系统任务都可能在主站点和镜像站点之间复制。这是一种连续并行处理形式；对于拥有温站点的组织，并行测试需要使温站点投入运行，然后将流量导向两个设施，以确保温站点能够成功处理处理量。\n\
  \n\n\n并行测试在提供对恢复能力进行测试的相对全面覆盖的同时，降低了对主要系统的冲击。它们确实会产生显著成本，并且可能带来运营影响，例如略微延迟处理或降低员工生产力，因为资源需要在日常运营任务和并行测试任务之间分配。由于测试范围广泛，并行演练可以发现其他测试可能遗漏的问题，例如配置不当的备用站点或不完整的数据备份。\n\
  \n## 完全中断\n\n在完全中断测试中，组织的灾难恢复能力会被测试，仿佛发生了真正的灾难，这涉及高成本，并且如果测试不成功，可能扰乱正常运营。完全中断顾名思义，会中断正常处理并将组织切换到应急程序和备用站点，目标是识别\
  \ BCDR 计划和程序中的所有可能问题。\n\n完全中断测试可以针对系统子集进行，以最大限度地减少相关影响或成本。例如，数据中心可以通过切断商业电力来执行完全中断。不间断电源（UPS）和发电机等备份系统正在接受测试，以确保在商业电力中断期间按预期运行。然而，即使此类灾难可能导致商业电力中断，组织的整体自然灾害响应仍未得到测试。\n\
  \n## 参与业务连续性规划和演练\n\n安全从业人员和 CISSP 是规划和执行关键连续性任务的关键利益相关者，但他们通常不是业务连续性流程的所有者。关键任务包括提供有关应急操作期间安全要求如何变化的意见，以及实施或管理满足这些新要求所需的响应。例如，电子访问控制系统通常可防止对敏感信息的非授权访问，但导致停电的自然灾害需要备用物理控制措施（如挂锁）来弥补。\n\
  \n安全从业人员在业务连续性规划和演练期间可以发挥的另一个关键作用包括指导识别需要在业务连续性或灾难恢复计划中体现的变更的过程。例如，人员、流程的变更，或从先前事件或应急情况中吸取的经验教训可能需要更新计划。一旦更新完成，必须考虑计划文档的完整性和可用性。计划的新副本应为所有相关利益相关者提供，包括在信息系统无法访问时使用的离线副本。旧副本也必须收回并销毁，以确保在实际紧急情况下不会使用过时或错误的信息。\n\
  \n由于安全事件可能导致宣布灾难，安全职能可能在设计用于测试和演练业务连续性计划的场景方面发挥关键作用。例如，勒索软件攻击通常由事件响应程序处理，但如果范围足够广泛，可能需要宣布灾难并激活备用设施和程序。安全从业人员非常适合不仅制定此演练场景，还担任主持人，因为他们很可能具备在模拟期间回答问题所需的知识。\n\
  \n## 实施和管理物理安全\n\n物理安全通常是 CISSP 在信息系统安全职责范围之外的职能，但防止对系统和数据的非授权物理访问是风险缓解中至关重要的一部分。即使物理安全并非安全从业人员背景的直接组成部分，在日常生活中也很容易找到例子，因为我们大多数人在职业和个人环境中都会使用或与物理安全系统互动。\n\
  \n实施或更改物理控制措施通常比逻辑控制措施频率更低，因为物理设施通常变化较少。改造提供了构建实施或修改物理安全控制所需的新物理结构的机会，并且许多物理访问控制机制依赖于会更频繁升级的信息系统组件。物理安全需要与设施维护、园丁或园艺师以及保安人员等员工共享的管理任务，因此与许多安全学科一样，它需要内部团队和第三方之间的积极协作。\n\
  \n如果攻击者获得了物理访问，保护数据或系统组件就很困难，因此安全计划必须采用适当的物理访问控制方法。这是健全纵深防御战略的一部分，应考虑多个访问控制点。实际上，组织的重点资产和资源周围存在多个边界，每个边界之间的边界都提供了实施控制的点，就像防火墙用于划分网络段一样。图\
  \ 7.1 显示了这些边界。\n\n这将 第 5 章，“身份和访问管理”，中介绍的逻辑访问控制概念扩展到信息系统之外，进入现实世界。用户在获得系统访问权限之前必须经过授权和身份验证，物理访问控制也应类似地限制未经授权的用户获得对设施或系统接口（如工作站）的物理访问。\n\
  \n![图 7.1 安全边界](img/c07f001.png)\n\n**图 7.1 安全边界**\n\n物理控制可以并且应该从多种控制类别中选择，例如预防性、威慑性、检测性、补偿性、恢复性、指导性和纠正性。它们还应结合物理（屏障、围栏）、技术（门禁读卡器）和管理控制（政策和程序）来实现。最有效的物理访问控制计划应采用分层模型来考虑设施，在外部世界与存放或处理高价值资产的房间或办公室之间设置多层和检查点。与所有控制措施一样，每个层级的物理访问控制的选择应以控制成本和受保护资产的价值为指导。\n\
  \n设计全面的物理安全战略的一种方法是通过环境设计预防犯罪 *通过环境设计预防犯罪* (CPTED)，它根据设施的风险需求指导设施的物理和环境设计。例如，具有受限或关键区域的设施应建造成使其与公众和日常员工交通隔离开来——服务器机房或其他重要设施不应放置在经常有人使用的员工休息室旁边。CPTED\
  \ 的其他原则包括以下内容：\n\n*   景观设计可用于提供物理安全，而无需将设施设计成堡垒。水景、灌木和树木都可用于限制访问，而无需建造墙壁或其他屏障。\n\
  *   照明在阻止非预期行为方面发挥着重要作用。光线充足的空间对罪犯吸引力较低，因为被抓获的可能性增加。\n*   关于窗户的放置位置和所用材料的决策应考虑设施的安全需求。例如，将窗户正好放在门旁边可能会导致窗户被打破并从内部打开门，并且对于高安全应用，窗户可能需要额外的加固，如金属屏或网。\n\
  \n### 周界安全控制\n\n\n\n# 周界安全控制\n\n周界安全控制旨在在组织无法控制的区域（如公共道路或共享办公楼的大堂）与受保护的办公室、工作区或设备室之间实施访问限制。没有两个组织的设施布局完全相同。如果组织拥有自己的园区，公共区域可能位于围栏等安全周界之外；或者在共享建筑中可能存在公共大堂空间。由于这些区域不在组织的直接控制之下，可用于控制风险的选项较少。\n\
  \n## 公共区域\n\n对于通往设施的公共通道，如道路或人行道，可能部署旨在减速、引导或阻碍交通的屏障，通常需要与房东或分区/规划委员会等机构协调。共享公共区域如停车场结构可能需要与设施管理人员协调，以实施员工出入的控制措施，如门禁读卡器。\n\
  \n监控公共区域通常很容易实现，因为在公共区域使用监控工具的限制较少。需要清晰的视线和充足的照明，并且可能需要能够覆盖大面积的摄像机，例如广角或云台变焦（PTZ）。\n\
  \n在停车场结构等公共区域，可能需要考虑人员安全控制措施如防风暴避难所，公共区域也可能是工作场所暴力预防程序的一部分。除了为组织资产安全进行监控外，观察公共区域的摄像机也可能需要被监控以寻找其他刑事活动的证据。此外，公共区域中存在电力、供水和污水连接等公用设施，可能需要监控或加固以防止篡改，例如上锁的公用设施笼或对公用设施接驳点的专用摄像机覆盖。\n\
  \n## 场址出入口\n\n出入口是人员、车辆和资产进出设施的地点。这些包括装卸码头、邮件设施以及建筑入口如大堂。这些是物理访问控制的关键实施点，包括以下内容：\n\
  \n* **接待或警卫人员**：这些人员将实施访问控制，如身份验证、访客登记以及进出设施的物资检查。人员和资产的流动还应额外记录，以便追溯谁、何物、何时、为何进入或离开设施。\n\
  * **物理访问控制**：这些包括人员使用的旋转门、闸门、门和防尾随间，以及车辆交通使用的防撞柱、三角屏障和减速带。还可以使用管理控制措施，如访客检查和陪同程序，或将进入设施的新\
  \ IT 资产的交付与采购订单进行核对。\n* **传感器**：这些可以检测温度或红外光、运动或压力以识别人员的存在或移动。通常它们会连接到报警或监控控制台，并用于检测会触发响应的非预期活动，如警卫调查或呼叫执法人员。用于检测入侵的传感器是一种物理入侵检测系统。\n\
  * **摄像机**：由于其用途广泛，摄像机值得特别讨论。摄像机的存在可以威慑恶意活动，如果监控摄像机画面，它们可以成为关键的侦测控制措施。警卫通常用于监控摄像机画面，但许多摄像机包含\
  \ AI 驱动的目标检测，能够识别人员、车辆甚至动物。\n* **警卫**：它们与摄像机在能够执行的控制类别功能范围方面相似。人类警卫可以威慑、阻止、检测、纠正恶意行为并协助恢复。\n\
  \n## 外部设施\n\n外部设施可能在组织的直接控制之下，但由于存在不属于组织的设备，通常需要共享控制。例如，备用发电机可能被围栏和大门安全封闭，但第三方人员必须能够进入进行维护。\n\
  \n类似情况也存在于商业电力、供水、污水和电信接入等公用设施，组织控制访问和物理安全，但第三方需要能够访问。\n\n这些外部设施的控制措施主要侧重于控制物理访问以防止篡改。由于存在高度带电的电气设备和汽油等危险化学品等危险因素，还需要考虑生命、健康和安全控制措施。\n\
  \n包括手套、灭火设备和紧急切断工具在内的安全设备是明智之举，并可能根据当地法律要求配备。\n\n景观设计可以成为组织物理安全计划的一部分，也是提升设施美观的一种方式。梯田花园或树木等景观特征可以作为阻碍人类或车辆交通的屏障，而清除设施周边枯叶或树枝等景观维护是至关重要的防火控制措施。确保景观设计不会妨碍监控能力也是一个重要问题，例如修剪遮挡摄像机视线的树木或灌木。\n\
  \n# 内部安全控制\n\n内部安全控制的 defining 特征是组织能够施加的控制程度，因为相关区域在组织的直接控制之下。这些区域的控制措施旨在专门保护正在使用的数据和系统，但必须记住大多数设施需要以人的生命和安全为设计考量。\n\
  \n## 运营设施\n\n运营设施包括那些通常由人员定期占据的设施，它们构成了组织物理安全控制的大部分。由于设施内有人员存在，生命、健康和安全控制措施如灭火设备至关重要，而维持温度或湿度等环境控制对于人员生命和设备保护都至关重要。\n\
  \n根据工作类型以及所使用信息价值或敏感性的不同，可能需要额外的控制措施，如安全建筑材料和入侵检测传感器。在这些区域需要考虑的控制措施包括以下内容：\n\n*\
  \ **火灾探测与抑制**：虽然主要为人员安全设计，但火灾也可能损坏贵重设备。火灾和烟雾探测器以及相应的抑制方法如喷淋系统、气体灭火和便携式灭火器可以帮助最大程度减少火灾影响。\n\
  * **访问控制**：在设施内部，可能存在休息室和会议室等共享或公共区域，以及个人或团队办公室等进行更敏感工作的区域。应实施物理访问控制以根据用户授权对设施区域进行分隔，使用门禁读卡器或锁等物理设备控制访问。\n\
  * **政策和程序**：在运营设施工作的员工应接受培训并预期遵守政策和安全程序，如清洁桌面和屏幕清理。这包括疏散和就地避难程序，可能需要与安全部门以外的团队协调，包括人力资源或设施管理。\n\
  * **照明和监控**：照明应足以支持人员定期工作的设施的安全人员占用，并足以在无人区域实现摄像机监控。应实施摄像机覆盖或例行检查，如警卫巡逻设施，以确保及时发现问题或潜在事件。\n\
  \n\n\n# 建筑材料\n虽然通常超出了 CISSP 背景的范围，但足以支持安全要求的建筑材料至关重要。例如，为了实施对高敏感信息处理充分的物理访问控制，可能需要真正的从地板到天花板的墙壁——许多办公楼都有吊顶，且办公室之间的墙壁并未延伸到吊顶上方。门窗的适当材料也应考虑，既要兼顾安全，也要兼顾人的舒适度——用户看不到阳光的碉堡式设施不利于人的幸福，但对于某些类型的工作可能是必需的。\n\
  \n在运营设施内，存在特殊用途的房间，如用于媒体存储、重要布线、电信或公用事业接入的储藏室或机柜。这些需要额外的安全控制，通常表现为由于所含资产的敏感性而加强访问控制，以及在需要第三方维护时执行访客程序。如果房间内包含潜在危险设备，如高压布线，则可能还需要特殊防护设备，如手套或额外的消防抑制措施。\n\
  \n## 高安全设施\n在运营设施内，可能存在因所含资产的价值或敏感性而被指定为高安全的特定区域。其中包括证据存储室、安全隔离信息设施（SCIFs）以及服务器室或数据中心。SCIF\
  \ 一词最常与高度敏感的美国政府职能（如军事或国家安全）相关，尽管所描述的概念涵盖任何高度安全的数据处理设施。\n\n这些高安全设施需要额外的安全控制类型，其中一些可能对用户负担较重，例如对进出设施的行李进行侵入性搜查、多层物理访问控制并配备多因素认证，或限制个人设备如智能手机的使用。这些控制措施还将导致成本增加，例如专门建造用于阻挡电磁场（EMF）的墙壁，即法拉第笼，这在这些区域存储和处理的高价值或敏感资产面前是合适的。\n\
  \n数据中心是具有独特安全考虑的高安全设施的特殊类别。数据中心的设计和维护需要专门的技能组合，在该领域拥有特定专业知识的安全从业人员很常见。这些设施需要高水平的安全保障，通常涉及比普通办公设施大得多的安全预算。它们通常也需要更少的人员进入设施，因此实施物理访问控制可能更容易。\n\
  \n设计标准存在于数据中心维护设备和确保可用性所需的环境控制，例如数据中心的 ASHRAE 热力指南（`tc0909.ashraetcs.org/documents/ASHRAE_TC0909_Power_White_Paper_22_June_2016_REVISED.pdf`），以及\
  \ Uptime Institute 的数据中心设备可用性分级评定（`uptimeinstitute.com/tiers`）。\n\n# 应对人员安全与保障问题\n\
  人类健康和安全始终是任何安全计划最重要的考虑因素——选择安全控制措施应尊重使用组织系统和数据的人员的生命、健康和安全。许多人员活动都包括对人员本身以及组织资产（如系统和数据）安全的保障要求。\n\
  \n## 差旅\n人员可能因工作需要出差，或在非工作相关旅行中携带包含组织数据的资产，如智能手机和平板电脑。出差时，人员可能需要组织提供的特殊服务，例如额外保险、医疗保障以及组织定义的应急程序。在存在社会动荡的地区，可能需要额外的物理或个人安全服务，如警卫或安全运输，以及翻译或当地向导等额外服务。\n\
  \n出差人员应接受额外的安全培训，了解包含组织数据的设备的安全实践。这包括组织拥有的设备以及在存在自带设备（BYOD）计划时个人的设备。保护这些数据可能包括对所有静态数据进行加密、提供安全的网络连接如\
  \ VPN，以及额外的控制措施，如发放专用设备供旅行期间使用，然后在发放给另一名出差用户之前进行擦除和重新成像。人员还应接受物理安全措施的培训，例如在离开办公室前确保在办公外使用的笔记本电脑的安全。\n\
  \n## 安全培训与意识\n有效的安全需要知识和技能，因此需要对人员进行培训，既包括基本安全技能，也包括组织特定的政策和程序。尽管培训和意识通常一起使用，但它们存在细微差别。人员应根据履行其工作职能所需的技能获得相应的知识，可采用以下所述的一种或多种方法：\n\
  \n* **Awareness**是非正式的、面向广泛的且是可选的。其目标是通过海报、公司内联网网站上的通知或电子邮件通知等手段，为普通受众提供或强化基本信息。细节程度为基础，针对所有用户易于理解，并旨在影响行为。\n\
  \n* **Training**侧重于培养特定技能集的熟练程度，培训内容会根据每个用户的工作职能或角色而有所不同。其旨在传授履行工作职能所需的特定知识，例如系统管理员仅对某些任务使用特权账户以最大程度降低钓鱼风险。培训由权威来源提供，形式多样，包括计算机化培训和讲师指导培训。通常会跟踪完成情况，以确保关键人员已完成必要的培训课程并获得所需知识。\n\
  \n* **Education**是最正式的，侧重于解释理论及其应用。它通常以学术课程、继续教育或 CISSP 等认证的形式出现。它展示了个人深层次的知识水平，适用于组织中特定角色，如领导和管理信息安全计划。\n\
  \n意识、培训和教育可以通过多种格式提供，但无论格式如何，其有效性始终应进行衡量。这对于一般意识而言可能很困难，但对于培训和教育则相对容易，因为可以采用测试或评分作业作为衡量指标。意识、培训和教育材料的內容也必须保持最新，以确保员工能够应对快速演变的安全威胁。\n\
  \n## 应急管理\n应急管理和危机管理是经常用来描述在紧急情况下管理人员安全、通信以及组织流程（如 BCDR）方面的术语。安全从业人员可能不直接负责管理应急响应流程，但确保关键安全控制要求得到理解、规划并在应急管理程序中传达至关重要。这些包括以下内容：\n\
  \n\n\n### 与响应者协调\n医疗、消防或执法等第一响应人员可以支持组织对某些紧急情况的响应。一些组织，如机场或大型数据中心园区，可能会与这些响应人员协调应急演练或演习，以确保所有相关利益相关者都接受培训，并能够识别所涉及不同组织之间协调方面的弱点或问题。\n\
  \n### 通讯\n在危机期间，正常的通信渠道如电子邮件或公司内联网可能无法使用，因此应急通信计划需要考虑向所需利益相关者传达关键信息的替代方式。这包括 BC\
  \ 或 DR 计划的细节，如替代工作安排，以及关键的健康和安全通知，如就地避难命令。\n\n### BCDR 计划执行\n紧急情况通常需要激活 BCDR 计划和应急程序。危机通信必须包含简单、易于遵循的说明，旨在消除混淆和歧义。安全从业人员可能不直接参与创建或传递这些信息，但作为该过程中的关键利益相关者，他们必须确保重要的安全信息得到有效传达。\n\
  \n### 胁迫\n胁迫描述的是一个人被迫违背其意愿做某事的情况。勒索和被扣为人质是极端的例子。虽然某些人员如高级管理人员更可能成为目标，但任何组织成员都可能处于胁迫之下，被迫违背自己的意愿或组织的政策行事，从而危及个人安全。\n\
  \n用于检测胁迫的安全控制应侧重于保护个人的健康和安全——如果攻击者知道受害者已求助，他们可能会采取行动伤害该个人。通过在电子锁上输入特殊代码或与同事使用暗语等方式进行的微妙胁迫指示，可以在不增加个人所面临危险的情况下实现胁迫的检测。\n\
  \n胁迫暗语或短语不应被外人立即识别。该短语可能听起来很普通，但不是个人在与同事的正常对话中可能说的话，例如，“顺便说一下，我姑姑西尔维娅问候你！”可能需要定期轮换这些代码，并对特别脆弱的员工，如高级管理人员或前往高风险地区出差的员工，进行胁迫代码使用和程序的培训。\n\
  \n## 摘要\n安全从业人员在安全运营方面承担着多项责任。运行 SOC 只是其中一项职能，在该职能中会监控来自 SIEM、IDS 和 EDR 等各种工具的数据，并启动事件响应。其他职能需要在不同组织利益相关者和外部各方之间进行协调与协作，例如支持数字取证调查、处理证据保管链，或与人力资源部门协调工作轮换和强制休假安排。与安全的所有方面一样，这些\
  \ SecOps 职能必须设计为在安全控制的成本与其带来的收益之间取得平衡，以确保组织的安保计划和战略与组织目标保持一致。在设计设施和安全控制时，还必须考虑物理安全以及人员的生命、健康和安全，并需要与相关团队密切协调。\n"
- "# 第 8 域\n## 软件开发安全\n\n## 信息安全讨论\n信息安全讨论必须包括为这些信息系统提供支持的软件的安全性。保护软件的范围延伸到其开发环境，涵盖技术和流程两方面、诸如操作系统等基础软件组件，以及我们用于处理数据的应用程序，无论是定制构建、现成购买还是从开源存储库中选取。云计算也引入了使用和消费软件的新方式，尤其是软件即服务（SaaS），这将保护软件的许多责任从消费者转移到云服务提供商。\n\
  \n软件既可以是攻击的目标，也可以是攻击的载体，而软件环境的复杂性使其特别难以保护。计算系统需要由多个提供商交付的多种类型的软件，从为硬件提供动力的固件到操作系统或容器软件，再到实际的应用程序代码本身。这些组件的创建涉及多个开发人员，每个实体都必须实践软件开发安全。用户或组织可能负责在软件部署后对其进行安全配置和使用，尽管\
  \ *移动代码* ——代码在每次应用程序运行时通常通过网络浏览器动态交付 —— 带来了独特的挑战，因为代码无法提前验证。\n\n本章提供了软件开发的广泛概述，从用于管理软件开发过程的方法论开始，以及可在开发过程各阶段使用的各种技术中实施的安全控制。还讨论了评估不同软件类型安全性的方法，因为安全从业人员在基于风险的决策中发挥着关键作用，以决定在特定环境中允许或拒绝使用软件。\n\
  \n## 理解并在软件开发生命周期（SDLC）中集成安全\n软件是为响应用户群的需求而创建的，该用户群寻求实现特定的信息处理目标，例如希望高效搜索各种记录中包含的数据，而不是逐条阅读每条记录。这一创建过程称为\
  \ *开发*，通常遵循迭代生命周期；随着用户需求的变化，软件也必须更新以满足这些新需求。这种重复或迭代的特性使得该过程通常被称为 *软件开发生命周期*（SDLC）。\n\
  \n与所有生命周期一样，SDLC 被分解为基于其所需输入和产生的输出而逻辑排序的阶段。其中一些是显而易见的；例如，开发人员必须在需求阶段了解用户需求，然后再进入开发阶段，在该阶段创建满足这些需求的软件。其他则不太明显，例如在开始开发之前执行设计阶段活动（如界面\
  \ mockup）的需求。这就产生了不同的方法，例如瀑布模型，它是僵化的，要求在进入下一阶段之前完成某一阶段的所有活动。其他方法更灵活，例如原型制作；对完成的原型的评审和反馈用于创建新的改进设计。\n\
  \n无论使用何种 SDLC 方法，安全活动都必须贯穿每个阶段集成，以有效实施软件安全。认证信息系统安全专业人员（CISSP）可能不直接负责软件开发组织，但向开发人员提供这些要求的明确输入和指导至关重要。这意味着在开发开始前识别系统的安全需求，并提供足够的资源来支持为满足这些需求而实施的安全功能或控制的设计、开发和测试。还需要注意的是，系统生命周期（SLC）在其开发（SDLC）完成后涵盖信息系统的额外阶段。这包括运营和维护以及退役和处置，在此期间必须解决关键安全控制，如漏洞管理和媒体清理。\n\
  \n### 开发方法论\n\n\n\n组织的开发方法选择将由诸多因素指导，例如可用时间、对软件中错误或漏洞的容忍度以及项目的复杂性。同一组织中也可能使用多种方法，因为不同团队会有不同的需求。总的来说，所有方法都包含相似的基础阶段，尽管它们在每个阶段的实际执行上有所不同。\n\
  \n## 软件开发生命周期阶段\n\n将 SDLC 活动视为孤立过程的模型正被组织工程流程的更整体化观点所扩展，例如 ISO/IEC/IEEE 15288 中定义的内容，“系统和软件工程——系统生命周期过程”。描述\
  \ SDLC 中安全性的美国国家标准与技术研究院特别出版物（NIST SP），SP 800-64，“系统开发生命周期中的安全考虑”，已被撤回并由 SP 800-160\
  \ “系统安全工程” 取代，后者将安全考虑与 ISO 15288 中确定的 SLC 流程保持一致。\n\n这并不是说 SDLC 模型或阶段不重要；相反，这反映了需要将安全视为组织范围内的整体视角来解决，而不是作为独立职能。它还为组织提供了更大的灵活性，以最佳方式实施流程（包括安全），以适应软件开发不断变化的本质。例如，在平台即服务（PaaS）环境中对安全控制的测试和验证可能不是单个系统开发工作的一部分，而是组织更大范围的云安全工作的一部分。这是一种共享控制，所有开发团队都可以使用，而执行测试的责任由云架构团队承担。\n\
  \n有许多 SDLC 模型可用，每个阶段的名称不同，但它们大致按逻辑顺序执行相同的步骤。包括以下内容：\n\n* **启动：** 系统的业务需求和理由被表达，需求被记录，并分配资源。\n\
  * **开发：** 进行活动以设计满足需求所需的系统和底层架构；然后通过开发定制代码、购买或集成外部代码，或以其他方式构建系统来创建系统。\n* **部署和交付：**\
  \ 系统被置于运行环境中并准备好使用，其中将包括测试以确保系统适合用途并满足需求。\n* **运营和维护：** 大多数运营和维护活动超出了开发工作的范围，但随着用户需求的演变，SDLC\
  \ 可以迭代，因此像变更管理这样的关键流程可能会启动另一轮开发活动。\n* **处置：** 本阶段的活动几乎完全属于 SLC 的管辖范围，但可能需要一些开发来执行归档或将数据迁移到替代系统等活动。\n\
  \n## 瀑布模型\n\n瀑布方法是最古老的方法之一，由于其缺乏灵活性以及难以满足现代信息系统的复杂需求，已在许多组织中失宠。典型的瀑布开发项目的阶段包括需求、设计、实现、测试、部署和维护，如\
  \ 图 8.1 所示。\n\n![图 8.1 瀑布模型](img/c08f001.png)\n\n**图 8.1 瀑布模型**\n\n就像自然界的瀑布一样，该方法遵循一系列顺序阶段，要求所有任务完成后项目才能进入下一阶段。瀑布方法并非设计为迭代的，这在需求发生变化时会带来困难。要进入设计阶段，所有需求必须收集、记录并达成一致；一旦项目进入设计阶段，就无法纳入新需求。这种严谨性可以成为安全优势，因为瀑布方法强制执行严格的控制流程，如需求收集和测试。如果安全在开发项目中得到适当集成，这将导致安全需求得到充分记录和理解，以及对最终系统进行稳健测试。然而，如果系统不符合用户需求，安全优势就无关紧要。\n\
  \n瀑布模型的僵化使其适用于在开发开始前即可知晓所有需求且开发开始后无需更改的项目。在大型机计算时代，功能有限且硬件昂贵，这是有道理的。然而，软件和虚拟化硬件的可塑性意味着可以采用更灵活的方法来实现快速灵活的软件部署。快速演变的安全需求可能需要对系统功能进行重大更改，这一模型对此尤其服务不足。\n\
  \n## 敏捷\n\n认识到像瀑布这样僵化的开发模型无法很好地适应现代软件开发需求，一个新的高层模型于 2001 年初由一个名为敏捷联盟的开发者团体提出。该团体由具有不同开发背景的成员组成，来自极限编程、Scrum\
  \ 和特性驱动开发等方法论，其中许多方法论包含旨在解决瀑布等传统方法论不足之处的演进。敏捷联盟记录了 12 条原则以形成敏捷宣言，可在 `agilemanifesto.org/principles.html`\
  \ 找到。宣言原则旨在更好地构建开发团队并分配资源，目标是提高开发活动的灵活性。例如，其中两条原则如下所述：\n\n* **我们最高优先级是通过早期和持续交付有价值的软件来满足客户。**\
  \ 而不是在项目开始前努力获取完整的需求集，敏捷开发可以识别最高优先级的项目并首先努力交付，然后反复迭代以实现剩余需求的交付。开发的重点是满足需求，而不是盲目遵循流程。\n\
  * **欢迎更改需求，即使在开发后期。敏捷流程利用变化为客户带来竞争优势。** 通过关注客户（用户）价值，敏捷开发努力交付满足用户需求的系统。这显然支持可用的安全目标，但也意味着复杂软件系统可以更好地设计以满足不断变化的保密性和完整性需求，例如更强大的加密或数据验证控制，这些在最初可能未被确定为需求。随着需求随时间变化，例如新的安全需求，软件项目也可以随之演进。\n\
  \n12 条敏捷原则本身并不是可以遵循来开发软件的开发方法论，而是管理软件开发项目的指导理念。正确实施时，它们力求通过更快交付功能软件并提高响应变化的能力来实现价值。软件以基本功能快速发布；然后开发过程迭代以包含额外功能，避免一次性大型发布，而倾向于更小、更频繁的发布。\n\
  \n\n\n每次迭代还将考虑从客户处获得的经验教训（例如，变更的需求）以及开发团队所获得的经验教训。理想情况下，团队应由来自开发和业务背景的跨职能成员组成，并应强调利益相关者之间清晰且频繁的沟通。这种开发元方法要求组织识别所有相关利益相关者，其中必须包括安全团队。所有利益相关者至少应在需求收集和测试期间参与，以确保系统需求得到记录，并进行测试以验证其是否得到满足。需求的变更，包括不断演进的安全需求，得到了敏捷方法学的良好支持，因为它们旨在频繁地重新评估需求并在迭代开发中纳入这些需求。\n\
  \n## 敏捷测试方法\n敏捷高度重视速度和资源的高效利用，这促成了集成测试的使用，以支持功能软件的交付。与瀑布方法不同，瀑布方法中测试是在开发活动完成后进行的单独阶段，敏捷方法学将测试活动更紧密地集成到实际开发活动中。目标是双重的。首先，测试的对象更小、更易管理，因此修复通常更容易。其次，对变化需求做出响应的需求需要强大的测试，以确保新交付的功能不会引入错误、缺陷或漏洞。使用自动化测试工具可以使安全测试更接近开发时间进行，并针对更小的目标。这些支持防止缺陷进入生产环境的目标，同时由于其规模较小，也使测试结果更易于管理。\n\
  在敏捷方法学下保持软件交付速度导致对自动化有强烈关注。这对于功能测试等重复性流程尤其如此，因为自动化流程受人为错误影响较小，因此可靠性更高。安全测试也受益于自动化，因为像软件代码审查和漏洞扫描这样的关键控制可以自动且更频繁地进行。自动化测试是持续集成/持续交付（`CI/CD`）的重要推动因素，本文将在本章后面讨论。\n\
  \n## 敏捷开发方法\n如前所述，敏捷是一套高层次的原则，并在各种开发方法中以不同程度实现。实施敏捷原则的开发方法三个示例包括极限编程、测试驱动开发和 Scrum。\n\
  \n### 极限编程\n有时写作 `XP`，该方法引入了集成团队的使用，包括开发人员、客户和管理人员，以推动高价值软件功能的交付。用户故事被记录下来，以捕捉用户试图实现的目标以及实现这些功能的软件的验收标准，并且故事基于价值进行优先级排序。例如，在一个有\
  \ 500 名用户需要登录并将数据保存到数据库，但只有 10 名用户需要从数据库打印记录的系统中，登录和保存数据的能力将被优先考虑。`XP` 方法和实现的完整细节可在\
  \ `www.extremeprogramming.org` 找到。\n`XP` 利用一种称为结对编程的概念，将开发人员配对。开发人员轮流编写代码并提供建议/输入，目标是通过提供额外的监督和可借鉴的知识来实现更高质量的代码。\n\
  重构代码可能意味着很多事情，但本质上是一种通过删除过时、冗余或不需要的代码来改进软件功能的方法。开发人员过去可能做出了合理的决定，但随着系统和需求的演变，这些决定不再相关。重构可用于确保系统中不包含不必要的垃圾代码或被称为\
  \ cruft 的函数。\n\n### 测试驱动开发 (TDD)\n在教育中，有一个被称为“为考试而教”的概念；课堂教学旨在确保学生能够成功通过考试，就像驾驶培训课程旨在为学生准备驾驶考试一样。`TDD`，顾名思义，是由测试用例的使用驱动的：首先编写测试，然后运行。如果测试失败，则按需编写代码或重构代码以使测试成功；最终目标是确保所有测试通过。牢记最终目标可以帮助开发人员更好地理解他们试图构建的期望功能。`TDD`\
  \ 对于现有系统尤其有效，在这些系统中，修改或更新必须以最小的复杂性实现，例如实施代码级安全控制，如修复缓冲区溢出或注入漏洞。\n\n### Scrum\nScrum\
  \ 项目的基础是一组轻量级的团队成员，不断迭代开发工作以实现整体产品目标。Scrum 引入了许多与敏捷开发项目相关的词汇，例如冲刺和产品待办事项列表。它专注于一个跨职能团队，该团队由三个关键成员组成，一个称为冲刺的时间范围，关键活动围绕其进行，以及几个重要的工件。\n\
  \nScrum 角色和工件包括以下内容：\nScrum master: Scrum Master 在某些方面类似于一名协调员，其职责是消除团队成功的障碍。这些任务包括指导团队成员进行自我组织工作、收集关键利益相关者的意见以及促进团队活动。\n\
  Product owner: 作为客户的声音，产品负责人负责确保开发人员理解其软件旨在满足的目标。产品负责人还拥有产品待办事项列表，所有待完成的工作在其中被分解为工作单元并进行优先级排序，例如新功能和错误修复。\n\
  Development team: 这是一个广泛的团队，包括编写代码的传统开发人员、设计系统基础设施的架构师、数据科学家或分析师，以及对安全至关重要的测试人员和质量保证（QA）人员。所有开发工作都应进行安全测试，因此许多代码级和应用级安全控制将被委托给开发团队成员。\n\
  Backlogs: 在 Scrum 中维护的一个关键工件是待办事项列表。整体产品待办事项列表包含产品负责人已识别的所有需求，以及基于对客户价值的优先级排序。需求可能包括构建所需的努力或复杂性衡量，通常需要跨职能协作来确定这些数字。冲刺待办事项列表是从产品待办事项列表中提取的较小的需求列表，团队估计在分配的时间内可以交付。优先级更高的项目显然会更早交付，尽管如果冲刺中有空闲资源，但不足以解决更高优先级或更复杂的项目时，可能会添加低复杂性/努力/优先级的项目。\n\
  \nScrum 的关键活动和来自工件的关键输入在 图 8.2 中显示，并在以下要点中描述。\nSprint: 冲刺只是项目中需要完成的一组时间盒工作；例如，两周内完成的所有开发工作被视为一个冲刺。虽然\
  \ Scrum 作为一种敏捷方法学拥抱变化，但一旦工作被承诺到冲刺中，尽可能避免变更。变更的需求可以在未来的冲刺中解决。\n\n\n\n## Scrum 流程\n\
  \n### Sprint 规划\n在开始开发冲刺之前，团队会召开冲刺规划会议。根据产品负责人设定的优先级，某些待办事项需求将被选入冲刺，团队就其认为在给定时间内可以完成的工作达成一致。一旦计划确定，应避免更改，因此范围界定和规划是一项关键活动。\n\
  \n### 每日 Scrum\n开发团队应每日会面讨论进展、阻塞问题以及当天活动的计划。根据《敏捷宣言》，这些会议最好面对面进行，通常被称为 *站立会议*。\n\
  \n### 冲刺回顾与复盘\n冲刺结束时有两个关键事件。冲刺回顾确定已完成的工作并包括向客户演示，支持用户与开发者集成的目标。冲刺回顾会议为开发团队提供了一个机会，通过反思近期冲刺中的成功、失败和机会来实现持续改进。\n\
  \n![图 8.2 Scrum 流程图](img/c08f002.png)\n\n**图 8.2 Scrum 流程图**\n\n## DevOps\nDevOps\
  \ 是开发和运维这两个传统上分离的功能领域的整合，目标是更好地支持组织的信息系统资源。开发人员和运维人员传统上各自为政，两个部门之间低效的交接流程意味着系统从开发转移到生产时关键信息会丢失。DevOps\
  \ 团队实施敏捷倡导的做法，例如组建跨职能团队并强调频繁沟通以克服这些挑战。\n\nDevOps 实践包括使用自动化、频繁测试以及强调频繁的软件集成和部署。通过遵循流水线的方式来加速软件交付，*流水线*\
  \ 注重在构建中保证质量。开发人员被分配在特定时间内完成的可管理工作单元（冲刺中包含的需求），自动化测试旨在在代码交付到生产环境之前识别并修复缺陷。\n\nQA\
  \ 是除开发和运维之外 DevOps 团队的第三个成员，负责实施跨职能沟通的许多方面。QA 团队成员通常会参与与测试相关的前期活动，例如定义成功标准，然后在测试失败时向开发人员提供关键反馈。这些测试活动包含在冲刺的工作范围内，因此开发团队必须确保分配足够的时间和资源用于开发、测试以及修复交付期间代码中的任何问题。\n\
  \n如果安全需求已得到妥善记录并且要求 QA 验证系统是否满足这些需求，那么这种 QA 重点可以成为在 SDLC 中强制执行安全性的关键点。自动化安全测试和更快的交付减少了部署新软件时引入的漏洞数量，并在系统发现漏洞时提供更快创建和部署补丁的好处。\n\
  \n虽然更快的软件交付有好处，但开发和部署安全软件不应以牺牲为代价而仅仅更快地添加新功能。对于使用 DevOps 的组织来说，有一个至关重要的治理任务需要考虑：DevOps\
  \ 团队拥有的特权角色和权限。像变更管理评审这样冗长的流程可能会挫败快速软件交付的目标，但它们确实为诸如漏洞扫描和人工评审等安全活动提供了有用的检查点。在必要时必须用自动化测试取代它们，并且还应为无法通过自动化工具完全测试的软件变更定义流程。\n\
  \nDevOps 团队成员很可能拥有特权访问，例如能够在生产环境中进行更改、创建新用户和权限以及访问日志数据。与其他特权访问一样，增加监控可能是合理的，多因素认证（MFA）和对这些员工的额外培训等控制措施也是如此。虽然跨职能团队很有用，但最小权限原则和职责分离原则仍必须实施。DevOps\
  \ 成员需要仅限于其主要角色的权限，而不是访问 DevOps 团队授予的所有能力；例如，开发人员可能能够将代码标记为完成并准备部署，但需要另一位用户在代码部署前验证所有必需的测试是否已执行。在这里，自动化再次发挥关键作用，例如使用自动化代码部署工具，在将代码推送到生产环境之前系统地验证所有测试和其他要求是否已满足。\n\
  \n## DevSecOps\n尽管如果在 SDLC 中正确实施安全，QA 可以在 DevOps 中执行关键的安全相关功能，但你会注意到安全并未得到特别说明。遗留软件开发的敏捷转型也在安全社区中得到体现，DevSecOps\
  \ 的创建就是证明，甚至包括一份宣言和指导原则，记录在 `www.devsecops.org`。DevSecOps 的目标是优先考虑迭代而非完美，今天交付可行的安全解决方案并明天改进，比多年后交付完美的解决方案更受青睐——到那时系统可能已经遭受攻击或利用！\n\
  \nDevSecOps 原则为更好地将安全和合规活动及数据集成到开发流程中提供指导。这些原则展示了在传统 DevOps 之外更好地传达安全的重点，并包括以数据和安全科学取代恐惧、不确定性和怀疑，以及红队和蓝队利用测试而非依赖扫描和理论漏洞，两者都有助于安全从业者提供可操作的知识。与其说理论上的漏洞可能导致组织数据的完全丢失，DevSecOps\
  \ 从业者，例如 CISSP，会执行红队测试以确定漏洞的确切性质。这结合真实的风险数据，为组织的领导者和开发者提供了一条合理且可操作的降低风险路径。\n\nDevSecOps\
  \ 的最终目标，正如其名称所示，是确保安全被构建到组织用于开发和运营其信息系统的流程中。传统的信息安全实践通常是 SDLC 的附加项，并且它们遭受与遗留开发方法论中确定的相同挑战。这种演变也反映在标准文档的演变中，例如\
  \ NIST 文档中从 SDLC 安全向安全工程流程的迁移，尽管值得注意的是，实施 DevSecOps 并没有标准方法。与安全风险缓解控制措施类似，每个组织都可能创建或调整流程以适应其独特的环境。\n\
  \n## 其他方法论\n除了之前讨论过的瀑布模型和敏捷方法家族外，还有其他软件开发方法。虽然不期望 CISSP 熟悉所有可能的方法论，但对流行方法论及其相关安全优势和缺点有基本了解是个好主意。\n\
  \n\n\n# 软件开发生命周期方法论\n\n对于需要比传统瀑布模型稍多灵活性的项目，*修改后的瀑布*可能比较合适。该方法论提供了两种次要选项，以解决传统瀑布方法所要求的严格方法无法服务的项目。首先，可能在当前阶段活动尚未全部完成之前就进入下一阶段；例如，在部分代码仍在开发的同时，测试可以开始于已完成的代码。其次，如果必要，可以退回一个阶段并迭代工作。如果开发人员意识到设计期间做出的架构假设在某些方面存在偏差，项目可以退回一个阶段，更新系统设计以解决缺陷，然后再次进入实现阶段。\n\
  \n传统瀑布方法的另一个演进是 *螺旋* 方法论。螺旋方法论是迭代的；也就是说，它被设计为以重复系列执行，并高度关注风险评估、分析和评估。大型、复杂且昂贵的项目是该模型的常见用途，因为它强调通过反复评估项目风险、成本和收益来随时间控制风险。该过程迭代经过四个阶段：\n\
  1.  确定目标、替代方案和风险\n2.  评估替代方案并解决风险\n3.  开发和测试\n4.  规划下一阶段\n\n其他 SDLC 方法论可在每个阶段内使用，以执行诸如收集需求或安排和执行开发等活动，而迭代的特性意味着不断变化或演进的需求可以轻松解决。该模型成本高昂，并在每个阶段引入大量以重复风险评估形式存在的开销；这种开销对于需求难以确定或需求可能发生变化的长期项目可能是合理的。\n\
  \n一些开发方法论是考虑到迭代而设计的，并假设项目将被重复。*原型* 模型就是一个例子，其中构建并发布系统的简化版本以供反馈和审查。基于反馈进行后续开发轮次，然后发布以供额外审查，如此往复，直到满足利益相关者的需求为止。该方法论适用于新类别或类型的系统，在这些系统中明确的需求可能无法获取，或将尝试新方法时。\n\
  \n与迭代模型不同，*洁净室* 方法论假设缺陷在开发完成后无法修复。它完全专注于缺陷预防。该概念遵循用于精密任务（如芯片制造）的模型，其中引入缺陷可能导致硬件完全无法使用；这种低风险容忍度要求昂贵的预防控制措施，例如设计用于捕获头发或灰尘的服装，以及特殊的空气处理系统。在软件开发中，类似的控制措施可以在牺牲开发敏捷性的情况下部署。终极目标是生产满足特定可靠性水平的软件，有时称为\
  \ *零缺陷*，重点在于健壮的设计和实现，而非测试和补救。洁净室方法论通常与其他开发模型（如瀑布模型）一起实施，并要求重点收集有关缺陷和控制措施的统计数据。这些指标用于证明诸如发布满足定义可靠、无缺陷功能水平的软件等决策。\n\
  \n## 成熟度模型\n\n成熟度模型提供了一种衡量组织在某学科持续改进进展的方式，例如安全管理或软件开发。就像音乐根据音乐家的练习水平进行评级一样，成熟度模型级别详细说明了在执行特定任务的组织中期望的技能和能力，其目标是改进。企业成熟度模型通常被称为\
  \ *能力成熟度模型*，并且通常特定于软件开发等特定组织学科。\n\n这些模型提供了一个基线来衡量组织的当前能力状态，定义期望的目标状态，并提供系统性建议以提高能力。这被称为\
  \ *流程改进*，总体而言，当其流程比混乱更正式、可重复且管理良好时，组织就更成熟。尽管在软件开发的背景下讨论，流程改进和成熟度模型可以应用于将关键 IT 功能作为服务获取的组织，以及其他学科，例如管理安全能力的改进。\n\
  \n### 常见成熟度模型组件\n\n成熟度模型通常以相似的概念构建，关键区别在于模型所针对的流程领域，例如软件开发或系统集成。跨成熟度模型相似的组件包括以下内容：\n\
  *   **域：** 域是模型旨在帮助衡量的流程或业务方面，通常是常见的活动，例如度量和分析。域包括与该域相关的实践描述，例如定义指标收集的来源和频率。\n*\
  \   **级别：** 成熟度模型将每个域中的实践集合组织成一系列递增的级别，通常范围为 1 到 5。级别按显示组织能力不断提高的比例排列，可能描述单个流程领域或成熟度模型所描述的流程整体集合。每个级别还包括审计或评估标准，由组织或外部审计员用来确定组织的当前成熟度级别。\n\
  *   **标准：** 要达到特定成熟度级别，组织必须满足该级别的标准。在某些模型中，特定域与每个级别相关联，例如基本流程定义是低级别标准，而基于指标的流程分析是更高级别标准。逻辑上，组织无法衡量临时或未定义的流程，因此该实践不会在组织成熟基本实践之前引入。在其他模型中，每个域在每个域内有一系列递增的要求，对应于域成熟度的提高，例如在较低成熟度时为临时文档，在较高成熟度时为模板驱动的文档。\n\
  *   **目标：** 目标描述了组织的期望成熟度水平。就像安全控制涉及风险降低的成本效益分析一样，改进流程的选择也必须带来明确的组织效益。虽然流程成熟度的提高降低了失败或管理不善项目的风险，但它也引入了成本和复杂性；不同组织会选择不同的期望成熟度水平。目标可用于执行差距分析并确定优先处理关闭已识别差距所需的活动。在某些情况下，如承包组织，特定的成熟度水平可能是与某些实体（如政府机构）开展业务的要求，而在其他情况下，向客户或业务合作伙伴展示成熟度可提供竞争优势。\n\
  \n成熟度模型、特定域或实践领域以及目标的选择将主要由组织的 objectives 指导。一些模型在特定行业中被广泛采用，或最适用于从事软件开发等特定任务的组织。在其他情况下，成熟度模型已围绕常见的安全实践（如安全数据处理）建立，并正迅速被作为代表客户和用户处理数据的服务提供商的要求而采用。\n\
  \n### 能力成熟度模型\n\n\n\n最早被广泛采用的成熟度模型之一，即能力成熟度模型（CMM），由美国国防部与卡内基梅隆大学的软件工程研究所（SEI）联合开发。它源于对\
  \ 1980 年代蓬勃发展的软件开发领域进行衡量和改进的需求，随着处理能力的提升和成本的降低，计算机系统的普及程度不断提高。由于当时计算机科学尚处于起步阶段，开发项目往往估计不准、控制不力、管理不善，因此\
  \ SEI 正式确定了一套在成功项目中常见的最佳实践。该模型的最初目的是评估政府承包商按时按预算交付项目的能力，但其他开发和业务流程也开始采用成熟度模型的思维方式。\n\
  \n## 能力成熟度模型集成\n认识到 CMM 正在被改编用于新的业务流程，SEI 设计了能力成熟度模型集成（CMMI）。它最初针对开发（CMMI-DEV）、服务（CMMI-SVC）以及产品和服务采购（CMMI-ACQ）设计了专门的应用，并且该框架最近的\
  \ 2.0 版本于 2018 年发布。该模型现由 ISACA 运营的 CMMI Institute 控制（`cmmiinstitute.com/cmmi`），并已得到调整，以应对敏捷开发以及新的业务关注领域，包括开发、服务、供应商管理以及人员（劳动力管理和职业发展），还有一个新兴的\
  \ Cybermaturity 项目，旨在将成熟度模型概念应用于网络安全治理和报告。\n\nCMMI 模型被分解为称为 *流程域* 的域和五个成熟度级别。某些流程域在更高成熟度下包含不断增加的要求，而其他流程域仅适用于特定级别及以上。级别如下：\n\
  1.  **初始：** 流程不可预测且主要具有反应性。这是主要执行临时流程的组织的典型特征。\n2.  **已管理：** 流程针对项目进行表征或记录，通常具有反应性。某些项目可能管理良好且可重复，但这种成功并未在整个组织中得到利用。\n\
  3.  **已定义：** 流程针对组织进行表征且具有前瞻性。3 级的组织拥有在各个项目/工作中共享的文档化流程，并采取主动措施确保项目成功，例如项目风险管理。\n\
  4.  **定量管理：** 流程通过度量进行衡量和控制。这是收集并响应指标的组织。\n5.  **优化：** 组织专注于流程改进。5 级的组织拥有文档化流程，利用经验教训对其进行主动控制，并拥有强大的监督职能来收集指标和管理活动。\n\
  \n## 软件保证成熟度模型\n软件保证成熟度模型（SAMM）由开放式 Web 应用程序安全项目（OWASP）维护，位于 `owaspsamm.org`。SAMM\
  \ 是一个用于实施软件安全计划的规范性框架，重点是将安全活动集成到现有的 SDLC 中。它为评估当前状态、确定目标状态以及在 SDLC 范围内实施必要的改进提供了行动计划，包括对流程、人员、知识和工具的更新。\n\
  \n与其它模型一样，存在域，并细分为安全实践，如 图 8.3 所示。\n\n![图 8.3 SAMM 域和实践](img/c08f003.png)\n\n**图\
  \ 8.3 SAMM 域和实践**\n\n在每组实践中，都有活动流，通常代表不同的职责。例如，在安全测试流 A 中，需要自动化安全测试工具，可由 QA 职能管理，而在流\
  \ B 中，需要对高风险组件进行手动安全测试。这种测试是一种专门职能，需要应用安全或渗透测试经验。每个安全实践也用三个成熟度级别表示。例如，安全测试的成熟度级别如下：\n\
  1.  执行安全测试（手动和基于工具）以发现安全缺陷。\n2.  通过自动化并辅以定期的手动安全渗透测试，使开发过程中的安全测试更完整、更高效。\n3.  将安全测试嵌入开发和部署流程中。\n\
  \n## 构建安全成熟度模型\n正如其名称所示，构建安全成熟度模型（BSIMM）是一个成熟度模型，重点是确定安全软件创建能力的当前状态，识别改进机会，并优先考虑改进安全软件开发的努力。有关更多信息和\
  \ BSIMM 文档，可在 `www.bsimm.com` 找到。它试图通过访谈实际从事软件安全工作的专业人员来确定哪些实践实际上有效，从而为软件安全实践带来严谨性。这些软件安全举措（SSIs）是根据访谈中观察到的频率排序的。观察频率更高的\
  \ SSI 被认为是最广泛采用的实践，而观察频率较低的实践可能是新概念，或仅由成熟度非常高的组织执行。\n\nBSIMM 的成功实施依赖于一个专门从事软件安全的内部职能，即\
  \ *软件安全组*（SSG）。BSIMM 在四个实践域中列出了 121 项活动：治理、情报、软件安全开发生命周期（SSDL）和部署。SSG 负责或对实施和完善组织选定的\
  \ SSI 负责。与所有成熟度模型一样，并非每个组织都必须处于同一水平，但 BSIMM 是组织衡量和改进软件安全性的经验指导的有用来源。\n\n## CMMC\n\
  一个最近开发的对网络安全领域很重要的成熟度模型是网络安全成熟度模型认证（CMMC），由美国国防部发布。尽管 CMMC 广泛涉及网络安全，包括但不限于软件开发安全，但它专为代表政府客户处理敏感信息（称为\
  \ *受控非密信息*（CUI））的承包商设计。它可免费获取，并包含关于评估和提升网络安全和信息安全能力的广泛适用指导。CMMC 可以在组织层面或在特定项目或部门（如适用）实施和评估。模型和支持文档可在\
  \ `www.acq.osd.mil/cmmc/draft.html` 找到。\n\nCMMC 中的成熟度级别与 CMMI 相似，从 1 级、已执行（与基本网络卫生相关的活动已在组织中实施并运行）到\
  \ 5 级、优化（已建立先进的、持续优化的和主动的网络安全计划）。这些成熟度级别评估组织对流程、能力和实践的实施情况，并按域组织，这些域对于熟悉 NIST SP\
  \ 800-53 控制族的从业人员来说会很熟悉：\n*   访问控制（AC）\n*   资产管理（AM）\n*   审计与问责（AU）\n*   意识与培训（AT）\n\
  *   配置管理（CM）\n*   识别与身份验证（IA）\n*   事件响应（IR）\n*   维护（MA）\n*   媒体保护（MP）\n*   人员安全（PS）\n\
  *   物理保护（PE）\n*   恢复（RE）\n*   风险管理（RM）\n*   安全评估（CA）\n*   态势感知（SA）\n\n\n\n\n* 系统和通信保护\
  \ (SC)\n* 系统和信息完整性 (SI)\n\n## 成熟度模型概述\n\n成熟度模型有助于确定组织的实践所达到的能力和有效性水平，同时规划改进方向。它们对于软件开发和安全等复杂活动很有用，在这些活动中需要一致、可重复的实践，并且可以衡量增量改进以证明管理、运营或安全开销相关的成本是合理的。\n\
  \n讨论的每个模型都附带某种形式的评估，无论是像 BSIMM 这样的非正式内部评估指南，还是像 CMMC 这样的需要独立第三方评估和认证的正式外部指南。虽然对衡量很有用，但成熟度模型并不能保证任何特定工作的成功，因为它们无法解决软件开发项目可能面临的所有风险。\n\
  \n## 运营与维护\n\n运营和维护，通常写作 O&M，是系统处于实时使用并运行在所谓的 *生产环境* 中的阶段，意味着它们正被终端用户积极使用。测试、验证和确认活动标志着开发的结束，而向\
  \ O&M 的过渡通常被称为 *推广* 或 *部署*。为了让软件保持运行并安全，在此阶段必须执行许多关键任务。O&M 期间并非所有任务都是安全从业人员的责任，因为系统运营通常不在安全团队的管辖范围内。其中一些任务，如持续的安全测试或漏洞评估，直接分配给安全团队；所有运营和安全任务都支持系统安全目标，特别是可用性目标。这些问题包括以下内容：\n\
  \n* **连续性：** 面对不利条件时系统的弹性，以及在中断发生时恢复的能力至关重要。业务连续性、灾难恢复和网络弹性等活动均在 O&M 阶段进行，例如生成系统备份。\n\
  * **监控和事件响应：** 实时生产系统是大多数安全事件发生的场所，因此组织的大部分监控能力将集中于此环境。当检测到事件时，调查和恢复过程通常侧重于补救问题并将生产恢复正常。帮助台响应和数字取证等流程对于确保安全事件得到妥善调查至关重要。\n\
  * **漏洞和补丁管理：** 扫描系统中的缺陷并进行补救是一项重要且持续的安全任务。某些缺陷可能会导致 SDLC 的迭代，特别是对于定制软件，尽管第三方软件的常规补丁部署是这项工作的主体。\n\
  * **访问控制：** 控制对开发和测试环境的访问很重要，但大多数系统的用户通常远多于开发人员，且敏感数据通常不用于测试或开发。授予、审查和撤销访问的流程将主要集中在运营系统上。\n\
  * **变更和配置管理：** 系统级变更和配置管理在 第 7 章，“安全运营，” 中有讨论，而源代码变更的具体细节在本章中另行讨论。值得注意的是，运营系统很可能置于配置管理之下，并有明确的流程用于请求、审查和实施变更以保持安全基线。\n\
  \n在系统的生命周期中，还会执行各种维护任务以保持其运行并保护安全。这些包括识别保持系统运行所需的升级或更新，例如需要系统升级或更换故障硬件的生命周期结束的操作系统。维护可能会对系统可用性产生负面影响，主动安排对于保持正常运行时间至关重要。维护窗口会提前很长时间公布，并通知用户系统将不可用；未宣布的紧急维护通常需要紧急情况作为理由。测试必须包含在维护任务中，特别是旨在识别系统变更导致的不利后果或现有功能丧失的回归测试。\n\
  \n## 变更管理\n\n管理许多系统安全的一个关键方面是将其保持在已知的安全状态，这是配置管理的职能。然而，变更是必要的，因此也需要变更可以被请求、审查、实施和测试的流程，这就是变更管理的目标。这些结构化流程使系统能够灵活适应不断变化的需求或情况，同时充分解决安全问题，防止变更对系统安全态势产生不利影响。\n\
  \n重要的是要记住，变更管理通常不在安全部门的管辖范围内，但安全从业人员确实需要积极参与该流程。变更必须审查潜在的安全影响，测试计划必须记录以确保安全不受不利影响，并且如果变更执行不佳，可能会触发安全流程。例如，失败的变更可能会在变更能够被撤销之前引发业务连续性流程。\n\
  \n变更管理流程可以在多个不同层面上实施，对应不同的严格程度和流程集。在组织层面，例如操作系统 (OS) 替换等变更需要大量的预算和资源规划。在源代码层面，开发人员在将代码检入存储库之前可能会遵循安全的编码标准，例如注释代码和执行同行评审，该存储库充当组织的源代码配置和变更管理系统。代码保持在已知良好的状态，并且经批准的更改方法（如拉取请求和提交）必须遵循规则，以确保未经批准的开发人员更改不会导致源代码完整性丧失。在某个阶段，代码也可能达到完成状态，此后不允许进行任何更改，这一过程被称为\
  \ *冻结*。这对于执行测试、验证和确认练习很有用，因为测试正在进行更改的代码可能会导致误报或无意义的发现。\n\n### 变更管理阶段与安全实践\n\n大多数组织实施正式的变更管理机构，常见的名称包括变更“某物”委员会的某种变体，如变更管理、变更控制或变更咨询委员会\
  \ (CMB、CCB 或 CAB)。CMB 的组成通常包括来自 IT 和安全团队的永久核心成员，以及对于对这些部门产生影响或需要其输入的变更而加入的临时成员，如财务或人力资源。例如，重大的操作系统转变需要大量投资，因此财务和会计部门会参与其中，而人力资源部门可以提供有关变更对培训和生产力影响的详细信息。\n\
  \nCMB 负责推动变更管理流程，该流程与该组的名称一样，在不同组织中各不相同。这里概述了高级变更管理流程，以及在每个阶段推荐的相应安全实践：\n\n\n\n\n\
  # 在软件开发生态系统中识别和应用安全控制\n\n## 变更管理流程\n\n### 请求\n许多变更流程涉及提交工单或其他正式的变更请求；工单系统的优势在于能够在一个位置捕获与变更相关的所有细节。请求必须捕获变更的完整细节以及预期的资源需求和影响。\n\
  \n### 分析和审批\n一旦记录，变更将由变更管理委员会（CMB）审查，以识别变更的所有预期需求和影响。这遵循一套文件化的标准，其中应包括审查任何安全影响，例如引入新的风险或对现有安全控制的不利影响。例如，将所有用户从本地迁移到远程访问的变更将对组织实施的几乎所有安全控制产生影响。在变更管理委员会能够批准变更之前，了解这些影响并确保有足够的资源来解决它们至关重要。\n\
  \n### 变更开发\n一旦变更获得批准，负责方必须制定实际执行变更的计划，例如安排时间执行所需的 IT 任务、收集必要的资源，以及采购或开发变更后的系统组件。这些行动必须遵循已记录并获批准的变更请求。\n\
  \n### 实施\n在制定计划后，变更可以实施。与开发阶段一样，必须遵循所有已批准的变更程序。如果变更不成功，则需要回退或回滚程序，并且创建此类计划和程序通常是变更批准的要求。\n\
  \n### 测试\n新变更的系统必须经过测试，以确保变更按预期工作、现有功能未被破坏，并且安全控制仍按预期运行。根据组织和变更的规模，此类测试可能包括认证和认可等高度正式的活动。\n\
  \n### 事后分析\n通常需要进行一些变更后活动。必须完成已执行变更的文档记录，因为变更后的系统是新的已知状态，将由配置管理维护。新实施的功能可能需要用户培训，任何经验教训都应记录下来以实现持续流程改进。此阶段也可能被称为\
  \ *行动后* 报告、*经验教训* 或 *回顾*，但识别改进机会的目标是相同的。\n\n### 紧急变更管理\n延迟是变更管理流程的隐性部分，主要是因为需要时间收集所需的信息和资源。在某些情况下，这种延迟是不可接受的，例如需要变更来解决重大中断或新发现的关键漏洞。在这些情况下，等待变更在每周变更管理委员会会议上被记录和审查的风险超过了立即采取行动的风险，因此需要紧急变更管理流程。标准流程和特定紧急变更流程的细节在\
  \ 第 7 章，“安全运营。” 中讨论。\n\n与正常变更不同，紧急变更是在未经批准或仅在有限批准的情况下实施的。与要求整个变更管理委员会审查不同，单个成员可以授予批准，或\
  \ IT 人员可以被授权在未经任何事先批准的情况下实施变更。测试和验证流程同样得到简化。用于关闭关键系统漏洞的补丁可能先部署到单个系统，并在向所有系统推广之前进行有限或临时测试。在这种情况下，由于有缺陷的补丁导致运营停机的风险，与漏洞被利用的风险相比是可以接受的。\n\
  \n紧急变更并不意味着完全缺乏流程或程序，而是一种为速度而设计的修改。仍需要文档记录，许多组织在变更部署后进行追溯性变更审查和批准，以确保任何非预期后果或不可预见的影响得到理解、记录并得到适当处理。需要事后文档来支持此审查，测试应包括回归测试或安全评估，如漏洞扫描和渗透测试，具体取决于变更。当处理关键漏洞时，显然优先考虑尽快减轻风险而不是编写完整文档，但在漏洞得到解决后仍期望提供文档。\n\
  \n## 综合产品团队\n\n综合产品团队（IPTs）是由跨学科人员组成的集合，他们共同负责交付产品或流程，类似于在 DevOps、DevSecOps 和敏捷软件开发中看到的组合。其指导概念是，具有不同观点的团队——包括用户、客户、开发人员和承包商，他们都是最终产品或流程的利益相关者——可以取得成功并提高复杂项目（如软件开发）的交付速度。\n\
  \nIPT 的目标是组装或随时提供与项目相关的角色、技能或知识的所有资源，通过组装这些资源，可以消除传统延迟或障碍。这包括了解系统需要满足的安全和合规要求的安全从业人员，他们应在系统开发或采购的尽可能早的阶段被纳入。IPT\
  \ 这一概念起源于美国国防部，用于在复杂项目中整合关键利益相关者。\n\n综合产品和流程开发（IPPD）的目标是将产品和流程设计结合起来，以确保产品，通常是信息系统，具有一套整体需求，用于设计系统和业务流程。这套整体需求应包括数据加密和访问控制等安全需求，并且\
  \ CISSP 可能是负责使用 IPPD 实践进行系统开发的 IPT 的关键成员。\n\nIPPD 依赖于对系统和流程原型的广泛建模和测试，以及 IPT 的使用。这些团队将用户社区的利益相关者和开发人员结合起来，目的是加深对用户对系统的需求以及需要克服的任何技术限制的理解。这可以防止在信息不完整的情况下做出决策，并提供更及时的反馈，目标是在满足系统成本和性能目标的同时减少浪费的开发工作。这些概念与\
  \ DevOps 和敏捷开发方法相关，两者都促进利益相关者群体之间的更紧密协作，以实现更快的开发和团队之间更紧密的集成。\n\n\n\n安全从业人员需要理解软件安全在组织中的关键性，以及开发人员在创建信息系统时所使用的软件和工具所扮演的基础性角色。CISSP\
  \ 不一定需要在编程和软件开发的各个方面都是专家，但对编程有一个总览对于理解软件开发中必须解决的各种风险和相关安全控制措施是很重要的。特别重要的是要理解支撑现代编程语言的概念、它们运行的工具和环境，以及开发人员用于编写、测试和部署现代信息系统所需代码的过程。还有许多安全工具被设计为与这些开发人员集成并向其提供数据，其中包括大量应用安全测试工具，这些工具日益自动化，并提供近乎持续的反馈以改进软件的安全性。\n\
  \n## Programming Languages\n\n由于代码是软件和信息系统的基础，它也是安全工作的重点之一。这些工作包括确保代码不会通过添加不需要的功能来破坏系统的完整性，并测试系统以识别可能对数据的保密性或完整性，或整个系统的可用性产生负面影响的非预期缺陷。为了执行这些功能，了解几个基本概念很重要。\n\
  \n编程语言代表了一组用于构建由计算机执行的程序的指令，通常目标是处理信息。这些语言由指令和书写这些指令的特定方式（称为 *syntax*）以及操作数据的方法组成。这些被组合起来创建算法，即实现数据处理目标的特定指令集。正如我们在人类语言中使用句子、段落和标点来传达意义一样，编程语言也有逻辑结构，旨在让计算机理解它们、执行指令并控制数据流。\n\
  \n### Language Types\n\n有两种类型的软件语言，它们的主要区别是将类似 `print('Hello, world!')` 的人类可读指令转换为特定硬件系统可执行的指令所需步骤的顺序。*Compiled\
  \ languages* 在运行前会被翻译成机器可读形式，这一过程称为 *compiling*。开发人员使用名为 *complier* 的程序来执行此任务，该程序将编写的程序作为输入，并生成通常称为\
  \ *binary* 的机器可执行代码作为输出。编译后的程序只能在为其编译的系统类型上运行，并且通常针对该特定系统类型进行了优化；例如，为 Windows OS\
  \ 编译的程序在尝试在 macOS 或 Linux 上运行时将无法正常工作。这种优化意味着程序可以利用特定系统的功能，但代价是可移植性。此外，编译后的程序不会向最终用户暴露其源代码，因此如果代码是宝贵的知识产权资产，则编译语言是在保护保密性的同时分发它的最佳方式。C#\
  \ 和 Swift 是编译语言的例子。\n\n*Interpreted languages* 在运行时被翻译成机器可读格式，也称为 *on the fly*。这使得解释型代码在不同系统类型之间更具可移植性，因为各个平台上的用户可以安装特定于其系统的解释器，因此开发人员无需编译特定于系统的版本。解释型语言也有缺点，安全性尤其可能成问题。代码以编写的形式或中间形式分发，这都是人类可读的形式，因此解释型语言可能会暴露敏感的知识产权。由于解释过程，存在额外的运行开销，使得解释型程序比编译程序慢，尽管现代计算系统的速度在许多情况下使这成为可以忽略的问题。JavaScript\
  \ 和 Python 是解释型语言的例子。移动代码的安全问题包括其动态特性——由于它在运行时加载，因此攻击者可能修改用户运行应用程序时请求的代码。这意味着之前测试过的代码可能不会被加载，而是攻击者的恶意代码被加载并执行。\n\
  \n数据库系统也有用于定义其数据结构、与存储数据交互以及管理数据库本身的语言。结构化查询语言（SQL）就是一个例子，它包括用于与数据库管理系统（DBMS）交互的子语言。这包括用于创建数据库和表的\
  \ 数据定义语言（DDL），以及用于执行查询或插入新记录等操作的 数据操作语言（DML）。数据控制语言（DCL）主要关注数据库中存储数据的访问控制，这使其对实施安全至关重要。\n\
  \n安全测试也受语言类型选择的影响。安装在特定计算系统上的编译程序可以进行彻底测试，但许多解释型程序以 Web 应用程序中的移动代码形式远程交付。对于一些组织而言，程序代码的完整性可能是一个问题，因为解释型程序代码在用户每次请求网页时都会重新加载。解释器之间的差异也可能引入难以测试的安全问题，因为测试目标数量增加，且可能没有资源在所有可能的系统和解释器组合上进行彻底测试。\n\
  \n## Type Checking and Type Safe Languages\n\n编程中经常影响安全的一个重要方面是程序处理的数据。在编程语言中，数据通常被归类为不同类型，如文本字符串、数值整数或布尔值如\
  \ true/false。数据类型在代码中具有关联的内存结构，这些结构通常用作占位符，表示程序创建时不存在的数据——程序接受的输入变量。如果用户输入的数据不符合预期结构（例如，用户在其生日数字信息字段中输入姓名），程序很可能会遇到错误。\n\
  \n*Static type checking* 由编译器执行，以验证程序的功能是否符合数据输入的类型约束。例如，如果两个输入变量都是存储代表货币的值的整数类型，则表达式\
  \ `price + tax` 可以成功求值。然而，如果程序声明了一个整数和一个文本值“yes”或“no”来定义项目是否适用销售税，则尝试添加这两条数据是不可能的。类型检查可以识别此类编程缺陷。*Dynamic\
  \ type checking* 在程序运行时检查变量中存储的值，以确保数据与预期类型匹配。实现这些功能的语言被称为 *type-safe*，它们支持与数据完整性相关的重要安全目标。\n\
  \n\n\n强类型语言要求所有变量类型声明在编译时进行检查，而松散或弱类型语言则允许在应用程序运行时进行动态类型检查。强类型或弱类型语言的使用可能可以成为系统开发时需要决定的关键架构问题。用于确定使用强类型或弱类型语言的需求可能与数据完整性或系统可用性目标相关，因为用强类型语言编写的应用程序不应使用无效数据执行函数，从而导致错误。然而，用强类型语言编写的代码可能对不同功能的可重用性较低，导致需要额外开发工作。\n\
  \n## 编程范式\n\n编程语言具有某些特性，基于它们实现所需的数据操作或处理过程的方式。*声明式*编程表达任务的逻辑，而不描述应如何执行；在这些语言中，系统必须解释逻辑并执行适当的任务。\n\
  \nSQL 是声明式范式的示例，用户发出命令，DBMS 负责按照其自身的内部约束执行命令。\n\n这种抽象是一项重要的安全能力，因为它提供了控制用户可以做什么和不可以做什么的机会；例如，DBMS\
  \ 可能会根据用户的身份为敏感的 SQL 函数实施额外的身份验证要求。\n\n编程的*命令式*范式使用改变程序状态的语句或命令，类似于在人类语言中发出命令式命令，如“stand\
  \ up”或“study for the CISSP。”\n\n尽管这种直接控制可能带来安全挑战，现代命令式编程通常侧重于使用过程，有时称为*子程序*或*函数*，它们提供了对程序如何运行的更大控制。\n\
  \n用于访问文件系统中数据的标准化子程序可以被测试是否存在访问控制缺陷；每次重用该子程序时，都可以确保它以一致的方式实施访问控制。\n\n*过程式编程*与命令式范式相关，基于程序调用过程的概念，过程类似于例程或子程序。\n\
  \n过程是一组待执行的步骤，并允许这些步骤在逻辑上分组，并在需要时动态调用。\n\n除了过程之外，语言可能实现其他结构来对程序元素和程序代码的逻辑流程进行分组。\n\
  \n这提供了可读性和代码功能清晰度提高的好处，以及随着时间的推移可维护性提高，因为代码更容易理解。\n\n这种做法称为*结构化编程*，因为代码使用像 `if`/`then`\
  \ 这样的构造进行结构化，使得程序在给定时间将执行哪些步骤变得显而易见。\n\n*块结构*编程语言利用块作为组织单元；程序元素如变量和函数的范围被限制在块内，以防止与代码其他位置的元素发生冲突。\n\
  \n*面向对象编程* (OOP) 是一种范式，专注于编程中的对象而非动作。\n\n而不是编写特定命令来收集输入数据并对其执行过程，OOP 将数据和函数都视为对象，称为*类*，它们可以通过定义的交互相互链接。\n\
  \n对象是任何具有可跟踪状态的东西，例如等待数学变换以使其不可读的数据（加密过程）。\n\n代码对象是自包含的函数模块，被“called”以执行其指定功能。\n\
  \n许多现代智能手机应用提供图像变换，如锐化照片；在这种情况下，照片是数据对象，标准图像变换是应用中的代码对象。\n\n照片被传递给图像变换函数，处理后的照片在完成后被传回用户界面。\n\
  \n与 OOP 相关的有许多重要的安全概念，其中许多与将数据和函数视为以预定义方式通信的对象所固有的抽象有关。\n\n这些概念包括以下内容：\n\n*   **封装：**\
  \ 这也称为*数据隐藏*，有效地是一种将数据与意外误操作隔离的方式。\n\n直接访问一个类可以被拒绝给外部对象，从而将访问限制为仅批准的函数，称为*方法*。\n\
  \n*   **继承：** 数据对象的类可以有子类，继承主类部分或全部特征，例如访问限制。\n\n例如，`Employee` 数据类可能有一个 `Salary`\
  \ 子类，它实现了操作数据的相同方法，但具有额外的基于角色的访问控制限制。\n\n该子类可以作为构建块重用，从而加快开发速度。\n\n*   **多态：** 该术语指的是对象在创建或实例化时可能采取的多种（poly）形式（morphs）。\n\
  \n从现有对象实例化新对象通常会复制现有对象的属性和方法，但不同类型的数据可能导致安全问题，因为新数据类型需要不同的方法。\n\n例如，将数据打印到屏幕上的函数对文字处理程序有用，但如果被调用来打印敏感数据如密码，则可能带来安全问题。\n\
  \n*   **多实例化：** 该术语意味着制作对象的多个（poly）副本（实例），通常目标是为该对象支持不同的保密性和完整性级别。\n\n操作系统可能会创建共享资源空间的多个实例，如虚拟内存，以防止不同进程相互读写，或者数据库可能会为每个分类级别创建记录的副本，省略该分类级别以上的信息。\n\
  \n这防止了低级别用户甚至知道更敏感信息存在，降低了推断攻击的可能性。\n\n## 标记和脚本语言\n\n当许多人想到计算机编程语言时，他们想象的是像 C 这样复杂的语言，需要专门的知识和技能。\n\
  \n然而，提供数据结构或自动化基本任务集的语言也符合定义，因为这些语言为计算机系统处理数据提供指令作为输入。\n\n这些语言的安全性经常被忽视，因为它们简单到即使是相对缺乏技能的用户也能编写。\n\
  \n然而，它们在通过互联网交付的网页等移动代码环境中的使用要求考虑安全性，并通过控制此类代码可能从何处加载或完全阻止像 JavaScript 这样不可信的远程代码来实施控制。\n\
  \n这些语言包括以下内容：\n\n*   **超文本标记语言 (HTML)：** 指定交付给网页浏览器的文本的布局或显示元素。\n\n*   **层叠样式表 (CSS)：**\
  \ 允许定义网页文档应如何为显示进行样式设置，包括字体、颜色以及页面上元素的布局/间距。\n\n*   **JavaScript：** 在客户端系统的网页浏览器内提供交互式应用程序，通常用于在用户屏幕上显示和操作数据。\n\
  \nJavaScript 可能需要访问用户机器上的特权功能，如本地文件访问，这是一个主要的安全问题，因为代码来自互联网上不可信的第三方。\n\n\n\n## Python\n\
  一种高级语言，可用于多种用途，从小型个人程序到大型 Web 应用程序。作为一种解释型语言，它可以在多种平台上运行并与其他应用程序中的数据交互，例如由单个用户编写的本地脚本，用于自动化重复性任务，如清理电子表格中的数据，或通过应用程序编程接口（`API`）调用与其它系统和用户浏览器通信的分布式\
  \ Web 应用。\n\n### 库\n软件库是预先编写的常用函数、代码、类、脚本、过程或其它软件元素的存储库。它们使开发人员能够更快速、更轻松地将功能集成到程序中，而无需从头编写代码，因为库中的相关模块可以在需要时调用。许多平台（如操作系统、社交媒体网络和云计算服务）将其包含在所谓的软件开发工具包（`SDK`）中，这加快了开发人员构建集成这些平台功能的程序的任务。除了代码或函数之外，许多库还包括其它支持元素，例如帮助文档和预先编写的代码模板。\n\
  \n库的功能在所有使用该库语言或平台编写的程序之间共享，其价值来自于元素的易于重用。不仅这种重用加快了开发速度，而且还提供了更高的软件可靠性，因为这些共享函数很可能经过开发人员社区和实施该库的系统的广泛测试和改进。许多库还提供合规性导向的功能，例如设计为满足可访问性要求的用户界面组件，或受监管的函数，如信用卡处理，可以在无需解决支付卡行业数据安全标准（`PCI\
  \ DSS`）合规性的情况下实现。\n\n库通常实现许多标准功能，包括子程序、全局变量和类定义。根据库的不同，还可能提供额外的功能，例如用于常见任务（如加密）的预建算法，以及列表、表和数组等数据结构。针对特定平台（如操作系统）的库还提供与\
  \ `OS` 的各种功能的交互，包括文件系统访问、处理数据输入/输出以及通过驱动程序访问和控制设备。使用库的程序员可以像在程序中使用构建块一样轻松实现这些功能，而无需为每个任务完成编写软件的全部工作。\n\
  \n组织中库的使用应受多项要求的约束，包括需要经过验证且符合经证实的安全要求的库。组织可以使用受信任供应商的库、内部开发可在项目间共享的库，甚至在风险被认为可接受的情况下使用开源项目。包含易受攻击或恶意代码的库会给依赖它的整个应用程序带来风险。\n\
  \n### 工具集\n有各种各样的工具可帮助程序员、工程师、测试人员和其他人员开发软件和系统。它们执行各种功能，包括创建和调试代码、在多人协作时保持代码的一致性以及启用测试。其中许多工具被组合成工具集，以满足开发人员的多种需求，例如以下内容：\n\
  \n* 源代码编辑器，可为开发人员提供编写和检查代码的能力。它们类似于文本编辑器，但包含特定于开发的功能，如语法检查器，用于识别编写不正确的代码、库集成，可自动建议适当的函数，甚至是开发人员可以利用以加快工作速度的常见功能的预建模板。注释和文档生成功能也可能是编辑器的一部分，使开发人员能够编写解释性注释，帮助其他开发人员理解给定代码片段的目的，或可用于自动生成有关程序特定功能的用户文档。\n\
  * 代码存储库和修订控制工具为代码提供集中存储和完整性保护。集中存储支持多名开发人员同时工作，而版本控制通过锁定已打开进行编辑的代码并维护带有时间戳和更改用户详细信息的修订历史记录，确保开发人员无法相互干扰工作。\n\
  * 调试器和错误数据库帮助开发人员查找和修复代码中的问题。有些通过突出显示已知问题或可识别的缺陷（如输入不正确的函数调用）来工作，而其他工具可以提供程序的逐行执行，以识别特定错误发生的位置。\n\
  * 编译器旨在创建特定于平台的应用程序二进制文件，由可在特定架构上运行的机器语言组成。许多编程语言可以编译为在各种平台上运行，使开发人员能够编写单个程序，然后使用适当的编译器支持他们想要的系统。\n\
  * 测试工具通常包括静态代码分析和单元测试工具。静态代码分析在不实际运行程序本身的情况下审查程序的底层代码；目标是识别可能导致缓冲区溢出条件等问题的不当编码问题。这些工具还可能执行数据流分析，其中函数可能生成的值会被审查，以确保其符合预期参数。\n\
  \n组织中使用的工具集应受配置管理、补丁管理和审计等安全实践的约束。应实施经批准工具的正确版本以及对这些工具的受控更改，并且使用这些工具的开发人员应接受其正确使用和维护安全程序的培训。这包括仅安装经批准的模块或函数、寻求新模块的批准，并利用现有工具执行组织安全\
  \ SDLC 程序中定义的安全控制。\n\n### 集成开发环境\n集成开发环境（`IDE`）是在单一环境中组合的工具，如桌面程序或 Web 应用程序，用于支持开发人员的工作。组合和集成工具的目标是提高生产力，同时通过减少管理多个工具的开销来确保一致性。经常纳入\
  \ `IDE` 的功能包括源代码编辑器、调试工具、构建自动化工具（如编译器）、测试工具以及部署自动化，如与容器编排和部署平台（包括 `Docker` 和 `Kubernetes`）的集成。\n\
  \n面向 `OOP` 语言的 `IDE`s 通常包括特定于语言的支持功能，例如用于语言中可用对象或为正在开发的特定程序创建的类的浏览器，类似于 Microsoft\
  \ Excel 中的公式编辑器。源代码编辑器的功能可能特定于语言，例如对于类或对象可以在视觉布局中排列和链接以模拟数据流或程序执行的语言的视觉编程。\n\n与工具集一样，`IDE`\
  \ 的安全性也应成为安全计划的重点。任何正在开发的应用程序的基本安全性都受到用于构建它的工具的影响，因此确保 `IDE` 的组件得到批准和维护至关重要。\n\n\
  ### 运行时\n\n\n\n简而言之，一个 `runtime` 是运行应用程序所需的所有硬件和软件的集合。对于许多系统而言，这会相当复杂，因为硬件可能包含其自身软件（称为\
  \ `firmware`）以实现正常运行，可能需要设备驱动程序让应用程序与硬件通信，并且操作系统需要协调操作并调解对硬件的访问。用于提供这些信息系统服务的各种硬件和软件层，作为系统架构的一部分在\
  \ 第 3 章 中进行了讨论，“安全架构与工程”。\n\n编译程序代码、操作系统、设备驱动程序和固件的组合可能是编译语言程序运行所需的所有元素，尽管许多程序会通过\
  \ API、远程过程调用（RPC）或其他服务调用来访问运行所需的功能或数据。解释型语言也需要在运行时包含一个解释器，它将代码翻译成机器可执行格式，并且可能还负责执行诸如沙箱之类的安全控制。与所有信息系统一样，安全机会和漏洞存在于运行时的所有元素中，必须予以考虑和解决。\n\
  \n对于高安全应用，可能需要诸如可信计算基（TCB）之类的安全硬件。TCB 由负责执行安全的所有硬件、软件和固件组成，并充当参考监视器以控制访问并在系统内执行安全策略。要实现\
  \ TCB，需要对 TCB 元素进行适当的 设计、测试 和 隔离，然后才能支持对系统及其资源的受信任安全访问。TCB 是配置和变更管理的首要候选对象，所有操作系统和信息系统组件也是如此，因为它们是技术安全控制（如加密）和流程安全控制（如补丁管理）的明显实施点。\n\
  \n许多人想象的运行时的传统模型由运行 macOS 或 Windows 等标准操作系统的台式计算机（或笔记本电脑）组成。物联网（IoT）和边缘计算等趋势现在意味着执行计算功能所需的硬件和软件集合变得更加广泛。智能洗衣机、恒温器和传感器启用设备是运行时环境的一部分，可能包含一些基本的数据采集和处理能力。其中许多设备依赖\
  \ WiFi 或 Bluetooth 等网络技术来同步数据，这意味着它们是整体物联网运行时环境的一部分，必须作为组织安全计划的一部分予以考虑。\n\n## 持续集成与持续交付\n\
  \n像 Agile 这样的开发方法 dramatically 减少了交付功能软件所需的时间，通常将开发时间从数年缩短到数月甚至数周。其驱动因素是通过更快速地发布功能软件来支持用户，以满足业务和功能需求。`Continuous\
  \ integration`（CI）是指持续将开发人员的代码合并到共享主位置的做法，通常称为 `repository`。更频繁地集成代码可以降低进行大规模对账和集成活动（如调试新编写或修改的代码引起的问题）所需的成本和时间。这反过来又支持\
  \ Agile 的目标，即在每次迭代中交付一组渐进式功能，而不是单体部署。\n\n代码仓库是配置管理的实现，它对项目如何进入和离开受控状态施加规则。例如，在 GitHub\
  \ 仓库模型中，开发人员会创建拉取请求，突出显示新代码引入的更改。拉取请求必须在合并回基础代码分支之前接受检查，例如由其他开发人员进行人工审查或进行自动化测试。自动化安全测试也可以与这些集成活动结合使用。虽然自动化扫描无法找到所有问题，但更频繁地在更小的代码单元上执行可以提高其整体有效性。\n\
  \n持续交付（CD）是一种将代码自动交付到非实时生产环境的过程，或需要某些手动步骤才能部署到生产环境。这通常用于软件开发中需要具有手动测试流程的测试环境的情况，例如处理受监管或敏感数据的系统，或自动化可能不可行的复杂系统。在这些情况下，必须在新代码上线前进行人工验证。测试的完成可以作为部署新代码的自动触发器，或者在测试完成后部署可能是手动的。\n\
  \n一个密切相关且有些令人困惑的术语是持续部署（也称为 CD），它扩展了 CI 的概念，通过将集成代码自动部署到生产环境，无需人工干预——除非某个自动化步骤失败。实现持续部署要求组织在自动化质量保证和测试流程方面具有高度成熟度，以确保代码在部署前经过彻底测试并通过。经常需要自动化功能、集成和回归测试，以确保新开发的代码不会破坏系统或引入错误。\n\
  \n实现 CI/CD 的工具和流程组合通常被称为 `pipeline`，该管道包括交付功能软件到生产环境所需的所有步骤和要求。这将包括编写代码和解决出现的任何错误等手动步骤，以及运行测试和扫描等自动化步骤。打包代码，例如构建容器，以及部署它，是管道的最后阶段。CI/CD\
  \ 管道将跨越从 IDE 到代码仓库再到云托管环境等多个系统，而管道中的每个系统和步骤都是实施安全控制的机会，例如完整性验证、保护机密性的加密，以及人工或自动化的测试和审查。\n\
  \n### CI/CD 管道中对测试的强调\n\nCI/CD 严重依赖自动化来实现速度。CI/CD 管道不太可能手动构建计算机硬件、操作系统和启用诸如 Web\
  \ 服务器之类的应用程序，而更可能利用虚拟化或云计算，在其中可以使用定义文件自动化和编排这些活动。这些定义文件指定在应用程序部署时需要配置的计算资源，这种做法称为\
  \ `infrastructure as code`（IaC）。由于存在定义文件来精确指定软件和虚拟硬件配置应是什么，因此配置管理、测试和审计变得容易得多；CISSP\
  \ 可以通过将小型、自动化且可重复的安全检查实施到此自动化管道中，实现很大的安全影响。\n\n\n\n应用安全（AppSec）是支持 CI/CD 管道的另一个重要的自动化测试功能。尽管自动化测试并不能完全取代手动测试活动，但它确实提供了若干优势。它可以比手动测试更频繁地执行，通常在每次部署或变更时进行，并且由于计算机化测试的速度快，可以测试应用程序的更大部分。单元测试、功能测试和回归测试都应包含在自动化测试活动中，以及诸如漏洞扫描等特定于安全性的测试。DevOps\
  \ 和安全从业人员可以利用敏捷原则确定设计 AppSec 程序的方法，目标是将安全集成到 CI/CD 管道中，以确保满足安全要求，同时不影响组织的敏捷性。诸如持续安全等实践将这些原则中的许多进行了规范化，更多细节可在\
  \ `devops.com/9-pillars-of-continuous-security-best-practices` 找到。\n\n自动化测试工具可以将工作重心从安全团队转移开，并打破一个常导致问题的关键障碍。安全测试通常由安全人员执行，然后结果必须传达给开发人员。这种传递可能导致信息丢失或传达错误，使安全漏洞得不到解决。自动化工具可以集成到\
  \ IDE 中，使测试结果能够直接传达给开发人员。例如，应用程序安全漏洞扫描器可以在代码推进到测试环境时自动运行，在那里它会在 Web 应用的某个页面上发现 SQL\
  \ 注入缺陷。通过 API，该发现——包括具体的测试用例、页面的地址和其他细节——可以立即放入工单中，并分配给负责该 Web 应用功能的开发人员。开发人员仍然对代码记忆犹新，可以轻松使用提供的数据修复缺陷。\n\
  \n## 安全编排、自动化和响应\n\n安全编排、自动化和响应（SOAR）是一个最近引入的术语，结合了多个流程和领域，通常作为软件平台或集成工具集提供。其主要目标是加快检测和响应安全事件的时间，通过整合不同的数据源和系统来协调自动化操作来实现这一目标。SOAR\
  \ 常常与安全信息和事件管理（SIEM）混淆，但 SIEM 工具只是摄取数据，通过关联数据并为人工响应人员生成警报来支持响应活动。这种差异类似于入侵检测与入侵预防：入侵检测系统（IDS）生成警报，而入侵预防系统（IPS）会自动采取行动阻止入侵。\n\
  \n### 编排\n\n这是 SIEM 和 SOAR 存在部分重叠的地方，因为它们都将来自不同系统的集成数据整合到单一数据集。然而，SOAR 超越了日志，还包括来自诸如用户和实体行为分析（UEBA）、IDS/IPS、外部威胁情报服务以及特定领域解决方案（如电子邮件反钓鱼工具、反恶意软件、应用程序安全扫描器等）等安全工具的数据。在许多情况下，SIEM\
  \ 关于可疑活动的警报将成为 SOAR 平台的输入，依赖于 SIEM 跨网络或系统关联数据的能力。API 的使用对于数据摄取以及在目标系统上公开功能以实现响应自动化至关重要。例如，收到包含恶意文件的钓鱼邮件的用户会触发反恶意软件工具和\
  \ UEBA 代理的警报，SOAR 可以将其识别为与特定用户、电子邮件和一组操作相关。将这些不同系统的数据编排成连贯、可操作的情报是 SOAR 解决方案价值的第一步。\n\
  \n### 自动化\n\n在前面的示例中，恶意文件下载可能会在受影响用户的机器上触发反恶意软件操作，例如隔离文件、删除恶意数据并向管理员发出感染警报。然而，单独的该警报可能会忽略其他用户收到了相同的电子邮件，或者附件利用了可能执行蠕虫的漏洞，该蠕虫会传播到其他端点，而检测可能发生也可能不发生。这种对问题的整体概述要求事件响应人员不仅调查恶意软件的原因，还要调查其在网络中的影响，这是一项复杂、耗时且容易出错的任务。流向\
  \ SOAR 的编排情报能够实现比人工调查速度快得多的自动化响应。\n\n自动化遵循一组机器可执行的规则，通常收集在 playbook 或其他旨在响应特定触发器（如恶意软件检测）的指令集中。SOAR\
  \ 相对于传统方法的优势在于其执行的速度。速度至关重要，因为这是风险事件发生后激活的对策，目标是减少事件的持续时间和影响。自动化诸如在用户工作站受恶意软件影响后强制更改密码、将受影响的机器与网络隔离、从其他用户的收件箱中隔离或删除电子邮件，以及打开预先填充相关详细信息的事件响应案例等操作，可节省时间并减少攻击造成损害的机会窗口。\n\
  \n### 响应\n\nSOAR 将事件响应从传统的检测和手动响应模式演进为协调的自动化响应，在这种模式中，人类的专业知识、知识和才能以最有效的方式得到利用。信息系统可以比人类分析师更快地接收和处理数据；即使是配备齐全、24/7\
  \ 运行的安全运营中心（SOC），其响应时间也比具有基础设施可见性和自动化能力的自动化系统慢。重复或易于自动化的任务可以由 SOAR 平台处理，例如识别一个用户收到的恶意电子邮件并在其他用户点击链接或打开恶意附件之前将其从其他用户的收件箱中删除。这为人类节省了时间和注意力，使其能够专注于新型威胁；SOAR\
  \ 还可以通过汇总有意义的信息来增强人类能力，加快决策速度并减少响应事件所需的时间，这再次降低了事件对组织的影响。\n\n作为示例，请考虑前面详细说明的恶意电子邮件事件。打开钓鱼邮件的原始用户可能由于网络上存在恶意软件而触发了警报。SOAR\
  \ 可以作为编排的一部分接收相关信息，然后执行由传入数据触发的自动化响应。除了前面提到的隔离步骤外，SOAR 还可以启动恶意软件扫描以检测网络中的横向移动，并建立防火墙阻止访问与钓鱼邮件和恶意软件相关的任何恶意站点或\
  \ IP 地址的流量。这些操作可以在几秒钟内完成，而人类可能仅阅读初始警报就需要几分钟。\n\n\n\nSOAR 并非寻求在事件响应中完全消除人工干预。许多平台都包含事件响应案例管理工具，旨在整合决策所需的信息，并提供可由响应人员启动的自动化操作链。继续以恶意邮件为例，一旦自动化响应执行完毕，可能会创建事件案例文件并分配给人工响应人员。该案例将包含所有相关数据，包括受影响的用户、密码重置等自动化操作，以及流程中建议的手动下一步。将与事件相关的所有信息集中在同一位置呈现，可使响应人员做出更明智、更快速的决策，同时也能为响应团队的所有成员提供一致的信息来源。\n\
  \n任何实施自动化响应的系统，例如 SOAR 或 IPS，都可能因误报而导致不必要的操作。SOAR 可能在检测到可疑登录活动时暂停用户账户，但如果用户确实在旅行或在非正常工作时间处理关键的时效性任务，SOAR\
  \ 就造成了拒绝服务（DOS）状况。通过 *调优* 来调整这些工具以降低误报的可能性，*调优* 实质上是让它们学习组织环境的特定情况。该过程在 第 7 域 中有更详细的讨论，尤其是在实施人工智能（AI）工具的背景下。\n\
  \n## 软件配置管理\n\n软件配置管理（SCM）是对配置和变更管理实践的实施，以支持安全的软件开发。其主要目的是为关键软件资源（如源代码）和程序资源（如需求文档）提供完整性。置于配置管理下的这些项目称为配置项（CIs）。每个\
  \ CI 必须具有唯一标识，并且对 CI 的更改必须遵循严格的变更流程，以确保更改得到协调且不会引入缺陷或破坏功能。\n\n常见的 CI 包括源代码、软件库以及单个配置设置，如补丁级别或软件设置；一组\
  \ CI 共同代表基线，即系统的已知良好配置。在选择一组 CI 时，重要的是在所管理项目的数量与其关键性之间取得平衡。控制每个脚本文件或帮助文档的每一行可能是期望的，但将如此多项目置于配置控制下管理所带来的额外时间和开销可能会引入不必要的操作延迟。\n\
  \n基线代表一组稳定的不可变配置项，共同提供一个功能系统——请注意，该术语在安全控制的上下文中也使用，其中基线代表所需控制的最小集合。SCM 基线通常与期望的系统特性相关联，例如安全设置和配置或功能要求，如强制加密要求的已知良好设置或系统功能所需的\
  \ COTS 产品版本。由于构成基线的 CI 处于配置管理之下，对基线的更改必须遵循变更管理流程。这通常通过创建分支来实现，分支是一组与已知基线分开进行开发或更改的版本化\
  \ CI。在分支合并回并将更改纳入基线之前，必须满足测试、质量保证和验收标准。\n\nSCM 的主要目标是促进对软件系统中所有元素的状态及其更改的可见性和控制。更改可能会引入错误或缺陷，从而对机密性、完整性、可用性、不可否认性和真实性（CIANA）等基本安全概念产生负面影响，必须维护源代码、需求文档和设置等系统元素的完整性。未受控制的更改可能会引入漏洞或产生其他非预期后果。在\
  \ SCM 领域，版本控制通常被用作根据版本号识别软件元素并通过强制执行关于何时以及如何创建新版本的规定来控制其更改的一种方式。实现这种管理的工具称为源代码版本控制或修订控制系统。\n\
  \n## 代码仓库\n\n仓库，或通常所知的 *仓库*，是现代软件开发的基石，并提供支持多用户团队开发软件所需的关键功能。它们提供集中存储位置并通过允许多个用户访问和进行更改来支持协作工作，同时实施分支等限制，允许用户提取代码并对主代码隔离进行非破坏性更改。完成后，更改可以进行测试并合并回主代码。\n\
  \n### 保护源代码\n\n源代码是宝贵的资产，其面临的风险与组织中的任何其他数据一样。仓库在支持 CIANA 安全基础方面提供了对源代码的许多控制点，而仓库本身由于其控制能力和有价值的内容也是宝贵的资产。在仓库上实施控制可用于实现以下安全目标，包括：\n\
  \n*   **机密性：** 仓库以授权的形式提供访问控制。有些比其他更精细，允许开发人员被授予对特定项目、代码模块或分支的单独读/写权限，而其他则简单地将仓库访问限制为仅授权用户。保护机密性的附加功能还可能包括防止将数据复制到本地计算机或便携式媒体设备等限制，从而允许更好地控制源代码的传播。\n\
  \n*   **完整性：** 大多数代码仓库对软件实施某种形式的配置管理和版本控制。开源协作项目可能配置仓库以允许任何授权用户进行更改，而严格控制的项目可能要求开发人员专门授权才能处理特定软件元素。一些仓库与项目管理或票务系统集成以允许动态访问控制；例如，开发人员被分配任务更新特定模块，这授予他们该模块代码的临时写访问权限。允许回滚到先前版本的版本控制系统也可作为应对非预期或不期望更改的对策。\n\
  \n*   **可用性：** 仓库的集中性质可能成为单点故障。拥有一个托管所有数据的系统也使备份和恢复系统变得更容易，因为该系统的健全备份计划可保证在需要时所有必需数据都可用。\n\
  \n*   **不可否认性：** 仓库中实施的访问控制机制——如唯一用户 ID、审计跟踪和版本历史记录——可用于识别用户并使其对其对源代码所做的更改负责。\n\n\
  *   **真实性：** 如果可以证明未发生损坏或非预期更改，则数据是真实的，源代码仓库可以通过使用版本控制回滚非预期更改并使用备份支持完整性来实现这一点。\n\
  \n### 保护仓库\n\n\n\n# 软件仓库与应用安全\n\n## 仓库保护\n\n除提供管理代码的安全优势外，软件仓库本身也是需要保护的有价值资产。它们之所以成为有价值的目标，有多个原因，包括它们托管敏感数据，并且可被用来引入不需要的软件或功能。因此，仓库本身需要像其他所有有价值资产一样对待，进行风险评估并采取相应的安全缓解措施，例如以下内容：\n\
  \n* **数据：** 应部署诸如数据防泄漏（DLP）和入侵检测之类的工具，以监控仓库系统和主机上的数据和活动。\n* **通信和网络：** 必须采取适当的安全措施来控制和监控对仓库的访问。由于远程可访问的特性以及分布式系统日益增长的趋势，特别重要的是通过实施\
  \ HTTPS 和传输层安全（TLS）等协议，或 VPN 或代理服务等安全访问解决方案来保护远程网络访问。\n* **访问控制：** 必须考虑最小必要和最小权限原则，并且还应实施诸如请求审批和例行审查等访问控制程序。\n\
  * **备份和可用性：** 由于软件是大多数现代业务流程的基础，源代码以及部署所需资源（如 IaC 定义或构建说明）是保持可用性的根本重要资产。云托管的软件仓库提供高可用性和弹性配置，尽管要求更严格的组织可能被迫自行托管和维护自己的仓库。在所有情况下，配置都应通过确保在需要时可访问软件代码来支持组织的可用性目标。\n\
  \n## 应用安全测试\n\n应用安全始于构成程序的代码的安全性。在理想世界中，这只需要预防性方法——在无限的时间和资源下，所有可能的错误都可被防止。不幸的是，大多数软件开发项目并非如此运作，并且存在诸如遗留代码和软件漏洞演变等多种因素，这意味着应用安全必须纳入主动搜寻漏洞。这种全生命周期方法涵盖了本章中讨论的应用设计和\
  \ SDLC 管理实践，以及对现有代码中缺陷或漏洞的持续评估和搜寻。\n\n接下来概述了多种应用测试范式。应用安全测试的最佳方法将根据系统构成的组件以及组织在执行软件测试方面的工具、知识和成熟度，结合多种方法。\n\
  \n* **静态应用安全测试（SAST）：** SAST 评估源代码和其他非运行中的应用元素，如编译后的二进制文件。它可以轻松集成到 IDE 和开发人员工作流程中，在开发人员提交代码时执行自动化测试，并以开发人员易于理解的格式提供即时反馈。测试在开发或测试环境中执行，这意味着不会对实时生产环境产生影响。\n\
  \  * **SAST 缺点：** SAST 工具通常只能理解一种编程语言，因此如果使用多种语言，则需要不同的工具。它们也可能由于 IDE 集成而难以被非开发人员访问，这意味着非开发人员的安全从业者被排除在外。由于它们不测试运行中的应用，因此无法检测到由于代码与底层系统元素（如操作系统漏洞）之间的接口而导致的复杂漏洞。\n\
  * **动态应用安全测试（DAST）：** 词 *动态* 是 DAST 的一部分，描述了这些测试工具如何执行应用以查找缺陷。它们通常可以针对具有接口或 API\
  \ 的任何应用运行，而不考虑底层语言，并且与 IDE 的集成程度不如 SAST 紧密，这意味着非开发人员更容易访问。其中一些包含与 IDE 或 CI/CD 管道工具的集成；例如，当新代码推送到测试环境时，会启动自动\
  \ DAST 扫描，任何发现都会自动推送到开发人员工单或任务分配中。\n  * **DAST 缺点：** 由于它们可能存在于开发人员的工具集之外，可能存在将信息传递给正确开发人员的组织挑战。一些\
  \ DAST 工具被设计用于作为侦测措施持续监控生产环境；这可能会导致性能问题，更重要的是，允许存在缺陷的软件进入生产环境，在被发现之前可能被利用。\n* **交互式应用安全测试（IAST）：**\
  \ 这组新兴的工具和能力结合了 SAST、DAST 和渗透测试的元素，通常使用复杂算法和机器学习来分析源代码并关联动态测试期间发现的漏洞。它很大程度上是在 CI/CD\
  \ 实践兴起后出现的，因此大多数工具都提供与开发工具和安全平台的集成，确保对测试工作和结果有更好的可见性。\n  * **IAST 缺点：** 如同任何新兴技术一样，会出现诸如需求旺盛的新功能成本更高以及市场上缺乏专业知识等成长阵痛。由于\
  \ IAST 结合了 SAST 类似的源代码分析，它也是语言依赖的，这意味着某些语言可能不受支持，并且如果在生产环境中运行，IAST 的动态元素可能会导致性能问题。\n\
  * **运行时应用自保护（RASP）：** 如名称 *运行时* 所暗示，RASP 在应用运行时与其一起执行；RASP 更少地是一种测试工具，但通常被纳入整体应用安全中以补充\
  \ SAST 和 DAST。RASP 安全工具与应用集成并分析程序的执行以发现异常或意外行为，然后采取纠正措施。这可能包括阻止特定请求或函数以关闭活跃攻击，还包括实施预防措施，如虚拟修补应用以防止未来再次使用相同的攻击向量。\n\
  \  * **RASP 缺点：** 如同任何自动响应技术一样，RASP 的误报可能导致 DOS，就像 IPS 关闭意外但合法的流量一样。与 IAST 类似，作为相对较新的技术，RASP\
  \ 将面临兼容性问题以及配置和管理工具所需的技能差距。\n\n## 评估软件安全有效性\n\n软件安全必须被衡量以评估其有效性并推动随时间的改进，类似于衡量和审计安全计划有效性的概念，如\
  \ SOC 2 审计，该内容在 第 6 章，“安全评估与测试。” 中讨论过。对软件环境的更改进行日志记录和审计，不仅是生产环境，也包括开发环境，提供验证为关键信息系统提供动力的软件完整性所需的关键数据。风险分析和缓解虽然是信息安全所有领域中的常见做法，但需要针对软件安全采取特定实践，以确保对软件独特风险的充分处理。这些包括对应用程序和信息系统的风险，以及对软件开发工具和源代码本身的风险，两者都是有价值的资产。\n\
  \n### 更改的审计与日志记录\n\n\n\n# 事件、审计与日志记录\n\n事件即使在中等复杂度的信息系统中每天也可能发生数千次。用户登录和注销，应用程序和服务启动和停止，用户输入错误密码，服务器和进程被重启，等等，所有这些都是非恶意且预期的操作。例如，在常规工作日使用的标准\
  \ Windows 10 工作站很容易产生数万条已记录的事件；手动审查每一项几乎是不可能完成的任务。\n\n大多数事件都会以某种方式改变系统的状态；例如，服务器重启意味着系统在一段时间内不可用。这可能是由意外断电引起的，也可能是由部署添加用户所需功能的新代码引起的。跟踪这些变化并提供哪些是正常、哪些是不正常的可见性，对于诊断问题以及处理升级为安全事件的事件至关重要。\n\
  \n审计和日志记录是不同的，尽管经常被混淆的术语。它们经常被互换使用，例如在审计日志中，即使每个术语实际上都有自己的定义。以下是这些关键术语以及其他相关概念的定义：\n\
  \n## 关键定义\n\n* 审计是对账户、文档或实践等进行正式或系统的检查。在软件环境中，审计侧重于软件安全控制的实施和有效性，并且通常依赖于 ISO、NIST\
  \ 或 OWASP 安全框架等官方比较标准。变更管理和 QA 等审计流程通常依赖于在正常流程执行期间捕获的数据，这就是日志数据变得重要的地方。日志本身也可能接受审计，以识别违反组织要求的行为实例，例如用户尝试访问未经授权的资源。\n\
  \n* 日志记录仅仅是事件的记录。在软件系统中，日志由所有系统事件生成，例如用户登录应用程序，并且日志应捕获足够详细的细节以明确识别事件的关键信息。这包括事件是什么、谁/什么发起的操作、何时发生（通常称为\
  \ `timestamp`），以及事件的其他元数据，如严重级别。如果某些事件违反安全控制或导致系统性能下降，则会被归类为事件。\n\n* 问责制是指识别发生事件的责任人或责任实体的能力，是身份和访问管理的一个关键要素。显然需要足够的数据；如果日志文件未记录用户名或时间戳，就无法识别在任何给定时间哪个用户执行了特定操作。\n\
  \n* 不可否认性是对特定个人执行特定操作的无可争议的证明。这个概念经常令人困惑，因为它是否定的——否认一个操作意味着拒绝承担责任。因此，不可否认性意味着拥有足够的证据来防止用户否认他们执行了该操作。并非所有日志数据都支持不可否认性；例如，在主入口收集的物理访问日志不足以证明某名员工在建筑物内的特定位置，除非访问控制在员工在设施内移动时创建日志数据。\n\
  \n## 日志记录和审计的应用\n\n日志生成和常规审计都是反应性和侦测性控制措施。日志是在操作发生后生成的，因此它们不能防止风险实现，尽管它们支持检测何时出现问题的监控活动。日志只有在审计和监控流程使用它们时才变得有用；就像策略一样，如果记录下来但从未阅读或使用，则毫无用处。SIEM\
  \ 工具将日志数据作为主要输入，然后对收集的数据执行监控活动，以查找可疑或不受欢迎的行为。SIEM 通常以持续且接近实时的方式执行此监控，所生成的警报是事件响应程序检测阶段的关键输入。\n\
  \n审计是对活动与预期基线进行审查的更正式和结构化流程，通常作为证明符合法律、监管或其他合规要求的一种方式。评估是一种更非正式的审查流程，通常是为了满足内部监督目标而非外部合规要求。日志数据对审计至关重要，因为它提供了一段时间内系统活动的记录，从而确认组织是否按照记录的治理方式运行。例如，如果所有软件变更都必须遵循变更管理流程，则软件仓库中的版本历史应与记录的变更请求保持一致。\n\
  \n源代码管理（SCM）是软件安全中日志记录和审计的一个特别重要的应用。SCM 提供了跟踪存储在仓库中的代码变更的能力，有时可精确到单个代码行的级别。这些日志如果某段代码导致错误，可以用于运营故障排除，也可用于通过识别可能偏离已识别要求的代码变更来审计合规性。代码完整性也得以维护，因为非预期或不需要的变更可以回滚到已知良好的版本。\n\
  \n在运营环境中的日志记录提供了系统在活跃使用期间用户和进程正在执行活动的洞察。这些日志通常用于访问审查或审计，以及运营和安全事件的调查。典型的日志事件示例包括用户登录和退出系统或应用程序、处理过程中遇到的应用程序错误，甚至环境控制问题，如电力波动和硬件中断。像用户登录这样的事件可能仅对审计和取证分析有用，但运营团队可能会监控硬件和环境控制的日志数据，因为这些可能是对系统可用性产生负面影响的故障的前兆。\n\
  \n日志数据可被组织中的多个团队用于各种监控目的，包括以下内容：\n\n* **变更管理：** 系统变更的日志，如新应用安装或访问权限变更，可用于验证所做的变更是否与已批准的变更请求相对应。\n\
  \n* **安全事件：** 实时生产环境，尤其是具有面向公众或外部的组件（如 Web 服务器）的环境，会出现各种可疑和恶意活动。记录和监控这些操作是安全从业者的关键任务，通常构成安全分析师和事件响应人员工作职能的关键支柱。\n\
  \n* **性能管理：** 虽然不是明显的安全任务，但可用性是安全的一个组成部分。通过监控日志文件中的各种指标，例如 CPU 利用率、内存消耗和网络带宽使用，可以确保系统正在运行、可访问并能够支持所需用户负载。\n\
  \n* **云环境变更：** 在使用云服务时，大多数组织将失去对其 IT 基础设施部分部分的物理和部分逻辑可见性。与部署网络传感器来检测问题不同，具有状态信息的网页或\
  \ API 将提供关键的日志和监控数据，例如服务何时开始出现性能下降或中断以及何时恢复。如同为适应云计算而对其他控制措施进行的修改一样，日志记录和监控必须考虑可用于监控的数据类型以及如何有效利用这些数据。\n\
  \n\n\n\n对于日志记录和监控实践以及审计标准，存在权威资源。NIST SP 800-92《计算机安全日志管理指南》和 OWASP 日志记录备忘单涵盖了诸如策略要求和实施日志功能最佳实践等基础内容。许多合规框架要求特定类型的日志，或要求日志通常包含足以支持问责制的数据。这些合规框架，例如\
  \ PCI DSS，还提供了用于评估包括日志记录在内的安全控制措施实施情况和运行有效性的审计标准。\n\n## 软件开发审计\n\n审计是验证是否符合既定治理的重要合规工具，并在\
  \ 第 6 域 中有更详细的讨论。软件开发项目应接受审计，以确保在创建安全软件时遵循所需的安全控制措施，并确保正在开发的软件实现了满足安全要求的必要功能。审计在安全之外对业务的多个方面也很有用，例如进度、预算和资源管理，以确保项目顺利运行并按时完成，这有助于实现诸如推出新产品或领先竞争对手等业务目标。\n\
  \n审计活动在 SDLC 的各个阶段有所不同，审计计划需要能够适应各种 SDLC 方法论。年度审计计划可能会在每年同一阶段遇到大型瀑布式项目，因此证据收集应是全年持续进行的活动，以确保审计人员在进行审查时拥有完整的图景。SDLC\
  \ 各阶段的考虑因素包括以下内容：\n\n*   **需求阶段：** 本阶段的审计证据大多是文档，例如需求分析文档和文档化的需求本身。需要审计的关键活动包括隐私影响评估（PIA）和数据分类或系统分类等审查。确保需求完整且理解有据可查，对于设计和构建具有足够数据保护机制的系统至关重要。\n\
  \n*   **设计阶段：** 在设计阶段，会根据需求评估备选方案，例如系统的云托管与本地托管。需要审计的关键活动包括用于确定拟议解决方案备选方案中哪一个充分满足所述需求的正式风险评估和决策流程，以及对残余风险的正式接受。\n\
  \n*   **实施阶段：** 编写代码、测试系统功能以及代码审查或渗透测试等安全测试等动手活动都应纳入审计计划范围。审计人员可能会进行文档审查以验证测试活动是否已执行且结果得到妥善处理，并可能对开发人员进行访谈以测试其对关键流程和程序的了解程度。测试也是重要的审计方法，用于证明流程和技术控制按预期响应，例如尝试已知违反职责分离政策的操作并理想情况下观察操作被阻止。例如，审计人员可能会使用同一用户账户编写并尝试部署代码，以验证系统控制是否到位以阻止部署。\n\
  \n*   **验证阶段：** 对测试活动的审计对于验证监督功能是否已实施且有效非常重要。这些应包括检查测试用例或数据的设计是否充分、测试覆盖范围、所有必需测试的执行情况，以及在系统部署前成功通过必需测试。\n\
  \n*   **运行和维护阶段：** 由于系统在该阶段花费了大部分生命周期，因此大部分审计工作在此进行。该阶段的系统还可能面临更多外部审计，因为许多法律法规要求对实时生产系统进行审计。许多审计框架现在同时纳入实时系统审计和\
  \ SDLC 审计，这是由于安全软件开发在整体系统安全中发挥的关键作用。\n\n## 风险分析和缓解\n\n风险评估、分析和处理在 第 1 章《安全与风险管理》中已有深入介绍，因此风险容忍度以及评估和缓解风险的方法等概念在此不予涵盖。软件开发和安全需要持续评估和缓解风险，因此这些概念必须应用于所有\
  \ SDLC 阶段和软件环境，包括开发环境以及终端用户或实时生产环境。目标仍然相同，主要包括识别需要保护的资产、各种漏洞和相关威胁的可能性和影响，以及管理风险的最具成本效益的方式。\n\
  \n软件风险需要独特的分析方法，第一步是确定分析目标。执行此风险评估时应考虑的软件开发环境和实践方面包括以下内容：\n\n*   **数据风险：** 信息系统存储、传输和处理需要保护的信息，因此系统本身由于处理数据的角色而经常面临风险。软件、硬件以及网络连接和数据中心等技术服务的复杂组合使得难以找到分析的起点，而许多组织中信息系统的庞大数量更增加了挑战。安全从业人员应根据分类级别进行优先排序；处理最敏感或受高度监管数据的系统在发生泄露时可能造成最大影响。然而，这并不意味着低敏感性系统可以被忽略，并且对手可能入侵低分类系统并转向更高分类系统的可能性也必须考虑。\n\
  \n*   **新技术风险：** 运行标准化商业软件且配置和支持需求众所周知并得到适当支持和维护的信息系统通常比新兴技术风险更低。缺乏知识和专业技能会增加基于新技术或新兴技术部署系统时出现错误配置的可能性，而其新颖性可能意味着安全选项尚未可用。智能手机就是一个最近的例子——尽管在智能手机最初流行时，工作站操作系统已具备先进的全盘加密（FDE），但硬件和软件限制意味着智能手机上的\
  \ FDE 支持有限。这限制了使用这些设备的组织可用的风险缓解选项。\n\n*   **系统变更：** 系统随时间变化的原因多种多样。组织需求会演变，新技术变得可用，旧技术不再受支持。系统变更可能引入新风险并显著改变现有风险，尽管在某些情况下，变更也可能减少或消除风险。将遗留应用程序从本地托管迁移到基于云的微服务架构可以由于高可用性云服务而降低系统停机的可能性，但对数据中心硬件的物理控制丧失增加了物理安全风险，同时也改变了可用的缓解选项。与其使用物理锁和访问控制，组织可能会使用保险来转移在云服务提供商处发生数据盗窃的风险，以及使用额外加密来降低数据盗窃的影响。这些风险应在变更管理的一部分中识别，并且要求必须在所有\
  \ SDLC 阶段得到记录并贯彻，以适当应对这些风险并测试已实施的缓解措施。\n\n\n\n\n### 代码风险\n软件即代码，非预期或恶意的变更会给安全的所有要素带来严重风险。处理不当的变更可能引入导致系统不可用的错误或缺陷，而未经批准的代码变更可能会损害系统处理的数据的完整性和真实性。SDLC\
  \ 活动如代码审查、变更管理、测试和漏洞管理都应设计用于检测和纠正这些风险。代码也是保密风险的来源，因为编程和配置不当的系统无法实现所需的数据保密级别。\n\n\
  #### 风险评估与处理\n风险评估方法论在 领域 1 中有所介绍，包括多种用于理解各种风险对组织运营的可能性和影响的方法。针对整个组织或单个信息系统执行风险评估，存在基于最佳实践的标准，包括\
  \ ISO 和 NIST。技术和信息安全领域的风险评估框架包括运营关键威胁、资产和漏洞评估（OCTAVE）以及失效模式和影响分析（FMEA）。\n\n风险分析是风险评估的一个组成部分，涉及对已识别风险的影响或可能性进行系统审查。具体而言，就软件开发安全而言，CISSP\
  \ 应该能够协助负责软件开发和交付的各个团队完成诸如识别系统或软件特定风险等任务。一旦识别出这些风险，就需要缓解计划将可能性或影响降低到低于组织定义的风险阈值的水平。\n\
  \n软件开发中的风险来源或 SDLC 中可检测风险的点包括以下内容：\n* **规划：** 组织对系统开发的方法可能引入诸如进度或预算问题等运营风险。如果安全被笼统地计划为系统发布前一天的测试，则不太可能安全工作有效，或发现问题得到充分修复。\n\
  * **需求：** 新的系统功能，如使系统暴露于互联网访问或添加信用卡处理等新功能，会引入诸如新的攻击向量或监管合规负担等风险。\n* **设计：** 系统所选的设计可能会增加或减少各种风险，如远程访问、缺乏支持所需安全控制的功能或云供应商锁定。例如，选择一家云供应商和\
  \ DBMS 可能会限制访问控制的粒度或可用的加密选项。替代 DBMS 或云提供商的成本可能过高，这推动了对补偿性安全控制的需求。\n* **开发：** 在开发过程中，本章讨论的所有安全控制都必须得到解决以减轻软件开发风险。这包括适当使用开发工具集、正确使用安全编码指南和标准，以及测试以确保正在开发的软件满足功能和安全要求。\n\
  * **运营和维护：** 针对系统的绝大多数风险在最终用户实际使用期间影响系统。常规风险评估和持续监控计划对于衡量这些风险以及所选缓解措施的有效性至关重要。识别新风险的关键来源将包括常规风险评估以及事件响应流程。\n\
  \n诸如补丁和漏洞管理、监控威胁情报以及通过 SOC 进行持续监控等持续性流程均在运营阶段进行。处理诸如应用补丁、系统升级或预防性维护等维护问题也是在此阶段执行的关键风险缓解活动。\n\
  \n#### 缓解策略\n与风险评估一样，包括成本效益分析、风险缓解与风险转移以及残余风险接受的缓解策略在 第 1 章，“安全与风险管理。” 中有所介绍。在讨论软件开发的安全控制选择时，重要的是要注意这些控制的实施必须集成到它们旨在保护的系统的现有\
  \ SDLC 流程中。\n\n执行分析时需要衡量的一些成本包括直接成本，如软件或产品采购、专业服务支持，以及运营成本如支持合同。间接成本可能更难以明确定义或衡量，因为开发项目中存在许多因素的混合。例如，当开发冲刺还包含其他功能时，很难明确说明实施新的安全控制所带来的额外测试时间有多少。\n\
  \n诸如员工生产力等间接影响也可能难以单独衡量。新的安全控制流程启动后生产率下降可能归因于控制的开销，但夏季和冬季假期期间的季节性生产力损失或大量未经培训的新员工等其他因素也可能是原因。成本必须进行衡量以指导缓解策略的选择，但也应考虑不确定性和其他因素的核算，在非常复杂的情况下，定性衡量可能是最佳选择，以防止陷入衡量过程。\n\
  \n衡量安全控制的收益可能同样困难，特别是如果收益是负面或假设性的。通过查看客户产生的平均收入，可以衡量用户放弃注册流程导致业务损失的成本。决定是否添加导致部分用户放弃注册流程的额外身份验证要求时可以利用这些数据。例如，由于身份验证安全措施不足或疏忽而未被起诉的成本难以量化，而针对组织的诉讼价格显然更容易衡量，但在发生前难以假设。\n\
  \n定性影响衡量可以帮助这些情况；例如，“轻微”事件不太可能导致导致业务终结的罚款，而“灾难性”事件可能导致企业无力偿债。部分定量衡量也可以通过查看影响同行组织类似事件的公开数据或公开研究（如年度\
  \ Verizon 数据泄露调查报告（DBIR），可在 `enterprise.verizon.com/resources/reports/dbir` 获取）来进行。安全从业人员经常会发现他们需要基于非安全收益来证明安全控制的合理性，例如为移动或远程员工增强基于云的系统的可用性。在许多情况下，成本效益分析的最终结果将是对管理层提出各种替代方案以缓解、转移并最终接受残余风险，因此控制措施产生的成本以及任何收益都必须清楚地记录和传达。\n\
  \n## 评估采购软件的安全影响\n\n\n\n关于安全性而言，采购的软件比自行开发的软件更难评估和控制。这种情况与管理不受组织政策和程序直接约束的第三方服务提供商所带来的额外复杂性类似。当软件由组织自行开发时，可以在整个\
  \ SDLC 过程中实施安全控制并获得直接证据。当组织不控制开发流程时，通常无法主动控制软件开发流程或进行软件修复以解决漏洞。这种控制权的丧失看似不可接受的安全风险，但与试图培养构建复杂信息系统所需技能和资源所带来的同样高昂的成本相平衡。从合适的来源获取软件可以加快关键业务目标的实现，并且应选择补偿性安全控制措施将风险降低到可接受的水平。\n\
  \n## 商业现成软件\n\n如名称所示，商业现成（COTS）软件可随时向公众出售，可供购买、许可或租赁。COTS 可能很昂贵，但费用可通过支持的可用性、来自专用供应商的更强大的功能集，或由于其针对特定用例而设计的软件部署速度来抵消。COTS\
  \ 软件最直接的安全缺点是无法了解源代码和开发实践，使用它的组织无法直接进行更改——它们可能能够请求更改，但供应商没有义务进行更改。大多数软件供应商不提供任何可见性，尽管有些会分享审计和保证报告，如代码扫描或\
  \ ISO 27001 等认证，该认证对供应商的安全计划提供保证，或 ISO 27034，该认证对供应商的应用安全控制提供保证。\n\n美国网络安全和基础设施安全局（CISA）维护了一份管理\
  \ COTS 软件安全的最佳实践指南：(`www.us-cert.cisa.gov/bsi/articles/best-practices/legacy-systems/security-considerations-in-managing-cots-software`)。尽管云托管和无服务器和微服务架构等新型\
  \ IT 服务越来越多地被用于现代信息系统，但《COTS Security Considerations》文档中提供的指导对拥有传统或本地托管系统的许多组织仍然相关。这包括以下内容：\n\
  \n*   **识别 COTS 有风险的原因：** 众所周知且广泛使用的软件，如 Microsoft Windows 和 Internet Information\
  \ Services，也为威胁行为者所熟知。这些系统的广泛采用增加了利用它们的盈利能力，因为潜在目标的池更大，而且如果软件中的缺陷导致安全事件，软件开发商通常仅承担有限责任。CISSP\
  \ 应该意识到使用 COTS 的成本效益权衡，这应纳入组织基于风险的决策中，例如构建与购买。\n*   **常见攻击方法：** COTS 软件经常遭受恶意修改或干扰，如远程代码执行（RCE）漏洞或\
  \ DOS 攻击。源代码的黑盒性质也意味着 COTS 软件可能包含不受欢迎的恶意软件或功能，组织无法通过 SAST 等常规手段识别。\n*   **标准风险评估和缓解策略：**\
  \ 使用 COTS 软件的组织必须拥有适合其用例的充分风险管理实践。这包括编制 COTS 软件和组件的准确清单，并确定漏洞信息来源，例如供应商披露、渗透测试和常规安全审查。SDLC\
  \ 期间的缺陷预防策略不是一种选择，因此缓解措施必须侧重于纠正性和补偿性控制措施，例如入侵检测系统和网络访问控制。\n\n## 开源\n\n开源软件（OSS）是一类软件，正如其名称所示，使其源代码可自由获取。OSS\
  \ 通常由社区为所有人的利益而开发，使组织能够共享和协作以改进软件，同时提供源代码可见性的好处。与 COTS 不同，所有使用 OSS 的组织都可以执行代码测试以验证安全性、错误或不需要的功能，并且可以将为解决安全漏洞而进行的修复分享回软件项目，以造福社区。\n\
  \nOSS 的社区驱动方法具有可争议的安全影响。一方面，开放的性质意味着错误或缺陷最终应该被发现，并且软件通常可免费使用。另一方面，OSS 项目的复杂性、使用软件所需的专业技能以及缺乏专用支持可能使其不如\
  \ COTS 替代方案有吸引力。在评估 OSS 时，有一些关键问题：\n\n*   **执行充分的评估：** 有一种假设认为，只要有足够多的眼睛审视软件代码，所有缺陷都会变得明显。这确实如此，但忽略了一个关键要素：时间。Heartbleed\
  \ 漏洞在 OpenSSL 中存在近五年才被发现，而该软件是互联网上使用最广泛的软件之一。依赖不受信任的外部人员进行的测试和评估也可能导致测试覆盖不足、目标不同，甚至如果不是由合格的测试人员执行，结果可能过时或不准确。同样，系统管理员可能从项目存储库中提取开源软件并构建一个功能系统，而没有足够的知识来审查代码并找到潜在的错误。仅仅依赖社区或管理员的智慧是不够的。\n\
  *   **验证源代码完整性：** OSS 存储库通常配置为公开可见和贡献，意味着任何人都可以添加、修改或删除源代码。曾有多起 OSS 项目被植入恶意代码的案例，以及从非真实来源提供预打包\
  \ OSS 的案例。在这两种情况下，下载并部署软件的毫无防备的用户除了合法软件外还获得了不需要的恶意软件。务必确保您审查对 OSS 所做的更改，以确保它们是预期的并且得到适当记录，并且只从合法的官方存储库下载\
  \ OSS。\n*   **寻找商业支持：** OSS 通常许可免费使用和分发，这意味着组织也必须自行寻找支持。Red Hat 等公司通过为 Linux 等流行的\
  \ OSS 提供支持而兴起，这种安排的专用资源对 OSS 的整体质量和安全性具有有益的影响。这些公司可能能够吸引专门的人才加入项目，并提供将支持中获得的经验教训以文档和代码更新的形式回馈社区的好处。\n\
  \n## 第三方\n\n\n\n第三方软件由贵组织直接控制范围之外的公司按合同开发，所产生的软件通常供贵组织独家使用。外部组织通常专注于软件开发，并拥有使其在软件开发方面更熟练的技能、资源和知识。这降低了承包组织因不熟悉技术或缺乏软件开发流程成熟度而产生的项目风险；开发流程缺乏熟悉度或成熟度还可能导致软件安全性降低，因为开发人员由于缺乏知识而容易犯简单错误。第三方开发组织的更具经验的共享资源不太可能犯此类错误，因此外包增加的成本可被项目和安全风险的降低所抵消。\n\
  \n与所有采购的软件一样，放弃对软件开发过程的控制固有风险，需要专门的缓解策略来执行合同、服务水平协议（SLAs）以及额外的验收测试，以确保交付的软件满足组织的要求。使用第三方开发软件是一个决定，应在审慎权衡成本和收益后做出。所需的高质量开发和项目管理监督的增加成本，可能因专业第三方开发公司能够提供的交付质量或速度而得到合理化。\n\
  \n源代码本身的可用性是需要考虑的第三方软件安全性的另一个重要方面。如果开发组织倒闭，承包组织可能发现自己无法获得关键系统的支持；*代码托管*是一种常用于防止这种情况的合同安排。开发组织将源代码的副本存放在受信任的第三方处，称为*托管代理*。在有限的情况下，例如开发商倒闭或违反合同，承包组织可以获得代码的访问权限，这使得系统的持续支持和开发成为可能。\n\
  \n## 托管服务（SaaS、IaaS、PaaS）\n\n财务驱动因素与创新服务的可用性相结合，推动各行业组织采用云计算。直接的财务激励，如降低不必要的硬件或软件容量的成本，以及间接激励，如提供安全远程访问以支持分布式团队，已共同推动许多组织将信息系统作为托管服务来消费。这些服务通过计量消耗计费，通常采用按需付费模式。选择正确的服务将取决于组织的需求和技术能力。\n\
  \n各类云服务模型的广泛认可定义见 NIST SP 800-145，“The NIST Definition of Cloud Computing,” 并在 第\
  \ 3 章 中也有介绍。新兴的云服务必须从软件安全角度考虑，包括无服务器和微服务架构，它们结合了托管软件、基础设施和平台的元素，以实现代码的更快部署。云服务选择会影响消费者软件安全评估的能力和责任。\n\
  \n### 评估共享责任\n\n共享责任模型定义了云服务提供商（CSP）与云消费者在处理各种安全任务方面的分界线。例如，在所有服务模型中，CSP 负责数据中心的物理安全，而在所有服务模型中，消费者仍保留对放置在云环境中的数据的法律责任和保护责任。\n\
  \n其他责任因所选服务模型而异。例如，在基础设施即服务（IaaS）中，消费者负责对其部署的任何软件应用软件补丁，而在 SaaS 中，该责任归 CSP。软件评估责任根据服务模型遵循类似的划分：\n\
  \n* 在所有服务模型中，验证 CSP 对特定用途的适用性（如处理高度敏感数据）是消费者的责任。特定 CSP 或云部署模型的选择将由执行软件评估时可用的控制水平决定；例如，私有云或社区云提供的评估直接控制程度大于不允许消费者直接审计服务的庞大公共\
  \ CSP。\n* 在 IaaS 中，消费者拥有部署软件的最大灵活性，因此也拥有执行软件评估的最大能力。IaaS 提供了信息系统功能的基础构建块，因此软件安全评估将根据消费者在\
  \ IaaS 环境中部署的软件类型，适当纳入 COTS、OSS 和第三方软件。\n* 在 PaaS 中，部分选项已超出消费者的控制范围，因此需要补偿性流程，如审查软件保证的审计报告和\
  \ SLA。\n* SaaS 为消费者直接评估软件安全性的选项最少。然而，鉴于 SaaS 提供商的共享性质，通常会有审计报告和健全的控制文档可供查阅，涉及 CSP\
  \ 的软件开发、测试和托管安全实践。\n\n### 审计与保证\n\n如同所有第三方和供应链安全问题一样，*保证*是托管软件服务的一个关键概念。由于组织不负责软件开发，因此无法进行直接观察和控制，通常会涉及受信任的第三方以审计形式进行公正审查。这防止\
  \ CSP 受到消费者持续审查，同时为消费者提供有关安全控制设计、实施和有效性的可信信息来源。\n\n与云计算相关的安全和合规框架有多个，这些框架在 第 6 章\
  \ 中有详细介绍。如服务组织控制（SOC）、云安全联盟安全信任保证与风险（CSA STAR）以及 ISO 27000 系列（包括 ISO 27001、27017、27018\
  \ 和 27034）等框架，均提供与云服务和应用相关的某种保证。CSP 可能会报告对 CMMI 或 BSIMM 等其他框架的成熟度或合规性，以向消费者保证 CSP\
  \ 的软件开发和托管实践是健全的，不会带来不可接受的风险。如此多组织共享 CSP 资源的好处显而易见：CSP 有切身利益提供最健全的安全性以确保留住这些客户，而众多消费者的汇集资源使健全的安全控制和监督计划在财务上可行。显然，弊端是消费者放弃了对其风险的某种程度的直接控制。\n\
  \n## 定义和应用安全编码指南和标准\n\n第 1 域 介绍了组织可用于管理风险的文档层次结构。政策提供关于目标和期望的战略性高层指导，而标准和指南则为具体任务和活动提供方向。标准通常是强制性的，而指南是旨在提供实现特定目标或任务方法的建议。\n\
  \n\n\n软件开发人员应获得指南和标准，以便他们编写的代码能够实现组织的战略目标，特别是保护系统和数据的保密性、完整性和可用性的要求。各行业和组织之间在安全编码实践方面存在显著的共性，这促使像\
  \ OWASP 这样的组织为各种语言、软件库以及 Web 和移动等应用程序环境设计编码指南和标准。这些资源可自由获取，任何组织或团队都可以使用，并通过社区贡献实现持续改进和知识共享。\n\
  \n有文档记录的指南和标准可用于实施多种控制措施。它们可以防止不良的程序员行为，例如根据个人偏好或熟悉程度而非组织标准来开发代码。与安全相关的编程实践随着时间的推移而不断演进，因此使用过时开发实践的开发人员会带来额外风险。标准还可用于漏洞检测，在审计或对代码运行自动化扫描时作为比较的基线。指南和标准可以作为管理控制措施以文档和培训的形式实施，也可以作为技术控制措施，如果它们被集成到\
  \ IDE 或测试平台等工具中。\n\n## 源代码层面的安全弱点和漏洞\n\n弱点和漏洞密切相关，但在两者之间存在细微差别。漏洞的存在是由于软件弱点的存在，例如系统源代码中的错误或缺陷，这可能是由于在架构、开发和实施系统时出现的错误或不正确的设计选择所导致。弱点可能存在于系统中而没有可行的利用方法，在这种情况下它们不是漏洞；弱点还可能影响系统的非安全方面，例如导致搜索性能缓慢的糟糕数据库设计。作为一名\
  \ CISSP，认识到这种区别很重要，因为非安全弱点可能由组织中的其他团队处理，而漏洞与 CISSP 负责的安全风险直接相关。\n\n相比之下，漏洞是指弱点在软件系统中可能被利用的方式。非安全弱点显然不可利用，而某些不安全的源代码级弱点可能由整体系统的其他部分补偿，例如操作系统内存管理器可防止因代码编写不佳而导致的缓冲区溢出条件。这是在软件安全测试中面临的挑战之一：如果源代码弱点不可利用，则修复弱点的成本效益分析可能不支持所需的努力和资源。断定一个弱点不可利用可能很困难，因此会使用主观测量方法，而这些方法存在争议。\n\
  \n漏洞通常按其存在的软件进行跟踪，更具体地说是按受影响的版本进行跟踪，使组织能够确定漏洞是否影响其系统。弱点和漏洞使用通用系统进行编目和评分，以帮助识别、沟通和测试它们。这种跟踪和评分对于优先处理修复措施（如补丁）或补偿控制措施的部署非常有用。\n\
  \n### 通用弱点枚举\n\n通用弱点枚举（CWE）由 Mitre 公司与包括美国国土安全部在内的多个美国政府机构合作维护。它可自由获取，并集成到安全产品（如扫描工具）中，作为识别和报告信息系统中潜在弱点的通用方式。CWE\
  \ 在 Mitre 网站 `cwe.mitre.org` 上有最佳定义：\n\n> `CWE™` *是一个由社区开发的软件和硬件弱点类型列表。它充当通用语言、安全工具的衡量标准，以及弱点识别、缓解和预防工作的基线。*\n\
  \n该社区开发的列表识别硬件、软件源代码以及可能导致可利用漏洞的软件功能实现中的常见弱点。每个 CWE 都被赋予唯一的标识符，例如 `CWE-561`：死代码，以及以下内容：\n\
  \n*   **Description, Extended Description:** 弱点及其影响的详细信息。`CWE-561` 的描述是：“软件包含死代码，该代码永远不会被执行。”\
  \ 这是指代码在执行时跳过某些部分或从不调用这些函数，从而使其永远无法运行。\n*   **Relationships:** 其他相关弱点类型，例如不良编码实践的高级类别。\n\
  *   **Modes of Introduction, Applicable Platforms:** 这标识该弱点可能在软件开发生命周期（SDLC）阶段引入的时间，这在设计部署到\
  \ SDLC 的安全控制时很有用。适用平台标识哪些语言或系统易受影响。`CWE-561` 出现在实施阶段并影响所有编程语言。\n*   **Common Consequences,\
  \ Demonstrative Examples:** 这些部分不言自明。死代码的后果包括非预期程序行为的可能性，因为预期死代码执行的函数永远不会执行。示范示例通过展示演示弱点的示例代码来帮助软件开发人员。\n\
  *   **Observed Examples:** 如果该弱点导致了实际利用，则会包含相关的通用漏洞和暴露（CVE）引用。CVE 在下一节中详细讨论。\n*\
  \   **Potential Mitigations, Detection Methods:** 这些类别对安全从业人员最有用，因为它们提供了可操作的指导来检测和缓解弱点，例如使用静态代码分析检测死代码，以及缓解策略。在\
  \ `CWE-561` 的情况下，缓解措施看似简单：删除死代码。然而，如果死代码具有预期目的，则需要不表现出相同弱点的新代码。\n*   **Miscellaneous\
  \ metadata:** CWE 包含额外的元数据，如序数、分类法、引用和弱点的版本历史。\n\n### 通用弱点评分系统\n\n通用弱点评分系统（CWSS）是尝试根据评分对弱点进行评分并确定处理优先级。这有助于在时间有限的情况下识别应优先处理的高风险弱点，也可用于识别因所需成本高且收益小而不会处理的低风险弱点。\n\
  \nCWSS 评分包括对多个因素的评估，这些因素分为三个组：Base Finding、Attack Surface、和 Environmental。每个因素都有值来考虑复杂软件项目固有的不确定性，以及随着时间的推移关于弱点的可用信息量的演变。因素如下：\n\
  \n*   **Base Finding:** 这有助于量化弱点被利用的结果。指标包括以下内容：Technical Impact (TI)、Acquired Privilege\
  \ (AP)、Acquired Privilege Layer (AL)、Internal Control Effectiveness (IC)、和 Finding\
  \ Confidence (FC)。\n*   **Attack Surface:** 这提供了利用弱点所需的因素的解释。指标包括 Required Privilege\
  \ (RP)、Required Privilege Layer (RL)、Access Vector (AV)、Authentication Strength\
  \ (AS)、Level of Interaction (IN)、和 Deployment Scope (SC)。\n*   **Environmental:**\
  \ 这描述了利用弱点的影响和可能性。指标包括 Business Impact (BI)、Likelihood of Discovery (DI)、Likelihood\
  \ of Exploit (EX)、External Control Effectiveness (EC)、和 Prevalence (P)。\n\n\n\n\
  通用评分很少能为组织提供足够的使用上下文而不需修改，因此 `CWSS` 分数可能是一个有用的起点，用于对弱点进行分类，然后在组织内部进行进一步分析以确定修复的优先级。`CWSS`\
  \ 的完整细节位于 `cwe.mitre.org/cwss`。\n\n## 通用漏洞和暴露\n\n类似于 `CWE`，通用漏洞和暴露（Common Vulnerabilities\
  \ and Exposures）提供了一种一致的方式，不仅可以识别常见网络安全漏洞，还可以对其进行描述。`CVE` 通常会追溯到 `CWE`。例如，Apple\
  \ 的 macOS 和 iOS 中的“goto” fail 漏洞（`CVE-2014-1266`）源于糟糕的编码实践，导致代码从未被执行，这就是之前讨论过的 `CWE-561`、死代码的一个例子。\n\
  \n`CVE` ID 由两个关键信息组成：在 `CVE` 列表上注册漏洞的年份和一个数字 ID。鉴于每年披露的漏洞数量之多，这可以防止 ID 过长而失去实用性。请注意，年份仅表示在\
  \ `CVE` 列表上创建正式条目的时间，而不是漏洞被发现或报告的时间。\n\n`CVE` 记录包括漏洞的描述，其中包含受影响的软件和版本、未受影响的版本、与漏洞相关的风险以及变通方法或修复措施。还提供了参考资料，通常包括厂商发布的材料，如知识库文章或补丁信息，以及关于漏洞发现的相关资料链接。安全研究人员通常会在博客文章、概念验证代码和演示文稿中发布其研究的细节，参考资料通常也包含这些链接。\n\
  \n所有已报告的 `CVE` 的完整列表，可追溯至 1999 年，可在 `cve.mitre.org/index.html` 获取。\n\n## 通用漏洞评分系统\n\
  \n`CVE` 仅是漏洞的标识符，并不能提供识别高优先级漏洞的有用方法。通用漏洞评分系统（`CVSS`）提供了该信息，类似于 `CWSS`。目前为 3.1 版，`CVSS`\
  \ 提供了与每个 `CVE` 的影响和严重性相关的上下文。它们可在 `NIST` 维护的国家漏洞数据库（`NVD`）中访问，网址为 `nvd.nist.gov/vuln-metrics/cvss`。\n\
  \n`CVSS` 分数衡量与每个漏洞相关的三类信息，用于计算三个子分数，共同构成总体 `CVSS` 分数。还会创建 `CVSS` 向量，提供对底层漏洞测量的基于文本的引用，例如\
  \ `CVSS:3.1/AV:A/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N`。它由每个指标的分数组成，详情如下：\n\n* `Base Score`\
  \ 指标与特定漏洞的可利用性和影响相关，一旦确定，通常不会改变。可利用性指标包括攻击向量（`AV`）、攻击复杂度（`AC`）、所需权限（`PR`）、用户交互（`UI`）和范围（`S`）。影响指标涵盖了机密性（`C`）、完整性（`I`）和可用性（`A`）这一标准安全三要素。\n\
  \n* `Temporal Score` 指标捕捉特定漏洞风险随时间变化的情况，这意味着该数值也会随时间变化。当漏洞首次被发现时，利用它可能是一个高度手动的过程，技术上较为困难从而降低风险，但组织不太可能已有补丁进行修复，这会增加风险。随着时间的推移，漏洞利用被自动化并包含在\
  \ `Metasploit` 等工具中，这会增加风险，但组织也会通过修补来响应，从而降低风险。构成时间分数的指标包括利用代码成熟度（`E`）、修复级别（`RL`）和报告置信度（`RC`）。\n\
  \n* `Environmental Score` 指标捕捉特定漏洞对单个组织的影响。高度可利用、高影响的漏洞听起来很严重，但如果组织的唯一存在该漏洞的系统位于安全物理位置且未连接到网络，则修补过程并非应中断所有其他工作的紧急事件。环境分数指标修改其他类别的指标，并细分为三组：\n\
  \    * `Exploitability` 包括攻击向量（`MAV`）、攻击复杂度（`MAC`）、所需权限（`MPR`）、用户交互（`MUI`）和范围（`MS`）。\n\
  \    * `Impact` 衡量漏洞对组织 `CIA` 三要素的具体影响，包括机密性影响（`MC`）、完整性影响（`MI`）和可用性影响（`MA`）。\n\
  \    * `Impact Subscore Modification` 修改基础分数影响指标，以使其适应组织特定的 `CIA` 要求，包括机密性要求（`CR`）、完整性要求（`IR`）和可用性要求（`AR`）。\n\
  \n`CVSS` 分数范围为 0 到 10，数值越高表示漏洞越关键，应优先修复。0 分归类为无，主要为信息性。0.1 到 3.9 分为低严重性，4.0 到 6.9\
  \ 分为中严重性，7.0 到 8.9 分为高严重性，9.0 到 10 分为严重。安全从业人员可以监控 `NVD` 并使用 `CVSS` 计算器确定特定漏洞的环境分数，以优先安排修复活动。例如，之前讨论的\
  \ Apple “goto” fail 漏洞，`CVE-201401266`，得分为 5.8，这是由于机密性因未加密而丢失造成的高影响，同时也考虑了可能性有限，因为软件缺陷并不总是导致加密丢失。\n\
  \n## OWASP Top 10\n\n开放式 Web 应用安全项目（`OWASP`）是一个社区驱动的项目，最初旨在分享知识并围绕 Web 应用开发制定最佳实践。其范围已扩展到包括其他应用类型，如移动应用，主要是由于越来越多依赖通过互联网访问的系统组件或服务的应用程序，以及用于\
  \ Web 和传统桌面应用的各种语言。\n\n`OWASP` 最引人注目的项目之一是 Top Ten，它汇编了 Web 应用中最常见的 10 种漏洞（`owasp.org/www-project-top-ten/`）。请注意，Top\
  \ Ten 列表不是像 `CVE` 那样的离散漏洞标识符集合，也不是像 `CVSS` 那样的评分/优先级系统。相反，它为开发人员、QA 和测试从业人员以及安全从业人员提供指导，帮助他们识别常见漏洞，并在编程时尝试避免，或通过测试和安全监控发现。\n\
  \n列表上的漏洞由数字标识符和其出现在列表上的年份标识，最后更新于 2017 年。每个漏洞还被分解为可能利用它的威胁主体和/或攻击向量、漏洞造成的安全弱点，以及利用漏洞可能造成的影响。当前列表包括以下内容：\n\
  \n* `A1:2017-Injection`：注入是通过不用于代码的通道进行的代码的非预期插入，例如网页上的数据表单字段。如果攻击者在数据字段中输入 `SQL`\
  \ 代码语句而不是账号号码，该值可能会被传递给执行该 `SQL` 的应用程序。\n\n* `A2:2017-Broken Authentication`：身份验证是访问控制的关键支柱，因此如果用户能够绕过或破坏身份验证，他们很可能获得未经授权的访问。此漏洞可能包括针对应用程序的凭证填充攻击以及会话劫持攻击。\n\
  \n\n\n## OWASP 十大风险 2017\n\n### A3:2017-敏感数据泄露\n此漏洞相当简单。应用程序缺陷可能会将敏感数据暴露给未经授权的用户，例如将其包含在错误消息中。这也可能是身份验证失效的应用程序的次要影响。\n\
  \n### A4:2017-XML 外部实体 (XXE)\n这是一种高度技术性的漏洞，与用户提供的 XML 处理不当有关。XML 中不仅包含预期的数据，还可能包含对外部实体的引用，如文件或存储位置，这会导致应用程序执行不需要的远程代码或从外部存储位置加载恶意数据。这是由\
  \ XML 处理器存在漏洞的功能造成的，该处理器必须接受并处理不可信数据。\n\n### A5:2017-访问控制失效\n这个也很容易理解，尽管它很容易与 A2\
  \ 混淆。属于此类漏洞包括通过修改 URL 来绕过访问控制以获取未经授权的资源、重放攻击（如发送相同的会话凭据），或应用程序内部访问控制粒度不当。\n\n###\
  \ A6:2017-安全配置错误\n由于现代软件环境的复杂性，配置错误通常是最大的类别。确保正确设置参数、勾选框以及服务配置容易出错。支持过时 Secure Sockets\
  \ Layer (SSL) 或 TLS 版本的 Web 服务器就是配置错误的一个例子。\n\n### A7:2017-跨站脚本 (XSS)\nXSS 利用了 Web\
  \ 应用程序的动态和远程特性，这些应用程序设计为接受并执行远程代码，如 JavaScript。容易受到 XSS 攻击的应用程序可能会从远程源加载不可信或未经过清理的数据并执行其中包含的任何代码，从而允许远程攻击者在用户浏览器中执行不需要的操作，如将其重定向到恶意站点、读取数据，甚至劫持用户在安全站点上的会话。\n\
  \n### A8:2017-不安全反序列化\n这是另一种复杂的 技术漏洞。数据通过将其转换为通用格式以嵌入通信流中来进行序列化，例如使用 JSON 结构化数据并通过互联网发送。然后接收系统反序列化数据并将其转换为接收方软件可以理解的格式。不安全反序列化，如执行反序列化数据中嵌入的代码，可能导致应用程序出现不需要或未经授权的行为。\n\
  \n### A9:2017-使用含有已知漏洞的组件\n现代程序很少由单一实体完全创建。开发人员依赖库和开源模块，这使得软件交付更快、更高效、更安全。然而，像 Web\
  \ 服务器、代码库和其他依赖项这样的组件可能会引入漏洞。如果用于格式化数据的外部库存在缺陷，否则安全的应用程序可能会被攻破，这类似于建造一栋完全安全的房子，但在前门安装一把可以轻松绕过的锁。\n\
  \n### A10:2017-日志记录与监控不足\n这是软件安全中的另一个人为因素，与配置错误类似。没有足够监控或日志记录能力的应用程序根本不支持事件检测和响应。如果系统上发生事件但未生成警报，则不会部署任何安全对策。同样，缺乏支持调查和恢复的数据的事件由于安全响应人员可用的情报不足，很可能无法得到有效处理。\n\
  \n十大风险列表中的每个漏洞都附带了预防它们的提示和指导，例如使用自动实现反 XSS 的代码框架，或实施可重复且经过审计的加固程序以避免和纠正安全配置错误。这些应纳入组织的安全和意识材料中，特别是针对从事应用程序开发的开发人员以及负责访问控制、配置管理和应用程序安全的专业人员。\n\
  \n### 软件成分分析\n一个新兴的安全关注领域是现代程序中开源组件、库和模块的日益增加的使用。它们甚至出现在定制开发的应用程序中，其使用与十大风险项目 A9:2017-使用含有已知漏洞的组件直接相关。这些组件通常被称为自由和开源软件（FOSS）*依赖项*，如果使用知名组件，它们带来的明显好处包括更快的发展和更高的可靠性。FOSS\
  \ 意味着这些软件组件可以免费使用，并且代码可供检查或修改。然而存在安全弊端：如果依赖项存在缺陷或错误，结果的应用程序也将变得脆弱。这反映了依赖底层架构的系统的复杂性，例如\
  \ Web 应用程序也受其底层 Web 服务器和操作系统软件漏洞的影响。\n\n2019 年的一次 OWASP 演示发现，应用程序中 FOSS 组件的比例从 1998\
  \ 年的约 10% 增加到 2019 年的 90%，但许多组织在应对这些 FOSS 组件的安全影响方面遇到困难（`wiki.owasp.org/images/b/bd/Software_Composition_Analysis_OWASP_Stammtisch_-_Stanislav_Sivak.pdf`）。资产清单应捕获系统的所有元素，例如底层操作系统和硬件，并且该清单是漏洞和补丁管理流程的关键输入。然而，盘点和分析依赖项是否存在缺陷的做法未能跟上其使用量增长的步伐。\n\
  \n软件成分分析（SCA）是一种专门设计用于解决 FOSS 组件漏洞及其对软件影响的安全实践。存在许多工具供应商和方法，但大多数都包括创建所有依赖项清单并识别其中漏洞的基本功能。开源项目通常发布安全通知或包含发布说明或文档，说明通过更新修复的漏洞，SCA\
  \ 工具可利用这些信息持续识别使用该组件的应用程序中的漏洞。此过程类似于操作系统供应商发布有关漏洞和更新的说明。\n\n一旦在依赖项中识别出漏洞，补救步骤通常是应用更新。在某些情况下，FOSS\
  \ 缺陷并不会转化为依赖该组件的给定系统的漏洞，因此无需采取行动。或者，组织可能需要根据缺陷导致组件功能的变化迭代 SDLC。DevOps 和 DevSecOps\
  \ 实践也可以用于解决这些缺陷，例如在构建应用程序时纳入自动检查并纳入最新更新依赖项的 CI/CD 管道。这相当于自动补丁部署，可以自动化漏洞修复，尽管有时如果补丁破坏功能，可能会以可用性为代价。\n\
  \n### 应用程序编程接口安全\n\n\n\nAPI 提供了对系统功能的标准化访问，而无需理解其内部工作原理。 通过 API 可访问的功能通常被称为通过 API\
  \ 暴露，意味着它们可以使用标准化的方法调用，例如 `HTTP` 请求。 表征状态转移或 `REST` API 使用类似 Web 应用的 URL 暴露函数，并使用常见的\
  \ `HTTP` 动词如 `GET` 和 `POST` 来检索或向 API 发送数据。 而不是为每个应用程序创建自定义通信方案，使用 `REST` API 允许其他程序使用这些通用的协议进行交互。\n\
  \nAPI 是一种模块化软件开发形式，现代应用架构通常依赖 API 在复杂系统的函数、模块或层级之间传输数据。 还有其他形式的 API，包括现代操作系统中的内部软件\
  \ API，用于访问通用系统功能，如在用户界面中创建交互式窗口、为系统组件间交换消息而设计的简单对象访问协议 (`SOAP`) API，以及用于在分布式系统节点间执行函数的\
  \ `RPC` API。 大多数云服务都建立在 API 基础上，诸如云环境管理、数据处理以及数据存储桶和机器学习模型等服务通过 URL 暴露给用户，通常称为 API\
  \ 端点。\n\nAPI 的功能与 Web 应用非常相似，两者的安全要求通常也相似。 第一步也是最明显的一步是了解特定系统及其 API 面临的风险。 它是一个公开可访问的\
  \ API，允许读取或更新敏感信息吗？ 这样的 API 显然会面临对保密性和完整性的高风险，应实施适当的安全控制，以确保信息不会被未经授权的用户或程序通过 API\
  \ 读取或篡改。 API 是否仅对公共信息（如天气数据）提供只读访问？ 在这种情况下，保密性和访问控制可能不是高优先级。\n\n## API 安全最佳实践\n\n\
  API 安全指南和标准与安全编码指南和标准相似，尽管由于 API 是较新的概念，它们略显不够成熟。 OWASP 发布了大量关于 API 安全的免费资源，包括 REST\
  \ API 的备忘单 (`cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html`)\
  \ 和一份详细说明 API 安全面临的常见漏洞和问题的 API 安全 Top 10 列表 (`owasp.org/www-project-api-security`)。\
  \ 除了 OWASP 的指导之外，在构建使用 API 处理数据的系统时，还有一些关键实践需要牢记。 尽管与 Web 应用的安全要求相似，API 被广泛用于系统间交互而非人类界面，这确实带来了独特的挑战。\n\
  \n### 身份认证与访问控制\n\nAPI 通常不使用 Web 应用相同的用户名和密码组合，但对 API 用户（称为消费者）进行身份认证的目标仍然相同。 消费者必须证明其身份，并且应仅基于该身份获得对适当资源的访问权限。\
  \ 身份认证可以通过多种方式进行，每种方式各有优势：\n* **Basic authentication** 利用 `HTTP` 协议的一部分的简单认证方案，并发送经过\
  \ `base64` 编码的 `username:password` 字符串。 由于这不是加密形式，此种认证方法绝不应单独使用。 更强的认证方法更受青睐，但如果必须使用基本身份认证，则通信通道需要保护，例如\
  \ `TLS` 加密。\n* **Key-based authentication** 具有双重目的。 共享的秘密对称密钥用于加密传输的数据。 如果接收方能够使用与唯一身份关联的秘密密钥解密数据，则可以验证发送方的身份，并且数据在传输过程中也得到保护。\
  \ 许多具有 API 的应用程序允许用户登录安全的 Web 应用以检索用于加密和身份认证所需的 API 密钥，提供了一种密钥分发的带外通道。\n* **Certificate-based\
  \ authentication**，顾名思义，依赖于使用数字证书对身份进行认证。 这可以是单向的，即只有一方提供断言身份的证书，或双向认证，双方交换证书并进行验证。\
  \ 这显然需要部署公钥基础设施 (`PKI`)，这意味着这可能并非适用于所有情况的选择。\n* **Federated and single sign-on**\
  \ authentication 依赖于另一组织的身份和访问管理 (`IDAM`) 工具来控制访问。 诸如安全断言标记语言 (`SAML`) 和 `OAuth`\
  \ 等技术可用于联合或组合跨组织的 IDAM 能力。 API 安全可以依赖这些联合来委派访问控制决策；而不是由 API 提供者强制执行访问控制，消费者授予其用户的权限，然后通过\
  \ SAML 语句或 OAuth 断言传递相关的身份认证和访问控制信息。\n\n对已认证的消费者必须实施访问控制。 实现此功能的方法多种多样，与在应用程序中控制用户访问类似，例如基于角色的访问控制、访问控制列表等。\
  \ 在设计使用 API 的系统时，必须注意确保提供足够细粒度的访问控制来限制对数据和功能的访问，无论访问请求来自 Web 应用的单个用户还是通过 API 的消费系统。\n\
  \n### 输入验证与清理\n\n每当数据由外部系统或用户提供时，应将其视为不可信并适当处理。 这可以避免代码注入攻击等不想要的应用程序行为，也可作为数据完整性的控制措施实施。\
  \ 应用程序的 API 层是关键的控制点，因为它接收并处理由外部用户或系统提供的不可信数据。\n\n转义内容是在其周围放置字符以明确将其标记为数据而非代码；这是一种输入清理形式，其中提供的数据被使其无害，是防止注入攻击的保障。\
  \ 用于转义内容的配置、字符和方法因语言和技术而异，因此输入验证必须作为要求记录下来，并做出适当的 design 决策以实现它。 OWASP SQL 注入备忘单提供了各种转义策略的示例：`cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html`。\n\
  \n应在 API 层实施输入验证检查，以验证传入数据是否符合预期。 语法验证强制执行数据的正确语法，例如，美国格式的电话号码应由 10 位数字组成，分组为 `nnn-nnn-nnnn`，而语义验证则强制执行正确的值；例如，“555”\
  \ 在美国电话系统中不是有效的区号，应被拒绝为无效电话号码。 相比之下，津巴布韦的电话号码应由适当的区号、前缀号码和用户号码组成，例如 `(027) 2317555`，这需要不同的应用程序逻辑来执行语义验证。\n\
  \n执行语法和语义验证可以帮助避免因意外值导致的数据完整性问题和不想要的系统行为，而语义验证还可以帮助识别诸如 `Last_Name` 字段中期望简单文本字符串却出现\
  \ SQL 语句等不想要的内容。\n\n\n\n不幸的是，语义验证极其困难，因为人类语言的各种组合使得编写所需的检查规则变得困难。例如，`'` 字符在 SQL\
  \ 中具有特殊含义，可能是姓名字段中不需要的字符，但拒绝它会导致像 O'Brian 这样的常见姓名被拒绝。因此，转义内容被认为是对注入攻击的更好保护，而语义验证通常更有利于数据完整性。OWASP\
  \ 输入验证备忘单提供了关于验证策略的全面资源：`cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html`。\n\
  \n### 资源保护\nAPI 必须以与用户访问管理相同的严格程度进行设计，以确保所暴露的功能无法被利用来攻击系统的保密性、完整性或可用性。这是安全问题的一个广泛类别，但由于\
  \ API 通常是为系统间通信或特权访问而设计的，并且在威胁建模期间没有考虑其被用于攻击的可能性，因此经常被忽视。\n\n以 Facebook 开发者 API\
  \ 为例，它提供了一个“View As”功能，旨在让开发者以特定用户的身份查看 Facebook 个人资料。API 不仅显示个人资料，还提供了用户身份验证令牌，这使得黑客能够使用该用户的凭据访问\
  \ Facebook。由于开发者被视为受信任的用户，显然应用于测试此功能严格程度不足，或者假设非开发者无法访问该功能进行恶意使用。Facebook 此后已更改此\
  \ API 的行为以防止这种非预期行为。\n\n### 保护通信\nWeb 应用和其他通信实现了 TLS 等保护以在传输中加密数据，API 访问也应如此。幸运的是，加密具有多重用途——基于对称密钥的身份验证不仅可以验证用户的身份，还可以提供传输中数据的保护，基于证书的身份验证也可以做到这一点，其中公钥可用于加密数据或会话密钥。REST\
  \ API 使用标准 Web 协议是一个优势，因为它们只需很少的开发工作即可使用 HTTPS。所需的通信安全级别当然应由数据的敏感级别驱动——公开数据可能只需要完整性验证，而高度敏感的信息应实施强加密以确保保密性和哈希以确保完整性。\n\
  \n### 密码学\n密码学在 第 3 域 中有详细介绍，可用于多种安全功能。作为一般最佳实践，受信任、经过测试或验证的密码学模块优于自定义构建的密码学。当应用于\
  \ API 时，密码学可以提供以下功能：\n* **保密性：** 如前所述，可以根据系统要求使用对称密钥和非对称密钥。必须做出的一项关键设计选择是何时加密数据，因为它可以在传输前加密或利用安全通信通道。\n\
  * **完整性：** 每当需要验证通过 API 接收的数据的完整性时，都应应用哈希函数。\n* **真实性：** 证明数据的真实性通常依赖于证明通信双方是合法的发送方和接收方。诸如哈希消息认证码（HMAC）之类的策略可用于验证通信伙伴是否仍为预期方。\n\
  * **不可否认性：** 证明数据的来源或系统参与者的身份取决于识别密钥材料的持有者。例如，如果 Alice 可以使用仅与 Bob 共享的密钥或 Bob 的公钥非对称密钥解密数据，她可以可靠地假设\
  \ Bob 发送了相关数据。\n* **访问控制：** 访问加密数据依赖于解密它，因此，通过扩展，控制对密钥的访问就控制了对数据的访问。对于对称密钥而言，这涉及实施加密密钥的安全分发和管理机制。对于非对称加密而言，这涉及选择用于加密数据的密钥。使用发送方的私钥将允许任何人使用相应的公钥解密数据，这证明了真实性但不提供保密性。使用接收方的公钥加密数据可提供保密性，因为只有接收方的私钥可以解密它，但由于公钥广泛可用，因此无法证明发送方的身份。\n\
  \n### 安全日志记录、监控和警报\n通过 API 执行的系统操作必须是日志记录和监控策略的一部分，以验证通过 API 的系统使用是否符合安全要求。需要记录的操作可能包括\
  \ API 消费者身份验证的成功或失败、针对提供数据的输入验证结果，以及包括发送方 IP 地址和时间戳在内的 API 连接详情。应记录的事件应由系统对运营和安全监控的要求决定。主要的云服务提供商提供\
  \ API 网关，可提供安全和监控托管在 CSP 基础设施上的自定义开发 API 的功能，包括记录访问并将日志转发到客户的 SIEM。\n\n日志只有在被审查后才有意义，因此它们必须由人员审查或根据组织的监控策略和资源摄取到\
  \ SIEM 等日志监控工具中以自动化该过程。违反安全约束或表明运营问题的事件应生成警报以启动事件响应等流程进行调查。在可能的情况下，应将来自多个来源的日志数据关联起来，为调查人员提供事件的整体视图，例如显示流量的网络设备日志、显示\
  \ API 访问和使用的应用程序日志，甚至可能包括外部数据，例如已知恶意 IP 地址，可用于确定安全事件是否为恶意攻击。\n\n### API 安全测试\n与所有系统功能一样，API\
  \ 必须经过测试以验证其是否满足安全、性能和用户要求。 第 6 域 中介绍的所有测试方法和注意事项均适用于 API，例如根据 API 的风险概况设计具有适当深度和覆盖范围的测试策略。用于在部门之间交换财务数据且没有任何公共访问的内部\
  \ API，不应在进行功能测试以确保适当数据完整性之前安排渗透测试，因为完整性风险大于保密性泄露风险。\n\n有许多 API 安全工具可用于设计和测试 API。工具和相关测试策略的选择应由所使用的技术驱动，例如\
  \ SOAP 或 REST、API 处理的数据的敏感级别以及 API 暴露的功能。OWASP 还拥有一个专门的 API 安全项目，其中包含资源，例如安全十大和计划中的\
  \ API 安全备忘单，可在 `owasp.org/www-project-api-security` 获取。\n\n## 安全编码实践\n\n\n\n# 安全编码实践\n\
  \n安全编码实践涵盖软件和系统开发过程中采取的全部行动。 不存在、组织混乱或理解不足的组织实践往往会产生存在缺陷或漏洞的软件和系统，而这些缺陷或漏洞进而成为弱点和漏洞。\
  \ 经过良好记录、传达给所有利益相关者并在整个组织中有效应用的标准化的安全编码实践可以提高开发项目的质量。 这导致软件和系统开发流程力求最大限度地减少缺陷和漏洞，以及旨在尽快发现和修复漏洞的测试和监控流程。\
  \ 尽管 CISSP 可能不直接参与安全编码标准的日常使用，但他们在为此类实践定义要求以及验证旨在满足这些要求的组织实践方面发挥着至关重要的作用。\n\n##\
  \ 安全软件开发标准\n\n与软件安全中的许多实践一样，存在一些备受推崇的标准，可将与安全编码和开发相关的通用知识和惯例汇集在一起。 请记住，没有任何标准能完全适用于每个组织，因此这些标准应作为起点，供组织在此基础上开发和实施自己的实践，这一过程被称为\
  \ *定制*。\n\nOWASP 项目包含大量关于安全编码实践的资源。 Cheat Sheet 系列（`owasp.org/www-project-cheat-sheets`）是一个关于安全实践指导的完整库，例如以下内容：\n\
  * 实现身份验证和访问控制\n* 防止 XSS 和注入等常见漏洞和攻击\n* 微服务、REST API 和 SAML 等技术的架构安全\n* 包括 XML、HTML5、Docker\
  \ 和 Kubernetes 在内的技术特定安全指导\n\n一个技术中立的 OWASP 安全编码实践快速参考指南（`owasp.org/www-pdf-archive/OWASP_SCP_Quick_Reference_Guide_v2.pdf`）也可用，并为一系列常见开发活动提供建议和最佳实践。\
  \ 尽管主要针对 Web 和移动应用编写，但该指导广泛适用于几乎任何应用程序和系统架构。\n\n每个类别都包含安全编码实践的关键关注领域，这些实践可用于指导开发和实施针对您独特技术栈、编程语言和安全要求量身定制的组织特定实践。\
  \ 有 13 个类别，每个类别都包含一份常见实践的检查清单，涵盖以下内容：\n* 输入验证\n* 输出编码\n* 身份验证和密码管理\n* 会话管理\n* 访问控制\n\
  * 密码学实践\n* 错误处理和日志记录\n* 通信安全\n* 系统配置\n* 数据库安全\n* 文件管理\n* 内存管理\n* 通用编码实践\n\n卡内基梅隆大学软件工程研究所（CMU\
  \ SEI）出版指南，涵盖安全编码实践和安全编码标准。 《十大安全编码实践》，实际上包含两个额外实践，是一套非常高层次的实施安全编码的原则，如使用输入验证并遵循“保持简单”规则。\
  \ 《编码标准》是一套出版物，旨在为特定语言（包括 C/C++、Android 和 Perl）提供安全软件开发的标准。 虽然并非完全专注于安全，但它们确实涵盖了每种语言的最佳实践，并包含一些特定于安全的指导。\
  \ 这些文档以及其他与安全编码相关的文档可在 CMU SEI CERT 安全编码 wiki 上找到，网址为 `wiki.sei.cmu.edu/confluence/display/seccode/SEI+CERT+Coding+Standards`。\n\
  \n## 教育与文化\n\n仅靠文档不足以解决安全问题；组织中所有成员的日常活动必须遵循政策、标准和程序中规定的指导。 这是构建安全文化的精髓，在这种文化中，所有利益相关者都理解、支持并积极开展安全工作，并且必须在整个组织中广泛采用，因为网络安全是一门广泛的学科，是依赖数据和信息系统的任何流程的基础。\
  \ 构建安全文化显然不仅仅涉及软件和系统开发，但鉴于其在设计安全系统中的关键作用，这些活动尤其重要。\n\n安全文化始于清晰有效的政策和其他文档，为组织成员提供对其安全角色和职责的明确指导。\
  \ 仅阅读政策文件是不够的，因为许多安全政策涉及或包含并非人人熟悉的概念。 虽然文档应清晰到足以供广泛阅读，但仍必须创建程序、指南、标准和检查清单等额外文档，为不同利益相关者提供具体指导。\
  \ 例如，描述密码构造所需熵值的政策无疑是详尽的，但组织中的大多数用户可能不知道熵是什么。 用通俗语言撰写的可接受使用政策中的密码部分，并辅以有关安全密码实践的培训、教育和意识材料，是传达这一要求的更合适方式。\
  \ 将安全目标纳入组织目标和优先事项并促进与安全的参与也是必不可少的。\n\n安全文化的一个关键要素是其所建立的原则集，而软件开发所发挥的基础性作用意味着必须考虑若干关键原则才能创建成功的安全文化。\
  \ 这些原则包括以下内容：\n* **Secure by design：** 这一原则很大程度上源于软件工程领域成熟时的范式转变，以及导致 DNS 和 SNMP\
  \ 等不安全技术的决策在现代信息安全风险的背景下被重新审视。 而不是在部署后尝试事后补救安全，该原则倡导的实践要求在系统的初始阶段——设计阶段——就纳入安全。\
  \ 预期系统将受到攻击会推动设计和实施决策，提供固有的安全能力，而非依赖更昂贵且容易出错的补偿性控制措施。\n* **Secure by default：**\
  \ 这一原则是一系列提供更安全软件的最佳实践的集合，例如包含分层安全控制和为安全而设计的保守默认设置。 许多数据泄露共享的根本原因是不当保护的云存储服务将数据暴露给公众。\
  \ 在默认安全配置中，这些服务应默认私有，并需要额外步骤才能打开公共访问。\n* **DevSecOps：** 虽然严格来说不是安全原则，但 DevSecOps\
  \ 的基础思想之一是将安全“左移”——换句话说，将安全活动推向软件开发生命周期的更早阶段，而不是在系统构建和部署后才制定安全策略。 在组织中实施 DevSecOps\
  \ 从根本上说是一个建立安全文化并提供更高质量软件的机会。\n\n\n\n### 构建安全：\nSAMM 和 BSIMM 在本章前面已有讨论，它们代表了一套可用于推动企业向安全文化转变的实践和原则。成熟度模型通过提供组织当前状态的便捷度量、跟踪向期望未来状态进展的指标，以及一套用于提升安全软件开发能力的实践来实现这一目标。\n\
  \n### 软件定义安全\n技术世界正在迅速演进为软件定义的替代方案，以取代过去需要物理硬件和软件结合的系统。例如，软件定义网络（SDN）将物理网络设备和软件配置抽象为纯软件可配置的虚拟网络，其重新配置的难度远低于基于硬件的等价物。云服务也使用以虚拟化形式存在的软件定义基础设施，常见的服务器和网络硬件等基础设施元素被更灵活的纯软件等价物所取代。\n\
  \n软件定义安全，有时缩写为 SDS 或 SDSec，反映了这一趋势，用于创建虚拟化、软件控制的安全基础设施。它扩展了诸如通过定义文件进行虚拟化基础设施配置的概念，以及利用\
  \ SDN 提供网络功能、路由和保护机制的便捷重新配置。安全功能的配置、监控和管理可以通过软件配置进行大量自动化和控制，从而取代过去手动、由人工驱动的流程。部署\
  \ SDS 代表了安全架构的演进，以支持更有针对性和更灵活的控制。它还考虑了由于云计算中出现的新服务而摒弃传统设计的新应用和系统架构。\n\n例如，考虑一个传统的三层应用：Web\
  \ 服务器、业务逻辑服务器和数据库服务器。每个服务器都安装了传统的安​​全工具，如反恶意软件、文件完整性监控、IDS/IPS 等，并且托管在具有防火墙等传统边界控制的数据中心中。相比之下，现代应用可能包含一个向用户提供基于浏览器的应用的\
  \ Web 服务器，其操作会触发对一组微服务的 API 调用以执行特定任务，如处理数据，而这些微服务又会向云托管数据库发出 API 调用。所有这些系统元素都地理分散且配置为高可用，因此用户请求可能在世界各地的数据中心处理，使用不同的硬件和软件配置。没有传统的边界，业务逻辑和数据库无法使用传统工具进行监控。微服务不存在于传统服务器上，云托管的数据库服务器也不在组织安全计划的管辖范围内。\n\
  \n在此新范式中，SDS 可以实现多项安全目标，并提供若干重要优势：\n* **增强可用性：** 实施安全控制需要一定的确定性；例如，部署防火墙要求从业者知道数据将在两点之间流动，并且防火墙放置在中间。如果使用不同的通信通道，防火墙的保护就会失效。动态且地理分布的云应用使传统安全难以完成此任务，但\
  \ SDS 范式可确保安全控制跟随数据。软件定义文件易于移植，因此可以确保新虚拟服务器无论其位置如何都具有相同的配置和保护。安全工具灵活性的提高使组织能够利用云环境中的高可用性。\n\
  * **基础设施中立性：** 安全控制通常需要具有系统特定配置和管理知识的管理员。SDS 允许通用定义根据底层系统进行解释并使流程自动化。例如，“AES 且最小密钥长度为\
  \ 256 位”的加密设置可以由虚拟化服务器解释并适当应用于所有新服务器，而与部署的主机操作系统无关。这类似于解释型代码范式，允许一次编写，到处运行的可移植性。SDS\
  \ 定义还支持更高的配置可靠性和安全策略的一致应用，类似于使用标准配置文件而不是依赖手动构建流程。\n* **微目标定位：** 安全工具通常比较粗放，缺乏执行控制所需的足够粒度，这需要权衡或补偿控制。这在网络分段中尤为明显，网络分段在\
  \ 第 4 域，“通信和网络安全”中有所介绍，而 SDN 启用的微分段解决了这一问题。与其在保护单个主机和网络管理开销之间取得平衡，单个主机可根据目的驱动的模板自动接收适当的防火墙规则。其他安全工具的部署和配置也可以类似地自动化，例如根据服务器功能配置适当的\
  \ IDS 规则，或根据系统应用的分类标签配置加密。此粒度避免了管理开销与控制粒度不足之间的权衡。\n* **集中管理：** 许多安全工具是平台或技术特定的，并且往往沿着这些线路形成孤岛。SDS\
  \ 通过将安全控制细节从基础设施和相关管理工具中抽象出来，实现集中管理和监督。SDS 使安全从业者能够看到访问控制策略和控制实施的 consolidated 视图，而系统管理员仍可在\
  \ Active Directory 或 LDAP 服务器等系统特定工具中执行其任务。\n* **标准化、集成和自动化：** 标准化与集成是实现此处讨论的 SDS\
  \ 功能的关键。定义文件以 YAML 等标准格式编写，YAML 另可解释为 Yet Another Markup Language 或递归的 YAML Ain't\
  \ Markup Language。这些文件可由各种云提供商、系统或平台解释，以强制执行适用于基础设施的所需安全配置。这种标准化，加上基础设施与安全组件（如云服务和\
  \ SOAR 工具）之间的集成，使安全控制的自动部署、执行和重新配置成为可能。\n* **动态响应：** 安全控制可以主动降低风险发生的可能性，或在风险实现后被动降低其影响。SDS\
  \ 结合并扩展了 SOAR 的自动化能力，以实现更快的响应时间。限制攻击者从被入侵服务器横向移动到其他主机的 时间，可降低其成功进行恶意活动的机会。动态响应利用重新配置虚拟化软件基础设施的便捷性来加快响应速度，而编排和自动化能力的使用意味着可将事件的情报用于自动向其他主机和系统部署主动缓解措施。具有这些能力的工具通常被描述为自愈，但需要注意的是，安全从业者仍必须保持警惕并手动执行某些操作。\n\
  \n\n\n\n正如云服务提供商让企业级基础设施面向更广泛的受众可用一样，SDS 能够为资源有限的组织提供更强大的安全能力。与通用系统和平台的集成以及自动化相结合，减少了时间和安全从业人员资源的需求，并可释放现有人员专注于其他问题。SDS\
  \ 在某些情况下可能是唯一的选择，例如传统安全工具与微服务等新型架构和技术不兼容，或无法部署软件代理进行监控的情况。微软发布了一份文件，概述了其从传统基于边界的安全和传统工具向\
  \ SDS 转型的过程。这一变化部分由向云优先的 IT 基础设施转型驱动，该文件阐述了变化背后的战略；可在此处阅读：`microsoft.com/en-us/itshowcase/designing-a-software-defined-strategy-for-securing-the-microsoft-network`。\n\
  \n# 摘要\n软件开发安全是现代信息安全的基石，因为信息系统在很大程度上依赖于软件。不幸的是，它也因其重要性认识较晚而受到一定挑战，相较于软件工程领域而言如此，而且还因过于常见的优先考虑交付功能或解决运营问题而非安全性的做法。\n\
  软件开发是一项复杂活动，新增需求并不总是受欢迎。然而，在开发信息系统时忽视安全不会带来积极结果，因此与所有安全问题一样，从业人员必须在与安全开发实践、测试和评估相关的成本与收益之间，以及将安全工具集成到开发者实践和环境中的成本与收益之间取得谨慎平衡。\n\
  软件开发领域可用的主动风险缓解措施包括记录安全编码标准和指南、实施成熟度模型以提升组织的安全开发能力，以及实施 DevSecOps 和 SOAR 等实践以提供自动化和效率提升。需要考虑的被动风险缓解措施包括设计和执行适当的日志记录和监控策略，以及旨在检测和纠正漏洞的评估和测试计划。\n\
  不期望安全从业人员是软件开发者。然而，鉴于软件在现代信息系统中发挥的关键作用，了解软件的工程和开发过程以及为缓解不安全软件带来的风险所需采取的适当控制措施至关重要。\n\

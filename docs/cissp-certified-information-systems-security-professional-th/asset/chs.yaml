  \n### 内容分发网络\n\n内容分发网络（CDN），也称为 *内容交付网络*，是一组地理分布的资源服务、代理服务器和数据中心。这种架构模型的本质是提供低延迟、高性能和高可用性的内容，尤其是在大范围（通常是国家或大陆）内的多媒体、电子商务和社交网络网站。内容尽可能靠近请求客户获取，从而实现更低的延迟和更大的吞吐量。\n\
  \nCDN 内容分布在许多数据主机中，而不是集中在一个位置。虽然这对可用性有积极影响，因为内容分发降低了任何一个位置离线的\n\nOrganizations concerned\
  \ with regulatory compliance must also be mindful of how content distribution affects\
  \ their compliance requirements. Many CDNs provide licensed access to content through\
  \ a variety of subscriptions or fees for service models, and protecting that licensed\
  \ content as well as ensuring its legal crossing of borders can be an issue. Naturally,\
  \ as data is stored or processed across multiple jurisdictions, the CDN and its\
  \ users must be aware of how local regulations affect their business and their customers.\n\
  \n## SECURE NETWORK COMPONENTS\n\nOne of the most foundational concepts that you\
  \ must understand, as a security professional, is how to securely operate and maintain\
  \ network components. This section begins with an introduction to the key concepts\
  \ associated with operating network hardware, followed by coverage of network transmission\
  \ media and network components (such as firewalls, routers, and switches), ending\
  \ with some foundational coverage of endpoint security. As a CISSP, you should have\
  \ a general understanding of security concepts related to different types of network\
  \ components, and this section covers those topics.\n\n### Operation of Hardware\n\
  \nNetwork hardware, such as routers, switches, and firewalls (all discussed in the\
  \ following sections) must be securely implemented, operated, and maintained. Secure\
  \ and proper operation of network hardware includes the following concepts:\n\n\
  * **Standards, policies, and procedures:** Your organization should establish standards\
  \ that document a secure baseline for your hardware devices, policies that guide\
  \ how you operate and manage these devices, and procedures that formalize routine\
  \ operation processes to support consistent device management.\n\n* **Training:**\
  \ Network administrators and other personnel who manage or operate hardware should\
  \ be trained on proper and secure operation, before they receive access to such\
  \ devices and on a routine basis (e.g., annually).\n\n\n\n\n\n**变更管理：** 配置、补丁和其他变更应得到妥善记录，并遵循贵组织标准的变更管理流程。\n\
  \n**冗余电源：** 应为关键网络基础设施部署冗余电源，以确保在发生故障时仍可提供可用性。\n\n**监控：** 应监控网络设备是否存在故障、异常或其他与安全相关的事件。\n\
  \n**保修和支持：** 贵组织应为所有网络设备保持当前且有效的保修，以在系统出现故障时提供保障。必要时，应能够获得厂商或第三方支持以帮助排查常见或罕见的硬件问题。\n\
  \n您可能熟悉几种网络设备，本节其余部分将介绍其中的关键设备。首先，有必要为几个关键网络术语建立工作定义：数据冲突、广播域和冲突域。\n\n* *数据冲突* 会发生如果两个系统同时传输，尝试同时使用网络介质，其效果是其中一个或两个消息可能被损坏。\n\
  * *广播域* 是计算机网络的逻辑划分，其中所有节点都可以通过数据链路层（第 2 层）广播相互到达。广播源自该组中的一个系统，并发送到该组内的所有其他系统。\n\
  * *冲突域* 由使用共享介质连接的所有设备组成，在这些设备之间随时可能发生冲突。\n\n就 OSI 模型而言，冲突域是通过使用任何数据链路层（第 2 层）或更高层设备来划分的，而广播域是通过使用任何网络层（第\
  \ 3 层）或更高层设备来划分的。当域被划分时，这意味着部署设备两侧的系统属于不同的域。\n\n#### 防火墙\n\n防火墙用于防止未经授权的数据从网络的一个区域流向另一个区域。防火墙创建的边界可能在私有网络与互联网之间，也可能在私有网络的两个部分之间。无论如何，防火墙都会创建边界，并用于防止或允许流量跨越该边界。\n\
  \n防火墙的功能可以通过软件、硬件或两者来实现。进入和离开私有网络或内部段的数据必须通过防火墙。防火墙检查并检查每个数据包，并阻止不符合指定安全标准的数据包。这些活动以及其他一些网络事件会被记录在防火墙日志中。日志的审查和审计是安全专业人员用于事件检测和响应、取证分析以及改进安全资产性能的极其有价值的安全流程。\n\
  \n术语 *防火墙* 的使用是因为网络版本的功能类似于物理结构中的防火墙。建筑物中的防火墙是一种旨在防止或延缓实际火灾蔓延的屏障。然而，与完全抑制火灾的建筑防火墙不同，网络环境中的防火墙旨在允许经批准的流量在两个环境之间传输，并防止未经授权或不需要的流量，或用户和实体的尝试在环境之间传输。\n\
  \n对于网络 perimeter，防火墙被视为整体分层安全架构的一部分的第一道防线。在其他地方，如前所述，防火墙用于为任何区域建立边界，并分隔和控制跨越该边界的流量流。它们是网络的基础，也是保护信息系统和网络最普遍使用的安全技术之一。就安全尽职调查而言，防火墙是必不可少的。然而，仅靠防火墙是不够的。例如，它们不提供身份验证功能。还需要其他类型的设备和技术来补充防火墙。如果没有安全组合中的其他设备和技术，防火墙就会成为单点故障。\n\
  \n防火墙需要配置和人工管理，这就是为什么安全专业人员必须了解如何最好地使用它们的原因。它们不会自动提供好处。除了可能发现的任何技术漏洞外，防火墙管理中的配置和监督有助于减轻人为错误和错误配置的风险。安全专业人员必须配置定义允许流量的过滤规则。\n\
  \n同样重要的是防火墙在故障时的行为。如果防火墙停止正常运行（例如，如果它不堪重负），那么防火墙应最佳地“关闭”失败；这意味着防火墙不应允许 *任何* 数据包通过。为了确保规则保持不变，防火墙必须受到未经授权更改的保护，并且配置必须随着时间的推移保持最新。与任何其他设备或端点一样，防火墙也存在需要修补的漏洞，安全专业人员还监督防火墙的修补和升级程序。\n\
  \n安全专业人员最重要的角色之一是使用防火墙生成的活动日志。日志应分析多种类型的事件。以下是一些示例：\n\n* 防火墙的重新启动或重启\n* 启动失败或设备崩溃\n\
  * 防火墙配置文件更改\n* 防火墙运行时配置或系统错误\n* 端口上异常的访问探测\n* 设备上登录不成功\n\n除了防火墙在网络上的位置外，它们处理和询问数据的方式也区分了防火墙类型。这里也适用纵深防御原则。没有一种防火墙类型单独足够；几乎总是需要组合使用。\n\
  \n除了存在的各种传统防火墙外，还有最近的下一代防火墙。还有特殊防火墙，如多宿主和堡垒防火墙。以下各节将探讨这些防火墙以及防火墙部署架构。\n\n#### 防火墙类型\n\
  \n防火墙有四种基本类型：\n\n* 静态数据包过滤防火墙\n* 应用级防火墙\n* 状态检测防火墙\n* 电路级防火墙\n\n所有四种防火墙类型之间的关键区别在于它们在\
  \ OSI 模型层上的运行位置。\n\n##### 静态数据包过滤防火墙\n\n第一种，静态数据包过滤防火墙，是最早也是最简单的防火墙设计。也称为 *筛选路由器*，数据包过滤防火墙是最快的设计。在\
  \ OSI 模型的网络层（第 3 层）运行，它检查每个数据包。如果数据包违反了既定规则，则数据包将被丢弃和/或记录。能够最快速工作，数据包过滤防火墙将减轻特定数据包类型的风险。此类防火墙不提供身份验证机制，并且容易受到欺骗攻击。\n\
  \n##### 应用级防火墙\n\n应用级防火墙检查数据包和网络流量，其审查程度远高于数据包过滤防火墙。在 OSI 模型的高层应用层（第 7 层）运行，应用级防火墙试图识别何种类型的应用流量想要跨越边界。常被用作终端用户与外部网络之间的分隔，应用级防火墙充当代理。深度检查需要时间，使这种防火墙成为所有类型中最慢的。\n\
  \n##### 状态检测防火墙\n\n\n\n\n\n状态检测防火墙与简单的数据包过滤防火墙相比有一个主要的区别因素：状态检测防火墙会监控网络连接的状态。该防火墙在\
  \ OSI 模型的网络层和传输层（分别为第 3 层和第 4 层）运行。连接状态基于 `TCP` 的工作方式以及 `TCP` 通过本章前面讨论的三次握手建立会话的方式。该状态会被跟踪，并且其他连接属性（如目标和源详细信息）会暂时保存在内存中。随着时间的推移，这些详细信息用于智能地应用过滤。\n\
  \n### 电路级防火墙\n\n电路级防火墙在功能上简单高效，其工作方式最类似于状态检测防火墙。主要区别在于该防火墙仅在 OSI 模型的会话层（第 5 层）工作。对于电路级防火墙，唯一任务是确保\
  \ `TCP` 握手已完成。不会检查任何实际数据包，也不会丢弃任何单个数据包。通过电路级防火墙的流量看起来像是源自网关，因为电路级防火墙的最大好处是验证会话，同时隐藏有关受保护网络的任何细节。\n\
  \n### 下一代防火墙\n\n前面四种防火墙类型代表了从最早到最成熟的防火墙技术的跨度。但还有下一代防火墙，通常被称为 *下一代防火墙* (`NGFW`)。`NGFW`\
  \ 将前面四种传统功能与入侵检测系统 (`IDS`) 或入侵防御系统 (`IPS`) 等其他基于网络的安全设备的高级功能相结合。在 OSI 模型的上下文中，下一代防火墙在多个层级运行。\n\
  \n#### 多宿主防火墙\n\n多宿主描述了防火墙具有两个或多个网络接口。这些防火墙使用一组软件定义规则来确定什么流量可以在其连接的网络之间通过，从而最大限度地降低数据在两个网络之间意外交换的风险。\n\
  \n#### Bastion Host/屏蔽主机\n\n堡垒主机因此得名，因为它类似于中世纪用作城堡入口第一层保护警卫室的结构。在计算中，*堡垒主机* 是一种特殊用途的防火墙或主机计算机，逻辑上位于核心网络路由设备的服务之后或\
  \ DMZ 中。该路由器将内部私有网络与不可信网络隔离开来，后者可以是互联网。\n\n术语 *堡垒主机* 和 *屏蔽主机* 可互换使用。它们有时也被称为 *跳板主机*（或\
  \ *跳板机*）。它们充当代理，作为唯一可从外部源访问的设备。堡垒主机通过隐藏内部节点的身份来增加一层保护。\n\n堡垒主机将具有有限数量的应用程序，通常只有一个，以限制主机被攻破的可能影响。最常见的是，该应用程序是代理服务器，用于促进服务并通过堡垒主机封装数据。\n\
  \n#### 防火墙部署架构\n\n屏蔽子网是堡垒主机的组合。基本架构明确区分公共和私有段。在私有内联网中，本地计算机和系统位于保护设备或应用程序之后，使其免受公共访问。在另一个段，公共服务如\
  \ Web 服务器和代理服务器是可访问的。子网有助于提高安全性，并且可以提高数据吞吐量性能。\n\n在当今复杂的计算环境中，单台防火墙位于不可信网络和私有网络之间几乎总是不足够的。对于连接到路由器的防火墙以将流量引导到互联网，存在一些基本实现。然而，最佳实践是消除对单一防火墙的依赖。\n\
  \n为了在子网之间以及在外部与不可信网络之间提高保护，组织会组合使用多个防火墙。Figure 4.8 说明了在私有 LAN 的不同网络层级部署防火墙的混合部署示例。\n\
  \n![FIGURE 4.8 Multiple firewall deployment architecture](img/c04f008.png`)\n\n\
  **FIGURE 4.8 Multiple firewall deployment architecture**\n\n今天，传统的防火墙模型不再是曾经坚不可摧的解决方案。云服务对典型的防火墙架构产生了颠覆。虽然防火墙模型和架构已经存在多年，但云服务现在很常见，企业对云的依赖决定了受保护的网络流量如何通过公共互联网传输。一个解决方案是使用亚马逊网络服务\
  \ (`AWS`) 所称的 *安全组*。虚拟私有云 (`VPC`) 安全组充当您的亚马逊弹性计算云 (`Amazon EC2`) 实例的虚拟状态防火墙，以控制入站和出站流量。\n\
  \n另一种方法是提供防火墙即服务 (`FWaaS`)，就像 CSP 提供软件即服务 (`SaaS`) 一样。使用 `FWaaS`，过滤或筛选数据包是在虚拟和异地完成的。`FWaaS`\
  \ 显然需要比平均水平更多的对 CSP 的信任，但其好处包括在更新、配置和执行您约定的规则和策略方面的专用管理。\n\n`SDN` 也对传统防火墙架构造成了破坏。`SDN`\
  \ 使网络管理更具灵活性。这在很大程度上被视为网络工程师的一项功能和优势。然而，`SDN` 也使维护防火墙要求更具流动性，这可能是一个缺点。同样，`SDN` 和云服务极大地影响了防火墙服务可以如何实现，如果您的组织使用它们，您应该花时间了解这些服务的工作方式。\n\
  \n### 中继器、集中器和放大器\n\n中继器、集中器和放大器在物理层（第 1 层）运行。这些简单设备用于延长信号在特定介质类型上可以传输的最大长度。它们连接使用相同协议的网络段，并用于连接属于同一冲突域或广播域的系统。\n\
  \n### 集线器\n\n集线器，也称为多端口中继器，是一种物理层（第 1 层）技术。它们仅与使用相同协议、在同一域中的互连系统一起工作。它们只是将入站流量在所有出站端口上重复，使设备表现得像一个单一的网络段。由于它们几乎没有与安全相关的能力，它们通常在组织中被禁止，并被交换机取代。集线器主要是遗留技术，现代用途很少。\n\
  \n### 网桥\n\n网桥在数据链路层（第 2 层）运行。网桥将流量从一个网络转发到另一个网络。与仅转发接收信号的中继器不同，网桥基于对 MAC 地址的了解来定向信号。如果网络使用相同的协议，即使网络在拓扑、布线类型和速度上不同，也可以使用网桥。缓冲区用于存储数据包，使用存储转发功能，直到数据包可以释放，如果网络速度不同。网桥两侧的系统属于同一广播域，但在不同的冲突域中。\n\
  \n一些网桥使用生成树算法 (`STA`) 来防止网桥在无休止的循环中转发流量，这可能导致广播风暴。`STAs` 是网桥防止环路、建立单台网桥故障情况下的冗余路径、唯一标识网桥、分配网桥优先级以及计算每个路径的行政成本的智能能力。\n\
  \n### 交换机\n\n\n\n\n\n为了克服使用集线器的弱点，交换机是更好的选择。交换机是一种智能集线器，主要在数据链路层（`layer 2`）运行，这意味着交换机处理同一广播域但不同冲突域中的系统。然而，具有路由功能的交换机可以在网络层（`layer\
  \ 3`）运行，提供两者处于不同的广播域和冲突域。\n\n交换机能够为目标系统提供一定程度的寻址智能，可以甄别并仅将流量转发给需要接收的设备。交换机还提供高效的流量传输，创建单独的冲突域，并在各段使用相同协议时提高数据的整体吞吐量。\n\
  \n当交换机用于创建 VLAN 时，可以创建单独的广播域。交换机将网络分割为 VLAN，广播在 VLAN 内处理。为了允许 VLAN 之间的流量，必须实现路由器；交换机无法完成这种分发。\n\
  \n交换机提供其他设备无法提供的网络安全服务。它们会更深入地检查数据包并做出细粒度的流量分发决策。通过建立和管理 VLAN，交换机有助于使攻击者窃听网络流量变得更加困难。广播和冲突信息被包含在内，因此有价值的网络流量不会在网络中持续传输。\n\
  \n### Routers\n\n路由器是网络层（`layer 3`）设备。路由器使用相同协议连接独立的网络，其中数据包从第一个网络的一个主机传入，路由器检查数据包头中的\
  \ IP 地址信息并确定目的地和最佳路径。路由器能够根据速度、跳数、偏好和其他指标的计算，决定数据包传输的最佳逻辑路径。路由器具有编程的路由表或路由策略。这些表可以静态定义或手动配置。路由表创建和管理的另一种方式是通过自适应路由进行动态管理。路由器在处理数据时能够确定如何最好地转发数据。路由器可以根据互联网络中通信路径的最新状况，为给定目的地选择并使用不同的路由。当节点出现临时中断时，路由器可以绕过故障节点并使用其他路径。\n\
  \n如前所述，存在众多动态路由协议，包括 `BGP`、`OSPF` 和 `RIP`。应注意，静态路由和动态路由最好一起使用。有时动态路由信息无法交换，静态路由用作备份。路由器两侧的系统属于不同的广播域和不同的冲突域。\n\
  \n### Gateways\n\n网关设备的一个重要功能是连接使用不同网络协议的网络。它们可能是硬件设备或软件应用程序，并在应用层（`layer 7`）运行，但可以说也在表示层（`layer\
  \ 6`，格式在此改变）运行。网关设备将一个网络的数据流格式转换为第二个网络可用的兼容格式。正因为此功能，网关也被称为协议转换器。另一个区别是，网关连接处于不同广播域和冲突域的系统。网关有多种类型，包括数据、邮件、应用、安全和互联网。网关在从云托管的虚拟网络过渡到物理世界（或本地）系统时也很常用。\n\
  \n### Proxies\n\n代理是一种网关形式，充当网络的调解器、过滤器、缓存服务器，甚至地址转换服务器。然而，它们不会在协议之间进行转换。代理代表另一系统执行功能或请求服务，并连接使用相同协议的网络段。\n\
  \n代理的常见用途是充当 NAT 服务器。`NAT` 为私有网络客户端提供对互联网的访问，同时保护这些客户端的身份。当收到响应时，代理服务器通过查看其映射来确定其目标客户端，然后将数据包发送给客户端。`NAT`\
  \ 允许为私有网络内部流量使用一组 IP 地址，为外部流量使用另一组 IP 地址。\n\n代理可以通过将网络结构对外部方保密来帮助维护组织内部网络的安全。它们还可以帮助匿名化网络流量，从而支持保密性和隐私性。由于其作为安全设备的作用以及其在网络中的典型位置（即在两个不同安全级别区域之间），维护代理服务器的安全性（例如通过系统加固和强访问控制）至关重要。\n\
  \n#### LAN Extenders\n\nLAN 扩展器是一种多层交换机，用于将网络段扩展到 `IEEE 802.3` 标准对特定电缆类型规定的距离限制之外。它也可以作为\
  \ WAN 交换机、WAN 路由器、中继器或放大器实现。\n\n#### Wireless Access Points\n\n`WAPs` 在数据链路层（`layer\
  \ 2`）运行。无线路由器在网络中与有线路由器类似，也会询问并确定接收到的数据包的路径和目的地。无线路由器还充当集成网络中进入无线网络或有线网络的接入点。然而，无线路由器的实用性在于其允许便携式终端（例如笔记本电脑、膝上型电脑和智能手机）访问网络。无线路由器可以在多频段配置中同时在\
  \ 2.4 GHz 和 5 GHz 频段运行，并在 2.4 GHz 频段提供超过 300 Mbps 的数据传输速率，在 5 GHz 频段提供 450 Mbps\
  \ 的数据传输速率。`WAPs` 在本章前面的“无线网络”部分及其子部分中已详细讨论。\n\n### Transmission Media\n\n保护网络不仅仅是实施硬件设备和软件应用程序。在本节中，我们讨论连接各种网络中各个节点的物理介质。\n\
  \n#### Local Area Network Technologies\n\n最广泛使用的局域网技术是 Ethernet 和使用 `IEEE 802.11`\
  \ 的无线局域网。作为一名安全专业人员，您应集中精力理解它们。局域网技术之间的差异存在于数据链路层及以下。\n\n##### Ethernet\n\nEthernet\
  \ 基于 `IEEE 802.3` 标准，是使用最广泛的局域网技术。它之所以如此流行，是因为它允许低成本的网络实施，并且易于理解、实施和维护。Ethernet\
  \ 也适用于各种网络拓扑，具有灵活性和适用性。它最常采用星型或总线拓扑部署。Ethernet 的另一个优势是它可以使用双绞线缆支持双向全双工通信。Ethernet\
  \ 在 OSI 模型的两个层中运行，即物理层（`layer 1`）和数据链路层（`layer 2`）。Ethernet 的协议数据单元是帧。\n\nEthernet\
  \ 是一种共享介质或广播局域网技术。需要提醒的是，广播域和冲突域已在本章前面介绍并定义。作为快速复习，Ethernet 作为广播技术允许众多设备通过同一介质通信。Ethernet\
  \ 支持连接的网络设备固有的冲突检测和避免。Ethernet 局域网的设计具有网络节点和互连介质或链路。\n\nEthernet 按数据传输速率和距离分类。光纤和双绞线缆上的一些操作数据速率如下：\n\
  \n* `Fast Ethernet`: Fast Ethernet 指的是能够以 100 Mbps 的速率传输数据的 Ethernet 网络。\n\n\n\n\
  \n\n## 千兆以太网\n千兆以太网提供的数据速率为 1,000 Mbps（1 Gbps）。\n\n## 10 千兆以太网\n10 千兆以太网是最近一代，提供的数据速率为\
  \ 10 Gbps（10,000 Mbps）。它通常用于高端应用的骨干网，这些应用需要高数据速率。\n\n### 无线局域网\n无线局域网技术（Wi-Fi）遵循\
  \ IEEE 802.11 标准，并在网络操作中带来了大量的移动性和灵活性。Wi-Fi 有两种基本模式。在基础设施模式下，像笔记本电脑这样的移动 AP 通过 WAP\
  \ 或无线路由器与 AP 连接。这些连接充当进入有线专用网络或直接进入互联网连接的入口或桥梁。在自组织模式下，移动单元直接相互传输或进行点对点互连。\n\n####\
  \ 网络布线\n网络布线描述了通过一种或多种类型的物理数据传输介质连接设备、硬件或组件。存在许多类型，每种都有特定的规格和功能。网络中使用的布线取决于物理和数据要求。正确铺设网络布线很重要，因为布线故障是网络故障最常见的原因之一。例如，一些类型的网络布线有距离或跨度限制，可能无法在广阔的地理区域提供足够的数据覆盖和可用性。安全专业人员必须考虑网络电缆选择的安全影响，例如潜在对手窃听铜制网络布线与玻璃光纤相比的难易程度。\n\
  \n##### 同轴电缆\n同轴电缆，也称为 `coax`，是 1970 年代和 1980 年代广泛使用的流行网络电缆类型。在 1990 年代初期，随着双绞线布线的流行和功能，其作为数据电缆的使用迅速下降，但它仍被广泛用于模拟传输。同轴电缆有一个铜线中心芯作为内导体，周围环绕绝缘层，再环绕导电屏蔽层。有些同轴电缆还有额外的绝缘外护套或外套。\n\
  同轴电缆能够实现双向通信，因为中心铜芯和编织屏蔽层充当两个独立的导体。同轴电缆的屏蔽设计使其对电磁干扰（EMI）具有相当强的抵抗力，且不易泄漏。同轴电缆处理弱信号非常好，尤其是它可以比双绞线传输更远的距离。双绞线现在更受欢迎，只是因为它成本更低且安装更容易。同轴电缆需要使用特殊工具，即\
  \ `segment terminators`。双绞线布线不需要。同轴电缆更笨重，且最小弧半径比双绞线更大。弧半径是电缆在不损坏内部导体情况下可弯曲的最大距离。然而，弯曲同轴电缆超过最小弧度是同轴布线故障的相对常见原因。\n\
  \n##### 基带和宽带电缆\n用于标记大多数网络电缆技术的命名约定遵循 XXyyyyZZ 模式。XX 表示电缆类型提供的最大速度，例如 10Base2 电缆的\
  \ 10 Mbps。下一个字母系列 yyyy 表示它是基带还是宽带电缆，例如 10Base2 电缆的基带。大多数网络电缆都是基带电缆。然而，在特定配置下，同轴电缆可作为宽带连接使用，例如与电缆调制解调器一起使用。ZZ\
  \ 要么表示电缆可使用的最大距离，要么作为简写表示电缆的技术，例如 10Base2 电缆的大约 200 米（实际上是 185 米，但四舍五入为 200）或 T\
  \ 或 TX 表示 10Base-T 或 100Base-TX 中的双绞线。\nEMI 是处理布线时的一个关键安全影响。顾名思义，EMI 是电磁场干扰对象性能或功能的情况。EMI\
  \ 的数量或其对布线的影响自然取决于布线类型。Table 4.4 显示了最常见网络布线类型的重要特性。\n\n**TABLE 4.4 Important Characteristics\
  \ for Common Network Cabling Types**\n\n| TYPE || MAX SPEED || DISTANCE || DIFFICULTY\
  \ OF INSTALLATION || SUSCEPTIBILITY TO EMI || COST |\n| --- | --- | --- | --- |\
  \ --- | --- |\n| 10Base2 || 10 Mbps || 185 meters || Medium || Medium || Medium\
  \ |\n| --- | --- | --- | --- | --- | --- |\n| 10Base5 || 10 Mbps || 500 meters ||\
  \ High || Low || High |\n| 10Base-T (UTP) || 10 Mbps || 100 meters || Low || High\
  \ || Very Low |\n| STP || 155 Mbps || 100 meters || Medium || Medium || High |\n\
  | 100Base-T/100Base-TX || 100 Mbps || 100 meters || Low || High || Low |\n| 1000Base-T\
  \ || 1 Gbps || 100 meters || Low || High || Medium |\n| Fiber-optic || 2+ Gbps ||\
  \ 2+ kilometers || Very high || None || Very high |\n\n##### 双绞线\n如前所述，双绞线布线已成为首选，因为它与同轴电缆的笨重相比极其纤细且灵活。所有类型的双绞线均由四对缠绕在一起然后包覆在\
  \ PVC 绝缘体中的电线组成。双绞线有两种类型，屏蔽双绞线（STP）和非屏蔽双绞线（UTP）。STP 在外部护套下电线周围有一层金属箔包装。箔片可提供额外的外部\
  \ EMI 保护。UTP 缺少护套周围的箔片。UTP 最常用于指 10Base-T、100Base-T 或 1000Base-T，这些现在被认为已过时且未被使用。\n\
  UTP 和 STP 都是由成对绞合的小铜线组成的集合，这有助于防止外部无线电频率和电、磁波的干扰。该布置还减少了线对之间的干扰。这种干扰称为 `crosstalk`，发生在通过一组电线传输的数据被拉入另一组电线时，因为电信号辐射出穿透护套的电磁波。为了对抗这种情况，每对双绞线以不同的速率绞合，以每英寸的绞合数来衡量。交错的绞合可防止信号或电磁辐射从一对电线泄漏到另一对电线。\n\
  \n##### 导体\n布线基于铜线构建的原因是铜是用于传输电子信号的最佳材料之一。它也具有成本效益，并在室温下性能良好。尽管铜可以传输信号很远的距离，但金属中存在一定的电阻，因此信号强度最终会衰减。\n\
  光纤电缆为基于铜的导体网络布线提供了一种替代方案。光纤电缆传输的是光脉冲而不是电。这使光纤电缆具有极快且几乎不受窃听和干扰影响的优势。光纤电缆还可以在衰减使信号退化之前传输更长的距离。缺点是安装相对困难以及线路的初始费用。光纤提供的安全性和性能是以高昂的价格换来的。\n\
  \n##### 其他布线考虑因素\n不建议连续使用超过四个中继器。5-4-3 规则已制定出来，以指导中继器和集线器的正确使用，从而最大化电缆长度并尽可能消除衰减问题。\n\
  5-4-3 规则概述了在树形拓扑中部署中继器和集线器的策略，该拓扑具有中央集线器或主干连接各个段，类似于树的分支。在此配置中，网络上任意两个节点之间必须满足以下条件：\n\
  \n\n\n\n\n*   最多可以有五个段。\n*   段之间最多可通过四个中继器和集线器连接。\n*   这五个段中只有三个可以有额外的或其他用户、服务器或网络设备连接。\n\
  \n#### 网络拓扑\n\n计算机网络的拓扑是各种节点及其连接的结构和排列，以节点之间的链接形式表示。该模型可以描述为逻辑或物理设计。逻辑拓扑描述数据在网络上的流动方式。物理拓扑是网络各种组件的实际放置位置。物理拓扑并不总是与逻辑拓扑相同。网络的物理拓扑有四种基本变体：环形、总线、星形和网状。\n\
  \n##### 环形拓扑\n\n在环形拓扑中，设备相互连接，数据包以单向环形循环模式传输。点连接成一个圆。 图 4.9 提供了基本说明。数据一次传输一个系统，如果一个系统宕机，整个网络就会中断。一个数字令牌在圆圈中传递，以便需要发送信息的系统可以获取它。只有持有令牌的系统才能传输数据。数据发送后，令牌会随数据包一起发送。\n\
  \n环上的每个系统都在监视流量。如果系统注册为预期接收方，它会接受并读取数据。如果系统不是预期接收方，它会释放令牌和数据包到环中。预期接收方释放令牌但保留数据包。令牌再次沿环从系统到系统发送，寻找下一个需要发送数据的节点。\n\
  \n这种拓扑在今天很少使用，因为它无法扩展到大型组织。然而，在较小的网络中，环形拓扑是高效的，因为不需要中央服务器来分发流量，并且数据传输相对较快。\n\n![FIGURE\
  \ 4.9 Ring topology](img/c04f009.png)\n\n**FIGURE 4.9 Ring topology**\n\n##### 总线拓扑\n\
  \n总线拓扑中的每个节点或系统都通过单根线路或主干电缆连接。与环形拓扑不同，总线配置会发生数据冲突，因为多个系统可以同时传输。总线拓扑确实具有冲突避免能力，因为系统可以监听电缆以确定是否有流量。当系统听到流量时，它会等待。当它不再听到流量时，它会将数据释放到电缆介质上。总线拓扑上的所有系统都可以听到网络流量。非预期接收方系统只需忽略数据。总线拓扑与环形拓扑一样，具有单点故障。如果总线从一段断开，该段就会宕机。但是，在该段内，节点仍可以相互通信。\n\
  \n总线拓扑的类型有线性总线和树形总线。 图 4.10 显示了每种的基本说明。线性总线拓扑采用单根主干或主线（称为 *backbone*），所有系统都直接连接到它。树形拓扑也有主干，但有多个段连接到主干，就像树上的分支一样。总线拓扑在网络两端均已终止。该特性使总线拓扑在现代互联网络中不切实际。\n\
  \n##### 星形拓扑\n\n在星形拓扑中，连接的设备连接到一个中央流量管理设备，该设备是集线器或交换机。 图 4.11 显示了从每个设备到中央集线器或交换机的专用线路如何运行。星形拓扑的一个好处是具有段弹性；如果一条链路宕机，其余网络仍可正常运行。布线使用更高效，且损坏的电缆更容易检测和修复。\n\
  \n![FIGURE 4.10 Linear bus and tree bus topologies](img/c04f010.png)\n\n**FIGURE\
  \ 4.10 Linear bus and tree bus topologies**\n\n![FIGURE 4.11 Star topology](img/c04f011.png)\n\
  \n**FIGURE 4.11 Star topology**\n\n总线或环形拓扑的各种逻辑配置可导致星形拓扑。以太网网络可以部署为物理星形，因为它基于总线。在这种情况下，集线器或交换机设备实际上是一个逻辑总线连接设备。物理星形模式可以用多站接入单元（也称为媒体接入单元，或\
  \ MAU）实现。MAU 允许电缆段以星形部署，同时设备内部建立逻辑环形连接。\n\n##### 网状拓扑\n\n综合起来，网状拓扑是将网络上的所有系统通过多个独立路径互连。全网状拓扑的概念意味着每个系统都连接到每个其他系统。部分网状拓扑没有达到完全连接，但确实将许多系统连接到许多其他系统。\n\
  \n网状拓扑的关键优势是其提供的最大弹性级别，因为冗余连接可防止一个段或设备故障时整个网络失效。网状拓扑的关键缺点是不成比例的额外费用和管理麻烦。这在查看 图\
  \ 4.12 时可最好地理解。还值得注意的是，额外成本和管理可能会因资源紧张和网络复杂性而导致安全隐患。\n\n![FIGURE 4.12 Mesh topology](img/c04f012.png)\n\
  \n**FIGURE 4.12 Mesh topology**\n\n### 网络访问控制\n\nNAC 解决方案通过在所有用户和设备上强制执行安全策略，为内部网络基础设施提供额外的安全性。NAC\
  \ 解决方案用于统一端点安全方法（如防病毒、主机入侵防御和漏洞评估）、用户或系统身份验证以及网络安全执行。NAC 设备旨在处理包含各种设备和技术的庞大企业网络，使其在移动设备和物联网持续普及的情况下特别有用。\n\
  \n使用 NAC 有几个基本目标：\n\n*   缓解非零日攻击\n*   网络连接的身份验证和授权\n*   身份验证后基于角色的用户和设备控制\n*   使用\
  \ 802.1X 的协议（如 EAP-TLS、EAP-PEAP 或 EAP-MSCHAP）对无线和有线网络的流量进行加密（EAP、CHAP 和其他身份验证协议将在本章后面的“远程访问”部分介绍。）\n\
  *   强制执行网络策略，以防止端点在缺乏最新安全补丁或所需配置时访问网络\n*   根据设备类型和用户角色控制对网络的访问能力\n*   基于经过身份验证的用户身份进行身份和访问管理，而不是仅阻止\
  \ IP 地址\n\n当未经授权或可疑的设备或用户尝试访问网络时，配置良好的 NAC 会自动检测并立即响应以阻止访问并防止攻击。NAC 的策略应一致地应用于每个尝试连接的设备、用户或实体。有效的\
  \ NAC 策略是定义并持续改进，以更好地控制、过滤、防止、检测和响应每一次内部或外部通信。\n\n以下 NAC 概念值得记住：\n\n\n\n\n\n**入网前与入网后：**\
  \ 在入网前，终端在获得访问权限之前会被检查是否符合策略（例如，识别并阻止防病毒定义过期或缺少关键软件更新的终端或设备）。在入网后，网络访问被授予，但用户操作受到管控，并且根据是否符合网络行为规则来决定是否收回访问权限。\n\
  \n**基于代理与无代理：** 为了对终端做出决策，NAC 系统要么需要在终端上安装客户端应用程序以便在访问尝试时报告状态，要么 NAC 系统可以远程扫描并采用清单技术来确定访问决策。\n\
  \n**带外与内联：** 带外设备将分析功能与执行功能分离，并向中央控制台报告以进行管理。这种方法使用（或复用）现有的基础设施交换机、网关和防火墙来执行网络策略。一些从业者认为带外配置可能具有破坏性。内联设备位于流量流的中间，通常在接入交换机层以上，并在每个终端登录时决定是否允许或限制其流量。这些设备在过载时可能成为瓶颈。\n\
  \n**补救：** 补救是必要的，以解决阻止访问的问题（例如，更新防病毒软件）。补救有两种不同的方法：\n\n* **隔离：** 终端被限制到特定的 IP 网络或分配的\
  \ VLAN，仅提供用户路由访问特定主机和应用程序，例如补丁管理和更新服务器。\n* **人质门户：** 用户访问网站时会被拦截并重定向到一个 Web 应用程序，该应用程序引导用户完成系统补救。在补救完成之前，访问仅限于人质门户。\n\
  \n### 终端安全\n\n终端包括我们都很熟悉的笔记本电脑、台式机和服务器，但也包括移动设备、物联网设备、工业控制系统、自主移动系统、机器人等。终端检测与响应（`EDR`）的概念是正在兴起的安全解决方案类别，旨在满足对所有类型终端上高级威胁进行持续监控和响应的需求。`EDR`\
  \ 通过持续监控终端和网络事件并分析这些事件来检测、调查和响应可疑活动。\n\n终端安全是一道重要的防线，无论设备是持续连接到网络，如服务器，还是间歇性连接，如移动设备，都很重要。让受感染或可疑的终端远离网络是合理的。允许易受攻击或已损坏的设备访问会使整个网络环境面临风险。NAC\
  \ 和终端安全等概念与其它检测和响应技术（例如用户和实体行为分析，或 `UEBA`）结合使用，是良好安全实践的核心。\n\n纵深防御方法一直将终端安全作为防火墙、代理、集中式病毒扫描仪以及入侵检测和入侵防御解决方案（在\
  \ Chapter 7，“Security Operations” 中讨论）等其它层的一部分。然而，攻击的性质已经改变。攻击者可以通过社会工程学获得有效凭证，或通过暴露的远程访问端口绕过边界安全控制。一旦外部人员成为内部人员，传统的边界和预防控制就变得效果大打折扣。零信任架构（本章前面讨论过），以及本地主机防火墙、高级威胁防护应用程序、多因素身份验证、审计、基于客户端的\
  \ IDS/IPS 和其它新一代终端控制是有益的。\n\n#### 移动设备\n\n移动设备对安全专业人员有特殊影响：\n\n* 笔记本电脑、平板电脑和智能手机的小尺寸以及日益强大的计算和存储能力，使得移动设备丢失或被盗对组织构成重大风险。装满一整间房的纸质文件所需的数据量，仅占现代笔记本电脑存储空间的\
  \ 5% 左右。\n* 移动设备也更容易、更快地丢失，不像台式电脑、大型机和其它更难从组织中移除的设备。\n* 移动设备也存在作为攻击发起平台的风险。无论是单独被恶意软件感染还是作为僵尸网络运行，移动设备都与互联网交互，能够协助对企业和政府网络发起攻击。\n\
  \n针对移动设备的适当安全方法首先始于适用于所有存储平台的指导：最小数据保留。如果数据不需要，就不要保存在移动设备上。最小数据保留围绕手机用户所需的最小数据量展开。定期删除任何曾经需要但已超出数据保留策略的数据。\n\
  \n保护移动设备数据的下一步是使用密码、生物识别或其它可用身份验证机制在不使用时锁定设备——尽可能使用多因素认证。另一个重要步骤是对移动设备上的静态数据进行加密。一些设备，如使用\
  \ Apple `iOS` 的设备，内置了 `AES-256` 级别的加密。其它平台具有用户启用的加密或支持第三方加密应用。如果敏感信息将在移动设备上使用或可能存储在移动设备上，加密至少是最佳实践，并且对许多组织而言是监管期望。\n\
  \n对于希望以一致方式管理移动设备的组织而言，集中管理移动设备是关键。此外，美国国家标准与技术研究院特别出版物 `800-124`（目前为 rev 2 草案）不仅涵盖管理，还涵盖在更高层面上改善移动设备的安全访问和身份验证的方面。例如，移动安全专业人员可能会重新考虑仅凭凭证就授予移动设备访问内部网络的权限。智能手机，特别是个人拥有的设备，可能被越狱或“root”。因此，组织应在授予完全网络访问权限之前考虑检查连接设备的完整性。为此，NIST\
  \ `800-124` 深入探讨了移动设备安全的集中管理。\n\n另一种近年来日益流行的技术是，企业允许在个人设备上维护企业数据，采用基于 BYOD 政策的“安全容器”。企业要求容器定期“回拨”以维持访问。此外，还使用加密和安全协议来进一步保护对设备上容器的常规访问。如果设备离线（即在设定时间内未回拨，例如\
  \ 30 天），容器将被锁定，之后经过一段时间将被销毁。\n\n前面提到的保护数据技术，以及人们对使用自己的移动设备的强烈偏好，使得企业采用 BYOD 政策变得更有价值。个人拥有移动设备有几个名称。例如，个人移动设备（`PMD`）、个人电子设备或便携式电子设备（`PED`）以及个人拥有设备（`POD`）都是同义词。\n\
  \n随着个人设备的普及，许多组织正在使用或考虑 BYOD 计划。BYOD 是一种政策和策略，允许员工使用自己的设备履行工作职责。有几个选项，包括以下一项或多项操作：\n\
  \n* 对个人设备进行无限制访问\n* 仅访问非敏感系统和数据\n\n\n\n\n\n*   访问，同时防止数据在个人设备上本地存储\n*   访问，但 IT\
  \ 对个人设备、应用程序和存储的数据进行控制\n\n一些与安全相关的需要理解的通用技术是移动设备管理（MDM）、容器化和应用虚拟化。这些是软件解决方案和移动设备配置的示例，有助于识别、隔离并在移动设备上分层保护流程，同时保留个人隐私的需求。换句话说，在努力保护企业敏感信息时，并不总是需要跟踪或最终删除个人照片或个人健康记录等个人信息的非企业资产。\n\
  \n贵组织应要求员工签署声明，确认其知晓 BYOD 政策和程序，并且该政策必须包括公司有权远程擦除丢失或被盗移动设备的许可。设备擦除是指使用 MDM 解决方案远程联系移动设备并删除或移除设备上所有数据的过程。将此与企业拥有、个人启用（COPE）设备进行对比。在\
  \ COPE 模式下，企业向员工发放智能手机或移动设备，但允许他们更改设备并将其作为自己的个人设备使用（在合理范围内）。\n\n## 根据设计实施安全通信渠道\n\
  \n本章前面，我们提供了示例和指南，以正确分析、设计、实施和监控各种网络协议、拓扑和基础设施组件。在本节中，针对语音、多媒体协作、远程访问、数据通信、虚拟化网络和第三方连接的特定方面和问题进行了阐述。\n\
  \n### Voice\n\n语音通信已在很大程度上与许多信息技术平台集成。数字语音传输为系统引入了其自身的一系列漏洞。身份验证很重要，可阻止窃听者捕获媒体、身份、模式和凭据——并可能将其用于后续未经授权的连接或其他窃取数据的尝试。完整性是两个方面的关注点：消息完整性和媒体完整性。如果消息被截获，其内容可能会被更改或重建，或者消息会被重定向。实际媒体可能被劫持并降质，或者攻击者可以向媒体中插入新消息。为了保护传输中的语音数据，可以使用加密协议来封装甚至扰乱语音流量。然而，正如本章前面提到的，安全语音传输无法提供端到端保密性，因为所有流量的某部分会被解密以协助政府执法。虽然美国没有以公开法律强制要求，但中国于\
  \ 2017 年颁布了《网络安全法》。《网络安全法》要求所有网络运营商配合中国当局进行抽查和“技术支持”，以便在要求时允许完全访问。\n\n#### Private\
  \ Branch Exchange and Plain Old Telephone Service\n\n关于语音通信安全的讨论始于专用分支交换机（PBX）和普通老式电话服务（POTS）。PBX\
  \ 是企业级电话系统，与住宅系统相对。它包括内部交换网络和控制器。模拟 PBX 的问题在于，它们安装时端口、代码和控制接口的默认访问配置。如果组织未更改这些配置，攻击者可以轻松利用它们。利用这些配置不当系统的常见方法的一个例子是每年耗费数十亿美元的巨额计费欺诈。计费欺诈是指恶意行为者拨打大量电话至高费率号码（如国际号码），并从这些电话产生的收入中获取一部分。\n\
  \n一些漏洞，包括默认配置，已得到缓解，因为模拟 PBX 已在很大程度上被支持 VoIP 的数字 PBX 取代。然而，仍存在一些残余风险。降低风险的第一步是识别问题。识别计费欺诈通常由负责检查组织电话账单的部门完成。一旦识别出欺诈性电话，特别是来自\
  \ VoIP 服务的电话，您就可以采取措施进行补救。如果没有对相关系统的强大漏洞管理，很难弄清楚黑客是如何滥用数字 PBX 系统或 VoIP 系统的。了解这些系统中的弱点有助于识别可能被利用以发起欺诈性电话的内容。随后使用强有力的政策和培训将进一步最大限度地减少内部员工的滥用。最后，考虑使用一些专用应用程序来监控通话并在可疑通话发生时发出警报。\n\
  \nPOTS 仍然是住宅网络和一些企业的常见功能。它旨在通过双向模拟电话接口传输人类语音。通过 POTS 连接，语音通信容易被截获、窃听、窃听和其它利用。因此，POTS\
  \ 和 PBX 安全控制在很大程度上依赖于物理控制以限制访问并保护设备。减轻风险的额外方法包括隔离网络流量并监控更脆弱的区域。许多报警系统和用于传真机、一些路由器和其他网络设备的带外网络链路可能会让\
  \ PBX 和 POTS 在组织中存在多年，这对安全专业人员来说是一个关注点。\n\n#### Voice over Internet Protocol\n\n\
  VoIP 是一种使用多种技术通过 IP 网络封装语音通信和多媒体会话的方法。VoIP 已成为公司和个人使用 TCP/IP 网络连接运行电话解决方案的一种流行且经济实惠的方式。\n\
  \nVoIP 技术并不自动比模拟更安全。它本质上是明文通信，容易被截获和窃听。通过适当的配置，可以实现高度加密的解决方案，并且干扰或窃听的企图能够被阻止。即便如此，VoIP\
  \ 仍需要安全专业人员的关注。黑客有多种 VoIP 攻击途径。\n\n*   有工具可用于伪造来电显示，这会促进 vishing（VoIP 钓鱼）或互联网电话垃圾信息（SPIT）攻击。\n\
  *   呼叫管理器系统和 VoIP 电话本身可能容易受到主机操作系统攻击和 DoS 攻击。\n*   MITM 攻击可能通过伪造呼叫管理器或端点连接传输而成功。\n\
  *   未加密的网络流量可能包含 VoIP，因此解码 VoIP 流是可能的。\n\n这些问题的补救措施集中在采用加密、加强身份验证和强大的网络基础设施上。如前所述，一些供应商需要在存在协议或漏洞时采用创新手段来保护其自身服务。\n\
  \n### Multimedia Collaboration\n\n“随时随地工作”这一表述凸显了多媒体协作对企业的影响，特别是在 COVID-19 大流行开始以来。共享视频、数据、图像和音频平台的增长也改变了个人福祉。地理距离已通过各种支持多媒体的通信解决方案得以弥合。当协作同时进行时，可以高效有效地使用电子邮件、聊天、VoIP、视频会议、数字白板、在线文档编辑、实时文件交换和版本控制等工具，仅举几例。远程会议技术已改变了企业世界，并改变了每个企业运营的方式。随着这些变化，有重要的安全影响需要解决。\n\
  \n#### Remote Meeting\n\n\n\n\n\n# 远程会议概述\n\n在当今时代，虚拟会议已成为生活的一部分。截至本文撰写时，世界各地许多人已超过一年没有进入过办公室内部。虽然我们相信这种情况很快就会改变，但\
  \ COVID-19 大流行向我们所有人证明了，参与者位于任意多个地理分隔区域的富有成效的会议也可以远程举行。为了实现这些远程会议，使用了多种不同的技术。有像视频摄像机和\
  \ VoIP 电话这样的硬件解决方案，而且越来越多地使用人们自己的个人或公司发放的移动设备进行电话会议。软件有助于管理会议并允许远程各方之间进行交互，例如使用共享屏幕白板。用于描述这些技术的术语有多种，例如数字协作、虚拟会议、视频会议、软件或应用协作、共享白板服务以及虚拟培训解决方案。归根结底，任何能够使人们进行通信、交换数据、协作处理材料/数据/文档并以其他方式共同执行工作任务的服务，很可能都在执行或促进某种形式的远程会议。\n\
  \n## 多媒体远程会议安全影响\n\n多媒体远程会议服务具有安全影响。由于在物理会议室中出席并不意味着个人已被识别，因此远程会议中必须确保身份验证。为了提供这种保证，需要对与会者身份进行某种形式的验证或确认，例如员工必须使用唯一密码预先注册会议。语音、数据或视频的传输可能需要通过加密来保护。在每个人都在同一地点的物理会议室中，语音在发送者到接收者之间不需要特殊保护，除非采取物理措施，如关闭门和隔音墙。为了充分利用多媒体协作，特别是远程会议，必须解决安全问题。\n\
  \n## 即时消息\n\n即时消息（`IM`），也称为 `private messaging`（`PM`），是一种协作工具，允许通过互联网连接的两名用户之间进行双向、实时基于文本的聊天。最初，每个用户都必须使用相同的客户端软件。最近的应用中，`JavaScript`\
  \ 在 `IM` 中更为普遍，用户只需使用现代浏览器即可。某些 `IM` 工具允许进行文件传输、多媒体、语音和视频会议、屏幕共享、远程控制和命令脚本。某些形式的\
  \ `IM` 基于点对点服务进行直接通信。其他实现使用一个或多个集中控制的在线服务器。点对点 `IM` 容易受到多种类型的攻击以及数据潜在未经授权的访问。然而，它易于使用和设置，这使其在企业和个人使用中都很受欢迎。`IM`\
  \ 容易受到攻击的一些常见方式如下：\n\n* 当 `IM` 未强制执行强身份验证时，账户仿冒可能会威胁真实性。\n* 没有加密，`IM` 易受数据包嗅探攻击，从而危及保密性。\n\
  * 文件传输和远程访问增加了恶意代码投放、感染或数据外泄的风险。\n* `IM` 用户经常遭受多种形式的社会工程攻击，例如冒充或说服受害者披露敏感信息，如密码或机密数据。\n\
  \n## 电子邮件\n\n有效保护电子邮件是组织信息保护的重要组成部分。电子邮件被广泛使用并被接受为正式通信或记录事项。它是最常用的互联网功能之一。电子邮件基础设施主要是使用\
  \ `SMTP` 的邮件处理服务器。服务器从客户端接收消息，将这些消息传输到其他服务器，并将其存入用户的基于服务器的收件箱。服务器使用邮局协议版本 3（`POP3`）或互联网消息访问协议（`IMAP`）等邮件投递协议与终端用户目的地通信。这些协议允许客户端从其基于服务器的收件箱中提取电子邮件。这些协议无论是在企业局域网还是在众多的基于网络的电子邮件服务中都使用。\n\
  \n安全专业人员应熟悉的流行 `SMTP` 服务器有 Unix 系统的 `Sendmail` 和 Microsoft 的 `Exchange`。随着 Google\
  \ 和 Microsoft 在基于云的电子邮件服务中获得市场份额，一些安全影响发生了变化。就本章而言，了解一般 `SMTP` 服务器的基础知识就足够了。\n\n\
  事实上，`Sendmail` 和 `Exchange` 只是众多替代方案中的两个。虽然它们在提供企业或私人电子邮件服务方面很受欢迎，但使用 `SaaS` 电子邮件解决方案的流行度正在增长，其中\
  \ `Gmail` 用于企业或 `Office 365` 是两种更受欢迎的电子邮件 `SaaS` 选项。部署和保护 `SMTP` 服务器的关键因素首先是确保所使用的协议提供相同的<|message|>\n\
  \n\n\n\n### 访问控制\n访问应限制在个人收件箱和归档中。在某些情况下，会建立具有多个收件人的群组电子邮件收件箱。具有访问权限的用户应被禁止将访问权限授予其他人。访问控制的实现方式应有所描述，以便用户认识到合法访问与一定程度隐私之间的平衡。至少，访问控制会阻止或防止未经授权的访问。\n\
  \n### 隐私\n企业电子邮件系统的用户通常应习惯于对隐私没有合理期待。\n\n### 电子邮件备份和保留策略\n备份和归档对于数据恢复、法律程序以及许多审计都是必需的。保留规则对于指导组织不再保留不再有价值或因法律或监管原因不再需要的记录非常重要。过度的记录维护可能会导致另一种安全问题。备份可以是每日、每周或每月，例如。保留要求范围从几个月的归档到数年。在任何情况下，备份和保留规则都必须基于风险、业务需求以及任何法律或监管指南。\n\
  \n### 电子邮件安全解决方案\n与所有安全方法一样，必须进行风险-回报（或成本-效益）分析。实施和维护安全控制的成本不应超过信息的价值（或丢失的成本）。安全控制应保持企业运营和发展的能力；否则，它们将是不必要的，因为企业可能正走向过时。就电子邮件安全而言，一个需要强调的关键考虑是保密性，因为电子邮件消息可能包含需要保护的有价值和敏感信息。\n\
  \n组织可以采用几种技术来加强其电子邮件通信的保护：\n* 使用数字签名来打击冒充尝试\n* 对所有传入电子邮件进行反恶意软件扫描\n* 在网关处阻止可疑附件和潜在风险的文件名扩展名（如\
  \ `.zip` 和 `.exe`），以减少网络钓鱼和类似攻击\n* 采用过滤器来减少垃圾邮件和邮件炸弹问题\n* 使用加密来禁止窃听行为\n* 培训用户了解识别和处理电子邮件中垃圾邮件或潜在恶意链接的重要性及方法\n\
  * 安装、运行和更新防病毒和终端保护\n\n有几种协议、服务和解决方案可以增强电子邮件基础设施并提供安全，而无需对整个基于互联网的 SMTP 基础设施进行昂贵且彻底的改造。其中一些策略如下：\n\
  * 安全多用途互联网邮件扩展 (S/MIME)\n* MIME 对象安全服务 (MOSS)\n* 隐私增强邮件 (PEM)\n* 域名密钥识别邮件 (DKIM)\n\
  * 很好隐私 (PGP)\n* 强制加密\n\n`S/MIME` 是一种电子邮件安全标准，使用公钥加密和数字签名来为电子邮件启用身份验证和保密性。`X.509`\
  \ 数字证书用于提供身份验证。公钥密码学标准 (`PKCS`) 加密用于提供隐私。使用 `S/MIME` 可以形成两种类型的消息：\n* **签名消息：** 提供完整性、发送者身份验证以及发送者的不可否认性\n\
  * **封装消息：** 提供完整性、发送者身份验证和保密性\n\n`MOSS` 是另一种电子邮件安全标准，可以提供身份验证和保密性，但也可以为电子邮件消息启用完整性和不可否认性服务。`MOSS`\
  \ 采用消息摘要 2 (`MD2`) 和 `MD5` 算法；Rivest、Shamir 和 Adelman (`RSA`) 公钥；以及数据加密标准 (`DES`)\
  \ 来提供身份验证和加密服务。\n\n`PEM` 是一种电子邮件加密机制，提供身份验证、完整性、保密性和不可否认性。与上述服务一样，`PEM` 也使用 `RSA`、`DES`\
  \ 和 `X.509`。\n\n`DKIM` 是一种通过验证域名身份来断言有效邮件由组织发送的手段。这增加了不可否认性和身份验证层，在识别和过滤电子邮件中的伪造地址方面特别有帮助。实施\
  \ `DKIM` 依赖于公钥和数字签名。\n\n`PGP` 是一种公钥-私钥系统，使用多种加密算法来加密电子邮件消息。`PGP` 加密可用于保护电子邮件以外的文件和其他数字资产。`PGP`\
  \ 的第一个版本使用 `RSA`，第二个版本使用国际数据加密算法 (`IDEA`)，但后期版本提供了多种算法选项。`PGP` 加密可用于保护电子邮件以外的文件和其他数字资产。`PGP`\
  \ 不是标准，而是一种独立开发的产品，在互联网上具有广泛吸引力。\n\n强制使用 `TLS` 进行电子邮件加密是另一种提供保证的方法。少数电子邮件服务提供商如\
  \ Apple 和 Google 使用 `TLS` 用于 `@icloud` 和 `@gmail`，即其各自的电子邮件服务。不可能强制 `TLS` 作为唯一选项。事实上，`RFC\
  \ 2487` 规定公共 SMTP 服务器必须 *not* 强制 `TLS`，因为其实现尚不能（尚未）强制实施。然而，在业务合作伙伴之间的电子邮件域之间，强制\
  \ `TLS` 是一个可行的选项。\n\n### 远程访问\n互联的计算平台、多媒体协作的优势、业务的全球化以及“随时随地工作”运动是使分散的工作场所安排变得更常见的一些力量。远程办公，或远程工作，是指一个人与主要企业计算和存储平台分离，从另一个位置（如其家庭）通过笔记本电脑访问它们。人们对云托管资源的依赖也在不断增长，企业受保护的局域网上的员工需要远程访问由\
  \ CSP 托管的重要基础设施。\n\n在远程办公或使用基于云的资源时，用户可能会使用以下其中一种访问路径：\n* 通过互联网连接到网络，有或无 `VPN`\n\
  * 通过瘦客户端连接连接到终端服务器系统或访问网关\n\n#### 远程办公的远程访问\n要使远程办公富有成效并取得成功，员工需要在远程位置获得与在主要办公室相同或相当的许多资源。访问电子邮件、共享存储以及虚拟参加会议的能力是必要的。远程办公人员使用多种远程访问技术来建立与业务办公室网络所需的连接。主要有三种远程访问技术：\n\
  * **服务特定：** 如果需要某项服务，例如通过 Outlook Web Access (`OWA`) 的电子邮件，则服务特定的远程访问功能允许用户远程连接并使用它。服务特定的功能不仅限于本地应用程序的基于\
  \ Web 的版本。例如，终端服务访问可以仅限于时间和考勤应用程序。\n* **远程控制：** 远程控制或远程访问的常见应用是帮助台或一级支持以及员工培训功能。远程控制允许授权用户获得对另一系统的远程访问并完全控制，就好像他们\
  \ physically 在远程系统前一样。远程控制存在重大的安全问题。潜在威胁包括黑客可能用来利用专有远程桌面协议 (`RDP`) 的暴力攻击，该协议 Windows\
  \ 环境用于启用 Windows 远程桌面和终端服务器。\n\n\n\n\n\n### 屏幕抓取\n*屏幕抓取* 的过程涉及复制在一个应用程序中显示的信息，以便在另一个应用程序中使用或显示。屏幕抓取技术在金融行业中已被广泛用于在分析和其它应用程序之间收集和重用交易数据。在屏幕抓取过程中存在未经授权披露或泄露的风险，因此安全专业人员希望对任何屏幕抓取解决方案实施加密。\n\
  \n## 远程访问安全管理\n\n允许远程访问的组织将其风险扩展到了象征性的企业边界之外。随着风险的扩大，也带来了额外的安全要求。私有网络可能因远程访问攻击而被入侵。图\
  \ 4.13 说明了一些远程访问风险增加的常见区域。可以实施许多安全控制措施，其中最重要控制类别的几个如下：\n\n* 需要强大的身份验证系统；多因素身份验证是保护敏感信息的标准。\n\
  * 将远程访问限制为仅那些需要它并且常规使用它的人。\n* 在传输链路上实施加密，包括以下示例中的一种或多种：VPN、SSL、TLS、SSH 和 IPSec。\n\
  * 要明白 VPN 并不是一个完整的安全解决方案；能够进行身份验证并建立 VPN 的终端用户可能使用感染的计算机或移动设备访问网络。\n\n正如本章所述，端点安全也至关重要。需要组合安全控制来管理和保护远程访问员工。\n\
  \n![FIGURE 4.13 Common areas of increased risk in remote access](img/c04f013.png)\n\
  \n**FIGURE 4.13 Common areas of increased risk in remote access**\n\n## 身份验证方法\n\
  \n由于远程访问将私有网络扩展到企业环境之外，使许多现有的物理控制失效，并增加了组织的信息风险，因此对远程访问用户的身份验证采取额外预防措施值得进一步探讨。组织将使用特定的远程访问协议和服务来加强远程客户端和用户的凭证管理及权限。最有可能的是，应部署集中式远程访问身份验证系统。远程身份验证协议的一些示例是\
  \ Password Authentication Protocol (PAP)、Challenge Handshake Authentication Protocol\
  \ (CHAP)、Extensible Authentication Protocol (EAP，或其扩展 PEAP 或 LEAP)、Remote Authentication\
  \ Dial-In User Service (RADIUS) 和 Terminal Access Controller Access Control System\
  \ Plus (TACACS+)。\n\n## 集中式远程身份验证服务\n\n集中式远程身份验证服务在远程访问客户端和私有内部网络之间增加了额外的保护层。使用集中式服务器的远程身份验证和授权服务与用于本地网络客户端的类似服务不同且分离。这很重要，因为在远程访问服务器被入侵的情况下，整个网络的身份验证和授权服务不受影响。几个领先的示例是\
  \ RADIUS、Diameter 和 TACACS+。\n\n* **RADIUS：** 用户将登录凭证传递给 RADIUS 服务器进行身份验证，与域客户端将登录凭证发送给域控制器进行身份验证的过程类似。\n\
  * **Diameter：** Diameter 本质上是 RADIUS 的继任者。Diameter 提供的一个重要改进是增加了可靠性。Diameter 通常用于移动设备服务的预付费和基于信用的使用模式，以及类似的应用。\n\
  * **TACACS：** 这是 RADIUS 的替代方案。TACACS 有三个版本：原始 TACACS、Extended TACACS (XTACACS) 和\
  \ TACACS+。TACACS 将身份验证和授权过程集成在一起。XTACACS 将身份验证、授权和记账过程分开。TACACS+ 通过添加双因素身份验证改进了\
  \ XTACACS。TACACS+ 是该产品线的最新且最相关的版本。\n\n## 虚拟专用网络\n\nVPN 是一种通信隧道，可在不受信任的网络（如互联网）上建立安全点对点连接。大多数\
  \ VPN 使用加密来保护封装的流量，但加密对于连接被视为 VPN 并非必要。\n\nVPN 最常见的应用是在互联网上建立两个远程网络之间的安全通信，例如企业网络和远程办公人员的家庭网络。还有其他示例和\
  \ VPN 用途也应得到重视：\n\n* 在私有网络内部提供额外的数据保护层\n* 连接到 ISP 的终端用户系统之间\n* 两个整个私有网络之间的链路\n*\
  \ 为依赖于风险或脆弱通信协议或方法学的遗留应用程序提供安全保障，尤其是在跨网络通信时\n* 在不安全或不受信任的中间网络上提供保密性和完整性，但不提供可用性\n\
  \n### 隧道\n\n隧道概念是理解 VPN 如何工作的基础。隧道是网络通信过程，它将数据包封装在另一个协议中以保护初始数据包。封装创造了在不受信任的中间网络上通信隧道的逻辑假象，即流量仅对隧道两端的系统可见，而对不受信任的网络隐藏。在隧道两端，初始协议数据包被封装和解封装以促进通信。\n\
  \n在需要绕过防火墙、网关、代理或其他网络设备的情况下，会使用隧道。授权数据被封装，传输被允许，即使隧道内部的访问受到限制。隧道的一个优点是流量控制设备无法阻止或丢弃通信，因为它们无法检查数据包内容。这对于简化重要内容和连接很有用。然而，这种能力也是潜在的安全问题，因为旨在保护私有网络免受恶意内容侵害的安全设备无法在数据包到达或离开时扫描它们。如果隧道涉及加密，尤其如此。敏感数据将保持保密性和完整性。然而，数据对网络和安全设备而言是不可读的。\n\
  \n安全专业人员无法监控隧道内流量的内容并不是隧道唯一的担忧。使用多种协议时，消息开销会增加。每个协议可能都有自己的错误检测、错误处理、确认和会话管理元素。这增加了复杂性和处理时间。隧道数据包的大小或长度比正常数据包更大。这需要更多的带宽资源，与其他网络资源竞争。网络饱和和瓶颈可能很快发生。此外，隧道是点对点通信机制，并不设计用于处理广播流量。\n\
  \n### 常见 VPN 协议\n\nVPN 可以使用软件或硬件解决方案实现。在任何一种情况下，都有基于隧道如何实现的变体和组合。有三种常见的 VPN 协议提供了\
  \ VPN 如何构建的基础视图：\n\n* **Point-to-Point Tunneling Protocol (PPTP)：** 数据链路层（第 2 层）用于\
  \ IP 网络。\n* **Layer 2 Tunneling Protocol (L2TP)：** 数据链路层（第 2 层）用于任何 LAN 协议。\n\n\n\
  \n\n\n*   `IPSec`：网络层（第 3 层）在 IP 网络上使用；`IPSec` 已在本章前面的“安全协议”部分中介绍。\n\n### 点对点隧道协议\n\
  \n该协议由拨号协议点对点协议（`PPP`）发展而来。它在 OSI 模型的链路层（第 2 层）对流量进行封装，并在 IP 网络上使用。`PPTP` 对 `PPP`\
  \ 数据包进行封装，并在两个独立系统之间创建点对点隧道。它使用 `PPP` 支持的相同身份验证协议来保护身份验证流量：\n\n*   Microsoft Challenge\
  \ Handshake Authentication Protocol（`MS-CHAP`）\n*   `CHAP`\n*   `PAP`\n*   `EAP`\n\
  *   Shiva Password Authentication Protocol（`SPAP`）\n\n### 第二层隧道协议\n\n`L2TP` 是为创建点对点隧道以连接不同的网络而衍生的。该协议不采用加密，因此不提供保密性或强身份验证。结合\
  \ `IPSec`，这些服务是可能的。`IPSec` 与 `L2TP` 是一种常见的结构。`L2TP` 还支持 `TACACS+` 和 `RADIUS`。最新版本\
  \ `L2TPv3` 在安全性方面有所改进，包括改进的封装以及使用帧中继、以太网和 ATM 等通信技术的能力，而不仅仅是在 IP 网络上使用 `PPP`。\n\n\
  ### 数据通信\n\n在本章的前几节中，我们谈了很多关于网络拓扑、媒体（有线或无线）和协议。最终，数据通过某种通信路径进入和离开您的场所。在本节的其余部分，我们将介绍一些最常见的数据通信框架和标准。\n\
  \n#### 帧中继\n\n该框架使用分组交换来执行广域网，连接在数字通信信道的物理层和数据链路层运行的网络。帧中继还有另一个用途：它通常用于将局域网与主要骨干网连接。它通过\
  \ T-1 连接的租用线路连接独立的广域网和专用网络环境。帧中继有时用于视频和语音，但它并不最适合，因为它不提供稳定的传输流。\n\n帧中继起源于 `ISDN`\
  \ 的扩展，即帧中继在电路交换技术上集成了分组交换网络功能。该技术已成为创建广域网的一种独立且经济高效的手段。在专用网络中执行帧中继服务的设备称为 `data\
  \ circuit-terminating equipment`（`DCE`）。连接到帧中继 `DCE` 的设备称为 `data terminal equipment`（`DTE`）。\n\
  \n#### 异步传输模式\n\n这是一种高速网络标准，可同时支持语音和数据通信。它旨在集成电信和计算机网络。`ATM` 通常由 ISP 在其专用长途网络上使用。`ATM`\
  \ 主要在数据链路层（第 2 层）运行，并可通过光纤或双绞线电缆使用。\n\n`ATM` 与其他数据链路技术不同，尤其是以太网。`ATM` 不使用路由，而是使用称为\
  \ `ATM` 交换机的专用硬件，在端点之间建立点对点连接。数据直接从源流向目的地。另一个有趣的区别是以太网数据包长度可变。\n\n`ATM` 的性能通常以光载波（`OC`）级别表示，写为“`OC-xxx`”。使用\
  \ `ATM` 可实现高达 10 Gbps（`OC-192`）的性能水平在技术上是可行的。`ATM` 更常见的性能水平为 155 Mbps（`OC-3`）和 622\
  \ Mbps（`OC-12`）。`ATM` 流量有几个组件以确保服务质量（`QoS`）。有四种基本类型：\n\n*   `Constant bit rate (CBR)`：指定恒定的峰值单元速率（`PCR`）。\n\
  *   `Variable bit rate (VBR)`：指定平均或可持续单元速率（`SCR`），可在一定水平、即 `PCR` 达到峰值，最长间隔后才会有问题。\n\
  *   `Available bit rate (ABR)`：指定最低保证速率。\n*   `Unspecified bit rate (UBR)`：流量分配给所有剩余传输容量。\n\
  \n`ATM` 具有设计能力，可处理既需要传统高吞吐量数据流量，又需要实时、低延迟内容（如语音和视频）的网络。`ATM` 在 OSI 模型的三个最低层运行：网络层、数据链路层和物理层。`ATM`\
  \ 是在 `PSTN` 和 `ISDN` 的同步光纤网络（`SONET`）和同步数字体系（`SDH`）骨干上使用的核心协议。`SONET` 和 `SDH` 是标准化协议，使用激光或发光二极管（`LEDs`）通过光纤传输多个数字比特流。\n\
  \n`ATM` 提供的功能类似于电路交换和分组交换网络。它使用面向连接的模型，在实际数据交换开始之前，必须在两个端点之间建立虚拟电路。这些虚拟电路可能是永久的（即通常由服务提供商预先配置的专用连接）或交换的，即按每次呼叫设置，使用信令，并在呼叫终止时断开连接。\n\
  \n#### 多协议标签交换\n\n我们已经介绍了 `ATM` 和帧中继的优点和优势。但 `MPLS` 似乎兼具两者的优点。`MPLS` 已在本章前面的“融合协议”部分中介绍。\n\
  \n### 虚拟化网络\n\n虚拟化技术使用单台主机计算机的内存来托管一个或多个操作系统。在这种结构下，几乎任何操作系统都可以在任何硬件上托管。此场景中的操作系统称为\
  \ `guest` 操作系统。一台硬件主机计算机上可以运行多个操作系统，所有这些都视为来宾。操作系统、主机和来宾可以在同一虚拟机上有所不同。虚拟化可用于托管服务器、有限的用户界面（如虚拟桌面）、应用程序等。\n\
  \n随着操作系统虚拟化的有效性得到证明，虚拟化已扩展到涵盖其他机会，例如虚拟化网络。网络虚拟化是将硬件和软件网络组件组合成一个集成实体。 resulting 系统由软件控制所有网络功能，包括管理、流量整形、地址分配等。物理上存在于所有硬件位置不再需要。单个管理控制台或界面可用于监督网络的各个方面。请参阅本章前面的“微分段”部分，了解\
  \ `SDN`、`SDS` 及相关概念的介绍。\n\n### 第三方连接\n\n许多组织开展业务时通常需要与第三方进行各种连接。第三方通常可分为三类：\n\n\
  *   数据和电信提供商，例如您的 `ISP`\n*   云服务提供商\n*   供应商、客户、合作伙伴组织等\n\n与第三方合作存在许多风险，您通常应将此类第三方保持在与您为组织制定的相同（或有时更高）的安全和隐私标准。服务水平协议（`SLAs`），如第\
  \ 7 章中所述，是与外部方建立安全期望并在未满足期望时追究其责任的重要机制。\n\n\n\n\n\n许多与第三方连接相关的考虑与本章“远程访问”部分以及本书其余部分所涵盖的主题一致。你应遵循最佳实践，例如传输中加密、强访问控制程序以及强大的电子邮件过滤。此外，对任何第三方连接进行持续监控应成为标准做法，以识别新的威胁、意外行为或偏离已商定\

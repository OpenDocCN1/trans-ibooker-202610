  \ TCP/IP 模型其他层提供的服务，应用层定义了应用程序使用的\n\n\n\n\nNAT 可以在多种不同的设备上实现，例如防火墙、路由器、网关和代理。它只能在\
  \ IP 网络上使用，并在网络层（第 3 层）运行。最初，NAT 的设计目的是延长 IPv4 的使用，因为可用地址池很快被耗尽。就这一点而言，NAT 是一种遗留技术，具有优点和缺点。\n\
  \n首先，考虑其优点。NAT 用于实现网络和安全目标，以隐藏内部客户端的身份，掩盖私有网络的可路由设计，并通过尽可能使用最少的公共 IP 地址来将网络寻址成本降至最低。图\
  \ 4.5 显示了 NAT 可能在边界防火墙上实现的示例。通过 NAT 流程，组织分配内部 IP 地址，也许甚至是私有寻址方案。NAT 设备会编目这些地址，并将其转换为用于在互联网上传输的公共\
  \ IP 地址。在内部网络中，NAT 允许使用任何地址，并且不会与具有相同 IP 地址的公共互联网主机发生冲突或冲突。实际上，NAT 将内部客户端的 IP 地址转换为环境外部的租用地址。NAT\
  \ 提供了众多好处，包括以下内容：\n\n*   NAT 使用仅一个或少数几个租用的公共 IP 地址将整个私有网络连接到互联网。\n*   NAT 在私有网络中使用私有\
  \ IP 地址（`10.0.0.0` 到 `10.255.255.255`）并保留与互联网通信的能力，因为 NAT 会将其转换为公共、可路由地址。\n*   NAT\
  \ 将内部私有网络的 IP 寻址方案和网络拓扑结构隐藏在互联网之外。\n*   NAT 确保从内部受保护网络发起的连接可以从互联网返回到网络。\n\n![FIGURE\
  \ 4.5 NAT implemented on a perimeter firewall](img/c04f005.png)\n\n**FIGURE 4.5\
  \ NAT implemented on a perimeter firewall**\n\n公共 IP 地址在剩余的 A 类（参见 Table 4.1）地址多年前耗尽后基本上已全部分配完毕。这解释了\
  \ NAT 流行度上升的趋势。安全问题也支持使用 NAT，它可以减轻许多入侵类型的攻击。随着 IPv4 中大约只有 40 亿个地址可用，世界已经部署了使用 IP\
  \ 的设备数量超过了可用的唯一 IP 地址数量。互联网和 TCP/IP 的早期设计者为私有、非限制性使用保留了几个地址块的事实正变得越来越明智。这些预留的 IP\
  \ 地址被称为私有 IP 地址，在标准 RFC 1918 中定义。\n\n现在，考虑 NAT 的一些缺点。同样请记住，NAT 是为应对 IPv4 地址耗尽而开发的。为此，NAT\
  \ 被认为是一种临时解决方案。因为它被认为只是临时的，负责定义协议标准的 IETF 并未追求为 NAT 创建深入的官方标准。事实上，虽然 IETF 认识到 NAT\
  \ 的好处并发布了一般规范，但它避免开发技术规范以阻止 NAT 的广泛采用。仅此一点，NAT 最大的缺点就是其在设备中的实现不一致。\n\nNAT 的一些技术缺点已被认识到，但对这些问题的解决方案是在无需重新发明\
  \ NAT 的情况下发现或开发的。例如，考虑点对点通信如何处理。没有 NAT 时，发起者与目标通信。只要发起者和目标都有可路由地址，这就不是问题。实施 NAT\
  \ 后，互联网上的发起者寻求与 NAT 后面的目标连接时无法连接到不可路由地址。解决此问题的一种方法是让点对点会话“向后”开始，目标首先与发起者连接以发现 NAT\
  \ 的存在。然后，一旦 NAT 的外部公共地址已知，原点就可以开始新的点对点会话。Skype 等依赖点对点或 VoIP 协议的服务需要创造创新的方法来绕过 NAT\
  \ 否则会破坏其服务的方式。例如，Skype 采用公共地址上的“超级节点”以允许点对点连接，即使目标和发起者都位于 NAT 后面。\n\n另一个缺点是 IPSec\
  \ 如何检查完整性。IPSec 计算哈希值以确保每个数据包的完整性。该哈希值使用数据包的各个部分计算，由于 NAT 更改了数据包的值，因此该哈希值不再有效。为了解决这个问题，开发了\
  \ NAT-Traversal（`NAT-T`）技术。`NAT-T` 确保当 IPSec 隧道的一端或两端跨越 NAT 设备时，IPSec 不会被破坏。\n\n\
  虽然 NAT 是 IPv4 网络的关键技术，但在 IPv6 中该技术不再需要。这是最新版本的互联网协议提供的多项改进之一，将在下一节中讨论。\n\n## Internet\
  \ Protocol Version 6\n\n与 IPv4 的 32 位 IP 地址相反，IPv6 使用 128 位 IP 地址来支持比其旧版本多得多的地址数量。每个\
  \ IPv6 地址分为四个十六进制数字，以冒号分隔寻址，并分为两部分：64 位网络前缀和 64 位接口标识符。IPv6 地址的示例看起来像 `2607:F0F0:1002:00B1:0000:0000:0000:0004`。增加的复杂性使\
  \ IPv6 能够支持 1,028 倍于 IPv4 地址的总数，从而使互联网连接的设备能够在可预见的未来扩展。IPv6 方案还旨在改进网络寻址和路由。\n\n\
  IPv6 相对于 IPv4 的一些主要好处包括以下内容：\n\n*   **作用域地址：** 这为管理员增加了安全性和访问控制层，管理员可以对网络服务（如文件服务器或打印）进行分组，然后拒绝或允许访问。\n\
  *   **自动配置：** 这消除了对 DHCP 和 NAT 的需求，得益于更大的公共地址空间。\n*   **服务质量（QoS）优先级值：** 基于内容优先级，流量管理根据预设的\
  \ QoS 优先级值进行。\n\nIPv6 由 IETF 开发以管理 IPv4 地址耗尽的预期问题，但 IPv6 的采用缓慢。自 2000 年左右以来，操作系统已具备使用\
  \ IPv6 的能力，无论是原生还是通过插件。采用障碍包括某些 IPv6 兼容设备的额外成本以及 IPv4 运行良好的事实。决策者不愿为了改变而改变，或进行提供最小财务投资回报率（ROI）的流程改进。IPv6\
  \ 的早期采用者可在大型企业、私有内部网络、研究实验室和大学中找到。\n\n## Network Attacks\n\n网络协议是在安全必要性尚未完全被认识到的很久以前设计的。因此，即使在今天，网络主机仍然容易受到攻击，网络系统也未能实施缓解控制。即使针对利用错误配置和不必要服务发起的攻击进行了加固的系统，仍然可能受到利用网络服务的攻击。网络协议已采用了多次更新和修订，但由于安全被设计为事后考虑，弱点仍然存在，尽管进展仍在继续。\n\
  \n\n\n\n\n本章前面“开放系统互连与传输控制协议/互联网协议模型”部分探讨了 OSI 模型及其层级如何从物理层抽象到应用层。它研究了既定协议在这些层级中的位置。该部分还涉及了每个\
  \ OSI 层存在哪些攻击向量，以揭示其中的一些漏洞。\n\n通过了解网络主机如何相互通信，安全专业人员可以更好地理解网络攻击如何发生并取得成功。掌握这些信息后，以下部分将深入探讨各种网络攻击。\n\
  \n## 分布式拒绝服务攻击\n\n当攻击者不具备实施复杂攻击的技能或工具时，他们可能会使用暴力攻击，这同样可能有效。只需从受感染的机器向目标系统泛滥 UDP\
  \ 数据包就已证明是成功的，尤其是随着物联网设备被无意中用于发起这些分布式拒绝服务（DDoS）攻击。典型的 DDoS 攻击由大量被劫持的单台机器组成，它们在短时间内向目标倾泻压倒性的流量。任何一台被攻陷机器的个体贡献——无论是\
  \ PC、物联网设备、网络硬件还是服务器——都不会造成损害，但集体总和会产生压垮目标的巨大流量。\n\n### SYN 泛洪\n\n为了使系统过载，此类攻击会向接收方轰炸大量\
  \ SYN 数据包，而发送方或发送方不承认任何回复。SYN 泛洪是一种 DoS 攻击，利用传输层（第 4 层）TCP 的特性。TCP 通过发送 SYN 数据包来发起连接，该数据包在被接收并接受后会回复\
  \ SYN-ACK 数据包。SYN 泛洪 DoS 攻击是通过发送大量 SYN 数据包执行的。SYN 数据包在接收系统处累积，软件因无法处理溢出而崩溃。攻击者试图消耗足够的服务器资源，使系统对合法流量无响应。有些人将此攻击称为半开攻击，因为其底层是部分的三次握手\
  \ TCP 握手。最终，在足够多的连接尝试后，网卡维护开放连接的能力会被耗尽。\n\n尽管此类攻击历史悠久，且缓解措施也几乎同样久远，但 SYN 泛洪仍然是一种常见攻击。缓解\
  \ SYN 泛洪漏洞有几种方法。其中最常见的方法如下：\n\n* **增加 backlog 队列：** 这涉及提高系统将维持的半开连接数量的允许值。它需要额外的内存资源来增加最大\
  \ backlog。根据内存资源的可用性，缓解 SYN 泛洪威胁可能会降低系统性能。需要对不需要的 DoS 影响和更慢的性能进行风险收益分析。\n* **回收最旧的半开\
  \ TCP 连接：** 这是一种先进先出队列策略，一旦 backlog 队列限制达到，最旧的半开请求将被覆盖。好处是更快地建立合法连接，比恶意 SYN 数据包填满\
  \ backlog 更快。然而，如果 backlog 队列太小或攻击过于庞大，此缓解措施可能不足。\n* **SYN cookies：** 服务器对每个连接请求（SYN）回复\
  \ SYN-ACK 数据包。SYN 请求从 backlog 中丢弃。端口对新的、理想情况下合法的新连接保持开放。如果初始连接是合法的，原始发送方将发送其 ACK\
  \ 数据包。创建 SYN cookie 的初始接收方将重建 SYN backlog 队列条目。当然，会有一些限制，因为有关 TCP 连接的一些信息可能会丢失。这比完全的\
  \ DoS 中断更有优势。\n\n### DDoS 与物联网\n\n作为一种新兴技术，物联网设备在本章中值得更多关注。从安全角度来看，这些设备为潜在攻击者提供了软目标。它们交付时带有易于猜测的默认设置，或者事实上是公开众所周知的。管理凭据和管理访问对面向互联网的接口完全开放。攻击者可以用相对简单的远程访问代码利用这些设备。加剧漏洞的是，用户与这些设备的交互方式与办公自动化或其他终端计算资产不同。默认设置很少更改，即使最终用户有能力进行更改。供应商通常很慢地提供升级和补丁，如果他们提供售后制造支持的话。正因如此，这些设备很容易成为猎物，用户往往在为时已晚之前都不知道设备已被入侵。\n\
  \n物联网设备的数量给安全专业人员带来了很多担忧。据估计，目前已经有数千万台易受攻击的物联网设备安装或在使用中。这一数字正在增长。互连通常始终在线， ingress\
  \ 和 egress 未受保护，不像典型的 LAN 或 WAN，但它们享有高速连接。这些变量解释了为什么由大量被劫持的物联网设备组成的僵尸网络会构成严重问题。常见的攻击序列包括破坏设备以发送垃圾邮件或广播消息。如果垃圾邮件过滤器阻止了该攻击，可能会尝试插入定制的恶意软件，例如\
  \ fast flux，这是一种用于隐藏垃圾邮件攻击的 DNS 技术。如果这没有造成破坏，可能会发起暴力类型的 DDoS。越来越多的资源充足的网站具有足够的带宽，并且可以在基线或正常使用水平之上扩展容量以抵御大多数攻击。然而，仅是发起攻击的威胁就足以说服网站所有者向勒索者支付赎金，以避免测试目标网站保持响应的能力的极限。\n\
  \n## 中间人攻击\n\n在通信中，发送方和接收方认为他们已连接的情况下，MITM 攻击可能难以检测，并对未受保护的通信构成重大威胁。在 MITM 攻击中，攻击者拦截信号并秘密中继（并可能篡改）通信，然后停止传输或允许消息到达预期接收方。\n\
  \n窃听是一种特定的 MITM 攻击。在这种情况下，攻击者中继消息以完成电路。整个对话被攻击者窃听，在某些情况下被控制，而发送方和接收方认为消息是私密的。Figure\
  \ 4.6 描述了 MITM 攻击的一般概念。\n\n![FIGURE 4.6 Man-in-the-middle attack](img/c04f006.png)\n\
  \n**FIGURE 4.6 Man-in-the-middle attack**\n\n另一种 MITM 攻击类型是冒充。这发生在攻击者规避身份验证过程并破坏一个账户的凭据时。与攻击者通信的端点并不知道通信已被拦截。\n\
  \n防止或检测 MITM 攻击主要有两种方法：身份验证和篡改检测。身份验证提供了一定程度的确定性，即给定消息来自合法来源。篡改检测仅显示消息可能已被更改的证据。\n\
  \n\n\n\n\n### 身份验证\n为防止中间人攻击，密码学协议被用于对端点或传输介质进行身份验证。其中一种技术是使用与 X.509 证书配对的 TLS 服务器。X.509\
  \ 证书由相互信任的证书颁发机构（CA）用于对一个或多个实体进行身份验证。消息和公钥交换被用于使通道安全。\n\n### 篡改检测\n检测中间人攻击的一种方法是检查交易中超出基线预期的任何延迟。响应时间会被检查，并且像哈希函数的长时间计算等正常因素也会被考虑在内。如果延迟无法解释，则可能存在通信中不受欢迎的、恶意的第三方干扰。\n\
  \n### 数据包嗅探\n管理员经常出于合法目的使用数据包嗅探工具，例如故障排除。但攻击者进行中间人数据包嗅探以获取对抗性目的的信息。任何未加密的协议都可能受到被动攻击的影响，在这种攻击中，攻击者能够在网络上放置数据包嗅探工具来监控流量。监控可能用于确定流量类型和模式或映射网络信息。在任何情况下，数据包嗅探在为其他类型的攻击做准备时都极大地有利于攻击者。举例来说，如果一个使用数据包嗅探的攻击者发现一家公司仍在使用已弃用的\
  \ SSL 密码套件，或发现了 Active Directory（AD）控制器的 IP 地址。攻击者现在就可以利用该过时协议或服务器进行攻击。数据包嗅探还可以包括抓取传输中的数据包并尝试从内容中提取有用信息。某些数据包中包含用户名、密码、IP\
  \ 地址、信用卡号码和其他有价值的有效载荷。对敏感流量进行加密是防止网络嗅探的最佳方式。\n\n### 劫持攻击\n劫持攻击描述了许多不同类型的中间人攻击。劫持攻击是任何涉及会话利用的攻击，会话是设备之间建立的对话。通常，会话由控制机制管理，例如\
  \ cookie 或令牌。攻击者可能会尝试拦截或窃听会话令牌或 cookie。在攻击者嗅探到 cookie 或令牌的情况下，攻击者可能会使用合法令牌与服务器连接，与受害者并行。或者攻击者可能会拦截会话令牌以供使用，同时向受害者发送一个特别构造的数据包以终止其初始会话。\n\
  \n许多网站需要身份验证并使用 cookie 来记住会话跟踪信息。当用户注销时会话终止时，cookie 和凭据通常会被清除。在会话处于活动状态时劫持会话并窃取令牌或\
  \ cookie，可以为攻击者提供有价值的敏感信息，例如访问了哪些网站的独特详细信息。更糟糕的是，劫持会话 cookie 可能会让攻击者有机会继续会话，冒充受害者。\n\
  \n### MITRE ATT&CK 框架\n本章无意列出网络攻击的详尽清单，但 MITRE 组织（通常仅称为 MITRE）维护了一个相当广泛的对手战术和技术知识库，称为\
  \ MITRE ATT&CK。该知识库是一个全球可访问的参考资料，其中包含数百种现实世界的攻击战术和技术，旨在为安全专业人员提供在组织中开发威胁模型和方法的基础。你可以在\
  \ `attack.mitre.org` 了解有关 MITRE ATT&CK 的所有信息。\n\n## 安全协议\n安全协议为通信通道提供安全服务，以及安全的身份验证服务。\n\
  \n一些常见的安全通信协议包括 SSH、TLS、Kerberos、IPSec 和 Internet Key Exchange（IKE）。\n\n### 安全外壳\n\
  SSH 是 Telnet 的替代品，支持通过 TCP 进行交互式、文本导向的通信。SSH 是一种加密网络协议，它创建了一个安全隧道，保护通信的完整性，防止会话劫持和其他中间人攻击。\n\
  \nSSH 也是一个客户端-服务器架构，常用于实现远程命令行登录和远程命令执行。任何网络服务都可以用 SSH 来保护。协议规范区分了两个主要版本，称为 SSH-1\
  \ 和 SSH-2。SSH-1 被认为不安全，而 SSH-2 提供了更安全、更高效的保护，防止窃听、DNS 和 IP 欺骗以及中间人攻击。\n\n### 传输层安全\n\
  TLS 是一种安全协议，取代 SSL 成为安全网络流量的主要协议。SSL 是一种面向会话的旧协议，曾被广泛用于保护网络、电子邮件、FTP 甚至 Telnet 流量。SSL\
  \ 尽管存在已知的安全弱点，但仍被广泛使用，但它不安全，应尽可能被 TLS 取代。TLS 在总体上与 SSL 相同的方式运行，但它使用更强的身份验证和加密协议。SSL\
  \ 或 TLS 用于创建按需隧道，而不是使用 IPSec 在网络层建立 VPN 并要求每个远程用户安装客户端。远程用户无需安装客户端，并且可以通过网络浏览器访问私有网络。\n\
  \nSSL 和 TLS 都具有以下功能：\n* 在不安全的网络上支持安全的客户端-服务器通信，同时防止篡改、欺骗和窃听\n* 支持使用数字证书进行单向身份验证\n\
  * 支持使用数字证书进行双向身份验证\n* 通常作为 TCP 包的初始有效载荷实现，允许其封装所有更高层协议的有效载荷\n* 可以在更低层实现，例如网络层（第\
  \ 3 层）以作为 VPN 运行。这种实现称为 OpenVPN。\n\n此外，TLS 可用于加密 UDP 和会话发起协议（SIP）连接。TLS 加密会话是安全电子商务的首选机制。\n\
  \n### Kerberos\nKerberos 是一种通信协议，提供对登录凭据的保护。它使用票据的概念，允许在不安全网络上通信的系统安全地相互证明身份。Kerberos\
  \ 在 第 5 章，“身份和访问管理”中进一步讨论。\n\n### Internet 协议安全\nIPSec 是一套协议，用于提供通过 IP 网络发送的数据的保密性、完整性和身份验证（注意：此\
  \ *a* 是身份验证，而非可用性）。IPSec 使用多种安全服务来实现身份验证和加密：\n* **身份验证头（AH）：** 这会验证发送者，并发现传输过程中数据的任何更改。\n\
  * **封装安全有效载荷（ESP）：** 这不仅对发送者进行身份验证，还会加密发送的数据。\n* **安全关联（SAs）：** 这些提供了共享安全属性或密钥和数据的捆绑包，为\
  \ AH 和/或 ESP 操作提供必要的参数。\n\nIPSec 有两种模式：\n* **传输模式：** 这仅加密和验证 IP 有效载荷，即数据包中传输的数据，以确保安全的通信通道。\n\
  * **隧道模式：** 这将加密和验证整个 IP 数据包，其中包括数据以及路由信息，以形成具有新的 IP 头的新 IP 数据包，从而在两个地点之间提供安全通信（即建立\
  \ VPN）。\n\n### Internet 密钥交换\n\n\n\n\n\nIKE 是一种安全协议，属于 IPSec 套件的一部分，用于在两个实体之间建立安全、经过身份验证的通信通道。IKE\
  \ 协议通常使用 X.509 PKI 证书进行身份验证，并使用 Diffie–Hellman–Merkle 密钥交换协议来建立共享会话密钥。\n\nIKE 有两个版本：IKEv1\
  \ 和 IKEv2，其中 IKEv2 的设计目的是解决第一版中存在的一些配置和安全问题。即便如此，IKE 的两个版本都容易受到离线字典攻击，这需要使用高熵密码来防范。此外，同时支持\
  \ IKEv1 和 IKEv2 的 IPSec VPN 配置可能容易受到降级攻击，从而强制使用安全性较低的版本 1。可以通过将需要 IKEv1 的系统与适合更严格\
  \ IKEv2 配置的系统进行隔离来缓解此问题。\n\n### 多层协议的影响\n\nTCP/IP 是多层协议的一个例子，其中多个独立协议位于各个协议栈层中。封装是多层协议架构的重要功能和优势。在两个主机之间网络通信的上下文中，*封装*意味着将一种协议的内容作为后续协议的有效载荷进行封装。为了说明封装过程，请考虑\
  \ Web 服务器到 Web 浏览器的数据传输，该传输是 HTTP 封装在 TCP 中。TCP 封装在 IP 中，而该数据包封装在以太网中。TCP/IP 还可以添加额外的封装层。可以在通信中添加\
  \ SSL/TLS 加密以提供额外的保密性。\n\nTCP/IP 封装也有用于对抗性目的的实例。一些攻击工具可以隐藏或隔离未经授权的协议，使其位于已授权的协议内。使用\
  \ HTTP 隧道等技术，FTP 可以隐藏在 HTTP 数据包中以绕过出口限制。\n\n#### 虚拟局域网\n\n攻击者还可以使用多层协议封装来欺骗内部交换设备，从而获得访问\
  \ VLAN 的能力。VLAN 用于将网络流量隔离到其自己的独立广播域中。（参见 Figure 4.7。）交换机根据标识 VLAN ID 的标签知道将该流量放置在哪个\
  \ VLAN 上。根据 IEEE 802.1Q，这些标签封装每个数据包。当 VLAN 通过逻辑寻址建立时，VLAN 跳转是一种使用双重封装的 IEEE 802.1Q\
  \ VLAN 标签的攻击。需要明确的是，这是一个 VLAN 标签封装了一个已经用不同 VLAN ID 封装的数据包。第一个 VLAN 标签会被它遇到的第一个交换机移除。下一个交换机将根据第二层\
  \ VLAN 封装标签无意中移动流量。\n\n![FIGURE 4.7 Virtual local area network](img/c04f007.png)\n\
  \n**FIGURE 4.7 Virtual local area network**\n\n#### 监控控制与数据采集系统\n\n多层协议的一个影响是能够通过更普遍的传输协议，主要是\
  \ TCP/IP 来启用特定通信协议。最突出的例子可能是能源和公用事业行业中使用的工业控制，即监控控制与数据采集（SCADA）系统。SCADA 是一种控制系统架构，使用计算机收集流程数据并向构成系统的连接设备发送控制命令。\n\
  \nSCADA 系统使用一种名为分布式网络协议（DNP3）的旧协议。DNP3 主要存在于电力和水务公用事业及管理行业中。数据在工业控制系统的各个组件之间传输，例如变电站计算机、远程终端单元（RTU）和\
  \ SCADA 主站（控制中心）。DNP3 是一个开放的公共标准。DNP3 与 TCP/IP 套件之间有很多相似之处，因为它们都是多层协议，在各自的层中具有链路和传输功能。\n\
  \n最终，为了使这些 SCADA 系统通过公共网络提供一定的连接性，解决方案是将 DNP3 封装在 TCP/IP 上。这种封装虽然明显在不同的标准之间架起了连接，但确实带来了巨大风险。也许最常见的利用这种风险的方式是通过\
  \ MITM 攻击。\n\n专有技术建立了 SCADA 系统，但最近它们已转向更开放和标准化的解决方案。随着这种演变而来的安全问题。最初，这些系统是为分散的设施设计的，例如电力、石油、天然气管道、水分配和废水收集系统。连接并不是主要问题，因为系统设计为开放、稳健且易于操作和维修。任何安全都是次要问题。日益增加的是\
  \ SCADA 系统、办公网络和互联网之间的连接。互联互通使系统进入了与其他所有基于 IP 的局域网和广域网相同的漏洞。虽然 SCADA 系统中信息保护的重点不一定是敏感的个人信息，但\
  \ SCADA 网络安全的主要关注点是系统中断、敏感配置信息和国家安全。\n\n### 汇聚协议\n\n汇聚协议与封装的多层协议不同。汇聚协议是指将专用或专有协议与标准协议（如\
  \ TCP/IP 套件协议）合并时发生的情况。通过汇聚协议，组织可以减少对不同昂贵专有硬件的依赖，并根据使用哪种汇聚协议创建性能变化。\n\n以下是一些常见的汇聚协议示例：\n\
  \n*   **Fibre Channel over Ethernet (FCoE)：** Fibre Channel 解决方案通常需要单独的光纤电缆基础设施来提供网络数据存储选项，例如存储区域网络（SAN）或网络附加存储（NAS）。Fibre\
  \ Channel 有用，因为它允许高速文件传输，达到 128 Gbps，今天达到 256 Gbps。FCoE 的开发是为了使 Fibre Channel 更高效地工作，同时使用更便宜的铜缆通过以太网连接。使用\
  \ 10 Gbps 以太网，FCoE 使用以太网帧来支持 Fibre Channel 通信。\n\n*   **Internet Small Computer\
  \ System Interface (iSCSI)：** iSCSI 通常被视为 Fibre Channel 的低成本替代方案。它也是基于 IP 的网络存储标准。它促进了远程存储卷通过网络的连接，就好像设备本地连接一样。iSCSI\
  \ 通过 IP 网络传输 SCSI 命令，表现得像一根虚拟 SATA（或 SCSI）电缆。\n\n*   **Multiprotocol Label Switching\
  \ (MPLS)：** MPLS 是一种高吞吐量、高性能的网络技术，根据短路径标签而不是更长的网络地址在网络中引导数据。与复杂且需要更长时间导航的 IP 路由进程相比，MPLS\
  \ 节省了大量时间。使用封装，MPLS 设计用于处理各种协议。MPLS 网络可以处理 T1/E1、ATM、帧中继、同步光网络（SONET）和 DSL 网络技术，而不仅仅是\
  \ TCP/IP 和兼容协议。MPLS 通常用于在两个站点之间创建虚拟专用电路。在 OSI 模型中，MPLS 通常被标记为第 2.5 层协议，因为它在数据链路（第\
  \ 2 层）和网络（第 3 层）协议的常见定义之间运行。\n\n\n\n\n\n**Voice over Internet Protocol (VoIP)：**\
  \ `VoIP` 是一种使用多种技术将语音通信和多媒体会话封装在 `IP` 网络上传输的方法。`VoIP` 已成为企业和个人使用 `TCP/IP` 网络连接运营电话解决方案的一种流行且经济实惠的方式。`VoIP`\
  \ 将在本书本章后面“根据设计实施安全通信渠道”部分进一步讨论。\n\n### 微分段\n\n*Microsegmentation* 是一种在网络内创建区域以隔离资源并单独保护每个段的方法。跨区域查看或以其他方式访问资源时，微分段需要重新进行身份验证。\n\
  \n网络架构师可以利用微分段创建策略，基于零信任架构的原则（在 Chapter 3 中讨论）限制资源之间的网络流量。这样做可提供更小的攻击面、更简化的策略管理以及对网络的更好可见性。\n\
  \n微分段是一种日益增长的做法，`MIST` 于 2020 年 8 月发布了相关的零信任架构指导，`ENISA` 自 2020 年以来发布了多篇与微分段相关的论文。\n\
  \n#### 软件定义网络\n\n`SDN` 是一种网络管理方法，使网络能够集中管理（或编程），提供跨各种厂商、应用程序和技术的整体管理。`SDN` 架构允许动态网络配置和管理，从而提高网络性能，并为组织（尤其是云服务提供商）提供其整个网络架构的集中视图。\n\
  \n`SDN` 将硬件和基于硬件的设置与数据传输的网络服务分离。换句话说，`SDN` 将网络控制从网络转发能力（如路由）中抽象出来，将传统上单一的功能创建为两个层（基础设施层和控制层）。\n\
  \n`SDN` 架构的三个层是：\n\n*   **基础设施层（数据平面）：** 网络交换机和路由器以及数据本身，以及将数据转发到适当目的地的过程\n*   **控制层：**\
  \ 设备中的智能以真正的中间人方式工作，根据基础设施层的状态和应用层指定的要求确定流量应如何流动\n*   **应用层：** 与控制层交互以指定需求和要求的网络服务、实用程序和应用程序\n\
  \n使用 `SDN` 消除了将传统网络概念如 `IP` 地址、子网、路由等编程到托管应用程序中或由其解析的需求。它还提高了响应威胁变化的能力，快速适应动态的物理和业务条件，并利用最佳可用技术（无论厂商如何）。\n\
  \n当然，使用 `SDN` 除了其好处外还有安全影响。由于该架构如此灵活且可扩展，`SDN` 配置不正确的情况并不少见。`SDN` 配置错误会导致网络流量意外流动。原本应在网络一个区域的流量被发现出现在网络的另一部分。\n\
  \n`SDN` 的另一个 perceived 弱点是缺乏一种通用标准或实现方式。同样，鉴于其极强的灵活性，没有一种做法并不令人惊讶。尽管如此，仍存在标准。`SDN`\
  \ 的首个标准之一是 `OpenFlow`。`OpenFlow` 最初是定义控制平面如何与数据平面协同工作的方式。`OpenFlow` 将其与数据平面的交互分为两个独立的“方向”。`OpenFlow`\
  \ 通过南向应用程序编程接口（`APIs`）与交换机和路由器（无论是虚拟还是物理）协同工作。同样，`OpenFlow` 通过北向 `APIs` 与网络的业务逻辑协同工作。\n\
  \n#### 软件定义安全\n\n随着微分段的持续流行，实施安全控制的新方法不断被开发和实施。*软件定义安全*（`SDS`）是一种安全模型，其中安全机制由安全软件控制和管理。`SDS`\
  \ 是软件管理的、基于策略的安全，包含网络分段、入侵检测和预防、用户和设备识别、应用程序控制等。而传统安全架构可能无法满足物理基础设施复杂的<|message|>\
  \ 安全需求，`SDS` 能够为软件定义网络和环境实施和管理更先进、更自动化的安全控制。\n\n#### 软件定义广域网\n\n软件定义广域网（`SD-WAN`）是将\
  \ `SDN` 实践扩展到连接分布在互联网上的实体以支持 `WAN` 架构的延伸，尤其与云环境相关。`SD-WAN` 解决方案提供了一种替代传统 `WAN` 路由器的选择，并且对\
  \ `WAN` 传输技术不敏感。 much like `SDN`，`SD-WAN` 将控制平面与数据平面解耦。`SD-WAN` 使用软件控制数据中心与远程网络（如云服务提供商\
  \ `CSPs`）之间服务的连接和管理。\n\n根据 Gartner 的说法，`SD-WAN` 具有四个特征：\n\n*   必须支持多种连接类型（例如，互联网、`MPLS`、`LTE`\
  \ 等）\n*   可以执行动态路径选择以支持在 `WAN` 连接之间进行负载共享\n*   提供管理 `WAN` 的简单界面\n*   必须支持 `VPNs`\
  \ 和其他第三方服务\n\n#### 虚拟可扩展局域网\n\n虚拟可扩展局域网（`VXLAN`）是一种网络虚拟化技术，使用封装技术将第 2 层以太网帧封装在第\
  \ 4 层 `UDP` 数据报中。`VXLAN` 技术允许网络架构师对大型网络进行分段（类似于 `VLANs`），其规模是 `VLANs` 无法支持的。例如，从理论上讲，可以在一个域中创建多达\
  \ 1600 万个 `VXLANs`，而最多只能创建 4,094 个 `VLANs`。这种用于大规模分段的额外灵活性使 `VXLANs` 能够满足大型多租户公共云服务提供商的需求。\n\
  \n#### 封装\n\n如前所述，封装涉及将一种协议包裹在后续协议的内容（或有效载荷）周围。更广泛地定义，封装是逻辑上将网络中的功能与其底层结构（例如硬件）分离的方法。本节中的所有微分段方法都使用某种形式的封装。\n\
  \n### 无线网络\n\n通过消除到端点的布线依赖，无线技术极大地扩展了网络能力。部署无线网络相对容易，已成为许多家庭和企业环境的首选。随着 `IoT` 采用的快速增长，对无线能力的需求持续增加。\n\
  \n\n\n\n\n无线网络面临与任何有线网络相同的漏洞、威胁和风险，但它们也有额外的安全考虑。无线技术的主要问题之一是默认配置下技术的不安全本质。例如，无线设备有时会出厂预设默认凭据，这些凭据可以猜到或在互联网上找到（例如用户名为\
  \ `admin`，密码为 `password`）。如果接收者在设备投入生产环境之前更改了凭据或建立了多因素认证流程，这是可以接受的，但如果不这样做，则是巨大的风险。无线网络还面临着使用捕获并读取电磁信号中传输数据的设备的\
  \ `MITM` 类型窃听和数据包嗅探的更大风险。最近，随着 `IoT` 设备的激增，无线 `DDoS` 攻击已成为备受关注的破坏性攻击。无线连接设备的配置弱点允许攻击者将恶意机器人植入网络摄像头、智能个人助理设备和智能手机等设备中，形成僵尸网络，向外发送几乎无限的信号以瘫痪关键服务和高度可见的网络目标。\n\
  \n无线攻击曾经仅限于使用定向天线的黑客，但现在 Wi-Fi 和蜂窝监控与攻击工具已随处可得且非常隐蔽。现代无线网络必须防范一系列威胁，包括贵组织清洁工进行射频\
  \ (`RF`) 测绘等情况。\n\n要妥善准备应对无线网络，您必须了解规范和协议，这些规范和协议管理着无线技术。您还需要了解保护无线接入点 (`WAPs`)\
  \ 和无线技术总体所涉及的各种技术、方法和障碍。这种知识对于充分了解如何应对无线攻击至关重要。以下各节将更详细地探讨这些主题。\n\n## Wi-Fi\n\n\
  Wi-Fi（或无线保真）是当今最常见的无线协议家族之一，Wi-Fi 网络通信受 `IEEE 802.11` 系列标准管辖。标准的演进通过修正案发布，记录了原始标准的更新版本。这些在\
  \ Table 4.2 中突出显示，并且应注意 `802.11` 标准的每个版本或修正案都提供了改进的最大数据速率。`802.11x` 通常用于表示所有特定实现作为一个整体，但这不如对\
  \ `802.11` 的一般引用受欢迎。\n\n**TABLE 4.2  802.11 Standard Amendments**\n\n| STANDARD\
  \ || FREQUENCY || MAX DATA RATE |\n\n| --- | --- | --- |\n\n| 802.11 || 2.4 GHz\
  \ || 2 Mbps |\n\n| --- | --- | --- |\n\n| 802.11a || 5 GHz || 54 Mbps |\n\n| 802.11b\
  \ || 2.4 GHz || 11 Mbps |\n\n| Wi-Fi 3  \n\n(802.11g) || 2.4 GHz || 54 Mbps |\n\n\
  | Wi-Fi 4  \n\n(802.11n) || 2.4 GHz and 5 GHz || 600 Mbps |\n\n| Wi-Fi 5  \n\n(802.11ac)\
  \ || 5 GHz || 3.5 Gbps |\n\n| Wi-Fi 6 (802.11ax) || 2.4 GHz and 5 GHz || 9.6 Gbps\
  \ |\n\n| Wi-Fi 6E  \n\n(802.11ax) || 6 GHz || 9.6 Gbps |\n\n### Wired Equivalent\
  \ Privacy and Wi-Fi Protected Access\n\n`Wired Equivalent Privacy` (`WEP`) 和 `Wi-Fi\
  \ Protected Access` (`WPA`) 是用于 Wi-Fi 通信的两种最常用的加密标准。如今，`WEP` 被认为是一种高度不安全的标准，不应使用。`WPA`\
  \ 仍在不断演进，其中 `WPA3` 是当前应用于保护 Wi-Fi 通信的标准。我们在本节的其余部分介绍 `WEP`、`WPA`、`WPA2` 和 `WPA3`。\n\
  \n`IEEE 802.11` 标准定义了无线客户端在无线链路上进行正常网络通信之前可用于向 `WAPs` 进行身份验证的两种方法。这两种方法分别是开放系统认证\
  \ (`OSA`) 和共享密钥认证 (`SKA`)。\n\n*   `OSA` 不提供任何保密性或安全性，因为不需要真正的身份验证。如果无线电信号足够强以到达兼容接收器，则通信就会发生。所有\
  \ `OSA` 传输均未加密。\n*   `SKA` 强制执行某种形式的身份验证，如果未提供身份验证，则会阻止通信。`802.11` 标准定义了一种用于 `SKA`\
  \ 的可选技术，即 `Wired Equivalent Privacy` (`WEP`)，随后的对原始 `802.11` 标准的修正案增加了 `WiFi Protected\
  \ Access` (`WPA`)、`WPA2`、`WPA3` 和其他技术。`WEP`、`WPA` 和 `WPA2` 应尽可能全部迁移到 `WPA3`。\n\n\
  `WEP` 的设计目的是保护无线通信免受窃听。`WEP` 的最初目标是为无线通信提供与有线网络相同的 `MITM` 攻击防护水平。`WEP` 使用 Rivest\
  \ Cipher 4 (`RC4`) 对称流密码对无线传输中的数据进行加密。由于使用了哈希值来验证接收到的数据包在传输过程中是否被修改或损坏，因此可以进行消息完整性验证。它还可以配置为防止未经授权的访问。知道或拥有加密密钥可提供一种基本形式的身份验证；没有密钥，则无法访问网络本身。`WEP`\
  \ 用于 OSI 模型的两个最低层：数据链路层和物理层。因此它不提供端到端安全性。随着时间的推移，`WEP` 已被证明存在重大的安全弱点。例如，`WEP` 使用静态加密密钥，同一密钥由无线网络上的每个设备使用。因此，如果窃听者截获了足够多的加密数据包，则密钥可能会被推断出来。事实上，`WEP`\
  \ 几乎在发布后不久就被破解了。破解 `WEP` 保护只需不到一分钟，使 `WEP` 在无线安全方面完全无用。\n\n为了改进无线安全，一个名为 Wi-Fi Alliance\
  \ 的组织开发了一种新的加密标准，称为 `WPA`。作为 `WEP` 的替代品，`WPA` 可以改造已在计算环境中为 `WEP` 设计的无线网卡上的 `WEP`\
  \ 固件。该功能证明问题多于价值。对 `WAPs` 所需的更改非常广泛，硬件更换是更好的选择。\n\n`WPA` 旨在作为临时解决方案，直到 `IEEE` 发布承诺的\
  \ `802.11i` 标准（在下一节中讨论）。该过程拖延了多年，因此 `WPA` 独立于 `802.11` 修正案实施。`WPA` 协议实现了轻量级可扩展认证协议\
  \ (`LEAP`) 和临时密钥完整性协议 (`TKIP`)，支持每个数据包的密钥，可为每个数据包动态生成新的 128 位密钥。`WPA` 与每个主机协商唯一的密钥集。它改进了必须手动输入到\
  \ `WAPs` 和设备上且不会更改的 `WEP` 64 位或 128 位加密密钥。\n\n\n\n\n\nWPA 使用 LEAP 和 TKIP 来执行消息完整性检查，其设计目的是防止攻击者篡改并重新发送数据包。这取代了\
  \ WEP 标准所使用的循环冗余校验（CRC）。CRC 的主要缺陷在于它并未为所处理的数据包提供足够强的数据完整性保证。研究人员已在 WPA 中发现了一个与 WEP\
  \ 弱点类似的缺陷。WPA 通常采用静态但秘密的密码短语进行身份验证。理论上，暴力攻击可能导致密码短语被猜出。对于足够强的密码短语（不少于 14 个字符）， succumbing\
  \ to this attack 的可能性很低，但并非不可能。同时，消息完整性检查哈希函数可以被利用，从短串数据包中提取密钥流，用于注入攻击或欺骗。基本上，针对\
  \ WPA 的特定攻击——例如 coWPAtty 和一种基于 GPU 的破解工具——已使 WPA 的安全性变得不可靠。WPA 的 LEAP 和 TKIP 加密选项现在都被认为可使用多种可用且易于使用的破解技术进行破解。\n\
  \n### WPA2 (或 IEEE 802.11i)\n\nWi-Fi 安全的下一个演进是 WPA2，它取代了 WPA。最初，它本意是取代 WEP，但正如前文所述，802.11i\
  \ 标准一再拖延，而 WPA 则独立实施。该修正案解决了原始 802.11 标准的 安全问题。WPA2 与 WPA 向下兼容。它通过实现美国国家标准与技术研究院（NIST）FIPS\
  \ 140-2 合规的 AES 加密算法和基于 802.1x 的身份验证，以及计数器模式密码块链接消息认证码协议（CCMP）来提供美国政府级别的安全性。WPA2\
  \ 有两个版本：WPA2-Personal 和 WPA2-Enterprise。WPA2-Personal 通过使用设置密码来保护未经授权的网络访问。WPA2-Enterprise\
  \ 通过服务器使用网络访问控制（NAC）来验证网络用户。\n\n选择 WPA2 名称的原因是 WPA 已发布并被广泛使用。然而，WPA2 并不是 WPA 的第二个版本。它们是截然不同且各不相同的。IEEE\
  \ 802.11i，即 WPA2，实现了与 IPSec 类似的概念，以提高无线网络内的加密和安全性。\n\n在 2018 年底，即较新的 WPA3（下文讨论）宣布后不久，研究人员发现了\
  \ WPA2 中的一个弱点，该弱点会允许攻击者窃取预共享登录密码、窃听通信并执行中间人攻击。\n\n### WPA3\n\nWi-Fi 联盟于 2018 年 1\
  \ 月宣布 WPA3 取代 WPA2。较新的标准使用 192 位加密和每个用户的个性化加密。它还提供弱密码缓解和为无人工界面设备简化设置流程。截至 2020 年\
  \ 7 月，Wi-Fi 联盟认证的任何设备都必须支持 WPA3。作为标准做法，您应检查您的无线启用设备以确定支持哪些 Wi-Fi 标准。如果您的网络是 WEP\
  \ 或 WPA，您必须升级到 WPA2 兼容或最好是 WPA3 兼容的路由器以保护您组织的网络。\n\n### IEEE 802.1X\n\nWPA、WPA2\
  \ 和 WPA3 支持企业身份验证 802.1X/EAP，这是一种基于端口的网络访问控制标准，用于确保客户端对网络资源的访问控制。有效地，802.1X 是一个检查系统，允许无线网络利用现有网络基础设施的身份验证服务。通过使用\
  \ 802.1X，其他技术和解决方案（如 RADIUS、TACACS、证书、智能卡、令牌设备和生物识别）可以集成到无线网络中，提供多因素身份验证技术。\n\n\
  ### 可扩展身份验证协议\n\n可扩展身份验证协议（EAP）是一种身份验证框架，而非特定的身份验证机制。EAP 促进了现有无线或点对点连接技术与新身份验证技术之间的兼容性。超过\
  \ 40 种不同的 EAP 身份验证方法得到广泛支持。这些包括 LEAP、EAP-TLS、EAP-SIM、EAP-AKA 和 EAP-TTLS 等无线方法。两个值得更仔细研究的\
  \ EAP 方法是受保护的可扩展身份验证协议（PEAP）和 LEAP。\n\n#### 受保护的可扩展身份验证协议\n\n使用 TLS 隧道，PEAP 将 EAP\
  \ 方法封装起来以提供身份验证，并可能提供加密。由于 EAP 最初是为在物理隔离通道上使用而设计，因此假定路径是安全的，因此 EAP 通常未加密。因此，PEAP\
  \ 可以为 EAP 方法提供加密。\n\n#### 轻量级可扩展身份验证协议\n\nLEAP 是 Cisco 专有的 WPA 的 Temporal Key Integrity\
  \ Protocol（下文讨论）的替代方案，但不应使用。2004 年发布了一种名为 Asleap 的攻击工具，可利用 LEAP 最终提供的薄弱保护。首选使用 EAP-TLS。如果必须使用\
  \ LEAP，则必须使用复杂的密码。LEAP 在 802.11i/WPA2 出现之前用于解决 TKIP 中的缺陷。\n\n#### 临时密钥完整性协议\n\n\
  TKIP 被设计为在无需更换旧无线硬件的情况下取代 WEP。TKIP 在 WPA 指南内被纳入 802.11 无线网络标准。TKIP 的改进包括一个密钥混合函数，该函数在将该密钥与\
  \ RC4 一起使用进行加密之前，将初始化向量（IV）（即随机数）与秘密根密钥结合；使用序列计数器来防止数据包重放攻击，并使用强大的消息完整性检查（MIC）。\n\
  \n#### 计数器模式密码块链接消息认证码协议\n\nCCMP 是为取代 WEP 和 TKIP/WPA 而创建的。CCMP 使用 128 位密钥的 AES。CCMP\
  \ 是由 802.11i 指定的 802.11 无线网络的首选标准安全协议。迄今为止，尚未有针对 AES/CCMP 加密的成功攻击。CCMP 是 WPA2 和\
  \ WPA3 中使用的标准加密机制。\n\n### 保护无线接入点\n\n无线接入点（WAP），有时仅称为接入点（AP），是一种网络设备，允许无线启用设备连接到有线网络。WAP\
  \ 直接连接到有线局域网，然后使用 Wi-Fi 或其他无线技术（例如 Li-Fi）向该有线局域网提供无线连接。\n\n本节关于如何保护 WAPs 的内容仅假设需要无线访问，但尚未采取任何创建无线访问的行动。创建无线访问并非从随意放置硬件开始。首要采取的行动是进行现场勘查。现场勘查对于评估当前是否存在任何无线访问非常有用。它也有助于未来规划。勘查完成后，即可决定\
  \ WAP 的放置位置。本节还涵盖了为所选硬件选择正确的天线类型进行广播的决策。\n\n配置您的接入点是下一步。我们首先研究广播信道为何重要。接下来，讨论硬件可以设置的模式，例如是否将通信集中化或形成某种传输网状结构。还需考虑网络如何标记和广播，使用服务集标识符（SSIDs）。最后，涵盖了额外的安全访问方法，从低级别的\
  \ MAC 地址过滤到高级别的使用访客门户。\n\n#### 进行现场勘查\n\n现场勘查是对识别 rogue APs 以及定义 AP 的放置、配置和文档的有用技术。它们通常因合规原因而必需，但应一般定期进行或在物理环境发生变化时进行。\n\
  \n\n\n\n\nRogue WAPs 是在原本安全的网络上安装的 WAP，但未经明确授权。这些 rogue AP 使组织难以追踪和监控其授权资产，并且对通过它们连接并传输数据的设备也构成安全风险。有时，rogue\
  \ AP 是由员工出于 perceived 的访问或性能需求而实施的。更令人担忧的是恶意攻击者安装 rogue AP 以试图欺骗终端用户连接到的情况。此类攻击会窃取凭证、帮助发起\
  \ DDoS 攻击，或导致数据被盗。安全人员必须进行搜索和扫描，以防备这些不受欢迎的设备。\n\n实地走查，或站点勘测，是一种在物理环境中发现 rogue AP\
  \ 的方法。在站点勘测期间，安全人员调查部署在环境中的 WAP 的存在、强度和覆盖范围，同时寻找未经授权的信号。在进行走查时，可以使用带有无线网卡的普通终端客户端来简单地检测信号。另一种方法是使用各种无线入侵检测设备来扫描环境。\n\
  \n站点勘测还提供运营方面的好处，因为审查有助于定义 AP 的最佳放置和配置，并为 AP 生成文档。最佳放置和配置包括确保在所有需要访问的位置都有足够的信号强度。同时，在不希望访问的地方，如公共区域或设施外部，信号可用性应最小化或消除。站点勘测对于评估现有无线网络部署（例如外部环境发生变化时）、规划当前部署的扩展以及规划未来部署非常有用。\n\
  \n### 确定无线接入放置\n\n利用站点勘测确定的信息，可以识别出最佳的 WAP 位置。不建议在走查提供信息之前就确定具体位置。放置多个 WAP 后，进行适当的配置和信号强度测试。在此阶段很可能会有移动和调整。一旦达到最佳配置和位置模式，就将位置固定下来。\n\
  \n以下是无线接入放置的一些一般考虑因素：\n* 使用中心位置。\n* 避免实体物理障碍。\n* 避免反射或其他平坦金属表面。\n* 避免使用电气设备（干扰）。\n\
  * 将外部全向天线垂直指向。\n* 将定向天线指向期望使用区域。\n\n无线技术的一个基本考虑因素是环境对广播信号的影响。无线信号会受到各种干扰的影响——物理和电磁。距离和障碍物是物理方面的顾虑。电力和其他无线电信号可能会与无线信号冲突或阻碍其有效性。网络管理员会操纵定向天线并调整信号强度，以适应物理和电磁障碍，从而到达期望的访问区域。\n\
  \n天线的主要安全问题是了解信号模式（或 *lobe pattern*）如何从天线延伸出来。这对于定向天线尤其如此，因为天线的波瓣在某一聚焦方向上会延伸得远超典型的单向天线，而在其他方向上则被衰减（即降低）。即使没有特殊设备，也可以通过在\
  \ AP 周围走同心圆并使用移动设备测量辐射强度来进行测量。\n\n### 天线类型\n\n天线是无线通信系统中的一个组成部分。天线将电信号转换为无线电波，反之亦然。信号传输要求和接收质量决定了从各种可用天线中选择哪种天线。标准天线可以升级为信号增强、更强劲的天线。一些最常见的天线类型如下：\n\
  * 标准直杆、偶极子或垂直天线向天线四周所有方向发送信号。这种辐射模式是全向的，是基站和终端设备上最常见的天线类型。\n* 许多其他类型的天线是定向的。信号不是向各个方向广播，而是聚焦到一个方向。\n\
  \n关于保护无线网络，有几个关键的天线考虑因素。最重要的是，认识到定向天线会在一个聚焦方向上显著扩展网络的覆盖范围。这对于接收和发送都适用。因此，在指向定向天线时必须小心，以免网络的可见性和漏洞被投射得太远。对于天线的选择和放置，请记住广播会延伸过墙壁和楼层，尤其是在组织位于多租户建筑中时。\n\
  \n### 无线信道\n\n无线信号在频率范围内以称为 *channels* 的增量细分。这些信道就像道路或高速公路上的车道。举例来说，对于 `2.4 GHz`\
  \ 频率，美国有 11 个信道，欧洲有 13 个，日本有 17 个。在美国，`FCC` 监管频率并分配了 11 个。在其他国家和司法辖区，频率由国家或成员国联盟监管，这就解释了为什么频率数量存在差异。\n\
  \n通常，无线连接是终端客户端和 WAP 之间在单一信道上的通信信号。当两个或多个 AP 位于彼此太近的位置或 WAP 的无线电强度过高时，位于不同信道的设备之间也可能发生干扰。\n\
  \n安全专业人员应注意，信道选择对缓解无线风险（如欺骗、阻塞或网络可见性）几乎没有或没有影响。相反，信道是为最小化 AP 之间或其控制范围之外的其他 Wi-Fi\
  \ 网络之间的干扰而选择的。\n\n### 基础设施模式和 Ad Hoc 模式\n\n部署无线网络时，WAP 可以部署在两种模式之一：ad hoc 或基础设施。通常最好将\
  \ WAP 配置为基础设施模式而非 ad hoc 模式，以执行由 WAP 支持的限制。Ad hoc 模式允许无线设备在没有集中控制的情况下通信。基础设施模式阻止设备或网卡直接交互。\n\
  \n基础设施模式有四种不同的变体：\n* **Standalone：** WAP 将多个无线客户端相互连接，但不连接到任何有线资源。\n* **Wired extension：**\
  \ WAP 充当连接点或集线器，将无线客户端链接到有线网络。\n* **Enterprise extended：** 多个 WAP 全部使用相同的扩展服务集标识符（`ESSID`）来将大物理区域连接到同一有线网络。这允许物理设备移动而不丢失对\
  \ `ESSID` 的连接。\n* **Bridge：** 使用无线连接将两个有线网络连接起来，通常用于楼层或建筑物之间，在布线或拉线不可行或不方便时使用。\n\
  \n### 服务集标识符\n\n任何连接过无线网络的人都知道要询问网络名称，其技术术语为 `SSID`。`SSID` 就是标识无线网络的那串字符。它代表逻辑无线网络，而不是唯一的\
  \ AP，因为可以有多个接入点为一个或多个 SSID 提供覆盖。\n\n\n\n\n\nThere are two types of SSID, namely,\
  \ `ESSID` and basic service set identifier (`BSSID`). An `ESSID` is the name of\
  \ a wireless network in infrastructure mode when a wireless base station or `WAP`\
  \ is used. A `BSSID` is the name of a wireless network when in ad hoc or peer-to-peer\
  \ mode. In a scenario where multiple different base stations or `WAPs` are used\
  \ in infrastructure mode, the `BSSID` is the `MAC` address of the base station hosting\
  \ the `ESSID` to differentiate multiple base stations in the overall extended wireless\
  \ network.\n\nIn securing the `SSID` wireless network, regardless of the types,\
  \ note that the `SSID` is comparable to the name of a workgroup. When an endpoint\
  \ client discovers an `SSID`, the wireless `NIC` is configured to communicate with\
  \ the associated closest or strongest `WAP`. The `SSID` has secure access features\
  \ so that discovery does not necessarily equate to access. There are additional\
  \ steps before the client can communicate, such as enabling encryption and ensuring\
  \ that discovered `SSIDs` are legitimate. With enabling encryption, the client is\
  \ required to enter a password to permit access. Ensuring the legitimacy of the\
  \ `SSIDs` that clients might see requires the organization to periodically monitor\
  \ for rogue access points.\n\nA step that can be taken to better secure `WAPs` is\
  \ to disable the `SSID` broadcast of the beacon frame. A `beacon frame` is a special\
  \ broadcast transmission that the `SSID` sends regularly from the `WAP`. Discovery\
  \ by end-user clients occurs as any wireless `NIC` finds this radio signal. In fact,\
  \ with a detect and connect `NIC` feature, the connection can be automatic. Network\
  \ administrators can disable, or silence, the broadcast; this is recommended as\
  \ a security best practice. Disabling `SSID` broadcast makes connection a little\
  \ more difficult, as the end user must know the `SSID` address to search. Keeping\
  \ the beacon off and the `SSID` hidden is not foolproof. Attackers have tools to\
  \ discover `SSID` via wireless sniffer technology to capture `SSID` information\
  \ used in transmissions between wireless clients and the `WAPs`, as the `SSID` is\
  \ still needed to direct packets. Disabling `SSID` is a good first step. Hiding\
  \ the existence of the network is a best practice, but it is not in itself sufficiently\
  \ strong security. Not broadcasting the `SSID`, coupled with using `WPA3`, will\
  \ provide a reliable authentication and encryption solution with fewer failed attempts.\n\
  \n### Using Captive Portals\n\nCaptive portals are authentication safeguards for\
  \ many wireless networks implemented for public use, such as at hotels, restaurants,\
  \ bars, airports, libraries, and so on. They are a common practice on wired networks,\
  \ too. The process is to force a newly connected device to a starting page to establish\
  \ authorized access. The portal may require input of credentials, payment, or an\
  \ access code. It is also a good location to publish or provide a link to privacy\
  \ policies and acceptable use terms and conditions. If end-user consent for tracking\
  \ and information collection is required, the captive portal allows for that as\
  \ well. Once the end user satisfies the conditions required by the starting page,\
  \ only then can they communicate across the network.\n\n### MAC Filters\n\nA `MAC`\
  \ filter is a list of authorized wireless client `MAC` addresses that are permitted\
  \ to access a `WAP`. Devices not on the list are blocked. The downsides are that\
  \ the list is difficult to manage and does not scale to large environments with\
  \ many changes.\n\nThere are two approaches to utilizing `MAC` filters. In one approach,\
  \ someone, such as a network security analyst or a security professional tasked\
  \ with securing wireless access, would determine through asset management what devices\
  \ are permitted to connect. The other approach would be using a software solution\
  \ such as intrusion detection. Some access point vendors offer such features, including\
  \ the ability to detect `MAC` address spoofing to mitigate the risk of someone forging\
  \ a known whitelisted `MAC`.\n\n### Wireless Attacks\n\nIn spite of increasing attention\
  \ and capability for securing wireless networks, they remain attractive targets\
  \ for attackers. The types of attacks continue to grow, and many attacks are effective\
  \ on wired networks as well as wireless ones. Attacks such as packet sniffing, `MITM`,\
  \ and password theft are common to both wireless and wired networks and are discussed\
  \ earlier in the chapter. A few types of attacks focus on wireless networks alone,\
  \ like signal jamming attacks and a special collection of wireless attacks called\
  \ `war driving`.\n\nSignal jamming is the malicious activity of overwhelming a `WAP`\
  \ to the extent that legitimate traffic can no longer be processed. Even though\
  \ this is illegal in most places, there are inexpensive jamming products available\
  \ for sale online.\n\nWar driving is a bit of a play on words. The term has roots\
  \ in a form of attack in the 1980s called `war dialing`, where computers would be\
  \ used to make large numbers of phone calls searching for modems to exploit. War\
  \ driving, in contrast, is when someone, usually in a moving vehicle, actively searches\
  \ for `Wi-Fi` wireless networks using wireless network scanning tools. These scanning\
  \ tools and software are readily available and often free. When a wireless network\
  \ appears to be present, the attacker uses the tools to interrogate the wireless\
  \ interface or a wireless detector to locate wireless network signals. Once an attacker\
  \ knows a wireless network is present, they can use sniffers to gather wireless\
  \ packets for investigation. The next step in the attack is to discover hidden `SSIDs`,\
  \ active `IP` addresses, valid `MAC` addresses, and even the authentication mechanism\
  \ the clients use. `MITM` attacks may progress, or the attackers may conduct advanced\
  \ attacks with specialized tools, like `AirCrack` and `AirSnort`, to attempt to\
  \ break into the connection and gather additional sensitive information. When using\
  \ no security protocols or older ones, like `WEP` and `WPA`, attackers have very\
  \ little difficulty being successful.\n\nWar drivers often share the information\
  \ they gather. Not all war driving attacks are meant to disrupt or be particularly\
  \ malicious. It is likely the attackers are trying to simply get internet access\
  \ for free. Using the information obtained from their own tools, they combine data\
  \ with `GPS` information about location. Then they publish the information to websites\
  \ like `WiGLE`, `openBmap`, or `Geomena`. Other people access the maps of various\
  \ networks to find locations where they can hijack the wireless and access the internet\
  \ or conduct additional attacks.\n\nWar driving is not explicitly prohibited in\
  \ most countries. Some consider it ethically wrong, but at a high level, it is somewhat\
  \ analogous to neighborhood mapping in the physical world with house numbers and\
  \ phone numbers publicly listed. In fact, the reporting of war driving information\
  \ on the Web could be considered an expanded version of what `WAPs` are meant to\
  \ do: broadcast. However, as security professionals know, not all `WAPs` are broadcasting\
  \ publicly, as they are hidden.\n\n### Li-Fi\n\n`Li-Fi` (short for light fidelity)\
  \ is a wireless communication technology that uses light to transmit data. `Li-Fi`\
  \ is similar in use to `Wi-Fi`, except it uses visible, ultraviolet, or infrared\
  \ light to transfer data, rather than the radio frequency transmission that `Wi-Fi`\
  \ technology relies on.\n\nBecause `Li-Fi` uses light for transmission, it cannot\
  \ transfer data through walls or other physical barriers. As a result, `Li-Fi` offers\
  \ a security benefit over `Wi-Fi`, in that it can be contained within a physical\
  \ space. `Li-Fi` is a disruptive technology that is still not widely adopted, as\
  \ of this writing. `Li-Fi`'s security benefits and speed improvements (roughly 100x\
  \ the max bandwidth of today's `Wi-Fi`) have many projecting mass adoption in the\
  \ near future and even potentially replacing `Wi-Fi` in the next 10 years.\n\n###\
  \ Bluetooth\n\n\n\n\n\nBluetooth 是一种无线技术标准，支持短距离点对点无线传输。一般使用时，最大有效距离约为 30 英尺。然而，工业或高级版本的\
  \ Bluetooth 可达 300 英尺。许多类型的终端设备都支持 Bluetooth，例如手机、笔记本电脑、打印机、收音机和数字个人助理，以及日益增多的其他物联网设备。\n\
  \nBluetooth 的一个优点是它不需要基站，因为它是在设备之间建立的直接连接。它也只需要很少的电量，这对于通常配备 Bluetooth 的电池供电终端设备来说是很有利的。\n\
  \n也有一些缺点。传输速度比 802.11b 无线标准慢。它与现有的 802.11b 和 802.11g 网络冲突并产生干扰，因为它使用 2.4 GHz 广播频谱，导致依赖传输的终端设备出现问题。另一个重大缺点是\
  \ Bluetooth 因缺乏加密而固有的弱点。使用 Bluetooth 创建个人局域网也会带来安全隐患，因为个人局域网很可能存在企业扫描难以发现的漏洞。原因在于个人局域网是现有局域网或广域网的不可路由部分或扩展，因此不易评估。\n\
  \n### ZigBee\n\nZigBee 是基于 IEEE 802.15.4 的低成本、低功耗和低延迟无线通信标准。ZigBee 的协议设计得比其他无线技术（如\
  \ Wi-Fi）更简单，并用于需要短距离、低带宽数据传输的应用。常见应用包括医疗数据采集、工业控制系统、建筑自动化、家庭能源监控和其他家庭自动化用途。\n\n\
  ZigBee 在物联网应用中的广泛使用使其安全性受到大量审查。ZigBee 标准包括访问控制列表（ACL）、帧计数器和加密（使用 128 位 AES 密钥）等安全功能。尽管有这些安全功能，协议仍存在缺陷，如\
  \ 第 3 章 中“智能灯泡黑客”侧边栏所述。\n\n### 蜂窝网络\n\n蜂窝或移动网络是跨越多个蜂窝的无线通信。蜂窝是地理上分散的区域，由一个或多个小区站点或基站组成。小区站点或基站是固定在特定位置的收发器。蜂窝网络用户使用便携式设备通过特定的一组无线电波频率连接到小区站点和其他蜂窝设备或互联网。区分蜂窝技术的标准描述符指的是该技术引入时的世代。这可能会让人困惑。例如，4G\
  \ 和 5G 分别指第四代和第五代。它并不表示特定的频率或信号强度。表 4.3 提供了最新无线技术的概述。\n\n**表 4.3 蜂窝无线技术基本概述**\n\n\
  | 世代 || 3G || 4G || 5G |\n| --- | --- | --- | --- |\n| 时间线 || 2002 年至 2005 年 ||\
  \ 2010 年至今 || 2018 年至今 |\n| --- | --- | --- | --- |\n| 消息功能 || 图形和格式化文本 || 完整统一消息\
  \ || 完整统一消息 |\n| 数据支持 || 分组交换 || 原生 IPv6 || 原生 IPv6 |\n| 目标数据速率 || 2 Mbps || 1 Gbps\
  \ || 20 Gbps |\n\n虽然 4G 自约 2010 年以来一直是领先的蜂窝技术，但 5G 技术于 2018 年有限推出，并在 2020 年后实现了显著增长。4G\
  \ 与 5G 的关键区别在于后者提供的速度提高了十倍。这种显著的速度提升为蜂窝技术带来了新的应用，并预计在不久的将来进一步推动物联网技术的发展。更多具有更大能力的互联网连接设备意味着更大的攻击面，CISSP\
  \ 在今后必须考虑这一点。\n\n安全专业人员在支持和保护蜂窝无线网络中发送和接收的信息时应牢记一些重要考虑因素。自 2G 以来，蜂窝使用已远不止语音。今天的手机（智能手机）具有更高级别的计算能力来运行应用程序、发送文本、发送图像、流式传输视频并存储大量敏感数据。因此，需要保护的通信需要额外的技术控制。蜂窝交易本身并不安全。攻击者可以利用众多工具拦截无线传输。一种常见的攻击场景是使用蜂窝基站进行中间人流量捕获。这些攻击无论蜂窝连接是到互联网还是仅在两个或多个移动设备之间都可能发生。作为\
  \ CISSP，您在制定或管理组织的自带设备（BYOD）政策时应考虑这些威胁。\n\n### 内容分发网络\n\n内容分发网络（CDN），也称为 *内容交付网络*，是一组地理分布的资源服务、代理服务器和数据中心。这种架构模型的本质是提供低延迟、高性能和高可用性的内容，尤其是在大范围（通常是国家或大陆）内的多媒体、电子商务和社交网络网站。内容尽可能靠近请求客户获取，从而实现更低的延迟和更大的吞吐量。\n\
  \nCDN 内容分布在许多数据主机中，而不是集中在一个位置。虽然这对可用性有积极影响，因为内容分发降低了任何一个位置离线的[content]\n\nBluetooth\

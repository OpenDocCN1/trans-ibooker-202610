  \n## 通信与网络安全\n\n资产是组织用于创造价值的任何事物，包括思想、流程、信息和计算硬件。对资产进行分类和分类使组织能够优先分配有限的安全资源，以实现成本与效益的适当平衡，本域介绍了资产估值、分类和分类以及资产处理的重要概念，以便根据资产价值应用适当的保护。资产的价值决定了其所需的保护级别，这通常以安全基线或资产所有者必须满足的合规义务的形式表达。\n\
  \nCISSP 证书持有者将花费大量时间关注数据和信息安全问题。本域介绍了数据生命周期，以提供确定数据安全要求的明确阶段。保护始于定义处理数据的角色和流程，一旦数据创建后，必须遵循这些流程。这包括在创建、使用、归档以及不再需要时的最终销毁期间管理数据，并侧重于数据的三种主要状态：使用中、传输中和静态。\n\
  \n对于许多组织而言，处理敏感数据将涉及保护特定数据类型（如个人身份信息（PII）或与支付卡相关的交易数据）的法律或监管义务。支付卡数据受支付卡行业（PCI）理事会监管，而\
  \ PII 通常需要保护以遵守欧盟通用数据保护条例（EU GDPR）等区域或地方法律。两个合规框架都规定了组织在收集、处理和使用受监管数据时必须满足的具体保护义务。\n\
  \n## 身份与访问管理\n\n安全架构与工程域涵盖了在各种系统上实施和管理安全控制的相关主题。介绍了用于构建安全计划的安全设计原则，例如安全默认值、零信任和隐私设计。本域还涵盖了常见的\n\
  \n\n\n\n评估和测试可以作为内部或外部职能执行；虽然两者都适用于监控安全计划状态，但在某些情况下需要外部评估。例如，在必须进行评估且需避免任何利益冲突的情况下，第三方审计很常见。外部审计报告，例如服务组织控制或\
  \ SOC 2，可以帮助组织向外部方（如供应商或业务合作伙伴）传达其安全实践的细节。在这种情况下，审计员与被审计组织的独立性为报告使用者提供了额外的保证。\n\n\
  本领域介绍了道德渗透测试和相关的技术测试主题，包括测试覆盖范围和入侵攻击模拟。这类测试可以针对从单个信息系统到整个组织的各种目标进行，是识别安全控制缺陷的有价值工具。还讨论了此类测试发现的披露和处理方式，包括可能发现的信息的法律和伦理影响。\n\
  \n持续的评估和测试计划对于建立持续监控和支持合规需求也很有用。针对测试安全控制、漏洞和攻击模拟而设计并实施的适当策略，可衡量组织现有控制计划的有效性。必须解决任何已识别的缺陷，以确保充分的风险管理。\n\
  \n## 安全运营\n\n安全运营（`SecOps`）是 CBK 中其他领域的伴随领域，本章涉及实施、运营和维护组织安全计划所需的基础设施。安全从业人员必须首先进行风险评估，然后设计和运营涵盖技术、人员和流程的安全控制以减轻这些风险。`SecOps`\
  \ 是安全团队与其他组织部门之间的关键集成点，例如人力资源（`HR`）负责设计工作轮换或职责分离等关键任务，或负责实施和维护防火墙和入侵检测系统（`IDSs`）的网络工程团队。\n\
  \n`SecOps` 的逻辑安全方面包括运行和维护安全运营中心（`SOC`），这正成为安全计划中越来越关键的一部分。`SOC` 将威胁情报、事件响应和安全警报等信息集中起来，允许信息共享、更高效的响应以及对安全计划和职能的监督。规划和演练关键业务计划，如业务连续性和灾难恢复（`BCDR`），也是\
  \ `SecOps` 的重要组成部分。\n\n`SecOps` 还涵盖了重要的物理安全概念，如设施设计和环境控制，这对于具有网络安全或信息技术（`IT`）经验的安全从业人员来说通常是全新的概念。然而，信息系统及其所包含数据的物理安全是维护安全各方面的一个重要要素。在某些情况下，物理限制（如现有或共用的建筑物）是为补偿潜在的未经授权的物理访问而增加逻辑控制的驱动因素。\n\
  \n## 软件开发安全\n\n信息系统依赖于软件，因此确保用于开发软件的工具和流程的安全至关重要。这包括定制构建的软件以及集成到信息系统中的采购系统组件。云计算正在改变软件开发的范式，因此本领域还包括作为服务消费的计算资源的安全要求，如软件即服务（`SaaS`）、平台即服务（`PaaS`），以及容器化和微服务等新兴架构。\n\
  \n软件既可以是攻击者的目标，也可以是攻击载体。日益复杂的软件环境使用开源软件、预构建模块和库以及分布式应用程序，以为开发人员提供更快的速度和为用户提供更多功能。然而，这些业务优势引入了风险，例如不可信的第三方代码可能被包含在应用程序中，或攻击者针对远程访问功能。\n\
  \n软件开发生命周期（`SDLC`）中的充分安全需要一种结合人员、流程和技术的方法。本领域重新审视了关键的人员安全概念——培训，重点关注开发人员安全培训。完善的软件开发方法、指南和程序是本领域涵盖的基本流程控制。还介绍了涵盖软件开发环境和软件安全测试的技术控制，以及应用程序安全（`AppSec`）的测试方法，包括静态和动态测试。\n"
- "# DOMAIN 1\n\n## 安全与风险管理\n\n**CISSP** 通用知识体系（`CBK`）的**第 1 域**涵盖了构建和管理基于风险的信息安全计划的基础主题。本域涵盖了\
  \ `CBK` 其余部分所构建的各种概念。\n\n在深入探讨安全与风险管理概念的核心之前，本章首先介绍职业道德及其在信息安全领域的应用。作为一名安全专业人员，了解你的职责与了解如何应用安全概念同等重要。随后我们将讨论与理解组织使命、战略、目标和业务目标相关的话题，并评估如何安全地满足组织业务需求。\n\
  \n理解风险管理及其概念如何应用于信息安全，是你应从本章中获得的最重要收获之一。我们描述了风险管理概念并解释如何在组织的安全计划中应用它们。此外，了解相关的法律、监管和合规要求是每个信息安全计划的关键组成部分。第\
  \ 1 域包括网络犯罪和数据泄露、进出口管制以及进行各种类型调查的要求等概念的介绍。\n\n本章介绍了安全的人为因素，并包括有关向组织员工传授关键安全概念的方法的介绍。我们介绍了安全意识计划的结构，并讨论了如何评估教育和培训方法的效果。\n\
  \n## 理解、遵守并推广职业道德\n\n理解并遵循严格的职业道德准则应是任何安全专业人员的首要任务。作为 `CISSP`（或由 `(ISC)²` 认证的任何信息安全专业人员），你需要理解并完全承诺支持\
  \ `(ISC)²` 职业道德准则。任何明知违反 `(ISC)²` 职业道德准则的 `(ISC)²` 成员都将接受同行评审，并可能受到处罚，其中可能包括撤销其\
  \ `(ISC)²` 认证。\n\n### (ISC)² 职业道德准则\n\n`(ISC)²` 职业道德准则序言如下：\n\n* 社会和公众的福祉以及对委托人的责任和对彼此的责任，要求我们遵守并被视为遵守最高行为道德标准。\n\
  * 因此，严格遵守本职业道德准则是有条件认证的。\n\n\n\n\n\n简而言之，《道德准则》序言指出，每一位 CISSP 认证会员不仅必须遵守《道德准则》，而且必须被明显地视为在遵守《道德准则》。即使是不当行为或道德偏离的感知也可能质疑会员的地位。因此，CISSP\
  \ 认证会员必须始终在其组织和行业内担任可见的道德领导者。\n\n(ISC)²《道德准则》包含四项准则，旨在作为高层次的指导方针来补充、而非取代会员的专业判断。(ISC)²《道德准则》准则如下：\n\
  \n* **准则 I：** 保护社会、公共利益、必要的公众信任和信心以及基础设施。\n* **准则 II：** 诚实、公正、负责任并合法行事。\n* **准则\
  \ III：** 为委托人提供勤勉和胜任的服务。\n* **准则 IV：** 推进和保护该职业。\n\n遵守并推广 (ISC)²《道德准则》不仅包括注意自身的职业行为，还包括关注同行的行为。(ISC)²\
  \ 要求任何观察到另一名会员违反《道德准则》的会员都必须遵循已发布的道德投诉程序。未能这样做可能被视为违反准则 IV。有关 (ISC)²《道德准则》以及道德投诉程序的更多信息可在\
  \ [www.isc2.org/Ethics](http://www.isc2.org/Ethics) 找到。\n\n### 组织道德准则\n\n除了 (ISC)²《道德准则》之外，作为信息安全专业人员，您必须了解雇主或行业要求您遵守的任何道德准则。与\
  \ (ISC)²《道德准则》类似，这些其他组织道德准则不应被视为对健全判断和道德行为的替代。作为 CISSP，您是组织内的领导者。因此，您应以身作则遵守组织的《道德准则》。\n\
  \n## 理解和应用安全概念\n\n*信息安全* 指的是保护信息和底层系统免受不当访问、使用、修改或干扰所涉及的流程和方法。这通常由三个关键安全概念来描述：保密性、完整性和可用性。这三个原则共同构成了信息安全支柱，即\
  \ *CIA 三角*（见 Figure 1.1）。\n\n![FIGURE 1.1 CIA Triad](img/c01f001.png)\n\n**FIGURE\
  \ 1.1 CIA Triad**\n\n尽管不同类型的系统和数据可能优先考虑其中一个原则，但所有三个安全概念协同工作并相互依赖，以成功维护信息安全。保密性、完整性和可用性是信息安全提供的最关键特征，理解这三个原则是所有信息安全专业人员的基本要求。因此，对\
  \ CIA 三角中每个要素含义的共同理解使安全专业人员能够有效沟通。\n\n### 保密性\n\nCIA 三角的第一个原则是保密性。*保密性* 是将数据访问限制在授权用户和系统，并限制未经授权方访问的概念。换句话说，保密性保证只有预期的人能够访问信息和资源。简而言之，保密性的目标是防止未经授权访问数据，即查看、复制或移动数据。未能保护数据保密性的组织面临违反数据保护相关合同和法规义务的风险。此外，保密性泄露已知的公司通常会遭受声誉损害，从而使竞争对手受益并可能影响其底线。\n\
  \n保密性概念与安全最佳实践 *最小权限* 密切相关，该实践断言信息访问应仅基于需要知道的原则授予。在最小权限下，用户仅被授予完成其工作所需的访问权限——不多也不少。\n\
  \n*隐私* 是与安全密切相关的一个领域，专注于个人数据的保密性。具体而言，可用于唯一识别个人的信息，例如姓名、出生日期和社会安全号码，被视为 *个人身份信息*（PII），通常依法要求高度保密。隐私要求将在本章后面的“确定合规性和其他要求”部分介绍。\n\
  \n许多恶意行为针对数据保密性，包括网络钓鱼和其他形式的社会工程、凭证（如密码）窃取、网络嗅探等。除了恶意行为外，保密性还可能因人为错误、疏忽或单纯的疏忽而受损。例如，未对敏感数据进行加密、邮件误发，或在未经授权的观看者附近时在计算机显示器上显示敏感信息。\n\
  \n保密性通常是数据所有者最关心的概念，并且有许多安全控制可协助此项。加密、多因素身份验证和基于角色的访问控制是一些可帮助确保数据保密性的措施。广泛的人员培训是降低与人为错误和疏忽相关风险的重要措施。我们在本书其余部分中继续讨论数据保密性并讨论相关控制。\n\
  \n### 完整性\n\nCIA 三角的第二个原则是完整性。*完整性* 是维护数据和系统的准确性、有效性和完整性的概念。它确保数据不会被除具有授权目的的授权方之外的任何人操纵，并且任何未经授权的操纵都能被轻易识别为此类。完整性的主要目标是确保所有数据保持完整、正确和可靠。未能妥善保护数据完整性可能会对业务流程产生负面影响，包括导致人员因信息不正确而做出不当决策或可能有害的行为。\n\
  \n与保密性一样，完整性可能因恶意行为、人为错误、疏忽或过失而受损。病毒、糟糕编写代码的入侵以及故意修改是可能违反完整性的恶意威胁示例，我们将在本书中讨论其他威胁。此外，完整性违规也可能发生在管理员在数据库中输入错误命令时、管理员在配置文件中更改错误行时，或用户通过网络钓鱼电子邮件意外将恶意软件引入其系统时。\n\
  \n数据备份、软件版本控制、严格访问控制和加密哈希是一些有助于确保数据完整性的措施，通过防止未经授权的修改或允许被篡改的数据恢复到已知良好状态。与保密性类似，广泛的安全意识培训是防止非恶意完整性违规的主要因素。\n\
  \n真实性和不可否认性是与完整性密切相关的两个概念。*真实性* 指确保数据是真实的，并且所有各方都是他们声称的人。*不可否认性* 是一个法律原则，在信息安全领域有很强的平行关系；该概念要求确保没有任何一方能够否认其行为（例如创建、修改或删除数据）。数字签名是信息系统中建立真实性和不可否认性的最常见机制。\n\
  \n### 可用性\n\n\n\n\n\nCIA 三元组第三个也是最后一个原则是可用性。*可用性*是指确保授权用户在需要时能够访问数据的概念。在企业环境中，可用性的概念意味着提供保证，即合法方能够及时且不间断地访问其为完成工作所需系统和数据。对可用性的威胁会干扰甚至停止组织的业务运营。关键系统和数据长时间中断可能会导致声誉受损，进而导致客户和收入流失。\n\
  \n与可用性一起应考虑的相关概念包括以下内容：\n\n*   *可访问性*是指用户使用资源或在需要时访问数据的能力和便捷程度。这涉及为授权用户访问这些资源和数据消除障碍。例如，考虑存储在公司内部网络驱动器上的一个文件。只要文件完整且网络驱动器正常运行，该文件就可以被视为可用。然而，如果有人将该文件移动到共享驱动器上的受保护文件夹，你可能缺乏访问该文件的所需权限——数据仍然可用但不再可访问。\n\
  *   *可用性*是指用户利用可用数据满足其需求的能力。如果你曾经需要编辑一个 Google 文档（或其他任何文件）并注意到你仅被授予只读权限，那么该文件绝对可用但缺乏足够的可用性。\n\
  *   *及时性*是指信息和资源可用性的时间预期，是信息预期时间与信息可供使用时间之间间隔的衡量。确保及时性要求数据在可接受的时间段内可供授权用户使用。对于云服务以及涉及第三方管理数据的其他情况，及时性是必须在服务等级协议（SLAs）中达成一致并记录的关键因素。\n\
  \n数据和系统可用性存在许多威胁，它们可能是恶意的或非恶意的，可能是人为的或自然发生的。恶意可用性威胁包括拒绝服务（DoS）攻击、对象删除和勒索软件攻击。虽然恶意破坏可用性往往最受关注，但还有各种非恶意威胁会干扰资源和数据可用性。一些常见示例包括硬件故障、软件错误以及环境威胁，如停电、洪水、过热等。在规划你的信息安全计划时，至关重要的是你必须全面考虑基于人类和自然发生的威胁，并制定应对所有威胁向量的缓解措施。\n\
  \n诸如数据备份、冗余存储、备用电源和 Web 应用防火墙（WAFs）等机制可以帮助防止系统和信息可用性中断。对于具有高可用性和持续运行时间要求的系统，云计算提供了额外的冗余和可用性保障。\n\
  \n### CIA 三元组的局限性\n\nCIA 三元组源于 20 世纪 60 年代中期进行的理论工作。正是因为其简单性，分布式系统的兴起以及新技术大量新应用的出现导致研究人员和安全从业者扩展了三元组的覆盖范围。\n\
  \n保证通信中各方身份的真实性对保密性至关重要。CIA 三元组并未直接解决真实性和不可否认性的问题，但不可否认性的要点是双方都不能否认参与了通信。这一三元组的扩展独特地解决了保密性和完整性的方面，而这些在早期的理论工作中从未被考虑过。\n\
  \n美国国家标准与技术研究院（NIST）特别出版物 800-33《信息技术安全的底层技术模型》将 CIA 三元组作为其五项安全目标中的三项，但增加了问责制（实体行为可唯一追溯到该实体）和保证（对安全措施——技术和运营——按预期保护系统及其处理的信息工作的信心的基础）的概念。NIST\
  \ 的工作作为将系统安全最佳实践方法编纂化的努力，仍然具有影响力。\n\n信息安全先驱 Donn B. Parker 提出的对 CIA 三元组最广泛接受的扩展。Parker\
  \ 在扩展三元组时将另外三个概念纳入模型中，认为这些概念是原子性的（在概念上无法进一步分解）且不重叠的。该框架后来被称为 Parker 六元组。Parker 六元组包含以下概念：\n\
  \n*   **保密性：** 谁有权访问信息的限制\n*   **完整性：** 信息是否处于预期状态\n*   **可用性：** 信息是否能够及时访问\n* \
  \  **真实性：** 创建信息的个人是否正确归属\n*   **效用：** 信息的有用性\n*   **占有或控制：** 信息维护的物理状态\n\n后续的学术工作产生了数十种其他信息安全模型，所有这些模型都旨在解决同一个基本问题——如何表征信息安全风险。\n\
  \n除了 CIA 三元组和相关模型中规范的安全主题外，隐私的概念已成为安全专业人员的核心考虑。*隐私*，根据（ISC）² 术语表定义，是人类个人控制关于自己的信息分发的权利。隐私虽然通常在组织中央安全团队之外管理，但与保密性原则密切相关，对于处理员工或客户个人信息的每个组织都必须优先考虑。我们在本书其余部分的多个章节中讨论隐私。\n\
  \n对于安全专业人员来说，扎实理解 CIA 三元组在传达信息安全实践时至关重要，但重要的是要考虑三元组未涵盖的相关主题。\n\n## 评估和应用安全治理原则\n\
  \n*安全治理*是与在组织中定义、管理和监督安全实践相关的职责、政策和程序的集合。安全经常被错误地认为是 IT 问题；实际上，保护组织的资产和数据是业务问题，需要整个组织的人员——而不仅仅是\
  \ IT 部门——进行高度的规划和监督。由于安全是一个广泛的业务问题，安全治理通常与组织的公司治理和 IT 治理重叠。因此，安全治理通常由公司的高级管理层领导，通常包括董事会。应用安全治理原则涉及以下内容：\n\
  \n*   将组织的安保职能与公司的业务战略、目标、使命和目标保持一致\n*   定义和管理需要安全参与或监督的组织流程（例如，收购、剥离和治理委员会）\n*\
  \   在整个组织中制定安全角色和职责\n*   确定一个或多个安全控制框架以使你的组织保持一致\n*   持续进行尽职调查和审慎活动\n\n### 将安全职能与业务战略、目标、使命和目标保持一致\n\
  \n\n\n\n\n一个有效的安全职能必须与公司的商业战略、目标、使命和业务目标保持一致。在创建和管理组织的信息安全计划和政策时，应考虑这些要素中的每一个。\n\
  \n未能正确将安全计划与其商业战略、目标、使命和目标保持一致的公司，往往将安全视为业务阻碍；这些公司经常将信息安全体验为必须清除的障碍才能完成工作。相反，与公司的战略和使命紧密一致的信息安全职能可以作为业务推动者，其中安全融入公司的结构中，并有助于推动实现共同的目标和目标。换句话说，公司应部分得益于安全实现其使命，而不是*尽管*安全。\n\
  \n*使命宣言*是对公司职能和目的的简单声明；使命宣言总结了公司是什么、做什么以及公司为何存在以做这些事情。使命宣言应用于指导所有企业活动，包括组织对时间、财务和精力的分配。\n\
  \n*商业战略*描述了公司为实现其目标和目标而采取的行动。使命宣言描述了*将*实现什么，而组织的商业战略则明确了*如何*实现使命。公司的使命宣言很少改变，但组织的战略必须足够灵活以适应商业环境的变化。\n\
  \n在商业中，*目标*是组织期望实现或完成的事情。业务目标有助于公司规划成功，并且组织的目标应有助于其使命。许多公司使用 SMART 标准来定义其组织目标。*SMART*\
  \ 是一个助记缩写，用于定义创建高质量目标的标准。SMART 目标必须表现出以下特征：\n* **具体：** 使用真实数字和真实截止日期说明你将做什么。\n*\
  \ **可衡量：** 确定评估进展和衡量成功（或失败）的方法。使用指标或数据目标以确保目标可追踪。\n* **可实现或可达成：** 建立具有挑战性但可实现且在你的范围内目标。\n\
  * **相关：** 建立与你的整体使命和愿景相关且与你的组织价值观和战略保持一致的目标。\n* **有时限：** 使用具体日期或时间框架说明你何时完成目标。\n\
  \n*目标*是里程碑或有助于组织实现其目标并达成其使命的具体步骤。目标用于定义实现更广泛目标的增量步骤。与 SMART 目标一样，组织通常使用 SMART 框架来定义高质量目标。虽然许多人错误地将*目标*和*目标*互换使用，但你应该理解目标是支持长期目标的短期里程碑。\n\
  \n在建立你的组织安全职能时，你应首先定义一个与组织整体商业战略和使命宣言保持一致的安全战略。你应制定一套具体、可衡量、可实现、相关且有时限的目标和目标，以帮助你有效地维护公司系统和信息保密性、完整性和可用性，同时不影响组织实现其业务目标和目标的能力。运行一个有效的安全计划需要仔细考虑业务需求和组织战略，以及法律和合规要求，并需要治理来管理安全职能在整个组织内的有效性。\n\
  \n## 组织流程\n\n认为信息安全纯粹是 IT 事务的人更容易只关注适合安全计划的技术。作为一名 CISSP，你应该知道成熟的信息安全计划不仅仅是一堆防火墙、入侵检测系统和入侵预防系统（IDS/IPS）以及其他工具的集合——一个管理良好的安全计划需要建立流程来提供对组织高层管理人员活动监督的。*安全治理*是定义和管理信息安全政策和程序所涉及的所有组织流程的集合，包括确保这些政策和程序遵循组织战略和使命方向的监督。\n\
  \n### 治理委员会\n\n*治理委员会*是一组定期开会的高管和领导者，设定公司安全职能的方向并提供指导，以帮助安全职能与公司的整体使命和商业战略保持一致。治理委员会审查正在进行和计划中的项目、运营指标以及可能影响整个业务的其他安全事项。治理委员会的主要目标是为公司的安全职能提供监督，同时确保安全职能继续满足组织及其利益相关者的需求。\n\
  \n有许多组织流程需要大量安全治理。合并、收购和剥离是伴随着大量安全风险的重大业务事件，公司必须管理这些风险。\n\n### 合并与收购\n\n*合并*是将两个独立组织合并创建新的联合组织。*收购*是由另一家组织接管一家组织。虽然合并和收购（M&A）有不同的业务方法，但它们共享许多相同的安全问题，通常一起讨论。\n\
  \n当一家公司收购另一家公司或两个组织决定合并时，可能存在无数潜在的安全风险。对于任何合并或收购，组织在触发之前必须考虑这些风险并确定适当的缓解措施。一些 M&A\
  \ 风险因素包括以下内容：\n* **吸收未知：** 与或收购另一个组织合并时，你正在吸收其整个 IT 基础设施——好或坏。这意味着你正在获取可能与你自己的管理方式不同的系统，并且现有的安全控制和流程可能存在显著差异。此外，被收购公司可能使用自研或高度定制的应用程序，需要安全地集成到你的现有环境中。此外，被收购或吸收的公司可能对威胁建模和漏洞管理采用不同的方法（如果他们这样做的话）。安全流程的差异可能导致在两个业务整合期间和之后出现运营挑战和不一致的程序。\n\
  * **创建新的攻击向量：** 通过添加新系统和平台，你可能会为公司被攻击创造新的途径。例如，如果你的组织使用 Windows 和 macOS，而你收购了一家拥有\
  \ Linux 系统舰队的公司，那么你现在就有第三个操作系统需要管理和保护。\n* **影响资源：** 合并和收购对所有参与者都具有挑战性。你的 IT 团队可能捉襟见肘，因为他们试图跟上新收购的基础设施，同时还要保持现有系统安全运行。\n\
  \n\n\n\n\n### 不满的员工\n除了员工可能感受到的倦怠外，企业并购还可能导致原本在独立公司中完全满意的员工产生严重的 dissatisfaction。内部威胁通常被认为是最重要的安全问题之一，而收购不满的员工对组织构成严重威胁。\n\
  \n公司的安全职能部门应在任何并购谈判中发挥关键作用，并应帮助识别与目标组织的安全态势、运营或政策相关的潜在问题。如果两个组织的安全态势差异很大，通常最好重新考虑交易，或至少在连接两个公司的网络和系统之前，考虑先修复关键的安全差距。考虑到前面列表中的风险，收购公司（或合并中的两家公司）在完成并购交易之前应执行以下活动：\n\
  \n* 审查公司信息安全政策和程序，以确定其是否全面。注意任何缺失的安全政策/程序，这可能表明安全成熟度较低。\n* 审查公司的数据资产并确定适用的监管或合规要求（例如，PCI、HIPAA、GDPR\
  \ 等）。特别注意任何可能为贵组织带来新要求的法规。\n* 审查组织的人员安全政策以识别潜在问题或担忧。例如，贵公司可能有合规要求进行特定类型的背景调查，而目标公司可能不符合要求。\n\
  * 识别公司管理的任何专有或定制应用程序，并要求对其运行静态和动态应用程序安全测试以证明其安全态势。（SAST 和 DAST 在第 8 章“软件开发与安全”中有所介绍。）\n\
  * 请求最近的渗透测试（pentest）结果，其中包括网络、操作系统、应用程序和数据库测试。任何严重或高风险发现都应有补救或缓解计划。\n* 审查组织对第三方和开源软件的使用，以确保软件安全且许可适当。\n\
  \n前面的列表并非旨在全面，而是作为在任何合并和收购之前需要考虑事项的起点。你的安全团队需要在从初步谈判到整合的整个并购过程中发挥不可或缺的作用。\n\n###\
  \ 分拆\n*分拆*是指出售或处置业务利益或资产的子集的行为。组织可能出于政治、社会或纯粹财务等多种原因进行分拆。分拆通常发生在管理层决定业务的某一部分不再与公司业务战略或使命一致时。分拆也经常在合并或收购后发生，在这种情况下，合并或收购在合并后的组织内部造成了冗余。\n\
  \n信息通常会随公司分拆的实物资产和利益一起转移，这对信息安全构成重大担忧。分拆中最大的安全问题涉及在公司处置可能包含敏感或专有信息的资产时保持保密。作为一名\
  \ CISSP，你应确保组织在完成分拆前采取以下行动：\n\n* 识别并分类分拆涉及的所有资产；这包括硬件、软件和信息资产。创建所有受影响资产的完整清单是确保安全分拆的关键第一步。\n\
  * 将受影响的系统与剩余的基础设施分离。贵公司可能使用通用的人力资源（HR）、会计和技术系统（例如虚拟专用网络、电子邮件等）来支持整个公司。被分拆的资产必须从此通用基础设施中移除，并为新组织所有和管理。\n\
  * 审查所有访问权限。你必须确定谁有权访问受影响的资产，并确定他们是否需要保留该访问权限。人员有时会成为分拆的一部分，部分员工可能会随其他分拆资产一起离开。如果你的分拆情况如此，你必须适当撤销不必要的权限，同时保留所需的权限。\n\
  * 请教法律和合规团队，以确保你遵循数据保留、删除等方面的所有必需监管和合规要求。\n\n在分拆期间，两个公司（即分拆方和被分拆公司）都必须考虑业务交易对其各自安全计划的影响。每个公司都必须确保其安全控制、运营、政策和程序以及治理结构继续支持重组后的公司。如果被分拆公司被出售给另一家公司（即作为收购的一部分），那么购买公司必须更新其安全计划以适应其新收购的资产。在被分拆公司导致完全新实体成立的情况下，新公司必须创建全新的安全职能（以及支持的政策、程序和治理结构）以适当管理信息安全。\n\
  \n与合并和收购一样，分拆也可能为组织带来许多安全挑战。同样，成功分拆的关键是你的安全团队从早期规划阶段一直到分拆完成期间积极参与。\n\n### 组织角色和职责\n\
  不从事安全工作的人往往认为安全专业人员是唯一负责保护系统和信息安全的员工。当然，作为信息安全专业人员，我们知道保护组织的资产和信息安全是*每个人的*工作——这意味着从首席执行官（CEO）到邮局最基层的职员，每个人都包括在内。作为一名\
  \ CISSP，你的工作之一是在公司内部推广安全，同时帮助在整个组织中定义安全角色和职责。\n\n你的组织应在信息安全政策中定义安全角色和职责，并应与组织其他政策中定义的角色和职责保持一致。重要的是，角色和职责应由各个层级和业务线的员工以及第三方（如承包商和供应商）定义并理解。\n\
  \n不同公司有不同的角色，但以下指定是一些最常见的信息安全角色：\n\n* **首席信息安全官（CISO）：** *CISO* 是组织内负责信息安全计划整体管理和监督的高级行政人员。CISO\
  \ 推动组织的安全战略和愿景，并最终对公司系统和信息的安全负责。虽然企业汇报结构因公司规模和行业而异，但大多数 CISO 现在向公司的首席信息官（CIO）或 CEO\
  \ 汇报。\n* **首席安全官（CSO）：** *CSO* 是组织内通常负责所有物理安全和人员安全事务的高级行政人员。许多组织已将 CSO 职责合并到 CISO\
  \ 角色中，但你应意识到两者之间可能存在的区别。为了使事情更加复杂，一些组织将整体安全负责人称为 CSO（而不是 CISO）。你应依靠上下文来理解这些头衔的使用。\n\
  \n\n\n\n\n*   **安全分析师：** *安全分析师* 是在一個或多個安全領域具有技術專業知識的人員，負責執行日常安全工作。這可能包括數據分析、防火牆規則管理、事件處理以及其他運營活動等。\n\
  \n*   **經理或項目經理：** 在安全領域，*經理*（或*項目經理*）是擁有與信息安全相關的一個或多個流程的人員。安全經理可能是合規、漏洞管理或由安全分析師執行的任何其他廣泛責任集合的負責人。\n\
  \n*   **總監：** 在安全領域，*總監* 通常是管理者的管理者，負責對一組安全項目進行整體戰略指導。\n\n如前所述，安全是每個人的責任。除了前一列表中描述的信息安全角色和職責外，組織內部的每位用戶在保護信息安全方面都發揮著重要作用。*用戶*（或*終端用戶*）包括任何訪問或處理組織信息系統或數據的人員。用戶可能包括全職和兼職員工、實習生、承包商、顧問、供應商、合作夥伴等。一些通用的用戶職責包括以下內容：\n\
  \n*   理解、同意並遵守所有信息安全政策、程序、標準和指南，以及任何相關的監管和合規要求。用戶還負責履行影響公司信息和流程保密性的合同義務（如保密協議）。\n\
  *   在要求的完成日期前完成所有必要的信息安全培訓和意識活動。\n*   及時向適當人員報告任何實際或疑似安全違規或違規行為。\n\n### 安全控制框架\n\
  \n糟糕的安全管理是許多組織安全問題的主要原因之一。安全管理可以通過採用自上而下的方法、自下而上的方法或兩者的結合來實現。\n\n歷史上，企業更傾向於使用*自下而上*的安全方法，即\
  \ IT 部門重視安全並嘗試為公司建立安全職能。在這種方法中，運營人員識別安全需求和問題，並將這些發現向上推至高級管理層以提供指導和資金。這種方法往往導致公司採取被動措施而非制定主動政策，並且經常導致安全項目資金不足。\n\
  \n在*自上而下*的方法中，高級領導層首先了解組織面臨的法規和安全威脅，並啟動策略、政策和指南，並將其向下傳達至整個組織。採用自上而下的方法時，信息安全由公司最資深的高管倡導，這確保了安全得到優先考慮並與公司的整體業務戰略保持一致。有效的自上而下方法需要強大的治理（本章前面已討論過），從與一個或多個安全控制框架保持一致開始。\n\
  \n*安全控制* 是用於防止、檢測、最小化或抵消安全威脅的技術、運營或管理保障措施。（ISC）² 將*安全控制框架*定義為“概述組織安全方法概念性構建，包括組織使用的具體安全流程、程序和解決方案的清單。”組織通常採用安全控制框架以協助滿足法律和監管合規義務，同時也有助於建立維護公司資產保密性、完整性和可用性的安全項目。\n\
  \n組織通常根據其行業選擇安全控制框架。例如，支付卡行業（PCI）控制框架是全球金融服務組織和處理持卡人數據的公司使用的框架。在美國，《健康保險流通與責任法案》（HIPAA）為醫療保健組織和處理受保護健康信息（PHI）的公司提供了一個控制框架。除了\
  \ PCI 和 HIPAA（本章後面會介紹）之外，ISO/IEC、NIST 和 CIS 提供了組織在多個行業中採用的最常見的安全控制框架之一。雖然還有許多其他控制框架可用，但您至少應熟悉以下框架：\n\
  \n*   ISO/IEC 27001\n*   ISO/IEC 27002\n*   NIST 800-53\n*   NIST Cybersecurity\
  \ Framework\n*   CIS Critical Security Controls\n\n#### ISO/IEC 27001\n\nISO/IEC\
  \ 27001（有時僅稱為 ISO 27001）是由國際標準化組織（ISO）和國際電工委員會（IEC）發布的信息安全標準。ISO 27001 是 ISO/IEC\
  \ 27000 系列標準中最受歡迎的標準，重點在於創建和維護*信息安全管理體系*（ISMS），ISO 將其定義為“系統化管理敏感公司信息以使其保持安全的方法。”用通俗的語言來說，ISMS\
  \ 是一組人員、流程和技術，用於管理公司系統和數據的整體安全。ISO/IEC 27001 描述了 ISMS 的整體組成部分，並且該標準是許多組織安全項目的基礎。\n\
  \n截至本文撰寫時，ISO/IEC 27001 最近一次修訂是在 2013 年，儘管其母標準 ISO/IEC 27000 已於 2018 年修訂。ISO 27001:2013\
  \ 包含 14 個領域的 114 個控制項，如下所示：\n\n*   信息安全政策\n*   信息安全組織\n*   人力資源安全\n*   資產管理\n* \
  \  訪問控制\n*   密碼學\n*   物理和環境安全\n*   運營安全\n*   通訊安全\n*   系統採購、開發和維護\n*   供應商關係\n*\
  \   信息安全事件管理\n*   業務連續性管理的信息安全方面\n*   合規\n\n#### ISO/IEC 27002\n\nISO/IEC 27002（同樣通常僅稱為\
  \ ISO 27002）標題為“安全技術 — 信息安全控制實務規範。”該標準在 ISO 27001 的基礎上，為組織根據自身安全風險狀況選擇、實施和管理安全控制提供了指南。換句話說，ISO\
  \ 27002 比 ISO 27001 更具指導性，因為它為組織構建和維護其 ISMS 提供了最佳實踐建議。\n\n#### NIST 800-53\n\n國家標準與技術研究院是美國商務部下屬的非監管機構，其使命是通過推進標準和技術來促進創新和工業競爭力。NIST\
  \ 發布和管理與信息安全、雲計算和其他技術相關的各種專刊。NIST 800-53，《聯邦信息系統和組織的安全和隱私控制》，是 NIST 的龐大安全控制框架。儘管\
  \ NIST 800-53 最初是為幫助美國政府機構管理其安全項目而創建的，但它被廣泛認為是最全面的安全控制基線之一，並被全球眾多行業所引用。NIST 800-53\
  \ 在以下 18 個控制族中定義了數百個安全控制：\n\n*   訪問控制（AC）\n*   意識和培訓（AT）\n*   審計和問責（AU）\n*   安全評估和授權（CA）\n\
  *   配置管理（CM）\n*   應急規劃（CP）\n*   識別和驗證（IA）\n*   事件響應（IR）\n\n\n\n\n\n* 维护 (MA)\n*\
  \ 媒体保护 (MP)\n* 物理和环境保护 (PE)\n* 规划 (PL)\n* 人员安全 (PS)\n* 风险评估 (RA)\n* 系统和服务采购 (SA)\n\
  * 系统和通信保护 (SC)\n* 系统和信息完整性 (SI)\n* 项目管理 (PM)\n\n### NIST 网络安全框架\n\nNIST 网络安全框架 (CSF)\
  \ 于 2014 年首次发布，是管理网络安全风险的一系列标准、指南和最佳实践的集合。截至本文撰写时，NIST CSF v1.1 是当前版本，于 2018 年发布。NIST\
  \ CSF 最初是针对被视为“关键基础设施”的行业而开发的——例如银行、能源和通信等行业。此后，它已成为各规模、各业务领域公司都可采用的控制框架。\n\nNIST\
  \ CSF 与 NIST 800-53 以及其他控制框架中的控制措施和最佳实践保持一致，但旨在为私营企业提供更灵活、更易理解的适配选项。NIST 网络安全框架由五个核心功能组成，每个功能下有多個\
  \ NIST 称之为类别的子划分。 （参见 图 1.2。）\n\n![FIGURE 1.2 NIST Cybersecurity Framework](img/c01f002.png)\n\
  \n**FIGURE 1.2 NIST Cybersecurity Framework**\n\nNIST CSF 中的五个核心功能旨在同时且持续地执行，以形成评估和应对网络安全风险的文化。NIST\
  \ 对五个核心功能的定义如下：\n\n* `Identify (ID)`: 建立组织对系统、人员、资产、数据和能力的网络安全风险管理的理解。\n* `Protect\
  \ (PR)`: 开发并实施适当的保护措施以确保关键服务的交付。\n* `Detect (DE)`: 开发并实施适当的活动以识别网络安全事件的发生。\n* `Respond\
  \ (RS)`: 开发并实施适当的活动以对检测到的网络安全事件采取行动。\n* `Recover (RC)`: 开发并实施适当的活动以保持恢复能力计划并恢复因网络安全事件而受损的任何能力或服务。\n\
  \n五个核心功能分为 23 个类别，这些类别进一步细分为总共 108 个子类别。每个子类别描述了特定的安全控制或期望结果。访问 [www.nist.gov/cyberframework](http://www.nist.gov/cyberframework)\
  \ 以获取子类别的完整列表以及使用 NIST 网络安全框架的额外指导。\n\n### CIS 关键安全控制\n\nCIS 关键安全控制（或 CIS Controls）是关于信息安全的\
  \ 20 项最佳实践指南的出版物。该出版物最初由 SANS Institute 创建，但在 2015 年移交给了互联网安全中心 (CIS)。今天，您可能会看到这\
  \ 20 项关键控制被标记为 CIS CSC、CIS 20、Sans Top 20 或其他变体。\n\nCIS Controls v7.1 于 2019 年 4\
  \ 月发布，确定了 CIS 建议用于减轻网络和系统最常见攻击的基础、基础和组织控制措施。根据互联网安全中心，20 项关键安全控制如下：\n\n* `CIS Control\
  \ 1`: 硬件资产的清单和控制\n* `CIS Control 2`: 软件资产的清单和控制\n* `CIS Control 3`: 持续漏洞管理\n* `CIS\
  \ Control 4`: 管理员权限的受控使用\n* `CIS Control 5`: 移动设备、笔记本电脑、工作站和服务器的硬件和软件安全配置\n* `CIS\
  \ Control 6`: 审计日志的维护、监控和分析\n* `CIS Control 7`: 电子邮件和 Web 浏览器保护\n* `CIS Control\
  \ 8`: 恶意软件防御\n* `CIS Control 9`: 网络端口、协议和服务的限制和控制\n* `CIS Control 10`: 数据恢复能力\n\
  * `CIS Control 11`: 网络设备的安全配置，例如防火墙、路由器和交换机\n* `CIS Control 12`: 边界防御\n* `CIS Control\
  \ 13`: 数据保护\n* `CIS Control 14`: 基于需要知道的受控访问\n* `CIS Control 15`: 无线访问控制\n* `CIS\
  \ Control 16`: 账户监控和控制\n* `CIS Control 17`: 实施安全意识和培训计划\n* `CIS Control 18`: 应用软件安全\n\
  * `CIS Control 19`: 事件响应和管理\n* `CIS Control 20`: 渗透测试和红队演练\n\n## 尽职注意和尽职调查\n\n治理要求设定组织战略方向和使命的个人代表利益相关者行事。他们治理行为的最低标准要求他们以尽职注意行事。`Due\
  \ care` 是一个法律术语，用来描述在特定情况下合理的人会采取的行为。在商业中，尽职注意是指使用合理谨慎来保护组织的利益。更具体地说，就信息安全而言，尽职注意与合理的人为维护其组织资产的保密性、完整性和可用性而采取的行为有关。\
  \ “合理”这一概念乍一看可能有点模糊，但其目的是保护个人或组织免受疏忽指控。简而言之，世界各地的法院判决表明，如果具有类似背景和经验的人在面临相同情况时会采取相同或类似的行动，则可以认为某人的行为是“合理”的。安全领域尽职注意的例子包括扫描和修补安全漏洞、启用安全日志记录，以及编写限制性防火墙规则以强制执行最小权限原则（在\
  \ 第 3 章 “安全架构与工程”中讨论）。\n\n`Due diligence` 是另一个法律概念，与持续确保行为保持尽职注意有关。换句话说，尽职调查是尽职注意的持续执行和监控。关于信息安全，尽职调查与组织及其人员为确保组织资产得到合理保护而持续进行的行为有关。安全领域尽职调查的例子包括审查安全日志输出以查找可疑活动，以及进行渗透测试以确定防火墙规则是否足够严格。\n\
  \n尽职注意和尽职调查的概念在法律和金融领域非常重要，但信息安全专业人员也必须理解。行使尽职注意并进行尽职调查是避免在法庭上被指控疏忽所必需的。CISSP CBK\
  \ 旨在建立“合理”安全领导者所需的一套知识和活动。\n\n## 确定合规性和其他要求\n\n(ISC)² 将 `compliance` 定义为遵守强制性要求；它包括组织为了解并满足所有适用的法律、监管要求、行业标准和合同协议而开展的一系列活动。\n\
  \n### 立法和监管要求\n\n许多合规期望来自适用于所有行业的成文法或监管要求。其他则特定于某些行业或产品。这不断变化的期望集需要持续审查组织实践，以确保信息在符合所有适用要求的情况下得到保护。\n\
  \n\n\n\n\n识别合规要求面临的第一个挑战是了解哪个司法辖区拥有设定这些要求的法律权力。`Jurisdiction` 是一个法律概念，它确立了做出法律决定和判决的官方权力。仅仅知道相关的地理或政治边界是不够的；司法辖区还可能受到国际条约和协议、贵组织活动的或任何其他因素的影响。无论本文列出的示例法律和法规如何，信息安全从业人员必须意识到其运营所在司法辖区的细微差别。\n\
  \n在大多数司法辖区，法律都是为了定义什么是允许的，什么是不允许的而制定的。在美国法律中，`law` 一词指的是任何如果被违反会使当事人受到刑事惩罚或民事责任的规则。法律可以大致分为两部分：`statutes`\
  \ 和 `regulations`。`Statutes` 是由司法辖区的立法机构撰写并通过的，例如美国国会，而 `regulations` 则是关于如何执行一项法律的更详细规则。法规和规章都具有法律约束力，但规章从属于法律。\n\
  \n在美国和世界各地，立法和监管要求的数量日益增长，但有两项总体美国法律你应该熟悉：\n\n* U.S. Computer Security Act of 1987\n\
  * U.S. Federal Information Security Management Act (FISMA) of 2002\n\n### U.S. Computer\
  \ Security Act of 1987\n\n《计算机安全法》由美国国会于 1987 年颁布，旨在改善存储在美国联邦政府计算机上的敏感信息的保护和隐私。该法案包含要求为联邦政府计算机系统建立最低可接受的安全实践，以及为政府机构建立满足这些实践的安全政策的规定。作为该法案的一部分，安全意识培训被确立为任何使用政府计算机系统的联邦政府雇员的强制要求。\n\
  \n《计算机安全法》规定，国家标准与技术研究所，即美国商务部下属机构，负责为非机密、非军事的政府计算机系统制定计算机安全标准，而国家安全局负责为机密的政府和军事系统及应用制定安全指导。\n\
  \n1987 年的《计算机安全法》已被 2002 年的《联邦信息安全管理法》废除，下文将讨论该法。\n\n### U.S. Federal Information\
  \ Security Management Act (FISMA) of 2002\n\n《联邦信息安全管理法》，通常简称为 FISMA，发音为“fizz-muh”，是\
  \ 2002 年颁布的一项美国法律，在很大程度上扩展了 1987 年的《计算机安全法》。FISMA 承认信息安全对美国经济和国家安全利益的重要性，并要求所有美国联邦政府机构以及为这些机构提供信息服务的非政府组织进行基于风险的安全评估，并与\
  \ NIST 风险管理框架 RMF 相一致。\n\n## 行业标准和其他合规要求\n\n除了国家、州和地方法律法规外，贵组织可能还需要根据其所属行业或提供的服务类型遵守某些法规和标准。你应该了解的最突出的行业标准包括以下内容：\n\
  \n* U.S. Sarbanes–Oxley Act of 2002 (SOX)\n* System and Organization Controls (SOC)\n\
  * Payment Card Industry Data Security Standard (PCI DSS)\n\n### U.S. Sarbanes–Oxley\
  \ Act of 2002\n\n在几起备受关注的企业和会计丑闻之后，SOX 在美国颁布，旨在重建公众对上市公司和公共会计师事务所的信任。SOX 要求公司实施一系列旨在最大限度减少利益冲突、为投资者提供适当的风险信息、对提供虚假财务披露的高管处以民事和刑事处罚、并为向监管机构举报不当行为的举报人提供保护的控制措施。\n\
  \n根据 SOX，公众公司会计监督委员会 PCAOB 被设立为一个负责监督 SOX 实施的非营利组织。PCAOB 的“审计标准”确定了信息系统在维护财务记录方面的作用，并要求审计师评估\
  \ IT 在维护和编制财务报表方面的使用。作为 PCAOB 标准的一部分，审计师应广泛考虑可能对公司财务报表产生重大影响的信息安全风险。尽管 SOX 主要是以财务为重点的法律，但该法规对\
  \ IT 和信息安全产生了真实且日益增长的影响。\n\n### System and Organization Controls\n\nSOC 常被误认为是 SOX，SOC\
  \ 代表 System and Organization Controls，即系统和组织控制，是一种审计框架，可使组织根据自身需求灵活接受审计。常用的 SOC\
  \ 审计和报告类型有三种，恰当地命名为 SOC 1、SOC 2 和 SOC 3。这三种审计和报告类型与美国注册会计师协会 AICPA 于 2017 年发布的《鉴证业务准则声明》SSAE\
  \ 18 中概述的标准一致，并于 2019 年通过 SSAE 20 作出修订。\n\n* `SOC 1`: 一项审计和合规报告，严格关注公司的财务报表以及可能影响客户财务报表的控制措施。执行信用卡处理的公司很可能需要\
  \ SOC 1 审计和合规报告。\n* `SOC 2`: 一项审计和合规报告，根据 AICPA 的五项“受信服务原则”评估组织：隐私、安全、可用性、处理完整性和保密性。许多组织接受\
  \ SOC 2 审计，并向监管机构和客户出示 SOC 2 报告，以证明其符合行业标准安全控制。\n* `SOC 3`: 这是 SOC 2 报告的“精简版”，抽象或删除了所有敏感细节。SOC\
  \ 3 报告通常表明组织是否已证明每项受信服务原则，而不披露具体细节。公司会向公众提供 SOC 3 报告，并将 SOC 2 报告限制在可信方。\n\n### Payment\
  \ Card Industry Data Security Standard\n\n如果贵组织处理支付卡信息，即信用卡或借记卡，则很可能需要证明 PCI DSS\
  \ 合规性。PCI DSS 是一项于 2004 年制定的专有安全标准。PCI DSS 为接受或处理持卡人数据和/或敏感认证数据的商户和服务提供商，以及用于支付卡交易的应用程序和设备的软件开发商和制造商建立了技术和运营要求。\n\
  \nPCI DSS 包括超过 200 项安全控制，分为 12 项要求，进一步细分为 6 个目标，通常与安全最佳实践保持一致。根据 PCI SSC，PCI DSS\
  \ 涵盖以下内容：\n\n* Build and Maintain a Secure Network\n\n  `Requirement 1`: Install\
  \ and maintain a firewall configuration to protect cardholder data.\n\n  `Requirement\
  \ 2`: Do not use vendor-supplied defaults for system passwords and other security\
  \ parameters.\n\n* Protect Cardholder Data\n\n  `Requirement 3`: Protect stored\
  \ cardholder data.\n\n  `Requirement 4`: Encrypt transmission of cardholder data\
  \ across open, public networks.\n\n* Maintain a Vulnerability Management Program\n\
  \n\n\n\n\n### 要求 5：使用并定期更新防病毒软件或程序。\n\n### 要求 6：开发并维护安全系统和应用程序。\n\n#### 实施强访问控制措施\n\
  \n**要求 7：** 按业务需要知情原则限制对持卡人数据的访问。\n\n**要求 8：** 为每位拥有计算机访问权限的人员分配唯一的 ID。\n\n**要求\
  \ 9：** 限制对持卡人数据的物理访问。\n\n#### 定期监控和测试网络\n\n**要求 10：** 跟踪并监控对网络资源和持卡人数据的所有访问。\n\n\
  **要求 11：** 定期测试安全系统和流程。\n\n#### 维护信息安全政策\n\n**要求 12：** 维护一份针对员工和承包商的信息安全政策。\n\n\
  尽管 `PCI DSS` 尚未成为法律要求，但它通常是合同要求，并且是行业标准的典型范例，用于在几乎所有司法管辖区的适用组织中强制、执行和审计安全标准。由于它不是立法，`PCI\
  \ DSS` 不受任何政府机构管辖或执行。相反，`PCI DSS` 的合规性由本节前面提到的支付卡公司（如 Visa、Mastercard、American Express\
  \ 等）评估和执行。未能满足 `PCI DSS` 要求可能会导致组织失去接收和处理此类支付卡交易的能力。\n\n### 隐私要求\n\n*Privacy* 意味着将个人信息的访问限制在授权方用于授权用途；本质上，隐私就是维护个人信息的保密性\
  \ specifically（与一般而言的所有敏感数据相对）。随着越来越多的个人数据转移到网上，隐私已成为监管机构、组织和用户最关心的安全相关问题之一。\n\n\
  诸如您的姓名、地址和社会安全号码等个人信息被视为个人身份信息，必须保密。`PII` 通常受合同和监管隐私要求的某种组合约束。虽然要求的来源可能各不相同，但组织应认真对待这些要求的程度不会改变。作为\
  \ `CISSP`，您必须知道组织处理的 `PII` 和其他个人数据是什么，并且必须了解管理该数据隐私的所有法律、合同和监管要求。\n\n## 从整体角度理解与信息安全相关的法律和监管问题\n\
  \n作为 `CISSP`，您必须了解与信息安全相关的法律和监管要求——既广泛地，也在您特定行业和/或地理区域内。牢固理解法律和监管问题涉及熟悉信息系统面临的安全威胁以及规范组织处理敏感数据和系统的国家、州和地方法规。对于\
  \ `CISSP` 考试和“现实世界”，您必须熟悉管理网络犯罪和数据泄露处理、许可和知识产权处理、进出口管制、跨境数据流动以及（当然）隐私的法律和法规。\n\n\
  ### 网络犯罪和数据泄露\n\n*cybercrime* 是任何直接涉及计算机或互联网的刑事活动。在网络犯罪中，计算机可能是执行犯罪活动的工具，也可能是犯罪活动的目标。网络犯罪有三大主要类别：\n\
  \n* **针对个人的犯罪：** 这些犯罪包括网络跟踪、在线骚扰、身份盗窃和信用卡欺诈。\n* **针对财产的犯罪：** 此处的财产可能包括存储在计算机内的信息，或计算机本身。这些犯罪包括黑客攻击、传播计算机病毒、计算机破坏、知识产权（`IP`）盗窃和版权侵权。\n\
  * **针对政府的犯罪：** 针对政府组织的任何网络犯罪都被视为对该国主权的攻击。此类网络犯罪可能包括黑客攻击、机密信息窃取或网络恐怖主义。黑客行动主义是另一种网络犯罪，涉及黑客试图通过攻击发表政治声明。黑客行动主义者通常以政府实体为目标，但也可能以他们不同意的其他组织为目标。\n\
  \n*data breach* 是一种特定的网络犯罪，其中信息被网络犯罪分子未经授权访问或窃取。数据泄露的目标是信息系统及其存储的数据。数据泄露，以及更广泛的网络犯罪，可能对个人、公司或整个国家构成威胁。因此，有许多法律规范和监管网络犯罪如何被预防、检测和处理。\n\
  \n作为 `CISSP`，您应熟悉以下全球网络犯罪和信息安全法律和法规：\n\n* U.S. Computer Fraud and Abuse Act of 1986\n\
  * U.S. Electronic Communications Privacy Act (`ECPA`) of 1986\n* U.S. Economic Espionage\
  \ Act of 1996\n* U.S. Child Pornography Prevention Act of 1996\n* U.S. Identity\
  \ Theft and Assumption Deterrence Act of 1998\n* USA PATRIOT Act of 2001\n* U.S.\
  \ Homeland Security Act of 2002\n* U.S. Controlling the Assault of Non-Solicited\
  \ Pornography and Marketing (`CAN-SPAM`) Act of 2003\n* U.S. Intelligence Reform\
  \ and Terrorism Prevention Act of 2004\n* The Council of Europe's Convention on\
  \ Cybercrime of 2001\n* The Computer Misuse Act 1990 (U.K.)\n* Information Technology\
  \ Act of 2000 (India)\n* Cybercrime Act 2001 (Australia)\n\n#### U.S. Computer Fraud\
  \ and Abuse Act of 1986, 18 U.S.C. § 1030\n\n美国《1986 年计算机欺诈和滥用法》是目前在美国生效的最古老、也可能是最相关的网络犯罪法律之一。该法律多年来已被修订，您应熟悉其原始形式以及本节中讨论的修订。\n\
  \n《计算机欺诈和滥用法》`CFAA` 是一项于 1986 年作为 1984 年《综合犯罪控制法》修正案颁布的网络犯罪法案。`CFAA` 的创建是为了澄清计算机欺诈和滥用的定义，并将现有法律扩展到包括计算机数据等无形财产。虽然\
  \ `CFAA` 现在涵盖所有计算设备，但原始法律是为涵盖“联邦利益计算机”而编写的——该术语在 1996 年对该法案的修正案中被改为“受保护计算机”。第 `1030(e)(2)`\
  \ 条将受保护计算机定义为\n\n* “[E]xclusively for the use of a financial institution or the\
  \ United States Government, or, in the case of a computer not exclusively for such\
  \ use, used by or for a financial institution or the United States Government and\
  \ the conduct constituting the offense affects that use by or for the financial\
  \ institution or the Government”\n* “[U]sed in or affecting interstate or foreign\
  \ commerce or communication”\n\n用通俗英语来说，*protected computer* 是指由美国政府或金融机构使用的计算机，或用于州际和外国通信和金融交易的计算机。这里需要注意的是，该定义范围足够广泛，可适用于任何“用于或影响”政府和商业的计算机——根据此定义，计算机不需要被网络犯罪分子直接使用或针对即可被视为受保护。\n\
  \n`CFAA` 确立了七项与计算机欺诈和滥用相关的刑事犯罪，并确定了每项的处罚：\n\n* **获取国家安全信息：** §1030(a)(1) 描述了明知无权或超出授权访问计算机、获取国家安全或外交关系信息，并故意将该信息保留或传输给未经授权方的重罪行为。\n\
  \n\n\n\n\n## 美国《1986 年计算机欺诈和滥用法》\n\n### 访问计算机并获取信息\n§1030(a)(2) 描述了故意未经授权或超出授权访问计算机并从受保护计算机获取信息的轻罪行为。如果该行为是为了获得商业优势或私人经济利益而实施，或是为了推进其他刑事或侵权行为而实施，或获取信息的价值超过\
  \ $5,000，则该罪行升级为重罪。\n\n### 侵入政府计算机\n§1030(a)(3) 将侵入行为的定义扩展到计算领域，并描述了故意未经授权访问非公开的受保护计算机并影响该计算机由美国政府使用或为美国政府使用的轻罪行为。§1030(a)(2)\
  \ 适用于 §1030(a)(3) 可能被起诉的许多相同案件，但 §1030(a)(2) 即使未从计算机获取信息也可以被起诉。换句话说，第 1030(a)(3)\
  \ 条禁止仅仅侵入受保护计算机，无论是否窃取信息。\n\n### 为欺诈和获取价值而访问\n§1030(a)(4) 是对 1984 年法案的关键补充，它描述了明知故犯地未经授权或超出授权访问受保护计算机以实施欺诈的重罪行为。根据\
  \ §1030(a)(4)，犯罪者必须获得任何有价值的东西，包括如果其价值超过 $5,000 的信息使用权。§1030(a)(4) 的关键因素在于它允许在有欺诈证据的情况下，将信息盗窃（在\
  \ §1030(a)(2) 中描述）作为重罪起诉。\n\n### 损坏计算机或信息\n§1030(a)(5) 最初是为描述与篡改、损坏或破坏受保护计算机或其信息，或阻止对计算机或信息的授权使用有关的重罪行为而编写的，且导致一年期间累计损失\
  \ $1,000 或以上。该条款后来被重写，现在更一般地描述了明知故犯地造成计算机或信息损坏的轻罪行为。§1030(a)(5) 在以下情况下将犯罪升级为重罪：如果损坏导致一年内损失\
  \ $5,000 或以上，改变了对某人的医疗护理，造成人身伤害，威胁公共健康或安全，损坏用于司法管理或国家安全的系统，或损坏在一年内影响 10 台或以上受保护计算机。\n\
  \n### 密码交易\n§1030(a)(6) 规定了轻罪并禁止个人故意交易计算机密码或类似信息，当此类交易影响州际或外国商业或允许未经授权访问由美国或为美国使用的计算机时。这里的\
  \ *traffic* 一词是指非法转移密码或取得密码控制权并意图将其转移给另一方的行为。该定义很重要，因为它排除了如果没有转移意图，仅持有密码的情况。\n\n\
  ### 威胁损坏计算机\n§1030(a)(7) 描述了与传统勒索的计算机变种相关的重罪行为。该条款禁止威胁损坏受保护计算机或威胁未经授权或超出授权获取或披露机密信息以勒索金钱或其他有价值物品的意图。\n\
  \n美国《1986 年计算机欺诈和滥用法》随着时间的推移经历了多次修正案，既直接修正，也通过其他立法进行。1988 年、1989 年和 1999 年进行了小幅修正，1994\
  \ 年、1996 年和 2001 年通过本章后面讨论的各种其他法案发布了重大修正案。\n\n## 美国《1986 年电子通信隐私法》\n\n电子通信隐私法（ECPA）由美国国会于\
  \ 1986 年颁布，以将对政府窃听的限制扩展到包括计算机和网络通信（而不仅仅是电话通话）。ECPA 通过禁止窃听、拦截和未经授权监控所有电子通信（包括通过计算机网络发送的通信）来补充\
  \ CFAA。\n\n然而，ECPA 确实做出了某些例外，允许通信提供商（如 ISP）在先通知用户监控的情况下出于正当商业原因监控其网络。这为网络监控建立了法律依据，多年来一直受到批评。美国《爱国者法案》（在后面的章节中讨论）在\
  \ 2001 年对 ECPA 进行了多项广泛修正。\n\n## 美国《1996 年经济间谍法》\n\n《经济间谍法》（EEA）由美国国会通过并于 1996 年由克林顿总统签署成为法律。EEA\
  \ 是首部广泛定义并为盗窃或未经授权使用商业秘密设立严格处罚的联邦法律。EEA 将为外国实体的利益复制、下载、上传、更改、窃取或转移商业秘密定为刑事犯罪。EEA\
  \ 对经济间谍行为的处罚包括最高 $10 百万的罚款和最高 15 年监禁，以及没收用于实施经济间谍行为的任何财产或因犯罪行为获得的财产。\n\n## 美国《1996\
  \ 年儿童色情预防法》\n\n《儿童色情预防法》（CPPA）于 1996 年颁布，以限制和惩罚在互联网上生产和分发儿童色情制品的行为。\n\n## 美国《1998\
  \ 年身份盗窃和冒用遏制法》\n\n《身份盗窃和冒用遏制法》于 1998 年颁布，并正式将身份盗窃确立为美国联邦法律下的刑事行为。根据该法，*身份盗窃* 是“明知故犯地在未经合法授权的情况下转移或使用他人的身份识别手段，意图实施、或协助或教唆任何违反联邦法律的违法活动，或构成任何适用州或地方法律的重罪。”在该法之前，身份盗窃未被作为犯罪进行监管或调查，这使得起诉因互联网兴起而日益增长的身份盗窃索赔变得困难。\n\
  \n## 美国《2001 年爱国者法案》\n\n《通过提供适当工具来拦截和阻止恐怖主义来团结和加强美国》（USA PATRIOT）法案，通常称为《爱国者法案》，于\
  \ 2001 年签署成为法律，以回应 2001 年 9 月 11 日在美国发生的恐怖袭击。该法案最初作为临时措施发布，但大多数措施于 2006 年重新授权。\n\
  \n《爱国者法案》修改了 CFAA 和 ECPA 中的许多条款，提供了新的刑事犯罪定义和对先前和新定义的计算机犯罪的新处罚。\n\n《爱国者法案》试图加强 CFAA\
  \ 和 ECPA 中的条款，以赋予执法部门进一步的权力来保护美国免受恐怖主义行为的侵害。该法案自出台以来一直存在激烈争论，其中一些条款已被各联邦地区法院宣布违宪。在该法案的剩余条款中，以下内容对\
  \ CISSP 考试以及作为安全专业人员的你尤其相关：\n\n* **第 202 条 — 授权拦截与计算机欺诈和滥用犯罪有关的电线、口头和电子通信：** 本节修改了\
  \ CFAA，授权调查人员为与计算机欺诈和滥用有关的重罪违规行为获取窃听令。\n* **第 209 条 — 根据搜查令扣押语音邮件信息：** 本节授权调查人员根据搜查令扣押语音邮件信息。在《爱国者法案》之前，语音邮件仅在更难获得的窃听令下才被授权扣押。\n\
  \n\n\n\n\n### 第 210 节 — 电子通信记录传票的范围\n本节更新了之前的法律，并在申请电子记录传票时授予访问额外信息。\n\n### 第 212\
  \ 节 — 为保护生命和肢体而紧急披露电子通信\n本节授予特殊规定，允许通信提供商（如 ISP）在紧急情况下向执法部门披露客户信息，例如即将发生的犯罪或恐怖袭击。在此次修正案之前，通信提供商在未经客户同意提供此类信息时可能面临民事责任诉讼。\n\
  \n### 第 214 节 — FISA 下的电话记录器和追踪器权限\n*电话记录器*是一种显示从电话发出的外呼的设备，而*追踪器设备*显示呼叫电话的来电号码；这些功能通常整合到一个称为*电话/追踪设备*的单一设备中。爱国者法案的本节授权在全国范围内使用这些设备（与签发法院的管辖权相反），并扩大权限以包括计算机和基于互联网的通信。\n\
  \n### 第 217 节 — 拦截计算机入侵者通信\n本节修正了之前的法律，允许通信提供商和其他组织允许执法部门拦截和监控其系统。在此次修正案之前，公司有权监控自己的系统，但不允许执法部门协助此类监控。\n\
  \n### 第 220 节 — 电子证据搜查令的全国性送达\n本节授权对与电子证据（如电子邮件）相关的搜查令拥有全国性管辖权。\n\n### 第 808 节 —\
  \ 联邦恐怖主义犯罪的定义\n恐怖主义的官方定义包括，除其他事项外，“通信线路、站点或系统的破坏”。\n\n### 第 814 节 — 遏制和预防网络恐怖主义\n\
  本节加强了与《计算机欺诈和滥用法》违规相关的处罚，包括将最高监禁刑期从 10 年加倍至 20 年。\n\n### 第 815 节 — 与响应政府请求保存记录相关的民事诉讼的额外抗辩\n\
  此次修正案免除了组织因响应“政府实体的请求”而违反《电子通信隐私法》所产生的民事处罚。\n\n### 第 816 节 — 网络安全取证能力的开发和支持\n本节要求美国司法部长建立区域计算机取证实验室，以支持对扣押或截获的计算机证据进行取证检查。第\
  \ 816 节还要求这些实验室为联邦、州和地方执法人员以及检察官提供取证分析培训和教育。本节还包括开放式语言，授权这些取证实验室“开展美国司法部长认为适当的其他活动”。\n\
  \n#### 2002 年美国国土安全法\n《国土安全法》于 2002 年颁布，是在 2001 年 9 月 11 日美国恐怖袭击事件后对《爱国者法案》回应的基础上制定的。《国土安全法》引发了自\
  \ 1947 年成立国防部以来美国政府最大规模的重组。根据《国土安全法》，数十个政府机构、办公室和服务部门被合并到新成立的美国国土安全部（DHS）。随着 DHS\
  \ 的成立，国土安全部长这一新的内阁级职位也被设立。《国土安全法》第 X 标题确定了应用于保护美国联邦政府信息的若干标准、策略和控制措施。第 X 标题及其小节确立了与信息安全相关的权限、职责和职能。\n\
  \n#### 2003 年美国控制非 solicited 色情和营销法案\n《美国控制非 solicited 色情和营销法案》于 2003 年签署成为法律。该法律在针对垃圾邮件（不受欢迎）邮件的投诉日益增多之际，建立了美国首个发送商业电子邮件的国家标准。该法律要求公司允许电子邮件收件人退订或选择退出未来的电子邮件，并对电子邮件内容和发送行为建立了各种要求。CAN-SPAM\
  \ 指定联邦贸易委员会（FTC）负责执行该法案中的规定。\n\n#### 2004 年美国情报改革和恐怖主义预防法\n《2004 年情报改革和恐怖主义预防法》设立了国家反恐中心（NCTC）和国家情报总监（DNI）职位。根据该法律，国土安全部和其他美国政府机构必须共享情报信息以帮助防止针对美国的恐怖行为。该法案还设立了隐私和公民自由监督委员会，旨在保护美国公民的隐私和公民自由。\n\
  \n#### 2001 年欧洲委员会《网络犯罪公约》\n《网络犯罪公约》，也称为《布达佩斯公约》，是为应对网络犯罪而制定的首个国际条约。该条约于 2001 年首次签署，于\
  \ 2004 年生效，此后已有 65 多个国家签署（美国于 2006 年批准该条约）。该条约旨在加强各国之间的合作，并建立更一致的国家法律，以防止和起诉网络犯罪。\n\
  \n#### 1990 年《计算机滥用法》（英国）\n《计算机滥用法》于 1990 年在英国生效，并引入了与网络犯罪相关的五项罪行：\n* 未经授权访问计算机材料\n\
  * 未经授权访问并意图实施或促成进一步犯罪\n* 未经授权的行为，意图损害或鲁莽地损害计算机等运行\n* 造成或造成严重损害风险的未经授权行为\n* 为其他犯罪制造、供应或获取物品\n\
  \n#### 2000 年《信息技术法》（印度）\n《信息技术法》于 2000 年由印度议会通过，并于 2008 年修订。该法为电子文件和数字签名建立了法律认可，同时还为网络犯罪如数据盗窃、身份盗窃、儿童色情和网络恐怖主义建立了定义和处罚。\n\
  \n#### 2001 年《网络犯罪法》（澳大利亚）\n《2001 年网络犯罪法》是澳大利亚对 2001 年 9 月 11 日美国恐怖袭击事件的回应。《2001\
  \ 年网络犯罪法》定义了严重的计算机犯罪，如未经授权访问、未经授权修改和未经授权损害电子通信，并为此类犯罪设立了处罚。\n\n### 许可和知识产权要求\n尽管今天存在的网络犯罪法律清单不断增长，但从法律上定义和起诉计算机犯罪仍然相当困难。因此，许多检察官仍依赖传统的刑事法律概念，如盗窃和欺诈。不管你为哪个组织工作，你都有很大可能拥有某种需要防范盗窃和欺诈的知识产权。知识产权可能包括软件、数据、多媒体内容如音乐和电影、算法、图纸等等。作为一名\
  \ CISSP，你的职责是保护所有形式的知识产权。\n世界各地有各种组织建立和保护知识产权权利；其中包括世界贸易组织（WTO）、世界海关组织（WCO）和世界知识产权组织（WIPO）。\n\
  \n\n\n\n\n在美国存在众多知识产权法律和法规，它们可分为五大类：\n\n* Licensing\n* Patents\n* Trademarks\n*\
  \ Copyrights\n* Trade secrets\n\n## Licensing\n\n法律对知识产权的保护使创作者和发明者能够从其作品中获利。不幸的是，信息复制和传输的便捷性使得人们更容易侵犯合法所有者权利而复制信息。\n\
  \n从经济角度来看，其影响是巨大的。到 2022 年，全球仿冒和盗版产品的贸易，无论是实体还是线上，预计将增长至 1.9 至 2.8 万亿美元。商业软件联盟（BSA）的估计显示，全球使用中超过\
  \ 40%的软件未获得适当许可。\n\n假冒商品也带来了重大的经济和人身风险。作为一个年产值 4600 亿美元的行业，假冒行为因电子商务平台的普及和国际运输的加速而变得更加简单，这伴随着贸易壁垒的降低。知识产权非法使用的次生影响同样令人惊讶。一种估计表明，23%的全部带宽消耗于侵犯知识产权的活动。\n\
  \n虽然新兴技术为改善许可方法提供了机会，但缺乏执法仍然是最大的障碍之一。随着越来越多的应用转向云启用模式，确保合法的软件许可与软件即服务密不可分。\n\n使用未授权软件会增加软件漏洞的风险，因为用户无法获得补丁和更新。这使得盗版软件用户在软件被发现漏洞时面临风险。虽然厂商会为其合法版本提供补丁，但未授权版本却得不到更新。颇具讽刺意味的是，通过非法使用未授权软件，个人更有可能被其他非法行为者盯上。这种影响在\
  \ WannaCry 恶意软件在中国的快速传播中表现得最为明显，据估计，中国 70%的计算机用户都在运行未授权软件，国家媒体承认有超过 40,000 家机构受到攻击影响。\n\
  \n## Patents\n\n`patent`是政府颁发的许可证或授予发明人的财产权，禁止另一方在特定时间内制造、使用、进口或销售该发明。在美国，专利由美国专利商标局（`USPTO`）颁发，通常有效期为\
  \ 15 或 20 年。要获得专利资格，发明必须具有新颖性、有用性和非显而易见性。由`USPTO`颁发的专利仅在美国及其领土内有效；发明人必须在希望受国家专利法保护的所有国家提交专利申请。还有欧洲专利局（`EPO`）、欧亚专利组织（`EAPO`）和非洲地区知识产权组织（`ARIPO`）等。作为`CISSP`，你应熟悉所在司法辖区的当地知识产权法律。\n\
  \n美国专利法编纂于`35 U.S.C.`和`37 C.F.R.`中，并由美国法律体系执行（而非`USPTO`）。对于美国专利的国际侵权，专利持有人可通过美国国际贸易委员会（`ITC`）采取行动，而非或除法院系统之外；`ITC`可发布排除令或停止令以限制侵权产品进入美国。通过法院系统可能才能实现对美国专利国际侵权的最佳救济。\n\
  \n## Trademarks\n\n根据`USPTO`，`trademark`是“用于识别并区分一方商品来源与他人商品来源的文字、短语、符号和/或设计”。`service\
  \ mark`是类似的法律授权，用于识别并区分服务的来源而非商品。术语`trademark`通常用于指代商标和服务商标。把品牌名称可口可乐作为一个流行的商标；可口可乐一词将该特定品牌与百事或其他任何可乐/汽水品牌区分开来。除`35\
  \ U.S.C.`外，商标还受商标法条约实施法案（美国公共法 105-330）保护。与专利不同，商标不会在固定期限后过期。相反，商标权只要在商业中使用就可以持续存在，可能长达永远。\n\
  \n## Copyrights\n\n`copyright`是对“原创作品”作者授予的法律保护，可能包括书籍、电影、歌曲、诗歌、艺术创作和计算机软件等类别。个人创作的版权受保护期限为作者终生加\
  \ 70 年。美国版权法最近一次全面修订为 1976 年版权法，并编纂于`17 U.S.C.`。美国版权局负责版权注册、记录和转让，但原创作品无需注册即可获得版权保护。\n\
  \n## Trade Secrets\n\n`trade secret`是公司拥有独占权的专有配方、流程、做法或信息组合。以之前的例子来说，可口可乐自 1886\
  \ 年以来一直保密的配方就是一个商业秘密，因为它是专有的，并且只有因其保密性才对公司具有经济价值。在美国，商业秘密法通常由各州自行管理，尽管大多数州已采纳统一商业秘密法（`UTSA`），该法最后一次修订于\
  \ 1985 年。此外，1996 年经济间谍法（本章前面讨论过）和 2016 年《保护商业秘密法》（`DTSA`）均将商业秘密的盗窃或不当获取确立为联邦犯罪。\n\
  \n## Import/Export Controls\n\n许多国家严格管控技术在其边境的流动。这可能是为了保护本地产业免受外部竞争，限制敏感技术（如加密）的出口，或实现特定国家的其他政策目标。作为`CISSP`，你应了解组织运营或公司员工可能前往的任何进出口管制的影响。\n\
  \n最著名的建立进出口管制的法规之一是美国《国际武器贸易条例》（`ITAR`）。`ITAR`管制国防物资和国防服务的出口，以防止这些敏感材料落入外国人手中。`ITAR`适用于政府机构以及处理美国军品清单（`USML`）中列出的受管制材料的承包商或分包商。受管制产品和技术数据包括卫星、飞机、航天器、导弹等等。仅仅发送包含`ITAR`管制数据（如蓝图或\
  \ 3D 设计文件）的电子邮件就被视为`ITAR`项下的出口。因此，重要的是你的组织必须保持适当的安全控制，以限制`ITAR`数据的流向合法人员和地点。\n\n\
  欧盟也对军民两用技术实施限制。2009 年 5 月 5 日的`ECPA No. 428/2009`要求成员国参与对军民两用物品的出口、转让、经纪和过境的管制。2017\
  \ 年，这些法规更新以反映对网络武器的管制。\n\n\n\n\n\n一些国家已通过法律或法规，要求进行安全审查，或在某些情况下，完全禁止公司将其产品进口到其国家。2016\
  \ 年，中国通过了一项广泛的网络安全法，要求信息技术供应商将其产品提交给国家安全部进行技术分析。该法律允许该部在审查过程中要求提供源代码以供检查。俄罗斯和其他国家对软件产品也提出了类似的期望。2017\
  \ 年，美国政府出于安全考虑，点名卡巴斯基实验室，立法规定该公司的产品不得在任何美国政府计算机系统上使用。\n\n## 跨境数据流动\n\n跨境数据流动的概念与之前讨论的进出口管制主题密切相关。更具体地说，这一概念侧重于限制某些数据进入或来自特定地理位置或司法管辖区的相关要求。上一节讨论的\
  \ ITAR 就是限制数据流动的立法的绝佳例子。根据 ITAR，数据必须留在美国境内；否则，就被视为出口（可能被允许，也可能不被允许）。此外，ITAR 特别禁止将受监管的数据发送到伊朗、叙利亚、朝鲜和其他指定国家。ITAR\
  \ 要求对于具有全球足迹的公共云基础设施尤其值得注意。许多云服务提供商已开发出“GovCloud”或类似的区域化云服务，以支持 ITAR 和其他限制跨境数据流动的进出口要求。\n\
  \n许多司法管辖区要求某些类型的数据必须在其境内处理。近年来，这一趋势有所增加，其假设是信息默认情况下会更安全，会在合法请求时提供给政府，并具有经济效益，即促使数据处理中心运营商在其国家内设立设施。超过\
  \ 34 个国家有某种形式的数据本地化要求。\n\n数据本地化法律在斯诺登披露国家安全局进行的各种收集活动后变得更加重要。数据本地化法律被视为对外国势力的情报活动提供某种保护。\n\
  \n数据本地化的经济论据不一定令人信服。大量研究表明，数据流动壁垒造成的贸易和投资机会丧失、IT 成本上升、竞争力下降以及经济生产率和 GDP 增长降低的成本是显著的。估计显示，本地化使巴西、中国、欧盟、印度、印度尼西亚、韩国和越南的\
  \ GDP 降低了 0.7%至 1.7%。\n\n尽管如此，许多国家（除了前面提到的美国）已通过此类法律。\n\n### 俄罗斯\n\n2015 年，俄罗斯成为首批要求所有在俄罗斯境内收集的关于俄罗斯公民的数据必须存储在俄罗斯境内的政权之一。实施该法律的法规可能不要求本地化，如果信息服务并非针对俄罗斯（即使用俄语、使用俄罗斯顶级域名等）；这仍然对信息提供商产生了重大影响。一些提供商，包括\
  \ Google、Apple 和 Twitter，已在俄罗斯收购计算能力以遵守该法律。其他人，尤其是领英，则抵制该法律，其服务在俄罗斯境内被封锁或受限。\n\n\
  ### 中国\n\n在中国，《网络安全法》的执行将对信息流动施加新的限制。中国声称对在其边界内运营的互联网拥有主权，并安装了网络保护措施，包括限制接入点和严格的防火墙规则，以审查在中国境内提供的数据。《网络安全法》第\
  \ 37 条要求关键行业网络运营商将其网络运营商收集或产生的所有数据存储在国内系统上。特别是，该法律要求在国内收集的中国公民数据必须保留在中国境内，未经中国政府许可不得转移到国外。\n\
  \n## 隐私\n\n隐私和信息安全密不可分。如本章前面所述，隐私有效地是应用于个人数据的保密安全原则。全球有几项重要法规建立了隐私和数据保护要求。作为一名安全专业人员，了解管辖您所在司法管辖区的每项隐私法规非常重要。作为一名\
  \ CISSP，您可能熟悉以下法规，具体取决于您的司法管辖区：\n* 美国 1974 年联邦隐私法\n* 美国 1996 年健康保险可携性和责任法案（HIPAA）\n\
  * 美国 1998 年儿童在线隐私保护法（COPPA）\n* 美国 1999 年格雷姆-里奇-比利雷法案（GLBA）\n* 美国 2009 年经济和临床健康法案中的健康信息技术法案（HITECH）\n\
  * 数据保护指令（欧盟）\n* 1998 年数据保护法（英国）\n* 安全港\n* 欧盟-美国隐私盾\n* 通用数据保护条例（GDPR）（欧盟）\n\n###\
  \ 美国 1974 年联邦隐私法，5 U.S.C. § 552a\n\n《联邦隐私法》是 1974 年颁布的美国法律。《隐私法》建立并规范了美国政府机构收集、维护、使用和传播个人身份信息的做法。《隐私法》的目的是在政府维护公民和永久居民信息的需要与这些个人保持其个人信息私密的权利之间取得平衡。在其条款中，《隐私法》规定，“任何机构不得通过任何通信方式向任何人或另一机构披露记录系统中的任何记录，除非根据该记录所涉及的个人的书面请求，或经该个人事先书面同意。”尽管《1974\
  \ 年隐私法》大大早于互联网，但该法中的条款仍然相关，并在在线隐私同意书和其他用作“个人书面同意”的机制的形式中体现出来。\n\n### 美国 1996 年健康保险可携性和责任法案\n\
  \nHIPAA 于 1996 年签署成为法律，而 HIPAA 隐私规则和安全规则分别于 2003 年生效。必须遵守 HIPAA 要求的组织被称为受监管实体，分为三类：\n\
  * 健康计划：这包括健康保险公司、政府项目如医疗保险，以及支付医疗保健的军事和退伍军人健康项目。\n* 医疗保健提供者：这包括医院、医生、养老院、药房和其他传输健康信息的医疗提供者。\n\
  * 医疗保健清算所：这包括公共和私人组织，如计费服务，它们处理或促进非标准健康信息的处理并将其转换为标准数据类型。医疗保健清算所通常是医疗保健提供者与健康计划或医疗服务付款人之间的中介。\n\
  \nHIPAA 隐私规则为保护患者隐私建立了最低标准，并规范了个人健康信息的使用和披露，被称为受保护健康信息。根据 HIPAA，个人的 PHI 仅允许用于执行和计费医疗服务的目的，并且必须受到不当披露或使用的保护。\n\
  \n\n\n\n\nHIPAA 安全规则为以电子形式存储或传输的受保护健康信息（PHI）建立了最低保护标准。安全规则通过建立涵盖实体必须实施的技术、物理和行政控制措施，将隐私规则具体化，以保护以电子形式存储的\
  \ PHI（或 e-PHI）的保密性、完整性和可用性。\n\nHIPAA 违规的民事处罚可能包括罚款，每项违规从 100 美元到 50,000 美元不等，类似违规的最高罚款为每年\
  \ 150 万美元。刑事处罚包括最高 25 万美元的罚款以及最高 10 年的监禁。\n\n### 美国《1998 年儿童在线隐私保护法》\n《1998 年儿童在线隐私保护法》是一项美国联邦法律，为在线企业保护\
  \ 13 岁以下儿童的隐私建立了严格的指导方针。COPPA 适用于全球任何处理居住在美国的儿童数据的组织，也适用于居住在美国境外的儿童，如果公司是美国本土企业。该法律对寻求父母同意设定了要求，并对向\
  \ 13 岁以下儿童进行营销设定了限制。\n\n### 美国《1999 年格拉姆-里奇-布莱利法案》\n《格拉姆-里奇-布莱利法案》，也称为《1999 年金融服务现代化法案》，是一项美国法律，要求金融机构保护其客户的个人身份信息（PII）。GLBA\
  \ 中的规定之一，金融隐私规则要求金融机构向每个客户提供书面隐私通知，说明从客户处收集的个人信息是什么，如何使用以及如何保护。GLBA 安全保障规则要求组织实施适当的<|message|>\
  \ 控制措施来保护客户的个人数据。\n违反 GLBA 的处罚可能包括对组织的每项违规最高 10 万美元的民事罚款，以及对金融服务公司的高级管理人员和董事最高 1\
  \ 万美元的罚款。此外，违反 GLBA 的刑事行为可能包括吊销执照和最高五年监禁。\n\n### 美国《2009 年经济与临床健康信息技术法案》\n《经济与临床健康信息技术法案》，称为\
  \ HITECH 法案，是在 2009 年《美国复苏与再投资法案》下颁布的。HITECH 法案旨在促进电子健康记录（EHR）的广泛使用。随着采用率的提高，该法案预计安全和隐私风险也会增加。因此，HITECH\
  \ 法案通过提高 HIPAA 合规违规的处罚力度，加强了医疗数据的安全和隐私保护，从而扩展了 HIPAA 隐私保护。在 HITECH 法案下，最高财务处罚被提高到每项违规类别、每年\
  \ 150 万美元。\nHITECH 法案还引入了新的 HIPAA 泄露通知规则。根据该规则，涵盖实体必须在发现泄露后 60 天内向受影响方披露未受保护的受保护健康信息的泄露。除了通知受影响个人外，泄露通知规则还要求涵盖实体向美国卫生与公众服务部以及服务于受影响方所在司法管辖区的主要媒体机构报告影响\
  \ 500 人或以上的人的泄露事件。\n\n### 数据保护指令（欧盟）\n数据保护指令，正式名称为 95/46/EC 指令，于 1995 年由欧洲议会颁布。数据保护指令旨在规范欧洲公民个人数据的处理。尽管此后已被\
  \ GDPR 取代（将在后面的章节中讨论），但数据保护指令是欧盟第一部重要的隐私法，被认为是整个欧洲的基础隐私法规。\n\n### 《1998 年数据保护法》（英国）\n\
  《数据保护法》由英国议会制定，以执行欧盟《数据保护指令》中的规定。《数据保护法》确立了英国公民有权控制其个人信息的法律权利，并旨在强制执行存储在计算机系统上的个人数据的隐私。《1998\
  \ 年数据保护法》后来被《2018 年数据保护法》取代，后者旨在执行和补充 GDPR 中的规定（将在后面的章节中讨论）。\n\n### 安全港\n国际安全港隐私原则，通常简称为“安全港”，是美国和欧洲联盟之间于\
  \ 1998 年至 2000 年间建立的协议，旨在调和美国和欧盟隐私法律之间的差异。根据安全港，美国公司可以自我认证其符合美国和欧洲联盟商定的数据隐私要求。安全港于\
  \ 2015 年被欧洲法院裁定无效，不久后被欧盟-美国隐私盾取代。\n\n### 欧盟-美国隐私盾\n欧盟-美国隐私盾是欧盟和美国第二次尝试就共同监管两司法管辖区之间个人数据交换的原则达成一致。该协议于\
  \ 2016 年达成，不到一年后安全港被欧洲法院裁定无效。然而，到 2020 年，同一法院宣布欧盟-美国隐私盾无效。\n\n### 通用数据保护条例（欧盟）\n\
  GDPR 被大多数人认为是世界上最强有力的数据隐私法。GDPR 于 2016 年制定，用数百页的法规取代了欧盟 1995 年的数据保护指令，要求全球各地的组织保护欧盟公民的隐私。凭借这一全面的法规，全球与欧洲客户开展业务的公司被迫重新思考其对数据安全和隐私的方法。作为一名\
  \ CISSP 和信息安全领导者，这是一项你很可能需要熟悉的立法。\nGDPR 第 5 条确立并描述了处理个人数据的七项原则：\n* **合法性、公平性和透明度：**\
  \ 按照适用法律获取和处理个人数据，并充分告知客户其数据将如何使用。\n* **目的限制：** 确定数据收集的“具体、明确和合法”目的，并告知他们该目的。\n\
  * **数据最小化：** 仅收集和处理提供商定服务所必需的最小数据量。\n* **准确性：** 确保个人数据保持“准确，并在必要时保持最新”。\n* **存储限制：**\
  \ 个人数据只能存储在提供商定服务所必需的时间内。\n* **完整性和保密性：** 确保个人数据的适当安全，并提供防止未经授权访问以及意外丢失或破坏的保护。这包括在必要时实施数据匿名化技术以保护客户身份。\n\
  * **问责制：** *数据控制者*（即存储和处理个人数据的方）必须能够证明其遵守所有这些原则。许多客户追求行业标准认证，例如 ISO 27001，以证明其对安全和隐私的问责制和承诺。\n\
  GDPR 第 4 章 包含几项建立与数据控制者和处理者相关的要求的条款，并要求 *数据处理者*（即代表数据控制者存储和处理 PII 的组织）优先考虑安全和隐私。特别值得关注的是，第\
  \ 25 条要求“通过设计和默认的数据保护”；这是一项巨大的指令，将安全专业人员多年来一直建议的最佳实践法典化。\n\n## 了解调查类型的要求\n\n\n\n\
  \n\n在本节中，我们比较和对比不同类型的调查，包括行政调查、刑事调查、民事调查和监管调查。对于每种调查类型，我们讨论谁执行调查、收集和呈现证据的标准，以及类型之间的一般差异。\n\
  \n在讨论法律事务时，重要的是要强调法律和法院在全球范围内差异很大；执法机构、法院、律师和法官的行为和表现方式之间存在许多具体区别，这取决于你居住的地方、导致调查发生的事件发生地以及其他变量。本书中提供的信息主要基于英国普通法的传统，严格作为示例；然而，作为一名安全专业人员，你必须绝对熟悉与你的所在地和客户相关的法律和法规，以便你能提供充分、知情的服务。\n\
  \n举证责任是指刑事检察官或民事原告/索赔人必须证明他们对被告提出的指控。提出主张的一方必须用有力的证据证明该主张的真实性；在大多数现代社会中，对主张进行抗辩的实体被推定为无罪或无过错——也就是说，法院不会在该主张得到证实且被告被证明有罪之前承认对任何人的主张的有效性。需要多少以及多强的证明才能使判决偏离这一无罪推定，取决于提出的是哪种主张；例如，主张是由一个私人当事人对另一个私人当事人提出，还是由政府对个人或组织提出（稍后我们将详细介绍这一区别）。在美国法律体系中，必须满足的两种主要证明标准被称为证据优势和排除合理怀疑。\n\
  \n证据优势是两者中较低的标准，主要用于民事诉讼。它本质上意味着证据表明被告更有可能造成损害，而不是没有。换句话说，证据说服了法官、陪审团或裁决机构，被告造成损害的可能性至少有\
  \ 51%。\n\n第二个标准，排除合理怀疑，要难得多，主要用于刑事诉讼。证据仅仅让法官或陪审团更倾向于有罪而不是无罪是不够的。在这种情况下，证据必须清晰且有说服力，以至于“合理”的人在看到证据后对被告的罪行没有任何怀疑或保留。\n\
  \n### Administrative\n\n在讨论调查时，对于 (ISC)² 来说，行政一词将指仅限于在单一组织内进行的行动——也就是说，组织对其自身进行行政调查。内部调查通常在事项涉及违反组织政策且不涉及执法机构、投资者、第三方供应商或攻击者等外部实体时进行。\n\
  \n组织本身可以指派任何人执行行政调查的活动。这可能包括组织内部的员工和工作人员（物理和 IT 安全人员、审计员、管理层等），或可能涉及组织聘请的专门承包商来执行调查任务。\n\
  \n行政调查的举证责任是所有调查类型中最低的。管理层可以使用他们选择的任何标准来相信证据。\n\n行政调查可能导致惩罚性措施，包括员工解雇、特权丧失、重新分配等。管理层也可能根据行政调查中发现的结果选择改变调查类型；如果行政调查显示相关方从事故意/恶意或刑事活动，管理层可能会升级为民事诉讼（诉讼）或提起刑事指控，这两种情况都需要与这些情况相关的调查行动。\n\
  \n尽管管理层在行政调查中采取行动所需的举证责任很低，但在过程中仍应谨慎行事。有时，在行政调查期间收集的证据可能导致或被用于民事或刑事调查，如前所述。如果在行政调查期间证据被不当处理，可能损害在后续程序中使用该证据的能力。如果对行政调查最终是否会升级存在任何不确定性，与管理层或内部或外部律师讨论这一问题是明智的。\n\
  \n考虑以下调查示例：IT 部门联系安全办公室报告一名员工滥用组织的互联网连接进行未经授权的文件共享，直接违反了组织的政策。安全办公室将情况告知管理层；管理层指示\
  \ IT 和安全部门收集有关用户在线活动的信息。IT 和安全部门的人员共同努力收集有关用户账户和机器的日志数据，并将这些信息提交给管理层。管理层与法律和人力资源部门协商以评估行动方案。管理层决定解雇该员工。\n\
  \n这纯粹是一项行政调查。\n\n### Criminal\n\n刑事调查涉及根据刑事法律进行起诉。政府在联邦、州或地方层面通过对违法者处以罚款、监禁，或在某些极端情况下甚至处以死刑来起诉其法律的违反行为。刑事调查由执法组织进行，可能包括地方、州、联邦甚至国际机构。虽然一些\
  \ CISSP 在执法职位上并自行进行刑事调查，但我们大多数人可能需要向执法部门报告刑事事件并帮助收集/提供证据。\n\n执法机构参与刑事案件的起诉之前，必须首先确定管辖权。正如我们在“确定合规性和其他要求”一节中讨论的那样，管辖权是政府机构（如法院或执法机构）对特定事项的法律管辖权，通常基于地理位置。对于涉及信息资产的犯罪，确定管辖权可能很复杂，并且经常可能涉及多个不同的政府机构、地区和法律。\n\
  \n一旦确定管辖权，执法调查员首先尝试了解发生了什么，造成了什么损害，以及可能适用于起诉的犯罪范围有哪些。在某些情况下，由于 IT 的全球性，一个案件可能因管辖权问题、调查成本与犯罪规模和影响的对比，以及成功起诉的可能性而被撤销或转交给另一家执法机构。\n\
  \n随着调查的进展，执法部门开始了解潜在嫌疑人可能是谁以及有哪些证据可用，调查员必须开始将重点缩小到具体的法律和法规。许多国家、省份、城市和其他司法管辖区都有各种关于技术滥用和误用的法律。\n\
  \n\n\n\n\n通常情况下，刑事法院对确定责任和有罪有最高的法律标准；这通常被称为证明被告造成了损害的证据，证据必须排除合理怀疑。按照这一标准，绝大多数证据必须表明被告有罪，使法院别无其他合理结论。\n\
  \n刑事调查人员收集证据，直到可以证明构成要件或直到明显无法证明为止。他们使用调查技术，包括数字取证（见第 7 章，“安全运营”）。调查人员可视证据需要扣押媒体和设备。\n\
  \n在收集证据时，执法人员可能需要也可能不需要获得法院命令，从而允许政府访问由私人实体拥有的财产、设备和数据。这些法院命令可能以搜查令或传票的形式出现；有些必须由法官签发，而其他则可以由法院的任何官员（如政府委任的检察官）签发。\n\
  \n当私人组织请求执法部门介入或对疑似事件作出响应时，该组织可以授权政府访问其财产/设备/数据，且无需法院命令；该组织拥有财产/设备/数据，因此可以允许任何其选择的人访问。在刑事案件中，受雇于请求执法响应的组织的安保专业人员不应在未得到执法人员指导的情况下自行进行调查。换句话说，如果你作为安保专业人员怀疑已发生犯罪并打算向政府报告此案，你应暂停调查活动（超出遏制即时损害的范围），除非政府/当局另有指示，否则应立即将问题上报管理层。未经训练的人员不熟悉法律程序和适当的证据收集与处理流程，其调查行为可能污染证据并妨碍调查。\n\
  \n此外，受雇于组织的安保专业人员不应单方面决定联系执法部门。这是一个复杂的决定，应与管理层以及内部和/或外部律师协商后作出。\n\n最后，适用于受雇于执法和检察机构的安保专业人员或调查人员的额外规则。公司可以简单地选择向执法部门提供其拥有的证据，但执法部门和检察部门员工对证据的收集、处理和分析则适用严格规则。政府调查人员必须意识到并理解适用于他们的法律要求；这将包括（除其他要求外）是否需要搜查令来扣押证据、严格遵守证据保管链程序，以及证据分析是否不超出特定情况下法律允许的范围。\n\
  \n### Civil\n\n民事法规范私人实体之间的关系和互动。民事案件中的原告起诉要求赔偿损失或解决某种类型的纠纷。作为信息安全从业人员，我们可能被要求在客户作为民事诉讼的原告或被告时提供支持。以下是在安保专业人员，如你，可能涉及的可能民事诉讼的示例：\n\
  \n*   **你的组织是原告：**如果有人未经授权访问你的生产环境并窃取数据，给你的组织造成损害，你的组织可能会起诉肇事者索赔损害赔偿（对所造成损害的赔偿）。你可能被要求监督证据的收集（例如，被渗透主机的日志、入侵检测系统和网络设备），以证明被告造成了损害。（注：这可能是在政府对被告提起的*刑事*行动之*外*进行的。）\n\
  \n*   **你的组织是被告：**如果前员工指控组织制造了敌对的工作环境，你可能需要监督证据的收集（例如，管理层和执行人员之间讨论员工待遇的电子邮件），以及在法院或律师要求时防止潜在证据被销毁（称为*销毁保留通知*、*保存通知*、*诉讼保留*或类似术语）。\n\
  \n与刑事法不同，在民事诉讼中，通常的证明标准是证据优势，这意味着举证责任要低得多。证据优势是简单的过错/责任多数；如果原告能够向法院证明被告对损害的责任甚至达到\
  \ 50.1%，被告将败诉民事案件。\n\n在民事诉讼中，没有有罪与无罪的问题，而是责任与无责任的问题。如果被告被认定有责任，可能被命令支付损害赔偿、停止损害原告的活动，或履行其先前订立的合同或协议。与刑事判决不同，当事人不会因民事诉讼中的责任而被监禁或处死。然而，如果民事诉讼当事人拒绝遵守法院命令，可能导致藐视法庭指控，最终可能导致监禁。\n\
  \n由于民事案件的举证负担和败诉风险远低于刑事案件，收集和处理证据的努力程度也相应较低。这*并不*意味着民事案件中的证据可以随意或粗心处理；仍需谨慎采取适当、专业的方式行事。然而，在民事案件中，调查和证据收集不会由佩戴徽章的执法人员和政府特工执行；相反，它是由信息技术和安全专业人员，如\
  \ CISSP，来完成的。\n\n与刑事审判类似，民事审判中可以使用哪些证据也有规则。被认为不可靠的收集证据可能被主持审判的法官排除。应注意保留调查员收集的证据的原始副本，并应妥善记录证据保管链。原始证据绝不应被更改，除非极少数例外情况，且未经监督调查或处理案件的律师的直接指示。证据的毁损（即原始证据的篡改或销毁）可能导致案件中证据被排除，或在某些情况下，可能导致因毁损造成的损害而提起的单独诉讼。\n\
  \n如果对民事诉讼证据收集和处理的规则存在不确定性，咨询数字取证专家或律师会有所帮助。\n\n### Regulatory\n\n监管调查涉及确定组织是否遵守特定法规或法律要求。法规具有法律效力；因此，监管调查与刑事调查类似。法规的制定旨在保护普通公民或消费者、保护环境，或使行业更安全、更公平。\n\
  \n政府机构进行监管调查，以确定是否存在足够的证据证明违反规则或法规。这些机构有权自行决定何时进行调查。这些机构拥有自己的内部调查员、检察官和用于其程序的法院。监管机构还可以要求目标组织提供信息，或利用审计报告数据来代替或补充其自身调查。\n\
  \n\n\n\n\n监管调查的举证责任标准是证据优势，处罚通常涉及罚款和禁令。然而，也有监管机构要求移交刑事执法的情况，这可能导致监禁。\n\n### 行业标准\n\
  \n调查是一个宽泛的术语。目前在这个领域提供了许多标准和指南，其中一些取决于组织运营的司法管辖区或行业。本节快速浏览了一些与调查相关的最常见标准和指南。\n\n\
  `ISO/IEC 27043:2015` 推荐了进行安全事件调查的程序步骤。这些指南涵盖了从准备阶段到调查结束的许多事件场景。涵盖的场景包括数据丢失或损坏、未经授权访问以及已确认的数据泄露等事件。\n\
  \n`ISO/IEC 27037:2012` 提供了处理数字证据的指南。这是通过识别、收集、获取和保存的四步流程来完成的。证据收集和处理涵盖了许多类型的媒体和场景，包括磁性和光学存储介质、移动设备、摄像系统、标准计算机，以及从网络设备收集网络流量数据。该出版物还涵盖了证据保管链程序以及如何在司法管辖区之间正确交换证据。\n\
  \n`NIST SP 800-86`，“将取证技术整合到事件响应中的指南”，在内容上与前两个来源有很大重叠。它是 NIST 对数字取证过程的观点。它详细说明了如何在组织内部建立取证能力，这意味着什么，以及员工需要哪些工具和培训。该出版物还描述了如何为组织构建取证政策、标准和程序，以及它们应包含的内容。最重要的是，`NIST\
  \ SP 800-86` 将数字取证过程总体描述为四个阶段：收集、检查、分析和报告。\n\n`NIST SP 800-101 Revision 1`，“移动设备取证指南”，标题具有自解释性。它涵盖了获取、保存、检查、分析和报告移动设备上存在的数字证据的独特要求。讨论了与移动设备相关的技术差异，例如影响证据收集的内存类型和文件结构差异。该出版物还讨论了当移动设备为私人所有时可能出现的敏感问题。\n\
  \n从这份行业标准列表中可以看出，证据管理和数字取证是进行技术调查的核心。CISSP CBK 的 第 7 域 涵盖了安全运营，我们在本书的 第 7 章 中进一步讨论了理解和遵守调查。\n\
  \n## 开发、记录和实施安全政策、标准、程序和指南\n\n虽然防火墙、加密和复杂的访问控制机制等技术安全控制在维护组织数据安全方面非常重要，但政策、标准、程序和指南等文件是信息安全计划中最重要的组成部分。这些文件各不相同，但密切相关，共同指导组织的行动。\
  \ 图 1.3 显示了政策、标准、程序和指南之间的关系。\n\n### 政策\n\n*policy* 是正式的一组声明，建立了一套指导决策和行动的原则。更具体地说，*security\
  \ policy* 是一组声明，确定了管理组织信息系统和数据保护的原则和规则。政策可以是公司范围的、系统特定的或问题特定的（例如事件响应政策）。一些常见的安全政策示例包括以下内容：\n\
  * 可接受使用政策\n* 访问控制政策\n* 变更管理政策\n* 远程访问政策\n* 灾难恢复政策\n\n![FIGURE 1.3 Relationship between\
  \ policies, procedures, standards, and guidelines](img/c01f003.png)\n\n**FIGURE\
  \ 1.3 Relationship between policies, procedures, standards, and guidelines**\n\n\
  政策为组织的安全计划奠定了基础，通常写得足够宽泛，以便在多年内适用且相关。就像建筑物的地基一样，安全政策应长期存在，并且比其他文件更不可能发生变化，尽管应定期审查和更新（如有必要）。标准、程序和指南是支持要素，为组织的政策提供具体细节以补充。\n\
  \n### 标准\n\n*Standards* 是具体且细粒度的要求，为更广泛的更高层级政策提供方向。标准建立了必须遵循和执行以满足政策的具体行为和行动。标准可能对特定组织是强制性的，如果由合同或法律强制要求。联邦信息处理标准（FIPS）例如，是\
  \ NIST 开发的公开宣布的标准，用于为美国政府机构建立各种安全要求；例如，FIPS 140-2 是一个建立加密模块安全要求的标准。在此标准中，有特定的加密设备被允许和禁止在美国政府系统中使用。\n\
  \n*Baselines* 与标准相关，并为系统、网络或设备建立最低安全水平。例如，您的组织可能会为公司使用的每个操作系统维护单独的基线。这些基线中的每一个都应确定必须到位以满足公司安全标准和政策的具体设置、应用程序和配置。虽然在\
  \ CISSP CBK 中没有特别提及，但您应该熟悉基线并了解它们如何融入更大的图景。\n\n作为基线的一个子集，*security baselines* 表达了保护特定配置的\
  \ CIA 和其他安全属性所需的最低安全控制集。范围指导通常作为基线的一部分发布，定义了对特定基线可接受的偏离范围。一旦建立了范围指导，就会进行定制，以应用特定的一组控制措施，在范围指导范围内实现基线。范围和定制在\
  \ 第 2 章，“资产安全”中进一步讨论。\n\n### 程序\n\n*procedure* 是实现特定目标或要求的详细分步指南。程序告诉您 *如何* 实施您的政策以及\
  \ *如何* 满足您的标准和基线。一些常见的安全程序示例包括以下内容：\n* 漏洞扫描程序\n* 备份和恢复程序\n* 账户配置程序\n* 补丁管理程序\n\n\
  作为一名 CISSP，您可能被要求在您的组织中创建、更新和管理信息安全政策。此外，作为一名 CISSP，您必须确保组织内的其他非信息安全程序（例如人力资源和交易处理程序）是安全、合规且符合相关政策和标准的。\n\
  \n### 指南\n\n*guideline* 与标准类似，但是一种建议而非强制性要求。指南引用政策声明，并为满足政策意图提供灵活的建议，或为实施标准和基线中的要求提供建议。\n\
  \n\n\n\n\n信息安全实践的指导来源有很多。毫无疑问，CISSP CBK 就是其中之一，它反映了广泛的安全实践，但在组织的信息安全环境内部并不具有强制性。ISO/NIST/ITIL\
  \ 框架经常被用作指导；然而，如果组织有合规期望，它们可能会成为政策或标准。其他指导来源包括制造商的默认配置、行业特定指南，或独立组织，例如开放式 Web 应用安全项目\
  \ Open Web Application Security Project (OWASP) 在软件开发方面的工作。\n\n## 识别、分析和确定业务连续性需求\n\
  \n业务连续性 Business Continuity (BC) 和灾难恢复 Disaster Recovery (DR) （在 Chapter 7 中详细讨论）是密切相关的概念，有助于组织在安全事件期间继续开展关键运营，并在灾难（或重大破坏性事件）后尽可能快速、安全地恢复。业务连续性和灾难恢复经常被一起提及，但重要的是你要理解各自的作用。\n\
  \n* *业务连续性计划* Business Continuity Plan (BCP) 是一种方法和一套协议，用于在危机情况下使组织能够保持其关键业务功能运行；这有时被称为\
  \ *运营连续性* Continuity of Operations (COOP)。业务连续性包括所有预防性控制措施和员工管理，有助于在灾难期间保持整体业务的功能。\n\
  * *灾难恢复计划* Disaster Recovery Plan (DRP) 是在破坏性事件发生后，安全高效地恢复信息系统和运营的一系列流程。DR 是 BC\
  \ 的子集，其主要目标是最大限度地减少业务停机时间，并在可能的最短时间内恢复正常运营。\n\n当灾难发生时，BC 和 DR 活动会同时启动——业务连续性任务保持关键业务功能运行，而灾难恢复行动则致力于使事物恢复正常。对于\
  \ BC 和 DR 规划，业务影响分析 Business Impact Analysis (BIA) 可以帮助识别关键业务功能。\n\n### 业务影响分析\n\
  \n根据 ISO，*业务影响分析* 是“分析中断对组织随时间推移的影响的过程”。换句话说，BIA 有助于组织识别其关键业务功能并了解灾难对每个功能的影响；BIA\
  \ 为业务连续性计划及其要求提供了主要依据。BIA 有助于组织识别其哪些业务功能更具弹性，哪些更脆弱。\n\n要完成 BIA，你应首先建立 BC 项目团队、范围和预算；我们在下一节“制定和记录范围和计划”中介绍此步骤。你应确保获得高层对\
  \ BCP 活动的支持。BCP 不会产生直接或有形的回报，因此你需要高级领导的支持来提供财务资源、人员配备和整体战略愿景。\n\n下一步是最重要的：识别所有关键业务功能\
  \ Critical Business Functions (CBFs) 和其他关键业务要素。这里的关键词是 *业务*，因为你应专注于识别对业务运营至关重要的关键功能，无论你的业务是销售小部件还是挽救生命。\n\
  \n识别 CBFs 需要来自广泛利益相关者的输入。系统所有者、主题专家、客户和供应商的观点都有助于识别组织的潜在 CBFs。CBFs 和关键业务要素的清单应包括以下内容：\n\
  \n* 人员\n* 业务流程\n* 信息系统和应用程序\n* 其他资产\n\n对于组织识别的每个 CBF，你应执行风险分析以识别存在的任何漏洞，以及减轻这些弱点的步骤。此外，你必须确定不利事件影响\
  \ CBFs 的可能性以及业务愿意因任何一个关键业务功能中断而接受的影响程度。确定灾难的影响程度有多种方式，有几个指标你应该熟悉：\n\n* *最大可容忍停机时间*\
  \ Maximum Tolerable Downtime (MTD)，或最大可接受中断 Maximum Acceptable Outage (MAO)，表示关键业务功能在不造成对业务重大、长期损害的情况下可以不可用的最长时间；它是\
  \ CBF 在威胁组织长期生存之前可以保持停用的最长时间。MTD 必须由系统所有者定义，系统所有者最终对 CBF 的正常运行负责。超过 MTD 是业务所有者表达不可接受风险的表现。\n\
  * *恢复时间目标* Recovery Time Objective (RTO) 是将系统恢复到满足系统所有者最低服务期望的点的计划所需时间。换句话说，RTO\
  \ 是在中断后必须在其中恢复 CBF 的最长时期，以避免不可接受的业务后果。由于不可接受的灾难发生在超过 MTD 时，RTO 按定义必须小于或等于 MTD。RTO\
  \ 必须通过应用额外控制措施进行调整，以使其在 MTD 范围内。在业务所有者不再愿意应用控制措施时，他们已接受运营风险。\n* *恢复点目标* Recovery\
  \ Point Objective (RPO) 表示可容忍数据丢失的度量，以时间段表示。与 MTD 一样，这必须由业务定义，并且业务有责任提供实现 RPO 的控制措施。\n\
  \nMTD、RTO 和 RPO 是业务连续性规划的基本阈值。Figure 1.4 直观地表示了这些概念以及它们如何相互配合。\n\n![FIGURE 1.4 Relationship\
  \ between MTD, RTO, and RPO](img/c01f004.png)\n\n**FIGURE 1.4 Relationship between\
  \ MTD, RTO, and RPO**\n\n### 制定和记录范围和计划\n\nBCP 本身是组织对维持业务运营的承诺，以及组织为此采取的步骤。该计划侧重于业务依赖以向客户交付商品和服务的人员、流程和技术。从\
  \ BIA 活动中得出的信息应用于记录业务连续性计划的范围。\n\nBCP 必须保护组织的关键业务功能及其客户，并为组织提供在满足任何法律和监管要求以及组织定义的\
  \ MTD、RTO 和 RPO （在上一节中讨论） 的服务水平和时间段内继续有效业务运营的能力。\n\nBCP 的范围必须涵盖组织的全部运营，包括组织开展业务的每个业务领域和每个地理区域。虽然业务连续性规划没有一刀切的方法，但大多数计划的范围包括以下内容：\n\
  \n* 关键业务功能\n* 威胁、漏洞和风险\n* 数据备份和恢复计划\n* BCP 人员\n* 通信计划\n* BCP 测试要求\n\n一旦组织完成了业务影响评估，你应该拥有\
  \ CBFs 的清单，并了解组织对每个 CBF 的停机时间和损失的阈值。连续性规划的下一阶段涉及识别减轻 CBFs 风险的具体机制和程序，并保持与已建立的 MTD、RTO\
  \ 和 RPO 的合规性。\n\n\n\n\n\n与任何好的计划一样，BCP 涉及人员、流程和技术——按此顺序。在接下来的三个部分中，我们将介绍保护这三类资产所需的要素和技术。\n\
  \n### People\n\n人员始终无一例外地是您最宝贵、最关键的资产。任何 BCP 的首要目标都必须是确保在紧急情况发生期间和之后您的人员安全。在 BCP\
  \ 的背景下，“人员”包括您的员工、承包商、客户、供应商以及可能受不利事件影响的任何其他活着的人类。\n\n在确保人员安全之后，您必须确保他们获得继续尽可能正常工作的必要资源。这可能包括庇护所（例如，替代工作地点）和他们为生存以及完成\
  \ BCP 和运营任务所需的食物。\n\n一个设计良好的业务连续性计划必须包含通知所有受影响人员（内部和外部）发生不利事件的协议。您必须确保有多重通信方式来通知关键\
  \ BCP 人员，以防由于灾难导致一种或多种方式不可用。此外，管理层和关键 BCP 利益相关者必须在灾难期间定期收到状态更新，以提供知情并使战略决策能够得到充分信息支持。\n\
  \n### Processes\n\nBCP 团队必须评估每个关键业务职能，并确定在灾难期间必须可用的资源。您的连续性计划应确定维持关键运营所需的关键物资和物流，并应建立一个流程以确保这些资源持续可用。\n\
  \n最基本 BCP 流程之一确保组织的<|message|> 关键数据处理设施和能力在灾难期间保持运行。您的组织应确定在何处以及如何继续关键数据处理职能。解决此主题最相关的方法是通过制定在灾难期间使用替代场地的流程。主要恢复站点类型为热站点、冷站点和暖站点。我们在\
  \ Chapter 7 中介绍这些内容。\n\n### Technologies\n\n硬件和软件故障——这只是技术现实的一部分。业务连续性计划必须预见这些故障并概述控制措施和程序以降低技术故障风险。系统和数据备份是组织应对此风险最久经考验的方法。您必须拥有全面的备份流程，以确保关键系统和数据被捕获、存储，并在需要时可用于恢复。您应维护最关键信息的多个副本。如果您的组织维护本地系统（例如，如果您运行数据中心），那么，备份集中的一份必须存储在异地；这可以在灾难摧毁主要位置的情况下保护您的数据至少有一个副本。如果您使用基于云的系统，您应在多个\
  \ `cloud regions`（或数据中心所在地理位置）中维护备份副本，以便您的数据在任何给定时间都可恢复。\n\n除了信息备份之外，您的 BCP 还应建立维护冗余系统的协议，以在重大负面事件期间继续支持您的业务。冗余的电力供应、水源、电信系统和网络连接系统是确保灾难期间持续运营所必需的。许多组织租用两个或多个互联网服务提供商（ISP）、多个公用事业提供商和至少两个银行提供商，以防灾难源于这些提供商之一而不是组织内部。\n\
  \n## CONTRIBUTE TO AND ENFORCE PERSONNEL SECURITY POLICIES AND PROCEDURES\n\nCISSP\
  \ CBK 的安全与风险管理领域涵盖了构建和管理安全系统和数据所需的基础概念的基础。由于硬件、软件和技术控制往往得到所有关注，因此重要的是您要记住，人为因素可能是信息安全中最大的部分。您组织的安全规划的一个重要部分应侧重于确保员工安全的政策和程序。在本节中，我们将介绍候选人筛选和招聘、员工入职和离职、管理外部人员（即供应商、顾问和承包商）以及其他重要人员安全考虑等主题。\n\
  \n### Candidate Screening and Hiring\n\n候选人筛选和招聘合适的员工是确保贵公司系统和数据安全的关键部分。您不仅需要确保为工作招聘合适的人选，而且在将他们带入组织并让他们访问敏感信息之前，了解候选人的背景和历史也至关重要。\n\
  \n在开始为职位招聘候选人之前，您的组织必须做几件事。首先，招聘经理应与人力资源部门合作，清晰简洁地记录职位描述和职责。拥有职责明确记录的职位描述可以帮助您为工作招聘合适的人选，并且以后可以用作衡量员工是否符合聘用前设定的期望的标尺。接下来，您应根据该职位人员故意或疏忽违反安全协议可能造成的损害程度来确定该职位的分类或敏感性。分配给职位的分类或敏感性（例如，NIST\
  \ 称之为 `risk designation`）应指导员工一旦被聘用后将获得的授权类型；因此，您的候选人筛选流程的彻底程度应与您所填补职位的敏感性相匹配。作为\
  \ CISSP，在授予任何员工访问敏感信息的权限之前，应考虑风险等级（或您所在司法管辖区的等效等级）。\n\n一旦确定潜在员工或承包商，您的组织应核实其申请中的信息，并通过进行背景调查来确认其是否适合该职位。一般来说，雇佣背景调查可能包括以下检查和核实：\n\
  \n* Education\n* Work history\n* Citizenship\n* Criminal record\n* Credit and financial\
  \ history\n* References\n\n除上述列表外，候选人筛选可能包括药物检测和/或对高度敏感职位或需要特殊安全许可的职位的进一步调查（这对于政府机构的就业尤其相关）。作为\
  \ CISSP，您应确保您的组织制定了政策和程序，以根据您所在司法管辖区的任何相关法规筛选和聘用候选人。\n\n### Employment Agreements\
  \ and Policies\n\n加入组织时，员工通常会签署一份雇佣合同，其中可能包含一项或多项员工协议，对员工必须遵守的某些规定作出规定。最常见的员工协议是非披露协议和非竞争协议。\n\
  \n`nondisclosure agreement`（NDA）是一项协议，限制员工或承包商（或任何其他有权访问敏感信息的人）披露他们通过受雇或与组织的关系获得的敏感信息。NDA\
  \ 的设计目的是保护组织的机密数据（如商业秘密或客户信息），并且通常是终身协议（即使员工离开公司后也有效）。\n\n\n\n\n\n*非竞争协议*是一种协议，限制员工在受雇期间直接与组织竞争，并在大多数情况下，在雇佣关系结束后的一段固定时间内继续限制。非竞争协议是单向协议，旨在保护组织免受前员工或承包商的不公平竞争。例如，如果你被聘为手机设计公司的硬件工程师，你可能需要签署一份非竞争协议，声明在终止雇佣关系后至少\
  \ 18 个月内不会为其他设计手机的公司工作；这里的想法是，在这 18 个月之后，你对公司的内部知识将不再构成劣势。\n\n除了保密协议和非竞争协议外，员工可能还需要负责审查和/或签署各种雇佣政策，例如可接受使用政策、行为准则或利益冲突政策。\n\
  \n### 入职、调岗和离职流程\n\n入职、调岗和离职是雇佣的三个阶段，每个阶段都有其自身的安全考虑。让人员进入组织的流程决定了他们的工作行为基调。同样，员工离职流程应明确人们在离开公司时尊重组织知识产权和数据安全的义务。作为一名安全专业人员，你应积极与业务部门合作，以确保入职、调岗和离职流程得到明确记录，并在雇佣的各个阶段设定行为期望。\n\
  \n#### 入职\n\n为工作行为设定良好的期望应始于员工踏入办公室之前。员工入职培训计划的一部分应涉及信息安全期望和要求。应提醒员工保护信息的义务以及对组织信息资产的当前威胁，特别是如果他们可能成为恶意行为者的目标。此外，入职实践应告知新员工报告安全事件的流程、他们维护工作区域安全的角色，以及公司的分类和归类流程，以便他们能够识别特定信息所需的控制级别。\n\
  \n员工还应大致了解存在监控其使用组织资产的控制措施。不仅如此，这让他们确信组织确实采取行动保护其信息，而且仅此信息本身可能对不当行为起到威慑作用。其意图不是为员工提供足够的技術细节以击败控制措施，而是确保他们理解自己的行为可能会受到审查。\n\
  \n#### 调岗\n\n组织应制定明确的政策和程序来处理员工从一个角色调到另一个角色的情况。此流程的一部分应涉及审查员工现有的信息访问权限并评估继续访问相同信息的必要性。在可能的情况下，你的组织应寻求删除在员工新角色中不再需要的访问权限；这执行了我们本章前面讨论过的最小权限原则。此外，你应建立流程以识别员工在调岗前需要接受的任何基于角色的培训；当员工的新角色带来新的责任或访问更高敏感度的信息时，这一点尤为关键。\n\
  \n#### 离职\n\n在人员离开组织时采取适当的谨慎措施，与确保他们被妥善引入组织一样重要。离职可能是自愿的，即员工退休或找到新工作，或非自愿的，即员工被解雇、休假或以其他方式“被解雇”。这些前内部人员对组织构成风险，必须采取适当措施确保他们不会损害其被托付的运营、知识产权或敏感信息。\n\
  \n当个人在良好条件下离开组织时，相对容易按照标准清单进行操作：暂停电子访问、收回其访问徽章和设备、清点其钥匙、更改离职员工使用的密码锁上的钥匙代码等，都是众多标准做法之一。大多数组织都有结构良好的离职流程，以确保在个人不再有权访问组织信息或资源时移除其访问权限。\n\
  \n雇佣关系的非自愿终止对所有相关人员来说都是情绪激动的事件。在几乎所有情况下，非自愿终止迫使雇主假设被终止的个人对组织构成威胁，应采取适当行动保护组织资产。大多数组织的终止程序包括特定的流程通知信息安全组织以禁用对电子和物理系统的访问。\n\
  \n在可能的情况下，应尝试收回非自愿离职员工使用的财产。在适当的情况下，收回的材料应作为证据进行跟踪并保留以供后续取证分析。最后，一旦个人离开组织，应通知剩余员工被终止的个人不再被允许访问，并且该个人尝试访问资源或财产的任何行为都应报告。\n\
  \n### 供应商、顾问和承包商协议及控制措施\n\n许多组织需要组织内部不存在的专业知识或人才。这些关系可能存在于货物或服务，但这两种类型的获取都会使组织面临风险。应制定信息安全政策以确保这些关系不会使组织的敏感信息暴露于不合理的风险。保密协议和其他雇佣协议政策在与第三方建立期望方面发挥着重要作用，并可能导致组织在执行这些协议时产生额外的合规负担。\n\
  \n### 合规政策要求\n\n遵守适用政策和法规的责任应得到明确记录并为组织内的所有员工所理解。在许多情况下，员工可能需要签署一份证明，声明他们已审查并同意遵守所有公司政策和适用法规。\n\
  \n具有系统和信息访问权限的员工和其他方必须接受包括安全意识和基于岗位的培训在内的初始和定期培训。通常，每年重新认证是确保所有有权访问的人员继续遵守雇佣政策的好方法。\n\
  \n### 隐私政策要求\n\n你组织的*隐私政策*是对你公司个人数据收集和使用做法的解释。隐私政策应链接回适用的隐私法律和法规，例如美国的 HIPAA 和处理欧盟居民信息的公司的\
  \ GDPR。\n\n你的隐私政策应说明收集了何种个人数据、你的组织将如何或不会如何使用它，以及个人数据将如何存储、维护和保护。隐私政策应向所有人员公开，许多组织要求每位员工签署确认书。\n\
  \n## 理解和应用风险管理概念\n\n\n\n\n\n`Risk management` 主题及其内部的所有概念是信息安全的核心，是每个强大信息安全计划的核心。`Risk\
  \ management` 包括与识别威胁和漏洞以及量化并应对与这些威胁和漏洞相关的风险相关的所有流程。风险管理流程为做出安全决策（如购买和实施安全工具以及招聘人员）提供了一种结构化的方法。本节涵盖风险管理背后的关键概念，并指导您在组织中应用这些概念。\n\
  \n### Identify Threats and Vulnerabilities\n\n在安全领域，`risk` 是由于 `threat` 利用 `vulnerability`\
  \ 而对组织、其目标或目标，或其资产（包括人员、系统和数据）造成负面影响的可能性。您应该注意，不同行业对这些术语（即 `risk`、`threat` 和 `vulnerability`）各有数十种定义。我们将进一步讨论这些术语，但重要的是要理解风险位于\
  \ Figure 1.5 中所示的三个组成部分的交集处。\n\n![FIGURE 1.5 Relationship between threats, vulnerabilities,\
  \ assets, and risks](img/c01f005.png)\n\nFIGURE 1.5 Relationship between threats,\
  \ vulnerabilities, assets, and risks\n\n#### Threats\n\n`threat` 是可能导致不期望结果的负面事件，例如资产的损坏或丢失。威胁由\
  \ `threat actor` 构成，`threat actor` 是能够故意或意外地损害资产安全的人或实体。作为安全专业人员，威胁是我们努力保护信息和系统免受其侵害的人和事件。\n\
  \n安全威胁的示例包括以下内容：\n* 一名黑客想要加密您的数据并向您收取赎金\n* 一名不满的员工想要窃取或出售公司信息\n* 火灾或其他自然灾害可能会损坏或摧毁您的数据中心\n\
  \n#### Vulnerabilities\n\n`vulnerability` 是系统中存在的弱点或差距，可能被（威胁行为者）利用来损害资产的安全或触发风险事件。漏洞是我们试图加固和改进的系统内的事物。\n\
  \n安全漏洞的示例包括以下内容：\n* 未修补的软件应用程序\n* 弱访问控制机制（例如，弱密码）\n* 有缺陷的消防抑制系统\n\n#### Assets\n\
  \n`asset` 是任何有价值的东西，可能包括人员、财产和信息。资产是我们作为安全专业人员试图保护的东西。人员资产可能包括您公司的员工、承包商和供应商，以及您的客户。财产资产包括服务器和设备等有形事物，以及软件代码和其他知识产权等无形事物。\n\
  \n### Risk Assessment\n\n请记住，风险是威胁、漏洞和资产的交集，如 Figure 1.5 所示。`risk assessment` 是识别存在的威胁和漏洞并确定这些威胁利用已识别漏洞的影响和可能性的活动集合。\n\
  \n有许多风险框架（在“Risk Frameworks”部分中讨论）为进行风险评估提供指导，但一般来说，风险评估包括 Figure 1.6 中所示的步骤。\n\n\
  ![FIGURE 1.6 Steps for assessing risk](img/c01f006.png)\n\nFIGURE 1.6 Steps for\
  \ assessing risk\n\n#### Risk Identification\n\n典型风险评估流程的第一步是识别您的资产并确定这些资产的价值；这包括根据其对组织的敏感性或价值来识别和分类您的敏感数据。在风险识别阶段，您找到需要保护的系统、应用程序和信息，然后识别并描述对每个资产构成风险的漏洞和威胁。\n\
  \n#### Risk Analysis\n\n风险分析应始终从漏洞评估开始（在 Chapter 6 “Security Assessment and Testing”\
  \ 中讨论）以及威胁分析（在本章后面“Understand and Apply Threat Modeling Concepts and Methodologies”\
  \ 部分中讨论）。风险评估的这一阶段侧重于评估已识别威胁利用环境中弱点（即漏洞）的可能性，并确定如果发生这种情况对资产的影响。`Likelihood` 描述事件发生的概率，而\
  \ `impact` 定义如果事件发生会造成多大的灾难。\n\n可能性可以通过评估每个威胁并评估威胁可能实际利用漏洞的概率来识别。例如，您可能会确定与破坏性火灾相关的风险相对较低，如果您拥有每月测试的冗余消防抑制系统；如果您有检测和扑灭火灾的机制，并且定期测试这些机制，那么火灾摧毁一切的可能性或概率就会降低。同样，如果您与一家大型组织签订合同而未进行彻底的背景调查，您可能会将内部威胁识别为高可能性——在这种情况下，发生坏事的概率更大。\n\
  \n影响可以通过为每个可能受影响的资产建立相关价值并确定该价值将如何被不利事件破坏或以其他方式影响来识别。资产的价值可以是 `quantitative`（即由其成本或市场价值决定）或\
  \ `qualitative`（即由其对您或您组织的相对重要性决定）。通过建立资产的价值，您可以更好地确定该资产的安全被破坏的影响——这允许在确定为保护给定资源花费多少时做出明智的决策，因为您永远不想花费保护资产的费用超过资产本身的价值。\n\
  \n#### Risk Evaluation\n\n在风险评估期间，您将风险分析的结果与组织建立的风险概况或风险承受能力（即组织愿意承担多少风险）进行比较。通过这样做，您能够为每个已识别的风险确定最佳行动方案。我们将在下一节中介绍风险响应的各种选项。\n\
  \n### Risk Response/Treatment\n\n一旦您识别并评估了组织面临的威胁、漏洞和风险，您必须确定解决每个风险的最佳方式；这称为 `risk\
  \ treatment`（或 `risk response`）。风险处理主要有四类，我们将在以下各节中描述：避免、缓解、转移和接受。这些最终都是领导/管理决策，应有\
  \ CISSP 的参与和知情。\n\n#### Avoid\n\n`Risk avoidance` 涉及通过停止或移除导致风险的活动或技术来消除已识别的风险。组织在特定风险超过其可接受的风险承受能力时使用风险规避，但完全规避通常很难实现而不造成业务中断。虽然这种风险处理方式通常意味着简单地不做某事，但禁止使用可移动介质或个人云存储服务的政策是需要前期投资和行动的规避步骤。\n\
  \n#### Mitigate\n\n\n\n\n\n风险缓解（有时称为风险降低或风险修改）是一种策略，涉及降低威胁实现的可能性或减轻已实现威胁对组织造成的冲击。风险缓解是已识别风险最常见的处理选项，涉及实施政策和技术以减少风险可能造成的危害。从单因素身份验证转向多因素身份验证就是对敏感数据访问的一种缓解措施的例子。\n\
  \n### 转移\n\n风险转移（也称为风险分配）涉及将与风险相关的责任和潜在损失转移给第三方。保险是最常见的风险转移形式。例如，如果公司因网络入侵而丢失客户数据，公司可能会依赖其网络保险来覆盖与入侵相关的任何货币损失。在这种情况下，被入侵组织已将财务风险转移给其网络保险公司，但公司仍必须应对一定程度的声誉风险。完全转移所有风险是困难的，因此许多人改用风险分担这一说法。使用基于云的服务或托管安全服务就是一个很好的例子，因为风险在您作为客户和第三方提供商之间分摊。\n\
  \n### 接受\n\n风险接受不出所料地涉及接受与特定威胁相关的风险。如果避免、缓解或转移风险的成本高于已实现威胁的预期损失，则风险接受是可行的方法。理论上，只有风险完全在组织的风险承受范围内时才应接受风险。实际上，组织往往被迫接受与正常业务运营相关的可能痛苦的风险。\n\
  \n## 对策选择与实施\n\n缓解是上一节中四种风险处理方法中最常见的风险处理方法。风险缓解涉及选择和实施一个或多个对策（或“安全控制”），目标是降低不良事件发生的可能性或该事件发生的影响。对策通常分为三类：\n\
  * 与人员相关：由于人们通常被认为是组织的“薄弱环节”，这些对策往往证明非常宝贵。招聘（或解雇）、组织重组和意识培训是一些常见的与人员相关的对策。尽管我们可能成为弱点，但在具有强大安全意识计划的高绩效组织中，人们往往可以证明是最大的安全资产。\n\
  * 与流程相关：政策、程序和其他“基于工作流程”的缓解措施通常属于此类。例如，考虑实施发票审批和付款的职责分离作为抵御网络欺诈的流程相关缓解措施。\n* 与技术相关：这是通常获得最多关注的类别。加密、修改配置设置以及其他硬件或软件更改是技术相关对策的常见示例。\n\
  \n在选择对策时，您必须考虑诸如安全有效性、成本效益和运营影响等因素。\n\n### 安全有效性\n\n衡量安全控制的安全有效性是选择和实施过程中的一个重要步骤。在选择对策时，您希望确保您选择的具体政策、技术或运营控制能够直接解决风险分析过程中识别出的风险。为此，必须考虑想要防止、检测或纠正何种安全风险，然后确定专门针对这些风险的对策。例如，许多安全团队选择对所有内容都使用加密，但如果您担心加密无法解决的风险（如可用性风险），您最好将这些资源用于其他对策（如备份）。\n\
  \n### 成本效益\n\n也许比安全有效性更重要（信不信由你），成本效益是安全团队及其管理团队的主要考虑因素。成本效益可以通过进行成本效益分析来计算，该分析将对策（或多个对策）的成本与因对策旨在缓解的风险被破坏而产生的成本进行比较。\n\
  如果使用对策后的年度损失期望值（`ALE`）加上对策成本小于未使用对策时的 `ALE`，则可认为该对策具有成本效益。例如，如果与敏感数据被盗相关的 `ALE`\
  \ 为 500,000 美元，您理论上最多可以花费 499,999.99 美元用于对策，以将此类数据被盗的 `ALE` 降低到 0.01 美元。当然，您希望从所有麻烦中获得超过一分钱的收益，但这说明了这一点。另一种看待方式是，如果贵公司因勒索软件攻击而产生的\
  \ `ALE` 预计为 200,000 美元，而您花费 50,000 美元购买一套复杂的备份系统，所选对策对组织的价值为 150,000 美元，这显然具有成本效益。\n\
  \n### 运营影响\n\n除了成本效益和纯安全有效性之外，您必须确保评估对策可能对组织产生的潜在运营影响。如果对策实施或使用过于困难，它可能会产生适得其反的效果，实际上增加风险，因为它未被正确使用（或根本未使用）。例如，一些组织要求使用第三方电子邮件加密平台发送敏感信息，而其中一些平台的用户友好性非常差。如果没有仔细选择平台并进行适当的用户培训，一些用户可能会规避此对策并以明文形式发送敏感电子邮件。了解组织的文化和战略是选择不会产生负面运营影响的对策的重要部分。\n\
  \n## 适用的控制类型\n\n安全控制是为积极影响安全而实施的任何保障措施。安全控制可以是自动的或手动的，可以是技术性的（即通过硬件、软件或固件实现和执行）、运营性的（即与日常运营和有形事物如保安、门禁等相关）或管理性的（即由人员实施并与管理方法相关——诸如政策、程序和指南等事物）。有五种主要类型的控制，您会注意到一些对策（如保安）可能适合多个类别：\n\
  * 预防性：这些是旨在防止不良安全事件发生的首道防线控制。例如，软件应用程序通常具有某种形式的“输入验证”，以避免无效输入被执行并导致问题。防火墙、系统备份和安全意识培训是预防性控制的其他常见示例。\n\
  * 检测性：这些控制旨在在负面安全事件发生时或发生后不久识别该事件。就像人类侦探一样，这种类型的控制旨在收集信息并帮助安全团队确定发生了什么、损害有多大以及导致其发生的原因。安全审计、门禁报警和\
  \ `IDSs` 是检测性控制的常见示例。\n\n\n\n\n\n### 纠正性\n这些控制措施旨在最大限度地减少并修复不利安全事件后的损害；它们通常在侦测性控制识别出问题后实施。纠正性控制包括诸如软件补丁、配置文件修改，以及针对事件原因的新政策等内容。\n\
  \n### 恢复\n这些对策旨在补充纠正性控制，其目的是尽快使系统恢复正常。示例包括系统和数据备份以及灾难恢复站点。\n\n### 威慑\n这些控制措施旨在通过让攻击者三思而后行来阻止其恶意意图。铁丝网、保安人员和看门狗就是一些威慑的例子。\n\
  \n### 控制评估\n\n定期评估您的安全控制措施与选择和实施这些控制措施同等重要。在许多情况下，您的组织可能有法律或监管要求规定如何以及何时进行安全控制评估（SCA），但在所有情况下，您都应定期进行控制评估，以确保您的安全和隐私控制措施保持有效。\n\
  \nSCA 可能采用自我评估或由第三方进行的外部评估的形式。存在许多不同的 SCA 方法，但它们通常包括以下某种形式的评估方法：检查、访谈和测试。`NIST 800-53A`，《联邦信息系统和组织中安全和隐私控制的评估》，为进行控制评估提供了一些有用的指导，并将三种评估方法描述如下：\n\
  \n* **Examine:** 此方法为“审查、检查、观察、研究或分析一个或多个评估对象（即规范、机制或活动）的过程。检查方法的目的是促进评估者理解、实现澄清或获取证据。”评估者通常在\
  \ SCA 开始时请求一份工件或证据清单（例如安全策略、配置文件等），以便他们可以进行检查以形成初步观点。\n* **Interview:** 此方法为“与组织内个人或个人群体进行讨论的过程，再次促进评估者理解、实现澄清或获取证据。”在审查检查阶段提供的任何证据后，评估者会与关键利益相关者会面，以获得有关已实施的安全控制及其工作原理的额外清晰度。\n\
  * **Test:** 此方法为“在指定条件下行使一个或多个评估对象（即活动或机制）的过程，以将实际行为与预期行为进行比较。”在此阶段，审计员或评估者寻求确认安全控制已按其记录的方式实施，并且它们正在有效运行并按预期运行。\n\
  \nChapter 6 深入涵盖了安全评估。\n\n### 监控和度量\n\n监控和度量您的控制措施是运营基于风险的安全计划的重要组成部分。除了定期（例如每年或每季度）进行安全和隐私控制评估外，您还应主动、有意地监控您的控制措施，以衡量其有效性并评估整体安全计划的健康状况。根据您组织的需求，您应制定一套关键绩效指标（KPI），以便量化并衡量控制措施的长期绩效。\n\
  \n### 报告\n\n如果没有完善管理的报告职能，进行 SCA 和其他监控和度量活动将毫无用处。审计员和评估者通常会创建正式报告，详细说明他们对每个受评估控制的发现。此外，您的安全团队应有流程来记录并向高级领导、监管机构和其他利益相关者报告任何重要发现或指标。\n\
  \n一些法律、法规和行业要求附带特定的报告指南；作为信息安全领导者，您必须熟悉与您的组织相关的任何此类要求。一般而言，完善管理的基于风险的安全计划包括以下方面的某种程度的报告：\n\
  \n* 内部审计（例如自我评估）\n* 外部审计（即监管机构或任何其他第三方审计）\n* 组织风险状况的重大变化\n* 安全或隐私控制的重大变化\n* 疑似或已确认的安全漏洞（或其他事件）\n\
  \n### 持续改进\n\n安全领导者之间常见的目标是不断改进其组织的安全态势并衡量其通往理想最终状态的旅程。作为一名 CISSP，您需要持续确定您的组织是否正在改进其信息安全风险管理。您还应寻求不断改进与组织实施的安全工具、控制措施和流程相关的投资回报率（ROI）。“不够安全”和“也许安全工具和流程太多”之间存在微妙界限。作为\
  \ CISSP，您应寻求不断改进组织安全管理计划的效率。\n\n*风险成熟度模型* 是一种允许组织评估其安全计划的强度并根据其结果制定持续改进计划的过程。通过在预定义量表上确定其计划的成熟度，组织可以更好地专注于需要改进的行为类型，而不是严格陷入单个安全差距。成熟度模型将在\
  \ Chapter 8 中进一步讨论。\n\n### 风险框架\n\n*风险框架* 是识别、评估和管理组织风险的结构化流程。已开发出许多框架来识别和评估风险。这些框架已发展以满足不同行业和法规的独特需求。单独来看，这些框架以不同方式处理信息系统的评估、控制、监控和审计，但都力求提供内部控制以将风险降至可接受水平。虽然存在一些国际公认的风险框架，但也开发了许多行业特定框架以满足特定需求。\n\
  \n无论采用何种框架，要在组织中有效应对风险，评估信息系统运行风险的标准流程必须考虑到不断变化的威胁环境、系统的潜在和实际漏洞、风险发生的可能性，以及如果风险成为现实对组织的影响。\n\
  \n从治理角度来看，框架的选择应创建如下的控制环境：\n\n* **Consistent:** 治理计划在信息安全和隐私的方针和应用上必须保持一致。\n* **Measurable:**\
  \ 治理计划必须提供确定进展和设定目标的方式。大多数控制框架包含评估标准或程序以确定合规性，在某些情况下也确定风险。\n* **Standardized:**\
  \ 与可衡量性一样，控制框架应依赖标准化，以便一个组织或组织的一部分的结果能够以有意义的方式与另一个组织的结果进行比较。\n* **Comprehensive:**\
  \ 所选框架应涵盖组织的最低法律和监管要求，并可扩展以适应额外的组织特定要求。\n* **Modular:** 模块化框架更有可能经受住组织的变革，因为只有需要修改的控制或要求才会被审查和更新。\n\
  \n\n\n\n\n有数十种不同的风险管理框架。虽然许多框架针对特定的行业或组织要求，但您应了解更常见框架的广泛特征。\n\n## 国际标准化组织\n\n国际标准化组织制定了\
  \ `ISO 31000` 系列标准，以确定通用风险管理的原则并提供实施指南。该系列使用 `ISO/IEC Guide 73:2009` 中包含的一致语言开发，`ISO\
  \ 31000:2018` 旨在适用于任何组织，无论其治理结构或行业如何。该标准鼓励在组织各条线和各层级整合风险管理活动，为组织提供一致的运营和战略风险管理方法。\n\
  \n`ISO 31000:2018` 基于一套八项原则，这些原则推动了 Figure 1.7 所示的风险框架的开发。该框架进而构建了实施风险管理的流程。\n\n\
  ![FIGURE 1.7 ISO 31000:2018](img/c01f007.png)\n\n**FIGURE 1.7 ISO 31000:2018**\n\
  \n八项 `ISO 31000` 原则描述如下：\n\n*   **Customized:** 框架应根据组织和风险水平进行定制和适当。\n*   **Inclusive:**\
  \ 相关利益相关者的适当及时参与是必要的。\n*   **Comprehensive:** 需要结构化和全面的方法。\n*   **Integrated:**\
  \ 风险管理是所有组织活动不可分割的一部分。\n*   **Dynamic:** 风险管理能够及时预见、检测、承认并响应变化。\n*   **Best available\
  \ information:** 风险管理明确考虑可用信息的任何局限性。\n*   **Human and cultural factors:** 人文和文化因素影响风险管理的各个方面。\n\
  *   **Continual improvement:** 风险管理通过学习和经验不断改进。\n\n为帮助组织实施 `ISO 31000` 标准，`ISO 31004`，“Risk\
  \ Management — Guidance for the implementation of ISO 31000” 已发布，以提供一种结构化方法，使其现有风险管理实践与\
  \ `ISO 31000` 保持一致，并与组织的个体特征和需求保持一致。\n\n虽然 `31000` 系列涉及一般风险，但信息安全实践在 `ISO 27000`\
  \ 系列中得到解决。`ISO/IEC Guide 73` 的使用允许使用通用语言，但 `ISO/IEC 27005:2011`，“Information technology—\
  \ Security techniques — Information security risk management” 通过定义信息安全风险决策的背景，为信息安全风险提供细节和结构。该背景包括组织风险承受能力的定义、合规期望以及风险评估和处理的首选方法。\n\
  \n`ISO 27005` 并未直接提供风险评估流程。相反，它为组织使用的风险评估实践提供输入并获取输出。在此框架中，评估过程可以以定量或定性方式执行，但必须保持一致，以便进行优先级排序。`ISO\
  \ 27005` 进一步强调了与利益相关者沟通的必要性，以及持续监控风险环境变化的流程。\n\n`ISO` 标准因其在标准制定过程中广泛的国际参与而得到广泛采用。此外，这些标准本身虽然不断审查，但与\
  \ `ISO` 内部管理的其他标准相连接。这使组织能够采用适合其业务的标准，并为组织的风险和合规活动提供更全面的视角。\n\n## 美国国家标准与技术研究院\n\
  \n通过一系列出版物，国家标准与技术研究院为美国政府机构实施信息安全实践提供指导。在当前版本中，风险管理框架 (`RMF`) 提供了一种结构化分析流程，用于识别、控制、评估和改进组织的信息安全控制。记录在\
  \ `NIST Special Publication 800-37`，“Guide for Applying the Risk Management Framework\
  \ to Federal Information Systems” 中，它规定了联邦政府管理其信息系统风险的六步流程；这六个步骤如图 Figure 1.8 所示。尽管该框架中的步骤针对政府机构进行了定制，但它们在几乎每个行业中都具有广泛适用性。\n\
  \n`NIST RMF` 的第一步涉及根据机密性、完整性或可用性丧失对组织造成的潜在影响，对所有信息系统进行分类。隐含在此流程中的是，组织必须拥有系统的全面清单以应用分类标准。一旦完成安全分类，就必须根据已识别的分类和影响选择一组基线控制。\n\
  \n![FIGURE 1.8 NIST Risk Management Framework](img/c01f008.png)\n\n**FIGURE 1.8\
  \ NIST Risk Management Framework**\n\n一旦系统被分类并选择了基线控制，就必须实施并监控这些控制，以确保“它们已正确实施、按预期运行，并就满足系统的安全要求而言产生预期结果”。这将产生一套证明控制技术应用的文件。\n\
  \n在对信息系统进行分类、选择和实施控制并评估这些控制的有效性之后，组织领导层随后正式决定是否授权使用该系统。该决定基于控制使系统在组织风险承受范围内运行的能力。最后，组织必须持续监控控制的有效性，以确保系统的持续运行在组织的风险承受范围内。\n\
  \n虽然 `NIST` 标准和指南侧重于美国政府的计算活动，但由于其广泛范围、公共领域的可用性以及行业、学术和其他标准组织参与标准的制定，它们对安全社区产生了深远影响。此外，`NIST`\
  \ 标准通常为其他受监管行业所期望的安全实践设定了标准。这在 `HIPAA` 立法中最为明显，其中医疗保健组织必须证明其控制措施与 `NIST` 安全实践保持一致。由于其广泛引用，`NIST\
  \ RMF` 是 `CISSP CBK` 的重要组成部分。\n\n## COBIT 和 RiskIT\n\n在 1990 年代后期，美国和加拿大的审计界认识到\
  \ IT 治理与更大的组织管理结构之间存在显著差距。因此，IT 活动通常与公司目标不一致，风险未被控制结构全面解决，也未在财务报告中一致反映。为解决这一差距，`ISACA`\
  \ 开发了一个框架，通过该框架可以评估组织的 IT 活动。\n\n\n\n\n\n控制信息技术和相关技术目标框架将流程区分为企业 IT 治理（五个流程）或企业\
  \ IT 管理（32 个流程）。每个流程都有一组目标、输入、关键活动、输出，以及用于评估相对于目标的绩效的度量。由于该框架与其它管理框架和工具（`ISO 20000`、`ISO\
  \ 27001`、`ITIL`、`Prince 2`、`SOX` 和 `TOGAF`）紧密对齐，因此它已获得广泛认可，成为管理 IT 交付的全面框架。\n\n\
  基于 ISACA `COBIT` 治理框架，`RiskIT` 框架为识别、评估和监控信息技术风险提供了一个结构。这简化了将 IT 风险整合到更大组织的企业风险管理（`ERM`）活动中的过程。\n\
  \n`RiskIT` 框架由三个域组成——风险治理、风险评估和风险响应——每个域各有三个流程。该框架随后详细说明了每个流程中的关键活动，并确定了组织职责、流程间的信息流以及流程绩效管理活动。有关如何实施该框架并将其链接到其它组织管理实践的更多详细信息包含在\
  \ `RiskIT Practitioner Guide` 中。\n\n## 理解和应用威胁建模概念和方法\n\n`Threat modeling` 是一种技术，通过它你可以识别系统和应用程序的潜在威胁，以及针对这些威胁识别合适的对策。威胁可能与整体系统漏洞或必要安全控制的缺失有关。威胁建模最常在应用程序开发阶段使用，但你也可以使用威胁建模来帮助降低现有应用程序和环境中的风险。\n\
  \n`attack surface` 是攻击者可能执行入侵的总范围。对于信息系统，这可能包括通信方法、访问控制或底层架构中的弱点。对于物理环境，攻击面可能包括建筑技术、位置或出入口方式。将攻击面限制为最少的暴露区域可减少威胁演变为成功攻击的机会。\n\
  \n### 威胁建模概念\n\n威胁建模有三种通用方法。不同的风险方法论、合规框架或系统更偏好其中一种，但作为一名 CISSP，你应该能够将这三种方法应用于特定环境。这些方法分别是攻击者中心、资产中心和软件中心（或系统中心），将在以下各节中分别介绍。\n\
  \n#### 攻击者中心\n\n攻击者中心威胁建模方法首先通过识别可能对系统造成损害的各种行为者开始。以攻击者中心方法，你首先通过对潜在攻击者的特征、技能和动机进行画像，然后利用该画像来识别最有可能执行特定类型攻击的攻击者。这种方法在通过限制分析场景数量来狭窄地处理问题时很有帮助。战术军事情报通常由攻击者中心威胁模型驱动，许多业务连续性/灾难恢复规划流程也是如此。如果你从事金融服务，你可能熟悉来自反洗钱（`AML`）和其它反金融犯罪应用的攻击者中心建模。`AML`\
  \ 流程涉及使用洗钱者攻击时运作方式的过程模型，以识别遏制此类攻击的步骤。\n\n#### 资产中心\n\n与攻击者中心方法相反，资产中心威胁模型首先识别有价值的资产。资产应以其对组织的价值以及对潜在攻击者的价值为特征。然后评估管理、操纵、使用和存储资产的方式，以识别攻击者如何可能破坏资产。许多合规制度都侧重于资产的保护（例如\
  \ `HIPAA` 下的 `PHI`、`GDPR` 下的 `PII` 或 `PCI-DSS` 下的持卡人数据），因此这种方法在建立或验证合规性时很有帮助。你还会发现这种方法在保护其它高价值资产（如知识产权和安全凭证）时特别有用。\n\
  \n#### 软件中心（或系统中心）\n\n对于许多信息系统环境，软件或系统中心模型最有用。在这种方法中，系统被表示为一组相互连接的流程，使用架构图，例如数据流图（`DFDs`）或组件图。然后威胁分析师评估这些图，以识别针对每个组件的潜在攻击，并确定是否需要安全控制、是否存在以及是否实现了控制效果。\n\
  \n### 威胁建模方法\n\n有许多不同的威胁建模方法。其中一些最重要的方法包括 `STRIDE`、`PASTA`、`NIST 800-154` 和 `DREAD`——我们将在以下各节中讨论每一种。\n\
  \n#### STRIDE\n\n`STRIDE` 是一种威胁建模方法，由微软在 1990 年代后期开发，用于帮助识别和分类计算机安全威胁。名称本身是六类安全威胁的助记符，在此讨论：\n\
  \n* `Spoofing`：`Spoofing` 是一种攻击，在此期间恶意方通过伪造信息冒充另一方（用户或系统）的身份。身份欺骗的常见示例是电子邮件垃圾邮件发送者修改“From:”字段，以显示目标收件人更可能信任的发送者名称。在应用程序中，如果攻击者窃取并使用受害者的身份验证信息（如用户名和密码）冒充其在应用程序中操作，则可能发生欺骗。\n\
  \n* `Tampering`：`Data tampering` 是通过故意和恶意操纵数据来攻击数据完整性的攻击。篡改可能包括更改磁盘、内存、网络上的数据或其它位置的数据。未正确验证用户输入的应用程序可能允许恶意行为者修改值，并使被操纵的数据被应用程序存储和使用。\n\
  \n* `Repudiation`：`Repudiation` 是某方否认其执行了某项操作的能力。否认威胁发生时，用户声称自己未执行某项操作，且没有其它方能够证明相反。在物理世界中，为邮件投递签名是不可否认性的常见形式——投递公司保留你在特定日期收到并接受邮件的记录。在数字世界中，否认威胁的示例是用户声称自己未进行在线购买——即使他们实际上确实进行了购买。综合日志记录、数字签名和多因素身份验证可以集成到应用程序中，为高风险操作提供不可否认性。\n\
  \n* `Information disclosure`：`Information disclosure` 是信息被分享给未经授权的方——例如在数据泄露期间或无意中将电子邮件发送给错误的人时。此威胁损害数据的保密性，具体风险取决于泄露数据的敏感性。存储和处理\
  \ `PII`、`PHI`、持卡人数据或其它机密信息的组织应关注此威胁，并识别控制措施以减轻风险。数据加密、强大的访问控制和其它数据保护机制是防止未经授权的信息泄露的关键。\n\
  \n\n\n\n\n### 服务拒绝\n*拒绝服务*（DoS）攻击是一种常见的可用性攻击，会拒绝合法用户访问资源。应建立控制措施以监控和检测任何单个用户异常高的资源消耗；这可能是恶意或非故意资源耗尽的迹象。作为原则，应用程序应在开发时考虑到可用性和可靠性。\n\
  \n### 权限提升\n*权限提升*（或*权限 escalation*）发生在未授权用户能够将其权限升级为特权用户（如系统管理员）的权限时。权限提升可能让不受信任的方获得“王国的钥匙”，并使其能够访问和控制敏感数据和系统。需要强有力的访问控制来帮助抵御此威胁。系统在授予特权访问之前应重新验证用户的身份和凭证，并且在可能的情况下应使用多因素身份验证。\n\
  \n#### PASTA\n*攻击模拟与威胁分析流程*（PASTA）是一种基于风险的威胁模型，于 2012 年开发，支持动态威胁分析。PASTA 方法将业务目标与技术要求相结合，使输出更容易被高层管理者理解。\n\
  \nPASTA 方法有七个阶段：\n* 定义目标\n* 定义技术范围\n* 应用分解\n* 威胁分析\n* 漏洞分析\n* 攻击枚举\n* 风险和影响分析\n\n\
  #### NIST 800-154\nNIST 800-154，《数据中心系统威胁建模指南》，于 2016 年以草案形式发布。它明确拒绝认为最佳实践方法足以保护敏感信息，因为最佳实践过于笼统，常常忽略专门针对保护敏感资产而量身定制的控制措施。NIST\
  \ 800-154 为数据中心系统威胁建模建立了四个主要步骤：\n1. 识别并描述系统和感兴趣的数据。\n2. 识别并选择要包含在模型中的攻击向量。\n3. 描述用于缓解攻击向量的安全控制。\n\
  4. 分析威胁模型。\n\n#### DREAD\nDREAD 是一种较旧的威胁建模技术，曾被微软使用但后来被放弃。DREAD 为使用五个类别对安全威胁进行定量风险评级提供了一个助记符：\n\
  * **D**amage\n* **R**eproducibility\n* **E**xploitability\n* **A**ffected users\n\
  * **D**iscoverability\n\n尽管今天使用稀少，你仍应熟悉 DREAD 助记符及其代表的类别。\n\n#### 其他模型\n其他威胁建模方法包括以下内容：\n\
  * 运营关键威胁、资产和漏洞评估（OCTAVE）是软件工程研究所（SEI）开发的一种管理信息安全风险的方法。\n* Trike 是一种开源的威胁建模方法和工具，专注于将威胁模型用作风险管理工具。\n\
  * 构建安全关键系统风险分析平台（CORAS），也是开源的，是一个欧洲项目， heavily 依赖统一建模语言（UML）作为可视化威胁的前端。\n* 可视化、敏捷和简单威胁建模（VAST）是一种专有方法，利用敏捷概念。\n\
  \n实施结构化的威胁建模计划使组织能够一致地识别和描述其面临的威胁，然后对与这些威胁相关的风险应用适当的控制。\n\n## 应用供应链风险管理概念\n当今信息系统的互联性质使得对来自全球多个供应商的系统的保密性、完整性和可用性高度依赖。这一生态系统已被证明容易受到意外和故意的中断和破坏。保护您组织资产需要您评估整个供应链的安全风险，并应用适当的控制来管理该风险。\n\
  \n### 与硬件、软件和服务相关的风险\n只要组织考虑使用第三方硬件、软件或服务，组织就必须确定新的硬件、软件或服务如何融入组织的现有环境，并评估这些新增项可能如何影响组织的整体安全态势。例如，如果您的组织考虑使用公共云提供商，如果\
  \ CSP 将数据存储在您国家之外，则可能存在合规风险，或者如果 CSP 未满足您在法律或合同上必须满足的数据安全要求，则可能存在其他安全风险。\n\n###\
  \ 第三方评估和监控\n为了最大限度地降低供应链风险，必须应用适当的控制措施来验证所有相关方的<|message|> 安全实践。在大多数情况下，已确定了可以解决安全风险的控制措施；最困难的挑战是确保第三方确实采取了应有的措施来保护您的组织免受这些风险的信息。\n\
  \n任何与承包商、供应商或任何其他第三方开展业务的组织都应制定第三方风险管理政策，建立负责评估、监控和控制与外包给第三方相关的风险的第三方风险管理计划。治理和监督活动应包括现场安全调查、第三方系统的正式安全审计以及在可行的情况下进行渗透测试。任何新第三方都应根据您组织的安全要求进行评估，差距应记录并密切监控。此外，供应商和其他第三方应定期重新评估并持续监控，以确保他们继续充分保护您组织的信息。我们在\
  \ Chapter 6 中详细介绍了审计、审计标准和其他相关概念。\n\n### 最低安全要求\n类似于基线和标准（本章前面讨论过），您的组织应建立最低安全要求（MSRs），定义供应商和供应链中其他方必须满足的最低可接受安全标准。当然，您应努力确保第三方具有尽可能强大的安全态势，但\
  \ MSRs 如其名称所示，描述了您的组织愿意从第三方接受的最低安全水平。为了避免问题，您的 MSRs 应考虑您必须满足的任何法律、合同或监管要求；您不应建立低于任何外部安全合规要求的\
  \ MSR。您还必须准备好审计和评估第三方对其已建立并传达的任何 MSRs 的合规性。\n\n### 服务级别要求\n*服务级别协议*（*SLA*）是服务提供商与其客户之间的合同协议，规定提供商有义务满足的最低绩效标准。在与供应商和其他第三方打交道时，SLA\
  \ 可作为经记录和同意的绩效要求，客户可据此追究第三方的责任。例如，您可能与公共云提供商签订 SLA，承诺一定的系统正常运行时间和可用性水平。在云服务持续中断的情况下，您可能有权获得经济补偿或有权在无惩罚的情况下终止服务。\n\
  \n### 框架\n多个框架明确解决了供应链风险。这是风险管理的一个不断发展的领域，但管理信息系统供应链的复杂性已显而易见多年。\n\n#### NIST IR\
  \ 7622\n\n\n\n\n\n# 供应链风险管理\n\n美国政府开始将网络供应链风险作为一个单独问题直接加以处理，是在发布 NIST IR 7622《联邦信息系统的概念性供应链风险管理实践》之后。这项工作认识到，供应链中各实体所需采取的行动将根据其角色而变化，所应用的控制的级别和类型也会随之变化。该文件确定了在应对供应链风险时应考虑的\
  \ 10 项实践：\n\n* 唯一识别供应链要素、流程和行为者。\n* 限制供应链内部的访问和暴露。\n* 建立并维护要素、流程、工具和数据的来源。\n* 在严格限制范围内共享信息。\n\
  * 执行供应链风险管理意识和培训。\n* 对系统、要素和流程采用防御性设计。\n* 执行持续的集成商审查。\n* 加强交付机制。\n* 确保可持续性活动和流程。\n\
  * 在系统或要素生命周期内管理处置和最终处置活动。\n\n美国政府还有许多其他供应链风险管理举措，包括国家安全系统委员会指令 505《供应链风险管理》，该指令专门针对战略国家系统的安全要求，以及综合国家网络安全倡议第\
  \ 11 号，该倡议为机构提供了一套工具，通过风险驱动的方法管理其网络安全供应链。\n\n## ISO 28000\n\nISO 28000:2007《供应链安全管理系统规范》为管理供应链风险提供了广泛的框架。虽然并非专门针对网络安全，但\
  \ ISO 28000 对利用其他 ISO 规范（如 ISO 9001 和 ISO 27001）的组织非常有用，以便将供应链风险与组织的审计流程保持一致，或寻求采用标准化、基于风险的方法来评估供应链风险。\n\
  \nISO 28000:2007 很大程度上依赖于计划-执行-检查-行动（PDCA）持续过程改进模型，以改进安全管理体系并确保组织符合安全实践。这种方法促进了供应链风险与更广泛的组织风险管理活动的整合。\n\
  \n## 英国国家网络安全中心\n\n英国国家网络安全中心（NCSC）提出了指导建议，旨在提高组织对供应链风险的认识，同时确立 12 项原则，帮助组织建立和维护对其供应链的有效控制。这\
  \ 12 项供应链原则分为以下几个独立阶段：\n\n1. **了解风险：** 本阶段的原则涉及识别供应链中的供应商，并确定供应链中需要保护的内容（以及原因）。\n\
  2. **建立控制：** 本阶段涉及建立最低安全要求（参见前文“最低安全要求”部分）并向供应商传达您的安全期望。\n3. **检查安排：** 本阶段涉及建立保证活动并将其纳入供应链流程中。这包括建立审计权、关键绩效指标和其他测试/验证活动。\n\
  4. **持续改进：** 本阶段涉及不断与供应商建立信任，并不断鼓励供应链的安全改进。\n\n## 建立并维护安全意识、教育和培训计划\n\n无论你的武器库中有多少安全工具，你组织的安全性都只取决于其最薄弱的环节——而这往往是你的员工。信息安全是少数几个由相对较小的团队管理但却是组织内每个人的责任的领域之一。因此，组织内的所有人员都需要接受培训并提高对安全威胁和攻击者技术的认识，以便他们知道要寻找什么以及如何避免可能损害组织信息安全的常见陷阱。\n\
  \n### 呈现意识和培训的方法和技术\n\n*安全意识计划* 是一项正式计划，其中包括培训用户了解组织信息和系统面临的潜在威胁的流程，以及教育用户如何处理此类威胁。标准的安全意识计划至少应包括新用户入职培训、讲座或计算机化培训（CBT），以及张贴海报和发放传单等印刷材料，分享安全提示。此外，组织还可以使用钓鱼和其他社会工程练习、安全倡导者以及游戏化来提高人们对重要安全主题的认识；以下各节将讨论这些内容。\n\
  \n#### 社会工程\n\n*社会工程* 是指通过人类操纵进行的实践，攻击者假装成他人以获取敏感数据。*网络钓鱼* 是最常见的社会工程形式，它涉及通过电子邮件进行的社会工程活动。网络钓鱼一直位居最常见的网络安全问题之首，因为它可以规避您最复杂的许多安全工具，并危及组织的薄弱环节——即员工。\n\
  \n模拟钓鱼活动是安全意识计划的热门组成部分。您首先应先教育员工了解网络钓鱼的危害以及如何识别网络钓鱼。您应进行随机模拟钓鱼演练，以帮助强化员工培训并帮助您了解风险所在（即哪种类型的网络钓鱼对员工最有效，以及哪些员工需要进一步培训）。点击模拟钓鱼链接的员工应被通知并接受进一步培训，提醒他们如何识别和报告网络钓鱼迹象。\n\
  \n#### 安全倡导者\n\n*安全倡导者* 是组织安全团队与公司其他部门之间的联络人；他们负责提高组织内部的安全意识。在此角色中，安全倡导者是为那些不以安全为主要工作的人员倡导安全最佳实践的倡导者。安全倡导者的角色最初是为了提高软件开发团队的应用安全意识而创建的，但如今，组织经常选择为任何（或所有）非安全团队指定安全倡导者。\n\
  \n#### 游戏化\n\n*游戏化* 是指在非游戏应用中使用游戏技术来吸引和教育受众。在安全意识方面，游戏化可以提供一种有趣且引人入胜的方式来教育员工并推广强大的安全实践。这样的游戏可以让公司以有趣且引人入胜的方式向员工传授关键的信息安全概念。\n\
  \n### 定期内容审查\n\n\n\n\n\n信息安全是一个不断发展的领域，安全威胁和漏洞也在不断变化。因此，定期审查您安全意识、教育和培训计划中的内容非常重要，以确保其仍然相关。内容应至少每年审查和更新一次，以确保没有提及过时或不相关的技术或术语，并且这些审查应验证所有安全意识和培训材料是否反映了与您的组织和行业相关的当前安全趋势、概念和问题。理想情况下，安全意识内容应被视为“实时”材料，其演变频率甚至高于这些定期审查。作为一名\
  \ CISSP，您应确保此类安全培训内容包含贵组织员工应了解的所有相关和当前信息。\n\n### 程序有效性评估\n\n开展安全意识、教育和培训活动是不够的；评估和衡量您安全教育活动的有效性同样重要。虽然您组织整体信息安全态势的评估可以反映出您安全意识计划的有效性，但仍应进行正式评估，以针对意识计划本身的缺陷。\n\
  \n您可以通过多种方法评估安全意识计划的有效性。一些示例包括以下内容：\n\n*   `Training metrics`：像培训完成率这样简单的指标是评估安全意识计划有效性的一个很好的起点。这类指标可以告诉您培训资源是否覆盖了足够比例的员工，并可能提醒您是否需要替代的交付方式。\n\
  \n*   `Quizzes`：这是通过知识保留来衡量计划有效性的最有效方法之一。测验在衡量安全政策及相关信息的有效性时最为可靠。对测验结果的分析应进行以识别揭示培训材料需要修改的趋势；如果大量员工对同一个问题答错，很可能意味着您需要提供关于该主题的进一步（或更清晰）的信息。\n\
  \n*   `Security awareness days or weeks`：通过赞助安全意识日或周，您不仅有机会提供安全教育，还可以利用此机会征求员工对计划本身的反馈。您可以为与会者提供匿名问卷，让他们表达对当前计划的意见并提出内容交付的新想法。\n\
  \n*   `Inherent evaluation`：如前所述，您还可以通过评估组织整体安全态势来衡量意识计划的有效性。某些指标，例如报告给 IT 的钓鱼邮件和其他安全问题的数量，可以为您的计划有效性提供大量见解。随着贵公司员工对安全风险的了解不断提高，您应开始看到自报告的安全问题数量上升。看到疑似问题的报告数量上升比看到成功入侵数量上升要好。\n\
  \n## SUMMARY\n\n信息安全的广度要求安全专业人员具备广泛的知识和技能。您必须充分掌握机密性、完整性和可用性等概念，并了解如何制定、记录和实施强制执行这些概念的安全政策、标准、程序和指南。良好的安全实践必须与组织的业务目标、战略和目标保持一致。作为安全专业人员，了解这些业务概念并掌握如何将安全治理原则应用于帮助组织实现其使命非常重要。\n\
  \n风险管理是信息安全的核心，每个安全计划都应努力基于风险管理概念。识别威胁和漏洞并评估安全风险是确定在环境中实施哪些正确安全控制的关键。应持续监控控制措施以评估其降低风险的有效性，并且组织应维护一个定期衡量和报告公司风险态势的计划。有多个行业标准风险框架可指导您开发和管理基于风险的安全计划。\n\
  \n法律、监管和合规要求在安全中发挥着重要作用。CISSP CBK 的一个重要组成部分是理解基于管辖权、行业或其他因素影响您组织的此类法律和其他要求。\n\n\
  工具和技术往往获得大部分关注，但必须记住，在维护信息安全方面，人是薄弱环节。候选人筛选、背景调查和其他人员安全政策在确保组织数据掌握在正确的人手中方面发挥着关键作用。此外，建立和维护健全的安全意识计划是教育员工并衡量他们对组织资产构成的风险的重要方式。\n"
- "# DOMAIN 2\n\n## Asset Security\n\n`TO APPLY AND ENFORCE` 有效的资产安全，您必须集中精力盘点所有价值来源，即\
  \ `assets`。资产可以是有形或无形的，以信息存储、数据库、硬件、软件或整个网络的形式存在。\n\n在本领域中，我们涵盖了在信息生命周期内识别、分类、保护和监控这些资产的战略的重要要素。虽然资产也可以是建筑物和房地产，但这些不在本领域的范围内——物理安全已在\
  \ Chapter 7，“Security Operations” 中得到充分阐述。本章将重点介绍确保组织信息和技术资产的机密性、完整性和可用性的最佳政策、实践和方法。\n\
  \n## IDENTIFY AND CLASSIFY INFORMATION AND ASSETS\n\n识别和分类信息资产是确保系统和数据安全的关键第一步。如果不认真考虑这些任务，您将不知道资产在哪里，更不用说如何保护它们了！如果没有信息分类，您将无法确定哪些资产比其他资产更有价值，哪些资产需要额外的安全控制。其结果将是一个低效、昂贵的信息安全计划，试图保护所有资产，并假设敏感资产位于组织的所有部分（本地存储、共享存储、云中等）。更糟糕的是，一些仅需最低限度保护的资产，如公开信息，将与机密信息一样受到保护。成熟的安全计划始于资产识别和分类，这使您能够定位和分类资产并区分各自的安全方法。\n\
  \n创建组织拥有哪些资产、资产位于何处以及谁对资产负责的清单，是建立信息安全资产管理计划的基础步骤。由于廉价的本地存储、云技术和“随时随地工作”运动导致数据在组织内大量扩散，定位数据变得更加困难。绘制数据驻留位置是一项艰巨的任务，但却是必要的。\n\
  \n\n\n\n\n法律法规通常是组织资产识别和分类政策的驱动来源。以下是一些常见的法规和指南，它们规范了信息资产的分类和分类：\n\n*   **加拿大：**《信息安全法》\n\
  *   **中国：**《保守国家秘密》\n*   **欧洲联盟（EU）：**《通用数据保护条例》（GDPR）\n*   **英国：**《官方保密法》（OSA）\n\
  *   **美国：** NIST 联邦信息处理标准 199，“联邦信息和信息系统安全分类标准”\n*   **美国：** NIST 特刊（SP）800-60，“将信息类型和信息系统映射到安全类别的指南”（该文件被视为\
  \ FIPS 199 的“操作手册”）\n*   **美国：** 国家安全系统委员会（CNSS）第 1253 号指令，“国家安全系统的安全分类和控制选择”\n\n\
  上述法规和指南的内容各不相同，但每个都侧重于数据保护的一个或多个方面。例如，英国《官方保密法》关注国家机密和官方信息的保护，并为此类信息的分类等级提供依据。欧盟《通用数据保护条例》加强并统一了数据保护，并为数据流政策提供依据。在美国，NIST\
  \ FIPS 199 可用于在整体风险管理流程中进行资产分类。根据贵组织开展业务的地区，一个或多个这些法规或指南可作为制定资产分类要求的基础步骤之一。\n\n\
  ### 数据分类和数据分类\n\n数据分类和数据分类是密切相关的流程，使组织能够对数据进行排序和组织，以便更有效地进行分析和安全控制实施。以下各节介绍这些概念，并为在贵组织中对数据资产进行分类和分类奠定基础。\n\
  \n#### 数据分类\n\n*数据分类*是将数据组织成描述数据敏感性、关键性或价值的组或类别的过程。数据分类有助于确定管理数据并保护其机密性、完整性和可用性所需的安全控制措施，是数据安全和风险管理的基石。此外，数据分类通常是遵守法律和监管要求的必要条件。\n\
  \n数据分类主要有三种类型：\n\n*   **基于上下文：**源自所有权、位置或其他可间接指示敏感性或关键性的元数据。\n*   **基于内容：**通过检查文件内容并直接识别敏感数据得出，而非从元数据中推断。合规机构，例如《1996\
  \ 年健康保险流通与责任法案》（HIPAA）、支付卡行业（PCI）或合同相关条款（例如保密协议）涉及基于内容的分类，因为信息本身的类型决定了分类。\n*   **基于用户：**涉及手动分配数据分类，并基于用户对数据及其组织分类方案的理解。\n\
  \n尽管对数据进行分类始终是最佳实践，但这一概念在军事或政府组织或受严格监管的组织（如银行）中更为正式。每个组织的实际标签都会有所不同。\n\n制定数据分类政策和程序可使贵组织开始为信息提供最有效和最有效的保护而设计安全控制。如果不找到并正确分类数据，您将面临关键数据保护不足或非关键数据过度保护的风险。一旦您彻底对数据进行了分类，您就更能胜任对存储和处理该数据的资产进行分类。\n\
  \n#### 数据分类\n\n数据分类常与数据分类混淆，数据分类是一种密切相关但不同的技术。*数据分类*是将具有可比“敏感性标签”（分类）的类型数据分组的过程。根据\
  \ NIST SP 800-60，“信息根据其信息类型进行分类。信息类型是由组织定义的特定类别的信息（例如隐私、医疗、专有、财务、调查、承包商敏感、安全管理），在某些情况下由特定法律、行政命令、指令、政策或法规定义。”通过将数据分类到具有相似敏感性分类的桶中，贵组织更能胜任对具有相似敏感性的资产应用类似的安全控制。\n\
  \n### 资产分类\n\n数据分类侧重于识别数据的敏感性、关键性和价值，而*资产分类*则更广泛地涉及识别存储、处理和传输数据的<|message|> 信息系统和资产的敏感性、关键性和价值，以及数据本身。资产包括有价值的数据、处理数据的硬件以及存储数据的介质——它们可能采用电子或物理形式，包括服务器、硬盘、数据库、云存储或纸质记录。资产分类涉及根据资产的相对敏感性水平以及资产被破坏时对组织的影响程度对资产进行分组。在考虑资产分类时，重要的是要考虑该资产上存储或处理的信息的分类，因为数据通常是最重要的资产（例如知识产权）。\n\
  \n资产分类始于进行资产盘点并确定资产的负责人或所有者。资产包含数据或提供信息处理能力，资产清单使管理层能够了解组织中存在哪些敏感资产以及谁负责这些资产。借助此清单，安全团队和资产所有者能够根据各自的敏感性水平对资产进行分类和分组，这随后决定了组织将用于保护信息的最低安全控制集。正式的数据政策是组织建立分类级别的主要机制，然后管理层可以制定控制措施，以提供针对资产特定风险和威胁的充分保护。\n\
  \n#### 分类的好处\n\n由于它为环境提供了宝贵的见解，分类是更安全、更完善的资产和数据管理的关键第一步。对于一个相对简单的流程，其收益是显著的。Figure\
  \ 2.1 描绘了分类的主要好处。该列表并不全面，不同组织会发现收益程度各不相同。\n\n#### 资产分类级别\n\n\n\n\n\n资产应根据其敏感性级别进行识别和控制。这使得可以按照组织对资产的价值评估将类似资产进行分组。评估标准可以包括资产处理的数据类型、资产执行的流程，或两者兼有。资产分类类别没有强制性的公式或命名法。每个组织都必须自行确定名称和敏感性级别。表\
  \ 2.1 显示了资产分类类型的示例。这是一个概念性的资产分类框架，用于说明组织的资产组合如何划分为关键性等级，并映射到高、中、低。*层级* 和 *重要系统*\
  \ 在此用作示例，并非由监管机构规定。\n\n![FIGURE 2.1 General benefits of asset classification](img/c02f001.png)\n\
  \n**FIGURE 2.1 General benefits of asset classification**\n\n**TABLE 2.1 Examples\
  \ of Asset Classifications**\n\n| CATEGORIES || ASPECTS || EXAMPLES |\n| --- | ---\
  \ | --- |\n| Tier 0 || 对多个业务单元至关重要。  \n可能处理或包含极其敏感的数据。  \n被破坏可能会对业务的正常运作产生关键性影响。\
  \  \n需要 100% 时间可用。 || 域控制器。  \n数据库。  \n邮件服务器。  \n文件共享。  \n客户端 Web 服务器。  \n网关网络设备（防火墙、路由器和网络关键基础设施）。\
  \  \n任何一旦损坏或关闭就会让业务停摆一天的东西。 |\n| --- | --- | --- |\n| Tier 1 || 对组织而言重要但不一定关键。 \
  \ \n对特定部门至关重要，但对整个业务并非如此。  \n任何这些资产被破坏都将对业务的正常运作产生中等影响。 || 包含关键数据的开发环境。  \n包含关键数据的冗余备份系统。\
  \  \n部门文件共享。  \n本地网络设备（交换机、路由器、防火墙和细分设备）。 |\n| Tier 2 || 对日常运营既非必需也非关键。  \n这些系统和数据通常仅由少数人或个人使用。\
  \  \n任何这些资产被破坏可能只会给少数人带来不便，但不会对业务流程造成重大干扰。 || 工作站。  \n笔记本电脑。  \n手机和平板电脑。  \n打印机。\
  \  \n座机。 |\n| Significant Systems || 任何处理或存储受合规标准约束的数据的资产。  \n重要系统可能属于多个类别，也可能单独进行分类，因为即使系统丢失不会中断运营，但仍可能对业务造成损害。\
  \ || 持卡人数据（CD）——任何存储、处理或传输 CD 的系统必须符合 PCI DSS。  \n受保护的健康信息（PHI）——医疗数据必须根据 HIPAA\
  \ 概述的标准进行保护。  \n财务数据——此数据可能受金融业监管局（FINRA）概述的某些隐私要求约束。  \n美国联邦政府数据（FISMA/FIPS）——适用于美国军方和政府。\
  \ |\n\n## ESTABLISH INFORMATION AND ASSET HANDLING REQUIREMENTS\n\n有各种技术、运营和管理控制措施，可帮助安全专业人员执行对敏感信息和有价值资产的处理要求。组织应建立并维护政策和程序，以规范敏感信息和其他重要资产的标记、标注、处理、解密和存储。\n\
  \n### Marking and Labeling\n\n标记资产是指将相关信息直接以清晰可见的方式放置在资产上，以便人员能够轻松识别资产所包含信息的适用安全级别和分类，以及任何分发限制和处理注意事项。对于物理资产（如纸质文件或硬盘）来说，这相对简单，但对于信息资产（即数据）而言，逻辑结构或元数据必须包含可写入标签的位置，例如文档页眉。对此过程的另一种说法是标注，因为用于标记资产的信息在分组在一起并在数字或物理标签上易于访问时效果最佳，具体取决于资产类型。电子资产可以包含文档页眉或页脚中的标记和标签，而有形资产可以包含粘贴在资产上的物理标签。当用户了解资产（包括数据）的价值时，他们就能更好地根据其分类妥善保护资产。\n\
  \n有了清晰可见的标签，更容易识别单个资产的重要性，并根据其分类级别管理资产，以确保保密性、完整性和可用性。\n\n### Handling\n\n您的组织应制定政策和程序来规范每类和每个分类资产的处理。这些政策和程序为访问、传输、运输和使用敏感数据和其他关键资产提供了规则。\n\
  \n员工对正确信息处理责任的意识和培训是任何资产安全计划的关键组成部分。培训应让员工了解因对资产处理要求掉以轻心而带来的风险。随着时间的推移，即使是处理最受限制信息的员工也可能变得麻痹大意，从而导致数据丢失。当员工对数据处理政策和程序漠不关心时，内部威胁就会发生，例如员工将专有信息发送给错误的人，或在公共咖啡馆访问敏感数据。\n\
  \n### Storage\n\n与信息处理指南类似，信息存储指南对组织整体资产安全管理至关重要。当敏感信息全部为纸质时，信息存储安全只需将资产锁好并置于足够的物理屏障之后即可。随着数字信息存储在数据中心、移动硬盘、手机和云中，资产存储变得有些复杂。在数字时代，存储数据被盗、因管理不善而意外泄露，或因身份凭证被盗而被未经授权的人员访问的方式太多。\n\
  \n数字信息安全资产存储的首要考虑因素是加密。只要可行，静态敏感数据应进行加密。还必须对加密密钥本身的存储和保护给予额外考虑。这通常需要使用多重人员完整性控制，例如许多硬件安全模块（HSM）系统内置的控制措施（我们在第\
  \ 3 章，“Security Architecture and Engineering”中讨论）。\n\n安全存储的另一个考虑因素是限制保留的数据量。确保只存储所需的数据可降低组织风险并减少运营成本。就风险而言，数据存储限制也有助于改善灾难恢复和业务连续性，因为如果多余数据不会妨碍整体恢复过程，则在短时间内访问数据会更可行。\n\
  \n与数据存储相关的最后一点考虑是备份。您的组织必须制定明确的政策和程序，规定应备份哪些数据以及如何备份。此外，您还应制定并提供有关备份介质如何安全和受保护的指导。\n\
  \n### Declassification\n\n\n\n\n\n## 分级解除\n\n*分级解除*是指将资产的 assigned classification\
  \ 修改为更低敏感级别的过程。随着数据在数据生命周期中流动，可能会出现数据不再具有与最初分类时相同的价值或敏感性的情况；你的组织必须有流程对数据进行分级解除，以应对这种演变。例如，当数据敏感性从机密变为公开时，标记、处理和存储要求必须相应调整。如果分级解除未正确进行，过度和昂贵的控制措施仍会保留，导致财务和工作效率的双重影响。\n\
  \n资产的分级解除是一个需要充分记录并通常需要多级审批的过程。数据所有者在该过程中发挥核心作用，因为他们决定数据的分类级别以及何时可以更改。组织内部应有数据治理流程来确定是否将对数据分类进行人工审查调整。组织也可以选择使用规则和应用程序自动执行该流程，以查找并重新分类数据资产。规则可能基于数据所有者确定的特定事件的发生，或最大时间框架的到期。\n\
  \n分级解除资产的方法包括修改数据以移除或混淆数据的标识或敏感元素。以下几节描述了其中几种方法：去标识化（包括匿名化和掩码）以及令牌化。\n\n### 去标识化\n\
  \n*数据去标识化*是指移除可用于识别个人的信息（即个人身份信息（PII））的过程。去标识化用于保护敏感数据的保密性，特别是在数据用于测试或开发环境或其他可能没有所需安全机制的使用场景时。该过程涉及将任何个人识别数据字段转换为经过掩码、混淆、加密或令牌化的数据字段。例如，在*匿名化*下，“姓名”数据字段可能会从个人的真实姓名更改为随机唯一数字（参见\
  \ Figure 2.2），而在*掩码*协议下，你的信用卡号码除最后四位以外的所有数字都可能被一系列“X”字符替换（参见 Figure 2.3）。\n\n![FIGURE\
  \ 2.2 Data de-identification via anonymization](img/c02f002.png`)\n\n**FIGURE 2.2\
  \ Data de-identification via anonymization**\n\n![FIGURE 2.3 Data de-identification\
  \ via masking](img/c02f003.png`)\n\n**FIGURE 2.3 Data de-identification via masking**\n\
  \n文件中的某些数据字段可能仍保持其原始形式，但去标识化过程使剩余的原始信息对未经授权的个人变得不那么有用。年龄或种族等字段即使姓名和其他个人身份信息已被去标识化，仍可能对分析有用。如果使用加密，则需要重新识别密钥来解密数据库。无论使用何种过程对数据进行去标识化，都必须遵循准则，以防止通过组合数据字段或猜测用于匿名化的算法而轻易重新识别数据。\n\
  \n### 令牌化\n\n令牌化是一种特定的去标识化形式，自有密码以来就已存在。然而，随着安全威胁的变化以及对加密等技术控制的局限性的认识，其受欢迎程度日益提高。*令牌化*是指用一组不敏感的字符或数字，即*令牌*，替换敏感数据元素的过程。通常，令牌与被替换的数据具有相同的字段长度，但与原始数据相比\
  \ otherwise 没有意义。换句话说，与加密不同，令牌无法逆向工程回原始数据的值。查找表用作重新识别密钥。原始数据和重新识别密钥应安全存储，与生产系统和原始数据分开。\n\
  \n## 安全地配置资源\n\n随着资源的不断增减，组织的整体安全态势也在不断演变。因此，信息技术（IT）资源的配置（和取消配置）会对组织的整体安全产生重大影响。安全地配置信息资源涉及许多要素。本书各处讨论了这些主题，例如\
  \ Chapter 1 中的供应链管理。本节讨论资产所有权、资产清单和整体资产管理概念。\n\n### 信息和资产所有权\n\n信息和资产所有权是适当信息安全的核心。在组织内部，根据使命以及数据和资产的敏感级别，可能存在数据政策和信息资产安全管理政策。受法律、合同或其他合规结构保护的数据必须由组织的\
  \ data governance practice 处理。然而，每个政策的共同部分将是分配责任和资产所有权的指导方针。数据所有者和数据处理者（本章后面讨论）应有明确定义的角色和职责。数据治理，包括访问、可接受使用和数据保留，必须由组织中的合适人员执行或监督。\n\
  \n在组织内部，首席执行官或授权代表具有正式的所有权责任，如组织的正式治理文件所定义和指导，并在法律和法规的合规限制范围内。此责任包括代表组织保护和保障信息资产安全的权限。\n\
  \n资产所有者的额外责任可能包括以下内容：\n\n* 保持信息资产清单为最新\n* 识别信息资产的分类级别\n* 定义并实施适当的保障措施，以确保信息资产的保密性、完整性和可用性\n\
  * 评估和监控保障措施以确保合规并报告不合规情况\n* 授权具有业务需求的人员访问信息\n* 确保不再具有业务需求的人员的访问权限被移除\n* 不断评估环境和法律/合规环境，以确定是否需要对上述内容进行更改\n\
  \n### 资产清单\n\n任何组织都需要作为其安全和合规计划的基础，有效的工具和流程来跟踪其资产清单。资产清单包括所有物理和虚拟资产，包括硬件、软件和数据。\n\
  \n拥有当前且完整的清单是实施和监控技术安全控制的绝对基石。如果没有全面准确的资产清单，就无法确定是否已妥善保护所有关键资产。\n\n强大的资产清单工具和流程还将告知组织未经授权的（或“\
  \ rogue ”）资产。当然，除了知道要保护什么之外，我们还想知道什么不属于这里，以便任何不需要的资产能够尽快被移除或隔离。\n\n#### 清单工具/系统记录\n\
  \n\n\n\n\n由于任务的规模、复杂性和频率，组织应使用自动化工具来协助创建和维护资产清单。这些系统枚举工具和其他端点管理工具应能够感知组织企业中的所有资产，并能够发现引入环境中但未在清单中正确记录的新资产。此数据来自安装在每个资产上的资产管理代理或客户端，或“内置”到每个系统映像中，通过与各种扫描仪和传感器工具的集成，或在托管或云资产的情况下，来自供应商的数据馈送或定期报告（是否与客户共享取决于合同）。本段所述的系统枚举工具为组织提供了对其环境中资产的极佳可见性，并可帮助支持第\
  \ 7 章所述的配置管理活动。\n\n资产清单工具应有一种方法来区分授权资产和未经授权的设备和应用程序，并在发现后者时发出警报。该工具还应收集和跟踪报告、审计、风险管理以及事件管理所需的单个资产详细信息。这些详细信息需要涵盖技术规格，例如以下内容：\n\
  \n* 硬件\n  * 制造商\n  * 型号\n  * 序列号\n  * 物理位置\n  * 处理器数量和类型\n  * 内存大小\n  * 网络接口及其 MAC\
  \ 和 IP\n  * 主机名\n  * 超级管理器、操作系统、容器、在此设备上运行的虚拟映像\n  * 购买日期、保修信息\n  * 最后更新日期（固件、超管理器等）\n\
  \  * 资产使用指标\n* 软件\n  * 发布者\n  * 版本号、服务包/热修复编号\n  * 许可信息\n  * 购买日期\n  * 安装日期\n\n\
  此外，还应收集操作安全详细信息，例如资产上存储和处理的数据类型、资产分类和特殊处理要求、其支持的业务流程或任务，以及所有者和管理员及其联系信息。\n\n当然，有许多工具可执行这些任务或其中的部分任务。大多数组织已经拥有许多此类工具。请考虑以下内容：\n\
  \n* Active Directory（AD）和轻量级目录访问协议（LDAP）服务器可以提供其中很大一部分信息。\n* 漏洞扫描仪、配置扫描仪和网络映射工具可以查找并提供组织\
  \ IP 范围内所有主机的基本信息。\n* 管理/跟踪软件许可证的工具可以执行此任务的大部分。\n* DLP 解决方案通常具有可用于此目的的发现功能。\n\n\
  除了前面的列表外，组织可能需要利用专门的系统枚举和资产管理工具来发现、跟踪和管理其资产清单。对于其可用工具中的差距，组织可以通过手动工作、电子表格和脚本来弥补，以提取和汇总资产数据。专用资产清单工具通常提供此功能，并避免了手动数据提取和工具集成的需求。\n\
  \n无论使用何种工具或工具组合，都应有一个组织认为权威且最终的工具，以便在整个组织中引用——这是 `system of record`。该工具中的信息需要是确定的。这是当其他工具报告的信息存在冲突时应信任的数据来源。`system\
  \ of record` 还应是用于官方报告和其他数据请求（例如审计的一部分）的来源。随着自动映射环境的下一代安全系统的出现，组织更能够动态跟踪可能每天看到多次软件发布以及端点进出的敏捷环境。持续集成和持续交付（CI/CD）和其他软件开发概念在第\
  \ 8 章，“软件开发安全”中有所介绍。\n\n### 流程考虑\n\n现在我们讨论了所需的工具，我们将讨论清单管理最佳实践。首先，组织必须定义权威的清单或系统记录以及清单应如何刷新或更新的过程；这包括定义更新清单的适当频率，尽管许多敏捷组织将按需进行此操作。除了定期间隔的清单更新外，手动通知清单工具管理员在安装或移除资产或组件以重大方式更新/更改时也是一个良好的做法，只是为了验证这些更改是否已被清单工具捕获。\n\
  \n对于大量使用虚拟化组件的环境，包括托管云服务实现，资产管理可以通过不同方式完成。在这些情况下，使用自动化工具来查找、汇总和配置资产通常是可取的；流行品牌包括\
  \ `Puppet`、`Chef` 和 `Ansible`。\n\n对于本地资产，使用地理位置信息/地理标签或使用射频识别（RFID）清单标签来增强清单流程通常很有帮助。这可以提高定位资产的速度和准确性，尤其是在事件发生时，时间至关重要。\n\
  \n### 资产管理\n\nFigure 2.4 描绘了一个典型的资产生命周期，有助于理解与资产管理相关的阶段连续体。组织应在其整个生命周期内跟踪、管理和报告信息资产。这样最终可以通过提高资产可见性、识别易受攻击的资产、实现对安全警报的更快响应、揭示哪些应用程序实际上正在使用等来提高网络弹性。正确实施时，资产管理流程有助于降低成本、改善服务并降低风险。\n\
  \n![FIGURE 2.4 Typical asset management lifecycle](img/c02f004.png)\n\n**FIGURE\
  \ 2.4 Typical asset management lifecycle**\n\n实施正式资产管理计划的关键活动包括所有权分配（本节前面已讨论）、IT\
  \ 资产管理（ITAM）、配置管理和变更管理。\n\n#### 信息技术资产管理\n\n`Information technology asset management`（也称为\
  \ `IT asset management`，或简称 `ITAM`）是一组与管理 IT 资产相关的业务实践，包括硬件、软件、数据和相关流程。`ITAM` 有助于组织确保其资产得到核算、维护、升级，并在适当时退役。简单来说，`ITAM`\
  \ 就是确保您的有价值的 IT 资产，无论有形还是无形，都得到跟踪并有效使用。\n\n国际标准化组织（ISO）已建立了一套与 ITAM 相关的正式标准。`ISO\
  \ 19770` 是一个标准系列，最后更新于 2017 年，旨在帮助组织管理与 IT 资产相关的风险和成本。\n\n`ISO 19770` 由五个主要部分组成，讨论如下：\n\
  \n* **ISO/IEC 19770-1：** 建立了一个流程框架，概述了最佳实践，并允许组织证明其符合 ITAM 标准。\n\n\n\n\n\n**ISO/IEC\
  \ 19770-2：** 建立了 ITAM 数据标准，用于 *软件识别*（或 SWID）*标签*，该标签为已安装软件或其他可许可项目提供权威的识别信息。SWID\
  \ 标签使您的组织能够唯一识别部署在硬件资产上的软件。\n\n**ISO/IEC 19770-3：** 提供了 ITAM 数据标准，建立了在描述软件授权权利、限制和指标时使用的通用术语。\n\
  \n**ISO/IEC 19770-4：** 建立了支持资源利用标准化报告的数据标准。当管理基于云的系统或其他复杂资产和许可证时，该标准尤为重要。\n\n**ISO/IEC\
  \ 19770-5：** 提供了 ITAM 的概述并定义了相关词汇。\n\n### 配置管理\n\n配置管理在 第 7 章 中有详细讨论，但由于其与资产管理及资产安全相关，这里有必要进行介绍。与保持库存为最新相关，系统和软件配置必须得到严格控制并彻底记录——这就是\
  \ *配置管理* 的作用。未经指导进行的配置可能会导致其他安全领域出现问题，例如漏洞管理，因为硬件和软件升级和修补的要求可能未知且被遗漏。\n\n您应熟悉的基线有两种类型。*系统基线*\
  \ 标识产品、系统或子系统中所有配置项（CIs）的版本和设置；系统基线回答了“要正确构建系统，我需要什么？”这个问题。安全 *基线* 是保护给定系统所需的一组最低安全保障措施（例如安全控制）。组织通常为企业内每个系统类别建立基线（例如，他们可能会建立\
  \ Windows 基线、RedHat Linux 基线和 macOS 基线），以描述每个系统必须具备的最低可接受配置。许多组织使用指南或检查清单来实现并维护其资产的安全基线配置。一个公开可用的领先来源是国家检查清单计划（NCP），由\
  \ NIST SP 800-70 定义。这是美国政府用于最新和详细的安全配置指导的存储库。其他国家也存在类似的指导，适用于广泛和具体的应用。欧盟中一个流行的例子是“物联网基线安全建议”指导，该指导为关键信息基础设施建立了一套推荐配置。\n\
  \n一些组织通过 NCP 中可用的元数据并使用 *安全内容自动化协议*（SCAP）自动执行大部分基线安全配置。SCAP 使经过验证的安全产品能够使用 NCP 检查清单自动执行配置检查。CISSP\
  \ CBK 的 第 7 域 更深入地探讨了配置管理，我们将在 第 7 章 中探讨配置、基线化和自动化的概念。\n\n### 变更管理\n\n*变更管理* 是一项\
  \ IT 学科，专注于确保组织采用标准化流程来对其资产进行变更。组织必须制定政策和程序，以防止对其硬件和软件库存进行任意和意外的修改。变更管理包括允许您的组织以受控方式推出和优先处理变更的所有活动，而不会对生产环境或客户期望产生不利影响。这包括变更控制（即允许您验证已授权的变更是否正确实施的一套流程和工具）、执行（即防止未经授权的变更）、变更验证和审计。\n\
  \n如果变更管理处理不当，可能会出现各种问题。例如，您的库存记录与环境中的实际情况之间可能会逐渐出现显著差距。由于对 IT 环境的任何变更都可能影响组织的安全态势，因此所有重大的\
  \ IT 变更都应经过正式的变更流程，其中包括对变更的安全影响评估。变更管理在 第 7 章 中进一步讨论。\n\n## 管理数据生命周期\n\n维护数据安全需要您了解数据在整体数据生命周期中的位置。\
  \ 图 2.5 描述了安全数据生命周期，每个步骤在下面的列表中进行了描述。\n\n![FIGURE 2.5 Secure data lifecycle](img/c02f005.png)\n\
  \n**FIGURE 2.5 Secure data lifecycle**\n\n1. **收集：** 数据被生成或汇总。\n2. **存储：** 数据被保存到存储系统或存储库中。\n\
  3. **使用：** 数据由用户或系统按其预期目的进行处理和/或分析。\n4. **共享：** 数据与授权的外部用户和系统共享。\n5. **保留：** 数据被保留（例如归档）一段时间。\n\
  6. **销毁：** 数据被删除并永久从存储中移除，使其无法访问且无法使用。\n\n数据生命周期是一个高级流程，描述了数据如何在组织中流动，具体步骤可能因组织而异。例如，一些数据可能直接从步骤\
  \ 1 进入步骤 6，从未被存储或保留，而一些数据可能永远不会达到步骤 6，而是被归档（即保留）在冷存储中永久保存。\n\n了解安全数据生命周期中每个阶段的差异对于定义高效的安全流程和有效的数据安全控制至关重要。数据生命周期模型可用于帮助您的组织思考数据在每个阶段的安全需求。我们将在以下各节中讨论每个阶段和相关的数据角色。\n\
  \n### 数据角色\n\n管理组织数据安全的一个关键因素是能够识别控制或可能访问您的数据的各方，并了解他们在整个数据生命周期中的角色和职责。一些法规（例如 GDPR）对组织识别特定数据角色的特定个人设定了严格要求。每个职称的含义可能因法规或组织而略有不同。本节其余部分将讨论每个数据角色的一般描述。\n\
  \n#### 所有者\n\n不出所料，数据所有者是组织中最重要的角色之一。*数据所有者* 是负责规定数据应如何以及为何使用，以及数据必须如何得到保护的个人或个人组。数据所有者可以对信息拥有法律权利和完全控制权，可以授权或拒绝对其数据的访问——数据所有者最终对其数据负责并承担责任。在许多组织中，这一责任可能是高级领导者，可能包括首席执行官（CEO）或公司总裁，但特定数据相关任务可以委托。数据所有者可能因其拥有的敏感数据被滥用或未经授权披露而被追究过失责任；即使日常任务被委托，数据所有者仍承担最终责任。数据所有者的责任范围可以通过法律或监管措施来建立和执行。组织的数据政策将概述数据所有者如何使用、收集、共享和存储其拥有的数据。所有数据，尤其是具有敏感级别的数据，都必须分配给所有者。\n\
  \n\n\n\n\n对数据所有者的期望是提供适当的注意和勤勉。这些主要是指导信息保护活动的法律术语。这些概念已在第 1 章中介绍，并在本章后面详细说明。\n\n\
  *适当的注意*，就资产管理而言，是使用合理措施和努力来保护被认为有价值或被分配敏感级别的资产。提供适当注意的一个例子是保持和维护准确的资产清单。此外，适当注意还延伸到确保所有资产都得到适当分类，并且分类基于资产所包含的信息而准确。\n\
  \n*勤勉*是指采取所有可预期或实际的步骤来维持适当注意，包括验证一切是否按适当注意的意图执行。勤勉的一个例子始于承认有价值的资产遍布整个组织，并且必须付出重大努力来对其进行核算和评估。这将使组织能够适当评估风险和保护策略。资产不再局限于固定的边界。笔记本电脑、U\
  \ 盘和便携式设备等资产是移动的。随着数据转移到云端，有形和无形资产以及因此而产生的勤勉也延伸到云环境。\n\n在事件响应活动或数据泄露调查期间，可以看到适当注意和勤勉的重要性。能够证明适当注意和勤勉的组织可能能够减少责任和法律风险，而缺乏适当注意和勤勉则可能构成民事甚至刑事处罚的理由。\n\
  \n### 控制器\n\n*数据控制者*是指单独或与其他人共同决定数据处理目的和方式的个人、机构、公司或其他主体。随着 GDPR 法规的出台（在第 1 章中讨论），数据控制者变得越来越相关，数据控制者负责遵守与处理个人数据相关的所有原则。为此，控制者必须能够证明其遵守合法性、公平性、透明度、数据最小化、准确性、存储限制、完整性和个人数据的保密性等原则。数据控制者通过安全的合同条款和保证，即*数据处理协议*，与数据处理者协商个人数据的隐私保护。\n\
  \n### 托管人\n\n在组织中，数据治理流程应包括数据托管人的角色。数据托管人负责根据数据所有者和业务设定的要求维护 IT 基础设施上的数据。数据托管人负责维护确保数据安全保管、传输和存储的技术环境。\n\
  \n### 处理者\n\n数据的价值往往在于信息在授权实体之间的共享或交换。代表数据所有者负责传输、传送或以其他方式处理数据的方是*数据处理者*。数据处理者在数据保护中具有不同的角色。在医疗保健环境中，数据交换对于患者护理的安全和适当进行、适当治疗、管理账单和其他组织运营都很重要。在银行业，数据支持企业和个人投资以及信用评估。GDPR\
  \ 和 HIPAA 等法规的监管重点反映了数据处理责任的重要性。\n\n![FIGURE 2.6 Relationship between data processor\
  \ and data controller](img/c02f006.png)\n\n**FIGURE 2.6 Relationship between data\
  \ processor and data controller**\n\n在某些情况下，组织中的人员同时担任数据处理者和数据控制者角色。例如，人力资源公司对其员工拥有数据，在此意义上是数据控制者。然而，如果该公司为其他客户提供外包人力资源服务，人力资源公司将成为客户数据的处理者，而个别客户仍是数据控制者。\n\
  \n### 用户\n\n可以说最容易理解的是，*数据使用者*是消费数据的方；数据使用者是数据的客户或预期接收方。数据使用者可要求数据处理者遵守服务水平协议（SLAs）和其他合同协议，这些协议要求特定的绩效水平（例如，数据可用性）。\n\
  \n### 主体\n\n*数据主体*，根据 GDPR 定义，是“已识别或可识别的自然人”——或用通俗英语来说，就是人类，从他们那里或关于他们收集信息的个体。GDPR\
  \ 的总体目的是保护数据主体及其个人信息的隐私。\n\n### 数据收集\n\n数据生命周期（参见图 2.5）始于数据收集。此阶段可能包括数据创建、获取、聚合，或数据对您的系统而言“全新”的任何情况。新的数据可能是新生成的内容、引入您环境的新数据，或已更新/修改为新状态的内容。\n\
  \n安全默认值、隐私设计以及其他安全设计原则在此数据生命周期的初始阶段最为重要。法规和最佳实践建议（并且通常要求）数据保护原则应从一开始就设计并集成，而不是在后期引入安全措施。\n\
  \n数据分类，在“识别和分类信息和资产”部分中讨论过，最适合在数据收集或创建期间进行；这有助于确保从一开始就实施正确的安全控制。除了建立数据分类之外，此阶段也是为数据标记任何重要属性并为数据分配适当访问限制的好机会。在数据收集期间做出的任何决定都会伴随数据在其整个生命周期中。因此，必须充分考虑收集/创建的数据在其生命周期内如何被管理和保护。\n\
  \n### 数据位置\n\n随着基于云的存储的增长，数据位置是一个日益被讨论的话题。许多司法管辖区或政府都有法律要求公民（或居民）的数据必须在国内收集、处理或存储。数据仍可国际传输，但必须源自该国，并且只有在满足当地隐私或数据保护法律后才能传输。这些条件的例子是通知用户信息将如何使用并获得其同意。这是数据在境外交换之前的数据本地化或数据驻留。在某些情况下，数据本地化或数据驻留规定要求在从数据主体所在国家系统移除之前，必须从外国系统删除有关该国公民或居民的数据。某些法规禁止某些数据（如军事机密等）在任何情况下离开原籍国。\n\
  \n中国《网络安全法》是数据位置要求的一个突出例子。该法律于 2016 年通过，加强了国家政府对网络安全业务的管辖权。所有关键信息基础设施（CII）均受该法律约束。政府对维护可能在受损或丢失时构成国家安全或公共利益风险的数据的关键行业感兴趣。受该法律考虑的中国企业中一些行业包括能源、金融、交通、电信、电力、水、天然气以及医疗和医疗保健。作为该法律的一部分，受影响的外国公司必须在中国建立服务器和数据中心，或将数据管理外包给由中国本地管理的公司，如阿里巴巴或腾讯。\n\
  \n\n\n\n\n使用云服务提供商时，数据本地化或驻留会凸显出若干重要考量，包括了解您的数据将驻留在何处（或可能传输到何处），以及云服务提供商为支持数据所有者的要求所承担的合同义务。数据本地化或驻留是要求数据控制者持有云数据存储加密密钥的另一个正当理由。如果国家要求国际组织在该国之前销毁数据，删除加密密钥可以作为补偿控制措施，使敏感数据无法读取且无法使用。\n\
  \n### 数据维护\n\n在收集和存储数据之后，数据很可能会在组织内部移动并用于其预期目的。安全数据生命周期中的“使用”阶段涉及以各种方式处理、分析和共享数据。在此阶段，您应通过控制对数据的访问并在过程中应用适当的安全控制来积极管理和维护数据的安全性。数据维护涉及持续监控您的数据并应用诸如最小权限和纵深防御等原则（均在\
  \ `Chapter 3` 中讨论）。\n\n### 数据保留\n\n无论您的数据存储在本地数据中心还是由第三方托管（例如云服务提供商），您都需要考虑在安全销毁之前数据将保留多长时间。制定数据保留政策和程序，定义保留什么以及保留多长时间，不仅是标准做法，而且很可能是法律、监管或合同要求。例如，`NIST\
  \ SP 800-53` 概述了联邦机构和政府承包商为遵守《联邦信息安全管理法》（`FISMA`）而需要满足的要求；这些 NIST 指南要求数据至少保留三年。同样，`HIPAA`\
  \ 数据保留要求规定，被覆盖实体必须从创建之日起至少保留六年的与 HIPAA 相关的数据。了解应保留某些类型数据多长时间可能会变得非常复杂。您组织的安保和法务团队应密切合作，以确保数据保留政策满足所有法律和监管要求。\n\
  \n数据保留政策还应规定敏感或个人数据的最大保留期限。虽然保留最低期限旨在帮助支持事件响应和其他类型的调查，但保留最大期限通常是为了保护个人数据的隐私而执行的。例如，`GDPR\
  \ Article 5` 规定，个人数据应仅在实现数据最初收集目的所需的时间内保留；换句话说，GDPR 要求组织在必要时保留个人数据，但不得超过必要时间。同样，各种监管要求往往相互冲突，这使得制定和遵循数据保留政策变得非常具有挑战性。尽管如此，这仍是每个资产管理计划的关键部分，需要认真考虑。\n\
  \n### 数据销毁\n\n数据生命周期的最后阶段也是最常被忽视的阶段：*数据销毁*。如果数据不再按法规或功能需要，则应将其处理掉。陈旧数据是黑客的磁石，通常是环境中最不受保护的资源。通过逻辑或物理销毁不需要的数据，您可以降低风险敞口并减少存储和数据维护成本。除了对存储介质进行完全物理销毁之外，任何方法都可能使数据残留。我们将在下一节中讨论这种现象以及应对方法。\n\
  \n### 数据残留\n\n尽管许多电视上的热门犯罪剧描绘了从任何介质上恢复任何数字数据的虚构能力，但确实，不充分删除数据可能导致信息泄露。如果未妥善处置，介质上可能残留数据，且未经授权的查看者有可能恢复该数据。*数据残留*是指数据销毁工作不足以防止数据被重建时发生的现象。\n\
  \n数据残留的根本原则是，数据仅从硬盘或其他存储介质中删除是不够的；在使用操作系统的删除命令时，只删除了指向数据的指针，而非数据本身。受监管数据（如 `PHI`）和敏感度等级更高的数据（例如机密或绝密）必须遵循严格的销毁方法。销毁必须经过认证，并且销毁/认证的证据必须作为流程的适当文件保存。由销毁数据的实体出具的销毁证书，并由监督数据销毁的人员签署，通常是足够的。\n\
  \n使用云服务提供商引入了一些关于数据残留的挑战。云服务提供商与云客户之间需要进行大量协作才能实现安全的数据销毁。云用户或租户无法访问物理驱动器，只能访问文件系统等更高级别的抽象。诸如覆盖文件扇区等技术在组织拥有和运营的本地数据中心中是可行的，但在云环境中则不可行。在软件即服务（`SaaS`）和平台即服务（`PaaS`）环境中，访问仅发生在数据层面。在云环境中，替代方案是对数据进行加密并将密钥保存在数据所在云环境之外。当数据不再需要且密钥被删除时，数据将被渲染为不可用且无法读取——这被称为\
  \ *加密擦除*。这并不是完美的解决方案，但由于云服务提供商分配资源且云用户无法控制容纳数据的物理资产所在位置，因此覆盖方法通常是不可能的。\n\n管理数据销毁的规则和法规通常规定必须对各种类型的敏感信息应用的保护级别。美国有几项联邦法律可能适用于组织的数据销毁，包括《格雷姆-里奇-比利雷法案》（`GLBA`，在\
  \ `Chapter 1` 中讨论），该法案限制了客户信息的披露和使用，并对金融机构施加了安全规则。`HIPAA` 规范客户医疗记录和信息的处理。公平信用报告法规范了有关消费者信用和信用评级的报告中信息的用途、披露和处置。经批准的欧洲标准\
  \ `BS EN 15713`，“机密信息的销毁”，定义了安全有效地销毁此类数据的行为准则。它适用于收集、运输和销毁机密材料的任何组织。`BS EN 15713`\
  \ 可与其他管理体系标准集成，最常见的是 `ISO 9001`。\n\n有许多框架和法规建议或要求针对数据残留采取特定的缓解措施。例如，在美国国家安全局（`NSA`）中央安全局（`CSS`）政策手册\
  \ 9-12 中，要求首先移除所有表明先前使用和分类的标签和标记。之后，要求根据所使用介质的类型而有所不同。其中一些要求包括以下内容：\n\n* 通过使用 `NSA/CSS`\
  \ 评估的消磁器对磁带和磁盘进行消磁消毒和/或通过焚烧材料将其焚毁并化为灰烬。在此过程中，适用以下标准：\n    * 强烈建议在以任何方式释放之前通过变形内部盘片来物理损坏硬盘驱动器，或使用硬盘驱动器破碎机。\n\
  \n\n\n\n\n*   硬盘可以通过使用消磁棒消磁、拆卸设备并擦除封闭盘片的所有表面来进行消磁。\n\n*   将硬盘分解成边长名义上为 2 毫米大小的颗粒。强烈建议将硬盘存储设备与其他存储设备一起批量分解。\n\
  \n*   使用经批准的碎纸机对较小的软盘进行碎纸是允许的。碎纸前请先取下软盘外壳和金属中心轴。\n\n*   光学存储设备包括 CD、DVD 和蓝光光盘（BD），可以采用以下方式进行清理：\n\
  \n    *   BD 唯一可以清理的方式是通过焚烧材料并将其还原为灰烬。这里列出的其他方法对它们无效。焚烧对 CD 和 DVD 也有效。\n\n    *\
  \   CD 和 DVD 可以被分解。\n\n    *   CD 和 DVD 可以被碎纸。\n\n    *   CD 和 DVD 可以通过使用经批准的光学存储设备压花/滚花机进行压花/滚花。\n\
  \n    *   CD 可以通过经批准的研磨机进行清理。DVD 或 BD 不能通过研磨进行清理。\n\n*   对于固态存储设备，包括随机存取存储器（RAM）、只读存储器（ROM）、现场可编程门阵列（FPGA）、智能卡和闪存，以下方法是可以接受的：\n\
  \n    *   使用经批准的破碎机将其分解成边长名义上为 2 毫米大小的颗粒；建议与其他多个存储设备一起批量进行此操作。\n\n    *   将材料焚烧成灰。\n\
  \n*   智能卡可以通过条状碎纸至最大 2 毫米或以 45 度角对角线切割智能卡进行清理，确保微芯片被切过中心。另请确保条形码、磁条和书写信息被切成几块且书写信息无法阅读。交叉碎纸机*不*允许用于此碎纸。\n\
  \nBS EN 15713 的要求类似，其中包括以下内容：\n\n*   必须有保密销毁场所。\n\n*   客户与组织之间应存在涵盖所有交易的书面合同；分包商也必须遵循指南。\n\
  \n*   从事此工作的人员必须接受培训、获得认证，并通过犯罪记录局（CRB）检查或披露或禁止服务（DBS）检查。\n\n*   待收集的保密材料应从收集点到完全销毁期间始终受到未经授权访问的保护。\n\
  \n*   用于收集和运输受保护材料的卡车有特定要求，包括为箱型、驾驶员能够与基地站通信、可上锁、不被无人看管等。\n\n*   除了销毁重点外，还考虑了环境问题，并在某些条件下允许回收。\n\
  \n数据销毁有两种通用方法。第一种方法是使包含介质的实际设备或对象变得无用。物理销毁介质、电磁消磁和焚烧是常见策略。\n\n另一种资产处置方式是通过清理或清理介质/驱动器来清理介质/驱动器。因此物理介质可以被重复使用，但在数据擦除操作后不会留下数据残留痕迹。有许多经过验证的流程可用于此目标。\n\
  \n您的资产处置政策应区分在组织内部重复使用的资产和在组织外部重新利用的资产（或完全丢弃）。例如，内部重新分配的资产可能只需较低级别的清理即可足够（例如，重新格式化或重新映像硬盘）。此场景并不排除组织在资产被认为关键或数据敏感时强制执行最高级别清理。一些不同的策略可用于实现特定步骤和说明的安全保证水平，可在\
  \ NIST SP 800-88《介质清理指南》中找到，网址为 [` nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-88r1.pdf`](http://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-88r1.pdf)。\n\
  \n为实现充分资产清理保证水平，可以使用以下技术：\n\n*   **清除：** 这涉及数字擦除数据或用零或一覆盖数据。这是数据删除最无效的方法，可能允许数据恢复。\n\
  \n*   **清除：** 这包括诸如 *消磁* 等方法，即通过将存储介质暴露于强磁场来破坏数据。\n\n*   **销毁：** 这包括通过碎纸、焚烧或粉碎物理销毁介质，也包括使用强加密在逻辑上销毁数据。\n\
  \n实现所需清理要求保证水平的具体技术示例包括以下内容：\n\n*   **清零：** 这会擦除磁盘上的数据并用全零覆盖。\n\n*   **覆盖：** 数据写入先前保存敏感数据的存储位置。通常使用\
  \ 0 和 1 组合的随机遍数进行覆盖，而不是模式。覆盖次数取决于存储介质，有时取决于其敏感性，有时取决于不同的组织要求。\n\n*   **消磁：** 这是一个过程，其中磁性介质被擦除（即通过使用强磁场将其恢复到初始空白状态）。\n\
  \n## 确保适当的资产保留\n\n数据保留计划服务于多种目的。组织需要保存知识产权。适当的数据保留流程将支持机构记忆。在法律或取证检查中，可以通过数据保留来保存证据。在许多情况下，数据保留是由于监管和合规要求而产生的义务。\n\
  \n信息安全专业人员必须在信息存在的整个过程中处理信息的保密性、完整性和可用性。如果没有成熟的数据保留流程，组织将经历更多记录篡改、数据丢失和不当访问的事件。必须做出几个考虑，以确定应维护哪些类型的信息以及维护多长时间。法规可能会根据数据的类别或敏感性制定指南。虽然某些法规似乎强制要求过度的保留要求，但请记住，不合规的成本（例如，法律处罚、诉讼费用等）可能远超过保留数据的成本。\n\
  \n在法规或其他合规要求未给出具体授权的情况下，组织必须制定资产保留指南。这些时间线应与资产类型（关键、生产等）和数据敏感性（机密、公开等）相关。\n\n资产和数据保留对于组织保护和保存记录作为行动证据至关重要。资产管理系统是关于业务活动的信息来源，可以支持后续活动和业务决策。该流程还确保对当前和未来利益相关者的问责。记录管理实践存在几个良好的参考资料。其中之一是\
  \ ISO 15489-1:2016，《信息与文献 — 记录管理 — 第 1 部分：概念与原则》。另一个是 DoD 指令 5015.02，《DoD 记录管理计划》。\n\
  \n\n\n\n\n构建数据保留政策所需的步骤很重要。第一步是指定一位有权威的人或指导委员会决定企业生产哪些电子和实物文件并指定所有权。接下来，该人员或委员会应审查与资产和数据保留相关的法规，以确保政策保持一致。然后，团队就可以实际撰写政策了。一旦政策在组织内发布，培训员工了解该计划就很重要。持续的沟通将有助于确保流程的成功。定期审查数据保留政策并根据需要对其进行更新。\n\
  \n下面列出的是帮助建立初始数据保留政策的一般大纲。在已经拥有数据保留政策的组织中，可以使用此行动模板来审查当前政策：\n* 记录政策的目的。\n* 确定受政策影响的人员。\n\
  * 确定政策涵盖的数据类型和电子系统。\n* 定义关键术语，特别是法律和技术术语。\n* 从法律、业务和监管角度详细描述要求。\n* 概述确保数据得到妥善保留的程序。\n\
  * 概述确保数据得到妥善销毁的程序。\n* 明确记录诉讼例外流程以及如何响应电子取证请求。\n* 列出参与数据保留活动的人员的职责。\n* 建立一个表格，显示信息类型及其对应的保留期限。\n\
  * 记录中央或企业数据保留团队的具体职责（如果存在）。\n* 包含附录以供额外参考信息。\n\n政策应明确，在数据管理生命周期的所有阶段，包括销毁阶段，都需要适当的保密处理程序。\n\
  \n安全从业人员在资产保留中最重要的角色可能是创建和维护一份政策，该政策以法规为依据并遵守法规，满足业务目标，并在整个组织中得到理解和遵循。进行政策培训和测试是衡量项目绩效的重要措施。必须让用户意识到他们在整个资产生命周期中维护保障措施方面的责任。应进行审计，以确保组织遵守政策和程序。\n\
  \n## 确定适当的记录保留\n\n安全专业人员必须时刻关注可能影响记录保留要求的各种地方、国家和国际发展。一个例子是欧盟《通用数据保护条例》第 17 条“被遗忘权”，通常称为*被遗忘权*的制定和执行。这导致组织根据第\
  \ 17 条引入的被遗忘权考虑因素，对之前的记录保留要求进行评估。该条款明确赋予个人在不拖延的情况下要求删除其记录的权利。对于企业或数据控制者必须出于收集数据目的保留数据的情形，有一个例外，即原始业务需求。在这种情况下，业务需求可以成为监管指导的例外。\n\
  \n还有监管要求导致组织建立和维护记录保留政策，其保留期限超过记录的内部使用寿命。此类情况的一个例子是 HIPAA，该法规要求相关医疗保健组织保留与 HIPAA\
  \ 合规相关的文件，例如与电子受保护健康信息（ePHI）审查相关的日志记录，保留六年。虽然 HIPAA 要求对维护与 HIPAA 相关的政策和程序所需的文件实行六年的记录保留要求，但美国各州法律通常涵盖患者病历的记录保留要求。有关更多详细信息，请参阅美国联邦法规法典第\
  \ 164.316(b)(1)条和第 164.316(b)(2)(i)条。负责监督 HIPAA 的美国卫生与公众服务部（HHS）在缺乏更具体的联邦和州级指导的情况下，建议最少保留六年。涉及多个司法管辖区时，请咨询组织法律顾问以获得明确指导。让他们成为通知您变更的守门人，而不是安全团队需要订阅法律新闻服务。\n\
  \n记录保留要求还应辅以去标识化和混淆处理。记录保留计划可以包括个人数据不再需要时的日期，但其他元素对于数据分析和趋势分析很有用。这可以在保护个人信息的同事延长记录的使用寿命。定期对文件进行清理，并不将个人数据保留超过必要的时间，从而满足监管合规要求。\n\
  \n## 记录保留最佳实践\n\n每个组织必须根据适用的法律、指令、政策、法规、标准和运营要求处理和保留记录。虽然要求可能因地理管辖区或行业特定考虑而有所不同，但安全专业人员可以使用以下几个总结性最佳实践来构建合规有效的记录管理计划：\n\
  * 根据组织的记录保留计划保留记录。\n* 定期评估系统。可能存在触发审查的因素，例如合并或收购。否则，请考虑定期、定期审查组织中的记录。这些审查应包括法律和合规团队，以及任何相关应用程序和数据所有者。\n\
  * 每年审查实际的记录保留计划一次，以确保计划与业务要求和监管要求相关。\n* 对电子维护的记录进行标记。\n* 创建备份电子文件副本。\n* 保留无法准确或完整转移到电子记录保存系统的记录的纸质副本。\n\
  * 不要保留记录超过收集信息原始目的所需的时间。\n* 确保记录具有有效的起始日期。记录的移动和使用可能会改变电子文件日期，但不会改变决定保留期的日期。\n*\
  \ 应根据保留计划，在所有已识别的电子存储库中合理尝试删除不必要的电子记录。\n* 在信息的整个生命周期内维护信息处理控制，在某些情况下甚至在记录处置后仍需延续。\n\
  * 确保记录在保留期间内保持持久可访问，其可访问频率应与检索频率相符。\n* 对记录进行去重，以避免不必要的存储多个副本，从而增加风险和存储成本。\n* 记住对官方记录的电子邮件进行分类和保留。创建电子邮件保留计划作为记录保留计划的子集。\n\
  * 通过定期将记录从媒体源转换和迁移，确保记录在所需的保留期内保持可访问，因为数字媒体可能会随着时间的推移而退化或过时。\n* 根据书面保留期限以及信息安全和保留政策安全删除数据。\n\
  \n\n\n\n\n您的记录保留计划可能对您的组织而言是独特的，但遵循最佳实践以建立有效的电子记录保留计划是基础。您的组织需要捍卫其知识产权，并在诉讼发生时提供保护。适当的记录保留使组织能够验证其保存的记录的真实性。随着关键性、价值和数字信息量的激增持续增长，记录保留对于防止组织不堪重负以及记录变得不可用或不受保护至关重要。总之，虽然没有通用的记录管理计划，但安全专业人员需要检查其自身企业中的具体要求，并考虑最能服务于其组织的最佳实践方法。\n\
  \n## 确定数据安全控制和合规要求\n\n在资产被识别、盘点和分类之后，仔细考虑最适合您组织的数据安全控制非常重要。这些安全控制将根据每项资产的分类、数据状态以及组织选择对齐的任何合规要求或行业标准而有所不同。\n\
  \n首先，有三个类别的控制您应该熟悉：技术、行政和物理。对每种类型控制的更深入理解是必要的，以强调每种控制在保护组织资产中所起的作用。\n\n* **技术控制：**\
  \ 被归为*技术控制*的控制类别利用计算机能力和自动化来实现保护措施。技术控制旨在防御对有价值信息的滥用或未经授权的访问。在大多数组织中，需要组合技术控制协同工作，以保护、检测并响应潜在的和实际的安全事件。一些与资产管理相关的技术控制示例是防止未经授权读取、写入、移动或执行资产的访问控制系统，以及允许或限制访问\
  \ URL、IP 地址或软件加载/执行的过滤器。\n\n* **行政控制：** *行政控制*是组织用来实施技术和物理控制的人员导向的政策、程序、标准和指南。行政控制的来源可以是法律法规、行业最佳实践和组织授权。行政控制告知组织角色和职责、适当的信息保护实践，以及如果未遵循控制时的执行措施。\n\
  \n* **物理控制：** 随着信息和技术资产持续数字化并变得更加互联，*物理控制*仍然非常重要。控制对信息资产的物理访问通常是我们可以使用到的最经济且最有效的预防控制。设计包含警卫和接待员、入口访问控制、区域照明和监控、闭路电视（CCTV）以及物理入侵检测系统的资产保护计划，可提供分层防御方法。\n\
  \n物理、技术和行政控制也由其保护目的定义。每种类型的控制都可以描述为威慑性、预防性、检测性、纠正性或恢复性。根据控制的不同，它可能在整体安全计划中承担多种功能。这些内容在第\
  \ 1 章中“适用控制类型”部分有详细讨论。\n\n### 数据状态\n\n数据是一种易变的资产。随着组织中数据的使用发生变化，保护它所需的安全控制也必须发生变化。根据数据的价值，无论处于何种状态都必须对其进行保护。数据可以存储或静止在备份磁带、硬盘或云中。数据通常被应用程序和网页临时使用。当数据在用户或计算资产之间传输时，被视为在传输中。保护数据作为资产的一些关键方法是加密和访问控制，包括适当的授权限制。加密可防止在未经授权访问或被盗的情况下数据被查看。图\
  \ 2.7 提供了各种状态下数据的示例。有关每种数据状态适当安全控制的详细内容，可在第 3 章、5 和 7 中找到。\n\n![FIGURE 2.7 Data\
  \ states and examples](img/c02f007.png)\n\n**FIGURE 2.7 Data states and examples**\n\
  \n##### 数据静止\n\n*数据静止*是指存储在系统上且未被主动写入、读取、传输或以其他方式处理的数据。数据处于“静止”状态，因为没有来自设备到设备或跨网络的主动处理或传输。\n\
  \n数据静止保护通常从访问控制开始。考虑您试图保护的数据资产、谁应该有权访问它以及谁绝对应被拒绝访问它非常重要。适当的访问控制，包括对敏感数据使用多因素身份验证，是实现安全数据静止的重要起点。\n\
  \n加密是数据静止的另一种常见安全控制。加密可以应用于整个存储卷，称为*全盘加密*。值得注意的对整个硬盘进行加密的几种方法如下。\n\n* *可信平台模块*（TPM）是集成到计算机硬件中的微控制器芯片，提供加密处理器。加密密钥被集成在设备本身中，并且可以在启动时帮助验证平台。\n\
  \n* *自加密驱动器*（SED）是硬盘驱动器或固态驱动器，可在无需额外加密软件的情况下自动加密和解密驱动器数据。SED 在无需用户输入的情况下持续加密驱动器数据。\n\
  \n更细粒度的方案允许在单个文件级别应用加密，称为*文件级加密*。文件级加密是一种量身定制的数据保护策略，可能在整个磁盘被解密的情况下，提供额外的保护，防止对硬盘上的文件进行未经授权的访问。为了获得更精细的粒度，*字段级加密*允许对单个文件内的特定数据字段进行加密。\n\
  \n##### 数据在传输中\n\n*数据在传输中*是指正在通过网络、多个网络之间或从一个位置传输到另一个位置的数据。也描述为*数据在运动中*，数据在传输中是指任何正在从源点主动移动到目的地跨网络的数据，包括受信任的、私有网络。数据也可以通过互联网和到云等不受信任的网络进行传输，例如。传输层安全（TLS）（包括\
  \ HTTPS）和虚拟专用网络（VPN）是帮助保护传输中数据的关键基于加密的技术。\n\n*链路加密*是一种数据在传输中安全的方法，其中流量在每个网络路由点（例如其经过的网络交换机或节点）处被加密和解密。此过程一直持续到数据到达最终目的地。路由信息在每个节点解密过程中被发现，以便传输可以继续。然后消息会被重新加密。链路加密提供了几个优势：\n\
  \n* 由于加密过程是自动的，因此人为错误更少。\n\n* 流量分析工具被规避，攻击者被挫败，因为持续的通信链路和不变的流量水平保持了加密保护。\n\n\n\n\
  \n\n*端到端加密*是另一种数据传输中的保护方法。这种通信系统确保只有发送方和接收方可以读取数据。任何窃听者都无法访问解密对话所需的加密密钥；这意味着即使是电信提供商、互联网提供商或通信服务提供商也无法访问解密对话所需的加密密钥。\n\
  \n### 使用中的数据\n\n*使用中的数据*是数字数据的第三种、经常被遗忘的状态，指由用户（人类或系统）使用的应用程序正在主动处理的、正在被处理的数据。当经过身份验证的用户访问数据库或应用程序时，数据处于易失状态。使用中的数据通常在\
  \ RAM、CPU 缓存或 CPU 寄存器中使用，以执行终端用户所需的交易和任务。加密在这里不一定相关，也不是与使用中的数据一起使用的主要控制措施，但它可以与其他控制措施互补。使用中的数据，\
  \ presumedly 由授权用户使用，强调了身份验证、授权和审计对于控制和监控对敏感资产的访问的重要性。一旦黑客窃取了有效的凭据，许多像加密这样的控制措施就会变得无效，因为入侵者拥有如同内部人员一样的访问权限。这些类型的问题将在第三章中进一步讨论。\n\
  \n### 范围界定和定制\n\n建立安全控制基线开始了范围界定和定制过程。因为每个组织都有独特的因素影响其对资产的价值评估、面临的威胁以及在资源和业务运营影响方面能够承受的安全水平，所以细化单个控制措施是安全专业人员的重要职责。CISSP\
  \ 必须帮助制定计划，以澄清和限制指南和框架的一般建议，使其适用于该组织。\n\n范围界定和定制不是同义词，但这两个概念共同作用以建立安全基线。*范围界定*是组织为考虑哪些安全控制适用以及需要保护哪些资产而进行的过程。*定制*是修改控制集以满足组织特定特征和要求的过程。由于每个组织都不同，框架中的某些控制可能不适用；这些控制可以从基线中移除。有时安全控制确实适用，但实施应根据组织中的信息资产或信息使用情况进行调整。在这种情况下，会对控制进行定制以消除不必要的[content]\n\
  \n*端到端加密*是另一种数据在传输中的保护方法。这种通信系统确保只有发送方和接收方可以读取数据。任何窃听者都无法访问解密对话所需的加密密钥；这意味着即使是电信提供商、互联网提供商或通信服务提供商也无法访问解密对话所需的加密密钥。\n\
  \n### 使用中的数据\n\n*使用中的数据*是数字数据的第三种、经常被遗忘的状态，指由用户（人类或系统）使用的应用程序正在主动处理的数据。当经过身份验证的用户访问数据库或应用程序时，数据处于易失状态。使用中的数据通常在\
  \ RAM、CPU 缓存或 CPU 寄存器中使用，以执行终端用户所需的交易和任务。加密在这里不一定相关，也不是与使用中的数据一起使用的主要控制措施，但它可以与其他控制措施互补。使用中的数据，\
  \ presumedly 由授权用户使用，强调了身份验证、授权和审计对于控制和监控对敏感资产的访问的重要性。一旦黑客窃取了有效凭据，许多像加密这样的控制措施就会变得无效，因为入侵者拥有如同内部人员一样的访问权限。这些类型的问题将在第三章中进一步讨论。\n\
  \n### 范围界定和定制\n\n建立安全控制基线开始了范围界定和定制过程。因为每个组织都有独特的因素影响其对资产的价值评估、面临的威胁以及在资源和业务运营影响方面能够承受的安全水平，所以细化单个控制措施是安全专业人员的重要职责。CISSP\
  \ 必须帮助制定计划，以澄清和限制指南和框架的一般建议，使其适用于该组织。\n\n范围界定和定制不是同义词，但这两个概念共同作用以建立安全基线。*范围界定*是组织为考虑哪些安全控制适用以及需要保护哪些资产而进行的过程。*定制*是修改控制集以满足组织特定特征和要求的过程。由于每个组织都不同，框架中的某些控制可能不适用；这些控制可以从基线中移除。有时安全控制确实适用，但实施应根据组织中的信息资产或信息使用情况进行调整。在这种情况下，会对控制进行定制以消除不必要的\n\
  \n\n\n\n# 英国网络安全十步法（[www.ncsc.gov.uk/guidance/10-steps-cyber-security](http://www.ncsc.gov.uk/guidance/10-steps-cyber-security)）\n\
  这是一个政府发布的建议文件示例，旨在帮助组织聚焦主要威胁以降低最大风险。该文件面向英国组织，被视为官方文件。它单独使用是不够的，但在安全控制组合中具有价值，可构成基线控制集。\n\
  \n## 安全标准\n\n除了上一节列出的安全框架外，还有许多区域性和行业特定的标准（如 `PCI DSS`、`HIPAA` 和 `GDPR`），它们更进一步，推荐甚至要求特定的安全控制。以下是一些常见的安全标准，但这不是一个详尽的列表：\n\
  \n### 美国国家标准与技术研究院特别出版物\n* **NIST SP 800-53 Rev 5，“联邦信息系统和组织的安全和隐私控制” ([csrc.nist.gov/publications/detail/sp/800-53/rev-5/final](http://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final))：**\
  \ 这是除国家安全相关系统（如国防部）外所有美国联邦信息系统的安全控制目录。组织可利用它来建立基线安全控制、定制安全控制，并根据组织风险评估补充安全控制。\n\
  * **NIST SP 800-53A Rev 4，“评估联邦信息系统和组织的安全和隐私控制：构建有效的评估计划” ([csrc.nist.gov/publications/detail/sp/800-53a/rev-4/final](http://csrc.nist.gov/publications/detail/sp/800-53a/rev-4/final))：**\
  \ 作为补充指南使用，它提供了一套用于评估美国联邦信息系统和组织中采用的安全控制和隐私控制的程序。评估程序在系统开发生命周期的各个阶段执行，与 NIST SP\
  \ 800-53 修订版 5 中的安全和隐私控制保持一致。它也适用于私营部门组织。\n\n### 美国 NIST 联邦信息处理标准\n* **FIPS Publication\
  \ 199，“联邦信息和信息系统安全分类标准” ([nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.199.pdf](http://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.199.pdf))：**\
  \ 该标准为根据政府机构对保密性、完整性和可用性的关注程度以及信息和信息系统被未经授权访问、使用、披露、中断、修改或破坏时对机构资产和运营的潜在影响，对美国联邦信息和信息系统进行分类提供标准。这项指令主要针对美国政府机构，但也可适用于私营部门组织并具有实用性。\n\
  * **FIPS Publication 200，“联邦信息和信息系统的最低安全要求” ([nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.200.pdf](http://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.200.pdf))：**\
  \ 作为 NIST RMF 的组成部分，该标准强调在开发、实施和运行更安全的信息系统过程中加强安全。FIPS 200 定义了在保密性、完整性和可用性下涵盖的美国联邦信息系统及其处理、存储和传输的信息的\
  \ 17 个安全控制族。这是另一项美国政府标准，可作为任何国家或行业的参考。\n\n### 国际标准化组织 ISO\n* **ISO 27001，“信息技术 –\
  \ 安全技术 – 信息安全管理体系 – 要求” ([www.iso.org/isoiec-27001-information-security.html](http://www.iso.org/isoiec-27001-information-security.html))：**\
  \ 该标准规定了在组织背景下建立、实施、维护和持续改进信息安全管理体系的要求。它还包括根据组织需求定制的信息安全风险评估和处理要求。ISO/IEC 27001\
  \ 中规定的要求是通用的，旨在适用于所有组织，无论其类型、规模或性质如何。它适用于不受国家管辖和行业限制的全球组织。例如，虽然不专注于 HIPAA，但 ISO\
  \ 27001 中的信息安全管理体系框架与美国医疗保健组织的使用相关。\n* **ISO 27002，“信息技术：安全技术 – 信息安全控制实务规范” ([www.iso.org/standard/54533.html](http://www.iso.org/standard/54533.html))：**\
  \ 该标准为组织信息安全标准和信息安全管理实践提供指南，包括在考虑组织信息安全风险环境的情况下选择、实施和管理控制。实务规范旨在供有意在基于 ISO 27001\
  \ 实施信息安全管理体系的过程中选择控制的组织使用。它也可以为希望实施公认的信息安全控制并制定自己的信息安全管理指南的组织量身定制，但作为对 ISO 270001\
  \ 框架的修改。\n\n共同主题是存在许多良好的安全框架。它们各有优缺点。每种都可以定制以解决特定的信息安全问题。网络安全框架的选择取决于组织中存在的特定变量，例如监管和合规要求、成本、风险承受能力和业务使命。安全从业人员必须能够根据组织要求评估框架并实施能够实现期望资产安全水平的解决方案。\n\
  \n## 数据保护方法\n\n组织的数据是其最受重视的资产之一（通常仅次于其人员）。金融信息是银行机构业务运营的核心，而医疗保健信息对医院和医疗组织至关重要。一般来说，保护数据并确保保密性、完整性和可用性不仅是\
  \ IT 团队的核心，也是整个业务的核心。几种常用的方法可能适合您组织的不同需求。\n\n### 数字版权管理\n\n`Digital rights management`（DRM）是一组工具和流程，专注于在整个生命周期中控制知识产权（IP）的使用、修改和分发。DRM\
  \ 允许您限制对数字资产的访问、编辑、复制和打印。以下是一个常见用例：DRM 技术允许电影制片厂和音乐制作商防止盗版内容在未与该内容合法购买关联的设备上观看。该技术在\
  \ 2000 年代初期变得极其相关，正值 Napster 和 LimeWire 等点对点文件共享应用的兴起。\n\n`Information rights management`（IRM）是一种相关技术，更广泛地通过控制谁可以查看、复制、删除或以其他方式修改数据来保护数据免遭未经授权的访问。IRM\
  \ 技术可用于保护文件、电子邮件、网页和其他形式的信息。\n\n### 数据丢失防护\n\n\n\n\n\n# 数据丢失防护 (DLP)\n\n*数据丢失防护\
  \ (DLP)*，有时也称为*数据泄露防护*，是一组用于确保敏感数据不会丢失或被未经授权方访问的技术和实践。DLP 技术可用于识别和分类敏感数据，并应用保护措施防止数据被“丢失”或窃取。\n\
  \nDLP 是数据保护计划的基础组件，它可以帮助限制结构化和非结构化数据仅流向授权用户、位置和设备。简单来说，DLP 分析数据存储，识别敏感数据元素，并防止用户意外或故意将该敏感数据发送给错误的收件人。\n\
  \nDLP 实施通常由三个核心阶段组成：发现与分类、监控和执行。\n\n* **发现与分类：** DLP 的第一阶段是发现与分类。发现是找到数据的所有实例的过程，而分类是将数据根据其对组织的敏感性和价值进行分类的行为。虽然您应在信息资产清单中对数据进行分类，但许多\
  \ DLP 工具能够应用基于签名的逻辑来确定数据的分类。在许多情况下，您现有的分类信息可用于“调优”DLP，使其知道您认为敏感的内容。分类示例可能包括“PCI\
  \ 数据”（或“持卡人数据”）、“社会安全号码”、“PHI”等。全面发现和正确分类对于剩余阶段的有效性以及整体 DLP 实施的成功至关重要。\n\n* **监控：**\
  \ 监控阶段涉及在数据生命周期中数据移动时检查数据。在此阶段，DLP 技术寻求识别被滥用或处理不当的数据。DLP 监控应在工作站、服务器、网络设备和其他终端上进行，并应评估所有潜在的泄露路径上的流量（如电子邮件、互联网浏览器、消息应用程序等）。请注意，标准\
  \ DLP 实施无法监控加密流量。 （请参阅以下列表中的“传输中的 DLP”以了解这些限制的更多详细信息。\n\n* **执行：** 最终的 DLP 阶段执行，是在监控阶段识别出策略违规时采取行动的阶段。这些操作是根据数据分类及其丢失的潜在影响来配置的。对于不太敏感的数据，违规行为可能会自动记录和/或发出警报，而对于更敏感的数据，则可以实际阻止其未经授权的泄露或丢失。与任何监控工具一样，您必须监控假阴性和假阳性，并不断调整\
  \ DLP 实施以避免执行问题，例如阻止合法/授权的数据共享。\n\n在创建 DLP 实施策略时，组织必须考虑针对每种数据状态的保护技术（如本章前面所述）。此处讨论了每种数据状态的\
  \ DLP 考虑因素：\n\n* **静态数据 DLP：** 对于静态数据，DLP 实施位于数据存储的位置。这可能包括工作站、文件服务器或几乎任何其他具有存储功能的终端。由于静态数据是静态的，从最纯粹的意义上讲，它不需要数据丢失防护。此状态下的数据通常通过加密、访问控制和其他机制进行保护。虽然此状态下的\
  \ DLP 监控仍然很重要，但它在与其他 DLP 技术结合使用时最有效。\n\n* **传输中 DLP：** *基于网络的 DLP* 是涉及监控外发网络流量，通常靠近边界的数据丢失防护。这种\
  \ DLP 实施监控通过 `HTTP`、`FTP`、`SMTP` 和其他网络协议的流量。这里需要注意的是，标准 DLP 实施的一个限制是它们无法有效监控加密流量，例如\
  \ `HTTPS`。如果尝试监控加密网络流量，组织必须将加密和密钥管理技术集成到整体 DLP 解决方案中；这可能会显著增加 DLP 实施的复杂性，但对于某些用例是必需的。\n\
  \n* **使用中 DLP：** *基于主机（或基于终端）的 DLP* 是涉及在工作站或其他终端设备上安装 DLP 应用程序的数据丢失防护。这种 DLP 实施允许监控终端上所有使用中的数据，并提供网络型\
  \ DLP 系统无法提供的信息（如尝试将数据传输到可移动介质）。监控使用中数据的 DLP 系统可以防止未经授权的复制/粘贴、屏幕捕获和其他涉及敏感数据主动使用的操作。\n\
  \n在创建 DLP 策略时，组织必须考虑技术如何与其现有架构和流程保持一致。DLP 控制需要彻底评估并以与组织整体企业架构一致的方式应用，以确保只有正确类型的数据被阻止传输。实施不当的\
  \ DLP 可能导致误报，从而导致合法流量被阻止，或导致漏报，从而允许敏感数据发送给未经授权的各方。\n\n## 云访问安全代理\n\n随着基于云的数据存储的增长，保护云中数据的指定方法变得至关重要。*云访问安全代理*\
  \ (CASB) 是一种软件应用程序，位于云用户与云服务和应用程序之间；CASB 主动监控所有云活动并实施集中控制以执行安全。CASB 可用于执行安全策略、阻止恶意软件并提醒安全团队潜在的安全事件——所有这些都是组织数据安全计划的重要贡献。\n\
  \n总体而言，CASB 旨在提供四个主要功能：\n\n* **可见性：** 提供组织云使用情况的洞察，包括哪些用户使用哪些云应用程序，以及哪些设备用于连接云资源。CASB\
  \ 还可以帮助检测、监控和保护影子 IT。\n\n* **数据安全：** 监控组织的数据安全并帮助防止通过云服务的数据外泄。它们还可以帮助根据所使用的数据执行特定的安全策略。\n\
  \n* **威胁防护：** 通过提供云使用的全面视图来防范内部威胁。\n\n* **合规性：** 帮助组织证明符合 `GDPR`、`HIPAA` 和 `PCI\
  \ DSS` 等监管要求。\n\n有三种主要的 CASB 解决方案类型：\n\n* **正向代理：** 此类 CASB 通常驻留在用户设备上（例如计算机或移动设备）并使用加密的中间人技术来安全地检查并转发用户的全部云流量。此类\
  \ CASB 要求您在每个需要监控的终端上安装证书，使得在大型分布式组织中部署变得困难或繁琐。\n\n* **反向代理：** 此类 CASB 集成到身份服务中，例如\
  \ `Okta`，以强制所有流量通过 CASB 进行内联监控。这消除了在用户终端上单独安装证书的需求，但对具有硬编码主机名的客户端-服务器应用程序提出了兼容性挑战。\n\
  \n* **基于 API：** 此类 CASB 允许组织保护任何用户从任何设备、任何位置访问云资源。基于 API 的 CASB 监控云本身内部的数据，而不是在基于边界的代理上。无需在用户设备上安装任何东西，但潜在的缺点是并非所有云应用程序都为此类\
  \ CASB 提供 API 支持。\n\n## 摘要\n\n\n\n\n\n在任何组织中，最重要的资产（除人员之外）很可能都存在于 IT 和数据清单中。对这些资产的保护对于安全专业人员以及高层领导、监管委员会和这些组织客户来说都至关重要。由于这些资产的敏感性和价值，全球各地的政府和行业都制定了立法和法规来保护它们。除了资产丢失或被盗造成的收入损失或恢复成本外，敏感资产管理不当还会带来重大的隐私问题。本章涵盖了安全从业人员在日常工作中预期了解并实施的许多重要概念和指导原则。从构建资产管理政策开始，组织政策必须以现行法律、指令和最佳实践为依据，但要根据每个组织的使命和独特风险状况进行定制。资产管理流程将包括组织内部的多个利益相关者，因此角色和职责必须明确记录，并且人员应得到充分培训。\n\
  \n资产管理的核心是行业专家和从业者群体开发的标准和框架，这些标准和框架应被用于在组织中构建资产管理计划。所选标准或框架以及为保护资产的保密性、完整性和可用性而实施的个人安全控制也会因组织而异。安全从业人员如何界定范围和定制资产管理控制，取决于基于法律管辖区、行业以及补偿性控制和替代性控制等考虑因素的风险衡量和评估。请记住，安全控制在协同工作时效果最佳，而不是独立管理。对全球各组织中资产的适当获取、盘点、监控和安全管理是一项重大的工作。信息系统高度互联且相互依赖，信息具有价值并需要保护，而做错的后果可能对组织和/或其客户造成灾难性影响。安全专业人员必须掌握通过在组织内部对资产进行适当的标记、存储、处理和销毁来管理信息安全的正确方法，以最大限度地降低风险并在整个数据生命周期中保护资产。\n"
- "# DOMAIN 3\n\n## 安全架构与工程\n\n**安全架构是** 设计和组织适当的组件、流程、服务和控制，以将系统相关安全风险降低到可接受水平。安全工程是对该设计的实现。安全架构和安全工程的首要目标是保护所涉系统或业务的保密性、完整性和可用性，同时确保隐私等其他重要原则。这通常是通过遵循行业或政府认可的企业或安全架构方法来实现的。\n\
  \n在设计安全架构之前，必须进行全面的风险评估，以便安全架构师准确了解需要解决的风险。在 Chapter 1 “安全与风险管理” 中，在确定系统风险时，使用风险管理、风险评估、威胁建模和其他方法。一旦正确识别和评估，每个风险最终必须由组织接受，无论是现状还是在采取行动后。采取的行动取决于多种因素，但通常以以下四种方式之一进行：\n\
  \n* 避免\n* 转移或分担（即保险或合同）\n* 缓解（例如通过安全架构）\n* 接受\n\n风险评估是一个迭代过程。首先，初始风险评估确定需要通过设计安全架构以纳入适当安全控制来降低的风险。然后，必须进行评估以确认\
  \ resulting 系统的风险已降低到可接受水平。这与下面概述的原则一致进行。\n\n在安全架构过程中，可能某些控制的成本相对于系统预期收益而言是禁止性的。因此，可能需要重新考虑降低某些风险的决定，并以其他方式处理这些风险，通过系统重新设计来避免，或干脆放弃项目。\n\
  \n此外，安全服务于保护业务。安全架构师的工作是确保业务及其利益至少根据适用标准和法律得到保护，并满足任何相关的监管合规需求。有时，组织领导实现其目标的目标似乎与合规性冲突。作为安全团队中不可或缺的技术成员，倾向于集中于技术安全控制并尝试解决所有已知安全问题或要求。为安全而安全，虽然在智力上令人满意，但对组织是一种损害。我们必须始终记住，我们首先作为主题专家服务，了解相关法规或法律并能够在需要变更时确保我们组织的合规性。至于组织，同样的专业知识与领导层共同努力，以安全地推进组织的目标。\n\
  \n重要的是要记住，组织的战略必须与其使命、目标、目标和合规环境保持一致。当与业务保持一致并采用风险管理方法进行安全架构时，安全架构的成功更有可能实现。\n\n\
  ### 研究、实施和管理使用安全设计原则的工程流程\n\n系统和应用程序开发通常包括以下阶段：\n\n* 设计\n* 开发\n* 测试\n* 实施\n* 维护\n\
  * 退役\n\n应在前述每个阶段考虑安全开发原则，但在设计阶段前期解决安全问题最为关键。安全工程师经常被要求对现有系统进行改造，添加旨在保护系统及其数据的保密性、完整性和可用性的安全功能。虽然这通常是必要的，但最好将安全纳入设计过程（并在必要时随时间更新），主要有两个原因：\n\
  \n* 在整体功能系统设计开发时纳入安全比后期添加要便宜得多（后期添加通常需要对已开发组件进行重新设计，甚至重新工程）。\n* 安全控制的需求不仅是为了防止用户执行未经授权的操作，也是为了防止系统本身在响应用户请求时违反安全要求。如果安全不是整体设计的固有部分，就不可能完全调解所有可能损害安全的活动。\n\
  \n无论采用何种设计原则，任何安全架构的基础都是 1972 年由 James Anderson 在 *Computer Security Technology\
  \ Planning Study* （USAF） 中概述的基本要求：\n\n* 安全功能需要以防止其被绕过、规避或篡改的方式实现。\n* 安全功能需要在实施安全控制时始终被调用。\n\
  * 安全功能需要尽可能小，以便更有可能发现缺陷。\n\n#### ISO/IEC 19249\n\n\n\n\n\n在 2017 年，国际标准化组织（ISO）发布了标准\
  \ 19249 的首次修订版，“信息技术 — 安全技术 — 安全产品、系统和应用的架构与设计原则目录”。`ISO 19249` 的目标是描述用于促进系统和应用安全开发的架构和设计原则。`ISO\
  \ 19249` 规定了五项架构原则和五项设计原则。\n\n`ISO/IEC 19249` 的五项架构原则如下：\n\n*   域分离\n*   分层\n* \
  \  封装\n*   冗余\n*   虚拟化\n\n`ISO/IEC 19249` 的五项设计原则如下：\n\n*   最小权限\n*   攻击面最小化\n*\
  \   集中参数验证\n*   集中通用安全服务\n*   为错误和异常处理做好准备\n\n这些架构和设计原则建立在现有概念之上，并反映了对安全理论的许多新方法。以下各节将分别考察这些架构和设计原则。\n\
  \n## ISO/IEC 19249 架构原则\n\n在 `ISO/IEC 19249` 架构原则部分的引言中，技术规范描述了所有信息安全专业人士都熟知的首要挑战：在安全性和功能性之间找到难以平衡的平衡点。规范提出，要确保任何系统、项目或应用的安全，首先要采用其五项架构原则，然后再针对每个原则寻找功能性与安全性之间平衡的较易挑战。`ISO/IEC\
  \ 19249` 的架构原则在以下五个部分中进行[content]\n\n在 2017 年，国际标准化组织（ISO）发布了标准 19249 的首次修订版，“信息技术\
  \ — 安全技术 — 安全产品、系统和应用的架构与设计原则目录”。`ISO 19249` 的目标是描述用于促进系统和应用安全开发的架构和设计原则。`ISO 19249`\
  \ 规定了五项架构原则和五项设计原则。\n\nThe five architectural principles from `ISO/IEC 19249` are\
  \ as follows:\n\n*   Domain separation\n*   Layering\n*   Encapsulation\n*   Redundancy\n\
  *   Virtualization\n\nThe five design principles from `ISO/IEC 19249` are as follows:\n\
  \n*   Least privilege\n*   Attack surface minimization\n*   Centralized parameter\
  \ validation\n*   Centralized general security services\n*   Preparing for error\
  \ and exception handling\n\nThese architectural and design principles build on existing\
  \ concepts and reflect a number of new approaches to security theory. The following\
  \ sections examine each of these architectural and design principles.\n\n## ISO/IEC\
  \ 19249 Architectural Principles\n\nIn the introductory text of `ISO/IEC 19249`'s\
  \ architectural principles section, the technical specification describes the primary\
  \ challenge that all information security professionals know well: finding the difficult\
  \ balance between security and functionality. The specification proposes that the\
  \ way to secure any system, project, or application is to first adopt its five architectural\
  \ principles and then approach the easier challenge of finding the balance between\
  \ functionality and security for each principle. `ISO/IEC 19249`'s architectural\
  \ principles are examined in the following five sections.\n\n### `Domain Separation`\n\
  \nA `domain` is a concept that describes enclosing a group of components together\
  \ as a common entity. As a common entity, these components, be they resources, data,\
  \ or applications, can be assigned a common set of security attributes. The principle\
  \ of `domain separation` involves the following:\n\n*   Placing components that\
  \ share similar security attributes, such as privileges and access rights, in a\
  \ domain. That domain can then be assigned the necessary controls deemed pertinent\
  \ to its components.\n*   Only permitting separate domains to communicate over well-defined\
  \ and mediated communication channels e.g. application programming interfaces, or\
  \ `APIs`.\n\nIn networking, the principle of domain separation can be implemented\
  \ through network segmentation — putting devices that share similar access privileges\
  \ on the same distinct network, connected to other network segments using a firewall\
  \ or other device to mediate access between segments.\n\nOf particular concern are\
  \ systems in which privileges are not static — situations in which components of\
  \ a single domain, or entire domains, have privileges and access permissions that\
  \ can change dynamically. These designs need to be treated particularly carefully\
  \ to ensure that the appropriate mediations occur, based on the specific system\
  \ requirements at any given point in time.\n\nExamples where domain separation is\
  \ used in the real world include the following:\n\n*   A network is separated into\
  \ manageable and logical segments. Network traffic is handled according to policy\
  \ and routing control, based on the trust level and workflow between segments.\n\
  *   Data is separated into domains in the context of classification, categorization,\
  \ and security baseline. Even though data might come from disparate sources, if\
  \ that data is classified at the same level, the handling and security of that classification\
  \ level is accomplished with like security attributes.\n\n### `Layering`\n\n`Layering`\
  \ is the hierarchical structuring of a system into different levels of abstraction,\
  \ with higher levels relying upon services and functions provided by lower levels,\
  \ and lower levels hiding details of the underlying implementation from higher levels.\
  \ Layering is seen in network protocols, starting with the classic `OSI` seven-layer\
  \ model running from physical through to application layers.\n\nIn software systems,\
  \ one encounters operating system calls, upon which libraries are built, upon which\
  \ we build our programs. Within the operating system, higher-level functions such\
  \ as filesystem functions are built upon lower-level functions such as block disk\
  \ I/O functions.\n\nIn web applications we see this principle in the `n-tier` architecture\
  \ illustrated in Figure 3.1.\n\n![FIGURE 3.1 N-tier architecture](img/c03f001.png)\n\
  \n**FIGURE 3.1 `N-tier` architecture**\n\nThe purpose of layering is to do the following:\n\
  \n*   Create the ability to impose specific security policies at each layer\n* \
  \  Simplify functionality so that the correctness of its operation is more easily\
  \ validated\n\nFrom a security perspective:\n\n*   Higher levels always have the\
  \ same or less privilege than a lower level.\n*   If layering to provide security\
  \ controls, it must not be possible for a higher level to bypass an intermediate\
  \ level. For example, if a program is able to bypass the filesystem layer and issue\
  \ direct block-level I/O requests to the underlying disk storage device, then the\
  \ security policies enforced by the filesystem layer will be for naught.\n\nLayering\
  \ and domain separation are related techniques and work well together. A single\
  \ domain might have multiple layers to assist in structuring functions and validating\
  \ correctness. Alternatively, different layers might be implemented as different\
  \ domains. Or a combination of these might apply.\n\nAn example where layering is\
  \ used in the real world is a filesystem. The lowest layer, access to the raw disk,\
  \ provides only basic protection to the disk sectors. The next layer might be the\
  \ virtual or logical partitioning of the disk. Still higher layers would be the\
  \ filesystems as users browse the data, employing advanced access control features.\n\
  \n### `Encapsulation`\n\n`Encapsulation` is an architectural concept where objects\
  \ are accessed only through functions that logically separate functions that are\
  \ abstracted from their underlying object by inclusion or information hiding within\
  \ higher level objects. For example, raw disk reads/writes are abstracted away from\
  \ the user through several layers of encapsulation. The functions might be specific\
  \ to accessing or changing attributes about that object. The encapsulation functions\
  \ can define the security policy for that object and mediate all operations on that\
  \ object. As a whole, those functions act as sort of an agent for the object.\n\n\
  Proper encapsulation requires that all access or manipulation of the encapsulated\
  \ object must go through the encapsulation functions, and that it is not possible\
  \ to tamper with the encapsulation of the object or the security attributes of the\
  \ encapsulation functions.\n\nDevice drivers can be considered to use a form of\
  \ encapsulation in which a simpler and consistent interface is provided that hides\
  \ the details of a particular device, as well as the differences between similar\
  \ devices. Forcing interactions to occur through the abstract object increases the\
  \ assurance that information flows conform to the expected inputs and outputs.\n\
  \nAn example where encapsulation is used in the real world is the use of the `setuid\
  \ bit`. Typically, in `Linux` or any `Unix`-based operating system, a file has ownership\
  \ based on the person who created it, and an application runs based on the person\
  \ who launched it. A special mechanism, `setuid`, allows for a file or object to\
  \ be set with different privileges. Setting the `setuid bit` on a file will cause\
  \ it to open with the permission of whatever account you set it to be. The `setuid\
  \ bit` controls access, above and beyond the typical operation. That is an example\
  \ of encapsulation.\n\n\n\n\n\n### 冗余\n\n*冗余* 是通过复制组件并并行运行来设计系统，以便系统即使在出现错误或负载过高时仍能继续运行。从安全角度来看，冗余是解决可能影响可用性和完整性的妥协或问题的架构原则。\n\
  \n在复制数据存储的情况下，特别的挑战是确保一致性。对一个数据存储的状态更改必须可靠地复制到所有冗余数据存储中，否则冗余的目的就会被破坏，并且可能会产生潜在的安全漏洞。\n\
  \n要使冗余发挥作用，必须能够让整体系统检测到复制子系统之一中的错误。一旦检测到错误，该错误可能会被消除，或者错误会触发故障转移到冗余子系统。任何特定错误的处理方式取决于整体系统的能力。在某些情况下，仅仅拒绝操作并等待请求方重新发出请求就足够了（这次在仍在工作的冗余系统之一上）。在其他情况下，有必要撤销（回滚）中间状态更改，以便在正确功能的系统上重新尝试请求时，整体系统状态保持一致。\n\
  \n第一个例子是网站的负载均衡器。如果它失败并且无法处理网页请求，失败请求并等待用户重新加载页面就足够了。\n\n在请求涉及例如从一家银行的账户向另一家银行转账资金的情况下，如果在故障发生前资金已从第一个账户扣除，则有必要在失败并重试请求之前确保撤销该扣除。\n\
  \n现实世界中使用冗余的例子包括以下内容：\n\n* 高可用性解决方案，如集群，其中一个组件或系统在活动伙伴变得无法访问时接管\n* 具有冗余磁盘阵列 (`RAID`)\
  \ 配置的存储，其中数据被冗余并具有容错能力\n* 云存储，其中数据在多个数据中心、区域或区域中复制\n\n### 虚拟化\n\n*虚拟化* 是一种仿真形式，其中一个真实或模拟设备的功能在另一个设备上仿真。（这将在本章后面“了解信息系统的安全功能”部分中更详细地讨论。）\n\
  \n更常见的是，虚拟化是提供一个环境，该环境像单个专用计算机环境一样运行，但支持在同一物理硬件上运行多个此类环境。仿真可以在硬件级别运行，在这种情况下我们称之为虚拟机\
  \ (`VMs`)，或在操作系统级别运行，在这种情况下我们称之为容器。在任何一种示例中，虚拟化都涉及将硬件或软件的底层组件从最终用户抽象出来。\n\n虚拟化在现实世界中被广泛使用，以实现资源的最具成本效益利用，并根据业务需求进行扩展或缩减。云计算环境是当今虚拟化的最常见示例。\n\
  \n## ISO/IEC 19249 设计原则\n\n以下设计原则旨在帮助在系统设计期间识别和减轻风险。其中一些五个基本思想可以直接与目标系统或项目的<|message|>\n\
  \n\n\n\n集中式通用安全服务原则是对之前讨论的集中式参数验证原则的概括：通过一次性实现常用的安全功能，更容易确保安全控制措施已得到适当的审查和测试。集中精力验证少数集中式服务的正确运行，比验证本质上是相同控制的无数种实现更具成本效益。\n\
  \n现实世界中使用集中式安全服务的示例包括以下内容：\n* 集中式访问控制服务器\n* 集中式加密处理\n* 安全信息和事件管理（SIEM）\n* 安全编排、自动化和响应（SOAR）\n\
  \n### 为错误和异常处理做准备\n\n错误会发生。系统必须确保检测到错误并采取适当措施，无论是仅记录错误还是采取某些措施来减轻问题的影响。错误处理不应泄露信息，例如，通过在错误报告中显示堆栈跟踪或内部信息，从而可能披露机密信息或为攻击者提供有用信息。系统必须设计为安全失败（如后面所述），并且即使在发生错误时也始终保持安全状态。\n\
  \n错误也可能是入侵的指标。检测和报告此类错误可以实现快速响应，从而限制泄露范围。\n\n错误和异常处理在现实世界中使用的示例是开发应用程序以正确处理错误并做出相应的响应。例如，自动取款机（ATM）可能会使用错误处理来验证取款请求是否未超过账户余额，并在尝试此类取款时做出信息性提示。\n\
  \n### 威胁建模\n\n*威胁建模* 是一种流程，通过该流程可以识别潜在的安全威胁和漏洞，并对缓解措施进行优先级排序。威胁建模可用于帮助安全地开发应用程序或帮助降低已部署应用程序的风险。\n\
  \n威胁建模的方法有很多，但其中最常用的三种称为 STRIDE、DREAD 和 PASTA。\n\n#### STRIDE\n\n*STRIDE* 是一种在 90\
  \ 年代后期由微软开发的模型，用于帮助识别和分类计算机安全威胁。名称本身是以下六类安全威胁的助记符：\n* **欺骗：** *欺骗* 是一种攻击，在此期间个人或系统通过伪造信息冒充另一人或系统。强密码、多因素身份验证和数字签名是防止欺骗的常见控制措施。\n\
  * **篡改：** *数据篡改* 是通过恶意操纵数据对数据完整性发起的攻击。强大的访问控制以及彻底的日志记录和监控是防止和检测数据篡改的良好方法。\n* **抵赖：**\
  \ *抵赖* 是指一方否认其执行某项操作的能力。抵赖威胁发生在用户声称自己未执行某项操作，且没有证据证明其相反的情况时。数字签名和安全日志记录与审计是提供不可抵赖性的主要控制措施。\n\
  * **信息泄露：** *信息泄露* — 通常称为 *数据泄露* — 发生在信息被不当共享给未经授权的各方时。加密、数据丢失防护（DLP）和强大的访问控制是防止信息泄露的常见控制措施。\n\
  * **拒绝服务（DoS）：** *拒绝服务*（*DoS*）攻击涉及恶意行为者使系统或服务对合法用户不可用。系统冗余、网络过滤和资源限制是防止 DoS 攻击的常见保护措施。\n\
  * **权限提升：** *权限提升*（或 *特权升级*）发生在未特权应用程序用户能够将其权限升级为特权用户（如管理员）的权限时。强大的访问控制和输入验证是防止特权升级的常见保护措施。\n\
  \nSTRIDE 模型可作为回答“可能出现什么问题？”的起点，在系统开发或分析过程中使用。这六种安全威胁涵盖了可能损害机密性、完整性和可用性以及真实性和授权的广泛潜在问题。\n\
  \n#### DREAD\n\nDREAD 模型于 2002 年开发，是一种定量风险分析模型，通过为安全威胁的严重程度分配数值（通常为 1 到 10）来对其进行评级。DREAD\
  \ 是一个助记符，描述了五个关键点以及针对任何给定威胁必须回答的相关问题：\n* **损害：** 该威胁可能对您的业务造成的总损害程度是多少？\n* **可重现性：**\
  \ 对特定威胁的攻击可以多容易地被复制？\n* **可利用性：** 攻击者利用该威胁需要多少努力？\n* **受影响用户：** 有多少人，无论是在组织内部还是外部，会受到安全威胁的影响？\n\
  * **可发现性：** 漏洞可以多容易地被找到？\n\n一旦对这些类别进行评级，就会计算总和。给定风险的所有评级之和可用于对不同风险进行优先级排序。\n\n####\
  \ PASTA\n\n*攻击模拟与威胁分析流程*（PASTA）是一种七步风险为基础的威胁模型，于 2012 年开发，支持动态威胁分析。与严格 intended\
  \ 作为威胁识别框架的 STRIDE 不同，PASTA 方法论为识别和缓解威胁提供了一个健全的流程。PASTA 将业务目标与技术要求、系统风险和攻击建模集成。PASTA\
  \ 模型旨在提供应用程序和基础设施的攻击者中心视角，并帮助安全团队基于威胁枚举和影响分析制定缓解策略。\n\n以下是 PASTA 方法论的七个阶段：\n1. **定义目标。**\n\
  \   在此第一阶段，定义关键业务目标，并识别关键安全和合规要求。此外，还会进行初步业务影响分析（BIA）以识别潜在的业务影响考虑因素。\n2. **定义技术范围。**\n\
  \   在此阶段，定义技术环境边界以及需要进行威胁分析的所有技术资产的范围。除了应用程序边界之外，您还必须发现并记录所有基础设施、应用程序和软件依赖项。目标是捕获对所有服务器、主机、设备、应用程序、协议和需要保护的数据的高层次但全面的视图。\n\
  3. **应用程序分解。**\n   在此阶段，需要对所有资产（即应用程序组件）进行评估，并识别这些资产之间的数据流。作为此过程的一部分，所有应用程序入口点和信任边界都应被识别和定义。此阶段旨在建立对所有数据源、对这些数据源进行访问的各方以及应用程序内数据访问的所有用例的清晰理解\
  \ — 换句话说，谁应该对应用程序的哪些组件执行什么操作。\n4. **威胁分析。**\n\n\n\n\n\n本阶段旨在识别和分析系统内部的威胁信息，例如 SIEM\
  \ 馈送、Web 应用防火墙（WAF）日志等，以及与系统相关的外部可用的威胁情报。应识别并理解与特定应用程序、环境和数据相关的威胁攻击场景。本阶段的输出应包括针对给定应用程序或系统的最可能攻击向量列表。\n\
  \n### 5. 漏洞分析。\n在此阶段，应识别应用程序代码中的所有漏洞，并将其与步骤 4 中识别的威胁攻击场景相关联。应进行操作系统、应用程序、网络和数据库扫描，并评估动态和静态代码分析结果以枚举和评分现有漏洞。本阶段的主要输出是所有威胁攻击向量与现有漏洞和受影响资产的相关映射。\n\
  \n### 6. 攻击建模。\n在此阶段，对可能利用已识别漏洞（来自步骤 5）的攻击进行建模和模拟。这有助于确定每个已识别攻击向量的可能性和影响。完成此阶段后，您的组织应对应用程序的攻击面有深入的了解（即，在您的应用程序环境中，哪些坏事可能发生在哪些资产上）。\n\
  \n### 7. 风险和影响分析。\n在此最终阶段，应根据前六步执行的所有分析来完善您的业务影响分析（来自步骤 1）。应为补救措施确定风险的优先级，并制定风险缓解策略以识别所有剩余风险的对策。\n\
  \n### 安全默认值\n*安全默认值*（或*默认安全*）的概念本质上意味着系统应设计为在用户无需打开安全功能或以其他方式考虑安全配置的情况下即可实现最佳安全性。默认安全意味着系统的默认配置包含尽可能安全的设置，这可能并不总是功能最强的设置。例如，新的服务器默认情况下可能禁用端口\
  \ 80 和 443。虽然这种加固配置当然是最安全的，但如果不打开用于安全 Web 流量的端口 443，它将不会成为一个很好的 Web 服务器。关键在于，系统和应用程序应设计为最终用户（或系统管理员）必须主动选择根据业务需求和风险承受能力覆盖安全配置。\n\
  \n### 安全失败\n必须考虑系统在发生错误或异常时将如何表现。对于某些系统，*故障开放*设计，即在发生异常时系统继续允许访问，可能更可取，以确保在系统错误或异常期间仍可轻松访问重要信息。相反，*故障安全*（也称为*故障安全*或*故障关闭*）系统默认阻止访问，确保安全性优先于可用性。\n\
  对于具有敏感数据的系统，安全控制应设计为在没有明确配置设置相反的情况下，默认不允许该操作。访问应基于许可（例如，允许列表），而不是排除（例如，阻止列表）。这是“默认拒绝”防火墙规则背后的原理，也与最小权限的概念（在前面部分讨论过）相关。一般来说，最好设计系统，使其在检测到错误时以拒绝（或安全）的高安全状态失败，而不是以开放的、安全性较低的状态失败。\n\
  \n### 职责分离\n*职责分离*（SoD）要求两个（或更多）操作、参与者或组件以协调方式运行以执行安全敏感操作。此控制源自财务会计实践，多年来一直是防止欺诈的基础保护。将流程分解为由不同个人执行的多个步骤，或要求两个个人共同执行单个操作（称为*双重控制*）迫使恶意内部人员与多个内部人员串通以破坏系统。\n\
  需要两个或更多个人积极参与的安全控制比不需要的控制更稳健，也不太容易失败。虽然并非每个控制都适合职责分离，也并非每个风险都要求此类安全措施，但职责分离带来的冗余使得安全性不太可能因单一错误（或\
  \ rogue 行为者）而被破坏。\n\n### 保持简单\n复杂性是安全的敌人。系统越简单、越小，设计、评估和测试就越容易。当整个系统无法足够简化时，请考虑将问题分区，以便将风险最显著的组件分离并尽可能简化。这是*安全内核*的概念——一个小型独立子系统，具有安全关键组件，其余系统可以依赖它。\n\
  信息安全和密码学专家 Bruce Schneier 提出了以下观点（`www.schneier.com/news/archives/2016/04/bruce_schneier_build.html`）：\n\
  > *复杂性是安全的最大敌人。你让系统越复杂，它的安全性就越差，因为你会有更多漏洞并在系统中的某个地方犯更多错误。……我们能让系统越简单，它们就越安全。*\n\
  通过将安全功能分离到小型、隔离的组件中，仔细审查和测试代码是否存在安全漏洞的任务可以显著减少。\n\n### 信任，但需验证\n美国总统罗纳德·里根在 20 世纪\
  \ 80 年代末首次开始使用古老俄语谚语的英文翻译“信任，但需验证”。当时，里根总统用这句话来描述他在美国与苏联核裁军谈判中的谨慎态度。几十年后，“信任，但需验证”的格言被广泛用于描述需要额外验证和问责的情况。\n\
  在信息安全领域，“信任，但需验证”已用于描述使用边界防火墙和其他控制措施的做法，这些控制措施使用各方的身份、位置和其他特征来验证他们是来自受信任位置的受信任用户或系统——换句话说，“信任，但需验证”假设您公司防火墙后面的所有内容都是安全的，并验证通过该防火墙进入您网络的任何内容是否安全，基本上是“验证一次，永久信任”。近年来，这种安全模型已变得不那么受欢迎，取而代之的是零信任模型（将在下一节讨论）。\n\
  “信任，但需验证”一词在处理第三方或描述验证内部安全控制的操作和有效性的需要时也可能被口语化使用。如果在讨论“信任，但需验证”时有一个安全概念会浮现在脑海，那可能是审计的概念。与第三方（例如合作伙伴、云提供商或组织外部的任何其他人）合作时，需要一定程度的信任才能执行日常业务运营。“验证”的概念体现在您考虑定期审计这些关系以确保它们继续按协议和预期运行的需求时。这就是为什么云提供商例如会与希望定期验证\
  \ CSP 安全态势的客户共享合规报告和其他工件的原因。\n\n\n\n\n\n向内审视时，“信任但需核实”在我们评估和监控安全架构以确保持续合规和安全功能方面也发挥着重要作用——安全控制绝不应采取“设置后就忘”的方式。“信任但需核实”也体现在我们使用威胁情报产品和信息来判断潜在威胁是否可行时。最终，“信任但需核实”这一概念再次提醒我们，维护安全是一项永无止境的任务。\n\
  \n### Zero Trust\n\n零信任架构首次在 2010 年代初期被描述，此后已成为安全系统架构的主流方法，美国国家标准与技术研究院（NIST）在 2020\
  \ 年通过 `NIST SP 800-207`《零信任架构》正式化了指导方针。`Zero trust` 是一种安全模型，其前提是组织不应自动信任其边界内*或*外的任何事物——相反，必须在允许访问之前验证所有试图连接其系统的事物。这种模型与之前提到的“信任但需核实”模型有着巨大区别，后者是在激烈防御边界的同时假设网络内部的一切都是安全的。\n\
  \n零信任模型提倡“永不信任，始终验证”的思维，要求每个访问请求在授予访问权限之前必须经过完全的身份验证、授权和加密。采用这种方法，成功突破边界的攻击者在其网络内部横向移动的能力会大大降低，因为每个设备都受到其他设备的保护，从而减少了成功入侵的爆炸半径（或总体影响）。\n\
  \n零信任模型基于以下核心原则：\n\n*   **始终验证。** 基于用户身份、位置、系统健康状况（例如补丁级别）、数据分类、用户行为分析以及任何其他可用数据点，对每个访问请求进行身份验证和授权。\n\
  *   **使用最小权限访问。** 始终仅在即时 (`JIT`) 基础上分配特定访问请求所需的最低权限。\n*   **假设已遭入侵。** 不要信任网络上的设备，假设最坏情况（即你已经被入侵）并将爆炸半径降到最低以防止进一步损害。\n\
  \n预防是零信任的最大目标，而“始终验证”是其中的重要部分。身份应始终得到验证，并在可能的情况下使用强大的多因素身份验证 `MFA` 进行保护。访问网络的设备应在授予访问权限之前进行检查，以验证身份并确保其健康状况符合组织的安全要求。\n\
  \n请记住，用户和设备不应仅因其位于内部网络就被信任。所有内部通信都应加密，访问应按策略限制为最小权限，并应采用微分段来遏制威胁。`Microsegmentation`\
  \ 是一种网络安全技术，涉及将大型网络段划分为更小的区域，以将资源彼此隔离并最大限度地减少用户横向移动。如果发生入侵，微分段会将黑客限制在单个微分段内，使遏制和检测变得更容易。除了网络安全更改外，零信任架构还从基于边界的数据保护转向以数据为中心的数据保护，依赖于强大的数据分类和标记。最有效的零信任架构具有分类良好的数据，可为信任决策提供额外洞察。\n\
  \n尽管对预防措施有很大偏向，但侦测控制在成功的零信任架构中也发挥着重要作用。组织应部署实时监控以帮助检测和阻止攻击以及其他异常行为。实时分析还可以帮助为访问决策提供信息，通过为访问请求提供实时上下文并支持\
  \ `JIT` 权限（本章前面讨论过）。\n\n### Privacy by Design\n\n`Privacy by Design`（缩写为 `PbD`）是一种系统工程方法，最初由安大略省前信息与隐私专员\
  \ Ann Cavoukian 在 1990 年代开发，并在 2009 年后来正式化为框架；该框架侧重于扩展隐私增强技术的应用，并确立了七项基础原则（接下来讨论）。`Privacy-enhancing\
  \ technologies`（`PETs`）是支持数据保护和 `PbD` 的技术，通过最大限度地减少个人数据使用并最大化数据安全。\n\n`PbD` 涉及将隐私直接构建到系统或流程的设计、运营和管理中，而不是事后考虑隐私。七项\
  \ `PbD` 原则旨在确保个人数据的隐私，同时让用户对其个人信息拥有更多控制权。Cavoukian 提出的这七项原则总结如下：\n\n1.  **主动而非被动；预防而非补救：**\n\
  \    设计系统和流程以在隐私事件发生前主动采取行动，而不是事后行动。换句话说，在发生侵入性隐私事件之前就预见并防止它们，而不是依赖于在它们已经发生后才检测和响应。在设计和开发系统时，你应确定存在哪些隐私风险并为其做好计划，而不是以后再扑灭隐私火灾。\n\
  2.  **隐私作为默认设置：**\n    确保所有个人数据在所有 IT 系统或业务流程中自动受到保护，无需任何个人采取额外行动。该原则将隐私责任放在系统上，而非个人身上。实际示例包括匿名化或屏蔽个人信息，将对个人信息的访问限制在绝对需要的人（即最小权限），以及在不再需要时删除此类信息。\n\
  3.  **将隐私嵌入设计：**\n    隐私措施应完全集成到系统和相关流程中，而不是事后添加；隐私应被视为系统的核心功能。该原则的示例包括将加密和身份验证机制构建到系统中，而不是事后寻找添加这些功能的方法。\n\
  4.  **完整功能——正和而非零和：**\n    `PbD` 鼓励对所有合法系统设计目标采取“双赢”方法，并阻止做出不必要的权衡。隐私和安全都很重要——两者都可以并且应该实现。例如，互联网\
  \ cookie 提供了必要的网络功能，并且可以以安全和私密的方式实现。\n5.  **端到端安全——全生命周期保护：**\n    确保个人数据从摇篮到坟墓的安全和隐私；数据应在安全的方式下创建、管理和销毁。加密和身份验证是每个阶段的标准，但你应密切关注数据生命周期中可能需要的各种安全和隐私机制。\n\
  6.  **可见性和透明性——保持开放：**\n    这是一项“信任但需核实”原则（前面讨论过），旨在向所有利益相关者保证系统按预期安全运行并维护数据隐私。该原则最清晰的示例是建立一份完善记录的隐私政策并与所有受影响方共享。\n\
  7.  **尊重用户隐私——以用户为中心：**\n\n\n\n\n\n当一切说完做完时，隐私关乎用户，而这一原则强化了这一观念。系统架构师、开发人员和运营人员必须通过提供强大的隐私默认设置、适当的通知以及用户友好的体验，将个人的利益作为他们最优先的考虑。保持隐私以用户为中心最实用的方法之一是要求用户采取行动（例如，通过点击按钮或勾选复选框）以给予同意。\n\
  \n随着用户个人数据在各种系统和平台中不断 proliferate，隐私设计（PbD）继续成为安全系统架构和开发中的基础概念。众多私营公司已承诺遵守 PbD 原则，而像德勤这样的公司则提供服务来评估甚至认证组织对\
  \ PbD 原则的合规性。\n\n在美国，联邦贸易委员会（FTC）已将 PbD 认定为保护在线隐私的三大推荐做法之一，而迄今为止全球最大的隐私法规——欧盟通用数据保护条例（EU\
  \ GDPR）则将“通过设计的数据保护”和“通过默认的数据保护”作为其要求的一部分。\n\n### 共同责任\n\n`shared responsibility\
  \ model` 是云安全框架，描述了云服务提供商（CSP）及其客户在保持云系统和数据安全方面的义务。在传统的本地数据中心模式中，你的组织负责整个环境的安全——所有应用程序、服务器、物理资产等等。在云环境中，CSP\
  \ 承担了大部分运营负担，包括大量安全责任——但并非全部。具体责任划分因云提供商和云服务类型而异。我们将在本章后面（在“基于云的系统”部分）详细讨论共同责任的概念。\n\
  \n###纵深防御\n\n`Defense in depth`（或 `layered security`）是应用多种不同的安全技术和策略层来实现更大整体保护的概念。在信息安全领域，美国国家安全局（NSA）首次使用该短语来描述使用多种类型、位置和层级的防御，并结合检测和分析入侵的能力以便及时反应和缓解。\n\
  \n通过使用安全控制的组合，任何单一控制失效的影响可以被降低甚至消除。前面提到的许多安全原则都是纵深防御的类型。例如，职责分离确保敏感操作需要两个或更多个人的积极合作。对一个个人的妥协（通过\
  \ rogue 或恶意意图）不足以破坏系统。\n\n分层是分离系统组件的另一种方法：安全控制放置在层之间，防止攻击者在攻破一层后访问其他层。\n\n虽然冗余主要是一种通过复制系统或并行运行的组件来防止可用性损失的方法，但它也是通过串行复制安全控制来避免安全单点故障的一种方式。这意味着具有重叠的安全控制，使得一个控制的失效或被攻破本身不会导致暴露或被攻破。一个例子是即使服务器位于已配置为阻止相同端口的防火墙后面，仍使用\
  \ Linux `iptables` 阻止对某些端口的访问。如果对其中一个控制（防火墙或 `iptables`）的配置更改意外删除了 `deny` 规则（或添加了不适当的\
  \ `allow` 规则），`iptable` 或防火墙中的“冗余”控制仍将继续提供必要的保护。\n\n纵深防御与 `assumption of breach`\
  \ 概念相关，这意味着在假设一个或多个安全控制已被攻破的前提下管理安全。假设被入侵的心态将思维从仅仅专注于防御边界（或边界）转变为平衡的方法，建立多重防御，使一个控制被攻破不会立即导致成功入侵，并认为检测和缓解与预防同样重要。例如，考虑反恶意软件系统和电子邮件扫描应用程序已不再足够。端点安全应用程序，例如\
  \ Carbon Black，能够阻止任何未被先前识别为可信的执行——这一第二层安全展示了纵深防御的重要性。\n\n## 理解安全模型的基本概念\n\n`model`\
  \ 是对系统的假设性抽象，简化以便在不分析整个系统的复杂性和细节的情况下分析系统的某些方面。`security model` 是处理安全策略的模型。\n\n安全模型可以是正式的，旨在进行数学分析以协助验证系统是否符合特定策略，也可以是非正式的，用以说明和简化系统的评估，而无需证明的严谨性。安全模型可以在需求开发、信息资产分类和分类期间，以及在系统分析和测试期间成为有用的工具。\n\
  \n以结构化方式将安全需求编纂成安全模型可以帮助减少歧义和潜在的误解，即安全架构究竟试图实现什么。它将基本要求提炼为明确的规则，并在整个过程中分析设计，以确保这些规则得到遵守。确保安全架构符合设计良好的安全模型会大大增强其强度。\n\
  \n有趣的是，模型之间的侧重点差异可归因于每个模型的起源。为解决军事和政府的关注而开发的安全模型强调保密性为首要目标。与此同时，为商业实体或安全系统设计的模型可能侧重于数据的完整性，以防止欺诈或误导财务报告。尽管存在差异，本节其余部分讨论的每个安全模型都侧重于访问控制规则。\n\
  \n### 常见模型组件入门\n\n在检查安全模型时，了解许多安全模型共有的一些概念会有所帮助，特别是有限状态机和格。\n\n一个 `finite state\
  \ machine`（或只是 `state machine`）是一个概念计算机，可以处于有限数量的状态之一。计算机实现一个状态转换函数，根据当前状态和下一个输入确定下一个状态，并且可以可选地产生输出。Figure\
  \ 3.2 描绘了有限状态模型的通用示例。在此模型中，评估每个状态的保密性-完整性-可用性（CIA）属性可以确保系统以安全的方式运行。\n\n一个 `lattice`\
  \ 是一个具有偏序的有限集合。偏序是一种二元关系，具有自反性、反对称性和传递性。自反性意味着集合中的每个项目都可与自身比较。反对称性意味着没有两个不同的元素相互先行。传递性意味着如果\
  \ `a` 产生 `b`，并且 `b` 产生 `c`，那么 `a` 产生 `c`。\n\n![FIGURE 3.2 Finite state model](img/c03f002.png)\n\
  \n**FIGURE 3.2 Finite state model**\n\n简而言之，格安全模型执行以下操作：\n\n* 定义一组安全级别\n* 定义该集合的偏序\n\
  * 为每个主体（例如，用户或进程）和对象（例如，数据）分配一个安全级别\n\n\n\n\n\n* 定义了一组规则，规定主体基于主体和对象的<|message|>\
  \ 安全级别之间的关系可以对对象执行的操作\n\n### 信息流模型\n\n*信息流模型* 是一种访问控制模型，定义了信息 — 从一个应用程序到另一个应用程序，甚至从一个系统到另一个系统\
  \ — 的流动方式。在这些模型中，对象被分配一个安全分类，并且这些对象的流动方向或类型由安全策略控制。`Bell–LaPadula` 和 `Biba` 完整性模型，各自在后续章节中讨论，是信息流模型的常见示例。\n\
  \n### 非干扰模型\n\n*非干扰模型* 是信息流模型的发展，旨在确保系统上的对象和主体不会干扰同一系统上的其他对象和主体。在该模型下，任何在更高安全级别进行的活动都不得影响（或干扰）较低级别发生的活动。换句话说，主体\
  \ A（更高分类）的行为不应影响主体 B（较低分类），并且主体 B 也不应察觉到这些行为，从而可能让主体 B 得知主体 A 的行为。如果没有非干扰模型的保护，主体\
  \ B 可能能够推断出主体 A 的活动，这可能导致信息泄露（例如）。\n\n### Bell–LaPadula 模型\n\n最早的，也是最著名的格安全模型之一由\
  \ David Bell 和 Leonard LaPadula 发表，恰当地称为 `Bell–LaPadula`（BLP）模型。BLP 模型是一个保密性模型，规定了以下三条规则：\n\
  \n* **简单安全属性（ss 属性）：** 有时被称为 *向上不可读*，该规则阻止主体读取更高安全级别的对象。\n* **星号属性（* 属性）：** 有时被称为\
  \ *向下不可写*，该规则阻止主体向较低安全级别的对象写入。\n* **自主安全属性：** 如果访问矩阵（本节后面讨论）允许，主体可以对对象执行操作。\n\n\
  简单安全属性规则可防止未经授权的主体访问其无权读取的敏感信息。星号属性规则可防止授权主体通过向较低安全级别的对象写入敏感信息来破坏安全。\n\n举一个现实世界的例子，想象一下军队中的一名情报官，他拥有“机密”访问权限，这是一个介于“机密”和“绝密”之间的中级分类。根据简单安全属性规则，该军官只能读取机密和机密材料。根据星号属性规则，该军官只能写入绝密和机密。第一条规则不会使未经授权的材料可供军官访问，而第二条规则可防止军官意外地向权限较低的人员泄露未经授权的材料。图\
  \ 3.3 提供了这两个规则的图形视图。\n\n![FIGURE 3.3 Simple Security Property and Star Property\
  \ rules](img/c03f003.png)\n\n**FIGURE 3.3 Simple Security Property and Star Property\
  \ rules**\n\n自主安全属性规则在例如存在不同部门时很有用。假设我们的同一名军官可以在一个部门中读取机密和机密信息，但在其他部门中只能读取机密信息。同样，其他部门的情报官可能对其各自领域拥有更高的许可级别，但并非全部。在这种情况下，该模型允许使用访问矩阵，并且自主安全属性生效。\n\
  \n*访问矩阵* 为每个主体有一行，为每个对象有一列，并且主体行与对象列相交的单元格中的元素定义了允许执行的操作（即访问），如果有的话。表 3.1 提供了访问矩阵的示例。\n\
  \n**TABLE 3.1 An Example Access Matrix**\n\n| SUBJECTS || OBJECT 1 || OBJECT 2 |\n\
  | --- | --- | --- |\n| Subject A || `Read only` || `Read/Write` |\n| --- | --- |\
  \ --- |\n| Subject B || `No access` || `Write only (append)` |\n\n自主安全属性与另外两个强制访问控制一起运行。只有当三个属性都成立时，主体才能访问对象。\n\
  \nBell–LaPadula 模型没有很好解决的另外两个问题是：\n\n* 该模型侧重于保密性，正如人们所期望的那样，该模型是为了满足军事和政府组织的需要而开发的。它没有考虑信息完整性的风险。保护对象的完整性意味着防止对象被未经授权的、可能恶意的修改。在商业世界中，防止篡改财务记录以便促进欺诈比维护这些记录的保密性更重要。同样，在安全关键型应用中，例如自动驾驶汽车、机器人和某些医疗系统，完整性通常比保密性更重要。\n\
  * 该模型不处理隐蔽通道或以可能通过侧通道泄露机密信息的方式执行允许操作的可能性（例如，通过以可被其他、安全性较低的进程检测到的方式执行操作 — 例如消耗 CPU\
  \ 突发或导致虚拟机分页异常）。\n\n### Biba 完整性模型\n\n为了解决完整性问题，Kenneth Biba 提出了后来被称为 Biba 完整性模型的模型，该模型以与\
  \ BLP 模型类似的方式提出以下内容：\n\n* **简单完整性属性：** 有时被称为 *向下不可读*，该规则可防止从安全性较低的来源损害更安全信息的完整性。换句话说，如果更高完整性的进程读取并使用来自较低完整性来源的数据，则可能会产生不可信的结果。\n\
  * **星号完整性属性（* 完整性属性）：** 有时被称为 *向上不可写*，该规则可防止较不特权的主体破坏更安全的信息。\n\n图 3.4 说明了这些概念。\n\
  \n![FIGURE 3.4 Simple Integrity Property and Star Integrity Property rules](img/c03f004.png)\n\
  \n**FIGURE 3.4 Simple Integrity Property and Star Integrity Property rules**\n\n\
  ### Clark–Wilson 模型\n\nDavid Clark 和 David Wilson 认为，像 Biba 模型这样的格模型不足以保护数据的完整性。他们提出的方法是将安全模型基于商业世界在计算机出现之前就为防止欺诈而开发的两个概念：\n\
  \n* 良好形成的事务\n* 职责分离\n\n与 Bell LaPadula 和 Biba 模型不同，后者允许主体对其有写入权限的对象进行任何更改，Clark–Wilson\
  \ 的良好形成事务概念是主体仅限于进行那些维护数据完整性的更改。\n\n该模型原始论文中的示例是手工账簿，当簿记员用墨水书写时，错误是通过输入更正或反向分录来纠正的。账簿条目被擦除的迹象（鉴于使用不可擦除墨水，这很明显）将被检测为账簿完整性违规以及欺诈的可能迹象。\n\
  \n商业世界中职责分离的做法旨在确保交易的认证者与交易的发起者或实施者是不同的当事人。\n\n以下概念是 Clark–Wilson 模型的重要组成部分，值得熟悉：\n\
  \n\n\n\n\n*   **受限数据项 (CDI)：** 这是 Clark–Wilson 模型中的关键数据类型，指必须保持完整性的数据。\n*   **不受限数据项\
  \ (UDI)：** 这包括除 CDI 之外的所有数据，通常是系统输入。\n*   **完整性验证程序 (IVPs)：** 这些程序检查并确保所有 CDI 都是有效的。\n\
  *   **转换程序 (TPs)：** 这些程序执行系统的完整性策略并维护 CDI 的完整性。\n\n### Brewer–Nash 模型\n\nBrewer–Nash\
  \ 模型是为了实现道德壁垒安全策略而开发的。在商业世界中，存在旨在防止因内部知识而产生利益冲突的监管要求。这些规则要求组织建立屏障，防止掌握机密信息的人处于其知识可能不当影响其行动的地位。\n\
  \n例如，为银行工作的金融分析师在掌握与另一家竞争对手客户相关的内部知识时，不能为客户公司提供建议。同样，在允许律师事务所代表对立客户的国家，法规要求同一公司内部的两个法律团队之间存在道德壁垒。\n\
  \n回想一下，在 BLP 安全模型中，对数据的访问是基于主体和对象的属性来确定的。与 BLP 相比，Brewer–Nash 安全模型基于职责分离，如同建立道德壁垒。数据的访问必须受限于个人已获准访问的数据。\n\
  \nBrewer–Nash 模型定义了信息分层模型：\n*   与单个公司或客户相关的单个信息片段称为 `objects`，与 BLP 的用法保持一致。\n*\
  \   与同一公司（或客户）相关的所有对象都属于所谓的 `company data set`。\n*   同一行业（即为竞争对手）的所有公司数据集都属于所谓的\
  \ `conflict of interest class`。\n\n道德壁垒安全策略的目标是，人们只能访问不会因其已访问的信息而产生利益冲突的信息（`objects`）（例如，你不希望你的红队知道你的蓝队计划做什么，反之亦然）。因此，Brewer–Nash\
  \ 是一种动态访问控制模型，其会发生变化，而不是依赖于静态状态表。\n\n例如，假设有一名新金融分析师尚未访问其新雇主持有的任何信息，因此在 Brewer–Nash\
  \ (BN) 下可以自由访问任何公司数据集。分析师已访问 ACME Finance 的信息，并且可以自由访问存在于不同利益冲突类别中的信息，例如 BETA Chemicals。但如果他尝试访问与\
  \ Ajax Finance 关联的对象，而 Ajax Finance 与 ACME 处于同一利益冲突类别，BN 安全模型将禁止该访问。参见 Figure 3.5。\n\
  \n![FIGURE 3.5 Brewer–Nash security model](img/c03f005.png)\n\n**FIGURE 3.5 Brewer–Nash\
  \ security model**\n\n### Take-Grant 模型\n\n`Take-Grant model`（也称为 `Take-Grant protection\
  \ model`）是一种安全模型，指定实体（主体或对象）从一个实体获取权利并将其给予另一个实体的权利。该模型中有四条规则或操作，前两条不会令人意外：\n*  \
  \ **Take：** 允许主体获取（或获取）另一个对象的权利\n*   **Grant：** 允许主体给予（或授予）对象权利\n*   **Create：**\
  \ 允许主体生成（或创建）新对象\n*   **Remove：** 允许主体撤销（或删除）其对对象的权利\n\n## 基于系统安全要求的控制选择\n\n为信息系统选择适当的安全控制始于对安全要求进行分析。安全要求由以下因素决定：\n\
  *   对系统施加的任何监管或合规要求的分析（例如，美国的《联邦信息安全管理法》(FISMA) 等监管框架；欧盟的 GDPR 或美国的《健康保险流通与责任法》(HIPAA)\
  \ 等隐私立法；如支付卡行业数据安全标准 (PCI DSS) 等合同义务；或如 ISO 27001 认证或服务组织控制 (SOC) 1/2/3 审计等自愿合规计划）\n\
  *   对系统可能面临的威胁的分析（参见 Chapter 1 中“了解和应用威胁建模概念和方法”部分）\n*   对系统的风险评估（参见 Chapter 1 中“了解和应用风险管理概念”部分）\n\
  \n在某些情况下，对威胁和任何适用监管合规要求的分析将明确规定必要的最低控制集。例如，处理主账号 (PAN) 并处理银行卡交易的组织了解其系统必须符合 PCI\
  \ DSS。在其他情况下，如 GDPR 合规，需求更为模糊，安全架构师必须分析威胁、风险和受影响的利益相关者，以确定适当的一组控制措施来适当保护系统和数据。\n\
  \n如果组织尚未采用某个框架，从已建立的信息安全框架开始是有益的，例如 ISO 27001、NIST 特刊 800-37“风险管理框架”，或 NIST 网络安全框架\
  \ (CSF)、ISA624443 或 COBIT 5（仅举几例），这将有助于确保您已考虑控制措施的全部范围，并且您的流程是定义明确、可重复且一致的。\n\n\
  关于这些安全框架，有几点需要了解：\n*   它们不是强制性的。\n*   它们彼此并不互斥。\n*   它们不是详尽的（即，它们不涵盖所有安全问题）。\n*\
  \   它们与标准或控制清单不同。\n\n现在让我们扩展每个要点。\n\n框架不是强制性的。但随着组织采用或遵循框架，其后的一些文件或步骤可能涉及采取强制性行动。例如，一家寻求保护处理信用卡数据的系统的公司。当他们根据框架提示识别其系统及其风险时，组织将了解他们必须遵守\
  \ PCI DSS，这不是框架而是合规标准。从这里，组织可以深入了解一些所需的安全控制。\n\n信息安全框架彼此并不互斥。许多组织如 Cloud Security\
  \ Alliance、ISACA 和统一合规框架已在不同框架的控制之间开发了映射，使同时实现多个框架的合规性变得更容易。例如，当特定系统必须满足 PCI DSS\
  \ 要求，但整个组织已选择例如 ISO 27001 作为其信息安全管理系统的框架时，这可能是必要的。NIST 网络安全框架 (CSF) 就是一个在多个不同框架之间进行有用映射的例子。了解安全框架如何相互补充对于避免重复工作和冗余安全控制至关重要。\n\
  \n\n\n\n\n当然，框架并不旨在完全详尽。框架可以在行业或范围上专门化，也可以广泛适用。然而，即使是那些广泛适用的框架，也并非旨在覆盖你 100% 的安全控制。例如，NIST\
  \ CSF 被广泛认可为适用于几乎任何行业的通用安全框架。尽管其覆盖面广，CSF 仍遗漏了一个巨大的安全问题：物理安全。理解安全框架只是拼图的一部分，是选择你的安全控制时非常重要的一部分。\n\
  \n最后，请记住不要将框架与标准或控制清单混淆。框架、控制清单和标准是三个不同的概念。虽然框架是一种方法和策略，但标准是一组可量化的指导方向或规则。在大多数组织中，标准在逻辑上会遵循政策，就像强制性指示会遵循声明什么是强制性的法令一样。无论如何，在选择贵组织的安全控制时，请牢记这些差异。\n\
  \n所有框架的共同点是对保护系统任务采取一种包罗万象、总体性的[content]\n\n当然，框架并不旨在完全详尽。框架可以在行业或范围上专门化，也可以广泛适用。然而，即使是那些广泛适用的框架，也并非旨在覆盖你\
  \ 100% 的安全控制。例如，NIST CSF 被广泛认可为适用于几乎任何行业的通用安全框架。尽管其覆盖面广，CSF 仍遗漏了一个巨大的安全问题：物理安全。理解安全框架只是拼图的一部分，是选择你的安全控制时非常重要的一部分。\n\
  \n最后，请记住不要将框架与标准或控制清单混淆。框架、控制清单和标准是三个不同的概念。虽然框架是一种方法和策略，但标准是一组可量化的指导方向或规则。在大多数组织中，标准在逻辑上会遵循政策，就像强制性指示会遵循声明什么是强制性的法令一样。无论如何，在选择贵组织的安全控制时，请牢记这些差异。\n\
  \n所有框架的共同点是对保护系统任务采取一种包罗万象、总体性的做法。它们将该任务分解为可管理的阶段或步骤。例如，在最高层级，NIST SP 800-37《风险管理框架》将保护系统的任务分解如下：首先对系统进行分类（基于系统安全受影响时的影响），确定适当的安全控制，实施这些控制，评估其有效性，然后管理和监控系统。从这一分解来看，安全控制显然是保护系统的核心要素。这些控制是采用框架后实际执行的切实工作。\n\
  \n一旦你选择了框架，就需要审查所有控制，以确定哪些控制适合应对你已识别的风险。在某些情况下，框架本身会提供指导。例如，NIST SP 800-53 根据风险评估提供了三个级别的控制，称为\
  \ `initial control baselines`。威胁建模和风险评估也会提供有关哪些控制最为重要、需要优先于解决可能性和影响较低的漏洞的其他控制的信息。将所选框架中的所有控制都以相同的深度和成熟度水平实施是浪费时间、金钱和资源。一般目标是将所有风险降低到低于组织的风险阈值。这意味着某些控制必须彻底且完全实施，而其他控制可能根本不需要。\n\
  \n通常，框架会纳入一项安全标准，其中包含一组最低限度的安全控制，形成作为系统安全起点的推荐基线。基线中的范围指导确定了对控制的可接受偏差，从而形成符合组织风险承受能力的定制系统部署。\n\
  \n实施一种定义明确、可重复且业界认可的选择控制的方法，是贵组织能够证明在安全决策中尽到注意义务和勤勉义务的一种方式。\n\n当然，选择控制只是开始。你需要执行以下操作：\n\
  \n*   考虑该控制以及如何实施和调整以适应你的具体情况（“计划”阶段）\n*   实施控制（“执行”阶段）\n*   评估控制的有效性（“检查”阶段）\n\
  *   补救差距和缺陷（“行动”阶段）\n\n此计划-执行-检查-行动循环（也称为 PDCA 或戴明循环）当然是一个迭代过程。这在 ISO 27000:2009\
  \ 中被明确指出，但在后来的版本中仅被暗示。其他框架，例如 NIST 风险管理框架，也利用持续过程改进模型来塑造控制环境的效率和有效性。参见 Figure 3.6。\n\
  \n![FIGURE 3.6 Plan-Do-Check-Act cycle](img/c03f006.png)\n\n**FIGURE 3.6 Plan-Do-Check-Act\
  \ cycle**\n\n更频繁地，你需要（重新）评估控制的有效性，而在较不频繁但仍定期的基础上，你需要重新审视你对控制的选择。业务目标会发生变化。威胁态势会发生变化。你的风险也会发生变化。某一时点合适的控制集合（和级别）不太可能在一年或两年后仍然相同。正如与信息安全相关的所有事情一样，这绝不是设置后就无需关注的情况。\n\
  \n除了对控制选择的定期审查外，以下特定事件也值得对安全控制进行重新审视：\n\n*   安全事件或泄露\n*   组织结构发生重大变化或主要人员变动\n* \
  \  新产品或服务推出或停用\n*   新威胁或威胁行为者出现或发生重大变化\n*   信息系统或基础设施发生重大变化\n*   处理的信息类型发生重大变化\n\
  *   安全治理、风险管理框架或政策发生重大变化\n*   广泛的社会、经济或政治变化（例如，COVID-19）\n\n上述列表包括“经验教训”流程触发器的示例。强烈建议贵组织遵循定期和事件驱动的过程来评估控制的适用性和有效性。\n\
  \n安全框架也会定期更新，当它们更新时，需要考虑变化并相应调整。\n\n## 了解信息系统的安全能力\n\n存储和处理贵组织数据的一般信息系统通常包含一系列你应该熟悉的安全能力。了解这些能力对于正确评估它们并有效实施它们非常重要。其中一些最基础的信息系统安全（ISS）能力包括以下内容：\n\
  \n*   Memory protection\n*   Trusted Platform Modules (TPMs)\n*   Cryptographic\
  \ modules\n*   Hardware Security Modules (HSMs)\n\n### Memory Protection\n\n所有系统上允许多个程序同时运行的基本基础安全控制之一是\
  \ `memory protection`。此功能使操作系统能够同时将多个程序加载到主内存中，并防止一个程序引用未专门分配给它的内存。如果程序尝试引用其无权访问的内存地址，系统会阻止访问，挂起程序，并将控制权转移给操作系统。在大多数情况下，操作系统将终止违规程序。参见\
  \ Figure 3.7。\n\n![FIGURE 3.7 Operating system memory protection](img/c03f007.png)\n\
  \n**FIGURE 3.7 Operating system memory protection**\n\n支持内存保护所需的相关硬件功能是 `dual-mode\
  \ operation`。这意味着处理器可以在至少两种模式之一下运行：特权（或内核）模式和非特权（或用户）模式。操作系统在特权模式下运行，这授予其设置和控制内存保护子系统的权限。特权模式还允许操作系统执行控制处理器环境的特殊特权指令。\n\
  \n一旦程序已加载到内存中，并且内存保护已配置为限制该程序仅访问操作系统分配给它的内存区域，操作系统就会将控制权转移给该程序，同时同时转换到非特权模式。\n\n\
  \n\n\n\nThe program runs in unprivileged mode, which limits it to accessing only\
  \ the specific memory area dictated by the operating system. Should it make an illegal\
  \ memory reference, attempt to execute a privileged CPU instruction, or use up the\
  \ time slice granted to it by the operating system, control is returned to the operating\
  \ system (running in privileged mode).\n\nThe operating system determines if control\
  \ has been returned to the operating system because of an illegal operation by the\
  \ user program, and decides how to handle the transgression (i.e., returning control\
  \ to the user program with an error indication or terminating the program).\n\n\
  Another security control, `address space layout randomization` (`ASLR`), seeks to\
  \ mitigate the risks of predictable memory address location. The location in memory\
  \ for a known instruction becomes a risk when there is a threat of exploiting that\
  \ location for an attack. For example, a buffer overflow attack requires knowing\
  \ two things: the exact amount by which to overflow the memory to facilitate executing\
  \ malicious code, and where exactly to send the overflow. `ASLR` defeats the second\
  \ item by randomizing the location.\n\nWhatever the approach or specific technical\
  \ control, the need to protect memory is both fundamental and critical to securing\
  \ information systems.\n\n### Potential Weaknesses\n\nProper memory protection relies\
  \ upon both the correct operation of the hardware and the correct design of the\
  \ operating system that uses the underlying memory protection hardware to prevent\
  \ programs from accessing memory they have not been given permission to access.\
  \ A defect in either can compromise the security provided by memory protection.\n\
  \nNote that this protection prevents the direct disclosure of memory contents that\
  \ are blocked from an unauthorized program, but does not necessarily prevent side-channel\
  \ exploits from revealing information about memory that is protected from access.\n\
  \nAttacks that leverage ineffective isolation and memory protection can have catastrophic\
  \ effects. As the `Spectre` and `Meltdown` exploits in 2018 revealed, flaws in the\
  \ design of Intel and some other CPU chips permitted clever programming techniques\
  \ to deduce the contents of memory locations that those programs were not permitted\
  \ to access directly.\n\n### Secure Cryptoprocessor\n\nThe challenge with standard\
  \ microprocessors is that code running with the highest privilege can access any\
  \ device and any memory location, meaning that the security of the system depends\
  \ entirely on the security of all the software operating at that privilege level.\
  \ If that software is defective or can be compromised, then the fundamental security\
  \ of everything done on that processor becomes suspect.\n\nTo address this problem,\
  \ hardware modules called `secure cryptoprocessors` have been developed that are\
  \ resistant to hardware tampering and that have a limited interface (i.e., attack\
  \ surface), making it easier to verify the integrity and secure operation of the\
  \ (limited) code running on the cryptoprocessor.\n\nCryptoprocessors are used to\
  \ provide services such as the following:\n\n* Hardware-based true random number\
  \ generators (`TRNGs`)\n* Secure generation of keys using the embedded `TRNG`\n\
  * Secure storage of keys that are not externally accessible\n* Encryption and digital\
  \ signing using internally secured keys\n* High-speed encryption, offloading the\
  \ main processor from the computational burden of cryptographic operations\n\nThe\
  \ following are features of cryptoprocessors that enhance their security over standard\
  \ microprocessors (that could do most of the above in software):\n\n* Tamper detection\
  \ with automatic destruction of storage in the event of tampering, and a design\
  \ that makes it difficult to tamper with the device without leaving obvious traces\
  \ of the physical compromise. These protections can range from tamper-evident stickers\
  \ that clearly show attempts to access the device's internal components to secure\
  \ enclosures that detect unauthorized attempts to open the device and automatically\
  \ erase or destroy sensitive key material.\n* Chip design features such as shield\
  \ layers to prevent eavesdropping on internal signals using ion probes or other\
  \ microscopic devices.\n* A hardware-based cryptographic accelerator (i.e., specialized\
  \ instructions or logic to increase the performance of standard cryptographic algorithms\
  \ such as `AES`, `SHA`, `RSA`, `ECC`, `DSA`, and `ECDSA`, which are discussed in\
  \ detail later in this chapter).\n* A trusted boot process that validates the initial\
  \ boot firmware and operating system load.\n\nThere are many types of secure cryptoprocessors\
  \ such as:\n\n* Proprietary, such as Apple's “`Secure Enclave`” found in iPhones\n\
  * Open standard, such as the `TPM` as specified by the `ISO/IEC 11889` standard\
  \ and used in some laptops and servers\n* Standalone (e.g., separate standalone\
  \ device with external communications ports)\n* Smartcards\n\nSome of these are\
  \ discussed further in the following sections.\n\n### Trusted Platform Module\n\n\
  A `TPM` is a secure cryptoprocessor that provides secure storage and cryptographic\
  \ services as specified by `ISO/IEC 11889` (see Figure 3.8).\n\n![FIGURE 3.8 Trusted\
  \ Platform Module processes](img/c03f008.png)\n\n**FIGURE 3.8 Trusted Platform Module\
  \ processes**\n\nA `TPM` is essentially a security chip that is hardwired into a\
  \ system (e.g., on a motherboard). At its core, a `TPM` is responsible for the following\
  \ functions:\n\n* **Attestation:** Creates a cryptographic hash of the system's\
  \ known good hardware and software state, allowing third-party verification of the\
  \ system's integrity\n* **Binding:** Encrypts data using a cryptographic key that\
  \ is uniquely associated with (or bound to) the system\n* **Sealing:** Ensures that\
  \ ciphertext can be decrypted only if the system is attested to be in a known good\
  \ state\n\nA `TPM` can be used by the operating system, processor `BIOS`, or application\
  \ (if the OS provides access to the `TPM`) to provide a number of cryptographic\
  \ and security services such as:\n\n* Generate private/public key pairs such that\
  \ the private key never leaves the `TPM` in plaintext, substantially increasing\
  \ the security related to the private key.\n  (Public/private keys are discussed\
  \ in more detail later in this chapter.)\n* Digitally sign data using a private\
  \ key that is stored on the `TPM` and that never leaves the confines of the `TPM`,\
  \ significantly decreasing the possibility that the key can become known by an attacker\
  \ and used to forge identities and launch man-in-the-middle (`MITM`) attacks. (Digital\
  \ signatures are discussed later in this chapter.)\n* Encrypt data such that it\
  \ can only be decrypted using the same `TPM`.\n* Verify the state of the machine\
  \ the `TPM` is installed on to detect certain forms of tampering (i.e., with the\
  \ `BIOS`) and ensure platform integrity.\n\n#### Potential Weaknesses\n\nThe `endorsement\
  \ key` (`EK`) is a fundamental component of a `TPM`'s security. This key is generated\
  \ by the `TPM` manufacturer and burned into the `TPM` hardware during the manufacturing\
  \ process. Because of this, the user/system owner depends upon the security of the\
  \ `TPM` manufacturer to ensure that the `PEK` remains confidential.\n\n\n\n\n\n\
  我们还依赖于 TPM 制造商流程的质量。2017 年底，有报道称英飞凌（Infineon）用于其智能卡和 TPM 产品线的软件库存在缺陷，该缺陷使得可以推导出内部存储的私钥。结果，数百万个加密密钥变得不可靠且易受攻击。攻击者仅通过访问公钥部分就能计算出账户持有者密钥的私钥部分。不幸的是，发生了什么事是黑客冒充合法用户，而他们拥有私钥所提供的保证和不可否认性。此漏洞和其他漏洞不断提醒我们供应链风险管理计划的重要性，该计划评估供应商和其他第三方的安全风险。请注意您的软件和硬件来自何处，并确保您采取适当的预防措施（即尽职调查）来保护您的数据安全。\n\
  \n### 加密模块\n\n`cryptographic module` 通常是一种硬件设备，用于实现密钥生成和其他加密功能，并嵌入到更大的系统中。\n\n使用加密模块而非从加密软件库获得等效功能的优点包括以下内容：\n\
  \n* 通过在专用于此目的的独立设备上执行关键的加密功能，使恶意软件或其他基于软件的攻击破坏加密操作安全变得困难得多。\n* 通过将安全敏感功能隔离在接口和攻击面有限的隔离设备中，更容易提供关于设备安全操作的保证。它也使得通过将加密模块嵌入到更大的系统中，更容易为更大的系统提供安全功能。\n\
  * 通过将加密功能分离到单独的模块中，您可以获得非加密专用资源的可用性增加。\n* 大多数安全加密模块包含物理安全保护，包括防篡改和篡改检测，即使设备已被物理入侵，也很难破坏设备的安全性。\n\
  * 一些加密模块可以强制执行职责分离，以便某些敏感操作，例如操作密钥存储，只能在两个不同个人的合作下完成，他们分别向加密模块进行身份验证。\n\n一些政府组织已发布与加密模块安全相关的标准，并建立了评估和认证流程，以便制造商可以由独立第三方验证其设备的安全性，用户也可以对使用该模块为其更大系统提供的<|message|>\n\
  \n\n\n\n*   验证或清理从服务器接收到的数据\n*   防止与服务器交换的数据被窃听\n*   检测与服务器交换的数据是否被篡改\n*   在执行或根据从服务器接收到的信息采取行动之前，验证从服务器接收到的命令或代码\n\
  \n为解决这些漏洞，可以考虑以下措施：\n\n*   评估操作系统和应用程序是否存在未修补的软件或不安全的配置\n*   使用公认的安全协议（例如，传输层安全（TLS））来验证服务器的身份，并防止与服务器通信的数据被窃听和篡改\n\
  *   使用适当编码技术以确保从服务器接收到的数据或命令有效且一致\n*   使用数字签名在执行前验证从服务器接收到的可执行代码\n\n在许多情况下，客户端可能会使用软件库、applet\
  \ 或应用程序来处理从服务器接收到的数据。例如，客户端可能依赖图像显示组件来允许查看文件。这些组件（例如，Flash、Java Development Kit\
  \ 等）通常由第三方提供，因此需要成为漏洞管理计划的一部分，以便在发现漏洞后能够及时修补。\n\n如果客户端是浏览器，则浏览器应根据主要网络浏览器的加固指南进行配置。同样，需要采取适当的步骤来保护和修补运行客户端软件的底层系统。浏览器和客户端操作系统的此类指导的优秀来源包括互联网安全中心（CIS）和国防信息系统局的安全技术实施指南。\n\
  \n客户端系统还需要根据风险评估和威胁建模适当地防范其他威胁。这可能包括防火墙、物理安全控制、全磁盘加密等等。\n\n如果软件是专门为此应用程序开发的，则必须采用第\
  \ 8 章中所述的适当安全软件开发流程。\n\n## Server-Based Systems\n\n服务器漏洞与前面描述的许多漏洞类似，只是从服务器的角度来看。重要的是要记住，客户端和服务器系统通常是相似的；*client*\
  \ 和 *server* 术语仅表示系统在整体系统操作中扮演的角色。\n\n服务器需要验证客户端的身份和/或客户端用户的身份。这可以通过使用身份和访问管理（IAM）技术与安全通信协议（如\
  \ TLS）相结合，使用客户端证书来实现。TLS 还将保护服务器免受窃听和篡改，例如可能由 MITM 攻击造成的。服务器还必须验证所有输入，并且不能假设仅仅因为来自客户端的命令和数据来自（并且已被相应的客户端软件验证）客户端，它们就是有效且已被清理的。客户端必须被视为不可信，并且必须假设客户端端可以在加密并通过安全（例如\
  \ TLS）链路传输之前插入或修改命令或数据。根据环境的性质，使用速率限制、CAPTCHA 和其他方法等技术来保护服务器免受 DoS 攻击可能是合适的。\n\n\
  当然，需要漏洞管理计划以确保更新和补丁能够及时应用。这无论服务器端软件是在内部开发还是部分或完全基于从第三方获得的软件（例如商业现成软件，或 COTS）都适用。\n\
  \n如果软件是专门为此应用程序开发的，则必须采用适当的<|message|> 安全软件开发流程。这包括确保服务器应用程序仅以必要的最小权限运行，通常理解为“最小权限原则”。如果需要提升权限，则服务器以提升权限运行的时间段被最小化。最佳实践包括服务器使用文件系统所有权和权限以避免数据泄露，记录和监控适当的信息（例如成功和失败的登录尝试、特权访问等），并捕获取证信息以允许对可能的或实际的安全事件进行分析。\n\
  \n最后，还需要解决对服务器本身的威胁。这可能包括物理和环境威胁、通信基础设施的威胁，以及根据行业建议进行服务器加固，例如由 CIS 推广的建议（`www.cisecurity.org/cis-benchmarks`）或收集并编入索引到\
  \ NIST 的国家检查表计划存储库（`nvd.nist.gov/ncp/repository`）中的建议。\n\n## Database Systems\n\n\
  保护数据库系统是前面章节中讨论的更一般服务器系统安全的一个特例。如果数据库可通过网络访问，则所有在那里讨论的安全控制以及下面概述的控制都适用。如果数据库不可通过网络访问，则风险较少，一些服务器安全控制可能不需要。数据库特定安全控制包括以下内容：\n\
  \n*   查阅所使用数据库系统的 CIS 加固指南。这些指南包括以下许多建议，以及其他建议。\n*   仅安装或启用应用程序所需的数据库系统组件。\n*  \
  \ 将数据存储和日志文件放在非系统分区上。\n*   在数据库目录、数据存储、日志和证书文件上设置适当的文件系统权限。\n*   使用专用无特权账户在专用服务器上运行数据库服务。\n\
  *   禁用命令历史记录。\n*   不要使用环境变量、命令行或数据库配置文件来传递身份验证凭据。\n*   不要在不同应用程序之间重复使用数据库账户名称。\n\
  *   禁用“匿名”账户（如果数据库支持）。\n*   如果访问或复制流量通过不可信网络传输，则强制所有连接使用 TLS。\n*   为每个数据库实例使用唯一的证书。\n\
  *   使用受限视图。\n*   确保所有 DBMS 厂商提供的示例或测试数据库已被移除或无法从用户端点和客户端访问。\n*   更改所有默认密码，确保所有账户都有安全密码，并考虑启用多因素或基于证书的身份验证（如果受支持）。\n\
  *   确保用户账户权限已根据最小权限原则分配，并与企业范围的访问控制策略和程序保持一致。数据库权限可能很复杂且以意想不到的方式交互——避免默认角色，并仅定义所需权限的角色。\n\
  *   禁用或删除不需要的账户，特别是具有管理权限的账户。\n*   根据最佳实践管理所有账户（参见第 5 章）。\n*   启用敏感操作的日志记录，并将日志路由到日志监控和警报系统。\n\
  *   在可能的情况下使用 `bind` 变量以最小化注入攻击面。\n\n\n\n\n\n*   为每位管理员分配唯一的管理员账户（即不要在多个管理员之间共享管理员账户）。仔细考虑基于风险、基于角色的方法，以支持最小权限和职责分离模型，其中每个管理员仅拥有履行其特定职责所需的管理员权限。在可能的情况下，确保关键操作需要两位管理员的合作。\n\
  \n*   以足够详细的级别启用日志记录，以提供识别与安全事件相关事件原因所需的取证信息（但确保日志不包含密码），并通过数据库系统本身的权限或通过实时将日志数据传输到单独的安全日志系统来保护日志免受数据库管理员的篡改。\n\
  \n*   查阅供应商数据库文档以了解数据库特定的安全控制。例如，Oracle 支持一种称为 `data dictionary protection` 的控制，它提供额外的最小权限控制级别，将某些操作限制为具有数据库管理员权限的子集）。\n\
  \n*   对于仅通过应用程序软件访问的数据库（例如典型的 `n`-tier Web 服务器应用程序），仅在仅可供需要访问的业务逻辑服务器访问的私有网络上运行数据库。\n\
  \n数据库加密值得特别关注。静态数据的加密可以在以下任意（或全部）几个不同级别进行：\n\n*   最低级别的全磁盘加密（FDE）可保护存储介质上的所有数据，防止驱动器本身的物理盗窃或丢失。它无法保护具有对系统逻辑访问的威胁行为者，因为操作系统或驱动器本身会在将数据传递给应用程序之前解密从存储介质读取的所有数据，而不会考虑请求者的身份（除访问文件的权限外）。这可以通过固件（自加密驱动器）或通过操作系统（例如\
  \ BitLocker）实现。\n\n*   文件系统级加密允许加密在文件系统级别发生。这可以根据操作系统的功能在卷、目录或文件级别进行。\n\n*   透明数据加密（TDE）可保护那些直接访问文件系统（即“root”用户）但无权访问数据库系统和特定数据库项的人员的数据。它无法防止恶意数据库管理员或能够绕过应用程序级控制并直接发出数据库访问命令的攻击，例如\
  \ SQL 注入。虽然 TDE 提供的保护超过了 FDE，但它无法缓解的重大漏洞仍然存在，因此不建议单独使用。另请注意，对于某些数据库系统，如果攻击者同时获取操作系统映像和\
  \ TDE 保护的数据库，则可以提取未加密的内容。单元格级加密（CLE）或应用程序级加密（接下来介绍）是必要的，以防止 TDE 未解决的威胁。\n\n*   CLE\
  \ 在单元格或列级别加密数据库信息。通过这种方法，数据在从数据库读取时仍保持加密状态，仅在请求时才解密。它还允许用户对加密密钥进行非常精细的控制。这种额外的安全性和灵活性并非没有缺点。密钥管理以及处理解密/加密请求可能会给应用程序增加相当大的复杂性，并且根据查询类型（以及是否包含\
  \ CLE 保护的数据），性能可能会受到影响，有时影响很大。\n\n应用程序级加密是一种高级方法，即使数据库系统被入侵也能提供保护。在这种情况下，业务逻辑或应用程序层负责在数据传递到数据库之前加密要保护的数据，并在检索后对其进行解密。数据库本身只能看到二进制数据，并且无法访问加密密钥。这种方法是最复杂的，但如果正确实施和管理，则比其他方法提供更高的安全性。为了最大化这种方法的好处，应用程序应尽可能早地加密，尽可能晚地解密。换句话说，应尽可能靠近使用点处理加密/解密。例如，如果您的服务器端应用程序有多个层（请参阅\
  \ Figure 3.1），则加密组件应从 `business-logic layer` 调用，而不是存储管理层。请注意，如果完全在数据库外部执行解密，则某些数据库功能将不可用（例如某些类型的搜索）。选择使用哪种数据库加密方法的组合将受到以下等因素的影响：\n\
  \n*   性能，尤其是如果搜索引用使用 CLE 加密的数据。\n\n*   备份，将使用 TDE 或 CLE 保护，但在使用 FDE 时不一定会受到保护（除非备份位于另一个\
  \ FDE 保护的驱动器上）。\n\n*   压缩，因为加密数据无法压缩，所以使用加密可能会显著增加备份的大小。某些数据库支持在压缩前解密数据，然后重新加密，以便备份既压缩又加密。然而，这可能会在过程中引入其他漏洞。\n\
  \n### Cryptographic Systems\n\n正如美国密码学家 Bruce Schneier 所说：“所有密码学最终都会被破解——唯一的问题是需要多少努力。”因此挑战在于权衡加密信息对攻击者的价值与破坏密码系统所需的努力程度。在做出这一决定时，潜在攻击者有多种途径可以破坏密码系统。这些包括以下内容：\n\
  \n*   算法和协议弱点\n\n*   实现弱点\n\n*   密钥管理漏洞\n\n顺便说一下，有一些国家严格监管密码学的使用，而另一些国家虽然允许不受限制地\
  \ `use` 密码学，但却监管密码技术出口。对这些问题的详细讨论超出了本文的范围，但安全架构师在必须熟悉适用的立法限制时需要考虑这些问题。有关与信息安全相关的立法合规问题的更多信息，请参阅\
  \ Chapter 1。\n\n以下各节将探讨密码系统的这些漏洞，本章后面的“Select and Determine Cryptographic Solutions”部分将进一步研究密码学。\n\
  \n#### Algorithm and Protocol Weaknesses\n\n\n\n\n# 设计安全的密码算法和协议\n\n设计安全的密码算法或协议是困难的，只有经过众多专家仔细审查并经受住时间考验的算法才应该被使用。一个具有很强安全潜力的良好密码算法库是那些在由\
  \ NIST 等组织主办的公开多年竞赛中被审查的算法。竞赛的获胜者会受到全球密码学家的仔细审查。此类算法会被 scrutinize 以识别任何弱点或后门。当然，需要如此严格审查的残酷现实是，最有能力和资金充足的威胁行为者往往将自己定位为安全算法的倡导者。例如，请参阅即将出现的侧边栏“双椭圆曲线确定性随机比特生成器（Dual\
  \ EC DBRG）”。作为同行审查如何真正进行的例子，请考虑对称密码学取得的进展：当前推荐的算法（高级加密标准，即 AES）是由一群比利时密码学家开发的，并在被批准之前经历了多年的严格审查。\n\
  \n接下来要认识到，随着计算能力的提升和对算法和协议分析时间的增加，以前稳健的密码学方法中的弱点将被发现。密码学永远不会变得更强；它只会随着时间的推移而变弱，因此通过其生命周期管理密码产品至关重要。有很多例子。NIST\
  \ 选择的第一个对称密码算法数据加密标准（DES）由 IBM 在 20 世纪 70 年代初开发，1977 年获批，1999 年被公开破解。安全散列算法（SHA-1）于\
  \ 1996 年获批，首次于 2011 年被弃用。2020 年初，安全研究人员宣布他们已完全且实际地破解了 SHA-1 算法，通过识别碰撞攻击，认为其不适合任何实际用途。\n\
  \n未来，量子计算固有的性能提升将使某些目前对暴力攻击具有抵抗力的密码算法面临被攻破的风险。量子计算直到最近才完全是幻想，实际应用仍属新事物。然而，未来会很快到来，因为专家们声称广泛的商业用途可能在未来几年内即可实现。鉴于量子计算能够在几秒内解决某些问题，量子计算对加密的可持续性构成重大威胁。\n\
  \n研究人员正在努力开发抗量子算法。NIST 运行后量子密码学计划和竞赛，旨在到 2024 年建立后量子密码学标准。截至 2020 年 7 月，竞赛已进入第三轮，仍有七种加密和签名方案在评估中。也有欧洲组织（如\
  \ ETSI 和欧盟的 PQCrypto 项目）正在研究密码学的后量子方法。\n\n密码协议的故事也类似。保护 HTTPS 网络流量的原始协议是安全套接层（SSL）。第一个版本被发现存在漏洞，因此甚至未公开发布。2.0\
  \ 版修复了该问题，于 1995 年发布，并在次年被发现存在漏洞。其替代品 3.0 表现稍好，被认为安全，直到 2014 年 POODLE 漏洞被披露为止。由此可以得出以下结论：\n\
  \n* 密码学很难，即使是专家也会出错。\n* 密码攻击面不仅包括算法，还包括实现密码保护的人员、流程和技术，所有这些都可能受到攻击。\n* 由于计算进步、数学突破以及密码分析方法的其他改进，密码分析随着时间的推移变得更有效。\n\
  \n由于时间会侵蚀密码保护的安全性，安全架构师在选择密码方法时必须考虑加密数据的生命周期，尤其是在选择合适的算法和密钥长度时。对于生命周期仅一两年的数据来说合适的选择，如果数据需要保密数十年，则可能不是正确的选择。在这种情况下，针对必须长期归档数据的系统应用补偿控制措施可能是设计系统以允许根据信息风险评估的要求更改密码算法并重新加密数据。\n\
  \n## 实现弱点\n\n设计安全的密码算法或协议不仅困难，安全地实现算法也并不容易。使用行业标准且经过测试的算法，并在已发布的库中实现。不要自己发明或实现算法。\n\
  \n*侧信道攻击*是对与算法实现相关的工件的分析，例如算法执行所需的时间、运行密码实现的设备消耗的电功率，或设备释放的电磁辐射。更多细节可在“了解密码分析攻击方法”部分找到。\n\
  \n由于检测不干扰密码系统操作的攻击是困难的，因此抵御侧信道攻击通常很困难。最好的防御方法是使用经过时间检验的、针对侧信道信息泄露进行了测试的标准密码库。\n\n\
  还有一些步骤可以采取以最大限度地减少通过侧信道泄露信息的可能性。例如（这只是等待不慎开发者的众多实现陷阱的部分列表）：\n\n* 使用恒定时间比较例程比较秘密字符串（例如，密钥、明文、未哈希的密码）\n\
  * 避免分支或循环计数依赖于秘密数据\n* 避免使用秘密数据索引查找表或数组\n* 使用强（即“密码级”）随机数生成器\n\n还需要意识到编译器优化可能会更改或删除代码，从而引入侧信道漏洞。系统安全需求需要识别这些可能的弱点，而测试和代码验证需要验证它们是否已得到充分解决。\n\
  \n即使是经过安全实现、可靠的密码算法，也可能因使用不当而引入漏洞。\n\n对于使用 IV 的算法（请参阅“WEP：设计缺陷案例研究”侧边栏了解 IV 是什么），IV\
  \ 必须正确选择以保护加密数据流。通常，这意味着它必须是加密随机且唯一的，并且长度足够（即不会在后续消息中重复使用）。\n\n分组密码可以用多种不同的模式使用（本章后面会讨论），其中一些在使用某些类型数据时可能会泄露大量信息。选择正确的模式与选择分组密码本身一样重要。\n\
  \n## 密钥管理漏洞\n\n通过对密码密钥的不当使用、存储和管理，可以引入许多漏洞。\n\n密钥应以适合所用密码算法的方式生成。对称密钥的正确生成方法与公钥/私钥对不同。NIST\
  \ SP 800-133《密码密钥生成建议》提供了具体指导。\n\n密钥不应重复使用，应定期轮换（替换），以确保使用单个密钥加密的数据量有限，且使用给定密钥加密的数据的生命周期也同样有限。\n\
  \n\n\n\n\n对称密钥和私钥的有效性依赖于保密性。这意味着必须非常谨慎地处理密钥的存储方式，以降低其被未经授权的实体获知的可能性。安全的密钥存储有多种方法。以下是一些常见示例：\n\
  \n* 密钥管理软件\n* 云服务提供商提供的密钥管理服务\n* 专用硬件设备，将密钥在内部存储于防篡改的安全设备中\n\n已达到生命周期终点的密钥（所有妥善管理的密钥都应具有明确的生命周期）必须被安全销毁，以防止其在未来被滥用。\n\
  \n另一个漏洞可能源于内部威胁。拥有密钥材料访问权限的 rogue 员工可以利用该访问权限破坏加密材料的安全性（或使他人也能做到）。可以采用双人控制或职责分离，以确保在执行任何可能损害密钥或系统安全的密钥管理操作之前，至少有两人必须积极参与。\n\
  \nCIA 三要素的最后一条腿也必须考虑：可用性。如果密钥管理系统无法在需要时向授权进程提供对密钥材料的访问，则即使加密数据可以轻松访问，也会拒绝访问加密材料。\n\
  \n密钥操作必须以确保问责制和可追溯性的方式进行记录，以便在怀疑发生入侵时，能够提供取证证据来分析可能的违规行为。\n\n最后，在可能的情况下，密钥管理功能应实现自动化。手动流程更容易出错（无论是执行错误还是遗漏），从而导致依赖密钥进行安全的系统出现弱点。\n\
  \n显然，密钥管理系统在使用之前必须首先得到适当的设计。本章稍后的“密钥管理实践”部分进一步讨论了密钥管理生命周期，包括 HSM 以及密钥管理的其他各个方面。\n\
  \n### 工业控制系统\n\n工业控制系统（ICSs）用于自动化工业流程，涵盖一系列控制系统和相关传感器。在此背景下，安全性主要集中在 CIA 三要素的完整性和可用性方面：控制系统用于做出控制决策的数据（例如传感器输入和控制设定点）的完整性，以及传感器数据和控制系统本身的可用性。除了完整性之外，安全性对于现代工业控制系统而言也是一个巨大的考虑因素，例如那些引导飞机、处理我们的饮用水以及为生物医学系统供电的系统。\n\
  \n其重要性范围从确保建筑物供暖、通风和空调（HVAC）系统的正常运行，到危险化学品的安全生产，再到向大面积甚至整个城市和国家可靠分配电力。\n\n历史上，ICS\
  \ 使用专有方法进行通信，并且未连接到局域网（LAN）或互联网，因此安全性不是设计考虑因素。如今，许多工业控制系统已连接到互联网协议（IP）网关，而对其访问所带来的威胁却考虑不足。\n\
  \n有许多组织提供与 ICS 安全相关的指导或法规：\n\n* ISA/IEC-62443 是一系列标准、技术报告和相关信息，定义了实施电子安全的工业自动化和控制系统（IACS）的程序。\n\
  * 北美电力可靠性公司（NERC）提供一系列指南，称为关键基础设施保护（CIP）标准。NERC CIP 标准在美国和加拿大对参与电力生产/分配的实体是强制性的。\n\
  * 欧洲关键基础设施保护参考网络（ERNCIP）是欧盟的一个项目，其目标与 NERC CIP 类似。\n* NIST 和英国国家基础设施保护中心（CPNI）。例如，参见\
  \ NIST 出版物 SP800-82。\n\n关键公共基础设施（例如电力分配、水系统和其他公共事业）对安全的重要性已引起政府的关注，因为此类系统中的漏洞被认为是在与外国国家冲突时期经济战的主要目标。\n\
  \nICS 安全与其他信息系统共享许多相同的威胁、漏洞和风险，并且对前面所述标准中概述的控制措施的审查显示出与其他信息安全框架的强烈相似性。\n\n工业控制特有的挑战如下：\n\
  \n* 在设备投入现场生产后发现软件漏洞时，修补设备固件的难度\n* 未更改出厂默认设置，尤其是与访问控制和密码相关的设置\n* 工业系统的生产寿命与 IT 系统相比更长\n\
  * 依赖于物理隔离网络作为补偿控制措施，而不对网络连接进行适当监督\n\n让我们逐一考虑这些问题。\n\n正如前面所讨论的，修补软件（包括固件）以解决在软件初始发布后发现的安全缺陷，是安全的一个至关重要的方面。\n\
  \n对于 ICS 而言，修补可能困难或不可能：\n\n* 对于不间断运行的工业系统，可能无法将 ICS 设备从运行中移除以更新其固件。\n* 同样，由于持续生产很重要，更新可能破坏某些东西的风险（例如修补底层操作系统并干扰在该操作系统上运行的\
  \ ICS 应用）可能过大（并且大于运行过时软件的感知风险）。例如，考虑空中交通管制系统或石油和天然气管道。这些系统非常重要，依赖于近乎 100% 的正常运行时间。通常，组织必须权衡运行未修补系统的风险与修补中断服务的风险。\n\
  * 最后，ICS 设备在现场的位置可能使简单地物理到达设备以连接笔记本电脑安装固件更新成为一项重大工作。\n\n显然，适当的 ICS 设计应兼顾组件更新的需求，但不幸的是，许多生产系统是在人们尚未了解\
  \ ICS 中固有安全漏洞之前安装的。这些系统不断得到升级和现代化，作为值班的 CISSP，您可以帮助您的组织在兼顾功能与安全的同时管理以 ICS 为中心的要素。\n\
  \n许多 IT 部门计划每三年到五年更换一次系统。大多数计算机厂商在设备首次发布后五到七年停止支持设备，不再提供修补安全问题的补丁。大多数工业过程设备设计用于运行\
  \ 10 到 20 年甚至更长时间。此外，对商业现成操作系统的更大依赖增加了许多 ICS 实现的已知攻击面，尤其是一旦这些 COTS 操作系统达到生命周期终点而\
  \ ICS 仍在服役时。\n\n\n\n\n如果工业控制系统（ICS）的物理安全是足够的，那么主要威胁来自互联网。在这种情况下，一个合理且常见的补偿性控制措施是对工业控制设备所使用的网络进行物理隔离。这如果得到严格执行可以提供足够的安全性，但保持隔离网络的安全需要谨慎的尽职调查和技术控制，以防止外来设备被连接。如果外部设备必须定期连接，例如出于维护目的，请考虑在维护笔记本电脑和\
  \ ICS 网络之间使用防火墙或代理，以提供额外的安全层。\n\n破坏隔离 ICS 的经典例子是 Stuxnet，它被用来对伊朗的铀浓缩设施造成相当大的破坏。据报道，隔离网络是通过将感染病毒的\
  \ USB 闪存盘插入 ICS 网络上的计算机而被攻破的。\n\n至少，用于维护和管理工业系统的计算机绝不能用于任何其他用途（或被带出设施）。它们必须定期更新，采用反恶意软件保护，并在使用前仔细扫描任何可移动介质（例如\
  \ USB 闪存盘）。请参阅前面列出的组织发布的指南以获取更多具体信息。\n\n如果无法完全与企业局域网和互联网隔离，则必须通过使用精心配置的防火墙和网络代理来限制和筛选允许访问\
  \ ICS 网络的流量。应考虑进一步细分 ICS 网络本身，以限制入侵的横向传播。\n\n对于必须能够远程访问的 ICS，应考虑采用安装 Web 代理或 VPN\
  \ 等补偿性控制措施，在 ICS 本身实施的访问控制之上增加额外的安全层。\n\n安全意识培训也尤为重要，并在所有技术人员和工厂操作员中倡导安全原则至关重要。如果那些承担遵守安全控制需要的人员理解与这些控制相关的重要性和理由，他们就更不可能将它们视为对其运行工厂工作的阻碍，而试图避免或规避。\n\
  \n### 基于云的系统\n\n根据 NIST，“*云计算*是一种使能够实现无处不在、便捷、按需通过网络访问共享的、可配置的计算资源池（例如网络、服务器、存储、应用程序和服务）的模型，这些资源可以快速配置并在最少的管理工作或服务提供商交互的情况下释放。”简而言之，基于云的系统是远程位置、单独管理的系统，可通过互联网访问。\n\
  \nNIST SP 800-145 和 ISO/IEC 17788 定义了描述云计算的若干特征：\n\n*   **广域网络访问：**资源（物理和虚拟）可通过网络访问和管理。\n\
  *   **可计量服务：**用户仅为所使用的服务付费。\n*   **按需自助服务：**用户可以使用自动化工具在无需人工交互的情况下配置和管理服务。\n*  \
  \ **快速弹性与可扩展性：**服务可以快速自动地根据需求进行扩展或缩减。\n*   **资源池化和多租户：**物理或虚拟资源被聚合以服务于多个用户，同时保持其数据隔离且无法被其他租户访问。\n\
  \n共有三种主要的 *云服务模型*，如 Table 3.2 所示。\n\n**TABLE 3.2  Cloud Service Models**\n\n| CLOUD\
  \ SERVICE MODEL || SERVICE PROVIDED || SERVICE PROVIDER RESPONSIBILITIES || CUSTOMER\
  \ RESPONSIBILITIES |\n| --- | --- | --- | --- |\n| Software as a service (SaaS)\
  \ || Software application accessible to the customer over the internet (via a browser\
  \ or API) || Provide and manage all infrastructure from server and network hardware\
  \ to applications software || Provide the client device and manage user-specific\
  \ configuration settings |\n| --- | --- | --- | --- |\n| Platform as a service (PaaS)\
  \ || Web-based framework for developers to create customized applications || Provide\
  \ and manage all infrastructure from server and network hardware to the libraries\
  \ and runtime services necessary to run applications || Provide the application\
  \ and manage the hosting environment |\n| Infrastructure as a service (IaaS) ||\
  \ Infrastructure, including servers, network, storage, and operating systems, delivered\
  \ through virtualization technology || Provide network and server infrastructure\
  \ to support VMs and other virtualized resources || Provide and manage all components\
  \ that run on the VM as well as limited aspects of network services |\n\n对于每个服务模型，显然云服务提供商提供的组件与客户提供的组件之间存在不同的划分。这就产生了云共享责任模型，如\
  \ Figure 3.9 所示。云部署的安全性由客户和提供商共同承担。云服务提供商负责云的安全性，客户负责云中的安全性。这也意味着在评估云部署的风险时，必须考虑提供商的安全能力和承诺。\n\
  \n![FIGURE 3.9 The cloud shared responsibility model for IaaS, PaaS, and SaaS](img/c03f009.png)\n\
  \n**FIGURE 3.9 The cloud shared responsibility model for IaaS, PaaS, and SaaS**\n\
  \n特别是，云服务提供商对以下内容负有排他责任：\n\n*   物理安全\n*   环境安全\n*   硬件（即服务器和存储设备）\n*   网络（即电缆、交换机、路由器、防火墙和互联网连接）\n\
  \n云服务提供商和客户对以下内容共同负责：\n\n*   **漏洞和补丁管理：**以 Figure 3.9 为指导确定哪个组织负责哪些活动，云服务提供商负责修补责任分界线以下的软件，客户负责线以上的一切（即在\
  \ SaaS 的情况下，客户仅负责用于访问云的计算机和浏览器）。\n*   **配置管理：**云服务提供商负责基础设施，客户负责其上的一切。网络配置和安全是一个特殊情况，因为\
  \ IaaS 提供商的客户通常可以通过 API 和基于 Web 的管理控制台对网络路由和防火墙的重大方面进行配置控制。由于这些网络控制是 IaaS 云部署安全性的关键组成部分，客户必须非常小心地确保其正确配置。\n\
  *   **培训：**云提供商和客户都对其各自人员所需的特定培训负责。\n\n在 IaaS 情况下，客户对许多网络安全方面负有责任，提供边界和内部安全需要不同于传统数据中心安全的方法。在云中，客户很少有能力安装实际的网络或安全设备（例如防火墙、路由器、交换机等），而是被授予对有限数量的防火墙和路由器功能的\
  \ API 访问权限，可用于控制对其 VM 的访问。此外，根据云服务提供商的不同，网络流量的访问，如在数据中心使用网络 TAP 或 SPAN（镜像）端口所期望的那样，可能不可用，或者可能仅以\
  \ NetFlow 或 sFlow 等采样方式可用。\n\n\n\n\n\n最后，云服务可以通过多种方式部署（称为 *部署模型*）：\n\n*   **公共云：**\
  \ 可供任何客户使用\n*   **私有云：** 由单个客户独占使用（可能由内部部署或第三方运营，本地或外部）\n*   **社区云：** 由具有相似兴趣或需求的一小群客户独占使用（可能由一个或多个客户或第三方管理，本地或外部）\n\
  *   **混合云：** 上述两种或多种部署模型的组合\n\n部署模型将对云部署的风险评估性质产生重大影响。尽管如此，不要假设私有或本地云部署在本质上比公共云更安全。主要的云服务提供商已在安全方面投入大量资金，这一点从他们众多的安全审计和认证中可见一斑，而且他们通常能为客户提供比这些公司为自己提供的更好的安全性。\n\
  \n### 分布式系统\n\n分布式系统是一组被设计成对用户表现为单一系统的系统。分布式系统旨在实现包括可靠性、性能和可扩展性在内的多个目标。\n\n由于分布式系统按定义涉及多个子系统，可能在地理上分布，并以某种方式互连，其攻击面远大于单一系统。\n\
  \n对整体系统进行威胁建模并识别需要解决的相对风险非常重要。\n\n请考虑以下几点：\n\n*   子系统之间连接需要加密和身份验证，以确保攻击者无法拦截、窃听或伪造子系统之间的通信\n\
  *   需要防范针对通信链路或子系统本身的 DoS 攻击\n*   来自子系统缺乏同质性的风险（例如，操作系统、中间件和应用软件的不同版本和补丁级别；在不同且分布的系统上保持一致配置的困难）以及缓解这些风险的机制\n\
  *   应在通信中断（延迟或中断）时保持一致性的需求，即在通常连接的子系统组之间（有时称为“脑裂”问题）\n*   确保地理分布组件具有可比的安全控制的挑战（例如，物理、环境和人员）\n\
  *   隐私和数据主权法规的要求，可能限制个人数据在国际边界之间的传输\n\n这些风险并非分布式系统所独有，但分布式系统的性质可能使其缓解措施比非分布式系统复杂得多。\n\
  \n### 物联网\n\n术语 *物联网*（IoT）描述的是一张由嵌入技术的物理对象组成的网络（例如传感器和软件），使它们能够通过互联网与其他设备连接并交换数据。这些物理对象——或“事物”——包括企业、政府和商业用途中的各种设备。示例包括家用电器、医疗设备、智能家居设备等等。据估计，到\
  \ 2020 年此类设备的数量在 200 亿到 500 亿之间，而 5G 网络的快速扩展预计将继续推动物联网增长。\n\n物联网安全的重要性可以通过臭名昭著的\
  \ Mirai 分布式拒绝服务（DDoS）攻击来证明。\n\nMirai 攻击（Figure 3.10）涉及一种蠕虫，它搜索易受攻击的物联网设备（通常是消费级路由器和\
  \ IP 启用的闭路电视（CCTV）摄像机），用恶意软件副本感染它们，然后等待来自命令和控制（C&C）服务器的指令，以对哪个目标发动 DDoS 攻击。2016\
  \ 年底，该僵尸网络使 Krebs on Security 博客下线，随后攻击了 Dyn DNS 服务，进而严重影响了其众多客户，包括 GitHub、Twitter、Reddit、Netflix\
  \ 和 Airbnb。\n\n![FIGURE 3.10 Components of the Mirai DDoS BotNet attack](img/c03f010.png)\n\
  \n**FIGURE 3.10 Components of the Mirai DDoS BotNet attack**\n\n#### 从设备制造商角度看物联网安全\n\
  \n在开发过程中，您需要进行威胁建模以确定可能存在的漏洞，并确保部署了适当的缓解措施。您必须审查其产品的<|message|> 安全架构，以确定本节前面概述的一般准则是否已在固件设计中得到遵守。\n\
  \n开发团队需要特别注意来自开放式 Web 应用安全项目（OWASP）和 SANS 等的安全软件开发指南。而质量保证（QA）团队需要执行主动的白盒和黑盒渗透测试。\n\
  \n过去被利用的许多物联网设备漏洞本可以通过基本的安全卫生措施来缓解，例如更改默认凭据并更新固件以修补已知漏洞。\n\n作为物联网产品开发人员，除了努力设计和开发尽可能安全的物联网设备外，您还需要尽可能简化前两种安全控制的实施。您可以让您的设备成为地球上最安全的物联网设备，但一旦它到了客户手中，就不再受您控制。您需要尽可能让他们轻松地正确保护和维护设备。\n\
  \n这意味着您的设备应在用户更改默认管理员凭据之前拒绝连接到互联网。这意味着您的设备应自动更新自身（在用户同意的情况下），如果未启用自动更新，可能在发出足够通知后拒绝运行（如果存在针对在野外被积极利用的高严重性漏洞的补丁）。在某些情况下，物联网设备在初始化前可能拒绝在未先连接到互联网的情况下运行。在这些情况下，最好将可能不安全的物联网设备与网络上的关键系统或敏感区域隔离。\n\
  \n虽然易用性是物联网设备商业成功的关键因素，但必须划清界限，即易用性直接与易受攻击相关。\n\n#### 从用户角度看物联网安全\n\n作为物联网设备的用户，您可以采取措施来降低与设计或支持不佳的设备相关的风险，以便您不会成为用于攻击他人的僵尸网络的一部分，并且您的物联网设备不会被用作攻击您其他信息系统的桥头堡。\n\
  \n首先，您可以通过之前提到的同两个基本安全控制来保护自己（以及可能成为您受损设备攻击目标的其他人）：\n\n*   尽快更改默认凭据，并在将设备连接到互联网之前更改。\n\
  *   保持您的设备更新到当前固件版本，要么通过启用自动更新（如果设备支持），要么定期检查制造商网站以获取固件更新。\n\n此外，您可以通过额外的控制措施实现纵深防御：\n\
  \n*   不要将物联网设备放置在开放的互联网上，而应将其置于防火墙之后，使其在外部无法直接访问。\n*   对网络进行分段，以便您的物联网设备无法访问内部网络上的其他敏感设备或服务器。\n\
  \n\n\n\n\n如果必须能够从外部访问你的物联网设备，那么至少应将设备置于执行反向 NAT 映射的路由器之后。请记住，反向 NAT 提供网络地址转换，但方向是从外部源到内部私有地址。因此，它是\
  \ NAT，但方向相反。最好将设备置于代理之后，该代理可在提供对物联网设备的访问之前先执行自己的用户身份验证。\n\n当然请注意，路由器或代理本身也是潜在的漏洞，必须自身安全运行：必须正确配置（更改默认凭据）并维护（修补和更新）。\n\
  \n鉴于此类设备存在未修补漏洞的历史，依赖物联网设备的安全性是不明智的。通过将设备置于充当访问网关的另一设备之后，可以实现纵深防御和安全分层，在物联网设备被入侵之前需要攻破两个不同的设备。而且，如果你已正确分段网络，即使物联网设备被攻破，对信息系统的机密性和完整性的影响也将有限（这些系统在面对物联网\
  \ DDoS 攻击时的可用性是另一回事）。事实上，将网络分段推向极致就导向了 Google 的 BeyondCorp 模式：一种网络，其中对资源的访问并非基于网络位置授予，而是基于用户权限。\n\
  \n### 微服务\n\n`Microservice architecture` 是一种模块化软件开发风格，涉及将单个应用程序作为一组松散耦合的较小应用程序或服务（`microservices`）集合来开发，每个服务运行自己的进程。微服务被构建为可独立部署，并通过轻量级通信协议协同工作。微服务可与更传统的\
  \ `monolithic architecture` 对比，后者涉及将应用程序作为单个不可分割的单元开发，通常具有缺乏模块化的大型代码库。Figure 3.11\
  \ 描绘了单体与微服务之间的差异。\n\n举例来说，考虑 Microsoft O365。这是一套单体应用程序。你不能仅调用“更改字体”功能或“排序表格”功能而不加载整个单体应用程序。另一方面，亚马逊网络服务最初采用单体架构，但已转向使用微服务的更具服务导向的架构。\n\
  \n微服务架构高度分布式且动态，在设计的第一阶段及整个开发生命周期中都必须考虑其独特的<|message|> 安全问题。保护微服务时要考虑的两个关键原则是：隔离和纵深防御。\n\
  \n![FIGURE 3.11 Monoliths and microservices](img/c03f011.png)\n\n**FIGURE 3.11 Monoliths\
  \ and microservices**\n\n隔离是微服务的一个核心原则，每个微服务必须能够在不影响周围其他微服务的情况下部署、修改、维护和销毁。通过以隔离原则为指导设计微服务，你可以更好地确保一个微服务的弱点被遏制，无法对应用程序中的其他微服务产生负面影响。\n\
  \n纵深防御原则在任何架构中都很重要，但在处理微服务时尤其关键。纵深防御是一种安全策略，要求在整个应用程序或系统中实施多层安全控制。在微服务架构中，独立监控和保护每个微服务以及整体环境中各微服务之间的通信至关重要。\n\
  \n### 容器化\n\n`container` 是软件单元，它将应用程序及其依赖项打包起来，以便应用程序能够与其环境解耦，并在多个环境中一致地开发、部署和运行（例如，公有云、私有云、本地系统等）。与其运行整个操作系统（如\
  \ VM 所做的那样），容器使用操作系统的内核以及运行给定应用程序所需的资源。因此，容器设计上轻量且灵活，允许比非容器化应用程序更快的应用程序开发。\n\n容器因开源\
  \ Kubernetes 平台的开发而流行。Kubernetes 和其他容器平台在混合云环境中特别有用，因为它们允许开发人员和用户无缝地将应用程序从一个云迁移到另一个云，甚至在云与本地环境之间迁移。\n\
  \n#### 安全问题\n\n容器化带来了其自身的一系列安全挑战，因为容器技术本质上灵活且开放。由于容器允许你快速扩展和缩减资源，资产管理和配置管理或许比传统系统更具安全挑战性。\n\
  \n容器安全风险通常分为两大类：\n\n* 容器镜像或整个容器仓库被攻破\n* 容器被滥用以攻击其他容器或主机操作系统\n\n仔细管理你的容器镜像是容器安全的关键。你的基础容器镜像最为重要，因为它被用作派生镜像的起点。容器安全始于使用来自受信任来源的签名基础镜像。在向镜像添加应用程序或其他变量时，遵循谨慎的配置管理实践。此外，所有容器镜像都应遵守严格的漏洞扫描和修补要求。\n\
  \n除了管理安全镜像基线外，你还必须确保对所有容器镜像实施适当的访问控制。尽可能使用基于角色的访问控制来管理对容器镜像的访问。\n\n保护运行容器的主机操作系统是保护容器的基础部分。主机操作系统应仅运行操作容器所需的最少服务，并排除诸如\
  \ Web 服务器、数据库等会增加攻击面的应用程序。适当的配置也很重要，主机操作系统必须纳入你的配置管理计划。此外，容器之间的通信应基于最小权限原则进行限制——仅允许容器与绝对必要用于操作的容器通信。容器编排和管理工具，如\
  \ Kubernetes，允许你在适当时实施网络控制以限制通信路径。\n\n### 无服务器\n\n`Serverless computing` 是一种云计算模型，涉及云提供商管理服务器，并根据需要动态分配机器资源。通过无服务器计算，基础设施管理任务如配置和修补由云提供商处理，使客户主要负责编写在这些服务器上执行的代码。AWS\
  \ Lambda、Azure Functions 和 Google Cloud Functions 是公有云提供商提供的流行无服务器框架。\n\n\n\n\n\
  Serverless 计算具有一些显著的安全优势。首先，serverless 函数通常是短暂的（即生命周期短）。这些函数通常运行几秒钟，执行代码，然后终止。这种短暂的特性创造了一个不断变化的目标，为攻击者入侵增加了极高的难度。此外，serverless\
  \ 函数的代码库通常比最小的容器还要小得多。鉴于此事实，你能够对每个函数应用更细粒度的访问控制规则，而不必依赖可能需要授予过度权限才能实现相同功能的容器级规则。最后，使用\
  \ serverless 架构，你作为云客户的安全责任被大幅降低，并很大程度上转移给了云服务提供商，后者负责所有操作系统加固、补丁和运行时安全。当然，这只有在云服务提供商可靠地执行这些任务时才是一种安全优势。\n\
  \n### 安全问题\n\n尽管有其优势，serverless 计算并非没有安全挑战。2019 年，云安全联盟（CSA）以色列分会起草了一篇题为“Serverless\
  \ 应用的 12 项最关键风险”的论文。所列风险包括身份验证破坏、函数权限和角色过度授权，以及与攻击面复杂性和 serverless 架构相关细微差别有关的其它问题。该出版物可通过访问\
  \ `cloudsecurityalliance.org/artifacts/the-12-most-critical-risks-for-serverless-applications`\
  \ 找到。\n\n有效的 serverless 安全建立在确保代码完整性、严格的访问权限和适当的监控之上。你应为 serverless 函数维护最小权限访问，就像对待其它服务一样——serverless\
  \ 函数应仅被授予执行其任务所必需的访问权限和权限。代码应定期扫描漏洞和配置问题。此外，应使用运行时保护来检测可疑事件或错误，这些事件或错误可能导致意外行为或被入侵。大多数大型云服务提供商都提供实现这些目标的功能，并且有各种第三方厂商提供额外的\
  \ serverless 安全支持。\n\n### 嵌入式系统\n\n嵌入式系统是内置于更大机械或电气系统中的专用信息处理组件，旨在提供有限的一组功能。嵌入式系统可广泛应用于以下技术中：\n\
  \n* 家用电器（例如，洗碗机、洗衣机和烘干机、冰箱和电视）\n* 办公设备（例如，打印机、扫描仪和传真机）\n* 网络设备（例如，路由器、交换机和防火墙）\n\
  * 汽车和其他机动车辆\n* 自动取款机\n* 医疗设备（例如，心率监测仪、血糖仪和静脉输液泵）\n* 城市轨道交通车辆、车站和系统\n* 建筑自动化和控制系统\n\
  * 交通控制和监控系统\n\n医疗行业已通过提供给医疗提供者和患者带来巨大益处的嵌入式系统实现了创新。一个例子是通过实时定位系统（RTLS）跟踪患者和医护人员，由主动射频识别（RFID）标签和接近传感器实现。另一个真正拥抱物联网功能嵌入式设备的例子就是现在所知的\
  \ *远程医疗* 或远程健康监测和护理。对难以轻易前往医院的患者最有帮助，物联网功能设备被带到患者家中并与医护人员远程通信。\n\n评估嵌入式系统的漏洞应从列举可用的攻击面开始，然后逐一检查。如本章前面所述的更详细描述，这种检查可以通过多种方式进行，包括代码检查、威胁建模以及白盒或黑盒渗透测试。\n\
  \n通常，这些攻击面将落入以下类别：\n\n* 用户界面（UI，即按钮或其他用户输入方法）\n* 物理攻击\n* 传感器攻击\n* 输出攻击\n* 处理器攻击\n\
  \nUI 攻击涉及以导致设备功能失常的方式操纵设备的控件。这可能涉及按错误顺序或设计者未预期或未预料的方式按按钮（多次、同时按多个按钮等）。\n\n根据用户界面的性质，可能存在仅通过特殊方式才能访问的受限功能。这可能像特殊组合的按钮按下以“解锁”管理或特权功能那样简单，或用户登录流程（可能存在默认或选择不当的密码等所有标准用户身份验证问题）。请记住，这些受限功能通常会泄露到互联网上，这需要在保护此类设备和系统时采取特殊预防措施。\n\
  \n针对这些攻击的缓解措施包括仔细审查固件中安全关键部分以及对嵌入式系统 UI 进行渗透型测试。显然，对售货机的渗透测试与对 Web 应用的渗透测试方法略有不同，但概念非常相似。考虑所有可用于向设备发送数据或命令的方法，然后尝试无效或不寻常的数据或命令，或数据或命令序列（既有有意选择也有随机，如模糊测试），以试图使嵌入式系统功能失常。售货机的“工作破解”方法在网上广泛存在，形式为导致机器投放产品的奇特按钮按下序列。与渗透测试\
  \ Web 应用依赖于底层语言类似，售货机漏洞取决于底层编程，因此按钮序列因厂商而异。\n\n物理攻击涉及对嵌入式系统包装的破坏，要么直接破坏设备（即打破售货机的玻璃前面板并拿走内容物），要么获得嵌入式系统部件的访问权限以暴露可能易受攻击的其他攻击面（本节后面讨论）。特别容易导致漏洞的是用于管理或维护该机器的端口或接口。一个现实的例子涉及投票机，其中概念验证演示可在网上找到，有人通过其管理端口利用投票机来击败屏幕上的访问控制。\n\
  \n物理攻击的防御措施可以从增加物理保护强度（例如更厚的钢制容器、坚固的锁、或通过环氧树脂包埋/焊接组件使访问困难）到添加篡改检测形式不等。根据篡改类型，检测可能仅意味着构建设备使其物理操纵尝试（例如添加信用卡读卡器）很容易被发现或导致设备采取防御措施（从触发警报到擦除敏感内存到自我毁灭）。\n\
  \n传感器攻击涉及操纵或拦截嵌入式系统用于检测与其操作相关的外部条件的传感器的数据。例如，在售货机中，硬币接收器是一个传感器，它告诉处理器已存入哪些硬币。对传感器的攻击（例如使用劣质硬币或插入电线或其他细长工具来触发硬币检测器）可以欺骗设备认为已付款且产品应被投放。\n\
  \n\n\n\n比起自动售货机黑客攻击，对无钥匙进入汽车的传感器攻击代价要高得多。一个众所周知的例子是来自外部安全摄像头的病毒式视频片段，视频显示两名男子走近车主车道上停放并锁定的特斯拉\
  \ Model S 汽车。一名男子手持笔记本电脑在房屋外墙附近扫描，希望能接近特斯拉的钥匙扣。另一名男子手持信号中继设备站在车门附近。通过触发钥匙扣，第一名窃贼可以将信号中继给他的同伙。中继攻击使他们能够解锁汽车并最终将其偷走。\n\
  \n信用卡读卡器和读卡片是传感器攻击的一种形式。读卡器是指攻击者窃听信用卡终端中磁条读卡器的数据。卡片的磁性数据可能被例如恶意服务员携带的便携设备读取。或者读取设备可能是固定式销售点终端，攻击者在其中安装了第二个传感器来读取相同数据并记录下来。\n\
  \n读卡片是另一种从银行卡窃取数据的设备，但与读卡器不同，读卡片拦截的是卡片内置的 `EMV`（Europay, MasterCard, Visa）芯片的数据。在带有\
  \ `EMV` 芯片的银行卡上，芯片被封装在卡内，但在表面上有熟悉的镀金触点，以便在银行卡插入销售点 (`POS`) 读卡器时提供导电触点。攻击者的读卡片是一个薄塑料套筒或板，完全塞入\
  \ `POS` 读卡器内部。读卡片作为塑料套筒，基本上只是一个用于放置电气触点和用于记录插入银行卡的小型集成电路 (`IC`) 芯片的表面。读卡片的触点被放置在被“夹在”银行卡和合法的\
  \ `POS` 读卡器之间的位置。\n\n输出攻击涉及操纵由嵌入式系统控制的执行器，以绕过系统施加的控制。想象一下电控门锁，其布线暴露在外，攻击者只需剥去绝缘层并施加适当的电压即可使门解锁。\n\
  \n处理器攻击涉及直接破坏处理器，其手段范围从直接连接到处理器或存储芯片，到小心地去除集成电路的顶部并使用离子束探测芯片以获取或操纵处理器内的信息。处理器攻击通常先于物理攻击，以获得对处理器的访问权限。\n\
  \n支持固件更新的嵌入式系统可能容易接受恶意或未经授权的固件。攻击者加载自己的固件版本（要么从头编写，要么从设备中提取的代码或从制造商处下载的代码中逆向工程），从而使设备按攻击者希望的方式运行。\n\
  \n针对固件攻击的保护措施可以包括数字签名以防止未经授权的固件被接受和执行，以及密码学以防止固件更新被逆向工程。\n\n与物联网设备一样，一个问题是很难，如果不是不可能的话，对许多嵌入式系统进行软件升级。这意味着在产品出厂后发现的漏洞可能难以或无法修补。其结果可能是需要补偿性控制措施来减轻未修补漏洞带来的风险，或需要完全更换该单元。\n\
  \n## 高性能计算系统\n\n*高性能计算* (`HPC`) 指的是使用一台或多台超级计算机，通常用于高度复杂的计算科学和其他数学相关的应用。超级计算机自 1960\
  \ 年代以来就已存在，但它们仍在不断发展，大多数现代 `HPC` 系统利用基于云的技术来提高其分布式计算能力。\n\n总体而言，`HPC` 系统会遇到与传统系统和其他基于云的系统（如下文各节所述）相同的许多安全问题。它们通常运行基于\
  \ Linux 的操作系统，并受软件漏洞、配置问题和凭据被盗的影响。这里应考虑所有传统安全措施。然而，一个区别可能在于支持 `HPC` 环境的高度专业化、专用硬件和软件。任何定制的硬件和软件都带来了必须得到保护的额外威胁向量。在高性能计算的情况下，挑战在于确保安全运行而不对性能产生不利影响。\n\
  \n作为最佳实践，`HPC` 系统应移至自己的物理飞地或与传统系统分离的逻辑安全区域。这样可以将 `HPC` 系统与其他可能具有不同安全需求或法规的计算系统隔离开来。独立的飞地为\
  \ `HPC` 环境的进出监控提供了一个单一入口点。\n\n`HPC` 系统中通过的海量数据流量需要对网络监控采取不同的方法。与其使用状态防火墙进行深度数据包检测，通常最好使用仅检查数据包头而不检查负载本身的防火墙。单独地，深度数据包检测可用于入侵检测，因为有状态的入侵检测系统不用于内联运行，因此不会引入吞吐量延迟。在这里，使用单独的工具可以实现传统的安全意图，同时适应\
  \ `HPC` 系统的独特性。\n\n## 边缘计算系统\n\n*边缘计算* 是一种分布式计算模型，将计算和存储资源更靠近所需的位置，从而提高响应时间并减少带宽。边缘计算的概念可以追溯到\
  \ 1990 年代的内容分发网络 (`CDNs`)，现在已扩展到云计算领域。`CDNs` 在 第 4 章，“通信和网络安全”中进行了详细介绍。\n\n今天，边缘计算有助于管理我们看到的物联网设备的巨大增长。边缘计算允许伪本地数据处理，以最大限度地减少通过互联网发送的数据。例如，想象一个工厂有\
  \ 5,000 台联网视频摄像头将视频发送到远程位置。如此多的实时流通过公司网络发送既慢又昂贵。边缘计算通过在本地处理摄像头数据并仅在必要时通过互联网发送信息来解决这个问题。与所有\
  \ 5,000 个连续实时流被传输不同，你的边缘设备可能会使用人工智能 (`AI`) 来识别工厂中的异常行为，并在需要调查时发送 30 秒的片段。\n\n###\
  \ 安全问题\n\n从安全角度来看，边缘计算带来了一些挑战。\n\n位于边缘的设备，而不是集中管理在数据中心或其他严格管理的设施中，可能不会像其同行那样得到同样的关注。你必须确保对边缘设备应用与集中管理设备相同的严格安全措施。这包括加固、修补以及为边缘计算系统提供适当级别的物理安全。`SOAR`（在\
  \ 第 7 章 中介绍）可以帮助组织观察和加固其设备，包括位于边缘的设备。\n\n数据在边缘设备和集中系统（或云）之间传输时必须加密，并且在管理远程系统时，对于敏感数据，使用\
  \ `VPN` 隧道也可能是明智的。\n\n\n\n\n\n边缘设备也存在可用性问题。边缘计算系统的冗余和故障转移管理很重要，以确保在单个边缘节点发生故障时数据仍能继续处理和传输。此外，边缘设备必须进行监控，以便在出现故障时能够尽快修复错误和故障。\n\
  \n### 虚拟化系统\n\n操作系统为程序提供一套服务，使其能够比直接在计算机上运行更高效地运行（并且更易于设计和运行）。例如，应用程序不是直接读写磁盘存储块，操作系统提供了一层抽象来管理文件和目录的细节。此外，大多数操作系统还允许多个程序并发运行，每个应用程序都能在同一系统上对其他应用程序的存在一无所知。\n\
  \n从某种意义上说，操作系统提供了一种虚拟计算机，一种在现实中不存在（即硬件）的计算机，它比物理硬件更容易供应用程序使用，并且通过在不同程序之间共享硬件，使硬件得到更高效的使用（参见\
  \ 图 3.12）。\n\n![FIGURE 3.12 An operating system efficiently allocates hardware resources\
  \ between multiple processes.](img/c03f012.png)\n\n**图 3.12 操作系统在多个进程之间高效分配硬件资源。**\n\
  \n虚拟化将这一概念更进一步。*虚拟化* 是创建虚拟（即非真实）计算、存储和网络资源的行为——换句话说，虚拟化允许你创建硬件的软件版本。例如，VM 就是实际计算机的软件实例。同样，软件定义网络（SDN）是物理网络的软件实例。\n\
  \n操作系统不仅仅使同一硬件上运行多个应用程序程序成为可能，虚拟化使多个操作系统能够在同一台计算机上运行，每个操作系统都不知道其他操作系统的存在，并且在设计良好的系统中无法影响其他操作系统。虚拟化是云计算背后的主要技术（在本节前面已讨论过）。\n\
  \n虚拟化的最常见实现是 hypervisor。*hypervisor* 是一层计算层，允许多个操作系统同时在一块硬件上运行，每个操作系统都将机器的资源视为其专有资源。hypervisor\
  \ 允许在单个物理主机上运行多个客户虚拟机。\n\n通常称为 Type 1 和 Type 2 hypervisor 的 hypervisor 有两种类型。它们之间的主要区别在于是否使用底层操作系统作为硬件与\
  \ VM 之间的桥梁。Type 1 hypervisor 是唯一安装的安装，充当硬件组件与 VM 之间的桥梁。因此，Type 1 hypervisor 也称为\
  \ *裸金属* hypervisor。它们通常在需要灵活性和效率时出现。尤其是在虚拟化服务器运行相同或相似服务时，可以最有效地利用底层硬件。在生产环境中，你更有可能发现虚拟化机器位于\
  \ Type 1 hypervisor 上。Type 2 hypervisor 带来了一点额外的开销，依赖于安装在硬件上的 *主机* 操作系统。在主机操作系统内运行的虚拟化机器随后被称为\
  \ *客户* 机器。 图 3.13 描述了 Type 1 和 Type 2 hypervisor 之间的差异。\n\n![FIGURE 3.13 Type 1\
  \ and Type 2 hypervisors](img/c03f013.png)\n\n**图 3.13 Type 1 和 Type 2 hypervisor**\n\
  \n虚拟化是 AWS 或 Google Cloud Platform（GCP）等云提供商为不同客户提供 VM 的基础，这些客户可能最终在同一台物理计算机上运行，而彼此并不知晓。\n\
  \n虚拟化的优点包括以下内容：\n\n* 更有效地利用底层硬件（正如操作系统允许单台计算机被多个程序和用户共享一样）\n* 根据需求动态扩展基础设施\n* 在不同操作系统上运行的程序和应用程序之间提供额外的分离和隔离（与在同一操作系统上运行相比）——支持前面概述的纵深防御和安全层的安全原则\n\
  \n#### 潜在弱点\n\n与内存保护一样，虚拟化依赖于硬件和 hypervisor（可能包括硬件和/或软件）的正确运行。诸如 Meltdown 之类的硬件缺陷破坏了底层假设，即硬件将防止未经授权的程序（并且可能是一个完全无关的客户端）访问分配给另一个程序（和客户端）的内存。\n\
  \n同样，hypervisor 中的软件缺陷可能会错误地允许在同一台计算机上的一个 VM 上运行的软件访问不同 VM 上的数据。例如，*虚拟机逃逸* 漏洞就是当程序能够突破其\
  \ VM 并直接与底层主机操作系统交互时发生的；一旦能够访问主机操作系统，攻击者可能能够渗透到其他 VM 或导致主机系统租户的服务中断。当发现此类缺陷时，它们通常会披露给最大的云服务提供商，以便在漏洞被广泛知晓之前进行修补。\n\
  \n始终存在这些未修补的硬件或 hypervisor 缺陷可能为威胁行为者所知的可能性，然后能够破坏本应防止 VM 上无关客户端交互的保护。为了降低这种风险，一些\
  \ IaaS 云提供商提供专用主机，保证只有分配给你的账户的 VM 才会被允许在专用主机上运行。\n\n## 选择和确定加密解决方案\n\n密码学是对数据进行数学操作以保护其机密性和/或完整性。密码学可以说是安全架构师工具箱中最强大的工具之一，但也是一种很容易被误用的工具，导致产生虚假的安全感。\n\
  \n密码学可在你的环境中用于实现信息安全的多个目标，包括 CIA 三要素中的两个核心原则（机密性和完整性），以及其他目标（即隐私、真实性、不可否认性）：\n\n\
  * **机密性（和隐私）：** 密码学的主要用途之一是保护信息机密性，无论是静态还是传输中。当应用于个人身份信息（PII）和受保护健康信息（PHI）时，这提供了“隐私”的关键特性。\n\
  * **完整性：** 密码学的另一个常见应用是使用哈希算法和消息摘要来提供数据完整性（或准确性）的保证。这些加密应用有助于确保被访问的数据完整且符合预期。\n\
  * **真实性（和不可否认性）：** 密码学也可用于身份验证服务以及通过数字签名和数字证书实现不可否认性。\n\n这些应用将在本节的其余部分中讨论。\n\n\n\
  \n\n\n很难想象我们使用计算机的某个方面不涉及密码学的某个方面。当你登录到一个系统时，你的密码会使用密码学进行保护（至少我们希望如此）。当你使用 `https:`\
  \ URL 连接到网站时，你的流量会使用密码学进行保护。如果你将 PII 存储在负责任的服务提供商处，它应该使用密码学进行保护。总之，在整个过程中，密码学可以帮助保护敏感信息。\n\
  \n在以下各节中，我们将概述安全架构师需要熟悉的密码学的各个方面。前面在评估和缓解漏洞的部分中，我们讨论了密码学应用不当可能带来的潜在弱点。\n\n## 密码学基础\n\
  \n在深入探讨一些复杂主题之前，让我们从基础开始。以下来自 (ISC)² 的定义是密码学主题的核心，你会经常看到（并可能使用）它们：\n\n* `Plaintext`：消息的自然格式，未被转换为秘密。\n\
  * `Cleartext`：以可读、可用的形式呈现的消息，不打算通过密码学手段进行模糊处理。\n* `Ciphertext`：明文消息的更改形式，以便除预期接收者之外的任何人都无法阅读（换句话说，被转换为秘密的东西）。\n\
  * `Encryption`：将消息从明文转换为密文的过程。\n* `Decryption`：加密的逆过程——它是使用用于原始加密的密码算法和适当密钥，将密文消息转换回明文的过程。\n\
  * `Cryptographic algorithm`：用于加密和解密过程的数学函数。\n* `Key`：控制密码算法操作的输入；它决定算法的行为并允许可靠地加密和解密消息。对称/私钥（本章后面讨论）必须保密，而公钥（本章后面也讨论）则共享以实现身份验证和其他用例。\n\
  \n如需更多有用的定义，请访问 (ISC)² CISSP 术语表：`www.isc2.org/Certifications/CISSP/CISSP-Student-Glossary#`。\n\
  \n## 密码学生命周期\n\n密码学生命周期涉及算法选择、密钥管理以及对静态、传输中和在使用中的加密数据的管理。\n\n算法选择涉及多个选择：\n\n* 适用于目的的密码类型（例如，对称、公钥、哈希等）\n\
  * 具体算法（例如，`AES`、`RSA`、`SHA` 等）\n* 密钥长度（例如，`AES-256`、`RSA-2048`、`SHA-512` 等）\n* 工作模式（`ECB`、`CBC`\
  \ 等）\n\n对称加密最适合存储需要在使用前恢复（解密）的数据。对称加密也比公钥密码学高效得多，因此适合保护传输中的数据。问题在于，如本节后面详细解释的那样，要使对称密码学用于传输中的数据，通信链路的两端都必须知道密钥。有多种方法可以在不安全通道上安全地交换密钥，其中最广泛使用的方法是使用公钥密码学（后面也会讨论）。\n\
  \n有些数据类型需要保护，但不需要解密。事实上，出于安全考虑，最好某些数据永远无法被解密。例如，为了保护用户身份验证使用的密码的机密性，它们显然必须被加密。但没有必要能够解密它们。要验证输入的密码与之前存储的密码是否一致，只需加密输入的密码并比较两个密文即可。事实上，能够解密密码会显著削弱其安全性。因此，对于此目的，我们使用单向加密函数，也称为\
  \ `cryptographic hashing`。需要明确的是，密码学并不仅限于加密和解密。密码学使用一种算法，无论其复杂程度如何，都处理输入和输出。密码哈希将字符串作为输入以产生输出，通常假定输出长度固定，而与输入长度无关。\n\
  \n另一个例子是在计费系统中使用的信用卡号码。虽然提交交易到支付处理器的系统显然必须能够以明文访问账号，但有许多数据库和日志需要存储账号。对于其中大多数而言，存储账号的密码学哈希就足够了。此哈希可以存储和通信，即使被披露也不会有重大风险。只有少数系统需要使用可解密的对称密码存储账号。这样一来，攻击面就大大减少了。\n\
  \n保护 PAN 的另一种技术是使号码与账户持有人以及任何可以识别该账户持有人的信息脱钩。本身而言，PAN 就像一个令牌。只有当 PAN 可以与 PII 关联时，信用卡号码才会成为敏感信息。翻译库正被用来生成一个随机令牌，并与\
  \ PAN 安全关联。此过程（称为 `tokenization`）通过提供两者之间的加密关系，有助于将账号与 PII 分开。\n\n在选择了密码类型后，必须选择适当的算法。在某些情况下，算法集受协议标准限制。例如，如果使用密码学来保护传输中的数据，则支持的算法列表是有限的，你的选择也受此列表以及希望尽可能与最广泛的浏览器保持兼容的愿望的限制。对于物联网和边缘设备，你通常希望算法轻量级，并且能够由通常资源受限的设备支持。这是性能和其他系统因素使密码学成为整体系统架构和设计的重要因素的一个例子。\n\
  \n对称密码学是使用一个密钥，由两个或多个方共享。对称算法大致分为分组密码和流密码。顾名思义，分组密码一次处理一小块数据（通常为 8、16 或 32 字节）。流密码一次处理一个位或一个字节。分组密码通常用于批量加密，例如数据静态时的加密，而流密码针对加密通信链路进行了优化。流密码通常具有在丢弃或损坏位的情况下快速重新同步的特性。在某些链式模式下，分组密码无法重新同步，数据流的丢失或损坏将使传输的其余部分无法解密。在付出一些（或相当大的）效率成本的情况下，可以将分组密码用作流密码，反之亦然。\n\
  \n在协议的较低层处理错误检测和重传的通信链路中，通常使用分组密码（例如在 `TLS` 和 `WiFi` 中）。\n\n在其他情况下，例如加密要存储在数据库中的数据，可以选择任何对称分组算法。在这种情况下，应参考国家研究机构（例如美国的\
  \ `NIST`、英国的国家网络安全中心或国际标准化组织）提供的指导。这些机构根据对相对强度的分析，对适当算法做出建议。\n\n\n\n\n\n其他考虑因素包括算法的效率。如果代码要在处理能力有限的系统上实现，或需要加密大量数据，那么算法效率上的微小差异对性能的影响很大。还需考虑某些处理器包含对特定算法的编码支持。在处理器指令集中对某些算法提供支持，可使其运行速度远快于没有处理器支持的情况。例如，大多数\
  \ Intel、AMD 和 ARM 处理器都包含用于加速 `AES` 算法操作的指令。一项研究发现，使用 CPU 加速的密码学可带来 800% 的加速。\n\n\
  密钥越长，密码越安全。但更长的密钥意味着更长的处理时间。你必须在长（强）密钥的安全性与对系统性能的影响之间取得平衡。一个重要的考虑因素是加密数据的生命周期。如果数据可以定期重新加密（例如，每一年或两年一次），那么选择一个能够抵御未来二十年暴力攻击进步的密钥就不是很重要。相反，如果数据可能长期存档，则可能需要更长的密钥。（有关密钥管理和密钥生命周期的细节将在本章后面更详细地讨论。）\n\
  \n对于对称分组加密，有多种使用算法的方式。Figure 3.14 显示了从最简单的电子密码本 (`ECB`) 模式到更复杂的密码分组链接 (`CBC`) 和密码反馈\
  \ (`CFB`) 模式的主要变体。这些将在下一节中进一步讨论。\n\n最后一点说明：前面概述的选择仅在某一时间点上是最优的。密码算法中的弱点会被发现，更强大的处理器使暴力攻击更具可行性，而量子计算的发展可能使某些算法过时。过去曾有无数例子，之前认为安全的算法因密码分析的进步而被弃用，例如\
  \ `DES`、`RC4`、`SHA-1` 等。\n\n![FIGURE 3.14 ECB, CBC and CFB block encryption implementations](img/c03f014.png)\n\
  \n**FIGURE 3.14 ECB, CBC and CFB block encryption implementations**\n\n### Cryptographic\
  \ Methods\n\n安全架构师可以使用多种密码工具来保护数据的机密性和完整性，其选择取决于所防御的威胁、通信的性质以及信息的敏感程度。参见 Table 3.3，了解可用于不同场景的密码方法。\n\
  \n**TABLE 3.3 Cryptographic Approaches**\n\n| USE CASE || TYPE OF CRYPTOGRAPHY |\n\
  | --- | --- |\n| Protect confidentiality of stored data || Symmetric |\n| --- |\
  \ --- |\n| Protect confidentiality of data in transit || Symmetric (possibly aided\
  \ by asymmetric) |\n| Verify identity || Public key infrastructure |\n| Protect\
  \ integrity (detect tampering) || Hashing |\n|  | (e.g., Message Authentication\
  \ Code) |\n| Protect passwords || Hashing (with salt and pepper) |\n| Nonrepudiation\
  \ || Digital signature |\n\n考虑以下不同情况：\n\n* 两人（Alice 和 Bob）希望通过不安全的信道通信机密信息，而未经授权的人无法窃听或篡改该信息。\n\
  * Alice 希望以一种方式向 Bob 发送消息，使 Bob 确信该消息确实源自 Alice（而非冒名者），并且 Alice 不能事后否认已发送该消息。\n\
  * Bob 希望存储密码，并确保即使有人能够访问存储密码的文件，甚至入侵者知道用于加密密码的方法，也无法获得原始密码。\n\n以下各节将讨论各种密码算法类别以及它们如何解决前面列表中描述的情况。\n\
  \n#### Symmetric Encryption\n\n*对称加密* 是最常见的方法，也是人们谈论密码学时最常想到的。对称加密接收一条消息（称为 *明文*）和一个加密密钥，并生成输出（称为\
  \ *密文*），该输出不会泄露原始明文中的任何信息。如果某人拥有用于执行原始加密的加密密钥，则可以将输出转换回原始明文。\n\n目标是使不知道密钥的窃听者难以从密文中提取有关原始明文的任何信息。对称密码的安全性还要求攻击者即使获得了明文示例及其相关密文，也无法通过逆向工程、反向计算或任何其他分析技术推断或确定用于加密消息的密钥。如果攻击者能够做到这一点，则该密钥加密的所有其他消息都将面临风险。\n\
  \n要使对称加密发挥作用，发送方和接收方必须共享密钥。为了使消息保持机密，密钥必须保密。因此，对称密码学有时被称为 *秘密密钥* 或 *共享密钥加密*。\n\n\
  对称密码的基本类型包括流密码和分组密码。\n\n*流密码* 是一种逐字符或逐位工作的加密算法（而不是按块）。它们通常用于加密串行通信链路和手机流量，并且专门设计为计算高效，以便可以在\
  \ CPU 能力有限的设备中，或在专用硬件或现场可编程门阵列 (`FPGAs`) 中使用。参见 Figure 3.15，其中明文作为流流经密码函数，输出为密文。Figure\
  \ 3.15 顶部是密钥流生成器，一种以恒定流生成随机位的装置，这些随机位一次生成一个位。密钥流是流密码所必需的，依赖于这些随机位通过异或 (`XOR`) 函数将明文转换为密文。\n\
  \n![FIGURE 3.15 Stream cipher encryption algorithm](img/c03f015.png)\n\n**FIGURE\
  \ 3.15 Stream cipher encryption algorithm**\n\n*分组密码* 使用确定性算法，接收固定大小的位块（明文）和一个密钥值，并生成与明文块大小相同的加密块（密文）。不同的密钥值会从相同的明文产生不同的密文。参见\
  \ Figure 3.16。\n\n![FIGURE 3.16 Block cipher encryption algorithm](img/c03f016.png)\n\
  \n**FIGURE 3.16 Block cipher encryption algorithm**\n\n尽管分组密码是划分密码的一种有用方式，但几乎所有分组密码都可以转换为流密码，反之亦然。\n\
  \n##### Stream Ciphers\n\n流密码的一个简单且可证明不可破解的例子是，取长度为 *n* 的消息（明文）和相同长度的真正随机数字串（密钥），并按\
  \ Figure 3.15 所示组合它们以产生密文。\n\n\n\n\n\n美国密码学家克劳德·香农在 1949 年证明，如果密钥是真正随机的、与明文长度相同，并且仅使用一次，则该系统是安全且不可破解的（假设密钥保持秘密）。这种类型的加密被称为\
  \ `one-time pad`，因为密钥仅用于一次加密和解密。这种方法的缺点是密钥必须与消息长度相同且不能重复使用，使得该方法除最短的消息或在成本上可以证明安全交付大量密钥材料是合理的的情况（通常是政府）外完全不切实际。然而，量子密码学的发展（参见“量子密码学”部分）将提供安全交付大量随机数据的方法，可用于一次性密码本加密。\n\
  \n实用密码使用固定长度的密钥来加密长度可变的多个消息。正如我们在密码分析部分将看到的那样，如果攻击者获得用同一密钥加密的足够多的密文，一些密码会被破解。定期更换密钥，使每个唯一密钥产生的密文量受限，可以提高密码的安全性。\n\
  \n流密码分为两种类型：同步和自同步。\n\n同步密码要求发送方和接收方保持完美同步才能解密流。如果从流中添加或删除字符（位），解密将从该点开始失败。接收方需要能够检测到同步丢失，并尝试各种偏移以重新同步，或等待发送方插入的独特标记以使接收方能够重新同步。\n\
  \n自同步流密码顾名思义，具有在最多 `N` 个字符后（`N` 是特定自同步流密码的属性），接收方将自动从密文流中删除或添加的字符中恢复的特性。虽然在数据可能被添加到密文流或从中删除的情况下，它们可能是一个明显的优势，但自同步密码的问题在于，如果一个字符被损坏，错误会传播，影响多达下一个\
  \ `N` 个字符。对于同步密码，密文中的单个字符错误只会导致解密明文中的单个字符错误。\n\n### Block Ciphers\n\n分组密码一次处理 `n`\
  \ 位的块，使用大小为 `k` 的密钥。处理块的输出然后成为密码函数的下一次迭代的输入。发生的迭代次数被称为 `rounds`。 Table 3.4 提供了分组密码的概述。\n\
  \n**TABLE 3.4 Overview of Block Ciphers**\n\n| BLOCK CIPHER || BLOCK SIZE (`N`)\
  \ || KEY SIZE (`K`) || ROUNDS |\n\n| --- | --- | --- | --- |\n\n| DES || 64 || 56\
  \ || 16 |\n\n| --- | --- | --- | --- |\n\n| AES-128 || 128 || 128 || 10 |\n\n| AES-192\
  \ || 128 || 192 || 12 |\n\n| AES-256 || 128 || 256 || 14 |\n\n`DES` 密码由于其密钥长度短而不再被认为安全，但它开启了现代密码学的时代，因此在历史上很重要。因为\
  \ `DES` 不再安全，找到其替代品至关重要。 `AES` 在从十多个候选中评估和选择算法的五年过程中被选中。 三重 `DES` (`3DES`) 是 `DES`\
  \ 的重要演进，并在本节后面讨论。\n\n大多数分组密码，包括 `DES` 和 `AES`，都是由多轮数学函数构建的，如 Figure 3.17 所示。虽然轮数越多安全性越高，但也会减慢算法过程，因此选择是在安全性和速度之间权衡。\n\
  \n![FIGURE 3.17 Multiple rounds of mathematical functions in block ciphers](img/c03f017.png)\n\
  \n**FIGURE 3.17 Multiple rounds of mathematical functions in block ciphers**\n\n\
  不同分组密码之间的区别在于每个轮次执行的变换，以及加密密钥如何被拉伸然后分割以提供每个轮次的唯一密钥。\n\n构造分组密码使用的一些标准构建块有：\n\n* Substitution\
  \ or S-boxes (Figure 3.18)\n* Permutations or P-boxes (Figure 3.19)\n\n![FIGURE\
  \ 3.18 Block cipher with substitution of S-boxes](img/c03f018.png)\n\n**FIGURE 3.18\
  \ Block cipher with substitution of S-boxes**\n\n![FIGURE 3.19 Block cipher with\
  \ permutation of P-boxes](img/c03f019.png)\n\n**FIGURE 3.19 Block cipher with permutation\
  \ of P-boxes**\n\n`AES` 使用多轮替换和置换，而 `DES` 使用 16 轮 Feistel 网络。\n\n### Block Cipher\
  \ Modes of Operation\n\n像 `AES` 这样的分组密码接收八字节的明文并产生八字节的密文。但如果你的消息短于八字节，长于八字节，或不是八字节的倍数怎么办？\n\
  \n为了处理不是密码块长度倍数的消息，一个机制是在加密前添加填充，并在加密后移除填充。有很多方法可以做到这一点，但一种方法是向消息末尾添加字节，每个字节包含已添加字节数的计数（参见\
  \ Figure 3.20）。由于解密过程将检查最后一个块的最后一个字节以确定添加了多少填充字节（从而需要移除），如果明文是块大小的倍数，则必须添加一个仅包含填充的最终块。\n\
  \n![FIGURE 3.20 Adding padding at the end of a message in a block cipher](img/c03f020.png)\n\
  \n**FIGURE 3.20 Adding padding at the end of a message in a block cipher**\n\n填充并非没有风险，例如稍后在“侧信道攻击”部分描述的填充\
  \ Oracle 攻击。\n\n一旦消息被填充为密码块大小的精确倍数，它就可以被加密。最简单、最明显且最不安全的方法（对于较长消息）是 `ECB` 操作模式。在此模式下，明文的每个块由密码独立处理。虽然这对于不超过块大小的消息可能足够，但对于较长消息它有严重的弱点，因为相同的明文块会产生相同的密文块（Figure\
  \ 3.21）。\n\n即使在要加密的数据与块大小相同或更小的情况下（例如数据库中的数字字段），使用 `ECB` 也是不明智的，如果揭示表中不同行具有相同的值可能会损害保密性。作为一个简单的例子，如果使用\
  \ `ECB` 加密出生日期字段，那么就可以很容易地确定数据库中出生在同一天的所有人，如果你能确定其中一个人的出生日期，你就会知道所有人的出生日期（具有相同的加密出生日期）。\n\
  \n![FIGURE 3.21 ECB padding produces serious weaknesses for longer messages](img/c03f021.png)\n\
  \n**FIGURE 3.21 ECB padding produces serious weaknesses for longer messages**\n\n\
  `ECB` 的优点，除了其简单性之外，是加密可以并行进行（即在多个处理器之间划分），解密也可以。因此，一个块中的错误不会影响后续块。\n\n在 `CBC` 中，第一个数据块与称为\
  \ `IV` 的随机数据块进行 XOR。每个后续的明文块在加密前与前一个密文块进行 XOR。（参见 Figure 3.22。）\n\n\n\n\n\n![FIGURE\
  \ 3.22 CBC mode encryption](img/c03f022.png)\n\n**FIGURE 3.22 CBC mode encryption**\n\
  \n使用 CFB 模式时，`IV` 会先被加密，然后与明文的第一块进行 XOR，产生密文的第一块。然后该块密文被加密，结果与下一块明文进行 XOR，产生下一块密文。（参见\
  \ Figure 3.23。）\n\n由于在 CBC 和 CFB 中，块 `*Pn*[+1]` 的加密都依赖于块 `*Pn*` 的加密，因此这两种模式都不适合数据的并行加密。但这两种模式都可以并行解密。\n\
  \n![FIGURE 3.23 CFB mode encryption](img/c03f023.png)\n\n**FIGURE 3.23 CFB mode\
  \ encryption**\n\nCBC 与 CFB 的主要区别如下：\n\n* 在 CBC 中，`IV` 的一位变化会导致解密后密文的第一块中同一位产生相同变化。根据应用的不同，这可能会允许能够篡改\
  \ `IV` 的攻击者对消息的第一块进行更改。这意味着在使用 CBC 时有必要确保 `IV` 的完整性。\n* 在 CFB 中，`IV` 的一位变化会导致解密消息中出现随机错误；因此，这不是有效篡改消息的方法。\n\
  * 在 CBC 中，解密消息需要使用块密码的解密模式。在 CFB 中，块密码在加密和解密时都使用加密模式，这可能导致更简单的实现。\n\n这两种模式的问题在于加密无法并行化，并且由于需要在解密期望的块\
  \ `Cn` 之前先解密块 `C[n-1]`，随机访问变得复杂。\n\n### Counter Mode\n\n计数器 `CTR` 模式通过不使用 CBC 或\
  \ CFB 的前一个块来产生密文，从而解决了这个问题。（参见 Figure 3.24。）通过使用 `IV` 结合计数器值，可以同时并行化加密过程并解密密文的单个块。你会注意到\
  \ Figure 3.24 包含一个 nonce 值。该唯一随机生成的值被插入到每次块密码加密轮中。类似于随机“salt”值用于确保不同的哈希值（以防止与彩虹表比较），nonce\
  \ 是唯一的，旨在防止重放攻击。\n\n除了 ECB 之外的所有模式都需要一个 `IV`，该值必须传达给接收方，或者消息必须以一个一次性数据块作为前缀（因为在不知道\
  \ `IV` 的情况下解密 CBC 或 CFB 数据流只会导致第一个块出现问题）。\n\n![FIGURE 3.24 CTR mode encryption](img/c03f024.png)\n\
  \n**FIGURE 3.24 CTR mode encryption**\n\n`IV` 不必保密（它可以与密文一起以明文形式传输），但必须不可预测。如果攻击者能够预测下一个将被使用的\
  \ `IV` 并且能够发起选择明文攻击，那么这可能使对密文发起字典攻击成为可能。\n\n回到对称加密的整体概念，块密码和流密码都做了大多数人在思考密码学时所设想的事情。它们将可理解的文本转换为不可理解的表示形式，反之亦然。这作为一个封闭的盒子运行，无需区分加密密钥和解密密钥，而这正是非对称算法的情况。\n\
  \n一些常见的对称密钥算法包括 `DES`、`3DES`、`AES`，以及 Rivest 的密码（`RC`）。\n\n#### Data Encryption\
  \ Standard\n\n数据加密标准（`DES`）是一种在 1970 年代初期开发的对称密钥加密算法。该算法使用相当短的 56 位密钥长度，这最终导致它在\
  \ 1990 年代被认为不安全，并后来被 `AES` 算法取代（稍后讨论）。尽管是一种不安全的算法，`DES` 具有重要的历史背景，因为它将加密引入了商业界和公众，使其成为你应该了解的算法。\n\
  \n#### Triple DES\n\n顾名思义，`3DES` 算法对每个数据块应用 `DES` 算法三次。`3DES` 算法旨在通过将 56 位密钥长度增加到理论上的\
  \ 168 位来延长 `DES` 算法的使用寿命。撇开理论不谈，该算法的一些实际限制将 `3DES` 算法的有效密钥大小降低到约 112 位。此外，`3DES`\
  \ 被发现易受选择明文和已知明文攻击，进一步将有效密钥长度降低到 80 位。鉴于这些弱点，`3DES` 也被认为不安全，并在 2017 年被 NIST 弃用。\n\
  \n#### Advanced Encryption Standard\n\n`AES`，最初称为 Rijndael 块密码，于 2001 年由 NIST 宣布并被美国政府采用，以取代\
  \ `DES` 作为敏感和机密数据的标准。\n\n`AES` 算法使用三种不同的密钥长度：128、192 和 256 位。该算法旨在简单、快速，并且易于在硬件或软件中实现和操作。截至本书撰写时，`AES`\
  \ 仍被认为是一种安全的算法。\n\n#### Rivest Ciphers\n\n罗恩·里维斯特博士（RSA 算法中提到的“R”）开发了多种对称密钥算法，统称为\
  \ Rivest 密码。这些算法标注为 `RCn`，你应该熟悉以下四种：\n\n* `RC2` 是一种块密码，于 1987 年开发，使用 64 位块大小和可变长度密钥。`RC2`\
  \ 易受选择明文攻击，不应使用。\n* `RC4` 是一种流密码，常用于 TLS 和 SSH 等互联网协议。`RC4` 密钥长度可变，范围从 40 到 2048\
  \ 位。`RC4` 不被认为安全，不应使用，尽管它在许多地方仍然存在。\n* `RC5` 与 `RC2` 块密码类似，但具有可变块大小（32、64 或 128\
  \ 位）和可变密钥大小（0 到 2040 位）。`RC5` 在足够轮次的加密下被认为安全。\n* `RC6` 是 `RC5` 的衍生版本，使用 128 位块大小和可变长度密钥（128、192\
  \ 或 256 位）。`RC4` 密码是 AES 竞赛的决赛入围者。`RC6` 是对 `RC5` 的改进，被认为是一种安全的算法。\n\n### Asymmetric\
  \ Encryption (Public Key Cryptography)\n\n对称加密的问题在于通信双方（我们在示例中称之为 Alice 和 Bob）都必须知道用于加密数据的秘密密钥，并且如果加密数据要保持保密，则任何人都不得知道或猜到该秘密密钥。随着参与人数超过少数几人，管理和共享秘密密钥的困难可能使对称加密变得过于复杂。\n\
  \n如果有 `n` 个人需要使用对称密码学安全通信，则必须有 `n`（`n`-1）/ 2 个唯一密钥，并且每个人必须管理（并安排共享）`n` - 1 个密钥。这不可行。\n\
  \n解决方案是非对称或公钥密码学。公钥密码学的魔力在于，与其使用单个秘密密钥同时用于加密和解密信息，你拥有两个密钥：一个秘密私钥和一个非秘密公钥。使用公钥密码学算法用其中一个密钥加密的数据只能用另一个密钥解密。例如，如果\
  \ Alice 使用 Bob 的公钥加密给 Bob 的消息，只有 Bob 可以用他的私钥解密。反之，如果 Alice 使用她的秘密私钥加密消息，那么任何人都可以解密它，因为\
  \ Alice 的公钥是，嗯，公开的。\n\n\n\n\n\n显然，仅用私钥加密消息并不能保护爱丽丝消息的保密性，但它有不同的目的：它证明了该消息源自爱丽丝（因为还有谁能产生它呢？）。当然，这假设爱丽丝的私钥一直保持私密。但如果不是呢？这就引出了下一节关于\
  \ PKI 以及公钥和私钥如何管理的主题。\n\n有许多公钥加密算法，都基于数学函数，这些函数正向执行很容易，但在没有已知秘密的情况下反向执行则极其耗时。\n\n\
  这种被称为陷门函数的函数，其计算 `f(x)` 很简单，但计算逆函数（例如，仅知道 `f(x)` 的值时确定 `x`）则极其困难，除非知道第二个变量 `y` 的值。\n\
  \n最著名的基于陷门函数的加密算法是由 Ron Rivest、Adi Shamir 和 Leonard Adleman 最先发表的。它被称为 RSA，基于分解大整数的难度。\n\
  \n选择两个大素数 `p` 和 `q` 并计算以下内容：\n\n`n` = `p q`\n\n这三个数字随后用于生成公钥指数 `e` 和私钥指数 `d`。数字\
  \ `e` 和 `n` 公开；`e`、`p` 和 `q` 保持秘密。\n\n消息使用 `e` 和 `n`（公钥）对消息进行整数模运算进行加密。消息使用 `d`（私钥）和\
  \ `n` 进行类似的数学运算解密。\n\n该方法之所以有效，是因为从 `n` 和 `e` 推导出 `d` 等同于找到 `n` 的两个素数因子，如果 `n` 是一个非常大的半素数（即两个大小相似的素数的乘积），那么这在计算上是不可行的（至少对于非量子计算机而言）。迄今为止分解的最大半素数在\
  \ 2009 年有 232 位十进制数字，花费了 1,500 处理器年。RSA 中使用的半素数有 600 多位数字。\n\n一些更常见的非对称密钥算法包括 Diffie–Hellman–Merkle、RSA、ElGamal\
  \ 和椭圆曲线密码学（ECC）。\n\n### Diffie–Hellman–Merkle 密钥交换\n\nDiffie–Hellman–Merkle 密钥交换是一种安全交换加密密钥的方法。该方法由\
  \ Whitfield Diffie 和 Martin Hellman 于 1976 年开发，是公钥密码学的首个已知实现。与其后的许多非对称密钥算法一样，Diffie–Hellman–Merkle\
  \ 算法基于对数数学。与之前的加密算法不同，Diffie–Hellman–Merkle 算法不用于加密或解密，而是用于使双方能够安全地生成共享的秘密密钥，用于其（对称密钥）加密通信。\n\
  \n### RSA\n\nRSA（Rivest-Shamir-Adleman）是一种用于加密和签名数据的非对称密钥算法。该算法的安全性基于分解两个大素数的难度。RSA\
  \ 算法由 Ron Rivest 博士、Adi Shamir 和 Len Adleman 于 1978 年首次开发，至今仍是最常用的公钥加密算法之一。\n\n\
  ### ElGamal\n\nElGamal 是一种用于传输数字签名和密钥交换的非对称密钥算法。ElGamal 算法源自 Diffie–Hellman–Merkle\
  \ 算法（前面讨论过），再次基于离散对数问题求解。\n\n### 椭圆曲线密码学\n\nECC 是一种公钥密码学方法，其基于比其他公钥算法方法更复杂的计算。早期公钥系统的安全性基于分解一组大素整数的难度，而\
  \ ECC 基于椭圆曲线的代数结构（参见 Figure 3.25），其可能变得相当复杂。\n\nECC 的一个关键优势是它允许使用更小的密钥获得等效的安全性。例如，256\
  \ 位 ECC 密钥相当于 3,072 位 RSA 密钥。使用更小的密钥可带来更快的计算；因此，ECC 比其他公钥算法更高效，允许其用于更多应用——特别是资源受限的应用。\n\
  \n几种基于离散对数的算法已被改编为 ECC。虽然它经常与 RSA 一起讨论，但基于传统 Diffie–Hellman–Merkle 方案的椭圆曲线 Diffie–Hellman–Merkle（ECDH）方案、基于数字签名算法的椭圆曲线数字签名算法（ECDSA）以及其他几种方案都存在。\n\
  \n![FIGURE 3.25 Elliptic curve](img/c03f025.png)\n\n**FIGURE 3.25 Elliptic curve**\n\
  \n#### 量子密码学\n\n量子力学的一个特性使其适用于密码学，即任何对量子系统进行观察或测量的尝试都会扰乱它。这提供了一种传输秘密加密密钥的基础，使得如果被窃听者截获，可以被检测到。因此，爱丽丝首先使用量子密钥分发（QKD）向鲍勃发送一个秘密密钥，鲍勃检查它是否已被截获。如果已被截获，他会要求另一个密钥。如果没有，他会通知爱丽丝开始使用对称密码或一次性密码本以及该密钥发送加密消息，确保只有爱丽丝和他可以访问该密钥，因此通信将保持秘密。QKD\
  \ 基础设施在全球范围内持续变得越来越受欢迎。欧洲电信标准协会（ETSI）提供了了解更多关于 QKD 的绝佳资源：`www.etsi.org/technologies/quantum-key-distribution`。\n\
  \n由于这依赖于自然的基本属性，因此它不受计算能力进步或更复杂的密码分析技术的影响。\n\n随着量子计算的出现及其在加密和解密中的应用，人们越来越担心今天的安全算法可能在任何时刻被破解。后量子或“量子安全”设备正在安全市场中变得普遍，以为后量子世界做好准备。量子安全设备声称基于当前密码学研究和量子计算研究的现状，能够抵抗窃听和破坏。ETSI\
  \ 量子安全密码学（QSC）工作组旨在评估并为量子安全协议和实现提供建议。\n\n### 公钥基础设施\n\n在“非对称加密（公钥密码学）”部分，我们讨论了公钥的概念，即爱丽丝可以向鲍勃发送只有鲍勃可以解密的消息，而无需爱丽丝事先与鲍勃保密共享对称密码密钥。为此，爱丽丝需要信任她使用的公钥确实真正属于鲍勃。显然，她可以直接从鲍勃那里获得公钥，但爱丽丝不可能直接且安全地获得她想要安全通信的每个个人和组织的公钥。公钥解决了每个人必须与每个人共享唯一的秘密对称密钥的问题（前面描述的\
  \ `n(n-1)/2` 问题），但除非我们有一种可扩展的方法来建立信任，否则我们只是用建立 `n(n-1)/2` 信任关系的问题取代了共享 `n(n-1)/2`\
  \ 对称密钥的问题。\n\n引入受信任的第三方——一个被非对称交易双方信任的中介：爱丽丝，即声称拥有其公钥的人，以及鲍勃，他需要确保爱丽丝声称属于她的公钥确实属于她（而不是冒充爱丽丝的\
  \ Michelle）。\n\n\n\n\n\n该过程始于 Alice 创建一个证书签名请求（`CSR`）。这是一个包含 Alice 身份详情（姓名、地点和电子邮件地址）及其公钥的文件。`CSR`\
  \ 由 Alice 使用其私钥签名。要求对 `CSR` 进行签名可防止除公钥所有者之外的人为该密钥请求证书。\n\nAlice 将她的公钥发送给证书颁发机构，并附上\
  \ `CA` 可能要求的对其身份的证明。`CA` 验证 Alice 的身份，然后对她的公钥进行数字签名并返回一个文件（证书），其中包含 Alice 的公钥以及\
  \ `CA` 的证明，证明该密钥确实属于 Alice。\n\n公钥证书（也称为 *数字证书*）的标准是 `X.509`，由国际电信联盟（`ITU`）定义。`X.509`\
  \ 证书包含以下内容：\n\n*   版本号\n*   序列号\n*   签名算法 ID\n*   签发者（`CA`）名称\n*   有效期（开始时间，结束时间）\n\
  *   主体名称\n*   主体公钥（算法，公钥）\n*   密钥用途\n*   可选扩展\n*   证书签名（算法，签名）\n\n在用于加密电子邮件、代码签名或数字签名的\
  \ `PKI` 证书中，证书的主体是个体或组织。对于用于保护 `TLS`（保护安全 `HTTPS` 浏览器连接的协议）的 `PKI` 证书，主体是服务器（例如网站的域名）。\n\
  \n对于网站证书，网站所有者生成一个公钥/私钥对，然后准备一个包含以下内容的密钥签名请求：\n\n*   网站的域名（带或不带通配符）\n*   网站所有者的身份\n\
  *   网站所有者的公钥\n*   网站所有者的数字签名\n\n证书是数字证明，证明签发证书颁发机构（`CA`）已证明（在证书类型所暗示的范围内）已验证了主体的身份。通过使用签发者的私钥对证书进行签名，签发者将主体的身份与其公钥绑定在一起，以一种无法篡改且只能由签发者生成的方式（但请参阅以下警告）。\n\
  \n谁是授予证书的这个证书颁发机构呢？任何人都可以。Alice 可以成为自己的 `CA` 并签署自己的证书。这些被称为 *自签名证书*，在信任可以直接建立的情况下很有用。例如，公司可能会为其内部企业内联网签署自己的网站证书，并配置员工计算机上的浏览器信任这些证书。\n\
  \n但如果 Alice 想与更广阔的世界通信，这就不够了。已建立了商业 `CA`，它们提供验证身份并签署个人密钥并生成数字证书的服务。\n\n这些证书之所以有效，是因为生成它们的\
  \ `CA` 已被主要网络浏览器公司（例如 Apple、Google、Microsoft、Mozilla 等）审查过，这些公司已配置其浏览器信任由这些 `CA`\
  \ 签名的证书。\n\n为确保安全，网站所有者的私钥必须保持保密。如果攻击者能够获取（或猜测）该密钥，则与网站的通信可能会被破坏，要么是通过冒充网站，要么是通过\
  \ `MITM` 攻击。\n\n同样，如果 `CA` 使用的私钥被泄露，则攻击者可以生成冒充网站所有者的私钥/公钥对并冒充或 `MITM` 该网站。\n\n因此，`PKI`\
  \ 的安全性完全取决于私钥的保密性——既包括参与者的密钥，也包括 `CA` 的密钥。\n\n在加密会话中使用证书之前，存在多种方法来验证证书的有效性。所有依赖于\
  \ `PKI` 的协议都包括对证书的某种检查，以确定它是否已被报告为受损（因此不再受信任）。有几种证书验证方法。\n\n最初的方法是浏览器从 `CA` 下载证书吊销列表（`CRL`）。在接受证书（即使它已正确签名）之前，会对照\
  \ `CRL` 检查它是否已被吊销，如果已吊销，则会警告用户通信链路不安全。\n\n`CRL` 的问题，其中最主要的是其庞大的大小，导致了在线证书状态协议（`OCSP`）的发展，`OCSP`\
  \ 定义于 `RFC 6960`，它提供证书的实时状态，由 `CA` 返回“Good”、“Revoked”或“Unknown”回复。\n\n至少有一款浏览器（例如\
  \ Google Chrome）认为 `CRL` 和 `OCSP` 的问题需要不同的方法，并改为依赖由 Google 定期更新的内部吊销证书列表。\n\n关于\
  \ `PKI` 还有一个最后的细节需要考虑。为了降低 `CA` 根私钥被泄露的可能性，它永远不会用于签署网站证书。它用于签署有限数量的子 ordinate 或中间证书，而这些证书用于签署网站证书。或者，在某些情况下，子\
  \ ordinate 证书可用于生成第三级子 ordinate 证书，依此类推，形成证书链（见 Figure 3.26）。验证网站需要从网站的证书开始，依次经过任意数量的子\
  \ ordinate 证书，直到到达 `CA` 的根证书。\n\n![FIGURE 3.26 A certificate chain protects a CA's\
  \ root private key](img/c03f026.png)\n\n**FIGURE 3.26 A certificate chain protects\
  \ a CA's root private key**\n\n需要信任链和 `CA` 使公钥加密的使用变得相当复杂。有一种名为基于 DNS 的命名实体身份验证（`DANE`）的协议，可消除对\
  \ `CA` 的需求，但该协议未被浏览器广泛支持，因此未被网站采用。\n\n## 密钥管理实践\n\n安全使用密码学取决于保持对称密钥和私钥的机密性。能够获取或猜测密钥的攻击者可以破坏该密钥所保护的数据的保密性和完整性。\n\
  \n适当的密码学密钥管理包括以下内容：\n\n*   安全的密钥生成\n*   安全的密钥存储和使用\n*   职责分离、双重控制和知识分割\n*   及时的密钥轮换和密钥变更\n\
  *   密钥销毁\n\n### 安全的密钥生成\n\n使密码学密钥安全的有两个因素：长度和随机性。长且随机的密钥具有更高的“密钥强度”，如本节前面所述。\n\n\
  通常，密钥越长，攻击加密消息就越困难——但随着计算机能力的增强和密码分析技术的不断完善，构成安全密钥长度的标准会随时间而变化。1977 年，美国政府选择了一种对称分组密码，命名为\
  \ `DES`，被认为适用于非机密用途（例如银行、电子商务等）。1999 年，证明 `DES` 加密的消息可在 24 小时内被破解。\n\n估计使用现代计算机，对\
  \ 128 位密钥进行暴力攻击需要的时间超过宇宙的年龄（约 140 亿年）才能破解。当然，随着计算能力的持续提升，以及量子计算的日益成熟，这些估计终有一天会被打破，并会出现对更长密钥长度的需求。\n\
  \n\n\n\n\n对称密钥的强度还取决于其不可预测性（即不可猜测）。即使只能猜出其中的部分比特，也会显著降低密码的强度。使用能够生成高质量（即密码学安全）随机数的机制对于密钥生成至关重要。最佳方法是使用基于硬件的真随机数生成器，其依赖于已知真正随机的物理现象。此类设备嵌入在各种加密硬件设备中，例如\
  \ `TPMs` 和 `HSMs`，前面已讨论过，以及一些微处理器。\n\n*基于软件的随机数生成器*（`RNGs`），最好称为 *伪随机数生成器*，很难做到正确。例如，从\
  \ 2006 年到 2008 年，`OpenSSL` 软件包在 `Debian` 和 `Ubuntu` Linux 发行版中引入的一个缺陷导致所有生成的密钥都很弱，因为随机数生成器存在漏洞（`CVE-2008-0166`）。\n\
  \n## 安全的密钥存储和使用\n\n一旦你生成了一个很长且随机的密钥，如何保持其保密？显然，第一步是用另一个密钥，即密钥加密密钥（`KEK`）来加密你的数据加密密钥（`DEK`）。这解决了问题，但又产生了一个新问题：如何保护你的\
  \ `KEK`？这取决于被加密的底层数据的敏感性以及为你设计的系统所适用的机制。\n\n`HSM` 专为安全生成和存储 `KEKs` 而设计，是保护密钥的较为安全的方法之一。`HSMs`\
  \ 还提供在冗余 `HSMs` 之间安全复制 `KEKs` 的方式，并强制执行控制措施，以确保没有个人可以单独使用 `KEK` 来解密数据加密密钥。银行、支付处理商和其他高度受监管组织的合规制度通常要求使用\
  \ `HSM`。作为 `CISSP`，你应了解组织的合规要求，并确定 `HSM` 对你的公司是否必需（或有益）。\n\n对于部署在公有云中的系统，主要云服务提供商提供\
  \ `HSM` 技术的云实现。市场上还有许多 `HSM` 即服务（`HSMaaS`）供应商，通常作为与密钥托管和加密加速等其他加密功能一起提供的服务。\n\n\
  对于要求不高的应用，方法必须根据具体要求和风险进行定制。可以将主密钥存储在以下任何位置：\n\n*   一个硬件加密的 USB 密钥\n*   一个密码管理应用\n\
  *   一个密钥管理包\n\n另一个需要考虑的因素是你的密钥如何（安全地）备份。丢失对密钥的访问可能会导致你丢失大量其他数据（以及该数据的备份）的访问权限。\n\
  \n## 职责分离、双重控制和分割知识\n\n某些密钥和数据过于敏感，内部威胁（例如， rogue 或不满的员工）的风险太大，不能允许单个个人访问密钥加密密钥、数据加密密钥和加密数据，或单独访问\
  \ `HSM` 的管理功能。\n\n以下三种类型的控制用于降低 rogue 员工的风险：\n\n*   职责分离\n*   双重控制\n*   分割知识\n\n\
  这三个概念相关但不同。\n\n*职责分离*（有时称为 *职责隔离*）意味着某些流程应至少需要两个不同的人从头到尾完成。在金融领域，这可能涉及确保有权开具支票的人不是对账银行对账单的人。在密码学领域，这可能规定有权访问加密密钥的人无权访问加密数据。职责分离的另一种形式是确保管理系统的员工无权干预日志系统或篡改日志。\n\
  \n双重控制意味着流程中的特定步骤需要两个或更多个人。在金融领域，这将是要求每张支票上都有两个签名。在密码学领域，这可能要求两个或更多个人出示其凭证才能使用密钥加密密钥解密数据加密密钥。\n\
  \n对于支持多因素身份验证的系统访问，双重控制可能涉及将密码委托给一个人，而将 MFA 设备委托给另一个人。\n\n请注意，双重控制经常被错误地称为职责分离。请注意区别并检查控制措施，以确定它确实是职责分离还是双重控制。\n\
  \n分割知识是指将密钥（或密码）拆分为两个或多个部分，使得每个部分单独不可用，并且需要将两个（或更多）部分组合起来才能解密数据（或访问系统）。\n\n例如，供应商可能会生成一个大密钥并将其拆分为（例如\
  \ `m`）多个部分。在此模型中，至少需要 `n` 个部分才能重建密钥加密密钥。数字 `n` 和 `m` 是可配置的，因此可以例如将密钥拆分为十二个部分，但只需要任意三个密钥持有者聚在一起即可解锁密钥。\n\
  \n## 及时的密钥轮换和密钥变更\n\n密钥应具有有限的生命周期。如果有证据或甚至怀疑密钥已被泄露，应尽快轮换。即使密钥的保密性得以保持，也应定期更换。此外，最佳实践是在有权访问加密材料的关键人员离职时也执行密钥轮换。\n\
  \n尽管行业标准各不相同，但 `NIST` 和支付卡行业（`PCI`）的当前指导是至少每年轮换一次数据加密密钥。实际上，用于加密新数据的密钥每年都会更改，并且所有先前加密的数据都使用退役密钥解密，并在密钥轮换后的当年内使用新密钥重新加密。因此，在密钥轮换后一年的结束时，不再有使用退役密钥加密的数据，此时可以销毁该密钥。在必须维护超过一年的备份的情况下，必须建立安全归档退役密钥的流程，或者备份也必须使用新密钥重新加密。\n\
  \n为什么要轮换密钥？\n\n*   以防攻击者发现密钥时限制损害\n*   限制使用同一密钥加密的数据量（使用同一密钥加密的数据越多，破解加密就越容易）\n\
  *   限制攻击者破解密码的时间（如果你的数据在一年以上的时间内没有使用同一密钥加密，那么任何暴力攻击都必须能够在密钥生成后一年内完成）\n\n## 密钥销毁\n\
  \n一旦密钥已退役，并且确定没有使用该密钥加密的数据需要解密，则必须安全地销毁该密钥。这涉及找到密钥的每个副本并以适合其存储介质的方式删除，以确保无法恢复。\n\
  \n根据介质以及其被未经授权的个人访问的风险，这可能需要覆盖存储、消磁介质，或物理销毁包含介质的介质或设备。\n\n应保留记录，记录被销毁密钥的位置以及为确保安全销毁而采用的手段。\n\
  \n## 数字签名和数字证书\n\n\n\n\n\n`Digital signatures` 使用密码技术来复制签名的意图：身份验证（使收件人确信消息来自特定实体）、不可否认性（证明发送者确实撰写了该消息的证据）以及完整性（确信消息在签名后未被篡改）。`Digital\
  \ certificates` 是用于证明公钥所有权的电子文档；这一概念在本书本章前面的“Public Key Infrastructure”部分有讨论。\n\n\
  Figure 3.27 说明了基本流程。待签名的消息会通过一个密码学安全的哈希函数，该函数产生一个固定长度的输出（通常在 160 到 512 位之间），称为 `Message\
  \ Digest`。该哈希值随后使用消息作者的私钥加密，以产生数字签名。数字签名作为附录与消息一起传输。\n\n当收件人想要验证文档时，他们会计算所接收消息的\
  \ `Message Digest`。然后他们使用作者的公钥解密数字签名，以产生发送者的 `Message Digest`。如果两者相同，则收件人知道以下内容：\n\
  \n1. 消息未被篡改（即完整性得以保持）。\n2. 消息来自公钥/私钥对的所有者（即身份验证和不可否认性）。\n\n![FIGURE 3.27 Producing\
  \ and verifying a digital signature](img/c03f027.png)\n\n**FIGURE 3.27 Producing\
  \ and verifying a digital signature**\n\n断言 2 要求收件人有充分理由相信用于验证数字签名的公钥由发送者拥有。这可以通过直接密钥共享来实现（即在通信之前，发送者在防止篡改的安全方式下向收件人提供其公钥），也可以通过向\
  \ CA 注册公钥来实现（正如本章前面关于 PKI 的部分所述），CA 承担验证发送者身份的责任。\n\n为了保护数字签名的安全性，强烈建议用于签名消息的私钥仅用于数字签名，而不用于任何其他目的（如一般消息加密）。\n\
  \n数字签名存在若干可能的安全漏洞：\n\n* `Hash collision`\n* Private key disclosure\n* CA compromise\n\
  \n数字签名的安全性取决于消息正文的任何更改都会导致 `Message Digest` 发生变化。如果攻击者能够创建两个消息，在经过哈希算法时产生相同的 `Message\
  \ Digest`（称为 `hash collision`），则数字签名将不再可靠。\n\n为了使收件人确信消息确实源自作者，发送者的私钥必须保持安全，因为一旦获得该密钥，攻击者就可以签署任何消息（包括被篡改的消息），从而破坏数字签名的任何有效性。为缓解这种情况，所有\
  \ PKI 模型都包含密钥撤销列表的概念，该列表记录了所有已被（或怀疑已被）泄露或退役的密钥。\n\n最后，检查消息是否与发送者的公钥匹配取决于知道该公钥确实是发送者的。通常，这是通过\
  \ CA 将所有者身份与公钥绑定来实现的，公钥的接收者依赖于他们对 CA 的信任来信任该公钥。但如果 CA 被入侵，攻击者可以伪造公钥的身份并“伪造”数字签名。\n\
  \n### Nonrepudiation\n\n`Nonrepudiation` 是证明消息必须源自特定实体的能力。例如，对于合同或其他法律文件，以及银行指令或供应商订单，这可能至关重要。只有在能够证明所接收通信的不可否认性时，收件人才能确信地根据消息采取行动，并确信发送者对其内容负责。\n\
  \n不可否认性是通过发送者使用只有发送者知道的私钥对消息进行签名来实现的，并且发送者承诺保护该私钥。保护私钥意味着保持其机密性，如果密钥被泄露，则及时撤销对应的公钥。\n\
  \n对不可否认性属性的主要风险是发送者私钥的泄露。如前所述，如果私钥可以被获取（或猜出），攻击者就可以签署任何消息，并使其被接受为好像私钥所有者发送的消息一样（例如，“向银行账户\
  \ XXX 转账 100,000 美元”）。\n\n为了确保即使用于签名的私钥被泄露，数字签名仍能保持不可否认性，可以使用可信时间戳来证明消息是在私钥被泄露的时间之前签名的。IETF\
  \ 标准 RFC 3161 定义了与时间戳机构 TSA 一起使用的协议，以提供可信时间戳。TSA 与 CA 类似，是一个可信的第三方，提供保证。TSA 断言特定数据在某个时间点存在，以一种方式使时间戳的接收者确信（如果\
  \ TSA 可信），该断言是正确的，并且时间戳未被篡改，也无法被篡改。\n\n次要风险来自 PKI 的弱点，导致消息的接收者被误导，以为某个公钥与某个实体相关联，而实际上攻击者生成了该公钥并设法伪造了与其关联的身份。例如，这就是\
  \ DigiNotar CA 被入侵时发生的情况，攻击者能够生成声称来自 Google 和其他公司的公钥。（参见本章前面“DigiNotar: When a Trusted\
  \ CA Is Compromised”侧边栏。）\n\n#### Blockchain and Nonrepudiation\n\n实现不可否认性的另一种方法是使用区块链。区块链是一种去中心化和分布式账本，其中记录被记录并通过密码学哈希链接在一起，这意味着要更改区块链中的任何记录，就必须更改其后的每个区块。由于区块链是分布式的（即由多个系统存储），因此需要区块链参与者的大多数串通。对于足够广泛（且独立）运营的区块链来说，这是不可行的。例如，比特币目前（2021\
  \ 年初）大约有 12,000 个节点分布在 100 个国家。\n\n诸如不可否认性之类的好处推动了该技术在供应链管理等业务应用中的采用。福特汽车公司等组织已开始探索区块链技术用于其供应链管理，因为它能够实现更快、更具成本效益的产品交付并增强产品的可追溯性（即不可否认性）。\n\
  \n### Integrity\n\n密码学方法不仅可以保护消息的保密性并帮助证明发送者的身份，还可以用于通过检测篡改来保护消息的完整性。完整性是一个核心安全概念，是众所周知的\
  \ CIA 三要素的一部分，并在 Chapter 1 中介绍。有关完整性及其如何实现和验证的更多信息，请参阅该章中标题为“Understand and Apply\
  \ Security Concepts”的部分。\n\n`hash function` 是一种算法，它接收数据块（即消息或文件）并计算一个派生值，使得对数据的任何更改都会导致哈希值发生变化。有效的哈希函数还需要其他属性，这将在本章中介绍。\n\
  \n\n\n\n\n该函数可用于通过比较原始数据的哈希值与稍后时间点的数据的哈希值来验证数据的完整性。\n\n使用加密哈希来检测消息是否被篡改涉及以下三个步骤（如\
  \ Figure 3.28 所示）：\n1. 通过将哈希函数应用于原始数据块或消息 (`M[1]`) 来生成哈希值 (`H[1]`)。\n2. 通过将哈希函数应用于待验证的数据块或消息\
  \ (`M[2]`) 来生成哈希值 (`H[2]`)。\n3. 如果 (`H[1]`) 与 (`H[2]`) 相同，则表明这两个消息很可能相同且未被篡改。然而，正如我们即将看到的，关键问题是“有多可能？”\
  \ 如果两个消息的哈希值相同，我们对这两个消息相同的信心程度应有多高？\n\n![FIGURE 3.28 Steps for using a cryptographic\
  \ hash to detect tampering of a message ¶ From NIST Special Publication SP800-175B,\
  \ “Guideline for Using Cryptographic Standards in the Federal Government: Cryptographic\
  \ Mechanisms”](img/c03f028.png)\n\n**FIGURE 3.28 Steps for using a cryptographic\
  \ hash to detect tampering of a message** ¶ From NIST Special Publication SP800**\\\
  -**175B, “Guideline for Using Cryptographic Standards in the Federal Government:\
  \ *Cryptographic Mechanisms”*\n\n要理解哈希，让我们考虑一个简单的例子，即校验和。*校验和* 是一种数学函数，它接收一个数据块并计算一个数字（校验和），其方式是数据块的任何单次更改都会导致校验和数字发生变化。如名称所示，校验和通常是通过将消息中每个字节作为无符号整数求和并忽略任何溢出来计算的。\n\
  \n当主要威胁来自通信信道中的噪声或其他缺陷时，数据包会携带校验和，接收方可利用它来确定数据在传输过程中是否已损坏。接收方重新计算数据包的校验和，将其与发送方计算并附加到消息中的校验和进行比较，如果两者不匹配，接收方就会知道消息在接收时存在错误。\n\
  \n在消息更改是随机的而不是恶意的情况下，简单的校验和足以保护消息的完整性。但想象一下威胁行为者想要篡改消息的情况。原本是转账 $100 的订单，恶意代理希望将消息更改为转账\
  \ $100,000。显然，如果仅更改金额字段，则校验和不太可能匹配，他的篡改很可能会被发现。\n\n然而，这对我们的攻击者来说不是问题，他了解用于计算校验和的算法，并且可以进一步篡改消息，要么通过对消息内容做出其他更改以使校验和保持不变，要么通过计算新的校验和并覆盖原始校验和。采用任何一种方法，校验和都会验证通过，欺诈性转账\
  \ $100,000 的消息将被接受为有效。\n\n例如，考虑以下传输，其中 `[0x116c]` 是发送方附加到消息的校验和：\n\n```\nTRANSFER\
  \ $100.00 TO JANE DOE FOR OFFICE AND MISC EXPENSES IN DECEMBER [0x116c]\n```\n\n\
  我们的攻击者希望发送一条略有不同的消息（但复制了原始消息的校验和）：\n\n```\nTRANSFER $100,000.00 TO JANE DOE FOR\
  \ OFFICE AND MISC EXPENSES IN DECEMBER [0x116c]\n```\n\n问题是新消息的实际校验和 (`0x1228`)\
  \ 与声明的校验和 (`0x166c`) 不匹配，因此他的篡改会被检测到。\n\n一种可能的攻击是对消息做出其他更改，以便校验和与原始消息相同：\n\n```\n\
  TRANSFER $100,000.00 TO JANE DOE FOR OFFICE MISC EXPENSES IN DECEMBER7 [0x116c]\n\
  ```\n\n其校验和与原始消息相同，为 `0x116c`。或者，攻击者可以覆盖附加到消息的校验和，使其成为篡改后消息的校验和：\n\n```\nTRANSFER\
  \ $100,000.00 TO JANE DOE FOR OFFICE AND MISC EXPENSES IN DECEMBER [0x1228]\n```\n\
  \n很明显，使用简单的校验和并将其包含在消息中并不能检测恶意篡改，但它有助于避免传输或数据输入中的非恶意错误。校验和通常用于防止信用卡、政府身份证号码和其他类型验证流程中的偶然错误。最常用的算法之一是\
  \ Luhn 算法，该算法由 ISO/IEC 7812-1 规定。\n\n当校验和不足时，我们需要一种验证消息完整性的方法，攻击者无法轻易规避。为了保护数据的完整性，我们需要一个哈希函数，其复杂性足以使其几乎不可能创建与另一条消息具有相同哈希值的消息。当两个不同的消息生成相同的哈希值时，称为\
  \ *碰撞*，因此我们需要一个哈希函数，使其几乎不可能创建有意的碰撞。\n\n在我们之前的示例中，有两个因素使得创建碰撞变得微不足道：\n* 算法的简单性使得很容易确定需要对修改后的消息做出哪些更改以使哈希（校验和）与原始消息的哈希相匹配。\n\
  * 即使算法复杂，哈希的短小（16 位）意味着只有 65,536 种可能的哈希值，反复对消息末尾进行随机更改，直到偶然发生碰撞所需的时间并不长。\n\n因此，密码学安全的哈希算法必须足够复杂，以至于不可能确定需要对消息做出哪些更改才能创建特定的哈希结果，并且哈希值的长度（即位数）必须足够大，以使暴力攻击在计算上不可行。\n\
  \n负责研究和推荐合适的密码算法的组织之一是 NIST。他们的指南之一 FIPS 202 推荐了一类称为安全哈希算法-3 (`SHA-3`) 的算法。`SHA-3`\
  \ 函数集包括产生哈希值长度从 224 到 512 位不等的哈希函数。\n\n使用 `SHA-3`，我们可以计算出一个非常难以通过创建有意碰撞来攻击的哈希值——但我们如何防止攻击者简单地为更改后的消息计算新的哈希值并覆盖原始哈希？为此，我们需要使用一个结合了只有发送方和接收方知道的密钥的加密哈希。哈希值不仅取决于消息的内容，还取决于此密钥。\n\
  \n一种称为基于哈希的消息认证码 (`HMAC`) 的方法由 Bellare、Canetti 和 Krawczyk 开发，并在 RFC-2104 中正式确定。该算法将密钥（已与字符串进行\
  \ XOR 以填充到固定长度）与消息连接并对其进行哈希处理。然后它将该哈希值与密钥再次组合，并进行第二次哈希处理，生成 `HMAC` 值（参见 Figure 3.29）。如果攻击者在不知道密钥\
  \ `K` 的情况下更改消息，`HMAC` 值将不匹配。这使接收方能够验证消息的完整性和来源（即身份验证或不可否认性）。\n\n\n\n\n\n除了其他用途外，`HMAC`\
  \ 函数可在 `IPsec` 和 `TLS` 协议中发现。然而，这其中存在的问题与在对称加密上下文中讨论的问题类似。在发送方和接收方之间安全地共享密钥可能很困难且繁琐。那又怎样呢？正如对称加密中共享密钥问题的解决方案是使用公钥/私钥和非对称加密一样，对于密码哈希，我们可以使用发送方的私钥对哈希进行加密，任何人都可以利用发送方的公钥对其进行验证，但没有人可以在没有私钥的情况下伪造它。这就是数字签名（在本章前面“数字签名”部分讨论过）。\n\
  \n![FIGURE 3.29 HMAC process](img/c03f029.png)\n\n**FIGURE 3.29 HMAC process**\n\
  \n`HMAC` 是一种确保消息完整性和身份验证的较不复杂的方法，但需要共享对称密码密钥的开销。数字签名消除了共享秘密的需要，但需要 `PKI` 的开销。每种方法都有其应用。\n\
  \n## UNDERSTAND METHODS OF CRYPTANALYTIC ATTACKS\n\n了解密码学如何被攻击很重要，这样你才能了解漏洞可能出现在哪里，以及密码学的错误应用如何导致漏洞。\n\
  \n作为一名安全架构师，你需要了解攻击者可以利用的架构弱点，以便确保你的设计避免或减轻这些风险。但作为一名安全架构师，你不必担心诸如对称密码的关联密钥攻击等细微差别。这是负责开发新密码算法或测试现有密码的密码学家的关注点。作为一名安全架构师，你的兴趣更多地在于关注欧洲网络安全局（`ENISA`）和\
  \ `NIST` 等机构的新闻，这些机构负责就应使用哪些算法（以及如何使用）做出审慎的建议，以便当密码分析人员发现新的攻击向量时，你可以在选择（或更新）所使用的密码时将他们的发现纳入考虑。\n\
  \n### Brute Force\n\n在 *暴力攻击* 中，攻击者尝试所有可能的密钥值，直到找到可用的那个。在对称密码的情况下，这意味着攻击者尝试所有可能的密钥，直到他们将密文解密为与已知明文相匹配的内容。在许多情况下，并不需要完全了解明文。如果一个人知道消息的一般格式或消息的语言，他可以对照某些启发式方法检查解密的输出，以确定输出是否可能是原始明文（即阅读输出以查看其是否合理）。\n\
  \n如果加密算法使用 64 位密钥，攻击者将从 `00 00 00 00 00 00 00 00[16]` 开始，直到达到 `FF FF FF FF FF FF\
  \ FF FF[16]`。这可能需要很长时间。如果你的系统可以在 1 微秒内解密一段密文并确定结果是否可能是期望的明文，那么遍历所有可能的密钥大约需要 5,800\
  \ 个世纪。不幸的是，对于密码学来说，计算机每年都在变得更快。\n\n显然，对抗对称密码暴力攻击的主要防御手段是密钥长度，这就是为什么 `AES` 的最小密钥长度为\
  \ 128 位。\n\n在密码学安全哈希（如用于保护密码的哈希）的情况下，攻击场景假设一个人拥有包含使用安全哈希加密的所有密码的系统密码文件转储。攻击者然后尝试将密码哈希与猜测进行比较，以查看可以确定哪些密码。\n\
  \n天真的方法是從 “a” 开始，尝试每种组合直到，例如 “`ZZZZZZZZZZ`”。更复杂的方法是拥有一个常用密码的字典，通常由语言词典中的条目组成，结合作为密码频繁使用的单词、字母和数字的组合（例如，`Password123`）。在尝试完密码破解词表（或字典）中的所有条目后，攻击者可以从每种可能的六个字符组合开始（假设系统的最小密码长度为六），然后是每种七个字符的密码，等等，直到失去耐心（或预算）。\n\
  \n这是用于分析 2016 年 LinkedIn 密码泄露中泄露的 1.77 亿个哈希的方法。大约 5 千万个唯一密码，代表文件中超过 85% 的密码，已被破解。\n\
  \n对此类攻击有两种防御措施，LinkedIn 当时均未使用：\n\n*   哈希复杂度\n*   加盐\n\nLinkedIn 密码文件使用了 `SHA1`，这是一种快速高效的哈希算法。当谈到保护密码时，快速高效正是你*不*想要的。使用\
  \ 2016 年技术的八 GPU 密码破解系统每秒可测试 69 亿个 `SHA1` 哈希！\n\n当谈到密码哈希时，越慢越好……好得多。目前推荐的算法之一是基于密码的密钥派生函数\
  \ 2（`PBKDF2`）——使用相同的八 GPU 引擎，每秒只能生成 10,000 个哈希（即大约慢 700 万倍）。\n\n对抗慢哈希的反攻击是预计算的哈希数据库。攻击者取一个常用密码字典（数亿个来自过去泄露的密码可在网上免费获得）和每种可能的密码直到，例如八个字符，并提前将其通过哈希算法运行。在获得泄露的密码文件后，无需以每秒\
  \ 10,000 个哈希的速度缓慢进行；如果密码哈希已经知道，只需查找每个哈希即可。\n\n如果存储这些哈希所需的存储空间过大，为压缩哈希而以稍长的查找时间为代价，可以使用称为\
  \ *彩虹表* 的技术。\n\n对抗存储的字典或彩虹表攻击的防御方法是將密碼與一個唯一的、大型随机数（称为 *盐*）组合，然后存储密码和盐的组合哈希。以这种方式，你必须预先计算\
  \ 2^n 个彩虹表（如果盐有 *n* 位），因此攻击不可行。\n\n因此，密码文件包含两个字段（除了用户的登录名和其他元数据）：\n\n*   盐\n*  \
  \ `HASH (salt + password)` 的输出\n\n为了安全，盐必须满足以下条件：\n\n*   长（至少 16 字节，最好为 32 或 64\
  \ 字节）\n*   随机（即 *密码学安全* 伪随机数生成器的输出）\n*   唯一（为每个用户的密码计算新的盐，并在每次更改密码时计算新的盐）\n\n有些人更进一步，使用对称密码加密哈希，但这被认为是不必要的，并且几乎没有额外的安全性。按照密码密码学中使用的命名法，此步骤称为\
  \ *胡椒*。\n\n遵循本章开头概述的纵深防御原则，不应依赖单一的安全机制来提供安全性。在密码的世界里，纵深防御通常意味着多因素身份验证，以便密码的泄露本身不会导致访问管理系统被泄露。\n\
  \n### Ciphertext Only\n\n\n\n\n\n在这种情况下，攻击者只能访问加密流量（密文）。在许多情况下，可以猜测明文的一些信息（例如消息的语言，这可能导致了解字符概率分布，或消息的格式，这可以为明文的部分提供线索）。`WEP`，WiFi\
  \ 的原始安全算法，容易受到多种仅密文攻击。通过捕获足够数量的数据包（通常在繁忙的网络上几分钟内即可收集），可以推导出 `RC4` 流密码中使用的密钥。\n\n\
  ### 已知明文\n\n在这种情况下，攻击者知道一个或多个消息的部分或全部明文（以及密文）。这经常发生在消息的部分往往是固定的情况下（例如协议头或其他相对不变的消息通信部分）。已知明文攻击的一个例子是著名的德国\
  \ `Enigma` 密码机，它在很大程度上是通过依赖已知明文被破解的。许多消息在相同位置包含相同的词，或包含相同的文本（例如，“Nothing to report”），使得破译消息成为可能。\n\
  \n### 选择明文攻击\n\n在这种情况下，攻击者能够提交攻击者选择的任何明文并获得相应的密文。二战期间发生的选择明文攻击的经典例子是美国截获了消息，表明日本计划攻击代码中称为“`AF`”的地点。美国怀疑这可能是中途岛，为了证实他们的假设，他们安排从中途岛发送一条明文消息，称该岛的水净化厂已损坏。当日本截获该消息然后发送一条提及“`AF`”的编码消息时，美国获得了所需的确认。\n\
  \n### 频率分析\n\n在密码分析中，`frequency analysis` 是对密文中字符（字母、数字或其组合）的频率进行研究。这种攻击最适合针对原始的密码学方法，例如将给定集合中的每个字符（例如字母表）映射到另一个字符的替换密码（例如\
  \ a = z，b = y，等等）。通过了解给定语言中字符的典型分布，频率分析可以帮助密码分析员推断常见密文字符的明文等价物。大多数现代密码算法不受频率分析的影响。\n\
  \n### 选择密文\n\n在这种情况下，攻击者能够提交任何密文并获得相应的明文。这方面的一个例子是对 `SSL 3.0` 的攻击，由贝尔实验室的 Bleichenbacher\
  \ 开发，该攻击在尝试 300,000 到 200 万个选择密文后，可以获得网站的 `RSA` 私钥。\n\n### 实现攻击\n\n`Implementation\
  \ attack` 是一个广泛使用的术语，用来描述利用实现弱点的任何攻击，例如软件、硬件或加密算法本身。（有关更多详细信息，请参阅“Select and Determine\
  \ Cryptographic Solutions”部分。）\n\n### 侧信道攻击\n\n`Side-channel attacks` 涉及测量密码过程的产物以推断信息，从而协助破坏加密信息。这些产物可以包括以下内容：\n\
  \n* Timing\n* Cache access\n* Power consumption\n* Electromagnetic emanations\n\
  * Error information\n\n加密或解密数据块所需的时间可能会根据密钥或明文而变化，对加密或解密数据所需时间的仔细分析可以揭示信息。执行密码操作的所需时间可能因多种原因而变化：\n\
  \n* 代码中的条件分支，这可能会根据所取分支改变执行时间，而分支又取决于密钥或明文的值\n* 执行时间取决于操作数的 CPU 指令（例如乘法和除法）\n* 内存访问，这可能因数据所在的位置（内存类型）或访问历史而变化（从而影响缓存并因此影响内存访问速度）\n\
  \n缓存攻击通常涉及在同一物理处理器上运行的不同虚拟机上的进程。随着执行加密的 VM 与运行攻击者进程的 VM 进行时间片轮转，攻击者可以探测处理器的缓存以推断有关明文和密钥的信息，从而破坏加密过程。\n\
  \n执行密码操作的设备消耗的功率可能会根据执行的指令而变化，而指令又取决于正在加密的密钥和数据。通过仔细监控设备消耗的功率，有时可以提取有关密钥或明文的信息。这种类型的攻击最成功地针对智能卡，因为相对容易监控设备的功耗，但攻击机制具有广泛的适用性。\n\
  \n所有电子系统都会发出电磁辐射，并且有可能在距离设备一定距离的情况下捕获这些辐射。这些无线电信号有时可以被分析以揭示设备正在处理的数据的信息。这种类型攻击的早期例子涉及分析加密设备的辐射，这些设备将解密的消息打印在电传打字机上以确定正在打印哪些字符。\n\
  \n存在对策，但在某些情况下，它们可能非常难以实现，或者会带来相当大的性能损失。在定时攻击的情况下，有必要修改算法，使其为等时，即无论处理的密钥和数据如何，都以恒定时间运行。\n\
  \n解密软件提供的（或泄露的）错误信息可以为攻击者提供有用的信息。在填充预言机攻击中，可以发送任意数量测试消息的系统，并且对于未正确填充的加密消息会生成独特的错误，可以用来在不知道密钥的情况下解密消息。防御方法是报告通用错误，并且不区分填充错误和其他错误。\n\
  \n### 故障注入\n\n故障注入攻击是侧信道攻击的一种，涉及故意注入有故障或错误的输入并观察错误和输出。有关更多详细信息，请参阅“Side-Channel\
  \ Attacks”部分。\n\n### 定时攻击\n\n`timing attack` 是一种侧信道攻击，涉及攻击者通过监控执行算法函数所需的时间来尝试破坏密码系统。有关更多详细信息，请参阅“Side-Channel\
  \ Attacks”部分。\n\n### 中间人\n\n`MITM` 攻击要求攻击者能够拦截并在两个参与者之间中继消息。例如，Michelle 想要破坏 Alice\
  \ 和 Bob 之间的通信。Alice 想要使用公钥密码学与 Bob 安全通信。Michelle 是我们的攻击者。考虑到这一点，以下情况发生：\n\n1. Alice\
  \ 向 Bob 发送消息请求 Bob 的公钥。\n2. Michelle 将消息中继给 Bob。\n3. Bob 用他的公钥回复，但 Michelle 拦截了该消息并用\
  \ Michelle 的公钥替换它。\n4. Alice 认为她拥有 Bob 的公钥，使用 Michelle 的密钥加密消息（例如，“请从我的账户向 Acme\
  \ Company 转账 10,000 美元”）。\n5. Michelle 拦截消息，解密它（因为它是用她的密钥加密的），篡改它（例如，“请从我的账户向 Michelle\
  \ 转账 10,000 美元”），使用 Bob 的密钥加密篡改后的消息，并将消息发送给 Bob。\n\n\n\n\n\n为了防御此类攻击，Alice 需要确信包含\
  \ Bob 密钥的消息确实源自 Bob（而非中间人攻击者 Michelle）。在加密的 HTTPS 网络流量中，这是通过依赖由 CA（证书颁发机构）签名的公钥证书来实现的（如“公钥基础设施”部分所述）。但如果\
  \ CA 被入侵，攻击者就可以绕过 HTTPS 的身份认证保护。\n\n2011 年，荷兰 CA DigiNotar 被入侵，导致针对约 300,000 名 Gmail\
  \ 用户的中间人攻击取得成功。\n\n### Pass the Hash\n\n`Pass the hash` 是一种攻击，当攻击者获取到密码哈希并将其用于身份验证时就会发生。在这种攻击中，攻击者无需解密哈希或以其他方式获取明文密码。此类攻击针对的是身份验证协议，而非哈希或其他任何加密元素。\n\
  \n最小权限安全模型可以通过减少攻击者获得和使用提升权限的能力来帮助限制传递哈希攻击发生的可能性和影响。能够轮换密码（最好是自动轮换）的密码管理流程和工具也有助于对抗此类攻击。\n\
  \n### Kerberos Exploitation\n\n`Kerberos` 是一种网络身份验证协议，使用对称密钥加密为客户端/服务器环境提供强身份验证。该协议基于票据运行，允许网络上的节点（系统）相互证明身份。\n\
  \n与任何广泛使用的协议一样，黑客一直在寻求并找到了破坏 Kerberos 的方法。大多数成功的 Kerberos 利用都利用了系统漏洞（如使用弱算法）、恶意软件或弱密码。一种常见的利用方式称为传递票据，即攻击者伪造一张票据并将其传递以对资源进行身份验证。\n\
  \n应使用多因素身份验证来抵御 Kerberos 实现中的钓鱼攻击和密码弱点。还应启用对 Active Directory 域的日志记录和监控，以检测未经适当身份验证的资源访问（例如，通过传递票据）。\n\
  \n### Ransomware\n\n`Ransomware` 是一种恶意软件，会感染系统、加密受害者的文件并使其无法使用，直到支付赎金为止。在典型的勒索软件攻击中，受害者会收到支付费用以获取解密密钥恢复数据的说明。攻击者通常要求以比特币支付，因其匿名性。\n\
  \n防御勒索软件与防御任何类型恶意软件的最佳实践类似。保持操作系统和应用程序修补并及时更新，限制管理权限的使用（即最小权限），并使用受信任的反恶意软件软件并更新签名，同时遵循其他系统加固最佳实践。\n\
  \n除了保持整体良好的安全卫生习惯外，频繁备份数据是恢复勒索软件攻击的最好方法——无需支付费用！通过将例行备份安全存储，您将能够在遭受此类攻击时恢复到已知良好的状态。\n\
  \n## APPLY SECURITY PRINCIPLES TO SITE AND FACILITY DESIGN\n\n前面为信息安全概述的一般安全原则也适用于场地和设施设计。CIA\
  \ 三要素和支持的安全原则在此适用，并指导我们将安全原则应用于这一挑战：\n\n* `Confidentiality and Integrity:` 机密性和完整性的主要物理威胁是未经授权的访问（例如，入侵者和盗窃）。\n\
  * `Availability:` 除了未经授权访问对可用性的威胁外，可用性还可能因一系列事件而被故意或意外破坏：\n    * 环境事件，如火灾、洪水、风暴或地震\n\
  \    * 基础设施事件，如停电、制冷（HVAC）故障、洪水（因水管破裂）\n\n以下各节将概述可用于降低上述漏洞风险的控制措施，但与所有风险一样，安全架构师必须考虑处理风险的所有方法：规避、缓解、转移和接受。\n\
  \n可以通过选择不太可能受到某些风险影响的设施来规避物理威胁（例如，将数据中心设在地质稳定地区可有效消除地震风险，正如避开已知有龙卷风和飓风活动的地区可降低气象事件风险一样）。\n\
  \n可以通过实施以下各节中概述的安全控制（管理、技术和物理）来缓解威胁。\n\n可以通过保险（火灾、盗窃、业务中断等）或合同方式（例如，与托管或数据中心托管服务提供商签订合同以提供安全场地和设施，从而使您的组织免除部分责任）来转移（或分担）许多物理风险。\n\
  \n一旦应用了所选的风险管理方法（规避、缓解、转移），然后评估剩余风险以确定其是否在组织的风险承受范围内，或是否可被风险所有者接受。如果不可接受，则必须采取额外步骤以进一步降低剩余风险。\n\
  \n## DESIGN SITE AND FACILITY SECURITY CONTROLS\n\n如果威胁行为者只需走进您的数据中心并带走服务器，那么您为确保系统运行保护数据的机密性、完整性和可用性所做的所有思考和努力都将付诸东流。设计数据中心或聘请第三方数据中心服务需要仔细考虑风险并采取适当的控制措施来缓解这些风险。\n\
  \n同样，保护您工作场所的物理和环境控制对于确保信息安全至关重要。\n\n在本节中，我们将研究一系列漏洞并概述应考虑的适当缓解措施。\n\n请记住，正如本章开头指出的那样，安全架构的一个基本原则是纵深防御。这意味着您不能仅依赖物理安全来保护物理资产。我们必须采用其他控制措施，以便在合理可行的范围内，物理安全控制的失效本身不会导致机密性、完整性或可用性的失效。\n\
  \n### Wiring Closets/Intermediate Distribution Facilities\n\n与数据中心和办公室相关的网络分发漏洞略有不同。在由单一公司（或云托管提供商）拥有和管理的\
  \ data center 中，通常网络分发会在与服务器相同的边界内，因此物理和环境安全控制将同时适用于两者。在托管设施中，不同客户可以访问设施的不同区域（以访问由他们拥有或分配给他们的专属设备）。在这种情况下，配线间由托管提供商管理，且不得让客户访问，否则即使是授权客户也可能访问或影响其他客户的服务。在办公室中，中间配线设施需要防范恶意外部人员和内部威胁，更不用说环境风险了。\n\
  \n\n\n\n\n并非所有内部威胁都是恶意的——怀着好意的员工试图排查网络问题，也可能在配线间造成混乱。网络交换机和其他中间配线设备经常被放置在任何方便的偏僻位置，与其他建筑基础设施共用空间（例如，电气、管道、供暖或通风）。在考虑此事时，应考虑环境影响带来的额外风险（洪水、过热，或来自电气设备的电磁干扰）。一个装满网络交换机且通风不良（或根本没有通风）的小配线间会过热，至少会缩短设备的使用寿命，在最坏的情况下会导致随机重启、错误，甚至完全故障。\n\
  \n配线间也可能面临诸如管道破裂或泄漏通过或靠近该空间，或楼上洗手间溢出等威胁的危险。同样，如果显而易见的解决方案（搬迁配线间位置）不可行，就必须考虑补偿性控制措施——在这种情况下，在设备上方设置防护罩以偏转任何落下的水，并在架子上放置设备（使所有设备和布线远离地面）以防止积水影响设备。\n\
  \n必须考虑的不仅是你为内部目的安装的网络基础设施，还包括可能穿越你无法控制的空间的其他服务的布线（电话、报警、电子门锁等）。如果为其供电的电缆位于你办公室外走廊的吊顶中，你的电子门锁还有什么用？如果报警信号通过电话线传输，而这些电话线可以在公共走廊的未上锁面板后面找到并很容易被篡改，你的报警系统又有什么用？\n\
  \n## 服务器机房/数据中心\n\n与办公空间一样，你的数据中心的物理安全可以涵盖广泛的控制措施。你需要确定风险，以确保对数据中心进行安全保护，但不过度保护。\n\
  \n安全控制措施需要选择以应对以下问题：\n* 物理访问风险（参见“将安全原则应用于场地和设施设计”部分）\n* HVAC（参见“公用设施和供暖、通风与空调”部分）\n\
  * 环境风险（参见“环境问题”部分）\n* 火灾风险（参见“火灾预防、探测和抑制”部分）\n\n仅仅正确设计和建造服务器机房或数据中心是不够的，还必须制定适当的程序，以确保数据中心继续正常、安全地运行。这些控制措施至少应涵盖以下内容：\n\
  * 人员（例如，背景调查、培训或访问程序）\n* 维护\n* 日志记录、监控和报警\n* 控制测试和审计\n\n例如，仅拥有柴油发电机在停电时间超过不间断电源（UPS）承载负载的能力时接管是不够的。你还必须定期测试和维护发电机，并确保有足够的燃料供应（并注意燃料随时间推移的劣化）。\n\
  \n数据中心设计的艺术和科学已被充分理解。任何负责此类项目的人员（或选择供应商提供托管或托管服务）都应查阅以下组织提供的指导：\n* 美国采暖、制冷与空调工程师学会（ASHRAE）\n\
  * ANSI / BICSI：ANSI/BICSI 002-2014，数据中心设计和实施最佳实践\n* 电子工业协会和电信工业协会（EIA/TIA）：ANSI/TIA-942，数据中心电信基础设施标准\n\
  * 欧洲联盟（EU）：EN 50600 系列标准\n* 国际标准化组织（ISO）：ISO/IEC 30134 系列，“信息技术 – 数据中心 – 关键绩效指标”\n\
  * Uptime Institute：分级标准\n\n这些文件涵盖了需要考虑的整个问题范围。我们在此的论述将重点关注对你的系统和数据的安全以及客户隐私的威胁。\n\
  \n## 媒体存储设施\n\n除了任何包含信息技术设备的设施所面临的机密性、完整性和可用性的通常威胁外，媒体存储设施还必须实施额外的环境控制，以确保存储的媒体不会随时间推移而退化（或至少尽可能缓慢地退化）。\n\
  \n具体控制措施将取决于所存储的媒体、制造商的建议以及预期的具体威胁，但通常将包括以下内容：\n* 受控且稳定的温度和湿度\n* 空气过滤和正压通风，以最大限度地减少空气中灰尘和微细颗粒物或污染物（例如柴油发电机或附近车辆产生的腐蚀性烟雾和发动机废气）的渗入\n\
  * 适当的地面覆盖，以最大限度地减少静电\n* 仔细选址媒体存储设施，以避免来自电气设备（例如变压器或电机）的磁场\n\n关于媒体存储的其他考虑因素包括以下内容：\n\
  * 如果媒体存储设施的环境（温度或湿度）与读取磁带的生产环境不同，则在处理之前必须留出时间让磁带适应不同的环境。\n* 一些磁带媒体需要“重新张紧”（即解卷并重新卷绕），具体取决于磁带制造商的建议（例如每三年一次）。\n\
  * 对于更长期的归档存储，建议从存储的媒体中读取数据并重新记录到新媒体上。同样，应遵循磁带制造商的建议，确定适当的频率（例如每六年一次）。\n* 对于放入和取出存储的媒体的跟踪，需要适当的程序。这可能包括条形码扫描和分离职责控制，要求两个人共同签收和签出媒体项目。\n\
  * 可能需要安装火灾探测和抑制系统。\n* 需要适当的清洁管理，以降低火灾的可能性并减少火灾发生时可用的燃料。相关的是，媒体存储设施应仅用于存储媒体，不应与其他一般存储共用。\n\
  * 根据现场媒体存储的风险分析和相关成本，可能适合聘请异地媒体存储服务来处理与媒体安全长期存储相关的物理安全和环境问题。这可用于所有媒体或其中一部分，以便在主要媒体存储设施因火灾或其他灾难而受损时提供灾难恢复。\n\
  * 必须执行适当的媒体生命周期结束程序，在处置媒体之前对其进行清理（例如通过消磁磁性媒体）并安全销毁，以确保组织控制范围之外无法从媒体中提取敏感信息。\n\n\
  ## 证据存储\n\n除了适用于其他设施（包括媒体存储，如果你以磁性媒体形式存储证据）的适当安全控制外，证据存储还需要关注有助于保护证据保管链的物理控制，以证明在法庭上使用的证据未被篡改或污染。\n\
  \n\n\n\n\n这些控制措施至少包括一本不可更改的日志，记录放入或从证据存储中取出证据的每一项。以下额外的控制措施可以提高证据存储室的保管链日志的可信度：\n\
  \n* 严格的政策，规定谁被允许进入证据存储室、应记录到日志中的信息以及管理证据存储室门禁钥匙的程序\n* 视频监控\n* 证据存储室的门采用双重锁，或在上锁的证据存储室内放置上锁的存储柜，并对钥匙控制实行职责分离，以便需要两人才能进入证据存储\n\
  \n关于视频监控，应考虑采用具备运动检测功能或与门传感器相连的系统，以便仅在有人进入证据存储室时才进行录制。其原因是证据经常需要在等待审判期间长期存放，而持续的视频录制会消耗过多的存储空间，或者存储周期远短于证据存放的典型时间。\n\
  \n### 受限区域和工作区域安全\n\n工作区域安全必须根据风险评估（包括威胁建模）进行设计，并遵循安全原则和适当的控制措施以降低风险。需要考虑的因素包括最小权限、需知原则、职责分离、双重控制、纵深防御以及合规义务。在实施设施安全控制的背景下，这一点尤为重要。没有其他方面的现场安全控制比这更直接地影响组织的人员。\n\
  \n#### 最小权限和需知原则\n\n对受限和安全区域的访问必须仅授予个人履行其职责所必需的程度，并符合正式批准的政策和程序。访问还必须定期审查，以确保访问理由未发生变化。此外，必须保留详细的可审计记录以证明上述情况。\n\
  \n#### 职责分离和/或双重控制\n\n根据风险评估，可能需要要求一个以上经过身份验证的工作人员在场才能获得对安全工作区域的访问权限。这可以是通过警卫记录或视频监控验证的管理控制，也可以是通过多重锁或电子访问控制强制执行。\n\
  \n#### 纵深防御\n\n设施应设计为具有多层安全控制，支持从建筑物外部（可能包括公共入口区域）的公共区域，到诸如接待处等低安全区域，再到存放最敏感或高风险资产或工作的最高安全区域的安全等级层次结构。\n\
  \n从较低安全区域进入较高安全区域应对知情的内部人员显而易见，并且必须通过访问控制系统成功进行身份验证（无论是接待员/警卫、门锁、读卡器、生物识别扫描仪还是用于识别跨越安全边界个人的其他设备）。适当的严格程度和可容忍的误报率取决于所保护区域的安全等级。\n\
  \n此外，应考虑为更高安全区域采用不同类型的安全控制。例如，除了预防性控制（如门锁）外，还可以使用侦测性控制（如视频监控）和纠正性控制（如运动探测器和报警器）作为补偿控制，以防主要预防性控制（如门锁）失效或被破坏。\n\
  \n多因素身份验证技术对于物理访问与逻辑访问（如登录）一样有价值。要求用户同时持有访问卡并输入个人识别码（PIN）来解锁进入更高安全区域的门，可以防止访问卡丢失并被冒充者使用。要求使用卡（而非仅\
  \ PIN）可以防止威胁行为者通过肩窥观察员工输入 PIN。\n\n#### 合规义务\n\n处理政府或军事机密数据的组织必须建立满足其设施安全许可义务所需的安全控制。负责认证合规性的组织将提供详细的文件，说明为获得所需安全许可等级所需的控制措施，包括以下要求：\n\
  \n* 人员识别\n* 警卫\n* 电子访问控制\n* 电子入侵检测\n* 视频监控\n* 内部访问控制\n\n一种用于进行机密讨论的解决方案是敏感隔间信息设施（`SCIF`）。`SCIF`是美国和英国军事及政府机构中常见的术语，指为保持机密性而需要隔离空间的机构。通常至少是一个房间，如果不是一个加固的建筑，则为一个房间，`SCIF`可以是临时或永久的。如果你看过任何一部军事领导向总统通报重要敏感情况的电影，他们就在`SCIF`中。\n\
  \nGDPR、HIPAA、PCI DSS 以及其他法规或合同义务可能会施加影响物理工作区域安全控制设计的安全要求。\n\n有关相关问题，请参阅第 5 章中“控制对资产的物理和逻辑访问”部分。\n\
  \n### 实用设施和供暖、通风与空调\n\n实用设施（如电力）和 HVAC 对数据中心可靠运行同样重要。如果你的冷却系统失效，机房温度超过 105° F（40°\
  \ C），那么即使你能为服务器机架维持供电也无关紧要。与数据中心设计的所有方面一样，你首先进行风险评估，然后考虑可用于将风险降低到可接受水平的控制措施。你还需要权衡建立一个特别具有弹性的单一数据中心与建立两个地理位置分离、弹性较低的数据中心之间的平衡。\n\
  \n仅拥有足够的（例如 N）UPS 单位来处理负载意味着在维护期间必须断开某些设备的连接。\n\n拥有备用 UPS（N+1）和适当的切换设备意味着可以在不中断操作的情况下将设备从服务中移除进行维护。但如果在停电时有一台设备处于停机状态，则其他每台\
  \ UPS 都是单点故障。这也意味着切换设备是单点故障。\n\n从独立的公用事业馈电到机架完全冗余的 UPS 系统被称为 2N，可消除任何单点故障。\n\n单个数据中心内的冗余程度通常以等级级别来表征。不同标准对每个等级的确切要求略有不同，但通常提供的可用性和冗余度与\
  \ Table 3.5 中所示相似。\n\n**TABLE 3.5 General Data Center Redundancy Tier Levels**\n\
  \n| TIER LEVEL | AVAILABILITY % | REDUNDANCY |\n| --- | --- | --- |\n| 1 | 99.671\
  \ | None. Multiple single points of failure. |\n| --- | --- | --- |\n| 2 | 99.741\
  \ | Some. Nonredundant (e.g., N) UPS. |\n| 3 | 99.982 | N+1 UPS. Able to take equipment\
  \ out of service for maintenance without affecting operation. |\n| 4 | 99.995 |\
  \ 2N UPS. No single point of failure, able to automatically compensate for any single\
  \ failure. |\n\n\n\n\n\n较小的机房或服务器室如果没有与电力公司配电网络的直接专用连接，就需要考虑它们的邻居（从电气角度来说）可能是谁。位于泵房、空调或制冷压缩机附近，或大型电动机工业设施附近的服务器室，可能需要特殊的电力调节设备，以消除由“嘈杂的邻居”引入到电力回路中的干扰和电压尖峰。\n\
  \n有许多类型的 UPS 系统，其设计和功能各不相同。电池 UPS 系统在以下几个重要方面可能存在差异：\n\n*   **负载：** 设备提供指定连续功率水平的容量\n\
  *   **容量：** 设备能够维持负载的时间\n*   **滤波：** 设备将设备与噪声、浪涌以及电网电力存在的其他问题隔离开来的能力\n*   **可靠性：**\
  \ 有些设计以可靠性换取低成本\n\n存在不使用电池的 UPS 系统，它们使用大质量旋转飞轮连接以提供短期备用。这些系统适用于较大负载（> 200KW），并且可以提供比同类电池\
  \ UPS 系统更高的可靠性和更低的生命周期成本。\n\n通常，UPS 仅用于在短暂停电期间承载负载，以及备用发电机启动并能够承担全部负载所需的时间。因此，大多数数据中心或服务器室都需要发电机来处理负载，以防停电时间超过\
  \ UPS 能够处理的时间。\n\n发电机有多种容量可供选择，并使用不同的燃料（汽油、柴油、天然气和氢气）。天然气的优势在于无需储存燃料。风险在于某些自然灾害可能同时导致电力和燃气配电中断。\n\
  \n冷却系统必须设计为有多台单元且容量充足，以便数据中心即使在其中一台或多台单元发生故障（或维护）的情况下，也能保持在最大安全工作温度以下，并且即使在维护期间将一台单元停用时，温度变化的最大速率也能保持在允许范围内（例如，如果使用磁带，则小于\
  \ 5°C/小时，否则为 20°C/小时）。\n\n最后，湿度也需要管理。湿度过低会导致静电增加，而湿度过高会导致冷凝。两种情况都会导致设备可靠性降低。\n\n\
  对于电力（UPS 和发电机）和 HVAC 系统，都必须充分考虑以下事项：\n\n*   定期安排的维护\n*   在满载下定期测试（UPS 和发电机，以及如果未用于生产则为备用\
  \ HVAC 设备）\n*   系统故障检测和报警（以及对这些子系统的定期测试）\n*   定期检查和审计，以确保上述所有事项都得到适当且定期执行\n\n如果没有上述项目，您昂贵的备用系统的风险缓解措施可能更多是想象中的而非真实的。\n\
  \n正如本章前面“工业控制系统”部分所述，监控和管理您的 HVAC 或 UPS 系统的系统本身可能就是一个漏洞。如果攻击者可以远程访问您的 HVAC 并破坏其运行，可能在数据中心无人值守的周末导致冷却被禁用并使服务器过热，这与由\
  \ 10 万台僵尸网络发起的拒绝服务攻击一样有效。同样，未经授权的对 UPS 的远程管理员访问，轻则会导致 UPS 被禁用，下一次停电无法得到缓解；重则会导致直接停电，因为\
  \ UPS 被下线。\n\n各种行业、国家和国际标准涵盖 HVAC、公用事业和环境系统。\n\n*   Uptime Institute 的数据中心设计认证等级评估包括设施机械和电气系统以及环境和设计考虑等领域。等级规范可在\n\
  \n    `uptimeinstitute.com/resources/` 找到。\n*   国际数据中心管理局（IDC）为数据中心、设施和基础设施提供开放标准，网址为\
  \ `www.idc-a.org/data-center-standards`。\n*   ASHRAE 关于通风、制冷、建筑自动化和各种其他相关主题的标准可在\
  \ `www.ashrae.org/technical-resources/standards-and-guidelines` 找到。\n\n其他标准包括 LEEDS\
  \ 标准、BICSI-001，以及由三个欧洲标准化组织之一（CEN、CENELEC 或 ETSI）制定的标准，在公用事业和 HVAC 系统的设计中可能都有用，甚至是必需的。\n\
  \n### 环境问题\n\n需要考虑的环境问题包括以下情况发生的可能性：\n\n*   大型风暴（飓风、雷电、暴风雪、冰暴、台风、龙卷风、暴风雪等）\n*  \
  \ 地震\n*   洪水和海啸\n*   森林火灾\n*   建筑内部风险\n*   害虫和野生动物\n*   火山\n\n一些漏洞可以通过为数据中心选择合适的位置来缓解，其他则可以通过建筑和场地设计来缓解。事实上，像日本、加州以及世界其他地区等具有特定常见威胁如地震、洪水、龙卷风或飓风的地区，通常都有建筑规范要求新建建筑物能够经受住这些环境威胁。\n\
  \n请考虑不要将任何关键基础设施组件放置在地下室，因为它们可能容易发生洪水（无论是来自外部来源如风暴或破裂的水管，还是内部原因如管道爆裂）。请记住，福岛第一核电站事故的主要原因之一就是安装在反应堆以下高度的电池、电气开关设备和冷却泵被淹没。\n\
  \n在面临重大威胁的情况下，必须做出决策，确定要将数据中心建设得多么 resilient，以及哪些事件被视为超出数据中心承受能力，而哪些事件将通过远程备份数据中心和灾难恢复计划来处理。\n\
  \n您还必须考虑，即使您投资建设一个能够应对最严重风暴或地震的数据中心，就像投资一个超强链路来连接两条链一样，数据中心的运行能力取决于外部供应商能否继续运营。\n\
  \n在某个时候，投资于灾难恢复计划比试图使数据中心能够抵御供应商和员工无法应对的环境威胁更有意义。\n\n正如第 6 章，“安全评估和测试”中所讨论的，选择备用数据中心涉及考虑可能导致主数据中心瘫痪的威胁，以确定它们是否可能同样影响备用数据中心。如果两个数据中心距离太近，或可能处于同一飓风的路径上，它们可能无法提供灾难恢复计划所依赖的冗余。\n\
  \n建筑内部风险包括诸如爆裂管道导致的水泄漏；悬挂天花板中来自水、喷淋管道或 HVAC 设备的冷凝水；以及楼上洗手间或厨房设施的溢出。\n\n缓解措施包括在建筑物内相对于设备适当布置管道，或如果搬入现有建筑，则相对于管道适当布置设备。在某些情况下，为部分设备安装遮雨棚可能是最佳选择。\n\
  \n害虫和野生动物会对通信电缆和配电造成惊人的破坏，无论是啃食绝缘层或电线本身，还是物理短路电力线。由松鼠引起的电气中断已足够常见，以至于在维基百科中都有专门条目！\n\
  \n\n\n\n\n另一种可能被视为环境风险的是流行病或大流行病，它会阻止你的员工或供应商的员工工作，或因疾病爆发引发的服务需求而给组织带来额外压力。COVID-19\
  \ 大流行是全球每家公司的重大事件，迫使企业重新思考其运营方式。\n\n分析必须考虑员工面临的风险水平（显然，医疗行业或经常与公众接触的人员暴露程度更高，而接触极少的人员受影响的可能性较低）。\n\
  \n缓解措施包括以下内容：\n\n* 监测公共卫生部门的公告\n* 制定不会激励员工带病上班的病假政策\n* 制定在以下情况下运营的计划：人力减少；员工在家工作；或将工作转移到受影响较小的办公地点（适用于拥有多个办公地点的较大公司）\n\
  \n## 火灾预防、探测和抑制\n\n有多种火灾抑制技术可部署以保护技术基础设施、设施和人员。流程与选择任何一组安全控制措施一样，是进行风险评估以确定适当的缓解策略。\n\
  \n一如既往，人身安全是首要的，任何消防系统必须首先设计用于保护在设施内工作的人员的生命和健康。使人员能够安全撤离建筑物并确保消防系统不太可能损害健康或安全，比保护系统和建筑物更重要。\n\
  \n接下来，需要权衡以下成本：\n\n* 停机时间\n* 恢复成本\n* 火灾抑制系统成本（资本和持续维护）\n\n通常，前两者与第三者之间存在权衡。换句话说，减少停机时间和恢复成本需要更昂贵的火灾抑制系统。选择更便宜的方法可能会增加火灾事件后使数据中心恢复运行所需的时间。\n\
  \n火灾开始需要三样东西：热量、燃料和氧气（更一般地说是氧化剂）。火灾预防和抑制涉及减少这三个要素中的一个或多个，使火灾无法开始或持续。一个更完整的模型增加了燃料与氧化剂之间的化学反应，形成火灾“四面体”。该模型有用之处在于某些火灾抑制系统会阻断化学反应本身，而非减少该反应所需的三个组成部分之一。\n\
  \n消防安全受众多法规约束，这些法规以数百年的经验为依据。这是受过训练的专业人员的领域，应在安装任何火灾抑制系统之前咨询他们。虽然本节为信息安全专业人员提供一般信息，但它不能替代针对特定情况的专家建议。\n\
  \n大多数司法管辖区对 IT 设备的消防保护系统都有标准和指南：\n\n* 加拿大和美国：NFPA 75，“信息技术设备消防标准”，以及 NFPA 76，“电信设施消防保护”。\n\
  * 英国：BS 6266:2011，“电子设备安装的消防保护”。实务守则。\n* 德国：VdS 系列消防保护和抑制指南。\n\n火灾抑制系统通过向火灾区域施加灭火剂，去除维持火灾所需的四个组成部分之一。\n\
  \n最简单且最广泛使用的系统是湿式水喷淋系统。这些系统管道中始终充满水，每个喷淋头均由热敏玻璃泡或金属连杆控制阀门关闭，两者均设计为在特定温度下释放水。湿式系统的优点包括安装和维护成本低以及可靠性相对较高。这些系统也仅通过最接近火源的喷淋头释放水，从而限制水损。湿式水喷淋的风险来自于故障喷淋头或物理损坏（在设施内工作时用机架或梯子撞到喷淋头）导致的意外释放造成的损坏。\n\
  \n干式系统顾名思义，在喷淋头被火灾触发前，供水管道中没有水。这些系统用于暴露于冰冻温度的仓库和停车场，与数据中心或大多数办公楼无关。其优点是管道中不含水，不会结冰并损坏管道。缺点是腐蚀增加以及响应时间延迟，因为必须先将空气从喷淋头中排出，水才能到达火源。\n\
  \n另一种通常不部署在数据中心或办公楼的专用喷淋系统是雨淋喷淋系统。这是干式喷淋系统的变体，但喷淋头是开放的。一旦检测到火灾（使用烟雾、热量或手动报警），阀门打开以将水引入供水管道并通过所有喷淋头（而不考虑火灾的具体位置）。这些系统适用于需要大量水来防止火灾蔓延的某些工业情况。\n\
  \n预作用系统是前三种喷淋系统之一（湿式、干式或雨淋）与更复杂的触发机制的组合。单联锁预作用系统是一种管道内充有加压气体的干式系统，其中烟雾或热探测器的激活会导致水释放到供水管道中，本质上将干式系统转换为湿式系统。然而，水仅在喷淋头被触发时才释放。该系统大大降低了意外释放水的可能性，因为如果喷淋头意外触发，系统会检测到气压下降并发出故障报警，但不会释放任何水。双联锁预作用系统要求烟雾或热探测器激活且喷淋头激活后才会将水释放到供水管道中。这在冷藏空间中可能是一个优势，但在实际火灾事件中会延迟水的释放。\n\
  \n任何喷淋系统的适当设计都需要专业建议和持续的警惕，以确保后来的发展（例如增加悬挂式电缆桥架）不会削弱系统的有效性。喷淋器的一个局限是它们在 raised floor\
  \ 或吊顶的狭小空间中效果不佳。这些空间需要水雾或洁净气体灭火系统。\n\n标准喷淋头的替代方案是每分钟可排放大量水的喷淋头是水雾喷淋器，其释放的水量要小得多，呈微观水滴形式。这些既通过去除热量（与标准喷淋器相同）来扑灭火灾，也通过水雾转化为蒸汽时置换氧气来扑灭火灾。\n\
  \n在水损影响会很严重的情况下，可使用各种“洁净气体”灭火剂。其优点是对受保护设备造成的损坏极少或没有。缺点是其安装和持续维护成本要高得多。\n\n\n\n\n\
  \n原始的洁净灭火剂包括二氧化碳和哈龙。二氧化碳主要通过置换氧气起作用，同时还能带走热量。不幸的是，它在远低于灭火所需浓度的情况下就会导致窒息，因此需要在排放前发出警报，以确保即将被\
  \ CO² 充满的空间在排放前已疏散。哈龙气体通过干扰化学反应（“火灾四面体”的第四部分）起作用，其优点是在远高于所需浓度的情况下仍无毒。这导致其在数据中心和其他设施中被广泛使用数十年，因为在这些地方，喷淋系统可能造成的损害比受控火灾更大。然而，哈龙危害很大。在加拿大，《蒙特利尔议定书》于\
  \ 1994 年逐步淘汰了其使用。\n\n已经开发出新型、对臭氧友好的洁净灭火剂，每种都有其特定的优势。其中包括 HFC-227ea、氟化酮以及各种气体混合物（例如，氩气、氮气和二氧化碳）。这些新型洁净灭火剂比早期替代品更环保、毒性更低。\n\
  \n正如网络分段可以限制安全漏洞在一部分网络造成的损害一样，将关键通信设施与不太关键的数据处理设施物理分离，置于一个单独的房间并用两小时防火墙（字面意思）隔开，也可以通过防止火灾（以及灭火系统中的水）在一区域蔓延而影响另一区域的设备，从而限制损害。\n\
  \n同样，必须在现场存储的备份介质可以存放在单独的房间或防火存储库中。\n\n气体灭火的使用因需要能够自动将受影响区域与正常的通风和冷却系统隔离而变得更加复杂，这样\
  \ HVAC 系统就不会稀释或移除灭火气体。\n\n灭火器是强制性的，但员工需要接受其用途和正确使用的培训。虽然它们可能用于扑灭早期发现的很小火灾，但它们的主要作用是使服务器室内的员工在火灾阻挡其路径时能够到达出口。火灾按燃料类型分类：\n\
  \n*   `Class A`：普通固体可燃物（例如，纸张、木材和塑料）\n*   `Class B`：易燃液体和气体（例如，汽油）\n*   `Class C`：带电电气设备\n\
  *   `Class D`：可燃金属（例如，锂金属，但不包括锂离子电池，锂离子电池被视为 `Class B`，尽管水对锂离子电池火灾也很有效）\n*   `Class\
  \ F or K`：烹饪油和油脂\n\n灭火器的等级基于其设计用于扑灭的火灾类别以及其所含灭火剂的量。额定为 `5BC` 的灭火器可用于 `Class B` 或\
  \ `Class C` 火灾。`10BC` 灭火器的容量是 `5BC` 灭火器的两倍。\n\n使用错误的灭火器不仅会使火灾恶化（例如，用水扑灭汽油火灾会扩散燃料），而且对使用灭火器的人来说可能是一个严重的危险（例如，用水扑灭电气火灾会带来触电风险）。\n\
  \n培训并不止于了解如何以及何时使用灭火器。所有通常会在数据中心出现的工作人员都需要接受适当的培训并进行演练，以了解如何应对火灾警报或火灾事件。\n\n确保他们了解以下信息：\n\
  \n*   所有出口的位置（以便他们知道最近的出口，以及被堵时备用的出口）\n*   所有灭火器的位置以及如何以及何时使用它们（不同类型的灭火器适用于不同类型的火灾）\n\
  *   如何在怀疑发生误报时禁用（或延迟排放）灭火系统\n*   如何在工作人员在火灾探测器触发前发现火灾早期迹象时手动触发灭火系统（在气体灭火和某些喷淋系统情况下）\n\
  *   火灾报警拉线或呼叫点的位置\n*   如何手动切断数据中心的电源\n\n最后，良好的卫生管理是灭火的重要组成部分。数据中心或服务器室不得用作存储。装有计算机零件的纸箱或\
  \ Cat 5 电缆的木盘必须存放在设施的另一部分。废纸回收箱应放置在设施外部，或者如果必须放在数据中心内部，则应小而经常清空。可燃物越少，发生火灾的可能性就越小，如果发生火灾，造成的损害也会越小。\n\
  \n## SUMMARY\n\n在讨论安全架构和安全工程时，本章沿着 CISSP 通用知识体系的第三个领域展开。对安全设计原则和安全模型讨论的介绍既具有历史意义，也为理解安全架构奠定了基础。进一步的讨论集中在硬件上，从信息系统的安全功能到保护各种平台。\n\
  \n本章中间部分重点关注漏洞管理，即评估和缓解这些漏洞的过程。漏洞管理涵盖了多种系统和架构类型，包括基于客户端和服务器的系统、基于云的系统、工业控制系统等。\n\
  \n本章以密码学为结尾，从生命周期、方法到各种实践和应用用途。最后，讨论了场地和设施设计，即如何将安全原则应用于设施设计以及通过多种解决方案的应用。\n"
- "# DOMAIN 4\n## Communication and Network Security\n\n**作为一名 CISSP，YOU** 应彻底了解网络基础和安全网络设计原则。在本章中，我们将研究与信息安全相关的计算网络、互连、网络设备和通信过程的各个方面。我们详细介绍了常见的网络协议、服务和模型，并介绍了与安全网络架构和安全通信通道相关的各种设计原则。\n\
  \n### ASSESS AND IMPLEMENT SECURE DESIGN PRINCIPLES IN NETWORK ARCHITECTURES\n\n\
  对网络原则和概念的扎实理解对于创建和管理安全网络架构至关重要。本节介绍了构成设计安全网络架构基础的关键模型、协议和网络拓扑。\n\n请记住，有许多不同类型的网络：\n\
  \n*   **Local area network (LAN):** *local area network* 是一个在单一本地化网络上通信的设备组，通常（但不总是）在同一建筑物内。办公室网络是\
  \ LAN 的常见示例。\n*   **Metropolitan area network (MAN):** *metropolitan area network*\
  \ 是在整个城市范围内连接多个 LAN。示例是城市范围的 Wi-Fi 网络。\n*   **Wide area network (WAN):** *wide area\
  \ network* 是一个覆盖范围比 LAN 更广的更大网络，通常比大多数 MAN 更大。互联网是最常用、最大的 WAN。\n*   **Personal area\
  \ network (PAN):** *personal area network* 连接彼此之间距离很近的设备（通常在 10 码以内）。蓝牙网络是 PAN 的常见示例。\n\
  *   **Internet:** *internet* 是一个全球互联的 WAN，使人们、系统和实体能够在广阔的地理区域内共享信息和通信。\n*   **Intranet:**\
  \ *intranet* 是一个本地或受限网络，使用户能够在其组织内部存储和共享信息。\n*   **Extranet:** *extranet* 是一个面向外部的网络门户，允许组织与供应商、客户和其他外部方共享选定信息。\n\
  \n\n\n\n\n直接影响网络架构的两个安全原则是分层和域分离。`Layering` 涉及以越来越抽象的术语设计事物，每一层都提供某种安全或保证方面的功能。在主机通过网络通信的上下文中，开放系统互连（OSI）模型是普遍的示例。OSI\
  \ 模型是不断增加抽象的模型，每一层都为确保安全提供了不同的方法。\n\n域分离作为一种架构原则，适用于安全网络设计。在冲突域中分离网络流量有助于避免网络拥塞。将网络流量分离到广播域中，进一步阻止对手嗅探网络拓扑的有价值线索。更进一步，将网络划分为段可将本地网络流量与跨路由传输隔离。这再次降低了潜在对手了解网络设计的风险。\n\
  \n作为一名 CISSP，你必须理解一系列相关主题，以在网络架构中充分实施安全设计原则。\n\n你必须详细了解 OSI 模型，并且还必须了解传输控制协议（TCP）和互联网协议（IP）各自如何工作。另一个重要主题是多层协议，其中多个协议组成一个组，分布在多个\
  \ OSI 层中。相比之下，融合协议涉及一种专用协议，该协议与常用协议一起分组。\n\n除了协议之外，网络概念也很重要，从虚拟化网络的好处开始，称为 `software-defined\
  \ networking`（SDN）。无线网络也很重要，包括其安全影响。除无线网络之外，还有根据控制区域定义的网络的公认划分，包括内联网、外部网和互联网。如果内联网的一部分面向公众且在互联网和完全受保护的内联网之间部分受控，则该部分是\
  \ `demilitarized zone`（DMZ）。最后，虚拟局域网（VLAN）的概念至关重要，因为 VLAN 形成隔离的广播区域以分割网络。本节及其子节将检查所有这些主题。\n\
  \n### 开放系统互连和传输控制协议/互联网协议模型\n\nOSI 和 TCP/IP 模型通过使用分层方法（参见 `layering` 的先前定义）定义并设定网络通信和互操作性的标准。使用这些分层模型使网络架构师和安全专业人员能够将复杂网络划分为更简单的功能组件，从而更容易进行架构和保护。\n\
  \n我们使用网络模型来降低复杂性、标准化接口、帮助理解、促进快速产品开发、支持互操作性并促进模块化工程。这样，一系列复杂且地理分散的网络可以安全且相对无缝地互连。主要的网络模型\
  \ TCP/IP 和 OSI 支持互操作性，并在存在竞争的供应商或供应商产品线的情况下减少专有不兼容。请记住，这些模型是指南，而不是要求。供应商之间仍可能存在一些差异。\n\
  \n### OSI 参考模型\n\nOSI 参考模型是一个概念模型，由七层组成，描述信息如何在网络上从一个计算资产流向另一个计算资产。OSI 模型的每一层都执行或促进特定的网络功能。这里按数字顺序列出各层，但你也可能看到它们从上到下排列（层\
  \ 1 在底部）：\n* Layer 1: Physical\n* Layer 2: Data Link\n* Layer 3: Network\n* Layer\
  \ 4: Transport\n* Layer 5: Session\n* Layer 6: Presentation\n* Layer 7: Application\n\
  \n各层的具体描述在以下子节中更详细地介绍。OSI 模型定义于 ISO/IEC 7498-1，是国际标准化组织（ISO）研究和合作的产物。由于该标准已被证明可靠，因此共识是\
  \ OSI 是网络和通信中的主要架构模型。因此，许多网络概念和技术直接参考 OSI 及其各个层。\n\nFigure 4.1 详细说明了 OSI 参考模型的七层，采用“自下而上”视图（层\
  \ 1 在底部）。\n\n![FIGURE 4.1 The OSI reference model](img/c04f001.png)\n\n**FIGURE\
  \ 4.1 The OSI reference model**\n\n#### Layer 1: Physical Layer\n\n物理层负责通过传输介质（例如网络电缆或无线链路）从一个设备到另一个设备传输和接收原始数据。该层将数字位转换为可在给定传输介质上传输的电信号（或其他形式的能量）。\n\
  \n如前所述，物理层负责通过连接网络中设备的物理链路传输原始位，而不是逻辑数据包。物理层规范涉及电信号、光信号（光纤、激光）、电磁波（无线网络）或声音。一些常见的物理层实现是\
  \ Ethernet、Bluetooth 和 USB。有关物理层组件的更多介绍，请参阅本章后面的“传输介质”部分。\n\n物理网络拓扑也在本层定义。计算机网络的\
  \ `physical topology` 是各种节点及其连接的结构和排列，表现为节点之间的链路。物理拓扑并不总是与 `logical topology` 相同，后者描述数据如何在网络中流动。有四种基本的物理网络拓扑：环形、总线、星形和网状。它们将在本章后面的“网络拓扑”部分中讨论。\n\
  \n##### Layer 1 Attack Vectors\n\n物理层攻击是试图渗透设备和连接介质或干扰其操作的尝试。这可能包括被动嗅探，无论是通过电缆还是无线，造成过度的电气干扰，或简单地切断电缆。有关嗅探和干扰等攻击的技术细节将在本章后面讨论。然而，在物理层，可能导致破坏或拒绝服务的攻击比比皆是。\n\
  \n#### Layer 2: Data Link Layer\n\n数据链路层是 OSI 模型的第二层，它在物理链路上在网络节点之间传输数据。该层在传输前将位编码为数据包，然后将数据包解码回位。数据链路层是网络规范协议建立的地方。具体来说，设备如何连接，例如总线或环形拓扑，是在本层设置的。数据链路提供可靠性，因为它建立了同步、错误控制、警报和流量控制的能力。这些服务很重要，因为如果传输或数据包排序失败，错误和警报有助于快速纠正问题。数据链路层的流量控制至关重要，以便设备以可管理的速率发送和接收数据流。\n\
  \n根据电气和电子工程师学会（IEEE）根据 IEEE 802 系列规范的规定，数据链路层有两个子层。这些是逻辑链路控制（LLC）和媒体访问控制（MAC）。\n\
  \nLLC 控制数据包同步、流量控制和错误检查。该上层子层在下方的 MAC 子层和上方的网络层（第 3 层）之间提供接口。LLC 促进节点到节点的流量控制和错误管理，例如自动重传请求（ARQ）。\n\
  \n\n\n\n\nMAC 子层是上层 LLC 与下层物理层（第 1 层）之间的接口。MAC 子层负责控制网络上的设备如何获得传输数据的权限。MAC 提供寻址机制和信道访问，以便网络上的节点相互通信。MAC\
  \ 寻址工作在数据链路层（第 2 层）。它与 IP 寻址类似，只是 IP 寻址适用于网络层（第 3 层）执行的网络和路由。MAC 寻址通常被称为 `physical\
  \ addressing`，而 IP 寻址（在网络层执行）被称为 `logical addressing`。网络层寻址将在下一节中讨论。\n\nMAC 地址是唯一且特定于每个计算设备的。它是一个\
  \ 12 位十六进制数字，长 48 位。常见的 MAC 地址格式有两种，MM:MM:MM:SS:SS:SS 和 MM-MM-MM-SS-SS-SS。MAC 地址的第一半部分，称为\
  \ `prefix`，包含适配器制造商的 ID 号。这些 ID 由 IEEE 监管。例如，前缀 00:13:10、00:25:9C 和 68:7F:74（以及许多其他）都属于\
  \ Linksys（Cisco Systems）。MAC 地址的第二半部分代表制造商分配给适配器的序列号。来自不同制造商的设备可能具有相同的设备部分，即最右边的\
  \ 24 位数字。前缀会不同以实现唯一性。\n\n## Layer 2 Attack Vectors\n\n数据链路层特有的攻击向量示例包括伪造 MAC 地址，也称为\
  \ `Address Resolution Protocol (ARP) spoofing`。通过伪造 ARP 请求或回复，攻击者可以欺骗数据链路层交换，将 intended\
  \ for 合法主机的网络流量重定向到攻击者的机器。ARP 欺骗也是中间人（MITM）攻击和会话劫持攻击的常见前奏。\n\n## Layer 3: Network\
  \ Layer\n\n网络层提供路由和其他功能，使数据包能够从一个节点发送到另一个节点，无论是在同一网络内还是在互连网络之间。网络层从传输层接收服务请求，并向数据链路层发出服务请求。网络层功能包括逻辑连接建立、数据转发、路由、数据包分片和交付错误报告。\n\
  \n在此层，需要对设备的逻辑寻址来构建跨网络和网络之间的流量流；逻辑寻址，也许更熟悉为 IP 地址，是网络层概念。IP 地址将在即将到来的题为“Internet\
  \ Protocol Networking”的部分中详细讨论。\n\n网络层协议有面向连接和无连接两种。在面向连接协议中，在数据传输开始之前，先在两个设备之间建立逻辑连接。面向连接协议也存在于\
  \ OSI 模型的更高层。在无连接协议中，只要设备有数据要发送给另一个设备，它就直接发送。\n\n网络层的主要职责是在网络中路由流量。路由协议指定路由器如何在网络上相互通信，而路由协议用于将数据从一个网络发送到另一个网络。简而言之，路由协议在网络间传输路由协议消息。路由协议学习路由协议的路由（或路径），并用于在这些路由（路径）上传输数据包。\n\
  \n在网络层定义了几种路由协议：Border Gateway Protocol（BGP），一种互联网域间路由协议；Open Shortest Path First（OSPF），一种为\
  \ TCP/IP 网络开发的链路状态、内部网关协议；以及 Routing Information Protocol（RIP），一种使用跳数作为度量的互联网路由协议。逻辑寻址通过\
  \ Internet Protocol（IP）和 Internetwork Packet Exchange（IPX）等路由协议在此层实现。\n\n在网络层发生了一些值得注意的功能：\n\
  \n*   **Internet Protocol (IP):** IP 是一组用于在网络上寻址和路由数据的要求，包括互联网。\n*   **Addressing:**\
  \ IP 促进数据从主机到目标 IP 地址的传输，遍历网络直到找到并到达目标地址。\n*   **Host addressing:** 每个主机都有一个唯一地址以提供其在互联网上的逻辑位置。该地址是\
  \ IP 地址。\n*   **Message forwarding:** 网关或路由器是网络上的专用设备或主机，用于在跨 WAN 分段、分区或互连的网络之间转发数据。\n\
  *   **Fragmentation:** 数据包大小可能很大且复杂。网络层促进将数据包细分为可管理或允许的大小，而不会丢失数据完整性。\n*   **Internet\
  \ Protocol Security (IPSec):** 当实施时，使用虚拟专用网络（VPN）和加密的安全通信可通过这组为 IP 提供安全性的协议实现。IPSec\
  \ 将在下一节“Internet Protocol Networking”中进一步讨论。\n\n一系列协议在网络层运行。BGP 为互联网的路由提供了大部分骨干。RIP（前面也提到过）是一种早期协议，偶尔仍在使用。OSPF\
  \ 是一种快速、可扩展的协议，用于大型企业网络。Internet Control Message Protocol（ICMP）用于故障排除和错误控制目的。Internet\
  \ Group Management Protocol（IGMP）用于同时向多个接收者传输消息。以下各节更详细地研究这些协议如何在网络层工作。\n\n### Border\
  \ Gateway Protocol\n\n`autonomous system`（AS）是由单个实体或组织管理或控制的大型网络或网络组。BGP 是一种在不同\
  \ AS 之间使用的路径向量路由协议。它是所有路由协议中最普遍和可扩展的，因为它是全球互联网和服务提供商的私有网络的路由协议。当 BGP 在自治系统之间运行（例如在互联网服务提供商或\
  \ ISP 之间）时，称为外部 BGP（eBGP）。当它在单个自治系统内运行（例如在大型私有网络内）时，称为内部 BGP（iBGP）。\n\nBGP 通过在互联网上导航最少的\
  \ AS 数量来选择最短路径。路径存储在路由信息库（RIB）中。每个目的地的路由表中只存储一条路由，但 RIB 知道通往目的地的多条路径。每个路由器确定从 RIB\
  \ 存储哪些路由，RIB 跟踪可能的路由。当路由被删除时，RIB 会静默地删除它们，而不会通知对等体。RIB 条目永远不会超时。\n\nBGP 最初设计为仅携带互联网可达性信息，但其功能已扩展到携带多播、IPv6、VPN\
  \ 和各种其他数据的路由。\n\n确定最佳路径的任务中存在固有的漏洞。漏洞在于一个地区的网络可能会对远在该地区之外的流量的路径产生负面影响。对控制其边界内网络流量的国家来说，这种漏洞被利用了。2018\
  \ 年中国和俄罗斯发生的一个例子中，两国都滥用了 BGP 的运行方式，将流量重定向远离其边界并通过其边界。西方国家经历了几分钟的可用性中断，而核心互联网路由器在冲突消息和收敛路径更新中苦苦挣扎。\n\
  \n### Routing Information Protocol Versions 1 and 2\n\n\n\n\n\n分配逻辑地址（即 IP 地址）给网络需要一种机制来告知路由器哪些网络是直接或间接可访问的。过去，路由表中的手动条目创建了静态路由，迫使两地之间的流量沿指定路径传输。随着更多网络的加入，高效维护这些表需要采用基于标准的协议来自动共享此信息。路由协议的演进反映了互联网的增长，以应对范围和日益复杂的互联基础设施。\n\
  \n## 路由信息协议（RIP）\n\n`Routing Information Protocol (RIP)` 是最早的路由协议之一，也是第一个使用距离向量路由方法的协议。`RIP`\
  \ 使用信号沿网络路径经过的跳数。`RIP` 允许最多 15 跳，在第 16 跳时，距离被视为无限且目标不可达。此限制限制了 `RIP` 可支持的网络规模，但也是\
  \ `RIP` 防止路由环路的原因（路由环路发生在数据包不断通过同一路由器反复路由）。除了跳数外，`RIP` 还实现了水平分割、路由中毒和保持计时器以防止路由环路。\n\
  \n* **水平分割：** 此路由配置可防止路由被通告回其来源的方向。\n* **路由中毒：** 当路由器检测到其连接的某条路由失败时，路由器将失败路由的跳数设置为\
  \ 16，从而将该路由设为不可达。\n* **保持计时器：** 当路由器收到某条路由不好的信息时，它会建立一个保持期，在此期间路由器既不会通告该路由也不会接受关于该路由的通告。\n\
  \n`RIP` 路由器每 30 秒传输一次完整更新。当该技术诞生时，这并不被认为是个问题。随着时间的推移，网络上路由设备的数量增加，造成了流量突发高峰的潜在风险。理论是随机部署新设备有助于随时间推移使流量流向正常化。\n\
  \n由于收敛时间和可扩展性问题普遍存在，`RIP` 在大多数网络环境中并非首选。然而，由于 `RIP` 得到广泛支持、配置简单且不需要任何参数，不像其他协议，`RIP`\
  \ 在较小的网络中仍是一个潜在选择。\n\n`RIP` 使用 `User Datagram Protocol (UDP)` 作为其传输协议，并被分配保留端口号\
  \ 520。\n\n### 开放最短路径优先版本 1 和 2\n\n`OSPF` 协议在大型企业网络中很常见，因为它提供快速收敛和可扩展性。收敛是指路由表如何更新。`OSPF`\
  \ 是一种链路状态协议，具体来说是互联网工程任务组（IETF）标准化的内部网关协议（IGPs）之一。链路状态协议从附近的路由设备收集信息并创建网络拓扑，使协议非常高效。`OSPF`\
  \ 监控拓扑，并在检测到变化时自动重新路由拓扑。几秒钟内，`OSPF` 能够从链路故障中重新路由并创建无环路由。\n\n`OSPF` 支持 Internet 协议版本\
  \ 4 (`IPv4`) 和 `IPv6` 网络。`IPv6` 的更新被指定为 `OSPF` 版本 3。`OSPF` 计算流量负载并寻求在路由之间平衡负载。为此，包含多个变量，例如路由器的往返距离（以时间为单位）、链路的数据吞吐量，或链路可用性和可靠性。`OSPF`\
  \ 将数据直接封装在协议号为 89 的 IP 数据包中。它不使用 `UDP` 或 `TCP` 等传输协议。\n\n### 互联网控制报文协议\n\n`ICMP`\
  \ 消息有三个字段区分 `ICMP` 数据包的类型和代码，且这些值在传输过程中头部中永不改变。随后是 `ICMP` 特定信息，然后是原始 IP 头部信息。`ICMP`\
  \ 流量的最常见用途是手动故障排除（`ping` 实用程序）和网络诊断（`traceroute` 实用程序）以及 IP 传输期间系统生成的错误消息。\n\n`ICMP`\
  \ 信息用于在 IP 传输出现错误时进行故障排除和控制目的。在 `ICMP` 实用程序中，每个设备转发一个 IP 数据包，随后可以向源地址发送 `ICMP` 消息。例如，使用\
  \ `ping` 和 `traceroute`，源 IP 地址可以确定几个有用的网络映射消息，例如目标不可达、回显请求和应答（`Ping`）、重定向、时间超过，以及路由器通告和路由器请求。所有这些在安全人员的日常操作中都很重要。\n\
  \n`Ping` 和 `traceroute` 也可被攻击者用来识别主机位置（`ping`），以及出于恶意目的映射网络以进行各种未来攻击（`traceroute`）。\n\
  \n### 互联网组管理协议\n\n`IGMP` 在网络层运行，但特定于组内的主机或路由器。`IGMP` 是执行 IP 组播传输所必需的关键协议。当应用程序需要执行一对多传输时，组播变得有用，例如\
  \ CEO 向其员工进行视频组播。很可能，对 `IGMP` 的攻击始于对使用 `IGMP` 的组播路由软件或硬件设备本身的攻击。\n\n#### 第三层攻击向量\n\
  \n网络层攻击通常特定于网络流量如何被路由。`MITM` 攻击，即流量被重定向到恶意行为者，是网络层攻击的一个例子。网络地址的伪造或伪造是另一种常见的网络层攻击形式。假设攻击者可以访问资源，执行最简单的攻击可能是拒绝服务（`DoS`）攻击，即简单地使目标资源不堪重负。\n\
  \n## 第四层：传输层\n\n传输层负责提供可靠的数据传输和端到端传输控制。该层协议提供主机到主机的通信服务，并管理数据包从一个主机到另一个主机的传输，跨越网络。传输层为上层（第\
  \ 5 层至第 7 层）提供标准化访问，使其无需关心下层（第 1 层至第 3 层）的细节。\n\n在传输层发生的某些功能是流量控制、多路复用、虚电路管理，以及错误检查和恢复。\n\
  \n* 流量控制管理数据传输，防止发送设备使接收设备的处理能力不堪重负。\n* 多路复用允许多个应用程序沿单一物理链路传输数据。\n* 虚电路由传输层建立、维护和终止。\n\
  * 错误检查涉及创建各种检测传输错误的机制。\n* 错误恢复解决诸如请求重传数据之类的错误。\n\n每个安全专业人员必须熟悉的两个主要传输层协议是：`TCP`\
  \ 和 `UDP`。\n\n### 传输控制协议\n\n`TCP` 是一种面向连接的协议，这意味着通信设备必须在传输任何数据（并且可能丢失）之前建立可靠的连接；数据传输完成后还必须关闭该连接。`TCP`\
  \ 通过三次握手建立连接。 Figure 4.2 说明了典型的三次握手过程。\n\n除了面向连接之外，`TCP` 还通过流量控制和数据确认提供广泛的错误检查机制。该协议强制执行数据排序，使得数据包以发送设备发送的顺序到达接收主机，并且支持在数据包丢失时进行数据包重传。\n\
  \n\n\n\n\n![FIGURE 4.2 TCP three-way handshake](img/c04f002.png)\n\n**FIGURE 4.2\
  \ TCP three-way handshake**\n\nTCP 的面向连接特性使其成为一种可靠的协议，因为它通过确认数据包、检查丢失或损坏的数据包，并在必要时请求重传来保证交付。由于与三次握手、确认数据包以及错误检查和纠正相关的额外开销，TCP\
  \ 通常比无连接协议如 UDP 更慢。TCP 被超文本传输协议（HTTP）、超文本传输协议安全（HTTPS）和文件传输协议（FTP）以及其他需要可靠数据传输和广泛错误检查的协议所使用。\n\
  \n### User Datagram Protocol\n\n与 TCP 相比，UDP 是一种无连接协议。建立连接、维护连接或终止连接时没有开销，这使得 UDP\
  \ 比 TCP 更简单、更快、更高效。\n\nUDP 通常被称为“尽力而为”通信协议。它不提供 TCP 的任何功能——没有错误检测或纠正，没有排序，没有流量控制机制——也不使用预先建立的会话。简而言之，UDP\
  \ 被认为是一种不可靠的协议，这对于某些应用来说是可以接受的。该协议的低开销允许快速数据传输，这对于实时音频和视频流来说是理想的，在这种情况下，速度比确保每个数据包完美到达更重要。UDP\
  \ 也常被域名系统（DNS）、动态主机控制协议（DHCP）、简单网络管理协议（SNMP）和语音 over IP（VoIP）等应用所使用。物联网（IoT）技术的持续兴起也导致\
  \ UDP 使用量的增加，因为传感器数据通常非常适合通过 UDP 而非 TCP 发送。\n\n### Layer 4 Attack Vectors\n\n特有的传输层攻击向量包括利用\
  \ TCP 和 UDP 的攻击。一个具体例子是 SYN 洪水攻击，它通过持续发起基于 TCP 的连接但不允许其完成来耗尽目标的网络内存资源；这会造成 DoS，从而阻止合法连接目标。特洛伊木马和其他恶意软件也倾向于针对特定的\
  \ TCP 和 UDP 端口。会话劫持是另一种常见的攻击，可以在第 4 层（以及其他层）运行。\n\n## Layer 5: Session Layer\n\n\
  会话层促进网络上系统之间的逻辑、持久连接。该层控制本地应用程序与远程应用程序之间的对话（连接）。会话层负责在终端用户应用程序进程之间高效、有效地建立、协调和终止会话。\n\
  \n会话层通常在应用远程过程调用（RPC）来处理应用程序之间发生的请求和响应的应用中实现。RPC 是应用程序环境在各种网络设备上的应用程序之间进行服务请求和服务响应的机制。换句话说，RPC\
  \ 允许在客户端上创建过程（任务或指令序列）并在服务器设备上执行——会话层管理此过程。\n\n建立会话时可选择三种主要操作模式：\n\n* **Full-duplex\
  \ mode:** 这是在两个设备之间的连接上同时双向发送数据的情况。全双工通道可以构建为一对单工链路，也可以利用一个设计用于允许双向同时传输的通道。如果多个设备需要使用全双工模式连接，则需要许多单独的链路，因为一个全双工链路只能连接两个设备。\n\
  * **Half-duplex mode:** 半双工具有双向发送数据的能力，但一次只能在一个方向上发送。虽然这看起来像是相对于全双工能力的下降，但它在同轴电缆、射频和以太网等单一网络介质上被广泛使用并取得成功。例如，通信在设备轮流发送和接收时效果良好。\n\
  * **Simplex mode:** 这种模式涉及使用作为单向街道运行的通信通道。单工构造的示例是光纤运行或网络电缆作为单股发送数据，而另一个单独的通道接收数据。\n\
  \n### Layer 5 Attack Vectors\n\n什么类型的攻击针对会话层？该层和表示层并不是常见攻击的热门目标。路由或基于数据包的攻击（OSI\
  \ 模型中较低层）和应用层攻击（OSI 模型中较高层）为攻击者提供了“低垂的果实”，使会话层和表示层处于识别漏洞的尴尬抽象层级。尽管如此，鉴于该层的功能，你可以假设一种攻击，即在网络上建立会话的身份验证被破坏。还有特定的会话层协议，例如\
  \ NetBIOS 和网络文件系统（NFS），可能容易受到 DoS 和 root 权限攻击，例如。已弃用的安全套接层（SSL）协议和不太安全的传输层安全（TLS）版本中的弱点也是会话层的首要目标。\n\
  \n## Layer 6: Presentation Layer\n\n表示层的作用是在较低层和应用层之间转换数据。在较低层，数据作为数据报和数据包发送。表示层是\
  \ OSI 模型中数据结构和表示首次显现的第一层，因为该层负责对要呈现给应用层的数据应用编码和转换功能。\n\n以下是该层编码和转换的一些示例：\n\n* 常见的数据表示格式，例如使用标准图像、声音和视频格式\n\
  * 常见的数据压缩方案，例如 JPEG 和 MPEG\n* 常见的数据加密和解密方案\n\n这些功能使不同类型的计算机系统之间能够交换应用数据。简而言之，表示层确保格式按需转换并呈现给应用层。\n\
  \n### Layer 6 Attack Vectors\n\n该层最常见的攻击涉及对加密方案本身的攻击。密码学和密码分析攻击在 Chapter 3，“Security\
  \ Architecture and Engineering” 中有所介绍。\n\n## Layer 7: Application Layer\n\n应用层是\
  \ OSI 模型的最高层，也是离最终用户最近的层。该层为软件应用程序提供网络访问并为用户提供接口。软件应用程序并不驻留在应用层。相反，该层通过较低层促进通信，以与网络连接另一端的应用程序建立连接。Web\
  \ 浏览器（例如 Chrome、Safari、Firefox）、HTTP、FTP 和 Telnet 都依赖应用层正常运行。\n\n### Layer 7 Attack\
  \ Vectors\n\n特定于应用层的攻击向量差异很大，大多数安全漏洞都发生在这一层。为列出开始，考虑应用层协议的弱点，例如 HTTP、FTP、简单邮件传输协议（SMTP）和\
  \ SNMP。用户界面上的每一次攻击都属于此类，以及基于 Web 的攻击，例如 HTTP 泛洪或输入验证攻击。SQL 注入和跨站脚本（XSS）是运行在应用层最常见的攻击之一。\n\
  \n\n\n\n\n在应用层，服务支持用户应用程序，用户身份验证在此进行。除了这些攻击向量之外，身份验证弱点（例如弱密码或管理不善的密码）也在该 OSI 层提供了关键的攻击向量。\n\
  \n### TCP/IP 参考模型\n\nTCP/IP 参考模型是一个四层概念模型，最初由美国国防高级研究计划局（DARPA）在 1960 年代开发。TCP/IP\
  \ 模型的四个层是应用层、传输层、互联网层和链路层（或网络访问层），如图 Figure 4.3 所示。\n\n![FIGURE 4.3 The TCP/IP reference\
  \ model](img/c04f003.png)\n\n**FIGURE 4.3 The TCP/IP reference model**\n\nTCP/IP\
  \ 模型中的每一层都对应于七层 OSI 模型中的一个或多个层。有关比较，请参阅 Figure 4.4。\n\n![FIGURE 4.4 Comparison of\
  \ the OSI and TCP/IP models](img/c04f004.png)\n\n**FIGURE 4.4 Comparison of the\
  \ OSI and TCP/IP models**\n\n#### Link (or Network Access) Layer\n\n链路层被称为其他几个名称，包括网络访问层或数据链路层（事实上，TCP/IP\
  \ 模型的链路层包含与 OSI 模型的数据链路层相同的一些功能）。将其视为主机系统与网络硬件之间的物理接口。该层的作用是以可靠的方式在网络传输通道上促进 TCP/IP\
  \ 数据包。该层可以检测传输错误。该层确定常见的链路标准（如 IEEE 802.2 和 X.25）如何格式化数据包以进行传输和路由。TCP/IP 的设计方式允许数据格式独立于网络访问方法、帧格式和建立\
  \ TCP/IP 以跨不同或不同网络互连的介质。这种对任何特定网络技术的独立性使得 TCP/IP 和 OSI 7 层模型都能够扩展到像异步传输模式（ATM）这样更新的网络技术。\n\
  \n链路层提供的有几个重要服务：\n\n* **Data frame:** 这是从发送方发送的比特或符号的定义序列，接收方用它来在接收到的其他比特或符号的整体流中找到有效载荷数据的开始和结束。\n\
  * **Checksums:** 数据在数据帧内使用，以管理数据的完整性并使接收方知道数据帧已无错误接收。\n* **Acknowledgment:** 这使得数据传输具有可靠性，因为在数据接收时发出积极确认。当预期数据但未接收到时，会收到超时通知或否定确认。\n\
  * **Flow control:** 为了保持流量并避免因拥塞而产生的错误，链路层支持缓冲数据传输以调节快速发送方与慢速发送方。\n\n#### Internet\
  \ Layer\n\n使用 `IP`、`ARP`、`ICMP` 和 `IGMP` 等核心协议，互联网层负责数据包的寻址、打包和路由功能。与链路层不同，互联网层不利用数据排序和确认服务。\n\
  \n互联网层执行几个宝贵的功能。为了将数据包从主机传输到主机，`IP` 选择下一个跳或网关，将传出数据包跨链路层发送。如果数据满足传输参数，则将传入数据包的数据传输到传输层。为此，互联网层有助于错误检测和诊断功能，以便数据不会出错传输。\n\
  \n这些是驻留在该层的主要协议：\n\n* `IP` 是负责寻址、路由以及数据包的分段和重组的首要可路由通信协议。\n* `ARP` 从给定的 IP 地址解析主机的硬件地址。\n\
  * `ICMP` 提供诊断功能和错误报告，当数据包交付不成功时。\n\n#### Transport Layer\n\n在传输层，为应用层提供会话和数据报通信服务。你也可能听到该层被称为\
  \ *主机到主机传输层*。在 TCP/IP 模型中，传输层不使用链路层的特性。它假设链路层是不可靠的连接。因此，在传输层，会话建立、数据包确认和数据排序得以实现，以实现可靠通信。传输层核心协议是\
  \ `TCP` 和 `UDP`，两者都在 OSI 7 模型的“第 4 层：传输层”部分中讨论过。\n\n#### Application Layer\n\n为了使应用程序能够访问\
  \ TCP/IP 模型其他层提供的服务，应用层定义了应用程序使用的[content]\n\n在应用层，服务支持用户应用程序，用户身份验证在此进行。除了这些攻击向量之外，身份验证弱点（例如弱密码或管理不善的密码）也在该\
  \ OSI 层提供了关键的攻击向量。\n\n### TCP/IP 参考模型\n\nTCP/IP 参考模型是一个四层概念模型，最初由美国国防高级研究计划局（DARPA）在\
